<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Deutsch Daily — __DATE__</title>
<style>
  :root {
    --bg: #eef2f0;
    --surface: #ffffff;
    --surface-2: #f7f9f8;
    --ink: #172127;
    --ink-soft: #647077;
    --line: #dce4e1;
    --accent: #176b72;
    --accent-strong: #0d5057;
    --accent-soft: #dceeed;
    --warm: #d98f39;
    --warm-soft: #fff0d9;
    --zh: #5f696f;
    --danger: #b3493f;
    --shadow: 0 18px 50px rgba(20, 46, 47, .10);
    --shadow-soft: 0 8px 24px rgba(20, 46, 47, .07);
  }
  [data-theme="dark"] {
    --bg: #111719; --surface: #192124; --surface-2: #202a2d;
    --ink: #edf3f1; --ink-soft: #a9b7b8; --line: #344145;
    --accent: #75cbd0; --accent-strong: #99dfe2; --accent-soft: #223e40;
    --warm: #f0b35e; --warm-soft: #3b3022; --zh: #bac5c5;
    --shadow: 0 18px 50px rgba(0,0,0,.28); --shadow-soft: 0 8px 24px rgba(0,0,0,.22);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { scroll-behavior: smooth; scroll-padding-top: 90px; }
  body {
    min-height: 100vh; background: var(--bg); color: var(--ink);
    font: 16px/1.65 Inter, ui-sans-serif, system-ui, -apple-system, "Noto Sans SC", sans-serif;
    transition: background .2s, color .2s;
  }
  button, input, textarea { font: inherit; }
  button, a { -webkit-tap-highlight-color: transparent; }
  button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible {
    outline: 3px solid color-mix(in srgb, var(--accent) 35%, transparent); outline-offset: 2px;
  }
  .app { width: min(1280px, calc(100% - 48px)); margin: 0 auto; padding: 24px 0 100px; }
  .topbar {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    min-height: 42px; margin-bottom: 34px;
  }
  .brand {
    display: inline-flex; align-items: center; gap: 10px; color: var(--ink);
    font-weight: 800; letter-spacing: -.02em; text-decoration: none;
  }
  .brand-mark {
    display: grid; place-items: center; width: 30px; height: 30px; border-radius: 9px;
    background: var(--accent); color: #fff; font: 800 12px/1 ui-monospace, monospace;
  }
  .top-actions { display: flex; align-items: center; gap: 8px; }
  .icon-btn, .archive-link, .text-btn {
    min-height: 38px; border: 1px solid var(--line); border-radius: 12px;
    background: var(--surface); color: var(--ink-soft); cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; text-decoration: none;
  }
  .icon-btn { width: 38px; }
  .archive-link, .text-btn { gap: 7px; padding: 0 13px; font-size: 13px; font-weight: 700; }
  .hero { margin-bottom: 26px; }
  .eyebrow {
    color: var(--accent); font-size: 12px; font-weight: 800; letter-spacing: .12em;
    text-transform: uppercase; margin-bottom: 9px;
  }
  .hero h1 {
    max-width: 720px; font: 750 clamp(29px, 4vw, 50px)/1.08 ui-serif, Georgia, serif;
    letter-spacing: -.04em;
  }
  .hero-meta { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 13px; color: var(--ink-soft); font-size: 14px; }
  .hero-meta span { display: inline-flex; align-items: center; gap: 7px; }

  .study-grid { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: clamp(20px, 3.2vw, 48px); align-items: start; }
  .side {
    position: sticky; top: 16px; max-height: calc(100vh - 24px);
    display: flex; flex-direction: column; min-height: 0;
  }
  .study-panel {
    display: flex; flex-direction: column; gap: 16px; min-height: 0; max-height: calc(100vh - 24px);
    background: transparent; border: 0; box-shadow: none; overflow: visible;
  }
  .video-card {
    position: relative; flex: 0 0 auto; overflow: hidden; background: #071012;
    border-radius: 24px; box-shadow: var(--shadow-soft);
  }
  .player { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #071012; }
  .player iframe, .player video { position: absolute; inset: 0; display: block; width: 100%; height: 100%; border: 0; background: #071012; }
  .video-drag {
    display: none; position: absolute; z-index: 3; top: 0; left: 0; right: 36px; height: 32px;
    cursor: grab; touch-action: none;
    background: linear-gradient(to bottom, rgba(0,0,0,.5), transparent);
  }
  .video-drag:active { cursor: grabbing; }
  .video-float-close {
    display: none; border: 0; background: rgba(255,255,255,.14); color: #fff;
    width: 28px; height: 28px; border-radius: 50%; cursor: pointer;
  }
  .rail {
    display: flex; flex-direction: column; flex: 1; min-height: 0;
    padding: 18px 18px 16px; border: 1px solid var(--line); border-radius: 24px;
    background: var(--surface); box-shadow: var(--shadow-soft); overflow: hidden;
  }
  .rail-bar { display: flex; align-items: center; gap: 8px; padding: 0 0 12px; }
  .controls { display: flex; gap: 6px; flex: 0 0 auto; }
  .controls button {
    min-height: 32px; padding: 0 14px; border: 1px solid var(--line); border-radius: 11px;
    background: var(--surface-2); color: var(--ink-soft); cursor: pointer; font-size: 13px; font-weight: 750;
  }
  .controls button.on { border-color: var(--accent); background: var(--accent); color: #fff; }
  .hero-meta a { color: var(--accent); text-decoration: none; font-weight: 700; }
  .hero-meta a:hover { text-decoration: underline; }
  .topic-nav { flex: 1; min-height: 0; overflow-y: auto; padding: 0; scrollbar-gutter: stable; }
  .topic { border-top: 1px solid var(--line); }
  .topic:first-child { border-top: 0; }
  .topic > a {
    display: grid; grid-template-columns: 32px minmax(0,1fr); gap: 10px; align-items: start;
    padding: 11px 0; color: var(--ink); text-decoration: none;
  }
  .topic > a span {
    min-width: 0; padding-top: 5px;
    font: 650 15px/1.35 ui-serif, Georgia, serif; letter-spacing: -.015em;
  }
  .topic > a:hover span { color: var(--accent); }
  .topic b {
    display: grid; place-items: center; width: 32px; height: 32px; border-radius: 10px;
    background: var(--accent-soft); color: var(--accent-strong);
    font: 800 11px/1 ui-monospace, monospace;
  }
  .topic.on b { background: var(--accent); color: #fff; }
  .topic.on > a span { color: var(--accent-strong); }
  .topic-study { display: none; padding: 0 0 12px; }
  .topic.on .topic-study { display: block; }
  .topic-study .empty-study { color: var(--ink-soft); font-size: 13px; padding: 6px 0; }
  .study-tabs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-top: 2px; }
  .study-tabs.n2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .study-tabs.n1 { grid-template-columns: 1fr; }
  .stab {
    min-height: 32px; padding: 0 6px; border: 1px solid var(--line); border-radius: 11px;
    background: var(--surface-2); color: var(--ink-soft); cursor: pointer;
    font-size: 12px; font-weight: 750;
  }
  .stab:hover { border-color: var(--accent); color: var(--accent-strong); }
  .stab.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-strong); }
  .spane { display: none; margin-top: 6px; }
  .spane.on { display: block; }
  .vrow {
    display: grid; grid-template-columns: minmax(0,1fr) 28px; gap: 8px; align-items: start;
    padding: 10px 0; border-top: 1px dashed var(--line);
  }
  .vrow .vw { color: var(--ink); font: 750 14.5px/1.35 ui-serif, Georgia, serif; }
  .vrow .vz { margin-top: 4px; color: var(--accent-strong); font-size: 13.5px; }
  .vrow .vex { margin-top: 6px; color: var(--ink-soft); font-size: 13px; font-style: italic; }
  .vadd {
    width: 28px; height: 28px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--surface); color: var(--accent-strong); cursor: pointer;
    font: 700 18px/1 ui-sans-serif, system-ui;
  }
  .vadd:hover { border-color: var(--accent); background: var(--accent-soft); }
  .rail-note { margin: 0; padding: 10px 0; color: var(--ink-soft); font-size: 13.5px; line-height: 1.7; }
  .rail-note + .rail-note { border-top: 1px dashed var(--line); }
  .rail-note strong { display: block; margin-bottom: 4px; color: var(--ink); font: 750 14.5px/1.35 ui-serif, Georgia, serif; }
  .rail-note i { display: block; margin-bottom: 6px; }
  @media (min-width: 841px) { .article-extras { display: none; } }

  .reader { min-width: 0; }
  .legend { color: var(--ink-soft); }
  article {
    scroll-margin-top: 24px; margin-bottom: 22px; padding: clamp(22px, 4vw, 38px);
    border: 1px solid var(--line); border-radius: 24px; background: var(--surface);
    box-shadow: var(--shadow-soft);
  }
  .n-head { display: grid; grid-template-columns: 42px minmax(0,1fr); gap: 13px; align-items: start; margin-bottom: 24px; }
  .n-idx {
    display: grid; place-items: center; width: 42px; height: 42px; border-radius: 13px;
    background: var(--accent-soft); color: var(--accent-strong); font: 800 13px/1 ui-monospace, monospace;
  }
  .n-head h2 { padding-top: 3px; font: 750 clamp(21px, 3vw, 28px)/1.25 ui-serif, Georgia, serif; letter-spacing: -.025em; }
  .para { margin-bottom: 23px; }
  .para:last-of-type { margin-bottom: 10px; }
  .de {
    font: var(--reader-size, 18.5px)/1.82 ui-serif, Georgia, "Noto Serif", serif;
    letter-spacing: .003em;
  }
  .de w {
    cursor: pointer; border-radius: 4px; transition: background .12s, color .12s;
    text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px;
    text-decoration-color: transparent;
  }
  .de w:hover, .de w:active { background: var(--warm-soft); text-decoration-color: var(--warm); }
  .de w.known { text-decoration-color: color-mix(in srgb, var(--accent) 55%, transparent); }
  .de w.ed { text-decoration-style: solid; text-decoration-thickness: 1.5px; }
  .de w.wiki { text-decoration-style: dotted; text-decoration-color: color-mix(in srgb, var(--ink-soft) 55%, transparent); }
  .de w.saved { color: var(--accent-strong); background: var(--accent-soft); text-decoration-color: transparent; }
  .para { display: grid; grid-template-columns: 52px minmax(0,1fr); gap: 10px; align-items: start; }
  .seek {
    margin-top: 4px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--surface-2); color: var(--accent-strong);
    padding: 4px 0; font: 750 11px/1 ui-monospace, monospace; cursor: pointer;
  }
  .seek:disabled { opacity: .35; cursor: default; }
  .para.now .de { background: color-mix(in srgb, var(--accent-soft) 70%, transparent); border-radius: 6px; }
  .zh {
    margin-top: 9px; padding: 10px 13px; border-left: 3px solid var(--warm);
    border-radius: 0 9px 9px 0; background: var(--surface-2); color: var(--zh);
    font-size: 14px; line-height: 1.72;
  }
  body.hide-zh .zh { display: none; }
  .article-extras details { margin-top: 10px; border: 1px solid var(--line); border-radius: 13px; background: var(--surface-2); }
  .article-extras details summary {
    list-style: none; cursor: pointer; padding: 12px 14px; color: var(--ink-soft);
    display: flex; align-items: center; gap: 9px; font-size: 13px; font-weight: 750;
  }
  .article-extras details summary::before {
    content: "+"; display: inline-grid; place-items: center; width: 20px; height: 20px;
    border-radius: 7px; background: var(--surface); color: var(--accent); font-size: 14px;
  }
  .article-extras details[open] summary::before { content: "−"; }
  .article-extras details summary::-webkit-details-marker { display: none; }
  .article-extras details .body { padding: 2px 14px 15px 43px; color: var(--ink-soft); font-size: 13.5px; line-height: 1.75; }
  .article-extras details .body strong { color: var(--ink); }
  .vcard { display: grid; grid-template-columns: minmax(0,1fr) 28px; gap: 8px; align-items: start; padding: 10px 0; border-bottom: 1px dashed var(--line); }
  .vcard:last-child { border-bottom: 0; }
  .gcard { padding: 12px 0; border-bottom: 1px dashed var(--line); }
  .gcard:last-child { border-bottom: 0; }
  .vcard-top, .gcard h4 { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px; font: 750 14.5px/1.35 ui-serif, Georgia, serif; color: var(--ink); }
  .article-extras .vadd {
    width: 28px; height: 28px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--surface); color: var(--accent-strong); cursor: pointer;
    font: 700 18px/1 ui-sans-serif, system-ui;
  }
  .vpos { color: var(--ink-soft); font: 750 11px/1.2 ui-sans-serif, system-ui; letter-spacing: .06em; text-transform: uppercase; }
  .vzh { margin-top: 4px; color: var(--accent-strong); font-size: 13.5px; }
  .vex, .gex { margin-top: 6px; color: var(--ink-soft); font-size: 13px; font-style: italic; }
  .gexzh { color: var(--zh); font-size: 12.5px; }
  .gmore { margin-top: 8px; color: var(--ink-soft); font-size: 13px; }
  .bg-note { margin: 0 0 8px; color: var(--ink-soft); font-size: 12px; }

  .scrim { position: fixed; inset: 0; z-index: 55; display: none; background: rgba(7,16,18,.48); backdrop-filter: blur(3px); }
  .scrim.on { display: block; }
  #pop {
    position: fixed; z-index: 70; display: none; width: min(360px, calc(100vw - 24px));
    border: 1px solid var(--line); border-radius: 18px; padding: 18px;
    background: var(--surface); color: var(--ink); box-shadow: var(--shadow);
  }
  #pop.open { display: block; }
  .pop-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  #pop .pw { font: 750 21px/1.2 ui-serif, Georgia, serif; word-break: break-word; }
  #pop .pp { margin-top: 3px; color: var(--ink-soft); font-size: 11px; font-weight: 750; letter-spacing: .08em; text-transform: uppercase; }
  #pop .pclose { border: 0; background: var(--surface-2); color: var(--ink-soft); width: 30px; height: 30px; border-radius: 9px; cursor: pointer; }
  #pop .pz { margin-top: 12px; color: var(--accent-strong); font-weight: 700; }
  #pop .pz:empty::after { content: "还没有释义，你可以自己补充"; color: var(--ink-soft); font-weight: 400; }
  #pop .pe { margin-top: 9px; padding-top: 9px; border-top: 1px solid var(--line); color: var(--ink-soft); font-size: 12.5px; font-style: italic; }
  .pop-actions { display: flex; gap: 8px; margin-top: 14px; }
  .pbtn, .secondary-btn, .primary-btn {
    min-height: 40px; border-radius: 11px; padding: 0 13px; cursor: pointer; font-size: 13px; font-weight: 750;
  }
  .pbtn { flex: 1; border: 1px solid var(--accent); background: var(--accent); color: #fff; }
  .pbtn.in { border-color: var(--line); background: var(--surface-2); color: var(--ink-soft); }
  .secondary-btn { border: 1px solid var(--line); background: var(--surface); color: var(--ink-soft); }
  .primary-btn { border: 1px solid var(--accent); background: var(--accent); color: #fff; }
  .word-form { display: grid; gap: 11px; }
  .word-form label { display: grid; gap: 5px; color: var(--ink-soft); font-size: 12px; font-weight: 700; }
  .word-form input, .word-form textarea {
    width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px;
    background: var(--surface-2); color: var(--ink); resize: vertical;
  }
  .word-form textarea { min-height: 66px; }
  .form-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 3px; }

  #basket-btn {
    position: fixed; right: 22px; bottom: max(22px, env(safe-area-inset-bottom)); z-index: 45;
    display: inline-flex; align-items: center; gap: 9px; min-height: 48px; padding: 0 18px;
    border: 0; border-radius: 15px; background: var(--ink); color: var(--surface);
    box-shadow: var(--shadow); cursor: pointer; font-weight: 800;
  }
  #basket-btn .cnt { min-width: 23px; padding: 2px 7px; border-radius: 99px; background: var(--warm); color: #172127; font-size: 12px; }
  #basket {
    position: fixed; inset: 0 0 0 auto; z-index: 65; width: min(440px, 100vw);
    display: flex; flex-direction: column; padding: 24px 24px calc(24px + env(safe-area-inset-bottom));
    background: var(--surface); box-shadow: -20px 0 60px rgba(7,16,18,.18);
    transform: translateX(105%); transition: transform .22s ease;
  }
  #basket.open { transform: translateX(0); }
  #basket .bhead { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 16px; }
  #basket .bhead h3 { font-size: 22px; letter-spacing: -.02em; }
  #basket .bhead p { margin-top: 2px; color: var(--ink-soft); font-size: 12.5px; }
  #basket .bclose { border: 0; background: var(--surface-2); color: var(--ink-soft); width: 36px; height: 36px; border-radius: 11px; font-size: 20px; cursor: pointer; }
  .basket-add { width: 100%; margin-bottom: 12px; }
  #basket .blist { overflow-y: auto; flex: 1; padding-right: 4px; }
  .bitem { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 5px 10px; padding: 13px 0; border-bottom: 1px solid var(--line); }
  .bitem .bw { font: 750 16px/1.3 ui-serif, Georgia, serif; }
  .bitem .bz { grid-column: 1; color: var(--accent-strong); font-size: 13px; }
  .bitem .be { grid-column: 1; overflow: hidden; color: var(--ink-soft); font-size: 11.5px; text-overflow: ellipsis; white-space: nowrap; }
  .bitem-actions { grid-column: 2; grid-row: 1 / span 3; align-self: center; display: flex; gap: 3px; }
  .bitem-actions button { border: 0; background: transparent; color: var(--ink-soft); padding: 7px; cursor: pointer; font-size: 12px; }
  .bitem-actions .bx { color: var(--danger); }
  #basket .bfoot { display: flex; gap: 8px; margin-top: 14px; }
  #basket .bfoot button { flex: 1; }
  #basket .bfoot button:disabled { opacity: .5; cursor: wait; }
  #basket .bstatus { min-height: 18px; margin-top: 8px; color: var(--ink-soft); text-align: center; font-size: 12px; }
  .bempty { padding: 42px 14px; color: var(--ink-soft); text-align: center; font-size: 13px; }
  .bempty b { display: block; margin-bottom: 5px; color: var(--ink); font-size: 15px; }
  #word-editor {
    display: none; padding: 15px; margin-bottom: 12px; border: 1px solid var(--line);
    border-radius: 14px; background: var(--surface-2);
  }
  #word-editor.open { display: block; }
  #toast {
    position: fixed; left: 50%; bottom: 28px; z-index: 90; display: none;
    transform: translateX(-50%); padding: 10px 16px; border-radius: 12px;
    background: var(--ink); color: var(--surface); box-shadow: var(--shadow); font-size: 13px; font-weight: 700;
  }
  @media (max-width: 840px) {
    .app { width: min(100% - 28px, 720px); padding-top: 15px; padding-left: max(14px, env(safe-area-inset-left)); padding-right: max(14px, env(safe-area-inset-right)); }
    .topbar { margin-bottom: 24px; }
    .study-grid { display: block; }
    .side { position: static; max-height: none; margin-bottom: 18px; }
    .study-panel { display: contents; max-height: none; }
    .video-card { border-radius: 20px; box-shadow: var(--shadow); }
    .rail {
      position: sticky; top: env(safe-area-inset-top); z-index: 30; margin: 10px 0 18px; padding: 8px 12px;
      border-radius: 20px;
    }
    .rail-bar { padding: 0; }
    .topic-nav { display: none; }
    .video-card.floating {
      position: fixed; z-index: 48; top: 72px; right: 10px; left: auto; width: min(48vw, 210px);
      border: 1px solid rgba(255,255,255,.2); border-radius: 14px; box-shadow: 0 18px 45px rgba(0,0,0,.28);
    }
    .video-card.floating .video-drag { display: block; }
    .video-card.floating .video-float-close { display: block; position: absolute; z-index: 4; top: 6px; right: 6px; }
    .video-card.float-off { display: none; }
    article { border-radius: 20px; }
  }
  @media (max-width: 560px) {
    .app { width: 100%; padding: 12px 12px 88px; padding-left: max(12px, env(safe-area-inset-left)); padding-right: max(12px, env(safe-area-inset-right)); }
    .brand span:last-child { display: none; }
    .text-btn { padding: 0 10px; font-size: 12px; }
    .archive-link { width: 38px; padding: 0; font-size: 0; }
    .archive-link svg { width: 17px; }
    .hero { padding: 0 5px; margin-bottom: 18px; }
    .hero h1 { font-size: 30px; }
    .hero-meta { gap: 5px 14px; font-size: 12.5px; }
    .video-card { border-radius: 18px; }
    .video-card.floating { width: min(56vw, 220px); }
    .controls { gap: 5px; }
    .controls button { min-height: 38px; font-size: 13px; }
    article { padding: 20px 17px; margin-bottom: 13px; border-radius: 18px; }
    .n-head { grid-template-columns: 34px minmax(0,1fr); gap: 10px; margin-bottom: 19px; }
    .n-idx { width: 34px; height: 34px; border-radius: 10px; font-size: 11px; }
    .n-head h2 { padding-top: 1px; font-size: 21px; }
    .de { font-size: var(--reader-size, 17.5px); line-height: 1.78; }
    .zh { font-size: 13.5px; }
    .article-extras details .body { padding-left: 14px; }
    .para { grid-template-columns: 44px minmax(0,1fr); gap: 8px; }
    #pop { left: 12px !important; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); top: auto !important; width: auto; }
    #basket-btn { right: max(14px, env(safe-area-inset-right)); bottom: max(14px, env(safe-area-inset-bottom)); min-height: 46px; }
    #basket { padding: 18px 17px calc(18px + env(safe-area-inset-bottom)); }
    #basket .bfoot { flex-direction: column; }
  }

<script>
const DATA = {"date": "2026-08-17", "video_page": "https://www.tagesschau.de/tagesschau_in_einfacher_sprache/video-1632926.html", "embed_url": "https://www.tagesschau.de/tagesschau_in_einfacher_sprache/video-1632926~player.html", "mp4_url": "https://tagesschau-progressive.ard-mcdn.de/video/2026/0817/TV-20260817-1744-0700.webl.h264.mp4", "duration": 568.36, "news": [{"title": "Belgien: Kampf gegen Feuer im Wald", "paras": [{"de": "Belgien ist ein Nachbarland von Deutschland. In einem Gebiet an der Grenze brennt es im Wald. Das Feuer ist sehr groß. Die Feuerwehr konnte den Brand noch nicht löschen. Deshalb haben viele Menschen Angst. Was, wenn das Feuer ihre Häuser erreicht? Jetzt bekommt die Feuerwehr Hilfe. Es regnet nämlich.", "zh": "比利时是德国的邻国。在边境的一个地区，森林里着火了。火势很大。消防队还无法扑灭这场大火。因此许多人很害怕。如果火烧到他们的房子怎么办？现在消防队得到了帮助——因为下雨了。", "start": 34.4, "end": 65.16}, {"de": "Dazu kommt jetzt ein Film. Endlich gibt es etwas Regen. Die Feuerwehrleute und die Bewohner von der Region sind froh. Sie hoffen, vielleicht kann der Regen das Feuer stoppen. Dieser Feuerwehrmann sagt, der Regen ist gut. Auch der Wind weht nicht mehr so stark. Das Feuer kann gerade nicht größer werden. Aber der Regen kann das Feuer nicht ganz löschen. Die Erde ist hier nämlich aus Torf. Das wurde früher zum Heizen benutzt. Torf brennt sehr gut. Deshalb brennt es auch unter der Erde. Da kann die Feuerwehr nicht löschen.", "zh": "（接下来是一段影片。）终于下了一些雨。消防员和当地居民都很高兴。他们希望，也许雨水能阻止火势。这位消防员说，下雨是好事。风也不再刮得那么大了。火势目前无法再扩大。但是雨水无法完全扑灭大火。这里的土壤是泥炭——以前人们用它取暖。泥炭非常易燃。所以地下也在燃烧。消防队对此无能为力。", "start": 66.0, "end": 108.72}, {"de": "Wegen dem Feuer gibt es auch sehr viel Rauch. Einige Menschen mussten deshalb ihre Häuser verlassen. Zur Sicherheit. Dieser Feuerwehrmann sagt, wir gehen auf Nummer sicher. In der Nähe gibt es nämlich auch einen Nadelwald. Ein Nadelwald brennt sehr schnell. Deswegen haben wir die Menschen lieber in Sicherheit gebracht.", "zh": "因为大火，还有大量的烟雾。一些人因此必须离开自己的家，为了安全起见。这位消防员说，我们要做到万无一失。附近还有一片针叶林。针叶林燃烧得非常快。所以我们宁可把居民转移到安全地带。", "start": 109.96, "end": 135.64}, {"de": "In einem Nachbarort können die Menschen schon wieder in ihre Häuser zurück. Das Feuer ist für sie nicht mehr gefährlich. Dieser Mann sagt, wir sind wieder zu Hause. Ich bin erleichtert. Wir hatten Angst, dass unser Haus abbrennt. Ich möchte der Feuerwehr Danke sagen. Die Feuerwehr hat nämlich Tag und Nacht gearbeitet und gegen das Feuer gekämpft.", "zh": "在邻近的一个小镇，居民已经可以回到家里了。大火对他们来说不再危险。这位男士说，我们回到家了。我松了一口气。我们之前很害怕，怕我们的房子被烧毁。我要感谢消防队。消防队日夜不停地工作，与大火搏斗。", "start": 135.68, "end": 164.28}], "vocab": [{"lemma": "löschen", "key": "löschen", "forms": ["löschen"], "pos": "Verb", "zh": "扑灭", "example_de": "Die Feuerwehr konnte den Brand noch nicht löschen.", "example_zh": ""}, {"lemma": "der Brand, Brände", "key": "brand", "forms": ["Brand", "Brände"], "pos": "", "zh": "火灾", "example_de": "Die Feuerwehr konnte den Brand noch nicht löschen.", "example_zh": ""}, {"lemma": "die Feuerwehr, -en", "key": "feuerwehr", "forms": ["Feuerwehr", "Feuerwehren"], "pos": "", "zh": "消防队", "example_de": "Die Feuerwehr konnte den Brand noch nicht löschen.", "example_zh": ""}, {"lemma": "der Torf", "key": "torf", "forms": ["Torf"], "pos": "", "zh": "泥炭", "example_de": "Die Erde ist hier nämlich aus Torf.", "example_zh": ""}, {"lemma": "der Rauch", "key": "rauch", "forms": ["Rauch"], "pos": "", "zh": "烟雾", "example_de": "Wegen dem Feuer gibt es auch sehr viel Rauch.", "example_zh": ""}, {"lemma": "verlassen", "key": "verlassen", "forms": ["verlassen"], "pos": "Verb", "zh": "离开", "example_de": "Einige Menschen mussten deshalb ihre Häuser verlassen.", "example_zh": ""}, {"lemma": "auf Nummer sicher gehen", "key": "auf-nummer-sicher-gehen", "forms": ["auf Nummer sicher gehen", "auf Nummer sicher"], "pos": "Redewendung", "zh": "万无一失", "example_de": "Dieser Feuerwehrmann sagt, wir gehen auf Nummer sicher.", "example_zh": ""}, {"lemma": "der Nadelwald, Nadelwälder", "key": "nadelwald", "forms": ["Nadelwald", "Nadelwälder"], "pos": "", "zh": "针叶林", "example_de": "In der Nähe gibt es nämlich auch einen Nadelwald.", "example_zh": ""}, {"lemma": "die Sicherheit", "key": "sicherheit", "forms": ["Sicherheit"], "pos": "", "zh": "安全", "example_de": "Zur Sicherheit.", "example_zh": ""}, {"lemma": "erleichtert", "key": "erleichtert", "forms": ["erleichtert"], "pos": "", "zh": "松了口气的", "example_de": "Ich bin erleichtert.", "example_zh": ""}], "grammar_points": [{"title": "deshalb / deswegen / nämlich", "summary": "deshalb / deswegen / nämlich — 因果连接词家族 这条新闻是因果连接词的展览会： · deshalb / deswegen（因此）= 前句是因，本句是果，占第一位：\"Deshalb haben viele Menschen Angst.\" · nämlich（因为）= 原因藏在句子中间，跟在主语后：\"Es regnet nämlich.\" 直觉：deshalb 往前指（所以），nämlich 往后藏（原因埋伏在句中）", "example_de": "Deshalb haben viele Menschen Angst.", "example_zh": ""}, {"title": "deshalb 句的 V2 语序", "summary": "deshalb 句的 V2 语序 deshalb 占第一位时，动词紧跟第二位，主语退到动词后。\"Deshalb haben viele Menschen Angst.\" 任何成分提前，动词永远死守第二位。", "example_de": "Deshalb haben viele Menschen Angst.", "example_zh": ""}], "background": "比利时与德国、荷兰交界地带2026年8月中旬发生大范围泥炭沼泽火灾。泥炭土壤本身可燃，火会在地下蔓延，浇水只能扑灭表面，极难彻底扑灭。这类火灾在欧洲近年高温干旱背景下越来越常见。"}, {"title": "Bundesländer lockern Lkw-Fahrverbot am Sonntag", "paras": [{"de": "Es gibt zurzeit zu wenig Regen in Deutschland. Deshalb ist es sehr trocken. Und in vielen Flüssen ist nur wenig Wasser. Schiffe können nicht viel Fracht und Ladung mitnehmen. Für manche Firmen ist das ein Problem. Sie brauchen nämlich die Lieferung von der Fracht. Z.B. für ihre Fabrik.", "zh": "目前德国降雨太少。因此非常干燥。许多河流水位很低。船只无法运载太多货物。对一些公司来说这是个问题，因为它们需要货物按时送达，比如送到工厂。", "start": 165.6, "end": 193.2}, {"de": "Wegen diesem Problem sagt die Regierung in vielen Bundesländern von Deutschland, die Fracht soll mit Lastwagen transportiert werden. Das ist jetzt auch am Sonntag erlaubt. Bisher durften Lastwagen nämlich nicht am Sonntag fahren.", "zh": "由于这个问题，德国许多联邦州的政府说：货物应该用卡车运输。现在周日也允许了。在此之前，卡车是不允许在周日上路的。", "start": 194.28, "end": 208.92}, {"de": "Dazu kommt jetzt ein Film. In diesem Hafen in dem Bundesland Bayern ist nichts los. Es gibt zu wenig Wasser im Fluss. Schiffe fahren nicht. Die Container können jetzt nur mit Lastwagen transportiert werden. Joachim Herrmann von der CSU ist Minister in der Regierung von Bayern. Er sagt, wir ändern das Gesetz. Lastwagen dürfen jetzt auch am Sonntag fahren.", "zh": "（接下来是一段影片。）巴伐利亚州的这个港口冷冷清清。河里水太少了。船只无法航行。集装箱现在只能用卡车运输。基社盟的约阿希姆·赫尔曼是巴伐利亚政府的部长。他说，我们修改法律。卡车现在周日也可以上路了。", "start": 208.96, "end": 240.48}, {"de": "Aber an diesem Sonntag sind kaum Lastwagen unterwegs. Viele Lastwagen stehen auf dem Rastplatz. Die Fahrer müssen nämlich Pause machen. Das ist ein Gesetz. Viele Fahrer wissen gar nicht, dass sie jetzt am Sonntag fahren dürfen. Dieser Fahrer sagt, heute ist Sonntag, da darf ich nicht Lastwagen fahren. Alle Fahrer haben am Sonntag frei. Und dieser Fahrer sagt, ich fahre erst am Montagmorgen wieder los.", "zh": "但在这个周日，路上几乎看不到卡车。很多卡车停在服务区。因为司机必须休息——这是法律规定。很多司机根本不知道现在周日可以开车了。这位司机说，今天是周日，我不能开卡车。所有司机周日都休息。另一位司机说，我要到周一早上才重新出发。", "start": 241.08, "end": 275.28}, {"de": "Für viele Firmen mit Lastwagen ist die neue Regel nicht so einfach. Dieser Mann vertritt die Lastwagenfirmen. Er sagt, die Firmen haben komplizierte Pläne gemacht für ihre Lastwagen und für ihre Fahrer. Die Pläne können sie nicht so schnell ändern. Lastwagen fahren am Sonntag nicht, obwohl sie dürfen. Diese Autofahrerin sagt, wir haben kaum Lastwagen gesehen.", "zh": "对很多卡车公司来说，新规没那么容易执行。这位男士代表卡车公司的利益。他说，公司为卡车和司机制定了复杂的计划。这些计划没法那么快改。所以卡车周日不上路，尽管被允许。这位女司机说，我们几乎没看到卡车。", "start": 276.88, "end": 305.52}, {"de": "Der Minister aus Bayern findet die neue Regel trotzdem gut. Er sagt, wir schränken die Firmen nicht mehr ein. Sie dürfen jetzt auch am Sonntag Fracht transportieren. Ob sie das auch machen, das muss jede Firma selbst entscheiden. Aber die Regel soll nicht für immer bleiben. Wenn Schiffe wieder fahren können, dann müssen die Lastwagen auch am Sonntag wieder Pause machen.", "zh": "巴伐利亚的部长仍然认为新规是好的。他说，我们不再限制公司了。它们现在周日也可以运货了。至于做不做，每家公司自己决定。但这条规则不会永远保留。等船只恢复航行，卡车周日也得重新休息。", "start": 306.04, "end": 333.88}], "vocab": [{"lemma": "das Bundesland, Bundesländer", "key": "bundesland", "forms": ["Bundesland", "Bundesländer"], "pos": "", "zh": "联邦州", "example_de": "In diesem Hafen in dem Bundesland Bayern ist nichts los.", "example_zh": ""}, {"lemma": "lockern", "key": "lockern", "forms": ["lockern"], "pos": "Verb", "zh": "放宽", "example_de": "Die Bundesländer lockern das Fahrverbot.", "example_zh": ""}, {"lemma": "das Fahrverbot, -e", "key": "fahrverbot", "forms": ["Fahrverbot", "Fahrverbote"], "pos": "", "zh": "禁行令", "example_de": "Bisher gab es ein Fahrverbot am Sonntag.", "example_zh": ""}, {"lemma": "die Fracht", "key": "fracht", "forms": ["Fracht"], "pos": "", "zh": "货物（运输的）", "example_de": "Schiffe können nicht viel Fracht und Ladung mitnehmen.", "example_zh": ""}, {"lemma": "die Lieferung, -en", "key": "lieferung", "forms": ["Lieferung", "Lieferungen"], "pos": "", "zh": "送货、交付", "example_de": "Sie brauchen nämlich die Lieferung von der Fracht.", "example_zh": ""}, {"lemma": "der Lastwagen (Lkw), -s", "key": "lastwagen", "forms": ["Lastwagen", "Lastwagens", "Lkw"], "pos": "", "zh": "卡车", "example_de": "Wegen diesem Problem sagt die Regierung in vielen Bundesländern von Deutschland, die Fracht soll mit Lastwagen transportiert werden.", "example_zh": ""}, {"lemma": "transportieren", "key": "transportieren", "forms": ["transportieren"], "pos": "Verb", "zh": "运输", "example_de": "Sie dürfen jetzt auch am Sonntag Fracht transportieren.", "example_zh": ""}, {"lemma": "der Rastplatz, Rastplätze", "key": "rastplatz", "forms": ["Rastplatz", "Rastplätze"], "pos": "", "zh": "服务区", "example_de": "Viele Lastwagen stehen auf dem Rastplatz.", "example_zh": ""}, {"lemma": "die Regel, -n", "key": "regel", "forms": ["Regel", "Regeln"], "pos": "", "zh": "规则", "example_de": "Für viele Firmen mit Lastwagen ist die neue Regel nicht so einfach.", "example_zh": ""}, {"lemma": "vertreten", "key": "vertreten", "forms": ["vertreten"], "pos": "Verb", "zh": "代表", "example_de": "Dieser Mann vertritt die Lastwagenfirmen.", "example_zh": ""}], "grammar_points": [{"title": "被动语态", "summary": "被动语态 — werden + Partizip II \"Die Fracht soll mit Lastwagen transportiert werden.\"（货物应该被卡车运输） \"Das ist jetzt auch am Sonntag erlaubt.\"（现在周日也被允许了） 直觉：被动 = 主语是\"被打\"的那一方。werden 承担\"被\"的功能，动词变第二分词甩句末。soll ... werden = 情态动词 + 被动，两层框架叠在句末", "example_de": "Die Fracht soll mit Lastwagen transportiert werden.", "example_zh": ""}, {"title": "dürfen vs. müssen vs. sollen", "summary": "dürfen vs. müssen vs. sollen — 三个\"规\"的直觉 · dürfen（被允许）：法律开绿灯 \"Lastwagen dürfen jetzt fahren.\" · müssen（必须）：法律上枷锁 \"Die Fahrer müssen Pause machen.\" · sollen（应该/被期望）：政府的态度 \"Die Fracht soll transportiert werden.\" 直觉：dürfen 是权利，müssen 是义务，sollen 是期望——都来自规则世界，不是你自己的意愿", "example_de": "规", "example_zh": ""}], "background": "德国传统上禁止卡车周日上高速（Sonntagsfahrverbot），目的是让司机休息、缓解交通。2026年夏莱茵河等主要航道因干旱水位过低断航，物流受阻，多州临时放宽周日禁令。由于欧盟对司机的强制休息时间和运输公司的计划周期，放宽初期实际效果有限。"}, {"title": "E-Scooter: Unfälle und Diskussion über Helmpflicht", "paras": [{"de": "E-Scooter ist englisch für E-Roller. Das E steht für Elektro. Die Roller fahren nämlich mit einem Elektromotor, mit Strom aus einer Batterie. Vor allem junge Menschen fahren E-Scooter. Aber E-Scooter können gefährlich sein. Es gibt sehr viele Unfälle mit E-Scootern. Viele Fahrer von E-Scootern tragen nämlich keinen Helm auf dem Kopf. E-Scooter fahren und einen Helm auf dem Kopf tragen, ist sicherer. Deshalb gibt es jetzt eine Diskussion über die Helmpflicht. Das heißt, sollen alle Fahrer mit dem E-Scooter einen Helm tragen müssen?", "zh": "E-Scooter 是英语，就是电动滑板车。E 代表电动。这种滑板车靠电动机驱动，电来自电池。主要是年轻人在骑。但 E-Scooter 可能很危险，事故非常多。因为很多骑的人头上不戴头盔。骑 E-Scooter 时戴上头盔更安全。因此现在有一场关于头盔强制令的讨论：所有骑 E-Scooter 的人都必须戴头盔吗？", "start": 334.68, "end": 382.04}, {"de": "Dazu kommt jetzt ein Film. Viele Menschen finden E-Scooter praktisch. Aber bei manchen Fahrten mit dem E-Scooter gibt es einen Unfall. In diesem Krankenhaus arbeitet der Arzt Michael Zyskowski. Er behandelt viele Unfälle mit E-Scootern. Der Arzt sagt, die Menschen haben Verletzungen am Kopf und am Gehirn. Wenn ein Knochen gebrochen ist, dann kann ich das operieren. Aber wenn das Gehirn verletzt ist, dann geht das nicht. Ein Unfall kann sehr schlimme Folgen haben.", "zh": "（接下来是一段影片。）很多人觉得 E-Scooter 很实用。但有些骑行中会发生事故。医生米夏埃尔·济斯科夫斯基在这家医院工作，他治疗过很多 E-Scooter 事故。这位医生说，伤者头部和大脑受伤。如果骨头断了，我可以做手术。但如果大脑受了伤，那就没办法了。一次事故可能造成非常严重的后果。", "start": 382.08, "end": 422.8}, {"de": "In einigen Ländern müssen alle Fahrer von E-Scootern einen Helm tragen. In Deutschland nicht. Es gibt Firmen, die verleihen E-Scooter. Diese Firmen wollen keine Helmpflicht. Die Firmen sagen nämlich, eine Helmpflicht ist zu kompliziert. Wir glauben, dann mieten weniger Menschen spontan einen E-Scooter. Das ist schlecht fürs Geschäft. In dem Land Israel gibt es eine Helmpflicht. Dort mietet man einen E-Scooter und einen Helm dazu. Dieser Mann sagt, das Mieten geht einfach über eine App auf dem Smartphone. Aber manchmal fehlt der Helm auch. Dann kann man nicht mit Helm fahren.", "zh": "在一些国家，所有骑 E-Scooter 的人都必须戴头盔。德国没有这样的规定。有些公司出租 E-Scooter，这些公司不想要头盔强制令。它们说，头盔强制令太麻烦了。我们相信，那样会更少有人临时起意租一辆 E-Scooter，这对生意不利。在以色列有头盔强制令，租 E-Scooter 时会一并租到一个头盔。这位男士说，租赁通过智能手机 App 就能完成。但有时候头盔不在，那就只能不戴头盔骑了。", "start": 423.76, "end": 472.56}, {"de": "Der Arzt Michael Zyskowski meint, E-Scooter fahren mit Helm ist sicherer. Das müssen die Menschen verstehen. Das Verstehen ist besser als eine Helmpflicht.", "zh": "医生济斯科夫斯基认为，戴头盔骑 E-Scooter 更安全。这一点人们必须明白。明白这一点比一条头盔强制令更好。", "start": 473.24, "end": 485.96}], "vocab": [{"lemma": "der Unfall, Unfälle", "key": "unfall", "forms": ["Unfall", "Unfälle"], "pos": "", "zh": "事故", "example_de": "Es gibt sehr viele Unfälle mit E-Scootern.", "example_zh": ""}, {"lemma": "der Helm, -e", "key": "helm", "forms": ["Helm", "Helme"], "pos": "", "zh": "头盔", "example_de": "Viele Fahrer von E-Scootern tragen nämlich keinen Helm auf dem Kopf.", "example_zh": ""}, {"lemma": "die Helmpflicht", "key": "helmpflicht", "forms": ["Helmpflicht"], "pos": "", "zh": "头盔强制令", "example_de": "Deshalb gibt es jetzt eine Diskussion über die Helmpflicht.", "example_zh": ""}, {"lemma": "die Verletzung, -en", "key": "verletzung", "forms": ["Verletzung", "Verletzungen"], "pos": "", "zh": "伤", "example_de": "Der Arzt sagt, die Menschen haben Verletzungen am Kopf und am Gehirn.", "example_zh": ""}, {"lemma": "das Gehirn", "key": "gehirn", "forms": ["Gehirn"], "pos": "", "zh": "大脑", "example_de": "Der Arzt sagt, die Menschen haben Verletzungen am Kopf und am Gehirn.", "example_zh": ""}, {"lemma": "brechen (brach, gebrochen)", "key": "brechen-brach", "forms": ["brechen", "brach", "gebrochen"], "pos": "Redewendung", "zh": "折断", "example_de": "Wenn ein Knochen gebrochen ist, dann kann ich das operieren.", "example_zh": ""}, {"lemma": "verleihen", "key": "verleihen", "forms": ["verleihen"], "pos": "Verb", "zh": "出租", "example_de": "Es gibt Firmen, die verleihen E-Scooter.", "example_zh": ""}, {"lemma": "mieten", "key": "mieten", "forms": ["mieten"], "pos": "Verb", "zh": "租", "example_de": "Wir glauben, dann mieten weniger Menschen spontan einen E-Scooter.", "example_zh": ""}, {"lemma": "spontan", "key": "spontan", "forms": ["spontan"], "pos": "", "zh": "临时起意的", "example_de": "Wir glauben, dann mieten weniger Menschen spontan einen E-Scooter.", "example_zh": ""}, {"lemma": "die Folge, -n", "key": "folge", "forms": ["Folge", "Folgen"], "pos": "", "zh": "后果", "example_de": "Ein Unfall kann sehr schlimme Folgen haben.", "example_zh": ""}], "grammar_points": [{"title": "zu + 形容词", "summary": "zu + 形容词 — \"太……了\" \"Eine Helmpflicht ist zu kompliziert.\"（头盔强制令太麻烦了） 直觉：zu 和英语 too 完全同源同义。本期另一处 \"Es gibt zurzeit zu wenig Regen\" 也是它", "example_de": "太……了", "example_zh": ""}, {"title": "besser als", "summary": "besser als — 比较级 + als \"Das Verstehen ist besser als eine Helmpflicht.\"（明白比强制令更好） gut → besser（不规则比较级，同英语 good → better），als 连接比较对象", "example_de": "Das Verstehen ist besser als eine Helmpflicht.", "example_zh": ""}], "background": "德国自2019年放开电动滑板车以来事故持续攀升，头部伤害是主要死因，但一直没有全国性头盔强制令。以色列是少数有强制令的国家，共享滑板车公司随车配头盔。共享出行公司普遍反对强制令，理由正是\"降低临时租赁\"。2026年夏的讨论由事故数据推动，医生群体是主要推动方。"}, {"title": "Schauspielerin Hayden Panettiere gestorben", "paras": [{"de": "Die Frau auf dem Foto ist die Schauspielerin Hayden Panettiere. Hayden Panettiere war schon als Kind berühmt. Sie hat auch in vielen Serien mitgespielt. Jetzt ist Hayden Panettiere gestorben. Sie wurde nur 36 Jahre alt. Warum sie gestorben ist, das weiß man noch nicht. Viele Fans, andere Schauspieler und Künstler sind traurig über den Tod von Hayden Panettiere.", "zh": "照片上的这位女士是演员海登·潘妮蒂埃。她很小的时候就出名了，还在许多电视剧里出演过。现在她去世了，只活到36岁。她为什么去世，目前还不得而知。许多粉丝、其他演员和艺术家都对她的离世感到悲伤。", "start": 487.4, "end": 519.84}], "vocab": [{"lemma": "die Schauspielerin, -nen", "key": "schauspielerin", "forms": ["Schauspielerin", "Schauspielerinnen"], "pos": "", "zh": "女演员", "example_de": "Die Frau auf dem Foto ist die Schauspielerin Hayden Panettiere.", "example_zh": ""}, {"lemma": "berühmt", "key": "berühmt", "forms": ["berühmt"], "pos": "", "zh": "出名的", "example_de": "Hayden Panettiere war schon als Kind berühmt.", "example_zh": ""}, {"lemma": "die Serie, -n", "key": "serie", "forms": ["Serie", "Serien"], "pos": "", "zh": "电视剧", "example_de": "Sie hat auch in vielen Serien mitgespielt.", "example_zh": ""}, {"lemma": "mitspielen (hat mitgespielt)", "key": "mitspielen", "forms": ["mitspielen", "mitgespielt"], "pos": "Redewendung", "zh": "参演", "example_de": "Sie hat auch in vielen Serien mitgespielt.", "example_zh": ""}, {"lemma": "sterben (ist gestorben)", "key": "sterben", "forms": ["sterben", "gestorben"], "pos": "Redewendung", "zh": "去世", "example_de": "Jetzt ist Hayden Panettiere gestorben.", "example_zh": ""}, {"lemma": "der Tod", "key": "tod", "forms": ["Tod"], "pos": "", "zh": "死亡", "example_de": "Viele Fans, andere Schauspieler und Künstler sind traurig über den Tod von Hayden Panettiere.", "example_zh": ""}, {"lemma": "traurig über + Akk.", "key": "traurig-über", "forms": ["traurig über + Akk.", "traurig über"], "pos": "Redewendung", "zh": "对……悲伤", "example_de": "Viele Fans, andere Schauspieler und Künstler sind traurig über den Tod von Hayden Panettiere.", "example_zh": ""}], "grammar_points": [{"title": "wurde + 数字 + alt", "summary": "wurde + 数字 + alt — \"活到多少岁\" \"Sie wurde nur 36 Jahre alt.\"（她只活到36岁） wurde 是 werden 的过去时。werden 的两个面孔：① \"变\"（alt werden 长大 / dunkler werden 变暗）② 构成被动。本句是①：她\"变成\"了36岁 = 活到36岁", "example_de": "活到多少岁", "example_zh": ""}, {"title": "traurig über + 第四格", "summary": "traurig über + 第四格 — 情绪 + 固定介词 \"traurig über den Tod\"（对去世感到悲伤） über = 情绪有明确的靶子（第四格）。同家族：sich freuen über（为已发生的事高兴）/ sich freuen auf（为将来的事期待）", "example_de": "traurig über den Tod", "example_zh": ""}], "background": "Hayden Panettiere（1989–2026），美国演员，童星出身，代表作《英雄 Heroes》《音乐之乡 Nashville》。她还公开谈过产后抑郁和饮酒问题，是心理健康议题的倡导者。（背景为模型知识，细节以官方报道为准。）"}, {"title": "Das Wetter", "paras": [{"de": "Und jetzt kommt das Wetter. Rechts im Osten und unten im Südosten gibt es viel Sonne. Wenige Wolken und es ist meist trocken. Sonst gibt es einen Mix aus Sonne und Wolken und einzelne Schauer und Gewitter. Es werden 21 bis 39 Grad.", "zh": "现在是天气预报。东部和东南部阳光充足，云很少，大部分地区干燥。其他地区晴雨混合，有零星阵雨和雷雨。气温21到39度。", "start": 540.44, "end": 561.28}], "vocab": [{"lemma": "der Osten", "key": "osten", "forms": ["Osten"], "pos": "", "zh": "东方", "example_de": "Rechts im Osten und unten im Südosten gibt es viel Sonne.", "example_zh": ""}, {"lemma": "der Südosten", "key": "südosten", "forms": ["Südosten"], "pos": "", "zh": "东南", "example_de": "Rechts im Osten und unten im Südosten gibt es viel Sonne.", "example_zh": ""}, {"lemma": "der Schauer, -", "key": "schauer", "forms": ["Schauer"], "pos": "", "zh": "阵雨", "example_de": "Sonst gibt es einen Mix aus Sonne und Wolken und einzelne Schauer und Gewitter.", "example_zh": ""}, {"lemma": "das Gewitter, -", "key": "gewitter", "forms": ["Gewitter"], "pos": "", "zh": "雷雨", "example_de": "Sonst gibt es einen Mix aus Sonne und Wolken und einzelne Schauer und Gewitter.", "example_zh": ""}, {"lemma": "der Grad, -e", "key": "grad", "forms": ["Grad", "Grade"], "pos": "", "zh": "度", "example_de": "Es werden 21 bis 39 Grad.", "example_zh": ""}, {"lemma": "der Mix", "key": "mix", "forms": ["Mix"], "pos": "", "zh": "混合", "example_de": "Sonst gibt es einen Mix aus Sonne und Wolken und einzelne Schauer und Gewitter.", "example_zh": ""}], "grammar_points": [{"title": "Es werden + 数字", "summary": "Es werden + 数字 — 气温预报专用句 \"Es werden 21 bis 39 Grad.\"（气温将是21到39度） 固定句式：werden（复数，因为 Grad 是复数）+ 数字 + Grad。温度\"变成\"某个数——werden 的\"变\"用法又出现了，天气播报里 werden 是常客", "example_de": "Es werden 21 bis 39 Grad.", "example_zh": ""}], "background": ""}], "gloss": {"löschen": {"word": "löschen", "zh": "扑灭", "pos": "Verb", "example": "Die Feuerwehr konnte den Brand noch nicht löschen.", "source": "editorial"}, "brand": {"word": "der Brand, Brände", "zh": "火灾", "pos": "", "example": "Die Feuerwehr konnte den Brand noch nicht löschen.", "source": "editorial"}, "feuerwehr": {"word": "die Feuerwehr, -en", "zh": "消防队", "pos": "", "example": "Die Feuerwehr konnte den Brand noch nicht löschen.", "source": "editorial"}, "torf": {"word": "der Torf", "zh": "泥炭", "pos": "", "example": "Die Erde ist hier nämlich aus Torf.", "source": "editorial"}, "rauch": {"word": "der Rauch", "zh": "烟雾", "pos": "", "example": "Wegen dem Feuer gibt es auch sehr viel Rauch.", "source": "editorial"}, "verlassen": {"word": "verlassen", "zh": "离开", "pos": "Verb", "example": "Einige Menschen mussten deshalb ihre Häuser verlassen.", "source": "editorial"}, "auf-nummer-sicher-gehen": {"word": "auf Nummer sicher gehen", "zh": "万无一失", "pos": "Redewendung", "example": "Dieser Feuerwehrmann sagt, wir gehen auf Nummer sicher.", "source": "editorial"}, "nadelwald": {"word": "der Nadelwald, Nadelwälder", "zh": "针叶林", "pos": "", "example": "In der Nähe gibt es nämlich auch einen Nadelwald.", "source": "editorial"}, "sicherheit": {"word": "die Sicherheit", "zh": "安全", "pos": "", "example": "Zur const WK_RE = /[A-Za-zÄÖÜäöüß][A-Za-zÄÖÜäöüß-]*/g;
const PHRASES = (DATA.phrases || []).slice().sort((a, b) => b.length - a.length);
function lookupKey(surface) {
  return (DATA.form_to_key && DATA.form_to_key[surface.toLowerCase()]) || surface.toLowerCase();
}
function wrapWord(surface, key) {
  const g = getGloss(key);
  const classes = [
    g?.zh ? 'known' : '',
    g?.source === 'editorial' ? 'ed' : '',
    g?.source === 'wiktionary' ? 'wiki' : '',
    basket.some(b => b.key === key) ? 'saved' : ''
  ].filter(Boolean).join(' ');
  return `<w data-w="${esc(key)}" class="${classes}">${esc(surface)}</w>`;
}
function isLetter(ch) { return /[A-Za-zÄÖÜäöüß]/.test(ch || ''); }
function tokenizeDe(text) {
  let html = '', i = 0;
  const lower = text.toLowerCase();
  while (i < text.length) {
    let hit = '';
    if (i === 0 || !isLetter(text[i - 1])) {
      for (const ph of PHRASES) {
        if (lower.startsWith(ph.toLowerCase(), i) && !isLetter(text[i + ph.length])) {
          hit = text.slice(i, i + ph.length);
          break;
        }
      }
    }
    if (hit) {
      html += wrapWord(hit, lookupKey(hit));
      i += hit.length;
      continue;
    }
    if (isLetter(text[i])) {
      let j = i + 1;
      while (j < text.length && /[A-Za-zÄÖÜäöüß-]/.test(text[j])) j++;
      const word = text.slice(i, j);
      html += wrapWord(word, lookupKey(word));
      i = j;
    } else {
      let j = i + 1;
      while (j < text.length && !isLetter(text[j])) j++;
      html += esc(text.slice(i, j));
      i = j;
    }
  }
  return html;
}

function storyExtras(n, compact) {
  if (compact) {

    if (n.background) {
      tabs.push('<button type="button" class="stab" data-pane="bg">背景</button>');
      panes.push(`<div class="spane" data-pane="bg"><div class="rail-note">${esc(n.background)}</div></div>`);
    }
    if (n.vocab.length) {
      tabs.push(`<button type="button" class="stab" data-pane="vocab">词汇 ${n.vocab.length}</button>`);
      panes.push(`<div class="spane" data-pane="vocab">${
        n.vocab.map(v => `<div class="vrow"><div><div class="vw">${esc(v.lemma)}</div><div class="vz">${esc(v.zh)}</div>${v.example_de ? `<div class="vex">${esc(v.example_de)}</div>` : ''}</div><button type="button" class="vadd" data-add="${esc(v.key)}" title="加入生词本" aria-label="加入生词本">+</button></div>`).join('')
      }</div>`);
    }

      tabs.push(`<button type="button" class="stab" data-pane="gram">语法 ${n.grammar_points.length}</button>`);
      panes.push(`<div class="spane" data-pane="gram">${
        n.grammar_points.map(g => `<div class="rail-note"><strong>${esc(g.title)}</strong>${g.example_de ? `<i>${esc(g.example_de)}</i>` : ''}${esc(g.summary)}</div>`).join('')

    n.vocab.map(v => `<div class="vcard"><div><div class="vcard-top">${esc(v.lemma)}${v.pos ? `<span class="vpos">${esc(v.pos)}</span>` : ''}</div><div class="vzh">${esc(v.zh)}</div>${v.example_de ? `<div class="vex">${esc(v.example_de)}</div>` : ''}</div><button type="button" class="vadd" data-add="${esc(v.key)}" title="加入生词本" aria-label="加入生词本">+</button></div>`).join('')
  }</div></details>` : '';
  const gram = n.grammar_points.length ? `<details class="sec-gram"><summary>语法 · ${n.grammar_points.length}</summary><div class="body">${
    n.grammar_points.map(g => `<div class="gcard"><h4>${esc(g.title)}</h4>${g.example_de ? `<div class="gex">${esc(g.example_de)}</div>` : ''}${g.example_zh ? `<div class="gexzh">${esc(g.example_zh)}</div>` : ''}${g.summary ? `<details class="gmore"><summary>解释</summary><div>${esc(g.summary)}</div></details>` : ''}</div>`).join('')
  }</div></details>` : '';
  const bg = n.background ? `<details class="sec-bg"><summary>背景资料</summary><div class="body"><p class="bg-note">AI 整理，未经独立来源核验</p>${esc(n.background)}</div></details>` : '';
  return vocab + gram + bg || '<p class="empty-study">这条没有单独的词汇或语法。</p>';

function loadScript(src) {

    };
    db.run(`INSERT INTO col VALUES(?,?,?,?,?,?,?,?,?,?,?,?,?)`, [
      now, now, now * 1000, 0, 11, 0, 0, 0,
      JSON.stringify(conf), JSON.stringify(model), JSON.stringify(decks),
      JSON.stringify(dconf), '{}'
    ]);

    db.run(`CREATE TABLE notes(
      id integer primary key, guid text, mid integer, mod integer, usn integer,
      tags text, flds text, sfld text, csum integer, flags integer, data text)`);
    db.run(`CREATE TABLE cards(
      id integer primary key, nid integer, did integer, ord integer, mod integer,
      usn integer, type integer, queue integer, due integer, ivl integer,
      factor integer, reps integer, lapses integer, left integer, odue integer,
      odid integer, flags integer, data text)`);
    db.run(`CREATE TABLE revlog(
      id integer primary key, cid integer, usn integer, ease integer, ivl integer,

    db.run(`CREATE TABLE graves(

    db.run(`CREATE INDEX ix_cards_usn on cards (usn)`);
    db.run(`CREATE INDEX ix_revlog_usn on revlog (usn)`);

    db.run(`CREATE INDEX ix_revlog_cid on revlog (cid)`);
    db.run(`CREATE INDEX ix_notes_csum on notes (csum)`);

    const enc = new TextEncoder();
    function csum(s) { // anki checquers field hash (java String.hashCode)
      let h = 0;
      for (const b of enc.encode(s)) { h = (31 * h + b) | 0; }
      return h;
    }
    function guid(key) {
      let h = 0; const s = 'dd-' + key;
      for (const b of enc.encode(s)) { h = (31 * h + b) | 0; }
      return 'dd' + (h >>> 0).toString(16);
    }

    let nid = now * 1000, cid = (now + 1) * 1000;

      db.run(`INSERT INTO cards VALUES(?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)`,

      nid++; cid++;
    }

    st.textContent = '打包…';
    const data = db.export();
    // zip: meta(version2) + collection.anki2 + collection.anki21(同内容, anki26+导入器优先读) + media
    const zip = makeZip({
      'meta': new Uint8Array([0x08, 0x02]),
      'collection.anki2': data,
      'collection.anki21': data,
      'media': new TextEncoder().encode('{}')
    });
    const blob = new Blob([zip], { type: 'application/apkg' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `deutsch-${basket.length}w-${Date.now()}.apkg`;
    a.click();

    toast('apkg 已下载');
  } catch (err) {

    st.textContent = '导出失败: ' + err.message + ' — 可先用「复制文本」';
  } finally {
    btn.disabled = false;
  }
}

/* 极简 zip (store, 无压缩) — apkg 只需合法 zip */
function makeZip(files) {
  const enc = new TextEncoder();
  const chunks = [], central = [];
  let offset = 0;
  const CRC_TABLE = (() => {
    const t = new Uint32Array(256);
    for (let n = 0; n < 256; n++) {
      let c = n;
      for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
      t[n] = c >>> 0;
    }
    return t;
  })();
  function crc32(buf) {
    let c = 0xFFFFFFFF;
    for (let i = 0; i < buf.length; i++) c = CRC_TABLE[(c ^ buf[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }
  for (const [name, content] of Object.entries(files)) {
    const nameB = enc.encode(name);
    const crc = crc32(content);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true);
    lh.setUint16(4, 20, true);       // version
    lh.setUint16(6, 0, true);        // flags
    lh.setUint16(8, 0, true);        // store
    lh.setUint16(10, 0, true); lh.setUint16(12, 0x2821, true); // time/date(dos)
    lh.setUint32(14, crc, true);
    lh.setUint32(18, content.length, true);
    lh.setUint32(22, content.length, true);
    lh.setUint16(26, nameB.length, true);
    lh.setUint16(28, 0, true);
    chunks.push(new Uint8Array(lh.buffer), nameB, content);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true);
    ch.setUint16(4, 20, true); ch.setUint16(6, 20, true);
    ch.setUint16(8, 0, true); ch.setUint16(10, 0, true);
    ch.setUint16(12, 0, true); ch.setUint16(14, 0x2821, true);
    ch.setUint32(16, crc, true);
    ch.setUint32(20, content.length, true); ch.setUint32(24, content.length, true);
    ch.setUint16(28, nameB.length, true);
    // 30..45 = 0
    ch.setUint32(42, offset, true);
    central.push(new Uint8Array(ch.buffer), nameB);
    offset += 30 + nameB.length + content.length;
  }
  let centralSize = central.reduce((s, c) => s + c.length, 0);
  const eocd = new DataView(new ArrayBuffer(22));
  eocd.setUint32(0, 0x06054b50, true);
  eocd.setUint16(8, Object.keys(files).length, true);
  eocd.setUint16(10, Object.keys(files).length, true);
  eocd.setUint32(12, centralSize, true);
  eocd.setUint32(16, offset, true);
  const total = [...chunks, ...central, new Uint8Array(eocd.buffer)];
  const out = new Uint8Array(total.reduce((s, c) => s + c.length, 0));
  let p = 0;
  for (const c of total) { out.set(c, p); p += c.length; }
  return out;
}

/* ---------- toast ---------- */
let toastT;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(toastT);
  toastT = setTimeout(() => t.style.display = 'none', 1600);
}
