name: Sync probe (temporary)
on:
  push:
    branches: [ccr-0d5fa086-ri1yeo]
    paths: [scripts/sync_probe.py, .github/workflows/sync-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get install -y -qq ffmpeg >/dev/null
      - run: python3 scripts/sync_probe.py 2026-11-02 2026-10-30 2026-10-29 2026-10-20
