    <div id="root"></div>
    <script id="dd-data" type="application/json">{"page":"lesson","lesson":{"slug":"2026-11-11","date":"2026-11-11","show":"tagesschau in Einfacher Sprache","level":"A2–B1","kind":"broadcast","note":"","source_url":"https://www.tagesschau.de/tagesschau_in_einfacher_sprache/tse-1506.html","video":{"mp4":"https://tagesschau-progressive.ard-mcdn.de/video/2026/1111/TV-20261111-1738-4300.webl.h264.mp4","embed":"","page":"https://www.tagesschau.de/tagesschau_in_einfacher_sprache/video-1682086.html"},"duration":496.48,"sentences":[{"de":"Willkommen zur Tagesschau in einfacher Sprache.","zh":"欢迎收看简单语言版《每日新闻》。","start":10.52,"end":13.8},{"de":"Ich bin Susanne Holst und das sind unsere Nachrichten.","zh":"我是Susanne Holst，以下是我们的新闻。","start":13.93,"end":17.73},{"de":"Und nun zur ersten Nachricht.","zh":"现在来看第一条新闻。","start":34.08,"end":36.16},{"de":"Die Bundeswehr ist die Armee von Deutschland.","zh":"联邦国防军是德国的军队。","start":41.53,"end":44.97},{"de":"Der Chef von der Bundeswehr ist der Minister für Verteidigung, Boris Pistorius.","zh":"联邦国防军的最高领导人是国防部长Boris Pistorius。","start":45.69,"end":51.25},{"de":"Er ist auf dem Foto.","zh":"他出现在照片上。","start":51.49,"end":52.93},{"de":"Die Bundeswehr hat jetzt eine neue Studie gemacht.","zh":"联邦国防军现在做了一项新的研究。","start":53.45,"end":56.97},{"de":"Damit will sie herausfinden, gibt es sexualisierte Gewalt in der Bundeswehr?","zh":"他们想借此弄清楚：联邦国防军中是否存在性暴力？","start":57.65,"end":63.29},{"de":"Sexualisierte Gewalt bedeutet, ein Mensch macht etwas Sexuelles mit einem anderen Menschen, obwohl der andere Mensch das nicht will.","zh":"性暴力是指一个人对另一个人做出性行为，而对方并不愿意。","start":63.44,"end":73.57},{"de":"Z.B. ein Mann fasst eine Frau an den Po.","zh":"例如，一个男子摸一个女子的臀部。","start":73.65,"end":77.21},{"de":"Aber die Frau will das nicht.","zh":"但这个女子并不愿意。","start":77.49,"end":79.57},{"de":"Sexualisierte Gewalt ist manchmal aber nicht sofort zu erkennen.","zh":"性暴力有时并不能马上被识别出来。","start":79.88,"end":84.36},{"de":"Z.B. wenn ein Mensch Bemerkungen über den Körper von einem anderen Menschen macht.","zh":"例如，当一个人对另一个人的身体发表评论时。","start":85.0,"end":90.72},{"de":"Dann ist das auch eine Form von sexualisierter Gewalt.","zh":"那也是一种性暴力的形式。","start":91.05,"end":95.09},{"de":"Nämlich Gewalt mit Worten.","zh":"也就是用语言实施的暴力。","start":95.85,"end":97.69},{"de":"Für die Studie haben die Soldaten von der Bundeswehr viele Fragen bekommen.","zh":"为了这项研究，联邦国防军的士兵们收到了很多问题。","start":98.41,"end":103.37},{"de":"Die Fragen konnten sie anonym beantworten.","zh":"他们可以匿名回答这些问题。","start":104.09,"end":107.01},{"de":"D.h. sie mussten ihren Namen nicht nennen.","zh":"也就是说，他们不必说出自己的名字。","start":107.49,"end":110.65},{"de":"Jetzt hat Pistorius das Ergebnis von der Studie vorgestellt.","zh":"现在Pistorius公布了这项研究的结果。","start":112.0,"end":116.2},{"de":"Dazu zeigen wir einen Film.","zh":"为此我们播放一段影片。","start":117.01,"end":118.93},{"de":"Pistorius sagt, in der Bundeswehr gibt es sexualisierte Gewalt.","zh":"Pistorius说，联邦国防军中存在性暴力。","start":120.57,"end":126.25},{"de":"Es gibt sogar mehr Fälle von sexualisierter Gewalt als bislang gedacht.","zh":"性暴力的案件甚至比之前想象的还要多。","start":127.09,"end":132.29},{"de":"Junge Frauen sind besonders oft Opfer von sexualisierter Gewalt.","zh":"年轻女性尤其经常成为性暴力的受害者。","start":133.45,"end":138.17},{"de":"Die Täter sind meistens Männer.","zh":"施害者大多是男性。","start":138.21,"end":141.73},{"de":"Und es gibt auch viele Fälle von Gewalt mit Worten in der Bundeswehr.","zh":"而且联邦国防军中还有很多用语言实施暴力的案件。","start":143.09,"end":148.65},{"de":"Die Studie hat noch etwas gezeigt.","zh":"这项研究还显示了另一点。","start":149.89,"end":153.05},{"de":"Wenn Frauen oder Männer sexualisierte Gewalt erleben, dann erzählen sie das oft nicht.","zh":"当女性或男性遭遇性暴力时，他们往往不会说出来。","start":154.09,"end":160.77},{"de":"Das heißt keiner erfährt davon.","zh":"也就是说，没有人知道这件事。","start":161.29,"end":163.89},{"de":"Ich werde das nicht akzeptieren.","zh":"我不会接受这种情况。","start":165.37,"end":167.97},{"de":"Ich will sexualisierte Gewalt in der Bundeswehr verhindern.","zh":"我想防止联邦国防军中的性暴力。","start":168.77,"end":172.93},{"de":"Deshalb habe ich einen Plan mit vielen Maßnahmen gemacht.","zh":"因此我制定了一个包含许多措施的计划。","start":173.57,"end":177.57},{"de":"Mit dem Plan gibt es dann strengere Regeln und mehr Schutz gegen sexualisierte Gewalt.","zh":"通过这个计划，将有更严格的规定和更多针对性暴力的保护。","start":178.61,"end":184.77},{"de":"Und dann machen wir eine neue Studie.","zh":"然后我们还会做一项新的研究。","start":185.41,"end":188.37},{"de":"Damit prüfen wir, ob die Maßnahmen gewirkt haben.","zh":"以此检验这些措施是否起了作用。","start":189.33,"end":192.69},{"de":"Und nun zur nächsten Nachricht.","zh":"现在来看下一条新闻。","start":194.96,"end":197.16},{"de":"In Deutschland gibt es die Wirtschaftsweisen.","zh":"在德国有“经济智者”。","start":201.45,"end":204.53},{"de":"Sie sind auf dem Foto.","zh":"他们出现在照片上。","start":204.57,"end":206.13},{"de":"Die Wirtschaftsweisen sind Experten für die Wirtschaft und beraten auch die Bundesregierung.","zh":"经济智者是经济方面的专家，也为联邦政府提供咨询。","start":206.33,"end":212.37},{"de":"Jetzt haben die Wirtschaftsweisen einen neuen Bericht vorgestellt.","zh":"现在经济智者们公布了一份新的报告。","start":212.53,"end":216.49},{"de":"In dem Bericht steht, die Wirtschaft von Deutschland soll das erste Mal seit langer Zeit wieder stark wachsen.","zh":"报告中写道，德国经济将时隔很久第一次重新强劲增长。","start":216.53,"end":225.17},{"de":"Wenn die Wirtschaft wächst, dann bedeutet das, die Unternehmen stellen mehr Produkte her und bieten mehr Dienstleistungen an.","zh":"如果经济增长，就意味着企业生产更多产品、提供更多服务。","start":225.49,"end":234.57},{"de":"Dadurch gibt es dann z.B. mehr Jobs und die Menschen verdienen mehr Geld.","zh":"由此，比如会有更多的工作岗位，人们赚更多的钱。","start":234.61,"end":240.45},{"de":"Die Wirtschaftsweisen sagen aber auch, die Regierung darf nicht mehr so viele Schulden machen.","zh":"但经济智者们也说，政府不能再欠那么多债。","start":241.09,"end":247.57},{"de":"Sonst ist das Wachstum von der Wirtschaft bald schon wieder vorbei.","zh":"否则经济的增长很快就会再次结束。","start":247.73,"end":252.28},{"de":"Und nun zur nächsten Nachricht.","zh":"现在来看下一条新闻。","start":254.44,"end":256.64},{"de":"In der Ukraine ist schon lange Krieg.","zh":"乌克兰已经打了很久的仗。","start":260.89,"end":263.81},{"de":"Russland hat die Ukraine nämlich angegriffen.","zh":"因为俄罗斯攻击了乌克兰。","start":264.45,"end":267.61},{"de":"Viele Menschen sind in dem Krieg jetzt schon gestorben.","zh":"到目前为止，已经有很多的人在战争中死去。","start":267.81,"end":271.65},{"de":"Jetzt haben die Ukraine und Russland das erste Mal seit langer Zeit wieder miteinander gesprochen.","zh":"现在乌克兰和俄罗斯时隔很久第一次重新进行了交谈。","start":272.09,"end":279.01},{"de":"Zwei Tage lang haben sie über ein Ende von dem Krieg geredet.","zh":"他们用了两天时间谈论战争的结束。","start":279.29,"end":283.57},{"de":"Die USA sind auch dabei und wollen bei einer Lösung helfen.","zh":"美国也参与其中，并愿意帮助找到解决方案。","start":284.13,"end":288.29},{"de":"Jetzt sind die Gespräche zu Ende.","zh":"现在会谈结束了。","start":289.37,"end":291.73},{"de":"Auf einen Frieden haben sich Russland und die Ukraine noch nicht geeinigt.","zh":"俄罗斯和乌克兰还没有就和平达成一致。","start":292.17,"end":296.37},{"de":"Aber sie wollen Gefangene austauschen, die beide Länder im Krieg gemacht haben.","zh":"但他们想交换两国在战争中俘虏的战俘。","start":296.41,"end":301.77},{"de":"Die Ukraine sagt, die Gespräche waren gut.","zh":"乌克兰说，会谈是好的。","start":302.13,"end":305.33},{"de":"Vielleicht gibt es bis zum Ende von diesem Jahr eine Lösung.","zh":"也许在今年年底之前会有一个解决方案。","start":305.37,"end":309.73},{"de":"Die Verhandlungen zwischen der Ukraine und Russland sollen weitergehen.","zh":"乌克兰和俄罗斯之间的谈判应该会继续进行。","start":310.65,"end":315.21},{"de":"Und nun zur nächsten Nachricht.","zh":"现在来看下一条新闻。","start":317.37,"end":319.73},{"de":"Heute kann man in vielen Städten in Deutschland etwas ganz Besonderes sehen.","zh":"今天在德国的许多城市可以看到非常特别的东西。","start":323.93,"end":328.97},{"de":"Es beginnt nämlich der Karneval.","zh":"因为狂欢节开始了。","start":329.61,"end":331.89},{"de":"Das ist ein großes Fest.","zh":"这是一个盛大的节日。","start":331.93,"end":333.85},{"de":"Viele Menschen verkleiden sich mit bunten Kostümen und Masken, so wie auf dem Foto.","zh":"许多人穿着五彩的服装、戴着面具装扮自己，就像照片上那样。","start":333.89,"end":339.69},{"de":"Sie feiern auf der Straße, tanzen und singen.","zh":"他们在街上庆祝、跳舞和唱歌。","start":339.89,"end":343.09},{"de":"Besonders beliebt ist Karneval in den Städten Köln, Düsseldorf und Mainz.","zh":"狂欢节在科隆、杜塞尔多夫和美因茨这些城市特别受欢迎。","start":343.97,"end":349.13},{"de":"Der Karneval beginnt jedes Jahr am 11. November um 11.11 Uhr.","zh":"狂欢节每年的11月11日11点11分开始。","start":349.37,"end":354.49},{"de":"Dazu zeigen wir jetzt einen Film.","zh":"为此我们现在播放一段影片。","start":355.05,"end":357.41},{"de":"In Köln warten die Menschen schon gespannt auf den Anfang vom Karneval.","zh":"在科隆，人们已经兴奋地等待狂欢节的开始。","start":358.57,"end":364.81},{"de":"Sie sind bunt verkleidet und freuen sich.","zh":"他们穿着五彩的服装，非常开心。","start":365.09,"end":368.49},{"de":"Dann zählen die Menschen die letzten Sekunden bis zum Beginn.","zh":"然后人们倒数开始前的最后几秒。","start":369.37,"end":374.01},{"de":"Und pünktlich um 11.11 Uhr ist es soweit.","zh":"在11点11分整，时刻到来了。","start":374.81,"end":378.65},{"de":"Die Menschen rufen Kölle Alaaf.","zh":"人们高呼“Kölle Alaaf”。","start":382.21,"end":385.09},{"de":"Das bedeutet Köln über alles.","zh":"意思是“科隆高于一切”。","start":386.01,"end":388.97},{"de":"Damit feiern die Menschen ihre Stadt und den Karneval.","zh":"人们借此庆祝他们的城市和狂欢节。","start":389.01,"end":394.69},{"de":"Für viele Menschen ist das die schönste Zeit im Jahr.","zh":"对许多人来说，这是一年中最美好的时光。","start":395.61,"end":400.49},{"de":"Viele Menschen bereiten sich lange auf den Karneval vor.","zh":"许多人为狂欢节做很长时间的准备。","start":403.73,"end":407.65},{"de":"Sie nähen z.B. ihre Kostüme, üben Tänze oder lernen neue Lieder.","zh":"例如，他们缝制服装、练习舞蹈或学习新歌。","start":408.29,"end":414.89},{"de":"Die Karnevalszeit dauert mehrere Monate bis zum Aschermittwoch im Februar.","zh":"狂欢节季节持续好几个月，一直到二月的圣灰星期三。","start":417.29,"end":423.17},{"de":"An den Tagen vor Aschermittwoch wird noch einmal richtig doll gefeiert.","zh":"在圣灰星期三之前的几天里，人们还会好好地大肆庆祝一番。","start":423.33,"end":429.25},{"de":"Dann gehen die Menschen mit bunt geschmückten Wagen durch die Straßen.","zh":"然后人们装扮着五彩的花车穿过街道。","start":429.81,"end":434.89},{"de":"Von den Wagen werfen sie Süßigkeiten in die Menschenmenge.","zh":"他们从车上向人群扔糖果。","start":435.45,"end":439.61},{"de":"Dann ist der Karneval wieder zu Ende.","zh":"然后狂欢节又结束了。","start":440.33,"end":443.29},{"de":"Bis dahin wollen die Menschen aber noch viel feiern, singen und Spaß haben.","zh":"但在那之前，人们还想多多庆祝、唱歌和享乐。","start":443.33,"end":450.69},{"de":"Und das waren unsere Nachrichten.","zh":"以上是我们的新闻。","start":455.89,"end":458.25},{"de":"Und jetzt kommt das Wetter.","zh":"现在来看天气。","start":474.25,"end":476.17},{"de":"In der Mitte von Deutschland und unten im Süden gibt es an manchen Orten Regen, sonst viele Wolken.","zh":"在德国中部和南部一些地方有雨，其他地区多云。","start":476.57,"end":484.01},{"de":"Oben im Norden kann es auch Gewitter geben.","zh":"在北部也可能有雷雨。","start":484.65,"end":487.65},{"de":"Das war die tagesschau in Einfacher Sprache.","zh":"这就是简单语言版的《每日新闻》。","start":492.0,"end":495.08},{"de":"Tschüss.","zh":"再见。","start":495.2,"end":496.48}],"stories":[{"title":"Begrüßung","title_zh":"欢迎","from":0,"to":2,"vocab":[],"grammar":[],"background":""},{"title":"Bundeswehr: Studie zu sexualisierter Gewalt","title_zh":"联邦国防军：关于性暴力的研究","from":3,"to":33,"vocab":[{"key":"bundeswehr","lemma":"die Bundeswehr","pos":"Substantiv","zh":"联邦国防军","example_de":"Die Bundeswehr ist die Armee von Deutschland.","example_zh":"联邦国防军是德国的军队。"},{"key":"gewalt","lemma":"die Gewalt","pos":"Substantiv","zh":"暴力","example_de":"Damit will sie herausfinden, gibt es sexualisierte Gewalt in der Bundeswehr?","example_zh":"他们想借此弄清楚：联邦国防军中是否存在性暴力？"},{"key":"soldat","lemma":"der Soldat, -en","pos":"Substantiv","zh":"士兵","example_de":"Für die Studie haben die Soldaten von der Bundeswehr viele Fragen bekommen.","example_zh":"为了这项研究，联邦国防军的士兵们收到了很多问题。"},{"key":"opfer","lemma":"das Opfer, -","pos":"Substantiv","zh":"受害者","example_de":"Junge Frauen sind besonders oft Opfer von sexualisierter Gewalt.","example_zh":"年轻女性尤其经常成为性暴力的受害者。"},{"key":"verhindern","lemma":"verhindern","pos":"Verb","zh":"防止","example_de":"Ich will sexualisierte Gewalt in der
