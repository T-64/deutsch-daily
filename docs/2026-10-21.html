    <script id="dd-data" type="application/json">{"page":"lesson","lesson":{"slug":"2026-10-21","date":"2026-10-21","show":"tagesschau in Einfacher Sprache","level":"A2–B1","kind":"broadcast","note":"","source_url":"https://www.tagesschau.de/tagesschau_in_einfacher_sprache/tse-1474.html","video":{"mp4":"https://tagesschau-progressive.ard-mcdn.de/video/2026/1021/TV-20261021-1755-3900.webl.h264.mp4","embed":"","page":"https://www.tagesschau.de/tagesschau_in_einfacher_sprache/video-1670204.html"},"duration":332.56,"sentences":[{"de":"Willkommen zur tagesschau in Einfacher Sprache.","zh":"欢迎收看简易语言《每日新闻》。","start":7.68,"end":10.96},{"de":"Ich bin Susanne Stichler, und das sind unsere Nachrichten:","zh":"我是苏珊娜·施蒂希勒（Susanne Stichler），以下是我们的新闻：","start":11.4,"end":15.4},{"de":"Und nun zur ersten Nachricht.","zh":"现在来看第一条新闻。","start":30.92,"end":33.0},{"de":"Seit vielen Jahren wissen die Menschen:","zh":"很多年以来，人们都知道：","start":38.24,"end":40.96},{"de":"Es gibt einen Klimawandel.","zh":"气候正在发生变化。","start":41.28,"end":43.68},{"de":"Das heißt, auf der Erde wird es wärmer.","zh":"也就是说，地球正在变暖。","start":44.28,"end":47.84},{"de":"Das ist gefährlich für die Natur und für die Menschen.","zh":"这对自然和人类都很危险。","start":48.16,"end":52.6},{"de":"Die meisten Länder auf der Erde sagen deshalb:","zh":"因此，地球上大多数国家都说：","start":52.68,"end":57.16},{"de":"Wir machen etwas gegen den Klimawandel.","zh":"我们要为应对气候变化做点什么。","start":57.6,"end":61.36},{"de":"Es gibt auch ein Ziel:","zh":"还有一个目标：","start":61.92,"end":64.08},{"de":"Die Erde soll nicht 15 Grad wärmer werden.","zh":"地球升温不能超过15度。","start":64.44,"end":69.44},{"de":"Das Ziel gilt bis zum Jahr 2100.","zh":"这个目标的有效期到2100年。","start":69.68,"end":73.92},{"de":"Es ist noch viel Zeit.","zh":"还有很长时间。","start":74.0,"end":77.76},{"de":"Doch jetzt sagen Experten, das Ziel wird nicht erreicht.","zh":"但现在专家们说，这个目标无法实现。","start":78.52,"end":83.4},{"de":"Die Länder machen nämlich zu wenig gegen den Klimawandel.","zh":"因为各国为应对气候变化做得太少了。","start":84.04,"end":89.0},{"de":"Deshalb wird es 28 Grad wärmer.","zh":"因此气温会上升28度。","start":89.64,"end":93.48},{"de":"Das ist weit entfernt von dem Ziel.","zh":"这离目标相差很远。","start":94.4,"end":97.92},{"de":"Und das hat Folgen.","zh":"而这会带来后果。","start":98.48,"end":99.8},{"de":"Experten sagen, es gibt mehr Überschwemmungen und es wird öfter sehr heiß.","zh":"专家们说，洪水会更多，极端炎热的天气也会更频繁。","start":99.88,"end":107.68},{"de":"Und nun zur nächsten Nachricht.","zh":"现在来看下一条新闻。","start":109.2,"end":111.4},{"de":"In mehreren Ländern in Europa gibt es Proteste.","zh":"欧洲多个国家发生了抗议活动。","start":116.92,"end":121.52},{"de":"Die Menschen beschweren sich über die hohen Preise.","zh":"人们抱怨高昂的物价。","start":121.6,"end":126.44},{"de":"Die machen das Leben immer teurer.","zh":"物价让生活越来越贵。","start":127.08,"end":129.8},{"de":"Auch in Italien gehen die Menschen auf die Straße.","zh":"在意大利，人们也走上了街头。","start":130.8,"end":134.56},{"de":"Bei manchen Protesten gibt es Gewalt.","zh":"有些抗议活动中出现了暴力。","start":135.88,"end":139.24},{"de":"Andere Proteste sind friedlich.","zh":"其他抗议活动是和平的。","start":140.48,"end":143.12},{"de":"Zum Beispiel die Proteste von Lastwagenfahrern.","zh":"比如卡车司机的抗议。","start":143.96,"end":148.16},{"de":"Sie streiken.","zh":"他们在罢工。","start":148.24,"end":149.88},{"de":"Dazu kommt jetzt ein Film.","zh":"接下来播放一段影片。","start":150.08,"end":151.92},{"de":"Diese Lastwagen stehen rum.","zh":"这些卡车停着不动。","start":152.84,"end":154.68},{"de":"Sie fahren nicht und transportieren keine Sachen.","zh":"它们不行驶，也不运输货物。","start":154.76,"end":157.76},{"de":"Die Fahrer sind nämlich wütend und protestieren.","zh":"因为司机们很愤怒，正在抗议。","start":157.84,"end":161.2},{"de":"Dieser Mann sagt:","zh":"这位男士说：","start":161.52,"end":162.6},{"de":"Der Diesel ist teuer, Reifen sind teuer, alles ist teuer.","zh":"柴油很贵，轮胎很贵，什么都贵。","start":162.68,"end":166.52},{"de":"Wenn die Lastwagen nicht fahren, spüren das die Menschen im Land.","zh":"如果卡车不运行，国内的人们就会感受到影响。","start":167.0,"end":171.56},{"de":"Die Lastwagen bringen nämlich keinen Sprit zu den Tankstellen.","zh":"因为卡车没有把燃油送到加油站。","start":171.64,"end":175.2},{"de":"Manche Tankstellen können jetzt nichts verkaufen.","zh":"有些加油站现在什么也卖不了。","start":175.28,"end":178.16},{"de":"Und auch andere Sachen werden nicht transportiert.","zh":"其他货物也无法运输。","start":178.24,"end":181.36},{"de":"Zum Beispiel Lebensmittel.","zh":"比如食品。","start":181.44,"end":183.08},{"de":"Viele Supermärkte bekommen keinen Nachschub.","zh":"许多超市得不到补货。","start":183.6,"end":186.28},{"de":"Die Regale und die Fächer sind deshalb leer.","zh":"因此货架和货柜都空了。","start":186.36,"end":189.44},{"de":"Es gibt kein Obst und kein Gemüse, kein frisches Fleisch und keine Milch.","zh":"没有水果和蔬菜，没有新鲜的肉，也没有牛奶。","start":189.68,"end":194.76},{"de":"Diese Frau sagt: Alles ist teuer.","zh":"这位女士说：什么都贵。","start":194.84,"end":197.2},{"de":"Ich habe gestern sogar Wasser gesucht.","zh":"我昨天甚至到处找水。","start":197.4,"end":200.04},{"de":"Dieser Mann sagt: Ich brauche nur ein paar Sachen.","zh":"这位男士说：我只需要几样东西。","start":200.2,"end":203.32},{"de":"Aber ich muss jetzt in mehrere Geschäfte gehen.","zh":"但我现在必须跑好几家商店。","start":203.4,"end":206.16},{"de":"Hoffentlich finde ich noch etwas.","zh":"希望我还能找到一些。","start":206.24,"end":208.16},{"de":"Die Lastwagenfahrer sagen: Wir brauchen Unterstützung.","zh":"卡车司机们说：我们需要支持。","start":208.24,"end":212.04},{"de":"Die Regierung will jetzt helfen.","zh":"政府现在想提供帮助。","start":212.64,"end":214.88},{"de":"Aber die Proteste gehen erst einmal weiter.","zh":"但抗议活动暂时还会继续。","start":214.96,"end":217.96},{"de":"Und nun zur nächsten Nachricht.","zh":"现在来看下一条新闻。","start":218.64,"end":220.84},{"de":"In der Ukraine gibt es seit einigen Jahren Krieg.","zh":"乌克兰已经打了好几年仗。","start":226.4,"end":229.84},{"de":"Russland hat die Ukraine nämlich angegriffen.","zh":"俄罗斯攻击了乌克兰。","start":230.76,"end":234.32},{"de":"Und die Ukraine wehrt sich gegen Russland.","zh":"乌克兰正在抵抗俄罗斯。","start":234.68,"end":237.92},{"de":"Jetzt gibt es neue Gespräche über ein Ende von dem Krieg.","zh":"现在关于结束战争有了新的会谈。","start":238.64,"end":243.68},{"de":"Die Gespräche führt Steve Witkoff.","zh":"会谈由史蒂夫·威特科夫（Steve Witkoff）主持。","start":243.8,"end":247.36},{"de":"Er ist ein Freund von dem Präsidenten von den USA, Donald Trump.","zh":"他是美国总统唐纳德·特朗普的朋友。","start":247.6,"end":254.0},{"de":"Zuerst hat Witkoff den Präsidenten von der Ukraine getroffen, Wolodymyr Selenskyj.","zh":"威特科夫先会见了乌克兰总统弗拉基米尔·泽连斯基。","start":254.08,"end":262.0},{"de":"Danach sagte Witkoff: Die Gespräche waren gut.","zh":"之后威特科夫说：会谈进行得很好。","start":262.68,"end":266.96},{"de":"Es gibt Fortschritte.","zh":"有进展。","start":267.28,"end":268.76},{"de":"Dann ist Witkoff nach Russland geflogen.","zh":"然后威特科夫飞往俄罗斯。","start":268.84,"end":273.04},{"de":"Dort hat er den russischen Präsidenten Wladimir Putin gesprochen.","zh":"在那里他与俄罗斯总统弗拉基米尔·普京进行了交谈。","start":273.4,"end":278.44},{"de":"Das zeigt das Foto.","zh":"照片显示了这一点。","start":279.0,"end":280.48},{"de":"Demnächst soll es ein Treffen zwischen USA, Russland und der Ukraine geben.","zh":"不久之后，美国、俄罗斯和乌克兰之间将举行一次会晤。","start":280.56,"end":288.0},{"de":"Dann wird weiter über einen möglichen Frieden gesprochen.","zh":"届时将继续讨论可能的和平方案。","start":288.56,"end":292.56},{"de":"Das waren unsere Nachrichten:","zh":"以上就是我们的新闻：","start":294.36,"end":296.44},{"de":"Und jetzt kommt das Wetter.","zh":"现在来看天气。","start":311.84,"end":313.76},{"de":"Links im Westen und oben im Norden gibt es Schauer.","zh":"左边的西部和上方的北部有阵雨。","start":314.56,"end":318.12},{"de":"Rechts im Osten und unten im Süden wird es sonnig.","zh":"右边的东部和下方的南部天气晴朗。","start":318.48,"end":322.56},{"de":"Es werden 7 bis 16 Grad.","zh":"气温为7至16度。","start":322.76,"end":325.44},{"de":"Das war die tagesschau in Einfacher Sprache.","zh":"以上就是简易语言《每日新闻》。","start":326.56,"end":329.92},{"de":"Tschüss und bis zum nächsten Mal.","zh":"再见，下次见。","start":330.2,"end":332.56}],"stories":[{"title":"Begrüßung","title_zh":"欢迎","from":0,"to":2,"vocab":[],"grammar":[],"background":""},{"title":"Klimawandel: Erderwärmung droht deutlich stärker auszufallen","title_zh":"气候变化：全球变暖可能明显加剧","from":3,"to":18,"v
