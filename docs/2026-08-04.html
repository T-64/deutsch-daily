    <div id="root"></div>
    <script id="dd-data" type="application/json">{"page":"lesson","lesson":{"slug":"2026-08-04","date":"2026-08-04","show":"tagesschau in Einfacher Sprache","level":"A2–B1","kind":"video","note":"","source_url":"https://www.tagesschau.de/tagesschau_in_einfacher_sprache/video-1625858.html","video":{"mp4":"https://tagesschau-progressive.ard-mcdn.de/video/2026/0804/TV-20260804-1652-4900.webl.h264.mp4","embed":"https://www.tagesschau.de/tagesschau_in_einfacher_sprache/video-1625858~player.html","page":"https://www.tagesschau.de/tagesschau_in_einfacher_sprache/video-1625858.html"},"duration":574.66,"sentences":[{"de":"Und nun zur ersten Nachricht.","zh":"现在播报第一条新闻。","start":42.01,"end":56.75},{"de":"EU-Innenminister. Beratungen über Ceuta.","zh":"欧盟内政部长就休达问题进行磋商。","start":119.89,"end":204.19},{"de":"Ceuta ist eine Stadt an der Grenze zu dem Land Marokko im Norden von Afrika. Ceuta gehört aber zu Spanien in Europa.","zh":"休达是位于非洲北部摩洛哥边境的一座城市，但属于欧洲的西班牙。","start":null,"end":null},{"de":"Manche Menschen aus Afrika wollen in Europa leben. Deshalb wollen sie nach Ceuta.","zh":"一些来自非洲的人想在欧洲生活，因此想去休达。","start":null,"end":null},{"de":"Zuletzt sind dort viele tausend Migranten über die Grenze gekommen.","zh":"最近数千名移民越境涌入。","start":null,"end":null},{"de":"Es gab nämlich falsche Informationen in den sozialen Medien. Dort stand, die Grenze ist offen.","zh":"原因是社交媒体上的虚假信息声称\"边境开放\"。","start":null,"end":null},{"de":"Verbrecher haben den Migranten dann geholfen, über die Grenze zu kommen.","zh":"犯罪分子帮助移民越境，过程中多人死亡。","start":null,"end":null},{"de":"Dabei sind viele von den Migranten gestorben. Die meisten Migranten sind jetzt wieder nach Marokko zurückgekehrt.","zh":"大多数移民现已返回摩洛哥。","start":null,"end":null},{"de":"Die Innenminister von der EU, also von der Europäischen Union, haben beraten. Was können wir aus dem Ereignis in Ceuta lernen?","zh":"欧盟内政部长们商议：能从休达事件中学到什么？","start":null,"end":null},{"de":"Das ist der Chef für Migration in der EU. Er heißt Magnus Brunner. Er sagt: Wir haben einen Plan gemacht. Wir wollen Migration stärker verhindern.","zh":"欧盟移民事务负责人马格努斯·布伦纳说：我们制定了计划，要更有效地阻止移民。","start":null,"end":null},{"de":"Und wenn Migranten ohne Erlaubnis über die Grenze kommen, dann wollen wir sie schnell wieder zurückbringen in die Länder außerhalb von der EU.","zh":"未经许可越境者将被迅速遣返至欧盟以外的国家。","start":null,"end":null},{"de":"Und wir wollen die Grenze von der EU besser sichern.","zh":"同时加强边境安全。","start":null,"end":null},{"de":"Magnus Brunner sagt auch: Wir wollen die sozialen Medien stärker beobachten.","zh":"布伦纳还说：要加强对社交媒体的监控，","start":null,"end":null},{"de":"Wenn es dort falsche Informationen gibt, dann wollen wir sie schnell berichtigen.","zh":"及时纠正虚假信息，","start":null,"end":null},{"de":"Damit verhindern wir, dass zu viele Migranten kommen.","zh":"防止过多移民涌入。","start":null,"end":null},{"de":"Und wir wollen die Verbrecher besser überwachen, damit sie keine Migranten mehr über die Grenze bringen können.","zh":"还要更好监控犯罪分子。","start":null,"end":null},{"de":"Und nun zur nächsten Nachricht.","zh":"现在播报下一条新闻。","start":205.01,"end":214.01},{"de":"Familienministerium. Pläne für Zivildienst.","zh":"家庭部规划民事役。","start":214.87,"end":225.63},{"de":"In Deutschland gab es früher Zivildienst, als es auch Wehrpflicht gab.","zh":"德国以前有兵役制时也有民事役。","start":240.05,"end":277.03},{"de":"Wehrpflicht war: Junge Männer mussten für eine bestimmte Zeit zum Militär.","zh":"兵役制：年轻男性必须在军队服役一段时间。","start":null,"end":null},{"de":"Zivildienst war: Wer nicht zum Militär wollte, der musste andere Aufgaben machen.","zh":"民事役：不想去军队的人必须完成其他任务，","start":null,"end":null},{"de":"Zum Beispiel im Krankenhaus oder in der Kita arbeiten.","zh":"比如在医院或托儿所工作。","start":null,"end":null},{"de":"Jetzt sagt das Familienministerium: Wenn es die Wehrpflicht wieder gibt, dann brauchen wir auch wieder Zivildienst.","zh":"现在家庭部表示：如果恢复兵役制，也需要恢复民事役。","start":414.92,"end":456.86},{"de":"Viele Organisationen haben schon gesagt: Wir können Zivildienstleistende nehmen.","zh":"许多机构已经表示可以接收民事役人员。","start":null,"end":null},{"de":"Und das Familienministerium sagt: Solange es aber keine Wehrpflicht in Deutschland gibt, solange gibt es auch keinen Zivildienst.","zh":"但家庭部强调：只要没有兵役制，就不会有民事役。","start":null,"end":null},{"de":"Und nun zur nächsten Nachricht.","zh":"现在播报下一条新闻。","start":null,"end":null},{"de":"Kuba.","zh":"古巴。","start":null,"end":null},{"de":"Stromausfall.","zh":"停电。","start":null,"end":null},{"de":"Das Land Kuba ist eine Insel. Sie liegt in der Karibik. Das ist das Meer zwischen Nord- und Südamerika.","zh":"古巴是位于加勒比海的岛国——南北美洲之间的海域。","start":null,"end":null},{"de":"In Kuba fällt der Strom oft aus. Jetzt sind die Menschen wieder ohne Strom.","zh":"古巴经常停电，现在再次陷入断电。","start":null,"end":null},{"de":"Das ist die Hauptstadt von Kuba, Havanna.","zh":"这是古巴首都哈瓦那，","start":null,"end":null},{"de":"Der Strom ist wieder ausgefallen.","zh":"电又停了，","start":null,"end":null},{"de":"Das macht das Leben schwierig.","zh":"生活变得困难。","start":null,"end":null},{"de":"Die Menschen hier kennen das Problem schon.","zh":"这里的人们已习惯了这个困境。","start":null,"end":null},{"de":"Dieser Mann sagt: Der Strom fällt jeden Tag aus.","zh":"一位男子说：电每天都停，","start":null,"end":null},{"de":"Manchmal haben wir Strom für anderthalb Stunden, für drei oder vier Stunden.","zh":"有时有电一个半小时、三四小时，","start":null,"end":null},{"de":"Und dann ist der Strom wieder weg.","zh":"然后又断了，","start":null,"end":null},{"de":"Ein, zwei, oder drei Tage lang.","zh":"持续一两三天。","start":null,"end":null},{"de":"Das gibt es nirgendwo sonst auf der Welt.","zh":"这在世界其他地方都不存在。","start":null,"end":null},{"de":"Und wir bitten nur um ein wenig Strom für den Kühlschrank, damit unser Essen frisch bleibt.","zh":"我们只求一点点电来运转冰箱保鲜食物。","start":null,"end":null},{"de":"Die Leitungen für Strom in Kuba sind schon sehr alt. Und es gibt zu wenig Öl für die Maschinen, die Strom produzieren.","zh":"古巴的电力线路已经老化，发电机组也缺燃油。","start":null,"end":null},{"de":"Die Regierung von Kuba sagt: Daran sind die USA schuld. Sie blockieren Lieferungen von Öl nach Kuba. Deshalb ist unsere Wirtschaft schwach.","zh":"政府说这要怪美国——他们封锁了石油运输，所以经济疲弱。","start":null,"end":null},{"de":"Auch für den Verkehr gibt es keinen Strom.","zh":"交通也受影响，","start":null,"end":null},{"de":"Die Ampeln sind aus.","zh":"红绿灯全灭。","start":null,"end":null},{"de":"Und es gibt noch ein Problem: Es ist gerade sehr heiß in Kuba.","zh":"还有一个问题：古巴现在很热，","start":null,"end":null},{"de":"Die Menschen haben aber zu wenig Strom für den Ventilator, ein Gerät, das die Luft kühl macht.","zh":"但人们没有足够的电运转风扇。","start":null,"end":null},{"de":"Manche Menschen schlafen deshalb draußen am Wasser.","zh":"有些人因此睡在户外水边。","start":null,"end":null},{"de":"Und nun zur nächsten Nachricht.","zh":"现在播报下一条新闻。","start":null,"end":null},{"de":"USA.","zh":"美国。","start":null,"end":null},{"de":"Waldbrände.","zh":"山火。","start":570.16,"end":574.66},{"de":"Im Westen von den USA ist es gerade sehr heiß und trocken.","zh":"美国西部目前酷热干燥。","start":null,"end":null},{"de":"Wenn ein Funke, also ein sehr kleines, heißes Teil, auf den trockenen Boden fliegt, dann kann ein großes Feuer entstehen.","zh":"一颗火星——极小极热的颗粒——飞到干燥地面上就可能引发大火。","start":null,"end":null},{"de":"Das ist in der Nähe von der Stadt Spokane passiert. Dort brennen die Wälder. Es gibt mehrere Feuer, auch in der Stadt Spokane.","zh":"斯波坎市附近发生了这种情况，森林和城区多处燃烧。","start":null,"end":null},{"de":"Das ist Kami Fejlik. Sie wohnt mit ihrer Familie in der Stadt Spokane.","zh":"卡米·费吉利克和家人住在斯波坎，大火摧毁了她的房子。","start":null,"end":null},{"de":"Das Feuer hat ihr Haus zerstört. Kami Fejlik sagt: Wir haben hier einen Fluss in der Nähe.","zh":"她说：附近有河，没想到火能烧过河。","start":null,"end":null},{"de":"Wir haben nicht gedacht, dass das Feuer über den Fluss kommt. Der Wind hat das Feuer aber über den Fluss gebracht.","zh":"但风把火吹过来了。","start":null,"end":null},{"de":"Ich habe wichtige Fotos eingepackt. Von der Hochzeit, von den Kindern.","zh":"我收拾了结婚照、孩子的照片，带上宠物和粮食开车离开。","start":null,"end":null},{"de":"Wir haben die Haustiere und Futter für sie genommen und sind mit dem Auto weggefahren. Eine halbe Stunde später war das Feuer hier.","zh":"半小时后火就到了。","start":null,"end":null},{"de":"Hunderte Häuser sind verbrannt.","zh":"数百栋房屋被毁，四千人被迫逃离。","start":null,"end":null},{"de":"Viertausend Menschen mussten vor dem Feuer fliehen.","zh":"科学家称这是该地区最严重的自然灾难。","start":null,"end":null},{"de":"Wissenschaftler sagen: Es ist die schlimmste Katastrophe für die Natur in dieser Region.","zh":"气候变化让地球越来越热，","start":null,"end":null},{"de":"Der Klimawandel macht die Erde immer wärmer und die Brände immer schlimmer.","zh":"火灾越来越严重。","start":null,"end":null},{"de":"In Spokane gibt es aber noch einen anderen Grund für das Feuer. Dieser Polizist sagt: Wir haben einen Mann festgenommen. Er war 37 Jahre alt und war schon einmal im Gefängnis.","zh":"斯波坎火灾还有一个原因。","start":null,"end":null},{"de":"Ein anderer Mann hat gesehen, wie der 37 Jahre alte Mann sich ins Gras gebückt hat.","zh":"警方逮捕了一名37岁有前科的男子——有人看到他弯腰趴到草地上，不久后草就着火了。","start":null,"end":null},{"de":"Kurze Zeit später hat das Gras gebrannt. Wir denken, das war Brandstiftung. Die Polizei untersucht den Fall jetzt genau.","zh":"警方认为是纵火，正在深入调查。","start":null,"end":null}],"stories":[{"title":"EU-Innenminister beraten über Ceuta","title_zh":"欧盟内政部长磋商休达问题","from":0,"to":15,"vocab":[{"key":"grenze","lemma":"die Grenze","pos":"","zh":"边境","example_de":"Ceuta ist eine Stadt an der Grenze zu dem Land Marokko im Norden von Afrika.","example_zh":""},{"key":"migrant","lemma":"der Migrant","pos":"","zh":"移民","example_de":"Die meisten Migranten sind zurückgekehrt.","example_zh":""},{"key":"verhindern","lemma":"verhindern","pos":"Verb","zh":"阻止","example_de":"Wir wollen Migration stärker verhindern.","example_zh":""},{"key":"erlaubnis","lemma":"die Erlaubnis","pos":"","zh":"许可","example_de":"Und wenn Migranten ohne Erlaubnis über die Grenze kommen, dann wollen wir sie schnell wieder zurückbringen in die Länder außerhalb von der EU.","example_zh":""},{"key":"berichtigen","lemma":"berichtigen","pos":"Verb","zh":"纠正","example_de":"Wenn es dort falsche Informationen gibt, dann wollen wir sie schnell berichtigen.","example_zh":""},{"key":"überwachen","lemma":"überwachen","pos":"Verb","zh":"监控","example_de":"Und wir wollen die Verbrecher besser überwachen, damit sie keine Migranten mehr über die Grenze bringen können.","example_zh":""},{"key":"zurückkehren","lemma":"zurückkehren","pos":"Verb","zh":"返回","example_de":"Sie sind nach Marokko zurückgekehrt.","example_zh":""}],"grammar":[{"title":"语法：damit（以便）","summary":"语法：damit（以便） 主语不同时用 damit 引导目的从句，动词放句末： Wir überwachen die Verbrecher, damit sie keine Migranten mehr bringen können. 主语相同则用 um ... zu。","example_de":"","example_zh":""}],"background":"背景：休达是西班牙在北非的飞地，与摩洛哥接壤。2026年初社交媒体虚假信息煽动大量移民涌入，犯罪集团组织偷渡致多人死亡。欧盟紧急会议讨论加强边境管控、打击人口贩运。"},{"title":"Familienministerium: Pläne für Zivildienst","title_zh":"家庭部：公民役计划","from":16,"to":24,"vocab":[{"key":"wehrpflicht","lemma":"die Wehrpflicht","pos":"","zh":"兵役制","example_de":"In Deutschland gab es früher Zivildienst, als es auch Wehrpflicht gab.","example_zh":""},{"key":"zivildienst","lemma":"der Zivildienst","pos":"","zh":"民事役","example_de":"Pläne für Zivildienst.","example_zh":""},{"key":"militär","lemma":"das Militär","pos":"","zh":"军队","example_de":"Wehrpflicht war: Junge Männer mussten für eine bestimmte Zeit zum Militär.","example_zh":""},{"key":"kita","lemma":"die Kita","pos":"","zh":"托儿所","example_de":"Zum Beispiel im Krankenhaus oder in der Kita arbeiten.","example_zh":""},{"key":"solange","lemma":"solange","pos":"","zh":"只要","example_de":"Und das Familienministerium sagt: Solange es aber keine Wehrpflicht in Deutschland gibt, solange gibt es auch keinen Zivildienst.","example_zh":""}],"grammar":[{"title":"语法：solange（只要）","summary":"语法：solange（只要） 表示\"在……期间一直\"，引导条件从句，动词在句末： Solange es keine Wehrpflicht gibt, solange gibt es auch keinen Zivildienst. 两个 solange 连用，前后呼应。","example_de":"在……期间一直","example_zh":""}],"background":"背景：德国2011年暂停义务兵役制，民事役同步取消。近年来欧洲安全局势变化引发恢复兵役讨论。家庭部表态意味着民事役将随兵役制同步恢复。"},{"title":"Kuba: Stromausfall","title_zh":"古巴：停电","from":25,"to":46,"vocab":[{"key":"stromausfall","lemma":"der Stromausfall","pos":"","zh":"停电","example_de":"Stromausfall.","example_zh":""},{"key":"ausfallen","lemma":"ausfallen","pos":"Verb","zh":"停止运转","example_de":"Der Strom fällt jeden Tag aus.","example_zh":""},{"key":"insel","lemma":"die Insel","pos":"","zh":"岛屿","example_de":"Das Land Kuba ist eine Insel.","example_zh":""},{"key":"ampel","lemma":"die Ampel","pos":"","zh":"红绿灯","example_de":"Die Ampeln sind aus.","example_zh":""},{"key":"ventilator","lemma":"der Ventilator","pos":"","zh":"风扇","example_de":"Die Menschen haben aber zu wenig Strom für den Ventilator, ein Gerät, das die Luft kühl macht.","example_zh":""},{"key":"kühlschrank","lemma":"der Kühlschrank","pos":"","zh":"冰箱","example_de":"Und wir bitten nur um ein wenig Strom für den Kühlschrank, damit unser Essen frisch bleibt.","example_zh":""},{"key":"blockieren","lemma":"blockieren","pos":"Verb","zh":"封锁","example_de":"Sie blockieren Lieferungen von Öl nach Kuba.","example_zh":""}],"grammar":[{"title":"语法：可分动词 ausfallen","summary":"语法：可分动词 ausfallen aus（停止）+ fallen（落下）= 中断运转： Der Strom fällt（现在时，前缀到句末） Der Strom ist ausgefallen（完成时，用 sein 作助动词）","example_de":"","example_zh":""}],"background":"背景：古巴长期面临能源危机——基础设施老化、燃油短缺、美国自1960年代的贸易禁运。2026年夏季高温加剧困境，停电成为日常。政府归咎美国封锁，美国指古巴经济管理失败。"},{"title":"Waldbrände in den USA","title_zh":"美国林火","from":47,"to":64,"vocab":[{"key":"waldbrand","lemma":"der Waldbrand","pos":"","zh":"山火","example_de":"Schwere Waldbrände in den USA.","example_zh":""},{"key":"funke","lemma":"der Funke","pos":"","zh":"火星","example_de":"Wenn ein Funke, also ein sehr kleines, heißes Teil, auf den trockenen Boden fliegt, dann kann ein großes Feuer entstehen.","example_zh":""},{"key":"trocken","lemma":"trocken","pos":"Verb","zh":"干燥的","example_de":"Im Westen von den USA ist es gerade sehr heiß und trocken.","example_zh":""},{"key":"fliehen","lemma":"fliehen","pos":"Verb","zh":"逃离","example_de":"Viertausend Menschen mussten vor dem Feuer
