<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Deutsch Daily — 2026-09-02</title>
<style>
  :root {
    --bg: #eef2f0;
    --surface: #ffffff;
    --surface-2: #f7f9f8;
    --ink: #172127;
    --ink-soft: #647077;
    --line: #dce4e1;
    --accent: #176b72;
    --accent-strong: #0d5057;
    --accent-soft: #dceeed;
    --warm: #d98f39;
    --warm-soft: #fff0d9;
    --zh: #5f696f;
    --danger: #b3493f;
    --shadow: 0 18px 50px rgba(20, 46, 47, .10);
    --shadow-soft: 0 8px 24px rgba(20, 46, 47, .07);
  }
  [data-theme="dark"] {
    --bg: #111719; --surface: #192124; --surface-2: #202a2d;
    --ink: #edf3f1; --ink-soft: #a9b7b8; --line: #344145;
    --accent: #75cbd0; --accent-strong: #99dfe2; --accent-soft: #223e40;
    --warm: #f0b35e; --warm-soft: #3b3022; --zh: #bac5c5;
    --shadow: 0 18px 50px rgba(0,0,0,.28); --shadow-soft: 0 8px 24px rgba(0,0,0,.22);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { scroll-behavior: smooth; scroll-padding-top: 90px; }
  body {
    min-height: 100vh; background: var(--bg); color: var(--ink);
    font: 16px/1.65 Inter, ui-sans-serif, system-ui, -apple-system, "Noto Sans SC", sans-serif;
    transition: background .2s, color .2s;
  }
  button, input, textarea { font: inherit; }
  button, a { -webkit-tap-highlight-color: transparent; }
  button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible {
    outline: 3px solid color-mix(in srgb, var(--accent) 35%, transparent); outline-offset: 2px;
  }
  .app { width: min(1280px, calc(100% - 48px)); margin: 0 auto; padding: 24px 0 100px; }
  .topbar {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    min-height: 42px; margin-bottom: 34px;
  }
  .brand {
    display: inline-flex; align-items: center; gap: 10px; color: var(--ink);
    font-weight: 800; letter-spacing: -.02em; text-decoration: none;
  }
  .brand-mark {
    display: grid; place-items: center; width: 30px; height: 30px; border-radius: 9px;
    background: var(--accent); color: #fff; font: 800 12px/1 ui-monospace, monospace;
  }
  .top-actions { display: flex; align-items: center; gap: 8px; }
  .icon-btn, .archive-link, .text-btn {
    min-height: 38px; border: 1px solid var(--line); border-radius: 12px;
    background: var(--surface); color: var(--ink-soft); cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; text-decoration: none;
  }
  .icon-btn { width: 38px; }
  .archive-link, .text-btn { gap: 7px; padding: 0 13px; font-size: 13px; font-weight: 700; }
  .hero { margin-bottom: 26px; }
  .eyebrow {
    color: var(--accent); font-size: 12px; font-weight: 800; letter-spacing: .12em;
    text-transform: uppercase; margin-bottom: 9px;
  }
  .hero h1 {
    max-width: 720px; font: 750 clamp(29px, 4vw, 50px)/1.08 ui-serif, Georgia, serif;
    letter-spacing: -.04em;
  }
  .hero-meta { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 13px; color: var(--ink-soft); font-size: 14px; }
  .hero-meta span { display: inline-flex; align-items: center; gap: 7px; }

  .study-grid { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: clamp(20px, 3.2vw, 48px); align-items: start; }
  .side {
    position: sticky; top: 16px; max-height: calc(100vh - 24px);
    display: flex; flex-direction: column; min-height: 0;
  }
  .study-panel {
    display: flex; flex-direction: column; gap: 16px; min-height: 0; max-height: calc(100vh - 24px);
    background: transparent; border: 0; box-shadow: none; overflow: visible;
  }
  .video-card {
    position: relative; flex: 0 0 auto; overflow: hidden; background: #071012;
    border-radius: 24px; box-shadow: var(--shadow-soft);
  }
  .player { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #071012; }
  .player iframe, .player video { position: absolute; inset: 0; display: block; width: 100%; height: 100%; border: 0; background: #071012; }
  .video-drag {
    display: none; position: absolute; z-index: 3; top: 0; left: 0; right: 36px; height: 32px;
    cursor: grab; touch-action: none;
    background: linear-gradient(to bottom, rgba(0,0,0,.5), transparent);
  }
  .video-drag:active { cursor: grabbing; }
  .video-float-close {
    display: none; border: 0; background: rgba(255,255,255,.14); color: #fff;
    width: 28px; height: 28px; border-radius: 50%; cursor: pointer;
  }
  .rail {
    display: flex; flex-direction: column; flex: 1; min-height: 0;
    padding: 18px 18px 16px; border: 1px solid var(--line); border-radius: 24px;
    background: var(--surface); box-shadow: var(--shadow-soft); overflow: hidden;
  }
  .rail-bar { padding: 0 0 12px; }
  .controls { display: flex; width: 100%; }
  .controls button {
    flex: 1; min-height: 40px; padding: 0 14px; border: 1px solid var(--line); border-radius: 12px;
    background: var(--surface-2); color: var(--ink-soft); cursor: pointer; font-size: 14px; font-weight: 750;
  }
  .controls button.on { border-color: var(--accent); background: var(--accent); color: #fff; }
  .hero-meta a { color: var(--accent); text-decoration: none; font-weight: 700; }
  .hero-meta a:hover { text-decoration: underline; }
  .topic-nav { flex: 1; min-height: 0; overflow-y: auto; padding: 0; scrollbar-gutter: stable; }
  .topic { border-top: 1px solid var(--line); }
  .topic:first-child { border-top: 0; }
  .topic > a {
    display: grid; grid-template-columns: 32px minmax(0,1fr); gap: 10px; align-items: start;
    padding: 11px 0; color: var(--ink); text-decoration: none;
  }
  .topic > a span {
    min-width: 0; padding-top: 5px;
    font: 650 15px/1.35 ui-serif, Georgia, serif; letter-spacing: -.015em;
  }
  .topic > a:hover span { color: var(--accent); }
  .topic b {
    display: grid; place-items: center; width: 32px; height: 32px; border-radius: 10px;
    background: var(--accent-soft); color: var(--accent-strong);
    font: 800 11px/1 ui-monospace, monospace;
  }
  .topic.on b { background: var(--accent); color: #fff; }
  .topic.on > a span { color: var(--accent-strong); }
  .topic-study { display: none; padding: 0 0 12px; }
  .topic.on .topic-study { display: block; }
  .topic-study .empty-study { color: var(--ink-soft); font-size: 13px; padding: 6px 0; }
  .study-tabs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-top: 2px; }
  .study-tabs.n2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .study-tabs.n1 { grid-template-columns: 1fr; }
  .stab {
    min-height: 32px; padding: 0 6px; border: 1px solid var(--line); border-radius: 11px;
    background: var(--surface-2); color: var(--ink-soft); cursor: pointer;
    font-size: 12px; font-weight: 750;
  }
  .stab:hover { border-color: var(--accent); color: var(--accent-strong); }
  .stab.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-strong); }
  .spane { display: none; margin-top: 6px; }
  .spane.on { display: block; }
  .vrow {
    display: grid; grid-template-columns: minmax(0,1fr) 28px; gap: 8px; align-items: start;
    padding: 10px 0; border-top: 1px dashed var(--line);
  }
  .vrow .vw { color: var(--ink); font: 750 14.5px/1.35 ui-serif, Georgia, serif; }
  .vrow .vz { margin-top: 4px; color: var(--accent-strong); font-size: 13.5px; }
  .vrow .vex { margin-top: 6px; color: var(--ink-soft); font-size: 13px; font-style: italic; }
  .vadd {
    width: 28px; height: 28px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--surface); color: var(--accent-strong); cursor: pointer;
    font: 700 18px/1 ui-sans-serif, system-ui;
  }
  .vadd:hover { border-color: var(--accent); background: var(--accent-soft); }
  .rail-note { margin: 0; padding: 10px 0; color: var(--ink-soft); font-size: 13.5px; line-height: 1.7; }
  .rail-note + .rail-note { border-top: 1px dashed var(--line); }
  .rail-note strong { display: block; margin-bottom: 4px; color: var(--ink); font: 750 14.5px/1.35 ui-serif, Georgia, serif; }
  .rail-note i { display: block; margin-bottom: 6px; }
  @media (min-width: 841px) { .article-extras { display: none; } }

  .reader { min-width: 0; }
  .first-run {
    display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 16px; align-items: start;
    margin-bottom: 16px; padding: 16px 18px; border: 1px solid var(--line); border-radius: 16px;
    background: var(--accent-soft); color: var(--ink-soft); font-size: 13.5px;
  }
  .first-run[hidden] { display: none; }
  .first-run strong { display: block; margin-bottom: 3px; color: var(--accent-strong); }
  .first-run button { border: 0; background: transparent; color: var(--ink-soft); cursor: pointer; font-weight: 800; }
  .legend { color: var(--ink-soft); }
  article {
    scroll-margin-top: 24px; margin-bottom: 22px; padding: clamp(22px, 4vw, 38px);
    border: 1px solid var(--line); border-radius: 24px; background: var(--surface);
    box-shadow: var(--shadow-soft);
  }
  .n-head { display: grid; grid-template-columns: 42px minmax(0,1fr); gap: 13px; align-items: start; margin-bottom: 24px; }
  .n-idx {
    display: grid; place-items: center; width: 42px; height: 42px; border-radius: 13px;
    background: var(--accent-soft); color: var(--accent-strong); font: 800 13px/1 ui-monospace, monospace;
  }
  .n-head h2, .h-zh {
    padding-top: 3px;
    color: var(--ink);
    font: 750 clamp(21px, 3vw, 28px)/1.25 ui-serif, Georgia, "Noto Serif CJK SC", "Noto Serif SC", serif;
    letter-spacing: -.025em;
  }
  .h-zh { margin-top: 6px; padding-top: 0; }
  .para { display: flex; flex-direction: column; align-items: stretch; margin-bottom: 22px; }
  .para:last-child { margin-bottom: 8px; }
  .sent {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    width: 100%;
    min-width: 0;
    margin: 0 0 0.8em;
  }
  .sent[data-start] { cursor: pointer; }
  .de {
    max-width: 100%;
    font: var(--reader-size, 18.5px)/1.55 ui-serif, Georgia, "Noto Serif", serif;
    letter-spacing: .003em;
  }
  .de w {
    cursor: pointer; border-radius: 4px; transition: background .12s, color .12s;
    text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px;
    text-decoration-color: transparent;
  }
  .de w:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; background: var(--accent-soft); }
  .de w:hover, .de w:active { background: var(--warm-soft); text-decoration-color: var(--warm); }
  .de w.known { text-decoration-color: color-mix(in srgb, var(--accent) 55%, transparent); }
  .de w.ed { text-decoration-style: solid; text-decoration-thickness: 1.5px; }
  .de w.wiki { text-decoration-style: dotted; text-decoration-color: color-mix(in srgb, var(--ink-soft) 55%, transparent); }
  .de w.saved { color: var(--accent-strong); background: var(--accent-soft); text-decoration-color: transparent; }
  .sent.now .de {
    background: color-mix(in srgb, var(--accent-soft) 70%, transparent);
    border-radius: 4px;
  }
  .zh {
    margin-top: 3px;
    width: 100%;
    max-width: 100%;
    color: var(--ink);
    font: 400 15.5px/1.45 Inter, ui-sans-serif, "Noto Sans SC", sans-serif;
  }
  body.hide-zh .zh { display: none; }
  body.hide-zh .para { display: block; }
  body.hide-zh .sent { display: inline; width: auto; margin: 0 0.45em 0 0; }
  body.hide-zh .sent .de { display: inline; line-height: 1.82; }
  .n-head .h-zh {
    margin-top: 6px;
    padding-top: 0;
    color: var(--ink);
    font: 750 clamp(21px, 3vw, 28px)/1.25 ui-serif, Georgia, "Noto Serif CJK SC", "Noto Serif SC", serif;
    letter-spacing: -.025em;
  }
  .article-extras details { margin-top: 10px; border: 1px solid var(--line); border-radius: 13px; background: var(--surface-2); }
  .article-extras details summary {
    list-style: none; cursor: pointer; padding: 12px 14px; color: var(--ink-soft);
    display: flex; align-items: center; gap: 9px; font-size: 13px; font-weight: 750;
  }
  .article-extras details summary::before {
    content: "+"; display: inline-grid; place-items: center; width: 20px; height: 20px;
    border-radius: 7px; background: var(--surface); color: var(--accent); font-size: 14px;
  }
  .article-extras details[open] summary::before { content: "−"; }
  .article-extras details summary::-webkit-details-marker { display: none; }
  .article-extras details .body { padding: 2px 14px 15px 43px; color: var(--ink-soft); font-size: 13.5px; line-height: 1.75; }
  .article-extras details .body strong { color: var(--ink); }
  .vcard { display: grid; grid-template-columns: minmax(0,1fr) 28px; gap: 8px; align-items: start; padding: 10px 0; border-bottom: 1px dashed var(--line); }
  .vcard:last-child { border-bottom: 0; }
  .gcard { padding: 12px 0; border-bottom: 1px dashed var(--line); }
  .gcard:last-child { border-bottom: 0; }
  .vcard-top, .gcard h4 { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px; font: 750 14.5px/1.35 ui-serif, Georgia, serif; color: var(--ink); }
  .article-extras .vadd {
    width: 28px; height: 28px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--surface); color: var(--accent-strong); cursor: pointer;
    font: 700 18px/1 ui-sans-serif, system-ui;
  }
  .vpos { color: var(--ink-soft); font: 750 11px/1.2 ui-sans-serif, system-ui; letter-spacing: .06em; text-transform: uppercase; }
  .vzh { margin-top: 4px; color: var(--accent-strong); font-size: 13.5px; }
  .vex, .gex { margin-top: 6px; color: var(--ink-soft); font-size: 13px; font-style: italic; }
  .gexzh { color: var(--zh); font-size: 12.5px; }
  .gmore { margin-top: 8px; color: var(--ink-soft); font-size: 13px; }
  .bg-note { margin: 0 0 8px; color: var(--ink-soft); font-size: 12px; }

  .scrim { position: fixed; inset: 0; z-index: 55; display: none; background: rgba(7,16,18,.48); backdrop-filter: blur(3px); }
  .scrim.on { display: block; }
  #pop {
    position: fixed; z-index: 70; display: none; width: min(360px, calc(100vw - 24px));
    border: 1px solid var(--line); border-radius: 18px; padding: 18px;
    background: var(--surface); color: var(--ink); box-shadow: var(--shadow);
  }
  #pop.open { display: block; }
  .pop-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  #pop .pw { font: 750 21px/1.2 ui-serif, Georgia, serif; word-break: break-word; }
  #pop .pp { margin-top: 3px; color: var(--ink-soft); font-size: 11px; font-weight: 750; letter-spacing: .08em; text-transform: uppercase; }
  #pop .pclose { border: 0; background: var(--surface-2); color: var(--ink-soft); width: 30px; height: 30px; border-radius: 9px; cursor: pointer; }
  #pop .pz { margin-top: 12px; color: var(--accent-strong); font-weight: 700; }
  #pop .pz:empty::after { content: "还没有释义，你可以自己补充"; color: var(--ink-soft); font-weight: 400; }
  #pop .pe { margin-top: 9px; padding-top: 9px; border-top: 1px solid var(--line); color: var(--ink-soft); font-size: 12.5px; font-style: italic; }
  .pop-actions { display: flex; gap: 8px; margin-top: 14px; }
  .pbtn, .secondary-btn, .primary-btn {
    min-height: 40px; border-radius: 11px; padding: 0 13px; cursor: pointer; font-size: 13px; font-weight: 750;
  }
  .pbtn { flex: 1; border: 1px solid var(--accent); background: var(--accent); color: #fff; }
  .pbtn.in { border-color: var(--line); background: var(--surface-2); color: var(--ink-soft); }
  .secondary-btn { border: 1px solid var(--line); background: var(--surface); color: var(--ink-soft); }
  .primary-btn { border: 1px solid var(--accent); background: var(--accent); color: #fff; }
  .word-form { display: grid; gap: 11px; }
  .word-form label { display: grid; gap: 5px; color: var(--ink-soft); font-size: 12px; font-weight: 700; }
  .word-form input, .word-form textarea {
    width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px;
    background: var(--surface-2); color: var(--ink); resize: vertical;
  }
  .word-form textarea { min-height: 66px; }
  .form-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 3px; }

  #basket-btn {
    position: fixed; right: 22px; bottom: max(22px, env(safe-area-inset-bottom)); z-index: 45;
    display: inline-flex; align-items: center; gap: 9px; min-height: 48px; padding: 0 18px;
    border: 0; border-radius: 15px; background: var(--ink); color: var(--surface);
    box-shadow: var(--shadow); cursor: pointer; font-weight: 800;
  }
  #basket-btn .cnt { min-width: 23px; padding: 2px 7px; border-radius: 99px; background: var(--warm); color: #172127; font-size: 12px; }
  #basket {
    position: fixed; inset: 0 0 0 auto; z-index: 65; width: min(440px, 100vw);
    display: flex; flex-direction: column; padding: 24px 24px calc(24px + env(safe-area-inset-bottom));
    background: var(--surface); box-shadow: -20px 0 60px rgba(7,16,18,.18);
    transform: translateX(105%); transition: transform .22s ease;
  }
  #basket.open { transform: translateX(0); }
  #basket .bhead { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 16px; }
  #basket .bhead h3 { font-size: 22px; letter-spacing: -.02em; }
  #basket .bhead p { margin-top: 2px; color: var(--ink-soft); font-size: 12.5px; }
  #basket .bclose { border: 0; background: var(--surface-2); color: var(--ink-soft); width: 36px; height: 36px; border-radius: 11px; font-size: 20px; cursor: pointer; }
  .basket-add { width: 100%; margin-bottom: 12px; }
  #basket .blist { overflow-y: auto; flex: 1; padding-right: 4px; }
  .bitem { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 5px 10px; padding: 13px 0; border-bottom: 1px solid var(--line); }
  .bitem .bw { font: 750 16px/1.3 ui-serif, Georgia, serif; }
  .bitem .bz { grid-column: 1; color: var(--accent-strong); font-size: 13px; }
  .bitem .be { grid-column: 1; overflow: hidden; color: var(--ink-soft); font-size: 11.5px; text-overflow: ellipsis; white-space: nowrap; }
  .bitem-actions { grid-column: 2; grid-row: 1 / span 3; align-self: center; display: flex; gap: 3px; }
  .bitem-actions button { border: 0; background: transparent; color: var(--ink-soft); padding: 7px; cursor: pointer; font-size: 12px; }
  .bitem-actions .bx { color: var(--danger); }
  #basket .bfoot { display: flex; gap: 8px; margin-top: 14px; }
  #basket .bfoot button { flex: 1; }
  #basket .bfoot button:disabled { opacity: .5; cursor: wait; }
  #basket .bstatus { min-height: 18px; margin-top: 8px; color: var(--ink-soft); text-align: center; font-size: 12px; }
  .bempty { padding: 42px 14px; color: var(--ink-soft); text-align: center; font-size: 13px; }
  .bempty b { display: block; margin-bottom: 5px; color: var(--ink); font-size: 15px; }
  #word-editor {
    display: none; padding: 15px; margin-bottom: 12px; border: 1px solid var(--line);
    border-radius: 14px; background: var(--surface-2);
  }
  #word-editor.open { display: block; }
  #toast {
    position: fixed; left: 50%; bottom: 28px; z-index: 90; display: none;
    transform: translateX(-50%); padding: 10px 16px; border-radius: 12px;
    background: var(--ink); color: var(--surface); box-shadow: var(--shadow); font-size: 13px; font-weight: 700;
  }
  @media (max-width: 840px) {
    .app { width: min(100% - 28px, 720px); padding-top: 15px; padding-left: max(14px, env(safe-area-inset-left)); padding-right: max(14px, env(safe-area-inset-right)); }
    .topbar { margin-bottom: 24px; }
    .study-grid { display: block; }
    .side { position: static; max-height: none; margin-bottom: 18px; }
    .study-panel { display: contents; max-height: none; }
    .video-card { border-radius: 20px; box-shadow: var(--shadow); }
    .rail {
      position: sticky; top: env(safe-area-inset-top); z-index: 30; margin: 10px 0 18px; padding: 8px 12px;
      border-radius: 20px;
    }
    .rail-bar { padding: 0; }
    .topic-nav { display: none; }
    .video-card.floating {
      position: fixed; z-index: 48; top: 72px; right: 10px; left: auto; width: min(48vw, 210px);
      border: 1px solid rgba(255,255,255,.2); border-radius: 14px; box-shadow: 0 18px 45px rgba(0,0,0,.28);
    }
    .video-card.floating .video-drag { display: block; }
    .video-card.floating .video-float-close { display: block; position: absolute; z-index: 4; top: 6px; right: 6px; }
    .video-card.float-off { display: none; }
    article { border-radius: 20px; }
  }
  @media (max-width: 560px) {
    .app { width: 100%; padding: 12px 12px 88px; padding-left: max(12px, env(safe-area-inset-left)); padding-right: max(12px, env(safe-area-inset-right)); }
    .brand span:last-child { display: none; }
    .text-btn { padding: 0 10px; font-size: 12px; }
    .archive-link { width: 38px; padding: 0; font-size: 0; }
    .archive-link svg { width: 17px; }
    .hero { padding: 0 5px; margin-bottom: 18px; }
    .hero h1 { font-size: 30px; }

<script>
const DATA = {"date": "2026-09-02", "slug": "2026-09-02-20uhr", "source": "20uhr", "source_label": "T-64 · tagesschau 20:00 Uhr", "source_short": "20:00 Uhr", "video_page": "https://www.tagesschau.de/tagesschau_20_uhr/video-1641738.html", "embed_url": "https://www.tagesschau.de/tagesschau_20_uhr/video-1641738~player.html", "mp4_url": "https://tagesschau-progressive.ard-mcdn.de/video/2026/0902/TV-20260902-2029-1900.webl.h264.mp4", "duration": 1014.96, "news": [{"title": "Ermittler identifizieren mutmaßliche Täter", "title_zh": "调查人员锁定疑似作案者", "paras": [{"start": 4.6, "end": 47.72, "lines": [{"de": "Gestern hat die Bundesregierung Russland für den versuchten Anschlag am Flughafen Leipzig/Halle verantwortlich gemacht.", "zh": "昨天，联邦政府就莱比锡/哈勒机场未遂袭击事件认定俄罗斯应负责任。", "start": 4.6, "end": 28.24}, {"de": "Allerdings ohne Einzelheiten zu nennen, worauf der Verdacht genau beruht.", "zh": "不过并未说明这一怀疑究竟依据什么。", "start": 28.32, "end": 32.84}, {"de": "Heute nun berichten NDR, WDR und Süddeutsche Zeitung, Ermittler des BKA konnten mehrere Tatverdächtige identifizieren.", "zh": "今天，北德广播电台、西德广播电台和《南德意志报》报道，联邦刑事局的调查人员已锁定多名嫌疑人。", "start": 32.92, "end": 40.96}, {"de": "Zwei der Männer besitzen demnach unter anderem die russische Staatsbürgerschaft.", "zh": "据报道，其中两名男子拥有俄罗斯国籍。", "start": 42.04, "end": 47.72}]}, {"start": 49.32, "end": 93.96, "lines": [{"de": "Die Spur führt nach Russland.", "zh": "线索指向俄罗斯。", "start": 49.32, "end": 51.28}, {"de": "Das zeigen auch Recherchen von NDR, WDR und Süddeutscher Zeitung.", "zh": "北德广播、西德广播和《南德意志报》的调查也证实了这一点。", "start": 51.36, "end": 55.16}, {"de": "Demnach haben Ermittler mehrere Verdächtige identifiziert.", "zh": "据此，调查人员确认了多名嫌疑人。", "start": 55.24, "end": 58.72}, {"de": "Bei einem der Männer handelt es sich um einen Belarussen, der auch einen russischen Pass besitzen soll.", "zh": "其中一名男子是白俄罗斯人，据说还持有俄罗斯护照。", "start": 58.8, "end": 65.12}, {"de": "Die Kriminaltechniker des BKA haben an verschiedenen Geräten, die dort gefunden wurden, DNA-Spuren gesichert - auch an Drohnenteilen.", "zh": "联邦刑事局的刑侦技术人员在当场找到的多台设备上提取了DNA痕迹——无人机部件上也有。", "start": 65.24, "end": 73.44}, {"de": "Offensichtlich waren die Täter unvorsichtig, als sie diese Geräte in die Hand genommen haben.", "zh": "显然，作案者在拿取这些设备时不够小心。", "start": 73.56, "end": 80.2}, {"de": "Der zweite Verdächtige reiste kurz vor dem Anschlagsversuch auf den Flughafen Leipzig/Halle nach Deutschland ein.", "zh": "第二名嫌疑人在莱比锡/哈勒机场袭击未遂前不久入境德国。", "start": 81.32, "end": 88.24}, {"de": "Und unmittelbar danach wieder aus.", "zh": "且紧接着又出境了。", "start": 88.32, "end": 90.4}, {"de": "Beide Männer dürften sich inzwischen in Russland aufhalten.", "zh": "两人如今很可能都在俄罗斯。", "start": 90.52, "end": 93.96}]}, {"start": 94.04, "end": 130.36, "lines": [{"de": "Die Bundesregierung zieht nun Konsequenzen.", "zh": "联邦政府现在要采取相应措施。", "start": 94.04, "end": 96.6}, {"de": "Das Generalkonsulat in Bonn soll am 18. September schließen.", "zh": "驻波恩的总领事馆将于9月18日关闭。", "start": 96.72, "end": 100.24}, {"de": "Das hat auch Folgen für russische Staatsbürger in Deutschland, sagt das Auswärtige Amt.", "zh": "外交部表示，这也会影响到在德国的俄罗斯公民。", "start": 100.32, "end": 105.56}, {"de": "Dann wird eine konsularische Betreuung durch die Botschaft in Berlin abgedeckt werden müssen.", "zh": "届时领事事务将不得不由驻柏林大使馆承担。", "start": 105.64, "end": 111.4}, {"de": "Das machen viele andere Länder auch so.", "zh": "许多其他国家也是这样做的。", "start": 111.48, "end": 114.04}, {"de": "Das ist eine Folge dieser Maßnahmen, die Russland zu verantworten hat.", "zh": "这是俄罗斯必须承担责任的这些措施所带来的后果。", "start": 114.12, "end": 118.32}, {"de": "Die Regierung gab gestern bekannt: Auch die Einreisekontrollen sollen verschärft und der Druck auf die Schattenflotte erhöht werden.", "zh": "政府昨天宣布：入境检查也将收紧，对影子船队的施压将加大。", "start": 118.4, "end": 126.84}, {"de": "Damit umgeht Russland Handelsverbote für Gas und Erdöl.", "zh": "俄罗斯借这支船队规避天然气和石油的贸易禁令。", "start": 126.92, "end": 130.36}]}, {"start": 130.44, "end": 175.84, "lines": [{"de": "Bezüglich der Schattenflotte, der Frozen Assets, der Einschränkungen von Visa.", "zh": "无论是影子船队、被冻结资产，还是签证限制。", "start": 130.44, "end": 140.4}, {"de": "Wo ist die Konkretion nach den vier Wochen, die jetzt verstreichen mussten?", "zh": "在这不得不白白过去的四周之后，具体措施在哪里？", "start": 141.8, "end": 147.0}, {"de": "Die AfD sieht dagegen eine Doppelmoral.", "zh": "而选择党则看到了双重标准。", "start": 147.08, "end": 150.0}, {"de": "Das hätte ich mir auch gewünscht beim Nord Stream-Anschlag.", "zh": "北溪管道遇袭时，我也希望有这样的反应。", "start": 150.36, "end": 154.04}, {"de": "Die Schnelligkeit der Reaktion hätte ich mir auch da gewünscht.", "zh": "那时我也希望有这样的反应速度。", "start": 154.12, "end": 158.04}, {"de": "Hier wird mit Russland und der Ukraine unterschiedlich umgegangen.", "zh": "这里对俄罗斯和乌克兰的处理是不同的。", "start": 158.12, "end": 163.0}, {"de": "Für die Bundesregierung ist klar: Der Druck auf Moskau soll weiter steigen.", "zh": "联邦政府态度明确：对莫斯科的压力还要继续加大。", "start": 163.8, "end": 168.8}, {"de": "Wie weit Deutschland gehen will, ist offen.", "zh": "德国要走多远，尚不明朗。", "start": 168.88, "end": 171.44}, {"de": "Und die Frage, wie das Land auf die wachsende Bedrohung reagieren kann.", "zh": "还有这个问题：这个国家该如何应对日益增长的威胁。", "start": 171.52, "end": 175.84}]}], "vocab": [{"lemma": "der Tatverdächtige, -n", "key": "tatverdaechtige", "forms": ["Tatverdächtige"], "pos": "Substantiv", "zh": "嫌疑人", "example_de": "Heute nun berichten NDR, WDR und Süddeutsche Zeitung, Ermittler des BKA konnten mehrere Tatverdächtige identifizieren.", "example_zh": ""}, {"lemma": "die Staatsbürgerschaft, -en", "key": "staatsbuergerschaft", "forms": ["Staatsbürgerschaft"], "pos": "Substantiv", "zh": "国籍", "example_de": "Zwei der Männer besitzen demnach unter anderem die russische Staatsbürgerschaft.", "example_zh": ""}, {"lemma": "die DNA-Spur, -en", "key": "dna-spur", "forms": ["DNA-Spuren", "DNA-Spur"], "pos": "Substantiv", "zh": "DNA痕迹", "example_de": "Die Kriminaltechniker des BKA haben an verschiedenen Geräten, die dort gefunden wurden, DNA-Spuren gesichert - auch an Drohnenteilen.", "example_zh": ""}, {"lemma": "das Generalkonsulat, -e", "key": "generalkonsulat", "forms": ["Generalkonsulat"], "pos": "Substantiv", "zh": "总领事馆", "example_de": "Das Generalkonsulat in Bonn soll am 18.", "example_zh": ""}, {"lemma": "die Schattenflotte", "key": "schattenflotte", "forms": ["Schattenflotte"], "pos": "Substantiv", "zh": "影子船队", "example_de": "Die Regierung gab gestern bekannt: Auch die Einreisekontrollen sollen verschärft und der Druck auf die Schattenflotte erhöht werden.", "example_zh": ""}, {"lemma": "das Handelsverbot, -e", "key": "handelsverbot", "forms": ["Handelsverbote", "Handelsverbot"], "pos": "Substantiv", "zh": "贸易禁令", "example_de": "Damit umgeht Russland Handelsverbote für Gas und Erdöl.", "example_zh": ""}, {"lemma": "die Doppelmoral", "key": "doppelmoral", "forms": ["Doppelmoral"], "pos": "Substantiv", "zh": "双重标准", "example_de": "Die AfD sieht dagegen eine Doppelmoral.", "example_zh": ""}, {"lemma": "verantwortlich machen", "key": "verantwortlich-machen", "forms": ["verantwortlich gemacht", "verantwortlich machen"], "pos": "Redewendung", "zh": "归咎于、认定……担责", "example_de": "Gestern hat die Bundesregierung Russland für den versuchten Anschlag am Flughafen Leipzig/Halle verantwortlich gemacht.", "example_zh": ""}], "grammar_points": [{"title": "sollen + Infinitiv：新闻转述", "summary": "媒体用 sollen+不定式转述官方或他人说法，意思是「据说、按计划」，不代表电台自己的判断。", "example_de": "Das Generalkonsulat in Bonn soll am 18. September schließen.", "example_zh": "驻波恩的总领事馆据称将于9月18日关闭。"}, {"title": "dürften：有依据的推测", "summary": "情态动词 dürfen 的虚拟式 dürften 表示「很可能」，是新闻里常见的谨慎推测。", "example_de": "Beide Männer dürften sich inzwischen in Russland aufhalten.", "example_zh": "两人如今很可能都在俄罗斯。"}], "background": "背景：联邦政府于9月1日指认俄罗斯为约四周前莱比锡/哈勒机场未遂无人机袭击的幕后方，并宣布关闭俄罗斯驻波恩总领事馆等措施；本条是次日媒体跟进披露的调查细节。影子船队指俄罗斯用来规避石油贸易禁令的匿名油轮船队。"}, {"title": "EU und NATO unterstützen deutsches Vorgehen gegen Russland", "title_zh": "欧盟和北约支持德国对俄行动", "paras": [{"start": 176.48, "end": 206.64, "lines": [{"de": "Viel Unterstützung für das deutsche Vorgehen gegen Russland gab es heute von den westlichen Verbündeten.", "zh": "今天，西方盟友对德国针对俄罗斯的行动给予了大量支持。", "start": 176.48, "end": 183.84}, {"de": "EU und NATO stärkten der Bundesregierung und Außenminister Wadephul den Rücken.", "zh": "欧盟和北约做联邦政府和外交部长瓦德普尔的坚强后盾。", "start": 183.92, "end": 189.28}, {"de": "Die EU plant selbst weitere Sanktionen gegen Moskau.", "zh": "欧盟自身也在计划对莫斯科的进一步制裁。", "start": 189.36, "end": 192.52}, {"de": "Das kündigte die Außenbeauftragte Kallas bei einem Treffen der Außenminister in Irland an.", "zh": "欧盟外交与安全政策高级代表卡拉斯在爱尔兰的外长会议上宣布了这一点。", "start": 192.6, "end": 198.16}, {"de": "Das Wetter in Wicklow passt zur Stimmungslage: Der deutsche Außenminister spricht von einem Herbst der Herausforderungen.", "zh": "威克洛的天气正合心境：德国外长称之为一个充满挑战的秋天。", "start": 199.36, "end": 206.64}]}, {"start": 206.72, "end": 256.4, "lines": [{"de": "Und erntet viel Zustimmung dafür, dass Deutschland erstmals Moskau so klar als Drahtzieher bezeichnet.", "zh": "德国首次如此明确地指认莫斯科为幕后策划者，为此他收获了许多赞同。", "start": 206.72, "end": 213.12}, {"de": "Mich beeindruckt die starke europäische Unterstützung für das, was wir getan haben.", "zh": "欧洲对我们所做之事的强力支持令我印象深刻。", "start": 213.2, "end": 218.52}, {"de": "Russland muss jetzt wissen, dass sein Weg, militärische Lösungen zu suchen, mit Gewalt, auch mit hybriden Mitteln, Ansprüche durchzusetzen, gescheitert ist.", "zh": "俄罗斯现在必须知道，它那条靠军事手段、以暴力、也包括混合手段来强推诉求的路，已经失败了。", "start": 218.6, "end": 228.44}, {"de": "Ein härteres Vorgehen gegen die russische Schattenflotte und neue Sanktionen soll die Antwort auf die russische Aggression sein.", "zh": "对俄罗斯影子船队更严厉的打击和新的制裁，将是对俄罗斯侵略的回应。", "start": 229.6, "end": 237.72}, {"de": "Die EU-Außenbeauftragte spricht von Staatsterrorismus.", "zh": "欧盟高级代表称之为国家恐怖主义。", "start": 237.8, "end": 241.04}, {"de": "Schnell könnten weitere Personen und Institutionen auf die Sanktionsliste kommen.", "zh": "很快可能有更多人员和机构被列入制裁名单。", "start": 241.12, "end": 246.6}, {"de": "Wir haben 1600 weitere Listings in der Pipeline, in Verbindung mit Russlands militärischem Komplex.", "zh": "我们还有1600项列入名单的动议在流程中，都与俄罗斯军事综合体有关。", "start": 246.68, "end": 253.76}, {"de": "Es könnten noch mehr werden.", "zh": "数量还可能继续增加。", "start": 254.08, "end": 256.4}]}, {"start": 257.96, "end": 309.64, "lines": [{"de": "Eine ähnliche Botschaft der Geschlossenheit kommt auch aus Brüssel.", "zh": "布鲁塞尔也传出类似的团结信号。", "start": 257.96, "end": 262.56}, {"de": "Dort gehen Kommissionspräsidentin von der Leyen und NATO-Generalsekretär Rutte vor die Presse.", "zh": "欧盟委员会主席冯德莱恩和北约秘书长吕特在那里出席了记者会。", "start": 262.64, "end": 268.36}, {"de": "Wir sind absolut solidarisch mit Deutschland: Die NATO und die EU.", "zh": "我们与德国绝对站在一起：北约和欧盟。", "start": 268.44, "end": 272.64}, {"de": "Man lasse sich nicht spalten und nicht einschüchtern, betonen die Außenminister.", "zh": "各国外长强调，不容许被分裂，也不容许被恐吓。", "start": 272.76, "end": 277.72}, {"de": "Auch die Unterstützung für die Ukraine will man weiter hochfahren.", "zh": "对乌克兰的支持也要继续加码。", "start": 277.8, "end": 281.72}, {"de": "Putins Kalkül dürfe nicht aufgehen, lautet die Botschaft.", "zh": "传达的信息是：普京的算盘不能得逞。", "start": 281.84, "end": 285.08}, {"de": "Auf diese Ansage müssen nun Taten folgen.", "zh": "这番宣示之后必须见诸行动。", "start": 285.16, "end": 287.96}, {"de": "Noch fehlt der Ukraine die dringend benötigte Flugabwehr, bei nicht alle EU-Partner aus ihren Beständen liefern.", "zh": "乌克兰仍然缺少急需的防空系统，因为并非所有欧盟伙伴都愿从自己的库存中交付。", "start": 288.04, "end": 295.28}, {"de": "Wie das härtere Vorgehen gegen die Schattenflotte aussehen soll, ob Deutschland verdächtige Schiffe festhalten will: Das verrät der Außenminister nicht.", "zh": "对影子船队的更严厉打击会是什么样、德国是否想扣押可疑船只：外长不肯透露。", "start": 295.36, "end": 305.56}, {"de": "Ankündigungen alleine dürften Putin kaum abschrecken.", "zh": "光有宣布恐怕吓不住普京。", "start": 305.64, "end": 309.64}]}], "vocab": [{"lemma": "der Verbündete, -n", "key": "verbuendete", "forms": ["Verbündeten", "Verbündete"], "pos": "Substantiv", "zh": "盟友", "example_de": "Viel Unterstützung für das deutsche Vorgehen gegen Russland gab es heute von den westlichen Verbündeten.", "example_zh": ""}, {"lemma": "jm den Rücken stärken", "key": "den-ruecken-staerken", "forms": ["stärkten der Bundesregierung und Außenminister Wadephul den Rücken", "jm den Rücken stärken"], "pos": "Redewendung", "zh": "做……的坚强后盾", "example_de": "EU und NATO stärkten der Bundesregierung und Außenminister Wadephul den Rücken.", "example_zh": ""}, {"lemma": "die Zustimmung, -en", "key": "zustimmung", "forms": ["Zustimmung"], "pos": "Substantiv", "zh": "赞同、认可", "example_de": "Und erntet viel Zustimmung dafür, dass Deutschland erstmals Moskau so klar als Drahtzieher bezeichnet.", "example_zh": ""}, {"lemma": "der Drahtzieher, -", "key": "drahtzieher", "forms": ["Drahtzieher"], "pos": "Substantiv", "zh": "幕后策划者", "example_de": "Und erntet viel Zustimmung dafür, dass Deutschland erstmals Moskau so klar als Drahtzieher bezeichnet.", "example_zh": ""}, {"lemma": "der Staatsterrorismus", "key": "staatsterrorismus", "forms": ["Staatsterrorismus"], "pos": "Substantiv", "zh": "国家恐怖主义", "example_de": "Die EU-Außenbeauftragte spricht von Staatsterrorismus.", "example_zh": ""}, {"lemma": "die Sanktionsliste, -n", "key": "sanktionsliste", "forms": ["Sanktionsliste"], "pos": "Substantiv", "zh": "制裁名单", "example_de": "Schnell könnten weitere Personen und Institutionen auf die Sanktionsliste kommen.", "example_zh": ""}, {"lemma": "die Flugabwehr", "key": "flugabwehr", "forms": ["Flugabwehr"], "pos": "Substantiv", "zh": "防空（系统）", "example_de": "Noch fehlt der Ukraine die dringend benötigte Flugabwehr, bei nicht alle EU-Partner aus ihren Beständen liefern.", "example_zh": ""}, {"lemma": "solidarisch (mit)", "key": "solidarisch", "forms": ["solidarisch"], "pos": "Adjektiv", "zh": "与……团结一致的", "example_de": "Wir sind absolut solidarisch mit Deutschland: Die NATO und die EU.", "example_zh": ""}], "grammar_points": [{"title": "Konjunktiv I：dürfe nicht aufgehen", "summary": "转述他人要求或立场时用第一虚拟式（dürfe/sei），标明这是引述观点而非记者立场。", "example_de": "Putins Kalkül dürfe nicht aufgehen, lautet die Botschaft.", "example_zh": "传达的信息是：普京的算盘不能得逞。"}, {"title": "Konjunktiv II：könnten 表可能性", "summary": "könnten/würden 等第二虚拟式在新闻中表示对未来的可能性估计：「可能、或将」。", "example_de": "Schnell könnten weitere Personen und Institutionen auf die Sanktionsliste kommen.", "example_zh": "很快可能有更多人员和机构被列入制裁名单。"}], "background": "背景：欧盟外长非正式会议正在爱尔兰威克洛举行；冯德莱恩为欧盟委员会主席，吕特为北约秘书长，卡拉斯为欧盟外交与安全政策高级代表。"}, {"title": "Putin weist Vorwürfe der Bundesregierung zurück", "title_zh": "普京驳回联邦政府指控", "paras": [{"start": 311.92, "end": 346.28, "lines": [{"de": "Nach den Strafmaßnahmen der Bundesregierung hat sich der Ton zwischen Moskau und Berlin verschärft.", "zh": "联邦政府的惩罚措施之后，莫斯科与柏林之间的语气变得尖锐。", "start": 311.92, "end": 318.2}, {"de": "Noch gestern Abend ging der russische Präsident Putin vor die Presse.", "zh": "就在昨晚，俄罗斯总统普京面对媒体发声。", "start": 318.28, "end": 322.4}, {"de": "Er wies alle Vorwürfe zurück.", "zh": "他驳回了一切指控。", "start": 322.48, "end": 324.32}, {"de": "Und er warf der Bundesregierung ein taktisches Manöver in Wahlkampfzeiten vor.", "zh": "还反过来指责联邦政府在竞选期间玩弄战术手段。", "start": 324.4, "end": 329.16}, {"de": "Russland will seinerseits Sanktionen gegen Deutschland verhängen.", "zh": "俄罗斯方面也想对德国实施制裁。", "start": 329.28, "end": 333.32}, {"de": "Die Kernbotschaft auf die Strafmaßnahmen aus Berlin hat Kremlchef Putin schon in Kirgistan verkündet: Deutschland habe einen großen Fehler gemacht und Russland angebliche Beweise untergeschoben.", "zh": "针对柏林的惩罚措施，克里姆林宫主人普京早在吉尔吉斯斯坦就亮出了核心信息：德国犯了一个大错，把所谓的证据栽赃给俄罗斯。", "start": 334.24, "end": 346.28}]}, {"start": 346.36, "end": 393.8, "lines": [{"de": "Ein Grund: Das liegt an der innenpolitischen Lage.", "zh": "一个原因：这同德国国内政治局势有关。", "start": 346.36, "end": 351.16}, {"de": "Der Kanzler befindet sich in einer schwierigen Position.", "zh": "德国总理正处境艰难。", "start": 351.24, "end": 354.76}, {"de": "Er genießt nicht das Vertrauen seiner Bürger.", "zh": "他没有享受到公民的信任。", "start": 354.84, "end": 357.64}, {"de": "Er schützt nationale Interessen nicht, sondern verscherbelt sie.", "zh": "他不保护国家利益，而是把国家利益贱卖掉。", "start": 357.72, "end": 363.08}, {"de": "Für Beobachter ein Versuch des Kreml, Teile der Opposition zu stärken.", "zh": "在观察人士看来，这是克里姆林宫试图壮大德国部分反对力量的一次尝试。", "start": 363.72, "end": 368.76}, {"de": "Putin dreht es sofort um als eine Möglichkeit, auf den deutschen Wahlkampf einzuwirken.", "zh": "普京立刻把它说成是干预德国竞选的一条途径。", "start": 369.28, "end": 376.08}, {"de": "Um Unterstützung der AfD, der Linken, des BSW zu bekommen.", "zh": "以争取选择党、左翼党和莎拉·瓦根克内希特联盟的支持。", "start": 376.16, "end": 380.76}, {"de": "In Moskau wird der deutsche Geschäftsträger ins Außenministerium einbestellt.", "zh": "在莫斯科，德国临时代办被召到俄外交部。", "start": 381.6, "end": 386.64}, {"de": "Der Vorwurf: Berlin zerstöre die Beziehungen zwischen beiden Ländern, die Generationen aufgebaut hätten.", "zh": "俄方指控：柏林正在毁掉两国几代人建立起来的关系。", "start": 386.72, "end": 393.8}]}, {"start": 393.88, "end": 421.48, "lines": [{"de": "Unklar bleibt zunächst, wie Russland weiter reagieren will.", "zh": "俄罗斯接下来打算如何反应，起初尚不清楚。", "start": 393.88, "end": 397.44}, {"de": "Das Goethe-Institut in Moskau könnte geschlossen werden, so Spekulationen.", "zh": "有猜测称，莫斯科的歌德学院可能被关闭。", "start": 397.52, "end": 402.24}, {"de": "Aber auch das deutsche Generalkonsulat in Sankt Petersburg.", "zh": "但德国驻圣彼得堡总领事馆也可能受波及。", "start": 402.36, "end": 406.32}, {"de": "In Wladiwostok reagierte Putin heute auch auf die Ankündigung, mehr Druck auf Russlands Schattenflotte zu machen.", "zh": "今天在符拉迪沃斯托克，普京还回应了加大对俄影子船队施压的宣布。", "start": 406.4, "end": 413.44}, {"de": "Die Beschlagnahme von Schiffen sei Piraterie und Raub.", "zh": "他说扣押船只就是海盗行径和抢劫。", "start": 413.52, "end": 416.72}, {"de": "Das werde angemessen beantwortet – auch in internationalen Gewässern.", "zh": "这将得到相应的回击——包括在国际水域。", "start": 416.8, "end": 421.48}]}], "vocab": [{"lemma": "der Vorwurf, ..e", "key": "vorwurf", "forms": ["Vorwürfe", "Vorwurf"], "pos": "Substantiv", "zh": "指责、指控", "example_de": "Er wies alle Vorwürfe zurück.", "example_zh": ""}, {"lemma": "das Manöver, -", "key": "manoever", "forms": ["Manöver"], "pos": "Substantiv", "zh": "(战术性)手段、操作", "example_de": "Und er warf der Bundesregierung ein taktisches Manöver in Wahlkampfzeiten vor.", "example_zh": ""}, {"lemma": "verhängen", "key": "verhaengen", "forms": ["verhängen"], "pos": "Verb", "zh": "实施(制裁)、颁布", "example_de": "Russland will seinerseits Sanktionen gegen Deutschland verhängen.", "example_zh": ""}, {"lemma": "unterschieben", "key": "unterschieben", "forms": ["untergeschoben", "unterschieben"], "pos": "Verb", "zh": "栽赃、把……强加于", "example_de": "Die Kernbotschaft auf die Strafmaßnahmen aus Berlin hat Kremlchef Putin schon in Kirgistan verkündet: Deutschland habe einen großen Fehler gemacht und Russland angebliche Beweise untergeschoben.", "example_zh": ""}, {"lemma": "der Geschäftsträger, -", "key": "geschaeftstraeger", "forms": ["Geschäftsträger"], "pos": "Substantiv", "zh": "临时代办", "example_de": "In Moskau wird der deutsche Geschäftsträger ins Außenministerium einbestellt.", "example_zh": ""}, {"lemma": "einbestellen", "key": "einbestellen", "forms": ["einbestellt", "einbestellen"], "pos": "Verb", "zh": "传唤、召见", "example_de": "In Moskau wird der deutsche Geschäftsträger ins Außenministerium einbestellt.", "example_zh": ""}, {"lemma": "die Beschlagnahme, -n", "key": "beschlagnahme", "forms": ["Beschlagnahme"], "pos": "Substantiv", "zh": "扣押、没收", "example_de": "Die Beschlagnahme von Schiffen sei Piraterie und Raub.", "example_zh": ""}, {"lemma": "die Spekulation, -en", "key": "spekulation", "forms": ["Spekulationen", "Spekulation"], "pos": "Substantiv", "zh": "猜测、揣测", "example_de": "Das Goethe-Institut in Moskau könnte geschlossen werden, so Spekulationen.", "example_zh": ""}], "grammar_points": [{"title": "Konjunktiv I：habe ... gemacht", "summary": "转述普京原话用第一虚拟式（habe/sei），媒体借此与内容保持距离，只报告不背书。", "example_de": "Deutschland habe einen großen Fehler gemacht und Russland angebliche Beweise untergeschoben.", "example_zh": "（普京称）德国犯了一个大错，把所谓的证据栽赃给俄罗斯。"}, {"title": "间接 W-疑问从句", "summary": "wie/ob/wer 等引导的从句中动词放句尾，常用来说明『尚不清楚』的内容。", "example_de": "Unklar bleibt zunächst, wie Russland weiter reagieren will.", "example_zh": "俄罗斯接下来打算如何反应，起初尚不清楚。"}], "background": "背景：普京当时在符拉迪沃斯托克（海参崴）出席活动并答记者问；德国临时代办是大使缺位时代理馆务的最高外交官，被召见是外交抗议信号。"}, {"title": "Ermittlungen nach Sabotageversuchen am Stromnetz", "title_zh": "电网破坏未遂事件调查", "paras": [{"start": 423.32, "end": 439.96, "lines": [{"de": "Gleich zwei Sabotageversuche am deutschen Stromnetz beschäftigen seit gestern die Ermittler.", "zh": "德国电网接连发生两起破坏未遂事件，调查人员从昨天起忙于应对。", "start": 423.32, "end": 429.44}, {"de": "Nach dem Vorfall nahe dem Kraftwerk Jänschwalde in Brandenburg fand in NRW ein weiterer Angriff nach ähnlichem Muster statt.", "zh": "继勃兰登堡州延施瓦尔德电厂附近的案件之后，北威州又发生一起手法相似的袭击。", "start": 429.52, "end": 437.16}, {"de": "Ob es einen Zusammenhang gibt, ist unklar.", "zh": "两者是否有关联，尚不清楚。", "start": 437.24, "end": 439.96}]}, {"start": 440.08, "end": 494.32, "lines": [{"de": "Der zweite Sabotageversuch ereignete sich gestern in Bergheim, westlich von Köln.", "zh": "第二起破坏未遂昨天发生在科隆以西的贝格海姆。", "start": 440.08, "end": 445.8}, {"de": "Er zielte mutmaßlich auf die Leitungs-Infrastruktur für Kohlekraftwerke in der Region.", "zh": "据推测，它针对的是该地区火电厂的输电线路设施。", "start": 445.92, "end": 451.64}, {"de": "Lichtblitze an einem Umspannwerk in Bergheim bei Köln gestern Abend, gefilmt von einem Anwohner.", "zh": "昨晚科隆附近贝格海姆一座变电站电光闪现，由一名附近居民拍下。", "start": 452.84, "end": 459.36}, {"de": "Ein mutmaßlicher Anschlag.", "zh": "一起疑似袭击。", "start": 459.44, "end": 461.56}, {"de": "Die Stromversorgung war jederzeit stabil und sichergestellt.", "zh": "电力供应始终稳定且有保障。", "start": 462.12, "end": 465.84}, {"de": "Es gab keinen Einfluss darauf.", "zh": "没有受到影响。", "start": 465.92, "end": 468.12}, {"de": "Der Energiekonzern RWE muss wegen des Angriffs mehrere Kraftwerksblöcke herunterfahren.", "zh": "能源集团莱茵集团因这次袭击不得不关停多个发电机组。", "start": 468.32, "end": 474.12}, {"de": "Einige sind jetzt wieder am Netz.", "zh": "其中一些现已重新并网。", "start": 474.2, "end": 476.88}, {"de": "Die Polizei durchkämmt die Maisfelder in der Umgebung.", "zh": "警方搜遍了周围的玉米地。", "start": 476.96, "end": 480.28}, {"de": "Dort findet sie sechs Abschussvorrichtungen für Pyrotechnik.", "zh": "在那里找到了六个烟火发射装置。", "start": 480.4, "end": 484.68}, {"de": "Damit soll ein Draht in Richtung der Leitungen des Umspannwerks geschossen worden sein.", "zh": "据称有人用它把一根金属丝射向变电站的线路。", "start": 484.76, "end": 490.32}, {"de": "So sei laut den Ermittlern ein Kurzschluss herbeigeführt worden.", "zh": "调查人员称，短路就是这样被制造出来的。", "start": 490.4, "end": 494.32}]}, {"start": 494.4, "end": 543.28, "lines": [{"de": "Es besteht der Anfangsverdacht verfassungsfeindlicher Sabotage.", "zh": "已存在危害宪法之破坏活动的初步嫌疑。", "start": 494.4, "end": 498.2}, {"de": "Wir prüfen in zwei Richtungen.", "zh": "我们正沿两个方向侦办。", "start": 498.28, "end": 500.32}, {"de": "Fremdstaatlich gelenkte Sabotage und Linksextremismus.", "zh": "外国势力操纵的破坏，以及左翼极端主义。", "start": 500.44, "end": 504.8}, {"de": "Nichts davon können wir derzeit ausschließen.", "zh": "目前这两者我们都无法排除。", "start": 505.72, "end": 508.56}, {"de": "Der Vorfall ähnelt dem Angriff auf das Stromnetz in Jänschwalde in Brandenburg gestern Morgen.", "zh": "这起事件与昨天早晨勃兰登堡州延施瓦尔德电网遇袭的手法相似。", "start": 508.64, "end": 514.48}, {"de": "Die Ermittler prüfen einen möglichen Zusammenhang.", "zh": "调查人员正在核查两者是否可能有关联。", "start": 514.56, "end": 517.68}, {"de": "In NRW lobt Energieministerin Neubaur die beteiligten Unternehmen dafür, dass sie einen Stromausfall verhindert haben.", "zh": "在北威州，能源部长诺伊鲍尔称赞涉事企业避免了停电。", "start": 517.76, "end": 525.16}, {"de": "Wer hinter dem Vorfall steckt, hat sich an unseren Profis die Zähne ausgebissen.", "zh": "不管幕后是谁，都在我们的专业人员面前碰了钉子。", "start": 525.24, "end": 530.6}, {"de": "Die deutsche Energieversorgung sei robust, so die Ministerin.", "zh": "部长表示，德国的能源供应是稳固的。", "start": 531.04, "end": 534.88}, {"de": "Und doch fordert Neubaur, wie viele andere auch: Die kritische Infrastruktur in Deutschland müsse endlich besser geschützt werden.", "zh": "但诺伊鲍尔也和许多其他人一样要求：德国的关键基础设施必须终于得到更好的保护。", "start": 535.0, "end": 543.28}]}], "vocab": [{"lemma": "die Sabotage, -n", "key": "sabotage", "forms": ["Sabotageversuche", "Sabotage"], "pos": "Substantiv", "zh": "破坏(活动)", "example_de": "Gleich zwei Sabotageversuche am deutschen Stromnetz beschäftigen seit gestern die Ermittler.", "example_zh": ""}, {"lemma": "das Umspannwerk, -e", "key": "umspannwerk", "forms": ["Umspannwerk", "Umspannwerks"], "pos": "Substantiv", "zh": "变电站", "example_de": "Lichtblitze an einem Umspannwerk in Bergheim bei Köln gestern Abend, gefilmt von einem Anwohner.", "example_zh": ""}, {"lemma": "der Anwohner, -", "key": "anwohner", "forms": ["Anwohner"], "pos": "Substantiv", "zh": "附近居民", "example_de": "Lichtblitze an einem Umspannwerk in Bergheim bei Köln gestern Abend, gefilmt von einem Anwohner.", "example_zh": ""}, {"lemma": "die Abschussvorrichtung, -en", "key": "abschussvorrichtung", "forms": ["Abschussvorrichtungen", "Abschussvorrichtung"], "pos": "Substantiv", "zh": "发射装置", "example_de": "Dort findet sie sechs Abschussvorrichtungen für Pyrotechnik.", "example_zh": ""}, {"lemma": "der Kurzschluss, -e", "key": "kurzschluss", "forms": ["Kurzschluss"], "pos": "Substantiv", "zh": "短路", "example_de": "So sei laut den Ermittlern ein Kurzschluss herbeigeführt worden.", "example_zh": ""}, {"lemma": "der Anfangsverdacht", "key": "anfangsverdacht", "forms": ["Anfangsverdacht"], "pos": "Substantiv", "zh": "初步嫌疑", "example_de": "Es besteht der Anfangsverdacht verfassungsfeindlicher Sabotage.", "example_zh": ""}, {"lemma": "die kritische Infrastruktur", "key": "kritische-infrastruktur", "forms": ["kritische Infrastruktur"], "pos": "Substantiv", "zh": "关键基础设施", "example_de": "Und doch fordert Neubaur, wie viele andere auch: Die kritische Infrastruktur in Deutschland müsse endlich besser geschützt werden.", "example_zh": ""}, {"lemma": "durchkämmen", "key": "durchkaemmen", "forms": ["durchkämmt", "durchkämmen"], "pos": "Verb", "zh": "彻底搜查", "example_de": "Die Polizei durchkämmt die Maisfelder in der Umgebung.", "example_zh": ""}], "grammar_points": [{"title": "sein + Partizip II + worden：完成时被动转述", "summary": "sei ... worden 是完成时被动的第一虚拟式，新闻转述调查结论常用。", "example_de": "So sei laut den Ermittlern ein Kurzschluss herbeigeführt worden.", "example_zh": "调查人员称，短路就是这样被制造出来的。"}, {"title": "Konjunktiv I：müsse ... geschützt werden", "summary": "转述要求或呼吁时情态动词用第一虚拟式 müsse，后接被动不定式。", "example_de": "Die kritische Infrastruktur in Deutschland müsse endlich besser geschützt werden.", "example_zh": "德国的关键基础设施必须终于得到更好的保护。"}], "background": "背景：延施瓦尔德是勃兰登堡州的一座大型燃煤电厂，前一天的破坏未遂发生在其附近；RWE 是德国最大的能源集团之一，总部在北威州。"}, {"title": "Bundeskabinett bringt Einkommensteuerreform auf den Weg", "title_zh": "联邦内阁启动所得税改革", "paras": [{"start": 544.24, "end": 569.88, "lines": [{"de": "Das Bundeskabinett hat die geplante Reform der Einkommensteuer auf den Weg gebracht.", "zh": "联邦内阁为所得税改革方案铺平了道路。", "start": 544.24, "end": 549.68}, {"de": "Entlastet werden sollen nach dem Entwurf von Finanzminister Klingbeil v.a. Familien sowie Menschen mit kleinen und mittleren Einkommen.", "zh": "按财政部长克林拜尔的草案，主要为家庭以及中低收入者减负。", "start": 549.76, "end": 558.2}, {"de": "Kritiker bemängeln, dass wenig für die Steuerzahler übrig bleibe, wegen steigender Belastungen an anderer Stelle.", "zh": "批评者抱怨，由于其他方面的负担在上涨，纳税人实际到手的好处所剩无几。", "start": 558.28, "end": 565.76}, {"de": "Über den Entwurf beraten nun Bundestag und Bundesrat.", "zh": "联邦议院和联邦参议院现在将审议这份草案。", "start": 565.84, "end": 569.88}]}, {"start": 572.24, "end": 624.24, "lines": [{"de": "Als das Kabinett am Vormittag die Einkommensteuerreform beschließt, fehlt der Finanzminister.", "zh": "上午内阁通过所得税改革时，财政部长缺席了。", "start": 572.24, "end": 578.16}, {"de": "Der Grund: ein technisches Problem am Regierungsflieger.", "zh": "原因：政府专机出了技术故障。", "start": 578.24, "end": 581.64}, {"de": "Klingbeil muss nach dem G20-Finanzministertreffen länger in den USA bleiben.", "zh": "G20财长会议之后，克林拜尔不得不在美国多留一阵。", "start": 581.72, "end": 586.56}, {"de": "Er erklärt dort, wer von der Reform profitieren soll.", "zh": "他在那里说明了改革要让谁受益。", "start": 586.64, "end": 589.92}, {"de": "Polizeibeamte, die Pflegekraft, die Erzieherin.", "zh": "警察、护理人员、幼教。", "start": 590.04, "end": 592.92}, {"de": "Die sollen entlastet werden, nachdem das Leben teurer wurde, und am Monatsende mehr Geld in der Tasche haben.", "zh": "生活变贵了，这些人应当得到减负，月底手里能多留些钱。", "start": 593.0, "end": 600.04}, {"de": "Die Beispielrechnung laut Klingbeil: Eine Familie mit zwei Kindern und einem Jahresbrutto von 60.000 Euro: Die soll künftig pro Jahr um mindestens 600 entlastet werden.", "zh": "按克林拜尔的示例测算：一个有两个孩子、年税前收入6万欧元的家庭，今后每年至少减负600欧元。", "start": 600.32, "end": 611.0}, {"de": "Die Reform sieht eine schrittweise Erhöhung des Grundfreibetrags vor.", "zh": "改革规定逐步提高基本免税额。", "start": 611.08, "end": 615.8}, {"de": "Die Kosten für diese Reform: zehn Milliarden Euro.", "zh": "这项改革的花费：100亿欧元。", "start": 621.2, "end": 624.24}]}, {"start": 624.32, "end": 684.08, "lines": [{"de": "Die Opposition fordert mehr Entlastung.", "zh": "反对党要求更大的减负力度。", "start": 624.32, "end": 626.88}, {"de": "10 Mrd. über zwei Jahre auszugleichen, gleicht nicht den Anstieg durch die Inflation aus.", "zh": "两年内拿出100亿来补偿，抵不上通胀带来的涨幅。", "start": 626.96, "end": 633.08}, {"de": "Unterste Einkommen werden nicht entlastet.", "zh": "最低收入者没有得到减负。", "start": 633.16, "end": 636.36}, {"de": "Kritik auch innerhalb der Koalition.", "zh": "执政联盟内部也有批评。", "start": 638.72, "end": 641.04}, {"de": "Zwar stimmt Wirtschaftsministerin Reiche der Reform im Kabinett zu, aus ihrem Ministerium aber wird ein Brief öffentlich.", "zh": "经济部长赖歇虽然在内阁中对改革投了赞成票，但她的部里却有一封信被公开。", "start": 641.12, "end": 648.52}, {"de": "Darin die Forderung nach noch mehr Entlastungen, auch für hohe Einkommen.", "zh": "信中要求进一步减负，高收入者也应包括在内。", "start": 648.6, "end": 653.24}, {"de": "Die SPD reagiert irritiert, die Union verteidigt.", "zh": "社民党反应恼火，联盟党则为其辩护。", "start": 653.36, "end": 656.44}, {"de": "Der Hinweis ist richtig: Mehr geht immer.", "zh": "这个提示没错：能做的永远更多。", "start": 656.52, "end": 659.24}, {"de": "Wir sind dabei, die Dinge aufzugreifen, die die Ministerin angesprochen hat in dem Schreiben.", "zh": "我们正着手处理部长在信中提到的问题。", "start": 659.32, "end": 665.92}, {"de": "Ein richtiges Signal - spricht aber nicht gegen dieses Gesetz.", "zh": "这是一个正确的信号——但并不构成反对这部法律的理由。", "start": 666.32, "end": 670.32}, {"de": "Die Einkommensteuerreform muss jetzt durch den Bundestag.", "zh": "所得税改革现在必须过联邦议院这一关。", "start": 670.4, "end": 673.76}, {"de": "Dass es dort zu Veränderungen kommt, gilt als unwahrscheinlich.", "zh": "在那里出现修改，被认为不太可能。", "start": 673.88, "end": 677.52}, {"de": "Jede steuerliche Entlastung müsste gegenfinanziert werden.", "zh": "每一项税收减免都必须找到对冲资金。", "start": 677.6, "end": 681.08}, {"de": "Hier liegen Union und SPD weit auseinander.", "zh": "在这一点上联盟党和社会民主党分歧很大。", "start": 681.16, "end": 684.08}]}], "vocab": [{"lemma": "die Einkommensteuer", "key": "einkommensteuer", "forms": ["Einkommensteuer", "Einkommensteuerreform"], "pos": "Substantiv", "zh": "个人所得税", "example_de": "Das Bundeskabinett hat die geplante Reform der Einkommensteuer auf den Weg gebracht.", "example_zh": ""}, {"lemma": "entlasten", "key": "entlasten", "forms": ["Entlastet", "entlastet", "entlasten"], "pos": "Verb", "zh": "减负、减轻负担", "example_de": "Entlastet werden sollen nach dem Entwurf von Finanzminister Klingbeil v.a.", "example_zh": ""}, {"lemma": "der Entwurf, ..e", "key": "entwurf", "forms": ["Entwurf"], "pos": "Substantiv", "zh": "草案", "example_de": "Entlastet werden sollen nach dem Entwurf von Finanzminister Klingbeil v.a.", "example_zh": ""}, {"lemma": "der Steuerzahler, -", "key": "steuerzahler", "forms": ["Steuerzahler"], "pos": "Substantiv", "zh": "纳税人", "example_de": "Kritiker bemängeln, dass wenig für die Steuerzahler übrig bleibe, wegen steigender Belastungen an anderer Stelle.", "example_zh": ""}, {"lemma": "das Jahresbrutto", "key": "jahresbrutto", "forms": ["Jahresbrutto"], "pos": "Substantiv", "zh": "年税前收入", "example_de": "Die Beispielrechnung laut Klingbeil: Eine Familie mit zwei Kindern und einem Jahresbrutto von 60.000 Euro: Die soll künftig pro Jahr um mindestens 600 entlastet werden.", "example_zh": ""}, {"lemma": "der Grundfreibetrag, ..e", "key": "grundfreibetrag", "forms": ["Grundfreibetrags", "Grundfreibetrag"], "pos": "Substantiv", "zh": "基本免税额", "example_de": "Die Reform sieht eine schrittweise Erhöhung des Grundfreibetrags vor.", "example_zh": ""}, {"lemma": "gegenfinanzieren", "key": "gegenfinanzieren", "forms": ["gegenfinanziert", "gegenfinanzieren"], "pos": "Verb", "zh": "为……筹措对冲资金", "example_de": "Jede steuerliche Entlastung müsste gegenfinanziert werden.", "example_zh": ""}, {"lemma": "die Koalition, -en", "key": "koalition", "forms": ["Koalition"], "pos": "Substantiv", "zh": "执政联盟", "example_de": "Kritik auch innerhalb der Koalition.", "example_zh": ""}], "grammar_points": [{"title": "zwar ..., aber ...", "summary": "zwar 引出让步分句，aber 引出转折，aber 也可以放在句子中间，位置很灵活。", "example_de": "Zwar stimmt Wirtschaftsministerin Reiche der Reform im Kabinett zu, aus ihrem Ministerium aber wird ein Brief öffentlich.", "example_zh": "经济部长赖歇虽然在内阁中对改革投了赞成票，但她的部里却有一封信被公开。"}, {"title": "wer-从句作宾语", "summary": "erklären 等动词后接 wer/was 引导的宾语从句时，从句动词移到句尾。", "example_de": "Er erklärt dort, wer von der Reform profitieren soll.", "example_zh": "他在那里说明了改革要让谁受益。"}], "background": "背景：克林拜尔是联邦财政部长（社民党），赖歇是联邦经济部长（联盟党），两人同属黑红联合政府；联合政府由联盟党(CDU/CSU)与社民党组成。"}, {"title": "Gesetzentwurf zur Förderung frühkindlicher Bildung beschlossen", "title_zh": "早期儿童教育促进法案获通过", "paras": [{"start": 685.48, "end": 714.92, "lines": [{"de": "Das Kabinett beschloss einen Gesetzentwurf von Familienministerin Prien.", "zh": "内阁通过了家庭部长普里恩的法案草案。", "start": 685.48, "end": 690.28}, {"de": "Es soll Sprachtests und mehr Personal für Kitas in Problemvierteln geben.", "zh": "问题街区的幼儿园将获得语言测试和更多人力。", "start": 690.36, "end": 695.08}, {"de": "Die Bundesregierung will so die Qualität der frühkindlichen Bildung verbessern.", "zh": "联邦政府希望借此提升早期儿童教育的质量。", "start": 695.76, "end": 701.16}, {"de": "Und insbesondere benachteiligte Kinder besser fördern.", "zh": "尤其是要更好地扶持弱势儿童。", "start": 701.32, "end": 704.84}, {"de": "So sollen künftig bei allen Vierjährigen u.a. die Sprachentwicklung erfasst werden.", "zh": "今后所有四岁儿童的语言发展等情况都将被测评。", "start": 705.0, "end": 710.6}, {"de": "Falls sich dabei Defizite zeigen, soll es eine Förderung geben.", "zh": "一旦发现不足，将提供促进课程。", "start": 710.72, "end": 714.92}]}], "vocab": [{"lemma": "der Gesetzentwurf, ..e", "key": "gesetzentwurf", "forms": ["Gesetzentwurf"], "pos": "Substantiv", "zh": "法律草案", "example_de": "Das Kabinett beschloss einen Gesetzentwurf von Familienministerin Prien.", "example_zh": ""}, {"lemma": "die Kita, -s", "key": "kita", "forms": ["Kitas", "Kita"], "pos": "Substantiv", "zh": "幼儿园、托育机构", "example_de": "Es soll Sprachtests und mehr Personal für Kitas in Problemvierteln geben.", "example_zh": ""}, {"lemma": "die Sprachentwicklung", "key": "sprachentwicklung", "forms": ["Sprachentwicklung"], "pos": "Substantiv", "zh": "语言发展", "example_de": "So sollen künftig bei allen Vierjährigen u.a. die Sprachentwicklung erfasst werden.", "example_zh": ""}, {"lemma": "benachteiligt", "key": "benachteiligt", "forms": ["benachteiligte", "benachteiligt"], "pos": "Adjektiv", "zh": "处于劣势的、弱势的", "example_de": "Und insbesondere benachteiligte Kinder besser fördern.", "example_zh": ""}, {"lemma": "das Defizit, -e", "key": "defizit", "forms": ["Defizite", "Defizit"], "pos": "Substantiv", "zh": "不足、欠缺", "example_de": "Falls sich dabei Defizite zeigen, soll es eine Förderung geben.", "example_zh": ""}, {"lemma": "erfassen", "key": "erfassen", "forms": ["erfasst", "erfassen"], "pos": "Verb", "zh": "采集、测评", "example_de": "So sollen künftig bei allen Vierjährigen u.a. die Sprachentwicklung erfasst werden.", "example_zh": ""}, {"lemma": "die Förderung, -en", "key": "foerderung", "forms": ["Förderung"], "pos": "Substantiv", "zh": "促进、资助", "example_de": "Falls sich dabei Defizite zeigen, soll es eine Förderung geben.", "example_zh": ""}], "grammar_points": [{"title": "es gibt + 第四格", "summary": "es gibt 只接第四格宾语，表示「有、存在」，新闻里常与 soll 连用表计划。", "example_de": "Es soll Sprachtests und mehr Personal für Kitas in Problemvierteln geben.", "example_zh": "问题街区的幼儿园将获得语言测试和更多人力。"}, {"title": "falls 引导条件从句", "summary": "falls = 如果，从句动词放句尾，口语和书面都常用。", "example_de": "Falls sich dabei Defizite zeigen, soll es eine Förderung geben.", "example_zh": "一旦发现不足，将提供促进课程。"}], "background": "背景：Kita 是 Kindertagesstätte（日间托育机构）的缩写；普里恩是联邦家庭部长。"}, {"title": "Iran und USA greifen sich wieder gegenseitig an", "title_zh": "伊朗与美国再度互相攻击", "paras": [{"start": 717.0, "end": 752.8, "lines": [{"de": "Im Konflikt zwischen den USA und Iran war es mehrere Wochen relativ ruhig, diplomatische Bemühungen liefen.", "zh": "美国与伊朗的冲突前几周相对平静，外交努力一直在进行。", "start": 717.0, "end": 724.68}, {"de": "Seit dem Wochenende greifen sich beide Seiten wieder an.", "zh": "自上周末起，双方再度互相攻击。", "start": 724.76, "end": 728.36}, {"de": "Letzte Nacht attackierte das US-Militär nach eigenen Angaben iranische Militäreinrichtungen.", "zh": "美军自称昨夜打击了伊朗的军事设施。", "start": 728.44, "end": 734.16}, {"de": "Teheran meldete mindestens 18 Tote, auch eine Hochzeitsfeier sei getroffen worden.", "zh": "德黑兰通报至少18人死亡，称一场婚礼也遭到袭击。", "start": 734.24, "end": 740.76}, {"de": "Irans Streitkräfte reagierten mit Angriffen auf US-Stützpunkte in mehreren Golfstaaten.", "zh": "伊朗军队以攻击多个海湾国家的美军基地作为回应。", "start": 740.84, "end": 746.2}, {"de": "Laut Revolutionsgarde fuhren zudem zwei Öltanker in der Straße von Hormus auf Seeminen.", "zh": "据革命卫队消息，还有两艘油轮在霍尔木兹海峡触雷。", "start": 746.28, "end": 752.8}]}], "vocab": [{"lemma": "die Militäreinrichtung, -en", "key": "militaereinrichtung", "forms": ["Militäreinrichtungen", "Militäreinrichtung"], "pos": "Substantiv", "zh": "军事设施", "example_de": "Letzte Nacht attackierte das US-Militär nach eigenen Angaben iranische Militäreinrichtungen.", "example_zh": ""}, {"lemma": "der Stützpunkt, ..e", "key": "stuetzpunkt", "forms": ["Stützpunkte", "Stützpunkt"], "pos": "Substantiv", "zh": "基地、据点", "example_de": "Irans Streitkräfte reagierten mit Angriffen auf US-Stützpunkte in mehreren Golfstaaten.", "example_zh": ""}, {"lemma": "die Streitkräfte (Pl.)", "key": "streitkraefte", "forms": ["Streitkräfte"], "pos": "Substantiv", "zh": "武装力量", "example_de": "Irans Streitkräfte reagierten mit Angriffen auf US-Stützpunkte in mehreren Golfstaaten.", "example_zh": ""}, {"lemma": "die Revolutionsgarde", "key": "revolutionsgarde", "forms": ["Revolutionsgarde"], "pos": "Substantiv", "zh": "革命卫队", "example_de": "Laut Revolutionsgarde fuhren zudem zwei Öltanker in der Straße von Hormus auf Seeminen.", "example_zh": ""}, {"lemma": "der Öltanker, -", "key": "oeltanker", "forms": ["Öltanker"], "pos": "Substantiv", "zh": "油轮", "example_de": "Laut Revolutionsgarde fuhren zudem zwei Öltanker in der Straße von Hormus auf Seeminen.", "example_zh": ""}, {"lemma": "die Seemine, -n", "key": "seemine", "forms": ["Seeminen", "Seemine"], "pos": "Substantiv", "zh": "水雷", "example_de": "Laut Revolutionsgarde fuhren zudem zwei Öltanker in der Straße von Hormus auf Seeminen.", "example_zh": ""}, {"lemma": "die Straße von Hormus", "key": "strasse-von-hormus", "forms": ["Straße von Hormus"], "pos": "Substantiv", "zh": "霍尔木兹海峡", "example_de": "Laut Revolutionsgarde fuhren zudem zwei Öltanker in der Straße von Hormus auf Seeminen.", "example_zh": ""}], "grammar_points": [{"title": "Konjunktiv I：sei getroffen worden", "summary": "转述德黑兰单方面说法时用第一虚拟式被动完成时，表明消息来源存疑。", "example_de": "Teheran meldete mindestens 18 Tote, auch eine Hochzeitsfeier sei getroffen worden.", "example_zh": "德黑兰通报至少18人死亡，称一场婚礼也遭到袭击。"}], "background": "背景：霍尔木兹海峡是波斯湾的石油运输咽喉，全球相当大比例的海运原油经此通过；革命卫队是伊朗的精锐武装力量。"}, {"title": "Nach Sturzflut in Nepal und Tibet gelten rund 4.500 Menschen als vermisst", "title_zh": "尼泊尔与西藏山洪后约4500人失联", "paras": [{"start": 755.32, "end": 786.44, "lines": [{"de": "Eine symbolische Trauerfeier ohne Leichnam - inmitten von Geröllmassen.", "zh": "一场没有遗体的象征性葬礼——置身于乱石堆之中。", "start": 755.32, "end": 760.68}, {"de": "Etwas anderes bleibt vielen Angehörigen nicht.", "zh": "许多家属已别无他法。", "start": 760.76, "end": 763.72}, {"de": "Eine Woche nach der Sturzflut in Nepal und Tibet gelten noch etwa 4500 Menschen als vermisst.", "zh": "尼泊尔和西藏山洪暴发一周后，仍有约4500人下落不明。", "start": 763.8, "end": 770.36}, {"de": "Die Wahrscheinlichkeit sinkt, sie noch zu finden.", "zh": "找到他们的可能性在下降。", "start": 770.4, "end": 773.76}, {"de": "Auslöser der Katastrophe im Himalaya zwischen Tibet und Nepal war ein Gletscherabbruch.", "zh": "这场喜马拉雅山西藏与尼泊尔之间灾难的起因是冰川崩塌。", "start": 773.84, "end": 779.96}, {"de": "Danach ergoss sich eine zerstörerische Welle mit Schlamm und Geröll in die Täler.", "zh": "随后一股挟带泥沙碎石的毁灭性巨浪涌入山谷。", "start": 780.76, "end": 786.44}]}, {"start": 789.2, "end": 836.44, "lines": [{"de": "Mit dem Auto geht es ins Katastrophengebiet, aber dann ist die Straße zu Ende: Die nächste Siedlung nur nach stundenlangem Fußmarsch erreichbar.", "zh": "乘车前往灾区，但半路就没有路了：下一个居民点只能步行数小时才能到达。", "start": 789.2, "end": 798.28}, {"de": "Sämtliche Brücken flussaufwärts sind zerstört, die Menschen auf der anderen Seite abgeschnitten.", "zh": "上游所有桥梁都被毁，对岸的人被隔绝。", "start": 798.36, "end": 804.32}, {"de": "Als Übergang gibt es seit heute eine Seilbahn mit einem Blechkorb.", "zh": "从今天起有了一条铁皮吊箱的缆索道作为通道。", "start": 804.4, "end": 808.8}, {"de": "Ich bin mit dem Auto gekommen, um auf die andere Seite zu gelangen.", "zh": "我是开车来的，想到对岸去。", "start": 811.48, "end": 813.8}, {"de": "Da lebt mein Bruder, der wird vermisst.", "zh": "我兄弟住在那边，他失联了。", "start": 813.88, "end": 816.4}, {"de": "Meine Eltern sind unverletzt, ich muss sie sehen.", "zh": "我父母没有受伤，我必须见到他们。", "start": 816.48, "end": 819.6}, {"de": "Viele Regionen können nur per Hubschrauber erreicht werden.", "zh": "许多地区只能靠直升机抵达。", "start": 819.88, "end": 823.68}, {"de": "Die kehren zurück zu diesem Armee-Landeplatz - manchmal mit Geretteten an Bord.", "zh": "直升机返回这片军队降落场——有时机上载着获救者。", "start": 823.76, "end": 829.04}, {"de": "Ich habe es geschafft.", "zh": "我过来了。", "start": 829.32, "end": 831.08}, {"de": "Aber von meinem Bruder, seiner Frau und ihren drei Töchtern fehlt jede Spur.", "zh": "但我兄弟、他的妻子和他们的三个女儿毫无音讯。", "start": 831.16, "end": 836.44}]}, {"start": 836.56, "end": 881.0, "lines": [{"de": "Ständig werden die Namen Vermisster in Listen eingetragen, auch wenn die Hoffnung von Tag zu Tag sinkt.", "zh": "失踪者的名字不断被登记进名单，尽管希望一天天渺茫。", "start": 836.56, "end": 846.76}, {"de": "Ich bin von Indien kommen, um nach meiner Schwester zu suchen.", "zh": "我从印度赶来，寻找我的妹妹。", "start": null, "end": null}, {"de": "Ich war schon in Kathmandu, aber sie war in keinem der Krankenhäuser.", "zh": "我去过加德满都，但哪家医院都没有她。", "start": 851.8, "end": 856.56}, {"de": "Wer die Flut überlebt hat, steht oft vor den Trümmern seiner Existenz.", "zh": "洪水幸存者往往面对的是生计的废墟。", "start": 856.88, "end": 861.52}, {"de": "Die Anzahl zerstörter Wohnungen und Häuser wird auf über 10.000 geschätzt.", "zh": "被毁住宅和房屋数量估计超过一万。", "start": 861.6, "end": 866.4}, {"de": "Eine Woche nach der Katastrophe wird weiter nach Vermissten gesucht.", "zh": "灾难过去一周，搜寻仍在继续。", "start": 866.48, "end": 870.56}, {"de": "Zugleich richtet sich der Fokus auf die Versorgung Geretteter und den Wiederaufbau der kritischen Infrastruktur.", "zh": "与此同时，重点转向获救者的安置和关键基础设施的重建。", "start": 870.64, "end": 877.56}, {"de": "Etwa der Stromversorgung und der Verkehrswege.", "zh": "比如电力供应和交通线路。", "start": 877.64, "end": 881.0}]}], "vocab": [{"lemma": "die Trauerfeier, -n", "key": "trauerfeier", "forms": ["Trauerfeier"], "pos": "Substantiv", "zh": "葬礼、悼念仪式", "example_de": "Eine symbolische Trauerfeier ohne Leichnam - inmitten von Geröllmassen.", "example_zh": ""}, {"lemma": "der Angehörige, -n", "key": "angehoerige", "forms": ["Angehörigen", "Angehörige"], "pos": "Substantiv", "zh": "家属", "example_de": "Etwas anderes bleibt vielen Angehörigen nicht.", "example_zh": ""}, {"lemma": "die Sturzflut, -en", "key": "sturzflut", "forms": ["Sturzflut"], "pos": "Substantiv", "zh": "山洪暴发", "example_de": "Eine Woche nach der Sturzflut in Nepal und Tibet gelten noch etwa 4500 Menschen als vermisst.", "example_zh": ""}, {"lemma": "der Gletscherabbruch", "key": "gletscherabbruch", "forms": ["Gletscherabbruch"], "pos": "Substantiv", "zh": "冰川崩塌", "example_de": "Auslöser der Katastrophe im Himalaya zwischen Tibet und Nepal war ein Gletscherabbruch.", "example_zh": ""}, {"lemma": "vermisst", "key": "vermisst", "forms": ["Vermisste", "vermisst"], "pos": "Adjektiv", "zh": "失踪的、下落不明的", "example_de": "Eine Woche nach der Sturzflut in Nepal und Tibet gelten noch etwa 4500 Menschen als vermisst.", "example_zh": ""}, {"lemma": "die Seilbahn, -en", "key": "seilbahn", "forms": ["Seilbahn"], "pos": "Substantiv", "zh": "缆车、缆索道", "example_de": "Als Übergang gibt es seit heute eine Seilbahn mit einem Blechkorb.", "example_zh": ""}, {"lemma": "der Hubschrauber, -", "key": "hubschrauber", "forms": ["Hubschrauber"], "pos": "Substantiv", "zh": "直升机", "example_de": "Viele Regionen können nur per Hubschrauber erreicht werden.", "example_zh": ""}, {"lemma": "die Trümmer (Pl.)", "key": "truember", "forms": ["Trümmern", "Trümmer"], "pos": "Substantiv", "zh": "废墟、瓦砾", "example_de": "Wer die Flut überlebt hat, steht oft vor den Trümmern seiner Existenz.", "example_zh": ""}, {"lemma": "der Wiederaufbau", "key": "wiederaufbau", "forms": ["Wiederaufbau"], "pos": "Substantiv", "zh": "重建", "example_de": "Zugleich richtet sich der Fokus auf die Versorgung Geretteter und den Wiederaufbau der kritischen Infrastruktur.", "example_zh": ""}], "grammar_points": [{"title": "ohne + 第四格", "summary": "ohne 是支配第四格的介词，表示「没有、不带」。", "example_de": "Eine symbolische Trauerfeier ohne Leichnam - inmitten von Geröllmassen.", "example_zh": "一场没有遗体的象征性葬礼——置身于乱石堆之中。"}, {"title": "wer-自由关系从句", "summary": "wer ... (der) ... 结构中，wer 从句整体作主语，从句动词尾置、主句动词保持第二位。", "example_de": "Wer die Flut überlebt hat, steht oft vor den Trümmern seiner Existenz.", "example_zh": "洪水幸存者往往面对的是生计的废墟。"}], "backgroun   let html = '', i = 0;
  const lower = text.toLowerCase();
  while (i < text.length) {
    let hit = '';
    if (i === 0 || !isLetter(text[i - 1])) {
      for (const ph of PHRASES) {
        if (lower.startsWith(ph.toLowerCase(), i) && !isLetter(text[i + ph.length])) {
          hit = text.slice(i, i + ph.length);
          break;
        }
      }
    }
    if (hit) {
      html += wrapWord(hit, lookupKey(hit));
      i += hit.length;

    if (isLetter(text[i])) {
      let j = i + 1;
      while (j < text.length && /[A-Za-zÄÖÜäöüß-]/.test(text[j])) j++;

function clampFloat(x, y) {

function basketAdd() {

  if (!popWord.zh) { openPopEditor(); return; }
  if (basket.some(b => b.key === popWord.key)) { toast('已在生词本'); return; }
  basket.push({
    key: popWord.key, word: popWord.word, zh: popWord.zh, pos: popWord.pos || '',
    example: popWord.example || '', date: DATA.date, topic: popWord.topic || '',
    source: popWord.source || '', createdAt: Date.now()
  });
  saveBasket();
  refreshWordMarks();
  hidePop(); renderBasket(); toast('已加入生词本');
}
function basketDel(key) {
  basket = basket.filter(b => b.key !== key);
  saveBasket();
  refreshWordMarks();
  renderBasket();
}
function saveBasket() { saveStored(BK_KEY, basket); }
function refreshWordMarks() {
  document.querySelectorAll('w').forEach(w => {
    w.classList.toggle('known', Boolean(getGloss(w.dataset.w)?.zh));
    w.classList.toggle('saved', basket.some(b => b.key === w.dataset.w));

function renderBasket() {
  const n = basket.length;

  if (!n) { list.innerHTML = '<div class="bempty"><b>生词本还是空的</b>点击正文中的任意德语词，或手动添加一个。</div>'; return; }
  list.innerHTML = basket.map(b =>

  ).join('');
}
function toggleBasket(open) {
  const panel = document.getElementById('basket');
  const wasOpen = panel.classList.contains('open');
  panel.classList.toggle('open', open);
  panel.setAttribute('aria-hidden', String(!open));
  document.getElementById('scrim').classList.toggle('on', open);
  if (open) setTimeout(() => panel.querySelector('.bclose')?.focus(), 0);
  else {
    closeWordEditor();
    if (wasOpen) document.getElementById('basket-btn').focus();
  }
}
document.getElementById('basket-btn').onclick = () => toggleBasket(true);
document.getElementById('scrim').onclick = () => toggleBasket(false);
document.addEventListener('keydown', e => {
  const panel = document.getElementById('basket');
  if (!panel.classList.contains('open')) return;
  if (e.key === 'Escape') {
    e.preventDefault();
    toggleBasket(false);
    return;
  }
  if (e.key !== 'Tab') return;
  const focusable = [...panel.querySelectorAll('button:not([disabled]), a[href], input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])')];
  if (!focusable.length) return;
  const first = focusable[0];
  const last = focusable[focusable.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
});
document.getElementById('bk-list').onclick = e => {
  const btn = e.target.closest('button[data-key]');
  if (!btn) return;
  if (btn.classList.contains('bx')) basketDel(btn.dataset.key);

};

function openWordEditor(key = null) {
  editingKey = key;
  const item = key ? basket.find(b => b.key === key) : null;
  document.getElementById('edit-word').value = item?.word || '';
  document.getElementById('edit-zh').value = item?.zh || '';
  document.getElementById('edit-example').value = item?.example || '';
  document.getElementById('word-editor').classList.add('open');
  setTimeout(() => document.getElementById('edit-word').focus(), 0);
}
function closeWordEditor() {
  editingKey = null;
  document.getElementById('word-editor').classList.remove('open');
  document.getElementById('word-form').reset();
}
document.getElementById('word-form').onsubmit = e => {
  e.preventDefault();
  const wasEditing = Boolean(editingKey);
  const word = document.getElementById('edit-word').value.trim();
  const zh = document.getElementById('edit-zh').value.trim();
  const example = document.getElementById('edit-example').value.trim();
  if (!word || !zh) return;
  const key = editingKey || word.toLocaleLowerCase('de-DE');
  const item = basket.find(b => b.key === editingKey || (!editingKey && b.key === key));
  if (item) Object.assign(item, { word, zh, example });
  else basket.unshift({ key, word, zh, example, date: DATA.date, manual: true });
  userGloss[key] = { word, zh, example, pos: '' };
  saveStored(GLOSS_KEY, userGloss);
  saveBasket();
  refreshWordMarks();
  renderBasket();
  closeWordEditor();
  toast(wasEditing ? '单词已更新' : '已添加单词');
};

function copyWords() {
  if (!basket.length) { toast('生词本是空的'); return; }
  const text = basket.map(b => `${b.word}\t${b.zh}${b.example ? '\t' + b.example : ''}`).join('\n');
  navigator.clipboard.writeText(text).then(
    () => toast('已复制 ' + basket.length + ' 词'),
    () => toast('复制失败')
  );
}
