    <script id="dd-data" type="application/json">{"page":"lesson","lesson":{"slug":"2026-08-18","date":"2026-08-18","show":"tagesschau in Einfacher Sprache","level":"A2–B1","kind":"video","note":"","source_url":"https://www.tagesschau.de/tagesschau_in_einfacher_sprache/video-1633538.html","video":{"mp4":"https://tagesschau-progressive.ard-mcdn.de/video/2026/0818/TV-20260818-1756-3800.webl.h264.mp4","embed":"https://www.tagesschau.de/tagesschau_in_einfacher_sprache/video-1633538~player.html","page":"https://www.tagesschau.de/tagesschau_in_einfacher_sprache/video-1633538.html"},"duration":556.42,"sentences":[{"de":"Zuletzt gab es einen Vorfall mit einer Drohne am Flughafen Leipzig-Halle.","zh":"最近，莱比锡-哈勒机场发生了一起无人机事件。","start":35.44,"end":47.86},{"de":"Drohnen sind wie kleine Flugzeuge ohne Pilot.","zh":"无人机就像没有飞行员的小飞机。","start":48.1,"end":51.86},{"de":"An der Drohne am Flughafen war Sprengstoff.","zh":"机场上空的那架无人机上装有炸药——用它可以让东西爆炸。","start":52.78,"end":55.9},{"de":"Damit bringt man Dinge zum Explodieren.","zh":"自这次事件以来，政府一直很担忧。","start":56.5,"end":59.18},{"de":"Die Regierung ist seit dem Vorfall besorgt.","zh":"因为这架无人机威胁了机场的安全。","start":59.22,"end":62.34},{"de":"Die Drohne hat nämlich die Sicherheit am Flughafen bedroht.","zh":"调查人员已在搜寻痕迹，就像照片上那样。","start":63.22,"end":67.22},{"de":"Ermittler haben nach Spuren gesucht, wie auf dem Foto.","zh":"因为人们还不知道是谁派出了这架无人机，","start":67.26,"end":71.22},{"de":"Man weiß nämlich nicht, wer hat die Drohne geschickt und warum.","zh":"以及出于什么目的。","start":71.98,"end":76.42},{"de":"Manche Experten sagen, Russland hat sie geschickt.","zh":"一些专家说，是俄罗斯派来的。","start":77.14,"end":80.9},{"de":"Auch vorher gab es schon öfter Drohnen an Flughäfen und anderen Orten.","zh":"此前也已有无人机多次出现在机场和其他地点。","start":81.78,"end":86.82},{"de":"Deshalb gibt es jetzt ein neues Zentrum für Forschung.","zh":"因此，现在成立了一个新的研究中心。","start":86.94,"end":90.74},{"de":"Dazu kommt ein Film.","zh":"（接下来是一段影片。","start":90.98,"end":92.26},{"de":"Das neue Zentrum ist im Bundesland Sa ern so.","zh":"许多农民都是这样。","start":null,"end":null},{"de":"Dieser Mann ist der Chef vom Bauernverband.","zh":"这位是农民协会的主席。他说，","start":null,"end":null},{"de":"Er sagt, die Regierung muss den Bauern mit Geld helfen.","zh":"政府必须用钱帮助农民，而且必须快。","start":null,"end":null},{"de":"Und es muss schnell gehen.","zh":"受影响的主要是南部和西部的农民，","start":null,"end":null},{"de":"Vor allem die Bauern unten im Süden und links im Westen, wie Liedmann, sind betroffen.","zh":"比如 Liedmann——那里特别热，","start":null,"end":null},{"de":"Dort war es besonders heiß.","zh":"雨也特别少。","start":null,"end":null},{"de":"Und es hat wenig geregnet.","zh":"在多特蒙德市 Liedmann 的一块田里，","start":null,"end":null},{"de":"Auf einem Feld von Liedmann in der Stadt Dortmund hat es gerade geregnet.","zh":"刚下过雨。","start":null,"end":null},{"de":"Er hofft, dass der Regen tiefer in die Erde geht.","zh":"他希望雨水能渗进更深的土层，","start":null,"end":null},{"de":"Und dass es dem Klee nächstes Jahr wieder besser geht.","zh":"也希望三叶草明年能重新长得好。","start":null,"end":null},{"de":"Seit mehreren Tagen brennt es in Belgien in einem Naturschutzgebiet.","zh":"比利时的一处自然保护区已经烧了好几天。","start":null,"end":null},{"de":"Naturschutzgebiet bedeutet, dort leben viele Tiere und Pflanzen.","zh":"自然保护区的意思是：那里生活着许多动物和植物，","start":null,"end":null},{"de":"Deshalb gibt es strenge Regeln für den Schutz von der Natur.","zh":"因此有严格的自然保护规定。","start":433.46,"end":472.98},{"de":"Für Belgien ist das Feuer eine Katastrophe.","zh":"对比利时来说，","start":null,"end":null},{"de":"Sehr viel Natur ist nämlich zerstört.","zh":"这场大火是一场灾难——大量自然已被毁坏。","start":null,"end":null},{"de":"Das Feuer ist in der Nähe von der Grenze zu Deutschland.","zh":"火场位于靠近德国边境的地方。","start":null,"end":null},{"de":"Dazu kommt ein Film.","zh":"（接下来是一段影片。）在比利时，","start":null,"end":null},{"de":"In Belgien arbeitet die Feuerwehr weiter gegen den Brand.","zh":"消防队继续奋战扑救大火。","start":null,"end":null},{"de":"Das ist schwierig.","zh":"这很困难，因为现在风很大。","start":null,"end":null},{"de":"Es ist jetzt nämlich windig.","zh":"有些地方的火已经扑灭了，","star
