<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Deutsch Daily — 2026-09-05</title>
<style>
  :root {
    --bg: #eef2f0;
    --surface: #ffffff;
    --surface-2: #f7f9f8;
    --ink: #172127;
    --ink-soft: #647077;
    --line: #dce4e1;
    --accent: #176b72;
    --accent-strong: #0d5057;
    --accent-soft: #dceeed;
    --warm: #d98f39;
    --warm-soft: #fff0d9;
    --zh: #5f696f;
    --danger: #b3493f;
    --shadow: 0 18px 50px rgba(20, 46, 47, .10);
    --shadow-soft: 0 8px 24px rgba(20, 46, 47, .07);
  }
  [data-theme="dark"] {
    --bg: #111719; --surface: #192124; --surface-2: #202a2d;
    --ink: #edf3f1; --ink-soft: #a9b7b8; --line: #344145;
    --accent: #75cbd0; --accent-strong: #99dfe2; --accent-soft: #223e40;
    --warm: #f0b35e; --warm-soft: #3b3022; --zh: #bac5c5;
    --shadow: 0 18px 50px rgba(0,0,0,.28); --shadow-soft: 0 8px 24px rgba(0,0,0,.22);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { scroll-behavior: smooth; scroll-padding-top: 90px; }
  body {
    min-height: 100vh; background: var(--bg); color: var(--ink);
    font: 16px/1.65 Inter, ui-sans-serif, system-ui, -apple-system, "Noto Sans SC", sans-serif;
    transition: background .2s, color .2s;
  }
  button, input, textarea { font: inherit; }
  button, a { -webkit-tap-highlight-color: transparent; }
  button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible {
    outline: 3px solid color-mix(in srgb, var(--accent) 35%, transparent); outline-offset: 2px;
  }
  .app { width: min(1280px, calc(100% - 48px)); margin: 0 auto; padding: 24px 0 100px; }
  .topbar {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    min-height: 42px; margin-bottom: 34px;
  }
  .brand {
    display: inline-flex; align-items: center; gap: 10px; color: var(--ink);
    font-weight: 800; letter-spacing: -.02em; text-decoration: none;
  }
  .brand-mark {
    display: grid; place-items: center; width: 30px; height: 30px; border-radius: 9px;
    background: var(--accent); color: #fff; font: 800 12px/1 ui-monospace, monospace;
  }
  .top-actions { display: flex; align-items: center; gap: 8px; }
  .icon-btn, .archive-link, .text-btn {
    min-height: 38px; border: 1px solid var(--line); border-radius: 12px;
    background: var(--surface); color: var(--ink-soft); cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; text-decoration: none;
  }
  .icon-btn { width: 38px; }
  .archive-link, .text-btn { gap: 7px; padding: 0 13px; font-size: 13px; font-weight: 700; }
  .hero { margin-bottom: 26px; }
  .eyebrow {
    color: var(--accent); font-size: 12px; font-weight: 800; letter-spacing: .12em;
    text-transform: uppercase; margin-bottom: 9px;
  }
  .hero h1 {
    max-width: 720px; font: 750 clamp(29px, 4vw, 50px)/1.08 ui-serif, Georgia, serif;
    letter-spacing: -.04em;
  }
  .hero-meta { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 13px; color: var(--ink-soft); font-size: 14px; }
  .hero-meta span { display: inline-flex; align-items: center; gap: 7px; }

  .study-grid { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: clamp(20px, 3.2vw, 48px); align-items: start; }
  .side {
    position: sticky; top: 16px; max-height: calc(100vh - 24px);
    display: flex; flex-direction: column; min-height: 0;
  }
  .study-panel {
    display: flex; flex-direction: column; gap: 16px; min-height: 0; max-height: calc(100vh - 24px);
    background: transparent; border: 0; box-shadow: none; overflow: visible;
  }
  .video-card {
    position: relative; flex: 0 0 auto; overflow: hidden; background: #071012;
    border-radius: 24px; box-shadow: var(--shadow-soft);
  }
  .player { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #071012; }
  .player iframe, .player video { position: absolute; inset: 0; display: block; width: 100%; height: 100%; border: 0; background: #071012; }
  .video-drag {
    display: none; position: absolute; z-index: 3; top: 0; left: 0; right: 36px; height: 32px;
    cursor: grab; touch-action: none;
    background: linear-gradient(to bottom, rgba(0,0,0,.5), transparent);
  }
  .video-drag:active { cursor: grabbing; }
  .video-float-close {
    display: none; border: 0; background: rgba(255,255,255,.14); color: #fff;
    width: 28px; height: 28px; border-radius: 50%; cursor: pointer;
  }
  .rail {
    display: flex; flex-direction: column; flex: 1; min-height: 0;
    padding: 18px 18px 16px; border: 1px solid var(--line); border-radius: 24px;
    background: var(--surface); box-shadow: var(--shadow-soft); overflow: hidden;
  }
  .rail-bar { padding: 0 0 12px; }
  .controls { display: flex; width: 100%; }
  .controls button {
    flex: 1; min-height: 40px; padding: 0 14px; border: 1px solid var(--line); border-radius: 12px;
    background: var(--surface-2); color: var(--ink-soft); cursor: pointer; font-size: 14px; font-weight: 750;
  }
  .controls button.on { border-color: var(--accent); background: var(--accent); color: #fff; }
  .hero-meta a { color: var(--accent); text-decoration: none; font-weight: 700; }
  .hero-meta a:hover { text-decoration: underline; }
  .topic-nav { flex: 1; min-height: 0; overflow-y: auto; padding: 0; scrollbar-gutter: stable; }
  .topic { border-top: 1px solid var(--line); }
  .topic:first-child { border-top: 0; }
  .topic > a {
    display: grid; grid-template-columns: 32px minmax(0,1fr); gap: 10px; align-items: start;
    padding: 11px 0; color: var(--ink); text-decoration: none;
  }
  .topic > a span {
    min-width: 0; padding-top: 5px;
    font: 650 15px/1.35 ui-serif, Georgia, serif; letter-spacing: -.015em;
  }
  .topic > a:hover span { color: var(--accent); }
  .topic b {
    display: grid; place-items: center; width: 32px; height: 32px; border-radius: 10px;
    background: var(--accent-soft); color: var(--accent-strong);
    font: 800 11px/1 ui-monospace, monospace;
  }
  .topic.on b { background: var(--accent); color: #fff; }
  .topic.on > a span { color: var(--accent-strong); }
  .topic-study { display: none; padding: 0 0 12px; }
  .topic.on .topic-study { display: block; }
  .topic-study .empty-study { color: var(--ink-soft); font-size: 13px; padding: 6px 0; }
  .study-tabs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-top: 2px; }
  .study-tabs.n2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .study-tabs.n1 { grid-template-columns: 1fr; }
  .stab {
    min-height: 32px; padding: 0 6px; border: 1px solid var(--line); border-radius: 11px;
    background: var(--surface-2); color: var(--ink-soft); cursor: pointer;
    font-size: 12px; font-weight: 750;
  }
  .stab:hover { border-color: var(--accent); color: var(--accent-strong); }
  .stab.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-strong); }
  .spane { display: none; margin-top: 6px; }
  .spane.on { display: block; }
  .vrow {
    display: grid; grid-template-columns: minmax(0,1fr) 28px; gap: 8px; align-items: start;
    padding: 10px 0; border-top: 1px dashed var(--line);
  }
  .vrow .vw { color: var(--ink); font: 750 14.5px/1.35 ui-serif, Georgia, serif; }
  .vrow .vz { margin-top: 4px; color: var(--accent-strong); font-size: 13.5px; }
  .vrow .vex { margin-top: 6px; color: var(--ink-soft); font-size: 13px; font-style: italic; }
  .vadd {
    width: 28px; height: 28px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--surface); color: var(--accent-strong); cursor: pointer;
    font: 700 18px/1 ui-sans-serif, system-ui;
  }
  .vadd:hover { border-color: var(--accent); background: var(--accent-soft); }
  .rail-note { margin: 0; padding: 10px 0; color: var(--ink-soft); font-size: 13.5px; line-height: 1.7; }
  .rail-note + .rail-note { border-top: 1px dashed var(--line); }
  .rail-note strong { display: block; margin-bottom: 4px; color: var(--ink); font: 750 14.5px/1.35 ui-serif, Georgia, serif; }
  .rail-note i { display: block; margin-bottom: 6px; }
  @media (min-width: 841px) { .article-extras { display: none; } }

  .reader { min-width: 0; }
  .first-run {
    display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 16px; align-items: start;
    margin-bottom: 16px; padding: 16px 18px; border: 1px solid var(--line); border-radius: 16px;
    background: var(--accent-soft); color: var(--ink-soft); font-size: 13.5px;
  }
  .first-run[hidden] { display: none; }
  .first-run strong { display: block; margin-bottom: 3px; color: var(--accent-strong); }
  .first-run button { border: 0; background: transparent; color: var(--ink-soft); cursor: pointer; font-weight: 800; }
  .legend { color: var(--ink-soft); }
  article {
    scroll-margin-top: 24px; margin-bottom: 22px; padding: clamp(22px, 4vw, 38px);
    border: 1px solid var(--line); border-radius: 24px; background: var(--surface);
    box-shadow: var(--shadow-soft);
  }
  .n-head { display: grid; grid-template-columns: 42px minmax(0,1fr); gap: 13px; align-items: start; margin-bottom: 24px; }
  .n-idx {
    display: grid; place-items: center; width: 42px; height: 42px; border-radius: 13px;
    background: var(--accent-soft); color: var(--accent-strong); font: 800 13px/1 ui-monospace, monospace;
  }
  .n-head h2, .h-zh {
    padding-top: 3px;
    color: var(--ink);
    font: 750 clamp(21px, 3vw, 28px)/1.25 ui-serif, Georgia, "Noto Serif CJK SC", "Noto Serif SC", serif;
    letter-spacing: -.025em;
  }
  .h-zh { margin-top: 6px; padding-top: 0; }
  .para { display: flex; flex-direction: column; align-items: stretch; margin-bottom: 22px; }
  .para:last-child { margin-bottom: 8px; }
  .sent {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    width: 100%;
    min-width: 0;
    margin: 0 0 0.8em;
  }
  .sent[data-start] { cursor: pointer; }
  .de {
    max-width: 100%;
    font: var(--reader-size, 18.5px)/1.55 ui-serif, Georgia, "Noto Serif", serif;
    letter-spacing: .003em;
  }
  .de w {
    cursor: pointer; border-radius: 4px; transition: background .12s, color .12s;
    text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px;
    text-decoration-color: transparent;
  }
  .de w:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; background: var(--accent-soft); }
  .de w:hover, .de w:active { background: var(--warm-soft); text-decoration-color: var(--warm); }
  .de w.known { text-decoration-color: color-mix(in srgb, var(--accent) 55%, transparent); }
  .de w.ed { text-decoration-style: solid; text-decoration-thickness: 1.5px; }
  .de w.wiki { text-decoration-style: dotted; text-decoration-color: color-mix(in srgb, var(--ink-soft) 55%, transparent); }
  .de w.saved { color: var(--accent-strong); background: var(--accent-soft); text-decoration-color: transparent; }
  .sent.now .de {
    background: color-mix(in srgb, var(--accent-soft) 70%, transparent);
    border-radius: 4px;
  }
  .zh {
    margin-top: 3px;
    width: 100%;
    max-width: 100%;
    color: var(--ink);
    font: 400 15.5px/1.45 Inter, ui-sans-serif, "Noto Sans SC", sans-serif;
  }
  body.hide-zh .zh { display: none; }
  body.hide-zh .para { display: block; }
  body.hide-zh .sent { display: inline; width: auto; margin: 0 0.45em 0 0; }
  body.hide-zh .sent .de { display: inline; line-height: 1.82; }
  .n-head .h-zh {
    margin-top: 6px;
    padding-top: 0;
    color: var(--ink);
    font: 750 clamp(21px, 3vw, 28px)/1.25 ui-serif, Georgia, "Noto Serif CJK SC", "Noto Serif SC", serif;
    letter-spacing: -.025em;
  }
  .article-extras details { margin-top: 10px; border: 1px solid var(--line); border-radius: 13px; background: var(--surface-2); }
  .article-extras details summary {
    list-style: none; cursor: pointer; padding: 12px 14px; color: var(--ink-soft);
    display: flex; align-items: center; gap: 9px; font-size: 13px; font-weight: 750;
  }
  .article-extras details summary::before {
    content: "+"; display: inline-grid; place-items: center; width: 20px; height: 20px;
    border-radius: 7px; background: var(--surface); color: var(--accent); font-size: 14px;
  }
  .article-extras details[open] summary::before { content: "−"; }
  .article-extras details summary::-webkit-details-marker { display: none; }
  .article-extras details .body { padding: 2px 14px 15px 43px; color: var(--ink-soft); font-size: 13.5px; line-height: 1.75; }
  .article-extras details .body strong { color: var(--ink); }
  .vcard { display: grid; grid-template-columns: minmax(0,1fr) 28px; gap: 8px; align-items: start; padding: 10px 0; border-bottom: 1px dashed var(--line); }
  .vcard:last-child { border-bottom: 0; }
  .gcard { padding: 12px 0; border-bottom: 1px dashed var(--line); }
  .gcard:last-child { border-bottom: 0; }
  .vcard-top, .gcard h4 { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px; font: 750 14.5px/1.35 ui-serif, Georgia, serif; color: var(--ink); }
  .article-extras .vadd {
    width: 28px; height: 28px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--surface); color: var(--accent-strong); cursor: pointer;
    font: 700 18px/1 ui-sans-serif, system-ui;
  }
  .vpos { color: var(--ink-soft); font: 750 11px/1.2 ui-sans-serif, system-ui; letter-spacing: .06em; text-transform: uppercase; }
  .vzh { margin-top: 4px; color: var(--accent-strong); font-size: 13.5px; }
  .vex, .gex { margin-top: 6px; color: var(--ink-soft); font-size: 13px; font-style: italic; }
  .gexzh { color: var(--zh); font-size: 12.5px; }
  .gmore { margin-top: 8px; color: var(--ink-soft); font-size: 13px; }
  .bg-note { margin: 0 0 8px; color: var(--ink-soft); font-size: 12px; }

  .scrim { position: fixed; inset: 0; z-index: 55; display: none; background: rgba(7,16,18,.48); backdrop-filter: blur(3px); }
  .scrim.on { display: block; }
  #pop {
    position: fixed; z-index: 70; display: none; width: min(360px, calc(100vw - 24px));
    border: 1px solid var(--line); border-radius: 18px; padding: 18px;
    background: var(--surface); color: var(--ink); box-shadow: var(--shadow);
  }
  #pop.open { display: block; }
  .pop-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  #pop .pw { font: 750 21px/1.2 ui-serif, Georgia, serif; word-break: break-word; }
  #pop .pp { margin-top: 3px; color: var(--ink-soft); font-size: 11px; font-weight: 750; letter-spacing: .08em; text-transform: uppercase; }
  #pop .pclose { border: 0; background: var(--surface-2); color: var(--ink-soft); width: 30px; height: 30px; border-radius: 9px; cursor: pointer; }
  #pop .pz { margin-top: 12px; color: var(--accent-strong); font-weight: 700; }
  #pop .pz:empty::after { content: "还没有释义，你可以自己补充"; color: var(--ink-soft); font-weight: 400; }
  #pop .pe { margin-top: 9px; padding-top: 9px; border-top: 1px solid var(--line); color: var(--ink-soft); font-size: 12.5px; font-style: italic; }
  .pop-actions { display: flex; gap: 8px; margin-top: 14px; }
  .pbtn, .secondary-btn, .primary-btn {
    min-height: 40px; border-radius: 11px; padding: 0 13px; cursor: pointer; font-size: 13px; font-weight: 750;
  }
  .pbtn { flex: 1; border: 1px solid var(--accent); background: var(--accent); color: #fff; }
  .pbtn.in { border-color: var(--line); background: var(--surface-2); color: var(--ink-soft); }
  .secondary-btn { border: 1px solid var(--line); background: var(--surface); color: var(--ink-soft); }
  .primary-btn { border: 1px solid var(--accent); background: var(--accent); color: #fff; }
  .word-form { display: grid; gap: 11px; }
  .word-form label { display: grid; gap: 5px; color: var(--ink-soft); font-size: 12px; font-weight: 700; }
  .word-form input, .word-form textarea {
    width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px;
    background: var(--surface-2); color: var(--ink); resize: vertical;
  }
  .word-form textarea { min-height: 66px; }
  .form-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 3px; }

  #basket-btn {
    position: fixed; right: 22px; bottom: max(22px, env(safe-area-inset-bottom)); z-index: 45;
    display: inline-flex; align-items: center; gap: 9px; min-height: 48px; padding: 0 18px;
    border: 0; border-radius: 15px; background: var(--ink); color: var(--surface);
    box-shadow: var(--shadow); cursor: pointer; font-weight: 800;
  }
  #basket-btn .cnt { min-width: 23px; padding: 2px 7px; border-radius: 99px; background: var(--warm); color: #172127; font-size: 12px; }
  #basket {
    position: fixed; inset: 0 0 0 auto; z-index: 65; width: min(440px, 100vw);
    display: flex; flex-direction: column; padding: 24px 24px calc(24px + env(safe-area-inset-bottom));
    background: var(--surface); box-shadow: -20px 0 60px rgba(7,16,18,.18);
    transform: translateX(105%); transition: transform .22s ease;
  }
  #basket.open { transform: translateX(0); }
  #basket .bhead { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 16px; }
  #basket .bhead h3 { font-size: 22px; letter-spacing: -.02em; }
  #basket .bhead p { margin-top: 2px; color: var(--ink-soft); font-size: 12.5px; }
  #basket .bclose { border: 0; background: var(--surface-2); color: var(--ink-soft); width: 36px; height: 36px; border-radius: 11px; font-size: 20px; cursor: pointer; }
  .basket-add { width: 100%; margin-bottom: 12px; }
  #basket .blist { overflow-y: auto; flex: 1; padding-right: 4px; }
  .bitem { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 5px 10px; padding: 13px 0; border-bottom: 1px solid var(--line); }
  .bitem .bw { font: 750 16px/1.3 ui-serif, Georgia, serif; }
  .bitem .bz { grid-column: 1; color: var(--accent-strong); font-size: 13px; }
  .bitem .be { grid-column: 1; overflow: hidden; color: var(--ink-soft); font-size: 11.5px; text-overflow: ellipsis; white-space: nowrap; }
  .bitem-actions { grid-column: 2; grid-row: 1 / span 3; align-self: center; display: flex; gap: 3px; }
  .bitem-actions button { border: 0; background: transparent; color: var(--ink-soft); padding: 7px; cursor: pointer; font-size: 12px; }
  .bitem-actions .bx { color: var(--danger); }
  #basket .bfoot { display: flex; gap: 8px; margin-top: 14px; }
  #basket .bfoot button { flex: 1; }
  #basket .bfoot button:disabled { opacity: .5; cursor: wait; }
  #basket .bstatus { min-height: 18px; margin-top: 8px; color: var(--ink-soft); text-align: center; font-size: 12px; }
  .bempty { padding: 42px 14px; color: var(--ink-soft); text-align: center; font-size: 13px; }
  .bempty b { display: block; margin-bottom: 5px; color: var(--ink); font-size: 15px; }
  #word-editor {
    display: none; padding: 15px; margin-bottom: 12px; border: 1px solid var(--line);
    border-radius: 14px; background: var(--surface-2);
  }
  #word-editor.open { display: block; }
  #toast {
    position: fixed; left: 50%; bottom: 28px; z-index: 90; display: none;
    transform: translateX(-50%); padding: 10px 16px; border-radius: 12px;
    background: var(--ink); color: var(--surface); box-shadow: var(--shadow); font-size: 13px; font-weight: 700;
  }
  @media (max-width: 840px) {
    .app { width: min(100% - 28px, 720px); padding-top: 15px; padding-left: max(14px, env(safe-area-inset-left)); padding-right: max(14px, env(safe-area-inset-right)); }
    .topbar { margin-bottom: 24px; }
    .study-grid { display: block; }
    .side { position: static; max-height: none; margin-bottom: 18px; }
    .study-panel { display: contents; max-height: none; }
    .video-card { border-radius: 20px; box-shadow: var(--shadow); }
    .rail {
      position: sticky; top: env(safe-area-inset-top); z-index: 30; margin: 10px 0 18px; padding: 8px 12px;
      border-radius: 20px;
    }
    .rail-bar { padding: 0; }
    .topic-nav { display: none; }
    .video-card.floating {
      position: fixed; z-index: 48; top: 72px; right: 10px; left: auto; width: min(48vw, 210px);
      border: 1px solid rgba(255,255,255,.2); border-radius: 14px; box-shadow: 0 18px 45px rgba(0,0,0,.28);
    }
    .video-card.floating .video-drag { display: block; }
    .video-card.floating .video-float-close { display: block; position: absolute; z-index: 4; top: 6px; right: 6px; }
    .video-card.float-off { display: none; }
    article { border-radius: 20px; }
  }
  @media (max-width: 560px) {
    .app { width: 100%; padding: 12px 12px 88px; padding-left: max(12px, env(safe-area-inset-left)); padding-right: max(12px, env(safe-area-inset-right)); }
    .brand span:last-child { display: none; }
    .text-btn { padding: 0 10px; font-size: 12px; }
    .archive-link { width: 38px; padding: 0; font-size: 0; }
    .archive-link svg { width: 17px; }
    .hero { padding: 0 5px; margin-bottom: 18px; }
    .hero h1 { font-size: 30px; }

<script>
const DATA = {"date": "2026-09-05", "slug": "2026-09-05-20uhr", "source": "20uhr", "source_label": "T-64 · tagesschau 20:00 Uhr", "source_short": "20:00 Uhr", "video_page": "https://www.tagesschau.de/tagesschau_20_uhr/video-1643430.html", "embed_url": "https://www.tagesschau.de/tagesschau_20_uhr/video-1643430~player.html", "mp4_url": "https://tagesschau-progressive.ard-mcdn.de/video/2026/0905/TV-20260905-2022-5900.webl.h264.mp4", "duration": 937.8, "news": [{"title": "Cyberangriff auf Berliner Landesverwaltung", "title_zh": "柏林州政府遭网络攻击 黑客在暗网公布敏感数据", "paras": [{"start": 4.64, "end": 47.2, "lines": [{"de": "Nach dem Cyberangriff auf die Berliner Landesverwaltung sind die Folgen nicht absehbar.", "zh": "柏林州政府遭网络攻击后，后果仍无法预料。", "start": 4.64, "end": 27.0}, {"de": "Hacker hatten gestern sensible Daten im Darknet veröffentlicht, weil der Senat kein Lösegeld zahlen wollte.", "zh": "由于参议院拒绝支付赎金，黑客昨天已在暗网公布了敏感数据。", "start": 27.08, "end": 33.64}, {"de": "Das Bundesamt für Sicherheit in der Informationstechnik warnte vor einer erhöhten Bedrohungslage.", "zh": "联邦信息技术安全局警告威胁等级升高。", "start": 33.72, "end": 39.76}, {"de": "Die Behörde unterstützt bei den Ermittlungen, ebenso das BKA und das Bundesamt für Verfassungsschutz.", "zh": "该局正协助调查，联邦刑警局和联邦宪法保卫局也参与其中。", "start": 39.84, "end": 47.2}]}, {"start": 49.08, "end": 82.56, "lines": [{"de": "Kaum lief das Ultimatum ab, erschien die Nachricht von der kriminellen Hackergruppe Rhysida: 5,26 Terrabyte, 1,4 Millionen Dateien seien nun im Netz, behauptet sie.", "zh": "最后通牒刚一到期，犯罪黑客组织 Rhysida 的消息就来了：他们声称，5.26 TB、140 万份文件现已挂到网上。", "start": 49.08, "end": 59.84}, {"de": "Seit einer Woche lief der Erpressungsversuch: 2 Millionen Euro oder Veröffentlichung.", "zh": "这场勒索已持续一周：要么 200 万欧元，要么公开数据。", "start": 60.52, "end": 65.72}, {"de": "Die Reaktion: Das Land Berlin wird sich nicht erpressen lassen.", "zh": "柏林州的回应是：柏林州不会被勒索。", "start": 65.8, "end": 71.4}, {"de": "Nun sind sie im Darknet: Daten der Bau-, Verkehrs- und Umweltverwaltung, Telefonnummern, Scans von Ausweisen, Mails.", "zh": "现在这些数据已在暗网：建筑、交通和环保部门的数据，电话号码、证件扫描件、邮件。", "start": 71.88, "end": 79.76}, {"de": "Informationen über kritische Infrastruktur.", "zh": "还有关于关键基础设施的信息。", "start": 79.84, "end": 82.56}]}, {"start": 82.64, "end": 115.52, "lines": [{"de": "In Berlin - Versuche der Schadensbegrenzung.", "zh": "柏林正在设法控制损失。", "start": 82.64, "end": 85.84}, {"de": "Wenn sich herausstellt, dass Bürger und Beschäftigte betroffen sind, werden sie schnellstmöglich informiert.", "zh": "一旦查明有市民和公务人员受影响，将尽快通知他们本人。", "start": 86.08, "end": 95.16}, {"de": "Womöglich merkt manch einer ziemlich schnell, dass seine Daten abgegriffen wurden.", "zh": "也许有些人很快就会发现，自己的数据被人窃取了。", "start": 97.08, "end": 103.0}, {"de": "Ganz wichtig ist, dass man in der nächsten Zeit achtsam ist, wer einen kontaktiert.", "zh": "接下来这段时间非常重要的是，留心是谁来联系你。", "start": 103.24, "end": 109.12}, {"de": "Ob komische Menschen anrufen, komische Mails geschickt werden, komische Anfragen kommen.", "zh": "会不会有可疑的人打来电话、发来奇怪的邮件、提出奇怪的要求。", "start": 110.16, "end": 115.52}]}, {"start": 115.64, "end": 154.24, "lines": [{"de": "Es gibt heftige Kritik an Berlin: Ausgerechnet bei der IT-Sicherheit wurde gespart, Sicherheitsstandards wurden offenbar missachtet.", "zh": "柏林正遭到猛烈批评：偏偏在 IT 安全面上省钱，安全标准显然被无视。", "start": 115.64, "end": 124.84}, {"de": "Ich bin sprachlos, dass man es schafft, geheimschutzrelevante Daten lapidar zu speichern.", "zh": "我简直无言以对，涉及机密保护的数据竟被如此漫不经心地存储。", "start": 127.84, "end": 131.36}, {"de": "Und nicht abgeschottet abzusichern, so, wie es die Vorgaben sind.", "zh": "也没有按照规范要求隔离开来、加以保护。", "start": 131.44, "end": 135.52}, {"de": "Man hat Baupläne von Justizvollzugsanstalten im Netz.", "zh": "监狱的建筑图纸已经流到了网上。", "start": 135.6, "end": 139.12}, {"de": "Man hat sogar die für einen Verteidigungsfall relevanten kritischen Infrastrukturen veröffentlicht.", "zh": "甚至连国防紧急情况下至关重要的关键基础设施也被公开了。", "start": 139.2, "end": 145.6}, {"de": "Terroristen werden sich freuen.", "zh": "恐怖分子会喜闻乐见。", "start": 145.68, "end": 148.08}, {"de": "Berlin muss sein Sicherheitssystem im großen Stil verändern, so der Chaos Computer Club.", "zh": "混沌计算机俱乐部说，柏林必须大刀阔斧地改造它的安全体系。", "start": 148.68, "end": 154.24}]}], "vocab": [{"lemma": "die Landesverwaltung, -en", "key": "landesverwaltung", "forms": ["Landesverwaltung"], "pos": "Substantiv", "zh": "州政府、州行政机关", "example_de": "Nach dem Cyberangriff auf die Berliner Landesverwaltung sind die Folgen nicht absehbar.", "example_zh": ""}, {"lemma": "das Lösegeld, -er", "key": "loesegeld", "forms": ["Lösegeld"], "pos": "Substantiv", "zh": "赎金", "example_de": "Hacker hatten gestern sensible Daten im Darknet veröffentlicht, weil der Senat kein Lösegeld zahlen wollte.", "example_zh": ""}, {"lemma": "die Bedrohungslage", "key": "bedrohungslage", "forms": ["Bedrohungslage"], "pos": "Substantiv", "zh": "威胁态势", "example_de": "Das Bundesamt für Sicherheit in der Informationstechnik warnte vor einer erhöhten Bedrohungslage.", "example_zh": ""}, {"lemma": "das Ultimatum, Ultimaten", "key": "ultimatum", "forms": ["Ultimatum"], "pos": "Substantiv", "zh": "最后通牒", "example_de": "Kaum lief das Ultimatum ab, erschien die Nachricht von der kriminellen Hackergruppe Rhysida: 5,26 Terrabyte, 1,4 Millionen Dateien seien nun im Netz, behauptet sie.", "example_zh": ""}, {"lemma": "die Schadensbegrenzung, -en", "key": "schadensbegrenzung", "forms": ["Schadensbegrenzung"], "pos": "Substantiv", "zh": "损失控制", "example_de": "In Berlin - Versuche der Schadensbegrenzung.", "example_zh": ""}, {"lemma": "achtsam", "key": "achtsam", "forms": ["achtsam"], "pos": "Adjektiv", "zh": "警惕留心的、谨慎的", "example_de": "Ganz wichtig ist, dass man in der nächsten Zeit achtsam ist, wer einen kontaktiert.", "example_zh": ""}, {"lemma": "abgreifen", "key": "abgreifen", "forms": ["abgegriffen", "abgreifen"], "pos": "Verb", "zh": "窃取、捞取", "example_de": "Womöglich merkt manch einer ziemlich schnell, dass seine Daten abgegriffen wurden.", "example_zh": ""}, {"lemma": "geheimschutzrelevant", "key": "geheimschutzrelevant", "forms": ["geheimschutzrelevante", "geheimschutzrelevant"], "pos": "Adjektiv", "zh": "涉及机密保护的", "example_de": "Ich bin sprachlos, dass man es schafft, geheimschutzrelevante Daten lapidar zu speichern.", "example_zh": ""}, {"lemma": "die Justizvollzugsanstalt, -en", "key": "justizvollzugsanstalt", "forms": ["Justizvollzugsanstalten", "Justizvollzugsanstalt"], "pos": "Substantiv", "zh": "监狱、刑罚执行机构", "example_de": "Man hat Baupläne von Justizvollzugsanstalten im Netz.", "example_zh": ""}, {"lemma": "im großen Stil", "key": "im-grossen-stil", "forms": ["im großen Stil"], "pos": "Redewendung", "zh": "大规模地、大刀阔斧地", "example_de": "Berlin muss sein Sicherheitssystem im großen Stil verändern, so der Chaos Computer Club.", "example_zh": ""}], "grammar_points": [{"title": "Konjunktiv I 间接引语", "summary": "新闻转述他人说法时用第一虚拟式：sein 的第三人称复数形式是 seien。本句转述黑客组织的声明。", "example_de": "5,26 Terrabyte, 1,4 Millionen Dateien seien nun im Netz, behauptet sie.", "example_zh": "该组织声称，5.26 TB、140 万份文件现已上网。"}, {"title": "kaum ... erschien（kaum + 倒装）", "summary": "kaum（刚一……就）占句首时动词紧随其后，表示两件事几乎同时发生。", "example_de": "Kaum lief das Ultimatum ab, erschien die Nachricht von der kriminellen Hackergruppe Rhysida: 5,26 Terrabyte, 1,4 Millionen Dateien seien nun im Netz, behauptet sie.", "example_zh": "最后通牒刚一到期，犯罪黑客组织 Rhysida 的消息就来了。"}], "background": "背景：攻击柏林州政府的是勒索软件组织 Rhysida。柏林拒绝支付约 200 万欧元赎金后，该组织在暗网分批公开窃取的数据，涉及建筑、交通、环保部门和市民个人信息，联邦信息安全局（BSI）与联邦刑警局均已介入。引语来自州政府官员与反对党政治家；Chaos Computer Club（混沌计算机俱乐部）是欧洲最著名的黑客组织，常批评政府 IT 安全漏洞。"}, {"title": "Fahndung nach Stromnetz-Saboteur", "title_zh": "电网破坏案 警方锁定一名嫌疑人", "paras": [{"start": 155.16, "end": 180.32, "lines": [{"de": "Die Polizei sucht nach einem Mann, der für Sabotage-Versuche gegen das Stromnetz verantwortlich sein soll.", "zh": "警方正在搜寻一名男子，他据称应对针对电网的一系列破坏企图负责。", "start": 155.16, "end": 162.08}, {"de": "Er hatte in zwei Bekennerbriefen seinen richtigen Absender angegeben und geschrieben, er wolle gegen fossile Energieträger protestieren.", "zh": "他在两封认罪声明信里写下了真实署名，并写道他想抗议化石能源。", "start": 162.16, "end": 171.16}, {"de": "Nach den Anschlagsversuchen in Brandenburg und NRW wurden auch in Sachsen Sprengvorrichtungen in der Nähe von Umspannwerken entdeckt.", "zh": "继勃兰登堡州和北威州的袭击未遂之后，萨克森州也在变电站附近发现了爆炸装置。", "start": 171.28, "end": 180.32}]}, {"start": 181.84, "end": 235.28, "lines": [{"de": "Fragen wir nach bei Michael Götschenberg in Berlin.", "zh": "我们来连线柏林的 Michael Götschenberg。", "start": 181.84, "end": 185.72}, {"de": "Gibt es einen Zusammenhang zwischen den Sabotagevorfällen der vergangenen Tage?", "zh": "过去这几天的破坏事件之间有关联吗？", "start": 185.8, "end": 191.44}, {"de": "Es gibt nach meinen Informationen für die Ermittler keinen Zweifel, dass die Tatorte miteinander in Verbindung stehen.", "zh": "据我了解，调查人员毫不怀疑这些作案地点相互关联。", "start": 193.48, "end": 201.6}, {"de": "Sie werden alle in beiden Bekennerschreiben genannt.", "zh": "它们在两封认罪声明信里全都被提到。", "start": 201.8, "end": 205.72}, {"de": "Ein Mann (48) aus Nordrhein-Westfalen steht im Fokus der Ermittlungen.", "zh": "一名来自北威州的 48 岁男子是调查焦点。", "start": 205.96, "end": 212.64}, {"de": "Die Schreiben enthalten sehr viel exklusives Täterwissen.", "zh": "这些信件包含大量只有作案者才掌握的内情。", "start": 212.92, "end": 216.92}, {"de": "In seiner Wohnung wurden gestern Sprengstoffspuren gefunden.", "zh": "昨天在他的住所里发现了炸药痕迹。", "start": 217.4, "end": 221.6}, {"de": "Man kann aber noch nicht mit letzter Sicherheit sagen, ob noch weitere Personen beteiligt gewesen sein könnten.", "zh": "但目前还无法完全确定，是否曾有其他人员参与。", "start": 226.72, "end": 235.28}]}, {"start": 236.36, "end": 288.52, "lines": [{"de": "Wie gefährlich sind diese Sabotageaktionen?", "zh": "这些破坏行动有多危险？", "start": 236.36, "end": 239.6}, {"de": "Der Plan, durch Kurzschlüsse die Stromversorgung regional zum Erliegen zu bringen, dieser Plan ist nicht aufgegangen.", "zh": "想通过短路让区域供电陷入瘫痪——这个计划没有得逞。", "start": 242.08, "end": 250.6}, {"de": "Das ist ein neuer Modus Operandi, den die Ermittler so noch nicht kannten.", "zh": "这是一种调查人员此前从未见过的作案手法。", "start": 250.72, "end": 255.88}, {"de": "In der Vergangenheit hatten wir Brandanschläge auf die Stromversorgung immer wieder gesehen.", "zh": "过去我们一再看到针对供电设施的纵火袭击。", "start": 256.96, "end": 263.4}, {"de": "Sie wurden mutmaßlich verübt durch linksextremistische Gruppen.", "zh": "据推测是左翼极端团体所为。", "start": 263.6, "end": 267.88}, {"de": "Dieses Sicherheitsrisiko ist seit vielen Jahren bekannt.", "zh": "这一安全风险多年来人尽皆知。", "start": 268.08, "end": 272.16}, {"de": "Dementsprechend ist die Diskussion erneut in Gang gekommen, inwieweit das Stromnetz besser geschützt werden kann und muss.", "zh": "因此，电网应该且能够得到怎样的更好保护，讨论再度兴起。", "start": 272.28, "end": 280.24}, {"de": "Klar ist aber auch, dass sich das Risiko nicht gänzlich wird ausschließen lassen.", "zh": "但同样清楚的是，这个风险无法完全排除。", "start": 280.36, "end": 285.44}, {"de": "Vielen Dank, Michael Götschenberg in Berlin.", "zh": "谢谢柏林的 Michael Götschenberg。", "start": 285.56, "end": 288.52}]}], "vocab": [{"lemma": "die Sabotage, -n", "key": "sabotage", "forms": ["Sabotage-Versuche", "Sabotageaktionen", "Sabotagevorfällen", "Sabotage"], "pos": "Substantiv", "zh": "破坏（行动）", "example_de": "Die Polizei sucht nach einem Mann, der für Sabotage-Versuche gegen das Stromnetz verantwortlich sein soll.", "example_zh": ""}, {"lemma": "der Bekennerbrief, -e", "key": "bekennerbrief", "forms": ["Bekennerbriefen", "Bekennerschreiben", "Bekennerbrief"], "pos": "Substantiv", "zh": "认罪声明信、宣称负责的信", "example_de": "Er hatte in zwei Bekennerbriefen seinen richtigen Absender angegeben und geschrieben, er wolle gegen fossile Energieträger protestieren.", "example_zh": ""}, {"lemma": "der fossile Energieträger", "key": "fossiler-energietraeger", "forms": ["fossile Energieträger"], "pos": "Substantiv", "zh": "化石能源", "example_de": "Er hatte in zwei Bekennerbriefen seinen richtigen Absender angegeben und geschrieben, er wolle gegen fossile Energieträger protestieren.", "example_zh": ""}, {"lemma": "die Sprengvorrichtung, -en", "key": "sprengvorrichtung", "forms": ["Sprengvorrichtungen", "Sprengvorrichtung"], "pos": "Substantiv", "zh": "爆炸装置", "example_de": "Nach den Anschlagsversuchen in Brandenburg und NRW wurden auch in Sachsen Sprengvorrichtungen in der Nähe von Umspannwerken entdeckt.", "example_zh": ""}, {"lemma": "das Umspannwerk, -e", "key": "umspannwerk", "forms": ["Umspannwerken", "Umspannwerk"], "pos": "Substantiv", "zh": "变电站", "example_de": "Nach den Anschlagsversuchen in Brandenburg und NRW wurden auch in Sachsen Sprengvorrichtungen in der Nähe von Umspannwerken entdeckt.", "example_zh": ""}, {"lemma": "im Fokus der Ermittlungen stehen", "key": "im-fokus-stehen", "forms": ["steht im Fokus der Ermittlungen", "im Fokus der Ermittlungen stehen"], "pos": "Redewendung", "zh": "是调查的焦点", "example_de": "Ein Mann (48) aus Nordrhein-Westfalen steht im Fokus der Ermittlungen.", "example_zh": ""}, {"lemma": "die Sprengstoffspur, -en", "key": "sprengstoffspur", "forms": ["Sprengstoffspuren", "Sprengstoffspur"], "pos": "Substantiv", "zh": "炸药痕迹", "example_de": "In seiner Wohnung wurden gestern Sprengstoffspuren gefunden.", "example_zh": ""}, {"lemma": "zum Erliegen bringen", "key": "zum-erliegen-bringen", "forms": ["zum Erliegen zu bringen", "zum Erliegen bringen"], "pos": "Redewendung", "zh": "使……陷入停顿、使瘫痪", "example_de": "Der Plan, durch Kurzschlüsse die Stromversorgung regional zum Erliegen zu bringen, dieser Plan ist nicht aufgegangen.", "example_zh": ""}, {"lemma": "der Modus Operandi", "key": "modus-operandi", "forms": ["Modus Operandi"], "pos": "Substantiv", "zh": "作案手法（拉丁语借词）", "example_de": "Das ist ein neuer Modus Operandi, den die Ermittler so noch nicht kannten.", "example_zh": ""}, {"lemma": "verüben", "key": "verueben", "forms": ["verübt", "verüben"], "pos": "Verb", "zh": "实施、干（罪行）", "example_de": "Sie wurden mutmaßlich verübt durch linksextremistische Gruppen.", "example_zh": ""}], "grammar_points": [{"title": "sollen（传闻转述）", "summary": "情态动词 sollen 在新闻中表示“据称、据说”，转述尚未证实的说法：verantwortlich sein soll = 据称应负责。", "example_de": "Die Polizei sucht nach einem Mann, der für Sabotage-Versuche gegen das Stromnetz verantwortlich sein soll.", "example_zh": "警方正在搜寻一名据称应对电网破坏企图负责的男子。"}, {"title": "in Gang kommen", "summary": "固定搭配“启动、开展起来”：die Diskussion ist erneut in Gang gekommen = 讨论再度兴起。", "example_de": "Dementsprechend ist die Diskussion erneut in Gang gekommen, inwieweit das Stromnetz besser geschützt werden kann und muss.", "example_zh": "电网应该且能够得到怎样的更好保护，讨论再度兴起。"}], "background": "背景：德国多地电网设施接连遭到人为破坏，嫌疑人在认罪信中留下真实姓名地址，动机据称是抗议化石能源。本段是演播室与驻柏林记者 Michael Götschenberg 的连线问答。Modus Operandi 为拉丁语借词，新闻和司法语境常用。"}, {"title": "UN stimmt für neue Weltkarte", "title_zh": "联合国投票决定换用新的世界地图", "paras": [{"start": 289.28, "end": 316.24, "lines": [{"de": "Die UN-Generalversammlung hat für eine neue Darstellung der Weltkarte gestimmt.", "zh": "联合国大会投票决定采用新的世界地图呈现方式。", "start": 289.28, "end": 295.2}, {"de": "Bisher wurde die \"Mercator-Projektion\" verwendet.", "zh": "此前使用的一直是“墨卡托投影”。", "start": 295.44, "end": 299.32}, {"de": "Sie stammt aus dem 16. Jahrhundert.", "zh": "它诞生于 16 世纪。", "start": 299.88, "end": 302.4}, {"de": "Künftig sollen Weltkarten stärker die Größenverhältnisse zeigen.", "zh": "今后世界地图将更加突出真实的面积比例。", "start": 302.48, "end": 307.04}, {"de": "Afrika etwa wird dann präziser und größer dargestellt.", "zh": "比如非洲届时会被呈现得更精确、也更大。", "start": 308.88, "end": 312.72}, {"de": "Gegen diese Änderung stimmten nur die USA.", "zh": "对这一变更投反对票的只有美国。", "start": 313.32, "end": 316.24}]}], "vocab": [{"lemma": "die UN-Generalversammlung", "key": "un-generalversammlung", "forms": ["UN-Generalversammlung"], "pos": "Substantiv", "zh": "联合国大会", "example_de": "Die UN-Generalversammlung hat für eine neue Darstellung der Weltkarte gestimmt.", "example_zh": ""}, {"lemma": "die Darstellung, -en", "key": "darstellung", "forms": ["Darstellung", "dargestellt"], "pos": "Substantiv", "zh": "呈现、表示方式", "example_de": "Die UN-Generalversammlung hat für eine neue Darstellung der Weltkarte gestimmt.", "example_zh": ""}, {"lemma": "die Projektion, -en", "key": "projektion", "forms": ["Mercator-Projektion", "Projektion"], "pos": "Substantiv", "zh": "投影、投影法", "example_de": "Bisher wurde die \"Mercator-Projektion\" verwendet.", "example_zh": ""}, {"lemma": "die Größenverhältnisse", "key": "groessenverhaeltnisse", "forms": ["Größenverhältnisse"], "pos": "Substantiv", "zh": "大小比例、面积比例", "example_de": "Künftig sollen Weltkarten stärker die Größenverhältnisse zeigen.", "example_zh": ""}, {"lemma": "gegen etwas stimmen", "key": "gegen-stimmen", "forms": ["stimmten", "gegen etwas stimmen"], "pos": "Redewendung", "zh": "投票反对某事", "example_de": "Gegen diese Änderung stimmten nur die USA.", "example_zh": ""}, {"lemma": "präzise", "key": "praezise", "forms": ["präziser", "präzise"], "pos": "Adjektiv", "zh": "精确的", "example_de": "Afrika etwa wird dann präziser und größer dargestellt.", "example_zh": ""}], "grammar_points": [{"title": "künftig sollen ... zeigen", "summary": "sollen 表计划或要求：“今后应更突出面积比例”。副词 künftig（今后）提在句首加强规划语气。", "example_de": "Künftig sollen Weltkarten stärker die Größenverhältnisse zeigen.", "example_zh": "今后世界地图应更加突出真实的面积比例。"}], "background": "背景：16 世纪佛兰德地图学家墨卡托（Mercator）发明的投影法便于航海，但严重夸大高纬度地区面积——格陵兰看起来与非洲相当，实际非洲面积约是它的 14 倍。联合国大会此次决定改用更忠实面积比例的地图，仅美国投了反对票。"}, {"title": "US-Vermittlung in Moskau", "title_zh": "美国特使赴莫斯科斡旋乌克兰战争", "paras": [{"start": 318.28, "end": 339.48, "lines": [{"de": "Die USA versuchen erneut, im Krieg zwischen der Ukraine und Russland zu vermitteln.", "zh": "美国再次尝试在俄乌战争中斡旋。", "start": 318.28, "end": 323.68}, {"de": "Dafür reisten die Sondergesandten Kushner und Witkoff nach Moskau.", "zh": "为此，特使 Kushner 和 Witkoff 前往莫斯科。", "start": 323.76, "end": 327.76}, {"de": "In diesen Minuten legen sie ihren Plan zur Beendigung des vier Jahre andauernden Krieges Russlands Präsident Putin vor.", "zh": "就在此刻，他们正向俄罗斯总统普京提交结束这场已持续四年的战争的计划。", "start": 327.84, "end": 335.48}, {"de": "Morgen reisen die Unterhändler in die Ukraine weiter.", "zh": "明天谈判代表们将接着前往乌克兰。", "start": 335.8, "end": 339.48}]}], "vocab": [{"lemma": "vermitteln", "key": "vermitteln", "forms": ["vermitteln"], "pos": "Verb", "zh": "斡旋、调解", "example_de": "Die USA versuchen erneut, im Krieg zwischen der Ukraine und Russland zu vermitteln.", "example_zh": ""}, {"lemma": "der Sondergesandte, -n", "key": "sondergesandte", "forms": ["Sondergesandten", "Sondergesandte"], "pos": "Substantiv", "zh": "特使", "example_de": "Dafür reisten die Sondergesandten Kushner und Witkoff nach Moskau.", "example_zh": ""}, {"lemma": "die Beendigung, -en", "key": "beendigung", "forms": ["Beendigung"], "pos": "Substantiv", "zh": "结束、终止", "example_de": "In diesen Minuten legen sie ihren Plan zur Beendigung des vier Jahre andauernden Krieges Russlands Präsident Putin vor.", "example_zh": ""}, {"lemma": "andauern", "key": "andauern", "forms": ["andauernden", "andauern"], "pos": "Verb", "zh": "持续、延续", "example_de": "In diesen Minuten legen sie ihren Plan zur Beendigung des vier Jahre andauernden Krieges Russlands Präsident Putin vor.", "example_zh": ""}, {"lemma": "der Unterhändler, -", "key": "unterhaendler", "forms": ["Unterhändler"], "pos": "Substantiv", "zh": "谈判代表", "example_de": "Morgen reisen die Unterhändler in die Ukraine weiter.", "example_zh": ""}, {"lemma": "vorlegen", "key": "vorlegen", "forms": ["legen ... vor", "vorlegen"], "pos": "Verb", "zh": "提交、呈递（方案）", "example_de": "In diesen Minuten legen sie ihren Plan zur Beendigung des vier Jahre andauernden Krieges Russlands Präsident Putin vor.", "example_zh": ""}], "grammar_points": [{"title": "zur Beendigung（zu + 名词化）", "summary": "名词化介词短语 zur Beendigung des Krieges（以结束……）替代目的从句，新闻德语高频。", "example_de": "In diesen Minuten legen sie ihren Plan zur Beendigung des vier Jahre andauernden Krieges Russlands Präsident Putin vor.", "example_zh": "他们正向普京提交结束这场持续四年的战争的计划。"}], "background": "背景：美国特使 Steve Witkoff 与 Jared Kushner 此行意在向普京递交停火方案。俄罗斯全面入侵乌克兰自 2022 年 2 月起，至 2026 年已进入第五个年头，故称“已持续四年的战争”。"}, {"title": "Getreide-Exporte stocken bei Odessa", "title_zh": "俄袭敖德萨 乌克兰粮食出口受阻", "paras": [{"start": 341.88, "end": 365.6, "lines": [{"de": "Die Ukraine gilt als die Kornkammer Europas.", "zh": "乌克兰被视为欧洲的粮仓。", "start": 341.88, "end": 344.84}, {"de": "Verschifft wird das Getreide über Odessa.", "zh": "粮食经敖德萨港海运出口。", "start": 344.92, "end": 348.4}, {"de": "Die Hafenstadt ist aber wie viele weitere Großstädte im Land immer wieder Ziel massiver russischer Luftangriffe.", "zh": "但这座港口城市和国内许多大城市一样，一再成为俄军大规模空袭的目标。", "start": 348.48, "end": 356.68}, {"de": "Damit macht Russland den Getreideexport nahezu unmöglich, der Schiffsverkehr in Odessa ist fast zum Erliegen gekommen.", "zh": "俄罗斯以此让粮食出口几乎无法进行，敖德萨的航运已濒临停摆。", "start": 357.24, "end": 365.6}]}, {"start": 367.2, "end": 396.28, "lines": [{"de": "Die Ernte ist gut in diesem Jahr, doch für Landwirt Jewhen wird gerade das zum Problem.", "zh": "今年收成很好，但对农民 Jewhen 来说，这恰恰成了问题。", "start": 367.2, "end": 373.24}, {"de": "Rund 600 Tonnen Weizen lagern auf seinem Hof im Süden der Region Odessa.", "zh": "他位于敖德萨州南部的农场上存放着约 600 吨小麦。", "start": 373.32, "end": 378.24}, {"de": "Dazu Gerste, Erbsen und Sonnenblumenkerne.", "zh": "还有大麦、豌豆和葵花籽。", "start": 378.32, "end": 381.12}, {"de": "Verkaufen will er nur das Nötigste.", "zh": "他只想卖掉最必需的那部分。", "start": 381.2, "end": 383.84}, {"de": "Wir verkaufen nur einen kleinen Teil, um Pacht und Diesel zu bezahlen, damit wir arbeiten können.", "zh": "我们只卖一小部分，用来付地租和柴油钱，好让农场能继续运转。", "start": 384.24, "end": 391.6}, {"de": "Wir können nicht mehr verkaufen, weil es keine guten Preise gibt.", "zh": "再多就卖不动了，因为没有好价钱。", "start": 391.8, "end": 396.28}]}, {"start": 397.8, "end": 429.04, "lines": [{"de": "Die Preise für seine Ernte seien eingebrochen: Bei Weizen um rund ein Viertel, bei Sonnenblumen sogar um fast 40 Prozent.", "zh": "据他所述，他的收成价格已经崩了：小麦跌了约四分之一，葵花籽甚至跌了近 40%。", "start": 397.8, "end": 405.48}, {"de": "Der wichtigste Weg auf den Weltmarkt funktioniert kaum noch.", "zh": "通往世界市场最重要的这条通道几乎失灵了。", "start": 405.56, "end": 409.0}, {"de": "Wegen russischer Angriffe auf Schiffe und Hafenanlagen ist der Schiffsverkehr bei Odessa fast zum Erliegen gekommen.", "zh": "由于俄军袭击船只和港口设施，敖德萨的航运已濒临停摆。", "start": 409.12, "end": 416.76}, {"de": "Die Reeder, Kapitäne und Besatzungsmitglieder fürchten um ihr Leben.", "zh": "船东、船长和船员们都在为性命担忧。", "start": 417.16, "end": 422.36}, {"de": "Es geht darum, ob sie überleben werden oder ob sie von russischen Drohnen und Raketen getötet werden.", "zh": "问题在于：他们能不能活下来，还是会被俄国的无人机和导弹打死。", "start": 422.44, "end": 429.04}]}, {"start": 429.72, "end": 487.36, "lines": [{"de": "Deshalb muss mehr Getreide über die Donauhäfen Ismajil und Reni raus.", "zh": "因此更多粮食必须经由多瑙河港 Ismajil 和 Reni 运出去。", "start": 429.72, "end": 434.08}, {"de": "Doch die können Odessa nicht ersetzen.", "zh": "但这两个港口替代不了敖德萨。", "start": 434.2, "end": 436.8}, {"de": "Niedrige Wasserstände begrenzen zusätzlich die Größe der Frachter.", "zh": "低水位还额外限制了货船的吨位。", "start": 436.88, "end": 440.88}, {"de": "Auch die Donauhäfen stehen fast täglich unter heftigem Beschuss.", "zh": "多瑙河各港也几乎每天都在遭受猛烈炮击。", "start": 440.96, "end": 445.16}, {"de": "Vor Ismajil warten Lkw voller Getreide kilometerweit am Straßenrand.", "zh": "Ismajil 港外，满载粮食的卡车沿着路边排出去好几公里。", "start": 445.24, "end": 449.96}, {"de": "Wiktor stehe seit drei Tagen hier, Kollegen von ihm seit Wochen.", "zh": "据说 Wiktor 在这里已经等了三天，他的同事们已经等了好几周。", "start": 450.08, "end": 454.36}, {"de": "Früher habe die Abfertigung meist nur einen Tag gedauert.", "zh": "以前办完装卸手续通常只要一天。", "start": 455.08, "end": 459.12}, {"de": "Wir warten darauf, dass wir in den Hafen fahren können und kein Luftalarm mehr ist.", "zh": "我们就在等着能进港，等着空袭警报解除。", "start": 459.2, "end": 465.0}, {"de": "Es gibt so viele Alarme, die den Betrieb lahmlegen.", "zh": "警报太多了，整个运转都被拖瘫了。", "start": 465.08, "end": 468.32}, {"de": "Niemand weiß Bescheid.", "zh": "谁也说不准情况。", "start": 468.4, "end": 469.8}, {"de": "Es geht nur sehr langsam voran.", "zh": "一切只能非常缓慢地推进。", "start": 469.88, "end": 471.96}, {"de": "Und die nächste Ernte steht bevor.", "zh": "而下一次收获已经临近。", "start": 472.16, "end": 474.64}, {"de": "Im Herbst wird Mais eingebracht.", "zh": "秋天就要收玉米了。", "start": 474.72, "end": 476.76}, {"de": "Dann könnten auch die Lagerhallen nicht mehr ausreichen.", "zh": "到那时连仓库都可能不够用。", "start": 476.88, "end": 480.32}, {"de": "Während sich bei Landwirten das Getreide stapelt und die Preise fallen, wird es auf dem Weltmarkt teurer.", "zh": "农民手里粮食越堆越高、价格一路下滑的同时，世界市场上的粮价却在上涨。", "start": 480.4, "end": 487.36}]}], "vocab": [{"lemma": "die Kornkammer", "key": "kornkammer", "forms": ["Kornkammer"], "pos": "Substantiv", "zh": "粮仓（比喻粮食丰产之地）", "example_de": "Die Ukraine gilt als die Kornkammer Europas.", "example_zh": ""}, {"lemma": "verschiffen", "key": "verschiffen", "forms": ["Verschifft", "verschiffen"], "pos": "Verb", "zh": "船运、海运发出", "example_de": "Verschifft wird das Getreide über Odessa.", "example_zh": ""}, {"lemma": "der Landwirt, -e", "key": "landwirt", "forms": ["Landwirt", "Landwirten"], "pos": "Substantiv", "zh": "农民、农场主", "example_de": "Die Ernte ist gut in diesem Jahr, doch für Landwirt Jewhen wird gerade das zum Problem.", "example_zh": ""}, {"lemma": "die Pacht, -en", "key": "pacht", "forms": ["Pacht"], "pos": "Substantiv", "zh": "地租、租金", "example_de": "Wir verkaufen nur einen kleinen Teil, um Pacht und Diesel zu bezahlen, damit wir arbeiten können.", "example_zh": ""}, {"lemma": "einbrechen (Preise)", "key": "einbrechen", "forms": ["eingebrochen", "einbrechen"], "pos": "Verb", "zh": "暴跌、崩溃（价格）", "example_de": "Die Preise für seine Ernte seien eingebrochen: Bei Weizen um rund ein Viertel, bei Sonnenblumen sogar um fast 40 Prozent.", "example_zh": ""}, {"lemma": "der Reeder, -", "key": "reeder", "forms": ["Reeder"], "pos": "Substantiv", "zh": "船东、航运公司主", "example_de": "Die Reeder, Kapitäne und Besatzungsmitglieder fürchten um ihr Leben.", "example_zh": ""}, {"lemma": "der Beschuss", "key": "beschuss", "forms": ["Beschuss"], "pos": "Substantiv", "zh": "炮击、射击", "example_de": "Auch die Donauhäfen stehen fast täglich unter heftigem Beschuss.", "example_zh": ""}, {"lemma": "die Abfertigung, -en", "key": "abfertigung", "forms": ["Abfertigung"], "pos": "Substantiv", "zh": "（货物）通关、装卸办理", "example_de": "Früher habe die Abfertigung meist nur einen Tag gedauert.", "example_zh": ""}, {"lemma": "lahmlegen", "key": "lahmlegen", "forms": ["lahmlegen"], "pos": "Verb", "zh": "使瘫痪、使停摆", "example_de": "Es gibt so viele Alarme, die den Betrieb lahmlegen.", "example_zh": ""}, {"lemma": "bevorstehen", "key": "bevorstehen", "forms": ["steht bevor", "bevorstehen"], "pos": "Verb", "zh": "即将来临、就在眼前", "example_de": "Und die nächste Ernte steht bevor.", "example_zh": ""}], "grammar_points": [{"title": "gilt als（被视为）", "summary": "gelten + als + 表语：被视为、公认为。新闻固定句式。", "example_de": "Die Ukraine gilt als die Kornkammer Europas.", "example_zh": "乌克兰被视为欧洲的粮仓。"}, {"title": "Konjunktiv I 转述（seien / habe / stehe）", "summary": "影片旁白转述当事人原话时用第一虚拟式：seien eingebrochen、habe gedauert、stehe seit drei Tagen hier，表示“据其所述”。", "example_de": "Wiktor stehe seit drei Tagen hier, Kollegen von ihm seit Wochen.", "example_zh": "据说 Wiktor 在这里已经等了三天，他的同事们已经等了好几周。"}], "background": "背景：敖德萨是乌克兰最主要的粮食外运港口。俄军持续打击港口与粮船，迫使出口转向多瑙河小港（Ismajil、Reni），但运力有限且同样遭袭。国内粮价崩跌、全球粮价上涨，两端挤压农民。"}, {"title": "Weiterer Überlebender in Nepal gefunden", "title_zh": "尼泊尔洪灾十日后又寻获幸存者", "paras": [{"start": 488.8, "end": 517.6, "lines": [{"de": "Vor zehn Tagen riss eine Sturzflut in Nepal ganze Dörfer mit sich.", "zh": "十天前，一场山洪在尼泊尔卷走了整座整座的村庄。", "start": 488.8, "end": 493.52}, {"de": "Noch immer finden Helfer Überlebende.", "zh": "救援人员仍在不断找到幸存者。", "start": 494.0, "end": 496.8}, {"de": "Heute konnten im Grenzgebiet zwischen Nepal und China zwei weitere Menschen in Sicherheit gebracht werden.", "zh": "今天，在尼泊尔与中国的边境地区，又有两人被转移到了安全地带。", "start": 497.4, "end": 504.56}, {"de": "Ein Mann wurde aus einem verschütteten Tunnel gerettet, eine Frau aus den Trümmern eines zerstörten Hauses.", "zh": "一名男子从被掩埋的隧道中获救，一名妇女从被毁房屋的废墟中获救。", "start": 504.64, "end": 511.44}, {"de": "Inzwischen melden die Behörden mindestens 1300 Todesopfer.", "zh": "到现在，官方通报的遇难者至少有 1300 人。", "start": 511.52, "end": 515.12}, {"de": "5000 Menschen werden noch vermisst.", "zh": "还有 5000 人下落不明。", "start": 515.2, "end": 517.6}]}], "vocab": [{"lemma": "die Sturzflut, -en", "key": "sturzflut", "forms": ["Sturzflut"], "pos": "Substantiv", "zh": "山洪暴发、骤发洪水", "example_de": "Vor zehn Tagen riss eine Sturzflut in Nepal ganze Dörfer mit sich.", "example_zh": ""}, {"lemma": "mit sich reißen", "key": "mit-sich-reissen", "forms": ["riss ... mit sich", "mit sich reißen"], "pos": "Redewendung", "zh": "卷走、裹挟而去", "example_de": "Vor zehn Tagen riss eine Sturzflut in Nepal ganze Dörfer mit sich.", "example_zh": ""}, {"lemma": "verschüttet", "key": "verschuetter", "forms": ["verschütteten", "verschüttet"], "pos": "Adjektiv", "zh": "被掩埋的", "example_de": "Ein Mann wurde aus einem verschütteten Tunnel gerettet, eine Frau aus den Trümmern eines zerstörten Hauses.", "example_zh": ""}, {"lemma": "die Trümmer", "key": "truemmer", "forms": ["Trümmern", "Trümmer"], "pos": "Substantiv", "zh": "废墟、瓦砾", "example_de": "Ein Mann wurde aus einem verschütteten Tunnel gerettet, eine Frau aus den Trümmern eines zerstörten Hauses.", "example_zh": ""}, {"lemma": "das Todesopfer, -", "key": "todesopfer", "forms": ["Todesopfer"], "pos": "Substantiv", "zh": "遇难者", "example_de": "Inzwischen melden die Behörden mindestens 1300 Todesopfer. 5000 Menschen werden noch vermisst.", "example_zh": ""}, {"lemma": "vermissen", "key": "vermissen", "forms": ["vermisst", "vermissen"], "pos": "Verb", "zh": "（被动）下落不明、失踪", "example_de": "Inzwischen melden die Behörden mindestens 1300 Todesopfer. 5000 Menschen werden noch vermisst.", "example_zh": ""}], "grammar_points": [{"title": "in Sicherheit bringen", "summary": "固定搭配“送至安全地带”。können + 被动态：konnten ... in Sicherheit gebracht werden。", "example_de": "Heute konnten im Grenzgebiet zwischen Nepal und China zwei weitere Menschen in Sicherheit gebracht werden.", "example_zh": "今天在尼中边境地区又有两人被送往安全地带。"}], "background": "背景：8 月底尼泊尔靠近中国边境地区遭遇特大山洪，多座村庄被毁。救援持续十余日仍不断救出生还者，官方统计遇难人数仍在上升，数千人失踪。"}, {"title": "Magdeburg: Demonstration für Vielfalt", "title_zh": "马格德堡选前万人集会 声援多元", "paras": [{"start": 518.88, "end": 543.24, "lines": [{"de": "Einen Tag vor der Landtagswahl in Sachsen-Anhalt haben in Magdeburg Tausende Teilnehmer für Vielfalt und Zusammenhalt demonstriert.", "zh": "萨克森-安哈尔特州议会选举前一天，数千人在马格德堡游行，声援多元与团结。", "start": 518.88, "end": 527.8}, {"de": "Ein überparteiliches Bündnis aus Kirchen, Gewerkschaften und Vereinen hatte zum \"Demokratie-Festival\" aufgerufen.", "zh": "一个由教会、工会和协会组成的跨党派联盟发起了这场“民主节”。", "start": 527.88, "end": 535.32}, {"de": "Die Veranstalter sprachen von bis zu 20.000 Teilnehmern.", "zh": "主办方称参加者多达两万人。", "start": 535.4, "end": 539.28}, {"de": "Laut Polizei waren es in Magdeburg etwa 10.000 Menschen.", "zh": "据警方消息，马格德堡现场约有一万人。", "start": 539.36, "end": 543.24}]}], "vocab": [{"lemma": "die Landtagswahl, -en", "key": "landtagswahl", "forms": ["Landtagswahl"], "pos": "Substantiv", "zh": "州议会选举", "example_de": "Einen Tag vor der Landtagswahl in Sachsen-Anhalt haben in Magdeburg Tausende Teilnehmer für Vielfalt und Zusammenhalt demonstriert.", "example_zh": ""}, {"lemma": "die Vielfalt", "key": "vielfalt", "forms": ["Vielfalt"], "pos": "Substantiv", "zh": "多样性、多元", "example_de": "Einen Tag vor der Landtagswahl in Sachsen-Anhalt haben in Magdeburg Tausende Teilnehmer für Vielfalt und Zusammenhalt demonstriert.", "example_zh": ""}, {"lemma": "der Zusammenhalt", "key": "zusammenhalt", "forms": ["Zusammenhalt"], "pos": "Substantiv", "zh": "团结、凝聚力", "example_de": "Einen Tag vor der Landtagswahl in Sachsen-Anhalt haben in Magdeburg Tausende Teilnehmer für Vielfalt und Zusammenhalt demonstriert.", "example_zh": ""}, {"lemma": "überparteilich", "key": "ueberparteilich", "forms": ["überparteiliches", "überparteilich"], "pos": "Adjektiv", "zh": "跨党派的、无党派的", "example_de": "Ein überparteiliches Bündnis aus Kirchen, Gewerkschaften und Vereinen hatte zum \"Demokratie-Festival\" aufgerufen.", "example_zh": ""}, {"lemma": "das Bündnis, -se", "key": "buendnis", "forms": ["Bündnis"], "pos": "Substantiv", "zh": "联盟、联合", "example_de": "Ein überparteiliches Bündnis aus Kirchen, Gewerkschaften und Vereinen hatte zum \"Demokratie-Festival\" aufgerufen.", "example_zh": ""}, {"lemma": "aufrufen zu", "key": "aufrufen", "forms": ["aufgerufen", "aufrufen zu"], "pos": "Verb", "zh": "号召、发起", "example_de": "Ein überparteiliches Bündnis aus Kirchen, Gewerkschaften und Vereinen hatte zum \"Demokratie-Festival\" aufgerufen.", "example_zh": ""}, {"lemma": "die Gewerkschaft, -en", "key": "gewerkschaft", "forms": ["Gewerkschaften", "Gewerkschaft"], "pos": "Substantiv", "zh": "工会", "example_de": "Ein überparteiliches Bündnis aus Kirchen, Gewerkschaften und Vereinen hatte zum \"Demokratie-Festival\" aufgerufen.", "example_zh": ""}], "grammar_points": [{"title": "Plusquamperfekt 过去完成时", "summary": "hatte aufgerufen（在此之前已发起）：叙述中先于主句动作完成的动作用过去完成时。", "example_de": "Ein überparteiliches Bündnis aus Kirchen, Gewerkschaften und Vereinen hatte zum \"Demokratie-Festival\" aufgerufen.", "example_zh": "一个跨党派联盟此前已发起这场“民主节”。"}], "background": "背景：马格德堡是萨克森-安哈尔特州首府，2025 年 12 月该市圣诞市场曾发生驾车袭击惨案，此后当地公民社会多次组织大型集会。明天（9 月 6 日）该州举行州议会选举，本次“民主节”被视为选前反对右翼势力的明确信号。"}, {"title": "Protest gegen steigende Mieten", "title_zh": "柏林万人抗议房租上涨", "paras": [{"start": 547.0, "end": 575.84, "lines": [{"de": "In Berlin haben zahlreiche Menschen gegen steigende Mieten protestiert.", "zh": "在柏林，大批民众抗议不断上涨的房租。", "start": 547.0, "end": 552.0}, {"de": "Unter dem Motto \"Her mit den Wohnungen - Runter mit den Mieten\" versammelten sich laut Veranstalter 11.000 Menschen vor dem Rathaus.", "zh": "在“把房子拿出来——把房租降下去”的口号下，据主办方称有一万一千人聚集在市政厅前。", "start": 552.08, "end": 560.88}, {"de": "Die Polizei nannte keine Zahlen, ging aber von deutlich weniger Teilnehmenden aus.", "zh": "警方没有公布数字，但估计参加者明显少于这个数。", "start": 560.96, "end": 566.88}, {"de": "Zum Protest aufgerufen hatte ein Bündnis aus Initiativen.", "zh": "发起这次抗议的是一个由多个倡议组织组成的联盟。", "start": 567.04, "end": 570.84}, {"de": "Sie fordern einen Mietendeckel und die Enteignung großer Immobilienkonzerne.", "zh": "他们要求设定房租上限，并把大型房地产集团收归公有。", "start": 570.92, "end": 575.84}]}], "vocab": [{"lemma": "die Miete, -n", "key": "miete", "forms": ["Mieten", "Miete"], "pos": "Substantiv", "zh": "房租", "example_de": "In Berlin haben zahlreiche Menschen gegen steigende Mieten protestiert.", "example_zh": ""}, {"lemma": "das Motto, -s", "key": "motto", "forms": ["Motto"], "pos": "Substantiv", "zh": "口号、标语", "example_de": "Unter dem Motto \"Her mit den Wohnungen - Runter mit den Mieten\" versammelten sich laut Veranstalter 11.000 Menschen vor dem Rathaus.", "example_zh": ""}, {"lemma": "sich versammeln", "key": "versammeln", "forms": ["versammelten sich", "sich versammeln"], "pos": "Verb", "zh": "聚集、集合", "example_de": "Unter dem Motto \"Her mit den Wohnungen - Runter mit den Mieten\" versammelten sich laut Veranstalter 11.000 Menschen vor dem Rathaus.", "example_zh": ""}, {"lemma": "das Rathaus, ¨-er", "key": "rathaus", "forms": ["Rathaus"], "pos": "Substantiv", "zh": "市政厅", "example_de": "Unter dem Motto \"Her mit den Wohnungen - Runter mit den Mieten\" versammelten sich laut Veranstalter 11.000 Menschen vor dem Rathaus.", "example_zh": ""}, {"lemma": "der Mietendeckel", "key": "mietendeckel", "forms": ["Mietendeckel"], "pos": "Substantiv", "zh": "房租上限、租金封顶", "example_de": "Sie fordern einen Mietendeckel und die Enteignung großer Immobilienkonzerne.", "example_zh": ""}, {"lemma": "die Enteignung, -en", "key": "enteignung", "forms": ["Enteignung"], "pos": "Substantiv", "zh": "征收、收归公有", "example_de": "Sie fordern einen Mietendeckel und die Enteignung großer Immobilienkonzerne.", "example_zh": ""}, {"lemma": "der Immobilienkonzern, -e", "key": "immobilienkonzern", "forms": ["Immobilienkonzerne", "Immobilienkonzern"], "pos": "Substantiv", "zh": "房地产集团", "example_de": "Sie fordern einen Mietendeckel und die Enteignung großer Immobilienkonzerne.", "example_zh": ""}], "grammar_points": [{"title": "von ... ausgehen（估计、认定）", "summary": "von etwas ausgehen = 以……为判断基础：Die Polizei ging von weniger Teilnehmenden aus 警方估计人数更少。", "example_de": "Die Polizei nannte keine Zahlen, ging aber von deutlich weniger Teilnehmenden aus.", "example_zh": "警方没有公布数字，但估计参加者明显更少。"}], "background": "背景：柏林房租近年持续上涨，住房短缺严重。“征收大型房产集团”的诉求源自 2021 年柏林公投“Deutsche Wohnen & Co enteignen”，多数选民赞成但至今未落实。2020 年柏林曾立法设房租上限，2021 年被联邦宪法法院推翻。"}, {"title": "Tod von Michael Mendl", "title_zh": "演员 Michael Mendl 逝世 享年 82 岁", "paras": [{"start": 576.96, "end": 598.16, "lines": [{"de": "Er prägte die deutsche Film- und Fernsehlandschaft über Jahrzehnte: Michael Mendl.", "zh": "他数十年来深刻塑造了德国影视界的面貌：Michael Mendl。", "start": 576.96, "end": 583.44}, {"de": "Jetzt ist der Schauspieler im Alter von 82 Jahren gestorben.", "zh": "这位演员如今去世了，享年 82 岁。", "start": 583.52, "end": 587.44}, {"de": "Mendl spielte in mehr als 200 Produktionen.", "zh": "Mendl 出演过 200 多部作品。", "start": 587.52, "end": 590.56}, {"de": "Für seine Darstellung des Bundeskanzlers Willy Brandt in \"Im Schatten der Macht\" gewann er die Goldene Kamera.", "zh": "凭借在《权力的阴影》中饰演联邦总理 Willy Brandt，他赢得了金摄影机奖。", "start": 590.64, "end": 598.16}]}, {"start": 601.0, "end": 677.68, "lines": [{"de": "Zum Film kommt Michael Mendl erst mit Mitte 40. Er spielt im Tatort einen Verdächtigen.", "zh": "（接下来是一段影片。", "start": 601.0, "end": 607.32}, {"de": "Es ist selten, dass sich einer den Namen merkt.", "zh": "）Michael Mendl 直到四十五岁上下才接触电影。", "start": 607.4, "end": 610.24}, {"de": "Die Rolle des Undurchdringlichen, Bösen, Ehrgeizigen: Immer wieder verkörpert er mysteriöse Gestalten.", "zh": "他在《Tatort》罪案剧里演一个嫌疑人。能让观众记住名字的，并不多见。", "start": 610.32, "end": 616.76}, {"de": "Da musste ich aufpassen, dass ich nicht dauernd die Schurken spielte.", "zh": "难以看透的、邪恶的、野心勃勃的角色：他一再化身神秘人物。", "start": 616.92, "end": 621.16}, {"de": "Ich war natürlich auch kein blonder Liebhaber, der Held, sondern ich war halt der Charakterkopf.", "zh": "我当时得留神，别一不小心老演反派。", "start": 621.24, "end": 627.8}, {"de": "Geboren als unehelicher Sohn eines katholischen Pfarrers in Lünen, nimmt er später den Namen seines Adoptivvaters an.", "zh": "我当然也不是什么金发情人、英雄专业户，我就是个性格派面孔。", "start": 628.36, "end": 636.12}, {"de": "Die Theaterkarriere beginnt mit 14. Vom Statisten arbeitet er sich hoch zum Hauptdarsteller.", "zh": "他出生在 Lünen，是一位天主教神父的私生子，后来改随养父的姓。", "start": 636.2, "end": 642.68}, {"de": "Mit markanter Stimme spielt er nicht nur Bundeskanzler Brandt, er wird quasi zu ihm.", "zh": "戏剧生涯从 14 岁开始。他从群众演员一路干到主演。", "start": 643.2, "end": 648.6}, {"de": "Ich weiß noch, als ich es gedreht habe, meine Lebensgefährtin sagte: \"Hör doch mal auf, immer wie Brandt zu sprechen.\"", "zh": "凭着辨识度极高的嗓音，他演总理 Brandt 时不只是在演，简直就成了 Brandt 本人。", "start": 650.92, "end": 658.2}, {"de": "Ich konnte es nicht ablegen, hatte den so inhaliert.", "zh": "我还记得拍那部戏的时候，我的生活伴侣说：“别再整天用 Brandt 的腔调说话了。", "start": 658.28, "end": 661.36}, {"de": "Mit seiner Krebserkrankung geht er sehr offen um.", "zh": "”我改不掉，已经把那个人吸进骨子里了。", "start": 661.48, "end": 664.4}, {"de": "Früher hatte ich Mitesser, hab das ausgedrückt.", "zh": "对自己的癌症，他态度非常坦然。以前我长黑头粉刺，把它们挤掉就是了。", "start": 664.48, "end": 667.28}, {"de": "Und dann war es der Krebs, ist auch ein Mitesser im übergeordneten Sinn.", "zh": "后来是癌症，从更高的意义上说，也不过是个“寄生的家伙”。", "start": 667.36, "end": 671.96}, {"de": "Wenn er bei mir als Untermieter wohnt, kann ich ihn nicht rausschmeißen.", "zh": "既然它在我这儿当二房客住下了，我也没法把它撵出去。", "start": 672.04, "end": 677.68}]}, {"start": 679.88, "end": 683.28, "lines": [{"de": "Nun ist Michael Mendl im Alter von 82 Jahren gestorben.", "zh": "如今 Michael Mendl 去世了，享年 82 岁。", "start": 679.88, "end": 683.28}]}], "vocab": [{"lemma": "prägen", "key": "praegen", "forms": ["prägte", "prägen"], "pos": "Verb", "zh": "塑造、深刻影响", "example_de": "Er prägte die deutsche Film- und Fernsehlandschaft über Jahrzehnte: Michael Mendl.", "example_zh": ""}, {"lemma": "die Goldene Kamera", "key": "goldene-kamera", "forms": ["Goldene Kamera"], "pos": "Substantiv", "zh": "金摄影机奖（德国电视奖）", "example_de": "Für seine Darstellung des Bundeskanzlers Willy Brandt in \"Im Schatten der Macht\" gewann er die Goldene Kamera.", "example_zh": ""}, {"lemma": "die Darstellung, -en", "key": "darstellung-mendl", "forms": ["Darstellung"], "pos": "Substantiv", "zh": "演绎、饰演", "example_de": "Für seine Darstellung des Bundeskanzlers Willy Brandt in \"Im Schatten der Macht\" gewann er die Goldene Kamera.", "example_zh": ""}, {"lemma": "der Verdächtige, -n", "key": "verdaechtige", "forms": ["Verdächtigen", "Verdächtige"], "pos": "Substantiv", "zh": "嫌疑人", "example_de": "Er spielt im Tatort einen Verdächtigen.", "example_zh": ""}, {"lemma": "verkörpern", "key": "verkoerpern", "forms": ["verkörpert", "verkörpern"], "pos": "Verb", "zh": "饰演、化身", "example_de": "Die Rolle des Undurchdringlichen, Bösen, Ehrgeizigen: Immer wieder verkörpert er mysteriöse Gestalten.", "example_zh": ""}, {"lemma": "der Schurke, -n", "key": "schurke", "forms": ["Schurken", "Schurke"], "pos": "Substantiv", "zh": "反派、恶棍", "example_de": "Da musste ich aufpassen, dass ich nicht dauernd die Schurken spielte.", "example_zh": ""}, {"lemma": "der Charakterkopf, ¨-e", "key": "charakterkopf", "forms": ["Charakterkopf"], "pos": "Substantiv", "zh": "性格派演员、有辨识度的面孔", "example_de": "Ich war natürlich auch kein blonder Liebhaber, der Held, sondern ich war halt der Charakterkopf.", "example_zh": ""}, {"lemma": "die Lebensgefährtin, -nen", "key": "lebensgefaehrtin", "forms": ["Lebensgefährtin"], "pos": "Substantiv", "zh": "生活伴侣", "example_de": "Ich weiß noch, als ich es gedreht habe, meine Lebensgefährtin sagte: \"Hör doch mal auf, immer wie Brandt zu sprechen.\" Ich konnte es nicht ablegen, hatte den so inhaliert.", "example_zh": ""}, {"lemma": "der Mitesser, -", "key": "mitesser", "forms": ["Mitesser"], "pos": "Substantiv", "zh": "黑头粉刺；此处双关“寄生的家伙”", "example_de": "Früher hatte ich Mitesser, hab das ausgedrückt.", "example_zh": ""}, {"lemma": "der Untermieter, -", "key": "untermieter", "forms": ["Untermieter"], "pos": "Substantiv", "zh": "二房客、转租客", "example_de": "Wenn er bei mir als Untermieter wohnt, kann ich ihn nicht rausschmeißen.", "example_zh": ""}], "grammar_points": [{"title": "Geboren als ..., nimmt er ... an（分词短语开头）", "summary": "过去分词短语 Geboren als unehelicher Sohn... 作状语置于句首，主句正常语序，传记体常用。", "example_de": "Geboren als unehelicher Sohn eines katholischen Pfarrers in Lünen, nimmt er später den Namen seines Adoptivvaters an.", "example_zh": "他出生时是一位天主教神父的私生子，后来改随养父的姓。"}], "background": "背景：Michael Mendl（1944–2026），德国性格演员，出演 200 余部影视作品，以饰演前总理 Willy Brandt 闻名。《Tatort》是德国最长青的罪案剧系列；《Im Schatten der Macht》（权力的阴影）讲述 Brandt 1974 年辞职工位。他晚年公开谈论癌症，把它幽默地比作“赶不走的二房客”。"}, {"title": "Bundesliga: BVB dreht Spiel in Hoffenheim", "title_zh": "德甲 多特客场 3:2 逆转霍芬海姆", "paras": [{"start": 685.16, "end": 699.68, "lines": [{"de": "Zum Sport und der Fußball-Bundesliga: Vizemeister Dortmund hat sich am zweiten Spieltag den zweiten Saisonsieg mühsam erkämpft.", "zh": "体育和德甲方面：上赛季亚军多特蒙德在第二轮联赛艰难拼下赛季第二场胜利。", "start": 685.16, "end": 693.56}, {"de": "Gegen Hoffenheim drehte der BvB einen Zwei-Tore-Rückstand noch zu einem 3:2-Auswärtssieg.", "zh": "面对霍芬海姆，多特蒙德把两球落后的局面硬生生逆转成 3:2 的客场胜局。", "start": 693.64, "end": 699.68}]}, {"start": 701.84, "end": 761.4, "lines": [{"de": "Der Dortmunder Jubel beim Schlusspfiff in Sinsheim: Eine Mischung aus Freude, Fassungslosigkeit und Stolz.", "zh": "终场哨响时辛斯海姆的多特狂欢：喜悦、难以置信和骄傲混在一起。", "start": 701.84, "end": 708.64}, {"de": "Der BvB sah bei der TSG Hoffenheim lange wie der klare Verlierer aus.", "zh": "在霍芬海姆身上，多特蒙德很长时间看上去就是那个十足的输家。", "start": 708.72, "end": 712.84}, {"de": "Per Distanzschuss von Avdullahu kurz vor der Pause gingen die Gastgeber in Führung, um nach der Pause gleich nachzulegen.", "zh": "中场休息前 Avdullahu 的远射让主队领先，下半场一开场又马上再下一城。", "start": 712.92, "end": 720.6}, {"de": "Lemperles von Anton abgefälschtes 2:0 in der 54. Minute war eine von vielen Großchancen der TSG nach Wiederanpfiff.", "zh": "第 54 分钟 Lemperle 那记被 Anton 折射入网的 2:0，只是重新开球后霍芬海姆众多绝佳机会之一。", "start": 720.72, "end": 728.2}, {"de": "Der BvB konnte mit einer der bis dahin wenigen gefährlichen Aktionen durch Guirassy auf 2:1 verkürzen, 61 Minuten waren gespielt.", "zh": "多特蒙德凭此前为数不多的威胁进攻之一，由 Guirassy 扳成 2:1，此时是第 61 分钟。", "start": 728.72, "end": 737.44}, {"de": "Fünf Minuten später war Guirassy erneut beteiligt.", "zh": "五分钟后 Guirassy 又一次参与进攻。", "start": 738.16, "end": 741.32}, {"de": "Exzellente Vorarbeit für den eingewechselten Fabio Silva - 2:2.", "zh": "他为替补登场的 Fabio Silva 送出绝妙做球——2:2。", "start": 741.4, "end": 745.52}, {"de": "Schon ein Unentschieden wäre für Dortmund glücklich gewesen.", "zh": "对多特来说，就算踢平都算运气好了。", "start": 745.6, "end": 749.16}, {"de": "Es kam noch besser, weil Hoffenheims Hajdari in der 86. Minute ein Nwaneri-Zuspiel ins eigene Tor beförderte.", "zh": "结果更好：第 86 分钟，霍芬海姆的 Hajdari 把 Nwaneri 的传球撞进了自家球门。", "start": 749.24, "end": 756.16}, {"de": "Zweites Spiel, zweite Niederlage für Hoffenheim, zweiter Sieg für Dortmund.", "zh": "霍芬海姆两战两负，多特两战两胜。", "start": 756.6, "end": 761.4}]}, {"start": 762.68, "end": 825.8, "lines": [{"de": "Vincent Wagner und Elversberg sorgen für den nächsten Paukenschlag.", "zh": "Vincent Wagner 和他的埃尔沃斯堡又制造了一声惊雷。", "start": 762.68, "end": 766.92}, {"de": "Dabei geht die Borussia aus Mönchengladbach früh in Führung.", "zh": "这场门兴格拉德巴赫倒是早早取得领先。", "start": 767.0, "end": 770.76}, {"de": "11. Minute, 1:0, Hugo Bolin.", "zh": "第 11 分钟，1:0，Hugo Bolin。", "start": 770.84, "end": 773.2}, {"de": "Dann Konter Elversberg, Mokwa auf und davon.", "zh": "然后埃尔沃斯堡打反击，Mokwa 摆脱防守扬长而去。", "start": 774.6, "end": 778.12}, {"de": "Cooler Abschluss, 1:1, Turneinlage inklusive.", "zh": "冷静施射，1:1，还顺带翻了跟头庆祝。", "start": 779.4, "end": 782.72}, {"de": "Ein Einwurf für Gladbach leitet Sekunden vor der Pause das 2:1 ein.", "zh": "半场结束前几秒，门兴的一次界外球策动了 2:1。", "start": 785.52, "end": 790.28}, {"de": "Der Schwede Bolin, sein zweites Tor und SVE-Trainer Wagner bekommt zur Pause Gelb-Rot.", "zh": "瑞典人 Bolin 梅开二度，而埃尔沃斯堡主帅 Wagner 中场休息时吃到黄红牌被罚下。", "start": 790.64, "end": 797.16}, {"de": "Von der Tribüne sieht er das Gladbacher 3:1 durch Skelly.", "zh": "他从看台上目睹了门兴 Skelly 打进的 3:1。", "start": 798.32, "end": 802.32}, {"de": "Trotzdem macht Elversberg immer weiter.", "zh": "尽管如此埃尔沃斯堡还在继续猛追。", "start": 802.88, "end": 805.88}, {"de": "Krattenmacher, gerade eingewechselt, 3:2.", "zh": "刚刚替补上场的 Krattenmacher，3:2。", "start": 805.96, "end": 809.08}, {"de": "Zehn Minuten noch, Freistoß Keidel, der Ausgleich.", "zh": "还剩十分钟，Keidel 任意球，扳平了。", "start": 809.32, "end": 812.92}, {"de": "Weil die Borussia zu passiv bleibt, gelingt auch noch das 4:3.", "zh": "门兴踢得太被动，又被对方打进 4:3。", "start": 814.04, "end": 818.04}, {"de": "Wieder Krattenmacher.", "zh": "又是 Krattenmacher。", "start": 818.12, "end": 819.68}, {"de": "Polanskis Borussia noch abgefangen.", "zh": "Polanski 的门兴再次被掀翻在地。", "start": 819.76, "end": 822.2}, {"de": "Die weiteren Ergebnisse:", "zh": "其余比赛的结果：", "start": 824.0, "end": 825.8}]}], "vocab": [{"lemma": "der Vizemeister, -", "key": "vizemeister", "forms": ["Vizemeister"], "pos": "Substantiv", "zh": "联赛亚军", "example_de": "Zum Sport und der Fußball-Bundesliga: Vizemeister Dortmund hat sich am zweiten Spieltag den zweiten Saisonsieg mühsam erkämpft.", "example_zh": ""}, {"lemma": "sich erkämpfen", "key": "erkämpfen", "forms": ["erkämpft", "sich erkämpfen"], "pos": "Verb", "zh": "奋力争取到、拼下来", "example_de": "Zum Sport und der Fußball-Bundesliga: Vizemeister Dortmund hat sich am zweiten Spieltag den zweiten Saisonsieg mühsam erkämpft.", "example_zh": ""}, {"lemma": "der Rückstand, ¨-e", "key": "rueckstand", "forms": ["Rückstand"], "pos": "Substantiv", "zh": "落后（比分）", "example_de": "Gegen Hoffenheim drehte der BvB einen Zwei-Tore-Rückstand noch zu einem 3:2-Auswärtssieg.", "example_zh": ""}, {"lemma": "der Schlusspfiff", "key": "schlusspfiff", "forms": ["Schlusspfiff"], "pos": "Substantiv", "zh": "终场哨", "example_de": "Der Dortmunder Jubel beim Schlusspfiff in Sinsheim: Eine Mischung aus Freude, Fassungslosigkeit und Stolz.", "example_zh": ""}, {"lemma": "die Fassungslosigkeit", "key": "fassungslosigkeit", "forms": ["Fassungslosigkeit"], "pos": "Substantiv", "zh": "难以置信", "example_de": "Der Dortmunder Jubel beim Schlusspfiff in Sinsheim: Eine Mischung aus Freude, Fassungslosigkeit und Stolz.", "example_zh": ""}, {"lemma": "nachlegen", "key": "nachlegen", "forms": ["nachzulegen", "nachlegen"], "pos": "Verb", "zh": "再进一球、追加", "example_de": "Per Distanzschuss von Avdullahu kurz vor der Pause gingen die Gastgeber in Führung, um nach der Pause gleich nachzulegen.", "example_zh": ""}, {"lemma": "abfälschen", "key": "abfaelschen", "forms": ["abgefälschtes", "abfälschen"], "pos": "Verb", "zh": "折射、变线", "example_de": "Lemperles von Anton abgefälschtes 2:0 in der 54.", "example_zh": ""}, {"lemma": "verkürzen auf", "key": "verkuerzen", "forms": ["verkürzen", "verkürzen auf"], "pos": "Verb", "zh": "扳回一球", "example_de": "Der BvB konnte mit einer der bis dahin wenigen gefährlichen Aktionen durch Guirassy auf 2:1 verkürzen, 61 Minuten waren gespielt.", "example_zh": ""}, {"lemma": "ins eigene Tor befördern", "key": "eigene-tor", "forms": ["ins eigene Tor beförderte", "ins eigene Tor befördern"], "pos": "Redewendung", "zh": "撞进自家球门（乌龙）", "example_de": "Minute ein Nwaneri-Zuspiel ins eigene Tor beförderte.", "example_zh": ""}, {"lemma": "der Paukenschlag, ¨-e", "key": "paukenschlag", "forms": ["Paukenschlag"], "pos": "Substantiv", "zh": "惊雷、轰动事件", "example_de": "Vincent Wagner und Elversberg sorgen für den nächsten Paukenschlag.", "example_zh": ""}], "grammar_points": [{"title": "um ... nachzulegen（um + zu 表紧跟的意图）", "summary": "主句后接 um ... zu 不定式，说明紧接着的动作意图：领先之后随即再下一城。", "example_de": "Per Distanzschuss von Avdullahu kurz vor der Pause gingen die Gastgeber in Führung, um nach der Pause gleich nachzulegen.", "example_zh": "主队凭 Avdullahu 的远射领先，下半场开场随即再进一球。"}], "background": "背景：2026/27 赛季德甲第二轮。多特蒙德客场 3:2 逆转霍芬海姆（第 86 分钟乌龙球绝杀）；升班马埃尔沃斯堡（SV Elversberg）客场 4:3 掀翻门兴格拉德巴赫，是本轮最大冷门。BvB = 多特蒙德，TSG = 霍芬海姆，SVE = 埃尔沃斯堡。"}, {"title": "Basketballerinnen bewahren WM-Chance", "title_zh": "德国女篮主场击败日本 保住世界杯出线希望", "paras": [{"start": 846.28, "end": 864.96, "lines": [{"de": "Bei der WM im eigenen Land haben die deutschen Basketballerinnen ihre Chance auf das Weiterkommen gewahrt: Gegen Japan gewann die DBB-Auswahl in Berlin mit 74:58.", "zh": "在本土举办的世界杯上，德国女篮保住了晋级希望：在柏林以 74:58 战胜日本。", "start": 846.28, "end": 856.56}, {"de": "Zum Auftakt hatte das deutsche Team gegen Spanien verloren.", "zh": "揭幕战德国队输给了西班牙。", "start": 857.12, "end": 861.24}, {"de": "Am Montag steht das nächste Gruppenspiel gegen Mali an.", "zh": "周一将迎来下一场小组赛，对手是马里。", "start": 861.36, "end": 864.96}]}], "vocab": [{"lemma": "das Weiterkommen", "key": "weiterkommen", "forms": ["Weiterkommen"], "pos": "Substantiv", "zh": "晋级、出线", "example_de": "Bei der WM im eigenen Land haben die deutschen Basketballerinnen ihre Chance auf das Weiterkommen gewahrt: Gegen Japan gewann die DBB-Auswahl in Berlin mit 74:58.", "example_zh": ""}, {"lemma": "wahren", "key": "wahren", "forms": ["gewahrt", "wahren"], "pos": "Verb", "zh": "保住、维护", "example_de": "Bei der WM im eigenen Land haben die deutschen Basketballerinnen ihre Chance auf das Weiterkommen gewahrt: Gegen Japan gewann die DBB-Auswahl in Berlin mit 74:58.", "example_zh": ""}, {"lemma": "die Auswahl, -en", "key": "auswahl", "forms": ["DBB-Auswahl", "Auswahl"], "pos": "Substantiv", "zh": "国家队、选拔队", "example_de": "Bei der WM im eigenen Land haben die deutschen Basketballerinnen ihre Chance auf das Weiterkommen gewahrt: Gegen Japan gewann die DBB-Auswahl in Berlin mit 74:58.", "example_zh": ""}, {"lemma": "der Auftakt, ¨-e", "key": "auftakt", "forms": ["Auftakt"], "pos": "Substantiv", "zh": "开端、揭幕战", "example_de": "Zum Auftakt hatte das deutsche Team gegen Spanien verloren.", "example_zh": ""}, {"lemma": "anstehen", "key": "anstehen", "forms": ["steht ... an", "anstehen"], "pos": "Verb", "zh": "即将进行、等待着", "example_de": "Am Montag steht das nächste Gruppenspiel gegen Mali an.", "example_zh": ""}], "grammar_points": [], "background": "背景：2026 年女篮世界杯在德国举办，柏林承办部分小组赛。DBB = Deutscher Basketball Bund，德国篮球协会。德国女篮首战负于西班牙，次战胜日本，保留小组出线希望。"}, {"title": "Das Wetter", "title_zh": "天气预报", "paras": [{"start": 866.72, "end": 894.44, "lines": [{"de": "Die Wettervorhersage für morgen, Sonntag, den 6. September: Hoher Luftdruck sorgt morgen für viel Sonnenschein.", "zh": "明天，9 月 6 日星期日的天气预报：高气压明天带来充沛日照。", "start": 866.72, "end": 875.32}, {"de": "In der kühlen Meeresluft wird die Nacht teils recht frisch, beginnt im Nordosten mit Schauern, dazu windig.", "zh": "在清凉的海上气团里，夜间部分地区相当凉，东北部以阵雨开场，风也不小。", "start": 875.4, "end": 882.36}, {"de": "An der Ostsee Sturmböen, sonst locker bewölkt oder klar.", "zh": "波罗的海沿岸有风暴阵风，其他地区少云或晴朗。", "start": 882.96, "end": 886.76}, {"de": "Am Tag scheint verbreitet die Sonne.", "zh": "白天普遍阳光普照。", "start": 886.84, "end": 889.2}, {"de": "Im Norden und Nordosten ist es zeitweise wolkig, auch dort bleibt es trocken.", "zh": "北部和东北部时段性多云，但那里同样保持干燥。", "start": 889.28, "end": 894.44}]}, {"start": 905.6, "end": 916.76, "lines": [{"de": "Montag erwartet uns ein Mix aus Sonne und Wolken, dazu sommerlich warm.", "zh": "周一天气是阳光与云的混合，而且暖得有夏天味道。", "start": 905.6, "end": 910.28}, {"de": "Im Westen einzelne Schauer, im Süden auch Gewitter.", "zh": "西部零星阵雨，南部还会打雷下雨。", "start": 910.36, "end": 913.64}, {"de": "Ab Dienstag wird es unbeständig und kühler.", "zh": "周二起天气转不稳定，也会降温。", "start": 913.72, "end": 916.76}]}], "vocab": [{"lemma": "der Luftdruck", "key": "luftdruck", "forms": ["Luftdruck"], "pos": "Substantiv", "zh": "气压", "example_de": "September: Hoher Luftdruck sorgt morgen für viel Sonnenschein.", "example_zh": ""}, {"lemma": "die Sturmbö, -n", "key": "sturmboe", "forms": ["Sturmböen", "Sturmbö"], "pos": "Substantiv", "zh": "风暴阵风", "example_de": "An der Ostsee Sturmböen, sonst locker bewölkt oder klar.", "example_zh": ""}, {"lemma": "locker bewölkt", "key": "locker-bewoelkt", "forms": ["locker bewölkt"], "pos": "Redewendung", "zh": "少云的、云量稀疏的", "example_de": "An der Ostsee Sturmböen, sonst locker bewölkt oder klar.", "example_zh": ""}, {"lemma": "verbreitet", "key": "verbreitet", "forms": ["verbreitet"], "pos": "Adjektiv", "zh": "普遍地、广泛地", "example_de": "Am Tag scheint verbreitet die Sonne.", "example_zh": ""}, {"lemma": "der Schauer, -", "key": "schauer", "forms": ["Schauern", "Schauer"], "pos": "Substantiv", "zh": "阵雨", "example_de": "In der kühlen Meeresluft wird die Nacht teils recht frisch, beginnt im Nordosten mit Schauern, dazu windig.", "example_zh": ""}, {"lemma": "unbeständig", "key": "unbestaendig", "forms": ["unbeständig"], "pos": "Adjektiv", "zh": "不稳定的（天气）", "example_de": "Ab Dienstag wird es unbeständig und kühler.", "example_zh": ""}], "grammar_points": [{"title": "sorgen für（带来、促成）", "summary": "jemand/etwas sorgt für etwas = 带来、引起某种结果，天气播报高频句式。", "example_de": "Hoher Luftdruck sorgt morgen für viel Sonnenschein.", "example_zh": "高气压明天带来充沛日照。"}], "background": ""}], "gloss": {"landesverwaltung": {"word": "die Landesverwaltung, -en", "zh": "州政府、州行政机关", "pos": "Substantiv", "example": "Nach dem Cyberangriff auf die Berliner Landesverwaltung sind die Folgen nicht absehbar.", "source": "editorial"}, "loesegeld": {"word": "das Lösegeld, -er", "zh": "赎金", "pos": "Substantiv", "example": "Hacker hatten gestern sensible Daten im Darknet veröffentlicht, weil der Senat kein Lösegeld zahlen wollte.", "source": "editorial"}, "bedrohungslage": {"word": "die Bedrohungslage", "zh": "威胁态势", "pos": "Substantiv", "example": "Das Bundesamt für Sicherheit in der Informationstechnik warnte vor einer erhöhten Bedrohungslage.", "source": "editorial"}, "ultimatum": {"word": "das Ultimatum, Ultimaten", "zh": "最后通牒", "pos": "Substantiv", "example": "Kaum lief das Ultimatum ab, erschien die Nachricht von der kriminellen Hackergruppe Rhysida: 5,26 Terrabyte, 1,4 Millionen Dateien seien nun im Netz, behauptet sie.", "source": "editorial"}, "schadensbegrenzung": {"word const WK_RE = /[A-Za-zÄÖÜäöüß][A-Za-zÄÖÜäöüß-]*/g;
const PHRASES = (DATA.phrases || []).slice().sort((a, b) => b.length - a.length);
function lookupKey(surface) {
  return (DATA.form_to_key && DATA.form_to_key[surface.toLowerCase()]) || surface.toLowerCase();
}
function wrapWord(surface, key) {
  const g = getGloss(key);
  const classes = [
    g?.zh ? 'known' : '',
    g?.source === 'editorial' ? 'ed' : '',
    g?.source === 'dict' ? 'wiki' : '',
    basket.some(b => b.key === key) ? 'saved' : ''
  ].filter(Boolean).join(' ');
  return `<w data-w="${esc(key)}" class="${classes}" tabindex="0" role="button" aria-label="${esc(surface)}，查看释义">${esc(surface)}</w>`;
}
function isLetter(ch) { return /[A-Za-zÄÖÜäöüß]/.test(ch || ''); }
function tokenizeDe(text) {
  let html = '', i = 0;
  const lower = text.toLowerCase();
  while (i < text.length) {
    let hit = '';
    if (i === 0 || !isLetter(text[i - 1])) {
      for (const ph of PHRASES) {
        if (lower.startsWith(ph.toLowerCase(), i) && !isLetter(text[i + ph.length])) {
          hit = text.slice(i, i + ph.length);
          break;
        }
      }
    }
    if (hit) {
      html += wrapWord(hit, lookupKey(hit));
      i += hit.length;
      continue;
    }
    if (isLetter(text[i])) {
      let j = i + 1;
      while (j < text.length && /[A-Za-zÄÖÜäöüß-]/.test(text[j])) j++;
      const word = text.slice(i, j);
      html += wrapWord(word, lookupKey(word));
      i = j;
    } else {
      let j = i + 1;
      while (j < text.length && !isLetter(text[j])) j++;
      html += esc(text.slice(i, j));
      i = j;
    }
  }
  return html;
}

    const a = parseFloat(el.dataset.start), b = parseFloat(el.dataset.end);
