, "end": 175.16}, {"de": "Meta hält sich nicht an das Gesetz.", "zh": "他们是我们的未来。Meta 不遵守法律。", "start": 175.24, "end": 177.76}, {"de": "Durch die Technik in den Apps, wie bei Instagram, sollen Jugendliche zu schnell süchtig werden.", "zh": "通过应用里的技术——就像 Instagram 里那样——青少年被设计得很快上瘾。", "start": 178.24, "end": 185.2}, {"de": "Meta sagt, das stimmt nicht.", "zh": "Meta 说这些不是真的。", "start": 186.0, "end": 188.6}, {"de": "Die Familien von den Jugendlichen sind traurig.", "zh": "这些青少年的家人很悲伤，", "start": 189.52, "end": 193.32}, {"de": "Und sie hoffen, dass Meta eine Strafe bekommt.", "zh": "他们希望 Meta 受到惩罚。", "start": 193.56, "end": 197.0}]}], "vocab": [{"lemma": "der Bundesstaat, -en", "key": "bundesstaat", "forms": ["Bundesstaaten", "Bundesstaat"], "pos": "Substantiv", "zh": "联邦州", "example_de": "Mehrere Bundesstaaten von den USA sagen: Meta macht die jungen Menschen süchtig.", "example_zh": ""}, {"lemma": "süchtig", "key": "suechtig", "forms": ["süchtig"], "pos": "Adjektiv", "zh": "上瘾的", "example_de": "Mehrere Bundesstaaten von den USA sagen: Meta macht die jungen Menschen süchtig.", "example_zh": ""}, {"lemma": "mit Absicht", "key": "mit-absicht", "forms": ["mit Absicht"], "pos": "Redewendung", "zh": "故意地", "example_de": "Und zwar mit Absicht.", "example_zh": ""}, {"lemma": "die Krankheit, -en", "key": "krankheit", "forms": ["Krankheiten", "Krankheit"], "pos": "Substantiv", "zh": "疾病", "example_de": "Die Bundesstaaten sagen auch: die jungen Menschen bekommen deshalb psychische Krankheiten.", "example_zh": ""}, {"lemma": "das Gericht, -e", "key": "gericht", "forms": ["Gericht"], "pos": "Substantiv", "zh": "法院", "example_de": "Deshalb gibt es jetzt einen großen Prozess vor Gericht.", "example_zh": ""}, {"lemma": "der Prozess, -e", "key": "prozess", "forms": ["Prozess"], "pos": "Substantiv", "zh": "诉讼，案件", "example_de": "Deshalb gibt es jetzt einen großen Prozess vor Gericht.", "example_zh": ""}, {"lemma": "demonstrieren", "key": "demonstrieren", "forms": ["demonstrieren"], "pos": "Verb", "zh": "示威", "example_de": "Diese Menschen sind wütend und demonstrieren.", "example_zh": ""}, {"lemma": "das Plakat, -e", "key": "plakat", "forms": ["Plakat"], "pos": "Substantiv", "zh": "海报，标语牌", "example_de": "Die Jugendlichen auf dem Plakat sind gestorben.", "example_zh": ""}, {"lemma": "die Zukunft", "key": "zukunft", "forms": ["Zukunft"], "pos": "Substantiv", "zh": "未来", "example_de": "Sie sind unsere Zukunft.", "example_zh": ""}, {"lemma": "die Strafe, -n", "key": "strafe", "forms": ["Strafe"], "pos": "Substantiv", "zh": "惩罚，处罚", "example_de": "Und sie hoffen, dass Meta eine Strafe bekommt.", "example_zh": ""}], "grammar_points": [{"title": "deshalb + Verb-Position 2", "summary": "deshalb（因此）这类连词副词占第一位时，变位动词仍紧随其后占第二位，主语退到动词后面：Deshalb gibt es …。", "example_de": "Deshalb gibt es jetzt einen großen Prozess vor Gericht.", "example_zh": "因此现在法庭上有一场大型诉讼。"}, {"title": "hoffen, dass + 尾语序", "summary": "dass 引导的从句中，变位动词放在句末：…, dass Meta eine Strafe bekommt。", "example_de": "Und sie hoffen, dass Meta eine Strafe bekommt.", "example_zh": "他们希望 Meta 受到惩罚。"}], "background": "2023 年美国 30 多个联邦州联合起诉 Meta，指控 Instagram 和 Facebook 的产品设计故意让儿童青少年成瘾、损害心理健康，Meta 否认指控。本案被视为对社交媒体行业意义重大的审判。"}, {"title": "Migranten: Italien und Deutschland streiten", "title_zh": "移民问题：意大利和德国起争执", "paras": [{"start": 199.2, "end": 225.16, "lines": [{"de": "Migrant bedeutet: jemand verlässt die Heimat und geht in ein neues Land.", "zh": "Migrant（移民）的意思是：有人离开家乡，", "start": 199.2, "end": 210.48}, {"de": "Zum Beispiel wegen Krieg in der Heimat.", "zh": "去一个新的国家，比如因为家乡爆发战争。", "start": 210.52, "end": 212.8}, {"de": "Wenn ein Migrant in einem Land leben will, dann muss er einen Antrag stellen.", "zh": "移民想在一个国家生活，就必须提出申请，", "start": 213.36, "end": 218.04}, {"de": "Und das Land muss sich kümmern.", "zh": "而这个国家必须负责处理。", "start": 218.08, "end": 220.28}, {"de": "Deutschland hat jetzt Streit mit Italien wegen Migranten.", "zh": "现在德国和意大利因为移民问题起了争执。", "start": 221.12, "end": 225.16}]}, {"start": 225.72, "end": 252.12, "lines": [{"de": "Sie kommen aus dem Land Somalia in Afrika.", "zh": "这些移民来自非洲国家索马里。", "start": 225.72, "end": 228.64}, {"de": "Sie sind zuerst in Italien angekommen.", "zh": "他们先到达意大利，然后来到了德国。", "start": 229.08, "end": 231.72}, {"de": "Dann kamen sie nach Deutschland.", "zh": "但欧洲有这样一条规则：移民如果首先抵达意大利，", "start": 232.04, "end": 234.32}, {"de": "In Europa gibt es aber die Regel: Wenn ein Migrant zuerst in Italien ankommt, dann muss sich Italien kümmern.", "zh": "就应由意大利负责。", "start": 234.64, "end": 243.4}, {"de": "Deshalb will Deutschland jetzt mehrere Migranten nach Italien zurückschicken.", "zh": "所以德国现在想把多名移民遣返回意大利。", "start": 243.48, "end": 248.96}, {"de": "Aber Italien sagt: wir kümmern uns nicht.", "zh": "但意大利说：我们不管。", "start": 249.2, "end": 252.12}]}], "vocab": [{"lemma": "der Migrant, -en", "key": "migrant", "forms": ["Migrant", "Migranten"], "pos": "Substantiv", "zh": "移民", "example_de": "Migrant bedeutet: jemand verlässt die Heimat und geht in ein neues Land.", "example_zh": ""}, {"lemma": "die Heimat, -en", "key": "heimat", "forms": ["Heimat"], "pos": "Substantiv", "zh": "家乡，祖国", "example_de": "Migrant bedeutet: jemand verlässt die Heimat und geht in ein neues Land.", "example_zh": ""}, {"lemma": "der Antrag, ´-e", "key": "antrag", "forms": ["Antrag"], "pos": "Substantiv", "zh": "申请", "example_de": "Wenn ein Migrant in einem Land leben will, dann muss er einen Antrag stellen.", "example_zh": ""}, {"lemma": "sich kümmern", "key": "sich-kuemmern", "forms": ["kümmern", "sich kümmern"], "pos": "Verb", "zh": "照料，负责处理", "example_de": "Und das Land muss sich kümmern.", "example_zh": ""}, {"lemma": "der Streit", "key": "streit", "forms": ["Streit"], "pos": "Substantiv", "zh": "争执，争吵", "example_de": "Deutschland hat jetzt Streit mit Italien wegen Migranten.", "example_zh": ""}, {"lemma": "ankommen", "key": "ankommen", "forms": ["ankommt", "angekommen", "ankommen"], "pos": "Verb", "zh": "到达", "example_de": "Sie sind zuerst in Italien angekommen.", "example_zh": ""}, {"lemma": "die Regel, -n", "key": "regel", "forms": ["Regel"], "pos": "Substantiv", "zh": "规则", "example_de": "In Europa gibt es aber die Regel: Wenn ein Migrant zuerst in Italien ankommt, dann muss sich Italien kümmern.", "example_zh": ""}, {"lemma": "zurückschicken", "key": "zurueckschicken", "forms": ["zurückschicken"], "pos": "Verb", "zh": "送回，遣返", "example_de": "Deshalb will Deutschland jetzt mehrere Migranten nach Italien zurückschicken.", "example_zh": ""}], "grammar_points": [{"title": "wenn …, dann …", "summary": "wenn 引导条件从句，动词放句尾；主句常用 dann 引出，动词仍在第二位：Wenn … leben will, dann muss er …。", "example_de": "Wenn ein Migrant in einem Land leben will, dann muss er einen Antrag stellen.", "example_zh": "移民想在一个国家生活，就必须提出申请。"}, {"title": "wegen + 第二格", "summary": "wegen（因为）接名词第二格。复数无冠词时形式不变：wegen Migranten。", "example_de": "Deutschland hat jetzt Streit mit Italien wegen Migranten.", "example_zh": "现在德国和意大利因为移民问题起了争执。"}], "background": "欧洲“都柏林规则”规定：移民首次入境的欧盟国家负责其庇护申请。索马里移民经意大利入境后再到德国，德国据此要求意大利接管，遭意大利拒绝，两国争端由此而来。"}, {"title": "Hilfsorganisationen: Gefährliche Arbeit", "title_zh": "援助组织：危险的工作", "paras": [{"start": 254.68, "end": 288.8, "lines": [{"de": "Auf der Welt gibt es viele Hilfsorganisationen.", "zh": "世界上有很多援助组织。", "start": 254.68, "end": 264.12}, {"de": "Sie helfen den Menschen, vor allem in Gebieten mit Krieg.", "zh": "它们帮助人们，尤其是在战争地区，", "start": 264.16, "end": 267.68}, {"de": "Zum Beispiel den Kindern im Land Sudan in Afrika, wie auf dem Foto.", "zh": "比如非洲国家苏丹的儿童（如图）。", "start": 268.48, "end": 273.2}, {"de": "Oder wenn es ein Erdbeben oder einen schweren Sturm gab.", "zh": "地震或强风暴过后它们也会伸出援手。", "start": 273.84, "end": 277.76}, {"de": "Die Hilfsorganisationen sagen: für unsere Mitarbeiter ist es gefährlich in den Gebieten.", "zh": "援助组织说：在这些地区，", "start": 278.28, "end": 284.12}, {"de": "Einige werden angegriffen.", "zh": "我们的工作人员处境危险。一些人遭到袭击，", "start": 284.16, "end": 286.04}, {"de": "Viele sterben bei den Einsätzen.", "zh": "许多人在执行任务时牺牲。", "start": 286.52, "end": 288.8}]}, {"start": 289.32, "end": 308.12, "lines": [{"de": "Die Hilfsorganisationen in Deutschland sagen: die Regierung muss uns mehr Geld geben.", "zh": "德国的援助组织说：政府必须给我们更多资金。", "start": 289.32, "end": 294.84}, {"de": "Nur mit genug Geld können wir nämlich Menschen helfen.", "zh": "因为只有资金充足，我们才能帮助人们。", "start": 295.36, "end": 299.04}, {"de": "Die Regierung muss aber sparen.", "zh": "但政府必须节省开支，", "start": 299.08, "end": 301.28}, {"de": "Und sie hat deshalb zuletzt viel weniger Geld an Hilfsorganisationen gegeben als vor einigen Jahren.", "zh": "所以最近拨给援助组织的钱比几年前少了很多。", "start": 301.52, "end": 308.12}]}], "vocab": [{"lemma": "die Hilfsorganisation, -en", "key": "hilfsorganisation", "forms": ["Hilfsorganisationen", "Hilfsorganisation"], "pos": "Substantiv", "zh": "援助组织", "example_de": "Auf der Welt gibt es viele Hilfsorganisationen.", "example_zh": ""}, {"lemma": "vor allem", "key": "vor-allem", "forms": ["vor allem"], "pos": "Redewendung", "zh": "尤其是", "example_de": "Sie helfen den Menschen, vor allem in Gebieten mit Krieg.", "example_zh": ""}, {"lemma": "das Gebiet, -e", "key": "gebiet", "forms": ["Gebieten", "Gebiet"], "pos": "Substantiv", "zh": "地区", "example_de": "Sie helfen den Menschen, vor allem in Gebieten mit Krieg.", "example_zh": ""}, {"lemma": "das Erdbeben, -", "key": "erdbeben", "forms": ["Erdbeben"], "pos": "Substantiv", "zh": "地震", "example_de": "Oder wenn es ein Erdbeben oder einen schweren Sturm gab.", "example_zh": ""}, {"lemma": "der Sturm, ´-e", "key": "sturm", "forms": ["Sturm"], "pos": "Substantiv", "zh": "风暴，暴风", "example_de": "Oder wenn es ein Erdbeben oder einen schweren Sturm gab.", "example_zh": ""}, {"lemma": "gefährlich", "key": "gefaehrlich", "forms": ["gefährlich"], "pos": "Adjektiv", "zh": "危险的", "example_de": "Die Hilfsorganisationen sagen: für unsere Mitarbeiter ist es gefährlich in den Gebieten.", "example_zh": ""}, {"lemma": "angreifen", "key": "angreifen", "forms": ["angegriffen", "angreifen"], "pos": "Verb", "zh": "攻击，袭击", "example_de": "Einige werden angegriffen.", "example_zh": ""}, {"lemma": "der Einsatz, ´-e", "key": "einsatz", "forms": ["Einsätzen", "Einsatz"], "pos": "Substantiv", "zh": "执行任务，出动", "example_de": "Viele sterben bei den Einsätzen.", "example_zh": ""}, {"lemma": "die Regierung, -en", "key": "regierung", "forms": ["Regierung"], "pos": "Substantiv", "zh": "政府", "example_de": "Die Hilfsorganisationen in Deutschland sagen: die Regierung muss uns mehr Geld geben.", "example_zh": ""}, {"lemma": "sparen", "key": "sparen", "forms": ["sparen"], "pos": "Verb", "zh": "节省，节约", "example_de": "Die Regierung muss aber sparen.", "example_zh": ""}], "grammar_points": [{"title": "weniger … als 比较级", "summary": "“比……少”用 weniger … als 表达：viel weniger Geld … als vor einigen Jahren（比几年前少很多钱）。", "example_de": "Und sie hat deshalb zuletzt viel weniger Geld an Hilfsorganisationen gegeben als vor einigen Jahren.", "example_zh": "所以最近拨给援助组织的钱比几年前少了很多。"}, {"title": "nämlich 作插入语", "summary": "nämlich（因为）是插入语，不占句框位置。介词短语开头时动词第二位、主语在动词后，nämlich 夹在中间：Nur mit genug Geld können wir nämlich Menschen helfen。", "example_de": "Nur mit genug Geld können wir nämlich Menschen helfen.", "example_zh": "因为只有资金充足，我们才能帮助人们。"}], "background": "苏丹自 2023 年内战以来是世界上最严重的人道危机之一，援助人员在苏丹等地频繁遇袭。与此同时德国政府因预算紧缩削减人道主义援助资金，援助组织多次公开警告后果。"}, {"title": "Job: Was ist jungen Menschen wichtig?", "title_zh": "工作：年轻人看重什么？", "paras": [{"start": 309.92, "end": 343.24, "lines": [{"de": "Im Bundesland Nordrhein-Westfalen gibt es den Sender WDR.", "zh": "北莱茵-威斯特法伦州有一家电视台叫 WDR，它和 tagesschau 一样属于 ARD。", "start": 309.92, "end": 320.28}, {"de": "Er gehört zur ARD, genau wie die tagesschau.", "zh": "WDR 最近做了一项关于年轻人的调查，问题是：年轻人在工作中看重什么？", "start": 320.32, "end": 324.32}, {"de": "Der WDR hat jetzt eine Studie mit jungen Menschen gemacht und gefragt: Was ist den jungen Menschen wichtig beim Job?", "zh": "调查结果显示：最重要的是良好的薪酬和工作时的氛围。", "start": 325.0, "end": 333.68}, {"de": "Die Studie hat gezeigt: Am wichtigsten ist eine gute Bezahlung und die Stimmung bei der Arbeit.", "zh": "（接下来是一段影片。", "start": 333.84, "end": 341.24}, {"de": "Dazu kommt jetzt ein Film.", "zh": "）", "start": 341.4, "end": 343.24}]}, {"start": 344.04, "end": 423.44, "lines": [{"de": "Dieser junge Mann heißt Robin Rinkowitz.", "zh": "这位年轻人叫 Robin Rinkowitz。", "start": 344.04, "end": 347.64}, {"de": "Er macht eine Ausbildung und lernt die Arbeit als Pfleger für kranke und alte Menschen.", "zh": "他正在接受职业培训，学习护理病人和老人的工作。", "start": 347.68, "end": 355.6}, {"de": "Für Rinkowitz ist genug Geld wichtig in seinem Job.", "zh": "对 Rinkowitz 来说，", "start": 356.92, "end": 361.6}, {"de": "Aber er sagt auch: Besonders wichtig ist es mir, dass ich mich wohlfühle bei der Arbeit.", "zh": "收入足够很重要。但他也说：特别重要的是，", "start": 363.24, "end": 371.84}, {"de": "Der Job ist nämlich auch sehr anstrengend.", "zh": "我在工作中感觉舒服。因为这份工作也很耗精力。", "start": 372.28, "end": 375.4}, {"de": "So wie Rinkowitz wollen viele junge Menschen in der Pflege arbeiten.", "zh": "像 Rinkowitz 一样，", "start": 377.24, "end": 383.16}, {"de": "Und im öffentlichen Dienst.", "zh": "很多年轻人想在护理行业工作，", "start": 383.84, "end": 386.28}, {"de": "Dann arbeitet man zum Beispiel im Amt oder als Lehrer oder Polizist.", "zh": "还有公共部门——比如在政府机关、当老师或警察。", "start": 386.84, "end": 393.0}, {"de": "Dieser Mann ist ein wichtiger Vertreter von solchen Arbeitgebern.", "zh": "这位男士是这类雇主的重要代表。", "start": 394.2, "end": 398.8}, {"de": "Er sagt: Die Arbeit im öffentlichen Dienst ist sehr sicher für die Zukunft.", "zh": "他说：公共部门的工作对未来非常有保障。", "start": 399.36, "end": 405.36}, {"de": "Zum Beispiel ein Amt braucht auch in der Zukunft Mitarbeiter.", "zh": "比如政府机关将来也需要工作人员。", "start": 406.16, "end": 409.88}, {"de": "Das finden viele gut.", "zh": "很多人觉得这一点很好。", "start": 410.36, "end": 412.24}, {"de": "Auch Rinkowitz fühlt sich mit seiner Ausbildung sicher für die Zukunft.", "zh": "Rinkowitz 也觉得自己的培训让未来有保障，", "start": 414.04, "end": 419.04}, {"de": "Viele in seinem Alter wünschen sich die Sicherheit auch.", "zh": "很多同龄人也希望拥有这种安全感。", "start": 419.6, "end": 423.44}]}], "vocab": [{"lemma": "die Bezahlung, -en", "key": "bezahlung", "forms": ["Bezahlung"], "pos": "Substantiv", "zh": "报酬，薪酬", "example_de": "Die Studie hat gezeigt: Am wichtigsten ist eine gute Bezahlung und die Stimmung bei der Arbeit.", "example_zh": ""}, {"lemma": "die Stimmung, -en", "key": "stimmung", "forms": ["Stimmung"], "pos": "Substantiv", "zh": "气氛，情绪", "example_de": "Die Studie hat gezeigt: Am wichtigsten ist eine gute Bezahlung und die Stimmung bei der Arbeit.", "example_zh": ""}, {"lemma": "die Ausbildung, -en", "key": "ausbildung", "forms": ["Ausbildung"], "pos": "Substantiv", "zh": "职业培训，学徒教育", "example_de": "Er macht eine Ausbildung und lernt die Arbeit als Pfleger für kranke und alte Menschen.", "example_zh": ""}, {"lemma": "der Pfleger, -", "key": "pfleger", "forms": ["Pfleger"], "pos": "Substantiv", "zh": "护理员", "example_de": "Er macht eine Ausbildung und lernt die Arbeit als Pfleger für kranke und alte Menschen.", "example_zh": ""}, {"lemma": "sich wohlfühlen", "key": "sich-wohlfuehlen", "forms": ["wohlfühle", "sich wohlfühlen"], "pos": "Verb", "zh": "感觉舒适自在", "example_de": "Aber er sagt auch: Besonders wichtig ist es mir, dass ich mich wohlfühle bei der Arbeit.", "example_zh": ""}, {"lemma": "anstrengend", "key": "anstrengend", "forms": ["anstrengend"], "pos": "Adjektiv", "zh": "费力的，累人的", "example_de": "Der Job ist nämlich auch sehr anstrengend.", "example_zh": ""}, {"lemma": "die Pflege", "key": "pflege", "forms": ["Pflege"], "pos": "Substantiv", "zh": "护理，照料", "example_de": "So wie Rinkowitz wollen viele junge Menschen in der Pflege arbeiten.", "example_zh": ""}, {"lemma": "der öffentliche Dienst", "key": "oeffentlicher-dienst", "forms": ["öffentlichen Dienst", "öffentliche Dienst"], "pos": "Substantiv", "zh": "公共部门，公职", "example_de": "Und im öffentlichen Dienst.", "example_zh": ""}, {"lemma": "der Vertreter, -", "key": "vertreter", "forms": ["Vertreter"], "pos": "Substantiv", "zh": "代表", "example_de": "
