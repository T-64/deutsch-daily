    <script id="dd-data" type="application/json">{"page":"lesson","lesson":{"slug":"2026-11-12","date":"2026-11-12","show":"tagesschau in Einfacher Sprache","level":"A2–B1","kind":"broadcast","note":"","source_url":"https://www.tagesschau.de/tagesschau_in_einfacher_sprache/tse-1512.html","video":{"mp4":"https://tagesschau-progressive.ard-mcdn.de/video/2026/1112/TV-20261112-1734-5900.webl.h264.mp4","embed":"","page":"https://www.tagesschau.de/tagesschau_in_einfacher_sprache/video-1682730.html"},"duration":555.28,"sentences":[{"de":"Willkommen zur tagesschau in Einfacher Sprache.","zh":"欢迎收看简单语言版每日新闻。","start":7.74,"end":10.82},{"de":"Ich bin Susanne Holst und das sind unsere Nachrichten.","zh":"我是Susanne Holst，以下是我们的新闻。","start":10.86,"end":14.66},{"de":"Und nun zur ersten Nachricht.","zh":"现在来看第一条新闻。","start":36.22,"end":38.98},{"de":"Der Haushaltsausschuss ist eine Gruppe von Politikern im Bundestag.","zh":"预算委员会是联邦议院中一个由政治家组成的团体。","start":43.94,"end":48.9},{"de":"Er spricht darüber, wie viel Geld darf Deutschland ausgeben und wofür darf Deutschland Geld ausgeben.","zh":"它讨论德国可以花多少钱，以及可以把钱花在哪些方面。","start":49.18,"end":57.1},{"de":"Heute ist ein wichtiges Treffen von dem Haushaltsausschuss.","zh":"今天预算委员会举行一次重要会议。","start":57.78,"end":62.1},{"de":"Das sieht man auf dem Foto.","zh":"照片上可以看到。","start":62.34,"end":64.14},{"de":"Bei dem Treffen geht es um das Geld für das Jahr 2027.","zh":"这次会议讨论的是2027年的钱。","start":65.32,"end":70.12},{"de":"Aber es gibt Streit in der Regierung.","zh":"但政府内部存在争执。","start":71.12,"end":73.52},{"de":"Die Partei CDU will bestimmte Steuern senken.","zh":"基民盟想降低某些税收。","start":73.78,"end":77.42},{"de":"Und sie will weniger Geld im Sozialbereich ausgeben.","zh":"它还想减少在社会领域的开支。","start":78.1,"end":81.46},{"de":"Z.B. für Hilfen für Familien mit wenig Geld.","zh":"比如减少对低收入家庭的补助。","start":81.5,"end":86.5},{"de":"Das findet die Partei SPD nicht gut.","zh":"社民党不认同这一点。","start":87.18,"end":90.18},{"de":"Sie sagt, Menschen mit wenig Geld sollen weiter genug Hilfe vom Staat bekommen.","zh":"它说，低收入的人应当继续从国家获得足够的帮助。","start":90.7,"end":97.02},{"de":"Die Regierung sucht jetzt nach einer Lösung in dem Streit.","zh":"政府现在正在寻找解决这场争执的办法。","start":97.42,"end":101.3},{"de":"Erst dann kann der Haushaltsausschuss über das Geld für das Jahr 2027 entscheiden.","zh":"之后预算委员会才能就2027年的钱作出决定。","start":101.34,"end":108.54},{"de":"Und nun zur nächsten Nachricht.","zh":"现在来看下一条新闻。","start":110.14,"end":112.46},{"de":"In der Ukraine ist seit vielen Jahren Krieg.","zh":"乌克兰多年来一直处于战争之中。","start":117.84,"end":120.92},{"de":"Russland hat die Ukraine nämlich angegriffen.","zh":"原因是俄罗斯攻击了乌克兰。","start":121.76,"end":124.72},{"de":"Die USA wollen bei einer Lösung für Frieden helfen.","zh":"美国想在和平解决方案上提供帮助。","start":125.28,"end":128.84},{"de":"Deshalb sind jetzt zwei Berater von der Regierung von den USA nach Russland gereist.","zh":"因此，美国政府的两名顾问现在前往了俄罗斯。","start":129.84,"end":135.8},{"de":"Die Berater heißen Jared Kushner und Steve Witkoff.","zh":"这两名顾问叫Jared Kushner和Steve Witkoff。","start":135.86,"end":140.34},{"de":"Die sind auf dem Foto.","zh":"照片上就是他们。","start":140.74,"end":142.3},{"de":"Kushner trifft sich mit dem Präsidenten von Russland, Wladimir Putin.","zh":"Kushner将与俄罗斯总统弗拉基米尔·普京会面。","start":142.98,"end":147.78},{"de":"Bei dem Treffen soll es um Frieden zwischen Russland und der Ukraine gehen.","zh":"这次会晤将讨论俄罗斯与乌克兰之间的和平。","start":147.82,"end":153.78},{"de":"Danach reisen Kushner und Witkoff nach Irland, in die Stadt Dublin.","zh":"之后，Kushner和Witkoff将前往爱尔兰的城市都柏林。","start":153.86,"end":158.74},{"de":"Dort treffen sie den Präsidenten von der Ukraine, Wolodymyr Selenskyj.","zh":"他们将在那里会见乌克兰总统弗拉基米尔·泽连斯基。","start":159.66,"end":164.5},{"de":"Bei dem Treffen sind auch viele Chefs von den europäischen Ländern dabei.","zh":"许多欧洲国家的领导人也将参加这次会晤。","start":164.78,"end":170.06},{"de":"Auch Kanzler Merz ist in Dublin.","zh":"总理默茨也在都柏林。","start":170.94,"end":173.22},{"de":"Bei dem Treffen geht es um die Frage, wie kann Europa bei einem Frieden zwischen der Ukraine und Russland helfen?","zh":"这次会晤讨论的问题是：欧洲如何帮助实现乌克兰与俄罗斯之间的和平？","start":173.66,"end":181.66},{"de":"Und nun zur nächsten Nachricht.","zh":"现在来看下一条新闻。","start":183.94,"end":186.14},{"de":"Im Gazastreifen war lange Krieg.","zh":"加沙地带长期处于战争状态。","start":191.38,"end":193.74},{"de":"Der Gazastreifen ist neben Israel.","zh":"加沙地带位于以色列旁边。","start":194.02,"end":197.18},{"de":"Israel hat im Gazastreifen gegen Terroristen von der Gruppe Hamas gekämpft.","zh":"以色列曾在加沙地带与哈马斯组织的恐怖分子作战。","start":197.9,"end":203.98},{"de":"Inzwischen gibt es eine Waffenruhe.","zh":"现在已经实现停火。","start":204.26,"end":206.7},{"de":"D.h. niemand soll mehr kämpfen.","zh":"也就是说，任何人都不应再战斗。","start":206.74,"end":210.5},{"de":"Manchmal greift Israel den Gaza-Streifen trotzdem noch an.","zh":"但有时以色列仍然会攻击加沙地带。","start":211.22,"end":216.02},{"de":"Jetzt hat Israel bei einem neuen Angriff ein Krankenhaus mit Raketen beschossen.","zh":"现在，以色列在一次新的攻击中用火箭弹袭击了一家医院。","start":216.98,"end":222.74},{"de":"Dazu zeigen wir jetzt einen Film.","zh":"接下来我们播放一段影片。","start":223.38,"end":225.74},{"de":"Das ist das Nasser Krankenhaus im Gazastreifen.","zh":"这是加沙地带的纳赛尔医院。","start":226.82,"end":231.5},{"de":"Von außen sieht man die kaputten Fenster.","zh":"从外面可以看到破损的窗户。","start":232.1,"end":234.94},{"de":"Viele Scheiben sind zerbrochen.","zh":"许多玻璃都碎了。","start":235.38,"end":237.58},{"de":"Von drinnen ist alles noch viel schlimmer.","zh":"里面的情况更加糟糕。","start":238.78,"end":241.7},{"de":"Alles ist kaputt.","zh":"一切都坏了。","start":242.18,"end":243.9},{"de":"Viele Decken und Wände sind einfach eingestürzt.","zh":"许多天花板和墙壁直接坍塌了。","start":244.62,"end":248.9},{"de":"Überall liegen Trümmer herum.","zh":"到处都是瓦砾。","start":248.94,"end":252.02},{"de":"Bei dem Angriff von Israel sind mehrere Menschen gestorben.","zh":"以色列的这次袭击造成多人死亡。","start":252.98,"end":257.9},{"de":"Viele wurden verletzt.","zh":"许多人受伤。","start":258.18,"end":260.5},{"de":"Israel sagt:","zh":"以色列说：","start":261.46,"end":262.74},{"de":"In dem Krankenhaus waren Terroristen von der Hamas.","zh":"医院里有哈马斯的恐怖分子。","start":263.34,"end":266.22},{"de":"Die Hamas hat auf dem Gelände von dem Krankenhaus eine Zentrale für ihre Angriffe gebaut.","zh":"哈马斯在医院的场地内建立了一个用于发动袭击的指挥部。","start":266.26,"end":273.02},{"de":"Deshalb haben wir Raketen geschossen.","zh":"所以我们发射了火箭弹。","start":273.62,"end":276.5},{"de":"Mitarbeiter von dem Krankenhaus haben die Teile von der Rakete eingesammelt.","zh":"医院的工作人员收集了火箭弹的残骸。","start":278.7,"end":283.58},{"de":"Sie können später ein Beweis für den Angriff von Israel sein.","zh":"这些残骸以后可能成为以色列袭击的证据。","start":283.78,"end":288.18},{"de":"Andere Mitarbeiter suchen jetzt nach Geräten, die noch heil sind.","zh":"其他工作人员现在正在寻找还能使用的设备。","start":290.58,"end":295.7},{"de":"Ein Pfleger hat in den Trümmern einen Koffer mit Klamotten gefunden.","zh":"一名护理人员在瓦砾中找到了一个装着衣物的箱子。","start":296.62,"end":301.42},{"de":"Aber viel ist nicht übrig geblieben.","zh":"但留下来的东西不多。","start":301.66,"end":304.34},{"de":"Das Nasser Krankenhaus ist wichtig für die Menschen.","zh":"纳赛尔医院对当地民众很重要。","start":306.34,"end":309.98},{"de":"Denn viele andere Krankenhäuser im Gazastreifen sind zerstört.","zh":"因为加沙地带的许多其他医院已被摧毁。","start":310.3,"end":314.94},{"de":"Und nun zur nächsten Nachricht.","zh":"现在来看下一条新闻。","start":316.9,"end":319.1},{"de":"In den USA gab es ein schweres Unglück.","zh":"美国发生了一起严重事故。","start":323.4,"end":326.12},{"de":"Dazu zeigen wir einen kurzen Film.","zh":"为此我们播放一段短片。","start":326.26,"end":328.58},{"de":"In der Stadt New York ist ein Haus eingestürzt.","zh":"纽约市有一栋房屋倒塌了。","start":328.62,"end":331.94},{"de":"Bei dem Einsturz sind mehrere Menschen gestorben.","zh":"这次倒塌造成多人死亡。","start":332.34,"end":335.54},{"de":"Und viele wurden verletzt.","zh":"还有很多人受伤。","start":335.58,"end":337.42},{"de":"Viele Feuerwehrleute suchen nach vermissten Menschen in den Trümmern.","zh":"许多消防员正在废墟中搜寻失踪人员。","start":337.98,"end":342.38},{"de":"Das ist sehr gefährlich.","zh":"这非常危险。","start":342.42,"end":344.14},{"de":"Die Reste von dem Haus können nämlich noch weiter einstürzen.","zh":"因为房屋的残骸还可能继续倒塌。","start":344.5,"end":348.5},{"de":"Die Polizei untersucht jetzt, warum ist das Haus eingestürzt.","zh":"警方正在调查房屋为什么会倒塌。","start":348.54,"end":353.78},{"de":"Und nun zur nächsten Nachricht.","zh":"现在来看下一条新闻。","start":355.78,"end":357.98},{"de":"Wenn Menschen alt oder krank sind, dann brauchen einige von ihnen Pflege.","zh":"当人年老或生病时，其中一些人需要护理。","start":362.56,"end":367.86},{"de":"Das heißt: Andere Menschen müssen sich um sie kümmern.","zh":"也就是说：其他人必须照顾他们。","start":368.18,"end":371.34},{"de":"Aber in Deutschland gibt es bei der Pflege ein Problem.","zh":"但在德国，护理方面存在一个问题。","start":371.38,"end":375.82},{"de":"Es gibt nämlich zu wenig Geld dafür.","zh":"那就是护理的资金太少了。","start":376.22,"end":378.78},{"de":"Und zu wenige Menschen machen eine Ausbildung zum Pfleger.","zh":"而且接受护理员培训的人也太少了。","start":379.18,"end":382.94},{"de":"Sie sagen: Die Arbeit ist sehr schwer und die Bezahlung ist nicht gut.","zh":"他们说：这份工作非常辛苦，报酬也不好。","start":382.98,"end":387.9},{"de":"Und deshalb gibt es zu wenig Pfleger für die Alten und Kranken.","zh":"因此，护理老人和病人的护理人员太少了。","start":388.14,"end":391.9},{"de":"Jetzt gibt es ein wichtiges Treffen in Berlin.","zh":"现在柏林有一个重要会议。","start":391.94,"end":395.86},{"de":"Den Deutschen Pflegetag.","zh":"德国护理日。","start":396.18,"end":398.02},{"de":"Dort treffen sich Pfleger, Wissenschaftler, Gewerkschaften und auch Politiker.","zh":"护理人员、科学家、工会以及政治家们将在那里聚会。","start":398.86,"end":404.5},{"de":"Sie wollen zusammen eine Lösung für eine gute Pflege in Deutschland finden.","zh":"他们想一起为德国的良好护理找到解决办法。","start":405.1,"end":410.02},{"de":"Einige Betriebe haben dafür schon Ideen.","zh":"一些机构已经有了一些想法。","start":410.06,"end":413.26},{"de":"Dazu zeigen wir jetzt einen Film.","zh":"为此我们现在播放一段影片。","start":413.82,"end":416.18},{"de":"Das ist Chaiane dos Santos.","zh":"这位是沙伊安妮·多斯桑托斯。","start":417.36,"end":419.84},{"de":"Sie kommt eigentlich aus Brasilien.","zh":"她其实来自巴西。","start":420.1,"end":422.9},{"de":"Seit einem Jahr arbeitet sie aber in einem Krankenhaus in Deutschland in der Stadt Cottbus.","zh":"但一年来，她在德国科特布斯市的一家医院工作。","start":423.46,"end":430.26},{"de":"Sie sagt: Am Anfang war es schwer.","zh":"她说：一开始很困难。","start":430.74,"end":434.02},{"de":"Ich musste erst Deutsch lernen.","zh":"我得先学德语。","start":434.26,"end":436.46},{"de":"In Deutschland gibt es zu wenig Pfleger.","zh":"德国的护理人员太少了。","start":436.74,"end":439.74},{"de":"Deshalb braucht das Krankenhaus auch Mitarbeiter aus dem Ausland.","zh":"所以这家医院也需要来自国外的员工。","start":440.1,"end":444.22},{"de":"Dos Santos sagt:","zh":"多斯桑托斯说：","start":444.26,"end":446.18},{"de":"Einige Patienten verstehen mich nicht sofort und sind dann unsicher.","zh":"有些病人不能马上听懂我的话，然后会感到不安。","start":447.18,"end":451.66},{"de":"Ich sage dann, dass ich in Brasilien eine Ausbildung zur Pflegerin gemacht habe.","zh":"我就会告诉他们，我在巴西接受过护理员培训。","start":452.42,"end":458.1},{"de":"Und dann vertrauen mir die Patienten auch.","zh":"然后病人们也会信任我。","start":458.34,"end":461.26},{"de":"In dem Krankenhaus gibt es ein spezielles Team.","zh":"这家医院有一个专门的团队。","start":465.08,"end":468.36},{"de":"Es kümmert sich um neue Mitarbeiter aus dem Ausland und hilft ihnen in der ersten Zeit im neuen Job.","zh":"它负责照顾来自国外的新员工，并在他们新工作的初期提供帮助。","start":469.02,"end":476.3},{"de":"Die Mitarbeiter sollen dadurch einen guten Start in Deutschland haben.","zh":"这样，员工们就能在德国有一个好的开始。","start":477.14,"end":481.78},{"de":"Die Chefin von den Pflegern sagt, mit den neuen Mitarbeitern ist eine gute Gemeinschaft entstanden.","zh":"护理人员的负责人说，新员工的加入形成了一个良好的集体。","start":483.56,"end":490.32},{"de":"Das macht uns Mut und zeigt uns, unser Modell mit ausländischen Pflegern funktioniert.","zh":"这给了我们勇气，也告诉我们：我们采用外国护理人员的模式是有效的。","start":490.64,"end":497.36},{"de":"Auch andere Krankenhäuser stellen immer öfter ausländische Pfleger ein.","zh":"其他医院也越来越常聘用外国护理人员。","start":498.14,"end":502.78},{"de":"Denn ohne sie funktioniert die Arbeit im Krankenhaus schon lange nicht mehr.","zh":"因为没有他们，医院的运作早就无法维持了。","start":503.88,"end":508.54},{"de":"Und das waren unsere Nachrichten.","zh":"以上就是我们的新闻。","start":510.58,"end":512.94},{"de":"Und jetzt kommt das Wetter.","zh":"现在播报天气。","start":533.62,"end":535.54},{"de":"Es gibt überall viele Wolken, aber manchmal auch Sonne.","zh":"各地云层都很多，但有时也有阳光。","start":536.14,"end":540.06},{"de":"Unten im Süden gibt es Regen.","zh":"南部有雨。","start":540.78,"end":542.86},{"de":"Oben im Norden gibt es auch Regen und Gewitter.","zh":"北部也有雨和雷雨。","start":543.22,"end":546.5},{"de":"Es werden 2 bis 10 Grad.","zh":"气温为2至10度。","start":546.86,"end":548.94},{"de":"Das war die tagesschau in Einfacher Sprache.","zh":"以上就是简单语言版的每日新闻。","start":550.36,"end":553.04},{"de":"Tschüss, bis zum nächsten Mal.","zh":"再见，下次见。","start":553.12,"end":555.28}],"stories":[{"title":"Begrüßung","title_zh":"欢迎","from":0,"to":2,"vocab":[],"grammar":[],"background":""},{"title":"Streit im Haushaltsausschuss","title_zh":"预算委员会的争执","from":3,"to":15,"vocab":[{"key":"treffen","lemma":"das Treffen, -","pos":"noun","zh":"会面，会议","example_de":"Heute ist ein wichtiges Treffen von dem Haushaltsausschuss.","example_zh":"今天预算委员会举行一次重要会议。"},{"key":"regierung","lemma":"die Regierung, -en","pos":"noun","zh":"政府","example_de":"Aber es gibt Streit in der Regierung.","example_zh":"但政府内部存在争执。"},{"key":"steuer","lemma":"die Steuer, -n","pos":"noun","zh":"税收","example_de":"Die Partei CDU will bestimmte Steuern senken.","example_zh":"基民盟想降低某些税收。"},{"key":"senken","lemma":"senken","pos":"verb","zh":"降低","example_de":"Die Partei CDU will bestimmte Steuern senken.","example_zh":"基民盟想降低某些税收。"},{"key":"lösung","lemma":"die Lösung, -en","pos":"noun","zh":"解决办法","example_de":"Die Regierung sucht jetzt nach einer Lösung in dem Streit.","example_zh":"政府现在正在寻找解决这场争执的办法。"}],"grammar":[{"title":"um ... gehen（涉及，关于）","summary":"\"Bei dem Treffen geht es um das Geld\" 表示\"会议涉及/讨论的是钱\"，geht es um + 第四格是常用表达。","example_de":"Bei dem Treffen geht es um das Geld für das Jahr 2027.","example_zh":"这次会议讨论的是2027年的钱。"}],"background":""},{"title":"USA-Berater
