n haben die Behörden eine Warnung gemacht.","zh":"告诉人们：注意安全，","start":205.39,"end":209.75},{"de":"Die Behörden sagen den Menschen: Passt auf euch auf, das Wetter ist gefährlich.","zh":"天气很危险，","start":210.11,"end":215.79},{"de":"Auch junge Menschen können Probleme bekommen.","zh":"即使是年轻人也可能出现健康问题。","start":215.83,"end":220.95},{"de":"In vielen Ländern im Süden von Europa ist es warm, zum Beispiel auch in Österreich.","zh":"南欧许多国家都在经历高温，","start":221.71,"end":228.43},{"de":"In Wien war es manchmal über 40 Grad.","zh":"比如奥地利。","start":228.83,"end":235.43},{"de":"Und auch in Ungarn ist es sehr heiß.","zh":"首都维也纳近几天气温有时超过40度。","start":235.47,"end":238.75},{"de":"Die Menschen versuchen, sich abzukühlen.","zh":"匈牙利也非常炎热，人们想方设法降温。","start":239.15,"end":241.95},{"de":"Weil es so heiß ist und wenig regnet, ist auch wenig Wasser in dem Fluss Donau.","zh":"由于天热少雨，多瑙河水量也很少，","start":243.07,"end":250.07},{"de":"Das ist ein Problem für dieses Atomkraftwerk.","zh":"这给一座核电站带来了问题。","start":250.87,"end":253.87},{"de":"Ohne Wasser aus dem Fluss kann es nicht gekühlt werden.","zh":"没有河水就无法冷却，","start":253.91,"end":258.75},{"de":"Und ohne Kühlung kann es nicht viel Strom machen.","zh":"没有冷却就无法大量发电。因此在布达佩斯，","start":259.03,"end":262.79},{"de":"Deshalb sind in Budapest gerade viele Lichter an Gebäuden abends aus, um Strom zu sparen.","zh":"许多建筑晚上都关灯以节省电力。","start":264.31,"end":273.63},{"de":"Mallorca ist eine Insel im Mittelmeer, unten im Süden von Europa.","zh":"马略卡岛是地中海中的一座岛屿，","start":274.87,"end":287.79},{"de":"Mallorca gehört zu Spanien.","zh":"位于欧洲南部，","start":287.83,"end":290.23},{"de":"Das Wasser im Mittelmeer bei Mallorca war jetzt so warm wie noch nie in Spanien.","zh":"属于西班牙。","start":290.83,"end":298.59},{"de":"Es war nämlich 33 Grad warm.","zh":"马略卡附近地中海的水温现在达到了西班牙有记录以来的最高值——33度。","start":298.63,"end":301.35},{"de":"Das warme Wasser ist gefährlich für Fische und Pflanzen im Mittelmeer.","zh":"温暖的海水对地中海的鱼类和植物很危险。","start":301.67,"end":307.83},{"de":"Und wenn das Wetter jetzt s
