    <script id="dd-data" type="application/json">{"page":"lesson","lesson":{"slug":"2026-11-25","date":"2026-11-25","show":"tagesschau in Einfacher Sprache","level":"A2–B1","kind":"broadcast","note":"","source_url":"https://www.tagesschau.de/tagesschau_in_einfacher_sprache/tse-1524.html","video":{"mp4":"https://tagesschau-progressive.ard-mcdn.de/video/2026/1125/TV-20261125-1738-2800.webl.h264.mp4","embed":"","page":"https://www.tagesschau.de/tagesschau_in_einfacher_sprache/video-1689806.html"},"duration":539.89,"sentences":[{"de":"Willkommen zur tagesschau in Einfacher Sprache.","zh":"欢迎收看简单语言版每日新闻。","start":11.01,"end":14.13},{"de":"Ich bin Michail Paweletz und das sind unsere Nachrichten:","zh":"我是米夏埃尔·帕韦莱茨，以下是我们的新闻：","start":14.17,"end":18.73},{"de":"tagesschau in Einfacher Sprache auf WhatsApp.","zh":"简单语言版每日新闻登陆WhatsApp。","start":20.44,"end":23.6},{"de":"Und nun zur ersten Nachricht.","zh":"现在来看第一条新闻。","start":44.41,"end":47.81},{"de":"tagesschau in Einfacher Sprache auf WhatsApp.","zh":"简单语言版每日新闻登陆WhatsApp。","start":48.93,"end":52.97},{"de":"Die tagesschau in Einfacher Sprache gibt es jetzt auch auf WhatsApp.","zh":"简单语言版每日新闻现在也可以在WhatsApp上收看了。","start":54.21,"end":60.33},{"de":"Die App kostet kein Geld.","zh":"这款应用是免费的。","start":60.85,"end":63.53},{"de":"Man kann sie auf das Handy oder das Tablet herunterladen.","zh":"可以下载到手机或平板电脑上。","start":63.57,"end":69.65},{"de":"Die tagesschau in Einfacher Sprache hat einen eigenen Kanal bei WhatsApp.","zh":"简单语言版每日新闻在WhatsApp上有自己的频道。","start":70.41,"end":77.69},{"de":"Sie finden diesen Kanal bei tagesschau.de/einfach.","zh":"您可以在tagesschau.de/einfach找到这个频道。","start":77.73,"end":87.09},{"de":"So wie es unter dem Foto steht.","zh":"就像照片下方写的那样。","start":87.89,"end":90.73},{"de":"Auf WhatsApp sind von montags bis freitags drei Nachrichten von der tagesschau in Einfacher Sprache.","zh":"在WhatsApp上，简单语言版每日新闻从周一到周五每天发布三条新闻。","start":91.77,"end":101.81},{"de":"Unter den Nachrichten ist der Link zu der ganzen Sendung.","zh":"新闻下方有完整节目的链接。","start":101.85,"end":108.05},{"de":"Und nun zur nächsten Nachricht:","zh":"现在来看下一条新闻：","start":110.33,"end":112.69},{"de":"Die Bundesregierung will im nächsten Jahr viel Geld ausgeben.","zh":"联邦政府明年想花很多钱。","start":117.56,"end":122.37},{"de":"Und sie will viele Schulden machen.","zh":"而且还想大量举债。","start":122.81,"end":125.81},{"de":"Im Bundestag reden die Politiker in dieser Woche darüber.","zh":"联邦议院本周将讨论此事。","start":126.81,"end":132.09},{"de":"Dabei gibt es auch Streit.","zh":"其中也存在争议。","start":133.24,"end":135.08},{"de":"In der Bundesregierung sind die Parteien CDU/CSU und SPD.","zh":"联邦政府由联盟党（基民盟/基社盟）和社民党组成。","start":136.8,"end":142.88},{"de":"Politiker von anderen Parteien finden die Pläne der Bundesregierung schlecht.","zh":"其他政党的政治人物认为联邦政府的计划不好。","start":144.69,"end":150.49},{"de":"Sie sagen: Die Bundesregierung soll weniger Schulden machen.","zh":"他们说：联邦政府应该少借债。","start":151.05,"end":155.97},{"de":"Und sie sagen: Die Bundesregierung macht keine gute Arbeit.","zh":"他们还说：联邦政府工作做得不好。","start":156.61,"end":161.93},{"de":"Dazu kommt jetzt ein Film.","zh":"接下来请看一段影片。","start":162.49,"end":164.53},{"de":"Diese Politikerin heißt Britta Haßelmann.","zh":"这位政治人物名叫布里塔·哈塞尔曼。","start":166.25,"end":169.01},{"de":"Sie ist von der Partei Die Grünen.","zh":"她来自绿党。","start":169.05,"end":171.49},{"de":"Haßelmann sagt: Die Bundesregierung streitet zu viel.","zh":"哈塞尔曼说：联邦政府争执太多。","start":171.73,"end":175.17},{"de":"Das sieht man an der Stromsteuer.","zh":"从电力税就能看出来。","start":175.21,"end":177.17},{"de":"So viele Worte und trotzdem sinkt die Stromsteuer nur für ein Jahr.","zh":"说了这么多话，电力税却只降低一年。","start":177.21,"end":181.41},{"de":"Bundeskanzler Merz spricht auch im Bundestag.","zh":"联邦总理默茨也在联邦议院发言。","start":181.45,"end":184.17},{"de":"Er sagt:","zh":"他说：","start":184.48,"end":185.68},{"de":"Die letzten Wochen waren chaotisch, das weiß ich.","zh":"过去几周很混乱，这我知道。","start":185.88,"end":189.32},{"de":"Das war nicht schön.","zh":"这并不好。","start":189.48,"end":190.92},{"de":"Die Bundesregierung hat lange gestritten.","zh":"联邦政府争执了很久。","start":191.04,"end":193.88},{"de":"Soll die Stromsteuer sinken oder nicht?","zh":"电力税到底降不降？","start":193.96,"end":196.68},{"de":"Jetzt sinkt die Stromsteuer.","zh":"现在电力税要降低了。","start":196.77,"end":198.77},{"de":"Das ist aber teuer für die Bundesregierung.","zh":"但这让联邦政府付出高昂代价。","start":198.93,"end":201.41},{"de":"Und Geld fehlt sowieso schon.","zh":"而资金本来就短缺。","start":201.45,"end":203.53},{"de":"Kanzler Merz sagt: Deutschland ist in einer schwierigen Lage.","zh":"默茨总理说：德国正处于困难境地。","start":203.68,"end":207.96},{"de":"Aber es geht aufwärts.","zh":"但情况正在好转。","start":208.25,"end":209.93},{"de":"Die Wirtschaft wächst ein bisschen, das ist ein gutes Zeichen.","zh":"经济略有增长，这是个好迹象。","start":210.16,"end":213.8},{"de":"Das ist Heidi Reichinnek von der Linkspartei.","zh":"这是左翼党的海蒂·赖希内克。","start":214.52,"end":217.24},{"de":"Sie sagt:","zh":"她说：","start":217.36,"end":218.72},{"de":"Die Bundesregierung spart bei Menschen, die sowieso kein Geld haben.","zh":"联邦政府在本来就没钱的人身上省钱。","start":218.77,"end":223.05},{"de":"Tino Chrupalla ist von der Partei AfD.","zh":"蒂诺·克鲁帕拉来自德国选择党。","start":223.76,"end":226.4},{"de":"Er sagt: Die Bundesregierung macht viel zu viele Schulden.","zh":"他说：联邦政府借的债实在太多了。","start":226.88,"end":230.96},{"de":"Wir werden gegen die Regierung klagen.","zh":"我们将起诉政府。","start":231.48,"end":234.12},{"de":"Der Bundestag stimmt diese Woche über die Pläne ab.","zh":"联邦议院本周将对这些计划进行表决。","start":234.76,"end":238.92},{"de":"Und nun zur nächsten Nachricht:","zh":"现在来看下一条新闻：","start":240.57,"end":242.93},{"de":"Es passiert immer wieder.","zh":"这种事反复发生。","start":248.01,"end":250.41},{"de":"Medikamente fehlen in der Apotheke.","zh":"药房里缺药。","start":250.61,"end":253.61},{"de":"Die meisten Medikamente kommen nämlich aus dem Ausland.","zh":"因为大多数药品来自国外。","start":254.09,"end":258.81},{"de":"Zum Beispiel aus Asien.","zh":"比如来自亚洲。","start":259.13,"end":261.25},{"de":"Die Medikamente können manchmal nicht geliefert werden.","zh":"这些药品有时无法送达。","start":261.48,"end":265.32},{"de":"Kranke Menschen haben dann Sorgen.","zh":"患病的人因此感到担忧。","start":265.6,"end":268.04},{"de":"Die EU will jetzt helfen.","zh":"欧盟现在想提供帮助。","start":268.92,"end":270.72},{"de":"Das EU-Parlament hat dafür ein Gesetz beschlossen.","zh":"欧洲议会为此通过了一项法律。","start":271.44,"end":274.96},{"de":"Mehr Medikamente sollen in Europa gekauft werden.","zh":"今后应更多地从欧洲采购药品。","start":275.76,"end":279.2},{"de":"Und es soll einfacher werden, Medikamente in Europa herzustellen.","zh":"并且在欧洲生产药品应该变得更容易。","start":280.32,"end":284.88},{"de":"Und nun zur nächsten Nachricht:","zh":"现在来看下一条新闻：","start":289.08,"end":291.28},{"de":"Auf dem Foto ist ein Lager für Atommüll.","zh":"照片上是一个核废料储存库。","start":296.05,"end":300.69},{"de":"Es ist in Finnland, im Norden von Europa.","zh":"它在芬兰，在欧洲北部。","start":300.89,"end":304.37},{"de":"Es ist tief unten in der Erde.","zh":"它在地下很深处。","start":304.41,"end":307.29},{"de":"Atommüll ist nämlich sehr gefährlich.","zh":"核废料非常危险。","start":307.48,"end":310.12},{"de":"Er sendet unsichtbare Strahlen aus.","zh":"它会发出看不见的射线。","start":310.48,"end":313.0},{"de":"Sie sind sehr stark und können Menschen, Tiere und Pflanzen krank machen.","zh":"这些射线非常强，会让人、动物和植物生病。","start":313.72,"end":320.37},{"de":"Ein Lager für Atommüll muss deshalb sehr sicher sein.","zh":"因此核废料存放库必须非常安全。","start":320.41,"end":325.53},{"de":"Es dürfen keine Strahlen nach außen kommen.","zh":"不能有任何射线泄漏到外面。","start":325.6,"end":328.6},{"de":"Atommüll kommt aus Atomkraftwerken.","zh":"核废料来自核电站。","start":328.84,"end":332.0},{"de":"Viele Länder haben Atomkraftwerke oder hatten früher welche, wie Deutschland.","zh":"许多国家拥有核电站，或者过去曾有过，比如德国。","start":333.04,"end":339.08},{"de":"Diese Länder müssen deshalb Lager für Atommüll bauen.","zh":"这些国家因此必须建造核废料存放库。","start":340.2,"end":343.92},{"de":"Das Lager in Finnland ist das erste auf der Welt.","zh":"芬兰的这个存放库是世界上第一个。","start":344.72,"end":348.16},{"de":"Dazu zeigen wir jetzt einen Film.","zh":"为此我们现在播放一段影片。","start":349.48,"end":351.84},{"de":"So sieht das Endlager für Atommüll von außen aus.","zh":"这是核废料最终存放库外面的样子。","start":353.36,"end":356.8},{"de":"Es steht im Westen von Finnland.","zh":"它位于芬兰西部。","start":358.0,"end":360.28},{"de":"Die Menschen in der Nachbarschaft haben keine Angst.","zh":"附近的人们并不害怕。","start":360.4,"end":363.92},{"de":"Diese Frau sagt: Ich bin stolz.","zh":"这位女士说：我很自豪。","start":364.0,"end":366.2},{"de":"Finnland ist das erste Land mit einem Endlager.","zh":"芬兰是第一个拥有最终存放库的国家。","start":366.48,"end":369.76},{"de":"Das ist gut.","zh":"这很好。","start":369.92,"end":370.92},{"de":"Und dieser Mann sagt:","zh":"这位男士说：","start":371.92,"end":373.44},{"de":"Der Müll aus den Atomkraftwerken muss ja irgendwo hin.","zh":"核电站的废料总得放到某个地方去。","start":373.56,"end":377.36},{"de":"In diesen Rohren soll der Müll unter der Erde gelagert werden.","zh":"废料将存放在地下这些管道里。","start":378.57,"end":384.13},{"de":"Wann es losgeht, ist aber unklar.","zh":"但何时开始还不清楚。","start":384.28,"end":386.64},{"de":"Der Chef von dem Endlager sagt:","zh":"最终存放库的负责人说：","start":387.88,"end":390.08},{"de":"Wir sind mit der Planung noch nicht ganz fertig.","zh":"我们的规划还没有完全完成。","start":390.12,"end":393.96},{"de":"So sieht das Endlager unter der Erde aus.","zh":"这是地下最终存放库的样子。","start":395.16,"end":398.0},{"de":"Es gibt viele Gänge und viel Platz für Rohre mit Atommüll.","zh":"有许多通道和许多放置核废料管道的空间。","start":398.84,"end":402.92},{"de":"Die Wände sind aus Stein und sehr fest.","zh":"墙壁是石头做的，非常坚固。","start":404.84,"end":408.6},{"de":"Dieser Mann sagt:","zh":"这位男士说：","start":409.72,"end":410.92},{"de":"Wenn das Lager irgendwann voll ist, dann schütten wir Beton in die Gänge.","zh":"如果存放库将来装满了，我们就往通道里灌混凝土。","start":410.96,"end":416.16},{"de":"Der Atommüll ist dann unter der Erde eingeschlossen.","zh":"这样核废料就被封闭在地下。","start":417.32,"end":420.96},{"de":"In das Endlager darf nur Atommüll aus Finnland.","zh":"只有芬兰的核废料可以放进这个最终存放库。","start":422.12,"end":425.4},{"de":"Er soll mindestens 100.000 Jahre unter der Erde bleiben.","zh":"它应该在地下存放至少10万年。","start":427.52,"end":432.48},{"de":"Und nun zur nächsten Nachricht:","zh":"现在来看下一条新闻：","start":434.6,"end":436.8},{"de":"Auf dem Foto sind drei Raumfahrer.","zh":"照片上是三名航天员。","start":440.81,"end":443.89},{"de":"Sie sind mit einer Rakete aus China zur Raumstation Tiangong geflogen.","zh":"他们乘坐中国的火箭飞往天宫空间站。","start":444.04,"end":449.36},{"de":"Sie ist im All und fliegt um die Erde.","zh":"空间站在太空中绕地球飞行。","start":450.05,"end":453.05},{"de":"Dazu kommt ein kurzer Film.","zh":"接下来播放一段短片。","start":453.52,"end":455.44},{"de":"Hier sind die drei Raumfahrer vor dem Start.","zh":"这是发射前的三名航天员。","start":456.68,"end":459.76},{"de":"Zwei sind aus China, einer aus Pakistan.","zh":"两名来自中国，一名来自巴基斯坦。","start":460.04,"end":463.2},{"de":"Die Rakete ist in der Wüste Gobi in China gestartet.","zh":"火箭是从中国的戈壁沙漠发射的。","start":463.28,"end":467.52},{"de":"Der Flug ins All hat vier Stunden gedauert.","zh":"飞往太空用了四个小时。","start":468.73,"end":471.73},{"de":"Hier kommen die Raumfahrer in der Raumstation an.","zh":"这里是航天员到达空间站。","start":472.41,"end":476.85},{"de":"China gibt gerade viel Geld für Raketen aus.","zh":"中国目前正在为火箭投入大量资金。","start":478.09,"end":481.81},{"de":"China möchte nämlich im All so wichtig werden wie die USA.","zh":"因为中国想在太空中变得像美国一样重要。","start":482.49,"end":487.33},{"de":"Und das waren unsere Nachrichten.","zh":"以上是我们的新闻。","start":489.04,"end":491.4},{"de":"tagesschau in Einfacher Sprache auf WhatsApp.","zh":"简易语言新闻在WhatsApp上。","start":492.68,"end":496.44},{"de":"Und jetzt kommt das Wetter.","zh":"现在播报天气。","start":515.53,"end":517.69},{"de":"Es gibt viele Wolken und nur wenig Sonne.","zh":"云很多，阳光很少。","start":519.12,"end":522.36},{"de":"Es ist sehr windig.","zh":"风很大。","start":522.61,"end":524.21},{"de":"Ganz unten im Süden schneit es auch.","zh":"在最南边还会下雪。","start":524.89,"end":527.45},{"de":"Das war die tagesschau in Einfacher Sprache.","zh":"以上就是简易语言新闻。","start":533.29,"end":536.81},{"de":"Tschüss.","zh":"再见。","start":537.16,"end":538.32},{"de":"Bis zum nächsten Mal."
