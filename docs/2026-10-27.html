    <script id="dd-data" type="application/json">{"page":"lesson","lesson":{"slug":"2026-10-27","date":"2026-10-27","show":"tagesschau in Einfacher Sprache","level":"A2–B1","kind":"broadcast","note":"","source_url":"https://www.tagesschau.de/tagesschau_in_einfacher_sprache/tse-1486.html","video":{"mp4":"https://tagesschau-progressive.ard-mcdn.de/video/2026/1027/TV-20261027-1732-5200.webl.h264.mp4","embed":"","page":"https://www.tagesschau.de/tagesschau_in_einfacher_sprache/video-1673552.html"},"duration":503.55,"sentences":[{"de":"Willkommen zur tagesschau in Einfacher Sprache.","zh":"欢迎收看《简单语言新闻》。","start":10.75,"end":13.95},{"de":"Ich bin Michael Pavlitz und das sind unsere Nachrichten.","zh":"我是Michael Pavlitz，以下是我们的新闻。","start":13.99,"end":18.47},{"de":"Und nun zur ersten Nachricht.","zh":"现在来看第一条新闻。","start":38.04,"end":40.4},{"de":"In dem Land Israel wählen die Menschen ein neues Parlament.","zh":"在以色列，人们正在选举新的议会。","start":44.03,"end":48.51},{"de":"Das Parlament wählt dann den neuen Chef von der Regierung.","zh":"议会随后将选出新的政府首脑。","start":49.67,"end":53.75},{"de":"Viele Menschen machen bei der Wahl mit, so wie die Frau auf dem Foto.","zh":"许多人参加投票，就像照片上的这位女士一样。","start":54.75,"end":60.15},{"de":"Der Chef von der Regierung in Israel ist seit vielen Jahren Benjamin Netanjahu.","zh":"多年来，以色列的政府首脑一直是本雅明·内塔尼亚胡。","start":61.31,"end":67.75},{"de":"Er hat in den letzten Jahren viele Kriege geführt.","zh":"过去几年里，他发动了许多战争。","start":67.79,"end":72.47},{"de":"Netanjahu ist von der Partei Likud.","zh":"内塔尼亚胡来自利库德集团。","start":73.0,"end":75.76},{"de":"Er sagt: Ich kann Israel vor den Feinden beschützen.","zh":"他说：我能保护以色列不受敌人侵害。","start":77.56,"end":81.76},{"de":"Manche Menschen sagen aber: Wir brauchen keinen Krieg mehr.","zh":"但也有人说：我们不再需要战争。","start":82.88,"end":87.44},{"de":"Wir wollen einen neuen Chef von der Regierung.","zh":"我们想要一位新的政府首脑。","start":87.91,"end":91.15},{"de":"Wer könnte dieser neue Chef sein?","zh":"这位新首脑会是谁呢？","start":91.83,"end":94.47},{"de":"Dazu zeigen wir einen Film.","zh":"为此我们播放一段影片。","start":95.07,"end":97.15},{"de":"Am Flughafen in der Stadt Tel Aviv sind gerade viele Menschen.","zh":"特拉维夫市的机场里现在有很多人。","start":98.31,"end":102.07},{"de":"Sie kommen, um bei der Wahl ihre Stimme abzugeben.","zh":"他们来这里投票。","start":102.11,"end":105.63},{"de":"Im Ausland geht das nämlich nicht.","zh":"因为在国外是无法投票的。","start":105.79,"end":108.23},{"de":"Im Flughafen machen viele Parteien Werbung für die Wahl.","zh":"机场里，许多政党在为选举做宣传。","start":108.63,"end":112.55},{"de":"Diese Frau ist aus Israel, lebt aber in den USA.","zh":"这位女士来自以色列，但生活在美国。","start":113.16,"end":116.04},{"de":"Sie sagt: Ich hoffe, wir bekommen eine neue Regierung.","zh":"她说：我希望我们能有一个新政府。","start":116.08,"end":119.32},{"de":"Ich will ein Ende vom Krieg.","zh":"我希望战争结束。","start":119.36,"end":121.04},{"de":"Sie will Gadi Eisenkot wählen.","zh":"她想选加迪·艾森科特。","start":121.16,"end":123.32},{"de":"Er ist der Konkurrent von Netanjahu und will der neue Chef von der Regierung in Israel werden.","zh":"他是内塔尼亚胡的竞争对手，想成为以色列新的政府首脑。","start":123.63,"end":129.39},{"de":"Die Umfragen vor der Wahl waren knapp.","zh":"选前的民调结果非常接近。","start":129.51,"end":132.47},{"de":"Entweder gewinnt Eisenkot oder wieder Netanjahu.","zh":"要么艾森科特获胜，要么内塔尼亚胡再次获胜。","start":132.88,"end":136.48},{"de":"Netanjahu ist schon viele Jahre Chef von der Regierung.","zh":"内塔尼亚胡已经担任政府首脑很多年了。","start":138.92,"end":142.88},{"de":"Er sagt: Unsere Gegner wollen unseren Staat verändern.","zh":"他说：我们的对手想改变我们的国家。","start":142.95,"end":147.19},{"de":"Bei dieser Wahl geht es um Sicherheit für die Menschen und unsere Zukunft.","zh":"这次选举关系到人民的安全和我们的未来。","start":147.56,"end":152.6},{"de":"Das sieht auch dieser Mann so.","zh":"这位男士也是这样认为的。","start":153.72,"end":155.72},{"de":"Er heißt Odet und wohnt an der Grenze zum Gazastreifen.","zh":"他叫Odet，住在加沙地带边界附近。","start":155.79,"end":159.47},{"de":"Er möchte Frieden zwischen den Menschen aus Israel und den Palästinensern aus dem Gazastreifen.","zh":"他希望以色列人和加沙地带的巴勒斯坦人之间能够和平。","start":159.51,"end":165.59},{"de":"Seit dem Überfall von Terroristen aus dem Gazastreifen gibt es hier nämlich Krieg.","zh":"自从加沙地带的恐怖分子发动袭击以来，这里一直在打仗。","start":166.36,"end":171.87},{"de":"Der nächste Chef von der Regierung in Israel wird entscheiden, geht der Krieg weiter oder nicht.","zh":"以色列下一任政府首脑将决定战争是否继续。","start":172.52,"end":178.79},{"de":"Und nun zur nächsten Nachricht.","zh":"现在来看下一条新闻。","start":179.99,"end":182.51},{"de":"In der Ukraine ist seit mehr als vier Jahren Krieg.","zh":"乌克兰的战争已经持续了四年多。","start":187.67,"end":191.75},{"de":"Russland hat das Land angegriffen.","zh":"俄罗斯攻击了这个国家。","start":191.92,"end":194.44},{"de":"In vielen Orten in der Ukraine gibt es Kämpfe.","zh":"乌克兰许多地方都在发生战斗。","start":194.51,"end":198.31},{"de":"Auch rund um die Stadt Oleschky.","zh":"奥莱什基市周围也是一样。","start":198.67,"end":201.15},{"de":"Viele Häuser sind zerstört.","zh":"许多房屋被毁。","start":201.71,"end":203.71},{"de":"So wie auf diesem Foto.","zh":"就像这张照片上的一样。","start":203.95,"end":205.83},{"de":"Die meisten Menschen haben die Stadt schon verlassen.","zh":"大多数人已经离开了这座城市。","start":206.51,"end":210.07},{"de":"Aber es sind auch noch ungefähr 2000 Menschen in Oleschky.","zh":"但奥莱什基还有大约2000人。","start":210.11,"end":214.83},{"de":"Jetzt gibt es eine Kriegspause für die Stadt.","zh":"现在，这座城市有了一个战争暂停期。","start":215.55,"end":218.67},{"de":"Die Menschen können raus aus Oleschky.","zh":"人们可以离开奥莱什基。","start":219.24,"end":221.96},{"de":"Was denken die Menschen über die Kriegspause?","zh":"人们对这次停战怎么看呢？","start":222.72,"end":225.76},{"de":"Dazu zeigen wir jetzt einen Film.","zh":"为此我们现在播放一段影片。","start":226.4,"end":228.64},{"de":"Vitali ist mit seiner Familie aus Oleschky geflohen.","zh":"维塔利和他的家人逃离了奥莱什基。","start":230.31,"end":233.95},{"de":"Jetzt lebt er in der Nähe von Kiew.","zh":"他现在住在基辅附近。","start":234.15,"end":236.63},{"de":"Er will nicht erkannt werden.","zh":"他不想被认出来。","start":236.67,"end":238.75},{"de":"Auf dem Handy zeigt er ein Foto von seiner Wohnung in Oleschky.","zh":"他在手机上展示了他在奥莱什基的公寓的照片。","start":238.83,"end":242.47},{"de":"Er sagt: Eine Drohne hat die Wohnung komplett zerstört.","zh":"他说：一架无人机把这间公寓完全炸毁了。","start":242.51,"end":245.91},{"de":"Auch viele andere Häuser in Oleschky sind zerstört.","zh":"奥莱什基许多其他房屋也被毁了。","start":246.8,"end":249.92},{"de":"Russland hat die Stadt seit mehr als vier Jahren besetzt.","zh":"俄罗斯占领这座城市已经四年多了。","start":250.4,"end":253.88},{"de":"Das heißt: Russische Soldaten kontrollieren Oleschky.","zh":"也就是说：俄罗斯士兵控制着奥莱什基。","start":254.2,"end":258.12},{"de":"Die Menschen, die hier noch leben, haben wenig zu essen und kaum Medizin.","zh":"仍然住在这里的人食物很少，几乎没有药品。","start":258.28,"end":263.6},{"de":"Vitali und seine Familie sagen:","zh":"维塔利和他的家人说：","start":263.96,"end":266.08},{"de":"Wir hatten kaum Lebensmittel.","zh":"我们几乎没有食品。","start":266.12,"end":268.04},{"de":"Wir wussten: Entweder fliehen wir aus Oleschky oder wir verhungern.","zh":"我们知道：要么逃离奥莱什基，要么挨饿。","start":268.11,"end":273.11},{"de":"Die USA haben mit der Ukraine und Russland gesprochen und die Kriegspause vereinbart.","zh":"美国与乌克兰和俄罗斯进行了会谈，达成了这次战争暂停。","start":273.76,"end":279.47},{"de":"Jetzt können noch mehr Menschen die Stadt verlassen und sich in Sicherheit vor dem Krieg bringen.","zh":"现在可以有更多人离开这座城市，躲避战争、确保安全。","start":280.35,"end":287.07},{"de":"Und nun zur nächsten Nachricht.","zh":"现在来看下一条新闻。","start":287.48,"end":289.8},{"de":"In Deutschland gab es viele Jahre Atomkraftwerke.","zh":"德国曾经有很多年的核电站。","start":294.07,"end":297.51},{"de":"Dort wurde Strom produziert.","zh":"那里生产电力。","start":298.23,"end":300.27},{"de":"2023 wurde das letzte Atomkraftwerk abgeschaltet.","zh":"2023年，最后一座核电站被关闭。","start":301.67,"end":306.51},{"de":"Zurück bleibt strahlender Müll.","zh":"留下的是放射性废料。","start":307.23,"end":309.79},{"de":"Das bedeutet:","zh":"意思是：","start":310.0,"end":311.08},{"de":"Der Müll ist sehr gefährlich für die Menschen und für die Natur.","zh":"这些废料对人和自然都非常危险。","start":311.6,"end":315.96},{"de":"Er ist zurzeit in Behältern, so wie auf dem Foto.","zh":"目前它们被存放在容器里，就像照片上那样。","start":316.87,"end":321.07},{"de":"Die Behörden suchen nach einem Ort für den Müll aus den Atomkraftwerken.","zh":"政府部门正在为核电站的废料寻找一个存放地点。","start":322.11,"end":327.11},{"de":"Diesen Ort nennt man Atommüllendlager.","zh":"这个地点叫做核废料最终处置库。","start":327.6,"end":330.24},{"de":"Nun steht fest:","zh":"现在已经确定：","start":332.27,"end":333.91},{"de":"Das Endlager wird nicht in Rheinland-Pfalz, Hessen, Berlin, Sachsen oder im Saarland oder in Hamburg sein.","zh":"最终处置库不会建在莱茵兰-普法尔茨州、黑森州、柏林、萨克森州、萨尔州或汉堡。","start":334.12,"end":345.0},{"de":"Die Behörden sagen:","zh":"政府部门说：","start":346.08,"end":347.56},{"de":"Nur ein sehr kleiner Teil von Deutschland ist geeignet für das Atommüllendlager.","zh":"德国只有很小一部分地区适合建核废料最终处置库。","start":348.11,"end":354.0},{"de":"Wo das Endlager sein wird, soll bis 2050 feststehen.","zh":"最终处置库的位置应在2050年前确定。","start":355.48,"end":359.48},{"de":"Und nun zur nächsten Nachricht.","zh":"现在来看下一条新闻。","start":365.16,"end":367.68},{"de":"Jedes Jahr gibt es eine Wahl.","zh":"每年都有一次评选。","start":374.0,"end":376.4},{"de":"Wer ist der beste Fußballspieler der Welt?","zh":"谁是世界上最好的足球运动员？","start":376.95,"end":380.71},{"de":"Wer die Wahl gewinnt, bekommt einen Preis.","zh":"赢得评选的人会获得一个奖项。","start":381.47,"end":385.27},{"de":"Den Ballon d'Or.","zh":"就是金球奖。","start":385.95,"end":387.59},{"de":"Das ist französisch und heißt: goldener Ball.","zh":"这是法语，意思是：金色的球。","start":388.15,"end":392.71},{"de":"Auf dem Foto ist Harry Kane.","zh":"照片上是哈里·凯恩。","start":393.59,"end":395.95},{"de":"Er hat den Ballon d'Or in diesem Jahr gewonnen.","zh":"他今年赢得了金球奖。","start":396.35,"end":400.79},{"de":"Kane kommt aus England und spielt für den deutschen Verein Bayern München.","zh":"凯恩来自英格兰，效力于德国俱乐部拜仁慕尼黑。","start":401.43,"end":406.95},{"de":"Wir zeigen jetzt einen Film über Harry Kane.","zh":"我们现在播放一段关于哈里·凯恩的影片。","start":407.55,"end":410.99},{"de":"Hier kommt Harry Kane zur Preisverleihung in London.","zh":"这里是哈里·凯恩来到伦敦的颁奖典礼。","start":412.6,"end":415.92},{"de":"Viele Journalisten und Fans beobachten den Stürmer.","zh":"许多记者和球迷在关注这位前锋。","start":416.4,"end":420.24},{"de":"Kurz danach bekommt er den Ballon d'Or.","zh":"shortly之后，他获得了金球奖。","start":421.07,"end":423.79},{"de":"Kane ist 33 Jahre alt.","zh":"凯恩33岁。","start":424.55,"end":426.35},{"de":"Für ihn ist es die wichtigste Auszeichnung seiner Karriere.","zh":"对他来说，这是他职业生涯中最重要的奖项。","start":426.63,"end":430.79},{"de":"Wer den Ballon d'Or gewinnt, entscheiden 100 Journalisten aus 100 Ländern.","zh":"谁赢得金球奖，由来自100个国家的100名记者决定。","start":430.91,"end":436.15},{"de":"Sie wählen den besten Fußballspieler einer Saison.","zh":"他们评选出一个赛季中最好的足球运动员。","start":436.35,"end":439.79},{"de":"Die Journalisten haben den Franzosen Kylian Mbappe knapp auf Platz zwei gewählt.","zh":"记者们把法国人基利安·姆巴佩评在第二名，差距很小。","start":439.83,"end":444.75},{"de":"Auf Platz drei landete Weltmeister Lamine Jamal aus Spanien.","zh":"第三名是来自西班牙的世界冠军拉米内·亚马尔。","start":445.31,"end":449.31},{"de":"Kane hat den Ballon d'Or kurz gefeiert und ist dann wieder nach München geflogen.","zh":"凯恩短暂庆祝了金球奖，然后又飞回了慕尼黑。","start":450.28,"end":455.27},{"de":"Am Mittwoch hat er das nächste Spiel.","zh":"周三他还有下一场比赛。","start":455.31,"end":457.95},{"de":"Und das waren unsere Nachrichten.","zh":"以上是我们的新闻。","start":459.07,"end":461.75},{"de":"Und jetzt kommt das Wetter.","zh":"现在来看天气。","start":478.03,"end":479.95},{"de":"Rechts im Osten und unten im Süden gibt es erst dichte Wolken, dann Regen.","zh":"右边的东部和下面的南部先是浓云，然后有雨。","start":480.96,"end":487.07},{"de":"Sonst scheint oft die Sonne.","zh":"其他地方经常出太阳。","start":487.11,"end":489.11},{"de":"Oben an der Nordseeküste regnet es abends.","zh":"上方的北海海岸傍晚有雨。","start":489.51,"end":493.03},{"de":"Es werden 9 bis 16 Grad.","zh":"气温是9到16度。","start":493.51,"end":496.51},{"de":"Das war die tagesschau in Einfacher Sprache.","zh":"以上是简单语言版每日新闻。","start":497.63,"end":500.95},{"de":"Tschüss, bis zum nächsten Mal.","zh":"再见，下次见。","start":501.39,"end":503.55}],"stories":[{"title":"Willkommen zur tagesschau in Einfacher Sprache","title_zh":"
