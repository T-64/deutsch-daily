    <script id="dd-data" type="application/json">{"page":"lesson","lesson":{"slug":"2026-10-15","date":"2026-10-15","show":"tagesschau in Einfacher Sprache","level":"A2–B1","kind":"reading","note":"这期的逐句中文还在生成中；先用原声和字幕跟练，点词可查义。","source_url":"https://www.tagesschau.de/tagesschau_in_einfacher_sprache/tse-1468.html","video":{"mp4":"https://tagesschau-progressive.ard-mcdn.de/video/2026/1015/TV-20261015-1733-3600.webl.h264.mp4","embed":"","page":"https://www.tagesschau.de/tagesschau_in_einfacher_sprache/video-1666824.html"},"duration":540.6,"sentences":[{"de":"Willkommen zur tagesschau in Einfacher Sprache.","zh":"","start":10.64,"end":13.88},{"de":"Ich bin Michael Paweletz und das sind unsere Nachrichten.","zh":"","start":14.1,"end":18.1},{"de":"Und nun zur ersten Nachricht.","zh":"","start":37.44,"end":39.52},{"de":"Wenn sich Menschen verletzen oder wenn sie krank sind, dann rufen sie oft den Rettungsdienst oder fahren zur Notaufnahme.","zh":"","start":46.88,"end":57.06},{"de":"Das ist eine Station im Krankenhaus für Notfälle, wie auf dem Foto.","zh":"","start":58.4,"end":63.8},{"de":"Einige Menschen machen das auch ohne Notfall.","zh":"","start":65.82,"end":70.18},{"de":"Sie wissen nämlich nicht, zu welchem Arzt soll ich gehen.","zh":"","start":70.62,"end":75.78},{"de":"Die Notaufnahmen in Deutschland sind deshalb sehr voll.","zh":"","start":76.9,"end":80.94},{"de":"Viele Menschen müssen dann lange warten.","zh":"","start":81.42,"end":84.42},{"de":"Und die Rettungsdienste haben viel zu tun.","zh":"","start":85.16,"end":88.08},{"de":"Der Bundestag hat jetzt aber neue Regeln beschlossen.","zh":"","start":90.06,"end":94.22},{"de":"Es soll in Krankenhäusern Notfallzentren geben.","zh":"","start":94.62,"end":99.58},{"de":"Dort wird dann entschieden, soll jemand zur Notaufnahme oder zu einem anderen Arzt gehen.","zh":"","start":100.58,"end":107.08},{"de":"Dazu kommt jetzt ein Film.","zh":"","start":108.98,"end":111.1},{"de":"Dieses Krankenhaus in Hamburg hat schon ein Notfallzentrum.","zh":"","start":112.14,"end":116.98},{"de":"Wenn Menschen Hilfe brauchen, dann können sie sich hier melden.","zh":"","start":117.42,"end":121.86},{"de":"Die Mitarbeiter prüfen dann, ist es ein Notfall?","zh":"","start":121.9,"end":125.78},{"de":"Welcher Arzt kann helfen?","zh":"","start":126.22,"end":128.06},{"de":"Dieser Chef von den Ärzten im Krankenhaus sagt, es gibt jetzt viel weniger Menschen in der Notaufnahme.","zh":"","start":128.74,"end":136.62},{"de":"Wir haben mehr Zeit für die Notfälle.","zh":"","start":137.02,"end":140.22},{"de":"Und es gibt auch eine Praxis mit Hausärzten.","zh":"","start":141.22,"end":145.54},{"de":"Dort bekommen die Menschen ohne Notfälle Hilfe.","zh":"","start":145.78,"end":149.54},{"de":"Der Bundestag hat jetzt entschieden, es soll die Notfallzentren in ganz Deutschland geben.","zh":"","start":150.58,"end":157.5},{"de":"Und wenn Menschen per Telefon Notfälle melden, wird genauer geprüft, wo können sie behandelt werden.","zh":"","start":158.14,"end":165.7},{"de":"Der Minister für Gesundheit ist Carsten Linnemann.","zh":"","start":166.46,"end":170.54},{"de":"Er sagt, mit den neuen Regeln ist immer klar, wer bekommt wo Hilfe.","zh":"","start":170.7,"end":176.94},{"de":"Aber einige im Bundestag haben Zweifel an den Regeln.","zh":"","start":178.42,"end":183.46},{"de":"Dieser Politiker ist von den Grünen.","zh":"","start":183.7,"end":186.66},{"de":"Er sagt, wenn die Menschen weniger in die Notaufnahme gehen sollen, dann brauchen wir mehr Termine bei anderen Ärzten.","zh":"","start":187.06,"end":196.46},{"de":"Aber oft gibt es keine Termine.","zh":"","start":196.5,"end":199.58},{"de":"Mit den neuen Regeln sollen Krankenhäuser, andere Ärzte und Rettungsdienste besser zusammenarbeiten.","zh":"","start":201.48,"end":209.3},{"de":"Nun zur nächsten Nachricht.","zh":"","start":211.08,"end":213.16},{"de":"EU ist das kurze Wort für Europäische Union.","zh":"","start":217.74,"end":222.7},{"de":"Die EU ist eine Gruppe von Ländern in Europa.","zh":"","start":222.74,"end":227.22},{"de":"Auch Deutschland gehört dazu.","zh":"","start":227.9,"end":229.98},{"de":"Sie arbeiten in der Politik und der Wirtschaft zusammen.","zh":"","start":230.42,"end":234.5},{"de":"Jetzt gibt es wieder ein Treffen von den Chefs von den Ländern.","zh":"","start":235.34,"end":239.78},{"de":"Einige sind auf dem Foto.","zh":"","start":240.02,"end":242.1},{"de":"Sie sprechen auch über den Haushalt für mehrere Jahre.","zh":"","start":242.9,"end":247.3},{"de":"Der Haushalt ist das Geld von der EU.","zh":"","start":247.34,"end":251.38},{"de":"Es kommt von den Ländern.","zh":"","start":251.82,"end":253.62},{"de":"Und der Haushalt regelt, wofür wird das Geld ausgegeben.","zh":"","start":254.06,"end":259.1},{"de":"Es gibt aber Streit über den Haushalt.","zh":"","start":260.02,"end":263.06},{"de":"Die EU will ihn schnell festlegen.","zh":"","start":263.42,"end":266.34},{"de":"Manche Länder wollen aber noch warten.","zh":"","start":266.62,"end":269.34},{"de":"Und einige Länder wie Deutschland sagen, der Vorschlag für den Haushalt ist zu hoch.","zh":"","start":269.38,"end":277.58},{"de":"Dazu kommt ein Film.","zh":"","start":277.98,"end":279.86},{"de":"Bundeskanzler Merz sagt, die Verhandlungen über das Geld sind schwierig.","zh":"","start":280.94,"end":286.34},{"de":"Der Vorschlag von der EU für den Haushalt ist zu hoch.","zh":"","start":286.86,"end":291.22},{"de":"Die Länder können sich das nicht leisten.","zh":"","start":291.62,"end":294.26},{"de":"Ich glaube nicht, dass wir uns bei diesem Treffen einigen.","zh":"","start":294.3,"end":299.18},{"de":"Wir beraten auch, welche Themen sind uns wichtig.","zh":"","start":299.5,"end":303.54},{"de":"Ich finde, vor allem die Wirtschaft und die Verteidigung sind wichtig.","zh":"","start":304.26,"end":309.18},{"de":"Da machen wir Fortschritte, aber wir müssen noch besser werden.","zh":"","start":309.54,"end":313.98},{"de":"Und nun zur nächsten Nachricht.","zh":"","start":314.22,"end":316.7},{"de":"An allen Bahnhöfen in Deutschland gilt jetzt, Alkohol ist verboten.","zh":"","start":321.6,"end":326.32},{"de":"D.h. man darf im Gebäude vom Bahnhof und auf den Bahnsteigen keinen Alkohol trinken.","zh":"","start":327.6,"end":334.44},{"de":"Außer z.B. in Restaurants.","zh":"","start":336.5,"end":339.1},{"de":"Das steht auf Schildern in den Bahnhöfen wie auf dem Foto.","zh":"","start":339.94,"end":344.7},{"de":"Die Bahn will damit die Bahnhöfe sauberer und sicherer machen.","zh":"","start":345.18,"end":350.06},{"de":"Bisher gab es das Verbot nur an manchen Bahnhöfen.","zh":"","start":350.26,"end":354.98},{"de":"Dazu kommt jetzt ein Film.","zh":"","start":355.46,"end":357.3},{"de":"Am Hauptbahnhof von Köln ist Alkohol schon länger verboten.","zh":"","start":359.06,"end":364.5},{"de":"Diese Schilder hängen dort seit April.","zh":"","start":364.9,"end":367.7},{"de":"Auch an anderen Bahnhöfen hat die Bahn das Verbot getestet.","zh":"","start":367.74,"end":372.86},{"de":"Das ist die Sprecherin von der Bahn.","zh":"","start":373.34,"end":375.94},{"de":"Sie sagt, an den Bahnhöfen mit dem Verbot gibt es weniger Streit, weniger Müll und die Menschen fühlen sich sicherer.","zh":"","start":376.1,"end":384.38},{"de":"In letzter Zeit gab es immer mehr Angriffe auf Mitarbeiter von der Bahn.","zh":"","start":384.42,"end":391.1},{"de":"Die Bahn sagt, auch deshalb ist Alkohol jetzt verboten.","zh":"","start":391.34,"end":395.78},{"de":"Viele Menschen finden das Verbot gut.","zh":"","start":396.26,"end":399.06},{"de":"Dieser Mann arbeitet für eine Firma mit Restaurants und Geschäften im Bahnhof.","zh":"","start":400.1,"end":406.18},{"de":"Er sagt, in manchen Geschäften kaufen die Menschen weniger Getränke.","zh":"","start":406.22,"end":413.18},{"de":"Dadurch verdienen die Geschäfte weniger.","zh":"","start":413.86,"end":416.3},{"de":"Aber die Mitarbeiter und die Gäste sind sicherer.","zh":"","start":416.34,"end":420.06},{"de":"Das ist am wichtigsten.","zh":"","start":420.42,"end":422.06},{"de":"Einige befürchten aber, wenn die Menschen nicht mehr im Bahnhof Alkohol trinken dürfen, dann machen sie es in den Straßen um den Bahnhof.","zh":"","start":423.54,"end":433.42},{"de":"Und nun zur nächsten Nachricht.","zh":"","start":434.38,"end":437.02},{"de":"Albanien ist ein Land, unten rechts im Südosten von Europa.","zh":"","start":441.1,"end":446.02},{"de":"Dort gibt es gerade heftige Proteste.","zh":"","start":446.62,"end":449.26},{"de":"Die Menschen sind nämlich unzufrieden mit der Regierung.","zh":"","start":449.62,"end":453.54},{"de":"Zuerst haben die Menschen gesagt, wir wollen bessere Bedingungen zum Studieren.","zh":"","start":454.1,"end":459.78},{"de":"Z.B. soll es günstiger werden.","zh":"","start":460.18,"end":462.74},{"de":"Jetzt sind die Proteste aber viel größer geworden.","zh":"","start":463.3,"end":466.82},{"de":"Viele Menschen fordern den Rücktritt vom Chef der Regierung.","zh":"","start":467.66,"end":471.86},{"de":"Dazu kommt ein Film.","zh":"","start":472.38,"end":473.94},{"de":"Bei den Protesten gibt es Gewalt.","zh":"","start":475.1,"end":477.46},{"de":"Einige Menschen werfen brennende Gegenstände und Steine auch vor dem Parlament.","zh":"","start":477.78,"end":484.22},{"de":"Die Polizei setzt Gas ein.","zh":"","start":484.26,"end":487.7},{"de":"Es reizt die Augen.","zh":"","start":488.02,"end":489.38},{"de":"Die Proteste und die Gewalt dauern schon zwei Tage.","zh":"","start":489.86,"end":494.02},{"de":"Und das waren unsere Nachrichten.","zh":"","start":495.86,"end":498.22},{"de":"Bundestag.","zh":"","start":498.86,"end":499.86},{"de":"Und jetzt kommt das Wetter.","zh":"","start":515.1,"end":517.58},{"de":"Zuerst Nebel unten im Süden und in der Mitte.","zh":"","start":518.74,"end":522.58},{"de":"Danach sonniges Herbstwetter.","zh":"","start":522.9,"end":524.98},{"de":"Oben links im Nordwesten mehr Wolken und gegen Abend Regen.","zh":"","start":525.78,"end":530.54},{"de":"Es werden 11 bis 24 Grad.","zh":"","start":530.78,"end":533.9},{"de":"Das war die tagesschau in Einfacher Sprache.","zh":"","start":534.68,"end":537.76},{"de":"Tschüss, bis zum nächsten Mal.","zh":"","start":538.44,"end":540.6}],"stories":[{"title":"Die Sendung","title_zh":"急诊室的新规定 · 关于欧盟预算的争执 · 火车站禁酒","from":0,"to":98,"vocab":[{"key":"notaufnahme","lemma":"die Notaufnahme, -n","pos":"Substantiv","zh":"急诊室","example_de":"Wenn sich Menschen verletzen oder wenn sie krank sind, dann rufen sie oft den Rettungsdienst oder fahren zur Notaufnahme.","example_zh":""},{"key":"warten","lemma":"warten","pos":"Verb","zh":"等待","example_de":"Viele Menschen müssen dann lange warten.","example_zh":""},{"key":"beschliessen","lemma":"beschließen","pos":"Verb","zh":"决定、通过","example_de":"Der Bundestag hat jetzt aber neue Regeln beschlossen.","example_zh":""},{"key":"krankenhaus","lemma":"das Krankenhaus, ¨-er","pos":"Substantiv","zh":"医院","example_de":"Das ist eine Station im Krankenhaus für Notfälle, wie auf dem Foto.","example_zh":""},{"key":"zusammenarbeiten","lemma":"zusammenarbeiten","pos":"Verb","zh":"合作","example_de":"Mit den neuen Regeln sollen Krankenhäuser, andere Ärzte und Rettungsdienste besser zusammenarbeiten.","example_zh":""},{"key":"haushalt","lemma":"der Haushalt, -e","pos":"Substantiv","zh":"预算","example_de":"Sie sprechen auch über den Haushalt für mehrere Jahre.","example_zh":""},{"key":"treffen","lemma":"das Treffen, -","pos":"Substantiv","zh":"会面、会议","example_de":"Jetzt gibt es wieder ein Treffen von den Chefs von den Ländern.","example_zh":""},{"key":"ausgeben","lemma":"ausgeben","pos":"Verb","zh":"花费、支出","example_de":"Und der Haushalt regelt, wofür wird das Geld ausgegeben.","example_zh":""},{"key":"vorschlag","lemma":"der Vorschlag, ¨-e","pos":"Substantiv","zh":"提案、建议","example_de":"Und einige Länder wie Deutschland sagen, der Vorschlag für den Haushalt ist zu hoch.","example_zh":""},{"key":"bahnhof","lemma":"der Bahnhof, ¨-e","pos":"Substantiv","zh":"火车站","example_de":"An allen Bahnhöfen in Deutschland gilt jetzt,
