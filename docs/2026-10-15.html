    <div id="root"></div>
    <script id="dd-data" type="application/json">{"page":"lesson","lesson":{"slug":"2026-10-15","date":"2026-10-15","show":"tagesschau in Einfacher Sprache","level":"A2–B1","kind":"broadcast","note":"","source_url":"https://www.tagesschau.de/tagesschau_in_einfacher_sprache/tse-1468.html","video":{"mp4":"https://tagesschau-progressive.ard-mcdn.de/video/2026/1015/TV-20261015-1733-3600.webl.h264.mp4","embed":"","page":"https://www.tagesschau.de/tagesschau_in_einfacher_sprache/video-1666824.html"},"duration":540.6,"sentences":[{"de":"Willkommen zur tagesschau in Einfacher Sprache.","zh":"欢迎收看简单语言版每日新闻。","start":10.64,"end":13.88},{"de":"Ich bin Michael Paweletz und das sind unsere Nachrichten.","zh":"我是米夏埃尔·帕韦莱茨，以下是我们的新闻。","start":14.1,"end":18.1},{"de":"Und nun zur ersten Nachricht.","zh":"现在来看第一条新闻。","start":37.44,"end":39.52},{"de":"Wenn sich Menschen verletzen oder wenn sie krank sind, dann rufen sie oft den Rettungsdienst oder fahren zur Notaufnahme.","zh":"当人们受伤或生病时，他们通常会呼叫急救服务或前往急诊室。","start":46.88,"end":57.06},{"de":"Das ist eine Station im Krankenhaus für Notfälle, wie auf dem Foto.","zh":"急诊室是医院里处理紧急情况的部门，就像照片上那样。","start":58.4,"end":63.8},{"de":"Einige Menschen machen das auch ohne Notfall.","zh":"有些人没有紧急情况也会去那里。","start":65.82,"end":70.18},{"de":"Sie wissen nämlich nicht, zu welchem Arzt soll ich gehen.","zh":"因为他们不知道该去看哪位医生。","start":70.62,"end":75.78},{"de":"Die Notaufnahmen in Deutschland sind deshalb sehr voll.","zh":"因此德国的急诊室非常拥挤。","start":76.9,"end":80.94},{"de":"Viele Menschen müssen dann lange warten.","zh":"很多人必须等待很长时间。","start":81.42,"end":84.42},{"de":"Und die Rettungsdienste haben viel zu tun.","zh":"急救服务也非常繁忙。","start":85.16,"end":88.08},{"de":"Der Bundestag hat jetzt aber neue Regeln beschlossen.","zh":"但现在联邦议院通过了新规定。","start":90.06,"end":94.22},{"de":"Es soll in Krankenhäusern Notfallzentren geben.","zh":"医院里将设立紧急中心。","start":94.62,"end":99.58},{"de":"Dort wird dann entschieden, soll jemand zur Notaufnahme oder zu einem anderen Arzt gehen.","zh":"在那里会决定，某人应该去急诊室还是去看其他医生。","start":100.58,"end":107.08},{"de":"Dazu kommt jetzt ein Film.","zh":"接下来请看一段影片。","start":108.98,"end":111.1},{"de":"Dieses Krankenhaus in Hamburg hat schon ein Notfallzentrum.","zh":"这家位于汉堡的医院已经设有紧急中心。","start":112.14,"end":116.98},{"de":"Wenn Menschen Hilfe brauchen, dann können sie sich hier melden.","zh":"当人们需要帮助时，可以到这里来登记。","start":117.42,"end":121.86},{"de":"Die Mitarbeiter prüfen dann, ist es ein Notfall?","zh":"工作人员会检查：这是紧急情况吗？","start":121.9,"end":125.78},{"de":"Welcher Arzt kann helfen?","zh":"哪位医生能提供帮助？","start":126.22,"end":128.06},{"de":"Dieser Chef von den Ärzten im Krankenhaus sagt, es gibt jetzt viel weniger Menschen in der Notaufnahme.","zh":"这家医院的医生负责人说，现在急诊室里的人少了很多。","start":128.74,"end":136.62},{"de":"Wir haben mehr Zeit für die Notfälle.","zh":"我们有更多时间处理紧急情况。","start":137.02,"end":140.22},{"de":"Und es gibt auch eine Praxis mit Hausärzten.","zh":"这里还设有一个家庭医生诊所。","start":141.22,"end":145.54},{"de":"Dort bekommen die Menschen ohne Notfälle Hilfe.","zh":"没有紧急情况的人可以在那里获得帮助。","start":145.78,"end":149.54},{"de":"Der Bundestag hat jetzt entschieden, es soll die Notfallzentren in ganz Deutschland geben.","zh":"联邦议院现在决定，德国全境都将设立紧急中心。","start":150.58,"end":157.5},{"de":"Und wenn Menschen per Telefon Notfälle melden, wird genauer geprüft, wo können sie behandelt werden.","zh":"而且当人们通过电话报告紧急情况时，会更仔细地核查他们可以在哪里接受治疗。","start":158.14,"end":165.7},{"de":"Der Minister für Gesundheit ist Carsten Linnemann.","zh":"卫生部长是卡斯滕·林内曼。","start":166.46,"end":170.54},{"de":"Er sagt, mit den neuen Regeln ist immer klar, wer bekommt wo Hilfe.","zh":"他说，有了新规定，谁在哪里获得帮助总是很清楚。","start":170.7,"end":176.94},{"de":"Aber einige im Bundestag haben Zweifel an den Regeln.","zh":"但联邦议院里有一些人对这些规定表示怀疑。","start":178.42,"end":183.46},{"de":"Dieser Politiker ist von den Grünen.","zh":"这位政治家来自绿党。","start":183.7,"end":186.66},{"de":"Er sagt, wenn die Menschen weniger in die Notaufnahme gehen sollen, dann brauchen wir mehr Termine bei anderen Ärzten.","zh":"他说，如果要减少人们去急诊室，那我们就需要其他医生那里有更多的预约名额。","start":187.06,"end":196.46},{"de":"Aber oft gibt es keine Termine.","zh":"但往往没有预约名额。","start":196.5,"end":199.58},{"de":"Mit den neuen Regeln sollen Krankenhäuser, andere Ärzte und Rettungsdienste besser zusammenarbeiten.","zh":"根据新规定，医院、其他医生和急救服务将更好地合作。","start":201.48,"end":209.3},{"de":"Nun zur nächsten Nachricht.","zh":"现在来看下一条新闻。","start":211.08,"end":213.16},{"de":"EU ist das kurze Wort für Europäische Union.","zh":"欧盟是欧洲联盟的简称。","start":217.74,"end":222.7},{"de":"Die EU ist eine Gruppe von Ländern in Europa.","zh":"欧盟是欧洲一些国家组成的组织。","start":222.74,"end":227.22},{"de":"Auch Deutschland gehört dazu.","zh":"德国也是其中一员。","start":227.9,"end":229.98},{"de":"Sie arbeiten in der Politik und der Wirtschaft zusammen.","zh":"这些国家在政治和经济上合作。","start":230.42,"end":234.5},{"de":"Jetzt gibt es wieder ein Treffen von den Chefs von den Ländern.","zh":"现在各国领导人再次举行会晤。","start":235.34,"end":239.78},{"de":"Einige sind auf dem Foto.","zh":"照片上有其中几位。","start":240.02,"end":242.1},{"de":"Sie sprechen auch über den Haushalt für mehrere Jahre.","zh":"他们还会商讨未来几年的预算。","start":242.9,"end":247.3},{"de":"Der Haushalt ist das Geld von der EU.","zh":"预算是欧盟的资金。","start":247.34,"end":251.38},{"de":"Es kommt von den Ländern.","zh":"这些钱来自各个成员国。","start":251.82,"end":253.62},{"de":"Und der Haushalt regelt, wofür wird das Geld ausgegeben.","zh":"预算规定这些钱用于什么用途。","start":254.06,"end":259.1},{"de":"Es gibt aber Streit über den Haushalt.","zh":"但围绕预算存在争议。","start":260.02,"end":263.06},{"de":"Die EU will ihn schnell festlegen.","zh":"欧盟希望尽快确定预算。","start":263.42,"end":266.34},{"de":"Manche Länder wollen aber noch warten.","zh":"但有些国家还想再等等。","start":266.62,"end":269.34},{"de":"Und einige Länder wie Deutschland sagen, der Vorschlag für den Haushalt ist zu hoch.","zh":"而德国等一些国家表示，预算提案的金额太高了。","start":269.38,"end":277.58},{"de":"Dazu kommt ein Film.","zh":"接下来请看一段影片。","start":277.98,"end":279.86},{"de":"Bundeskanzler Merz sagt, die Verhandlungen über das Geld sind schwierig.","zh":"联邦总理默茨表示，关于资金的谈判很困难。","start":280.94,"end":286.34},{"de":"Der Vorschlag von der EU für den Haushalt ist zu hoch.","zh":"欧盟提出的预算提案太高了。","start":286.86,"end":291.22},{"de":"Die Länder können sich das nicht leisten.","zh":"各国负担不起。","start":291.62,"end":294.26},{"de":"Ich glaube nicht, dass wir uns bei diesem Treffen einigen.","zh":"我认为我们不会在这次会议上达成一致。","start":294.3,"end":299.18},{"de":"Wir beraten auch, welche Themen sind uns wichtig.","zh":"我们还在商讨哪些主题对我们重要。","start":299.5,"end":303.54},{"de":"Ich finde, vor allem die Wirtschaft und die Verteidigung sind wichtig.","zh":"我认为，最重要的是经济和国防。","start":304.26,"end":309.18},{"de":"Da machen wir Fortschritte, aber wir müssen noch besser werden.","zh":"我们在这些方面有进展，但还必须做得更好。","start":309.54,"end":313.98},{"de":"Und nun zur nächsten Nachricht.","zh":"现在来看下一条新闻。","start":314.22,"end":316.7},{"de":"An allen Bahnhöfen in Deutschland gilt jetzt, Alkohol ist verboten.","zh":"现在德国所有火车站都适用这样的规定：禁止饮酒。","start":321.6,"end":326.32},{"de":"D.h. man darf im Gebäude vom Bahnhof und auf den Bahnsteigen keinen Alkohol trinken.","zh":"也就是说，在火车站建筑内和站台上不得饮酒。","start":327.6,"end":334.44},{"de":"Außer z.B. in Restaurants.","zh":"但在餐厅等场所除外。","start":336.5,"end":339.1},{"de":"Das steht auf Schildern in den Bahnhöfen wie auf dem Foto.","zh":"这一规定写在火车站的指示牌上，就像照片上那样。","start":339.94,"end":344.7},{"de":"Die Bahn will damit die Bahnhöfe sauberer und sicherer machen.","zh":"德国铁路公司希望借此让火车站更清洁、更安全。","start":345.18,"end":350.06},{"de":"Bisher gab es das Verbot nur an manchen Bahnhöfen.","zh":"到目前为止，只有部分火车站有这项禁令。","start":350.26,"end":354.98},{"de":"Dazu kommt jetzt ein Film.","zh":"现在还有一段影片。","start":355.46,"end":357.3},{"de":"Am Hauptbahnhof von Köln ist Alkohol schon länger verboten.","zh":"在科隆主火车站，酒精饮料早就被禁止了。","start":359.06,"end":364.5},{"de":"Diese Schilder hängen dort seit April.","zh":"这些牌子从四月起就挂在那里。","start":364.9,"end":367.7},{"de":"Auch an anderen Bahnhöfen hat die Bahn das Verbot getestet.","zh":"德国铁路公司也在其他火车站试行过这项禁令。","start":367.74,"end":372.86},{"de":"Das ist die Sprecherin von der Bahn.","zh":"这是铁路公司的女发言人。","start":373.34,"end":375.94},{"de":"Sie sagt, an den Bahnhöfen mit dem Verbot gibt es weniger Streit, weniger Müll und die Menschen fühlen sich sicherer.","zh":"她说，在有禁令的火车站，争吵更少，垃圾更少，人们也感到更安全。","start":376.1,"end":384.38},{"de":"In letzter Zeit gab es immer mehr Angriffe auf Mitarbeiter von der Bahn.","zh":"最近，对铁路公司员工的袭击越来越多。","start":384.42,"end":391.1},{"de":"Die Bahn sagt, auch deshalb ist Alkohol jetzt verboten.","zh":"铁路公司说，这也是现在禁止酒精饮料的原因。","start":391.34,"end":395.78},{"de":"Viele Menschen finden das Verbot gut.","zh":"很多人认为这项禁令很好。","start":396.26,"end":399.06},{"de":"Dieser Mann arbeitet für eine Firma mit Restaurants und Geschäften im Bahnhof.","zh":"这名男子在一家于火车站经营餐厅和商店的公司工作。","start":400.1,"end":406.18},{"de":"Er sagt, in manchen Geschäften kaufen die Menschen weniger Getränke.","zh":"他说，在一些商店，人们买的饮料变少了。","start":406.22,"end":413.18},{"de":"Dadurch verdienen die Geschäfte weniger.","zh":"因此这些商店的收入减少了。","start":413.86,"end":416.3},{"de":"Aber die Mitarbeiter und die Gäste sind sicherer.","zh":"但是员工和客人更安全了。","start":416.34,"end":420.06},{"de":"Das ist am wichtigsten.","zh":"这是最重要的。","start":420.42,"end":422.06},{"de":"Einige befürchten aber, wenn die Menschen nicht mehr im Bahnhof Alkohol trinken dürfen, dann machen sie es in den Straßen um den Bahnhof.","zh":"不过有些人担心，如果人们不能再在火车站喝酒，他们就会到火车站周围的街道上喝。","start":423.54,"end":433.42},{"de":"Und nun zur nächsten Nachricht.","zh":"现在来看下一条新闻。","start":434.38,"end":437.02},{"de":"Albanien ist ein Land, unten rechts im Südosten von Europa.","zh":"阿尔巴尼亚是一个国家，位于欧洲东南部右下方。","start":441.1,"end":446.02},{"de":"Dort gibt es gerade heftige Proteste.","zh":"那里目前正在发生激烈的抗议活动。","start":446.62,"end":449.26},{"de":"Die Menschen sind nämlich unzufrieden mit der Regierung.","zh":"因为人们对政府感到不满。","start":449.62,"end":453.54},{"de":"Zuerst haben die Menschen gesagt, wir wollen bessere Bedingungen zum Studieren.","zh":"起初，人们提出：我们想要更好的上大学条件。","start":454.1,"end":459.78},{"de":"Z.B. soll es günstiger werden.","zh":"比如说，上大学应该变得更便宜。","start":460.18,"end":462.74},{"de":"Jetzt sind die Proteste aber viel größer geworden.","zh":"但现在抗议活动的规模变得大得多。","start":463.3,"end":466.82},{"de":"Viele Menschen fordern den Rücktritt vom Chef der Regierung.","zh":"许多人要求政府首脑下台。","start":467.66,"end":471.86},{"de":"Dazu kommt ein Film.","zh":"接下来是一段影片。","start":472.38,"end":473.94},{"de":"Bei den Protesten gibt es Gewalt.","zh":"抗议活动中出现了暴力。","start":475.1,"end":477.46},{"de":"Einige Menschen werfen brennende Gegenstände und Steine auch vor dem Parlament.","zh":"一些人在议会前投掷燃烧物和石块。","start":477.78,"end":484.22},{"de":"Die Polizei setzt Gas ein.","zh":"警察使用了催泪瓦斯。","start":484.26,"end":487.7},{"de":"Es reizt die Augen.","zh":"它会刺激眼睛。","start":488.02,"end":489.38},{"de":"Die Proteste und die Gewalt dauern schon zwei Tage.","zh":"抗议和暴力已经持续两天了。","start":489.86,"end":494.02},{"de":"Und das waren unsere Nachrichten.","zh":"以上就是我们的新闻。","start":495.86,"end":498.22},{"de":"Bundestag.","zh":"联邦议院。","start":498.86,"end":499.86},{"de":"Und jetzt kommt das Wetter.","zh":"现在来看天气。","start":515.1,"end":517.58},{"de":"Zuerst Nebel unten im Süden und in der Mitte.","zh":"首先，南部和中部地区有雾。","start":518.74,"end":522.58},{"de":"Danach sonniges Herbstwetter.","zh":"之后是晴朗的秋季天气。","start":522.9,"end":524.98},{"de":"Oben links im Nordwesten mehr Wolken und gegen Abend Regen.","zh":"西北部上空云较多，傍晚前后有雨。","start":525.78,"end":530.54},{"de":"Es werden 11 bis 24 Grad.","zh":"气温为11至24度。","start":530.78,"end":533.9},{"de":"Das war die tagesschau in Einfacher Sprache.","zh":"以上就是简单语言版的每日新闻。","start":534.68,"end":537.76},{"de":"Tschüss, bis zum nächsten Mal.","zh":"再见，下次见。","start":538.44,"end":540.6}],"stories":[{"title":"Willkommen zur tagesschau","title_zh":"欢迎收看简单语言新闻","from":0,"to":2,"vocab":[],"grammar":[],"background":""},{"title":"Neue Regeln für Notaufnahmen","title_zh":"急诊室新规定","from":3,"to":30,"vocab":[{"key":"notaufnahme","lemma":"die Notaufnahme, -n","pos":"noun","zh":"急诊室","example_de":"Wenn sich Menschen verletzen oder wenn sie krank sind, dann rufen sie oft den Rettungsdienst oder fahren zur Notaufnahme.","example_zh":"当人们受伤或生病时，他们通常会呼叫急救服务或前往急诊室。"},{"key":"verletzen","lemma":"sich verletzen","pos":"verb","zh":"受伤","example_de":"Wenn sich Menschen verletzen oder wenn sie krank sind, dann rufen sie oft den Rettungsdienst oder fahren zur Notaufnahme.","example_zh":"当人们受伤或生病时，他们通常会呼叫急救服务或前往急诊室。"},{"key":"notfälle","lemma":"der Notfall, -fälle","pos":"noun","zh":"紧急情况，急诊病例","example_de":"Das ist eine Station im Krankenhaus für Notfälle, wie auf dem Foto.","example_zh":"急诊室是医院里处理紧急情况的部门，就像照片上那样。"},{"key":"beschlossen","lemma":"beschließen","pos":"verb","zh":"决定，决议","example_de":"Der Bundestag hat jetzt aber neue Regeln beschlossen.","example_zh":"但现在联邦议院通过了新规定。"},{"key":"entschieden","lemma":"entscheiden","pos":"verb","zh":"决定，裁决","example_de":"Dort wird dann entschieden, soll jemand zur Notaufnahme oder zu einem anderen Arzt gehen.","example_zh":"在那里会决定，某人应该去急诊室还是去看其他医生。"}],"grammar":[{"title":"被动语态：werden + Partizip II","summary":"„Dort wird dann entschieden“ 是被动语态：werden（按人称变位）+ 过去分词，表示动作被完成，主语不是动作执行者。","example_de":"Dort wird dann entschieden, soll jemand zur Notaufnahme oder zu einem anderen Arzt gehen.","example_zh":"在那里会决定，某人应该去急诊室还是去看其他医生。"}],"background":""},{"title":"EU: Beratungen über Haushalt","title_zh":"欧盟：预算磋商","from":31,"to":53,"vocab":[{"key":"treffen","lemma":"das Treffen, -","pos":"noun","zh":"会面，会议","example_de":"Jetzt gibt es wieder ein Treffen von den Chefs von den Ländern.","example_zh":"现在各国领导人再次举行会晤。"},{"key":"haushalt","lemma":"der Haushalt, -e","pos":"noun","zh":"预算","example_de":"Sie sprechen auch über den Haushalt für mehrere Jahre.","example_zh":"他们还会商讨未来几年的预算。"},{"key":"verhandlungen","lemma":"die Verhandlung, -en","pos":"noun","zh":"谈判，协商","example_de":"Bundeskanzler Merz sagt, die Verhandlungen über das Geld sind schwierig.","example_zh":"联邦总理默茨表示，关于资金的谈判很困难。"},{"key":"einigen","lemma":"sich einigen","pos":"verb","zh":"达成一致","examp
