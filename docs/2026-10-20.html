    <script id="dd-data" type="application/json">{"page":"lesson","lesson":{"slug":"2026-10-20","date":"2026-10-20","show":"tagesschau in Einfacher Sprache","level":"A2–B1","kind":"reading","note":"这期的逐句中文还在生成中；先用原声和字幕跟练，点词可查义。","source_url":"https://www.tagesschau.de/tagesschau_in_einfacher_sprache/tse-1478.html","video":{"mp4":"https://tagesschau-progressive.ard-mcdn.de/video/2026/1020/TV-20261020-1734-2700.webl.h264.mp4","embed":"","page":"https://www.tagesschau.de/tagesschau_in_einfacher_sprache/video-1669558.html"},"duration":636.45,"sentences":[{"de":"Willkommen zur tagesschau in Einfacher Sprache.","zh":"","start":11.49,"end":14.97},{"de":"Ich bin Susanne Stichler und das sind unsere Nachrichten.","zh":"","start":15.37,"end":19.37},{"de":"Und nun zur ersten Nachricht.","zh":"","start":39.61,"end":41.69},{"de":"In Berlin gab es gerade ein großes Treffen von der Wirtschaft.","zh":"","start":47.01,"end":52.21},{"de":"Die Bundesregierung hat Investoren aus der ganzen Welt dazu eingeladen.","zh":"","start":52.81,"end":58.61},{"de":"Investoren sind Menschen mit viel Geld.","zh":"","start":59.01,"end":62.81},{"de":"Sie geben das Geld zum Beispiel für den Bau von Firmen aus.","zh":"","start":63.45,"end":68.01},{"de":"Die Bundesregierung will, dass viele Investoren in Deutschland Geld ausgeben.","zh":"","start":69.57,"end":76.45},{"de":"In der Mitte von dem Foto ist der Bundeskanzler Friedrich Merz.","zh":"","start":77.29,"end":82.73},{"de":"Er sagt, Investoren aus dem Ausland sind gut für die deutsche Wirtschaft.","zh":"","start":83.37,"end":89.01},{"de":"Es gab ein großes Fest für die Investoren.","zh":"","start":90.69,"end":94.85},{"de":"Sie wollen viele Milliarden Euro in Deutschland investieren.","zh":"","start":95.61,"end":100.57},{"de":"Jetzt zeigen wir einen Film dazu.","zh":"","start":100.97,"end":103.33},{"de":"Bei dem Fest sind viele Investoren aus der ganzen Welt.","zh":"","start":104.29,"end":109.01},{"de":"Der Bundeskanzler Friedrich Merz sagt, Deutschland will Investoren und Handel und die deutsche Wirtschaft will schneller wachsen.","zh":"","start":109.41,"end":119.49},{"de":"Jen-Hsun Huang ist der Chef von der Firma Nvidia in den USA.","zh":"","start":122.37,"end":127.97},{"de":"Sie macht Chips für Computer und ist eine sehr wertvolle Firma.","zh":"","start":128.57,"end":133.53},{"de":"Deutschland will mit Nvidia zusammenarbeiten.","zh":"","start":134.41,"end":137.57},{"de":"Aber Deutschland braucht noch mehr Investoren.","zh":"","start":138.41,"end":141.69},{"de":"Diese Frau ist Expertin für Wirtschaft.","zh":"","start":142.29,"end":145.01},{"de":"Sie sagt, Deutschland liegt mitten in Europa.","zh":"","start":145.73,"end":149.49},{"de":"Und es gibt viele Forscher in Deutschland.","zh":"","start":149.97,"end":152.89},{"de":"Das finden Investoren gut.","zh":"","start":153.21,"end":155.33},{"de":"Aber in Deutschland ist Energie sehr teuer und die Steuern sind hoch.","zh":"","start":155.57,"end":160.69},{"de":"Das mögen Investoren nicht.","zh":"","start":160.73,"end":162.97},{"de":"Deshalb muss die Bundesregierung neue, bessere Regeln zum Beispiel für Steuern machen.","zh":"","start":163.61,"end":169.93},{"de":"Dann kommen mehr Investoren nach Deutschland.","zh":"","start":169.97,"end":173.13},{"de":"Und der Chef von Nvidia sagt, die Menschen in Deutschland können viel, fangt mit der Arbeit an.","zh":"","start":173.97,"end":181.53},{"de":"Deutschland will den Investoren bei dem Treffen in Berlin zeigen, es ist gut, wenn ihr nach Deutschland kommt.","zh":"","start":183.45,"end":191.45},{"de":"Und nun zur nächsten Nachricht.","zh":"","start":192.29,"end":194.65},{"de":"Wenn auf Reisen der Bus, die Bahn oder das Flugzeug zu spät kommen oder ausfallen, dann haben Reisende Rechte.","zh":"","start":199.05,"end":208.25},{"de":"Sie bekommen zum Beispiel Geld für das Ticket zurück.","zh":"","start":208.61,"end":212.69},{"de":"Bislang ist es aber oft schwierig, an das Geld zu kommen.","zh":"","start":213.53,"end":218.09},{"de":"Manchmal muss man viel schreiben an verschiedene Behörden oder Firmen.","zh":"","start":219.21,"end":224.29},{"de":"Die EU will das ändern.","zh":"","start":225.17,"end":227.25},{"de":"Es soll einfacher werden, Geld zurückzubekommen.","zh":"","start":227.69,"end":231.81},{"de":"Und es soll in der ganzen EU nur einen Antrag dafür geben.","zh":"","start":232.37,"end":237.05},{"de":"Er soll einfach zu verstehen und in allen Ländern gleich sein.","zh":"","start":237.61,"end":242.65},{"de":"Das Parlament von der EU hat dafür gestimmt.","zh":"","start":243.17,"end":247.13},{"de":"Die EU-Länder müssen aber noch darüber abstimmen.","zh":"","start":247.97,"end":251.41},{"de":"Und nun zur nächsten Nachricht.","zh":"","start":254.21,"end":256.41},{"de":"Vor 65 Jahren brauchte die Bundesrepublik Deutschland sehr viele Arbeiter.","zh":"","start":261.97,"end":268.89},{"de":"Die Bundesrepublik war im Westen von Deutschland.","zh":"","start":269.37,"end":273.57},{"de":"Die Wirtschaft ist damals stark gewachsen.","zh":"","start":274.37,"end":278.01},{"de":"Und es gab viel Arbeit.","zh":"","start":278.53,"end":280.73},{"de":"Es gab aber zu wenige Arbeiter.","zh":"","start":281.41,"end":284.29},{"de":"Deshalb hat die Bundesrepublik mit der Türkei einen Vertrag gemacht.","zh":"","start":285.09,"end":290.73},{"de":"In der Türkei waren nämlich viele Menschen ohne Arbeit.","zh":"","start":291.49,"end":296.21},{"de":"Viele von ihnen sind deshalb in die Bundesrepublik gekommen, wie auf dem Foto.","zh":"","start":297.17,"end":303.41},{"de":"Sie haben dort gearbeitet und damit der Wirtschaft geholfen.","zh":"","start":304.33,"end":309.01},{"de":"Sie haben Geld verdient und davon etwas nach Hause geschickt.","zh":"","start":309.85,"end":314.89},{"de":"Und damit den Menschen in der Türkei geholfen.","zh":"","start":315.77,"end":319.33},{"de":"Jetzt zeigen wir einen Film dazu.","zh":"","start":319.81,"end":321.73},{"de":"Diese alten Aufnahmen zeigen, viele türkische Arbeiter sind damals gekommen.","zh":"","start":322.41,"end":328.73},{"de":"Die Bundesrepublik brauchte dringend Arbeiter für Fabriken.","zh":"","start":329.13,"end":333.89},{"de":"Eigentlich sollten die Arbeiter nur wenige Jahre bleiben.","zh":"","start":334.37,"end":338.53},{"de":"Deshalb nannte man sie Gastarbeiter.","zh":"","start":338.97,"end":341.93},{"de":"Viele sind aber geblieben und haben auch die Familie aus der Türkei geholt.","zh":"","start":342.89,"end":348.41},{"de":"So wie der Opa von Ömer Kocak.","zh":"","start":348.49,"end":351.85},{"de":"Ömer Kocak hat eine eigene Firma in Deutschland.","zh":"","start":352.33,"end":356.65},{"de":"Sie bekommt gerade ein neues Gebäude.","zh":"","start":357.13,"end":360.01},{"de":"Ömer Kocak sagt, ich möchte, dass hier alles ordentlich ist.","zh":"","start":360.73,"end":365.73},{"de":"Und ich möchte gute Arbeit machen.","zh":"","start":365.85,"end":368.57},{"de":"Ich bin sehr deutsch.","zh":"","start":368.73,"end":370.33},{"de":"Die Firma putzt, räumt auf und hält Gärten in Ordnung.","zh":"","start":370.93,"end":375.57},{"de":"Als Ömer Kocak Kind war, hat er seiner Mutter beim Putzen geholfen.","zh":"","start":376.01,"end":381.81},{"de":"Die Mutter sagt, wir haben sehr früh morgens angefangen zu putzen.","zh":"","start":383.41,"end":389.01},{"de":"Danach ist Ömer zur Schule gegangen.","zh":"","start":389.09,"end":391.93},{"de":"Der Opa von Ömer Kocak ist vor 60 Jahren in die Bundesrepublik bekommen.","zh":"","start":392.85,"end":399.33},{"de":"Einen Sprachkurs gab es damals nicht.","zh":"","start":399.69,"end":402.77},{"de":"Die Mutter sagt, er hatte es sehr schwer.","zh":"","start":404.09,"end":407.45},{"de":"Er konnte kein Deutsch.","zh":"","start":407.69,"end":409.33},{"de":"Es war schwierig beim Einkaufen oder beim Arzt.","zh":"","start":409.81,"end":413.33},{"de":"Er hat die Sprache nicht verstanden.","zh":"","start":413.57,"end":415.81},{"de":"Am Anfang war es sehr schwer.","zh":"","start":415.85,"end":418.21},{"de":"Der Opa war Gastarbeiter.","zh":"","start":419.33,"end":421.53},{"de":"Sein Enkel Ömer Kocak hat eine große Firma.","zh":"","start":422.25,"end":426.57},{"de":"Vieles ist anders als früher.","zh":"","start":427.13,"end":429.69},{"de":"Ömer Kocak sagt, früher sind wir in den Sommerferien in die Türkei gefahren.","zh":"","start":431.49,"end":437.25},{"de":"Das war super.","zh":"","start":437.29,"end":438.45},{"de":"Aber meine Kinder wollen dort nicht mehr hin.","zh":"","start":438.65,"end":441.81},{"de":"Zur Erinnerung an die Türkei hat Ömer Kocak einen Baum gepflanzt, einen türkischen Olivenbaum.","zh":"","start":442.29,"end":449.61},{"de":"Und nun zur nächsten Nachricht.","zh":"","start":451.77,"end":453.65},{"de":"In Deutschland fühlen sich viele Menschen einsam.","zh":"","start":459.21,"end":462.85},{"de":"Es sind oft junge Menschen.","zh":"","start":463.09,"end":465.01},{"de":"Sie sind dann traurig.","zh":"","start":465.49,"end":467.17},{"de":"Das kann gefährlich für die Gesundheit sein.","zh":"","start":467.61,"end":470.77},{"de":"Es gibt aber verschiedene Projekte für einsame Menschen.","zh":"","start":471.49,"end":475.97},{"de":"Zum Beispiel gemeinsame Spaziergänge, wie auf dem Foto.","zh":"","start":476.85,"end":481.89},{"de":"Bei diesen Spaziergängen lernen sich die Menschen kennen und werden vielleicht Freunde.","zh":"","start":482.77,"end":489.33},{"de":"Es gibt diese Spaziergänge zum Beispiel in der Stadt Leipzig im Osten von Deutschland.","zh":"","start":490.09,"end":497.13},{"de":"Dazu zeigen wir jetzt einen Film.","zh":"","start":497.61,"end":499.97},{"de":"Pascal Oetken organisiert die Spaziergänge und begrüßt die Menschen.","zh":"","start":500.97,"end":506.85},{"de":"Sie haben unterschiedliche Gründe, warum sie bei dem Spaziergang mitmachen.","zh":"","start":506.89,"end":512.61},{"de":"Diese Frau sagt, ich will neue Menschen kennenlernen.","zh":"","start":512.97,"end":516.65},{"de":"Dieser Mann sagt, es ist gut für schüchterne Menschen.","zh":"","start":516.69,"end":520.49},{"de":"Und dieser Mann sagt, ich möchte in der Natur sein und nicht immer am Handy.","zh":"","start":521.09,"end":526.69},{"de":"Einmal in der Woche treffen sich die Menschen zum Spaziergang, auch bei schlechtem Wetter.","zh":"","start":527.49,"end":533.77},{"de":"Sie gehen jedes Mal einen anderen Weg.","zh":"","start":534.01,"end":537.29},{"de":"Vor allem jüngere Menschen gehen mit.","zh":"","start":537.81,"end":540.77},{"de":"Sie fühlen sich oft einsam.","zh":"","start":541.01,"end":543.37},{"de":"Manche haben hier schon einen Partner gefunden oder neue Freunde.","zh":"","start":544.05,"end":549.29},{"de":"Pascal Oetken hat nicht gedacht, dass die Idee so gut ankommt.","zh":"","start":549.89,"end":555.85},{"de":"Er sagt, manche Menschen bleiben immer zu Hause.","zh":"","start":556.69,"end":560.21},{"de":"Sie sind sehr einsam.","zh":"","start":560.41,"end":562.13},{"de":"Wenn solche Menschen zum Spaziergang kommen und andere treffen, dann freue ich mich.","zh":"","start":562.41,"end":568.57},{"de":"Die Menschen kommen, weil sie sich vom Partner getrennt haben, umgezogen sind oder eine neue Arbeit haben.","zh":"","start":569.93,"end":580.05},{"de":"Sie können hier andere Menschen kennenlernen.","zh":"","start":580.73,"end":584.21},{"de":"Solche Spaziergänge gegen Einsamkeit gibt es schon in vielen deutschen Städten.","zh":"","start":584.69,"end":591.61},{"de":"Und das waren unsere Nachrichten.","zh":"","start":593.69,"end":595.81},{"de":"Und jetzt kommt das Wetter.","zh":"","start":614.69,"end":616.93},{"de":"Es gibt viele Wolken und es regnet in vielen Regionen.","zh":"","start":617.53,"end":621.57},{"de":"Links im Westen nur manchmal, rechts im Osten ist es trocken.","zh":"","start":621.93,"end":626.57},{"de":"Es werden 8 bis 18 Grad.","zh":"","start":626.85,"end":629.17},{"de":"Das war die tagesschau in Einfacher Sprache.","zh":"","start":630.37,"end":633.77},{"de":"Tschüss und bis zum nächsten Mal.","zh":"","start":634.09,"end":636.45}],"stories":[{"title
