    <div id="root"></div>
    <script id="dd-data" type="application/json">{"page":"lesson","lesson":{"slug":"2026-10-20","date":"2026-10-20","show":"tagesschau in Einfacher Sprache","level":"A2–B1","kind":"broadcast","note":"","source_url":"https://www.tagesschau.de/tagesschau_in_einfacher_sprache/tse-1478.html","video":{"mp4":"https://tagesschau-progressive.ard-mcdn.de/video/2026/1020/TV-20261020-1734-2700.webl.h264.mp4","embed":"","page":"https://www.tagesschau.de/tagesschau_in_einfacher_sprache/video-1669558.html"},"duration":636.45,"sentences":[{"de":"Willkommen zur tagesschau in Einfacher Sprache.","zh":"欢迎收看简易语言版每日新闻。","start":11.49,"end":14.97},{"de":"Ich bin Susanne Stichler und das sind unsere Nachrichten.","zh":"我是苏珊娜·施蒂希勒，以下是我们的新闻。","start":15.37,"end":19.37},{"de":"Und nun zur ersten Nachricht.","zh":"现在来看第一条新闻。","start":39.61,"end":41.69},{"de":"In Berlin gab es gerade ein großes Treffen von der Wirtschaft.","zh":"柏林刚刚举行了一场大型经济界聚会。","start":47.01,"end":52.21},{"de":"Die Bundesregierung hat Investoren aus der ganzen Welt dazu eingeladen.","zh":"联邦政府邀请了来自世界各地的投资者。","start":52.81,"end":58.61},{"de":"Investoren sind Menschen mit viel Geld.","zh":"投资者是拥有很多钱的人。","start":59.01,"end":62.81},{"de":"Sie geben das Geld zum Beispiel für den Bau von Firmen aus.","zh":"他们把这些钱用于例如建设公司。","start":63.45,"end":68.01},{"de":"Die Bundesregierung will, dass viele Investoren in Deutschland Geld ausgeben.","zh":"联邦政府希望很多投资者在德国花钱。","start":69.57,"end":76.45},{"de":"In der Mitte von dem Foto ist der Bundeskanzler Friedrich Merz.","zh":"照片中间是联邦总理弗里德里希·默茨。","start":77.29,"end":82.73},{"de":"Er sagt, Investoren aus dem Ausland sind gut für die deutsche Wirtschaft.","zh":"他说，来自外国的投资者对德国经济有好处。","start":83.37,"end":89.01},{"de":"Es gab ein großes Fest für die Investoren.","zh":"为投资者举办了一场大型庆祝活动。","start":90.69,"end":94.85},{"de":"Sie wollen viele Milliarden Euro in Deutschland investieren.","zh":"他们想在德国投资数十亿欧元。","start":95.61,"end":100.57},{"de":"Jetzt zeigen wir einen Film dazu.","zh":"现在我们播放一段相关影片。","start":100.97,"end":103.33},{"de":"Bei dem Fest sind viele Investoren aus der ganzen Welt.","zh":"庆祝活动上有很多来自世界各地的投资者。","start":104.29,"end":109.01},{"de":"Der Bundeskanzler Friedrich Merz sagt, Deutschland will Investoren und Handel und die deutsche Wirtschaft will schneller wachsen.","zh":"联邦总理弗里德里希·默茨说，德国需要投资者和贸易，德国经济要更快增长。","start":109.41,"end":119.49},{"de":"Jen-Hsun Huang ist der Chef von der Firma Nvidia in den USA.","zh":"黄仁勋是美国英伟达公司的老板。","start":122.37,"end":127.97},{"de":"Sie macht Chips für Computer und ist eine sehr wertvolle Firma.","zh":"这家公司生产电脑芯片，是一家非常有价值的公司。","start":128.57,"end":133.53},{"de":"Deutschland will mit Nvidia zusammenarbeiten.","zh":"德国想与英伟达合作。","start":134.41,"end":137.57},{"de":"Aber Deutschland braucht noch mehr Investoren.","zh":"但德国还需要更多投资者。","start":138.41,"end":141.69},{"de":"Diese Frau ist Expertin für Wirtschaft.","zh":"这位女士是经济专家。","start":142.29,"end":145.01},{"de":"Sie sagt, Deutschland liegt mitten in Europa.","zh":"她说，德国位于欧洲中部。","start":145.73,"end":149.49},{"de":"Und es gibt viele Forscher in Deutschland.","zh":"而且德国有很多科研人员。","start":149.97,"end":152.89},{"de":"Das finden Investoren gut.","zh":"投资者觉得这很好。","start":153.21,"end":155.33},{"de":"Aber in Deutschland ist Energie sehr teuer und die Steuern sind hoch.","zh":"但在德国能源非常贵，税收也高。","start":155.57,"end":160.69},{"de":"Das mögen Investoren nicht.","zh":"投资者不喜欢这一点。","start":160.73,"end":162.97},{"de":"Deshalb muss die Bundesregierung neue, bessere Regeln zum Beispiel für Steuern machen.","zh":"因此联邦政府必须制定新的、更好的规定，比如税收方面。","start":163.61,"end":169.93},{"de":"Dann kommen mehr Investoren nach Deutschland.","zh":"这样就会有更多投资者来德国。","start":169.97,"end":173.13},{"de":"Und der Chef von Nvidia sagt, die Menschen in Deutschland können viel, fangt mit der Arbeit an.","zh":"英伟达的老板说，德国人很有能力，开始工作吧。","start":173.97,"end":181.53},{"de":"Deutschland will den Investoren bei dem Treffen in Berlin zeigen, es ist gut, wenn ihr nach Deutschland kommt.","zh":"德国想在柏林的聚会上向投资者表明：你们来德国是好事。","start":183.45,"end":191.45},{"de":"Und nun zur nächsten Nachricht.","zh":"现在来看下一条新闻。","start":192.29,"end":194.65},{"de":"Wenn auf Reisen der Bus, die Bahn oder das Flugzeug zu spät kommen oder ausfallen, dann haben Reisende Rechte.","zh":"旅行时如果公交车、火车或飞机晚点或取消，旅客是有权利的。","start":199.05,"end":208.25},{"de":"Sie bekommen zum Beispiel Geld für das Ticket zurück.","zh":"比如他们可以退回票款。","start":208.61,"end":212.69},{"de":"Bislang ist es aber oft schwierig, an das Geld zu kommen.","zh":"但到目前为止，拿到这笔钱往往很困难。","start":213.53,"end":218.09},{"de":"Manchmal muss man viel schreiben an verschiedene Behörden oder Firmen.","zh":"有时要给不同的部门或公司写很多信。","start":219.21,"end":224.29},{"de":"Die EU will das ändern.","zh":"欧盟想改变这一点。","start":225.17,"end":227.25},{"de":"Es soll einfacher werden, Geld zurückzubekommen.","zh":"退钱应该变得更简单。","start":227.69,"end":231.81},{"de":"Und es soll in der ganzen EU nur einen Antrag dafür geben.","zh":"而且整个欧盟应该只有一种统一的申请表。","start":232.37,"end":237.05},{"de":"Er soll einfach zu verstehen und in allen Ländern gleich sein.","zh":"它应该容易理解，并且在所有国家都一样。","start":237.61,"end":242.65},{"de":"Das Parlament von der EU hat dafür gestimmt.","zh":"欧盟议会已经对此投了票。","start":243.17,"end":247.13},{"de":"Die EU-Länder müssen aber noch darüber abstimmen.","zh":"但欧盟各国还需要就此表决。","start":247.97,"end":251.41},{"de":"Und nun zur nächsten Nachricht.","zh":"现在来看下一条新闻。","start":254.21,"end":256.41},{"de":"Vor 65 Jahren brauchte die Bundesrepublik Deutschland sehr viele Arbeiter.","zh":"65年前，德意志联邦共和国需要非常多的工人。","start":261.97,"end":268.89},{"de":"Die Bundesrepublik war im Westen von Deutschland.","zh":"联邦德国位于德国西部。","start":269.37,"end":273.57},{"de":"Die Wirtschaft ist damals stark gewachsen.","zh":"当时经济增长强劲。","start":274.37,"end":278.01},{"de":"Und es gab viel Arbeit.","zh":"工作机会很多。","start":278.53,"end":280.73},{"de":"Es gab aber zu wenige Arbeiter.","zh":"但工人太少。","start":281.41,"end":284.29},{"de":"Deshalb hat die Bundesrepublik mit der Türkei einen Vertrag gemacht.","zh":"因此联邦德国与土耳其签订了一份合同。","start":285.09,"end":290.73},{"de":"In der Türkei waren nämlich viele Menschen ohne Arbeit.","zh":"因为土耳其当时有很多没有工作的人。","start":291.49,"end":296.21},{"de":"Viele von ihnen sind deshalb in die Bundesrepublik gekommen, wie auf dem Foto.","zh":"他们中的许多人因此来到了联邦德国，就像照片上那样。","start":297.17,"end":303.41},{"de":"Sie haben dort gearbeitet und damit der Wirtschaft geholfen.","zh":"他们在那里工作，帮助了经济。","start":304.33,"end":309.01},{"de":"Sie haben Geld verdient und davon etwas nach Hause geschickt.","zh":"他们赚了钱，并把钱寄回家。","start":309.85,"end":314.89},{"de":"Und damit den Menschen in der Türkei geholfen.","zh":"从而帮助了土耳其的人们。","start":315.77,"end":319.33},{"de":"Jetzt zeigen wir einen Film dazu.","zh":"现在我们播放一段相关影片。","start":319.81,"end":321.73},{"de":"Diese alten Aufnahmen zeigen, viele türkische Arbeiter sind damals gekommen.","zh":"这些老影像显示，当时来了很多土耳其工人。","start":322.41,"end":328.73},{"de":"Die Bundesrepublik brauchte dringend Arbeiter für Fabriken.","zh":"联邦德国急需工厂工人。","start":329.13,"end":333.89},{"de":"Eigentlich sollten die Arbeiter nur wenige Jahre bleiben.","zh":"其实这些工人本应只待几年。","start":334.37,"end":338.53},{"de":"Deshalb nannte man sie Gastarbeiter.","zh":"因此人们称他们为客籍工人。","start":338.97,"end":341.93},{"de":"Viele sind aber geblieben und haben auch die Familie aus der Türkei geholt.","zh":"但很多人留了下来，还把家人从土耳其接了过来。","start":342.89,"end":348.41},{"de":"So wie der Opa von Ömer Kocak.","zh":"就像厄梅尔·科恰克的爷爷一样。","start":348.49,"end":351.85},{"de":"Ömer Kocak hat eine eigene Firma in Deutschland.","zh":"厄梅尔·科恰克在德国拥有自己的公司。","start":352.33,"end":356.65},{"de":"Sie bekommt gerade ein neues Gebäude.","zh":"公司刚刚得到一栋新大楼。","start":357.13,"end":360.01},{"de":"Ömer Kocak sagt, ich möchte, dass hier alles ordentlich ist.","zh":"Ömer Kocak说：我希望这里一切都井井有条。","start":360.73,"end":365.73},{"de":"Und ich möchte gute Arbeit machen.","zh":"我想把工作做好。","start":365.85,"end":368.57},{"de":"Ich bin sehr deutsch.","zh":"我非常德国化。","start":368.73,"end":370.33},{"de":"Die Firma putzt, räumt auf und hält Gärten in Ordnung.","zh":"这家公司负责清洁、整理和维护花园。","start":370.93,"end":375.57},{"de":"Als Ömer Kocak Kind war, hat er seiner Mutter beim Putzen geholfen.","zh":"Ömer Kocak小时候曾帮母亲打扫卫生。","start":376.01,"end":381.81},{"de":"Die Mutter sagt, wir haben sehr früh morgens angefangen zu putzen.","zh":"母亲说：我们很早很早就开始打扫了。","start":383.41,"end":389.01},{"de":"Danach ist Ömer zur Schule gegangen.","zh":"之后Ömer就去上学了。","start":389.09,"end":391.93},{"de":"Der Opa von Ömer Kocak ist vor 60 Jahren in die Bundesrepublik bekommen.","zh":"Ömer Kocak的爷爷是60年前来到联邦德国的。","start":392.85,"end":399.33},{"de":"Einen Sprachkurs gab es damals nicht.","zh":"当时没有语言课程。","start":399.69,"end":402.77},{"de":"Die Mutter sagt, er hatte es sehr schwer.","zh":"母亲说：他当年非常辛苦。","start":404.09,"end":407.45},{"de":"Er konnte kein Deutsch.","zh":"他不会德语。","start":407.69,"end":409.33},{"de":"Es war schwierig beim Einkaufen oder beim Arzt.","zh":"买东西或看医生都很困难。","start":409.81,"end":413.33},{"de":"Er hat die Sprache nicht verstanden.","zh":"他听不懂这种语言。","start":413.57,"end":415.81},{"de":"Am Anfang war es sehr schwer.","zh":"一开始非常艰难。","start":415.85,"end":418.21},{"de":"Der Opa war Gastarbeiter.","zh":"爷爷曾是外籍劳工。","start":419.33,"end":421.53},{"de":"Sein Enkel Ömer Kocak hat eine große Firma.","zh":"他的孙子Ömer Kocak现在有一家大公司。","start":422.25,"end":426.57},{"de":"Vieles ist anders als früher.","zh":"许多事情和以前不一样了。","start":427.13,"end":429.69},{"de":"Ömer Kocak sagt, früher sind wir in den Sommerferien in die Türkei gefahren.","zh":"Ömer Kocak说：以前我们暑假会去土耳其。","start":431.49,"end":437.25},{"de":"Das war super.","zh":"那太棒了。","start":437.29,"end":438.45},{"de":"Aber meine Kinder wollen dort nicht mehr hin.","zh":"但我的孩子们已经不想去那里了。","start":438.65,"end":441.81},{"de":"Zur Erinnerung an die Türkei hat Ömer Kocak einen Baum gepflanzt, einen türkischen Olivenbaum.","zh":"为了纪念土耳其，Ömer Kocak种了一棵树，一棵土耳其橄榄树。","start":442.29,"end":449.61},{"de":"Und nun zur nächsten Nachricht.","zh":"现在来看下一条新闻。","start":451.77,"end":453.65},{"de":"In Deutschland fühlen sich viele Menschen einsam.","zh":"在德国，很多人感到孤独。","start":459.21,"end":462.85},{"de":"Es sind oft junge Menschen.","zh":"其中常常是年轻人。","start":463.09,"end":465.01},{"de":"Sie sind dann traurig.","zh":"他们会因此难过。","start":465.49,"end":467.17},{"de":"Das kann gefährlich für die Gesundheit sein.","zh":"这可能对健康有害。","start":467.61,"end":470.77},{"de":"Es gibt aber verschiedene Projekte für einsame Menschen.","zh":"不过有一些面向孤独人群的项目。","start":471.49,"end":475.97},{"de":"Zum Beispiel gemeinsame Spaziergänge, wie auf dem Foto.","zh":"比如一起散步，就像照片上那样。","start":476.85,"end":481.89},{"de":"Bei diesen Spaziergängen lernen sich die Menschen kennen und werden vielleicht Freunde.","zh":"在散步时，人们互相认识，也许会成为朋友。","start":482.77,"end":489.33},{"de":"Es gibt diese Spaziergänge zum Beispiel in der Stadt Leipzig im Osten von Deutschland.","zh":"比如在德国东部的莱比锡市就有这样的散步活动。","start":490.09,"end":497.13},{"de":"Dazu zeigen wir jetzt einen Film.","zh":"下面我们来看一段影片。","start":497.61,"end":499.97},{"de":"Pascal Oetken organisiert die Spaziergänge und begrüßt die Menschen.","zh":"Pascal Oetken组织这些散步活动，并欢迎大家。","start":500.97,"end":506.85},{"de":"Sie haben unterschiedliche Gründe, warum sie bei dem Spaziergang mitmachen.","zh":"他们参加散步的原因各不相同。","start":506.89,"end":512.61},{"de":"Diese Frau sagt, ich will neue Menschen kennenlernen.","zh":"这位女士说：我想认识新的人。","start":512.97,"end":516.65},{"de":"Dieser Mann sagt, es ist gut für schüchterne Menschen.","zh":"这位男士说：这对害羞的人有好处。","start":516.69,"end":520.49},{"de":"Und dieser Mann sagt, ich möchte in der Natur sein und nicht immer am Handy.","zh":"还有这位男士说：我想待在大自然里，而不是总盯着手机。","start":521.09,"end":526.69},{"de":"Einmal in der Woche treffen sich die Menschen zum Spaziergang, auch bei schlechtem Wetter.","zh":"人们每周聚在一起散步一次，即使天气不好也一样。","start":527.49,"end":533.77},{"de":"Sie gehen jedes Mal einen anderen Weg.","zh":"他们每次走不同的路线。","start":534.01,"end":537.29},{"de":"Vor allem jüngere Menschen gehen mit.","zh":"参加的主要是年轻人。","start":537.81,"end":540.77},{"de":"Sie fühlen sich oft einsam.","zh":"他们常常感到孤独。","start":541.01,"end":543.37},{"de":"Manche haben hier schon einen Partner gefunden oder neue Freunde.","zh":"有些人已经在这里找到了伴侣或新朋友。","start":544.05,"end":549.29},{"de":"Pascal Oetken hat nicht gedacht, dass die Idee so gut ankommt.","zh":"Pascal Oetken没想到这个主意会这么受欢迎。","start":549.89,"end":555.85},{"de":"Er sagt, manche Menschen bleiben immer zu Hause.","zh":"他说：有些人总是待在家里。","start":556.69,"end":560.21},{"de":"Sie sind sehr einsam.","zh":"他们非常孤独。","start":560.41,"end":562.13},{"de":"Wenn solche Menschen zum Spaziergang kommen und andere treffen, dann freue ich mich.","zh":"当这样的人来散步并遇到其他人时，我很高兴。","start":562.41,"end":568.57},{"de":"Die Menschen kommen, weil sie sich vom Partner getrennt haben, umgezogen sind oder eine neue Arbeit haben.","zh":"人们来这里，是因为他们和伴侣分手了、搬家了或者有了新工作。","start":569.93,"end":580.05},{"de":"Sie können hier andere Menschen kennenlernen.","zh":"他们可以在这里认识其他人。","start":580.73,"end":584.21},{"de":"Solche Spaziergänge gegen Einsamkeit gibt es schon in vielen deutschen Städten.","zh":"德国许多城市已经有这样对抗孤独的散步活动。","start":584.69,"end":591.61},{"de":"Und das waren unsere Nachrichten.","zh":"以上是我们的新闻。","start":593.69,"end":595.81},{"de":"Und jetzt kommt das Wetter.","zh":"现在来看天气。","start":614.69,"end":616.93},{"de":"Es gibt viele Wolken und es regnet in vielen Regionen.","zh":"云很多，许多地区在下雨。","start":617.53,"end":621.57},{"de":"Links im Westen nur manchmal, rechts im Osten ist es trocken.","zh":"左边西部只是偶尔下雨，右边东部则是干燥的。","start":621.93,"end":626.57},{"de":"Es werden 8 bis 18 Grad.","zh":"气温为8到18度。","start":626.85,"end":629.17},{"de":"Das war die tagesschau in Einfacher Sprache.","zh":"以上就是简易语言版的每日新闻。","start":630.37,"end":633.77},{"de":"Tschüss und bis zum nächsten Mal.","zh":"再见，下次见。","start":634.09,"end":636.45}],"stories":[{"title":"Begrüßung","title_zh":"开场问候","from":0,"to":2,"vocab":[],"grammar":[],"background":""},{"title":"Treffen für Investoren in Berlin","title_zh":"柏林投资者大会","from":3,"to":28,"vocab":[{"key":"treffen","lemma":"das Treffen, -","pos":"noun","zh":"会面，聚会","example_de":"In Berlin gab es gerade ein großes Treffen von der Wirtschaft.","example_zh":"柏林刚刚举行了一场大型经济界聚会。"},{"key":"investoren","lemma":"der Investor, -en","pos":"noun","zh":"投资者","example_de":"Die Bundesregierung hat Investoren aus der ganzen Welt dazu eingeladen.","example_zh":"联邦政府邀请了来自世界各地的投资者。"},{"key":"eingeladen","lemma":"einladen","pos":"verb","zh":"邀请","example_de":"Die Bundesregierung hat Investoren aus der ganzen Welt dazu eingeladen.","example_zh":"联邦政府邀请了来自世界各地的投资者。"},{"key":"wirtschaft","lemma":"die Wirtschaft, -en","pos":"noun","zh":"经济","example_de":"In Berlin gab es gerade ein großes Treffen von der Wirtschaft.","example_zh":"柏林刚刚举行了一场大型经济界聚会。"},{"key":"investieren","lemma":"investieren","pos":"verb","zh":"投资","example_de":"Sie wollen viele Milliarden Euro in Deutschland investieren.","example_zh":"他们想在德国投资数十亿欧元。"}],"grammar":[{"title":"dazu eingeladen（代副词 dazu）","summary":"dazu 指代前面提到的事件（这次大会），意为\"为此/参加这个活动\"。","example_de":"Die Bundesregierung hat Investoren aus der ganzen Welt dazu eingeladen.","example_zh":"联邦政府邀请了来自世界各地的投资者。"}],"background":""},{"title":"EU: mehr Rechte für Reisende geplant","title_zh":"欧盟：计划给旅客更多权利","from":29,"to":39,"vocab":[{"key":"reisen","lemma":"die Reise, -n","pos":"noun","zh":"旅行","example_de":"Wenn auf Reisen der Bus, die Bahn oder das Flugzeug zu spät kommen oder ausfallen, dann haben Reisende Rechte.","example_zh":"旅行时如果公交车、火车或飞机晚点或取消，旅客是有权利的。"},{"key":"rechte","lemma":"das Recht, -e","pos":"noun","zh":"权利","example_de":"Wenn auf Reisen der Bus, die Bahn oder das Flugzeug zu spät kommen oder ausfallen, dann haben Reisende Rechte.","example_zh":"旅行时如果公交车、火车或飞机晚点或取消，旅客是有权利的。"},{"key":"ausfallen","lemma":"ausfallen","pos":"verb","zh":"（交通工具）取消，停运","example_de":"Wenn auf Reisen der Bus, die Bahn oder das Flugzeug zu spät kommen oder ausfallen, dann haben Reisende Rechte.","example_zh":"旅行时如果公交车、火车或飞机晚点或取消，旅客是有权利的。"},{"key":"ticket","lemma":"das Ticket, -s","pos":"noun","zh":"车票，机票","example_de":"Sie bekommen zum Beispiel Geld für da
