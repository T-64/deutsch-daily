<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Deutsch Daily — 2026-08-25</title>
<style>
  :root {
    --bg: #eef2f0;
    --surface: #ffffff;
    --surface-2: #f7f9f8;
    --ink: #172127;
    --ink-soft: #647077;
    --line: #dce4e1;
    --accent: #176b72;
    --accent-strong: #0d5057;
    --accent-soft: #dceeed;
    --warm: #d98f39;
    --warm-soft: #fff0d9;
    --zh: #5f696f;
    --danger: #b3493f;
    --shadow: 0 18px 50px rgba(20, 46, 47, .10);
    --shadow-soft: 0 8px 24px rgba(20, 46, 47, .07);
  }
  [data-theme="dark"] {
    --bg: #111719; --surface: #192124; --surface-2: #202a2d;
    --ink: #edf3f1; --ink-soft: #a9b7b8; --line: #344145;
    --accent: #75cbd0; --accent-strong: #99dfe2; --accent-soft: #223e40;
    --warm: #f0b35e; --warm-soft: #3b3022; --zh: #bac5c5;
    --shadow: 0 18px 50px rgba(0,0,0,.28); --shadow-soft: 0 8px 24px rgba(0,0,0,.22);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { scroll-behavior: smooth; scroll-padding-top: 90px; }
  body {
    min-height: 100vh; background: var(--bg); color: var(--ink);
    font: 16px/1.65 Inter, ui-sans-serif, system-ui, -apple-system, "Noto Sans SC", sans-serif;
    transition: background .2s, color .2s;
  }
  button, input, textarea { font: inherit; }
  button, a { -webkit-tap-highlight-color: transparent; }
  button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible {
    outline: 3px solid color-mix(in srgb, var(--accent) 35%, transparent); outline-offset: 2px;
  }
  .app { width: min(1280px, calc(100% - 48px)); margin: 0 auto; padding: 24px 0 100px; }
  .topbar {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    min-height: 42px; margin-bottom: 34px;
  }
  .brand {
    display: inline-flex; align-items: center; gap: 10px; color: var(--ink);
    font-weight: 800; letter-spacing: -.02em; text-decoration: none;
  }
  .brand-mark {
    display: grid; place-items: center; width: 30px; height: 30px; border-radius: 9px;
    background: var(--accent); color: #fff; font: 800 12px/1 ui-monospace, monospace;
  }
  .top-actions { display: flex; align-items: center; gap: 8px; }
  .icon-btn, .archive-link, .text-btn {
    min-height: 38px; border: 1px solid var(--line); border-radius: 12px;
    background: var(--surface); color: var(--ink-soft); cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; text-decoration: none;
  }
  .icon-btn { width: 38px; }
  .archive-link, .text-btn { gap: 7px; padding: 0 13px; font-size: 13px; font-weight: 700; }
  .hero { margin-bottom: 26px; }
  .eyebrow {
    color: var(--accent); font-size: 12px; font-weight: 800; letter-spacing: .12em;
    text-transform: uppercase; margin-bottom: 9px;
  }
  .hero h1 {
    max-width: 720px; font: 750 clamp(29px, 4vw, 50px)/1.08 ui-serif, Georgia, serif;
    letter-spacing: -.04em;
  }
  .hero-meta { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 13px; color: var(--ink-soft); font-size: 14px; }
  .hero-meta span { display: inline-flex; align-items: center; gap: 7px; }

  .study-grid { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: clamp(20px, 3.2vw, 48px); align-items: start; }
  .side {
    position: sticky; top: 16px; max-height: calc(100vh - 24px);
    display: flex; flex-direction: column; min-height: 0;
  }
  .study-panel {
    display: flex; flex-direction: column; gap: 16px; min-height: 0; max-height: calc(100vh - 24px);
    background: transparent; border: 0; box-shadow: none; overflow: visible;
  }
  .video-card {
    position: relative; flex: 0 0 auto; overflow: hidden; background: #071012;
    border-radius: 24px; box-shadow: var(--shadow-soft);
  }
  .player { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #071012; }
  .player iframe, .player video { position: absolute; inset: 0; display: block; width: 100%; height: 100%; border: 0; background: #071012; }
  .video-drag {
    display: none; position: absolute; z-index: 3; top: 0; left: 0; right: 36px; height: 32px;
    cursor: grab; touch-action: none;
    background: linear-gradient(to bottom, rgba(0,0,0,.5), transparent);
  }
  .video-drag:active { cursor: grabbing; }
  .video-float-close {
    display: none; border: 0; background: rgba(255,255,255,.14); color: #fff;
    width: 28px; height: 28px; border-radius: 50%; cursor: pointer;
  }
  .rail {
    display: flex; flex-direction: column; flex: 1; min-height: 0;
    padding: 18px 18px 16px; border: 1px solid var(--line); border-radius: 24px;
    background: var(--surface); box-shadow: var(--shadow-soft); overflow: hidden;
  }
  .rail-bar { padding: 0 0 12px; }
  .controls { display: flex; width: 100%; }
  .controls button {
    flex: 1; min-height: 40px; padding: 0 14px; border: 1px solid var(--line); border-radius: 12px;
    background: var(--surface-2); color: var(--ink-soft); cursor: pointer; font-size: 14px; font-weight: 750;
  }
  .controls button.on { border-color: var(--accent); background: var(--accent); color: #fff; }
  .hero-meta a { color: var(--accent); text-decoration: none; font-weight: 700; }
  .hero-meta a:hover { text-decoration: underline; }
  .topic-nav { flex: 1; min-height: 0; overflow-y: auto; padding: 0; scrollbar-gutter: stable; }
  .topic { border-top: 1px solid var(--line); }
  .topic:first-child { border-top: 0; }
  .topic > a {
    display: grid; grid-template-columns: 32px minmax(0,1fr); gap: 10px; align-items: start;
    padding: 11px 0; color: var(--ink); text-decoration: none;
  }
  .topic > a span {
    min-width: 0; padding-top: 5px;
    font: 650 15px/1.35 ui-serif, Georgia, serif; letter-spacing: -.015em;
  }
  .topic > a:hover span { color: var(--accent); }
  .topic b {
    display: grid; place-items: center; width: 32px; height: 32px; border-radius: 10px;
    background: var(--accent-soft); color: var(--accent-strong);
    font: 800 11px/1 ui-monospace, monospace;
  }
  .topic.on b { background: var(--accent); color: #fff; }
  .topic.on > a span { color: var(--accent-strong); }
  .topic-study { display: none; padding: 0 0 12px; }
  .topic.on .topic-study { display: block; }
  .topic-study .empty-study { color: var(--ink-soft); font-size: 13px; padding: 6px 0; }
  .study-tabs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-top: 2px; }
  .study-tabs.n2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .study-tabs.n1 { grid-template-columns: 1fr; }
  .stab {
    min-height: 32px; padding: 0 6px; border: 1px solid var(--line); border-radius: 11px;
    background: var(--surface-2); color: var(--ink-soft); cursor: pointer;
    font-size: 12px; font-weight: 750;
  }
  .stab:hover { border-color: var(--accent); color: var(--accent-strong); }
  .stab.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-strong); }
  .spane { display: none; margin-top: 6px; }
  .spane.on { display: block; }
  .vrow {
    display: grid; grid-template-columns: minmax(0,1fr) 28px; gap: 8px; align-items: start;
    padding: 10px 0; border-top: 1px dashed var(--line);
  }
  .vrow .vw { color: var(--ink); font: 750 14.5px/1.35 ui-serif, Georgia, serif; }
  .vrow .vz { margin-top: 4px; color: var(--accent-strong); font-size: 13.5px; }
  .vrow .vex { margin-top: 6px; color: var(--ink-soft); font-size: 13px; font-style: italic; }
  .vadd {
    width: 28px; height: 28px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--surface); color: var(--accent-strong); cursor: pointer;
    font: 700 18px/1 ui-sans-serif, system-ui;
  }
  .vadd:hover { border-color: var(--accent); background: var(--accent-soft); }
  .rail-note { margin: 0; padding: 10px 0; color: var(--ink-soft); font-size: 13.5px; line-height: 1.7; }
  .rail-note + .rail-note { border-top: 1px dashed var(--line); }
  .rail-note strong { display: block; margin-bottom: 4px; color: var(--ink); font: 750 14.5px/1.35 ui-serif, Georgia, serif; }
  .rail-note i { display: block; margin-bottom: 6px; }
  @media (min-width: 841px) { .article-extras { display: none; } }

  .reader { min-width: 0; }
  .first-run {
    display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 16px; align-items: start;
    margin-bottom: 16px; padding: 16px 18px; border: 1px solid var(--line); border-radius: 16px;
    background: var(--accent-soft); color: var(--ink-soft); font-size: 13.5px;
  }
  .first-run[hidden] { display: none; }
  .first-run strong { display: block; margin-bottom: 3px; color: var(--accent-strong); }
  .first-run button { border: 0; background: transparent; color: var(--ink-soft); cursor: pointer; font-weight: 800; }
  .legend { color: var(--ink-soft); }
  article {
    scroll-margin-top: 24px; margin-bottom: 22px; padding: clamp(22px, 4vw, 38px);
    border: 1px solid var(--line); border-radius: 24px; background: var(--surface);
    box-shadow: var(--shadow-soft);
  }
  .n-head { display: grid; grid-template-columns: 42px minmax(0,1fr); gap: 13px; align-items: start; margin-bottom: 24px; }
  .n-idx {
    display: grid; place-items: center; width: 42px; height: 42px; border-radius: 13px;
    background: var(--accent-soft); color: var(--accent-strong); font: 800 13px/1 ui-monospace, monospace;
  }
  .n-head h2, .h-zh {
    padding-top: 3px;
    color: var(--ink);
    font: 750 clamp(21px, 3vw, 28px)/1.25 ui-serif, Georgia, "Noto Serif CJK SC", "Noto Serif SC", serif;
    letter-spacing: -.025em;
  }
  .h-zh { margin-top: 6px; padding-top: 0; }
  .para { display: flex; flex-direction: column; align-items: stretch; margin-bottom: 22px; }
  .para:last-child { margin-bottom: 8px; }
  .sent {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    width: 100%;
    min-width: 0;
    margin: 0 0 0.8em;
  }
  .sent[data-start] { cursor: pointer; }
  .de {
    max-width: 100%;
    font: var(--reader-size, 18.5px)/1.55 ui-serif, Georgia, "Noto Serif", serif;
    letter-spacing: .003em;
  }
  .de w {
    cursor: pointer; border-radius: 4px; transition: background .12s, color .12s;
    text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px;
    text-decoration-color: transparent;
  }
  .de w:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; background: var(--accent-soft); }
  .de w:hover, .de w:active { background: var(--warm-soft); text-decoration-color: var(--warm); }
  .de w.known { text-decoration-color: color-mix(in srgb, var(--accent) 55%, transparent); }
  .de w.ed { text-decoration-style: solid; text-decoration-thickness: 1.5px; }
  .de w.wiki { text-decoration-style: dotted; text-decoration-color: color-mix(in srgb, var(--ink-soft) 55%, transparent); }
  .de w.saved { color: var(--accent-strong); background: var(--accent-soft); text-decoration-color: transparent; }
  .sent.now .de {
    background: color-mix(in srgb, var(--accent-soft) 70%, transparent);
    border-radius: 4px;
  }
  .zh {
    margin-top: 3px;
    width: 100%;
    max-width: 100%;
    color: var(--ink);
    font: 400 15.5px/1.45 Inter, ui-sans-serif, "Noto Sans SC", sans-serif;
  }
  body.hide-zh .zh { display: none; }
  body.hide-zh .para { display: block; }
  body.hide-zh .sent { display: inline; width: auto; margin: 0 0.45em 0 0; }
  body.hide-zh .sent .de { display: inline; line-height: 1.82; }
  .n-head .h-zh {
    margin-top: 6px;
    padding-top: 0;
    color: var(--ink);
    font: 750 clamp(21px, 3vw, 28px)/1.25 ui-serif, Georgia, "Noto Serif CJK SC", "Noto Serif SC", serif;
    letter-spacing: -.025em;
  }
  .article-extras details { margin-top: 10px; border: 1px solid var(--line); border-radius: 13px; background: var(--surface-2); }
  .article-extras details summary {
    list-style: none; cursor: pointer; padding: 12px 14px; color: var(--ink-soft);
    display: flex; align-items: center; gap: 9px; font-size: 13px; font-weight: 750;
  }
  .article-extras details summary::before {
    content: "+"; display: inline-grid; place-items: center; width: 20px; height: 20px;
    border-radius: 7px; background: var(--surface); color: var(--accent); font-size: 14px;
  }
  .article-extras details[open] summary::before { content: "−"; }
  .article-extras details summary::-webkit-details-marker { display: none; }
  .article-extras details .body { padding: 2px 14px 15px 43px; color: var(--ink-soft); font-size: 13.5px; line-height: 1.75; }
  .article-extras details .body strong { color: var(--ink); }
  .vcard { display: grid; grid-template-columns: minmax(0,1fr) 28px; gap: 8px; align-items: start; padding: 10px 0; border-bottom: 1px dashed var(--line); }
  .vcard:last-child { border-bottom: 0; }
  .gcard { padding: 12px 0; border-bottom: 1px dashed var(--line); }
  .gcard:last-child { border-bottom: 0; }
  .vcard-top, .gcard h4 { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px; font: 750 14.5px/1.35 ui-serif, Georgia, serif; color: var(--ink); }
  .article-extras .vadd {
    width: 28px; height: 28px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--surface); color: var(--accent-strong); cursor: pointer;
    font: 700 18px/1 ui-sans-serif, system-ui;
  }
  .vpos { color: var(--ink-soft); font: 750 11px/1.2 ui-sans-serif, system-ui; letter-spacing: .06em; text-transform: uppercase; }
  .vzh { margin-top: 4px; color: var(--accent-strong); font-size: 13.5px; }
  .vex, .gex { margin-top: 6px; color: var(--ink-soft); font-size: 13px; font-style: italic; }
  .gexzh { color: var(--zh); font-size: 12.5px; }
  .gmore { margin-top: 8px; color: var(--ink-soft); font-size: 13px; }
  .bg-note { margin: 0 0 8px; color: var(--ink-soft); font-size: 12px; }

  .scrim { position: fixed; inset: 0; z-index: 55; display: none; background: rgba(7,16,18,.48); backdrop-filter: blur(3px); }
  .scrim.on { display: block; }
  #pop {
    position: fixed; z-index: 70; display: none; width: min(360px, calc(100vw - 24px));
    border: 1px solid var(--line); border-radius: 18px; padding: 18px;
    background: var(--surface); color: var(--ink); box-shadow: var(--shadow);
  }
  #pop.open { display: block; }
  .pop-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  #pop .pw { font: 750 21px/1.2 ui-serif, Georgia, serif; word-break: break-word; }
  #pop .pp { margin-top: 3px; color: var(--ink-soft); font-size: 11px; font-weight: 750; letter-spacing: .08em; text-transform: uppercase; }
  #pop .pclose { border: 0; background: var(--surface-2); color: var(--ink-soft); width: 30px; height: 30px; border-radius: 9px; cursor: pointer; }
  #pop .pz { margin-top: 12px; color: var(--accent-strong); font-weight: 700; }
  #pop .pz:empty::after { content: "还没有释义，你可以自己补充"; color: var(--ink-soft); font-weight: 400; }
  #pop .pe { margin-top: 9px; padding-top: 9px; border-top: 1px solid var(--line); color: var(--ink-soft); font-size: 12.5px; font-style: italic; }
  .pop-actions { display: flex; gap: 8px; margin-top: 14px; }
  .pbtn, .secondary-btn, .primary-btn {
    min-height: 40px; border-radius: 11px; padding: 0 13px; cursor: pointer; font-size: 13px; font-weight: 750;
  }
  .pbtn { flex: 1; border: 1px solid var(--accent); background: var(--accent); color: #fff; }
  .pbtn.in { border-color: var(--line); background: var(--surface-2); color: var(--ink-soft); }
  .secondary-btn { border: 1px solid var(--line); background: var(--surface); color: var(--ink-soft); }
  .primary-btn { border: 1px solid var(--accent); background: var(--accent); color: #fff; }
  .word-form { display: grid; gap: 11px; }
  .word-form label { display: grid; gap: 5px; color: var(--ink-soft); font-size: 12px; font-weight: 700; }
  .word-form input, .word-form textarea {
    width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px;
    background: var(--surface-2); color: var(--ink); resize: vertical;
  }
  .word-form textarea { min-height: 66px; }
  .form-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 3px; }

  #basket-btn {
    position: fixed; right: 22px; bottom: max(22px, env(safe-area-inset-bottom)); z-index: 45;
    display: inline-flex; align-items: center; gap: 9px; min-height: 48px; padding: 0 18px;
    border: 0; border-radius: 15px; background: var(--ink); color: var(--surface);
    box-shadow: var(--shadow); cursor: pointer; font-weight: 800;
  }
  #basket-btn .cnt { min-width: 23px; padding: 2px 7px; border-radius: 99px; background: var(--warm); color: #172127; font-size: 12px; }
  #basket {
    position: fixed; inset: 0 0 0 auto; z-index: 65; width: min(440px, 100vw);
    display: flex; flex-direction: column; padding: 24px 24px calc(24px + env(safe-area-inset-bottom));
    background: var(--surface); box-shadow: -20px 0 60px rgba(7,16,18,.18);
    transform: translateX(105%); transition: transform .22s ease;
  }
  #basket.open { transform: translateX(0); }
  #basket .bhead { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 16px; }
  #basket .bhead h3 { font-size: 22px; letter-spacing: -.02em; }
  #basket .bhead p { margin-top: 2px; color: var(--ink-soft); font-size: 12.5px; }
  #basket .bclose { border: 0; background: var(--surface-2); color: var(--ink-soft); width: 36px; height: 36px; border-radius: 11px; font-size: 20px; cursor: pointer; }
  .basket-add { width: 100%; margin-bottom: 12px; }
  #basket .blist { overflow-y: auto; flex: 1; padding-right: 4px; }
  .bitem { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 5px 10px; padding: 13px 0; border-bottom: 1px solid var(--line); }
  .bitem .bw { font: 750 16px/1.3 ui-serif, Georgia, serif; }
  .bitem .bz { grid-column: 1; color: var(--accent-strong); font-size: 13px; }
  .bitem .be { grid-column: 1; overflow: hidden; color: var(--ink-soft); font-size: 11.5px; text-overflow: ellipsis; white-space: nowrap; }
  .bitem-actions { grid-column: 2; grid-row: 1 / span 3; align-self: center; display: flex; gap: 3px; }
  .bitem-actions button { border: 0; background: transparent; color: var(--ink-soft); padding: 7px; cursor: pointer; font-size: 12px; }
  .bitem-actions .bx { color: var(--danger); }
  #basket .bfoot { display: flex; gap: 8px; margin-top: 14px; }
  #basket .bfoot button { flex: 1; }
  #basket .bfoot button:disabled { opacity: .5; cursor: wait; }
  #basket .bstatus { min-height: 18px; margin-top: 8px; color: var(--ink-soft); text-align: center; font-size: 12px; }
  .bempty { padding: 42px 14px; color: var(--ink-soft); text-align: center; font-size: 13px; }
  .bempty b { display: block; margin-bottom: 5px; color: var(--ink); font-size: 15px; }
  #word-editor {
    display: none; padding: 15px; margin-bottom: 12px; border: 1px solid var(--line);
    border-radius: 14px; background: var(--surface-2);
  }
  #word-editor.open { display: block; }
  #toast {
    position: fixed; left: 50%; bottom: 28px; z-index: 90; display: none;
    transform: translateX(-50%); padding: 10px 16px; border-radius: 12px;
    background: var(--ink); color: var(--surface); box-shadow: var(--shadow); font-size: 13px; font-weight: 700;
  }
  @media (max-width: 840px) {
    .app { width: min(100% - 28px, 720px); padding-top: 15px; padding-left: max(14px, env(safe-area-inset-left)); padding-right: max(14px, env(safe-area-inset-right)); }
    .topbar { margin-bottom: 24px; }
    .study-grid { display: block; }
    .side { position: static; max-height: none; margin-bottom: 18px; }
    .study-panel { display: contents; max-height: none; }
    .video-card { border-radius: 20px; box-shadow: var(--shadow); }
    .rail {
      position: sticky; top: env(safe-area-inset-top); z-index: 30; margin: 10px 0 18px; padding: 8px 12px;
      border-radius: 20px;
    }
    .rail-bar { padding: 0; }
    .topic-nav { display: none; }
    .video-card.floating {
      position: fixed; z-index: 48; top: 72px; right: 10px; left: auto; width: min(48vw, 210px);
      border: 1px solid rgba(255,255,255,.2); border-radius: 14px; box-shadow: 0 18px 45px rgba(0,0,0,.28);
    }
    .video-card.floating .video-drag { display: block; }
    .video-card.floating .video-float-close { display: block; position: absolute; z-index: 4; top: 6px; right: 6px; }
    .video-card.float-off { display: none; }
    article { border-radius: 20px; }
  }
  @media (max-width: 560px) {
    .app { width: 100%; padding: 12px 12px 88px; padding-left: max(12px, env(safe-area-inset-left)); padding-right: max(12px, env(safe-area-inset-right)); }
    .brand span:last-child { display: none; }
    .text-btn { padding: 0 10px; font-size: 12px; }
    .archive-link { width: 38px; padding: 0; font-size: 0; }
    .archive-link svg { width: 17px; }
    .hero { padding: 0 5px; margin-bottom: 18px; }
    .hero h1 { font-size: 30px; }

<script>
const DATA = {"date": "2026-08-25", "slug": "2026-08-25-20uhr", "source": "20uhr", "source_label": "T-64 · tagesschau 20:00 Uhr", "source_short": "20:00 Uhr", "video_page": "https://www.tagesschau.de/tagesschau_20_uhr/video-1637290.html", "embed_url": "https://www.tagesschau.de/tagesschau_20_uhr/video-1637290~player.html", "mp4_url": "https://tagesschau-progressive.ard-mcdn.de/video/2026/0825/TV-20260825-2020-5100.webl.h264.mp4", "duration": 931.56, "news": [{"title": "Kabinett berät bei Klausurtagung über Wege aus Wirtschaftskrise und Klimastreit", "title_zh": "内阁闭门务虚会：商讨摆脱经济危机与气候之争的出路", "paras": [{"start": 14.88, "end": 49.64, "lines": [{"de": "Heute im Studio: Susanne Daubner.", "zh": "今天演播室主持：苏珊妮·道布纳。", "start": 14.88, "end": 17.32}, {"de": "Guten Abend, ich begrüße Sie zur tagesschau.", "zh": "晚上好，欢迎收看今日新闻。", "start": 18.36, "end": 21.48}, {"de": "Das Gruppenbild soll die gute Atmosphäre zeigen, bei der Klausur der Bundesregierung.", "zh": "这张合影意在显示联邦政府闭门会议上的良好气氛。", "start": 22.56, "end": 27.84}, {"de": "Kanzler Merz trifft sich heute und morgen mit seinem Kabinett im Schloss Neuhardenberg in Brandenburg.", "zh": "总理默茨今天和明天与他的内阁在勃兰登堡州的诺伊哈登贝格宫会面。", "start": 27.92, "end": 34.0}, {"de": "Die politische Sommerpause ist vorbei.", "zh": "政治夏季休会结束了。", "start": 34.12, "end": 36.36}, {"de": "Jetzt soll es um die geplanten Reformen für den Herbst gehen, besonders bei der Rente und der Pflege.", "zh": "现在要讨论的是秋季计划推行的改革，尤其是养老金和护理。", "start": 36.44, "end": 42.64}, {"de": "Für Merz sind die Sozialreformen Voraussetzung dafür, dass die Wirtschaft wachsen kann.", "zh": "对默茨来说，社会改革是经济能够增长的前提。", "start": 42.72, "end": 47.84}, {"de": "Er will aufs Tempo drücken.", "zh": "他想加快节奏。", "start": 47.92, "end": 49.64}]}, {"start": 50.6, "end": 107.64, "lines": [{"de": "Idylle im Schloss Neuhardenberg, gut 70 km von Berlin, soll Merz und seinem Kabinett helfen, nach dem Sommer wieder zu starten.", "zh": "诺伊哈登贝格宫的宜人景致——距柏林约70公里——应该能帮助默茨和他的内阁在休假之后重新出发。", "start": 50.6, "end": 58.88}, {"de": "Manche hier sind mit neuen Aufgaben dabei, wie Verkehrsminister Bilger oder Kanzleramtschefin Warken.", "zh": "这里有些人带着新任务而来，比如交通部长比尔格和总理府部长瓦肯。", "start": 58.96, "end": 65.04}, {"de": "Die Stimmung der Regierung: Die wird gleich noch besser.", "zh": "政府此刻的心情：马上还会更好。", "start": 65.12, "end": 69.36}, {"de": "Das Schloss soll Ort für eine Arbeitsklausur sein.", "zh": "这座宫殿将是一场工作务虚会的举办地。", "start": 70.4, "end": 74.04}, {"de": "Sie wollen mit Schwung rauskommen, die Wirtschaft ankurbeln, Arbeitsplätze sichern.", "zh": "他们想带着冲劲出场，提振经济，保住工作岗位。", "start": 74.12, "end": 79.88}, {"de": "Eine einheitliche Linie will die Regierung finden: Bei der Einkommensteuer-Reform oder wie man der Wirtschaft helfen kann.", "zh": "政府想找到一条统一路线：在所得税改革上，或者在如何帮助经济的问题上。", "start": 79.96, "end": 87.32}, {"de": "Der Kanzler unter Druck.", "zh": "总理正处于压力之下。", "start": 87.4, "end": 90.12}, {"de": "Er will mehr Tempo.", "zh": "他想要更快的节奏。", "start": null, "end": null}, {"de": "Dazu gehört, dass wir die richtigen Prioritäten setzen, dass wir das Tempo erhöhen, dass wir Entscheidungen treffen.", "zh": "这包括我们要设定正确的优先事项、加快速度、做出决定。", "start": 91.24, "end": 99.56}, {"de": "Dass wir diskutieren, debattieren, wo notwendig streiten, aber am Ende des Tages Entscheidungen treffen.", "zh": "我们要讨论、辩论、必要时争论，但一天结束时要把决定做出来。", "start": 99.64, "end": 107.64}]}, {"start": 108.4, "end": 159.6, "lines": [{"de": "Ein Konfliktthema: die Rentenreform.", "zh": "一个争议话题：养老金改革。", "start": 108.4, "end": 110.76}, {"de": "Man hatte sich geeinigt auf das Ende der abschlagsfreien Rente nach 45 Jahren.", "zh": "此前已就取消“缴满45年免扣减退休”达成一致。", "start": 110.84, "end": 116.32}, {"de": "Vor allem von ostdeutschen Ministerpräsidenten kommt Widerstand.", "zh": "抵制主要来自东部的州长们。", "start": 116.4, "end": 120.24}, {"de": "Die Arbeitsministerin warnt, dass es zu keiner Reform kommt.", "zh": "劳工部长警告，那样就根本不会有改革。", "start": 120.32, "end": 125.08}, {"de": "Das eint uns bei den Parteien, wir sagen, wir brauchen eine Rentenreform.", "zh": "这一点让我们各党团结一致，我们说，我们需要养老金改革。", "start": 125.4, "end": 130.52}, {"de": "Wie die aussehen könnte: noch offen.", "zh": "它会长什么样：尚无定论。", "start": 131.0, "end": 133.64}, {"de": "Das Kabinett tauscht sich auch mit der Wirtschaft aus, verspricht Bürokratie abzubauen.", "zh": "内阁也在与经济界交流，承诺削减官僚程序。", "start": 133.96, "end": 139.28}, {"de": "Beim Thema KI wolle man aufholen, erklärt der Digitalminister.", "zh": "数字事务部长表示，在人工智能议题上想追赶上来。", "start": 139.36, "end": 143.52}, {"de": "Die Amerikaner sind enteilt, und die Chinesen.", "zh": "美国人已经绝尘而去，中国人也是。", "start": 145.04, "end": 148.44}, {"de": "Aber die Chinesen haben auch mit weniger Ressourcen aufgeholt.", "zh": "但中国人用更少的资源也赶了上来。", "start": 148.52, "end": 152.2}, {"de": "Warum soll das Europa und Deutschland nicht gelingen?", "zh": "这为什么在欧洲、在德国就办不到呢？", "start": 152.28, "end": 155.4}, {"de": "Bis morgen Mittag will das Kabinett über neue Strategien diskutieren.", "zh": "内阁想在明天中午前讨论出新战略。", "start": 155.48, "end": 159.6}]}, {"start": 160.72, "end": 263.16, "lines": [{"de": "Markus Preiß beobachtet die Klausur.", "zh": "马库斯·普赖斯全程关注着这次务虚会。", "start": 160.72, "end": 163.12}, {"de": "Nach der Sommerpause versucht die Bundesregierung einen Neustart.", "zh": "夏季休会后，联邦政府尝试来一次重新出发。", "start": 163.24, "end": 168.44}, {"de": "Wie realistisch ist das?", "zh": "这有多现实？", "start": 168.52, "end": 170.48}, {"de": "Da ist viel Hoffnung mit dabei.", "zh": "其中掺杂着许多希望。", "start": 176.64, "end": 178.84}, {"de": "Eine Art politische Selbstbeschwörung.", "zh": "有点像一种政治上的自我打气。", "start": 179.44, "end": 182.08}, {"de": "Man sagt sich noch mal, wie gut man sich versteht.", "zh": "大家彼此再确认一遍，相互处得有多好。", "start": 183.12, "end": 186.64}, {"de": "Man hat sich hier vor Augen geführt, dass die Landtagswahl im Osten Erschütterungen bringen wird.", "zh": "与会者在这里清醒地看到，东部的州议会选举将带来震荡。", "start": 190.32, "end": 259.24}, {"de": "Man hat sich vorgenommen, Kurs zu halten.", "zh": "大家下定决心稳住航向。", "start": null, "end": null}, {"de": "Man möchte spätestens im Herbst umsetzen, was man vor dem Sommer verabredet hat.", "zh": "最迟在秋天，要把夏天之前谈妥的事情付诸实施。", "start": null, "end": null}, {"de": "Der Kanzler äußerte sich auch zum Drohnenvorfall am Flughafen Leipzig.", "zh": "总理也谈到了莱比锡机场的无人机事件。", "start": null, "end": null}, {"de": "Was hat er gesagt?", "zh": "他说了什么？", "start": null, "end": null}, {"de": "Es geht um den mutmaßlichen Anschlag auf ukrainische Transportmaschinen.", "zh": "这涉及针对乌克兰运输机的疑似袭击。", "start": null, "end": null}, {"de": "Der Kanzler ist sehr deutlich geworden.", "zh": "总理的表态非常明确。", "start": null, "end": null}, {"de": "Er hat vor einem Angriff gesprochen und dass Deutschland bedroht sei.", "zh": "他说这是一次袭击，并说德国受到了威胁。", "start": null, "end": null}, {"de": "Er hat gesagt, die Angreifer würden einen Preis bezahlen müssen.", "zh": "他说，攻击者将不得不付出代价。", "start": null, "end": null}, {"de": "In Kürze werde die Bundesregierung eine Zuordnung machen.", "zh": "联邦政府不久后将给出归属认定。", "start": null, "end": null}, {"de": "Bisher hat Innenminister Dobrindt nur gesagt, dass fremde Mächte dahinter stecken können.", "zh": "到目前为止，内政部长德布林特只是说，背后可能有外国势力。", "start": null, "end": null}, {"de": "Vieles deutet auf Russland hin.", "zh": "许多迹象指向俄罗斯。", "start": null, "end": null}, {"de": "Es wird diplomatisch heikel.", "zh": "这在外交上会变得棘手。", "start": null, "end": null}, {"de": "Vielen Dank, Markus Preiß.", "zh": "谢谢你，马库斯·普赖斯。", "start": 261.32, "end": 263.16}]}], "vocab": [{"lemma": "die Klausur, -en", "key": "klausur", "forms": ["Klausur", "Arbeitsklausur"], "pos": "Substantiv", "zh": "闭门会议，务虚会", "example_de": "Das Gruppenbild soll die gute Atmosphäre zeigen, bei der Klausur der Bundesregierung.", "example_zh": ""}, {"lemma": "aufs Tempo drücken", "key": "tempo-druecken", "forms": ["aufs Tempo drücken"], "pos": "Redewendung", "zh": "加快节奏，提速", "example_de": "Er will aufs Tempo drücken.", "example_zh": ""}, {"lemma": "die Rente, -n", "key": "rente", "forms": ["Rente", "Rentenreform"], "pos": "Substantiv", "zh": "养老金，退休金", "example_de": "Jetzt soll es um die geplanten Reformen für den Herbst gehen, besonders bei der Rente und der Pflege.", "example_zh": ""}, {"lemma": "der Widerstand", "key": "widerstand", "forms": ["Widerstand"], "pos": "Substantiv", "zh": "抵制，阻力", "example_de": "Vor allem von ostdeutschen Ministerpräsidenten kommt Widerstand.", "example_zh": ""}, {"lemma": "die Bürokratie", "key": "buerokratie", "forms": ["Bürokratie"], "pos": "Substantiv", "zh": "官僚主义，行政繁文缛节", "example_de": "Das Kabinett tauscht sich auch mit der Wirtschaft aus, verspricht Bürokratie abzubauen.", "example_zh": ""}, {"lemma": "aufholen", "key": "aufholen", "forms": ["aufgeholt", "aufholen"], "pos": "Verb", "zh": "赶上，追回差距", "example_de": "Beim Thema KI wolle man aufholen, erklärt der Digitalminister.", "example_zh": ""}, {"lemma": "die Zuordnung, -en", "key": "zuordnung", "forms": ["Zuordnung"], "pos": "Substantiv", "zh": "归属认定，归类", "example_de": "In Kürze werde die Bundesregierung eine Zuordnung machen.", "example_zh": ""}, {"lemma": "heikel", "key": "heikel", "forms": ["heikel"], "pos": "Adjektiv", "zh": "棘手的，微妙的", "example_de": "Es wird diplomatisch heikel.", "example_zh": ""}], "grammar_points": [{"title": "würden + Infinitiv：间接引语里的第二虚拟式", "summary": "转述别人的话时用 würde-虚拟式，表示这是未经证实的转述，而非记者自己的断言。", "example_de": "Er hat gesagt, die Angreifer würden einen Preis bezahlen müssen.", "example_zh": "他说，攻击者将不得不付出代价。"}, {"title": "sich äußern zu + Dat.（zum = zu dem）", "summary": "sich äußern 反身表示“表态、发表意见”，固定接 zu 支配第三格；zum 是 zu dem 的缩写。", "example_de": "Der Kanzler äußerte sich auch zum Drohnenvorfall am Flughafen Leipzig.", "example_zh": "总理也就莱比锡机场的无人机事件表了态。"}], "background": "夏季休会（Sommerpause）结束后，联邦政府惯例举行两天闭门务虚会（Klausur），集中敲定下半年的立法重点；诺伊哈登贝格宫位于柏林以东约70公里，是政府常用的会议地点。本期焦点之一是联盟协议中已约定的养老金改革——取消“缴费45年后免扣减提前退休”——在东部各州州长中遇到阻力；会议还涉及与经济界的对话、减官僚和在人工智能上追赶中美的问题。"}, {"title": "Offenbar weitere Drohne mit Sprengstoff bei Vorfall in Leipzig entdeckt", "title_zh": "莱比锡事件中据称又发现一架携带炸药的无人机", "paras": [{"start": 265.8, "end": 301.28, "lines": [{"de": "Inzwischen ist bekannt geworden: Der Drohnenvorfall vor drei Wochen war wohl schwerwiegender als bislang angenommen.", "zh": "现在已知：三周前的无人机事件，恐怕比此前认为的更严重。", "start": 265.8, "end": 273.16}, {"de": "Das berichten NDR, WDR und Süddeutsche Zeitung unter Berufung auf die Ermittler.", "zh": "北德广播电台、西德广播电台和《南德意志报》援引调查人员报道了这一消息。", "start": 273.28, "end": 278.12}, {"de": "Eine Drohne mit Sprengstoff war auf dem Flughafen zwischen ukrainischen Frachtmaschinen entdeckt worden.", "zh": "一架携带炸药的无人机，当时在机场的乌克兰货运飞机之间被发现。", "start": 278.24, "end": 285.92}, {"de": "Eine zweite könnte mit einem DHL-Flugzeug kollidiert sein.", "zh": "第二架据称可能与一架DHL飞机相撞。", "start": 286.04, "end": 289.52}, {"de": "Eine dritte Drohne, das war bislang unbekannt, soll Tage danach auf einem nahen Feld gefunden worden sein.", "zh": "第三架无人机——这一点此前无人知晓——据说在几天后被发现于附近一块田里。", "start": 289.6, "end": 297.32}, {"de": "Dort sei eine explosive Substanz entdeckt worden.", "zh": "据称在那里发现了一种爆炸性物质。", "start": 297.4, "end": 301.28}]}], "vocab": [{"lemma": "schwerwiegend", "key": "schwerwiegend", "forms": ["schwerwiegender", "schwerwiegend"], "pos": "Adjektiv", "zh": "严重的，影响深远的", "example_de": "Inzwischen ist bekannt geworden: Der Drohnenvorfall vor drei Wochen war wohl schwerwiegender als bislang angenommen.", "example_zh": ""}, {"lemma": "unter Berufung auf", "key": "unter-berufung", "forms": ["unter Berufung auf"], "pos": "Präpositionale Fügung", "zh": "援引……（的消息）", "example_de": "Das berichten NDR, WDR und Süddeutsche Zeitung unter Berufung auf die Ermittler.", "example_zh": ""}, {"lemma": "die Drohne, -n", "key": "drohne", "forms": ["Drohne", "Drohnenvorfall"], "pos": "Substantiv", "zh": "无人机", "example_de": "Inzwischen ist bekannt geworden: Der Drohnenvorfall vor drei Wochen war wohl schwerwiegender als bislang angenommen.", "example_zh": ""}, {"lemma": "der Sprengstoff, -e", "key": "sprengstoff", "forms": ["Sprengstoff"], "pos": "Substantiv", "zh": "炸药，爆炸物", "example_de": "Eine Drohne mit Sprengstoff war auf dem Flughafen zwischen ukrainischen Frachtmaschinen entdeckt worden.", "example_zh": ""}, {"lemma": "kollidieren", "key": "kollidieren", "forms": ["kollidiert", "kollidieren"], "pos": "Verb", "zh": "相撞，碰撞", "example_de": "Eine zweite könnte mit einem DHL-Flugzeug kollidiert sein.", "example_zh": ""}, {"lemma": "bislang", "key": "bislang", "forms": ["bislang"], "pos": "Adverb", "zh": "迄今为止", "example_de": "Inzwischen ist bekannt geworden: Der Drohnenvorfall vor drei Wochen war wohl schwerwiegender als bislang angenommen.", "example_zh": ""}, {"lemma": "die Substanz, -en", "key": "substanz", "forms": ["Substanz"], "pos": "Substantiv", "zh": "物质", "example_de": "Dort sei eine explosive Substanz entdeckt worden.", "example_zh": ""}], "grammar_points": [{"title": "war + Partizip II + worden：过去完成时的被动", "summary": "sein 的过去式 war + 过去分词 + worden，表示“在那之前已经被做过了”，新闻里常用来交代早前发生的事。", "example_de": "Eine Drohne mit Sprengstoff war auf dem Flughafen zwischen ukrainischen Frachtmaschinen entdeckt worden.", "example_zh": "一架携带炸药的无人机此前已在机场被发现。"}, {"title": "Konjunktiv I（sei / sei ... worden）：新闻转述", "summary": "记者转述调查方或官方的说法时用第一虚拟式（sei、habe、sei ... worden），表明内容来自他人，媒体自己不加背书。", "example_de": "Dort sei eine explosive Substanz entdeckt worden.", "example_zh": "据称在那里发现了一种爆炸性物质。"}], "background": "三周前（8月初），莱比锡机场停机坪上两架乌克兰安东诺夫货运飞机疑遭装载炸药的无人机袭击，联邦总检察院已接手调查；内政部长德布林特此前表示背后可能有“外国势力”，多个线索指向俄罗斯。今天 NDR、WDR 和《南德意志报》的联合调查披露：除了已知的两架，几天后在附近田里还发现了第三架无人机，其上据称有爆炸物——事件规模比官方此前承认的更大。"}, {"title": "Krise bei Volkswagen: VW-Chef Blume stellt Konzernumbaupläne vor", "title_zh": "大众危机：集团CEO布卢姆公布重组计划", "paras": [{"start": 304.44, "end": 334.6, "lines": [{"de": "VW-Chef Blume will Europas größten Autokonzern umbauen.", "zh": "大众集团首席执行官布卢姆想对这家欧洲最大的汽车集团进行重组。", "start": 304.44, "end": 308.2}, {"de": "Ziel sei es, die Strukturen zu verschlanken und die Kosten zu senken.", "zh": "目标是精简架构、降低成本。", "start": 310.0, "end": 314.48}, {"de": "Es geht um den Abbau Tausender Stellen.", "zh": "这涉及裁撤数千个岗位。", "start": 314.56, "end": 316.88}, {"de": "Werksschließungen bezeichnete Blume als letztes Mittel, das er vermeiden wolle.", "zh": "布卢姆称关闭工厂是他想避免的最后手段。", "start": 316.96, "end": 321.68}, {"de": "Auf Betriebsversammlungen an neun VW-Standorten stellt der Vorstand Sparmaßnahmen vor.", "zh": "在大众九个所在地的职工大会上，董事会将公布节省措施。", "start": 321.76, "end": 327.68}, {"de": "Den Auftakt machte Blume heute im Stammwerk in Wolfsburg.", "zh": "今天布卢姆在沃尔夫斯堡总部工厂拉开了序幕。", "start": 330.6, "end": 334.6}]}, {"start": 338.32, "end": 409.08, "lines": [{"de": "Schichtwechsel am VW-Stammwerk in Wolfsburg.", "zh": "沃尔夫斯堡大众总部工厂的换班时刻。", "start": 338.32, "end": 341.32}, {"de": "Die Stimmung ist angespannt nach der Betriebsversammlung.", "zh": "职工大会之后，气氛紧张。", "start": 341.4, "end": 345.24}, {"de": "Es war sehr emotional.", "zh": "大会非常情绪化。", "start": 346.48, "end": 348.32}, {"de": "Hoffentlich erfahren wir mehr bei der nächsten Betriebsversammlung.", "zh": "但愿我们在下一次职工大会上能知道更多。", "start": 349.24, "end": 353.36}, {"de": "Konkrete Details zum Personalabbau nennt der VW-Vorstandsvorsitzende Blume heute in Wolfsburg nicht.", "zh": "关于裁员的具体细节，大众董事会主席布卢姆今天在沃尔夫斯堡并没有公布。", "start": 353.68, "end": 360.32}, {"de": "Vor der aufgebrachten Belegschaft betont er die Notwendigkeit von Einsparungen.", "zh": "面对情绪激动的员工队伍，他强调节省开支的必要性。", "start": 360.4, "end": 365.16}, {"de": "Und zeigt sich offen für Gespräche.", "zh": "并表示愿意对话。", "start": 365.24, "end": 367.68}, {"de": "Schließungen will auch Niedersachsens Ministerpräsident Lies vermeiden.", "zh": "下萨克森州州长利斯也想避免关闭工厂。", "start": 377.0, "end": 381.36}, {"de": "Gestern im Werk Hannover beriet er sich mit Betriebsrat und Vertrauenspersonen.", "zh": "昨天他在汉诺威工厂与职工委员会和信任人士进行了商议。", "start": 381.44, "end": 386.12}, {"de": "Dass sich VW neu strukturieren muss, sei auch der Belegschaft klar, so die Betriebsratsvorsitzende: der schwierigen Lage in der Automobilindustrie nachzukommen und wettbewerbsfähige Produkte zu produzieren, dabei aber an jedem Standort eine Zukunftsperspektive zu generieren.", "zh": "大众必须重新调整结构，这一点员工们也清楚，职工委员会主席说：去应对汽车工业的困境、生产有竞争力的产品，同时也要为每个所在地创造出一条未来前景。", "start": 386.2, "end": 409.08}]}, {"start": 410.6, "end": 445.64, "lines": [{"de": "Neben Wolfsburg wird es bis Montag an acht weiteren Standorten Versammlungen geben.", "zh": "除了沃尔夫斯堡，到周一之前还将在其他八个所在地举行大会。", "start": 410.6, "end": 415.96}, {"de": "Darunter Werke wie Emden, Hannover und Zwickau, die möglicherweise schließen müssen.", "zh": "其中包括埃姆登、汉诺威和茨维考等可能不得不关闭的工厂。", "start": 416.04, "end": 421.16}, {"de": "VW muss effizienter werden, sagen Experten.", "zh": "专家表示，大众必须变得更高效。", "start": 421.28, "end": 423.96}, {"de": "Ohne wirksame Kosten- und Strukturverbesserungen hat dieser Konzern keine Zukunft.", "zh": "没有有效的成本和结构改善，这个集团就没有未来。", "start": 424.8, "end": 430.68}, {"de": "Volkswagen verliert ständig an Investitionskraft.", "zh": "大众的投资能力在不断流失。", "start": 431.2, "end": 434.76}, {"de": "Nach NDR Informationen: Das Land Niedersachsen plant mit den Arbeitnehmervertretern, bei der nächsten Aufsichtsratssitzung eigene Konzepte vorzuschlagen.", "zh": "据北德广播电台消息：下萨克森州正计划与职工代表一起，在下一次监事会会议上提交自己的方案。", "start": 436.0, "end": 445.64}]}], "vocab": [{"lemma": "umbauen", "key": "umbauen", "forms": ["umbauen"], "pos": "Verb", "zh": "改造，重组", "example_de": "VW-Chef Blume will Europas größten Autokonzern umbauen.", "example_zh": ""}, {"lemma": "verschlanken", "key": "verschlanken", "forms": ["verschlanken"], "pos": "Verb", "zh": "精简（机构、流程）", "example_de": "Ziel sei es, die Strukturen zu verschlanken und die Kosten zu senken.", "example_zh": ""}, {"lemma": "der Abbau", "key": "abbau", "forms": ["Abbau", "Personalabbau"], "pos": "Substantiv", "zh": "裁减，削减", "example_de": "Es geht um den Abbau Tausender Stellen.", "example_zh": ""}, {"lemma": "das letzte Mittel", "key": "letztes-mittel", "forms": ["letztes Mittel", "letzte Mittel"], "pos": "Fügung", "zh": "最后手段", "example_de": "Werksschließungen bezeichnete Blume als letztes Mittel, das er vermeiden wolle.", "example_zh": ""}, {"lemma": "die Betriebsversammlung, -en", "key": "betriebsversammlung", "forms": ["Betriebsversammlung", "Betriebsversammlungen"], "pos": "Substantiv", "zh": "职工大会（全体员工大会）", "example_de": "Auf Betriebsversammlungen an neun VW-Standorten stellt der Vorstand Sparmaßnahmen vor.", "example_zh": ""}, {"lemma": "die Sparmaßnahme, -n", "key": "sparmassnahme", "forms": ["Sparmaßnahmen", "Sparmaßnahme"], "pos": "Substantiv", "zh": "节省措施，紧缩措施", "example_de": "Auf Betriebsversammlungen an neun VW-Standorten stellt der Vorstand Sparmaßnahmen vor.", "example_zh": ""}, {"lemma": "aufgebracht", "key": "aufgebracht", "forms": ["aufgebrachten", "aufgebracht"], "pos": "Adjektiv", "zh": "愤怒的，情绪激动的", "example_de": "Vor der aufgebrachten Belegschaft betont er die Notwendigkeit von Einsparungen.", "example_zh": ""}, {"lemma": "die Belegschaft, -en", "key": "belegschaft", "forms": ["Belegschaft"], "pos": "Substantiv", "zh": "全体员工，职工队伍", "example_de": "Vor der aufgebrachten Belegschaft betont er die Notwendigkeit von Einsparungen.", "example_zh": ""}, {"lemma": "der Aufsichtsrat, ..e", "key": "aufsichtsrat", "forms": ["Aufsichtsratssitzung", "Aufsichtsrat"], "pos": "Substantiv", "zh": "监事会", "example_de": "Nach NDR Informationen: Das Land Niedersachsen plant mit den Arbeitnehmervertretern, bei der nächsten Aufsichtsratssitzung eigene Konzepte vorzuschlagen.", "example_zh": ""}], "grammar_points": [{"title": "bezeichnen als + Akkusativ", "summary": "“把……称为/称作……”：bezeichnen 支配第四格宾语，后接 als + 第四格补语。", "example_de": "Werksschließungen bezeichnete Blume als letztes Mittel, das er vermeiden wolle.", "example_zh": "布卢姆把关闭工厂称作他想避免的最后手段。"}, {"title": "Konjunktiv I：sei / wolle（转述）", "summary": "转述董事会的话用第一虚拟式（sei、wolle），把说法和记者的判断区分开，新闻德语的典型笔法。", "example_de": "Ziel sei es, die Strukturen zu verschlanken und die Kosten zu senken.", "example_zh": "（他说，）目标是精简架构、降低成本。"}], "background": "大众与职工委员会围绕节省数十亿欧元的谈判已持续数月，董事会此前首次不排除关闭德国工厂。下萨克森州是大众第二大股东并在监事会拥有席位，州政府因此深度介入斡旋。未来几天的职工大会覆盖沃尔夫斯堡、埃姆登、汉诺威、茨维考等九地，其中数座工厂面临关闭风险。"}, {"title": "Was VW in China anders macht", "title_zh": "大众在中国有什么不同做法", "paras": [{"start": 447.16, "end": 464.28, "lines": [{"de": "Bei VW in Deutschland wird um Sparmaßnahmen gerungen, in China produziert der Konzern unter ganz anderen Bedingungen.", "zh": "在德国，大众正在为节省措施苦苦挣扎；而在中国，这个集团的生产条件完全不同。", "start": 447.16, "end": 454.64}, {"de": "20 neue oder überarbeitete Modelle bringt VW allein in diesem Jahr für den chinesischen Markt heraus.", "zh": "仅仅今年一年，大众就为中国市场推出20款新车型或改款车型。", "start": 454.76, "end": 461.96}, {"de": "Vor Ort entwickelt und gebaut.", "zh": "就地研发、就地制造。", "start": 462.04, "end": 464.28}]}, {"start": 464.4, "end": 497.12, "lines": [{"de": "Dabei ist die Produktionsdauer in China nur halb so lang, die Ingenieursgehälter niedriger.", "zh": "在中国，生产周期只有一半长，工程师的薪水更低。", "start": 464.4, "end": 471.24}, {"de": "Und den Großteil der Arbeit erledigen Roboter.", "zh": "而且大部分工作由机器人完成。", "start": 471.32, "end": 474.8}, {"de": "Hier rollt das neuste VW-Modell - made in China.", "zh": "最新的大众车型在这里下线——中国制造。", "start": 476.36, "end": 479.32}, {"de": "Werbeaufnahmen.", "zh": "广告拍摄现场。", "start": 479.4, "end": 480.56}, {"de": "Ein Plug-in-Hybrid, Fahrassistenzsystem inklusive.", "zh": "一辆插电式混合动力车，驾驶辅助系统一应俱全。", "start": 480.64, "end": 484.68}, {"de": "Die Limousine in der Größe einer Familienkutsche kostet umgerechnet knapp 12.000 Euro.", "zh": "这辆家用轿车大小的三厢车折合不到12000欧元。", "start": 486.08, "end": 491.88}, {"de": "Der Kleinwagen Polo in Deutschland dagegen fast das Doppelte.", "zh": "而在德国，小型车Polo的价格几乎是它的两倍。", "start": 493.12, "end": 497.12}]}, {"start": 497.2, "end": 534.64, "lines": [{"de": "Auf dem chinesischen Markt mit dem härtesten Preiskampf weltweit musste VW seine Produktion umstellen.", "zh": "在全球价格战最激烈的中国市场，大众不得不转变生产方式。", "start": 497.2, "end": 503.64}, {"de": "Die Kosten in neuen Werken wurden halbiert.", "zh": "新工厂的成本被砍掉一半。", "start": 503.72, "end": 506.6}, {"de": "Wie in der Provinz Anhui mit eigenem Entwicklungszentrum.", "zh": "比如在安徽省，大众有自己的开发中心。", "start": 507.76, "end": 511.6}, {"de": "Das Herzstück vernetzter Autos, die Software, programmieren chinesische Ingenieure gleich neben den Teststationen.", "zh": "联网汽车的核心——软件——由中国工程师就在测试站旁边编写。", "start": 511.68, "end": 520.88}, {"de": "Fehler werden sofort gemeldet.", "zh": "错误立即被反馈。", "start": 521.16, "end": 523.52}, {"de": "In 18 Monaten soll ein neuer Wagen marktreif sein - halb so lang wie bisher bei VW.", "zh": "一辆新车18个月就要达到可上市状态——只有大众以往周期的一半。", "start": 525.12, "end": 530.52}, {"de": "Kurze Wege - das stellen sich manche auch für Deutschland vor.", "zh": "短路径——有些人也想让德国变成这样。", "start": 530.56, "end": 534.64}]}, {"start": 535.4, "end": 566.48, "lines": [{"de": "Oder die ganze Entwicklung auslagern.", "zh": "或者干脆把整个开发环节外包出去。", "start": 535.4, "end": 537.88}, {"de": "Ingenieursgehälter sind in China bis zu zwei Drittel niedriger.", "zh": "在中国，工程师薪资最多低三分之二。", "start": 537.96, "end": 542.16}, {"de": "Ich glaube, es ist eine Variante, chinesische Entwicklungsleistungen von Volkswagen einzusetzen.", "zh": "我认为，把中国的大众开发能力利用起来，是一种可行方案。", "start": 543.08, "end": 550.64}, {"de": "Um günstig Fahrzeuge zu entwickeln, sie aber in Europa zu produzieren.", "zh": "以便低成本地开发汽车、但在欧洲生产。", "start": 552.2, "end": 557.96}, {"de": "Bislang nur eine kostensparende Idee, die aber weniger Arbeitsplätze in Deutschland bedeuten würde.", "zh": "到目前为止这只是一个省钱的点子，但它将意味着德国的工作岗位减少。", "start": 559.6, "end": 566.48}]}], "vocab": [{"lemma": "die Produktionsdauer, -en", "key": "produktionsdauer", "forms": ["Produktionsdauer"], "pos": "Substantiv", "zh": "生产周期", "example_de": "Dabei ist die Produktionsdauer in China nur halb so lang, die Ingenieursgehälter niedriger.", "example_zh": ""}, {"lemma": "herausbringen", "key": "herausbringen", "forms": ["bringt ... heraus", "herausbringen"], "pos": "Verb", "zh": "推出，发布（产品）", "example_de": "20 neue oder überarbeitete Modelle bringt VW allein in diesem Jahr für den chinesischen Markt heraus.", "example_zh": ""}, {"lemma": "umgerechnet", "key": "umgerechnet", "forms": ["umgerechnet"], "pos": "Adverb", "zh": "换算下来，折合", "example_de": "Die Limousine in der Größe einer Familienkutsche kostet umgerechnet knapp 12.000 Euro.", "example_zh": ""}, {"lemma": "der Preiskampf, ..e", "key": "preiskampf", "forms": ["Preiskampf"], "pos": "Substantiv", "zh": "价格战", "example_de": "Auf dem chinesischen Markt mit dem härtesten Preiskampf weltweit musste VW seine Produktion umstellen.", "example_zh": ""}, {"lemma": "umstellen", "key": "umstellen", "forms": ["umstellen"], "pos": "Verb", "zh": "转变，改换（生产方式等）", "example_de": "Auf dem chinesischen Markt mit dem härtesten Preiskampf weltweit musste VW seine Produktion umstellen.", "example_zh": ""}, {"lemma": "halbieren", "key": "halbieren", "forms": ["halbiert", "halbieren"], "pos": "Verb", "zh": "减半，砍半", "example_de": "Die Kosten in neuen Werken wurden halbiert.", "example_zh": ""}, {"lemma": "das Herzstück, -e", "key": "herzstueck", "forms": ["Herzstück"], "pos": "Substantiv", "zh": "核心，心脏", "example_de": "Das Herzstück vernetzter Autos, die Software, programmieren chinesische Ingenieure gleich neben den Teststationen.", "example_zh": ""}, {"lemma": "marktreif", "key": "marktreif", "forms": ["marktreif"], "pos": "Adjektiv", "zh": "达到可上市程度的", "example_de": "In 18 Monaten soll ein neuer Wagen marktreif sein - halb so lang wie bisher bei VW.", "example_zh": ""}, {"lemma": "auslagern", "key": "auslagern", "forms": ["auslagern"], "pos": "Verb", "zh": "外包，外移（业务环节）", "example_de": "Oder die ganze Entwicklung auslagern.", "example_zh": ""}], "grammar_points": [{"title": "halb so ... wie：同级比较", "summary": "so + 形容词 + wie 表示“和……一样”；前面加 halb（一半）、doppelt（两倍）等即可表达倍数：halb so lang wie = 只有……一半长。", "example_de": "Dabei ist die Produktionsdauer in China nur halb so lang, die Ingenieursgehälter niedriger.", "example_zh": "在中国的生产周期只有（德国的）一半长。"}, {"title": "um ... zu + Infinitiv：目的不定式", "summary": "主语一致时用 um...zu 结构表达目的：“为了……”；结构中可插入 aber 等小品词表示转折。", "example_de": "Um günstig Fahrzeuge zu entwickeln, sie aber in Europa zu produzieren.", "example_zh": "为了低成本地开发汽车、但在欧洲生产。"}], "background": "大众1984年即进入中国，曾长期是中国市场销量第一，近年份额被比亚迪等本土厂商反超后转向“在中国，为中国”战略：在安徽合肥设立开发中心、本地决策、本地开发，新车开发周期从四年压缩到约18个月。“中国速度”由此成为大众德国重组讨论中的参照系——但也引发“开发外移将减少德国岗位”的担忧。"}, {"title": "Handelskonflikt mit den USA: Kanada kündigt Gegenzölle an", "title_zh": "与美国贸易冲突：加拿大宣布反制关税", "paras": [{"start": 568.2, "end": 602.76, "lines": [{"de": "Letzte Woche waren die Gespräche im Handelskonflikt zwischen den USA und Kanada gescheitert.", "zh": "上周，美国与加拿大之间贸易冲突的谈判宣告失败。", "start": 568.2, "end": 574.28}, {"de": "Seitdem ist der Streit zwischen den Nachbarländern eskaliert.", "zh": "此后，两个邻国间的争端不断升级。", "start": 574.36, "end": 578.2}, {"de": "Die USA verhängten am Wochenende Zölle von 50 % auf kanadische Waren.", "zh": "美国在周末对加拿大商品征收50%的关税。", "start": 578.28, "end": 583.04}, {"de": "Heute hat Kanada Gegenzölle verkündet.", "zh": "今天，加拿大宣布了反制关税。", "start": 583.48, "end": 586.12}, {"de": "Die Volkswirtschaften beider Länder sind eng verflochten: 72,5 % aller kanadischen Exporte gehen in die Vereinigten Staaten.", "zh": "两国经济紧密交织：加拿大全部出口的72.5%流向美国。", "start": 586.4, "end": 595.68}, {"de": "Umgekehrt machen die US-Ausfuhren nach Kanada rund 16 % der gesamten Exporte aus.", "zh": "反过来，美国对加拿大的出口约占其总出口的16%。", "start": 596.36, "end": 602.76}]}, {"start": 605.16, "end": 631.04, "lines": [{"de": "Kanada und die USA - in Detroit nur durch einen Fluss getrennt.", "zh": "加拿大和美国——在底特律，彼此只隔着一条河。", "start": 605.16, "end": 609.32}, {"de": "Autoteile werden hier oft sechsmal hin und her transportiert, bevor sie zusammengebaut werden.", "zh": "汽车零部件在这里常常要往返运输六次，才被组装起来。", "start": 609.44, "end": 615.12}, {"de": "Die Gegenzölle auf US-Produkte dürften beiden Seiten wehtun.", "zh": "对美国产品的反制关税，恐怕会让双方都感到疼痛。", "start": 615.2, "end": 618.76}, {"de": "Betroffen: Industriegüter - und Kleidung, Käse, Toilettenpapier.", "zh": "受影响的：工业品——以及服装、奶酪、卫生纸。", "start": 618.84, "end": 622.76}, {"de": "Kanada muss reagieren und das tun wir heute: Angemessen, gezielt und strategisch.", "zh": "加拿大必须作出反应，我们今天就在做：有分寸、有目标、有战略。", "start": 623.6, "end": 631.04}]}, {"start": 631.12, "end": 675.12, "lines": [{"de": "Kanada wird die amerikanischen Zölle erwidern, Dollar für Dollar, Zollsätze für Zollsätze.", "zh": "加拿大将回应美国的关税，一元对一元，一个税率对一个税率。", "start": 631.12, "end": 637.48}, {"de": "Die USA wollten die wichtigsten kanadischen Industrien zerstören, so Premierminister Carney.", "zh": "美国想摧毁加拿大最重要的工业，总理卡尼这样说。", "start": 640.16, "end": 645.88}, {"de": "Er will sein Land unabhängiger machen von den USA, hat neue Handelspartner gefunden, auch in Europa.", "zh": "他想让本国更独立于美国，已经找到了新的贸易伙伴，也包括欧洲。", "start": 645.96, "end": 652.0}, {"de": "Er gibt sich selbstbewusst.", "zh": "他显得很自信。", "start": 652.08, "end": 653.76}, {"de": "Die Haltung am Verhandlungstisch ist: Kanada ist nur eine Filiale der USA.", "zh": "谈判桌上的态度是：加拿大只是美国的一家分店。", "start": 654.72, "end": 661.24}, {"de": "Die kanadische Wirtschaft wird benachteiligt im Vergleich zur amerikanischen.", "zh": "和美国经济相比，加拿大经济处于不利地位。", "start": 661.36, "end": 666.24}, {"de": "Wir schaffen Bedingungen, durch die die kanadische Industrie mit ständigem Gegenwind zu kämpfen hat.", "zh": "我们制造出一些条件，让加拿大工业不得不持续顶风前行。", "start": 666.32, "end": 672.32}, {"de": "Das werden wir nicht akzeptieren.", "zh": "这一点我们不会接受。", "start": 672.4, "end": 675.12}]}, {"start": 677.24, "end": 717.0, "lines": [{"de": "Die Kanadier stehen hinter ihrem Premierminister.", "zh": "加拿大人站在他们的总理身后。", "start": 677.24, "end": 680.28}, {"de": "Die Attacken von US-Präsident Trump schweißen das Land zusammen.", "zh": "美国总统特朗普的攻击反而让这个国家更加团结。", "start": 680.36, "end": 684.16}, {"de": "Trump droht auf seinem Social-Media-Kanal damit, den Ontario-See in Lake America umzubenennen.", "zh": "特朗普在他的社交媒体上威胁，要把安大略湖改名为“美洲湖”。", "start": 684.24, "end": 690.0}, {"de": "Es ist beleidigend, dass der amerikanische Präsident uns immer wieder den 51. Staat nennt.", "zh": "美国总统一次又一次把我们称作第51个州，这是一种侮辱。", "start": 690.88, "end": 697.2}, {"de": "Wir waren immer Freunde, jetzt nicht mehr.", "zh": "我们曾经一直是朋友，现在不再是了。", "start": 699.04, "end": 701.72}, {"de": "Das wird allen wehtun.", "zh": "这会让所有人付出代价。", "start": 701.8, "end": 703.96}, {"de": "Sehr traurig.", "zh": "非常令人悲伤。", "start": null, "end": null}, {"de": "Neue Zölle, neue Eskalation.", "zh": "新关税，新的升级。", "start": 704.48, "end": 706.4}, {"de": "Viele fragen: Wie lange können die Kanadier diesen Handelskrieg durchhalten?", "zh": "许多人问：加拿大人还能撑得住这场贸易战多久？", "start": 706.88, "end": 711.88}, {"de": "Carney hat einen Trumpf: Die meisten Amerikaner lehnen Trumps Zölle gegen Kanada ab.", "zh": "卡尼手里有一张王牌：大多数美国人反对特朗普对加拿大加征关税。", "start": 711.96, "end": 717.0}]}], "vocab": [{"lemma": "der Handelskonflikt, -e", "key": "handelskonflikt", "forms": ["Handelskonflikt"], "pos": "Substantiv", "zh": "贸易冲突", "example_de": "Letzte Woche waren die Gespräche im Handelskonflikt zwischen den USA und Kanada gescheitert.", "example_zh": ""}, {"lemma": "scheitern", "key": "scheitern", "forms": ["gescheitert", "scheitern"], "pos": "Verb", "zh": "失败，告吹", "example_de": "Letzte Woche waren die Gespräche im Handelskonflikt zwischen den USA und Kanada gescheitert.", "example_zh": ""}, {"lemma": "eskalieren", "key": "eskalieren", "forms": ["eskaliert", "eskalieren"], "pos": "Verb", "zh": "升级，激化", "example_de": "Seitdem ist der Streit zwischen den Nachbarländern eskaliert.", "example_zh": ""}, {"lemma": "verhängen", "key": "verhaengen", "forms": ["verhängten", "verhängen"], "pos": "Verb", "zh": "（官方）颁布，征收（制裁、关税）", "example_de": "Die USA verhängten am Wochenende Zölle von 50 % auf kanadische Waren.", "example_zh": ""}, {"lemma": "der Gegenzoll, ..e", "key": "gegenzoll", "forms": ["Gegenzölle", "Gegenzoll"], "pos": "Substantiv", "zh": "反制关税", "example_de": "Heute hat Kanada Gegenzölle verkündet.", "example_zh": ""}, {"lemma": "verflochten", "key": "verflochten", "forms": ["verflochten"], "pos": "Adjektiv", "zh": "相互交织的，彼此依赖的", "example_de": "Die Volkswirtschaften beider Länder sind eng verflochten: 72,5 % aller kanadischen Exporte gehen in die Vereinigten Staaten.", "example_zh": ""}, {"lemma": "wehtun", "key": "wehtun", "forms": ["wehtun"], "pos": "Verb", "zh": "造成损害，让……吃苦头", "example_de": "Die Gegenzölle auf US-Produkte dürften beiden Seiten wehtun.", "example_zh": ""}, {"lemma": "zusammenschweißen", "key": "zusammenschweissen", "forms": ["schweißen ... zusammen", "zusammenschweißen"], "pos": "Verb", "zh": "（比喻）使紧紧团结在一起", "example_de": "Die Attacken von US-Präsident Trump schweißen das Land zusammen.", "example_zh": ""}, {"lemma": "der Trumpf, -e", "key": "trumpf", "forms": ["Trumpf"], "pos": "Substantiv", "zh": "王牌，胜招", "example_de": "Carney hat einen Trumpf: Die meisten Amerikaner lehnen Trumps Zölle gegen Kanada ab.", "example_zh": ""}], "grammar_points": [{"title": "dürften + Infinitiv：有依据的推测", "summary": "dürfte/dürften 在新闻里常表推测：“恐怕会、很可能”，把握介于“可能”和“肯定”之间。", "example_de": "Die Gegenzölle auf US-Produkte dürften beiden Seiten wehtun.", "example_zh": "对美国产品的反制关税恐怕会让双方都受损。"}, {"title": "hinter + Dat.：站在某人一边", "summary": "hinter 支配第三格表示支持：“站在……身后/支持某人”，反义则用 gegen。", "example_de": "Die Kanadier stehen hinter ihrem Premierminister.", "example_zh": "加拿大人支持他们的总理。"}], "background": "特朗普政府对加拿大的关税战持续升级：上轮谈判破裂后，美方周末把关税提高到50%，加拿大总理卡尼——2025年联邦选举中主打抵抗美国吞并压力而胜选——随即宣布对等报复，并同时推进与欧盟等新伙伴的贸易协定。加美经济高度互相依赖：加拿大出口七成以上流向美国；但美国多数民意反对对加关税，成为渥太华的底气。"}, {"title": "Bundesregierung diskutiert über Ausgestaltung der Zuckersteuer", "title_zh": "联邦政府讨论糖税的具体设计", "paras": [{"start": 719.24, "end": 746.72, "lines": [{"de": "Die Bundesregierung will eine Steuer auf zuckerhaltige Getränke einführen.", "zh": "联邦政府想对含糖饮料征收一种税。", "start": 719.24, "end": 723.56}, {"de": "Es gibt Überlegungen, eine solche Zuckersteuer auszuweiten: Auf Fruchtnektar, Smoothies, Haferdrinks und Getränke, die Süßstoffe enthalten.", "zh": "现在有考虑把这样的糖税扩大征税范围：扩大到果汁露、思慕雪、燕麦饮品以及含甜味剂的饮料。", "start": 723.64, "end": 734.92}, {"de": "Betroffen wären auch zuckerfreie Limonaden.", "zh": "无糖柠檬汽水也可能被波及。", "start": 735.0, "end": 738.08}, {"de": "Aus Kreisen des Finanzministeriums heißt es, das Vorhaben befinde sich in einer frühen Phase und werde zwischen den Ressorts abgestimmt.", "zh": "财政部方面表示，该计划尚处于早期阶段，正在各部委之间协调。", "start": 738.16, "end": 746.72}]}, {"start": 748.08, "end": 805.24, "lines": [{"de": "Auf Erfrischungsgetränke, Smoothies oder Haferdrinks könnte eine Zucker-Getränkesteuer kommen.", "zh": "汽水、思慕雪或燕麦饮品可能很快要交“糖饮料税”。", "start": 748.08, "end": 754.56}, {"de": "Das zeigen Eckpunkte des Finanzministeriums, die dem ARD-Hauptstadtstudio vorliegen.", "zh": "财政部的规划要点显示了这一点，ARD首都工作室获得了这些文件。", "start": 754.64, "end": 760.08}, {"de": "Das Ziel: Weniger Zucker, mehr Gesundheit und mehr Einnahmen für den Staat.", "zh": "目标：更少的糖、更多的健康、给国家更多的收入。", "start": 760.2, "end": 765.48}, {"de": "Verbraucherschützer würden eine solche Steuer begrüßen.", "zh": "消费者保护组织会欢迎这样的税。", "start": 765.56, "end": 768.84}, {"de": "Es macht Sinn, Süßstoffe einzubeziehen.", "zh": "把甜味剂也纳入进来是有道理的。", "start": 769.12, "end": 772.44}, {"de": "Es geht darum, die Süßprägung, das Übersüße an Geschmack in Getränken, dass man das reduziert.", "zh": "关键在于把饮料里对甜味的习惯、那种过甜的口味降下来。", "start": 772.52, "end": 780.24}, {"de": "Es geht nicht darum, Geld für den Finanzminister reinzuholen.", "zh": "而不是给财政部长捞钱。", "start": 780.32, "end": 784.68}, {"de": "Nach den Eckpunkten, die wohl noch in einer frühen Phase sind, soll die Steuer gestaffelt sein: Sie kann auf bis zu 38 Cent steigen.", "zh": "根据这些大概还处于早期阶段的要点，这种税将是分档的：最高可以涨到38欧分。", "start": 785.16, "end": 805.24}]}, {"start": 806.04, "end": 830.6, "lines": [{"de": "Die Ernährungsindustrie kritisiert die Steuer: Zu befürchten ist: Wenn der Verbraucher viel mehr bezahlen muss, weicht er aus.", "zh": "食品工业批评这项税收：令人担心的是，如果消费者要多付很多钱，他们就会回避购买。", "start": 806.04, "end": 816.8}, {"de": "Dann kommt es zur Kaufzurückhaltung.", "zh": "然后就会出现购买退缩。", "start": 818.16, "end": 820.92}, {"de": "Grundsätzlich hatte sich die schwarz-rote Bundesregierung auf eine Zuckerabgabe geeinigt.", "zh": "原则上，黑红两党的联邦政府已经就糖税征收达成一致。", "start": 821.44, "end": 827.16}, {"de": "Wie sie konkret aussehen soll, ist unklar.", "zh": "但它具体应该长什么样，还不清楚。", "start": 827.24, "end": 830.6}]}], "vocab": [{"lemma": "die Steuer, -n", "key": "steuer", "forms": ["Steuer", "Zuckersteuer"], "pos": "Substantiv", "zh": "税", "example_de": "Die Bundesregierung will eine Steuer auf zuckerhaltige Getränke einführen.", "example_zh": ""}, {"lemma": "zuckerhaltig", "key": "zuckerhaltig", "forms": ["zuckerhaltige", "zuckerhaltig"], "pos": "Adjektiv", "zh": "含糖的", "example_de": "Die Bundesregierung will eine Steuer auf zuckerhaltige Getränke einführen.", "example_zh": ""}, {"lemma": "die Eckpunkte", "key": "eckpunkte", "forms": ["Eckpunkte"], "pos": "Substantiv (Pl.)", "zh": "（政策）要点，框架原则", "example_de": "Das zeigen Eckpunkte des Finanzministeriums, die dem ARD-Hauptstadtstudio vorliegen.", "example_zh": ""}, {"lemma": "begrüßen", "key": "begruessen", "forms": ["begrüßen"], "pos": "Verb", "zh": "欢迎，赞成", "example_de": "Verbraucherschützer würden eine solche Steuer begrüßen.", "example_zh": ""}, {"lemma": "der Süßstoff, -e", "key": "suessstoff", "forms": ["Süßstoffe", "Süßstoff"], "pos": "Substantiv", "zh": "甜味剂", "example_de": "Es gibt Überlegungen, eine solche Zuckersteuer auszuweiten: Auf Fruchtnektar, Smoothies, Haferdrinks und Getränke, die Süßstoffe enthalten.", "example_zh": ""}, {"lemma": "einbeziehen", "key": "einbeziehen", "forms": ["einzubeziehen", "einbeziehen"], "pos": "Verb", "zh": "把……包括进来", "example_de": "Es macht Sinn, Süßstoffe einzubeziehen.", "example_zh": ""}, {"lemma": "gestaffelt", "key": "gestaffelt", "forms": ["gestaffelt"], "pos": "Adjektiv", "zh": "分档的，分级累进的", "example_de": "Nach den Eckpunkten, die wohl noch in einer frühen Phase sind, soll die Steuer gestaffelt sein: Sie kann auf bis zu 38 Cent steigen.", "example_zh": ""}, {"lemma": "ausweichen", "key": "ausweichen", "forms": ["weicht ... aus", "ausweichen"], "pos": "Verb", "zh": "回避，转而避开", "example_de": "Zu befürchten ist: Wenn der Verbraucher viel mehr bezahlen muss, weicht er aus.", "example_zh": ""}, {"lemma": "die Kaufzurückhaltung", "key": "kaufzuerueckhaltung", "forms": ["Kaufzurückhaltung"], "pos": "Substantiv", "zh": "购买退缩，消费抑制", "example_de": "Dann kommt es zur Kaufzurückhaltung.", "example_zh": ""}], "grammar_points": [{"title": "würden + Infinitiv：第二虚拟式表假设", "summary": "对尚未发生的事作假设性判断：“（要是有的话）会……”，比直陈式委婉，新闻评论常用。", "example_de": "Verbraucherschützer würden eine solche Steuer begrüßen.", "example_zh": "消费者保护组织会欢迎这样一种税。"}, {"title": "kommen zu + Dat.（zur）：出现、发生", "summary": "es kommt zu + 名词表示“出现了/发生了（某情况）”，zu 后接第三格，zur 是 zu der 的缩写。", "example_de": "Dann kommt es zur Kaufzurückhaltung.", "example_zh": "然后就会出现购买退缩。"}], "background": "糖税（Zuckerabgabe）在英国、爱尔兰、法国、西班牙、墨西哥等多国已经实行，普遍促使厂商主动减糖以避开高档税率。德国现行联盟协议（黑红联盟）中写入了引入糖税的约定；本次财政部要点的新意在于讨论把果汁饮料、燕麦饮品甚至含甜味剂的无糖汽水也纳入分档征税，最高档每升可达38欧分。食品工业则警告价格上升会导致消费回落。"}, {"title": "US-amerikanische Country-Sängerin Dolly Parton im Alter von 80 Jahren gestorben", "title_zh": "美国乡村歌手多莉·帕顿逝世，享年80岁", "paras": [{"start": 833.68, "end": 851.52, "lines": [{"de": "Für viele Fans der Countrymusik war Dolly Parton eine Ikone, über die Grenzen ihres Genres hinaus war sie eine gefeierte Künstlerin.", "zh": "对许多乡村音乐乐迷来说，多莉·帕顿是一位偶像；而越过她自己流派的边界，她同样是一位备受赞誉的艺术家。", "start": 833.68, "end": 842.52}, {"de": "Nun ist Parton im Alter von 80 Jahren gestorben.", "zh": "现在，帕顿以80岁高龄去世了。", "start": 842.6, "end": 845.84}, {"de": "Weltweit bekannt wurde sie mit Hits wie \"Jolene\" oder \"Nine to Five\".", "zh": "她凭《Jolene》《Nine to Five》等热门歌曲闻名于世。", "start": 845.92, "end": 851.52}]}], "vocab": [{"lemma": "die Ikone, -n", "key": "ikone", "forms": ["Ikone"], "pos": "Substantiv", "zh": "偶像，标志性人物", "example_de": "Für viele Fans der Countrymusik war Dolly Parton eine Ikone, über die Grenzen ihres Genres hinaus war sie eine gefeierte Künstlerin.", "example_zh": ""}, {"lemma": "das Genre, -s", "key": "genre", "forms": ["Genres", "Genre"], "pos": "Substantiv", "zh": "（艺术）流派，类型", "example_de": "Für viele Fans der Countrymusik war Dolly Parton eine Ikone, über die Grenzen ihres Genres hinaus war sie eine gefeierte Künstlerin.", "example_zh": ""}, {"lemma": "gefeiert", "key": "gefeiert", "forms": ["gefeierte", "gefeiert"], "pos": "Adjektiv", "zh": "广受赞誉的", "example_de": "Für viele Fans der Countrymusik war Dolly Parton eine Ikone, über die Grenzen ihres Genres hinaus war sie eine gefeierte Künstlerin.", "example_zh": ""}, {"lemma": "das Alter", "key": "alter", "forms": ["Alter"], "pos": "Substantiv", "zh": "年龄，年纪", "example_de": "Nun ist Parton im Alter von 80 Jahren gestorben.", "example_zh": ""}, {"lemma": "der Hit, -s", "key": "hit", "forms": ["Hits", "Hit"], "pos": "Substantiv", "zh": "热门歌曲，金曲", "example_de": "Weltweit bekannt wurde sie mit Hits wie \"Jolene\" oder \"Nine to Five\".", "example_zh": ""}], "grammar_points": [{"title": "über ... hinaus：超出……之外", "summary": "über + 名词 + hinaus 表示“超越某个范围/界限继续”，句中作状语：über die Grenzen hinaus = 越过边界。", "example_de": "Für viele Fans der Countrymusik war Dolly Parton eine Ikone, über die Grenzen ihres Genres hinaus war sie eine gefeierte Künstlerin.", "example_zh": "越过她自己流派的边界，她也是一位备受赞誉的艺术家。"}], "background": "多莉·帕顿（Dolly Parton，1946年生于田纳西州阿巴拉契亚山区贫困农家）是美国乡村音乐史上最具影响力的人物之一：从1960年代出道，到《Jolene》（1973）、电影《朝九晚五》主题曲《9 to Five》（1980）成为跨流派金曲。她也是著名慈善家——创办“想象图书馆”项目每月向全球儿童免费寄书，并在新冠疫情期间资助了早期疫苗研究。"}, {"title": "Das Wetter", "title_zh": "天气", "paras": [{"start": 854.64, "end": 907.72, "lines": [{"de": "Die Wettervorhersage für morgen, Mittwoch den 26. August.", "zh": "明天，8月26日星期三的天气预报。", "start": 854.64, "end": 858.64}, {"de": "Das Hoch über Skandinavien sorgt im Norden für trockenes und windiges Wetter.", "zh": "斯堪的纳维亚上空的高压，给北方带来干燥多风的天气。", "start": 860.92, "end": 865.76}, {"de": "Sonst wird es schwül.", "zh": "其余地方会闷热。", "start": 865.84, "end": 867.12}, {"de": "Der Regen in der Mitte verlagert sich heute Nacht nach Osten.", "zh": "中部的降雨今夜向东转移。", "start": 867.24, "end": 870.88}, {"de": "Auch im Süden ein paar Schauer.", "zh": "南部也有几阵阵雨。", "start": 870.96, "end": 873.04}, {"de": "Morgen von der Nordsee bis zur Oder oft sonnig.", "zh": "明天从北海到奥得河大多晴朗。", "start": 873.12, "end": 876.36}, {"de": "In der Mitte bewölkt mit etwas Regen.", "zh": "中部多云，伴有少量降雨。", "start": 876.44, "end": 879.16}, {"de": "Im Süden und Südwesten oft Sonne mit einzelnen Schauern.", "zh": "南部和西南部多阳光、局部有阵雨。", "start": 879.28, "end": 882.96}, {"de": "Die Temperaturen: Am Donnerstag Sonne und Wolken.", "zh": "气温：周四晴间多云。", "start": 883.04, "end": 894.28}, {"de": "Im Westen einzelne Schauer, gegen Abend auch Gewitter.", "zh": "西部局部有阵雨，傍晚还会打雷下雨。", "start": 894.36, "end": 898.76}, {"de": "Die können am Freitag unwetterartig ausfallen.", "zh": "周五雷雨可能达到暴风雨级别。", "start": 899.2, "end": 902.44}, {"de": "Dann wird es auch im Osten schwül.", "zh": "届时东部也会闷热。", "start": 902.52, "end": 905.04}, {"de": "Samstag landesweit wieder kühler.", "zh": "周六全国再度转凉。", "start": 905.12, "end": 907.72}]}], "vocab": [{"lemma": "die Wettervorhersage, -n", "key": "wettervorhersage", "forms": ["Wettervorhersage"], "pos": "Substantiv", "zh": "天气预报", "example_de": "Die Wettervorhersage für morgen, Mittwoch den 26.", "example_zh": ""}, {"lemma": "schwül", "key": "schwuel", "forms": ["schwül"], "pos": "Adjektiv", "zh": "闷热的，湿热的", "example_de": "Sonst wird es schwül.", "example_zh": ""}, {"lemma": "sich verlagern", "key": "verlagern", "forms": ["verlagert sich", "sich verlagern"], "pos": "Verb", "zh": "转移，挪动", "example_de": "Der Regen in der Mitte verlagert sich heute Nacht nach Osten.", "example_zh": ""}, {"lemma": "der Schauer, -", "key": "schauer", "forms": ["Schauer"], "pos": "Substantiv", "zh": "阵雨", "example_de": "Auch im Süden ein paar Schauer.", "example_zh": ""}, {"lemma": "das Gewitter, -", "key": "gewitter", "forms": ["Gewitter"], "pos": "Substantiv", "zh": "雷雨", "example_de": "Im Westen einzelne Schauer, gegen Abend auch Gewitter.", "example_zh": ""}, {"lemma": "unwetterartig", "key": "unwetterartig", "forms": ["unwetterartig"], "pos": "Adjektiv", "zh": "暴风雨级别的", "example_de": "Die können am Freitag unwetterartig ausfallen.", "example_zh": ""}], "grammar_points": [{"title": "a const WK_RE = /[A-Za-zÄÖÜäöüß][A-Za-zÄÖÜäöüß-]*/g;
const PHRASES = (DATA.phrases || []).slice().sort((a, b) => b.length - a.length);
function lookupKey(surface) {
  return (DATA.form_to_key && DATA.form_to_key[surface.toLowerCase()]) || surface.toLowerCase();
}
function wrapWord(surface, key) {
  const g = getGloss(key);
  const classes = [
    g?.zh ? 'known' : '',
    g?.source === 'editorial' ? 'ed' : '',
    g?.source === 'dict' ? 'wiki' : '',
    basket.some(b => b.key === key) ? 'saved' : ''
  ].filter(Boolean).join(' ');
  return `<w data-w="${esc(key)}" class="${classes}" tabindex="0" role="button" aria-label="${esc(surface)}，查看释义">${esc(surface)}</w>`;
}
function isLetter(ch) { return /[A-Za-zÄÖÜäöüß]/.test(ch || ''); }
function tokenizeDe(text) {
  let html = '', i = 0;
  const lower = text.toLowerCase();
  while (i < text.length) {
    let hit = '';
    if (i === 0 || !isLetter(text[i - 1])) {
      for (const ph of PHRASES) {
        if (lower.startsWith(ph.toLowerCase(), i) && !isLetter(text[i + ph.length])) {
          hit = text.slice(i, i + ph.length);
          break;
        }
      }
    }
    if (hit) {
      html += wrapWord(hit, lookupKey(hit));
      i += hit.length;
      continue;
    }
    if (isLetter(text[i])) {
      let j = i + 1;
      while (j < text.length && /[A-Za-zÄÖÜäöüß-]/.test(text[j])) j++;
      const word = text.slice(i, j);
      html += wrapWord(word, lookupKey(word));
      i = j;
    } else {
      let j = i + 1;
      while (j < text.length && !isLetter(text[j])) j++;
      html += esc(text.slice(i, j));
      i = j;
    }
  }
  return html;
}

function storyExtras(n, compact) {

  }</div></details>` : '';

  return vocab + gram + bg || '<p class="empty-study">这条没有单独的词汇或语法。</p>';

  if (!panel.classList.contains('open')) return;
  if (e.key === 'Escape') {
    e.preventDefault();
    toggleBasket(false);
    return;
  }
  if (e.key !== 'Tab') return;
  const focusable = [...panel.querySelectorAll('button:not([disabled]), a[href], input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])')];
  if (!focusable.length) return;
  const first = focusable[0];
  const last = focusable[focusable.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
});

    function guid(key) {
      let h = 0; const s = 'dd-' + key;
      for (const b of enc.encode(s)) { h = (31 * h + b) | 0; }
      return 'dd' + (h >>> 0).toString(16);
    }

    let nid = now * 1000, cid = (now + 1) * 1000;
    for (const b of basket) {
      const front = b.word;
      const back = `${b.zh}${b.example ? `<br><i>${b.example}</i>` : ''}`;
      const sfld = front;
      const flds = front.replace(/\t/g, ' ') + '\x1f' + back.replace(/\t/g, ' ');
      db.run(`INSERT INTO notes VALUES(?,?,?,?,?,?,?,?,?,?,?)`,
        [nid, guid(b.key), mid, now, -1, ' dd::' + (DATA.slug || b.date || DATA.date) + ' ', flds, sfld, csum(sfld), 0, '']);
      db.run(`INSERT INTO cards VALUES(?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)`,
        [cid, nid, deckId, 0, now, -1, 0, 0, nid, 0, 0, 0, 0, 0, 0, 0, 0, '']);
      nid++; cid++;
    }

    st.textContent = '打包…';
    const data = db.export();
    // zip: meta(version2) + collection.anki2 + collection.anki21(同内容, anki26+导入器优先读) + media
    const zip = makeZip({
      'meta': new Uint8Array([0x08, 0x02]),
      'collection.anki2': data,
      'collection.anki21': data,
      'media': new TextEncoder().encode('{}')
    });
    const blob = new Blob([zip], { type: 'application/apkg' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `deutsch-${basket.length}w-${Date.now()}.apkg`;
    a.click();
    st.textContent = `已导出 ${basket.length} 张卡 — 打开 Anki 导入即可`;
    toast('apkg 已下载');
  } catch (err) {
    console.error(err);
    st.textContent = '导出失败: ' + err.message + ' — 可先用「复制文本」';
  } finally {
    btn.disabled = false;
  }
}

/* 极简 zip (store, 无压缩) — apkg 只需合法 zip */
function makeZip(files) {
  const enc = new TextEncoder();
  const chunks = [], central = [];
  let offset = 0;
  const CRC_TABLE = (() => {
    const t = new Uint32Array(256);
    for (let n = 0; n < 256; n++) {
      let c = n;
      for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
      t[n] = c >>> 0;
    }
    return t;
  })();
  function crc32(buf) {
    let c = 0xFFFFFFFF;
    for (let i = 0; i < buf.length; i++) c = CRC_TABLE[(c ^ buf[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }
  for (const [name, content] of Object.entries(files)) {
    const nameB = enc.encode(name);
    const crc = crc32(content);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true);
    lh.setUint16(4, 20, true);       // version
    lh.setUint16(6, 0, true);        // flags
    lh.setUint16(8, 0, true);        // store
    lh.setUint16(10, 0, true); lh.setUint16(12, 0x2821, true); // time/date(dos)
    lh.setUint32(14, crc, true);
    lh.setUint32(18, content.length, true);
    lh.setUint32(22, content.length, true);
    lh.setUint16(26, nameB.length, true);
    lh.setUint16(28, 0, true);
    chunks.push(new Uint8Array(lh.buffer), nameB, content);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true);
    ch.setUint16(4, 20, true); ch.setUint16(6, 20, true);
    ch.setUint16(8, 0, true); ch.setUint16(10, 0, true);
    ch.setUint16(12, 0, true); ch.setUint16(14, 0x2821, true);
    ch.setUint32(16, crc, true);
    ch.setUint32(20, content.length, true); ch.setUint32(24, content.length, true);
    ch.setUint16(28, nameB.length, true);
    // 30..45 = 0
    ch.setUint32(42, offset, true);
    central.push(new Uint8Array(ch.buffer), nameB);
    offset += 30 + nameB.length + content.length;
  }
  let centralSize = central.reduce((s, c) => s + c.length, 0);
  const eocd = new DataView(new ArrayBuffer(22));
  eocd.setUint32(0, 0x06054b50, true);
  eocd.setUint16(8, Object.keys(files).length, true);
  eocd.setUint16(10, Object.keys(files).length, true);
  eocd.setUint32(12, centralSize, true);
  eocd.setUint32(16, offset, true);
  const total = [...chunks, ...central, new Uint8Array(eocd.buffer)];
  const out = new Uint8Array(total.reduce((s, c) => s + c.length, 0));
  let p = 0;
  for (const c of total) { out.set(c, p); p += c.length; }
  return out;
}

/* ---------- toast ---------- */
let toastT;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(toastT);
  toastT = setTimeout(() => t.style.display = 'none', 1600);
}
