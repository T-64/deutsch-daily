    <script id="dd-data" type="application/json">{"page":"lesson","lesson":{"slug":"2026-09-07","date":"2026-09-07","show":"tagesschau in Einfacher Sprache","level":"A2–B1","kind":"video","note":"","source_url":"https://www.tagesschau.de/tagesschau_in_einfacher_sprache/video-1644742.html","video":{"mp4":"https://tagesschau-progressive.ard-mcdn.de/video/2026/0907/TV-20260907-1800-1700.webl.h264.mp4","embed":"https://www.tagesschau.de/tagesschau_in_einfacher_sprache/video-1644742~player.html","page":"https://www.tagesschau.de/tagesschau_in_einfacher_sprache/video-1644742.html"},"duration":369.16,"sentences":[{"de":"Willkommen zur tagesschau in Einfacher Sprache.","zh":"欢迎收看简易德语版每日新闻。","start":10.52,"end":13.8},{"de":"Ich bin Susanne Holst.","zh":"我是苏珊娜·霍尔斯特。","start":null,"end":null},{"de":"In dieser Sendung geht es um die Wahl in Sachsen-Anhalt.","zh":"本期节目关注萨克森-安哈尔特州的选举。","start":15.54,"end":19.46},{"de":"Sachsen-Anhalt ist ein Bundesland im Osten von Deutschland.","zh":"萨克森-安哈尔特是德国东部的一个联邦州。","start":24.44,"end":28.44},{"de":"Die Menschen in Sachsen-Anhalt haben ein neues Parlament gewählt.","zh":"萨克森-安哈尔特的民众选出了一届新议会。","start":28.82,"end":32.78},{"de":"Die Partei Alternative für Deutschland hat die Wahl gewonnen.","zh":"选择党赢得了这次选举。","start":33.48,"end":37.92},{"de":"Das kurze Wort für Alternative für Deutschland ist AfD.","zh":"它的全称是“德国的另一种选择”，简称 AfD。","start":38.88,"end":43.36},{"de":"Die Farbe der AfD ist Blau, wie auf dem Foto.","zh":"选择党的代表色是蓝色，就像照片里那样。","start":44.86,"end":49.1},{"de":"Die AfD in Sachsen-Anhalt ist eine rechtsextreme Partei.","zh":"萨克森-安哈尔特的选择党是一个极右翼政党。","start":49.42,"end":54.3},{"de":"Rechtsextreme sagen zum Beispiel: Ausländer sind weniger wert als Deutsche.","zh":"极右翼会说：外国人不如德国人有价值。","start":54.82,"end":60.52},{"de":"Die AfD sagt: Viele Ausländer sollen Deutschland verlassen.","zh":"选择党说：许多外国人应当离开德国。","start":61.14,"end":66.64},{"de":"In Sachsen-Anhalt sind auch andere Parteien gewählt worden.","zh":"在萨克森-安哈尔特也有其他政党当选。","start":66.88,"end":71.04},{"de":"Sie haben aber viel weniger Stimmen bekommen.","zh":"但它们得到的选票少得多。","start":71.2,"end":74.36},{"de":"Dazu zeigen wir einen Film.","zh":"接下来我们看一段影片。","start":74.8,"end":76.72},{"de":"Hier sehen wir, welche Parteien gewählt worden sind.","zh":"这里我们可以看到哪些政党当选了。","start":77.48,"end":81.12},{"de":"Jeder Balken zeigt eine Partei.","zh":"每个柱条代表一个政党。","start":81.4,"end":83.6},{"de":"Der blaue Balken ist die AfD.","zh":"蓝色柱条是选择党。","start":84.56,"end":86.64},{"de":"Sie hat die meisten Stimmen bekommen.","zh":"它得到的选票最多。","start":87.76,"end":90.4},{"de":"Der schwarze Balken ist die CDU.","zh":"黑色柱条是基民盟。","start":90.5,"end":93.38},{"de":"Sie hatte früher die meisten Stimmen.","zh":"以前它得票最多。","start":93.74,"end":96.22},{"de":"Der rote Balken ist die SPD.","zh":"红色柱条是社会民主党。","start":96.88,"end":99.76},{"de":"Der grüne Balken ist die Partei die Grünen.","zh":"绿色柱条是绿党。","start":100.18,"end":103.22},{"de":"Der rosa Balken ist die Linkspartei.","zh":"粉色柱条是左翼党。","start":103.66,"end":106.38},{"de":"SPD, Grüne und Linkspartei haben fast gleich viele Stimmen.","zh":"社民党、绿党和左翼党得到的选票几乎一样多。","start":107.6,"end":113.44},{"de":"Der lila Balken ist die Partei Bündnis Sahra Wagenknecht, kurz BSW.","zh":"紫色柱条是“萨拉·瓦根克内希特联盟”政党，简称 BSW。","start":114.08,"end":120.94},{"de":"Das BSW ist zum ersten Mal im Parlament von Sachsen-Anhalt.","zh":"BSW 第一次进入萨克森-安哈尔特的议会。","start":121.3,"end":126.22},{"de":"Die AfD hat die Wahl gewonnen, weil sehr viele Menschen sie gewählt haben.","zh":"选择党赢得了选举，因为非常多人投了它。","start":127.62,"end":134.02},{"de":"Die AfD hat nämlich doppelt so viele Stimmen bekommen wie bei der letzten Wahl.","zh":"选择党得到的选票毕竟是上次选举的两倍。","start":134.44,"end":140.38},{"de":"Sie ist der große Sieger der Wahl.","zh":"它是这次选举的大赢家。","start":140.44,"end":142.88},{"de":"Die CDU dagegen hat sehr viele Stimmen verloren.","zh":"基民盟则失去了很多选票。","start":144.92,"end":148.28},{"de":"Sie hat nur halb so viele Stimmen bekommen wie bei der letzten Wahl.","zh":"它得到的选票只有上次选举的一半。","start":149.18,"end":153.98},{"de":"Die CDU ist der große Verlierer der Wahl.","zh":"基民盟是这次选举的大输家。","start":154.1,"end":158.1},{"de":"Dazu kommt jetzt ein Film.","zh":"（接下来是一段影片。","start":158.56,"end":160.4},{"de":"Die AfD feiert ihren Sieg.","zh":"）选择党在庆祝它的胜利。","start":161.62,"end":164.62},{"de":"Auf der Bühne steht Ulrich Siegmund von der AfD.","zh":"舞台上站着选择党的乌尔里希·西格蒙德。","start":164.72,"end":168.76},{"de":"Er will neuer Regierungschef in Sachsen-Anhalt werden.","zh":"他想成为萨克森-安哈尔特的新任政府首脑。","start":169.04,"end":172.84},{"de":"Siegmund sagt: Die Menschen in Sachsen-Anhalt wollen, dass die AfD regiert.","zh":"西格蒙德说：萨克森-安哈尔特的民众希望选择党执政。","start":172.96,"end":179.0},{"de":"Ich brauche aber Unterstützung.","zh":"但我需要支持。","start":179.16,"end":181.36},{"de":"Ich werde mit allen im Parlament sprechen und fragen, wer unterstützt meine Politik.","zh":"我会和议会里的所有人交谈，问一问谁支持我的政策。","start":181.52,"end":187.44},{"de":"Hier sind die Politiker von der CDU.","zh":"这些是基民盟的政治人物。","start":188.6,"end":191.16},{"de":"Sie sind erschrocken.","zh":"他们很震惊。","start":191.76,"end":193.28},{"de":"Die CDU hat viele Stimmen verloren.","zh":"基民盟失去了很多选票。","start":193.84,"end":196.84},{"de":"Das ist Sven Schulze.","zh":"这是斯文·舒尔策。","start":197.2,"end":198.72},{"de":"Er ist bisher Regierungschef.","zh":"他至今担任政府首脑。","start":198.84,"end":200.92},{"de":"Schulze sagt: Manche Menschen sagen: Heute ist ein trauriger Tag in Sachsen-Anhalt, weil eine rechtsextreme Partei die Wahl gewonnen hat.","zh":"舒尔策说：有些人说，今天是萨克森-安哈尔特悲伤的一天，因为一个极右翼政党赢得了选举。","start":201.0,"end":212.36},{"de":"Aber das ist Demokratie.","zh":"但这就是民主。","start":212.48,"end":214.2},{"de":"Wir und auch die anderen Parteien müssen jetzt überlegen, was machen wir.","zh":"我们以及其他政党现在必须思考，我们该怎么办。","start":214.84,"end":220.48},{"de":"Die AfD hat von den Wählerinnen und Wählern in Sachsen-Anhalt die meisten Stimmen bekommen.","zh":"萨克森-安哈尔特的选民把最多的选票投给了选择党。","start":225.76,"end":232.2},{"de":"Etwa die Hälfte der Wählerinnen und Wähler haben die AfD aber nicht gewählt.","zh":"但大约一半的选民并没有投选择党。","start":232.82,"end":237.9},{"de":"Am Tag nach der Wahl haben wir in Sachsen-Anhalt Menschen gefragt, wie sie den Sieg der AfD finden.","zh":"选举第二天，我们在萨克森-安哈尔特询问了民众对选择党获胜的看法。","start":238.44,"end":246.06},{"de":"Und es hat sich gezeigt: Manche Menschen haben große Hoffnungen und andere haben große Sorgen.","zh":"结果显示：一些人抱有很大的希望，另一些人则有很大的担忧。","start":246.16,"end":252.88},{"de":"Dazu zeigen wir einen Film.","zh":"接下来我们看一段影片。","start":253.44,"end":255.36},{"de":"Die Frau sagt: Ich freue mich, dass die AfD gewonnen hat.","zh":"这位女士说：选择党赢了，我很高兴。","start":256.22,"end":260.32},{"de":"Und diese Frau sagt: Ich hoffe, jetzt ändert sich etwas.","zh":"这位女士说：我希望现在能有所改变。","start":260.88,"end":264.96},{"de":"Dieser Mann sagt aber: Ich bin enttäuscht.","zh":"而这位男士说：我很失望。","start":265.68,"end":267.24},{"de":"Ich habe nicht erwartet, dass so viele Menschen hier die AfD wählen.","zh":"我没有想到会有这么多人在这里投选择党。","start":269.36,"end":274.16},{"de":"Und dieser Mann sagt: Ich fühle mich unsicher.","zh":"这位男士说：我感到不安。","start":275.86,"end":279.42},{"de":"Ich weiß nicht, was bringt die Zukunft?","zh":"我不知道未来会怎样？","start":279.48,"end":282.36},{"de":"Alles, an das ich geglaubt habe, wurde mit Füßen getreten.","zh":"我曾相信的一切都被践踏了。","start":282.64,"end":287.04},{"de":"Diese Frau sagt: Die AfD verdient eine Chance.","zh":"这位女士说：选择党值得获得一个机会。","start":287.8,"end":291.28},{"de":"Sie soll regieren.","zh":"它应该执政。","start":291.76,"end":293.04},{"de":"Diese Frau sagt: Ich möchte nicht, dass die AfD allein regiert.","zh":"这位女士说：我不希望选择党单独执政。","start":293.92,"end":298.56},{"de":"Ich möchte, dass die AfD gemeinsam mit einer anderen Partei regiert.","zh":"我希望选择党和另一个政党一起执政。","start":299.18,"end":305.22},{"de":"Die AfD braucht zum Regieren deshalb mindestens eine andere Partei.","zh":"因此选择党要执政，至少还需要另一个政党。","start":306.72,"end":312.2},{"de":"Das wird aber schwierig.","zh":"但这会很困难。","start":312.64,"end":314.44},{"de":"Die AfD in Sachsen-Anhalt ist nämlich rechtsextrem.","zh":"萨克森-安哈尔特的选择党毕竟是极右翼政党。","start":314.52,"end":318.08},{"de":"Die Partei sagt nicht nur: Viele Ausländer sollen Deutschland verlassen.","zh":"这个党不仅说：许多外国人应当离开德国。","start":319.18,"end":323.96},{"de":"Sie sagt auch: Kinder mit Behinderung sollen eigene Schulen bekommen.","zh":"它还说：有残疾的孩子应当上专门的学校。","start":324.0,"end":329.32},{"de":"Sie sollen nicht mit Kindern ohne Behinderung lernen.","zh":"他们不应当和没有残疾的孩子一起学习。","start":329.36,"end":333.04},{"de":"Die AfD sagt auch: Viele soziale Projekte erhalten kein Geld mehr.","zh":"选择党还说：许多社会项目将不再获得资金。","start":333.08,"end":338.4},{"de":"Keine andere Partei will deshalb gemeinsam mit der AfD regieren.","zh":"因此没有其他政党愿意和选择党一起执政。","start":339.0,"end":343.52},{"de":"Es ist deshalb unklar: Wann gibt es eine neue Regierung in Sachsen-Anhalt?","zh":"所以现在还不清楚：萨克森-安哈尔特什么时候能有一个新政府？","start":344.56,"end":350.08},{"de":"Das war unsere Sendung zur Wahl in Sachsen-Anhalt.","zh":"以上就是本期关于萨克森-安哈尔特选举的节目。","start":351.02,"end":354.54},{"de":"Und jetzt kommt das Wetter.","zh":"现在来看天气。","start":354.94,"end":356.54},{"de":"Im Süden und Osten viel Sonnenschein, sonst zeitweise auch Wolken.","zh":"南部和东部阳光充足，其他地区有时也有云。","start":357.2,"end":361.84},{"de":"Im Nordwesten mehr Wolken und teilweise Regen.","zh":"西北部云更多，部分地区有雨。","start":362.56,"end":366.4},{"de":"Es werden 19 bis 33 Grad.","zh":"气温在 19 到 33 度之间。","start":366.92,"end":369.16}],"stories":[{"title":"AfD gewinnt Landtagswahl in Sachsen-Anhalt","title_zh":"选择党赢得萨克森-安哈尔特州选举","from":0,"to":31,"vocab":[{"key":"bundesland","lemma":"das Bundesland, -er","pos":"Substantiv","zh":"联邦州","example_de":"Sachsen-Anhalt ist ein Bundesland im Osten von Deutschland.","example_zh":"萨克森-安哈尔特是德国东部的一个联邦州。"},{"key":"parlament","lemma":"das Parlament, -e","pos":"Substantiv","zh":"议会","example_de":"Die Menschen in Sachsen-Anhalt haben ein neues Parlament gewählt.","example_zh":"萨克森-安哈尔特的民众选出了一届新议会。"},{"key":"partei","lemma":"die Partei, -en","pos":"Substantiv","zh":"政党","example_de":"Die Partei Alternative für Deutschland hat die Wahl gewonnen.","example_zh":"每个柱条代表一个政党。"},{"key":"stimme","lemma":"die Stimme, -n","pos":"Substantiv","zh":"选票；声音","example_de":"Sie haben aber viel weniger Stimmen bekommen.","example_zh":"它得到的选票最多。"},{"key":"waehlen","lemma":"wählen","pos":"Verb","zh":"选举；投票选择","example_de":"Die Menschen in Sachsen-Anhalt haben ein neues Parlament gewählt.","example_zh":"选择党赢得了选举，因为非常多人投了它。"},{"key":"rechtsextrem","lemma":"rechtsextrem","pos":"Adjektiv","zh":"极右翼的","example_de":"Die AfD in Sachsen-Anhalt ist eine rechtsextreme Partei.","example_zh":"萨克森-安哈尔特的选择党是一个极右翼政党。"},{"key":"sieger","lemma":"der Sieger, -","pos":"Substantiv","zh":"获胜者","example_de":"Sie ist der große Sieger der Wahl.","example_zh":"它是这次选举的大赢家。"},{"key":"doppelt_so_viel","lemma":"doppelt so viel","pos":"Redewendung","zh":"两倍之多","example_de":"Die AfD hat nämlich doppelt so viele Stimmen bekommen wie bei der letzten Wahl.","example_zh":"选择党得到的选票是上次选举的两倍。"},{"key":"verlieren","lemma":"verlieren","pos":"Verb","zh":"输掉；失去","example_de":"Die CDU dagegen hat sehr viele Stimmen verloren.","example_zh":"基民盟则失去了很多选票。"}],"grammar":[{"title":"nämlich —— 插在句中补充原因","summary":"nämlich 不占句子框架的位置，插在句子中间，为前面说过的事补充原因，语气比 weil 从句轻。","example_de":"Die AfD hat nämlich doppelt so viele Stimmen bekommen wie bei der letzten Wahl.","example_zh":"因为选择党得到的选票是上次选举的两倍。"},{"title":"weil 从句动词置尾","summary":"weil 引导原因从句时，变位动词（这里是 haben）要放在从句的最末尾。","example_de":"Die AfD hat die Wahl gewonnen, weil sehr viele Menschen sie gewählt haben.","example_zh":"选择党赢得了选举，因为非常多人投了它。"}],"background":"萨克森-安哈尔特位于德国东部，首府马格德堡。据本期节目，选择党得票约是上届的两倍，成为州议会第一大党；基民盟得票约减半。左翼民粹政党“萨拉·瓦根克内希特联盟”（BSW）首次进入该州议会。"},{"title":"CDU verliert dagegen viele Stimmen","title_zh":"基民盟则失去大量选票","from":32,"to":48,"vocab":[{"key":"regierungschef","lemma":"der Regierungschef, -s","pos":"Substantiv","zh":"政府首脑（州长）","example_de":"Er will neuer Regierungschef in Sachsen-Anhalt werden.","example_zh":"他想成为萨克森-安哈尔特的新任政府首脑。"},{"key":"feiern","lemma":"feiern","pos":"Verb","zh":"庆祝","example_de":"Die AfD feiert ihren Sieg.","
