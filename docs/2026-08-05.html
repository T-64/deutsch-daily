    <div id="root"></div>
    <script id="dd-data" type="application/json">{"page":"lesson","lesson":{"slug":"2026-08-05","date":"2026-08-05","show":"tagesschau in Einfacher Sprache","level":"A2–B1","kind":"video","note":"","source_url":"https://www.tagesschau.de/tagesschau_in_einfacher_sprache/video-1626538.html","video":{"mp4":"https://tagesschau-progressive.ard-mcdn.de/video/2026/0805/TV-20260805-1745-4700.webl.h264.mp4","embed":"","page":"https://www.tagesschau.de/tagesschau_in_einfacher_sprache/video-1626538.html"},"duration":512.14,"sentences":[{"de":"In der Ukraine ist schon lange Krieg.","zh":"乌克兰已经战争了很久。","start":38.0,"end":47.72},{"de":"Russland hat die Ukraine nämlich angegriffen.","zh":"俄罗斯攻击了乌克兰。","start":48.06,"end":51.66},{"de":"Jetzt hat Russland wieder angegriffen, mit Raketen und mit Drohnen.","zh":"现在俄罗斯再次发动了攻击，","start":52.26,"end":57.46},{"de":"Das sind kleine Flugzeuge ohne Menschen, aber mit Waffen an Bord.","zh":"使用了导弹和无人机。","start":58.06,"end":63.34},{"de":"Mehrere Menschen sind bei den Angriffen gestorben.","zh":"无人机是没有人驾驶的小型飞机，","start":63.38,"end":67.38},{"de":"Und viele Gebäude sind zerstört.","zh":"但携带着武器。多人在袭击中丧生，","start":67.62,"end":72.7},{"de":"Viele Gebäude haben gebrannt.","zh":"许多建筑被毁。许多建筑起火燃烧。","start":73.38,"end":79.12},{"de":"Die Angriffe waren vor allem in der Region von der ukrainischen Hauptstadt.","zh":"袭击主要集中在乌克兰首都地区，叫基辅。","start":79.54,"end":86.62},{"de":"Sie heißt Kiew.","zh":"乌克兰拦截了许多俄罗斯无人机，","start":null,"end":null},{"de":"Die Ukraine hat viele russische Drohnen gestoppt, aber keine Raketen.","zh":"但没有拦截到导弹。","start":87.68,"end":93.58},{"de":"Die Ukraine hat nämlich zu wenige Waffen gegen Raketen.","zh":"因为乌克兰缺乏反导武器。","start":94.14,"end":99.82},{"de":"In Deutschland ist es gerade sehr heiß und trocken, vor allem im Süden.","zh":"德国目前非常炎热干燥，","start":101.48,"end":113.38},{"de":"In manchen Regionen gab es viele Wochen kaum Regen.","zh":"尤其是在南部。","start":113.42,"end":117.86},{"de":"Die Bauern haben deshalb Probleme mit den Feldern und mit der Ernte.","zh":"一些地区好几周几乎没有降雨。","start":118.42,"end":123.78},{"de":"Diese Zwiebeln sind zu klein.","zh":"农民因此在田地和收成上遇到了困难。","start":124.34,"end":130.2},{"de":"Sie wachsen schlecht.","zh":"这些洋葱太小了，长得很差。","start":130.5,"end":132.38},{"de":"Seit Wochen fehlt hier der Regen.","zh":"这里好几周没有下雨了。","start":132.42,"end":138.42},{"de":"Und die Behörden verbieten, Wasser aus dem Bach für das Feld zu nehmen.","zh":"而且当局禁止从小溪取水浇地。","start":138.82,"end":144.26},{"de":"Der Bauer Thomas Schmelzle sagt, wir hoffen auf Regen.","zh":"农民 Thomas Schmelzle 说：\"我们盼望下雨，","start":144.3,"end":149.14},{"de":"Sonst können wir nichts ernten.","zh":"否则什么都收不到。","start":149.18,"end":151.94},{"de":"Viele Flüsse sind wegen der Hitze trocken.","zh":"\"因为高温，很多河流干涸了。","start":152.58,"end":155.74},{"de":"Und auch das Grundwasser, also das Wasser im Boden, ist tiefer in der Erde als sonst.","zh":"地下水也——也就是土壤中的水——比平时更深。","start":156.14,"end":163.78},{"de":"Das Grundwasser ist wichtig für das Wasser, das wir trinken.","zh":"地下水对饮用水很重要。","start":163.82,"end":173.78},{"de":"Bauern brauchen eine Erlaubnis, wenn sie Trinkwasser für die Felder nehmen.","zh":"农民取用饮用水浇地需要许可证。","start":173.82,"end":180.14},{"de":"Michael Wingering ist von der Behörde für Umwelt.","zh":"环境局的 Michael Wingering 说，","start":180.34,"end":184.22},{"de":"Er sagt, wenn es weiter trocken bleibt, dann ist das Grundwasser noch tiefer im Boden.","zh":"如果持续干旱，地下水会继续下降。","start":185.06,"end":192.22},{"de":"So schlimm war es schon lange nicht mehr.","zh":"\"已经很久没有这么严重了。","start":192.86,"end":195.66},{"de":"Bauer Schmelzle hat einen eigenen Brunnen.","zh":"\"Schmelzle 农场有自己的水井，","start":195.7,"end":199.58},{"de":"Der Brunnen ist für den Notfall, wenn es nicht regnet.","zh":"但那是紧急情况备用的，","start":199.78,"end":212.26},{"de":"Dann hat der Brunnen zu wenig Wasser.","zh":"不降雨时井水也不够。","start":null,"end":null},{"de":"Auf dem großen Feld bleibt es trocken.","zh":"田地依然干旱，","start":212.42,"end":215.1},{"de":"Auch die Kartoffeln sind deshalb viel zu klein.","zh":"土豆也因此太小了。","start":215.5,"end":219.18},{"de":"Viele Leute machen im Sommer gerne Urlaub am Meer. Auch Menschen mit Rollstuhl. Für sie ist es am Strand aber sehr schwierig.","zh":"很多人夏天喜欢去海边度假，轮椅使用者也一样。","start":220.52,"end":236.9},{"de":"Im Sand kann der Rollstuhl nicht fahren. Deshalb können Menschen im Rollstuhl kaum Urlaub am Strand machen.","zh":"但对他们来说，在沙滩上很困难。","start":237.22,"end":245.38},{"de":"In dem Bundesland Mecklenburg-Vorpommern gibt es aber Strände für Rollstuhlfahrer.","zh":"轮椅在沙子里没法走。","start":245.42,"end":254.94},{"de":"Einer davon ist in Boltenhagen an der Ostsee. Der Rollstuhl steckt im Sand fest.","zh":"所以在梅前州有专门为轮椅设计的海滩，其中一处是波罗的海边的博尔滕哈根。","start":255.5,"end":266.44},{"de":"Ines Scholz hat deshalb länger keinen Urlaub am Meer gemacht.","zh":"Ines Scholz 因此很久没去海边度假了。","start":267.14,"end":272.14},{"de":"Sie sagt, wenn ich am Meer bin, dann will ich auch an den Strand. Ich will meine Füße ins Wasser halten.","zh":"她说：\"如果我在海边，我也想去沙滩。","start":274.26,"end":282.78},{"de":"Das ist mein Traum. Aber das geht nicht. Das macht mich sehr traurig.","zh":"我想把脚放进水里，这是我的梦想。","start":283.02,"end":289.38},{"de":"Bei der Hitze ist sie dann doch gekommen. Mit ihrer Schwester Evelin Dahl. Sie hatte zuerst keine Lust.","zh":"但这做不到，让我很伤心。","start":289.42,"end":309.58},{"de":"Aber dann hat sie im Internet gesehen, zwei Wege zum Strand in Boltenhagen sind barrierefrei.","zh":"\"在高温下她还是来了，和姐姐 Evelin Dahl 一起。","start":309.62,"end":327.98},{"de":"Daina Rykov hat den Strand für Rollstühle ausgebaut. Sie sagt, es macht mich glücklich, wenn ich Menschen helfen kann.","zh":"一开始她不情愿，后来在网上看到博尔滕哈根有两条到沙滩的无障碍通道。","start":328.3,"end":333.34},{"de":"Es gibt Wege für Rollstühle bis zum Strandkorb. Man kann den Strandkorb drehen und sich leichter hineinsetzen.","zh":"Daina Rykov 改建了这个轮椅友好海滩。","start":333.54,"end":351.74},{"de":"Und man kann in verschiedene Richtungen schauen, ohne aufzustehen.","zh":"她说：\"能帮助别人让我很开心。","start":351.78,"end":358.14},{"de":"Ines Scholz sagt, ich bin sehr glücklich. Ich kann in einem Strandkorb sitzen.","zh":"\"这里修了轮椅通道直通沙滩椅（Strandkorb），沙滩椅可以旋转，方便坐进去，不用站起来就能朝不同方向看。","start":358.18,"end":360.3},{"de":"Ich bin am Strand und nah am Wasser und bei den anderen Menschen. Dafür bin ich sehr dankbar.","zh":"Ines Scholz 说：\"我非常开心。","start":370.26,"end":372.94},{"de":"Bislang gibt es nur wenige Wege und wenige Strandkörbe zum Drehen.","zh":"我可以坐在沙滩椅上，在沙滩上、靠近水面、和其他人在一起。","start":372.98,"end":378.3},{"de":"Daina Rykov will den Strand aber weiter ausbauen. Alle Strandkörbe sollen barrierefrei sein. Das ist aber teuer.","zh":"\"目前可旋转的沙滩椅还很少。","start":378.34,"end":398.06},{"de":"Deshalb dauert es noch, bis alles barrierefrei ist.","zh":"Daina Rykov 想继续扩建，但费用很高，全面无障碍化还需要时间。","start":398.5,"end":402.26},{"de":"Guatemala ist ein Land in Mittelamerika, also zwischen Nord- und Südamerika.","zh":"危地马拉是中美洲的一个国家，","start":402.3,"end":422.02},{"de":"In der Nähe von der Hauptstadt von Guatemala ist ein Vulkan ausgebrochen.","zh":"位于北美和南美之间。","start":422.86,"end":429.02},{"de":"Der Vulkan heißt Fuego.","zh":"在危地马拉首都附近，一座火山爆发了。","start":429.06,"end":433.82},{"de":"Das ist Spanisch und bedeutet auf Deutsch Feuer.","zh":"这座火山叫 Fuego（西班牙语，","start":434.3,"end":438.38},{"de":"Aus dem Vulkan kommt Lava.","zh":"德语意思是\"火\"）。火山喷出岩浆，","start":439.22,"end":445.5},{"de":"Das ist die rote, heiße Flüssigkeit.","zh":"那是红色、滚烫的液体。","start":445.54,"end":448.66},{"de":"Und aus dem Vulkan kommen Gas, Asche und Steine.","zh":"火山还喷出气体、火山灰和石头，","start":449.14,"end":453.3},{"de":"Das ist gefährlich für die Menschen.","zh":"对人类很危险。很多人不得不离开家园，","start":453.44,"end":455.72},{"de":"Viele Menschen mussten die Häuser verlassen und sich in Sicherheit bringen.","zh":"转移到安全地带。","start":455.78,"end":461.9},{"de":"Sie warten jetzt, dass sich der Vulkan wieder beruhigt.","zh":"他们现在在等待火山平息下来。","start":461.94,"end":466.1},{"de":"In der Hauptstadt von Frankreich, Paris, ist gerade die Schwimm-EM, also die Europameisterschaft für Schwimmen.","zh":"在法国首都巴黎，正在举行欧洲游泳锦标赛。","start":467.6,"end":484.22},{"de":"Der Mann auf dem Foto ist Florian Wellbrock.","zh":"照片上的人是 Florian Wellbrock。","start":484.26,"end":488.46},{"de":"Er hat in Paris zweimal Gold gewonnen, beim Freiwasserschwimmen.","zh":"他在巴黎赢得了两枚金牌，是在公开水域游泳项目中。","start":488.86,"end":494.94},{"de":"Das bedeutet Schwimmen im Meer, im See oder im Fluss.","zh":"公开水域游泳指的是在海里、湖里或河里游泳。","start":494.98,"end":499.94},{"de":"Wellbrock war der Beste beim 10-Kilometer-Schwimmen und beim 5-Kilometer-Schwimmen.","zh":"Wellbrock 在10公里和5公里游泳中都是最好的。","start":500.86,"end":507.42},{"de":"Das war in dem bekannten französischen Fluss Seine.","zh":"比赛在著名的法国河流塞纳河中进行。","start":507.46,"end":512.14}],"stories":[{"title":"Ukraine — Russische Angriffe","title_zh":"乌克兰 — 俄罗斯袭击","from":0,"to":10,"vocab":[{"key":"angriff","lemma":"der Angriff (Angriffe)","pos":"","zh":"攻击、袭击","example_de":"Die Angriffe waren vor allem in der Region von der ukrainischen Hauptstadt.","example_zh":""},{"key":"rakete","lemma":"die Rakete (-n)","pos":"","zh":"导弹","example_de":"mit Raketen und mit Drohnen","example_zh":""},{"key":"drohne","lemma":"die Drohne (-n)","pos":"","zh":"无人机","example_de":"Das sind kleine Flugzeuge ohne Menschen.","example_zh":""},{"key":"stoppen","lemma":"stoppen","pos":"Verb","zh":"阻止、拦截","example_de":"Die Ukraine hat viele Drohnen gestoppt.","example_zh":""},{"key":"zerstören","lemma":"zerstören","pos":"Verb","zh":"摧毁","example_de":"Viele Gebäude sind zerstört.","example_zh":""},{"key":"waffe","lemma":"die Waffe (-n)","pos":"","zh":"武器","example_de":"zu wenige Waffen gegen Raketen","example_zh":""}],"grammar":[{"title":"namely = nämlich（语气助词）","summary":"namely = nämlich（语气助词） nämlich 放在句子中间，解释前面说的话的原因。相当于中文\"因为\"\"也就是说\"。直觉感受：前面抛出一个信息，nämlich 紧接着给你补充原因。 \"Russland hat die Ukraine nämlich angegriffen.\" → （乌克兰有战争）因为俄罗斯攻击了它。","example_de":"因为","example_zh":""}],"background":"俄乌战争始于2022年2月。乌克兰使用防空系统拦截无人机相对容易（速度慢、体积大），但拦截高速导弹需要更先进的系统（如爱国者），而乌克兰数量不足。基辅是乌克兰首都，几乎每周都遭受袭击。"},{"title":"Zu wenig Wasser — Probleme für Bauern","title_zh":"缺水 — 农民面临困难","from":11,"to":31,"vocab":[{"key":"trocken","lemma":"trocken","pos":"Verb","zh":"干燥的","example_de":"In Deutschland ist es gerade sehr heiß und trocken, vor allem im Süden.","example_zh":""},{"key":"ernte","lemma":"die Ernte (-n)","pos":"","zh":"收获、收成","example_de":"Die Bauern haben deshalb Probleme mit den Feldern und mit der Ernte.","example_zh":""},{"key":"grundwasser","lemma":"das Grundwasser","pos":"","zh":"地下水","example_de":"Und auch das Grundwasser, also das Wasser im Boden, ist tiefer in der Erde als sonst.","example_zh":""},{"key":"brunnen","lemma":"der Brunnen (-)","pos":"","zh":"水井","example_de":"Bauer Schmelzle hat einen eigenen Brunnen.","example_zh":""},{"key":"verbieten","lemma":"verbieten","pos":"Verb","zh":"禁止","example_de":"Und die Behörden verbieten, Wasser aus dem Bach für das Feld zu nehmen.","example_zh":""},{"key":"erlaubnis","lemma":"die Erlaubnis (-se)","pos":"","zh":"许可、批准","example_de":"Bauern brauchen eine Erlaubnis, wenn sie Trinkwasser für die Felder nehmen.","example_zh":""},{"key":"wachsen","lemma":"wachsen","pos":"Verb","zh":"生长","example_de":"Sie wachsen schlecht.","example_zh":""},{"key":"zwiebel","lemma":"die Zwiebel (-n)","pos":"","zh":"洋葱","example_de":"Diese Zwiebeln sind zu klein.","example_zh":""}],"grammar":[{"title":"wegen + Genitiv（因为）","summary":"wegen + Genitiv（因为） wegen 支配第二格（Genitiv），表示原因。\"Wegen der Hitze\" = 因为高温。直觉感受：wegen 给你一个名词，告诉你事情是这个名词造成的。 \"Viele Flüsse sind wegen der Hitze trocken.\" als sonst（比往常） als 比较级 + sonst = 比平常。简单对比：\"tiefer als sonst\" = 比平时更深。","example_de":"Wegen der Hitze","example_zh":""}],"background":"2026年夏季欧洲遭遇严重干旱，德国南部（巴伐利亚、巴登-符腾堡）尤为严重。德国地下水管理严格：农民不能随意抽水灌溉，必须向环保部门申请许可。地下水位下降不仅影响农业，也威胁城市饮用水供应。"},{"title":"Urlaub mit Rollstuhl am Strand","title_zh":"坐轮椅在海边度假","from":32,"to":48,"vocab":[{"key":"rollstuhl","lemma":"der Rollstuhl (..stühle)","pos":"","zh":"轮椅","example_de":"Auch Menschen mit Rollstuhl.","example_zh":""},{"key":"barrierefrei","lemma":"barrierefrei","pos":"","zh":"无障碍的","example_de":"Aber dann hat sie im Internet gesehen, zwei Wege zum Strand in Boltenhagen sind barrierefrei.","example_zh":""},{"key":"strandkorb","lemma":"der Strandkorb (..körbe)","pos":"","zh":"沙滩椅（德式遮阳椅）","example_de":"Es gibt Wege für Rollstühle bis zum Strandkorb.","example_zh":""},{"key":"feststecken","lemma":"feststecken","pos":"Verb","zh":"卡住、陷住","example_de":"Der Rollstuhl steckt im Sand fest.","example_zh":""},{"key":"ausbauen","lemma":"ausbauen","pos":"Verb","zh":"扩建、改进","example_de":"Daina Rykov will den Strand aber weiter ausbauen.","example_zh":""},{"key":"dankbar","lemma":"dankbar","pos":"","zh":"感激的","example_de":"Dafür bin ich sehr dankbar.","example_zh":""},{"key":"lust","lemma":"die Lust (no pl.)","pos":"","zh":"兴趣、兴致","example_de":"Sie hatte zuerst keine Lust.","example_zh":""},{"key":"drehen","lemma":"drehen","pos":"Verb","zh":"旋转、转动","example_de":"Man kann den Strandkorb drehen und sich leichter hineinsetzen.","example_zh":""}],"grammar":[{"title":"ohne ... zu + 不定式（没有/不…就…）","summary":"ohne ... zu + 不定式（没有/不…就…） ohne ... zu 表示\"在没有做某事的情况下\"。结构：ohne + 名词/代词 + zu + 动词不定式。 \"Man kann schauen, ohne aufzustehen.\" → 不用站起来就能看。 deshalb（因此） deshalb 是最常见的因果连词之一，放在句子开头或中间。引出结果。 \"Deshalb können Menschen im Rollstuhl kaum Urlaub machen.\"","example_de":"在没有做某事的情况下","example_zh":""}],"background":"Strandkorb（沙滩椅）是德国北海和波罗的海沿岸的标志性设施，一种带遮阳篷的双人藤椅，租金约每天10-20欧元。德国有《联邦无障碍平等法》（BGG），要求公共场所逐步实现无障碍化。梅前州（梅克伦堡-前波美拉尼亚）是德国东北部的度假胜地。"},{"title":"Guatemala — Vulkan ausgebrochen","title_zh":"危地马拉 — 火山喷发","from":49,"to":58,"vocab":[{"key":"ausbrechen","lemma":"ausbrechen (bricht aus)","pos":"Redewendung","zh":"爆发","example_de":"Ein Vulkan ist ausgebrochen.","example_zh":""},{"key":"lava","lemma":"die Lava (no pl.)","pos":"","zh":"岩浆","example_de":"Aus dem Vulkan kommt Lava.","example_zh":""},{"key":"asche","lemma":"die Asche (-n)","pos":"","zh":"灰烬","example_de":"Und aus dem Vulkan kommen Gas, Asche und Steine.","example_zh":""},{"key":"gefährlich","lemma":"gefährlich","pos":"","zh":"危险的","example_de":"Das ist gefährlich für die Menschen.","example_zh":""},{"key":"beruhigen","lemma":"beruhigen (sich ~)","pos":"Redewendung","zh":"平静下来","example_de":"Sie warten, dass sich der Vulkan beruhigt.","example_zh":""},{"key":"bedeuten","lemma":"bedeuten","pos":"Verb","zh":"意味着","example_de":"Das bedeutet auf Deutsch Feuer.","example_zh":""}],"grammar":[{"title":"sich + 动词（反身动词）","summary":"sich + 动词（反身动词） sich beruhigen = 平静下来。反身代词 sich 指向主语本身。\"sich der Vulkan beruhigt\" = 火山让自己安静下来。德语中很多动词必须反身使用，没有对应英语翻译。 \"Sie warten, dass sich der Vulkan wieder beruhigt.\"","example_de":"sich der Vulkan beruhigt","example_zh":""}],"background":"富埃戈火山（Volcán de Fuego）是中美洲最活跃的火山之一，海拔约3763米，距危地马拉城约44公里。2018年曾发生大规模喷发，造成数百人死亡。危地马拉有37座火山，其中3座目前活跃。该国位于环太平洋火山带上。"},{"title":"Schwimm-EM — Gold für Wellbrock","title_zh":"游泳欧锦赛 — 韦尔布罗克夺金","from":59,"to":64,"vocab":[{"key":"em","lemma":"die EM (= Europameisterschaft)","pos":"","zh":"欧锦赛","example_de":"In der Hauptstadt von Frankreich, Paris, ist gerade die Schwimm-EM, also die Europameisterschaft für Schwimmen.","example_zh":""},{"key":"gewinnen","lemma":"gewinnen (gewinnt)","pos":"","zh":"赢得","example_de":"Er hat zweimal Gold gewonnen.","example_zh":""},{"key":"freiwasserschwimmen","lemma":"das Freiwasserschwimmen","pos":"","zh":"公开水域游泳","example_de":"Er hat in Paris zweimal Gold gewonnen, beim Freiwasserschwimmen.","example_zh":""},{"key":"fluss","lemma":"der Fluss (Flüsse)","pos":"","zh":"河流","example_de":"Das bedeutet Schwimmen im Meer, im See oder im Fluss.","example_zh":""},{"key":"see","lemma":"der See (-n)","pos":"","zh":"湖泊","example_de":"Das bedeutet Schwimmen im Meer, im See oder im Fluss.","example_zh":""}],"grammar":[{"title":"beim + 名词（在…时候/在…方面）","summary":"beim + 名词（在…时候/在…方面） beim = bei + dem（第三格）。表示\"在某项活动中\"。 \"Er war der Beste beim 10-Kilometer-Schwimmen.\" → 在10公里游泳项目中他是最好的。","example_de":"在某项活动中","example_zh":""}],"background":"Florian Wellbrock（1997年生）是德国最优秀的公开水域游泳运动员，2021东京奥运会10公里金牌得
