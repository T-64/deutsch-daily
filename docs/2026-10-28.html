    <script id="dd-data" type="application/json">{"page":"lesson","lesson":{"slug":"2026-10-28","date":"2026-10-28","show":"tagesschau in Einfacher Sprache","level":"A2–B1","kind":"broadcast","note":"","source_url":"https://www.tagesschau.de/tagesschau_in_einfacher_sprache/tse-1492.html","video":{"mp4":"https://tagesschau-progressive.ard-mcdn.de/video/2026/1028/TV-20261028-1741-2700.webl.h264.mp4","embed":"","page":"https://www.tagesschau.de/tagesschau_in_einfacher_sprache/video-1674120.html"},"duration":492.82,"sentences":[{"de":"Willkommen zur tagesschau in Einfacher Sprache.","zh":"欢迎收看简易语言_tagesschau。","start":7.86,"end":11.42},{"de":"Ich bin Michael Paweletz und das sind unsere Nachrichten.","zh":"我是Michael Paweletz，以下是我们的新闻。","start":11.82,"end":15.82},{"de":"Und nun zur ersten Nachricht:","zh":"现在来看第一条新闻：","start":36.94,"end":39.02},{"de":"In Spanien hat es einen Unfall mit Zügen gegeben.","zh":"西班牙发生了一起火车事故。","start":45.54,"end":50.7},{"de":"Zwei Züge sind zusammengestoßen.","zh":"两列火车相撞了。","start":50.74,"end":53.3},{"de":"Mehr als 60 Menschen sind bei dem Unfall gestorben.","zh":"超过60人在事故中丧生。","start":54.1,"end":58.06},{"de":"Der Unfall war in der Nähe von der Hauptstadt Madrid.","zh":"事故发生在首都马德里附近。","start":59.54,"end":64.02},{"de":"Dazu kommt jetzt ein Film.","zh":"接下来请看一段影片。","start":65.7,"end":68.06},{"de":"Das Unglück passiert am Morgen.","zh":"事故发生在早晨。","start":69.62,"end":72.38},{"de":"Ein Schnellzug fährt von hinten in einen stehenden Zug.","zh":"一列高速火车从后面撞上了一列停着的火车。","start":72.62,"end":76.82},{"de":"Waggons springen von den Schienen.","zh":"多节车厢脱轨。","start":76.98,"end":79.42},{"de":"Helfer versuchen Verletzte zu retten und Tote zu finden.","zh":"救援人员努力抢救伤者、寻找遇难者。","start":80.02,"end":84.42},{"de":"Für viele Reisende ein Schock.","zh":"对许多乘客来说，这是一场惊吓。","start":84.7,"end":87.1},{"de":"Dieser Mann sagt, etwas traf uns von hinten.","zh":"这名男子说：有东西从后面撞上了我们。","start":88.14,"end":91.82},{"de":"Alles flog durcheinander.","zh":"所有东西都乱飞。","start":92.22,"end":94.06},{"de":"Menschen wurden durch die Luft geschleudert.","zh":"有人被抛到空中。","start":94.3,"end":97.46},{"de":"Es ist schon das zweite schwere Unglück bei der Bahn in Spanien in 2026.","zh":"这已经是2026年西班牙铁路的第二起严重事故。","start":98.02,"end":103.14},{"de":"Der König von Spanien sagt: Das Unglück ist schrecklich.","zh":"西班牙国王说：这场事故太可怕了。","start":104.14,"end":109.3},{"de":"Wir trauern mit den Angehörigen der Opfer und wollen sie in diesen harten Momenten unterstützen.","zh":"我们与遇难者家属一同哀悼，并希望在这个艰难时刻支持他们。","start":109.58,"end":116.46},{"de":"Auf der Strecke mit dem Unglück fahren keine Züge mehr.","zh":"事故发生的线路已没有火车运行。","start":117.94,"end":121.78},{"de":"Experten untersuchen jetzt, wie konnte der Unfall passieren.","zh":"专家正在调查事故是如何发生的。","start":122.22,"end":126.42},{"de":"Erste Erkenntnisse deuten auf einen menschlichen Fehler.","zh":"初步调查结果显示是人为失误。","start":127.22,"end":131.14},{"de":"Und nun zur nächsten Nachricht.","zh":"现在来看下一条新闻。","start":132.54,"end":134.74},{"de":"In Israel wurde ein neues Parlament gewählt.","zh":"以色列举行了新议会的选举。","start":139.94,"end":143.78},{"de":"Es gibt aber keinen klaren Gewinner.","zh":"但没有明确的赢家。","start":144.18,"end":146.94},{"de":"Der Chef von der bisherigen Regierung in Israel heißt Benjamin Netanjahu.","zh":"以色列现任政府的领导人名叫本雅明·内塔尼亚胡。","start":148.02,"end":153.18},{"de":"Er ist links auf dem Foto.","zh":"他在照片的左边。","start":154.98,"end":156.82},{"de":"Die Unterstützer von Benjamin Netanjahu haben bei der Wahl die meisten Stimmen bekommen.","zh":"本雅明·内塔尼亚胡的支持者在选举中获得了最多的选票。","start":158.18,"end":164.98},{"de":"Auch die Gegner von Netanjahu haben viele Stimmen bekommen.","zh":"内塔尼亚胡的反对者也获得了很多选票。","start":165.7,"end":169.86},{"de":"Aber keine Seite kann alleine eine Regierung bilden.","zh":"但任何一方都无法单独组建政府。","start":170.38,"end":174.02},{"de":"Viele Stimmen gingen nämlich an arabische Parteien.","zh":"因为很多选票投给了阿拉伯政党。","start":175.38,"end":179.26},{"de":"Auf diese Parteien kommt es jetzt an.","zh":"现在关键要看这些政党。","start":179.98,"end":182.62},{"de":"Dazu kommt jetzt ein Film.","zh":"接下来请看一段影片。","start":183.34,"end":185.18},{"de":"Der Morgen nach der Wahl.","zh":"选举后的早晨。","start":186.7,"end":188.58},{"de":"Und es gibt keinen klaren Sieger.","zh":"目前没有明确的胜者。","start":188.94,"end":191.3},{"de":"Abgestimmt haben so viele Menschen in Israel wie seit Jahrzehnten nicht.","zh":"以色列的投票人数达到了几十年来最多。","start":191.86,"end":197.22},{"de":"Für Benjamin Netanyahu ist das Ergebnis ein Erfolg.","zh":"对本雅明·内塔尼亚胡来说，这个结果是一次成功。","start":197.9,"end":201.46},{"de":"Seine Partei hat die meisten Stimmen bekommen.","zh":"他的政党获得了最多的选票。","start":202.38,"end":205.9},{"de":"Jetzt will Netanyahu wieder Chef von der Regierung werden.","zh":"现在内塔尼亚胡想再次成为政府领导人。","start":206.34,"end":210.34},{"de":"Er sagt, die neue Regierung darf nicht von arabischen Parteien abhängen.","zh":"他说，新政府不能依赖阿拉伯政党。","start":211.26,"end":217.14},{"de":"Denn diese arabischen Parteien sind gegen den Staat Israel.","zh":"因为这些阿拉伯政党反对以色列国家。","start":217.62,"end":222.34},{"de":"Jeder fünfte Mensch in Israel ist arabisch und nicht jüdisch.","zh":"以色列每五个人中就有一个是阿拉伯人，而不是犹太人。","start":224.1,"end":228.9},{"de":"Arabische Parteien haben bei der Wahl viele Stimmen bekommen.","zh":"阿拉伯政党在选举中获得了不少选票。","start":229.7,"end":233.86},{"de":"Deshalb sind die arabischen Parteien jetzt wichtig für eine neue Regierung.","zh":"因此阿拉伯政党现在对新政府的组建很重要。","start":234.62,"end":239.94},{"de":"Dieser Mann heißt Gadi Eisenkot.","zh":"这名男子名叫加迪·艾森科特。","start":241.14,"end":243.42},{"de":"Auch er will Chef von der neuen Regierung werden.","zh":"他也想成为新政府的领导人。","start":244.22,"end":247.66},{"de":"Eisenkot müsste dafür aber mit den arabischen Parteien zusammenarbeiten.","zh":"但艾森科特必须为此与阿拉伯政党合作。","start":248.3,"end":253.22},{"de":"Gadi Eisenkot sagt, die Menschen wollen einen Wechsel der Regierung.","zh":"加迪·艾森科特说，民众希望政府更迭。","start":254.46,"end":259.38},{"de":"Die Menschen vertrauen Benjamin Netanjahu nicht mehr.","zh":"民众不再信任本雅明·内塔尼亚胡。","start":259.58,"end":263.82},{"de":"Eine Zusammenarbeit mit den arabischen Parteien finden nicht alle Unterstützer von Eisenkot gut.","zh":"并非所有艾森科特的支持者都赞同与阿拉伯政党合作。","start":264.9,"end":271.94},{"de":"Wer kann eine neue Regierung in Israel bilden?","zh":"谁能组建以色列的新政府？","start":273.7,"end":277.62},{"de":"Es bleibt kompliziert.","zh":"情况依然复杂。","start":278.22,"end":279.78},{"de":"Und nun zur nächsten Nachricht.","zh":"现在来看下一条新闻。","start":281.78,"end":283.98},{"de":"Eltern von Babys und kleinen Kindern müssen in Deutschland nicht arbeiten.","zh":"在德国，婴儿和幼童的父母可以不工作。","start":289.62,"end":295.1},{"de":"Sie bekommen dann Unterstützung vom Staat.","zh":"他们会得到国家的补助。","start":295.74,"end":298.82},{"de":"Diese Unterstützung heißt Elterngeld.","zh":"这项补助叫做育儿金（Elterngeld）。","start":299.62,"end":302.86},{"de":"Eltern können das Geld 14 Monate lang bekommen.","zh":"父母最长可以领取这笔钱14个月。","start":303.9,"end":307.18},{"de":"Die Bundesregierung will aber sparen.","zh":"但联邦政府想要节省开支。","start":308.58,"end":311.22},{"de":"Sie wollte nur noch für zwölf Monate Elterngeld bezahlen.","zh":"它原本只想支付12个月的育儿金。","start":311.98,"end":315.98},{"de":"Jetzt sagt die Bundesregierung aber, es bleibt bei 14 Monaten.","zh":"但现在联邦政府表示，仍维持14个月不变。","start":318.02,"end":322.38},{"de":"Änderungen beim Elterngeld gibt es trotzdem.","zh":"不过育儿金还是有变化。","start":323.62,"end":327.1},{"de":"Väter sollen nämlich länger auf ihre Kinder aufpassen.","zh":"因为父亲应该更长时间地照顾孩子。","start":327.82,"end":331.74},{"de":"Wenn Eltern 14 Monate lang Geld bekommen wollen, müssen Väter mindestens vier Monate auf ihr Kind aufpassen.","zh":"如果父母想领取14个月的育儿金，父亲必须至少照顾孩子四个月。","start":332.7,"end":341.82},{"de":"Auch Mütter müssen dann mindestens vier Monate bei ihrem Kind sein und nicht arbeiten.","zh":"母亲也必须至少四个月陪在孩子身边并且不工作。","start":342.62,"end":348.7},{"de":"Wie viel Geld die Eltern bekommen, das hängt vom Einkommen vor der Geburt von dem Kind ab.","zh":"父母能领多少钱，取决于孩子出生前的收入。","start":349.98,"end":357.5},{"de":"Zur nächsten Nachricht:","zh":"来看下一条新闻：","start":359.94,"end":361.58},{"de":"In Brasilien wurde ein neuer Präsident gewählt.","zh":"巴西选出了新总统。","start":368.1,"end":371.38},{"de":"Der Gewinner von der Wahl heißt Lula da Silva.","zh":"选举的获胜者名叫卢拉·达席尔瓦。","start":372.06,"end":375.86},{"de":"Er war schon oft Präsident in Brasilien.","zh":"他曾经多次担任巴西总统。","start":377.06,"end":379.86},{"de":"Der Verlierer von der Wahl heißt Flavio Bolsonaro.","zh":"选举的失败者名叫弗拉维奥·博索纳罗。","start":381.14,"end":384.66},{"de":"Das ist der Mann auf dem Foto.","zh":"他就是照片上的这个人。","start":386.9,"end":389.06},{"de":"Die Polizei in Brasilien untersucht Vorwürfe gegen Flavio Bolsonaro.","zh":"巴西警方正在调查针对弗拉维奥·博索纳罗的指控。","start":390.1,"end":394.9},{"de":"Die Vorwürfe sind Korruption und illegale Geschäfte.","zh":"指控涉及腐败和非法交易。","start":397.1,"end":400.74},{"de":"Flavio Bolsonaro sagt, ich habe das nicht gemacht.","zh":"弗拉维奥·博索纳罗说：我没有做过这些事。","start":403.34,"end":407.5},{"de":"Das oberste Gericht in Brasilien hat aber entschieden, wenn die Polizei ermittelt, darf Flavio Bolsonaro Brasilien nicht verlassen.","zh":"但巴西最高法院裁定：在警方调查期间，弗拉维奥·博索纳罗不得离开巴西。","start":408.9,"end":419.1},{"de":"Jetzt hat Flavio Bolsonaro Brasilien aber trotzdem verlassen.","zh":"但现在弗拉维奥·博索纳罗还是离开了巴西。","start":421.42,"end":426.3},{"de":"Er ist in den USA.","zh":"他现在在美国。","start":426.98,"end":428.26},{"de":"Die Regierung von den USA sagt, Bolsonaro darf in den USA bleiben.","zh":"美国政府表示，博索纳罗可以留在美国。","start":430.14,"end":434.78},{"de":"Dort kann ihn die Polizei von Brasilien nicht fassen.","zh":"在美期间，巴西警方无法抓捕他。","start":437.3,"end":441.02},{"de":"Und das waren unsere Nachrichten.","zh":"以上是我们的新闻。","start":444.14,"end":446.5},{"de":"Und jetzt kommt das Wetter.","zh":"现在来看天气。","start":467.7,"end":469.62},{"de":"Unten im Süden gibt es Nebel, manchmal auch Sonne.","zh":"南部地区有雾，有时也有太阳。","start":471.22,"end":474.74},{"de":"Sonst ist es öfter trüb, mit Nebel oder Wolken.","zh":"其他地方多为阴天，有雾或云。","start":475.26,"end":478.54},{"de":"An manchen Orten gibt es etwas Regen.","zh":"一些地方有少量降雨。","start":479.46,"end":482.1},{"de":"Das war die tagesschau in Einfacher Sprache.","zh"
