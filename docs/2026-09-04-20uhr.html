<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Deutsch Daily — 2026-09-04</title>
<style>
  :root {
    --bg: #eef2f0;
    --surface: #ffffff;
    --surface-2: #f7f9f8;
    --ink: #172127;
    --ink-soft: #647077;
    --line: #dce4e1;
    --accent: #176b72;
    --accent-strong: #0d5057;
    --accent-soft: #dceeed;
    --warm: #d98f39;
    --warm-soft: #fff0d9;
    --zh: #5f696f;
    --danger: #b3493f;
    --shadow: 0 18px 50px rgba(20, 46, 47, .10);
    --shadow-soft: 0 8px 24px rgba(20, 46, 47, .07);
  }
  [data-theme="dark"] {
    --bg: #111719; --surface: #192124; --surface-2: #202a2d;
    --ink: #edf3f1; --ink-soft: #a9b7b8; --line: #344145;
    --accent: #75cbd0; --accent-strong: #99dfe2; --accent-soft: #223e40;
    --warm: #f0b35e; --warm-soft: #3b3022; --zh: #bac5c5;
    --shadow: 0 18px 50px rgba(0,0,0,.28); --shadow-soft: 0 8px 24px rgba(0,0,0,.22);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { scroll-behavior: smooth; scroll-padding-top: 90px; }
  body {
    min-height: 100vh; background: var(--bg); color: var(--ink);
    font: 16px/1.65 Inter, ui-sans-serif, system-ui, -apple-system, "Noto Sans SC", sans-serif;
    transition: background .2s, color .2s;
  }
  button, input, textarea { font: inherit; }
  button, a { -webkit-tap-highlight-color: transparent; }
  button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible {
    outline: 3px solid color-mix(in srgb, var(--accent) 35%, transparent); outline-offset: 2px;
  }
  .app { width: min(1280px, calc(100% - 48px)); margin: 0 auto; padding: 24px 0 100px; }
  .topbar {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    min-height: 42px; margin-bottom: 34px;
  }
  .brand {
    display: inline-flex; align-items: center; gap: 10px; color: var(--ink);
    font-weight: 800; letter-spacing: -.02em; text-decoration: none;
  }
  .brand-mark {
    display: grid; place-items: center; width: 30px; height: 30px; border-radius: 9px;
    background: var(--accent); color: #fff; font: 800 12px/1 ui-monospace, monospace;
  }
  .top-actions { display: flex; align-items: center; gap: 8px; }
  .icon-btn, .archive-link, .text-btn {
    min-height: 38px; border: 1px solid var(--line); border-radius: 12px;
    background: var(--surface); color: var(--ink-soft); cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; text-decoration: none;
  }
  .icon-btn { width: 38px; }
  .archive-link, .text-btn { gap: 7px; padding: 0 13px; font-size: 13px; font-weight: 700; }
  .hero { margin-bottom: 26px; }
  .eyebrow {
    color: var(--accent); font-size: 12px; font-weight: 800; letter-spacing: .12em;
    text-transform: uppercase; margin-bottom: 9px;
  }
  .hero h1 {
    max-width: 720px; font: 750 clamp(29px, 4vw, 50px)/1.08 ui-serif, Georgia, serif;
    letter-spacing: -.04em;
  }
  .hero-meta { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 13px; color: var(--ink-soft); font-size: 14px; }
  .hero-meta span { display: inline-flex; align-items: center; gap: 7px; }

  .study-grid { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: clamp(20px, 3.2vw, 48px); align-items: start; }
  .side {
    position: sticky; top: 16px; max-height: calc(100vh - 24px);
    display: flex; flex-direction: column; min-height: 0;
  }
  .study-panel {
    display: flex; flex-direction: column; gap: 16px; min-height: 0; max-height: calc(100vh - 24px);
    background: transparent; border: 0; box-shadow: none; overflow: visible;
  }
  .video-card {
    position: relative; flex: 0 0 auto; overflow: hidden; background: #071012;
    border-radius: 24px; box-shadow: var(--shadow-soft);
  }
  .player { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #071012; }
  .player iframe, .player video { position: absolute; inset: 0; display: block; width: 100%; height: 100%; border: 0; background: #071012; }
  .video-drag {
    display: none; position: absolute; z-index: 3; top: 0; left: 0; right: 36px; height: 32px;
    cursor: grab; touch-action: none;
    background: linear-gradient(to bottom, rgba(0,0,0,.5), transparent);
  }
  .video-drag:active { cursor: grabbing; }
  .video-float-close {
    display: none; border: 0; background: rgba(255,255,255,.14); color: #fff;
    width: 28px; height: 28px; border-radius: 50%; cursor: pointer;
  }
  .rail {
    display: flex; flex-direction: column; flex: 1; min-height: 0;
    padding: 18px 18px 16px; border: 1px solid var(--line); border-radius: 24px;
    background: var(--surface); box-shadow: var(--shadow-soft); overflow: hidden;
  }
  .rail-bar { padding: 0 0 12px; }
  .controls { display: flex; width: 100%; }
  .controls button {
    flex: 1; min-height: 40px; padding: 0 14px; border: 1px solid var(--line); border-radius: 12px;
    background: var(--surface-2); color: var(--ink-soft); cursor: pointer; font-size: 14px; font-weight: 750;
  }
  .controls button.on { border-color: var(--accent); background: var(--accent); color: #fff; }
  .hero-meta a { color: var(--accent); text-decoration: none; font-weight: 700; }
  .hero-meta a:hover { text-decoration: underline; }
  .topic-nav { flex: 1; min-height: 0; overflow-y: auto; padding: 0; scrollbar-gutter: stable; }
  .topic { border-top: 1px solid var(--line); }
  .topic:first-child { border-top: 0; }
  .topic > a {
    display: grid; grid-template-columns: 32px minmax(0,1fr); gap: 10px; align-items: start;
    padding: 11px 0; color: var(--ink); text-decoration: none;
  }
  .topic > a span {
    min-width: 0; padding-top: 5px;
    font: 650 15px/1.35 ui-serif, Georgia, serif; letter-spacing: -.015em;
  }
  .topic > a:hover span { color: var(--accent); }
  .topic b {
    display: grid; place-items: center; width: 32px; height: 32px; border-radius: 10px;
    background: var(--accent-soft); color: var(--accent-strong);
    font: 800 11px/1 ui-monospace, monospace;
  }
  .topic.on b { background: var(--accent); color: #fff; }
  .topic.on > a span { color: var(--accent-strong); }
  .topic-study { display: none; padding: 0 0 12px; }
  .topic.on .topic-study { display: block; }
  .topic-study .empty-study { color: var(--ink-soft); font-size: 13px; padding: 6px 0; }
  .study-tabs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-top: 2px; }
  .study-tabs.n2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .study-tabs.n1 { grid-template-columns: 1fr; }
  .stab {
    min-height: 32px; padding: 0 6px; border: 1px solid var(--line); border-radius: 11px;
    background: var(--surface-2); color: var(--ink-soft); cursor: pointer;
    font-size: 12px; font-weight: 750;
  }
  .stab:hover { border-color: var(--accent); color: var(--accent-strong); }
  .stab.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-strong); }
  .spane { display: none; margin-top: 6px; }
  .spane.on { display: block; }
  .vrow {
    display: grid; grid-template-columns: minmax(0,1fr) 28px; gap: 8px; align-items: start;
    padding: 10px 0; border-top: 1px dashed var(--line);
  }
  .vrow .vw { color: var(--ink); font: 750 14.5px/1.35 ui-serif, Georgia, serif; }
  .vrow .vz { margin-top: 4px; color: var(--accent-strong); font-size: 13.5px; }
  .vrow .vex { margin-top: 6px; color: var(--ink-soft); font-size: 13px; font-style: italic; }
  .vadd {
    width: 28px; height: 28px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--surface); color: var(--accent-strong); cursor: pointer;
    font: 700 18px/1 ui-sans-serif, system-ui;
  }
  .vadd:hover { border-color: var(--accent); background: var(--accent-soft); }
  .rail-note { margin: 0; padding: 10px 0; color: var(--ink-soft); font-size: 13.5px; line-height: 1.7; }
  .rail-note + .rail-note { border-top: 1px dashed var(--line); }
  .rail-note strong { display: block; margin-bottom: 4px; color: var(--ink); font: 750 14.5px/1.35 ui-serif, Georgia, serif; }
  .rail-note i { display: block; margin-bottom: 6px; }
  @media (min-width: 841px) { .article-extras { display: none; } }

  .reader { min-width: 0; }
  .first-run {
    display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 16px; align-items: start;
    margin-bottom: 16px; padding: 16px 18px; border: 1px solid var(--line); border-radius: 16px;
    background: var(--accent-soft); color: var(--ink-soft); font-size: 13.5px;
  }
  .first-run[hidden] { display: none; }
  .first-run strong { display: block; margin-bottom: 3px; color: var(--accent-strong); }
  .first-run button { border: 0; background: transparent; color: var(--ink-soft); cursor: pointer; font-weight: 800; }
  .legend { color: var(--ink-soft); }
  article {
    scroll-margin-top: 24px; margin-bottom: 22px; padding: clamp(22px, 4vw, 38px);
    border: 1px solid var(--line); border-radius: 24px; background: var(--surface);
    box-shadow: var(--shadow-soft);
  }
  .n-head { display: grid; grid-template-columns: 42px minmax(0,1fr); gap: 13px; align-items: start; margin-bottom: 24px; }
  .n-idx {
    display: grid; place-items: center; width: 42px; height: 42px; border-radius: 13px;
    background: var(--accent-soft); color: var(--accent-strong); font: 800 13px/1 ui-monospace, monospace;
  }
  .n-head h2, .h-zh {
    padding-top: 3px;
    color: var(--ink);
    font: 750 clamp(21px, 3vw, 28px)/1.25 ui-serif, Georgia, "Noto Serif CJK SC", "Noto Serif SC", serif;
    letter-spacing: -.025em;
  }
  .h-zh { margin-top: 6px; padding-top: 0; }
  .para { display: flex; flex-direction: column; align-items: stretch; margin-bottom: 22px; }
  .para:last-child { margin-bottom: 8px; }
  .sent {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    width: 100%;
    min-width: 0;
    margin: 0 0 0.8em;
  }
  .sent[data-start] { cursor: pointer; }
  .de {
    max-width: 100%;
    font: var(--reader-size, 18.5px)/1.55 ui-serif, Georgia, "Noto Serif", serif;
    letter-spacing: .003em;
  }
  .de w {
    cursor: pointer; border-radius: 4px; transition: background .12s, color .12s;
    text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px;
    text-decoration-color: transparent;
  }
  .de w:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; background: var(--accent-soft); }
  .de w:hover, .de w:active { background: var(--warm-soft); text-decoration-color: var(--warm); }
  .de w.known { text-decoration-color: color-mix(in srgb, var(--accent) 55%, transparent); }
  .de w.ed { text-decoration-style: solid; text-decoration-thickness: 1.5px; }
  .de w.wiki { text-decoration-style: dotted; text-decoration-color: color-mix(in srgb, var(--ink-soft) 55%, transparent); }
  .de w.saved { color: var(--accent-strong); background: var(--accent-soft); text-decoration-color: transparent; }
  .sent.now .de {
    background: color-mix(in srgb, var(--accent-soft) 70%, transparent);
    border-radius: 4px;
  }
  .zh {
    margin-top: 3px;
    width: 100%;
    max-width: 100%;
    color: var(--ink);
    font: 400 15.5px/1.45 Inter, ui-sans-serif, "Noto Sans SC", sans-serif;
  }
  body.hide-zh .zh { display: none; }
  body.hide-zh .para { display: block; }
  body.hide-zh .sent { display: inline; width: auto; margin: 0 0.45em 0 0; }
  body.hide-zh .sent .de { display: inline; line-height: 1.82; }
  .n-head .h-zh {
    margin-top: 6px;
    padding-top: 0;
    color: var(--ink);
    font: 750 clamp(21px, 3vw, 28px)/1.25 ui-serif, Georgia, "Noto Serif CJK SC", "Noto Serif SC", serif;
    letter-spacing: -.025em;
  }
  .article-extras details { margin-top: 10px; border: 1px solid var(--line); border-radius: 13px; background: var(--surface-2); }
  .article-extras details summary {
    list-style: none; cursor: pointer; padding: 12px 14px; color: var(--ink-soft);
    display: flex; align-items: center; gap: 9px; font-size: 13px; font-weight: 750;
  }
  .article-extras details summary::before {
    content: "+"; display: inline-grid; place-items: center; width: 20px; height: 20px;
    border-radius: 7px; background: var(--surface); color: var(--accent); font-size: 14px;
  }
  .article-extras details[open] summary::before { content: "−"; }
  .article-extras details summary::-webkit-details-marker { display: none; }
  .article-extras details .body { padding: 2px 14px 15px 43px; color: var(--ink-soft); font-size: 13.5px; line-height: 1.75; }
  .article-extras details .body strong { color: var(--ink); }
  .vcard { display: grid; grid-template-columns: minmax(0,1fr) 28px; gap: 8px; align-items: start; padding: 10px 0; border-bottom: 1px dashed var(--line); }
  .vcard:last-child { border-bottom: 0; }
  .gcard { padding: 12px 0; border-bottom: 1px dashed var(--line); }
  .gcard:last-child { border-bottom: 0; }
  .vcard-top, .gcard h4 { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px; font: 750 14.5px/1.35 ui-serif, Georgia, serif; color: var(--ink); }
  .article-extras .vadd {
    width: 28px; height: 28px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--surface); color: var(--accent-strong); cursor: pointer;
    font: 700 18px/1 ui-sans-serif, system-ui;
  }
  .vpos { color: var(--ink-soft); font: 750 11px/1.2 ui-sans-serif, system-ui; letter-spacing: .06em; text-transform: uppercase; }
  .vzh { margin-top: 4px; color: var(--accent-strong); font-size: 13.5px; }
  .vex, .gex { margin-top: 6px; color: var(--ink-soft); font-size: 13px; font-style: italic; }
  .gexzh { color: var(--zh); font-size: 12.5px; }
  .gmore { margin-top: 8px; color: var(--ink-soft); font-size: 13px; }
  .bg-note { margin: 0 0 8px; color: var(--ink-soft); font-size: 12px; }

  .scrim { position: fixed; inset: 0; z-index: 55; display: none; background: rgba(7,16,18,.48); backdrop-filter: blur(3px); }
  .scrim.on { display: block; }
  #pop {
    position: fixed; z-index: 70; display: none; width: min(360px, calc(100vw - 24px));
    border: 1px solid var(--line); border-radius: 18px; padding: 18px;
    background: var(--surface); color: var(--ink); box-shadow: var(--shadow);
  }
  #pop.open { display: block; }
  .pop-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  #pop .pw { font: 750 21px/1.2 ui-serif, Georgia, serif; word-break: break-word; }
  #pop .pp { margin-top: 3px; color: var(--ink-soft); font-size: 11px; font-weight: 750; letter-spacing: .08em; text-transform: uppercase; }
  #pop .pclose { border: 0; background: var(--surface-2); color: var(--ink-soft); width: 30px; height: 30px; border-radius: 9px; cursor: pointer; }
  #pop .pz { margin-top: 12px; color: var(--accent-strong); font-weight: 700; }
  #pop .pz:empty::after { content: "还没有释义，你可以自己补充"; color: var(--ink-soft); font-weight: 400; }
  #pop .pe { margin-top: 9px; padding-top: 9px; border-top: 1px solid var(--line); color: var(--ink-soft); font-size: 12.5px; font-style: italic; }
  .pop-actions { display: flex; gap: 8px; margin-top: 14px; }
  .pbtn, .secondary-btn, .primary-btn {
    min-height: 40px; border-radius: 11px; padding: 0 13px; cursor: pointer; font-size: 13px; font-weight: 750;
  }
  .pbtn { flex: 1; border: 1px solid var(--accent); background: var(--accent); color: #fff; }
  .pbtn.in { border-color: var(--line); background: var(--surface-2); color: var(--ink-soft); }
  .secondary-btn { border: 1px solid var(--line); background: var(--surface); color: var(--ink-soft); }
  .primary-btn { border: 1px solid var(--accent); background: var(--accent); color: #fff; }
  .word-form { display: grid; gap: 11px; }
  .word-form label { display: grid; gap: 5px; color: var(--ink-soft); font-size: 12px; font-weight: 700; }
  .word-form input, .word-form textarea {
    width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px;
    background: var(--surface-2); color: var(--ink); resize: vertical;
  }
  .word-form textarea { min-height: 66px; }
  .form-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 3px; }

  #basket-btn {
    position: fixed; right: 22px; bottom: max(22px, env(safe-area-inset-bottom)); z-index: 45;
    display: inline-flex; align-items: center; gap: 9px; min-height: 48px; padding: 0 18px;
    border: 0; border-radius: 15px; background: var(--ink); color: var(--surface);
    box-shadow: var(--shadow); cursor: pointer; font-weight: 800;
  }
  #basket-btn .cnt { min-width: 23px; padding: 2px 7px; border-radius: 99px; background: var(--warm); color: #172127; font-size: 12px; }
  #basket {
    position: fixed; inset: 0 0 0 auto; z-index: 65; width: min(440px, 100vw);
    display: flex; flex-direction: column; padding: 24px 24px calc(24px + env(safe-area-inset-bottom));
    background: var(--surface); box-shadow: -20px 0 60px rgba(7,16,18,.18);
    transform: translateX(105%); transition: transform .22s ease;
  }
  #basket.open { transform: translateX(0); }
  #basket .bhead { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 16px; }
  #basket .bhead h3 { font-size: 22px; letter-spacing: -.02em; }
  #basket .bhead p { margin-top: 2px; color: var(--ink-soft); font-size: 12.5px; }
  #basket .bclose { border: 0; background: var(--surface-2); color: var(--ink-soft); width: 36px; height: 36px; border-radius: 11px; font-size: 20px; cursor: pointer; }
  .basket-add { width: 100%; margin-bottom: 12px; }
  #basket .blist { overflow-y: auto; flex: 1; padding-right: 4px; }
  .bitem { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 5px 10px; padding: 13px 0; border-bottom: 1px solid var(--line); }
  .bitem .bw { font: 750 16px/1.3 ui-serif, Georgia, serif; }
  .bitem .bz { grid-column: 1; color: var(--accent-strong); font-size: 13px; }
  .bitem .be { grid-column: 1; overflow: hidden; color: var(--ink-soft); font-size: 11.5px; text-overflow: ellipsis; white-space: nowrap; }
  .bitem-actions { grid-column: 2; grid-row: 1 / span 3; align-self: center; display: flex; gap: 3px; }
  .bitem-actions button { border: 0; background: transparent; color: var(--ink-soft); padding: 7px; cursor: pointer; font-size: 12px; }
  .bitem-actions .bx { color: var(--danger); }
  #basket .bfoot { display: flex; gap: 8px; margin-top: 14px; }
  #basket .bfoot button { flex: 1; }
  #basket .bfoot button:disabled { opacity: .5; cursor: wait; }
  #basket .bstatus { min-height: 18px; margin-top: 8px; color: var(--ink-soft); text-align: center; font-size: 12px; }
  .bempty { padding: 42px 14px; color: var(--ink-soft); text-align: center; font-size: 13px; }
  .bempty b { display: block; margin-bottom: 5px; color: var(--ink); font-size: 15px; }
  #word-editor {
    display: none; padding: 15px; margin-bottom: 12px; border: 1px solid var(--line);
    border-radius: 14px; background: var(--surface-2);
  }
  #word-editor.open { display: block; }
  #toast {
    position: fixed; left: 50%; bottom: 28px; z-index: 90; display: none;
    transform: translateX(-50%); padding: 10px 16px; border-radius: 12px;
    background: var(--ink); color: var(--surface); box-shadow: var(--shadow); font-size: 13px; font-weight: 700;
  }
  @media (max-width: 840px) {
    .app { width: min(100% - 28px, 720px); padding-top: 15px; padding-left: max(14px, env(safe-area-inset-left)); padding-right: max(14px, env(safe-area-inset-right)); }
    .topbar { margin-bottom: 24px; }
    .study-grid { display: block; }
    .side { position: static; max-height: none; margin-bottom: 18px; }
    .study-panel { display: contents; max-height: none; }
    .video-card { border-radius: 20px; box-shadow: var(--shadow); }
    .rail {
      position: sticky; top: env(safe-area-inset-top); z-index: 30; margin: 10px 0 18px; padding: 8px 12px;
      border-radius: 20px;
    }
    .rail-bar { padding: 0; }
    .topic-nav { display: none; }
    .video-card.floating {
      position: fixed; z-index: 48; top: 72px; right: 10px; left: auto; width: min(48vw, 210px);
      border: 1px solid rgba(255,255,255,.2); border-radius: 14px; box-shadow: 0 18px 45px rgba(0,0,0,.28);
    }
    .video-card.floating .video-drag { display: block; }
    .video-card.floating .video-float-close { display: block; position: absolute; z-index: 4; top: 6px; right: 6px; }
    .video-card.float-off { display: none; }
    article { border-radius: 20px; }
  }
  @media (max-width: 560px) {
    .app { width: 100%; padding: 12px 12px 88px; padding-left: max(12px, env(safe-area-inset-left)); padding-right: max(12px, env(safe-area-inset-right)); }
    .brand span:last-child { display: none; }
    .text-btn { padding: 0 10px; font-size: 12px; }
    .archive-link { width: 38px; padding: 0; font-size: 0; }
    .archive-link svg { width: 17px; }
    .hero { padding: 0 5px; margin-bottom: 18px; }
    .hero h1 { font-size: 30px; }

<script>
const DATA = {"date": "2026-09-04", "slug": "2026-09-04-20uhr", "source": "20uhr", "source_label": "T-64 · tagesschau 20:00 Uhr", "source_short": "20:00 Uhr", "video_page": "https://www.tagesschau.de/tagesschau_20_uhr/video-1642952.html", "embed_url": "https://www.tagesschau.de/tagesschau_20_uhr/video-1642952~player.html", "mp4_url": "https://tagesschau-progressive.ard-mcdn.de/video/2026/0904/TV-20260904-2021-4600.webl.h264.mp4", "duration": 952.28, "news": [{"title": "Sparplan für VW beschlossen", "title_zh": "大众汽车节省计划获通过", "paras": [{"start": 4.68, "end": 48.8, "lines": [{"de": "Der Aufsichtsrat von VW hat seinen Widerstand gegen die Sparpläne des Vorstands aufgegeben.", "zh": "大众汽车监事会放弃了对董事会节省计划的抵制。", "start": 4.68, "end": 28.36}, {"de": "Gestern Abend wurde das Konzept einstimmig gebilligt.", "zh": "昨晚该方案获得一致批准。", "start": 28.44, "end": 31.96}, {"de": "Es sieht vor, im ganzen Konzern weitere 50.000 Stellen zu streichen - noch einmal so viele wie vor zwei Jahren beschlossen.", "zh": "方案规定在整个集团再裁减50000个岗位——和两年前通过的规模一样多。", "start": 32.04, "end": 40.36}, {"de": "Was aus den Standorten Emden, Hannover, Zwickau, Neckarsulm wird, soll Mitte 2027 entschieden werden.", "zh": "埃姆登、汉诺威、茨维考、内卡苏尔姆这些基地的命运应于2027年年中决定。", "start": 40.84, "end": 48.8}]}, {"start": 51.32, "end": 116.88, "lines": [{"de": "Emden in Niedersachsen, hier am Standort arbeiten 8000 Menschen.", "zh": "下萨克森州的埃姆登，这个基地有8000名员工。", "start": 51.32, "end": 55.72}, {"de": "Tausende weitere Jobs hängen indirekt an VW.", "zh": "还有数千个岗位间接依附于大众。", "start": 55.8, "end": 58.84}, {"de": "Wenn VW wegfällt, kannste ganz Ostfriesland dichtmachen.", "zh": "要是大众撤了，整个东弗里斯兰都能关门了。", "start": 61.08, "end": 64.84}, {"de": "Im Zwickauer VW-Werk produziert VW mit 10.000 Beschäftigten nur E-Autos.", "zh": "在茨维考大众工厂，10000名员工只生产电动车。", "start": 65.52, "end": 70.12}, {"de": "Die Verlagerung findet statt in die Nachbarländer.", "zh": "生产正在向邻国转移。", "start": 73.08, "end": 76.48}, {"de": "Wir müssen über die Frage sprechen, was kostet Energie?", "zh": "我们必须谈谈这个问题：能源要花多少钱？", "start": 76.6, "end": 80.48}, {"de": "Wie sind unsere Arbeitszeitgesetze?", "zh": "我们的工时法是怎么规定的？", "start": 80.68, "end": 82.92}, {"de": "VW-Nutzfahrzeuge in Hannover, bekannt für den traditionellen Bulli.", "zh": "汉诺威的大众商用车，以传统的Bulli面包车闻名。", "start": 83.0, "end": 87.0}, {"de": "Hier bangen rund 14.200 Menschen um ihren Job.", "zh": "这里约14200人在为饭碗发愁。", "start": 87.08, "end": 90.0}, {"de": "Wir müssen die Arbeitszeit senken, damit die Arbeit für alle reicht.", "zh": "我们必须缩短工时，好让工作够所有人分。", "start": 90.28, "end": 94.32}, {"de": "Krankenstände sind so hoch wie nie zuvor.", "zh": "病假率高得前所未有。", "start": 94.44, "end": 97.04}, {"de": "Die Leute wollen diese Unsicherheit nicht mehr.", "zh": "人们不愿再要这种不确定性。", "start": 97.12, "end": 100.32}, {"de": "Schichtwechsel bei Audi in Neckarsulm.", "zh": "内卡苏尔姆奥迪工厂的换班时分。", "start": 102.04, "end": 104.76}, {"de": "Auch dieses Werk ist gefährdet.", "zh": "这座工厂也面临威胁。", "start": 104.84, "end": 106.84}, {"de": "15.500 Arbeitsplätze stehen auf der Kippe.", "zh": "15500个工作岗位岌岌可危。", "start": 106.96, "end": 109.88}, {"de": "Das soll das obere Management auch mittragen.", "zh": "这一点高层管理人员也应当共同承担。", "start": 110.64, "end": 114.36}, {"de": "Nicht nur der kleine Hansmann.", "zh": "而不只是小小的Hansmann。", "start": 114.44, "end": 116.88}]}, {"start": 118.28, "end": 189.44, "lines": [{"de": "Gestern Abend hat der Aufsichtsrat dem Sanierungsplan des VW-Vorstands einstimmig zugestimmt.", "zh": "昨晚监事会一致通过了大众董事会的重组计划。", "start": 118.28, "end": 124.04}, {"de": "Es geht darum, Kosten zu sparen, Strukturen zu vereinfachen und mehr Gewinn zu machen.", "zh": "目标是节省成本、精简架构、赚取更多利润。", "start": 124.12, "end": 129.72}, {"de": "Von den 50.000 zusätzlichen Stellen soll allein etwa die Hälfte in Deutschland wegfallen.", "zh": "新增裁减的50000个岗位中，约一半将单独落在德国。", "start": 129.8, "end": 135.0}, {"de": "Der VW-Chef versucht, die Belegschaft einzuschwören.", "zh": "大众掌门人试图让全体员工同心协力。", "start": 135.12, "end": 138.4}, {"de": "Zusammenrücken, wenn es darauf ankommt.", "zh": "在关键时刻抱团。", "start": 138.48, "end": 140.88}, {"de": "Verantwortung übernehmen, wenn eine schwierige Lage es erfordert.", "zh": "在困难局势要求时承担责任。", "start": 140.96, "end": 144.72}, {"de": "Das ist die Volkswagen-Familie.", "zh": "这就是大众家族。", "start": 144.8, "end": 146.64}, {"de": "Jetzt kommt es auf uns an.", "zh": "现在要靠我们自己了。", "start": 146.72, "end": 148.28}, {"de": "Auf jeden einzelnen, jedes Team, jeden Standort und jede Marke.", "zh": "靠每一个人、每个团队、每个基地和每个品牌。", "start": 148.4, "end": 152.04}, {"de": "Emden, Hannover, Zwickau und Neckarsulm könnten ab 2031 ohne wettbewerbsfähigen Produktionsauftrag da stehen.", "zh": "埃姆登、汉诺威、茨维考和内卡苏尔姆从2031年起可能落到没有具备竞争力的生产订单的境地。", "start": 152.12, "end": 160.28}, {"de": "Ich glaube, dass man an Werksschließungen nicht drum herum kommt.", "zh": "我认为工厂关闭是绕不开的。", "start": 161.72, "end": 166.44}, {"de": "Das wurde im Aufsichtsrat festgelegt: Man nimmt 500.000 Fahrzeuge aus dem Produktionsnetz.", "zh": "监事会上已确定：从生产网络中拿掉500000辆车。", "start": 166.52, "end": 173.16}, {"de": "Laut Konzernspitze prüfe man aktuell Alternativen.", "zh": "据集团高层称，目前正在研究替代方案。", "start": 177.24, "end": 181.24}, {"de": "Schließungen seien damit zwar nicht beschlossen, aber auch nicht ausgeschlossen.", "zh": "关厂一事既未决定，但也未被排除。", "start": 181.32, "end": 186.12}, {"de": "Bis Juni 2027 sollen die Lösungen auf dem Tisch liegen.", "zh": "到2027年6月，方案应当摆上桌面。", "start": 186.2, "end": 189.44}]}, {"start": 191.48, "end": 259.52, "lines": [{"de": "Annette Deutskens in Hannover: Werksschließungen sind bisher nicht ausgeschlossen.", "zh": "汉诺威的Annette Deutskens：工厂关闭目前并未被排除。", "start": 191.48, "end": 197.2}, {"de": "Wie könnte die Zukunft von VW aussehen?", "zh": "大众的未来会是什么样？", "start": 197.28, "end": 200.28}, {"de": "Ich gehe davon aus, dass wir einen deutlich kleineren VW-Konzern sehen werden.", "zh": "我预计我们将看到一个明显变小的大众集团。", "start": 204.6, "end": 209.72}, {"de": "Weniger Werke, weniger Beschäftigte, weniger Modelle.", "zh": "更少的工厂、更少的员工、更少的车型。", "start": 209.8, "end": 212.88}, {"de": "Und für die Standorte, vor allem in Deutschland, zeichnen sich vor allem drei mögliche Szenarien ab: Erstens: Gelingt es, an einem Standort die Kosten wettbewerbsfähig hinzukriegen?", "zh": "而对于各基地，尤其是德国的，主要呈现出三种可能的情景：第一，能否让某个基地的成本降到有竞争力？", "start": 212.96, "end": 225.0}, {"de": "Wenn das Produkt nachgefragt wird, dann kann es gelingen, noch Autos zu produzieren.", "zh": "如果产品有市场需求，继续生产汽车是可能的。", "start": 225.08, "end": 230.16}, {"de": "Dafür müssten die Kosten aber extrem nach unten gehen.", "zh": "但成本必须大幅下降。", "start": 230.24, "end": 233.4}, {"de": "Zweitens: Wenn das nicht klappt, könnte man sich um Kooperationen mit anderen Partnern aus der Industrie kümmern.", "zh": "第二，如果做不到，可以寻求与业内其他伙伴合作。", "start": 233.48, "end": 240.72}, {"de": "Die Rüstung wird häufig genannt.", "zh": "国防工业经常被提到。", "start": 240.8, "end": 242.8}, {"de": "Drittens werden nicht alle Standorte gerettet werden können.", "zh": "第三，不是所有基地都能保住。", "start": 242.92, "end": 246.6}, {"de": "So oder so muss Volkswagen jetzt weiter an den Kosten arbeiten und an innovativen Modellen.", "zh": "无论如何，大众现在都必须继续在成本和创新车型上下功夫。", "start": 246.68, "end": 252.04}, {"de": "Noch ist der Konzern mit all seinen Marken bei den Verbrennern und E-Autos Marktführer in Europa.", "zh": "目前该集团旗下的各品牌在燃油车和电动车上仍是欧洲市场领袖。", "start": 252.12, "end": 257.8}, {"de": "Danke, Annette Deutskens.", "zh": "谢谢，Annette Deutskens。", "start": 257.88, "end": 259.52}]}, {"start": 259.6, "end": 340.44, "lines": [{"de": "Und damit rüber zu Markus Gürne an die Frankfurter Börse.", "zh": "接下来把话题交给法兰克福证券交易所的Markus Gürne。", "start": 259.6, "end": 263.0}, {"de": "Wie ist der VW-Sparplan dort aufgenommen worden?", "zh": "大众的节省计划在那里反响如何？", "start": 263.12, "end": 266.36}, {"de": "Anleger befürworten den harten Sparplan.", "zh": "投资者支持这项严厉的节省计划。", "start": 268.0, "end": 270.68}, {"de": "Das zeigt sich eindeutig am Kurssprung der VW-Aktie um 6,5 Prozent.", "zh": "大众股价跳涨6,5个百分点清楚地表明了这一点。", "start": 270.76, "end": 275.56}, {"de": "Aktionäre mussten in der Vergangenheit krisenfest sein.", "zh": "股东们过去必须经得起危机的考验。", "start": 275.68, "end": 279.04}, {"de": "Keine Auto-Aktie am deutschen Aktienmarkt hat in den vergangenen fünf Jahren so viel verloren wie VW: Mehr als 60 Prozent.", "zh": "德国股市上没有哪只汽车股在过去五年里像大众一样跌得这么惨：超过60个百分点。", "start": 279.12, "end": 286.8}, {"de": "Die Hoffnung ist, dass VW mit dem Sparprogramm eine gute Zukunft hat.", "zh": "人们希望大众能凭借节省计划拥有一个好未来。", "start": 286.88, "end": 291.44}, {"de": "Wie hat sich der Vorstand mit seinen Plänen durchsetzen können?", "zh": "董事会是如何让自己的方案获得通过的呢？", "start": 292.48, "end": 296.56}, {"de": "Im Aufsichtsrat sitzen sehr mächtige Betriebsratsvorsitzende und Vertreter des Landes Niedersachsen.", "zh": "监事会里坐着势力强大的职工委员会主席们和下萨克森州的代表。", "start": 298.32, "end": 304.76}, {"de": "Beide waren im Vorfeld sehr skeptisch gegenüber dem Spar- und Sanierungsplan eingestellt.", "zh": "这两方事先都对节省和重组计划持强烈怀疑态度。", "start": 304.84, "end": 310.0}, {"de": "Eine Blockade im Gremium war möglich.", "zh": "委员会内出现阻挠是有可能的。", "start": 310.08, "end": 312.28}, {"de": "Daher drohte der VW-Vorstand, das Sanierungsprogramm den Aktionären auf einer außerordentlichen Hauptversammlung vorzulegen.", "zh": "因此大众董事会威胁把重组方案直接提交给一场特别股东大会。", "start": 312.36, "end": 319.92}, {"de": "Dort wollte man sich die Zustimmung holen.", "zh": "他们想从股东那里拿到批准。", "start": 320.0, "end": 322.44}, {"de": "Die Eigentümerfamilien Piech und Porsche halten durch Aktienpakete die Stimmenmehrheit.", "zh": "大股东家族皮耶希和保时捷凭借持股掌握多数表决权。", "start": 322.52, "end": 327.6}, {"de": "Die Zustimmung wäre wohl erreicht worden.", "zh": "批准本来大概率能拿到。", "start": 327.68, "end": 330.08}, {"de": "Damit wäre der Aufsichtsrat umgangen worden.", "zh": "这样监事会就被绕开了。", "start": 330.16, "end": 332.92}, {"de": "Nach Ansicht von Analysten hat diese Drohung den Druck erzeugt, der die einstimmige Einigung zum Sanierungsplan möglich machte.", "zh": "分析师认为，正是这一威胁制造了压力，使重组计划的一致通过成为可能。", "start": 333.04, "end": 340.44}]}], "vocab": [{"lemma": "der Aufsichtsrat, -räte", "key": "aufsichtsrat", "forms": ["Aufsichtsrat", "Aufsichtsrates"], "pos": "Substantiv", "zh": "监事会", "example_de": "Der Aufsichtsrat von VW hat seinen Widerstand gegen die Sparpläne des Vorstands aufgegeben.", "example_zh": "大众汽车监事会放弃了对董事会节省计划的抵制。"}, {"lemma": "einstimmig", "key": "einstimmig", "forms": ["einstimmig"], "pos": "Adjektiv/Adverb", "zh": "一致地（无异议）地", "example_de": "Gestern Abend wurde das Konzept einstimmig gebilligt.", "example_zh": "昨晚该方案获得一致批准。"}, {"lemma": "streichen (Stellen)", "key": "streichen", "forms": ["zu streichen", "streichen"], "pos": "Verb", "zh": "裁减、削减（岗位）；本义为划掉", "example_de": "Es sieht vor, im ganzen Konzern weitere 50.000 Stellen zu streichen - noch einmal so viele wie vor zwei Jahren beschlossen.", "example_zh": "方案规定在整个集团再裁减50000个岗位。"}, {"lemma": "der Standort, -e", "key": "standort", "forms": ["Standort", "Standorten", "Standorte"], "pos": "Substantiv", "zh": "生产基地、厂址", "example_de": "Was aus den Standorten Emden, Hannover, Zwickau, Neckarsulm wird, soll Mitte 2027 entschieden werden.", "example_zh": "埃姆登、汉诺威、茨维考、内卡苏尔姆这些基地的命运应于2027年年中决定。"}, {"lemma": "einschwören", "key": "einschwoeren", "forms": ["einzuschwören", "einschwören"], "pos": "Verb", "zh": "使宣誓同心、号召团结一致", "example_de": "Der VW-Chef versucht, die Belegschaft einzuschwören.", "example_zh": "大众掌门人试图让全体员工同心协力。"}, {"lemma": "die Belegschaft, -en", "key": "belegschaft", "forms": ["Belegschaft"], "pos": "Substantiv", "zh": "全体员工、职工队伍", "example_de": "Der VW-Chef versucht, die Belegschaft einzuschwören.", "example_zh": "大众掌门人试图让全体员工同心协力。"}, {"lemma": "wettbewerbsfähig", "key": "wettbewerbsfaehig", "forms": ["wettbewerbsfähigen", "wettbewerbsfähig"], "pos": "Adjektiv", "zh": "有竞争力的", "example_de": "Emden, Hannover, Zwickau und Neckarsulm könnten ab 2031 ohne wettbewerbsfähigen Produktionsauftrag da stehen.", "example_zh": "埃姆登、汉诺威、茨维考和内卡苏尔姆从2031年起可能落到没有具备竞争力的生产订单的境地。"}, {"lemma": "die Werksschließung, -en", "key": "werksschliessung", "forms": ["Werksschließungen", "Werksschließung"], "pos": "Substantiv", "zh": "工厂关闭", "example_de": "Ich glaube, dass man an Werksschließungen nicht drum herum kommt.", "example_zh": "我认为工厂关闭是绕不开的。"}, {"lemma": "der Kurssprung, -e", "key": "kurssprung", "forms": ["Kurssprung"], "pos": "Substantiv", "zh": "股价跳涨", "example_de": "Das zeigt sich eindeutig am Kurssprung der VW-Aktie um 6,5 Prozent.", "example_zh": "大众股价跳涨6,5个百分点清楚地表明了这一点。"}, {"lemma": "die Hauptversammlung, -en", "key": "hauptversammlung", "forms": ["Hauptversammlung"], "pos": "Substantiv", "zh": "股东大会", "example_de": "Daher drohte der VW-Vorstand, das Sanierungsprogramm den Aktionären auf einer außerordentlichen Hauptversammlung vorzulegen.", "example_zh": "因此大众董事会威胁把重组方案直接提交给一场特别股东大会。"}], "grammar_points": [{"title": "Konjunktiv I in der indirekten Rede", "summary": "新闻转述他人言论时用第一虚拟式：prüfe（代替 prüft）、seien（代替 sind）。若第一虚拟式形式与直陈式相同，则改用第二虚拟式替代。", "example_de": "Laut Konzernspitze prüfe man aktuell Alternativen. Schließungen seien damit zwar nicht beschlossen, aber auch nicht ausgeschlossen.", "example_zh": "据集团高层称，目前正在研究替代方案。关厂一事既未决定，但也未被排除。"}, {"title": "es kommt auf jemanden/etwas an", "summary": "ankommen auf + 第四格表示『关键在于、取决于』。Jetzt kommt es auf uns an＝现在要靠我们自己了。", "example_de": "Jetzt kommt es auf uns an.", "example_zh": "现在要靠我们自己了。"}], "background": "大众集团实行监事会与董事会双层架构，职工代表依《共同决定法》占据监事会半数席位，下萨克森州政府持股并派驻监事，因此裁员关厂须劳资双方同时点头。本轮方案是继两年前上一轮减员之后的又一次大规模收缩，德国境内约半数新增裁减岗位受影响。"}, {"title": "Erneut Sabotage am Stromnetz", "title_zh": "电网再遭蓄意破坏", "paras": [{"start": 341.32, "end": 373.16, "lines": [{"de": "Annette Deutskens, diesen Lastwagen soll der Verdächtige genutzt haben.", "zh": "Annette Deutskens，嫌疑人据称使用了这辆卡车。", "start": 341.32, "end": 349.48}, {"de": "Er wird im Zusammenhang mit Anschlägen auf Umspannwerke in NRW und Brandenburg gesucht.", "zh": "他因涉嫌参与北威州和勃兰登堡州的变电站袭击案而被通缉。", "start": 349.56, "end": 355.4}, {"de": "Die Polizei stellte den Lkw am Hambacher Forst sicher.", "zh": "警方在哈姆巴赫森林查扣了这辆卡车。", "start": 355.52, "end": 359.0}, {"de": "In der Wohnung des Verdächtigen wurde Sprengstoff gefunden.", "zh": "在嫌疑人的住所里发现了炸药。", "start": 359.08, "end": 362.56}, {"de": "Der Mann hatte in zwei Bekennerbriefen seinen richtigen Absender angegeben.", "zh": "此人在两封认罪信中写明了自己的真实署名。", "start": 362.64, "end": 367.28}, {"de": "Er hatte geschrieben, er wolle mit den Anschlägen gegen die Nutzung fossiler Energien protestieren.", "zh": "他曾写道，他想以这些袭击抗议化石能源的使用。", "start": 367.36, "end": 373.16}]}, {"start": 374.24, "end": 419.56, "lines": [{"de": "SEK-Einsatz in der Nähe des Hambacher Forsts.", "zh": "特警队在哈姆巴赫森林附近展开行动。", "start": 374.24, "end": 377.64}, {"de": "Hier, wo Klimaaktivisten gegen den Braunkohleabbau demonstrierten, wird nun nach Daniel V. gesucht.", "zh": "在这片气候活动人士曾抗议褐煤开采的地方，现在正在搜捕Daniel V.。", "start": 377.72, "end": 383.68}, {"de": "Er soll für mehrere Anschläge auf das Stromnetz verantwortlich sein.", "zh": "他据信应对多起针对电网的袭击负责。", "start": 383.76, "end": 387.84}, {"de": "Gefunden wird aber nur sein Auto.", "zh": "但只找到了他的汽车。", "start": 387.92, "end": 389.92}, {"de": "Am Mittag schon durchsuchen Ermittler die Wohnung, in der der 48-Jährige gemeldet ist.", "zh": "中午，调查人员就搜查了这名48岁男子登记居住的住所。", "start": 390.0, "end": 395.32}, {"de": "Wir haben in der Wohnung des Verdächtigen einiges gefunden.", "zh": "我们在嫌疑人的住所里发现了一些东西。", "start": 395.56, "end": 399.76}, {"de": "Verdächtige Stoffe beziehungsweise sprengstoffverdächtige Gegenstände.", "zh": "可疑物质，或者说疑似爆炸物的物品。", "start": 400.28, "end": 404.56}, {"de": "Gestern Abend hatte ein Spaziergänger auf einem Feld in Dormagen verdächtige Gegenstände entdeckt.", "zh": "昨晚一名散步者在多马根的一片田地里发现了可疑物品。", "start": 406.72, "end": 412.48}, {"de": "Die Polizei bestätigt: Abschussvorrichtungen, mit denen mutmaßlich auch dieses Umspannwerk angegriffen werden sollte.", "zh": "警方证实：这些是发射装置，据推测这处变电站原本也要遭它们袭击。", "start": 412.56, "end": 419.56}]}, {"start": 419.64, "end": 468.08, "lines": [{"de": "Gleichzeitig tauchen zwei Bekennerschreiben auf: Unterschrieben von Daniel V. Darin droht er weitere Anschläge an: etwa auf dieses Kraftwerk bei Aachen.", "zh": "与此同时出现了两封认罪信：署名Daniel V.。", "start": 419.64, "end": 428.8}, {"de": "Die Polizei sichert heute die Umgebung ab.", "zh": "他在信中威胁发动更多袭击：比如亚琛附近的这座电厂。", "start": 428.88, "end": 431.32}, {"de": "Er übernimmt die Verantwortung für weitere Angriffe, unter anderem in Brandenburg nahe dem Kraftwerk Jänschwalde.", "zh": "警方今天对周边区域进行警戒封锁。", "start": 431.4, "end": 437.76}, {"de": "Damit wolle er gegen die fossile Energiegewinnung angehen, schreibt er.", "zh": "他还声称对更多袭击负责，其中包括勃兰登堡州延施瓦尔德电厂附近的一起。", "start": 437.84, "end": 442.36}, {"de": "Innenminister Dobrindt spricht daher von Klimaextremismus.", "zh": "他写道，他想以此打击化石能源生产。", "start": 442.44, "end": 445.88}, {"de": "Das Wissen, das in den Schreiben offenbart wird, ist Täterwissen.", "zh": "内政部长多布林德因此称之为气候极端主义。", "start": 445.96, "end": 450.64}, {"de": "Die Indizien sprechen dafür, dass wir es mit dem Täter zu tun haben.", "zh": "信中透露出的细节是只有作案者才知道的信息。", "start": 452.32, "end": 457.76}, {"de": "Aber das ist noch immer eine Verdachtssituation.", "zh": "种种迹象表明，我们要找的就是这名作案者。", "start": 461.28, "end": 464.96}, {"de": "Nach dem Mann wird europaweit gefahndet.", "zh": "但目前仍处于嫌疑阶段。对此人的通缉已扩大至全欧洲。", "start": 465.64, "end": 468.08}]}], "vocab": [{"lemma": "der Verdächtige, -n", "key": "verdaechtige", "forms": ["Verdächtigen", "Verdächtige"], "pos": "Substantiv", "zh": "嫌疑人（形容词名词化）", "example_de": "Annette Deutskens, diesen Lastwagen soll der Verdächtige genutzt haben.", "example_zh": "在嫌疑人的住所里发现了炸药。"}, {"lemma": "das Umspannwerk, -e", "key": "umspannwerk", "forms": ["Umspannwerke", "Umspannwerk"], "pos": "Substantiv", "zh": "变电站", "example_de": "Er wird im Zusammenhang mit Anschlägen auf Umspannwerke in NRW und Brandenburg gesucht.", "example_zh": "他因涉嫌参与北威州和勃兰登堡州的变电站袭击案而被通缉。"}, {"lemma": "der Sprengstoff, -e", "key": "sprengstoff", "forms": ["Sprengstoff"], "pos": "Substantiv", "zh": "炸药", "example_de": "In der Wohnung des Verdächtigen wurde Sprengstoff gefunden.", "example_zh": "在嫌疑人的住所里发现了炸药。"}, {"lemma": "das Bekennerschreiben, -", "key": "bekennerschreiben", "forms": ["Bekennerschreiben"], "pos": "Substantiv", "zh": "认罪信、宣告作案的信", "example_de": "Gleichzeitig tauchen zwei Bekennerschreiben auf: Unterschrieben von Daniel V.", "example_zh": "与此同时出现了两封认罪信：署名Daniel V.。"}, {"lemma": "durchsuchen", "key": "durchsuchen", "forms": ["durchsuchen"], "pos": "Verb", "zh": "搜查", "example_de": "Am Mittag schon durchsuchen Ermittler die Wohnung, in der der 48-Jährige gemeldet ist.", "example_zh": "中午，调查人员就搜查了这名48岁男子登记居住的住所。"}, {"lemma": "sicherstellen", "key": "sicherstellen", "forms": ["stellte", "sicher", "sicherstellen"], "pos": "Verb", "zh": "查封、扣押", "example_de": "Die Polizei stellte den Lkw am Hambacher Forst sicher.", "example_zh": "警方在哈姆巴赫森林查扣了这辆卡车。"}, {"lemma": "fahnden nach + Dativ", "key": "fahnden", "forms": ["gefahndet", "fahnden nach"], "pos": "Verb", "zh": "通缉、追捕", "example_de": "Nach dem Mann wird europaweit gefahndet.", "example_zh": "对此人的通缉已扩大至全欧洲。"}, {"lemma": "mutmaßlich", "key": "mutmasslich", "forms": ["mutmaßlich"], "pos": "Adverb", "zh": "据推测、涉嫌地", "example_de": "Die Polizei bestätigt: Abschussvorrichtungen, mit denen mutmaßlich auch dieses Umspannwerk angegriffen werden sollte.", "example_zh": "警方证实：这些是发射装置，据推测这处变电站原本也要遭它们袭击。"}, {"lemma": "der Ermittler, -", "key": "ermittler", "forms": ["Ermittler"], "pos": "Substantiv", "zh": "调查人员、侦查员", "example_de": "Am Mittag schon durchsuchen Ermittler die Wohnung, in der der 48-Jährige gemeldet ist.", "example_zh": "中午，调查人员就搜查了这名48岁男子登记居住的住所。"}], "grammar_points": [{"title": "soll + Infinitiv Perfekt（转述传闻）", "summary": "soll + 完成时不定式（genutzt haben）转述未经证实的说法，意为『据称』，新闻报道高频用法。否定或怀疑时可用 soll nicht haben。", "example_de": "Annette Deutskens, diesen Lastwagen soll der Verdächtige genutzt haben.", "example_zh": "Annette Deutskens，嫌疑人据称使用了这辆卡车。"}, {"title": "关系从句中的被动态+情态动词", "summary": "关系从句里情态动词与被动态叠用：分词+werden+情态动词全部压到从句末尾——mit denen ... angegriffen werden sollte＝『本应被用来袭击』。", "example_de": "Die Polizei bestätigt: Abschussvorrichtungen, mit denen mutmaßlich auch dieses Umspannwerk angegriffen werden sollte.", "example_zh": "警方证实：这些是发射装置，据推测这处变电站原本也要遭它们袭击。"}], "background": "德国本周已发生多起针对变电站的蓄意破坏，嫌疑人据信以能源转型为动机，联邦内政部长多布林德将其定性为『气候极端主义』。此前柏林今年1月也曾发生针对电网设施的袭击，关键基础设施安全成为舆论焦点。"}, {"title": "Daten nach Angriff auf Berliner Landesnetz veröffentlicht", "title_zh": "柏林州政府网络遭攻击后数据被公开", "paras": [{"start": 470.88, "end": 501.56, "lines": [{"de": "Vor drei Wochen ist bekannt geworden, dass Hacker Daten der Berliner Landesverwaltung erbeutet hatten.", "zh": "三周前有消息披露，黑客窃取了柏林州政府的数据。", "start": 470.88, "end": 477.6}, {"de": "Sie forderten ein Lösegeld von rund 2 Millionen Euro in Bitcoins.", "zh": "他们索要约200万欧元的比特币赎金。", "start": 477.68, "end": 482.12}, {"de": "Heute ist das Ultimatum abgelaufen.", "zh": "今天最后通牒到期了。", "start": 482.72, "end": 484.92}, {"de": "Und weil der Senat nicht zahlte, haben die Täter ihre Drohung wahrgemacht: Die Daten wurden veröffentlicht und sind nun im Darknet für Kriminelle zugänglich.", "zh": "由于州政府没有支付，作案者兑现了威胁：数据已被公布，如今犯罪分子可以在暗网上获取。", "start": 485.0, "end": 494.88}, {"de": "Darunter sind unter anderem Personalakten, Telefonnummern und Listen mit Objekten kritischer Infrastruktur.", "zh": "其中包括人事档案、电话号码以及关键基础设施目标清单。", "start": 494.96, "end": 501.56}]}], "vocab": [{"lemma": "erbeuten", "key": "erbeuten", "forms": ["erbeutet", "erbeuten"], "pos": "Verb", "zh": "（费力）夺得、窃得", "example_de": "Vor drei Wochen ist bekannt geworden, dass Hacker Daten der Berliner Landesverwaltung erbeutet hatten.", "example_zh": "三周前有消息披露，黑客窃取了柏林州政府的数据。"}, {"lemma": "das Lösegeld, -er", "key": "loesegeld", "forms": ["Lösegeld"], "pos": "Substantiv", "zh": "赎金", "example_de": "Sie forderten ein Lösegeld von rund 2 Millionen Euro in Bitcoins.", "example_zh": "他们索要约200万欧元的比特币赎金。"}, {"lemma": "das Ultimatum, Ultimaten", "key": "ultimatum", "forms": ["Ultimatum"], "pos": "Substantiv", "zh": "最后通牒", "example_de": "Heute ist das Ultimatum abgelaufen.", "example_zh": "今天最后通牒到期了。"}, {"lemma": "ablaufen", "key": "ablaufen", "forms": ["abgelaufen", "ablaufen"], "pos": "Verb", "zh": "到期、失效；奔跑", "example_de": "Heute ist das Ultimatum abgelaufen.", "example_zh": "今天最后通牒到期了。"}, {"lemma": "die Personalakte, -n", "key": "personalakte", "forms": ["Personalakten", "Personalakte"], "pos": "Substantiv", "zh": "人事档案", "example_de": "Darunter sind unter anderem Personalakten, Telefonnummern und Listen mit Objekten kritischer Infrastruktur.", "example_zh": "其中包括人事档案、电话号码以及关键基础设施目标清单。"}, {"lemma": "die Landesverwaltung, -en", "key": "landesverwaltung", "forms": ["Landesverwaltung"], "pos": "Substantiv", "zh": "州政府（行政机构）", "example_de": "Vor drei Wochen ist bekannt geworden, dass Hacker Daten der Berliner Landesverwaltung erbeutet hatten.", "example_zh": "三周前有消息披露，黑客窃取了柏林州政府的数据。"}], "grammar_points": [{"title": "Plusquamperfekt 过去完成时", "summary": "erbeutet hatten 表示在『消息传出』之前已经完成的动作，即『过去的过去』：先窃取，三周后才为人所知。", "example_de": "Vor drei Wochen ist bekannt geworden, dass Hacker Daten der Berliner Landesverwaltung erbeutet hatten.", "example_zh": "三周前有消息披露，黑客（在更早时候）窃取了柏林州政府的数据。"}, {"title": "die Drohung wahrmachen", "summary": "wahrmachen 意为『兑现（诺言、威胁）』，die Drohung wahrmachen 即把威胁付诸行动。类似结构：ein Versprechen wahrmachen 兑现承诺。", "example_de": "Und weil der Senat nicht zahlte, haben die Täter ihre Drohung wahrgemacht: Die Daten wurden veröffentlicht und sind nun im Darknet für Kriminelle zugänglich.", "example_zh": "由于州政府没有支付，作案者兑现了威胁：数据已被公布，如今犯罪分子可以在暗网上获取。"}], "background": "这是勒索软件（Ransomware）攻击的典型『双重勒索』手法：先加密受害者数据索要赎金，若拒付则公开窃取的数据施压。州政府与警方通常建议不支付赎金，以免资助犯罪并鼓励后续攻击。"}, {"title": "Weitere Abgeordnete verlassen nach Regierungskrise in Thüringen das BSW", "title_zh": "图林根政府危机后更多议员退出BSW", "paras": [{"start": 503.96, "end": 530.88, "lines": [{"de": "Der parteiinterne Konflikt zwischen BSW-Gründerin Wagenknecht und dem Landesverband Thüringen ist heute eskaliert: Fast alle BSW-Abgeordneten im Landtag sind nun aus der Partei ausgetreten.", "zh": "BSW创始人瓦根克内希特与图林根州党部之间的党内冲突今天激化：州议会里几乎所有BSW议员现已退党。", "start": 503.96, "end": 516.2}, {"de": "Als Grund nannten sie vor allem die Einmischung der BSW-Bundesspitze und deren fehlende Distanz zur AfD.", "zh": "他们给出的首要原因是BSW联邦高层的干预以及其与德国选择党缺乏距离。", "start": 517.0, "end": 523.76}, {"de": "Trotz der Austritte will Thüringens Regierung aus CDU, BSW und SPD weitermachen.", "zh": "尽管有人退党，由基民盟、BSW和社民党组成的图林根政府仍想继续执政。", "start": 525.32, "end": 530.88}]}, {"start": 533.64, "end": 631.64, "lines": [{"de": "Ein Paukenschlag in Erfurt: Drei Minister und sieben Fraktionsmitglieder verlassen das BSW.", "zh": "埃尔福特的一声惊雷：三名部长和七名议会党团成员退出BSW。", "start": 533.64, "end": 540.04}, {"de": "Sie wollen die Regierung aber weiter stützen.", "zh": "但他们仍愿意继续支持政府。", "start": 540.12, "end": 542.8}, {"de": "Sie begründen es mit der Verantwortung für Thüringen und seine Menschen.", "zh": "他们的理由是对图林根及其民众负有责任。", "start": 542.88, "end": 547.44}, {"de": "Wir sind nicht gewählt für endlose Selbstbeschäftigung.", "zh": "我们当选不是为了无休止的内耗。", "start": 548.72, "end": 552.44}, {"de": "Wir sind nicht gewählt für ständige Abwehrkämpfe.", "zh": "我们当选不是为了没完没了的防守战。", "start": 554.0, "end": 558.04}, {"de": "Wir sind nicht gewählt für das Ertragen von Flirts mit Rechtsradikalen.", "zh": "我们当选不是为了忍受与极右翼的调情。", "start": 560.24, "end": 565.52}, {"de": "Dieser Vorwurf richtet sich an Parteigründerin Wagenknecht.", "zh": "这一指责指向党创始人瓦根克内希特。", "start": 566.76, "end": 570.92}, {"de": "Sie wollte den Landesvorstand zum Koalitionsbruch drängen und die AfD für neue Mehrheiten einbeziehen.", "zh": "她曾想逼迫州党部打破执政联盟，并把德国选择党纳入新的多数。", "start": 571.04, "end": 578.0}, {"de": "Mit harscher Kritik reagiert der BSW-Bundesvorstand heute: Man muss sagen: Frau Wolf spielt mit im Team CDU, nicht im Team BSW.", "zh": "BSW联邦执委会今天以严厉批评作出回应：必须说：Wolf女士是在基民盟的队伍里踢球，而不是BSW的队伍。", "start": 578.08, "end": 587.4}, {"de": "Wer so Politik macht, darf sich nicht wundern, dass die AfD von Höhenflug zu Höhenflug eilt.", "zh": "谁这样搞政治，就不必惊讶德国选择党会一路高歌猛进。", "start": 588.2, "end": 594.08}, {"de": "Die Koalition von BSW mit CDU und SPD in Thüringen hatte keine Mehrheit.", "zh": "BSW与基民盟、社民党在图林根的执政联盟本来就没有多数。", "start": 594.96, "end": 599.88}, {"de": "Regierungsbeschlüsse konnte Ministerpräsident Voigt nur durch Kompromisse mit der Fraktion der Linken erreichen.", "zh": "州长福格特只能靠与左翼党议会党团妥协来通过政府决议。", "start": 600.0, "end": 606.96}, {"de": "Er erwartet, dass er so weiterregieren kann.", "zh": "他预计自己可以这样继续执政。", "start": 607.08, "end": 610.36}, {"de": "Wir haben ein gemeinsames Verständnis vom Regierungsauftrag und den Zielen, die wir formuliert haben.", "zh": "我们对执政任务和定下的目标有共同的理解。", "start": 612.96, "end": 619.52}, {"de": "Das wollen wir weiter bearbeiten.", "zh": "这些我们想继续推进。", "start": 619.88, "end": 622.44}, {"de": "Formal besteht die Fraktion weiter - auch ohne Parteimitgliedschaft.", "zh": "从形式上看议会党团仍然存在——即使没有了党籍。", "start": 623.32, "end": 627.96}, {"de": "Über ihre Zukunft entscheiden sie erst nächste Woche.", "zh": "关于它的未来，他们下周才会决定。", "start": 628.04, "end": 631.64}]}], "vocab": [{"lemma": "der Abgeordnete, -n", "key": "abgeordnete", "forms": ["Abgeordneten", "Abgeordnete"], "pos": "Substantiv", "zh": "议员（形容词名词化）", "example_de": "Der parteiinterne Konflikt zwischen BSW-Gründerin Wagenknecht und dem Landesverband Thüringen ist heute eskaliert: Fast alle BSW-Abgeordneten im Landtag sind nun aus der Partei ausgetreten.", "example_zh": "BSW创始人瓦根克内希特与图林根州党部之间的党内冲突今天激化：州议会里几乎所有BSW议员现已退党。"}, {"lemma": "austreten aus + Dativ", "key": "austreten", "forms": ["ausgetreten", "austreten aus"], "pos": "Verb", "zh": "退出（组织、政党）", "example_de": "Der parteiinterne Konflikt zwischen BSW-Gründerin Wagenknecht und dem Landesverband Thüringen ist heute eskaliert: Fast alle BSW-Abgeordneten im Landtag sind nun aus der Partei ausgetreten.", "example_zh": "BSW创始人瓦根克内希特与图林根州党部之间的党内冲突今天激化：州议会里几乎所有BSW议员现已退党。"}, {"lemma": "der Landesverband, -verbände", "key": "landesverband", "forms": ["Landesverband"], "pos": "Substantiv", "zh": "（政党的）州级组织、州党部", "example_de": "Der parteiinterne Konflikt zwischen BSW-Gründerin Wagenknecht und dem Landesverband Thüringen ist heute eskaliert: Fast alle BSW-Abgeordneten im Landtag sind nun aus der Partei ausgetreten.", "example_zh": "BSW创始人瓦根克内希特与图林根州党部之间的党内冲突今天激化：州议会里几乎所有BSW议员现已退党。"}, {"lemma": "der Paukenschlag, -schläge", "key": "paukenschlag", "forms": ["Paukenschlag"], "pos": "Substantiv", "zh": "轰动性事件（字面：鼓槌重击）", "example_de": "Ein Paukenschlag in Erfurt: Drei Minister und sieben Fraktionsmitglieder verlassen das BSW.", "example_zh": "埃尔福特的一声惊雷：三名部长和七名议会党团成员退出BSW。"}, {"lemma": "stützen", "key": "stuetzen", "forms": ["stützen"], "pos": "Verb", "zh": "支撑、支持", "example_de": "Sie wollen die Regierung aber weiter stützen.", "example_zh": "但他们仍愿意继续支持政府。"}, {"lemma": "einbeziehen in + Akkusativ", "key": "einbeziehen", "forms": ["einbeziehen", "einbeziehen in"], "pos": "Verb", "zh": "把…纳入、把…一并考虑", "example_de": "Sie wollte den Landesvorstand zum Koalitionsbruch drängen und die AfD für neue Mehrheiten einbeziehen.", "example_zh": "她曾想逼迫州党部打破执政联盟，并把德国选择党纳入新的多数。"}, {"lemma": "der Koalitionsbruch, -brüche", "key": "koalitionsbruch", "forms": ["Koalitionsbruch"], "pos": "Substantiv", "zh": "执政联盟破裂", "example_de": "Sie wollte den Landesvorstand zum Koalitionsbruch drängen und die AfD für neue Mehrheiten einbeziehen.", "example_zh": "她曾想逼迫州党部打破执政联盟，并把德国选择党纳入新的多数。"}, {"lemma": "der Höhenflug, -flüge", "key": "hoehenflug", "forms": ["Höhenflug"], "pos": "Substantiv", "zh": "高飞；（比喻）支持率飙升", "example_de": "Wer so Politik macht, darf sich nicht wundern, dass die AfD von Höhenflug zu Höhenflug eilt.", "example_zh": "谁这样搞政治，就不必惊讶德国选择党会一路高歌猛进。"}], "grammar_points": [{"title": "Wer-从句作主语", "summary": "wer so Politik macht 相当于『凡是这样做的人』，从句动词按第三人称单数，主句动词与 wer 保持一致：darf sich nicht wundern。", "example_de": "Wer so Politik macht, darf sich nicht wundern, dass die AfD von Höhenflug zu Höhenflug eilt.", "example_zh": "谁这样搞政治，就不必惊讶德国选择党会一路高歌猛进。"}, {"title": "sich richten an + Akkusativ", "summary": "反身动词 sich an jemanden richten 表示『针对、指向某人』。Dieser Vorwurf richtet sich an X＝这一指责指向X。", "example_de": "Dieser Vorwurf richtet sich an Parteigründerin Wagenknecht.", "example_zh": "这一指责指向党创始人瓦根克内希特。"}], "background": "BSW（萨拉·瓦根克内希特联盟）由前左翼党政治家瓦根克内希特创立。图林根由基民盟、BSW、社民党组成少数派政府，州长福格特（基民盟）执政以来一直依赖与左翼党的个案妥协。退党的州议员若保留议会党团身份，政府仍可在州议会运作。"}, {"title": "Wahlkampfabschluss in Sachsen-Anhalt", "title_zh": "萨克森-安哈尔特州竞选收官", "paras": [{"start": 634.6, "end": 651.0, "lines": [{"de": "In Sachsen-Anhalt wird in zwei Tagen ein neuer Landtag gewählt.", "zh": "萨克森-安哈尔特州两天后将选举新的州议会。", "start": 634.6, "end": 638.8}, {"de": "Die Parteien haben ihren Wahlkampf weitgehend abgeschlossen.", "zh": "各政党的竞选活动已基本收尾。", "start": 638.88, "end": 642.44}, {"de": "Umfragen sehen die AfD deutlich vor der CDU.", "zh": "民调显示德国选择党明显领先于基民盟。", "start": 642.52, "end": 645.92}, {"de": "Derzeit regiert in Magdeburg ein Bündnis aus CDU, SPD und FDP.", "zh": "目前马格德堡由基民盟、社民党和自民党组成的联盟执政。", "start": 646.0, "end": 651.0}]}, {"start": 651.68, "end": 723.16, "lines": [{"de": "Bis zuletzt kämpfen die Kandidaten um Stimmen.", "zh": "候选人们直到最后还在争取选票。", "start": 651.68, "end": 655.0}, {"de": "Etwa jeder vierte Wahlberechtigte soll noch unentschlossen sein.", "zh": "大约每四位选民中就有一位据称还未拿定主意。", "start": 655.84, "end": 660.24}, {"de": "Es geht nicht nur hier um die Wurst für Sven Schulze.", "zh": "对Sven Schulze来说，这里关乎的可不只是香肠。", "start": 662.2, "end": 665.36}, {"de": "Der Ministerpräsident von Sachsen-Anhalt will im Endspurt noch Wähler überzeugen.", "zh": "这位萨克森-安哈尔特州长想在最后冲刺阶段再争取选民。", "start": 665.44, "end": 670.32}, {"de": "Wenig geholfen hat aus seiner Sicht dabei zuletzt die Politik der Regierungskoalition in Berlin.", "zh": "在他看来，柏林执政联盟的政策近来没帮上什么忙。", "start": 670.4, "end": 676.04}, {"de": "Etwa wegen Teilen der Rentenreform, die zu Lasten vieler Ostdeutscher gehe.", "zh": "比如退休金改革的部分内容，据说这让许多东部德国人吃了亏。", "start": 676.12, "end": 681.04}, {"de": "Schulze versucht, auf sein Kernthema zu setzen: die Wirtschaft.", "zh": "舒尔茨试图押注自己的核心议题：经济。", "start": 681.12, "end": 684.68}, {"de": "Ich möchte nach vorn schauen.", "zh": "我想向前看。", "start": 684.76, "end": 686.48}, {"de": "Wir haben Herausforderungen bei Jobs und Arbeitsplätzen.", "zh": "我们在就业和工作岗位上面临挑战。", "start": 686.56, "end": 689.72}, {"de": "Die können wir aber nicht lösen, indem wir in eine längst überwundene Vergangenheit zurückschauen.", "zh": "但我们不可能靠回望一段早已翻篇的过去来解决这些问题。", "start": 689.8, "end": 695.44}, {"de": "Gemeint ist die AfD, die in Sachsen-Anhalt vom Verfassungsschutz als gesichert rechtsextrem eingestuft wurde.", "zh": "这话指的是德国选择党，该党在萨克森-安哈尔特被宪法保卫局认定为确凿的极右翼。", "start": 695.52, "end": 701.8}, {"de": "Dagegen hat die Partei geklagt.", "zh": "该党对此提起了诉讼。", "start": 701.88, "end": 705.44}, {"de": "Das Verfahren ist ausgesetzt.", "zh": "诉讼程序目前中止。民调中它处于领先。", "start": null, "end": null}, {"de": "In Umfragen liegt sie vorn.", "zh": "首席候选人西格蒙德的竞选活动吸引成千上万人。", "start": 705.52, "end": 707.16}, {"de": "Spitzenkandidat Siegmund zieht Tausende zu Wahlkampfveranstaltungen.", "zh": "今天在马格德堡也是：人们排着队等合影。", "start": 707.24, "end": 711.2}, {"de": "Auch heute in Magdeburg: Schlangestehen für Fotos.", "zh": "西格蒙德的议题：移民和高油价。", "start": 711.28, "end": 714.12}, {"de": "Siegmunds Themen: Migration und hohe Spritpreise.", "zh": "我们几个月前就定下了目标：绝对多数，也就是45个百分点再加X。", "start": 714.24, "end": 715.56}, {"de": "Das Ziel haben wir schon vor Monaten ausgegeben: Die absolute Mehrheit, also 45 Prozent plus X. Es wird knapp.", "zh": "结果会很胶着。", "start": 715.64, "end": 723.16}]}, {"start": 723.96, "end": 754.56, "lines": [{"de": "Entscheidend könnte das Abschneiden der übrigen Parteien sein.", "zh": "其他政党的表现可能具有决定性。", "start": 723.96, "end": 728.32}, {"de": "Zum Beispiel, ob die Grünen knapp erneut in den Landtag einziehen.", "zh": "比如绿党能否险胜再次进入州议会。", "start": 728.44, "end": 733.08}, {"de": "Das erscheint bei der SPD sicherer, sie ist derzeit Teil der Landesregierung.", "zh": "社民党把握看起来更大，它目前是州政府的一部分。", "start": 733.24, "end": 738.6}, {"de": "Die bisher mitregierende FDP und das BSW könnten den Sprung in den Landtag verpassen.", "zh": "至今参与执政的自民党和BSW则可能无缘州议会。", "start": 738.68, "end": 743.72}, {"de": "Eine Mehrheit gegen die AfD wäre dann von der Linken abhängig.", "zh": "那样一来，反对德国选择党的多数就要取决于左翼党。", "start": 743.8, "end": 747.4}, {"de": "Gegen so eine Zusammenarbeit gibt es aus Schulzes CDU erheblichen Widerstand.", "zh": "舒尔茨的基民盟内部对这种合作有相当大的阻力。", "start": 747.48, "end": 752.0}, {"de": "Auf Sachsen-Anhalt kommen bewegte Tage zu.", "zh": "萨克森-安哈尔特将迎来动荡的日子。", "start": 752.08, "end": 754.56}]}], "vocab": [{"lemma": "der Wahlkampf, -kämpfe", "key": "wahlkampf", "forms": ["Wahlkampf"], "pos": "Substantiv", "zh": "竞选活动", "example_de": "Die Parteien haben ihren Wahlkampf weitgehend abgeschlossen.", "example_zh": "各政党的竞选活动已基本收尾。"}, {"lemma": "der Wahlberechtigte, -n", "key": "wahlberechtigte", "forms": ["Wahlberechtigte"], "pos": "Substantiv", "zh": "有选举权的人（形容词名词化）", "example_de": "Etwa jeder vierte Wahlberechtigte soll noch unentschlossen sein.", "example_zh": "大约每四位选民中就有一位据称还未拿定主意。"}, {"lemma": "unentschlossen", "key": "unentschlossen", "forms": ["unentschlossen"], "pos": "Adjektiv", "zh": "未拿定主意的、犹豫的", "example_de": "Etwa jeder vierte Wahlberechtigte soll noch unentschlossen sein.", "example_zh": "大约每四位选民中就有一位据称还未拿定主意。"}, {"lemma": "der Endspurt, -s", "key": "endspurt", "forms": ["Endspurt"], "pos": "Substantiv", "zh": "最后冲刺（体育借词）", "example_de": "Der Ministerpräsident von Sachsen-Anhalt will im Endspurt noch Wähler überzeugen.", "example_zh": "这位萨克森-安哈尔特州长想在最后冲刺阶段再争取选民。"}, {"lemma": "zu Lasten von + Dativ", "key": "zu-lasten", "forms": ["zu Lasten", "zu Lasten von"], "pos": "Präpositionalgruppe", "zh": "以…为代价、损害…的利益", "example_de": "Etwa wegen Teilen der Rentenreform, die zu Lasten vieler Ostdeutscher gehe.", "example_zh": "比如退休金改革的部分内容，据说这让许多东部德国人吃了亏。"}, {"lemma": "einstufen als", "key": "einstufen", "forms": ["eingestuft", "einstufen als"], "pos": "Verb", "zh": "把…归类为、评定为", "example_de": "Gemeint ist die AfD, die in Sachsen-Anhalt vom Verfassungsschutz als gesichert rechtsextrem eingestuft wurde.", "example_zh": "这话指的是德国选择党，该党在萨克森-安哈尔特被宪法保卫局认定为确凿的极右翼。"}, {"lemma": "das Abschneiden", "key": "abschneiden", "forms": ["Abschneiden"], "pos": "Substantiv", "zh": "（选举）成绩、表现", "example_de": "Entscheidend könnte das Abschneiden der übrigen Parteien sein.", "example_zh": "其他政党的表现可能具有决定性。"}, {"lemma": "in den Landtag einziehen", "key": "einziehen", "forms": ["in den Landtag einziehen", "den Sprung in den Landtag"], "pos": "Phrase", "zh": "（政党）进入议会、跨过门槛", "example_de": "Zum Beispiel, ob die Grünen knapp erneut in den Landtag einziehen.", "example_zh": "至今参与执政的自民党和BSW则可能无缘州议会。"}], "grammar_points": [{"title": "Konjunktiv II 表推测", "summary": "könnte ... sein / wäre ... abhängig 不是过去时，而是对未来的可能性判断：『可能会…』。间接引语里也用虚拟式（gehe 代替 geht）。", "example_de": "Entscheidend könnte das Abschneiden der übrigen Parteien sein. Eine Mehrheit gegen die AfD wäre dann von der Linken abhängig.", "example_zh": "其他政党的表现可能具有决定性。那样一来，反对德国选择党的多数就要取决于左翼党。"}, {"title": "indem-从句表方式", "summary": "indem 引导方式状语从句『通过…方式』，可分动词前缀回到从句末尾：zurückschauen。", "example_de": "Die können wir aber nicht lösen, indem wir in eine längst überwundene Vergangenheit zurückschauen.", "example_zh": "但我们不可能靠回望一段早已翻篇的过去来解决这些问题。"}], "background": "萨克森-安哈尔特州议会选举于9月6日投票。现任州长舒尔茨（基民盟）领导基民盟、社民党、自民党执政。德国选择党在该州被州宪法保卫局认定为『确凿右翼极端』，该党已就此起诉，法院程序中止中，但认定暂时生效。"}, {"title": "Russische Drohne trifft Geheimdienstzentrale in Kiew", "title_zh": "俄罗斯无人机击中基辅情报机构总部", "paras": [{"start": 757.76, "end": 781.8, "lines": [{"de": "Eine russische Drohne traf heute den Sitz des ukrainischen Geheimdienstes in Kiew.", "zh": "今天一架俄罗斯无人机击中了位于基辅的乌克兰情报机构总部。", "start": 757.76, "end": 762.76}, {"de": "Laut Präsident Selenskyj zielte sie auf das Arbeitszimmer des Geheimdienstchefs.", "zh": "据泽连斯基总统称，它瞄准的是情报主管的办公室。", "start": 762.84, "end": 768.32}, {"de": "Er soll sich zum Zeitpunkt des Angriffs nicht in dem Gebäude aufgehalten haben.", "zh": "据称袭击发生时他不在那栋建筑里。", "start": 768.68, "end": 773.32}, {"de": "12 Menschen wurden den Behörden zufolge verletzt.", "zh": "据当局通报有12人受伤。", "start": 773.44, "end": 776.24}, {"de": "Der Angriff erfolgte kurz vor einem Besuch der US-Gesandten Witkoff und Kushner in Kiew.", "zh": "袭击发生在美国特使威特科夫和库什纳到访基辅前不久。", "start": 776.32, "end": 781.8}]}], "vocab": [{"lemma": "die Drohne, -n", "key": "drohne", "forms": ["Drohne"], "pos": "Substantiv", "zh": "无人机", "example_de": "Eine russische Drohne traf heute den Sitz des ukrainischen Geheimdienstes in Kiew.", "example_zh": "今天一架俄罗斯无人机击中了位于基辅的乌克兰情报机构总部。"}, {"lemma": "der Sitz, -e", "key": "sitz", "forms": ["Sitz"], "pos": "Substantiv", "zh": "总部所在地、驻地", "example_de": "Eine russische Drohne traf heute den Sitz des ukrainischen Geheimdienstes in Kiew.", "example_zh": "今天一架俄罗斯无人机击中了位于基辅的乌克兰情报机构总部。"}, {"lemma": "der Geheimdienst, -e", "key": "geheimdienst", "forms": ["Geheimdienstes", "Geheimdienstchefs", "Geheimdienst"], "pos": "Substantiv", "zh": "情报机构", "example_de": "Eine russische Drohne traf heute den Sitz des ukrainischen Geheimdienstes in Kiew.", "example_zh": "据泽连斯基总统称，它瞄准的是情报主管的办公室。"}, {"lemma": "zielen auf + Akkusativ", "key": "zielen", "forms": ["zielte", "zielen auf"], "pos": "Verb", "zh": "瞄准、对准", "example_de": "Laut Präsident Selenskyj zielte sie auf das Arbeitszimmer des Geheimdienstchefs.", "example_zh": "据泽连斯基总统称，它瞄准的是情报主管的办公室。"}, {"lemma": "sich aufhalten", "key": "aufhalten", "forms": ["aufgehalten", "sich aufhalten"], "pos": "Verb", "zh": "逗留、待在（某地）", "example_de": "Er soll sich zum Zeitpunkt des Angriffs nicht in dem Gebäude aufgehalten haben. 12 Menschen wurden den Behörden zufolge verletzt.", "example_zh": "据称袭击发生时他不在那栋建筑里。"}, {"lemma": "der Gesandte, -n", "key": "gesandte", "forms": ["Gesandten", "Gesandte"], "pos": "Substantiv", "zh": "特使、使节（形容词名词化）", "example_de": "Der Angriff erfolgte kurz vor einem Besuch der US-Gesandten Witkoff und Kushner in Kiew.", "example_zh": "袭击发生在美国特使威特科夫和库什纳到访基辅前不久。"}, {"lemma": "die Behörde, -n", "key": "behoerde", "forms": ["Behörden", "Behörde"], "pos": "Substantiv", "zh": "当局、官方机构", "example_de": "Er soll sich zum Zeitpunkt des Angriffs nicht in dem Gebäude aufgehalten haben. 12 Menschen wurden den Behörden zufolge verletzt.", "example_zh": "据当局通报有12人受伤。"}], "grammar_points": [{"title": "zufolge 后置 + Dativ", "summary": "zufolge 可放在名词后面，支配第三格：den Behörden zufolge＝据当局称。若前置则支配第二格。与 laut 意义相近但更正式。", "example_de": "12 Menschen wurden den Behörden zufolge verletzt.", "example_zh": "据当局通报有12人受伤。"}, {"title": "soll + Infinitiv Perfekt（转述传闻）", "summary": "soll sich aufgehalten haben 转述官方或媒体的说法但记者不予证实：『据称当时他在/不在场』。", "example_de": "Er soll sich zum Zeitpunkt des Angriffs nicht in dem Gebäude aufgehalten haben.", "example_zh": "据称袭击发生时他不在那栋建筑里。"}], "background": "乌克兰对外情报机构总部位于基辅市中心。袭击发生在美国特使威特科夫与库什纳到访基辅前夕，时点敏感。无人机已成为俄乌战争中的常态化打击手段。"}, {"title": "Nach Sturzflut in Nepal zwei Arbeiter nach neun Tagen aus Tunnelsystem gerettet", "title_zh": "尼泊尔山洪九天后两名工人从隧道获救", "paras": [{"start": 783.96, "end": 809.56, "lines": [{"de": "Vor neun Tagen riss eine Sturzflut in Nepal und Tibet ganze Ortschaften mit sich.", "zh": "九天前，一场暴洪在尼泊尔和西藏卷走了整座整座的村庄。", "start": 783.96, "end": 789.64}, {"de": "Mehr als 1300 Tote wurden gemeldet.", "zh": "据通报有超过1300人遇难。", "start": 789.72, "end": 792.56}, {"de": "Noch immer werden Tausende vermisst - unter ihnen mehrere hundert Mitarbeiter von Wasserkraftwerken.", "zh": "至今仍有数千人失踪——其中包括数百名水电站工作人员。", "start": 792.64, "end": 800.2}, {"de": "In darunter liegenden Tunneln könnten viele von ihnen verschüttet sein, vermuten Behörden.", "zh": "当局推测，他们中的许多人可能被埋在下游的隧道里。", "start": 800.28, "end": 806.0}, {"de": "Dort ist heute eine spektakuläre Rettung gelungen.", "zh": "那里今天完成了一次惊心动魄的营救。", "start": 806.08, "end": 809.56}]}, {"start": 813.0, "end": 875.6, "lines": [{"de": "Sie waren eingeschlossen im Tunnelnetzwerk zerstörter Wasserkraftwerke.", "zh": "他们被困在被毁水电站的隧道网络中。", "start": 813.0, "end": 818.36}, {"de": "Durch ein Loch in der Tunneldecke hat die Armee sich zu Sanjay Sah und seinem Kollegen vorgegraben.", "zh": "军队通过隧道顶上的一个孔洞，挖通了通往Sanjay Sah和他同事的路。", "start": 818.44, "end": 824.88}, {"de": "Meine Pflicht war es, andere zu retten.", "zh": "我的职责就是救别人。", "start": 828.52, "end": 830.96}, {"de": "Ich rief allen zu, dass sich am großen Damm ein Unfall ereignet hatte und dass sie fliehen sollten.", "zh": "我朝所有人喊，大坝那边出事了，让他们快逃。", "start": 831.04, "end": 837.04}, {"de": "Mir lief die Zeit weg, ich schaffte es nicht raus.", "zh": "时间来不及了，我没能跑出去。", "start": 837.12, "end": 840.12}, {"de": "Er habe gebetet, um die Hoffnung nicht zu verlieren.", "zh": "他说自己一直祈祷，为了不失去希望。", "start": 842.92, "end": 846.64}, {"de": "Auch andere hätten in den Tunneln überlebt.", "zh": "据他所说，其他人也在隧道里活了下来。", "start": 847.2, "end": 850.04}, {"de": "Die Geretteten werden ins Krankenhaus in die Hauptstadt Kathmandu geflogen.", "zh": "获救者将被送往首都加德满都的医院。", "start": 850.64, "end": 855.48}, {"de": "Wir wussten nicht, wie viel Schlamm und Hochwasser in die Tunnel eingedrungen waren.", "zh": "我们当时不知道有多少泥浆和洪水灌进了隧道。", "start": 855.8, "end": 861.32}, {"de": "Die Behörden konnten nichts sagen, aber wir hofften weiter.", "zh": "当局什么也说不出来，但我们始终抱着希望。", "start": 861.4, "end": 865.24}, {"de": "Licht am Ende des Tunnels - das ist Kraft und Motivation, mehr Überlebende zu finden.", "zh": "隧道尽头的光——这是继续寻找更多幸存者的力量和动力。", "start": 867.32, "end": 872.88}, {"de": "Auch neun Tage nach der Sturzflut.", "zh": "哪怕山洪已过去九天。", "start": 872.96, "end": 875.6}]}], "vocab": [{"lemma": "die Sturzflut, -en", "key": "sturzflut", "forms": ["Sturzflut"], "pos": "Substantiv", "zh": "暴洪、山洪暴发", "example_de": "Vor neun Tagen riss eine Sturzflut in Nepal und Tibet ganze Ortschaften mit sich.", "example_zh": "九天前，一场暴洪在尼泊尔和西藏卷走了整座整座的村庄。"}, {"lemma": "etwas mit sich reißen", "key": "mit-sich-reissen", "forms": ["mit sich", "etwas mit sich reißen"], "pos": "Phrase", "zh": "卷走、裹挟", "example_de": "Vor neun Tagen riss eine Sturzflut in Nepal und Tibet ganze Ortschaften mit sich.", "example_zh": "九天前，一场暴洪在尼泊尔和西藏卷走了整座整座的村庄。"}, {"lemma": "vermisst", "key": "vermisst", "forms": ["vermisst"], "pos": "Adjektiv", "zh": "失踪的（常作表语：vermisst ber.", "zh": "现在来看明天，9月5日星期六的天气预报。", "start": 877.36, "end": 881.76}, {"de": "Dem Nordosten und Süden bringen Tiefausläufer wechselhaftes Wetter.", "zh": "低压边缘给东北部和南部带来多变的天气。", "start": 883.88, "end": 887.92}, {"de": "Sonst ist es unter Hochdruckeinfluss freundlicher.", "zh": "其他地区在高压影响下天气更为晴好。", "start": 888.0, "end": 891.0}, {"de": "Heute Nacht zieht ein Regenband mit Gewittern aus der Mitte nach Süden.", "zh": "今夜一条伴有雷暴的雨带从中部移向南部。", "start": 891.08, "end": 895.24}, {"de": "An der Küste gibt's Schauer.", "zh": "沿海地区有阵雨。", "start": 895.32, "end": 897.08}, {"de": "Der Tag beginnt im Süden mit Regen, der sich an die Alpen zurückzieht.", "zh": "白天南部以降雨开始，雨区将退向阿尔卑斯山。", "start": 897.16, "end": 901.28}, {"de": "Vereinzelt Gewitter.", "zh": "局部有雷暴。", "start": 901.36, "end": 902.6}, {"de": "Auch im Norden und Nordosten Gewitter und Schauer, dabei sehr windig.", "zh": "北部和东北部也有雷暴和阵雨，同时风力很强。", "start": 902.68, "end": 906.72}, {"de": "Sonst wechseln sich Wolken und Sonne ab, die gegen Abend öfter scheint.", "zh": "其余地区云和阳光交替出现，傍晚时分太阳会更常露面。", "start": 906.8, "end": 911.16}]}], "vocab": [{"lemma": "die Wettervorhersage, -n", "key": "wettervorhersage", "forms": ["Wettervorhersage"], "pos": "Substantiv", "zh": "天气预报", "example_de": "Nun die Wettervorhersage für morgen, Samstag, den 05.", "example_zh": "现在来看明天，9月5日星期六的天气预报。"}, {"lemma": "der Tiefausläufer, -", "key": "tiefauslaeufer", "forms": ["Tiefausläufer"], "pos": "Substantiv", "zh": "低压边缘、低压槽延伸", "example_de": "Dem Nordosten und Süden bringen Tiefausläufer wechselhaftes Wetter.", "example_zh": "低压边缘给东北部和南部带来多变的天气。"}, {"lemma": "wechselhaft", "key": "wechselhaft", "forms": ["wechselhaftes", "wechselhaft"], "pos": "Adjektiv", "zh": "多变的（天气）", "example_de": "Dem Nordosten und Süden bringen Tiefausläufer wechselhaftes Wetter.", "example_zh": "低压边缘给东北部和南部带来多变的天气。"}, {"lemma": "das Regenband, -bänder", "key": "regenband", "forms": ["Regenband"], "pos": "Substantiv", "zh": "雨带", "example_de": "Heute Nacht zieht ein Regenband mit Ge function migrateBasketItem(b) {

}

  try { return JSON.parse(localStorage.getItem(key) || JSON.stringify(fallback)); }

function getGloss(key) {

/* ---------- 渲染 ---------- */
const WK_RE = /[A-Za-zÄÖÜäöüß][A-Za-zÄÖÜäöüß-]*/g;
const PHRASES = (DATA.phrases || []).slice().sort((a, b) => b.length - a.length);
function lookupKey(surface) {
  return (DATA.form_to_key && DATA.form_to_key[surface.toLowerCase()]) || surface.toLowerCase();
}
function wrapWord(surface, key) {
  const g = getGloss(key);
  const classes = [
    g?.zh ? 'known' : '',
    g?.source === 'editorial' ? 'ed' : '',
    g?.source === 'dict' ? 'wiki' : '',
    basket.some(b => b.key === key) ? 'saved' : ''
  ].filter(Boolean).join(' ');
  return `<w data-w="${esc(key)}" class="${classes}" tabindex="0" role="button" aria-label="${esc(surface)}，查看释义">${esc(surface)}</w>`;
}
function isLetter(ch) { return /[A-Za-zÄÖÜäöüß]/.test(ch || ''); }
function tokenizeDe(text) {
  let html = '', i = 0;
  const lower = text.toLowerCase();
  while (i < text.length) {
    let hit = '';
    if (i === 0 || !isLetter(text[i - 1])) {
      for (const ph of PHRASES) {
        if (lower.startsWith(ph.toLowerCase(), i) && !isLetter(text[i + ph.length])) {
          hit = text.slice(i, i + ph.length);
          break;
        }
      }
    }
    if (hit) {
      html += wrapWord(hit, lookupKey(hit));
      i += hit.length;
      continue;
    }
    if (isLetter(text[i])) {
      let j = i + 1;
      while (j < text.length && /[A-Za-zÄÖÜäöüß-]/.test(text[j])) j++;
      const word = text.slice(i, j);
      html += wrapWord(word, lookupKey(word));
      i = j;
    } else {
      let j = i + 1;
      while (j < text.length && !isLetter(text[j])) j++;
      html += esc(text.slice(i, j));
      i = j;
    }
  }
  return html;
}

function clampFloat(x, y) {
  const w = videoCard.offsetWidth || 210;
  const h = videoCard.offsetHeight || 118;
  const pad = 8;
  return {
    x: Math.min(Math.max(pad, x), Math.max(pad, innerWidth - w - pad)),

  };
}
function applyFloatPos(x, y) {

  return text.split(/(?<=[.!?])\s+(?=[A-ZÄÖÜ])/).find(s => s.includes(word)) || text;
}

function basketAdd() {
  if (!popWord) return;
  if (!popWord.zh) { openPopEditor(); return; }
  if (basket.some(b => b.key === popWord.key)) { toast('已在生词本'); return; }
  basket.push({
    key: popWord.key, word: popWord.word, zh: popWord.zh, pos: popWord.pos || '',
    example: popWord.example || '', date: DATA.date, topic: popWord.topic || '',
    source: popWord.source || '', createdAt: Date.now()
  });
  saveBasket();
  refreshWordMarks();
  hidePop(); renderBasket(); toast('已加入生词本');
}
function basketDel(key) {
  basket = basket.filter(b => b.key !== key);
  saveBasket();
  refreshWordMarks();
  renderBasket();
}
function saveBasket() { saveStored(BK_KEY, basket); }
function refreshWordMarks() {
  document.querySelectorAll('w').forEach(w => {
    w.classList.toggle('known', Boolean(getGloss(w.dataset.w)?.zh));
    w.classList.toggle('saved', basket.some(b => b.key === w.dataset.w));

function renderBasket() {
  const n = basket.length;

  if (!n) { list.innerHTML = '<div class="bempty"><b>生词本还是空的</b>点击正文中的任意德语词，或手动添加一个。</div>'; return; }
  list.innerHTML = basket.map(b =>
    `<div class="bitem"><span class="bw">${esc(b.word)}</span><span class="bz">${esc(b.zh || '未填写释义')}</span>${b.example ? `<span class="be">${esc(b.example)}</span>` : ''}
      <span class="bitem-actions"><button class="bedit" data-key="${esc(b.key)}">编辑</button><button class="bx" data-key="${esc(b.key)}">删除</button></span></div>`
  ).join('');
}
function toggleBasket(open) {
  const panel = document.getElementById('basket');
  const wasOpen = panel.classList.contains('open');
  panel.classList.toggle('open', open);
  panel.setAttribute('aria-hidden', String(!open));
  document.getElementById('scrim').classList.toggle('on', open);
  if (open) setTimeout(() => panel.querySelector('.bclose')?.focus(), 0);
  else {
    closeWordEditor();
    if (wasOpen) document.getElementById('basket-btn').focus();
  }
}
document.getElementById('basket-btn').onclick = () => toggleBasket(true);
document.getElementById('scrim').onclick = () => toggleBasket(false);
document.addEventListener('keydown', e => {
  const panel = document.getElementById('basket');
  if (!panel.classList.contains('open')) return;
  if (e.key === 'Escape') {
    e.preventDefault();
    toggleBasket(false);
    return;
  }
  if (e.key !== 'Tab') return;
  const focusable = [...panel.querySelectorAll('button:not([disabled]), a[href], input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])')];
  if (!focusable.length) return;
  const first = focusable[0];
  const last = focusable[focusable.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
});
document.getElementById('bk-list').onclick = e => {
  const btn = e.target.closest('button[data-key]');
  if (!btn) return;
  if (btn.classList.contains('bx')) basketDel(btn.dataset.key);

};

function openWordEditor(key = null) {
  editingKey = key;
  const item = key ? basket.find(b => b.key === key) : null;
  document.getElementById('edit-word').value = item?.word || '';
  document.getElementById('edit-zh').value = item?.zh || '';
  document.getElementById('edit-example').value = item?.example || '';
  document.getElementById('word-editor').classList.add('open');
  setTimeout(() => document.getElementById('edit-word').focus(), 0);
}
function closeWordEditor() {
  editingKey = null;
  document.getElementById('word-editor').classList.remove('open');
  document.getElementById('word-form').reset();
}
document.getElementById('word-form').onsubmit = e => {
  e.preventDefault();
  const wasEditing = Boolean(editingKey);
  const word = document.getElementById('edit-word').value.trim();
  const zh = document.getElementById('edit-zh').value.trim();
  const example = document.getElementById('edit-example').value.trim();
  if (!word || !zh) return;
  const key = editingKey || word.toLocaleLowerCase('de-DE');
  const item = basket.find(b => b.key === editingKey || (!editingKey && b.key === key));
  if (item) Object.assign(item, { word, zh, example });
  else basket.unshift({ key, word, zh, example, date: DATA.date, manual: true });
  userGloss[key] = { word, zh, example, pos: '' };
  saveStored(GLOSS_KEY, userGloss);
  saveBasket();
  refreshWordMarks();
  renderBasket();
  closeWordEditor();
  toast(wasEditing ? '单词已更新' : '已添加单词');
};

function copyWords() {
  if (!basket.length) { toast('生词本是空的'); return; }
  const text = basket.map(b => `${b.word}\t${b.zh}${b.example ? '\t' + b.example : ''}`).join('\n');
  navigator.clipboard.writeText(text).then(
    () => toast('已复制 ' + basket.length + ' 词'),
    () => toast('复制失败')
  );
}
