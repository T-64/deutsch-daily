    <script id="dd-data" type="application/json">{"page":"lesson","lesson":{"slug":"2026-09-09","date":"2026-09-09","show":"tagesschau in Einfacher Sprache","level":"A2–B1","kind":"video","note":"","source_url":"https://www.tagesschau.de/tagesschau_in_einfacher_sprache/video-1646122.html","video":{"mp4":"https://tagesschau-progressive.ard-mcdn.de/video/2026/0909/TV-20260909-1740-1300.webl.h264.mp4","embed":"https://www.tagesschau.de/tagesschau_in_einfacher_sprache/video-1646122~player.html","page":"https://www.tagesschau.de/tagesschau_in_einfacher_sprache/video-1646122.html"},"duration":593.56,"sentences":[{"de":"Im Bundestag, im deutschen Parlament, reden die Politiker gerade über den neuen Haushalt.","zh":"在联邦议院——也就是德国的议会里，","start":10.62,"end":45.5},{"de":"D.h. sie besprechen, wofür soll der Staat Geld ausgeben.","zh":"政治家们正在讨论新的预算。也就是说，","start":46.92,"end":50.84},{"de":"Die größte Gruppe in der Opposition darf zuerst reden.","zh":"他们商议国家应该把钱花在哪里。","start":51.88,"end":55.68},{"de":"In der Opposition sind die Parteien, die nicht regieren.","zh":"议会中最大的反对派群体可以首先发言。","start":56.46,"end":59.94},{"de":"Die größte Gruppe in der Opposition ist die AfD, die Alternative für Deutschland.","zh":"反对派是指那些不执政的政党。","start":59.98,"end":65.94},{"de":"Die Chefin heißt Alice Weidel.","zh":"反对派里最大的群体是德国选择党（AfD）。","start":66.72,"end":70.76},{"de":"Sie ist die Frau auf dem Foto.","zh":"它的主席叫爱丽丝·魏德尔，","start":330.06,"end":371.72},{"de":"Sie hat zuerst geredet.","zh":"就是照片上的那位女士。她先发了言。","start":null,"end":null},{"de":"Danach hat der Bundeskanzler Friedrich Merz geredet.","zh":"之后联邦总理弗里德里希·默茨发言，","start":null,"end":null},{"de":"Er ist der Mann auf dem Foto.","zh":"他是照片上的那位男士。","start":null,"end":null},{"de":"Beide haben über die Arbeit von der Regierung geredet.","zh":"两人都谈了政府的工作。","start":null,"end":null},{"de":"Was sie gesagt haben, das zeigen wir jetzt.","zh":"他们说了什么，我们现在就来看。","start":null,"end":null},{"de":"Das ist Alice Weidel von der AfD.","zh":"这位是德国选择党的爱丽丝·魏德尔。","start":null,"end":null},{"de":"Sie sagt, die Regierung macht schlechte Arbeit bei der Wirtschaft.","zh":"她说，政府在经济方面做得很差。","start":null,"end":null},{"de":"Viele Menschen sind ohne Arbeit.","zh":"很多人没有工作，","start":null,"end":null},{"de":"Und das werden immer mehr Menschen.","zh":"而且这样的人越来越多。","start":null,"end":null},{"de":"Viele Firmen schließen.","zh":"很多公司关门，","start":null,"end":null},{"de":"Und viele deutsche Firmen gehen ins Ausland.","zh":"还有很多德国公司迁往国外。","start":null,"end":null},{"de":"Die Regierung gibt zu viel Geld aus.","zh":"政府花钱太多，","start":null,"end":null},{"de":"Sie gibt z.B. zu viel Geld für Migranten aus.","zh":"比如在移民身上花了太多钱。","start":null,"end":null},{"de":"Die Regierung ist schuld, dass es Deutschland schlecht geht.","zh":"德国过得不好，责任在政府。","start":null,"end":null},{"de":"Dann redet der Bundeskanzler Friedrich Merz.","zh":"然后联邦总理弗里德里希·默茨发言。","start":null,"end":null},{"de":"Er sagt, die Menschen wollen Sicherheit.","zh":"他说，人们想要安全。","start":516.54,"end":532.54},{"de":"Sie wollen sicher sein in Deutschland.","zh":"他们想在德国感到安全，","start":null,"end":null},{"de":"Sie wollen auch Schutz vor Krieg.","zh":"也想要免受战争的威胁，","start":null,"end":null},{"de":"Und sie wollen Schutz vor dem Klimawandel.","zh":"还想要免受气候变化的威胁。","start":null,"end":null},{"de":"Sicherheit und Schutz kosten Geld.","zh":"安全和防护都要花钱。","start":null,"end":null},{"de":"Deshalb muss die Wirtschaft stark sein.","zh":"因此经济必须强大，","start":null,"end":null},{"de":"Und sie ist stark.","zh":"而它也确实强大，","start":null,"end":null},{"de":"Sie ist stärker, als viele Menschen denken.","zh":"比很多人以为的还要强。","start":null,"end":null},{"de":"Die Regierung hat nämlich richtig entschieden, wie die Wirtschaft wieder stärker wird.","zh":"因为政府在“如何让经济重新变强”这件事上做了正确的决定。","start":null,"end":null},{"de":"Aber das reicht noch nicht.","zh":"但这还不够。","start":null,"end":null},{"de":"Wir brauchen die Reformen von der Regierung.","zh":"我们需要政府的改革，","start":null,"end":null},{"de":"Wir brauchen diese Veränderungen.","zh":"我们需要这些改变。","start":null,"end":null},{"de":"WHO ist das kurze Wort für World Health Organisation.","zh":"WHO 是 World Health Organisation 的缩写，这是英语，德语叫世界卫生组织。","start":null,"end":null},{"de":"Das ist Englisch und heißt auf Deutsch: Weltgesundheitsorganisation.","zh":"世界上几乎所有国家都是 WHO 的成员。","start":null,"end":null},{"de":"In der WHO sind fast alle Länder von der Welt.","zh":"WHO 关心人们的健康。","start":null,"end":null},{"de":"Die WHO kümmert sich um die Gesundheit von den Menschen.","zh":"现在 WHO 写了一份报告，里面写道：想要孩子的人，最好戒烟。","start":null,"end":null},{"de":"Jetzt hat die WHO einen Bericht geschrieben.","zh":"因为吸烟可能导致不孕。","start":null,"end":null},{"de":"Darin steht, wer ein Kind bekommen will, der hört besser mit dem Rauchen auf.","zh":"也就是说，女性可能更难怀孕或完全无法怀孕。","start":null,"end":null},{"de":"Rauchen kann nämlich unfruchtbar machen.","zh":"我们来看一段相关影片。","start":null,"end":null},{"de":"Das bedeutet, Frauen können schlechter oder kein Kind bekommen.","zh":"（接下来是一段影片。","start":null,"end":null},{"de":"Wir zeigen einen Film dazu.","zh":"）","start":null,"end":null},{"de":"Das ist Nicole Gabor.","zh":"这位是妮可·加博尔。","start":null,"end":null},{"de":"Sie hat früher geraucht, manchmal 15 Zigaretten am Tag.","zh":"她以前吸烟，有时一天 15 支。","start":null,"end":null},{"de":"Dann hat sie damit aufgehört und ist schwanger geworden.","zh":"后来她戒了烟，并怀了孕。","start":null,"end":null},{"de":"Nicole Gabor sagt, ich habe damals gedacht, mein Kind soll nicht in dem Körper von einer Raucherin wachsen.","zh":"妮可·加博尔说，我当时的想法是，我的孩子不应该在一个吸烟者的身体里成长。","start":null,"end":null},{"de":"Die WHO hat herausgefunden, Raucherinnen sind öfter unfruchtbar als Nichtraucherinnen.","zh":"WHO 发现，吸烟的女性比不吸烟的女性更常出现不孕。","start":null,"end":null},{"de":"Diese Expertin von der WHO sagt, wenn Frauen rauchen, dann haben sie weniger Eizellen.","zh":"这位 WHO 的专家说，","start":null,"end":null},{"de":"Nicole Gabor raucht schon seit vielen Jahren nicht mehr.","zh":"女性吸烟的话，卵细胞会更少。","start":null,"end":null},{"de":"Jetzt hilft sie anderen Frauen, mit dem Rauchen aufzuhören.","zh":"妮可·加博尔已经很多年不吸烟了。","start":null,"end":null},{"de":"Mit Online-Videos und Kursen.","zh":"现在她帮助其他女性戒烟，","start":null,"end":null},{"de":"Nicole Gabor sagt, zu mir kommen viele Frauen.","zh":"用的是在线视频和课程。","start":null,"end":null},{"de":"Sie wollen schwanger werden und mit dem Rauchen aufhören.","zh":"妮可·加博尔说，很多女性来找我，","start":null,"end":null},{"de":"Sie machen sich sehr viel Druck.","zh":"她们想怀孕，也想戒烟，给自己很大压力。","start":null,"end":null},{"de":"Ich versuche, den Druck rauszunehmen.","zh":"我试着帮她们把压力卸下来。如果女性戒了烟，","start":null,"end":null},{"de":"Wenn Frauen mit dem Rauchen aufhören, dann können sie wieder besser schwanger werden.","zh":"她们就能重新更容易地怀孕。","start":null,"end":null},{"de":"In Deutschland sind mehr als eine Million Menschen blind oder sehbehindert.","zh":"在德国，有超过一百万人失明或视力受损。为他们有一款新应用，","start":null,"end":null},{"de":"Für sie gibt es eine neue App, ein kleines Computerprogramm, z.B. auf dem Handy.","zh":"就是一个小的电脑程序，比如装在手机上。","start":null,"end":null},{"de":"Die App heißt Be My Eyes.","zh":"这款应用叫 Be My Eyes，","start":null,"end":null},{"de":"Das ist Englisch und heißt auf Deutsch: Sei meine Augen.","zh":"这是英语，德语意思是“做我的眼睛”。","start":null,"end":null},{"de":"Mit der App können Blinde andere Menschen anrufen.","zh":"盲人可以用这款应用呼叫其他人，","start":null,"end":null},{"de":"Die Menschen können sehen, was die Blinden auf dem Handy zeigen, wie auf dem Foto.","zh":"对方能看到盲人在手机上展示的东西，","start":null,"end":null},{"de":"Dann können sie den Blinden helfen, z.B. im Haushalt.","zh":"就像照片上那样，然后就能帮助盲人，比如做家务。","start":null,"end":null},{"de":"Dazu kommt jetzt ein Film.","zh":"接下来是一段影片。（接下来是一段影片。）","start":null,"end":null},{"de":"Das ist Karin Strecker.","zh":"这位是卡琳·施特雷克。","start":null,"end":null},{"de":"Sie ist blind.","zh":"她是一位盲人，独自生活在柏林市。","start":null,"end":null},{"de":"Sie lebt allein in der Stadt Berlin.","zh":"她在应用里问，比如：床单上这里有块污渍吗？","start":null,"end":null},{"de":"In der App fragt sie z.B. ist hier ein Fleck auf der Decke?","zh":"应用里一位女士回答：没有，","start":null,"end":null},{"de":"In der App antwortet eine Frau, nein, das sieht gut aus.","zh":"看起来很干净。卡琳·施特雷克说，","start":null,"end":null},{"de":"Karin Strecker sagt: Ich nutze Be My Eyes jeden Tag, z.B. im Bad.","zh":"我每天都会用 Be My Eyes，","start":null,"end":null},{"de":"Ich frage, was ist für die Haare und was ist die Seife?","zh":"比如在浴室里，我会问哪个是洗头发的、哪个是香皂？","start":null,"end":null},{"de":"Künstliche Intelligenz hilft in der App, aber auch echte Menschen helfen.","zh":"应用里有人工智能帮忙，","start":null,"end":null},{"de":"Sie machen das freiwillig, d.h. sie bekommen kein Geld dafür.","zh":"但也有真人帮忙。他们是自愿做的，","start":null,"end":null},{"de":"Sie bekommen einen Anruf.","zh":"也就是说没有报酬。他们接到来电通知，","start":null,"end":null},{"de":"Der Erste, der kann, geht ans Telefon und spricht mit dem blinden Menschen und schaut z.B., ob die Kleidung zusammenpasst.","zh":"第一个有空的人拿起电话，","start":null,"end":null},{"de":"Zehn Mio.","zh":"和盲人交谈，比如看看衣服搭不搭配。","start":null,"end":null},{"de":"Menschen haben sich bei der App gemeldet, um Blinden zu helfen.","zh":"有一千万人注册了这款应用，","start":null,"end":null},{"de":"Mareike ist eine von den freiwilligen Helfern.","zh":"来帮助盲人。玛莱克就是志愿者之一。","start":null,"end":null},{"de":"Sie sagt: Wenn ich angerufen werde, helfe ich z.B. in der Küche.","zh":"她说，接到电话时，我比如在厨房帮忙，","start":null,"end":null},{"de":"Ich erkläre, wie die Mikrowelle funktioniert oder ich lese vor, was auf der Verpackung von einem Essen steht.","zh":"解释微波炉怎么用，或者读出食品包装上写的内容。","start":null,"end":null},{"de":"Die Oma von Mareike ist blind.","zh":"玛莱克的奶奶是盲人。玛莱克说，","start":null,"end":null},{"de":"Mareike sagt, ich finde die App sehr gut.","zh":"我觉得这款应用非常好，","start":null,"end":null},{"de":"Ich habe auch eine blinde Tochter.","zh":"我自己也有一个失明的女儿，","start":null,"end":null},{"de":"Deshalb finde ich die App wichtig.","zh":"所以我觉得它很重要。","start":null,"end":null},{"de":"Ich finde es schön.","zh":"我觉得很美好，我能帮助别人。","start":null,"end":null},{"de":"Ich kann anderen helfen.","zh":"人们帮助其他人解决问题。","start":null,"end":null},{"de":"Menschen helfen anderen Menschen bei Problemen.","zh":"对卡琳·施特雷克来说，","start":null,"end":null},{"de":"Für Karin Strecker ist die App eine große Hilfe im Alltag.","zh":"这款应用是日常生活中的一大帮助。","start":null,"end":null},{"de":"Sie sagt, mit der App bin ich selbstständig.","zh":"她说，有了它我能独立生活，","start":null,"end":null},{"de":"Ich brauche nicht mehr bei den Nachbarn zu klingeln, und um Hilfe zu bitten.","zh":"不用再去按邻居的门铃请求帮助了。","start":null,"end":null},{"de":"Sie freut sich sehr über die Hilfe.","zh":"她非常感激这些帮助，","start":null,"end":null},{"de":"Und Mareike freut sich, dass sie anderen helfen kann.","zh":"玛莱克也为能帮助别人而高兴。","start":null,"end":null},{"de":"König Harald V. war viele Jahre lang der König von Norwegen.","zh":"哈拉尔五世多年来一直是挪威的国王。","start":null,"end":null},{"de":"Vor einigen Tagen ist er gestorben.","zh":"几天前他去世了，享年 89 岁。","start":null,"end":null},{"de":"Er war 89 Jahre alt.","zh":"现在举行了哈拉尔的葬礼。葬礼的意思是，","start":null,"end":null},{"de":"Jetzt war die Beisetzung von Harald.","zh":"灵柩被送到一个特定的地方，","start":554.54,"end":585.72},{"de":"Beisetzung bedeutet, der Sarg wird an einen bestimmten Ort gebracht.","zh":"然后留在那里。","start":null,"end":null},{"de":"Dort bleibt er dann.","zh":"灵柩先被运着穿过挪威首都奥斯陆，","start":null,"end":null},{"de":"Zuerst wurde der Sarg durch die norwegische Hauptstadt Oslo gefahren.","zh":"照片拍的就是这个场景。","start":null,"end":null},{"de":"Davon ist das Foto.","zh":"现在我们来看一段相关影片。","start":null,"end":null},{"de":"Jetzt zeigen wir einen Film dazu.","zh":"（接下来是一段影片。）","start":null,"end":null},{"de":"Hinter dem Sarg geht der neue König von Norwegen, Haakon.","zh":"走在灵柩后面的是挪威新国王哈康，","start":null,"end":null},{"de":"Er ist der Sohn von Harald.","zh":"他是哈拉尔的儿子。","start":null,"end":null},{"de":"Viele Menschen wollen den Sarg sehen.","zh":"很多人想看灵柩一眼。","start":null,"end":null},{"de":"Das Militär begleitet den Sarg.","zh":"军队护送灵柩，","start":null,"end":null},{"de":"Er wird zu einer Kirche gebracht.","zh":"它被送往一座教堂，","start":null,"end":null},{"de":"Dort ist die Trauerfeier mit vielen Gästen.","zh":"那里举行了有许多宾客出席的葬礼仪式。","start":null,"end":null},{"de":"Könige aus andere
