    <script id="dd-data" type="application/json">{"page":"lesson","lesson":{"slug":"2026-11-06","date":"2026-11-06","show":"tagesschau in Einfacher Sprache","level":"A2–B1","kind":"broadcast","note":"","source_url":"https://www.tagesschau.de/tagesschau_in_einfacher_sprache/tse-1496.html","video":{"mp4":"https://tagesschau-progressive.ard-mcdn.de/video/2026/1106/TV-20261106-1739-2000.webl.h264.mp4","embed":"","page":"https://www.tagesschau.de/tagesschau_in_einfacher_sprache/video-1679350.html"},"duration":444.91,"sentences":[{"de":"Willkommen zur tagesschau in einfacher Sprache.","zh":"欢迎收看简单语言的每日新闻。","start":9.02,"end":11.98},{"de":"Ich bin Susanne Holst und das sind unsere Nachrichten:","zh":"我是Susanne Holst，以下是我们的新闻：","start":12.06,"end":15.42},{"de":"Und nun zur ersten Nachricht.","zh":"现在来看第一条新闻。","start":32.19,"end":34.31},{"de":"Der Bundespräsident ist der Chef von Deutschland.","zh":"联邦总统是德国的国家元首。","start":39.19,"end":42.63},{"de":"Er ist noch wichtiger als der Bundeskanzler.","zh":"他甚至比联邦总理更重要。","start":43.15,"end":46.23},{"de":"Er vertritt Deutschland in anderen Ländern auf der Welt.","zh":"他代表德国与世界上的其他国家交往。","start":46.67,"end":50.47},{"de":"Und er muss jedes Gesetz in Deutschland unterschreiben.","zh":"德国的每一部法律都必须由他签署。","start":50.66,"end":54.34},{"de":"Sonst gilt das Gesetz nicht.","zh":"否则法律不生效。","start":54.51,"end":56.51},{"de":"Im Moment ist Frank-Walter Steinmeier Bundespräsident.","zh":"目前的联邦总统是弗兰克-瓦尔特·施泰因迈尔。","start":57.15,"end":60.95},{"de":"Aber nicht mehr lange.","zh":"但他不会担任太久了。","start":61.26,"end":62.86},{"de":"Dann gibt es eine Wahl.","zh":"之后将举行一次选举。","start":63.23,"end":65.35},{"de":"Die Parteien stellen dazu Kandidaten auf.","zh":"各政党会为此推出候选人。","start":65.51,"end":68.91},{"de":"Der Bundespräsident kann ein Mann oder eine Frau sein.","zh":"联邦总统可以是男性，也可以是女性。","start":69.59,"end":73.51},{"de":"Jetzt könnte es eine Frau werden.","zh":"现在可能是一位女性。","start":73.83,"end":76.19},{"de":"Die CDU sagt nämlich, wir wollen Ilse Aigner als Bundespräsidentin.","zh":"因为基民盟表示：我们希望伊尔莎·艾格纳成为联邦总统。","start":76.59,"end":82.43},{"de":"Aigner ist auf dem Foto.","zh":"艾格纳就是照片上的人。","start":83.07,"end":84.79},{"de":"Sie ist eine Politikerin aus dem Bundesland Bayern.","zh":"她是来自巴伐利亚州的政治家。","start":85.23,"end":88.35},{"de":"Vor einigen Jahren war sie Ministerin in der Bundesregierung.","zh":"几年前她曾担任联邦政府的部长。","start":88.39,"end":92.67},{"de":"Die Kandidaten der anderen Parteien sind noch nicht bekannt.","zh":"其他政党的候选人目前还不清楚。","start":93.15,"end":97.35},{"de":"Und nun zur nächsten Nachricht.","zh":"现在来看下一条新闻。","start":98.62,"end":100.46},{"de":"Manchmal tun Menschen anderen Menschen besondere Gewalt an.","zh":"有时候，一些人会对他人施加特殊的暴力。","start":105.47,"end":109.75},{"de":"Z.B. betäubt der Täter das Opfer und hat dann Sex.","zh":"例如，作案者把受害者麻醉，然后与其发生性行为。","start":110.18,"end":114.46},{"de":"Betäubung ist wie Schlafen, aber aufwachen geht nicht.","zh":"麻醉就像睡着一样，但是无法醒来。","start":115.43,"end":119.03},{"de":"Für die Betäubung benutzen Täter oft K.o.-Tropfen.","zh":"作案者常常使用K.o.滴剂来进行麻醉。","start":119.86,"end":123.98},{"de":"Das sind Medikamente oder Drogen.","zh":"这些是药物或毒品。","start":124.43,"end":127.27},{"de":"Sie werden z.B. in Getränke gemischt.","zh":"它们会被掺入饮料中。","start":127.83,"end":130.83},{"de":"Das Opfer sieht das nicht.","zh":"受害者看不到这一点。","start":131.39,"end":133.35},{"de":"Der Täter macht das nämlich heimlich.","zh":"因为作案者是偷偷做的。","start":133.62,"end":136.02},{"de":"K.o.-Tropfen haben auch keinen Geschmack oder Geruch.","zh":"K.o.滴剂也没有味道或气味。","start":136.5,"end":140.46},{"de":"Der Bundestag hat jetzt beschlossen, wer K.o.-Tropfen benutzt, muss härter bestraft werden.","zh":"联邦议院现在决定：使用K.o.滴剂的人必须受到更严厉的惩罚。","start":140.75,"end":147.47},{"de":"Dazu zeigen wir einen Film.","zh":"为此我们播放一段影片。","start":147.83,"end":149.75},{"de":"Der Bundestag hat erst einmal über die härteren Strafen diskutiert.","zh":"联邦议院先是对更严厉的惩罚进行了讨论。","start":150.43,"end":155.11},{"de":"Diese Politikerin von der SPD sagt, K.o.-Tropfen sind gefährlich.","zh":"这位社民党的政治家说：K.o.滴剂很危险。","start":156.26,"end":162.42},{"de":"Wenn ein Opfer betäubt ist, kann sich das Opfer nicht mehr wehren.","zh":"受害者被麻醉后，就无法再反抗。","start":162.91,"end":167.95},{"de":"Der Täter nutzt das aus.","zh":"作案者会利用这一点。","start":168.31,"end":170.79},{"de":"Deshalb brauchen wir härtere Strafen.","zh":"所以我们需要更严厉的惩罚。","start":171.62,"end":174.5},{"de":"Niemand weiß, wie viele Opfer von K.o.-Tropfen es gibt.","zh":"没有人知道有多少K.o.滴剂的受害者。","start":175.83,"end":179.75},{"de":"Viele gehen nach der Tat nicht zum Arzt oder zur Polizei.","zh":"许多受害者在事发后不去看医生或报警。","start":180.7,"end":185.18},{"de":"Oft können sich die Opfer auch nicht mehr erinnern.","zh":"受害者往往也无法再记起发生的事。","start":186.11,"end":189.83},{"de":"Der Bundestag hat jetzt beschlossen, Täter werden härter bestraft.","zh":"联邦议院现在决定：作案者将受到更严厉的惩罚。","start":191.58,"end":196.34},{"de":"Wer K.o.-Tropfen benutzt, muss jetzt länger ins Gefängnis.","zh":"使用K.o.滴剂的人现在要坐更久的牢。","start":197.15,"end":201.63},{"de":"Und K.o.-Tropfen gelten jetzt als Waffe.","zh":"而且K.o.滴剂现在被认定为武器。","start":202.62,"end":206.02},{"de":"Dieser Politiker von der Partei Die Linke sagt, härtere Strafen sind gut.","zh":"这位左翼党的政治家说：更严厉的惩罚是好的。","start":207.1,"end":213.46},{"de":"Aber wir müssen noch mehr tun.","zh":"但我们必须做得更多。","start":214.23,"end":216.39},{"de":"Wir müssen besser über K.o.-Tropfen informieren.","zh":"我们必须更好地宣传关于K.o.滴剂的知识。","start":216.67,"end":220.47},{"de":"Jeder muss wissen, wo bekomme ich Hilfe.","zh":"每个人都必须知道：我在哪里可以获得帮助。","start":221.27,"end":224.59},{"de":"Und die Polizei muss sich auch besser mit K.o.-Tropfen auskennen.","zh":"警察也必须更加了解K.o.滴剂。","start":225.31,"end":230.47},{"de":"Und nun zur nächsten Nachricht.","zh":"现在来看下一条新闻。","start":232.35,"end":234.59},{"de":"In der Stadt Düsseldorf hat ein Prozess begonnen.","zh":"在杜塞尔多夫市，一场审判开始了。","start":238.42,"end":241.7},{"de":"Mehrere Menschen sind angeklagt.","zh":"有多人被起诉。","start":241.95,"end":244.23},{"de":"Davon zeigen wir jetzt Bilder.","zh":"我们现在展示相关的画面。","start":244.39,"end":246.55},{"de":"Das Gericht sagt, die Männer waren in einer kriminellen Gruppe.","zh":"法院说，这些男子属于一个犯罪团伙。","start":246.67,"end":251.11},{"de":"Die Gruppe heißt Königreich Deutschland.","zh":"这个团伙名叫“德意志王国”。","start":251.91,"end":254.71},{"de":"Einer von ihnen nennt sich sogar König von Deutschland.","zh":"其中一人甚至自称德国国王。","start":255.55,"end":259.23},{"de":"Er ist der Chef von der Gruppe.","zh":"他是这个团伙的头目。","start":259.47,"end":261.51},{"de":"Die Mitglieder von der Gruppe nennt man auch Reichsbürger.","zh":"这个团伙的成员也被称为“帝国公民”。","start":262.22,"end":266.02},{"de":"Sie lehnen den Staat ab.","zh":"他们拒绝承认国家。","start":266.59,"end":268.43},{"de":"Sie halten sich nicht an die Gesetze.","zh":"他们不遵守法律。","start":268.91,"end":271.51},{"de":"Reichsbürger wollen ihre eigenen Regeln machen.","zh":"帝国公民想制定自己的规则。","start":271.55,"end":274.23},{"de":"Das ist aber verboten.","zh":"但这是被禁止的。","start":274.63,"end":276.39},{"de":"Deshalb gibt es jetzt eine Anklage.","zh":"因此现在有了起诉。","start":276.63,"end":279.15},{"de":"Und nun zur nächsten Nachricht.","zh":"接下来是下一条新闻。","start":281.31,"end":283.19},{"de":"Paraguay ist ein Land in Südamerika.","zh":"巴拉圭是南美洲的一个国家。","start":286.83,"end":289.71},{"de":"Dort gibt es jetzt eine Krise.","zh":"那里现在发生了危机。","start":290.47,"end":292.63},{"de":"Die Krise betrifft die Menschen in Paraguay und auch die Regierung.","zh":"这场危机影响到巴拉圭的民众，也影响到政府。","start":292.71,"end":297.43},{"de":"Angefangen hat alles mit einer Bank.","zh":"一切是从一家银行开始的。","start":298.18,"end":300.82},{"de":"Eine Bank ist eine Firma für Geld.","zh":"银行是管理钱的公司。","start":301.55,"end":304.55},{"de":"Die Menschen bringen ihr Geld dorthin.","zh":"人们把钱放到那里。","start":305.03,"end":307.55},{"de":"Die Bank passt dann darauf auf.","zh":"银行替他们保管。","start":307.59,"end":309.79},{"de":"Außerdem verleiht eine Bank Geld an Menschen und andere Firmen.","zh":"此外，银行还把钱借给人和其他公司。","start":310.55,"end":314.99},{"de":"Auch der Staat hatte viel von seinem Geld zur Bank gebracht.","zh":"国家也把很多钱放到了这家银行。","start":315.35,"end":319.31},{"de":"Aber jetzt gibt es Probleme.","zh":"但现在出了问题。","start":319.63,"end":321.63},{"de":"Die Bank ist zu.","zh":"银行关闭了。","start":321.87,"end":323.19},{"de":"Die Menschen bekommen kein Geld mehr.","zh":"人们拿不到钱了。","start":323.79,"end":326.43},{"de":"Sie sagen, der Präsident ist schuld.","zh":"他们说，这是总统的责任。","start":326.71,"end":329.35},{"de":"Er hätte aufpassen müssen.","zh":"他本应该好好监督。","start":329.67,"end":331.51},{"de":"Wir wollen unser Geld zurück.","zh":"我们要拿回我们的钱。","start":331.75,"end":333.51},{"de":"Dazu zeigen wir jetzt einen Film.","zh":"为此我们现在播放一段影片。","start":334.39,"end":336.87},{"de":"Viele Menschen in Paraguay sind wütend.","zh":"巴拉圭许多民众很愤怒。","start":337.67,"end":341.03},{"de":"Sie sagen, der Präsident hat schlechte Arbeit gemacht.","zh":"他们说，总统工作做得很差。","start":341.31,"end":345.27},{"de":"Er ist ein Verbrecher und muss ins Gefängnis.","zh":"他是罪犯，必须进监狱。","start":345.51,"end":349.19},{"de":"Das ist der Präsident.","zh":"这就是总统。","start":350.07,"end":351.63},{"de":"Er heißt Santiago Peña.","zh":"他叫圣地亚哥·培尼亚。","start":352.07,"end":354.27},{"de":"Er sagt, ich entschuldige mich.","zh":"他说：我道歉。","start":354.67,"end":357.31},{"de":"Ich habe versagt.","zh":"我失职了。","start":357.55,"end":358.99},{"de":"Deshalb trete ich zurück.","zh":"因此我辞职。","start":359.43,"end":361.31},{"de":"Aber das Parlament sagt jetzt, nein, wir wollen den Rücktritt nicht.","zh":"但议会现在说：不，我们不要这个辞职。","start":363.35,"end":368.15},{"de":"Wir wollen den Präsidenten lieber selbst rausschmeißen.","zh":"我们更想自己把总统赶下台。","start":368.39,"end":372.23},{"de":"Warum?","zh":"为什么呢？","start":372.55,"end":373.55},{"de":"Wenn Peña zurücktritt, dann könnte er Immunität bekommen.","zh":"如果培尼亚辞职，他可能会获得豁免权。","start":373.75,"end":378.39},{"de":"D.h. die Behörden dürfen nicht gegen ihn ermitteln.","zh":"也就是说，当局不得对他进行调查。","start":379.31,"end":383.19},{"de":"Peña kann dann nicht bestraft werden.","zh":"这样培尼亚就不会受到惩罚。","start":383.63,"end":386.31},{"de":"Das Parlament will aber Ermittlungen.","zh":"但议会想要调查。","start":387.07,"end":389.71},{"de":"Die Behörden sollen herausfinden, ist der Präsident an den Problemen bei der Bank schuld.","zh":"当局应当查清：总统对银行的问题是否有责任。","start":389.91,"end":396.47},{"de":"Wann die Bank wieder aufmachen kann, ist unklar.","zh":"银行何时能重新开门，还不清楚。","start":397.27,"end":401.07},{"de":"Niemand weiß, ob die Menschen ihr Geld wiederbekommen.","zh":"没有人知道人们能否拿回他们的钱。","start":401.47,"end":405.27},{"de":"Und das waren unsere Nachrichten.","zh":"以上是我们的新闻。","start":407.26,"end":409.66},{"de":"Und jetzt kommt das Wetter.","zh":"现在播报天气。","start":425.82,"end":427.9},{"de":"Rechts im Osten und auch links im Westen viel Sonne.","zh":"右边的东部和左边的西部都有很多阳光。","start":428.87,"end":432.51},{"de":"Sonst bewölkt und nur manchmal sonnig.","zh":"其他地区多云，只是偶尔有阳光。","start":432.83,"end":435.51},{"de":"Das war die tagesschau in einfacher Sprache.","zh":"以上就是简单语言版每日新闻。","start":439.91,"end":442.71},{"de":"Tschüss, bis zum nächsten Mal.","zh":"再见，下次见。","start":442.75,"end":444.91}],"stories":[{"title":"Begrüßung","title_zh":"开场问候","from":0,"to":2,"vocab":[],"grammar":[],"background":""},{"title":"CDU: Aigner soll Bundespräsidentin werden","title_zh":"基民盟：艾格纳有望成为联邦总统","from":3,"to":18,"vocab":[{"key":"bundespräsident","lemma":"der Bundespräsident, -en","pos":"noun","zh":"联邦总统","example_de":"Die CDU sagt nämlich, wir wollen Ilse Aigner als Bundespräsidentin.","example_zh":"因为基民盟表示：我们希望伊尔莎·艾格纳成为联邦总统。"},{"key":"unterschreiben","lemma":"unterschreiben","pos":"verb","zh":"签署","example_de":"Und er muss jedes Gesetz in Deutschland unterschreiben.","example_zh":"德国的每一部法律都必须由他签署。"},{"key":"wahl","lemma":"die Wahl, -en","pos":"noun","zh":"选举","example_de":"Dann gibt es eine Wahl.","example_zh":"之后将举行一次选举。"},{"key":"kandidat","lemma":"der Kandidat, -en","pos":"noun","zh":"候选人","example_de":"Die Parteien stellen dazu Kandidaten auf.","example_zh":"各政党会为此推出候选人。"},{"key":"bekannt","lemma":"bekannt","pos":"adj","zh":"已知的，著名的","example_de":"Die Kandidaten der anderen Parteien sind noch nicht bekannt.","example_zh":"其他
