6}, {"de": "In anderen Bundesländern gibt es aber auch Probleme mit der Bildung.", "zh": "但在其他联邦州，教育也存在问题。", "start": 162.72, "end": 167.12}]}, {"start": 167.16, "end": 209.2, "lines": [{"de": "Der Leiter von dem Bericht sagt: viele Kinder in den Kindergärten und Schulen sprechen kein Deutsch.", "zh": "这份报告的负责人说：幼儿园和学校里的许多孩子不说德语。", "start": 167.16, "end": 175.76}, {"de": "Deshalb sind die Chancen für gute Bildung in einigen Bundesländern schlechter geworden.", "zh": "因此在一些联邦州，良好教育的机会变差了。", "start": 176.52, "end": 183.04}, {"de": "Die Frau links ist Bildungsministerin Prien.", "zh": "左边的这位女士是教育部长普里恩。", "start": 183.88, "end": 187.48}, {"de": "Sie sagt: wir müssen bei den ganz jungen Kindern schauen, ob sie gut Deutsch sprechen können.", "zh": "她说：我们必须关注非常年幼的孩子，看他们能不能说好德语。", "start": 187.88, "end": 194.36}, {"de": "Wenn Kinder nicht gut Deutsch sprechen können, dann müssen wir ihnen dabei helfen.", "zh": "如果孩子不能说好德语，我们就必须帮助他们。", "start": 194.4, "end": 201.04}, {"de": "Der Kindergarten in Sachsen zeigt: der Weg zu einer guten Bildung beginnt schon ganz früh.", "zh": "萨克森州的这家幼儿园表明：通往良好教育的道路开始得非常早。", "start": 202.6, "end": 209.2}]}], "vocab": [{"lemma": "die Bildung", "key": "bildung", "forms": ["Bildung"], "pos": "Substantiv", "zh": "教育", "example_de": "Für Deutschland gibt es einen neuen Bericht zu dem Thema Bildung.", "example_zh": ""}, {"lemma": "der Kindergarten, ¨-", "key": "kindergarten", "forms": ["Kindergarten", "Kindergärten"], "pos": "Substantiv", "zh": "幼儿园", "example_de": "Und wie gut sind die Schulen und die Kindergärten.", "example_zh": ""}, {"lemma": "die Erzieherin, -nen", "key": "erzieherin", "forms": ["Erzieherin", "Erzieher", "Erziehern"], "pos": "Substantiv", "zh": "（女）教育员、幼师", "example_de": "Die Kinder backen zusammen mit der Erzieherin von dem Kindergarten einen Kuchen.", "example_zh": ""}, {"lemma": "die Chance, -n", "key": "chance", "forms": ["Chancen", "Chance"], "pos": "Substantiv", "zh": "机会", "example_de": "Der Bericht untersucht, wie gut sind die Chancen für eine gute Bildung in Deutschland.", "example_zh": ""}, {"lemma": "gut ausgebildet", "key": "ausgebildet", "forms": ["ausgebildet", "gut ausgebildet"], "pos": "Wendungen", "zh": "受过良好培训的", "example_de": "Die Leiterin von dem Kindergarten sagt: unsere Erzieher sind gut ausgebildet und sie haben sehr viel Erfahrung.", "example_zh": ""}, {"lemma": "die Erfahrung, -en", "key": "erfahrung", "forms": ["Erfahrung"], "pos": "Substantiv", "zh": "经验", "example_de": "Die Leiterin von dem Kindergarten sagt: unsere Erzieher sind gut ausgebildet und sie haben sehr viel Erfahrung.", "example_zh": ""}, {"lemma": "sogar", "key": "sogar", "forms": ["sogar"], "pos": "Adverb", "zh": "甚至", "example_de": "Und in Sachsen können viele Kinder sogar den ganzen Tag im Kindergarten bleiben.", "example_zh": ""}], "grammar_points": [{"title": "间接问句：was sie machen wollen", "summary": "entscheiden 后面接问句时，动词放在句尾：was sie machen wollen（他们想做什么）。", "example_de": "Die Kinder dürfen zusammen mit den Erziehern selbst entscheiden, was sie machen wollen.", "example_zh": "孩子们可以和教育员们一起自己决定想做什么。"}, {"title": "deshalb + V2", "summary": "deshalb 占第一位时，动词仍在第二位：Deshalb sind die Chancen ... geworden。", "example_de": "Deshalb sind die Chancen für gute Bildung in einigen Bundesländern schlechter geworden.", "example_zh": "因此在一些联邦州，良好教育的机会变差了。"}], "background": "德国定期发布全国教育报告（Bildungsbericht），比较各联邦州幼儿园和学校的教育机会。这次报告显示萨克森州排名第一；许多孩子入园入学时不会说德语，被认为是部分联邦州教育机会变差的重要原因。Prien 是现任联邦教育部长。"}, {"title": "Länder sprechen in Finnland über die Arktis", "title_zh": "各国在芬兰谈论北极", "paras": [{"start": 211.24, "end": 238.76, "lines": [{"de": "Die Arktis ist ein Gebiet ganz oben im Norden von der Erde.", "zh": "北极是地球最顶端的一片区域。", "start": 211.24, "end": 221.44}, {"de": "Dort gibt es ganz viel Eis.", "zh": "那里有非常多的冰。", "start": 221.96, "end": 223.88}, {"de": "Zur Arktis zeigen wir jetzt eine Karte.", "zh": "关于北极，我们现在展示一张地图。", "start": 224.16, "end": 226.56}, {"de": "Die Arktis ist direkt am Nordpol von der Erde.", "zh": "北极正好在地球的最北端。", "start": 226.68, "end": 230.68}, {"de": "Und die Arktis gehört zu mehreren Ländern.", "zh": "而且北极属于好几个国家。", "start": 231.4, "end": 234.36}, {"de": "Z.B. zu Kanada, den USA und Russland.", "zh": "比如加拿大、美国和俄罗斯。", "start": 235.12, "end": 238.76}]}, {"start": 239.48, "end": 276.84, "lines": [{"de": "In der Arktis gibt es viele Rohstoffe.", "zh": "北极蕴藏着许多原材料。", "start": 239.48, "end": 242.4}, {"de": "Z.B. Öl oder Gas.", "zh": "比如石油或天然气。因此存在争执。", "start": 242.8, "end": 244.72}, {"de": "Deswegen gibt es Streit.", "zh": "因为一些国家想在北极拥有更多权力。", "start": 245.4, "end": 247.2}, {"de": "Einige Länder wollen nämlich mehr Macht in der Arktis.", "zh": "比如俄罗斯或美国。", "start": 247.92, "end": 251.72}, {"de": "Z.B. Russland oder die USA.", "zh": "现在芬兰有一场关于北极的会谈。", "start": 252.04, "end": 254.44}, {"de": "In Finnland gibt es jetzt ein Treffen zur Arktis.", "zh": "许多欧盟国家参加了这场会谈。", "start": 255.24, "end": 259.0}, {"de": "Bei dem Treffen sind viele Länder von der EU.", "zh": "各国在讨论：我们如何保护北极、不被其他国家侵害。", "start": 259.56, "end": 262.72}, {"de": "Die Länder sprechen darüber, wie schützen wir die Arktis vor anderen Ländern.", "zh": "联邦总理弗里德里希·默茨也参加了会谈。", "start": 263.04, "end": 267.72}, {"de": "Auch Bundeskanzler Friedrich Merz ist bei dem Treffen dabei.", "zh": "我们现在放一段短片，看看默茨说了什么。", "start": 267.76, "end": 272.4}, {"de": "Was Merz sagt, dazu zeigen wir jetzt einen kurzen Film.", "zh": "（接下来是一段短片。）", "start": 273.0, "end": 276.84}]}, {"start": 277.64, "end": 318.68, "lines": [{"de": "Das ist Kanzler Merz bei dem Treffen in Finnland.", "zh": "这是默茨总理在芬兰会谈的现场。", "start": 277.64, "end": 281.92}, {"de": "Er sagt: die EU muss die Arktis besser schützen.", "zh": "他说：欧盟必须更好地保护北极。", "start": 281.96, "end": 286.8}, {"de": "Wir müssen dafür noch viel mehr tun.", "zh": "为此我们必须做得更多。", "start": 287.52, "end": 289.64}, {"de": "Das ist wichtig für die Sicherheit in der EU.", "zh": "这对欧盟的安全很重要。", "start": 289.68, "end": 293.96}, {"de": "Und das ist auch wichtig für die Wirtschaft.", "zh": "这对经济也很重要。", "start": 294.88, "end": 297.96}, {"de": "In der Arktis gibt es nämlich viele wichtige Rohstoffe.", "zh": "因为北极蕴藏着许多重要的原材料。", "start": 298.8, "end": 302.64}, {"de": "Wir müssen auch mit anderen Ländern zusammenarbeiten, die nicht in der EU sind.", "zh": "我们也必须和欧盟以外的国家合作。", "start": 303.32, "end": 308.52}, {"de": "Z.B. mit Island, Norwegen, Kanada und England.", "zh": "比如冰岛、挪威、加拿大和英国。", "start": 308.56, "end": 314.2}, {"de": "Wir müssen alles tun, um die Arktis zu schützen.", "zh": "我们必须竭尽所能保护北极。", "start": 315.24, "end": 318.68}]}], "vocab": [{"lemma": "die Arktis", "key": "arktis", "forms": ["Arktis"], "pos": "Substantiv", "zh": "北极地区", "example_de": "Die Arktis ist ein Gebiet ganz oben im Norden von der Erde.", "example_zh": ""}, {"lemma": "der Rohstoff, -e", "key": "rohstoff", "forms": ["Rohstoffe", "Rohstoff"], "pos": "Substantiv", "zh": "原材料、原料", "example_de": "In der Arktis gibt es viele Rohstoffe.", "example_zh": ""}, {"lemma": "der Streit", "key": "streit", "forms": ["Streit"], "pos": "Substantiv", "zh": "争执、争论", "example_de": "Deswegen gibt es Streit.", "example_zh": ""}, {"lemma": "die Macht", "key": "macht", "forms": ["Macht"], "pos": "Substantiv", "zh": "权力", "example_de": "Einige Länder wollen nämlich mehr Macht in der Arktis.", "example_zh": ""}, {"lemma": "das Treffen, -", "key": "treffen", "forms": ["Treffen"], "pos": "Substantiv", "zh": "会面、会谈", "example_de": "In Finnland gibt es jetzt ein Treffen zur Arktis.", "example_zh": ""}, {"lemma": "schützen", "key": "schuetzen", "forms": ["schützen", "schützt"], "pos": "Verb", "zh": "保护", "example_de": "Die Länder sprechen darüber, wie schützen wir die Arktis vor anderen Ländern.", "example_zh": ""}, {"lemma": "zusammenarbeiten", "key": "zusammenarbeiten", "forms": ["zusammenarbeiten"], "pos": "Verb", "zh": "合作", "example_de": "Wir müssen auch mit anderen Ländern zusammenarbeiten, die nicht in der EU sind.", "example_zh": ""}], "grammar_points": [{"title": "deshalb / deswegen + V2", "summary": "deshalb 和 deswegen 意思相同（因此），放句首时动词紧跟第二位。", "example_de": "Deswegen gibt es Streit.", "example_zh": "因此存在争执。"}, {"title": "代副词 dafür / darüber", "summary": "dafür（为此）、darüber（关于此事）代替前面提到的事，避免重复名词。", "example_de": "Wir müssen dafür noch viel mehr tun.", "example_zh": "为此我们必须做得更多。"}], "background": "北极地区围绕北冰洋，蕴藏石油、天然气和矿产；随着气候变暖、航道开通，战略价值不断上升，俄罗斯和美国都在扩大在北极的存在。此次关于北极的会谈在芬兰举行，欧盟多国参加，德国联邦总理默茨（Friedrich Merz）出席，议题是如何保护北极、维护欧盟的安全与经济利益。"}, {"title": "Tennisprofi Zverev gewinnt US Open", "title_zh": "网球选手兹维列夫赢得美网", "paras": [{"start": 320.2, "end": 357.6, "lines": [{"de": "In den USA gibt es einen wichtigen Wettbewerb im Tennis.", "zh": "在美国有一项重要的网球赛事。", "start": 320.2, "end": 330.04}, {"de": "Der Wettbewerb heißt US Open.", "zh": "这项赛事叫美网（US Open）。", "start": 330.44, "end": 332.8}, {"de": "Bei den US Open spielen Tennisspieler aus der ganzen Welt gegeneinander.", "zh": "在美网，来自世界各地的网球选手相互比赛。", "start": 332.84, "end": 338.0}, {"de": "Der Mann auf dem Foto ist der Tennisspieler Alexander Zverev aus Deutschland.", "zh": "照片上的这位男士是来自德国的网球选手亚历山大·兹维列夫。", "start": 338.52, "end": 343.88}, {"de": "Er hat die US Open jetzt gewonnen.", "zh": "他刚刚赢得了美网冠军。", "start": 344.32, "end": 346.84}, {"de": "Der Sieg bei den US Open von Zverev ist etwas ganz Besonderes.", "zh": "兹维列夫在美网的胜利非常特别。", "start": 347.64, "end": 352.0}, {"de": "Das hat vor ihm nämlich bisher nur ein deutscher Tennisspieler bei den Männern geschafft.", "zh": "因为在他之前，至今只有一位德国男选手做到过这一点。", "start": 352.16, "end": 357.6}]}], "vocab": [{"lemma": "der Wettbewerb, -e", "key": "wettbewerb", "forms": ["Wettbewerb"], "pos": "Substantiv", "zh": "比赛、竞赛", "example_de": "In den USA gibt es einen wichtigen Wettbewerb im Tennis.", "example_zh": ""}, {"lemma": "der Tennisspieler, -", "key": "tennisspieler", "forms": ["Tennisspieler"], "pos": "Substantiv", "zh": "网球选手", "example_de": "Bei den US Open spielen Tennisspieler aus der ganzen Welt gegeneinander.", "example_zh": ""}, {"lemma": "der Sieg, -e", "key": "sieg", "forms": ["Sieg"], "pos": "Substantiv", "zh" ", "key": "sonne", "forms": ["Sonne"], "pos": "Substantiv", "zh": "太阳；阳光", "example_de": "Später gibt es dann viel Sonne und ein paar Wolken.", "example_zh": ""}, {"lemma": "das Grad, -e", "key": "grad", "forms": ["Grad"], "pos": "Substantiv", "zh": "度（温度单位）", "example_de": "Es werden 20 bis 30 Grad.", "example_zh": ""}], "grammar_points": [{"title": "Es werden ... Grad", "summary": "播气温用固定句式 es werden + 数字 + Grad，动词用复数 werden。", "example_de": "Es werden 20 bis 30 Grad.", "example_zh": "气温在20到30度。"}], "background": ""}], "gloss": {"kommunalwahl": {"word": "die Kommunalwahl, -en", "zh": "地方选举", "pos": "Substantiv", "example": "In dem Bundesland Niedersachsen gab es am Sonntag Kommunalwahlen.", "source": "editorial"}, "gemeinde": {"word": "die Gemeinde, -n", "zh": "乡镇、市镇", "pos": "Substantiv", "example": "Die Kommunalwahlen sind nur für die Städte und Gemeinden in einem Bundesland.", "source": "editorial"}, "buergermeister": {"word": "der Bürgermeister, -", "zh": "市长", "pos": "Substantiv", "example": "Sie wählen z.B. neue Bürgermeister.", "source": "editorial"}, "stimme": {"word": "die Stimme, -n", "zh": "选票；声音", "pos": "Substantiv", "example": "Die CDU hatte nämlich die meisten Stimmen.", "source": "editorial"}, "gewinnen": {"word": "gewinnen", "zh": "赢得、获胜", "pos": "Verb", "example": "Bei den Kommunalwahlen in Niedersachsen hat jetzt die Partei CDU gewonnen.", "source": "editorial"}, "naemlich": {"word": "nämlich", "zh": "因为、也就是（解释前一句的原因）", "pos": "Adverb", "example": "Die CDU hatte nämlich die meisten Stimmen.", "source": "editorial"}, "partei": {"word": "die Partei, -en", "zh": "政党", "pos": "Substantiv", "example": "Bei den Kommunalwahlen in Niedersachsen hat jetzt die Partei CDU gewonnen.", "source": "editorial"}, "bildung": {"word": "die Bildung", "zh": "教育", "pos": "Substantiv", "example": "Für Deutschland gibt es einen neuen Bericht zu dem Thema Bildung.", "source": "editorial"}, "kindergarten": {"word": "der Kindergarten, ¨-", "zh": "幼儿园", "pos": "Substantiv"
