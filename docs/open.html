  if (match) {
    location.replace((match.slug || match.date) + '.html');
    return;
  }
  const yt = youtubeId(url);
  if (yt) {
    show({kind:'youtube',title:'视频可以播放；有自己的字幕就能做成课程',copy:'公开版不会抓取公共字幕。你可以使用自己有权处理的 SRT 或 VTT，在浏览器本地创建逐句课程。',url,videoId:yt});
    return;
  }
  show({kind:'unsupported',title:'这个来源没有自动接入',copy:'如果你有权使用媒体和字幕，现在仍可在浏览器本地创建逐句课程；否则可以提交来源请求。',url});
}
function escapeAttr(value) { return String(value).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
form.addEventListener('submit', event => {
  event.preventDefault();
  const next = encodeURIComponent(field.value.trim());
  if (location.hash.slice(1) === next) openUrl(field.value);
  else location.hash = next;
});
addEventListener('hashchange', () => { const value = fromHash(); if (value) openUrl(value); });
const initial = fromHash();
if (initial) openUrl(initial);
</script>
