anden werden immer brutaler.", "example_zh": "犯罪团伙变得越来越残暴。"}], "background": "德国警方定期发布《有组织犯罪状况报告》（Lagebild Organisierte Kriminalität），统计毒品、抢劫、洗钱等领域的团伙犯罪。多布林特（Dobrindt）是现任联邦内政部长，内政部主管警察与国内安全事务。"}, {"title": "NATO: Drohne über Litauen abgeschossen", "title_zh": "北约：在立陶宛上空击落无人机", "paras": [{"start": 87.64, "end": 117.2, "lines": [{"de": "Die NATO ist das größte Bündnis für Verteidigung auf der Welt.", "zh": "北约是世界上最大的防务联盟。", "start": 87.64, "end": 99.0}, {"de": "Auf dem Foto ist das Logo von der NATO.", "zh": "照片上是北约的标志。", "start": 99.84, "end": 102.56}, {"de": "In der NATO sind Länder aus Europa und Nordamerika.", "zh": "北约的成员来自欧洲和北美洲。", "start": 103.8, "end": 107.36}, {"de": "Sie arbeiten bei der Verteidigung zusammen.", "zh": "它们在防务上合作。", "start": 108.44, "end": 111.44}, {"de": "Wenn ein Land angegriffen wird, dann müssen die anderen Länder helfen.", "zh": "如果一个国家遭到攻击，其他成员国就必须提供帮助。", "start": 112.2, "end": 117.2}]}, {"start": 117.64, "end": 152.4, "lines": [{"de": "Jetzt gab es einen Vorfall mit einer Drohne, ähnlich wie auf dem Foto.", "zh": "现在发生了一起涉及无人机的事件，和照片上的类似。", "start": 117.64, "end": 122.64}, {"de": "Eine Drohne ist ein Flugzeug ohne Pilot.", "zh": "无人机是一种没有飞行员的飞机。", "start": 123.28, "end": 126.08}, {"de": "So eine Drohne ist unerlaubt über das Land Litauen geflogen.", "zh": "这样一架无人机未经许可飞入了立陶宛这个国家。", "start": 127.24, "end": 131.44}, {"de": "Litauen liegt im Osten von Europa und ist auch Mitglied der NATO.", "zh": "立陶宛位于欧洲东部，也是北约成员国。", "start": 132.36, "end": 136.92}, {"de": "NATO-Kampfjets haben die Drohne abgeschossen.", "zh": "北约的战斗机击落了这架无人机。", "start": 138.08, "end": 141.24}, {"de": "Seit dem Krieg von Russland gegen die Ukraine kommen immer wieder Drohnen unerlaubt über NATO-Länder.", "zh": "自俄罗斯对乌克兰开战以来，无人机一再未经许可飞越北约国家。", "start": 142.24, "end": 149.32}, {"de": "Viele Menschen machen sich deshalb Sorgen.", "zh": "因此许多人感到担忧。", "start": 149.48, "end": 152.4}]}], "vocab": [{"lemma": "die NATO", "key": "nato", "forms": ["NATO"], "pos": "Substantiv", "zh": "北约（北大西洋公约组织）", "example_de": "Die NATO ist das größte Bündnis für Verteidigung auf der Welt.", "example_zh": ""}, {"lemma": "das Bündnis, -se", "key": "buendnis", "forms": ["Bündnis"], "pos": "Substantiv", "zh": "联盟", "example_de": "Die NATO ist das größte Bündnis für Verteidigung auf der Welt.", "example_zh": ""}, {"lemma": "die Drohne, -n", "key": "drohne", "forms": ["Drohne"], "pos": "Substantiv", "zh": "无人机", "example_de": "Jetzt gab es einen Vorfall mit einer Drohne, ähnlich wie auf dem Foto.", "example_zh": ""}, {"lemma": "der Vorfall, Vorfälle", "key": "vorfall", "forms": ["Vorfall"], "pos": "Substantiv", "zh": "事件；突发情况", "example_de": "Jetzt gab es einen Vorfall mit einer Drohne, ähnlich wie auf dem Foto.", "example_zh": ""}, {"lemma": "abschießen", "key": "abschiessen", "forms": ["abgeschossen", "abschießen"], "pos": "Verb", "zh": "击落", "example_de": "NATO-Kampfjets haben die Drohne abgeschossen.", "example_zh": ""}, {"lemma": "unerlaubt", "key": "unerlaubt", "forms": ["unerlaubt"], "pos": "Adjektiv", "zh": "未经许可的", "example_de": "So eine Drohne ist unerlaubt über das Land Litauen geflogen.", "example_zh": ""}, {"lemma": "das Mitglied, -er", "key": "mitglied", "forms": ["Mitglied"], "pos": "Substantiv", "zh": "成员；成员国", "example_de": "Litauen liegt im Osten von Europa und ist auch Mitglied der NATO.", "example_zh": ""}], "grammar_points": [{"title": "wenn 从句 + dann 主句", "summary": "wenn 引导条件从句，动词留在句尾；主句用 dann 开头时动词紧跟其后（占第二位）。", "example_de": "Wenn ein Land angegriffen wird, dann müssen die anderen Länder helfen.", "example_zh": "如果一个国家遭到攻击，其他国家就必须提供帮助。"}, {"title": "seit + 三格时间", "summary": "seit + 名词三格表示“自……以来”，搭配现在时表示动作延续至今。", "example_de": "Seit dem Krieg von Russland gegen die Ukraine kommen immer wieder Drohnen unerlaubt über NATO-Länder.", "example_zh": "自俄罗斯对乌克兰开战以来，无人机一再未经许可飞越北约国家。"}], "background": "立陶宛与爱沙尼亚、拉脱维亚并称波罗的海三国，2004 年加入北约。俄乌战争以来，北约东翼多次报告不明无人机越境，成员国有权在本国领空将其击落。"}, {"title": "Hohe Sprit-Preise: Wie kann geholfen werden?", "title_zh": "高油价：怎样才能帮上忙？", "paras": [{"start": 154.08, "end": 187.96, "lines": [{"de": "Die Preise für Sprit, also für Benzin und Diesel, sind sehr hoch.", "zh": "燃油价格，也就是汽油和柴油的价格，非常高。", "start": 154.08, "end": 164.76}, {"de": "Experten sagen, die Spritpreise in Deutschland sind mit am höchsten in Europa.", "zh": "专家表示，德国的燃油价格属于欧洲最高之列。", "start": 165.36, "end": 171.28}, {"de": "Wenn Tanken immer teurer wird, dann haben viele Menschen immer weniger Geld.", "zh": "如果加油越来越贵，很多人的钱就越来越少。", "start": 171.76, "end": 177.16}, {"de": "Vor allem Menschen, die viel mit dem Auto fahren.", "zh": "尤其是经常开车出行的人。", "start": 177.32, "end": 180.44}, {"de": "Politiker überlegen deshalb: Was kann man tun, um den Menschen zu helfen?", "zh": "政客们因此在考虑：可以做些什么来帮助民众？", "start": 180.56, "end": 185.72}, {"de": "Dazu kommt jetzt ein Film.", "zh": "（接下来是一段影片。）", "start": 186.12, "end": 187.96}]}, {"start": 188.8, "end": 273.28, "lines": [{"de": "Viele Autofahrer haben gerade ein Problem.", "zh": "很多开车的人眼下都有一个烦恼。", "start": 188.8, "end": 191.72}, {"de": "Die Preise an den Tankstellen sind so hoch wie schon lange nicht mehr.", "zh": "加油站的价格之高，已经很久没有出现过了。", "start": 192.2, "end": 197.12}, {"de": "Das Auto volltanken, das ist sehr teuer.", "zh": "把车加满油，这非常贵。", "start": 197.24, "end": 200.04}, {"de": "Dieser Mann sagt: Das tut mir richtig weh.", "zh": "这位男士说：这真让我心疼。", "start": 202.16, "end": 205.08}, {"de": "Und diese Frau meint: Was soll ich machen, ich muss fahren.", "zh": "而这位女士说：我能怎么办呢，我必须开车。", "start": 205.96, "end": 210.12}, {"de": "Dieser Mann sagt: Ich brauche das Auto.", "zh": "这位男士说：我需要这辆车。", "start": 210.76, "end": 213.48}, {"de": "Und am Ende vom Monat bleibt von meinem Geld nicht viel übrig.", "zh": "到了月底，我的钱剩不下多少。", "start": 214.16, "end": 218.52}, {"de": "Die Preise für Benzin und Diesel werden immer teurer.", "zh": "汽油和柴油的价格越来越贵。", "start": 219.36, "end": 223.08}, {"de": "Auch wegen dem Krieg im Nahen Osten.", "zh": "也是因为近东的战争。", "start": 223.36, "end": 225.92}, {"de": "Öl für etwa Benzin kommt nämlich normalerweise per Schiff.", "zh": "汽油所用的石油通常是通过船运来的。", "start": 227.24, "end": 232.16}, {"de": "Und wichtige Verbindungen über das Meer sind im Moment wegen dem Krieg blockiert.", "zh": "而海上重要的通道此刻因为战争被封锁。", "start": 232.36, "end": 238.16}, {"de": "Die Schiffe können dort nicht fahren.", "zh": "船只无法从那里通行。", "start": 238.64, "end": 241.28}, {"de": "Die Regierung von Deutschland sagt: Wir müssen den Menschen bei den Spritpreisen helfen.", "zh": "德国政府说：我们必须在燃油价格上帮助民众。", "start": 242.0, "end": 248.48}, {"de": "Etwa Menschen mit wenig Geld könnten Zahlungen vom Staat bekommen.", "zh": "比如钱少的人可以获得国家的补助金。", "start": 248.72, "end": 253.36}, {"de": "Oder die Regierung könnte bestimmen: Der Preis für Benzin und Diesel wird gedeckelt.", "zh": "或者政府可以规定：汽油和柴油的价格设置上限。", "start": 254.76, "end": 260.96}, {"de": "Das bedeutet, der Preis darf nicht höher als ein bestimmter Betrag sein.", "zh": "这意味着，价格不许高于某个确定的金额。", "start": 261.36, "end": 266.44}, {"de": "Die Politiker überlegen jetzt: Was ist die beste Idee gegen die hohen Spritpreise?", "zh": "政客们现在在考虑：对抗高油价最好的主意是什么？", "start": 267.44, "end": 273.28}]}], "vocab": [{"lemma": "der Sprit", "key": "sprit", "forms": ["Sprit", "Spritpreisen"], "pos": "Substantiv", "zh": "燃油（口语说法）", "example_de": "Die Preise für Sprit, also für Benzin und Diesel, sind sehr hoch.", "example_zh": ""}, {"lemma": "das Benzin", "key": "benzin", "forms": ["Benzin"], "pos": "Substantiv", "zh": "汽油", "example_de": "Die Preise für Sprit, also für Benzin und Diesel, sind sehr hoch.", "example_zh": ""}, {"lemma": "die Tankstelle, -n", "key": "tankstelle", "forms": ["Tankstellen", "Tankstelle"], "pos": "Substantiv", "zh": "加油站", "example_de": "Die Preise an den Tankstellen sind so hoch wie schon lange nicht mehr.", "example_zh": ""}, {"lemma": "volltanken", "key": "volltanken", "forms": ["volltanken"], "pos": "Verb", "zh": "（把车）加满油", "example_de": "Das Auto volltanken, das ist sehr teuer.", "example_zh": ""}, {"lemma": "der Staat, -en", "key": "staat", "forms": [
