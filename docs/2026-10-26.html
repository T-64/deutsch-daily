    <script id="dd-data" type="application/json">{"page":"lesson","lesson":{"slug":"2026-10-26","date":"2026-10-26","show":"tagesschau in Einfacher Sprache","level":"A2–B1","kind":"broadcast","note":"","source_url":"https://www.tagesschau.de/tagesschau_in_einfacher_sprache/tse-1490.html","video":{"mp4":"https://tagesschau-progressive.ard-mcdn.de/video/2026/1026/TV-20261026-1737-3400.webl.h264.mp4","embed":"","page":"https://www.tagesschau.de/tagesschau_in_einfacher_sprache/video-1672918.html"},"duration":586.97,"sentences":[{"de":"Willkommen zur tagesschau in Einfacher Sprache.","zh":"欢迎收看简易语言版每日新闻。","start":10.6,"end":13.36},{"de":"Ich bin Michael Paweletz und das sind unsere Nachrichten.","zh":"我是迈克尔·帕韦莱茨，以下是我们的新闻。","start":13.4,"end":17.8},{"de":"Brasilien.","zh":"巴西。","start":19.57,"end":20.65},{"de":"Lula gewinnt Wahl zum Präsidenten.","zh":"卢拉赢得总统选举。","start":20.89,"end":23.69},{"de":"Serbien.","zh":"塞尔维亚。","start":24.41,"end":25.41},{"de":"Studentenliste gewinnt Wahl.","zh":"学生名单党赢得选举。","start":25.73,"end":27.85},{"de":"Neues Gesetz.","zh":"新法律。","start":29.05,"end":30.21},{"de":"Bauen soll billiger werden.","zh":"建造房屋将变得更便宜。","start":30.57,"end":32.45},{"de":"Unfall.","zh":"事故。","start":33.41,"end":35.33},{"de":"Kreuzfahrtschiff rammt Containerschiffe.","zh":"邮轮撞上集装箱船。","start":35.81,"end":38.61},{"de":"Und nun zur ersten Nachricht.","zh":"现在来看第一条新闻。","start":38.72,"end":40.8},{"de":"Brasilien.","zh":"巴西。","start":41.45,"end":42.45},{"de":"Lula gewinnt Wahl zum Präsidenten.","zh":"卢拉赢得总统选举。","start":42.73,"end":45.77},{"de":"Der Mann auf dem Foto heißt Lula da Silva oder einfach Lula.","zh":"照片上的这个人叫卢拉·达席尔瓦，简称卢拉。","start":46.33,"end":51.81},{"de":"Brasilien ist ein großes Land in Südamerika.","zh":"巴西是南美洲的一个大国。","start":52.53,"end":56.21},{"de":"Lula ist gerade zum 4. Mal zum Präsidenten von Brasilien gewählt worden.","zh":"卢拉刚刚第四次当选巴西总统。","start":57.09,"end":63.73},{"de":"Lula ist ein linker Politiker.","zh":"卢拉是一位左翼政治家。","start":64.13,"end":66.81},{"de":"Er ist z.B. für Sozialprogramme und für Klimaschutz.","zh":"例如，他支持社会福利项目和气候保护。","start":67.52,"end":71.76},{"de":"Die Wahl zum Präsidenten war eine Stichwahl.","zh":"这次总统选举是第二轮投票。","start":72.89,"end":76.93},{"de":"Das heißt: Es gab nur zwei Kandidaten.","zh":"也就是说：只有两位候选人。","start":76.97,"end":80.73},{"de":"Auf diesem Foto ist der Kandidat, der verloren hat.","zh":"这张照片上是落选的候选人。","start":81.41,"end":85.85},{"de":"Flavio Bolsonaro.","zh":"弗拉维奥·博索纳罗。","start":86.09,"end":88.01},{"de":"Bolsonaro ist ein rechter Politiker.","zh":"博索纳罗是一位右翼政治家。","start":88.77,"end":92.01},{"de":"Sein Vater war auch schon mal Präsident.","zh":"他的父亲也曾当过总统。","start":92.49,"end":95.49},{"de":"Vor der Stichwahl lag Bolsonaro vor Lula.","zh":"在第二轮投票前，博索纳罗领先于卢拉。","start":96.17,"end":100.69},{"de":"Das Wahlergebnis ist eine Überraschung.","zh":"这个选举结果出人意料。","start":100.73,"end":105.13},{"de":"Dazu zeigen wir einen Film.","zh":"为此我们播放一段影片。","start":105.77,"end":107.69},{"de":"Diese Menschen haben Lula gewählt.","zh":"这些人把票投给了卢拉。","start":108.53,"end":111.09},{"de":"Sie sind erleichtert und feiern ihren Sieg auf den Straßen.","zh":"他们松了一口气，在街头庆祝胜利。","start":111.41,"end":115.81},{"de":"Auch viele junge Menschen haben Lula gewählt.","zh":"许多年轻人也把票投给了卢拉。","start":115.85,"end":119.13},{"de":"Und sie haben im Internet Werbung für ihn gemacht.","zh":"他们还在互联网上为他做宣传。","start":119.17,"end":122.69},{"de":"Diese junge Frau sagt:","zh":"这位年轻女子说：","start":123.29,"end":124.85},{"de":"Viele Menschen in Brasilien wollen eine linke Politik.","zh":"巴西的许多人想要左翼政策。","start":125.37,"end":129.17},{"de":"Hier sieht man Lula und sein Team nach dem Wahlsieg.","zh":"这是卢拉和他的团队在胜选后的画面。","start":129.65,"end":133.53},{"de":"Lula sagt: Ich danke den jungen Menschen in Brasilien.","zh":"卢拉说：我感谢巴西的年轻人。","start":134.17,"end":138.21},{"de":"Sie haben sich eingebracht und sie haben die Demokratie verteidigt.","zh":"他们积极参与，并且捍卫了民主。","start":138.97,"end":143.69},{"de":"Diese Menschen haben Bolsonaro gewählt.","zh":"这些人把票投给了博索纳罗。","start":144.29,"end":146.89},{"de":"Sie sind enttäuscht und sagen: Die Wahl war nicht fair.","zh":"他们很失望，并说：这次选举不公平。","start":146.93,"end":151.49},{"de":"Einige Wahllokale waren nämlich länger offen als andere.","zh":"因为有些投票站开放的时间比其他投票站长。","start":152.37,"end":156.49},{"de":"Das ist Bolsonaro.","zh":"这是博索纳罗。","start":157.29,"end":159.53},{"de":"Er sagt: Ich akzeptiere das Ergebnis der Wahl nicht.","zh":"他说：我不接受选举结果。","start":160.21,"end":164.05},{"de":"Ich werde vor Gericht klagen.","zh":"我将向法院提起诉讼。","start":164.37,"end":166.45},{"de":"Die Wahl soll wiederholt werden.","zh":"选举应该重新举行。","start":166.73,"end":169.01},{"de":"Ein Gericht muss nun darüber entscheiden.","zh":"现在必须由一家法院来决定。","start":169.41,"end":172.49},{"de":"Für Lula wird es nicht leicht.","zh":"对卢拉来说，这不会容易。","start":173.05,"end":175.53},{"de":"Er muss nämlich zusammen mit dem Parlament regieren.","zh":"因为他必须与议会共同执政。","start":175.93,"end":179.01},{"de":"Im Parlament sind viele rechte Politiker.","zh":"议会中有许多右翼政治家。","start":179.05,"end":182.97},{"de":"Lula hofft, die jungen Menschen machen weiter Druck.","zh":"卢拉希望年轻人能继续施加压力。","start":183.8,"end":187.12},{"de":"Und nun zur nächsten Nachricht über eine Wahl in Europa.","zh":"现在来看下一条关于欧洲一场选举的新闻。","start":187.97,"end":192.65},{"de":"Serbien.","zh":"塞尔维亚。","start":193.25,"end":194.25},{"de":"Studentenliste gewinnt Wahl.","zh":"学生名单党赢得选举。","start":194.57,"end":196.57},{"de":"Serbien ist ein kleines Land, unten rechts im Südosten von Europa.","zh":"塞尔维亚是一个小国，位于欧洲东南部的右下方。","start":196.93,"end":202.69},{"de":"Die Menschen in Serbien haben ein neues Parlament gewählt.","zh":"塞尔维亚人民选举了新议会。","start":203.45,"end":208.49},{"de":"Die Studentenliste hat die Wahl gewonnen.","zh":"学生名单党赢得了选举。","start":208.73,"end":212.45},{"de":"Die Studentenliste gibt es seit zwei Jahren.","zh":"学生名单党成立两年了。","start":213.17,"end":216.97},{"de":"Damals ist nämlich ein Dach an einem Bahnhof in Serbien eingestürzt.","zh":"因为当时塞尔维亚一座火车站的屋顶坍塌了。","start":217.12,"end":221.96},{"de":"Viele Menschen sind gestorben.","zh":"许多人死亡。","start":223.09,"end":225.25},{"de":"Die Studenten haben deshalb gegen die Regierung protestiert.","zh":"学生们因此抗议政府。","start":225.53,"end":229.81},{"de":"Sie haben gesagt: Die Regierung ist schlecht.","zh":"他们说：政府很糟糕。","start":229.85,"end":233.97},{"de":"Sie kümmert sich nicht um die Menschen.","zh":"它不关心人民。","start":234.25,"end":236.97},{"de":"Viele andere Menschen haben dann auch protestiert.","zh":"后来许多其他人也进行了抗议。","start":237.33,"end":240.89},{"de":"So ist die Studentenliste entstanden.","zh":"学生名单就是这样产生的。","start":241.25,"end":244.29},{"de":"Bei der Liste machen auch Lehrer, Professoren, Ärzte und Schauspieler mit.","zh":"这个名单里也有教师、教授、医生和演员参加。","start":245.09,"end":250.89},{"de":"Dazu kommt jetzt ein Film.","zh":"现在来看一段影片。","start":250.97,"end":252.89},{"de":"Feuerwerk über Belgrad, der Hauptstadt von Serbien.","zh":"塞尔维亚首都贝尔格莱德上空的烟花。","start":254.57,"end":258.41},{"de":"Tausende Menschen feiern den Sieg der Studentenliste bei der Parlamentswahl.","zh":"数千人庆祝学生名单在议会选举中获胜。","start":259.17,"end":264.69},{"de":"Diese junge Frau sagt: Es ist unglaublich.","zh":"这位年轻女子说：真是难以置信。","start":265.49,"end":269.05},{"de":"Wir haben es geschafft.","zh":"我们成功了。","start":269.33,"end":270.97},{"de":"Jetzt wird alles gut.","zh":"现在一切都会好起来。","start":271.61,"end":273.13},{"de":"Serbien ist frei.","zh":"塞尔维亚自由了。","start":273.65,"end":274.85},{"de":"Dieser Mann sagt: Es ist wie in einem Traum.","zh":"这位男子说：就像做梦一样。","start":275.93,"end":279.17},{"de":"Aber es ist wirklich passiert.","zh":"但这是真的发生了。","start":279.69,"end":281.57},{"de":"Wir haben die Wahl gewonnen.","zh":"我们赢得了选举。","start":281.61,"end":283.25},{"de":"Und diese Frau sagt: Ich bin sehr glücklich.","zh":"这位女子说：我非常幸福。","start":284.45,"end":289.13},{"de":"Ich habe so gehofft, dass es klappt.","zh":"我一直希望这件事能成功。","start":289.61,"end":292.17},{"de":"Jubel auch auf der Wahlparty der Studentenliste.","zh":"学生名单的选举庆祝会上也一片欢腾。","start":293.2,"end":296.32},{"de":"Dieser Mann sagt: Wir waren mutig und wir haben gewonnen.","zh":"这位男子说：我们很勇敢，我们赢了。","start":296.85,"end":301.45},{"de":"Ich danke euch allen.","zh":"我感谢大家。","start":301.49,"end":303.69},{"de":"Ihr habt gezeigt, die Zukunft von Serbien gehört nicht nur einigen wenigen Menschen.","zh":"你们证明了，塞尔维亚的未来不只属于少数人。","start":303.93,"end":311.85},{"de":"Die Zukunft gehört allen Menschen in Serbien.","zh":"未来属于塞尔维亚的所有人。","start":312.25,"end":315.77},{"de":"Das ist Alexander Vucic.","zh":"这是亚历山大·武契奇。","start":316.69,"end":320.05},{"de":"Er ist seit vielen Jahren Präsident in Serbien.","zh":"他多年担任塞尔维亚总统。","start":320.69,"end":324.53},{"de":"Vucic hat die Wahl verloren.","zh":"武契奇输掉了选举。","start":325.09,"end":327.65},{"de":"Er gibt seine Niederlage zu.","zh":"他承认了自己的失败。","start":328.09,"end":330.21},{"de":"Vucic sagt: Es ist ganz klar, wir haben die Wahl verloren.","zh":"武契奇说：很清楚，我们输掉了选举。","start":330.85,"end":335.97},{"de":"Die Studentenliste hat die Wahl gewonnen.","zh":"学生名单赢得了选举。","start":336.17,"end":339.77},{"de":"Die Studentenliste muss jetzt eine Regierung bilden.","zh":"学生名单现在必须组建政府。","start":339.81,"end":344.41},{"de":"Das wird eine Herausforderung.","zh":"这将是一个挑战。","start":344.93,"end":347.09},{"de":"Die Menschen auf der Liste sind nämlich bisher Ärzte oder Lehrer und keine Berufspolitiker.","zh":"因为名单上的人此前是医生或教师，不是职业政治家。","start":347.29,"end":354.85},{"de":"Und nun zur nächsten Nachricht.","zh":"现在来看下一条新闻。","start":355.37,"end":358.01},{"de":"Neues Gesetz.","zh":"新法律。","start":358.41,"end":359.41},{"de":"Bauen soll billiger werden.","zh":"建造房屋应该变得更便宜。","start":359.77,"end":362.01},{"de":"In Deutschland fehlen Wohnungen.","zh":"德国缺少住房。","start":362.45,"end":364.45},{"de":"Viele Menschen suchen eine neue Wohnung, finden aber keine.","zh":"许多人寻找新住房，却找不到。","start":364.49,"end":369.69},{"de":"Und wenn die Menschen eine neue Wohnung finden, dann ist sie oft sehr teuer.","zh":"而当人们找到新住房时，它往往非常昂贵。","start":370.21,"end":376.33},{"de":"Die Bundesregierung will, dass mehr neue Wohnungen und Häuser gebaut werden.","zh":"联邦政府希望建造更多新的住宅和房屋。","start":377.09,"end":382.65},{"de":"Das Ministerium für Bauen schlägt dafür ein neues Gesetz vor.","zh":"建设部为此提出了一部新法律。","start":383.49,"end":388.65},{"de":"Es soll Bauen einfacher und billiger machen.","zh":"它应该让建造变得更简单、更便宜。","start":389.41,"end":392.69},{"de":"In dem Gesetz steht z.B.:","zh":"法律规定例如：","start":393.41,"end":396.41},{"de":"Die Wohnungen brauchen weniger Steckdosen.","zh":"住宅需要更少的插座。","start":396.69,"end":399.89},{"de":"Die Wände zwischen zwei Wohnungen dürfen dünner sein.","zh":"两套住宅之间的墙可以更薄。","start":400.37,"end":404.33},{"de":"Oder das Treppenhaus braucht keine Heizung.","zh":"或者楼梯间不需要供暖。","start":404.64,"end":408.08},{"de":"Die Bundesregierung hofft, wenn Bauen einfacher und billiger wird, dann werden mehr neue Wohnungen und Häuser gebaut.","zh":"联邦政府希望，如果建造变得更简单、更便宜，那么就会建造更多新的住宅和房屋。","start":409.05,"end":418.65},{"de":"Dazu zeigen wir einen Film.","zh":"为此我们播放一段影片。","start":419.01,"end":421.41},{"de":"Dieses Haus in München ist einfacher gebaut als andere Häuser.","zh":"慕尼黑的这栋房子比其他房子建得更简单。","start":422.49,"end":427.33},{"de":"Der Architekt sagt: Wir haben z.B. bei der Heizung gespart.","zh":"建筑师说：例如我们在供暖上省了钱。","start":427.73,"end":432.33},{"de":"Die Heizkörper sind kleiner.","zh":"暖气片更小。","start":432.73,"end":434.73},{"de":"Das merkt man aber gar nicht.","zh":"但人们完全感觉不到。","start":435.17,"end":437.01},{"de":"Die Wohnungen werden trotzdem warm genug.","zh":"住宅仍然足够暖和。","start":437.05,"end":440.13},{"de":"Das Haus in München ist ein Gebäudetyp E.","zh":"慕尼黑的这栋房子是E型建筑。","start":442.77,"end":446.97},{"de":"E steht für einfach.","zh":"E代表简单。","start":447.01,"end":448.25},{"de":"Die Bundesregierung möchte:","zh":"联邦政府希望：","start":449.29,"end":451.61},{"de":"In Zukunft sollen viele Häuser so gebaut werden.","zh":"将来许多房子都这样建造。","start":451.65,"end":455.41},{"de":"Das soll die Baukosten senken und Wohnen billiger machen.","zh":"这应该降低建造成本，让住房更便宜。","start":455.65,"end":460.05},{"de":"Die Käufer können aber entscheiden:","zh":"但买家可以决定：","start":460.09,"end":462.85},{"de":"Wollen sie den Gebäudetyp E oder nicht.","zh":"他们是否想要E型建筑。","start":462.89,"end":466.05},{"de":"Diese Frau arbeitet in der Bauwirtschaft.","zh":"这位女士在建筑行业工作。","start":466.81,"end":469.37},{"de":"Sie sagt: Der Gebäudetyp E ist gut, er sollte zur Regel werden.","zh":"她说：E型建筑很好，应该成为标准。","start":469.41,"end":474.37},{"de":"Die Käufer sollen nicht denken, wenn sie Gebäudetyp E wählen, dann sind die Wohnungen schlechter.","zh":"买家不应该认为，选择E型建筑住宅就更差。","start":474.61,"end":480.64},{"de":"Es wird aber noch dauern, bis es viele Gebäude wie dieses Haus in München gibt.","zh":"但要像慕尼黑这栋房子一样多的建筑出现，还需要时间。","start":480.8,"end":486.36},{"de":"Und nun zur nächsten Nachricht.","zh":"现在来看下一条新闻。","start":487.05,"end":489.57},{"de":"Unfall.","zh":"事故。","start":489.77,"end":490.77},{"de":"Kreuzfahrtschiff rammt Containerschiffe.","zh":"邮轮撞上集装箱船。","start":491.49,"end":494.29},{"de":"Bremerhaven ist eine Stadt in Norddeutschland.","zh":"不来梅哈芬是德国北部的一座城市。","start":494.81,"end":498.01},{"de":"Bremerhaven liegt an der Nordsee.","zh":"不来梅哈芬位于北海边。","start":498.21,"end":500.25},{"de":"Im Hafen von Bremerhaven hat es einen Unfall gegeben.","zh":"不来梅哈芬的港口发生了一起事故。","start":501.01,"end":506.29},{"de":"Ein Kreuzfahrtschiff hat zwei Containerschiffe gerammt.","zh":"一艘邮轮撞上了两艘集装箱船。","start":506.93,"end":510.85},{"de":"Der Unfall ist passiert, als das Kreuzfahrtschiff aus dem Hafen losfahren wollte.","zh":"事故发生在邮轮想驶离港口的时候。","start":511.25,"end":517.57},{"de":"Dazu kommt ein Film.","zh":"接下来请看一段影片。","start":517.85,"end":519.77},{"de":"Dieses Video von einem Passagier zeigt den Moment, als das Kreuzfahrtschiff an einem Containerschiff vorbeischrammt.","zh":"这段由一名乘客拍摄的视频显示了邮轮擦过一艘集装箱船的瞬间。","start":520.53,"end":529.21},{"de":"Starker Wind ist der Grund für den Unfall.","zh":"大风是事故的原因。","start":529.85,"end":533.45},{"de":"Alle Schiffe haben Schäden.","zh":"所有船只都受到了损坏。","start":533.81,"end":536.17},{"de":"Kein Mensch wurde verletzt.","zh":"没有人受伤。","start":536.73,"end":538.97},{"de":"Und das waren unsere Nachrichten.","zh":"以上就是我们的新闻。","start":540.17,"end":542.69},{"de":"Brasilien.","zh":"巴西。","start":543.73,"end":544.73},{"de":"Lula gewinnt Wahl zum Präsidenten.","zh":"卢拉赢得总统选举。","start":544.77,"end":547.45},{"de":"Serbien.","zh":"塞尔维亚。","start":548.21,"end":549.21},{"de":"Studentenliste gewinnt Wahl.","zh":"学生名单党赢得选举。","start":549.85,"end":551.97},{"de":"Neues Gesetz.","zh":"新法律。","start":552.93,"end":554.25},{"de":"Bauen soll billiger werden.","zh":"建房应该变得更便宜。","start":554.65,"end":556.57},{"de":"Unfall.","zh":"事故。","start":557.37,"end":558.37},{"de":"Kreuzfahrtschiff rammt Containerschiffe.","zh":"邮轮撞上集装箱船。","start":558.41,"end":561.61},{"de":"Und jetzt kommt das Wetter.","zh":"现在来看天气。","start":562.21,"end":564.97},{"de":"Im Südwesten wird es sonnig.","zh":"西南部天气晴朗。","start":566.41,"end":568.45},{"de":"Später auch im übrigen Teil des Landes Sonnenschein.","zh":"之后全国其他地区也会有阳光。","start":568.89,"end":572.53},{"de":"Im Westen etwas Regen.","zh":"西部有一些降雨。","start":572.93,"end":575.01},{"de":"Höchstwerte 11 bis 21 Grad.","zh":"最高气温11到21度。","start":575.73,"end":579.01},{"de":"Das war die tagesschau in Einfacher Sprache.","zh":"以上就是简单语言版的今日新闻。","start":580.48,"end":583.52},{"de":"Tschüss.","zh":"再见。","start":584.37,"end":585.37},{"de":"Bis zum nächsten Mal.","zh":"下次见。","start":585.45,"end":586.97}],"stories":[{"title":"Willkommen zur tagesschau in Einfacher Sprache","title_zh":"欢迎收看简单语言新闻","from":0,"to":9,"vocab":[],"grammar":[],"background":""},{"title":"Lula gewinnt Wahl zum Präsidenten","title_zh":"卢拉赢得巴西总统选举","from":10,"to":47,"vocab":[{"key":"wahl","lemma":"die Wahl, -en","pos":"noun","zh":"选举","example_de":"Lula gewinnt Wahl zum Präsidenten.","example_zh":"卢拉赢得总统选举。"},{"key":"gewinnt","lemma":"gewinnen","pos":"verb","zh":"赢得","example_de":"Lula gewinnt Wahl zum Präsidenten.","example_zh":"卢拉赢得总统选举。"},{"key":"stichwahl","lemma":"die Stichwahl, -en","pos":"noun","zh":"决选，第二轮投票","example_de":"Die Wahl zum Präsidenten war eine Stichwahl.","example_z
