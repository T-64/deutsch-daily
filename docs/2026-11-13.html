    <div id="root"></div>
    <script id="dd-data" type="application/json">{"page":"lesson","lesson":{"slug":"2026-11-13","date":"2026-11-13","show":"tagesschau in Einfacher Sprache","level":"A2–B1","kind":"broadcast","note":"","source_url":"https://www.tagesschau.de/tagesschau_in_einfacher_sprache/tse-1508.html","video":{"mp4":"https://tagesschau-progressive.ard-mcdn.de/video/2026/1113/TV-20261113-1739-3500.webl.h264.mp4","embed":"","page":"https://www.tagesschau.de/tagesschau_in_einfacher_sprache/video-1683322.html"},"duration":581.17,"sentences":[{"de":"Willkommen zur tagesschau in Einfacher Sprache.","zh":"欢迎收看简单语言版《每日新闻》。","start":8.65,"end":11.33},{"de":"Ich bin Susanne Holst und das sind unsere Nachrichten.","zh":"我是苏珊娜·霍尔斯特，以下是我们的新闻。","start":11.65,"end":15.17},{"de":"Und nun zur ersten Nachricht:","zh":"现在来看第一条新闻：","start":33.49,"end":35.81},{"de":"Der Haushalt ist der Geldplan für Deutschland.","zh":"预算是德国的资金计划。","start":40.93,"end":44.45},{"de":"Im Haushalt ist zum Beispiel Geld für Schulen, Straßen und Renten.","zh":"预算里包括用于学校、道路和养老金的钱。","start":45.17,"end":50.69},{"de":"Das Geld kommt vor allem aus Steuern von den Menschen und Firmen.","zh":"这些钱主要来自人和企业缴纳的税款。","start":51.69,"end":56.25},{"de":"Jetzt gab es ein wichtiges Treffen zum Haushalt.","zh":"现在举行了一次关于预算的重要会议。","start":56.77,"end":60.13},{"de":"Das ist auf dem Foto.","zh":"照片上就是这次会议。","start":60.29,"end":61.81},{"de":"Politiker haben bei dem Treffen entschieden, so viel Geld darf Deutschland im nächsten Jahr ausgeben.","zh":"政治家们在会议上决定，德国明年可以花多少钱。","start":62.45,"end":69.77},{"de":"Das Treffen hat sehr lange gedauert.","zh":"这次会议开了很久。","start":70.13,"end":72.93},{"de":"Es gibt nämlich Streit zwischen den Parteien CDU und SPD.","zh":"因为基民盟和社民党之间存在争执。","start":73.17,"end":77.89},{"de":"Die CDU will nämlich bestimmte Steuern senken.","zh":"基民盟想降低某些税。","start":78.57,"end":82.09},{"de":"Und sie will ärmere Familien weniger unterstützen.","zh":"还想减少对较贫困家庭的支持。","start":83.13,"end":86.65},{"de":"Das findet die SPD nicht gut.","zh":"社民党不同意这样做。","start":87.73,"end":89.81},{"de":"Dazu zeigen wir jetzt einen Film.","zh":"对此我们现在播放一段影片。","start":90.05,"end":92.41},{"de":"In Berlin ist es schon dunkel.","zh":"柏林天已经黑了。","start":94.05,"end":96.21},{"de":"Aber die Politiker verhandeln immer noch über den Haushalt.","zh":"但政治家们还在就预算进行谈判。","start":96.73,"end":100.37},{"de":"Es gibt nämlich Streit.","zh":"因为双方有争执。","start":100.73,"end":102.37},{"de":"Die CDU sagt, wir wollen die Steuern für Strom senken.","zh":"基民盟说：我们想降低电税。","start":103.01,"end":106.81},{"de":"Dann müssen die Menschen weniger bezahlen.","zh":"这样人们就能少交一些钱。","start":107.33,"end":110.25},{"de":"Und wir wollen weniger Geld im Sozialbereich ausgeben.","zh":"我们还想在社会保障领域少花一些钱。","start":110.85,"end":114.65},{"de":"Zum Beispiel für Hilfen für ärmere Familien.","zh":"比如对贫困家庭的补助。","start":115.09,"end":118.93},{"de":"Das findet die SPD nicht gut.","zh":"社民党不同意。","start":119.73,"end":122.61},{"de":"Sie sagt, Familien mit wenig Geld müssen weiter genug Hilfe vom Staat bekommen.","zh":"它说：钱少的家庭必须继续从国家得到足够的帮助。","start":122.85,"end":128.73},{"de":"Doch am Ende einigen sich die Parteien.","zh":"但最后各党派达成了一致。","start":129.49,"end":132.21},{"de":"Die Stromsteuer wird nicht gesenkt.","zh":"电税不会降低。","start":132.73,"end":135.25},{"de":"Und die Hilfen für ärmere Familien bleiben gleich.","zh":"对贫困家庭的补助保持不变。","start":135.41,"end":138.93},{"de":"Diese Frau von der SPD sagt, wir sind froh über die Entscheidung.","zh":"这位社民党的女政治家说：我们对这个决定感到高兴。","start":139.77,"end":144.77},{"de":"Ärmere Familien bekommen weiter genug Geld.","zh":"贫困家庭将继续得到足够的钱。","start":145.09,"end":148.09},{"de":"Zum Beispiel für die Miete.","zh":"比如用于房租。","start":148.33,"end":150.33},{"de":"Oder Schulsachen für Kinder.","zh":"或者孩子们的学校用品。","start":150.73,"end":152.93},{"de":"Das ist uns sehr wichtig.","zh":"这对我们非常重要。","start":153.93,"end":155.73},{"de":"Dieser Politiker von der CDU sieht das anders.","zh":"这位基民盟的政治家看法不同。","start":157.21,"end":160.61},{"de":"Er sagt, wir sind sehr enttäuscht.","zh":"他说：我们非常失望。","start":161.21,"end":163.93},{"de":"Die Steuer für Strom wird noch nicht gesenkt.","zh":"电税还没有降低。","start":164.41,"end":167.57},{"de":"Aber wir geben nicht auf.","zh":"但我们不会放弃。","start":167.81,"end":169.61},{"de":"Vielleicht können wir die Steuer später noch senken.","zh":"也许以后我们还能降低这项税。","start":170.57,"end":174.21},{"de":"Der Streit ist erst mal vorbei.","zh":"争执暂时结束了。","start":174.77,"end":176.97},{"de":"Und der Haushalt ist jetzt beschlossen.","zh":"预算现在已经通过了。","start":177.29,"end":180.01},{"de":"Deutschland darf so viel Geld ausgeben wie noch nie.","zh":"德国可以花的钱比以往任何时候都多。","start":180.17,"end":183.85},{"de":"Nun zur nächsten Nachricht.","zh":"接下来看下一条新闻。","start":185.69,"end":187.61},{"de":"Microsoft ist eine große Firma in den USA.","zh":"微软是美国的一家大公司。","start":191.81,"end":194.97},{"de":"Sie entwickelt Programme für den Computer.","zh":"它开发电脑程序。","start":195.73,"end":199.13},{"de":"Viele Menschen auf der Welt benutzen die Programme.","zh":"世界上很多人都在使用这些程序。","start":199.89,"end":202.97},{"de":"Jetzt gibt es bei Microsoft aber eine Störung.","zh":"但现在微软的程序出现了故障。","start":203.41,"end":206.29},{"de":"Zum Beispiel bei dem Programm für E-Mails.","zh":"比如电子邮件程序。","start":206.89,"end":210.09},{"de":"Es heißt Outlook.","zh":"它叫Outlook。","start":210.81,"end":212.17},{"de":"Viele Menschen auf der Welt können deshalb heute keine E-Mails lesen oder verschicken.","zh":"因此世界上很多人今天无法阅读或发送电子邮件。","start":213.01,"end":218.65},{"de":"Auch bei dem Programm Teams gibt es eine Störung.","zh":"Teams程序也出现了故障。","start":218.81,"end":222.41},{"de":"Mit dem Programm können sich die Menschen kurze Nachrichten schreiben.","zh":"人们可以用这个程序互发短消息。","start":222.81,"end":227.45},{"de":"Microsoft sagt, wir suchen nach dem Problem.","zh":"微软说：我们正在查找问题。","start":227.89,"end":230.97},{"de":"Die Programme sollen bald wieder funktionieren.","zh":"这些程序应该很快就会恢复正常。","start":231.37,"end":234.65},{"de":"Und nun zur nächsten Nachricht.","zh":"现在来看下一条新闻。","start":236.69,"end":238.89},{"de":"Künstliche Intelligenz ist eine Technik für Computer.","zh":"人工智能是一种电脑技术。","start":244.45,"end":248.17},{"de":"Das kurze Wort dafür ist KI.","zh":"简称是KI（AI）。","start":248.65,"end":250.81},{"de":"Mit KI kann ein Computer so ähnlich denken und lernen wie das Gehirn von Menschen.","zh":"有了人工智能，电脑可以像人的大脑一样思考和学习。","start":251.57,"end":258.01},{"de":"Damit KI funktioniert, braucht man Chips.","zh":"人工智能要运行，需要芯片。","start":258.45,"end":261.77},{"de":"Das sind sehr kleine Teile in einem Computer.","zh":"芯片是电脑里非常小的部件。","start":262.05,"end":265.21},{"de":"Eine bekannte Firma für diese Chips heißt Nvidia.","zh":"生产这种芯片的知名公司之一叫英伟达。","start":265.57,"end":269.29},{"de":"Sie ist in den USA.","zh":"它位于美国。","start":270.17,"end":271.53},{"de":"Jetzt hat der Chef von Nvidia, Jensen Huang, aufgehört.","zh":"现在，英伟达的老板黄仁勋辞职了。","start":272.45,"end":276.57},{"de":"Er ist auf dem Foto.","zh":"他在照片上。","start":276.65,"end":278.09},{"de":"Die USA sagen nämlich, Huang hatte eine Affäre mit einer Frau aus China.","zh":"因为美国方面说，黄仁勋与一名中国女性有婚外情。","start":278.41,"end":283.69},{"de":"Und die Frau ist ein Spion.","zh":"而这名女子是一名间谍。","start":284.33,"end":286.25},{"de":"Ein Spion arbeitet für ein anderes Land.","zh":"间谍是为另一个国家工作的人。","start":287.25,"end":290.05},{"de":"Er sammelt heimlich wichtige Informationen.","zh":"他秘密地收集重要信息。","start":290.77,"end":293.77},{"de":"Zum Beispiel über die Regierung oder das Militär von einem Land.","zh":"比如关于一个国家的政府或军队的信息。","start":294.01,"end":298.53},{"de":"Die USA sagen, vielleicht hat der Spion in den USA Informationen für China gesammelt.","zh":"美国方面说，这名间谍可能在美国为中国收集了信息。","start":298.69,"end":305.45},{"de":"Dazu zeigen wir jetzt einen Film.","zh":"对此我们现在播放一段影片。","start":305.85,"end":308.01},{"de":"Das ist Jensen Huang.","zh":"这是黄仁勋。","start":309.17,"end":310.89},{"de":"Die Bilder sind schon älter.","zh":"这些画面已经比较老了。","start":311.93,"end":314.01},{"de":"Und die Frau im rosa Kleid soll der Spion sein.","zh":"穿粉色裙子的女子据说就是那名间谍。","start":314.53,"end":318.21},{"de":"Das sagt die Polizei von den USA.","zh":"这是美国警方说的。","start":318.81,"end":321.97},{"de":"Huang hat die Firma Nvidia vor vielen Jahren gegründet.","zh":"黄仁勋在许多年前创立了英伟达公司。","start":323.05,"end":326.89},{"de":"Jetzt hat er sehr viel Macht und ist sehr reich.","zh":"现在他拥有很大的权力，也非常富有。","start":327.61,"end":330.97},{"de":"Viele Computer auf der Welt haben Chips von Nvidia.","zh":"世界上许多电脑都使用英伟达的芯片。","start":331.93,"end":335.49},{"de":"Dieser Experte sagt, Huang hat die KI besser gemacht.","zh":"这位专家说，黄仁勋让人工智能变得更好了。","start":336.93,"end":340.65},{"de":"Deshalb benutzen Firmen auf der ganzen Welt seine Chips.","zh":"因此全世界的公司都在使用他的芯片。","start":341.65,"end":345.57},{"de":"Ohne Nvidia können viele Firmen gar nicht arbeiten.","zh":"没有英伟达，很多公司根本无法工作。","start":346.45,"end":350.17},{"de":"Und deshalb hat Huang so viel Macht.","zh":"正因为如此，黄仁勋才有这么大的权力。","start":350.45,"end":353.45},{"de":"Die Regierung von den USA macht sich Sorgen.","zh":"美国政府感到担忧。","start":354.49,"end":357.57},{"de":"Hat Huang Geheimnisse von den USA an den Spion verraten?","zh":"黄仁勋是否向间谍泄露了美国的秘密？","start":358.09,"end":362.01},{"de":"Dieser Politiker sagt, wir wollen von Huang wissen, was hat er der Frau erzählt.","zh":"这位政治家说：我们想从黄仁勋那里知道，他对那名女子说了什么。","start":363.57,"end":369.93},{"de":"Und wir müssen unsere Sicherheit verbessern.","zh":"而且我们必须加强我们的安全。","start":370.37,"end":373.29},{"de":"Wir brauchen strengere Regeln für die Firmen von KI.","zh":"我们需要对人工智能公司制定更严格的规定。","start":373.33,"end":376.77},{"de":"Eine Zeitung in den USA schreibt:","zh":"美国的一家报纸写道：","start":378.65,"end":381.37},{"de":"Der Präsident von den USA, Donald Trump, wusste von Huangs Affäre mit dem Spion.","zh":"美国总统唐纳德·特朗普早就知道黄仁勋与间谍的婚外情。","start":381.41,"end":387.65},{"de":"Die Polizei hat Trump davon nämlich schon vor längerer Zeit erzählt.","zh":"因为警方在很久以前就已经把这件事告诉了特朗普。","start":388.65,"end":393.09},{"de":"Trump sagt dazu, ich habe von der Affäre gehört.","zh":"特朗普对此说：我听说过这段婚外情。","start":394.33,"end":398.17},{"de":"Aber Huang hat mir gesagt, das stimmt nicht.","zh":"但黄仁勋告诉我，这不是真的。","start":398.57,"end":401.49},{"de":"Und ich habe ihm geglaubt.","zh":"我相信了他。","start":401.85,"end":403.69},{"de":"Ich denke, Huang ist okay.","zh":"我认为黄仁勋没问题。","start":404.57,"end":406.57},{"de":"Aber was wusste Trump über Huang wirklich?","zh":"但特朗普到底对黄仁勋的事知道多少？","start":407.81,"end":410.73},{"de":"Das fragen sich jetzt viele Menschen in den USA.","zh":"现在美国很多人都在问这个问题。","start":411.05,"end":414.41},{"de":"Nun zur nächsten Nachricht.","zh":"现在来看下一条消息。","start":416.61,"end":418.53},{"de":"In Deutschland gibt es die Pressefreiheit.","zh":"德国有新闻自由。","start":422.77,"end":425.93},{"de":"Das heißt, Journalisten dürfen frei entscheiden, was sie sagen und schreiben.","zh":"也就是说，记者可以自由决定他们说什么、写什么。","start":426.09,"end":431.73},{"de":"Und der Staat darf ihnen das nicht verbieten.","zh":"国家不允许禁止他们这样做。","start":431.97,"end":434.81},{"de":"Pressefreiheit gibt es aber nicht in allen Ländern.","zh":"但并不是所有国家都有新闻自由。","start":435.25,"end":439.05},{"de":"Zum Beispiel in Ägypten.","zh":"比如埃及。","start":439.57,"end":441.29},{"de":"Dort kontrolliert der Staat die Journalisten und ihre Arbeit.","zh":"在那里，国家控制着记者和他们的工作。","start":441.49,"end":445.33},{"de":"Viele Journalisten dürfen ihre Arbeit in Ägypten nicht mehr machen.","zh":"许多记者在埃及不再被允许从事他们的工作。","start":445.45,"end":449.57},{"de":"So wie die Journalistin Lina Attalah.","zh":"比如记者莉娜·阿塔拉。","start":449.73,"end":452.37},{"de":"Sie ist auf dem Foto.","zh":"她在照片上。","start":452.45,"end":453.97},{"de":"Zu Attalah zeigen wir jetzt einen Film.","zh":"关于阿塔拉，我们现在播放一段影片。","start":454.13,"end":456.85},{"de":"Attalah ist die Chefin von der Nachrichtenseite Mada Masr in Ägypten.","zh":"阿塔拉是埃及新闻网站“Mada Masr”的负责人。","start":457.89,"end":463.45},{"de":"Mit ihren Mitarbeitern schreibt sie Nachrichten im Internet.","zh":"她和她的同事们在互联网上写新闻。","start":463.81,"end":468.01},{"de":"Aber Attalah und ihr Team dürfen gerade nicht arbeiten.","zh":"但阿塔拉和她的团队目前不被允许工作。","start":468.81,"end":472.93},{"de":"Ein Gericht hat es ihr nämlich verboten.","zh":"因为一家法院禁止了她们。","start":473.97,"end":476.77},{"de":"Das Gericht sagt, Attalah hat keine Erlaubnis, Nachrichten im Internet zu schreiben.","zh":"法院说，阿塔拉没有在互联网上写新闻的许可。","start":477.73,"end":483.25},{"de":"Und sie schreibt nicht die Wahrheit.","zh":"而且她写的不是真相。","start":483.85,"end":486.41},{"de":"Vielleicht muss sie deshalb ein Jahr ins Gefängnis.","zh":"因此她可能要坐一年牢。","start":486.85,"end":490.33},{"de":"Sie sagt, ich habe Angst vor dem Gefängnis, aber ich bin Journalistin.","zh":"她说：我害怕坐牢，但我是一名记者。","start":491.41,"end":496.69},{"de":"Keiner sollte deswegen eine Strafe bekommen und im Gefängnis sein.","zh":"任何人都不应该因此受到惩罚、被关进监狱。","start":497.17,"end":501.81},{"de":"Die Regierung von Ägypten überwacht viele Zeitungen und das Internet.","zh":"埃及政府监控着许多报纸和互联网。","start":502.57,"end":507.41},{"de":"Wenn die Regierung etwas nicht gut findet, dann dürfen die Journalisten es nicht schreiben.","zh":"如果政府觉得某件事不好，记者就不允许写这件事。","start":507.85,"end":514.13},{"de":"Und dann kommt ein Verbot von einem Gericht.","zh":"然后法院就会下达禁令。","start":514.25,"end":517.33},{"de":"Dieser Experte sagt:","zh":"这位专家说：","start":517.45,"end":518.93},{"de":"Die meisten Journalisten dürfen nicht schreiben, was sie wollen.","zh":"大多数记者都不能写他们想写的东西。","start":518.97,"end":523.13},{"de":"Mada Masr ist die letzte Nachrichtenseite, die noch frei schreiben darf.","zh":"Mada Masr是最后一家还可以自由写作的新闻网站。","start":523.21,"end":528.33},{"de":"Aber das ist jetzt auch vorbei.","zh":"但现在这也结束了。","start":528.49,"end":530.93},{"de":"Attalah und ihr Team wehren sich gegen das Gericht.","zh":"阿塔拉和她的团队正在反抗法院的判决。","start":531.89,"end":535.45},{"de":"Sie sagen, das Gericht soll seine Entscheidung ändern.","zh":"他们要求法院改变决定。","start":535.57,"end":539.37},{"de":"Wir hören nicht mit dem Schreiben auf.","zh":"我们不会停止写作。","start":539.73,"end":542.37},{"de":"Und das waren unsere Nachrichten.","zh":"以上就是我们的新闻。","start":544.45,"end":546.81},{"de":"Und jetzt kommt das Wetter.","zh":"接下来是天气预报。","start":563.53,"end":565.73},{"de":"Oben im Norden regnet es manchmal.","zh":"在最北边有时会下雨。","start":565.93,"end":568.53},{"de":"Sonst gibt es überall mal Wolken und mal Sonne.","zh":"其他地区有时多云，有时晴朗。","start":568.69,"end":571.97},{"de":"Es werden 1 bis 10 Grad.","zh":"气温是1到10度。","start":572.21,"end":574.21},{"de":"Das war die tagesschau in Einfacher Sprache.","zh":"以上就是简单语言版《每日新闻》。","start":576.41,"end":579.21},{"de":"Tschüss, bis zum nächsten Mal.","zh":"再见，下次见。","start":579.25,"end":581.17}],"stories":[{"title":"Begrüßung","title_zh":"开场问候","from":0,"to":1,"vocab":[],"grammar":[],"background":""},{"title":"Geld für Deutschland: Einigung bei Haushalt","title_zh":"德国预算：各政党达成一致","from":2,"to":39,"vocab":[{"key":"haushalt","lemma":"der Haushalt, -e","pos":"noun","zh":"预算","example_de":"Der Haushalt ist der Geldplan für Deutschland.","example_zh":"预算是德国的资金计划。"},{"key":"steuern","lemma":"die Steuer, -n","pos":"noun","zh":"税","example_de":"Das Geld kommt vor allem aus Steuern von den Menschen und Firmen.","example_zh":"这些钱主要来自人和企业缴纳的税款。"},{"key":"treffen","lemma":"das Treffen, -","pos":"noun","zh":"会面，会谈","example_de":"Jetzt gab es ein wichtiges Treffen zum Haushalt.","example_zh":"现在举行了一次关于预算的重要会议。"},{"key":"streit","lemma":"der Streit","pos":"noun","zh":"争吵，争执","example_de":"Es gibt nämlich Streit zwischen den Parteien CDU und SPD.","example_zh":"因为基民盟和社民党之间存在争执。"},{"key":"senken","lemma":"senken","pos":"verb","zh":"降低","example_de":"Die CDU will nämlich bestimmte Steuern senken.","example_zh":"基民盟想降低某些税。"}],"grammar":[{"title":"被动语态 (Passiv Präsens)","summary":"„Die Stromsteuer wird nicht gesenkt.“ 用 werden + Partizip II 构成现在时被动，表示动作发生在主语身上。","example_de":"Die Stromsteuer wird nicht gesenkt.","example_zh":"电税不会降低。"}],"background":""},{"title":"Microsoft: Störung bei Computer-Programmen","title_zh":"微软：电脑程序出现故障","from":40,"to":51,"vocab":[{"key":"störung","lemma":"die Störung, -en","pos":"noun","zh":"故障，干扰","example_de":"Jetzt gibt es bei Microsoft aber eine Störung.","example_zh":"但现在微软的程序出现了故障。"},{"key":"programm","lemma":
