ull},{"de":"Einige Flugzeuge sind deshalb zu anderen Flughäfen geflogen.","zh":"部分飞机改飞其他机场。","start":null,"end":null},{"de":"Innenminister Alexander Dobrindt: Das ist eine sehr ernste Bedrohung für die Sicherheit.","zh":"内政部长 Dobrindt 称这是对安全的严重威胁——德国之前出现过不明无人机，","start":null,"end":null},{"de":"Wir hatten schon früher unbekannte Drohnen an Flughäfen.","zh":"但携带炸药的武装无人机出现在机场，","start":null,"end":null},{"de":"Aber eine bewaffnete Drohne mit Sprengstoff auf einem Flughafen, das ist neu.","zh":"这是首次。","start":149.71,"end":151.67},{"de":"Auch Frachtflugzeuge starten und landen in Leipzig. Diese Flugzeuge bringen Waffen in die Ukraine. Vielleicht hat Russland die Drohne geschickt.","zh":"莱比锡机场也起降向乌克兰运送武器的货机。","start":153.27,"end":174.19},{"de":"Vielleicht war es aber auch jemand anderes. Wir wissen es nicht.","zh":"也许是俄罗斯派来了这架无人机，也许是其他人。","start":174.55,"end":179.15},{"de":"Die Polizei will jetzt herausfinden, wem die Drohne gehört und wer sie gesteuert hat.","zh":"警方现在要查清这架无人机属于谁、谁在操控。","start":180.63,"end":189.03},{"de":"Der Mann auf dem Foto hat vor einem Jahr einen Anschlag gemacht.","zh":"照片上的这个男人一年前制造了一起袭击事件。","start":190.15,"end":202.43},{"de":"Er ist mit einem Auto in eine Demonstration in der Stadt München gefahren.","zh":"他开车冲进了慕尼黑的一场示威游行。","start":202.47,"end":207.79},{"de":"Eine Frau und ihre Tochter sind dabei gestorben.","zh":"一名女子和她的女儿因此丧生，","start":208.07,"end":211.55},{"de":"Viele Menschen wurden verletzt.","zh":"许多人受伤。","start":211.91,"end":213.91},{"de":"Ein Gericht in München hat den Mann jetzt zu lebenslanger Haft verurteilt. Das heißt, er muss für mindestens 15 Jahre ins Gefängnis.","zh":"慕尼黑一家法院现在判处该男子终身监禁——这意味着他至少要服刑 15 年。","start":213.95,"end":225.39},{"de":"In vielen Städten wird es im Sommer sehr heiß.","zh":"许多城市夏天很热。","start":226.63,"end":236.67},{"de":"Die Menschen suchen dann Schatten.","zh":"人们寻找阴凉处。","start":236.99,"end":240.95},{"de":"Hitze ist nämlich anstrengend und für manche Menschen ist sie gefährlich — zum Beispiel für alte oder kranke Menschen.","zh":"炎热令人疲惫，对老人和病人来说特别危险。","start":241.95,"end":254.47},{"de":"Die Behörden überlegen: Was kann man tun gegen Hitze?","zh":"城市当局在考虑：怎样对抗酷热？","start":254.51,"end":261.95},{"de":"Wie wird die Stadt im Sommer kühler?","zh":"怎样让城市更凉爽？","start":261.99,"end":265.47},{"de":"Die Stadt Bochum hat eine Lösung gefunden: Bäume pflanzen.","zh":"波鸿市找到了一个方案：种树。","start":270.15,"end":272.19},{"de":"In der Allee-Straße wird ein Loch gegraben, viel Erde kommt hinein.","zh":"在马路中间挖坑、填土。","start":286.67,"end":304.19},{"de":"Wenn es regnet, fließt Wasser von der Straße ins Loch.","zh":"下雨时水从路面流进坑里，泥土储存水分，","start":304.23,"end":309.07},{"de":"Die Erde speichert das Wasser, die Bäume bekommen dadurch auch dann Wasser, wenn es nicht regnet.","zh":"即使不下雨树木也能得到水。","start":309.31,"end":346.43},{"de":"Große Bäume verdunsten Wasser über die Blätter.","zh":"大树通过叶片蒸发水分，","start":null,"end":null},{"de":"Die Luft wird so kühler.","zh":"让空气变凉。在已改造的街道上，","start":null,"end":null},{"de":"Eine schon umgebaute Straße: Unter den Gräsern ist ein tiefes Loch mit Erde.","zh":"草地下方有蓄水土坑，","start":null,"end":null},{"de":"Regenwasser fließt durch die Lücken im Bordstein hinein.","zh":"雨水通过路缘石缝隙流入。","start":null,"end":null},{"de":"Das ist gut für die Umwelt und für die Menschen.","zh":"这对环境和人都有好处。","start":346.47,"end":356.51},{"de":"Bochum will noch mehr Parks und Straßen umbauen und mehr Bäume pflanzen.","zh":"波鸿还想改造更多公园和街道，种更多树。","start":374.31,"end":390.51},{"de":"Hiroshima ist eine Stadt in Japan.","zh":"广岛是日本的一座城市。","start":392.71,"end":402.23},{"de":"In Hiroshima ist im Zweiten Weltkrieg eine Atombombe explodiert.","zh":"二战期间一颗原子弹在这里爆炸——是美国投下的。","start":402.55,"end":411.71},{"de":"Die Atombombe war von den USA.","zh":"无数人丧生，","start":412.91,"end":416.11},{"de":"Sehr viele Menschen sind gestorben und wurden schwer verletzt.","zh":"无数人受重伤。","start":416.99,"end":423.59},{"de":"Schulkinder in Hiroshima läuten die Friedensglocke.","zh":"广岛的学童敲响和平钟。","start":427.87,"end":432.07},{"de":"Tausende Menschen aus vielen Ländern sind zur Gedenkveranstaltung gekommen.","zh":"来自许多国家的数千人参加纪念仪式，","start":432.79,"end":438.47},{"de":"Sie schweigen gemeinsam für eine Minute und bringen Blumen zum Mahnmal für die Opfer.","zh":"集体默哀一分钟，向遇难者纪念碑献花。","start":438.51,"end":447.91},{"de":"Der Bürgermeister von Hiroshima sagt: Auch heute drohen einige Länder mit Atomwaffen.","zh":"广岛市长说：即使在今天，一些国家也以核武器相威胁。","start":449.47,"end":458.39},{"de":"Das ist gefährlich.","zh":"这很危险。","start":458.43,"end":460.19},{"de":"Atomwaffen machen die Welt unsicher.","zh":"核武器让世界不安全。","start":460.75,"end":464.03},{"de":"Nie wieder darf ein Land Atomwaffen einsetzen.","zh":"任何国家都不许再次使用核武器。","start":464.07,"end":468.15},{"de":"Im Norden ist es oft stark bewölkt.","zh":"北部经常云层厚重。","start":490.59,"end":497.11},{"de":"Auch ganz unten im Süden ist es wolkig.","zh":"最南端也是多云。","start":497.39,"end":500.39},{"de":"Manchmal mit Regenschauern oder Gewittern.","zh":"有时伴有阵雨或雷暴。","start":500.71,"end":505.71},{"de":"19 bis 31 Grad.","zh":"气温 19 到 31 度。","start":505.75,"end":507.67}],"stories":[{"title":"Flughafen Leipzig: Sprengstoff gefunden","title_zh":"莱比锡机场：发现炸药","from":0,"to":17,"vocab":[{"key":"drohne","lemma":"die Drohne","pos":"","zh":"无人机","example_de":"Auf dem Flughafen Leipzig im Osten von Deutschland wurde eine Drohne mit Sprengstoff gefunden.","example_zh":""},{"key":"sprengstoff","lemma":"der Sprengstoff","pos":"","zh":"炸药","example_de":"Auf dem Flughafen Leipzig im Osten von Deutschland wurde eine Drohne mit Sprengstoff gefunden.","example_zh":""},{"key":"explodieren","lemma":"explodieren","pos":"Verb","zh":"爆炸","example_de":"Sprengstoff kann explodieren.","example_zh":""},{"key":"entschärfen","lemma":"entschärfen","pos":"Verb","zh":"拆除（炸弹）","example_de":"Die Polizei hat den Sprengstoff entschärft","example_zh":""},{"key":"bedrohung","lemma":"die Bedrohung","pos":"","zh":"威胁","example_de":"Innenminister Alexander Dobrindt: Das ist eine sehr ernste Bedrohung für die Sicherheit.","example_zh":""},{"ke
