const esc = s => String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

const dateOf = (date, options) => new Date(date+'T12:00:00').toLocaleDateString('de-DE', options);
if (latest) {
 document.getElementById('latest').innerHTML = `<div class="latest-meta"><b>最新一期</b><time datetime="${esc(latest.date)}">${dateOf(latest.date,{day:'numeric',month:'long',year:'numeric'})}</time></div><h2 id="latest-title" lang="de">Nachrichten in einfacher Sprache</h2><p>从今天的新闻开始，读一小段真实德语。</p><div class="latest-actions"><a class="primary" href="${esc(latest.slug)}.html">开始阅读 <span aria-hidden="true" style="color:inherit">→</span></a><span>德中对照 · 词汇 · 语法</span></div>`;
} else { document.getElementById('latest').innerHTML='<h2 id="latest-title">第一篇阅读正在准备中</h2>'; }
try {
 const recent = JSON.parse(localStorage.getItem('dd-recent-lesson') || 'null');
 if (recent?.slug && ITEMS.some(item=>item.slug===recent.slug)) {
  document.getElementById('continue-link').href=recent.slug+'.html';
  document.getElementById('continue-title').textContent=recent.title || recent.date;
  document.getElementById('continue').hidden=false;
 }
} catch {}
let visibleCount=3;
function showLessons() {
 const query=document.getElementById('search').value.trim().toLocaleLowerCase('de');
 const matches=ITEMS.filter(it=>[it.date,dateOf(it.date),it.titles,it.titles_zh].join(' ').toLocaleLowerCase('de').includes(query));
 const archive=query ? matches : ITEMS.slice(1);
 const items=query ? archive : archive.slice(0,visibleCount);
 document.getElementById('lessons').innerHTML=items.map(it=>{
  const titles=it.news_titles || [it.titles];
  const translations=it.news_titles_zh || [it.titles_zh];
  const hit=query ? titles.findIndex((title,i)=>[title,translations[i]].join(' ').toLocaleLowerCase('de').includes(query)) : 0;
  const index=hit<0 ? 0 : hit;
  return `<a class="lesson" href="${esc(it.slug)}.html" title="${esc(it.titles)}"><time datetime="${esc(it.date)}">${dateOf(it.date)}</time><div class="text"><h4 lang="de">${esc(titles[index])}</h4><p>${esc(translations[index] || '简易德语新闻')}</p></div><span class="arrow" aria-hidden="true">›</span></a>`;
 }).join('');
 document.getElementById('empty').hidden=items.length>0;
 document.getElementById('more').hidden=Boolean(query) || items.length>=archive.length;
 document.getElementById('result-count').textContent=query ? `找到 ${items.length} 期阅读` : `显示 ${items.length} 期往期阅读`;
}
