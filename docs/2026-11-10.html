    <script id="dd-data" type="application/json">{"page":"lesson","lesson":{"slug":"2026-11-10","date":"2026-11-10","show":"tagesschau in Einfacher Sprache","level":"A2–B1","kind":"broadcast","note":"","source_url":"https://www.tagesschau.de/tagesschau_in_einfacher_sprache/tse-1510.html","video":{"mp4":"https://tagesschau-progressive.ard-mcdn.de/video/2026/1110/TV-20261110-1738-3200.webl.h264.mp4","embed":"","page":"https://www.tagesschau.de/tagesschau_in_einfacher_sprache/video-1681514.html"},"duration":379.96,"sentences":[{"de":"Willkommen zur tagesschau in Einfacher Sprache.","zh":"欢迎收看简易德语新闻tagesschau。","start":9.05,"end":11.97},{"de":"Ich bin Susanne Holst und das sind unsere Nachrichten:","zh":"我是Susanne Holst，以下是我们的新闻：","start":12.05,"end":15.29},{"de":"Und nun zur ersten Nachricht.","zh":"现在来看第一条新闻。","start":30.85,"end":32.93},{"de":"In der Ukraine ist schon lange Krieg.","zh":"乌克兰的战争已经持续很久了。","start":37.96,"end":40.6},{"de":"Das Nachbarland Russland greift immer wieder z.B. mit Raketen an.","zh":"邻国俄罗斯不断发动攻击，比如用导弹。","start":40.88,"end":45.92},{"de":"Viele Menschen sind in dem Krieg schon gestorben.","zh":"很多人已经在这场战争中死去。","start":46.13,"end":48.97},{"de":"Viele Häuser wurden zerstört, so wie auf dem Foto.","zh":"很多房屋被毁坏了，就像照片上的一样。","start":49.17,"end":52.69},{"de":"Es hat früher schon Versuche gegeben, den Krieg zu beenden.","zh":"以前已经有过结束战争的尝试。","start":53.08,"end":57.24},{"de":"Dazu wurden Gespräche geführt.","zh":"为此进行过会谈。","start":57.68,"end":59.84},{"de":"Jetzt gibt es wieder neue Gespräche über einen Frieden zwischen Russland und der Ukraine.","zh":"现在俄罗斯和乌克兰之间又有了关于和平的新会谈。","start":60.33,"end":66.05},{"de":"Die USA sind auch dabei und wollen bei einer Lösung für Frieden helfen.","zh":"美国也参与其中，想为和平解决方案提供帮助。","start":66.97,"end":72.56},{"de":"Obwohl es die Gespräche für Frieden gibt, geht der Krieg weiter.","zh":"尽管有这些和平会谈，战争仍在继续。","start":73.73,"end":78.25},{"de":"Wie das für Kinder in einem Kindergarten in der Ukraine ist, zeigen wir in einem Film.","zh":"乌克兰一家幼儿园里的孩子们情况如何，我们在一部影片中展示。","start":79.12,"end":85.12},{"de":"Sie spielen, sie malen und sie essen zusammen.","zh":"他们玩耍、画画，一起吃饭。","start":86.68,"end":90.92},{"de":"Machen das, was Kinder im Kindergarten so machen.","zh":"做孩子们在幼儿园里通常会做的事情。","start":90.96,"end":94.88},{"de":"Doch etwas ist hier im Kindergarten in der Stadt Sumi in der Ukraine anders.","zh":"但在乌克兰苏梅市的这家幼儿园里，有些事情不一样。","start":95.52,"end":100.48},{"de":"Die Kinder machen das alles im Keller.","zh":"孩子们所有这些活动都在地下室里进行。","start":101.16,"end":103.68},{"de":"Oben im Haupthaus vom Kindergarten ist das nämlich zu gefährlich.","zh":"因为在幼儿园的主楼上层太危险了。","start":103.72,"end":108.56},{"de":"In Sumi schlagen oft Raketen aus Russland ein.","zh":"苏梅经常有来自俄罗斯的导弹落下。","start":108.8,"end":112.2},{"de":"Die Fenster vom Kindergarten sind bei einem Angriff kaputtgegangen.","zh":"幼儿园的窗户在一次袭击中被打碎了。","start":112.56,"end":116.64},{"de":"Die Kindergärtnerin sagt:","zh":"幼儿园老师说：","start":117.37,"end":118.97},{"de":"Vor dem Krieg haben die Kinder normale Spiele gespielt, z.B. Familie.","zh":"战争前孩子们玩普通的游戏，比如过家家。","start":119.13,"end":124.29},{"de":"Jetzt spielen sie oft Krieg mit Soldaten und kämpfen.","zh":"现在他们经常玩带士兵打仗的游戏。","start":124.73,"end":128.45},{"de":"Am Mittag werden die Kinder abgeholt.","zh":"中午孩子们被接走。","start":129.89,"end":132.53},{"de":"Diese Mutter sagt: Mein Sohn kennt nur das Leben im Krieg.","zh":"这位母亲说：我儿子只知道战争中的生活。","start":132.77,"end":136.85},{"de":"Er hat Angst vor lauten Geräuschen.","zh":"他害怕大的声响。","start":137.16,"end":139.68},{"de":"Die Kindergartenkinder von Sumi wünschen sich, dass sie öfter draußen spielen können.","zh":"苏梅的幼儿园孩子们希望能更多地到外面玩耍。","start":141.72,"end":147.32},{"de":"Und vor allem ein Leben ohne Angst.","zh":"尤其希望过一种没有恐惧的生活。","start":147.37,"end":150.17},{"de":"Und nun zur nächsten Nachricht.","zh":"现在来看下一条新闻。","start":152.37,"end":154.57},{"de":"Auf dem Foto ist Gina H. Sie versteckt ihr Gesicht.","zh":"照片上是Gina H.。她遮住了自己的脸。","start":158.64,"end":163.04},{"de":"Sie möchte nämlich nicht, dass man sie erkennt.","zh":"因为她不想让人认出她。","start":163.28,"end":166.56},{"de":"Gina H. ist jetzt von einem Gericht verurteilt worden, wegen Mordes.","zh":"Gina H.现在被法院判刑了，罪名是谋杀。","start":166.64,"end":171.76},{"de":"Sie soll für lange Zeit ins Gefängnis.","zh":"她将长期入狱。","start":172.44,"end":175.08},{"de":"Dazu kommt ein kurzer Film.","zh":"接下来是一段短片。","start":175.52,"end":177.44},{"de":"Die Richter sagen, Gina H.","zh":"法官们说，Gina H.","start":178.28,"end":180.6},{"de":"hat vor einem Jahr den acht Jahre alten Fabian ermordet.","zh":"在一年前谋杀了八岁的Fabian。","start":180.64,"end":184.96},{"de":"Bei Güstrow.","zh":"地点在居斯特罗附近。","start":185.6,"end":186.6},{"de":"Das ist ein kleiner Ort im Norden von Deutschland.","zh":"那是德国北部的一个小地方。","start":186.96,"end":189.8},{"de":"Die Richter finden, es gibt genug Beweise, dass Gina H. das gemacht hat.","zh":"法官认为，有足够的证据证明是Gina H.做的。","start":189.84,"end":195.2},{"de":"Gina H. sagt aber: Ich war das nicht.","zh":"但Gina H.说：不是我干的。","start":195.72,"end":198.4},{"de":"Sie will gegen das Urteil vorgehen.","zh":"她要对这个判决提出申诉。","start":198.97,"end":201.49},{"de":"Und nun zur nächsten Nachricht.","zh":"现在来看下一条新闻。","start":202.12,"end":204.52},{"de":"Vor fast 90 Jahren waren in Deutschland die Nationalsozialisten an der Macht.","zh":"大约90年前，国家社会主义者在德国掌权。","start":209.6,"end":215.0},{"de":"Der kurze Name ist Nazis.","zh":"简称纳粹。","start":215.36,"end":217.16},{"de":"Ihr Führer war Hitler.","zh":"他们的领袖是希特勒。","start":217.76,"end":219.32},{"de":"Die Nazis waren gegen viele Menschen, die aus ihrer Sicht anders waren.","zh":"纳粹敌视很多在他们看来不同的人。","start":220.13,"end":225.13},{"de":"Z.B. gegen Juden.","zh":"比如敌视犹太人。","start":225.4,"end":227.08},{"de":"In der Nacht vom 9. auf den 10. November 1938 sind die Nazis gegen Juden in Deutschland mit Gewalt vorgegangen.","zh":"在1938年11月9日到10日的夜里，纳粹对德国的犹太人实施了暴力。","start":228.13,"end":237.72},{"de":"Sie haben z.B. Synagogen, Religionshäuser der Juden, angezündet - das ist auf dem Foto.","zh":"比如他们纵火烧毁犹太教的宗教场所——犹太会堂，照片上就是这个。","start":238.24,"end":245.96},{"de":"Oder sie haben Geschäfte von Juden zerstört.","zh":"或者他们毁坏犹太人的商店。","start":246.56,"end":249.04},{"de":"Kurz danach haben die Nazis damit angefangen, Juden zu ermorden.","zh":"不久之后，纳粹开始谋杀犹太人。","start":249.08,"end":254.56},{"de":"Millionen Menschen sind gestorben.","zh":"数百万人死去了。","start":255.48,"end":257.6},{"de":"Jetzt wurde an die Gewalt der Nazis gegen Juden erinnert.","zh":"现在人们纪念了纳粹对犹太人的暴力。","start":258.72,"end":262.6},{"de":"Das ist auf diesem Foto mit Bundespräsident Steinmeier.","zh":"这张照片上是联邦总统施泰因迈尔。","start":262.64,"end":266.48},{"de":"Steinmeier hat gesagt, der Hass gegen Juden darf sich nie wiederholen.","zh":"施泰因迈尔说，对犹太人的仇恨绝不允许再次发生。","start":266.84,"end":271.4},{"de":"Die Menschen sollen sich Hass entgegenstellen.","zh":"人们应该抵制仇恨。","start":271.44,"end":274.96},{"de":"Und nun zur nächsten Nachricht.","zh":"现在来看下一条新闻。","start":277.4,"end":279.6},{"de":"Einmal einen Superstar wie Shakira auf dem Foto live erleben, das wünschen sich viele.","zh":"现场亲身感受一次像照片上的夏奇拉这样的超级巨星，很多人都有这样的愿望。","start":283.96,"end":290.84},{"de":"Doch die Tickets für solche Konzerte sind oft schnell ausverkauft.","zh":"但这类演唱会的门票常常很快售完。","start":291.08,"end":295.6},{"de":"Oder die Tickets sind sehr teuer.","zh":"或者门票非常贵。","start":295.64,"end":298.52},{"de":"Wenn nämlich Superstars Konzerte geben, dann kaufen einige Händler diese Tickets für den normalen Preis.","zh":"因为当超级巨星开演唱会时，一些商人会按正常价格买下这些门票。","start":299.36,"end":307.04},{"de":"Danach verkaufen sie die Tickets weiter.","zh":"然后他们再把门票转卖出去。","start":307.68,"end":310.48},{"de":"Aber nicht für den Preis, den sie selbst bezahlt haben.","zh":"但不是按他们自己付的价格。","start":310.52,"end":313.88},{"de":"Sie wollen dann viel mehr Geld, um ein Geschäft zu machen.","zh":"他们想索要更多的钱，以赚取利润。","start":313.92,"end":318.0},{"de":"Dagegen will die Frau auf dem Foto jetzt vorgehen.","zh":"照片上的这位女士现在想打击这种行为。","start":319.0,"end":322.32},{"de":"Sie ist Justizministerin Stefanie Hubig.","zh":"她是司法部长Stefanie Hubig。","start":322.36,"end":325.28},{"de":"Sie sagt: Wir planen einen Preisdeckel für Tickets.","zh":"她说：我们计划对门票设置价格上限。","start":325.76,"end":330.04},{"de":"Das bedeutet:","zh":"这意味着：","start":330.89,"end":331.89},{"de":"Wenn man Tickets weiterverkaufen will, dann darf man bald nur noch ein bisschen mehr verlangen, als man selber bezahlt hat.","zh":"如果想转卖门票，以后只能比自己的买价多要一点点钱。","start":332.13,"end":340.84},{"de":"Und das waren unsere Nachrichten.","zh":"以上就是我们的新闻。","start":342.41,"end":344.77},{"de":"Und jetzt kommt das Wetter.","zh":"现在来看天气。","start":359.92,"end":361.84},{"de":"Viele Wolken, ab und zu Regen.","zh":"很多云，偶尔有雨。","start":362.72,"end":365.04},{"de":"Im Norden ganz oben und im Süden ganz unten von Deutschland.","zh":"在德国最北端和最南端。","start":365.33,"end":369.53},{"de":"Meist trocken.","zh":"大部分地区干燥。","start":369.88,"end":370.88},{"de":"Es werden 3 bis 17 Grad.","zh":"气温3到17度。","start":371.0,"end":373.24},{"de":"Und das war die tagesschau in Einfacher Sprache.","zh":"以上就是简易德语新闻tagesschau。","start":374.52,"end":377.76},{"de":"Tschüss, bis zum nächsten Mal.","zh":"再见，下次见。","start":377.8,"end":379.96}],"stories":[{"title":"Begrüßung","title_zh":"欢迎","from":0,"to":2,"vocab":[],"grammar":[],"background":""},{"title":"Ukraine-Krieg: Gespräche für Frieden","title_zh":"乌克兰战争：和平会谈","from":3,"to":27,"vocab":[{"key":"krieg","lemma":"der Krieg, -e","pos":"Substantiv","zh":"战争","example_de":"In der Ukraine ist schon lange Krieg.","example_zh":"乌克兰的战争已经持续很久了。"},{"key":"zerstören","lemma":"zerstören","pos":"Verb","zh":"毁坏","example_de":"Viele Häuser wurden zerstört, so wie auf dem Foto.","example_zh":"很多房屋被毁坏了，就像照片上的一样。"},{"key":"gespräch","lemma":"das Gespräch, -e","pos":"Substantiv","zh":"会谈","example_de":"Dazu wurden Gespräche geführt.","example_zh":"为此进行过会谈。"},{"key":"frieden","lemma":"der Frieden","pos":"Substantiv","zh":"和平","example_de":"Jetzt gibt es wieder neue Gespräche über einen Frieden zwischen Russland und der Ukraine.","example_zh":"现在俄罗斯和乌克兰之间又有了关于和平的新会谈。"},{"key":"angst","lemm
