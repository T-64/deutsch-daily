Gefahr für solche Angriffe ist größer geworden, sagt die Politik.", "zh": "政界表示，此类攻击的危险性增大了，", "start": null, "end": null}, {"de": "Deshalb sollen die Nachrichtendienste mehr dagegen tun können.", "zh": "因此情报机构应该能够做更多应对工作。", "start": null, "end": null}]}, {"start": null, "end": null, "lines": [{"de": "Das ist Innenminister Alexander Dobrindt.", "zh": "这是内政部长亚历山大·多布林特。", "start": null, "end": null}, {"de": "Er ist für die Sicherheit in Deutschland zuständig und sagt: Die Nachrichtendienste müssen Gefahren besser abwehren können als bisher.", "zh": "他负责德国的安全事务，", "start": null, "end": null}, {"de": "Auch im Internet.", "zh": "表示：情报机构必须比以往更好地抵御威胁，", "start": null, "end": null}, {"de": "Die Nachrichtendienste sollen bald mehr dürfen.", "zh": "也包括在网络空间。", "start": null, "end": null}, {"de": "Nicht nur Informationen sammeln wie jetzt, sondern auch aktiv etwas gegen Gefahren tun.", "zh": "情报机构很快应该拥有更多权限——不仅像现在这样收集信息，", "start": null, "end": null}, {"de": "Z.B. Computer von Angreifern stören.", "zh": "还要主动应对威胁，比如干扰攻击者的电脑。", "start": null, "end": null}]}, {"start": null, "end": null, "lines": [{"de": "Es gibt aber auch Kritik von anderen Politikern.", "zh": "但也有来自其他政客的批评。", "start": null, "end": null}, {"de": "Konstantin von Notz von der Partei Die Grünen sagt, die Nachrichtendienste arbeiten dann wie die Polizei.", "zh": "绿党议员康斯坦丁·冯·诺茨表示，", "start": null, "end": null}, {"de": "Auch gegen Menschen.", "zh": "情报机构届时会像警察一样行事，甚至针对个人。", "start": null, "end": null}, {"de": "Aber die Arbeit von den Nachrichtendiensten kann nicht so gut kontrolliert werden wie bei der Polizei.", "zh": "但情报机构的工作无法像警察那样受到良好的监督。", "start": null, "end": null}, {"de": "Auch die Parteien AfD und Linke sind gegen die neuen Regeln.", "zh": "选择党和左翼党也反对新规，", "start": null, "end": null}, {"de": "Sie sagen, es könnte zu viel Überwachung geben.", "zh": "认为可能导致过度监控。", "start": null, "end": null}]}], "vocab": [{"lemma": "der Nachrichtendienst", "key": "nachrichtendienst", "forms": ["Nachrichtendienst"], "pos": "", ", "title_zh": "研究者：德国年轻人工作量大", "paras": [{"start": null, "end": null, "lines": [{"de": "Generation Z ist ein Name für eine Gruppe von Menschen.", "zh": "\"Z世代\"是一类人群的名称。", "start": null, "end": null}, {"de": "Die Menschen aus der Generation Z sind heute ungefähr zwischen 15 und 30 Jahre alt. Viele Menschen sagen, die Generation Z ist faul.", "zh": "Z世代的人目前大约在15到30岁之间。", "start": null, "end": null}, {"de": "Die jungen Menschen wollen nicht so viel arbeiten. Sie wollen lieber viel frei haben.", "zh": "很多人说Z世代懒惰，年轻人不想多干活，宁愿有很多空闲时间。", "start": null, "end": null}, {"de": "Jetzt haben Forscher herausgefunden, das stimmt nicht. Es arbeiten so viele junge Menschen wie noch nie in Deutschland.", "zh": "但研究人员发现事实并非如此——德国工作的年轻人比以往任何时候都多。", "start": null, "end": null}]}, {"start": null, "end": null, "lines": [{"de": "Das ist Moritz Rappen.", "zh": "莫里茨·拉彭在科隆的一家企业工作，", "start": null, "end": null}, {"de": "Er studiert Maschinenbau.", "zh": "同时学习机械工程。", "start": null, "end": null}, {"de": "Und er arbeitet auch bei einer Firma in der Stadt Köln.", "zh": "他说，", "start": null, "end": null}, {"de": "Er sagt, es ist sehr viel.", "zh": "事情太多了，", "start": null, "end": null}, {"de": "Die Woche ist sehr voll.", "zh": "一周排得很满，", "start": null, "end": null}, {"de": "Ich muss auch einiges am Wochenende machen.", "zh": "周末也得干活。", "start": null, "end": null}]}, {"start": null, "end": null, "lines": [{"de": "Junge Menschen zwischen 20 und 24 Jahren arbeiten öfter als früher.", "zh": "研究数据显示，", "start": null, "end": null}, {"de": "Das zeigen auch Daten von Forschern.", "zh": "20至24岁年轻人的工作比例高于过去。", "start": null, "end": null}, {"de": "Dieser Forscher sagt, die Generation Z hat einen Rekord aufgestellt.", "zh": "这位研究员说，Z世代创下了纪录。", "start": null, "end": null}, {"de": "Es gab zwar schon mal viele junge Arbeiter vor mehr als 30 Jahren.", "zh": "虽然30多年前也有过很多年轻劳动者，", "start": null, "end": null}, {"de": "Aber damals haben die jungen Menschen viel seltener studiert.", "zh": "但那时的年轻人很少上大学。", "start": null, "end": null}]}, {"start": null, "end": null, "lines": [{"de": "Das ist Sarah Alfa-Lachy.", "zh": "萨拉·阿尔法-拉奇也在科隆的同一家公司工作和学习。", "start": null, "end": null}, {"de": "Sie arbeitet auch bei der Firma in Köln und studiert.", "zh": "她希望借此获得收入和工作经验。", "start": null, "end": null}, {"de": "So will sie Geld und Erfahrung im Job bekommen.", "zh": "但这对她来说不是全部。", "start": null, "end": null}, {"de": "Aber das ist nicht alles für sie.", "zh": "她说，", "start": null, "end": null}, {"de": "Sie sagt, auch Gesundheit ist sehr wichtig.", "zh": "健康也很重要——要能好好工作，", "start": null, "end": null}, {"de": "Um gut arbeiten zu können, muss man auch ein gutes Leben haben.", "zh": "就必须有好的生活。", "start": null, "end": null}]}, {"start": null, "end": null, "lines": [{"de": "Diese Beispiele zeigen: Junge Menschen wollen zwar nicht nur arbeiten, aber sie sind auch nicht faul.", "zh": "这些例子说明：年轻人虽然不想只工作，但也绝不懒惰。", "start": null, "end": null}]}], "vocab": [{"lemma": "die Generation (-en)", "key": "generation", "forms": ["Generation"], "pos": "", "zh": "一代人", "example_de": "Generation Z ist ein Name für eine Gruppe von Menschen.", "example_zh": ""}, {"lemma": "faul", "key": "faul", "forms": ["faul"], "pos": "", "zh": "懒惰的", "example_de": "Viele Menschen sagen, die Generation Z ist faul.", "example_zh": ""}, {"lemma": "der Rekord (-e)", "key": "rekord", "forms": ["Rekord"], "pos": "", "zh": "纪录", "example_de": "Dieser Forscher sagt, die Generation Z hat einen Rekord aufgestellt.", "example_zh": ""}, {"lemma": "frei haben", "key": "frei-haben", "forms": ["frei haben", "frei"], "pos": "Redewendung", "zh": "有空闲", "example_de": "Sie wollen lieber viel frei haben.", "example_zh": ""}, {"lemma": "die Erfahrung (-en)", "key": "erfahrung", "forms": ["Erfahrung"], "pos": "", "zh": "经验", "example_de": "So will sie Geld und Erfahrung im Job bekommen.", "example_zh": ""}, {"lemma": "die Gesundheit", "key": "gesundheit", "forms": ["Gesundheit"], "pos": "", "zh": "健康", "example_de": "Sie sagt, auch Gesundheit ist sehr wichtig.", "example_zh": ""}, {"lemma": "herausfinden (hat herausgefunden)", "key": "herausfinden", "forms": ["herausfinden", "herausgefunden"], "pos": "Redewendung", "zh": "查明/发现", "example_de": "Jetzt haben Forscher herausgefunden, das stimmt nicht.", "example_zh": ""}, {"lemma": "seltener", "key": "seltener", "forms": ["seltener"], "pos": "", "zh": "更少地", "example_de": "Aber damals haben die jungen Menschen viel seltener studiert.", "example_zh": ""}], "grammar_points": [{"title": "Comparison: lieber / öfter / seltener", "summary": "Comparison: lieber / öfter / seltener — 形容词比较级 德语比较级规则：词尾加 -er。 • gern → lieber（更喜欢）：Sie wollen lieber viel frei haben. • oft → öfter（更频繁）：Sie arbeiten öfter als früher. • selten → seltener（更罕见）：Sie haben seltener studiert. 直觉：用 -er 就是比较级，和英语的 -er 完全一样。", "example_de": "", "example_zh": ""}], "background": "Z世代指1997-2012年间出生的一代人，常被贴上\"懒惰\"\"不愿吃苦\"的标签。但德国劳工市场研究显示，这一代年轻人（尤其是20-24岁）的就业率达到历史新高。与30年前不同的是，当今年轻人更多采用\"双轨制\"（Duales Studium）——边工作边学习。他们重视工作与生活平衡（Work-Life-Balance），但这并不等于不工作。"}, {"title": "Sonnenfinsternis in Teilen Westeuropas", "title_zh": "西欧部分地区出现日食", "paras": [{"start": 339.78, "end": 381.34, "lines": [{"de": "Am Mittwochabend kann man am Himmel etwas ganz Besonderes sehen.", "zh": "周三傍晚，", "start": null, "end": null}, {"de": "Dann gibt es nämlich eine Sonnenfinsternis.", "zh": "天空将出现一道奇观——日食。", "start": 339.78, "end": 381.34}, {"de": "Bei einer Sonnenfinsternis ist der Mond für eine Zeit lang zwischen der Erde und der Sonne.", "zh": "日食发生时，", "start": null, "end": null}, {"de": "Dann verdeckt der Mond die Sonne, so wie auf dem Foto.", "zh": "月球短暂地位于地球和太阳之间，", "start": null, "end": null}, {"de": "Deshalb ist es auf der Erde dann kurz dunkler.", "zh": "遮挡住太阳。因此地球会短暂变暗。", "start": null, "end": null}]}, {"start": null, "end": null, "lines": [{"de": "Das war die letzte totale Sonnenfinsternis in Deutschland. Das ist schon fast 30 Jahre her.", "zh": "上一次德国可见的日全食已经是将近30年前的事了。", "start": null, "end": null}, {"de": "Damals konnte man die Sonnenfinsternis nicht so gut sehen.", "zh": "当时因为天气不好，观测效果不佳。", "start": null, "end": null}, {"de": "Es war nämlich schlechtes Wetter. Dieses Mal soll das Wetter viel besser sein.", "zh": "这次天气应该会好得多。", "start": null, "end": null}]}, {"start": null, "end": null, "lines": [{"de": "Wann die Sonnenfinsternis anfängt, das ist in jedem Ort in Deutschland etwas anders.", "zh": "日食开始的时间在德国各地略有不同，", "start": null, "end": null}, {"de": "Sie beginnt um 19.15 Uhr.", "zh": "大约从19:15开始。", "start": null, "end": null}, {"de": "Der Mond kommt von rechts unten vor die Sonne.", "zh": "月球从太阳右下方逐渐移入。", "start": null, "end": null}, {"de": "Am dunkelsten ist es in Hamburg, oben im Norden, um 20.07 Uhr.", "zh": "最暗的时刻因城市而异：北部汉堡约20:07，", "start": null, "end": null}, {"de": "In Berlin, rechts im Osten, um 20.08 Uhr.", "zh": "东部柏林约20:08，", "start": null, "end": null}, {"de": "In Köln, links im Westen, um 20.10 Uhr.", "zh": "西部科隆约20:10，", "start": null, "end": null}, {"de": "Und in München, unten im Süden, um 20.15 Uhr.", "zh": "南部慕尼黑约20:15。", "start": null, "end": null}]}, {"start": null, "end": null, "lines": [{"de": "Dieses Mal gibt es in Deutschland aber keine totale Sonnenfinsternis.", "zh": "不过这次在德国看不到日全食，", "start": null, "end": null}, {"de": "Das heißt, der Mond ist nur zu einem Teil vor der Sonne, nicht komplett.", "zh": "月球只遮挡太阳的一部分。", "start": null, "end": null}, {"de": "Deshalb wird es nicht richtig dunkel.", "zh": "因此天不会完全变黑，", "start": null, "end": null}, {"de": "Aber die Farben sind nicht mehr so deutlich.", "zh": "但颜色会变得不太鲜明，", "start": null, "end": null}, {"de": "Schatten können stärker sein.", "zh": "阴影可能更明显，", "start": null, "end": null}, {"de": "Und es wird etwas kälter.", "zh": "气温也会略微下降。", "start": null, "end": null}]}, {"start": 381.38, "end": 383.98, "lines": [{"de": "Wenn man die Sonnenfinsternis ansehen will, dann braucht man so eine besondere Brille.", "zh": "如果要观测日食，需要佩戴专用的日食眼镜，", "start": null, "end": null}, {"de": "Sonst können die Augen kaputt gehen.", "zh":
