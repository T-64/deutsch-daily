    <script id="dd-data" type="application/json">{"page":"lesson","lesson":{"slug":"2026-08-10","date":"2026-08-10","show":"tagesschau in Einfacher Sprache","level":"A2–B1","kind":"video","note":"","source_url":"https://www.tagesschau.de/tagesschau_in_einfacher_sprache/video-1629018.html","video":{"mp4":"https://tagesschau-progressive.ard-mcdn.de/video/2026/0810/TV-20260810-1746-2100.webl.h264.mp4","embed":"https://www.tagesschau.de/tagesschau_in_einfacher_sprache/video-1629018~player.html","page":"https://www.tagesschau.de/tagesschau_in_einfacher_sprache/video-1629018.html"},"duration":416.96,"sentences":[{"de":"Bei der Bahn arbeiten viele Zugbegleiter.","zh":"德国铁路有很多列车乘务员，","start":36.95,"end":46.64},{"de":"In den Zügen kontrollieren sie die Fahrkarten.","zh":"他们在列车上查验车票。铁路公司表示，","start":46.99,"end":50.19},{"de":"Die Bahn sagt, viele Zugbegleiter werden bei der Arbeit angegriffen und beleidigt.","zh":"许多乘务员在工作中遭到袭击和辱骂。","start":50.23,"end":58.63},{"de":"In diesem Jahr gab es fast 1000 Übergriffe auf Zugbegleiter.","zh":"今年已发生近1000起针对乘务员的暴力事件。","start":58.67,"end":63.03},{"de":"Dieser Mann ist Nils Köster.","zh":"这位男士叫Nils Köster，","start":66.71,"end":72.03},{"de":"Er ist Zugbegleiter bei der Bahn und kontrolliert Fahrkarten.","zh":"是铁路乘务员，已被袭击多次。","start":72.31,"end":76.59},{"de":"Köster ist schon mehrmals angegriffen worden.","zh":"他说自己被殴打、踢打、吐口水，","start":76.91,"end":80.03},{"de":"Er sagt, ich wurde schon geschlagen, getreten, angespuckt und mit Bierdosen beworfen.","zh":"还被扔啤酒罐。","start":80.07,"end":85.59},{"de":"Seit einigen Monaten trägt Köster eine Kamera um den Hals. Wenn er angegriffen wird, dann schaltet er sie ein. Köster sagt, das hilft.","zh":"几个月来他脖子上挂着摄像头，被袭击时就打开。","start":86.08,"end":97.39},{"de":"Ein wütender Mann ohne Fahrkarte hat mich erst in Ruhe gelassen, als ich die Kamera eingeschaltet habe.","zh":"他说这很有效——一个没票的愤怒男子直到看到摄像头才放过他。","start":97.48,"end":104.28},{"de":"Der Minister für Verkehr, Steffen Bilger, will jetzt noch mehr tun für die Sicherheit.","zh":"交通部长Steffen Bilger要为安全做更多。","start":104.4,"end":112.23},{"de":"Bald sollen die Kameras von den Zugbegleitern auch den Ton aufnehmen.","zh":"不久后摄像头将能录音。","start":112.27,"end":116.75},{"de":"Zugbegleiter Köster hofft vor allem auf neue Kollegen.","zh":"乘务员Köster则希望能有新同事帮忙处理困难局面。","start":120.67,"end":128.91},{"de":"In diesem Sommer war es im Westen von Europa besonders heiß.","zh":"今年夏天欧洲西部格外炎热，","start":129.44,"end":145.15},{"de":"Das haben Wissenschaftler gemessen.","zh":"科学家对此进行了测量。","start":145.68,"end":148.16},{"de":"Sie sagen, so heiß wie im Juni und Juli waren die Temperaturen hier noch nie.","zh":"他们说六七月的温度在这里前所未有地高，","start":148.24,"end":154.24},{"de":"Im Durchschnitt war es nämlich fast 22 Grad.","zh":"平均将近22度。","start":154.87,"end":158.31},{"de":"Wenn es in Deutschland sehr heiß ist, dann brauchen viele Menschen Hilfe, zum Beispiel im Krankenhaus.","zh":"德国高温时许多人需要帮助，","start":158.8,"end":171.4},{"de":"Die Menschen im Krankenhaus sind nämlich schwach.","zh":"比如在医院里，","start":171.48,"end":174.68},{"de":"Sie können schlecht mit Hitze umgehen.","zh":"病人本身虚弱、难以应对高温。","start":174.8,"end":177.24},{"de":"Hitze ist aber auch für gesunde Menschen ein Problem.","zh":"不过高温对健康人也是问题，","start":177.99,"end":181.35},{"de":"Sie sollen im Schatten bleiben und sich abkühlen.","zh":"应待在阴凉处降温。","start":181.44,"end":184.36},{"de":"Um den Schutz vor der Hitze kümmern sich Städte und Bundesländer.","zh":"防暑保护由各城市和联邦州负责。","start":184.52,"end":188.4},{"de":"Ein Politiker von den Grünen sagt: Wir brauchen mehr Schutz für schwache Menschen und einen Hitzeschutzplan.","zh":"一位绿党政治家呼吁为弱势人群提供更多保护、制定防暑计划，","start":188.72,"end":213.07},{"de":"Bisher hat die Regierung aber noch nicht gehandelt.","zh":"但政府尚未行动。","start":304.19,"end":315.24},{"de":"Auch die Bauern haben ein Problem mit der Hitze, weil dadurch die Ernte kaputt gehen kann.","zh":"农民也因高温面临庄稼受损的问题，","start":null,"end":null},{"de":"Sie fordern jetzt Hilfe.","zh":"他们现在要求获得援助。","start":null,"end":null},{"de":"Der Rhein ist der größte Fluss in Deutschland.","zh":"莱茵河是德国最大的河流。","start":null,"end":null},{"de":"Zurzeit ist sehr wenig Wasser im Rhein.","zh":"目前水位非常低，","start":null,"end":null},{"de":"Das ist ein Problem für die Schiffe auf dem Fluss.","zh":"这对河上的船只是个问题，","start":null,"end":null},{"de":"Sie können nämlich nicht wie sonst fahren.","zh":"因为它们无法像往常一样航行。","start":null,"end":null},{"de":"Jetzt sagen die Kapitäne von den Schiffen, vielleicht können wir bald nicht mehr auf dem ganzen Rhein fahren.","zh":"船长们说也许很快就无法在整个莱茵河上航行了，","start":null,"end":null},{"de":"An einigen Stellen gibt es nämlich zu wenig Wasser für unsere Schiffe.","zh":"某些河段水太浅。","start":null,"end":null},{"de":"Dann müssen die Waren wie Kohle oder Stahl anders transportiert werden, zum Beispiel in Lastwagen auf den Straßen.","zh":"那样的话煤炭、钢铁等货物必须改用卡车走公路运输。","start":null,"end":null},{"de":"In Spanien und Frankreich ist es sehr heiß.","zh":"西班牙和法国非常炎热，","start":317.2,"end":354.03},{"de":"Bäume und Pflanzen sind trocken.","zh":"树木和植物都很干燥。","start":null,"end":null},{"de":"In diesem Sommer gibt es dort viele Waldbrände, also große Feuer.","zh":"今年夏天那里有许多森林大火。","start":null,"end":null},{"de":"Im Süden und im Osten von Spanien sind jetzt neue Feuer ausgebrochen.","zh":"西班牙南部和东部又爆发新火灾，","start":null,"end":null},{"de":"Wegen dem starken Wind ist es schwer, sie zu löschen.","zh":"强风使灭火困难。","start":null,"end":null},{"de":"Auch in Frankreich brennt es wieder.","zh":"法国也再次发生火灾。","start":null,"end":null},{"de":"Hier kämpfen Feuerwehrleute in der spanischen Stadt Castellón gegen einen Waldbrand.","zh":"在西班牙城市Castellón（卡斯特利翁），","start":null,"end":null},{"de":"Die Flammen sind auch in der Nähe von einer Straße.","zh":"消防员正在与森林大火搏斗。","start":null,"end":null},{"de":"Häuser hat das Feuer bisher nicht zerstört, dafür aber parkende Autos.","zh":"火焰蔓延到公路附近。房屋尚未被毁，","start":null,"end":null},{"de":"In Spanien gibt es in diesem Jahr besonders viele Waldbrände.","zh":"但停放的汽车被烧毁。","start":null,"end":null},{"de":"Sehr viele Bäume sind schon verbrannt.","zh":"今年西班牙的森林火灾特别多，大量树木已被烧毁。","start":null,"end":null},{"de":"Waldbrände gibt es auch wieder in Frankreich, so wie hier in der Nähe von Bordeaux.","zh":"法国也再次出现森林大火，比如波尔多附近。","start":null,"end":null},{"de":"Hier hat es in diesem Sommer schon mal gebrannt.","zh":"这里今年夏天已经烧过一次。","start":null,"end":null},{"de":"Jetzt hofft die Feuerwehr, die Waldbrände sollen dieses Mal nicht so groß werden.","zh":"消防队希望这次火灾不要太大。","start":null,"end":null},{"de":"Leichtathletik EM — Wettkämpfe gestartet.","zh":"田径欧锦赛——比赛已开始。","start":null,"end":null},{"de":"Auf dem Foto ist ein Stadion in Großbritannien in der Stadt Birmingham.","zh":"照片上是英国伯明翰的一座体育场，","start":354.07,"end":355.79},{"de":"Dort hat jetzt die Europameisterschaft in der Leichtathletik angefangen.","zh":"欧洲田径锦标赛在那里开幕。","start":355.84,"end":360.6},{"de":"In der Leichtathletik gibt es verschiedene Sportarten wie Sprint, Hochsprung oder Kugelstoßen.","zh":"田径包括短跑、跳高、铅球等多种项目。","start":360.96,"end":367.8},{"de":"Mehr als 100 Sportler aus Deutschland sind bei der EM dabei.","zh":"超过100名德国运动员参加本届欧锦赛，","start":368.88,"end":373.04},{"de":"Sie hoffen auf viele Medaillen.","zh":"他们希望能赢许多奖牌。","start":373.72,"end":375.88},{"de":"Bei der letzten EM haben sie nur elf Medaillen gewonnen.","zh":"上届欧锦赛他们只获得了11枚。","start":376.28,"end":380.2},{"de":"Und jetzt kommt das Wetter.","zh":"现在播报天气。","start":403.96,"end":405.88},{"de":"Es wird sonnig.","zh":"天气晴朗。","start":406.76,"end":408.04},{"de":"Nur oben im Norden gibt es einzelne Wolken.","zh":"只有北部有一些云。","start":408.24,"end":411.24},{"de":"Unten an den Alpen kann es regnen.","zh":"南部阿尔卑斯山附近可能有雨。","start":411.6,"end":414.0},{"de":"Es werden 18 bis 34 Grad.","zh":"气温18到34度。","start":414.64,"end":416.96}],"stories":[{"title":"Bahn: Mehr Gewalt gegen Zugbegleiter","title_zh":"铁路：针对乘务员的暴力增多","from":0,"to":12,"vocab":[{"key":"zugbegleiter","lemma":"der Zugbegleiter","pos":"","zh":"列车乘务员","example_de":"Bei der Bahn arbeiten viele Zugbegleiter.","example_zh":""},{"key":"angreifen","lemma":"angreifen","pos":"Verb","zh":"袭击","example_de":"Köster ist mehrmals angegriffen worden.","example_zh":""},{"key":"beleidigen","lemma":"beleidigen","pos":"Verb","zh":"辱骂","example_de":"Zugbegleiter werden oft beleidigt.","example_zh":""},{"key":"übergriff","lemma":"der Übergriff","pos":"","zh":"暴力袭击","example_de":"Es gab fast 1000 Übergriffe.","example_zh":""},{"key":"treten","lemma":"treten","pos":"Verb","zh":"踢","example_de":"Ich wurde geschlagen, getreten.","example_zh":""},{"key":"anspucken","lemma":"anspucken","pos":"Verb","zh":"吐口水","example_de":"(同上)","example_zh":""},{"key":"kamera","lemma":"die Kamera","pos":"","zh":"摄像头","example_de":"Seit einigen Monaten trägt Köster eine Kamera um den Hals.","example_zh":""},{"key":"täter","lemma":"der Täter","pos":"","zh":"肇事者","example_de":"Wir können die Täter verfolgen.","example_zh":""},{"key":"verfolgen","lemma":"verfolgen","pos":"Verb","zh":"追查","example_de":"(同上)","example_zh":""},{"key":"wütend","lemma":"wütend","pos":"","zh":"愤怒的","example_de":"Ein wütender Mann ohne Fahrkarte.","example_zh":""}],"grammar":[{"title":"Passiv 被动语态 (werden + Partizip II):","summary":"Passiv 被动语态 (werden + Partizip II): viele Zugbegleiter werden bei der Arbeit angegriffen → 乘务员在工作中被袭击 werden 在这里不是\"变成\"，而是\"被\"的标记，表示动作施加到主语身上。","example_de":"变成","example_zh":""}],"background":"德国铁路（Deutsche Bahn）的列车乘务员负责查验车票和维护车厢秩序。近年来针对乘务员的暴力事件不断增加，2026年已接近1000起。政府正推动为乘务员配备可录音的随身摄像头以提高安全性和取证能力。"},{"title":"Sommer: Temperaturen so hoch wie nie","title_zh":"夏天：气温创纪录","from":13,"to":26,"vocab":[{"key":"heiß","lemma":"heiß","pos":"","zh":"炎热的","example_de":"In diesem Sommer war es im Westen von Europa besonders heiß.","example_zh":""},{"key":"messen","lemma":"messen","pos":"Verb","zh":"测量","example_de":"Das haben Wissenschaftler gemessen.","example_zh":""},{"key":"hitze","lemma":"die Hitze","pos":"","zh":"酷暑","example_de":"Sie können schlecht mit Hitze umgehen.","example_zh":""},{"key":"schwach","lemma":"schwach","pos":"","zh":"虚弱的","example_de":"Die Menschen im Krankenhaus sind nämlich schwach.","example_zh":""},{"key":"schatten","lemma":"der Schatten","pos":"","zh":"阴凉处","example_de":"Sie sollen im Schatten bleiben und sich abkühlen.","example_zh":""},{"key":"abkühlen","lemma":"sich abkühlen","pos":"Substantiv","zh":"降温","example_de":"Sie sollen im Schatten bleiben und sich abkühlen.","example_zh":""},{"key":"hitzeschutz","lemma":"der Hitzeschutz","pos":"","zh":"防暑保护","example_de":"Einen Hitzeschutzplan machen.","example_zh":""},{"key":"ernte","lemma":"die Ernte","pos":"","zh":"收成","example_de":"Auch die Bauern haben ein Problem mit der Hitze, weil dadurch die Ernte kaputt gehen kann.","example_zh":""},{"key":"kaputt-gehen","lemma":"kaputt gehen","pos":"Redewendung","zh":"损坏","example_de":"Auch die Bauern haben ein Problem mit der Hitze, weil dadurch die Ernte kaputt gehen kann.","example_zh":""},{"key":"fördern","lemma":"fördern","pos":"Verb","zh":"要求","example_de":"Sie fordern jetzt Hilfe.","example_zh":""}],"grammar":[{"title":"nämlich","summary":"nämlich — 解释连接词: Im Durchschnitt war es nämlich fast 22 Grad. → 因为平均将近22度 nämlich 放在句中，补充解释原因，相当于\"也就是说/因为\"。 sich kümmern um — 负责/照顾: Um den Schutz vor der Hitze kümmern sich Städte. → 各城市负责防暑。 sich kümmern um + Akk = 照顾/负责某事。","example_de":"也就是说/因为","example_zh":""}],"background":"2026年夏天是欧洲西部有记录以来最热的夏天之一。气候变化导致极端高温频发，德国联邦政府面临制定全国性防暑计划的压力。医院、养老院的高温防护成为政治议题，同时高温干旱也严重影响了农业。"},{"title":"Rhein: Fluss hat sehr wenig Wasser","title_zh":"莱茵河：水位很低","from":27,"to":33,"vocab":[{"key":"rhein","lemma":"der Rhein","pos":"","zh":"莱茵河","example_de":"Der Rhein ist der größte Fluss in Deutschland.","example_zh":""},{"key":"fluss","lemma":"der Fluss","pos":"","zh":"河流","example_de":"Der Rhein ist der größte Fluss in Deutschland.","example_zh":""},{"key":"schiff","lemma":"das Schiff","pos":"","zh":"船","example_de":"Ein Problem für die Schiffe.","example_zh":""},{"key":"kapitän","lemma":"der Kapitän","pos":"","zh":"船长","example_de":"Die Kapitäne sagen...","example_zh":""},{"key":"
