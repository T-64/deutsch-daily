    <script id="dd-data" type="application/json">{"page":"lesson","lesson":{"slug":"2026-11-05","date":"2026-11-05","show":"tagesschau in Einfacher Sprache","level":"A2–B1","kind":"broadcast","note":"","source_url":"https://www.tagesschau.de/tagesschau_in_einfacher_sprache/tse-1500.html","video":{"mp4":"https://tagesschau-progressive.ard-mcdn.de/video/2026/1105/TV-20261105-1748-0100.webl.h264.mp4","embed":"","page":"https://www.tagesschau.de/tagesschau_in_einfacher_sprache/video-1678738.html"},"duration":351.85,"sentences":[{"de":"Willkommen zur tagesschau in Einfacher Sprache.","zh":"欢迎收看《简单语言新闻》。","start":10.55,"end":13.59},{"de":"Ich bin Susanne Holst und das sind unsere Nachrichten.","zh":"我是Susanne Holst，以下是我们的新闻。","start":13.63,"end":17.09},{"de":"Und nun zur ersten Nachricht.","zh":"现在来看第一条新闻。","start":28.55,"end":30.63},{"de":"Auf dem Foto ist Hubert Aiwanger.","zh":"照片上的是Hubert Aiwanger。","start":35.31,"end":37.67},{"de":"Er war ein bekannter Politiker aus dem Bundesland Bayern.","zh":"他曾是巴伐利亚州的一位知名政治家。","start":38.15,"end":42.15},{"de":"Er war der Chef von der Partei Freie Wähler.","zh":"他曾是自由选民党的领导人。","start":42.55,"end":45.63},{"de":"Er war auch Minister für Wirtschaft in Bayern.","zh":"他还曾担任巴伐利亚的经济部长。","start":46.75,"end":49.95},{"de":"Jetzt ist Aiwanger gestorben.","zh":"现在Aiwanger去世了。","start":50.59,"end":52.67},{"de":"Dazu zeigen wir einen Film.","zh":"为此我们播放一段影片。","start":52.91,"end":54.83},{"de":"Aiwanger ist in Berlin gestorben.","zh":"Aiwanger在柏林去世。","start":55.43,"end":57.79},{"de":"Er wollte zu einer Veranstaltung von seiner Partei gehen.","zh":"他本来要参加自己政党的一场活动。","start":58.79,"end":62.79},{"de":"Aber dann hat er gesagt:","zh":"但他当时说：","start":63.27,"end":65.23},{"de":"Es geht mir nicht gut. Ich bleibe im Hotel.","zh":"我身体不舒服，我留在酒店里。","start":65.27,"end":68.69},{"de":"Dort hat ihn jemand gefunden.","zh":"有人在酒店里发现了他。","start":69.39,"end":71.47},{"de":"Aiwanger war aber schon tot.","zh":"但那时Aiwanger已经去世了。","start":71.77,"end":73.77},{"de":"Der Chef von der Regierung in Bayern, Markus Söder, ist jetzt sehr traurig.","zh":"巴伐利亚的政府领导人Markus Söder现在非常悲伤。","start":74.27,"end":79.55},{"de":"Söder sagt: Ich bin geschockt. Ich wollte es nicht glauben.","zh":"Söder说：我很震惊，我简直不敢相信。","start":80.75,"end":85.61},{"de":"Aiwanger fehlt uns jetzt in der bayerischen Regierung.","zh":"Aiwanger的离去让我们巴伐利亚政府感到缺憾。","start":86.19,"end":89.99},{"de":"Viele Menschen vermissen ihn.","zh":"很多人会想念他。","start":90.47,"end":92.55},{"de":"Ärzte untersuchen jetzt den Körper von Aiwanger.","zh":"医生们现在正在检查Aiwanger的遗体。","start":93.19,"end":96.55},{"de":"Sie wollen herausfinden, warum ist Aiwanger gestorben.","zh":"他们想查明Aiwanger为什么会去世。","start":97.03,"end":100.83},{"de":"Er war nämlich erst 55 Jahre alt.","zh":"因为他才55岁。","start":101.79,"end":104.15},{"de":"Vielleicht war Aiwanger krank.","zh":"也许Aiwanger生病了。","start":105.55,"end":107.71},{"de":"Das müssen die Ärzte jetzt herausfinden.","zh":"这一点必须由医生来查明。","start":108.03,"end":110.83},{"de":"Und nun zur nächsten Nachricht.","zh":"现在来看下一条新闻。","start":112.27,"end":114.47},{"de":"Die Regierung von Deutschland hat ein neues Gesetz gemacht.","zh":"德国政府制定了一部新法律。","start":118.47,"end":122.71},{"de":"Das ist das Pflegegesetz.","zh":"这就是护理法。","start":122.75,"end":124.51},{"de":"Pflege ist Hilfe vom Staat, wenn Menschen sich nicht mehr alleine versorgen können.","zh":"护理是国家提供的帮助，针对无法再自理生活的人。","start":124.67,"end":130.43},{"de":"Das kostet viel Geld.","zh":"这需要很多钱。","start":130.95,"end":132.47},{"de":"Deshalb geben Menschen mit einem Job einen Teil vom Lohn an den Staat.","zh":"因此，有工作的人要把工资的一部分交给国家。","start":133.07,"end":137.99},{"de":"Und der Staat benutzt das Geld dann für die Pflege.","zh":"然后国家把这些钱用于护理。","start":138.39,"end":141.95},{"de":"Beim neuen Pflegegesetz geht es um dieses Geld.","zh":"新的护理法就是关于这笔钱的。","start":142.31,"end":145.59},{"de":"Jetzt hat auch der Bundestag über das Gesetz gesprochen.","zh":"现在联邦议院也讨论了这部法律。","start":146.11,"end":150.03},{"de":"Der Minister für Gesundheit, Carsten Linnemann, sagt:","zh":"卫生部长Carsten Linnemann说：","start":150.27,"end":153.99},{"de":"Der Staat gibt zu viel Geld für die Pflege aus.","zh":"国家在护理上花的钱太多了。","start":154.07,"end":157.35},{"de":"Das wollen wir ändern.","zh":"我们想改变这一点。","start":157.47,"end":159.03},{"de":"Was Linnemann noch gesagt hat, zeigen wir jetzt.","zh":"Linnemann还说了什么，我们马上播放。","start":159.19,"end":162.35},{"de":"Linnemann sagt:","zh":"Linnemann说：","start":163.47,"end":164.55},{"de":"Wer Hilfe braucht, der soll Hilfe bekommen.","zh":"谁需要帮助，谁就应该得到帮助。","start":165.11,"end":168.11},{"de":"Aber wir müssen sparen.","zh":"但我们必须节省开支。","start":169.03,"end":170.67},{"de":"Sonst reicht das Geld nicht mehr.","zh":"否则钱就不够了。","start":171.23,"end":173.59},{"de":"Die Menschen in Deutschland müssen einen größeren Teil vom Lohn abgeben.","zh":"德国人必须上交工资中更大的一部分。","start":174.59,"end":179.59},{"de":"Deshalb brauchen wir das neue Gesetz.","zh":"所以我们需要这部新法律。","start":179.91,"end":182.55},{"de":"Wir wollen noch mehr machen, damit die Pflege besser wird.","zh":"我们还想做更多的事情，让护理变得更好。","start":183.47,"end":187.55},{"de":"Dafür brauchen wir aber noch etwas Zeit.","zh":"但这我们还需要一些时间。","start":187.63,"end":190.43},{"de":"Und nun zur nächsten Nachricht.","zh":"现在来看下一条新闻。","start":192.99,"end":195.19},{"de":"In Frankreich gibt es wieder Proteste.","zh":"法国又出现了抗议活动。","start":198.95,"end":201.59},{"de":"Viele Menschen sind nämlich unzufrieden.","zh":"因为许多人不满意。","start":202.39,"end":205.19},{"de":"Die Menschen sagen:","zh":"人们说：","start":205.31,"end":206.67},{"de":"Alles ist teuer. Wir brauchen mehr Geld.","zh":"什么都贵，我们需要更多的钱。","start":206.91,"end":210.21},{"de":"Aber die Regierung will sparen.","zh":"但政府想要节省开支。","start":211.19,"end":213.39},{"de":"Das finden wir nicht gut.","zh":"我们觉得这不好。","start":213.79,"end":215.59},{"de":"Bei den Protesten sind auch Schüler und Studenten dabei.","zh":"参加抗议的还有中小学生和大学生。","start":216.39,"end":219.87},{"de":"Den jungen Menschen geht es nämlich besonders schlecht.","zh":"因为这些年轻人的处境特别糟糕。","start":220.99,"end":224.75},{"de":"Sie haben schon öfter protestiert.","zh":"他们已经多次抗议过。","start":224.79,"end":227.11},{"de":"Bei den Protesten hat es auch Gewalt gegeben.","zh":"抗议活动中也发生了暴力。","start":227.95,"end":231.11},{"de":"Deshalb ist in den Städten viel Polizei.","zh":"因此城市里部署了很多警察。","start":232.15,"end":234.95},{"de":"Dazu zeigen wir jetzt einen Film.","zh":"为此我们现在播放一段影片。","start":236.07,"end":238.43},{"de":"In der Hauptstadt Paris haben Schüler ihre Schule blockiert.","zh":"在首都巴黎，一些学生封锁了他们的学校。","start":239.39,"end":243.59},{"de":"Sie haben Sachen vor die Tür gestellt.","zh":"他们把东西堆在了门口。","start":244.31,"end":246.95},{"de":"Niemand kam in die Schule rein.","zh":"没有人能进学校。","start":247.19,"end":249.39},{"de":"Die Polizei hat die Sachen dann weggeräumt.","zh":"警察随后把东西清走了。","start":249.95,"end":252.95},{"de":"Diese Schülerin sagt: Die Regierung will mit uns reden.","zh":"这名女学生说：政府想和我们谈话。","start":253.27,"end":257.11},{"de":"Aber sie soll nicht nur reden, sondern auch handeln.","zh":"但它不应该只谈话，还要采取行动。","start":257.39,"end":261.03},{"de":"Und dieser Mann sagt:","zh":"这名男子说：","start":261.63,"end":263.15},{"de":"Die Regierung muss die Forderungen der jungen Menschen hören.","zh":"政府必须听取年轻人的诉求。","start":263.35,"end":267.67},{"de":"Das geht nur mit Protesten.","zh":"这只有通过抗议才能实现。","start":267.71,"end":269.63},{"de":"In der Stadt Nantes waren viele Menschen auf der Straße.","zh":"在南特市，很多人走上了街头。","start":270.31,"end":274.23},{"de":"Diese Frau sagt: Die jungen Menschen haben es besonders schwer.","zh":"这名女子说：年轻人的日子特别难。","start":274.75,"end":279.19},{"de":"Sie können die Miete nicht mehr zahlen oder Essen kaufen.","zh":"他们付不起房租，也买不起食物。","start":279.91,"end":283.91},{"de":"So können sie auch nicht mehr gut studieren.","zh":"这样他们也无法好好地学习。","start":283.99,"end":286.83},{"de":"Das ist schlecht für die Zukunft.","zh":"这对未来很不利。","start":286.87,"end":288.99},{"de":"In der Stadt Marseille gab es auch Proteste.","zh":"在马赛市也发生了抗议。","start":289.27,"end":292.35},{"de":"Dieser Mann sagt: Viele Menschen in Frankreich sind wütend.","zh":"这名男子说：法国有很多人很愤怒。","start":292.83,"end":296.99},{"de":"Sie verdienen nämlich nicht mehr genug Geld.","zh":"因为他们挣的钱已经不够了。","start":297.67,"end":300.75},{"de":"Jetzt kommen alle zusammen auf die Straße.","zh":"现在所有人都一起走上街头。","start":300.95,"end":303.87},{"de":"Das ist eine gute Sache.","zh":"这是一件好事。","start":304.11,"end":305.83},{"de":"Und dieser Mann sagt:","zh":"这名男子说：","start":306.51,"end":308.23},{"de":"Es wird noch mehr Proteste geben. Da bin ich mir sicher.","zh":"还会有更多的抗议，我对此很确定。","start":308.27,"end":312.67},{"de":"Die Regierung hört uns nämlich nicht zu.","zh":"因为政府不听我们的。","start":313.11,"end":315.91},{"de":"Und das waren unsere Nachrichten.","zh":"以上就是我们的新闻。","start":317.19,"end":319.23},{"de":"Und jetzt kommt das Wetter.","zh":"现在来看天气。","start":330.07,"end":331.99},{"de":"Oben im Norden und rechts im Osten viele Wolken.","zh":"北边和东边有很多云。","start":332.59,"end":336.71},{"de":"Links im Westen und unten im Süden gibt es auch Sonne.","zh":"西边和南边也有太阳。","start":337.63,"end":341.43},{"de":"Es werden 3 bis 12 Grad.","zh":"气温为3到12度。","start":342.67,"end":344.39},{"de":"Das war die tagesschau in Einfacher Sprache.","zh":"以上就是《简单语言新闻》。","start":346.99,"end":349.87},{"de":"Tschüss, bis zum nächsten Mal.","zh":"再见，下次见。","start":349.91,"end":351.85}],"stories":[{"title":"Begrüßung","title_zh":"欢迎","from":0,"to":2,"vocab":[],"grammar":[],"background":""},{"title":"Hubert Aiwanger gestorben","title_zh":"Hubert Aiwanger去世","from":3,"to":23,"vocab":[{"key":"politiker","lemma":"der Politiker, -","pos":"Substantiv","zh":"政治家","example_de":"Er war ein bekannter Politiker aus dem Bundesland Bayern.","example_zh":"他曾是巴伐利亚州的一位知名政治家。"},{"key":"sterben","lemma":"sterben, starb, ist gestorben","pos":"Verb","zh":"去世","example_de":"Jetzt ist Aiwanger gestorben.","example_zh":"现在Aiwanger去世了。"},{"key":"veranstaltung","lemma":"die Veranstaltung, -en","pos":"Substantiv","zh":"活动","example_de":"Er wollte zu einer Veranstaltung von seiner Partei gehen.","example_
