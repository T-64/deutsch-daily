    <div id="root"></div>
    <script id="dd-data" type="application/json">{"page":"lesson","lesson":{"slug":"2026-10-16","date":"2026-10-16","show":"tagesschau in Einfacher Sprache","level":"A2–B1","kind":"broadcast","note":"","source_url":"https://www.tagesschau.de/tagesschau_in_einfacher_sprache/tse-1464.html","video":{"mp4":"https://tagesschau-progressive.ard-mcdn.de/video/2026/1016/TV-20261016-1733-5600.webl.h264.mp4","embed":"","page":"https://www.tagesschau.de/tagesschau_in_einfacher_sprache/video-1667420.html"},"duration":597.76,"sentences":[{"de":"Willkommen zur tagesschau in Einfacher Sprache.","zh":"欢迎收看简单语言版每日新闻。","start":8.79,"end":11.99},{"de":"Ich bin Michael Paweletz.","zh":"我是Michael Paweletz。","start":12.07,"end":13.91},{"de":"Und das sind unsere Nachrichten.","zh":"以下是我们的新闻。","start":14.15,"end":16.47},{"de":"Und nun zur ersten Nachricht.","zh":"现在来看第一条新闻。","start":38.24,"end":40.32},{"de":"Wenn ein Mensch alt ist, dann muss er nicht mehr arbeiten und bekommt Rente.","zh":"当一个人年老时，就不用再工作，并领取养老金。","start":46.31,"end":52.75},{"de":"Rente ist Geld vom Staat.","zh":"养老金是国家发的钱。","start":53.31,"end":55.67},{"de":"Einige Menschen bekommen aber nur wenig Rente und haben nicht genug Geld zum Leben.","zh":"但有些人只领到很少的养老金，没有足够的钱生活。","start":56.55,"end":62.75},{"de":"Deshalb sagt die Regierung, die Menschen sollen vor der Rente Geld sparen.","zh":"因此政府说，人们应该在退休前存钱。","start":64.08,"end":69.59},{"de":"Dann haben sie mehr Geld, wenn sie alt sind.","zh":"这样他们年老时就会有更多的钱。","start":70.44,"end":73.52},{"de":"Die Regierung will beim Sparen helfen.","zh":"政府想在存钱方面提供帮助。","start":74.8,"end":77.44},{"de":"Deshalb hat sie jetzt einen Beschluss gemacht.","zh":"因此政府现在做出了一项决议。","start":77.71,"end":80.95},{"de":"Der Staat gibt jungen Menschen jeden Monat ein bisschen Geld.","zh":"国家每个月给年轻人一点钱。","start":82.36,"end":86.64},{"de":"Das Geld kommt zum Sparen auf ein Konto bei der Bank.","zh":"这笔钱存到银行的账户上用于储蓄。","start":87.56,"end":91.28},{"de":"Wenn die Menschen alt sind.","zh":"当人们年老时。","start":92.64,"end":94.56},{"de":"Wenn die Menschen alt sind und in Rente gehen, bekommen sie das Geld.","zh":"当人们年老并退休时，就能拿到这笔钱。","start":94.6,"end":98.8},{"de":"Die Regierung sagt, dann haben alte Menschen genug Geld zum Leben.","zh":"政府说，这样老年人就有足够的钱生活了。","start":98.92,"end":103.91},{"de":"Um einen Beschluss von der Regierung geht es auch in der nächsten Nachricht.","zh":"下一条新闻也和政府的一项决议有关。","start":106.72,"end":111.63},{"de":"Viele Menschen in Deutschland rauchen Zigaretten.","zh":"德国有很多人抽烟。","start":116.23,"end":120.03},{"de":"So wie auf dem Foto.","zh":"就像照片上这样。","start":120.27,"end":122.27},{"de":"Wenn man Zigaretten kauft, dann bezahlt man dabei auch Steuern.","zh":"买香烟时，也要缴税。","start":123.36,"end":127.8},{"de":"Steuern sind Geld für den Staat.","zh":"税是交给国家的钱。","start":128.99,"end":131.55},{"de":"Jetzt hat die Regierung einen Beschluss gemacht.","zh":"现在政府做出了一项决议。","start":132.39,"end":135.59},{"de":"Die Regierung sagt, wir machen die Steuern für Zigaretten höher.","zh":"政府说：我们要提高香烟的税。","start":136.04,"end":140.79},{"de":"D.h. Zigaretten werden teurer.","zh":"也就是说，香烟会变得更贵。","start":141.8,"end":143.88},{"de":"Wenn die Steuern höher werden, dann bekommt der Staat mehr Geld.","zh":"如果税提高了，国家就能得到更多的钱。","start":145.48,"end":149.8},{"de":"Der Minister für Geld, Lars Klingbeil, sagt, damit bezahlen wir z.B. die Schulden von Deutschland.","zh":"财政部长Lars Klingbeil说：比如我们用这笔钱偿还德国的债务。","start":151.24,"end":159.51},{"de":"Viele Menschen finden die höheren Steuern aber nicht gut.","zh":"但很多人认为提高税收不好。","start":161.0,"end":165.24},{"de":"Dazu zeigen wir einen Film.","zh":"为此我们播放一段影片。","start":165.51,"end":167.71},{"de":"Das ist Melanie Knabe.","zh":"这是Melanie Knabe。","start":170.2,"end":171.76},{"de":"Sie hat einen kleinen Laden.","zh":"她开了一家小店。","start":172.96,"end":174.96},{"de":"Dort verkauft sie jeden Tag viele Zigaretten.","zh":"她每天都在店里卖出很多香烟。","start":176.07,"end":179.59},{"de":"Sie sagt, die höheren Steuern finde ich nicht gut.","zh":"她说：我不认为提高税收是好事。","start":180.48,"end":184.0},{"de":"Vielleicht kaufen die Menschen dann weniger Zigaretten.","zh":"也许人们到时候会少买香烟。","start":184.75,"end":188.35},{"de":"Und dann verdiene ich weniger Geld.","zh":"那我挣的钱就少了。","start":188.39,"end":191.27},{"de":"Die Regierung sagt aber, wenn die Menschen weniger rauchen, dann ist das gut für die Gesundheit.","zh":"但政府说，如果人们少抽烟，那对健康是有好处的。","start":192.35,"end":200.03},{"de":"Einige Menschen finden die höheren Steuern aber auch gut.","zh":"不过也有些人认为提高税收是好事。","start":200.83,"end":205.31},{"de":"Dieser Mann sagt, Zigaretten sollen noch teurer werden.","zh":"这位男士说：香烟应该变得更贵。","start":206.47,"end":210.95},{"de":"Dann kann der Staat seine Schulden bezahlen.","zh":"这样国家就能偿还债务。","start":211.88,"end":214.96},{"de":"Und außerdem ist es für die Menschen gesünder.","zh":"而且这对人们的健康也更好。","start":215.8,"end":219.0},{"de":"Viele Raucher finden die höheren Steuern nicht gut.","zh":"很多吸烟者认为提高税收不好。","start":221.55,"end":225.27},{"de":"Dieser Mann sagt, wenn Zigaretten zu teuer werden, dann muss ich aufhören zu rauchen.","zh":"这位男士说：如果香烟太贵，我就必须戒烟了。","start":226.6,"end":233.07},{"de":"Hören jetzt viele Menschen mit dem Rauchen auf?","zh":"现在会有很多人戒烟吗？","start":234.35,"end":237.63},{"de":"Das glaubt Melanie Knabe nicht.","zh":"Melanie Knabe不相信会这样。","start":238.28,"end":240.48},{"de":"Sie sagt, die meisten Menschen rauchen bestimmt weiter.","zh":"她说：大多数人肯定会继续抽烟。","start":241.28,"end":245.12},{"de":"Experten sagen, seit vielen Jahren rauchen die Menschen in Deutschland weniger.","zh":"专家说，多年来德国吸烟的人越来越少了。","start":246.43,"end":252.8},{"de":"Zur nächsten Nachricht.","zh":"接下来看下一条新闻。","start":255.68,"end":257.32},{"de":"In den USA hat ein Mann in einer Schule mit einer Waffe geschossen.","zh":"在美国，一名男子在一所学校里开枪射击。","start":263.6,"end":268.71},{"de":"Die Schule ist auf dem Foto.","zh":"照片上就是这所学校。","start":268.75,"end":270.83},{"de":"Der junge Mann hat mehrere Menschen getötet.","zh":"这名年轻男子杀害了多人。","start":271.51,"end":274.67},{"de":"Auch Kinder sind dabei gestorben.","zh":"其中也有孩子丧生。","start":275.07,"end":277.47},{"de":"Der Mann mit der Waffe ist auch tot.","zh":"持枪的男子也死了。","start":278.15,"end":280.67},{"de":"Warum hat der Mann geschossen, das untersucht jetzt die Polizei.","zh":"这名男子为什么开枪，警方现在正在调查。","start":281.48,"end":286.0},{"de":"Dazu zeigen wir einen Film.","zh":"为此我们播放一段影片。","start":286.23,"end":288.31},{"de":"Die Schule ist in dem Bundesstaat Oregon.","zh":"这所学校位于俄勒冈州。","start":290.35,"end":293.19},{"de":"Vor der Schule stehen viele Polizisten.","zh":"学校门前站着很多警察。","start":294.03,"end":296.83},{"de":"Sie wollen jetzt herausfinden, was genau ist in der Schule passiert.","zh":"他们现在想查明学校里到底发生了什么。","start":297.23,"end":302.91},{"de":"Auch die Familien von den Schülern sind da.","zh":"学生的家人们也在那里。","start":303.87,"end":307.35},{"de":"Sie warten auf Nachrichten von ihren Kindern.","zh":"他们等待着自己孩子的消息。","start":308.19,"end":311.35},{"de":"Die Familien machen sich große Sorgen.","zh":"这些家庭非常担心。","start":311.99,"end":314.75},{"de":"Der Chef von der Polizei sagt, bei dem Angriff sind drei Kinder gestorben.","zh":"警察局长说：这次袭击中有三名儿童丧生。","start":316.07,"end":322.35},{"de":"Auch eine Lehrerin ist tot.","zh":"还有一名女教师死亡。","start":323.19,"end":325.59},{"de":"Und mehrere Menschen sind verletzt.","zh":"还有多人受伤。","start":325.83,"end":328.83},{"de":"Der Mann mit der Waffe war 16 Jahre alt.","zh":"持枪的男子16岁。","start":329.75,"end":333.15},{"de":"Er ist auch tot.","zh":"他也死了。","start":334.4,"end":335.56},{"de":"Ein Mann aus der Nachbarschaft hat ihn erschossen.","zh":"一名附近的男子开枪打死了他。","start":336.47,"end":339.59},{"de":"Am Abend zünden die Menschen Kerzen für die Toten an.","zh":"晚上，人们为死者点燃蜡烛。","start":342.83,"end":346.47},{"de":"Viele fragen sich, wieso ist das passiert?","zh":"很多人问：为什么会发生这种事？","start":347.43,"end":350.35},{"de":"Dieser Mann sagt, ich habe gerade in der Nähe gearbeitet.","zh":"这名男子说：我刚才就在附近工作。","start":352.2,"end":356.2},{"de":"Dann kamen viele Polizisten.","zh":"然后来了很多警察。","start":356.99,"end":359.15},{"de":"Meine Schwester hat mich angerufen und gesagt, in der Schule wird geschossen.","zh":"我姐姐打电话给我，说学校里有人开枪。","start":359.19,"end":365.59},{"de":"Unserer Familie ist zum Glück nichts passiert.","zh":"幸运的是，我的家人没有出事。","start":366.27,"end":369.47},{"de":"Aber ich bin sehr traurig über die Toten.","zh":"但我为死者感到非常难过。","start":370.27,"end":373.11},{"de":"Ich kann es einfach nicht glauben.","zh":"我简直无法相信。","start":373.67,"end":376.11},{"de":"Überall in den USA trauern die Menschen jetzt um die Toten.","zh":"现在整个美国的人们都在为死者哀悼。","start":377.67,"end":382.47},{"de":"Und nun zur nächsten Nachricht.","zh":"接下来是下一条新闻。","start":383.79,"end":386.55},{"de":"In Belgien ist heute ein wichtiges Treffen von der EU.","zh":"今天在比利时举行一场重要的欧盟会议。","start":391.88,"end":395.68},{"de":"Die Länder von der EU sprechen nämlich über den Krieg von Russland gegen die Ukraine.","zh":"欧盟各国要讨论俄罗斯对乌克兰的战争。","start":396.36,"end":402.55},{"de":"Auch der Präsident von der Ukraine, Wolodymyr Selenskyj, ist bei dem Treffen.","zh":"乌克兰总统弗拉基米尔·泽连斯基也参加了会议。","start":403.48,"end":408.84},{"de":"Selenskyj ist in der Mitte auf dem Foto.","zh":"泽连斯基在照片中间。","start":409.72,"end":412.52},{"de":"Die Länder von der EU beraten, wie kann die EU der Ukraine im Krieg weiter helfen.","zh":"欧盟各国在商讨：欧盟能如何在战争中继续帮助乌克兰。","start":413.24,"end":419.6},{"de":"Russland greift die Ukraine nämlich immer noch an.","zh":"因为俄罗斯仍在攻击乌克兰。","start":420.75,"end":424.59},{"de":"Besonders viele Angriffe gibt es in der Hauptstadt Kiew.","zh":"首都基辅的攻击特别多。","start":425.39,"end":429.59},{"de":"Dazu zeigen wir jetzt einen Film.","zh":"接下来我们播放一段影片。","start":430.15,"end":432.51},{"de":"In Kiew fahren die Menschen nach der Arbeit mit dem Bus nach Hause.","zh":"在基辅，人们下班后乘公交车回家。","start":434.4,"end":439.47},{"de":"Auf dem Weg müssen sie über eine Brücke fahren.","zh":"路上他们必须经过一座桥。","start":440.6,"end":443.88},{"de":"Viele haben deshalb Angst.","zh":"因此很多人感到害怕。","start":444.24,"end":446.08},{"de":"Russland schießt nämlich oft mit Raketen auf die Brücken.","zh":"因为俄罗斯经常向这些桥发射导弹。","start":447.6,"end":451.6},{"de":"So wie auf diesen Bildern.","zh":"就像这些画面里一样。","start":452.52,"end":454.36},{"de":"Sie sind schon älter.","zh":"这些画面已经比较久了。","start":455.76,"end":457.28},{"de":"Ohne den Bus oder das Auto kommen viele nicht zur Arbeit.","zh":"没有公交车或汽车，很多人就无法上班。","start":459.43,"end":463.67},{"de":"So wie diese Frau.","zh":"就像这位女士一样。","start":464.76,"end":466.04},{"de":"Sie sagt, ich habe immer Angst.","zh":"她说：我一直很害怕。","start":466.84,"end":469.04},{"de":"Es kann ja jeden Moment etwas passieren.","zh":"随时都可能出事。","start":469.76,"end":472.56},{"de":"Mit dieser Angst zu leben, ist sehr schwer.","zh":"带着这种恐惧生活非常艰难。","start":472.96,"end":475.96},{"de":"In der Nacht hat Russland Kiew wieder angegriffen.","zh":"夜里，俄罗斯再次攻击了基辅。","start":477.75,"end":481.63},{"de":"Die Raketen treffen auch wichtige Anlagen für Strom.","zh":"导弹还击中了重要的电力设施。","start":482.31,"end":486.51},{"de":"Deshalb gibt es oft viele Tage lang keinen Strom.","zh":"因此经常连续很多天没有电。","start":487.51,"end":491.59},{"de":"Und dann funktioniert auch die Heizung nicht.","zh":"那样暖气也无法使用。","start":492.8,"end":495.96},{"de":"Bald kommt aber der Winter.","zh":"但冬天很快就要来了。","start":496.91,"end":498.83},{"de":"Deshalb verlassen viele Menschen die Stadt.","zh":"所以很多人离开这座城市。","start":499.71,"end":502.91},{"de":"Dieser Mann will in Kiew bleiben.","zh":"这名男子想留在基辅。","start":504.83,"end":507.19},{"de":"Er sagt, wir bereiten uns auf den Winter vor.","zh":"他说：我们正在为过冬做准备。","start":507.67,"end":511.43},{"de":"Wir sammeln viel Holz.","zh":"我们收集了很多木头。","start":512.44,"end":514.0},{"de":"Dann können wir Feuer machen und kochen.","zh":"这样我们就能生火做饭。","start":514.64,"end":517.44},{"de":"Auch der Busfahrer will im Winter in Kiew bleiben und arbeiten.","zh":"这位公交车司机也想冬天留在基辅继续工作。","start":521.07,"end":526.03},{"de":"Er fährt seit vielen Jahren Bus in Kiew.","zh":"他在基辅开公交车已经很多年了。","start":527.32,"end":530.12},{"de":"Und das soll auch so bleiben.","zh":"今后也应如此。","start":531.03,"end":533.19},{"de":"Der Busfahrer sagt, der Krieg dauert schon fünf Jahre lang.","zh":"公交车司机说：战争已经持续五年了。","start":534.68,"end":538.84},{"de":"Wir haben uns daran gewöhnt und machen weiter.","zh":"我们已经习惯了，继续生活。","start":540.16,"end":543.36},{"de":"Auch wenn es schwer ist.","zh":"即使这很艰难。","start":543.76,"end":545.48},{"de":"Man muss ja weiterleben.","zh":"人总得继续活下去。","start":547.12,"end":548.84},{"de":"Und dann fährt er weiter.","zh":"然后他继续开车。","start":549.55,"end":551.75},{"de":"Zurück in das Zentrum von Kiew.","zh":"开回基辅市中心。","start":552.8,"end":555.0},{"de":"Und das waren unsere Nachrichten.","zh":"以上是我们的新闻。","start":557.56,"end":559.92},{"de":"Und jetzt kommt das Wetter.","zh":"接下来是天气预报。","start":578.48,"end":580.4},{"de":"Links im Westen gibt es ein wenig Sonne.","zh":"西部左边有一点阳光。","start":581.4,"end":584.2},{"de":"Sonst überall viele Wolken und Regen.","zh":"其他地方则到处是乌云和降雨。","start":584.44,"end":587.08},{"de":"Es werden 8 bis 18 Grad.","zh":"气温为8至18度。","start":587.88,"end":589.6},{"de":"Das war die tagesschau in Einfacher Sprache.","zh":"以上就是简单语言版的每日新闻。","start":592.44,"end":595.52},{"de":"Tschüss, bis zum nächsten Mal.","zh":"再见，下次见。","start":595.6,"end":597.76}],"stories":[{"title":"Willkommen zur tagesschau in Einfacher Sprache","title_zh":"欢迎收看简单语言版每日新闻","from":0,"to":3,"vocab":[],"grammar":[],"background":""},{"title":"Rente: Staat hilft jungen Menschen beim Sparen","title_zh":"退休金：国家帮助年轻人储蓄","from":4,"to":15,"vocab":[{"key":"rente","lemma":"die Rente, -n","pos":"noun","zh":"退休金","example_de":"Wenn ein Mensch alt ist, dann muss er nicht mehr arbeiten und bekommt Rente.","example_zh":"当一个人年老时，就不用再工作，并领取养老金。"},{"key":"sparen","lemma":"sparen","pos":"verb","zh":"储蓄，存钱","example_de":"Deshalb sagt die Regierung, die Menschen sollen vor der Rente Geld sparen.","example_zh":"因此政府说，人们应该在退休前存钱。"},{"key":"beschluss","lemma":"der Beschluss, -e","pos":"noun","zh":"决议，决定","example_de":"Deshalb hat sie jetzt einen Beschluss gemacht.","example_zh":"因此政府现在做出了一项决议。"},{"key":"regierung","lemma":"die Regierung, -en","pos":"noun","zh":"政府","example_de":"Deshalb sagt die Regierung, die
