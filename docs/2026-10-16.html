Geld zum Leben.","zh":"","start":98.92,"end":103.91},{"de":"Um einen Beschluss von der Regierung geht es auch in der nächsten Nachricht.","zh":"","start":106.72,"end":111.63},{"de":"Viele Menschen in Deutschland rauchen Zigaretten.","zh":"","start":116.23,"end":120.03},{"de":"So wie auf dem Foto.","zh":"","start":120.27,"end":122.27},{"de":"Wenn man Zigaretten kauft, dann bezahlt man dabei auch Steuern.","zh":"","start":123.36,"end":127.8},{"de":"Steuern sind Geld für den Staat.","zh":"","start":128.99,"end":131.55},{"de":"Jetzt hat die Regierung einen Beschluss gemacht.","zh":"","start":132.39,"end":135.59},{"de":"Die Regierung sagt, wir machen die Steuern für Zigaretten höher.","zh":"","start":136.04,"end":140.79},{"de":"D.h. Zigaretten werden teurer.","zh":"","start":141.8,"end":143.88},{"de":"Wenn die Steuern höher werden, dann bekommt der Staat mehr Geld.","zh":"","start":145.48,"end":149.8},{"de":"Der Minister für Geld, Lars Klingbeil, sagt, damit bezahlen wir z.B. die Schulden von Deutschland.","zh":"","start":151.24,"end":159.51},{"de":"Viele Menschen finden die höheren Steuern aber nicht gut.","zh":"","start":161.0,"end":165.24},{"de":"Dazu zeigen wir einen Film.","zh":"","start":165.51,"end":167.71},{"de":"Das ist Melanie Knabe.","zh":"","start":170.2,"end":171.76},{"de":"Sie hat einen kleinen Laden.","zh":"","start":172.96,"end":174.96},{"de":"Dort verkauft sie jeden Tag viele Zigaretten.","zh":"","start":176.07,"end":179.59},{"de":"Sie sagt, die höheren Steuern finde ich nicht gut.","zh":"","start":180.48,"end":184.0},{"de":"Vielleicht kaufen die Menschen dann weniger Zigaretten.","zh":"","start":184.75,"end":188.35},{"de":"Und dann verdiene ich weniger Geld.","zh":"","start":188.39,"end":191.27},{"de":"Die Regierung sagt aber, wenn die Menschen weniger rauchen, dann ist das gut für die Gesundheit.","zh":"","start":192.35,"end":200.03},{"de":"Einige Menschen finden die höheren Steuern aber auch gut.","zh":"","start":200.83,"end":205.31},{"de":"Dieser Mann sagt, Zigaretten sollen noch teurer werden.","zh":"","start":206.47,"end":210.95},{"de":"Dann kann der Staat seine Schulden bezahlen.","zh":"","start":211.88,"end":214.96},{"de":"Und außerdem ist es für die Menschen gesünder.","zh":"","start":215.8,"end":219.0},{"de":"Viele Raucher finden die höheren Steuern nicht gut.","zh":"","start":221.55,"end":225.27},{"de":"Dieser Mann sagt, wenn Zigaretten zu teuer werden, dann muss ich aufhören zu rauchen.","zh":"","start":226.6,"end":233.07},{"de":"Hören jetzt viele Menschen mit dem Rauchen auf?","zh":"","start":234.35,"end":237.63},{"de":"Das glaubt Melanie Knabe nicht.","zh":"","start":238.28,"end":240.48},{"de":"Sie sagt, die meisten Menschen rauchen bestimmt weiter.","zh":"","start":241.28,"end":245.12},{"de":"Experten sagen, seit vielen Jahren rauchen die Menschen in Deutschland weniger.","zh":"","start":246.43,"end":252.8},{"de":"Zur nächsten Nachricht.","zh":"","start":255.68,"end":257.32},{"de":"In den USA hat ein Mann in einer Schule mit einer Waffe geschossen.","zh":"","start":263.6,"end":268.71},{"de":"Die Schule ist auf dem Foto.","zh":"","start":268.75,"end":270.83},{"de":"Der junge Mann hat mehrere Menschen getötet.","zh":"","start":271.51,"end":274.67},{"de":"Auch Kinder sind dabei gestorben.","zh":"","start":275.07,"end":277.47},{"de":"Der Mann mit der Waffe ist auch tot.","zh":"","start":278.15,"end":280.67},{"de":"Warum hat der Mann geschossen, das untersucht jetzt die Polizei.","zh":"","start":281.48,"end":286.0},{"de":"Dazu zeigen wir einen Film.","zh":"","start":286.23,"end":288.31},{"de":"Die Schule ist in dem Bundesstaat Oregon.","zh":"","start":290.35,"end":293.19},{"de":"Vor der Schule stehen viele Polizisten.","zh":"","start":294.03,"end":296.83},{"de":"Sie wollen jetzt herausfinden, was genau ist in der Schule passiert.","zh":"","start":297.23,"end":302.91},{"de":"Auch die Familien von den Schülern sind da.","zh":"","start":303.87,"end":307.35},{"de":"Sie warten auf Nachrichten von ihren Kindern.","zh":"","start":308.19,"end":311.35},{"de":"Die Familien machen sich große Sorgen.","zh":"","start":311.99,"end":314.75},{"de":"Der Chef von der Polizei sagt, bei dem Angriff sind drei Kinder gestorben.","zh":"","start":316.07,"end":322.35},{"de":"Auch eine Lehrerin ist tot.","zh":"","start":323.19,"end":325.59},{"de":"Und mehrere Menschen sind verletzt.","zh":"","start":325.83,"end":328.83},{"de":"Der Mann mit der Waffe war 16 Jahre alt.","zh":"","start":329.75,"end":333.15},{"de":"Er ist auch tot.","zh":"","start":334.4,"end":335.56},{"de":"Ein Mann aus der Nachbarschaft hat ihn erschossen.","zh":"","start":336.47,"end":339.59},{"de":"Am Abend zünden die Menschen Kerzen für die Toten an.","zh":"","start":342.83,"end":346.47},{"de":"Viele fragen sich, wieso ist das passiert?","zh":"","start":347.43,"end":350.35},{"de":"Dieser Mann sagt, ich habe gerade in der Nähe gearbeitet.","zh":"","start":352.2,"end":356.2},{"de":"Dann kamen viele Polizisten.","zh":"","start":356.99,"end":359.15},{"de":"Meine Schwester hat mich angerufen und gesagt, in der Schule wird geschossen.","zh":"","start":359.19,"end":365.59},{"de":"Unserer Familie ist zum Glück nichts passiert.","zh":"","start":366.27,"end":369.47},{"de":"Aber ich bin sehr traurig über die Toten.","zh":"","start":370.27,"end":373.11},{"de":"Ich kann es einfach nicht glauben.","zh":"","start":373.67,"end":376.11},{"de":"Überall in den USA trauern die Menschen jetzt um die Toten.","zh":"","start":377.67,"end":382.47},{"de":"Und nun zur nächsten Nachricht.","zh":"","start":383.79,"end":386.55},{"de":"In Belgien ist heute ein wichtiges Treffen von der EU.","zh":"","start":391.88,"end":395.68},{"de":"Die Länder von der EU sprechen nämlich über den Krieg von Russland gegen die Ukraine.","zh":"","start":396.36,"end":402.55},{"de":"Auch der Präsident von der Ukraine, Wolodymyr Selenskyj, ist bei dem Treffen.","zh":"","start":403.48,"end":408.84},{"de":"Selenskyj ist in der Mitte auf dem Foto.","zh":"","start":409.72,"end":412.52},{"de":"Die Länder von der EU beraten, wie kann die EU der Ukraine im Krieg weiter helfen.","zh":"","start":413.24,"end":419.6},{"de":"Russland greift die Ukraine nämlich immer noch an.","zh":"","start":420.75,"end":424.59},{"de":"Besonders viele Angriffe gibt es in der Hauptstadt Kiew.","zh":"","start":425.39,"end":429.59},{"de":"Dazu zeigen wir jetzt einen Film.","zh":"","start":430.15,"end":432.51},{"de":"In Kiew fahren die Menschen nach der Arbeit mit dem Bus nach Hause.","zh":"","start":434.4,"end":439.47},{"de":"Auf dem Weg müssen sie über eine Brücke fahren.","zh":"","start":440.6,"end":443.88},{"de":"Viele haben deshalb Angst.","zh":"","start":444.24,"end":446.08},{"de":"Russland schießt nämlich oft mit Raketen auf die Brücken.","zh":"","start":447.6,"end":451.6},{"de":"So wie auf diesen Bildern.","zh":"","start":452.52,"end":454.36},{"de":"Sie sind schon älter.","zh":"","start":455.76,"end":457.28},{"de":"Ohne den Bus oder das Auto kommen viele nicht zur Arbeit.","zh":"","start":459.43,"end":463.67},{"de":"So wie diese Frau.","zh":"","start":464.76,"end":466.04},{"de":"Sie sagt, ich habe immer Angst.","zh":"","start":466.84,"end":469.04},{"de":"Es kann ja jeden Moment etwas passieren.","zh":"","start":469.76,"end":472.56},{"de":"Mit dieser Angst zu leben, ist sehr schwer.","zh":"","start":472.96,"end":475.96},{"de":"In der Nacht hat Russland Kiew wieder angegriffen.","zh":"","start":477.75,"end":481.63},{"de":"Die Raketen treffen auch wichtige Anlagen für Strom.","zh":"","start":482.31,"end":486.51},{"de":"Deshalb gibt es oft viele Tage lang keinen Strom.","zh":"","start":487.51,"end":491.59},{"de":"Und dann funktioniert auch die Heizung nicht.","zh":"","start":492.8,"end":495.96},{"de":"Bald kommt aber der Winter.","zh":"","start":496.91,"end":498.83},{"de":"Deshalb verlassen viele Menschen die Stadt.","zh":"","start":499.71,"end":502.91},{"de":"Dieser Mann will in Kiew bleiben.","zh":"","start":504.83,"end":507.19},{"de":"Er sagt, wir bereiten uns auf den Winter vor.","zh":"","start":507.67,"end":511.43},{"de":"Wir sammeln viel Holz.","zh":"","start":512.44,"end":514.0},{"de":"Dann können wir Feuer machen und kochen.","zh":"","start":514.64,"end":517.44},{"de":"Auch der Busfahrer will im Winter in Kiew bleiben und arbeiten.","zh":"","start":521.07,"end":526.03},{"de":"Er fährt seit vielen Jahren Bus in Kiew.","zh":"","start":527.32,"end":530.12},{"de":"Und das soll auch so bleiben.","zh":"","start":531.03,"end":533.19},{"de":"Der Busfahrer sagt, der Krieg dauert schon fünf Jahre lang.","zh":"","start":534.68,"end":538.84},{"de":"Wir haben uns daran gewöhnt und machen weiter.","zh":"","start":540.16,"end":543.36},{"de":"Auch wenn es schwer ist.","zh":"","start":543.76,"end":545.48},{"de":"Man muss ja weiterleben.","zh":"","start":547.12,"end":548.84},{"de":"Und dann fährt er weiter.","zh":"","start":549.55,"end":551.75},{"de":"Zurück in das Zentrum von Kiew.","zh":"","start":552.8,"end":555.0},{"de":"Und das waren unsere Nachrichten.","zh":"","start":557.56,"end":559.92},{"de":"Und jetzt kommt das Wetter.","zh":"","start":578.48,"end":580.4},{"de":"Links im Westen gibt es ein wenig Sonne.","zh":"","start":581.4,"end":584.2},{"de":"Sonst überall viele Wolken und Regen.","zh":"","start":584.44,"end":587.08},{"de":"Es werden 8 bis 18 Grad.","zh":"","start":587.88,"end":589.6},{"de":"Das war die tagesschau in Einfacher Sprache.","zh":"","start":592.44,"end":595.52},{"de":"Tschüss, bis zum nächsten Mal.","zh":"","start":595.6,"end":597.76}],"stories":[{"title":"Die Sendung","title_zh":"国家帮助年轻人储蓄 · 更高的税收：吸烟变得更贵 · 欧盟商讨对乌克兰的援助","from":0,"to":119,"vocab":[{"key":"regierung","lemma":"die Regierung, -en","pos":"Substantiv","zh":"政府","example_de":"Deshalb sagt die Regierung, die Menschen sollen vor der Rente Geld sparen.","example_zh":""},{"key":"rente","lemma":"die Rente, -n","pos":"Substantiv","zh":"退休金","example_de":"Wenn ein Mensch alt ist, dann muss er nicht mehr arbeiten und bekommt Rente.","example_zh":""},{"key":"s
