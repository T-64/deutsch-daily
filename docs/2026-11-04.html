    <div id="root"></div>
    <script id="dd-data" type="application/json">{"page":"lesson","lesson":{"slug":"2026-11-04","date":"2026-11-04","show":"tagesschau in Einfacher Sprache","level":"A2–B1","kind":"broadcast","note":"","source_url":"https://www.tagesschau.de/tagesschau_in_einfacher_sprache/tse-1494.html","video":{"mp4":"https://tagesschau-progressive.ard-mcdn.de/video/2026/1104/TV-20261104-1734-4900.webl.h264.mp4","embed":"","page":"https://www.tagesschau.de/tagesschau_in_einfacher_sprache/video-1678100.html"},"duration":473.73,"sentences":[{"de":"Willkommen zur tagesschau in Einfacher Sprache.","zh":"欢迎收看简单语言版每日新闻。","start":5.33,"end":8.21},{"de":"Ich bin Susanne Holst und das sind unsere Nachrichten.","zh":"我是苏珊娜·霍尔斯特（Susanne Holst），以下是我们的新闻。","start":8.25,"end":12.05},{"de":"Und nun zur ersten Nachricht.","zh":"现在来看第一条新闻。","start":28.73,"end":31.97},{"de":"Die Menschen in den USA haben gewählt.","zh":"美国人民已经投了票。","start":37.01,"end":39.65},{"de":"Sie haben nicht über Präsident Trump entschieden.","zh":"他们这次不是在选总统特朗普。","start":39.97,"end":43.41},{"de":"Sie haben Politiker für das Parlament gewählt.","zh":"他们选举的是议会的政治人物。","start":43.65,"end":46.85},{"de":"Das Parlament besteht aus zwei Teilen.","zh":"议会由两部分组成。","start":47.13,"end":50.41},{"de":"Dem Repräsentantenhaus und dem Senat.","zh":"分别是众议院和参议院。","start":50.61,"end":54.13},{"de":"Beide arbeiten in diesem Haus hier auf dem Foto.","zh":"两部分都在照片上的这栋建筑里工作。","start":54.69,"end":58.73},{"de":"Bisher hat die Partei von den Republikanern die Mehrheit in beiden Teilen gehabt.","zh":"到目前为止，共和党在两个部分都占多数。","start":59.61,"end":65.69},{"de":"Auch Präsident Trump ist bei den Republikanern.","zh":"特朗普总统也属于共和党。","start":66.41,"end":69.21},{"de":"Die Wahl hat aber die Partei von den Demokraten gewonnen.","zh":"但这次选举是民主党获胜了。","start":69.25,"end":73.25},{"de":"Sie haben jetzt die Mehrheit in beiden Teilen vom Parlament.","zh":"他们现在在议会的两个部分都占多数。","start":73.57,"end":77.77},{"de":"Für die Republikaner und für Trump ist das eine Niederlage.","zh":"这对共和党和特朗普来说是一次失败。","start":78.81,"end":83.09},{"de":"Die Demokraten freuen sich dagegen über den Sieg.","zh":"而民主党则为这次胜利感到高兴。","start":83.61,"end":86.93},{"de":"Dazu kommt jetzt ein Film.","zh":"现在来看一段影片。","start":86.97,"end":88.89},{"de":"Die Menschen jubeln.","zh":"人们在欢呼。","start":89.97,"end":91.81},{"de":"Sie feiern den Sieg von den Demokraten bei der Wahl.","zh":"他们在庆祝民主党在选举中获胜。","start":91.97,"end":96.01},{"de":"Dieser Mann sagt, ich bin so froh, wir haben es geschafft.","zh":"这名男子说：我太高兴了，我们做到了。","start":96.61,"end":100.93},{"de":"Und dieser Mann sagt, das haben wir gebraucht.","zh":"这名男子说：这正是我们所需要的。","start":101.73,"end":105.53},{"de":"Im Bundesstaat Texas waren viele Jahre die Republikaner vorn.","zh":"在德克萨斯州，共和党多年来一直领先。","start":106.65,"end":111.13},{"de":"Jetzt hat James Talarico von den Demokraten gewonnen.","zh":"现在民主党的詹姆斯·塔拉里科（James Talarico）获胜了。","start":111.17,"end":115.57},{"de":"Er ist künftig für Texas im US-Senat.","zh":"他今后将在美国参议院代表德克萨斯州。","start":115.93,"end":119.33},{"de":"Und er sagt, der Wahlkampf gegen die Republikaner war schwer.","zh":"他说，对抗共和党的竞选活动很艰难。","start":119.57,"end":124.33},{"de":"Sie haben sehr viel Geld dafür bekommen.","zh":"他们为此得到了非常多的钱。","start":124.53,"end":127.33},{"de":"Und trotzdem, wir haben es geschafft.","zh":"但尽管如此，我们还是做到了。","start":127.49,"end":130.41},{"de":"Auch in anderen US-Bundesstaaten haben die Demokraten Sitze im Senat gewonnen.","zh":"在美国其他州，民主党也赢得了参议院席位。","start":131.45,"end":137.61},{"de":"Und sie haben jetzt mehr Gouverneure als die Republikaner.","zh":"而且他们现在的州长比共和党多。","start":138.01,"end":142.45},{"de":"Gouverneure sind die Regierungschefs von den Bundesstaaten.","zh":"州长是各州的政府首脑。","start":142.97,"end":147.25},{"de":"Der Politik-Experte David Parker sagt, die Wahl ist eine Abstimmung über Trump und die Republikaner.","zh":"政治专家大卫·帕克（David Parker）说，这次选举是对特朗普和共和党的公投。","start":147.29,"end":156.81},{"de":"Das Ergebnis zeigt, für die Republikaner geht es nach unten.","zh":"结果显示，共和党正在走下坡路。","start":157.01,"end":162.37},{"de":"Präsident Trump hat nach der Niederlage mit dem Fernsehsender Fox News telefoniert.","zh":"总统特朗普在失败后与福克斯新闻（Fox News）电视台通了电话。","start":163.33,"end":168.77},{"de":"Und er hat gesagt, wenn mein Name auf dem Wahlzettel steht, dann passiert was so nicht.","zh":"他说：如果选票上印的是我的名字，就不会发生这样的事。","start":168.81,"end":176.45},{"de":"Trump will das Ergebnis von der Wahl akzeptieren.","zh":"特朗普表示愿意接受选举结果。","start":176.77,"end":180.73},{"de":"Und er will den Demokraten die Arbeit schwer machen.","zh":"但他想让民主党的工作变得困难。","start":180.85,"end":185.09},{"de":"Wir bleiben beim Thema.","zh":"我们继续这个话题。","start":187.13,"end":188.81},{"de":"Die USA sind sehr wichtig für die deutsche Wirtschaft.","zh":"美国对德国经济非常重要。","start":193.13,"end":196.65},{"de":"Deutsche Firmen verkaufen nämlich viele Produkte in die USA, z.B. Autos.","zh":"因为德国公司向美国销售很多产品，比如汽车。","start":196.69,"end":203.13},{"de":"Nach der Wahl in den USA haben die deutschen Firmen deshalb eine Frage.","zh":"因此，美国选举之后，德国公司有了一个问题。","start":203.65,"end":208.65},{"de":"Wie reagiert US-Präsident Trump auf die Niederlage?","zh":"美国总统特朗普会如何应对这次失败？","start":209.21,"end":212.77},{"de":"Was wird er jetzt mit den Zöllen für die Wirtschaft machen?","zh":"他现在会怎样处理经济方面的关税？","start":213.45,"end":217.05},{"de":"Zölle sind extra Geld.","zh":"关税是额外的钱。","start":217.09,"end":219.09},{"de":"Sie machen Produkte teurer.","zh":"它会让产品变得更贵。","start":219.41,"end":221.33},{"de":"Dazu kommt jetzt ein Film.","zh":"现在来看一段影片。","start":221.69,"end":223.29},{"de":"US-Präsident Trump sagt Zölle.","zh":"美国总统特朗普在说：关税。","start":223.33,"end":226.85},{"de":"Das Wort habe ich besonders gern.","zh":"这个词我特别喜欢。","start":227.41,"end":229.85},{"de":"Mit den Zöllen will Trump die Wirtschaft in den USA besser machen.","zh":"特朗普想通过关税让美国的经济变好。","start":230.37,"end":234.65},{"de":"Für deutsche Firmen bedeuten die Zölle aber mehr Kosten.","zh":"但对德国公司来说，关税意味着更高的成本。","start":235.05,"end":238.97},{"de":"Die Firmen fragen deshalb, macht Trump jetzt neue Zölle?","zh":"因此这些公司问：特朗普现在会推出新的关税吗？","start":239.41,"end":243.61},{"de":"Das kann man schwer einschätzen, meint der Experte Metin Haqverdi.","zh":"专家梅廷·哈克维尔迪（Metin Haqverdi）认为，这很难判断。","start":243.65,"end":249.81},{"de":"Er sagt, Trump ändert oft die Meinung.","zh":"他说，特朗普经常改变主意。","start":249.97,"end":253.21},{"de":"Das bleibt wahrscheinlich so, auch nach der Niederlage.","zh":"即使在这次失败之后，这种情况可能还会继续。","start":253.41,"end":257.37},{"de":"Das Thema Zölle kommt bestimmt zurück.","zh":"关税这个话题肯定会再次出现。","start":257.85,"end":260.49},{"de":"Darauf müssen wir uns einstellen.","zh":"我们必须为此做好准备。","start":261.05,"end":263.41},{"de":"Neue Zölle, das ist ein Problem für deutsche Firmen.","zh":"新关税对德国公司来说是个问题。","start":264.37,"end":268.37},{"de":"Ob Autos oder Medikamente, es gibt dann noch weniger Handel.","zh":"无论是汽车还是药品，贸易都会进一步减少。","start":268.41,"end":274.25},{"de":"Aber Trump findet die Zölle gut für die Wirtschaft in den USA.","zh":"但特朗普认为关税对美国经济有好处。","start":275.01,"end":279.37},{"de":"Schon vor Monaten hat er gesagt, wer keine Zölle will, der muss Werke in den USA bauen und hier produzieren.","zh":"几个月前他就说过：谁不想被征关税，谁就必须在美国建厂，在这里生产。","start":279.61,"end":287.97},{"de":"Der Chef von der deutschen Firma Audi hat das versprochen.","zh":"德国公司奥迪的老板已经承诺这样做。","start":288.01,"end":292.69},{"de":"Ein Autowerk in den USA.","zh":"在美国建一座汽车工厂。","start":292.93,"end":295.49},{"de":"Viele Menschen in Deutschland finden das gar nicht gut.","zh":"德国的很多人觉得这一点都不好。","start":296.17,"end":300.09},{"de":"Und nun zur nächsten Nachricht.","zh":"现在来看下一条新闻。","start":301.13,"end":303.61},{"de":"In vielen Bundesländern hat eine große Übung für eine Krise begonnen.","zh":"在许多联邦州，一场大型危机演习已经开始了。","start":308.25,"end":312.97},{"de":"Die Krise ist nicht echt.","zh":"这场危机不是真的。","start":313.49,"end":315.41},{"de":"Aber die Bundesländer wollen gut vorbereitet sein.","zh":"但各联邦州想做好充分准备。","start":315.45,"end":318.97},{"de":"Deshalb üben sie.","zh":"所以他们在进行演习。","start":319.21,"end":320.41},{"de":"Sie sagen, wir stellen uns diese Situation vor.","zh":"他们说：我们想象这样一种情况。","start":320.97,"end":324.37},{"de":"Es ist schon mehrere Jahre sehr trocken in Deutschland.","zh":"德国已经连续很多年非常干旱。","start":324.69,"end":327.85},{"de":"Und es gibt eine große Hitze.","zh":"而且出现了严重的高温。","start":327.89,"end":329.97},{"de":"Das Wasser ist knapp.","zh":"水资源短缺。","start":330.21,"end":331.61},{"de":"Die Krankenhäuser sind voll.","zh":"医院都住满了。","start":331.65,"end":333.57},{"de":"Was müssen wir tun?","zh":"我们必须做什么？","start":333.61,"end":334.97},{"de":"Wer muss mit wem sprechen, schreiben oder telefonieren?","zh":"谁必须和谁谈话、写信或通电话？","start":335.45,"end":339.29},{"de":"Wer muss entscheiden?","zh":"谁必须做决定？","start":339.45,"end":340.97},{"de":"Die Bundesländer wollen bei der Übung lernen, wie können wir noch besser zusammenarbeiten?","zh":"各联邦州想在演习中学习：我们怎样才能更好地合作？","start":341.41,"end":347.37},{"de":"Und nun zur nächsten Nachricht.","zh":"现在来看下一条新闻。","start":348.41,"end":350.97},{"de":"Hier auf dem Foto ist der Autor Janosch.","zh":"照片上这位是作家雅诺什（Janosch）。","start":355.41,"end":358.45},{"de":"Er hat viele Bücher für Kinder geschrieben.","zh":"他写了许多儿童读物。","start":358.65,"end":361.37},{"de":"Und er hat die Bücher auch gestaltet.","zh":"而且这些书也是他自己设计的。","start":361.41,"end":364.25},{"de":"Das bedeutet, er hat die Bilder dafür gemalt.","zh":"也就是说，书里的图画是他画的。","start":364.81,"end":368.05},{"de":"Janosch ist in vielen Ländern bekannt.","zh":"雅诺什在许多国家都很有名。","start":368.09,"end":371.01},{"de":"Jetzt ist er gestorben.","zh":"现在他去世了。","start":371.69,"end":373.33},{"de":"Er wurde 95 Jahre alt.","zh":"他享年95岁。","start":373.53,"end":375.57},{"de":"Über Janosch kommt jetzt ein Film.","zh":"关于雅诺什的电影马上要上映了。","start":376.45,"end":378.89},{"de":"Das ist Janosch.","zh":"这就是雅诺什。","start":379.01,"end":380.65},{"de":"Eigentlich heißt er Horst Eckert.","zh":"他的本名是霍斯特·埃克特（Horst Eckert）。","start":381.13,"end":383.65},{"de":"Janosch ist der Name als Künstler.","zh":"雅诺什是他的艺名。","start":384.33,"end":386.69},{"de":"Viele Menschen auf der Welt kennen die Bücher von Janosch.","zh":"世界上很多人都知道雅诺什的书。","start":386.73,"end":391.41},{"de":"Besonders bekannt ist die Tigerente.","zh":"最有名的是小老虎鸭。","start":391.89,"end":395.45},{"de":"Also eine Ente mit Streifen wie bei einem Tiger.","zh":"就是一只带老虎条纹的鸭子。","start":396.29,"end":399.29},{"de":"Und die Freunde Bär und Tiger.","zh":"还有熊和老虎这对朋友。","start":399.41,"end":402.33},{"de":"Janosch sagt, ich wollte ein einfaches Buch machen.","zh":"雅诺什说：我想做一本简单的书。","start":403.33,"end":407.29},{"de":"Dafür gibt es Regeln.","zh":"这有一些规则。","start":407.41,"end":408.93},{"de":"Ein netter Bär.","zh":"一只友善的熊。","start":409.29,"end":410.37},{"de":"Der Bär macht eine Reise.","zh":"这只熊去旅行。","start":410.45,"end":412.13},{"de":"Und er muss einen Freund haben.","zh":"而且它必须有一个朋友。","start":412.17,"end":414.65},{"de":"Janosch wurde in dem Land Polen geboren.","zh":"雅诺什出生在波兰。","start":415.77,"end":418.61},{"de":"Die Eltern waren sehr streng.","zh":"他的父母非常严厉。","start":419.01,"end":421.09},{"de":"Der Vater trank oft Alkohol.","zh":"父亲经常酗酒。","start":421.29,"end":423.41},{"de":"Für Janosch war Freiheit sehr wichtig.","zh":"对雅诺什来说，自由非常重要。","start":424.13,"end":427.45},{"de":"Er liebte die Einsamkeit.","zh":"他喜爱孤独。","start":428.21,"end":430.09},{"de":"Auf der spanischen Insel Teneriffa lebte er deshalb gern.","zh":"因此他喜欢住在西班牙的特内里费岛上。","start":430.53,"end":434.73},{"de":"Bis zum Tod.","zh":"一直到去世。","start":435.33,"end":436.85},{"de":"Und das waren unsere Nachrichten.","zh":"以上就是我们的新闻。","start":439.25,"end":441.41},{"de":"Und jetzt kommt das Wetter.","zh":"现在播报天气预报。","start":457.89,"end":459.81},{"de":"Zuerst ist es wolkig.","zh":"起初是多云。","start":460.49,"end":462.17},{"de":"Später scheint in vielen Gebieten die Sonne.","zh":"稍后许多地区会出太阳。","start":462.29,"end":464.93},{"de":"Es werden 4 bis 13 Grad.","zh":"气温是4到13度。","start":464.97,"end":467.29},{"de":"Das war die tagesschau in Einfacher Sprache.","zh":"以上就是简单语言版的每日新闻（tagesschau in Einfacher Sprache）。","start":468.85,"end":471.53},{"de":"Tschüss, bis zum nächsten Mal.","zh":"再见，下次
