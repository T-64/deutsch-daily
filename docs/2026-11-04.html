    <script id="dd-data" type="application/json">{"page":"lesson","lesson":{"slug":"2026-11-04","date":"2026-11-04","show":"tagesschau in Einfacher Sprache","level":"A2–B1","kind":"broadcast","note":"","source_url":"https://www.tagesschau.de/tagesschau_in_einfacher_sprache/tse-1494.html","video":{"mp4":"https://tagesschau-progressive.ard-mcdn.de/video/2026/1104/TV-20261104-1734-4900.webl.h264.mp4","embed":"","page":"https://www.tagesschau.de/tagesschau_in_einfacher_sprache/video-1678100.html"},"duration":476.75,"sentences":[{"de":"Willkommen zur tagesschau in Einfacher Sprache.","zh":"欢迎收看简易新闻。","start":8.33,"end":11.21},{"de":"Ich bin Susanne Holst und das sind unsere Nachrichten.","zh":"我是Susanne Holst，以下是我们的新闻。","start":11.27,"end":15.07},{"de":"Und nun zur ersten Nachricht.","zh":"现在来看第一条新闻。","start":31.75,"end":34.99},{"de":"Die Menschen in den USA haben gewählt.","zh":"美国民众进行了投票。","start":40.03,"end":42.67},{"de":"Sie haben nicht über Präsident Trump entschieden.","zh":"他们这次不是选举特朗普总统。","start":42.99,"end":46.43},{"de":"Sie haben Politiker für das Parlament gewählt.","zh":"他们选举的是议会议员。","start":46.67,"end":49.87},{"de":"Das Parlament besteht aus zwei Teilen.","zh":"议会由两部分组成。","start":50.15,"end":53.43},{"de":"Dem Repräsentantenhaus und dem Senat.","zh":"分别是众议院和参议院。","start":53.63,"end":57.15},{"de":"Beide arbeiten in diesem Haus hier auf dem Foto.","zh":"照片上这栋建筑就是他们工作的地方。","start":57.71,"end":61.75},{"de":"Bisher hat die Partei von den Republikanern die Mehrheit in beiden Teilen gehabt.","zh":"此前，共和党在两个部分都占多数。","start":62.63,"end":68.71},{"de":"Auch Präsident Trump ist bei den Republikanern.","zh":"特朗普总统也属于共和党。","start":69.43,"end":72.23},{"de":"Die Wahl hat aber die Partei von den Demokraten gewonnen.","zh":"但这次选举是民主党赢了。","start":72.27,"end":76.27},{"de":"Sie haben jetzt die Mehrheit in beiden Teilen vom Parlament.","zh":"他们现在在议会的两个部分都占多数。","start":76.59,"end":80.79},{"de":"Für die Republikaner und für Trump ist das eine Niederlage.","zh":"这对共和党和特朗普来说是一次失败。","start":81.83,"end":86.11},{"de":"Die Demokraten freuen sich dagegen über den Sieg.","zh":"而民主党则为这次胜利感到高兴。","start":86.63,"end":89.95},{"de":"Dazu kommt jetzt ein Film.","zh":"现在来看一段影片。","start":89.99,"end":91.91},{"de":"Die Menschen jubeln.","zh":"人们欢呼雀跃。","start":92.99,"end":94.83},{"de":"Sie feiern den Sieg von den Demokraten bei der Wahl.","zh":"他们庆祝民主党在选举中获胜。","start":94.99,"end":99.03},{"de":"Dieser Mann sagt, ich bin so froh, wir haben es geschafft.","zh":"这位男子说：我太高兴了，我们做到了。","start":99.63,"end":103.95},{"de":"Und dieser Mann sagt, das haben wir gebraucht.","zh":"这位男子说：这正是我们需要的。","start":104.75,"end":108.55},{"de":"Im Bundesstaat Texas waren viele Jahre die Republikaner vorn.","zh":"在德克萨斯州，多年来都是共和党领先。","start":109.67,"end":114.15},{"de":"Jetzt hat James Talarico von den Demokraten gewonnen.","zh":"现在民主党的James Talarico获胜了。","start":114.19,"end":118.59},{"de":"Er ist künftig für Texas im US-Senat.","zh":"他今后将在美国参议院代表德克萨斯州。","start":118.95,"end":122.35},{"de":"Und er sagt, der Wahlkampf gegen die Republikaner war schwer.","zh":"他说，与共和党的竞选非常艰难。","start":122.59,"end":127.35},{"de":"Sie haben sehr viel Geld dafür bekommen.","zh":"他们为此得到了很多钱。","start":127.55,"end":130.35},{"de":"Und trotzdem, wir haben es geschafft.","zh":"尽管如此，我们还是做到了。","start":130.51,"end":133.43},{"de":"Auch in anderen US-Bundesstaaten haben die Demokraten Sitze im Senat gewonnen.","zh":"在其他美国州，民主党也赢得了参议院席位。","start":134.47,"end":140.63},{"de":"Und sie haben jetzt mehr Gouverneure als die Republikaner.","zh":"而且他们现在的州长比共和党多。","start":141.03,"end":145.47},{"de":"Gouverneure sind die Regierungschefs von den Bundesstaaten.","zh":"州长是各州的政府首脑。","start":145.99,"end":150.27},{"de":"Der Politik-Experte David Parker sagt, die Wahl ist eine Abstimmung über Trump und die Republikaner.","zh":"政治专家David Parker说，这次选举是对特朗普和共和党的一次表决。","start":150.31,"end":159.83},{"de":"Das Ergebnis zeigt, für die Republikaner geht es nach unten.","zh":"结果显示，共和党的支持率在下降。","start":160.03,"end":165.39},{"de":"Präsident Trump hat nach der Niederlage mit dem Fernsehsender Fox News telefoniert.","zh":"总统特朗普在失败后与福克斯新闻电视台通了电话。","start":166.35,"end":171.79},{"de":"Und er hat gesagt, wenn mein Name auf dem Wahlzettel steht, dann passiert was so nicht.","zh":"他说：如果选票上有我的名字，就不会发生这样的事。","start":171.83,"end":179.47},{"de":"Trump will das Ergebnis von der Wahl akzeptieren.","zh":"特朗普愿意接受选举结果。","start":179.79,"end":183.75},{"de":"Und er will den Demokraten die Arbeit schwer machen.","zh":"但他想让民主党的日子不好过。","start":183.87,"end":188.11},{"de":"Wir bleiben beim Thema.","zh":"我们继续这个话题。","start":190.13,"end":191.81},{"de":"Die USA sind sehr wichtig für die deutsche Wirtschaft.","zh":"美国对德国经济非常重要。","start":196.15,"end":199.67},{"de":"Deutsche Firmen verkaufen nämlich viele Produkte in die USA, z.B. Autos.","zh":"因为德国公司向美国销售很多产品，比如汽车。","start":199.71,"end":206.15},{"de":"Nach der Wahl in den USA haben die deutschen Firmen deshalb eine Frage.","zh":"因此，在美国选举之后，德国公司有一个问题。","start":206.67,"end":211.67},{"de":"Wie reagiert US-Präsident Trump auf die Niederlage?","zh":"美国总统特朗普会如何应对这次失败？","start":212.23,"end":215.79},{"de":"Was wird er jetzt mit den Zöllen für die Wirtschaft machen?","zh":"他现在会对经济关税做什么？","start":216.47,"end":220.07},{"de":"Zölle sind extra Geld.","zh":"关税是额外的钱。","start":220.11,"end":222.11},{"de":"Sie machen Produkte teurer.","zh":"它会让产品变得更贵。","start":222.43,"end":224.35},{"de":"Dazu kommt jetzt ein Film.","zh":"现在来看一段影片。","start":224.69,"end":226.29},{"de":"US-Präsident Trump sagt Zölle.","zh":"美国总统特朗普说：关税。","start":226.35,"end":229.87},{"de":"Das Wort habe ich besonders gern.","zh":"这个词我特别喜欢。","start":230.43,"end":232.87},{"de":"Mit den Zöllen will Trump die Wirtschaft in den USA besser machen.","zh":"特朗普想用关税让美国经济变好。","start":233.39,"end":237.67},{"de":"Für deutsche Firmen bedeuten die Zölle aber mehr Kosten.","zh":"但对德国公司来说，关税意味着更多成本。","start":238.07,"end":241.99},{"de":"Die Firmen fragen deshalb, macht Trump jetzt neue Zölle?","zh":"因此公司们在问：特朗普现在会推出新关税吗？","start":242.43,"end":246.63},{"de":"Das kann man schwer einschätzen, meint der Experte Metin Haqverdi.","zh":"专家Metin Haqverdi认为，这很难判断。","start":246.67,"end":252.83},{"de":"Er sagt, Trump ändert oft die Meinung.","zh":"他说，特朗普经常改变主意。","start":252.99,"end":256.23},{"de":"Das bleibt wahrscheinlich so, auch nach der Niederlage.","zh":"即使失败了，这一点可能也不会变。","start":256.43,"end":260.39},{"de":"Das Thema Zölle kommt bestimmt zurück.","zh":"关税这个话题肯定会回来。","start":260.87,"end":263.51},{"de":"Darauf müssen wir uns einstellen.","zh":"我们必须为此做好准备。","start":264.07,"end":266.43},{"de":"Neue Zölle, das ist ein Problem für deutsche Firmen.","zh":"新关税对德国公司来说是个问题。","start":267.39,"end":271.39},{"de":"Ob Autos oder Medikamente, es gibt dann noch weniger Handel.","zh":"无论是汽车还是药品，贸易都会进一步减少。","start":271.43,"end":277.27},{"de":"Aber Trump findet die Zölle gut für die Wirtschaft in den USA.","zh":"但特朗普认为关税对美国经济有好处。","start":278.03,"end":282.39},{"de":"Schon vor Monaten hat er gesagt, wer keine Zölle will, der muss Werke in den USA bauen und hier produzieren.","zh":"几个月前他就说过：谁不想交关税，就必须在美国建厂，在这里生产。","start":282.63,"end":290.99},{"de":"Der Chef von der deutschen Firma Audi hat das versprochen.","zh":"德国公司奥迪的老板已经承诺了这一点。","start":291.03,"end":295.71},{"de":"Ein Autowerk in den USA.","zh":"在美国建一座汽车厂。","start":295.95,"end":298.51},{"de":"Viele Menschen in Deutschland finden das gar nicht gut.","zh":"德国很多人觉得这一点都不好。","start":299.19,"end":303.11},{"de":"Und nun zur nächsten Nachricht.","zh":"现在来看下一条新闻。","start":304.15,"end":306.63},{"de":"In vielen Bundesländern hat eine große Übung für eine Krise begonnen.","zh":"在许多联邦州，一场大型危机演练已经开始。","start":311.27,"end":315.99},{"de":"Die Krise ist nicht echt.","zh":"这场危机不是真的。","start":316.51,"end":318.43},{"de":"Aber die Bundesländer wollen gut vorbereitet sein.","zh":"但各联邦州想做好充分准备。","start":318.47,"end":321.99},{"de":"Deshalb üben sie.","zh":"所以他们在进行演练。","start":322.23,"end":323.43},{"de":"Sie sagen, wir stellen uns diese Situation vor.","zh":"他们说：我们设想这样一种情况。","start":323.99,"end":327.39},{"de":"Es ist schon mehrere Jahre sehr trocken in Deutschland.","zh":"德国已经连续很多年非常干旱。","start":327.71,"end":330.87},{"de":"Und es gibt eine große Hitze.","zh":"而且天气酷热。","start":330.91,"end":332.99},{"de":"Das Wasser ist knapp.","zh":"水资源短缺。","start":333.23,"end":334.63},{"de":"Die Krankenhäuser sind voll.","zh":"医院都满了。","start":334.67,"end":336.59},{"de":"Was müssen wir tun?","zh":"我们必须做什么？","start":336.63,"end":337.99},{"de":"Wer muss mit wem sprechen, schreiben oder telefonieren?","zh":"谁必须和谁交谈、写信或打电话？","start":338.47,"end":342.31},{"de":"Wer muss entscheiden?","zh":"谁来作决定？","start":342.47,"end":343.99},{"de":"Die Bundesländer wollen bei der Übung lernen, wie können wir noch besser zusammenarbeiten?","zh":"各联邦州想在演练中学习：我们怎样才能更好地合作？","start":344.43,"end":350.39},{"de":"Und nun zur nächsten Nachricht.","zh":"现在来看下一条新闻。","start":351.43,"end":353.99},{"de":"Hier auf dem Foto ist der Autor Janosch.","zh":"照片上这位是作家雅诺什（Janosch）。","start":358.43,"end":361.47},{"de":"Er hat viele Bücher für Kinder geschrieben.","zh":"他写了许多儿童读物。","start":361.67,"end":364.39},{"de":"Und er hat die Bücher auch gestaltet.","zh":"而且他还亲自设计了这些书。","start":364.43,"end":367.27},{"de":"Das bedeutet, er hat die Bilder dafür gemalt.","zh":"也就是说，书里的画是他画的。","start":367.83,"end":371.07},{"de":"Janosch ist in vielen Ländern bekannt.","zh":"雅诺什在许多国家都很有名。","start":371.11,"end":374.03},{"de":"Jetzt ist er gestorben.","zh":"现在他去世了。","start":374.71,"end":376.35},{"de":"Er wurde 95 Jahre alt.","zh":"他享年95岁。","start":376.55,"end":378.59},{"de":"Über Janosch kommt jetzt ein Film.","zh":"接下来将播出一部关于雅诺什的影片。","start":379.47,"end":381.91},{"de":"Das ist Janosch.","zh":"这就是雅诺什。","start":382.03,"end":383.67},{"de":"Eigentlich heißt er Horst Eckert.","zh":"他的本名叫霍斯特·埃克特（Horst Eckert）。","start":384.15,"end":386.67},{"de":"Janosch ist der Name als Künstler.","zh":"雅诺什是他的艺名。","start":387.35,"end":389.71},{"de":"Viele Menschen auf der Welt kennen die Bücher von Janosch.","zh":"世界上很多人都知道雅诺什的书。","start":389.75,"end":394.43},{"de":"Besonders bekannt ist die Tigerente.","zh":"最有名的是小老虎鸭。","start":394.91,"end":398.47},{"de":"Also eine Ente mit Streifen wie bei einem Tiger.","zh":"就是一只有老虎那样条纹的鸭子。","start":399.31,"end":402.31},{"de":"Und die Freunde Bär und Tiger.","zh":"还有小熊和小老虎这对朋友。","start":402.43,"end":405.35},{"de":"Janosch sagt, ich wollte ein einfaches Buch machen.","zh":"雅诺什说：我想做一本简单的书。","start":406.35,"end":410.31},{"de":"Dafür gibt es Regeln.","zh":"这有一些规则。","start":410.43,"end":411.95},{"de":"Ein netter Bär.","zh":"一只友好的小熊。","start":412.31,"end":413.39},{"de":"Der Bär macht eine Reise.","zh":"小熊去旅行。","start":413.47,"end":415.15},{"de":"Und er muss einen Freund haben.","zh":"而且它必须有一个朋友。","start":415.19,"end":417.67},{"de":"Janosch wurde in dem Land Polen geboren.","zh":"雅诺什出生在波兰。","start":418.79,"end":421.63},{"de":"Die Eltern waren sehr streng.","zh":"他的父母非常严厉。","start":422.03,"end":424.11},{"de":"Der Vater trank oft Alkohol.","zh":"父亲经常酗酒。","start":424.31,"end":426.43},{"de":"Für Janosch war Freiheit sehr wichtig.","zh":"对雅诺什来说，自由非常重要。","start":427.15,"end":430.47},{"de":"Er liebte die Einsamkeit.","zh":"他喜欢独处。","start":431.23,"end":433.11},{"de":"Auf der spanischen Insel Teneriffa lebte er deshalb gern.","zh":"因此他很乐意住在西班牙的特内里费岛上。","start":433.55,"end":437.75},{"de":"Bis zum Tod.","zh":"直到去世。","start":438.35,"end":439.87},{"de":"Und das waren unsere Nachrichten.","zh":"以上就是我们的新闻。","start":442.27,"end":444.43},{"de":"Und jetzt kommt das Wetter.","zh":"现在播报天气。","start":460.91,"end":462.83},{"de":"Zuerst ist es wolkig.","zh":"起初天上有云。","start":463.51,"end":465.19},{"de":"Später scheint in vielen Gebieten die Sonne.","zh":"晚些时候许多地区会出太阳。","start":465.29,"end":467.93},{"de":"Es werden 4 bis 13 Grad.","zh":"气温为4到13度。","start":467.99,"end":470.31},{"de":"Das war die tagesschau in Einfacher Sprache.","zh":"以上就是简单语言版的每日新闻（tagesschau in Einfacher Sprache）。","start":471.87,"end":474.55},{"de":"Tschüss, bis zum nächsten Mal.","zh":"再见，下次见。","start":474.59,"end":476.75}],"stories":[{"title":"Begrüßung","title_zh":"欢迎","fr
