    <script id="dd-data" type="application/json">{"page":"lesson","lesson":{"slug":"2026-11-02","date":"2026-11-02","show":"tagesschau in Einfacher Sprache","level":"A2–B1","kind":"broadcast","note":"","source_url":"https://www.tagesschau.de/tagesschau_in_einfacher_sprache/tse-1502.html","video":{"mp4":"https://tagesschau-progressive.ard-mcdn.de/video/2026/1102/TV-20261102-1741-3200.webl.h264.mp4","embed":"","page":"https://www.tagesschau.de/tagesschau_in_einfacher_sprache/video-1676756.html"},"duration":520.7,"sentences":[{"de":"Willkommen zur tagesschau in Einfacher Sprache.","zh":"欢迎收看简易新闻《tagesschau》。","start":12.94,"end":15.94},{"de":"Ich bin Susanne Holst und das sind unsere Nachrichten.","zh":"我是Susanne Holst，以下是我们的新闻。","start":16.02,"end":19.82},{"de":"Gipfeltreffen.","zh":"峰会。","start":19.94,"end":20.94},{"de":"Was kann Künstliche Intelligenz?","zh":"人工智能能做什么？","start":20.98,"end":23.22},{"de":"Berlin.","zh":"柏林。","start":23.9,"end":24.9},{"de":"Parteien reden über gemeinsame Regierung.","zh":"各政党商谈联合执政。","start":24.98,"end":27.82},{"de":"Frankfurt am Main.","zh":"美因河畔法兰克福。","start":28.54,"end":29.9},{"de":"Ärger über Gewalt.","zh":"对暴力的愤怒。","start":29.98,"end":31.26},{"de":"Streit um Geld.","zh":"金钱之争。","start":31.9,"end":32.98},{"de":"Mitarbeiter streiten.","zh":"员工罢工。","start":33.34,"end":34.86},{"de":"Und nun zur 1. Nachricht.","zh":"现在来看第一条新闻。","start":36.86,"end":38.74},{"de":"Gipfeltreffen.","zh":"峰会。","start":39.34,"end":40.34},{"de":"Was kann künstliche Intelligenz?","zh":"人工智能能做什么？","start":40.54,"end":42.82},{"de":"Auf dem Foto ist Carsten Wildberger.","zh":"照片上的人是Carsten Wildberger。","start":44.18,"end":47.26},{"de":"Er ist Minister in der Bundesregierung.","zh":"他是联邦政府的部长。","start":47.66,"end":50.38},{"de":"Wildberger hat viele Politiker und wichtige Experten aus der Wirtschaft und der Wissenschaft zu einem Gipfeltreffen eingeladen.","zh":"Wildberger邀请了许多政界人士以及经济界和科学界的重要专家参加一次峰会。","start":51.02,"end":59.54},{"de":"+Die Politiker und die Experten wollen über die Chancen von künstlicher Intelligenz in Deutschland reden.","zh":"政界人士和专家们想讨论人工智能在德国带来的机遇。","start":59.7,"end":66.7},{"de":"Künstliche Intelligenz, kurz KI, nennt man sehr schnelle Computerprogramme.","zh":"人工智能（简称KI）指的是非常快速的计算机程序。","start":67.1,"end":73.14},{"de":"KI kann Probleme viel schneller lösen als normale Computerprogramme.","zh":"人工智能比普通计算机程序解决问题快得多。","start":73.58,"end":78.38},{"de":"Die Stadt Nettetal im Westen von Deutschland hat sich eine eigene KI gebaut.","zh":"德国西部的内特塔尔市开发了自己的人工智能。","start":79.18,"end":84.62},{"de":"Mit der KI können die Behörden von Nettetal z.B.","zh":"借助这个人工智能，内特塔尔的政府部门可以例如","start":85.3,"end":89.22},{"de":"Anträge von Bürgern schnell und sicher bearbeiten.","zh":"快速而安全地处理市民的申请。","start":89.86,"end":93.38},{"de":"Das ist das Rathaus von der Stadt Nettetal.","zh":"这是内特塔尔市的市政厅。","start":94.54,"end":97.7},{"de":"Im Rathaus sind viele Behörden.","zh":"市政厅里有许多政府部门。","start":97.94,"end":100.14},{"de":"Es gibt auch ein digitales Amt.","zh":"这里还有一个数字政务办公室。","start":100.42,"end":103.1},{"de":"Diese Menschen haben das digitale Amt entwickelt.","zh":"这些人开发了数字政务办公室。","start":103.86,"end":107.3},{"de":"Stefanie Minden sagt:","zh":"Stefanie Minden说：","start":107.42,"end":109.02},{"de":"Die Bürger können im digitalen Amt viele Anträge mit dem Handy oder dem Computer stellen.","zh":"市民可以通过手机或电脑在数字政务办公室提交许多申请。","start":109.34,"end":115.66},{"de":"Sie können das zu Hause machen und müssen nicht mehr ins Rathaus kommen.","zh":"他们可以在家里办理，不必再亲自来市政厅。","start":116.06,"end":120.7},{"de":"Die Bürger können z.B. Wohngeld beantragen.","zh":"市民可以申请例如住房补贴。","start":120.86,"end":124.3},{"de":"Sie können alle Unterlagen mit einer App an das Amt schicken.","zh":"他们可以通过一个应用程序把所有材料发送给政府部门。","start":124.5,"end":128.3},{"de":"Der Stadt ist wichtig, dass das Computerprogramm sicher ist.","zh":"这个计算机程序的安全性对这座城市很重要。","start":128.94,"end":133.14},{"de":"Thorsten Rohde leitet die Computerabteilung vom Rathaus.","zh":"Thorsten Rohde负责市政厅的计算机部门。","start":133.58,"end":137.18},{"de":"Er sagt:","zh":"他说：","start":137.62,"end":138.66},{"de":"Wir wollen nicht, dass die Daten von den Bürgern in die USA gehen.","zh":"我们不希望市民的数据传到美国去。","start":138.74,"end":143.26},{"de":"Dann haben wir keine Kontrolle mehr über die Daten.","zh":"否则我们就无法再控制这些数据了。","start":143.42,"end":146.98},{"de":"Das Rathaus hat eine eigene künstliche Intelligenz.","zh":"市政厅有自己的人工智能。","start":147.1,"end":150.9},{"de":"Mit der KI können die Mitarbeiter besonders wichtige Dokumente sicher bearbeiten.","zh":"借助这个人工智能，工作人员可以安全地处理特别重要的文件。","start":151.38,"end":157.26},{"de":"Thorsten Rohde sagt: Wenn wir mit unserer eigenen KI arbeiten, dann bleiben alle Daten im Rathaus.","zh":"Thorsten Rohde说：如果我们用自己的人工智能工作，那么所有数据都留在市政厅里。","start":158.22,"end":165.18},{"de":"Der Server steht nämlich im Keller.","zh":"因为服务器就放在地下室里。","start":165.5,"end":168.02},{"de":"Die Stadt Nettetal hat sich vorgenommen:","zh":"内特塔尔市已经决定：","start":168.18,"end":170.66},{"de":"Die Bürger sollen bald noch mehr Anträge von zu Hause stellen können.","zh":"市民很快应该能在家里提交更多的申请。","start":170.86,"end":175.58},{"de":"Und nun zur nächsten Nachricht.","zh":"现在来看下一条新闻。","start":177.22,"end":179.42},{"de":"Berlin.","zh":"柏林。","start":179.54,"end":180.54},{"de":"Parteien reden über gemeinsame Regierung.","zh":"各政党商谈联合执政。","start":180.7,"end":183.54},{"de":"Auf dem Foto sind Politikerinnen von den Parteien SPD, Linkspartei und Die Grünen in Berlin.","zh":"照片上是柏林社民党、左翼党和绿党的女政治家们。","start":184.46,"end":191.74},{"de":"Die Frau in der Mitte ist Elif Eralp von der Linkspartei.","zh":"中间那位是左翼党的Elif Eralp。","start":192.54,"end":195.78},{"de":"Die Linkspartei hat vor einigen Wochen die Wahl für das Parlament von Berlin gewonnen.","zh":"左翼党几周前赢得了柏林议会选举。","start":196.82,"end":202.34},{"de":"Die Partei hat aber nicht genug Stimmen, um allein zu regieren.","zh":"但该党没有足够的票数单独执政。","start":202.86,"end":207.5},{"de":"Linkspartei, SPD und Die Grünen haben deshalb beschlossen:","zh":"因此左翼党、社民党和绿党决定：","start":208.14,"end":212.22},{"de":"Wir wollen gemeinsam regieren.","zh":"我们要联合执政。","start":212.98,"end":215.14},{"de":"Dazu kommt ein Film.","zh":"接下来请看一段影片。","start":215.7,"end":217.14},{"de":"Politiker von den Parteien reden jetzt darüber:","zh":"这些政党的政治家们现在正在讨论：","start":217.98,"end":221.06},{"de":"Wie wollen wir gemeinsam regieren?","zh":"我们要如何联合执政？","start":221.7,"end":224.22},{"de":"Was wollen wir in Berlin ändern?","zh":"我们想在柏林改变什么？","start":224.58,"end":226.86},{"de":"Die Gespräche werden mehrere Wochen dauern.","zh":"这些会谈将持续数周。","start":227.54,"end":230.74},{"de":"Am Ende wollen die Parteien einen Vertrag über eine gemeinsame Regierung unterschreiben.","zh":"最后，各政党想签署一份联合执政协议。","start":231.22,"end":237.14},{"de":"Wenn alles klappt, dann wird Elif Eralp Bürgermeisterin von Berlin.","zh":"如果一切顺利，Elif Eralp将成为柏林市长。","start":237.18,"end":241.94},{"de":"Sie wäre die erste Berliner Bürgermeisterin von der Linkspartei.","zh":"她将是第一位来自左翼党的柏林女市长。","start":242.58,"end":247.46},{"de":"Nun zur nächsten Nachricht.","zh":"现在来看下一条新闻。","start":249.5,"end":251.34},{"de":"Frankfurt am Main: Ärger über Gewalt.","zh":"法兰克福：对暴力行为感到愤怒。","start":251.42,"end":254.06},{"de":"Eine kaputte Fensterscheibe.","zh":"一块被打碎的橱窗玻璃。","start":254.86,"end":256.86},{"de":"So wie auf dem Foto sahen in der Stadt Frankfurt am Main am Wochenende die Schaufenster von mehreren Geschäften aus.","zh":"周末，法兰克福市多家商店的橱窗就是照片上这个样子。","start":257.26,"end":264.82},{"de":"Randalierer haben die Scheiben eingeschlagen.","zh":"闹事者砸碎了玻璃。","start":265.34,"end":268.22},{"de":"Die Randalierer haben auch Sachen aus den Geschäften geklaut und Polizisten angegriffen.","zh":"闹事者还从商店里偷东西，并袭击警察。","start":268.26,"end":274.46},{"de":"Darüber gibt es jetzt viel Ärger.","zh":"现在这件事引起了很多愤怒。","start":274.86,"end":276.94},{"de":"Viele Politiker sagen:","zh":"许多政客说：","start":278.02,"end":279.66},{"de":"Wir dürfen die Gewalt nicht akzeptieren.","zh":"我们不能接受这种暴力。","start":280.26,"end":282.9},{"de":"Die Randalierer müssen hart bestraft werden.","zh":"闹事者必须受到严厉惩罚。","start":283.02,"end":286.1},{"de":"Bevor die Randalierer unterwegs waren, gab es in Frankfurt am Main und in anderen Städten Demonstrationen.","zh":"在闹事者出动之前，法兰克福和其他城市曾举行示威活动。","start":286.7,"end":294.22},{"de":"Tausende junge Menschen haben für mehr Geld, für Bildung, mehr Klimaschutz und bezahlbare Mieten demonstriert.","zh":"数千名年轻人为更多的钱、为教育、更多的气候保护和负担得起的房租举行了示威。","start":294.86,"end":303.18},{"de":"Einige Politiker sagen:","zh":"一些政客说：","start":304.18,"end":305.82},{"de":"Die Randalierer haben die Demonstrationen ausgenutzt, um danach Krawalle zu machen.","zh":"闹事者利用了这些示威活动，之后制造了骚乱。","start":306.22,"end":312.7},{"de":"Dazu zeigen wir einen Film.","zh":"为此我们播放一段影片。","start":313.3,"end":315.22},{"de":"So sieht die Innenstadt von Frankfurt am Sonntag aus.","zh":"这是周日法兰克福市中心的样子。","start":316.14,"end":319.78},{"de":"Besitzer von Geschäften schrauben Platten aus Holz vor zerstörte Schaufenster.","zh":"商店老板正在用木板封住被砸坏的橱窗。","start":320.18,"end":325.58},{"de":"Randalierer sind am Abend durch die Innenstadt gezogen.","zh":"闹事者晚上穿过市中心。","start":326.1,"end":329.54},{"de":"Sie haben Polizisten angegriffen, Schaufenster eingeschlagen und Sachen geklaut.","zh":"他们袭击警察、砸碎橱窗并偷窃物品。","start":330.1,"end":335.58},{"de":"Dieser Besitzer von einem Geschäft sagt:","zh":"这位商店老板说：","start":336.98,"end":339.74},{"de":"Die Polizei hat mich angerufen.","zh":"警察给我打了电话。","start":339.98,"end":342.06},{"de":"Randalierer haben viele Schuhe gestohlen.","zh":"闹事者偷走了很多鞋。","start":342.3,"end":345.14},{"de":"Ich bin dann die ganze Nacht hier geblieben und habe aufgepasst.","zh":"然后我整夜都待在这里看守。","start":345.42,"end":349.94},{"de":"Das ist Alexander Dobrindt.","zh":"这是亚历山大·多布林特。","start":351.34,"end":353.38},{"de":"Er ist von der Partei CSU und Innenminister von Deutschland.","zh":"他来自基社盟，是德国内政部长。","start":353.46,"end":357.78},{"de":"Dobrindt sagt: Was hier passiert ist, das muss bestraft werden.","zh":"多布林特说：这里发生的事情必须受到惩罚。","start":358.66,"end":363.5},{"de":"Wir finden heraus, wer die Randalierer sind.","zh":"我们会查出闹事者是谁。","start":363.9,"end":366.7},{"de":"Einige Randalierer sind sogar gefilmt worden, als sie Sachen geklaut haben.","zh":"一些闹事者偷东西时甚至被拍了下来。","start":366.98,"end":371.9},{"de":"Ich erwarte, dass es harte Strafen gibt.","zh":"我期望会有严厉的惩罚。","start":371.94,"end":375.1},{"de":"Auch die Politikerin Sonja Eichwede von der Partei SPD sagt:","zh":"来自社民党的政治家索尼娅·艾希维德也说：","start":377.26,"end":381.38},{"de":"Wir akzeptieren keine Gewalt und keine Straftaten.","zh":"我们不接受暴力和犯罪行为。","start":382.26,"end":386.14},{"de":"Das ist klar.","zh":"这一点很明确。","start":386.26,"end":387.34},{"de":"Franziska Brantner ist von der Partei Die Grünen.","zh":"弗兰齐斯卡·布兰特纳来自绿党。","start":388.5,"end":391.94},{"de":"Brantner sagt:","zh":"布兰特纳说：","start":392.42,"end":393.54},{"de":"Wir dürfen wegen der Gewalt nicht die jungen Menschen vergessen.","zh":"我们不能因为暴力事件而忘记这些年轻人。","start":393.9,"end":398.1},{"de":"Sie haben demonstriert, weil sie eine bessere Politik für junge Menschen wollen.","zh":"他们举行示威，是因为他们希望有对年轻人更好的政策。","start":398.14,"end":403.7},{"de":"Und nun zur nächsten Nachricht.","zh":"现在来看下一条新闻。","start":405.14,"end":407.34},{"de":"Streit um Geld.","zh":"关于钱的争议。","start":407.46,"end":408.74},{"de":"Mitarbeiter streiken.","zh":"员工们在罢工。","start":409.14,"end":410.66},{"de":"Auf dem Foto ist eine Fabrik für Autos.","zh":"照片上是一家汽车工厂。","start":411.5,"end":415.06},{"de":"Viele Menschen in Deutschland arbeiten in Fabriken für Autos oder Fabriken für Maschinen.","zh":"德国许多人在汽车工厂或机器制造厂工作。","start":415.78,"end":422.3},{"de":"Die Chefs von den Fabriken, die Arbeitgeber und die Mitarbeiter reden gerade über Geld.","zh":"工厂的老板们、雇主和员工目前正在谈钱的问题。","start":422.98,"end":430.58},{"de":"Sie reden darüber, wie viel Lohn die Mitarbeiter in Zukunft bekommen.","zh":"他们商谈员工今后能得到多少工资。","start":430.9,"end":435.78},{"de":"Das nennt man Tarifverhandlungen.","zh":"这被称为劳资谈判。","start":436.5,"end":439.78},{"de":"Bei den Tarifverhandlungen gibt es aber Streit.","zh":"但劳资谈判中存在争议。","start":439.98,"end":443.26},{"de":"Die Arbeitgeber wollen nämlich nicht so viel Lohn zahlen, wie die Mitarbeiter fordern.","zh":"因为雇主不想按员工要求的数额支付工资。","start":443.42,"end":449.22},{"de":"Deshalb gibt es jetzt einen Warnstreik.","zh":"所以现在举行警告性罢工。","start":449.46,"end":452.18},{"de":"Das heißt:","zh":"意思是：","start":452.46,"end":453.46},{"de":"Die Mitarbeitenden in vielen Fabriken arbeiten nicht.","zh":"许多工厂的员工停止工作。","start":453.5,"end":457.34},{"de":"Dazu jetzt ein Film.","zh":"现在请看一段影片。","start":457.46,"end":458.86},{"de":"Z.B. die Mitarbeiter von dieser Fabrik in Bayern im Süden von Deutschland streiken.","zh":"比如德国南部巴伐利亚州这家工厂的员工在罢工。","start":459.66,"end":465.94},{"de":"Die Gewerkschaft IG Metall hat zu dem Streik aufgerufen.","zh":"五金工会号召举行了这次罢工。","start":466.62,"end":470.58},{"de":"Die Mitarbeiter reden nicht selbst mit den Arbeitgebern über Geld.","zh":"员工们不亲自和雇主谈钱的问题。","start":471.26,"end":475.54},{"de":"Die Gewerkschaft IG Metall macht das für alle Mitarbeiter in der Metallindustrie.","zh":"五金工会代表金属行业的所有员工进行谈判。","start":476.14,"end":481.06},{"de":"Das waren unsere Nachrichten.","zh":"以上是我们的新闻。","start":483.26,"end":485.58},{"de":"Gipfeltreffen: Was kann Künstliche Intelligenz?","zh":"峰会：人工智能能做什么？","start":485.74,"end":489.02},{"de":"Berlin: Parteien reden über gemeinsame Regierung.","zh":"柏林：各政党商谈联合执政。","start":489.42,"end":492.86},{"de":"Frankfurt am Main: Ärger über Gewalt.","zh":"法兰克福：对暴力行为感到愤怒。","start":493.26,"end":495.9},{"de":"Streit um Geld: Mitarbeiter streiken.","zh":"关于钱的争议：员工罢工。","start":496.58,"end":499.58},{"de":"Und jetzt kommt das Wetter.","zh":"现在播报天气。","start":501.34,"end":503.26},{"de":"Vom Westen bis in die Mitte, freundliches Herbstwetter.","zh":"从西部到中部，秋高气爽的好天气。","start":503.7,"end":507.54},{"de":"Sonst eher grau und wolkig mit etwas Regen.","zh":"其他地方多为阴天和多云，有小雨。","start":507.78,"end":511.3},{"de":"3 bis 12 Grad.","zh":"气温3到12度。","start":511.54,"end":512.7},{"de":"Das war die tagesschau in Einfacher Sprache.","zh":"以上就是简单语言版tagesschau新闻。","start":515.38,"end":518.46},{"de":
