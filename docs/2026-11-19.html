    <div id="root"></div>
    <script id="dd-data" type="application/json">{"page":"lesson","lesson":{"slug":"2026-11-19","date":"2026-11-19","show":"tagesschau in Einfacher Sprache","level":"A2–B1","kind":"broadcast","note":"","source_url":"https://www.tagesschau.de/tagesschau_in_einfacher_sprache/tse-1516.html","video":{"mp4":"https://tagesschau-progressive.ard-mcdn.de/video/2026/1119/TV-20261119-1735-3500.webl.h264.mp4","embed":"","page":"https://www.tagesschau.de/tagesschau_in_einfacher_sprache/video-1686588.html"},"duration":511.16,"sentences":[{"de":"Willkommen zur tagesschau in Einfacher Sprache.","zh":"欢迎收看简易版每日新闻。","start":10.12,"end":13.28},{"de":"Ich bin Susanne Stichler und das sind unsere Nachrichten:","zh":"我是苏珊娜·施蒂希勒，以下是我们的新闻：","start":13.37,"end":17.37},{"de":"Und nun zur ersten Nachricht.","zh":"现在来看第一条新闻。","start":39.2,"end":41.28},{"de":"In China gab es ein wichtiges Treffen.","zh":"在中国举行了一场重要会晤。","start":47.68,"end":50.8},{"de":"Von dem Präsidenten von Russland, Wladimir Putin, dem Präsidenten von China, Xi Jinping, und dem Präsidenten von den USA, Donald Trump.","zh":"参加者是俄罗斯总统弗拉基米尔·普京、中国国家主席习近平和美国总统唐纳德·特朗普。","start":50.88,"end":63.28},{"de":"Sie sind auf dem Foto.","zh":"他们在照片上。","start":64.05,"end":66.01},{"de":"Vorher gab es nie ein solches Treffen von den Präsidenten aus den drei Ländern.","zh":"此前从来没有过这三个国家总统之间的这样的会晤。","start":66.44,"end":73.25},{"de":"Sie haben sehr viel Macht.","zh":"他们拥有很大的权力。","start":73.57,"end":76.25},{"de":"Das Treffen ist deshalb wichtig für die ganze Welt.","zh":"因此这次会晤对全世界都很重要。","start":76.72,"end":80.28},{"de":"Putin, Xi und Trump haben über den Krieg von Russland gegen die Ukraine gesprochen.","zh":"普京、习近平和特朗普谈到了俄罗斯对乌克兰的战争。","start":81.32,"end":87.88},{"de":"Russland greift die Ukraine nämlich seit Jahren an.","zh":"因为俄罗斯多年来一直在攻击乌克兰。","start":89.6,"end":93.16},{"de":"Zu dem Treffen kommt jetzt ein Film.","zh":"现在播送一段关于这次会晤的影片。","start":94.4,"end":96.96},{"de":"Trump ist für das Treffen nach China gekommen.","zh":"特朗普为参加会晤来到了中国。","start":97.88,"end":101.08},{"de":"Mit Putin gab es eine freundliche Begrüßung.","zh":"他与普京进行了友好的问候。","start":101.81,"end":105.89},{"de":"Putin führt Krieg gegen die Ukraine und will keine Kompromisse machen.","zh":"普京正在对乌克兰发动战争，而且不愿做出妥协。","start":106.04,"end":110.96},{"de":"Aber bei dem Treffen soll es um Frieden auf der Welt gehen, heißt es.","zh":"据说，这次会晤的主题应该是世界和平。","start":111.2,"end":116.72},{"de":"Xi sagt, das hier ist ein historisches Treffen.","zh":"习说，这是一次历史性的会晤。","start":117.45,"end":121.69},{"de":"Es ist sehr wichtig.","zh":"这非常重要。","start":121.84,"end":123.28},{"de":"Xi will Russland und den USA näher kommen und zusammen mächtiger werden.","zh":"习想让俄罗斯和美国互相靠近，并一起变得更强大。","start":124.33,"end":130.05},{"de":"Putin sagt, wir haben ähnliche Interessen.","zh":"普京说：我们有相似的利益。","start":130.61,"end":134.01},{"de":"Wir wollen Konflikte beenden, auch den mit der Ukraine.","zh":"我们想结束冲突，包括与乌克兰的冲突。","start":134.21,"end":138.05},{"de":"Aber Putin will immer wieder Gebiete von der Ukraine.","zh":"但普京一再想要乌克兰的领土。","start":138.32,"end":142.16},{"de":"Die Ukraine und Europa wollen mit Russland verhandeln.","zh":"乌克兰和欧洲想与俄罗斯谈判。","start":142.24,"end":146.04},{"de":"Und Trump widerspricht Putin bei dem Treffen nicht.","zh":"而特朗普在会晤中没有反驳普京。","start":146.13,"end":150.69},{"de":"Er kritisiert aber ein internationales Gericht.","zh":"但他批评了一个国际法庭。","start":150.93,"end":154.93},{"de":"Es will nämlich, dass Putin wegen Verbrechen gegen die Ukraine festgenommen wird.","zh":"因为这个法庭希望因普京对乌克兰的罪行将他逮捕。","start":155.16,"end":161.61},{"de":"Trump sagt, wir sollten unsere Länder schützen vor dem Gericht.","zh":"特朗普说：我们应该保护我们的国家，不受这个法庭的影响。","start":162.13,"end":167.49},{"de":"Das Treffen hat nicht so lange gedauert.","zh":"这次会晤持续的时间不长。","start":167.96,"end":171.48},{"de":"ach den Gesprächen sagte Putin, er will mit der Ukraine und Europa über den Krieg sprechen.","zh":"会谈之后，普京表示他愿意与乌克兰和欧洲谈论这场战争。","start":171.56,"end":179.44},{"de":"Und nun zur nächsten Nachricht.","zh":"现在来看下一条新闻。","start":181.73,"end":183.93},{"de":"Auch in Berlin sprechen heute wichtige Politiker über den Krieg von Russland gegen die Ukraine.","zh":"今天在柏林，重要的政治人物也在谈论俄罗斯对乌克兰的战争。","start":187.85,"end":194.73},{"de":"Auf dem Foto ist Bundeskanzler Friedrich Merz mit dem ukrainischen Präsidenten Wolodymyr Selenskyj.","zh":"照片上是联邦总理弗里德里希·默茨和乌克兰总统弗拉基米尔·泽连斯基。","start":195.12,"end":203.08},{"de":"Merz hat Selenskyj und die Chefs von vielen anderen Ländern zu dem Treffen eingeladen.","zh":"默茨邀请了泽连斯基以及许多其他国家的领导人参加会晤。","start":204.08,"end":211.17},{"de":"Dazu kommt jetzt ein Film.","zh":"现在播送一段相关影片。","start":211.32,"end":213.16},{"de":"Bundeskanzler Merz begrüßt den französischen Präsidenten Macron.","zh":"联邦总理默茨迎接法国总统马克龙。","start":213.97,"end":218.53},{"de":"Gemeinsam mit den anderen Ländern wollen sie zeigen, wir sind stark.","zh":"他们想与其他国家一起表明：我们是强大的。","start":218.92,"end":223.72},{"de":"Und wir helfen der Ukraine.","zh":"而且我们帮助乌克兰。","start":224.41,"end":227.21},{"de":"Es geht zum Beispiel um Waffen für den Kampf gegen Russland.","zh":"例如涉及用于对抗俄罗斯的武器。","start":227.73,"end":232.85},{"de":"Und um Sicherheit für die Ukraine für die Zeit nach dem Krieg.","zh":"以及战争结束后乌克兰的安全保障。","start":233.13,"end":238.37},{"de":"Und nun zur nächsten Nachricht.","zh":"现在来看下一条新闻。","start":239.52,"end":241.72},{"de":"Ein Hacker-Angriff ist ein Angriff über das Internet auf einen oder mehrere Computer.","zh":"黑客攻击是通过互联网对一个或多个计算机发动的攻击。","start":247.28,"end":254.81},{"de":"Die Angreifer klauen Daten oder ändern Funktionen von Computern.","zh":"攻击者窃取数据或改变计算机的功能。","start":255.33,"end":261.21},{"de":"Zuletzt gab es Hacker-Angriffe auf die Computer von Supermärkten.","zh":"最近发生了针对超市计算机的黑客攻击。","start":261.6,"end":266.56},{"de":"Sie steuern die Kühlschränke für die Lebensmittel.","zh":"这些计算机控制存放食品的冰箱。","start":269.04,"end":272.56},{"de":"Die Angreifer haben die Kühlschränke von kalt auf warm gestellt.","zh":"攻击者把冰箱从冷调成了暖。","start":273.29,"end":278.97},{"de":"Viele Supermärkte mussten deshalb Lebensmittel wegwerfen.","zh":"因此许多超市不得不把食品扔掉。","start":279.56,"end":284.08},{"de":"Die Bundesregierung sagt jetzt, die Gefahr durch Hacker-Angriffe ist zuletzt gestiegen.","zh":"联邦政府现在表示，黑客攻击带来的危险最近上升了。","start":284.81,"end":291.88},{"de":"Viele Angreifer benutzen nämlich künstliche Intelligenz.","zh":"因为许多攻击者使用人工智能。","start":291.96,"end":296.64},{"de":"Damit sind Maschinen schlau und können denken und lernen.","zh":"人工智能让机器变得聪明，能够思考和 learning 学习。","start":297.93,"end":303.17},{"de":"Deshalb finden sie besonders gut Schwächen von fremden Computern für die Hackerangriffe.","zh":"因此它们特别擅长为黑客找到其他计算机的弱点。","start":303.96,"end":310.88},{"de":"Das zuständige Ministerium will jetzt wichtige Computer besser schützen.","zh":"主管部门现在想更好地保护重要的计算机。","start":312.2,"end":317.28},{"de":"Und nun zur nächsten Nachricht.","zh":"现在来看下一条新闻。","start":320.08,"end":322.28},{"de":"Videospiele kann man mit bestimmten Computern auf dem Fernseher spielen.","zh":"可以用特定的计算机在电视上玩电子游戏。","start":328.0,"end":333.73},{"de":"Mit einem Controller, wie auf dem Foto, bewegt man die Figuren in dem Spiel.","zh":"用照片上的这种手柄，可以操控游戏里的人物。","start":334.09,"end":339.84},{"de":"Seit Jahren haben Fans auf das Videospiel GTA 6 gewartet.","zh":"多年来，粉丝们一直在等待电子游戏《GTA 6》。","start":340.88,"end":345.48},{"de":"Jetzt kann man es spielen.","zh":"现在可以玩了。","start":347.24,"end":349.08},{"de":"GTA ist kurz für Grand Theft Auto.","zh":"GTA是Grand Theft Auto的缩写。","start":349.84,"end":352.68},{"de":"Das ist Englisch und heißt: schwerer Diebstahl von Autos.","zh":"这是英语，意思是：严重的汽车盗窃。","start":353.52,"end":358.28},{"de":"In dem Spiel geht es um ein kriminelles Paar, Lucia und Jason.","zh":"游戏讲的是一对犯罪情侣：露西亚和杰森。","start":360.09,"end":365.28},{"de":"Es gibt auch Gewalt.","zh":"游戏中也有暴力。","start":365.88,"end":367.6},{"de":"Das Videospiel ist deshalb nur für Erwachsene.","zh":"因此这款电子游戏只适合成年人。","start":368.56,"end":372.32},{"de":"Zu dem Start von GTA 6 kommt jetzt ein Film.","zh":"在《GTA 6》发售之际，现在播送一段影片。","start":373.53,"end":377.01},{"de":"Im Bundesstaat Florida in den USA freuen sich viele besonders über das neue Videospiel.","zh":"在美国佛罗里达州，许多人尤其为这款新电子游戏感到高兴。","start":378.16,"end":385.76},{"de":"Die erfundene Stadt in GTA 6, Vice City, sieht nämlich aus wie Florida.","zh":"因为《GTA 6》里虚构的城市“罪恶城”看起来就像佛罗里达。","start":386.44,"end":392.76},{"de":"Diese Frau sagt, ich habe alle GTA-Spiele gespielt.","zh":"这位女士说：所有GTA游戏我都玩过。","start":394.92,"end":398.76},{"de":"Ich komme nicht von hier, ich wollte aber gerne hier den Start feiern.","zh":"我不是本地人，但我很想在这里庆祝发售。","start":400.16,"end":405.21},{"de":"Jahrelang haben sich Fans auf das Spiel gefreut.","zh":"粉丝们多年来一直期待着这款游戏。","start":406.72,"end":410.32},{"de":"Wie hier in Irland haben sie sich jetzt getroffen und spielen zum Start zusammen.","zh":"就像在爱尔兰这里，他们现在聚在一起，在发售时一起玩。","start":410.93,"end":417.41},{"de":"Auch in Argentinien wird GTA 6 gefeiert.","zh":"在阿根廷，人们也在庆祝《GTA 6》。","start":418.96,"end":422.24},{"de":"Dieser Mann sagt, ich warte schon so lange.","zh":"这位男士说：我已经等了那么久。","start":424.04,"end":427.28},{"de":"Und jetzt ist das Videospiel noch besser, als ich erwartet habe.","zh":"现在这款电子游戏比我预期的还要好。","start":427.56,"end":432.08},{"de":"Aber es gibt in dem Spiel auch Gewalt, zum Beispiel mit Waffen.","zh":"但游戏中也有暴力，比如使用武器。","start":433.21,"end":437.41},{"de":"Dieser Forscher sagt, bei den GTA-Spielen muss man sich nicht an Regeln und Gesetze halten.","zh":"这位研究人员说：在GTA游戏里，人不必遵守规则和法律。","start":437.52,"end":444.48},{"de":"Man kann in der erfundenen Welt machen, was man will.","zh":"在这个虚构的世界里，想做什么就可以做什么。","start":445.4,"end":449.2},{"de":"Und wenn man im Videospiel kriminelle Dinge tut, dann bekommt man dafür keine Strafe.","zh":"而且在电子游戏里做犯罪的事情，不会受到惩罚。","start":449.44,"end":455.52},{"de":"Experten sind deshalb besorgt:","zh":"因此专家们感到担忧：","start":456.88,"end":459.04},{"de":"Die Videospiele mit Gewalt, wie GTA 6, könnten vor allem jüngeren Menschen schaden.","zh":"像《GTA 6》这样含暴力的电子游戏，可能会对年轻人造成伤害。","start":459.32,"end":465.88},{"de":"Das waren unsere Nachrichten.","zh":"以上就是我们的新闻。","start":467.44,"end":469.52},{"de":"Und jetzt kommt das Wetter.","zh":"现在来看天气预报。","start":488.25,"end":490.17},{"de":"In der Mitte von Deutschland zum Teil länger Regen.","zh":"德国中部部分地区有较长时间的降雨。","start":490.77,"end":494.45},{"de":"Unten im Süden ebenfalls viele Wolken mit Schauern.","zh":"南部同样多云，有阵雨。","start":494.6,"end":498.16},{"de":"Oben im Norden zum Teil sonnig.","zh":"北部部分地区晴朗。","start":498.8,"end":501.0},{"de":"Es werden 4 bis 13 Grad.","zh":"气温为4到13度。","start":501.8,"end":503.84},{"de":"Das war die tagesschau in Einfacher Sprache.","zh":"以上就是简易版每日新闻。","start":505.76,"end":508.72},{"de":"Tschüss und bis zum nächsten Mal.","zh":"再见，下次见。","start":508.8,"end":511.16}],"stories":[{"title":"Begrüßung","title_zh":"欢迎","from":0,"to":2,"vocab":[],"grammar":[],"background":""},{"title":"Dreiergipfel in Shenzhen","title_zh":"深圳三方峰会","from":3,"to":28,"vocab":[{"key":"treffen","lemma":"das Treffen, -","pos":"Substantiv","zh":"会晤","example_de":"In China gab es ein wichtiges Treffen.","example_zh":"在中国举行了一场重要会晤。"},{"key":"macht","lemma":"die Macht","pos":"Substantiv","zh":"权力","example_de":"Sie haben sehr viel Macht.","example_zh":"他们拥有很大的权力。"},{"key":"krieg","lemma":"der Krieg, -e","pos":"Substantiv","zh":"战争","example_de":"Putin, Xi und Trump haben über den Krieg von Russland gegen die Ukraine gesprochen.","example_zh":"普京、习近平和特朗普谈到了俄罗斯对乌克兰的战争。"},{"key":"kompromiss","lemma":"der Kompromiss, -e","pos":"Substantiv","zh":"妥协","example_de":"Putin führt Krieg gegen die Ukraine und will keine Kompromisse machen.","example_zh":"普京正在对乌克兰发动战争，而且不愿做出妥协。"},{"key":"verhandeln","lemma":"verhandeln","pos":"Verb","zh":"谈判","example_de":"Die Ukraine und Europa wollen mit Russland verhandeln.","example_zh":"乌克兰和欧洲想与俄罗斯谈判。"}],"grammar":[{"title":"现在完成时","summary":"第9句 'haben ... gesprochen' 用 haben + 过去分词表示已完成的动作，相当于中文“谈过了”。","example_de":"Putin, Xi und Trump haben über den Krieg von Russland gegen die Ukraine gesprochen.","example_zh":"普京、习近平和特朗普谈到了俄罗斯对乌克兰的战争。"}],"background":""},{"title":"Treffen in Berlin über den U
