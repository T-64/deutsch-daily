<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Deutsch Daily — 2026-08-30</title>
<style>
  :root {
    --bg: #eef2f0;
    --surface: #ffffff;
    --surface-2: #f7f9f8;
    --ink: #172127;
    --ink-soft: #647077;
    --line: #dce4e1;
    --accent: #176b72;
    --accent-strong: #0d5057;
    --accent-soft: #dceeed;
    --warm: #d98f39;
    --warm-soft: #fff0d9;
    --zh: #5f696f;
    --danger: #b3493f;
    --shadow: 0 18px 50px rgba(20, 46, 47, .10);
    --shadow-soft: 0 8px 24px rgba(20, 46, 47, .07);
  }
  [data-theme="dark"] {
    --bg: #111719; --surface: #192124; --surface-2: #202a2d;
    --ink: #edf3f1; --ink-soft: #a9b7b8; --line: #344145;
    --accent: #75cbd0; --accent-strong: #99dfe2; --accent-soft: #223e40;
    --warm: #f0b35e; --warm-soft: #3b3022; --zh: #bac5c5;
    --shadow: 0 18px 50px rgba(0,0,0,.28); --shadow-soft: 0 8px 24px rgba(0,0,0,.22);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { scroll-behavior: smooth; scroll-padding-top: 90px; }
  body {
    min-height: 100vh; background: var(--bg); color: var(--ink);
    font: 16px/1.65 Inter, ui-sans-serif, system-ui, -apple-system, "Noto Sans SC", sans-serif;
    transition: background .2s, color .2s;
  }
  button, input, textarea { font: inherit; }
  button, a { -webkit-tap-highlight-color: transparent; }
  button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible {
    outline: 3px solid color-mix(in srgb, var(--accent) 35%, transparent); outline-offset: 2px;
  }
  .app { width: min(1280px, calc(100% - 48px)); margin: 0 auto; padding: 24px 0 100px; }
  .topbar {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    min-height: 42px; margin-bottom: 34px;
  }
  .brand {
    display: inline-flex; align-items: center; gap: 10px; color: var(--ink);
    font-weight: 800; letter-spacing: -.02em; text-decoration: none;
  }
  .brand-mark {
    display: grid; place-items: center; width: 30px; height: 30px; border-radius: 9px;
    background: var(--accent); color: #fff; font: 800 12px/1 ui-monospace, monospace;
  }
  .top-actions { display: flex; align-items: center; gap: 8px; }
  .icon-btn, .archive-link, .text-btn {
    min-height: 38px; border: 1px solid var(--line); border-radius: 12px;
    background: var(--surface); color: var(--ink-soft); cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; text-decoration: none;
  }
  .icon-btn { width: 38px; }
  .archive-link, .text-btn { gap: 7px; padding: 0 13px; font-size: 13px; font-weight: 700; }
  .hero { margin-bottom: 26px; }
  .eyebrow {
    color: var(--accent); font-size: 12px; font-weight: 800; letter-spacing: .12em;
    text-transform: uppercase; margin-bottom: 9px;
  }
  .hero h1 {
    max-width: 720px; font: 750 clamp(29px, 4vw, 50px)/1.08 ui-serif, Georgia, serif;
    letter-spacing: -.04em;
  }
  .hero-meta { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 13px; color: var(--ink-soft); font-size: 14px; }
  .hero-meta span { display: inline-flex; align-items: center; gap: 7px; }

  .study-grid { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: clamp(20px, 3.2vw, 48px); align-items: start; }
  .side {
    position: sticky; top: 16px; max-height: calc(100vh - 24px);
    display: flex; flex-direction: column; min-height: 0;
  }
  .study-panel {
    display: flex; flex-direction: column; gap: 16px; min-height: 0; max-height: calc(100vh - 24px);
    background: transparent; border: 0; box-shadow: none; overflow: visible;
  }
  .video-card {
    position: relative; flex: 0 0 auto; overflow: hidden; background: #071012;
    border-radius: 24px; box-shadow: var(--shadow-soft);
  }
  .player { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #071012; }
  .player iframe, .player video { position: absolute; inset: 0; display: block; width: 100%; height: 100%; border: 0; background: #071012; }
  .video-drag {
    display: none; position: absolute; z-index: 3; top: 0; left: 0; right: 36px; height: 32px;
    cursor: grab; touch-action: none;
    background: linear-gradient(to bottom, rgba(0,0,0,.5), transparent);
  }
  .video-drag:active { cursor: grabbing; }
  .video-float-close {
    display: none; border: 0; background: rgba(255,255,255,.14); color: #fff;
    width: 28px; height: 28px; border-radius: 50%; cursor: pointer;
  }
  .rail {
    display: flex; flex-direction: column; flex: 1; min-height: 0;
    padding: 18px 18px 16px; border: 1px solid var(--line); border-radius: 24px;
    background: var(--surface); box-shadow: var(--shadow-soft); overflow: hidden;
  }
  .rail-bar { padding: 0 0 12px; }
  .controls { display: flex; width: 100%; }
  .controls button {
    flex: 1; min-height: 40px; padding: 0 14px; border: 1px solid var(--line); border-radius: 12px;
    background: var(--surface-2); color: var(--ink-soft); cursor: pointer; font-size: 14px; font-weight: 750;
  }
  .controls button.on { border-color: var(--accent); background: var(--accent); color: #fff; }
  .hero-meta a { color: var(--accent); text-decoration: none; font-weight: 700; }
  .hero-meta a:hover { text-decoration: underline; }
  .topic-nav { flex: 1; min-height: 0; overflow-y: auto; padding: 0; scrollbar-gutter: stable; }
  .topic { border-top: 1px solid var(--line); }
  .topic:first-child { border-top: 0; }
  .topic > a {
    display: grid; grid-template-columns: 32px minmax(0,1fr); gap: 10px; align-items: start;
    padding: 11px 0; color: var(--ink); text-decoration: none;
  }
  .topic > a span {
    min-width: 0; padding-top: 5px;
    font: 650 15px/1.35 ui-serif, Georgia, serif; letter-spacing: -.015em;
  }
  .topic > a:hover span { color: var(--accent); }
  .topic b {
    display: grid; place-items: center; width: 32px; height: 32px; border-radius: 10px;
    background: var(--accent-soft); color: var(--accent-strong);
    font: 800 11px/1 ui-monospace, monospace;
  }
  .topic.on b { background: var(--accent); color: #fff; }
  .topic.on > a span { color: var(--accent-strong); }
  .topic-study { display: none; padding: 0 0 12px; }
  .topic.on .topic-study { display: block; }
  .topic-study .empty-study { color: var(--ink-soft); font-size: 13px; padding: 6px 0; }
  .study-tabs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-top: 2px; }
  .study-tabs.n2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .study-tabs.n1 { grid-template-columns: 1fr; }
  .stab {
    min-height: 32px; padding: 0 6px; border: 1px solid var(--line); border-radius: 11px;
    background: var(--surface-2); color: var(--ink-soft); cursor: pointer;
    font-size: 12px; font-weight: 750;
  }
  .stab:hover { border-color: var(--accent); color: var(--accent-strong); }
  .stab.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-strong); }
  .spane { display: none; margin-top: 6px; }
  .spane.on { display: block; }
  .vrow {
    display: grid; grid-template-columns: minmax(0,1fr) 28px; gap: 8px; align-items: start;
    padding: 10px 0; border-top: 1px dashed var(--line);
  }
  .vrow .vw { color: var(--ink); font: 750 14.5px/1.35 ui-serif, Georgia, serif; }
  .vrow .vz { margin-top: 4px; color: var(--accent-strong); font-size: 13.5px; }
  .vrow .vex { margin-top: 6px; color: var(--ink-soft); font-size: 13px; font-style: italic; }
  .vadd {
    width: 28px; height: 28px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--surface); color: var(--accent-strong); cursor: pointer;
    font: 700 18px/1 ui-sans-serif, system-ui;
  }
  .vadd:hover { border-color: var(--accent); background: var(--accent-soft); }
  .rail-note { margin: 0; padding: 10px 0; color: var(--ink-soft); font-size: 13.5px; line-height: 1.7; }
  .rail-note + .rail-note { border-top: 1px dashed var(--line); }
  .rail-note strong { display: block; margin-bottom: 4px; color: var(--ink); font: 750 14.5px/1.35 ui-serif, Georgia, serif; }
  .rail-note i { display: block; margin-bottom: 6px; }
  @media (min-width: 841px) { .article-extras { display: none; } }

  .reader { min-width: 0; }
  .first-run {
    display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 16px; align-items: start;
    margin-bottom: 16px; padding: 16px 18px; border: 1px solid var(--line); border-radius: 16px;
    background: var(--accent-soft); color: var(--ink-soft); font-size: 13.5px;
  }
  .first-run[hidden] { display: none; }
  .first-run strong { display: block; margin-bottom: 3px; color: var(--accent-strong); }
  .first-run button { border: 0; background: transparent; color: var(--ink-soft); cursor: pointer; font-weight: 800; }
  .legend { color: var(--ink-soft); }
  article {
    scroll-margin-top: 24px; margin-bottom: 22px; padding: clamp(22px, 4vw, 38px);
    border: 1px solid var(--line); border-radius: 24px; background: var(--surface);
    box-shadow: var(--shadow-soft);
  }
  .n-head { display: grid; grid-template-columns: 42px minmax(0,1fr); gap: 13px; align-items: start; margin-bottom: 24px; }
  .n-idx {
    display: grid; place-items: center; width: 42px; height: 42px; border-radius: 13px;
    background: var(--accent-soft); color: var(--accent-strong); font: 800 13px/1 ui-monospace, monospace;
  }
  .n-head h2, .h-zh {
    padding-top: 3px;
    color: var(--ink);
    font: 750 clamp(21px, 3vw, 28px)/1.25 ui-serif, Georgia, "Noto Serif CJK SC", "Noto Serif SC", serif;
    letter-spacing: -.025em;
  }
  .h-zh { margin-top: 6px; padding-top: 0; }
  .para { display: flex; flex-direction: column; align-items: stretch; margin-bottom: 22px; }
  .para:last-child { margin-bottom: 8px; }
  .sent {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    width: 100%;
    min-width: 0;
    margin: 0 0 0.8em;
  }
  .sent[data-start] { cursor: pointer; }
  .de {
    max-width: 100%;
    font: var(--reader-size, 18.5px)/1.55 ui-serif, Georgia, "Noto Serif", serif;
    letter-spacing: .003em;
  }
  .de w {
    cursor: pointer; border-radius: 4px; transition: background .12s, color .12s;
    text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px;
    text-decoration-color: transparent;
  }
  .de w:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; background: var(--accent-soft); }
  .de w:hover, .de w:active { background: var(--warm-soft); text-decoration-color: var(--warm); }
  .de w.known { text-decoration-color: color-mix(in srgb, var(--accent) 55%, transparent); }
  .de w.ed { text-decoration-style: solid; text-decoration-thickness: 1.5px; }
  .de w.wiki { text-decoration-style: dotted; text-decoration-color: color-mix(in srgb, var(--ink-soft) 55%, transparent); }
  .de w.saved { color: var(--accent-strong); background: var(--accent-soft); text-decoration-color: transparent; }
  .sent.now .de {
    background: color-mix(in srgb, var(--accent-soft) 70%, transparent);
    border-radius: 4px;
  }
  .zh {
    margin-top: 3px;
    width: 100%;
    max-width: 100%;
    color: var(--ink);
    font: 400 15.5px/1.45 Inter, ui-sans-serif, "Noto Sans SC", sans-serif;
  }
  body.hide-zh .zh { display: none; }
  body.hide-zh .para { display: block; }
  body.hide-zh .sent { display: inline; width: auto; margin: 0 0.45em 0 0; }
  body.hide-zh .sent .de { display: inline; line-height: 1.82; }
  .n-head .h-zh {
    margin-top: 6px;
    padding-top: 0;
    color: var(--ink);
    font: 750 clamp(21px, 3vw, 28px)/1.25 ui-serif, Georgia, "Noto Serif CJK SC", "Noto Serif SC", serif;
    letter-spacing: -.025em;
  }
  .article-extras details { margin-top: 10px; border: 1px solid var(--line); border-radius: 13px; background: var(--surface-2); }
  .article-extras details summary {
    list-style: none; cursor: pointer; padding: 12px 14px; color: var(--ink-soft);
    display: flex; align-items: center; gap: 9px; font-size: 13px; font-weight: 750;
  }
  .article-extras details summary::before {
    content: "+"; display: inline-grid; place-items: center; width: 20px; height: 20px;
    border-radius: 7px; background: var(--surface); color: var(--accent); font-size: 14px;
  }
  .article-extras details[open] summary::before { content: "−"; }
  .article-extras details summary::-webkit-details-marker { display: none; }
  .article-extras details .body { padding: 2px 14px 15px 43px; color: var(--ink-soft); font-size: 13.5px; line-height: 1.75; }
  .article-extras details .body strong { color: var(--ink); }
  .vcard { display: grid; grid-template-columns: minmax(0,1fr) 28px; gap: 8px; align-items: start; padding: 10px 0; border-bottom: 1px dashed var(--line); }
  .vcard:last-child { border-bottom: 0; }
  .gcard { padding: 12px 0; border-bottom: 1px dashed var(--line); }
  .gcard:last-child { border-bottom: 0; }
  .vcard-top, .gcard h4 { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px; font: 750 14.5px/1.35 ui-serif, Georgia, serif; color: var(--ink); }
  .article-extras .vadd {
    width: 28px; height: 28px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--surface); color: var(--accent-strong); cursor: pointer;
    font: 700 18px/1 ui-sans-serif, system-ui;
  }
  .vpos { color: var(--ink-soft); font: 750 11px/1.2 ui-sans-serif, system-ui; letter-spacing: .06em; text-transform: uppercase; }
  .vzh { margin-top: 4px; color: var(--accent-strong); font-size: 13.5px; }
  .vex, .gex { margin-top: 6px; color: var(--ink-soft); font-size: 13px; font-style: italic; }
  .gexzh { color: var(--zh); font-size: 12.5px; }
  .gmore { margin-top: 8px; color: var(--ink-soft); font-size: 13px; }
  .bg-note { margin: 0 0 8px; color: var(--ink-soft); font-size: 12px; }

  .scrim { position: fixed; inset: 0; z-index: 55; display: none; background: rgba(7,16,18,.48); backdrop-filter: blur(3px); }
  .scrim.on { display: block; }
  #pop {
    position: fixed; z-index: 70; display: none; width: min(360px, calc(100vw - 24px));
    border: 1px solid var(--line); border-radius: 18px; padding: 18px;
    background: var(--surface); color: var(--ink); box-shadow: var(--shadow);
  }
  #pop.open { display: block; }
  .pop-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  #pop .pw { font: 750 21px/1.2 ui-serif, Georgia, serif; word-break: break-word; }
  #pop .pp { margin-top: 3px; color: var(--ink-soft); font-size: 11px; font-weight: 750; letter-spacing: .08em; text-transform: uppercase; }
  #pop .pclose { border: 0; background: var(--surface-2); color: var(--ink-soft); width: 30px; height: 30px; border-radius: 9px; cursor: pointer; }
  #pop .pz { margin-top: 12px; color: var(--accent-strong); font-weight: 700; }
  #pop .pz:empty::after { content: "还没有释义，你可以自己补充"; color: var(--ink-soft); font-weight: 400; }
  #pop .pe { margin-top: 9px; padding-top: 9px; border-top: 1px solid var(--line); color: var(--ink-soft); font-size: 12.5px; font-style: italic; }
  .pop-actions { display: flex; gap: 8px; margin-top: 14px; }
  .pbtn, .secondary-btn, .primary-btn {
    min-height: 40px; border-radius: 11px; padding: 0 13px; cursor: pointer; font-size: 13px; font-weight: 750;
  }
  .pbtn { flex: 1; border: 1px solid var(--accent); background: var(--accent); color: #fff; }
  .pbtn.in { border-color: var(--line); background: var(--surface-2); color: var(--ink-soft); }
  .secondary-btn { border: 1px solid var(--line); background: var(--surface); color: var(--ink-soft); }
  .primary-btn { border: 1px solid var(--accent); background: var(--accent); color: #fff; }
  .word-form { display: grid; gap: 11px; }
  .word-form label { display: grid; gap: 5px; color: var(--ink-soft); font-size: 12px; font-weight: 700; }
  .word-form input, .word-form textarea {
    width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px;
    background: var(--surface-2); color: var(--ink); resize: vertical;
  }
  .word-form textarea { min-height: 66px; }
  .form-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 3px; }

  #basket-btn {
    position: fixed; right: 22px; bottom: max(22px, env(safe-area-inset-bottom)); z-index: 45;
    display: inline-flex; align-items: center; gap: 9px; min-height: 48px; padding: 0 18px;
    border: 0; border-radius: 15px; background: var(--ink); color: var(--surface);
    box-shadow: var(--shadow); cursor: pointer; font-weight: 800;
  }
  #basket-btn .cnt { min-width: 23px; padding: 2px 7px; border-radius: 99px; background: var(--warm); color: #172127; font-size: 12px; }
  #basket {
    position: fixed; inset: 0 0 0 auto; z-index: 65; width: min(440px, 100vw);
    display: flex; flex-direction: column; padding: 24px 24px calc(24px + env(safe-area-inset-bottom));
    background: var(--surface); box-shadow: -20px 0 60px rgba(7,16,18,.18);
    transform: translateX(105%); transition: transform .22s ease;
  }
  #basket.open { transform: translateX(0); }
  #basket .bhead { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 16px; }
  #basket .bhead h3 { font-size: 22px; letter-spacing: -.02em; }
  #basket .bhead p { margin-top: 2px; color: var(--ink-soft); font-size: 12.5px; }
  #basket .bclose { border: 0; background: var(--surface-2); color: var(--ink-soft); width: 36px; height: 36px; border-radius: 11px; font-size: 20px; cursor: pointer; }
  .basket-add { width: 100%; margin-bottom: 12px; }
  #basket .blist { overflow-y: auto; flex: 1; padding-right: 4px; }
  .bitem { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 5px 10px; padding: 13px 0; border-bottom: 1px solid var(--line); }
  .bitem .bw { font: 750 16px/1.3 ui-serif, Georgia, serif; }
  .bitem .bz { grid-column: 1; color: var(--accent-strong); font-size: 13px; }
  .bitem .be { grid-column: 1; overflow: hidden; color: var(--ink-soft); font-size: 11.5px; text-overflow: ellipsis; white-space: nowrap; }
  .bitem-actions { grid-column: 2; grid-row: 1 / span 3; align-self: center; display: flex; gap: 3px; }
  .bitem-actions button { border: 0; background: transparent; color: var(--ink-soft); padding: 7px; cursor: pointer; font-size: 12px; }
  .bitem-actions .bx { color: var(--danger); }
  #basket .bfoot { display: flex; gap: 8px; margin-top: 14px; }
  #basket .bfoot button { flex: 1; }
  #basket .bfoot button:disabled { opacity: .5; cursor: wait; }
  #basket .bstatus { min-height: 18px; margin-top: 8px; color: var(--ink-soft); text-align: center; font-size: 12px; }
  .bempty { padding: 42px 14px; color: var(--ink-soft); text-align: center; font-size: 13px; }
  .bempty b { display: block; margin-bottom: 5px; color: var(--ink); font-size: 15px; }
  #word-editor {
    display: none; padding: 15px; margin-bottom: 12px; border: 1px solid var(--line);
    border-radius: 14px; background: var(--surface-2);
  }
  #word-editor.open { display: block; }
  #toast {
    position: fixed; left: 50%; bottom: 28px; z-index: 90; display: none;
    transform: translateX(-50%); padding: 10px 16px; border-radius: 12px;
    background: var(--ink); color: var(--surface); box-shadow: var(--shadow); font-size: 13px; font-weight: 700;
  }
  @media (max-width: 840px) {
    .app { width: min(100% - 28px, 720px); padding-top: 15px; padding-left: max(14px, env(safe-area-inset-left)); padding-right: max(14px, env(safe-area-inset-right)); }
    .topbar { margin-bottom: 24px; }
    .study-grid { display: block; }
    .side { position: static; max-height: none; margin-bottom: 18px; }
    .study-panel { display: contents; max-height: none; }
    .video-card { border-radius: 20px; box-shadow: var(--shadow); }
    .rail {
      position: sticky; top: env(safe-area-inset-top); z-index: 30; margin: 10px 0 18px; padding: 8px 12px;
      border-radius: 20px;
    }
    .rail-bar { padding: 0; }
    .topic-nav { display: none; }
    .video-card.floating {
      position: fixed; z-index: 48; top: 72px; right: 10px; left: auto; width: min(48vw, 210px);
      border: 1px solid rgba(255,255,255,.2); border-radius: 14px; box-shadow: 0 18px 45px rgba(0,0,0,.28);
    }
    .video-card.floating .video-drag { display: block; }
    .video-card.floating .video-float-close { display: block; position: absolute; z-index: 4; top: 6px; right: 6px; }
    .video-card.float-off { display: none; }
    article { border-radius: 20px; }
  }
  @media (max-width: 560px) {
    .app { width: 100%; padding: 12px 12px 88px; padding-left: max(12px, env(safe-area-inset-left)); padding-right: max(12px, env(safe-area-inset-right)); }
    .brand span:last-child { display: none; }
    .text-btn { padding: 0 10px; font-size: 12px; }
    .archive-link { width: 38px; padding: 0; font-size: 0; }
    .archive-link svg { width: 17px; }
    .hero { padding: 0 5px; margin-bottom: 18px; }
    .hero h1 { font-size: 30px; }

lungen gestimmt haben.", "zh": "投反对票的主要是非常年轻的选民和年长选民。", "start": 186.92, "end": 194.6}, {"de": "Und vor allem die Bürger auf dem Land.", "zh": "尤其是乡村地区的居民。", "start": 194.76, "end": 197.44}, {"de": "Nur in der Hauptstadt wurde pro Europa abgestimmt.", "zh": "只有首都投出了亲欧洲的票。", "start": 197.56, "end": 201.28}, {"de": "Im Rest des Landes ein starkes Nein.", "zh": "在全国其余地区，反对声音十分强烈。", "start": 202.04, "end": 204.92}, {"de": "Den Befürwortern ist es nicht gelungen, die Wähler zu überzeugen, dass Island mehr Sicherheit und wirtschaftliche Stärke bekäme durch eine EU-Mitgliedschaft.", "zh": "赞成派未能让选民相信，冰岛通过加入欧盟能获得更多安全和经济实力。", "start": 206.0, "end": 218.76}, {"de": "Der Wahlkampf der Gegner war sehr hart.", "zh": "反对派的竞选活动非常激烈。", "start": 219.28, "end": 222.24}, {"de": "Finanziert mit Geldern der Fischereiindustrie, die traditionell sehr gegen die EU ist.", "zh": "资金来自渔业，这个行业传统上强烈反对欧盟。", "start": 222.64, "end": 229.2}, {"de": "Und sie haben appelliert an Islands Unabhängigkeitsgefühl und an den Nationalstolz.", "zh": "他们还诉诸冰岛人的独立意识和民族自豪感。", "start": 229.4, "end": 235.36}, {"de": "Danke, Christian Stichler.", "zh": "谢谢你，克里斯蒂安·施蒂希勒。", "start": 236.0, "end": 238.04}]}, {"start": 238.2, "end": 312.32, "lines": [{"de": "Weiter zu Tina Hassel in Brüssel: Was bedeutet das Ergebnis für die EU?", "zh": "接下来连线布鲁塞尔的蒂娜·哈塞尔：这个结果对欧盟意味着什么？", "start": 238.2, "end": 243.76}, {"de": "Für die Strahlkraft der EU ist es eine Schlappe.", "zh": "对欧盟的吸引力而言，这是一次挫折。", "start": 244.96, "end": 248.52}, {"de": "Es ging ja nur um den Beginn von Gesprächen, nicht um den Beitritt.", "zh": "毕竟涉及的只是启动谈判，而不是加入。", "start": 248.76, "end": 254.04}, {"de": "Trotz aller Verunsicherungen durch Trump scheinen die Vorbehalte gegen EU-Vorschriften und Fischfangquoten stärker zu sein als die Sicherheit, die ein Beitritt bringen könnte.", "zh": "尽管特朗普带来了种种不确定，对欧盟规定和捕鱼配额的顾虑似乎仍强于入盟可能带来的安全。", "start": 254.32, "end": 267.04}, {"de": "Entsprechend knapp fiel das Statement aus.", "zh": "相应地，官方声明也十分简短。", "start": 267.24, "end": 270.28}, {"de": "Ratspräsident Costa sagte, man respektiere die Entscheidung und wolle weiter eng zusammenarbeiten.", "zh": "欧洲理事会主席科斯塔表示，尊重这一决定，并愿意继续密切合作。", "start": 270.36, "end": 277.36}, {"de": "EU-freundliche Politiker sind enttäuscht.", "zh": "亲欧盟的政治家感到失望。", "start": 277.56, "end": 280.48}, {"de": "Kritiker der EU triumphieren: Die Isländer würden zeigen, dass souveräne Nationen zusammenarbeiten könnten, ohne der EU beizutreten.", "zh": "批评欧盟的人则在欢庆：冰岛人将证明，主权国家无需加入欧盟也能合作。", "start": 280.56, "end": 290.2}, {"de": "So zum Beispiel Marine le Pen.", "zh": "比如玛丽娜·勒庞就是这样。", "start": 290.4, "end": 292.8}, {"de": "Island ist ein Sonderfall.", "zh": "冰岛是一个特例。", "start": 293.08, "end": 295.12}, {"de": "Island ist im Schengen-Raum.", "zh": "冰岛本来就属于申根区。", "start": 295.24, "end": 297.6}, {"de": "Im Falle eines Beitritts wäre es Nettozahler gewesen.", "zh": "如果加入，它本来会成为净出资国。", "start": 297.88, "end": 301.68}, {"de": "Es wäre also eine positive Botschaft gewesen an EU-Kritiker - aber die bleibt erst mal aus.", "zh": "这本可以成为一条发给欧盟批评者的积极信息——但眼下这条信息落空了。", "start": 301.8, "end": 308.32}, {"de": "Danke, Tina Hassel.", "zh": "谢谢你，蒂娜·哈塞尔。", "start": 310.96, "end": 312.32}]}], "vocab": [{"lemma": "das Referendum, Referenden", "key": "referendum", "forms": ["Referendum"], "pos": "Substantiv", "zh": "全民公投", "example_de": "In einem Referendum lehnte die Bevölkerung das ab.", "example_zh": ""}, {"lemma": "die Beteiligung, -en", "key": "beteiligung", "forms": ["Beteiligung"], "pos": "Substantiv", "zh": "（投票）参与率，投票率", "example_de": "Die Beteiligung lag bei 82,5 Prozent.", "example_zh": ""}, {"lemma": "die Strahlkraft", "key": "strahlkraft", "forms": ["Strahlkraft"], "pos": "Substantiv", "zh": "辐射力，吸引力", "example_de": "Für die Strahlkraft der EU ist es eine Schlappe.", "example_zh": ""}, {"lemma": "die Schlappe, -n", "key": "schlappe", "forms": ["Schlappe"], "pos": "Substantiv", "zh": "惨败，挫折", "example_de": "Für die Strahlkraft der EU ist es eine Schlappe.", "example_zh": ""}, {"lemma": "der Vorbehalt, -e", "key": "vorbehalt", "forms": ["Vorbehalte", "Vorbehalt"], "pos": "Substantiv", "zh": "保留意见，顾虑", "example_de": "Trotz aller Verunsicherungen durch Trump scheinen die Vorbehalte gegen EU-Vorschriften und Fischfangquoten stärker zu sein als die Sicherheit, die ein Beitritt bringen könnte.", "example_zh": ""}, {"lemma": "die Fischfangquote, -n", "key": "fischfangquote", "forms": ["Fischfangquoten", "Fischfangquote"], "pos": "Substantiv", "zh": "捕鱼配额", "example_de": "Trotz aller Verunsicherungen durch Trump scheinen die Vorbehalte gegen EU-Vorschriften und Fischfangquoten stärker zu sein als die Sicherheit, die ein Beitritt bringen könnte.", "example_zh": ""}, {"lemma": "triumphieren", "key": "triumphieren", "forms": ["triumphieren"], "pos": "Verb", "zh": "欢庆胜利，得意洋洋", "example_de": "Kritiker der EU triumphieren: Die Isländer würden zeigen, dass souveräne Nationen zusammenarbeiten könnten, ohne der EU beizutreten.", "example_zh": ""}, {"lemma": "der Nettozahler", "key": "nettozahler", "forms": ["Nettozahler"], "pos": "Substantiv", "zh": "净出资国（交多于收）", "example_de": "Im Falle eines Beitritts wäre es Nettozahler gewesen.", "example_zh": ""}], "grammar_points": [{"title": "wäre … gewesen：对过去的非现实推断", "summary": "Im Falle eines Beitritts（假如当初加入）是对没有发生的事的假设，所以用第二虚拟式完成时 wäre … gewesen。wäre/es wäre 也常见于转述中的推测，与第一虚拟式交替使用。", "example_de": "Im Falle eines Beitritts wäre es Nettozahler gewesen.", "example_zh": "如果加入，它本来会成为净出资国。"}, {"title": "scheinen + zu + 不定式", "summary": "scheinen 后接带 zu 的不定式表示“看起来、似乎”：die Vorbehalte scheinen stärker zu sein als …。不定式框架里整个 zu sein … 比较结构包住中间成分。", "example_de": "Trotz aller Verunsicherungen durch Trump scheinen die Vorbehalte gegen EU-Vorschriften und Fischfangquoten stärker zu sein als die Sicherheit, die ein Beitritt bringen könnte.", "example_zh": "尽管特朗普带来了种种不确定，对欧盟规定和捕鱼配额的顾虑似乎仍强于入盟可能带来的安全。"}], "background": "冰岛2009年曾申请加入欧盟，2015年撤回申请。本届政府上台后推动就是否重启入盟谈判举行公投。冰岛已是欧洲经济区与申根区成员；公投只关乎是否重启谈判，并非直接入盟。反对主力是渔业产业与乡村选民。"}, {"title": "Mehr als 790 Tote nach Sturzflut im Himalaya", "title_zh": "喜马拉雅山洪遇难者已超790人", "paras": [{"start": 314.76, "end": 336.76, "lines": [{"de": "Fünf Tage ist es her, dass eine Sturzflut im Himalaya eine ganze Region verwüstete.", "zh": "喜马拉雅山洪摧毁整整一个地区，已经过去五天了。", "start": 314.76, "end": 320.32}, {"de": "Suchmannschaften finden immer mehr Tote.", "zh": "搜救队找到的遗体越来越多。", "start": 320.4, "end": 323.16}, {"de": "In Nepal starben laut Behörden mindestens 781 Menschen, 2500 werden vermisst.", "zh": "据官方通报，尼泊尔已有至少781人遇难，2500人失踪。", "start": 323.24, "end": 329.16}, {"de": "In der Autonomen Region Tibet melden die Behörden 16 Todesopfer und über 500 Vermisste.", "zh": "在西藏自治区，有关部门通报16人遇难、500多人失踪。", "start": 330.52, "end": 336.76}]}, {"start": 340.2, "end": 441.68, "lines": [{"de": "Tiefer Schlamm und Verwüstung.", "zh": "深厚的淤泥，满目疮痍。", "start": 340.2, "end": 342.64}, {"de": "In Trishuli hat die Flutwelle Häuser und Brücken fortgerissen.", "zh": "在特里舒利，洪峰冲走了房屋和桥梁。", "start": 342.72, "end": 346.56}, {"de": "Das größte Solarkraftwerk Nepals ist zerstört, Wasserkraftwerke ebenso.", "zh": "尼泊尔最大的太阳能电站被毁，各水电站也一样。", "start": 346.64, "end": 350.84}, {"de": "Die Region steht ohne Strom da.", "zh": "这个地区彻底断了电。", "start": 350.96, "end": 352.96}, {"de": "Überlebende drängen sich in Notunterkünften.", "zh": "幸存者挤在临时安置点里。", "start": 353.04, "end": 355.8}, {"de": "Sie stehen vor den Trümmern ihrer Existenz, während die Opferzahl weiter steigt.", "zh": "遇难人数还在上升，他们站在自家生计的废墟前。", "start": 355.92, "end": 361.08}, {"de": "Wir sind in der Kleidung geflohen, die wir gerade trugen.", "zh": "我们逃出来时身上穿的就是当时那身衣服。", "start": 361.32, "end": 365.08}, {"de": "Wir sind bei Freunden untergekommen.", "zh": "我们借住在朋友家。", "start": 365.16, "end": 367.6}, {"de": "Wir leiden alle.", "zh": "我们大家都在受苦。", "start": 367.68, "end": 368.92}, {"de": "Wir haben kein Haus, nichts zu essen.", "zh": "我们没有了房子，没有吃的。", "start": 369.0, "end": 371.76}, {"de": "Die Schwächsten müssen am meisten geschützt werden.", "zh": "最弱势的人必须得到最多的保护。", "start": 374.2, "end": 377.36}, {"de": "Darum haben Einheimische in Nuwakot einen sicheren Zufluchtsort für über 90 Menschen geschaffen, die Hälfte von ihnen Kinder.", "zh": "因此努瓦果特的当地人为90多人搭建了一处安全避难所，其中一半是孩子。", "start": 377.44, "end": 385.04}, {"de": "Viele waren auf dem Schulweg, als die Flutwelle einen von zwei Schulbussen fortriss.", "zh": "洪峰卷走两辆校车中的一辆时，许多孩子正在上学路上。", "start": 385.12, "end": 390.52}, {"de": "Die überlebenden Kinder brachten sich zu Fuß in Sicherheit.", "zh": "活下来的孩子们自己步行脱险。", "start": 390.6, "end": 394.52}, {"de": "Hier finden sie ein zerbrechliches Gefühl von Normalität.", "zh": "在这里，他们找到了一种脆弱的正常感。", "start": 394.6, "end": 398.28}, {"de": "Ajay Tamangs Sohn weiß nicht, dass seine Mutter wahrscheinlich tot ist.", "zh": "阿贾伊·塔芒的儿子还不知道，他的妈妈很可能已经遇难。", "start": 398.36, "end": 403.32}, {"de": "Er versteht nicht, was passiert ist.", "zh": "他不明白发生了什么。", "start": 405.96, "end": 408.72}, {"de": "Jeden Abend sagt er: \"Ich möchte zu meiner Mutter.\"", "zh": "每天晚上他都说：“我想去找妈妈。", "start": 408.8, "end": 412.52}, {"de": "Ich möchte nicht, dass er schon die Wahrheit erfährt.", "zh": "”我不想让他这么早就知道真相。", "start": 412.64, "end": 415.84}, {"de": "Ich möchte, dass er eine bessere Zukunft hat als die, die wir erlebt haben.", "zh": "我希望他有一个比我们经历过的更好的未来。", "start": 415.92, "end": 421.0}, {"de": "Einige dieser Familien und Gemeinschaften gehören zu den benachteiligsten im armen Nepal.", "zh": "在贫穷的尼泊尔，这些家庭和群体属于最弱势的行列。", "start": 422.12, "end": 427.8}, {"de": "Jetzt blicken sie einer ungewissen Zukunft entgegen.", "zh": "现在他们面对的是一个不确定的未来。", "start": 427.88, "end": 431.76}, {"de": "Sie können für die Menschen im Katastrophengebiet spenden:", "zh": "您可以为灾区民众捐款：", "start": 437.72, "end": 441.68}]}], "vocab": [{"lemma": "verwüsten", "key": "verwuesten", "forms": ["verwüstete", "verwüsten"], "pos": "Verb", "zh": "摧毁，使成废墟", "example_de": "Fünf Tage ist es her, dass eine Sturzflut im Himalaya eine ganze Region verwüstete.", "example_zh": ""}, {"lemma": "die Suchmannschaft, -en", "key": "suchmannschaft", "forms": ["Suchmannschaften", "Suchmannschaft"], "pos": "Substantiv", "zh": "搜救队", "example_de": "Suchmannschaften finden immer mehr Tote.", "example_zh": ""}, {"lemma": "der Vermisste, -n", "key": "vermisste", "forms": ["Vermisste"], "pos": "Substantiv", "zh": "失踪者（名词化的形容词）", "example_de": "In der Autonomen Region Tibet melden die Behörden 16 Todesopfer und über 500 Vermisste.", "example_zh": ""}, {"lemma": "fortreißen", "key": "fortreissen", "forms": ["fortgerissen", "fortriss", "fortreißen"], "pos": "Verb", "zh": "冲走，卷走", "example_de": "In Trishuli hat die Flutwelle Häuser und Brücken fortgerissen.", "example_zh": ""}, {"lemma": "die Notunterkunft, ¨-e", "key": "notunterkunft", "forms": ["Notunterkünften", "Notunterkunft"], "pos": "Substantiv", "zh": "临时避难所", "example_de": "Überlebende drängen sich in Notunterkünften.", "example_zh": ""}, {"lemma": "der Zufluchtsort, -e", "key": "zufluchtsort", "forms": ["Zufluchtsort"], "pos": "Substantiv", "zh": "避难处，庇护所", "example_de": "Darum haben Einheimische in Nuwakot einen sicheren Zufluchtsort für über 90 Menschen geschaffen, die Hälfte von ihnen Kinder.", "example_zh": ""}, {"lemma": "benachteiligt", "key": "benachteiligt", "forms": ["benachteiligsten", "benachteiligt"], "pos": "Adjektiv", "zh": "处于劣势的，弱势的", "example_de": "Einige dieser Familien und Gemeinschaften gehören zu den benachteiligsten im armen Nepal.", "example_zh": ""}], "grammar_points": [{"title": "Es ist (zeit) her, dass …", "summary": "Fünf Tage ist es her, dass … 表示“距某事发生已过去多久”：es ist her 固定搭配，前面放时间段，dass 从句补出事件。新闻开头交代时间跨度的常用句型。", "example_de": "Fünf Tage ist es her, dass eine Sturzflut im Himalaya eine ganze Region verwüstete.", "example_zh": "喜马拉雅山洪摧毁整整一个地区，已经过去五天了。"}, {"title": "als die, die wir erlebt haben", "summary": "比较级后的 die 回指前面名词（die Zukunft），再接关系从句 die wir erlebt haben。两层 die 叠在一起是书面常见结构：eine bessere Zukunft als die, die …（一个比我们所经历的那种更好的未来）。", "example_de": "Ich möchte, dass er eine bessere Zukunft hat als die, die wir erlebt haben.", "example_zh": "我希望他有一个比我们经历过的更好的未来。"}], "background": "这是8月26日喜马拉雅特大山洪（本栏目8月29日已报道）的第五天后续：尼泊尔遇难人数升至至少781人、约2500人失踪；西藏自治区16人遇难、500余人失踪。灾区最大太阳能电站和多座水电站被毁，多地断电，搜救仍在进行。"}, {"title": "Mindestens acht Tote bei Fährunglück vor der Küste Nordzyperns", "title_zh": "北塞浦路斯海域渡轮倾覆至少八人遇难", "paras": [{"start": 457.36, "end": 485.2, "lines": [{"de": "Vor Nordzypern ist eine Fähre mit über 260 Menschen gekentert.", "zh": "一艘载有260多人的渡轮在北塞浦路斯海域倾覆。", "start": 457.36, "end": 461.84}, {"de": "Dabei starben nach Medienberichten mindestens acht Menschen.", "zh": "据媒体报道，事故造成至少八人遇难。", "start": 462.72, "end": 466.84}, {"de": "22 werden vermisst.", "zh": "22人下落不明。", "start": 466.92, "end": 468.56}, {"de": "Das Schiff war von Kyrenia in Richtung Türkei gestartet.", "zh": "这艘船从凯里尼亚出发，驶往土耳其方向。", "start": 469.28, "end": 473.28}, {"de": "Wenige Kilometer vor der Küste kam es zu der Havarie.", "zh": "离海岸仅几公里处发生了海损事故。", "start": 473.36, "end": 476.8}, {"de": "Die Türkei hat den Norden Zyperns seit 1974 besetzt.", "zh": "土耳其自1974年起占领塞浦路斯北部。", "start": 476.88, "end": 480.52}, {"de": "Die Republik Nordzypern wird nur von der Türkei anerkannt.", "zh": "北塞浦路斯共和国只得到土耳其一国的承认。", "start": 481.0, "end": 485.2}]}, {"start": 486.48, "end": 562.8, "lines": [{"de": "Diese Passagiere konnten sich auf den Rumpf des gekenterten Katamarans retten.", "zh": "这些乘客当时得以爬上倾覆双体船的船体自救。", "start": 486.48, "end": 492.2}, {"de": "Nach dem Auslaufen gegen 12.30 Uhr war die Fähre auf dem Weg ins südtürkische Mersin in Seenot geraten.", "zh": "中午12点30分左右离港后，渡轮在驶往土耳其南部梅尔辛的途中遇险。", "start": 492.88, "end": 500.24}, {"de": "Die Besatzung setzte einen Notruf ab, bevor die Fähre kenterte.", "zh": "渡轮倾覆前，船员发出了求救信号。", "start": 500.32, "end": 504.84}, {"de": "Als vorne was platzte, versuchten sie umzukehren.", "zh": "船头有什么东西爆裂时，他们试图掉头。", "start": 506.36, "end": 510.24}, {"de": "Beim Wenden zerbrachen die Scheiben, Wasser drang ins Innere ein.", "zh": "转向时挡风玻璃碎裂，水涌进船内。", "start": 510.32, "end": 514.56}, {"de": "Alle rannten nach hinten, um zum Ausgang zu kommen.", "zh": "所有人都往船尾跑，想挤到出口。", "start": 514.64, "end": 518.12}, {"de": "Ich bin mit Rettungsweste ins Wasser gesprungen.", "zh": "我穿着救生衣跳进了水里。", "start": null, "end": null}, {"de": "Küstenwache, private Boote und Helikopter waren im Einsatz, um Passagiere zu retten.", "zh": "海岸警卫队、私人船只和直升机投入了救援乘客的行动。", "start": 523.48, "end": 529.36}, {"de": "Sie wurden in den Hafen und von dort in Krankenhäuser gebracht.", "zh": "获救人员被送进港口，再从那里转送各家医院。", "start": 529.48, "end": 533.28}, {"de": "Am Nachmittag, während der Feier zum Nationaltag, äußerte sich der türkische Präsident Erdogan.", "zh": "下午，在国庆庆典期间，土耳其总统埃尔多安发表了讲话。", "start": 533.36, "end": 539.68}, {"de": "Wir haben in Zusammenarbeit mit den Behörden der Türkischen Republik Nordzypern Such- und Rettungsmaßnahmen eingeleitet.", "zh": "我们已与北塞浦路斯土耳其共和国有关部门合作，启动了搜救措施。", "start": 540.0, "end": 547.76}, {"de": "237 Passagiere und Crew-Mitglieder konnten so gerettet werden.", "zh": "237名乘客和船员因此获救。", "start": 547.84, "end": 552.16}, {"de": "Warum die Fähre verunglückte, ist unklar.", "zh": "渡轮为什么失事，目前还不清楚。", "start": 554.96, "end": 557.64}, {"de": "Das Schiff ist jetzt vollständig gesunken.", "zh": "船现在已经完全沉没。", "start": 557.72, "end": 560.28}, {"de": "Kapitän und Crew wurden festgenommen.", "zh": "船长和船员已被拘捕。", "start": 560.36, "end": 562.8}]}], "vocab": [{"lemma": "kentern", "key": "kentern", "forms": ["gekentert", "kenterte", "kentern"], "pos": "Verb", "zh": "（船）倾覆，翻船", "example_de": "Vor Nordzypern ist eine Fähre mit über 260 Menschen gekentert.", "example_zh": ""}, {"lemma": "die Havarie, -n", "key": "havarie", "forms": ["Havarie"], "pos": "Substantiv", "zh": "海损事故，船只失事", "example_de": "Wenige Kilometer vor der Küste kam es zu der Havarie.", "example_zh": ""}, {"lemma": "in Seenot geraten", "key": "in-seenot-geraten", "forms": ["in Seenot geraten"], "pos": "Redewendung", "zh": "在海上遇险", "example_de": "Nach dem Auslaufen gegen 12.30 Uhr war die Fähre auf dem Weg ins südtürkische Mersin in Seenot geraten.", "example_zh": ""}, {"lemma": "die Besatzung, -en", "key": "besatzung", "forms": ["Besatzung"], "pos": "Substantiv", "zh": "（船/飞机的）全体乘员", "example_de": "Die Besatzung setzte einen Notruf ab, bevor die Fähre kenterte.", "example_zh": ""}, {"lemma": "der Notruf, -e", "key": "notruf", "forms": ["Notruf"], "pos": "Substantiv", "zh": "求救信号，紧急呼叫", "example_de": "Die Besatzung setzte einen Notruf ab, bevor die Fähre kenterte.", "example_zh": ""}, {"lemma": "die Küstenwache", "key": "kuestenwache", "forms": ["Küstenwache"], "pos": "Substantiv", "zh": "海岸警卫队", "example_de": "Küstenwache, private Boote und Helikopter waren im Einsatz, um Passagiere zu retten.", "example_zh": ""}, {"lemma": "festnehmen", "key": "festnehmen", "forms": ["festgenommen", "festnehmen"], "pos": "Verb", "zh": "拘捕，逮捕", "example_de": "Kapitän und Crew wurden festgenommen.", "example_zh": ""}], "grammar_points": [{"title": "Warum … , ist unklar：w-从句作主语", "summary": "疑问词从句 Warum die Fähre verunglückte 整体当主语，第三格单数动词 is unklar 充当表语。新闻里表达“原因不明/尚不清楚”的高频句式（Wie/Ob/Warum …, ist unklar/offen）。", "example_de": "Warum die Fähre verunglückte, ist unklar.", "example_zh": "渡轮为什么失事，目前还不清楚。"}, {"title": "Beim Wenden zerbrachen …, Wasser drang ins Innere ein", "summary": "beim + 动名词（beim Wenden 转向时）压缩时间状语；可分动词过去时同样保持框架：drang … ein（动词过去式在前位，可分前缀 ein 殉尾）。", "example_de": "Beim Wenden zerbrachen die Scheiben, Wasser drang ins Innere ein.", "example_zh": "转向时挡风玻璃碎裂，水涌进船内。"}], "background": "涉事渡轮为双体船，从北塞浦路斯凯里尼亚港驶往土耳其南部梅尔辛港。北塞浦路斯是1974年土耳其军事介入后形成的政权，国际上仅获土耳其承认；事发当天恰逢相关国庆活动。"}, {"title": "Schüsse bei Rave-Party in der Schweiz", "title_zh": "瑞士锐舞派对发生枪击", "paras": [{"start": 563.92, "end": 587.72, "lines": [{"de": "Bei einem Techno-Festival in der Schweiz sind Schüsse gefallen.", "zh": "瑞士一场科技电子音乐节上响起了枪声。", "start": 563.92, "end": 568.2}, {"de": "Dabei wurde eine 22-jährige Italienerin getötet, die in der Schweiz arbeitete.", "zh": "一名在瑞士工作的22岁意大利女性遇难。", "start": 568.44, "end": 573.88}, {"de": "Fünf Menschen wurden verletzt.", "zh": "五人受伤。", "start": 573.96, "end": 576.08}, {"de": "Das Festival in Aarau hatte 3500 Besucher und war gerade zu Ende, als die Schüsse fielen.", "zh": "这场在阿劳举办的音乐节有3500名观众，枪声响起时活动刚刚结束。", "start": 576.2, "end": 582.32}, {"de": "Die Polizei konnte weder zum Täter noch zu einem Motiv Angaben machen.", "zh": "警方既无法就凶手、也无法就作案动机作出说明。", "start": 583.08, "end": 587.72}]}], "vocab": [{"lemma": "Schüsse fallen", "key": "schuesse-fallen", "forms": ["sind Schüsse gefallen", "Schüsse fallen"], "pos": "Redewendung", "zh": "响起枪声（fallen 的完成时用 sein）", "example_de": "Bei einem Techno-Festival in der Schweiz sind Schüsse gefallen.", "example_zh": ""}, {"lemma": "verletzen", "key": "verletzen", "forms": ["verletzt", "verletzen"], "pos": "Verb", "zh": "使受伤", "example_de": "Fünf Menschen wurden verletzt.", "example_zh": ""}, {"lemma": "der Täter, -", "key": "taeter", "forms": ["Täter"], "pos": "Substantiv", "zh": "作案人，凶手", "example_de": "Die Polizei konnte weder zum Täter noch zu einem Motiv Angaben machen.", "example_zh": ""}, {"lemma": "das Motiv, -e", "key": "motiv", "forms": ["Motiv"], "pos": "Substantiv", "zh": "动机", "example_de": "Die Polizei konnte weder zum Täter noch zu einem Motiv Angaben machen.", "example_zh": ""}, {"lemma": "weder … noch …", "key": "weder-noch", "forms": ["weder zum Täter noch zu einem Motiv", "weder … noch …"], "pos": "Konjunktion", "zh": "既不……也不……", "example_de": "Die Polizei konnte weder zum Täter noch zu einem Motiv Angaben machen.", "example_zh": ""}], "grammar_points": [{"title": "…, als die Schüsse fielen", "summary": "als 引导过去一次性事件的时间从句（枪声响起那一刻），主句用过去完成 hatte … zu Ende（更早的状态）。als 表达“正当……的时候”，与 während（持续背景）相对。", "example_de": "Das Festival in Aarau hatte 3500 Besucher und war gerade zu Ende, als die Schüsse fielen.", "example_zh": "这场在阿劳举办的音乐节有3500名观众，枪声响起时活动刚刚结束。"}], "background": "阿劳是瑞士阿尔高州首府。案发时这场约3500人的电子音乐节刚散场；截至发稿警方未公布嫌疑人或动机。"}, {"title": "NASA schickt neues Infrarot-Teleskop ins All", "title_zh": "NASA将新型红外望远镜送入太空", "paras": [{"start": 589.56, "end": 613.44, "lines": [{"de": "Nancy Grace Roman war eine der ersten leitenden Mitarbeiterinnen der NASA.", "zh": "南希·格雷斯·罗曼曾是NASA最早的一批高管之一。", "start": 589.56, "end": 594.92}, {"de": "Sie trieb die Pläne voran für das Weltraum-Teleskop Hubble, das seit 35 Jahren Bilder aus dem All zur Erde funkt.", "zh": "她推动了哈勃太空望远镜的立项，35年来这架望远镜不断从太空向地球传回图像。", "start": 595.28, "end": 603.0}, {"de": "Inzwischen wurde die Technik weiterentwickelt.", "zh": "如今技术已经更进一步。", "start": 603.08, "end": 606.28}, {"de": "Heute startete ein neues Teleskop, das noch sehr viel mehr sehen soll.", "zh": "今天一架新的望远镜升空，它将能看到的要比之前多得多。", "start": 606.36, "end": 611.08}, {"de": "Benannt nach Nancy Grace Roman.", "zh": "它以南希·格雷斯·罗曼的名字命名。", "start": 611.16, "end": 613.44}]}, {"start": 616.48, "end": 707.72, "lines": [{"de": "Bilderbuchstart in Cape Canaveral.", "zh": "卡纳维拉尔角，一次教科书式的完美发射。", "start": 616.48, "end": 619.12}, {"de": "Eine Falcon-Heavy-Rakete von SpaceX bringt das neue Vorzeigeinstrument der NASA ins All: Das Roman-Teleskop.", "zh": "太空探索技术公司的一枚猎鹰重型火箭把NASA新的招牌设备送入太空：罗曼望远镜。", "start": 619.2, "end": 627.0}, {"de": "Dessen Blickfeld ist 100-mal so groß wie das von Vorgänger Hubble.", "zh": "它的视场是前辈哈勃的100倍。", "start": 627.12, "end": 631.4}, {"de": "Eine wichtige Aufgabe: Die Suche nach Exoplaneten, also Planeten, die außerhalb unseres Sonnensystems um andere Sterne kreisen.", "zh": "一项重要任务：寻找系外行星，也就是在太阳系之外围绕其他恒星运转的行星。", "start": 631.48, "end": 639.56}, {"de": "Um die direkt sehen zu können, ist im Teleskop ein Koronograf verbaut.", "zh": "为了能直接看见这些行星，望远镜里安装了日冕仪。", "start": 639.64, "end": 644.76}, {"de": "Die Erde ist, wenn ich von außen draufschaue, sehr lichtschwach neben der hellen Sonne.", "zh": "如果我从外面看，地球在明亮的太阳旁边是非常暗弱的。", "start": 645.6, "end": 652.36}, {"de": "Sie wird nur sichtbar, wenn ich das helle Sonnenlicht wegbekomme.", "zh": "只有把强烈的太阳光遮掉，它才变得可见。", "start": 652.44, "end": 657.32}, {"de": "Und das macht der Koronograf.", "zh": "而这正是日冕仪所做的。", "start": 657.4, "end": 659.56}, {"de": "Konstruiert wurden wesentliche Teile am Max-Planck-Institut für Astronomie in Heidelberg.", "zh": "一些关键部件是在海德堡的马普天文研究所制造的。", "start": 659.64, "end": 666.28}, {"de": "Auch einige Belastungstests liefen hier: Strahlung, Temperaturen, Erschütterungen wie beim Raketenstart.", "zh": "部分负荷测试也在这里进行：辐射、温度、还有火箭发射那样的震动。", "start": 666.52, "end": 673.68}, {"de": "Dieser Rahmen trägt spezielle Linsen und Filter.", "zh": "这个框架承载着特制的透镜和滤光片。", "start": 673.8, "end": 676.8}, {"de": "Das Instrument kann die Helligkeit von Sternen unterdrücken und um Hunderte Millionen Mal schwächer erscheinen lassen.", "zh": "这台仪器能把恒星亮度压低，让它看起来暗上数亿倍。", "start": 676.88, "end": 684.08}, {"de": "Ende April: der Einbau ins Teleskop.", "zh": "四月底：装入望远镜。", "start": 684.16, "end": 686.88}, {"de": "Der Start heute: Wie geplant, auch die Landung der Booster der Trägerrakete.", "zh": "今天的发射：助推器也按计划回收着陆。", "start": 687.6, "end": 692.96}, {"de": "Ob mit Sonnenpanelen, Antenne und der Blendenabdeckung alles klappt, wissen wir in ein paar Tagen.", "zh": "太阳能板、天线和遮光罩展开是否一切顺利，几天后才知道。", "start": 693.52, "end": 699.52}, {"de": "Bis das Teleskop seinen Platz erreicht, ist es drei Monate unterwegs.", "zh": "望远镜要飞三个月才能到达预定位置。", "start": 699.6, "end": 704.16}, {"de": "Erste Bilder soll es Anfang 2027 zur Erde funken.", "zh": "第一批图像预计将在2027年初传回地球。", "start": 704.28, "end": 707.72}]}], "vocab": [{"lemma": "leitend", "key": "leitend", "forms": ["leitenden", "leitend"], "pos": "Adjektiv", "zh": "主持工作的，高级管理的", "example_de": "Nancy Grace Roman war eine der ersten leitenden Mitarbeiterinnen der NASA.", "example_zh": ""}, {"lemma": "vorantreiben", "key": "vorantreiben", "forms": ["trieb die Pläne voran", "vorantreiben"], "pos": "Verb", "zh": "推动，大力推进", "example_de": "Sie trieb die Pläne voran für das Weltraum-Teleskop Hubble, das seit 35 Jahren Bilder aus dem All zur Erde funkt.", "example_zh": ""}, {"lemma": "das Blickfeld, -er", "key": "blickfeld", "forms": ["Blickfeld"], "pos": "Substantiv", "zh": "视野，视场", "example_de": "Dessen Blickfeld ist 100-mal so groß wie das von Vorgänger Hubble.", "example_zh": ""}, {"lemma": "der Exoplanet, -en", "key": "exoplanet", "forms": ["Exoplaneten", "Exoplanet"], "pos": "Substantiv", "zh": "系外行星", "example_de": "Eine wichtige Aufgabe: Die Suche nach Exoplaneten, also Planeten, die außerhalb unseres Sonnensystems um andere Sterne kreisen.", "example_zh": ""}, {"lemma": "der Koronograf, -en", "key": "koronograf", "forms": ["Koronograf"], "pos": "Substantiv", "zh": "日冕仪（遮住恒星光芒的仪器）", "example_de": "Um die direkt sehen zu können, ist im Teleskop ein Koronograf verbaut.", "example_zh": ""}, {"lemma": "unterdrücken", "key": "unterdruecken", "forms": ["unterdrücken"], "pos": "Verb", "zh": "压制，抑制", "example_de": "Das Instrument kann die Helligkeit von Sternen unterdrücken und um Hunderte Millionen Mal schwächer erscheinen lassen.", "example_zh": ""}, {"lemma": "die Erschütterung, -en", "key": "erschuetterung", "forms": ["Erschütterungen", "Erschütterung"], "pos": "Substantiv", "zh": "震动，颠簸", "example_de": "Auch einige Belastungstests liefen hier: Strahlung, Temperaturen, Erschütterungen wie beim Raketenstart.", "example_zh": ""}, {"lemma": "die Trägerrakete, -n", "key": "traegerrakete", "forms": ["Trägerrakete"], "pos": "Substantiv", "zh": "运载火箭", "example_de": "Der Start heute: Wie geplant, auch die Landung der Booster der Trägerrakete.", "example_zh": ""}], "grammar_points": [{"title": "Um … sehen zu können, ist …", "summary": "um … zu + können 的扩展不定式（um die direkt sehen zu können）表目的，占句首第一位，主动词 ist 随后。情态动词可以一起进 zu 不定式。", "example_de": "Um die direkt sehen zu können, ist im Teleskop ein Koronograf verbaut.", "example_zh": "为了能直接看见这些行星，望远镜里安装了日冕仪。"}, {"title": "100-mal so groß wie das von …", "summary": "同级比较 so … wie；倍数放在 so 前（100-mal so groß wie）。das von Vorgänger Hubble 里的 das 回指 das Blickfeld，von 短语替代第二格属格。", "example_de": "Dessen Blickfeld ist 100-mal so groß wie das von Vorgänger Hubble.", "example_zh": "它的视场是前辈哈勃的100倍。"}], "background": "罗曼望远镜以NASA首位首席天文学家南希·格雷斯·罗曼（1925–2018，“哈勃之母”）命名，是NASA新一代大型红外空间望远镜，按计划将飞往日地第二拉格朗日点（L2），需约三个月抵达，首批图像预计2027年初。其日冕仪关键部件由海德堡马普天文研究所研制。"}, {"title": "1. Spieltag der Fußball-Bundesliga", "title_zh": "德甲联赛首轮", "paras": [{"start": 708.8, "end": 722.44, "lines": [{"de": "Wir kommen zum Sport und der Fußball-Bundesliga.", "zh": "接下来是体育，德甲联赛。", "start": 708.8, "end": 711.76}, {"de": "Aufsteiger Schalke 04 verliert in Unterzahl gegen Augsburg mit 0:3.", "zh": "升班马沙尔克04以少打多，0比3负于奥格斯堡。", "start": 711.84, "end": 716.6}, {"de": "Der SC Freiburg ist mit einem 4:1 gegen Werder Bremen in die Saison gestartet.", "zh": "弗赖堡俱乐部4比1战胜不来梅，迎来赛季开门红。", "start": 716.88, "end": 722.44}]}, {"start": 724.72, "end": 781.2, "lines": [{"de": "Yuito Suzuki war der Mann des Tages beim SC Freiburg.", "zh": "Yuito Suzuki是弗赖堡当日的最佳球员。", "start": 724.72, "end": 728.12}, {"de": "Der Japaner erzielte beim Sieg gegen Werder Bremen drei Tore.", "zh": "这位日本球员在对阵不来梅的胜利中攻入三球。", "start": 728.2, "end": 731.88}, {"de": "Das erste nach einer Ecke von Beste nach einer knappen halben Stunde.", "zh": "第一球出现在大约半小时时，来自贝斯特开出的角球。", "start": 731.96, "end": 736.64}, {"de": "Bremen agierte in der ersten Hälfte offensiv harmlos und defensiv zu passiv.", "zh": "上半场不来梅进攻缺乏威胁，防守又太被动。", "start": 736.8, "end": 741.8}, {"de": "Wie beim nächsten Freiburger Treffer: Matanovic frei und ungestört – das 2:0 kurz vor der Halbzeit.", "zh": "弗赖堡的下一个进球也是如此：马塔诺维奇无人盯防——半场结束前，2比0。", "start": 741.88, "end": 748.56}, {"de": "Erfrischenden Fußball gab es fast nur von Freiburg.", "zh": "令人耳目一新的足球几乎只来自弗赖堡。", "start": 748.64, "end": 752.48}, {"de": "Kurz nach dem Seitenwechsel erhöhte Suzuki auf 3:0.", "zh": "易边后不久，铃木将比分改写为3比0。", "start": 752.56, "end": 756.2}, {"de": "Freiburg wirbelte, Bremen wirkte überfordert.", "zh": "弗赖堡踢得风生水起，不来梅显得招架不住。", "start": 759.32, "end": 762.64}, {"de": "Matanovic auf Suzuki, das dritte Tor des Japaners.", "zh": "马塔诺维奇传给铃木，日本球员的第三球。", "start": 762.76, "end": 766.48}, {"de": "Freiburg führte nach 55 Minuten mit 4:0.", "zh": "55分钟后弗赖堡4比0领先。", "start": 767.0, "end": 770.12}, {"de": "Danach bemühte sich Bremen um Schadensbegrenzung und kam durch den eingewechselten Stalmach zum 1:4.", "zh": "此后不来梅努力止损，由替补登场的斯塔尔马赫扳回一球，1比4。", "start": 771.0, "end": 777.44}, {"de": "Jubeln über drei Punkte durfte aber der SC Freiburg.", "zh": "但能为三分欢呼的是弗赖堡俱乐部。", "start": 777.52, "end": 781.2}]}], "vocab": [{"lemma": "der Aufsteiger, -", "key": "aufsteiger", "forms": ["Aufsteiger"], "pos": "Substantiv", "zh": "（升入上一级联赛的）升班马", "example_de": "Aufsteiger Schalke 04 verliert in Unterzahl gegen Augsburg mit 0:3.", "example_zh": ""}, {"lemma": "in Unterzahl", "key": "in-unterzahl", "forms": ["in Unterzahl"], "pos": "Redewendung", "zh": "以少打多（场上少一人）", "example_de": "Aufsteiger Schalke 04 verliert in Unterzahl gegen Augsburg mit 0:3.", "example_zh": ""}, {"lemma": "erzielen", "key": "erzielen", "forms": ["erzielte", "erzielen"], "pos": "Verb", "zh": "取得，攻入（进球/成绩）", "example_de": "Der Japaner erzielte beim Sieg gegen Werder Bremen drei Tore.", "example_zh": ""}, {"lemma": "die Ecke, -n", "key": "ecke", "forms": ["Ecke"], "pos": "Substantiv", "zh": "角球", "example_de": "Das erste nach einer Ecke von Beste nach einer knappen halben Stunde.", "example_zh": ""}, {"lemma": "der Seitenwechsel, -", "key": "seitenwechsel", "forms": ["Seitenwechsel"], "pos": "Substantiv", "zh": "（半场）交换场地，易边", "example_de": "Kurz nach dem Seitenwechsel erhöhte Suzuki auf 3:0.", "example_zh": ""}, {"lemma": "erhöhen auf (A)", "key": "erhoehen-auf", "forms": ["erhöhte Suzuki auf", "erhöhen auf"], "pos": "Verb", "zh": "把比分扩大到", "example_de": "Kurz nach dem Seitenwechsel erhöhte Suzuki auf 3:0.", "example_zh": ""}, {"lemma": "die Schadensbegrenzung", "key": "schadensbegrenzung", "forms": ["Schadensbegrenzung"], "pos": "Substantiv", "zh": "控制损失，止损", "example_de": "Danach bemühte sich Bremen um Schadensbegrenzung und kam durch den eingewechselten Stalmach zum 1:4.", "example_zh": ""}, {"lemma": "wirbeln", "key": "wirbeln", "forms": ["wirbelte", "wirbeln"], "pos": "Verb", "zh": "掀起旋风，踢得风生水起", "example_de": "Freiburg wirbelte, Bremen wirkte überfordert.", "example_zh": ""}], "grammar_points": [{"title": "Jubeln … durfte der SC Freiburg：名词化不定式作主语", "summary": "Jubeln（不定式名词化）当主语放句首，情态动词 durfte 居第二位，真正主语 der SC Freiburg 殉后。新闻德语避免被动、突出动作的常见修辞。", "example_de": "Jubeln über drei Punkte durfte aber der SC Freiburg.", "example_zh": "但能为三分欢呼的是弗赖堡俱乐部。"}, {"title": "Das erste nach einer Ecke …：省略动词的报章句", "summary": "省略 war 的电报式短句，仅保留名词性成分。德语体育报道和解说词的典型风格：Das erste（第一球）后接两个 nach 短语交代来源与时间。", "example_de": "Das erste nach einer Ecke von Beste nach einer knappen halben Stunde.", "example_zh": "第一球出现在大约半小时时，来自贝斯特开出的角球。"}], "background": "2026/27赛季德甲首轮：升班马沙尔克04客场0比3负于奥格斯堡；弗赖堡主场4比1大胜不来梅，日本前锋Yuito Suzuki上演帽子戏法，Matanovic传射建功。"}, {"title": "Deutsche Hockey-Herren sind Weltmeister nach 1:0 Sieg gegen Spanien", "title_zh": "德国曲棍球男队1比0胜西班牙，加冕世界冠军", "paras": [{"start": 784.48, "end": 793.64, "lines": [{"de": "Jubel bei den Hockey-Herren: Deutschland ist erneut Weltmeister.", "zh": "曲棍球男队一片欢腾：德国再度成为世界冠军。", "start": 784.48, "end": 789.32}, {"de": "In einem umkämpften Finale schlug das Team Spanien mit 1:0.", "zh": "在一场缠斗激烈的决赛中，德国队1比0击败西班牙。", "start": 789.4, "end": 793.64}]}, {"start": 795.92, "end": 846.68, "lines": [{"de": "Der vierte WM-Titel für die deutschen Hockey-Herren.", "zh": "这是德国曲棍球男队的第四个世界杯冠军。", "start": 795.92, "end": 799.52}, {"de": "Das ist historisch, das hat bisher nur Pakistan geschafft.", "zh": "这是历史性的成就，此前只有巴基斯坦做到过。", "start": 799.64, "end": 803.84}, {"de": "Ich bin überglücklich und stolz.", "zh": "我无比幸福，无比自豪。", "start": null, "end": null}, {"de": "Der Kapitän sagte gerade, er könne die ganze Welt umarmen.", "zh": "队长刚才说，他恨不得拥抱整个世界。", "start": 806.92, "end": 810.8}, {"de": "Es ist einfach Wahnsinn.", "zh": "简直太疯狂了。", "start": 810.88, "end": 812.64}, {"de": "Die Partie ist geprägt von den Defensiv-Reihen.", "zh": "这场比赛由两边的防守线主导。", "start": 813.04, "end": 816.32}, {"de": "In der ersten Hälfte kaum Torchancen.", "zh": "上半场几乎没有什么射门机会。", "start": 816.4, "end": 819.24}, {"de": "Bundestrainer Henning kann sich dann wieder auf sein Team verlassen.", "zh": "国家队教练亨宁随后又能指望上他的球队了。", "start": 819.88, "end": 824.72}, {"de": "44. Minute, Struthoff mit dem 1:0.", "zh": "第44分钟，斯特鲁特霍夫打进1比0。", "start": 825.04, "end": 827.76}, {"de": "Sein zweites Tor in diesem Turnier.", "zh": "这是他本届赛事的第二个进球。", "start": 828.04, "end": 830.76}, {"de": "Und vielleicht das wichtigste in seiner Karriere.", "zh": "也许也是他职业生涯最重要的一球。", "start": 831.32, "end": 834.6}, {"de": "Die Spanier gehen volles Risiko, nehmen am Ende sogar den Torwart raus.", "zh": "西班牙人拼上全部风险，最后甚至撤下了门将。", "start": 834.68, "end": 839.04}, {"de": "Aber es reicht nicht mehr.", "zh": "但已经无济于事。", "start": 839.12, "end": 840.68}, {"de": "Nach WM-Gold vor drei Jahren, Olympia-Silber und EM-Gold verteidigt Deutschland den WM-Titel.", "zh": "在三年前的世界杯金牌、奥运银牌和欧洲杯金牌之后，德国队成功卫冕世界杯冠军。", "start": 840.76, "end": 846.68}]}], "vocab": [{"lemma": "der Jubel", "key": "jubel", "forms": ["Jubel"], "pos": "Substantiv", "zh": "欢腾，欢呼", "example_de": "Jubel bei den Hockey-Herren: Deutschland ist erneut Weltmeister.", "example_zh": ""}, {"lemma": "erneut", "key": "erneut", "forms": ["erneut"], "pos": "Adjektiv", "zh": "再次的，重新的", "example_de": "Jubel bei den Hockey-Herren: Deutschland ist erneut Weltmeister.", "example_zh": ""}, {"lemma": "umkämpft", "key": "umkaempft", "forms": ["umkämpften", "umkämpft"], "pos": "Adjektiv", "zh": "争夺激烈的", "example_de": "In einem umkämpften Finale schlug das Team Spanien mit 1:0.", "example_zh": ""}, {"lemma": "die Torchance, -n", "key": "torchance", "forms": ["Torchancen", "Torchance"], "pos": "Substantiv", "zh": "射门机会，进球机会", "example_de": "In der ersten Hälfte kaum Torchancen.", "example_zh": ""}, {"lemma": "das Turnier, -e", "key": "turnier", "forms": ["Turnier"], "pos": "Substantiv", "zh": "锦标赛，杯赛", "example_de": "Sein zweites Tor in diesem Turnier.", "example_zh": ""}, {"lemma": "die Karriere, -n", "key": "karriere", "forms": ["Karriere"], "pos": " : "其余地区阳光时间较长，阿尔卑斯山一带有几场阵雨。", "start": 890.8, "end": 893.84}, {"de": "Am Mittwoch und Donnerstag machen sich im Norden Tiefs bemerkbar.", "zh": "周三和周四，北部将受到多个低压的影响。", "start": 893.92, "end": 897.84}, {"de": "Der Süden hat es mit einem Hoch über Südwesteuropa zu tun.", "zh": "南部则由一个位于欧洲西南部上空的高压掌控。", "start": 897.92, "end": 901.44}]}, {"start": 902.32, "end": 921.88, "lines": [{"de": "In den tagesthemen um 22.45 Uhr bringen wir Sie zum Fährunglück vor Zypern auf den neuesten Stand.", "zh": "在22点45分的《每日主题》中，我们将为您带来塞浦路斯海域渡轮事故的最新进展。", "start": 902.32, "end": 909.32}, {"de": "Außerdem: Kanzler Merz im ARD-Sommerinterview - wie gut ist die Bundesregierung auf die Herausforderungen der kommenden Wochen vorbereitet?", "zh": "此外：总理默尔茨的ARD夏日访谈——联邦政府对未来数周的挑战准备得如何？", "start": 910.04, "end": 919.88}, {"de": "Ihnen einen schönen Abend.", "zh": "祝您今晚愉快。", "start": 919.96, "end": 921.88}]}], "vocab": [{"lemma": "die Wettervorhersage, -n", "key": "wettervorhersage", "forms": ["Wettervorhersage"], "pos": "Substantiv", "zh": "天气预报", "example_de": "Und nun die Wettervorhersage für morgen, Montag, den 31.", "example_zh": ""}, {"lemma": "das Tief, -s", "key": "tief", "forms": ["Tiefs", "Tief"], "pos": "Substantiv", "zh": "（气象）低压", "example_de": "August: Unser Wetter bestimmt das Tief, das nach Südschweden zieht.", "example_zh": ""}, {"lemma": "das Hoch, -s", "key": "hoch", "forms": ["Hoch"], "pos": "Substantiv", "zh": "（气象）高压", "example_de": "Der Süden hat es mit einem Hoch über Südwesteuropa zu tun.", "example_zh": ""}, {"lemma": "der Schauer, -", "key": "schauer", "forms": ["Schauer"], "pos": "Substantiv", "zh": "阵雨", "example_de": "Auch im Nordwesten einige Schauer und Gewitter.", "example_zh": ""}, {"lemma": "das Gewitter, -", "key": "gewitter", "forms": ["Gewitter"], "pos": "Substantiv", "zh": "雷雨，雷暴", "example_de": "Auch im Nordwesten einige Schauer und Gewitter.", "example_zh": ""}, {"lemma": "lebhaft", "key": "lebhaft", "forms": ["lebhaft"], "pos": "Adjektiv", "zh": "（风）较强的；活跃的", const WK_RE = /[A-Za-zÄÖÜäöüß][A-Za-zÄÖÜäöüß-]*/g;
const PHRASES = (DATA.phrases || []).slice().sort((a, b) => b.length - a.length);
function lookupKey(surface) {
  return (DATA.form_to_key && DATA.form_to_key[surface.toLowerCase()]) || surface.toLowerCase();
}
function wrapWord(surface, key) {
  const g = getGloss(key);
  const classes = [
    g?.zh ? 'known' : '',
    g?.source === 'editorial' ? 'ed' : '',
    g?.source === 'dict' ? 'wiki' : '',
    basket.some(b => b.key === key) ? 'saved' : ''
  ].filter(Boolean).join(' ');
  return `<w data-w="${esc(key)}" class="${classes}" tabindex="0" role="button" aria-label="${esc(surface)}，查看释义">${esc(surface)}</w>`;
}
function isLetter(ch) { return /[A-Za-zÄÖÜäöüß]/.test(ch || ''); }
function tokenizeDe(text) {
  let html = '', i = 0;
  const lower = text.toLowerCase();
  while (i < text.length) {
    let hit = '';
    if (i === 0 || !isLetter(text[i - 1])) {
      for (const ph of PHRASES) {
        if (lower.startsWith(ph.toLowerCase(), i) && !isLetter(text[i + ph.length])) {
          hit = text.slice(i, i + ph.length);
          break;
        }
      }
    }
    if (hit) {
      html += wrapWord(hit, lookupKey(hit));
      i += hit.length;
      continue;
    }
    if (isLetter(text[i])) {
      let j = i + 1;
      while (j < text.length && /[A-Za-zÄÖÜäöüß-]/.test(text[j])) j++;
      const word = text.slice(i, j);
      html += wrapWord(word, lookupKey(word));
      i = j;
    } else {
      let j = i + 1;
      while (j < text.length && !isLetter(text[j])) j++;
      html += esc(text.slice(i, j));
      i = j;
    }
  }
  return html;
}

  else {
    closeWordEditor();
    if (wasOpen) document.getElementById('basket-btn').focus();
  }
}
document.getElementById('basket-btn').onclick = () => toggleBasket(true);
document.getElementById('scrim').onclick = () => toggleBasket(false);
document.addEventListener('keydown', e => {
  const panel = document.getElementById('basket');
  if (!panel.classList.contains('open')) return;
  if (e.key === 'Escape') {
    e.preventDefault();
    toggleBasket(false);
    return;
  }
  if (e.key !== 'Tab') return;
  const focusable = [...panel.querySelectorAll('button:not([disabled]), a[href], input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])')];
  if (!focusable.length) return;
  const first = focusable[0];
  const last = focusable[focusable.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
});
document.getElementById('bk-list').onclick = e => {
  const btn = e.target.closest('button[data-key]');
  if (!btn) return;
  if (btn.classList.contains('bx')) basketDel(btn.dataset.key);
  else openWordEditor(btn.dataset.key);
};

function openWordEditor(key = null) {
  editingKey = key;
  const item = key ? basket.find(b => b.key === key) : null;
  document.getElementById('edit-word').value = item?.word || '';
  document.getElementById('edit-zh').value = item?.zh || '';
  document.getElementById('edit-example').value = item?.example || '';
  document.getElementById('word-editor').classList.add('open');
  setTimeout(() => document.getElementById('edit-word').focus(), 0);
}
function closeWordEditor() {
  editingKey = null;
  document.getElementById('word-editor').classList.remove('open');
  document.getElementById('word-form').reset();
}
document.getElementById('word-form').onsubmit = e => {
  e.preventDefault();
  const wasEditing = Boolean(editingKey);
  const word = document.getElementById('edit-word').value.trim();
  const zh = document.getElementById('edit-zh').value.trim();
  const example = document.getElementById('edit-example').value.trim();
  if (!word || !zh) return;
  const key = editingKey || word.toLocaleLowerCase('de-DE');
  const item = basket.find(b => b.key === editingKey || (!editingKey && b.key === key));
  if (item) Object.assign(item, { word, zh, example });
  else basket.unshift({ key, word, zh, example, date: DATA.date, manual: true });
  userGloss[key] = { word, zh, example, pos: '' };
  saveStored(GLOSS_KEY, userGloss);
  saveBasket();
  refreshWordMarks();
  renderBasket();
  closeWordEditor();
  toast(wasEditing ? '单词已更新' : '已添加单词');
};

function copyWords() {
  if (!basket.length) { toast('生词本是空的'); return; }
  const text = basket.map(b => `${b.word}\t${b.zh}${b.example ? '\t' + b.example : ''}`).join('\n');
  navigator.clipboard.writeText(text).then(
    () => toast('已复制 ' + basket.length + ' 词'),
    () => toast('复制失败')
  );
}

/* ---------- apkg 导出 ---------- */
const SQLJS_URL = 'https://cdn.jsdelivr.net/npm/sql.js@1.10.3/dist/sql-wasm.wasm';
const SQLJS_JS  = 'https://cdn.jsdelivr.net/npm/sql.js@1.10.3/dist/sql-wasm.js';

function loadScript(src) {
  return new Promise((ok, no) => {
    const s = document.createElement('script');
    s.src = src; s.onload = ok; s.onerror = () => no(new Error('load fail: ' + src));
    document.head.appendChild(s);
  });
}

async function exportApkg() {
  const st = document.getElementById('bk-status');
  const btn = document.getElementById('btn-apkg');
  if (!basket.length) { toast('篮子是空的'); return; }
  btn.disabled = true;
  try {
    st.textContent = '加载 sql.js…';
    if (!window.initSqlJs) {
      await loadScript(SQLJS_JS);
      window.initSqlJs = window.initSqlJs.bind({ locateFile: () => SQLJS_URL });
    }
    const SQL = await window.initSqlJs({ locateFile: () => SQLJS_URL });

    st.textContent = '构建牌组…';
    const db = new SQL.Database();

    // apkg = collection.anki2 + media(空json) — 最小合法集
    db.run(`CREATE TABLE col(
      id integer primary key, crt integer, mod integer, scm integer, ver integer,
      dty integer, usn integer, ls integer, conf text, models text, decks text,
      dconf text, tags text)`);
    const now = Math.floor(Date.now() / 1000);
    const mid = Date.now();
    const deckId = now * 1000;
    const model = {
      [mid]: {
        id: mid, name: 'Deutsch Daily', type: 0, mod: now, usn: 0, sortf: 0,
        did: deckId, tmpls: [{ name: 'Card 1', ord: 0, qfmt: '{{Front}}', afmt: '{{FrontSide}}<hr id=answer>{{Back}}', bqfmt: '', bafmt: '' }],
        flds: [
          { name: 'Front', ord: 0, sticky: false, rtl: false, font: 'Arial', size: 20, media: [] },
          { name: 'Back',  ord: 1, sticky: false, rtl: false, font: 'Arial', size: 20, media: [] }
        ],
        css: `.card{font-family:-apple-system,'Noto Sans SC',sans-serif;font-size:20px;text-align:center;color:#1F2328;background:#FAF7F2;padding:24px}.card b{color:#B3541E}`,
        latexPre: '\\documentclass[12pt]{article}\n\\special{papersize=3in,5in}\n\\usepackage[utf8]{inputenc}\n\\usepackage{amssymb,amsmath}\n\\pagestyle{empty}\n\\setlength{\\parindent}{0in}\n\\begin{document}\n',
        latexPost: '\\end{document}',
        req: [[0, 'all', [0]]], tags: [], vers: []
      }
    };
    const decks = {
      "1": { id: 1, name: 'Default', mod: now, usn: 0, lrnToday: [0,0], revToday: [0,0], newToday: [0,0], timeToday: [0,0], collapsed: false, browserCollapsed: false, desc: '', dyn: 0, conf: 1, extendNew: 10, extendRev: 50 },
      [deckId]: { id: deckId, name: 'Deutsch Daily', mod: now, usn: 0, lrnToday: [0,0], revToday: [0,0], newToday: [0,0], timeToday: [0,0], collapsed: false, browserCollapsed: false, desc: '', dyn: 0, conf: 1, extendNew: 10, extendRev: 50 }
    };
    const conf = {
      activeDecks: [1], addToCur: true, collapseTime: 1200, curDeck: 1,
      curModel: mid, dayLearnFirst: false, dueCounts: true, estTimes: true,
      newSpread: 0, nextPos: 1, schedVer: 2, sched2021: true, sortBackwards: false,
      sortType: "noteFld", timeLim: 0, creationOffset: -480
    };
    const dconf = {
      "1": { id: 1, name: "Default", replayq: true, lapse: { delays: [10, 60], mult: 0, minInt: 1, leechFails: 8, leechAction: 0 }, rev: { perDay: 200, fuzz: 0.05, ivlFct: 1, maxIvl: 36500, ease4: 1.3, bury: true, minSpace: 1 }, timer: 0, maxTaken: 60, new: { separate: true, ints: [1, 4, 7], initialFactor: 2500, bury: true, order: 1 }, mod: 0, usn: 0, autoplay: true }
    };
    db.run(`INSERT INTO col VALUES(?,?,?,?,?,?,?,?,?,?,?,?,?)`, [
      now, now, now * 1000, 0, 11, 0, 0, 0,
      JSON.stringify(conf), JSON.stringify(model), JSON.stringify(decks),
      JSON.stringify(dconf), '{}'
    ]);

    db.run(`CREATE TABLE notes(
      id integer primary key, guid text, mid integer, mod integer, usn integer,
      tags text, flds text, sfld text, csum integer, flags integer, data text)`);
    db.run(`CREATE TABLE cards(
      id integer primary key, nid integer, did integer, ord integer, mod integer,
      usn integer, type integer, queue integer, due integer, ivl integer,
      factor integer, reps integer, lapses integer, left integer, odue integer,
      odid integer, flags integer, data text)`);
    db.run(`CREATE TABLE revlog(
      id integer primary key, cid integer, usn integer, ease integer, ivl integer,
      lastIvl integer, factor integer, time integer, type integer)`);
    db.run(`CREATE TABLE graves(
      usn integer, oid integer, type integer)`);
    db.run(`CREATE INDEX ix_notes_usn on notes (usn)`);
    db.run(`CREATE INDEX ix_cards_usn on cards (usn)`);
    db.run(`CREATE INDEX ix_revlog_usn on revlog (usn)`);
    db.run(`CREATE INDEX ix_cards_nid on cards (nid)`);
    db.run(`CREATE INDEX ix_revlog_cid on revlog (cid)`);
    db.run(`CREATE INDEX ix_notes_csum on notes (csum)`);

    const enc = new TextEncoder();
    function csum(s) { // anki checquers field hash (java String.hashCode)
      let h = 0;
      for (const b of enc.encode(s)) { h = (31 * h + b) | 0; }
      return h;
    }
    function guid(key) {
      let h = 0; const s = 'dd-' + key;
      for (const b of enc.encode(s)) { h = (31 * h + b) | 0; }
      return 'dd' + (h >>> 0).toString(16);
    }

    let nid = now * 1000, cid = (now + 1) * 1000;
    for (const b of basket) {
      const front = b.word;
      const back = `${b.zh}${b.example ? `<br><i>${b.example}</i>` : ''}`;
      const sfld = front;
      const flds = front.replace(/\t/g, ' ') + '\x1f' + back.replace(/\t/g, ' ');
      db.run(`INSERT INTO notes VALUES(?,?,?,?,?,?,?,?,?,?,?)`,
        [nid, guid(b.key), mid, now, -1, ' dd::' + (DATA.slug || b.date || DATA.date) + ' ', flds, sfld, csum(sfld), 0, '']);
      db.run(`INSERT INTO cards VALUES(?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)`,
        [cid, nid, deckId, 0, now, -1, 0, 0, nid, 0, 0, 0, 0, 0, 0, 0, 0, '']);
      nid++; cid++;
    }

    st.textContent = '打包…';
    const data = db.export();
    // zip: meta(version2) + collection.anki2 + collection.anki21(同内容, anki26+导入器优先读) + media
    const zip = makeZip({
      'meta': new Uint8Array([0x08, 0x02]),
      'collection.anki2': data,
      'collection.anki21': data,
      'media': new TextEncoder().encode('{}')
    });
    const blob = new Blob([zip], { type: 'application/apkg' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `deutsch-${basket.length}w-${Date.now()}.apkg`;
    a.click();
    st.textContent = `已导出 ${basket.length} 张卡 — 打开 Anki 导入即可`;
    toast('apkg 已下载');
  } catch (err) {
    console.error(err);
    st.textContent = '导出失败: ' + err.message + ' — 可先用「复制文本」';
  } finally {
    btn.disabled = false;
  }
}

/* 极简 zip (store, 无压缩) — apkg 只需合法 zip */
function makeZip(files) {
  const enc = new TextEncoder();
  const chunks = [], central = [];
  let offset = 0;
  const CRC_TABLE = (() => {
    const t = new Uint32Array(256);
    for (let n = 0; n < 256; n++) {
      let c = n;
      for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
      t[n] = c >>> 0;
    }
    return t;
  })();
  function crc32(buf) {
    let c = 0xFFFFFFFF;
    for (let i = 0; i < buf.length; i++) c = CRC_TABLE[(c ^ buf[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }
  for (const [name, content] of Object.entries(files)) {
    const nameB = enc.encode(name);
    const crc = crc32(content);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true);
    lh.setUint16(4, 20, true);       // version
    lh.setUint16(6, 0, true);        // flags
    lh.setUint16(8, 0, true);        // store
    lh.setUint16(10, 0, true); lh.setUint16(12, 0x2821, true); // time/date(dos)
    lh.setUint32(14, crc, true);
    lh.setUint32(18, content.length, true);
    lh.setUint32(22, content.length, true);
    lh.setUint16(26, nameB.length, true);
    lh.setUint16(28, 0, true);
    chunks.push(new Uint8Array(lh.buffer), nameB, content);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true);
    ch.setUint16(4, 20, true); ch.setUint16(6, 20, true);
    ch.setUint16(8, 0, true); ch.setUint16(10, 0, true);
    ch.setUint16(12, 0, true); ch.setUint16(14, 0x2821, true);
    ch.setUint32(16, crc, true);
    ch.setUint32(20, content.length, true); ch.setUint32(24, content.length, true);
    ch.setUint16(28, nameB.length, true);
    // 30..45 = 0
    ch.setUint32(42, offset, true);
    central.push(new Uint8Array(ch.buffer), nameB);
    offset += 30 + nameB.length + content.length;
  }
  let centralSize = central.reduce((s, c) => s + c.length, 0);
  const eocd = new DataView(new ArrayBuffer(22));
  eocd.setUint32(0, 0x06054b50, true);
  eocd.setUint16(8, Object.keys(files).length, true);
  eocd.setUint16(10, Object.keys(files).length, true);
  eocd.setUint32(12, centralSize, true);
  eocd.setUint32(16, offset, true);
  const total = [...chunks, ...central, new Uint8Array(eocd.buffer)];
  const out = new Uint8Array(total.reduce((s, c) => s + c.length, 0));
  let p = 0;
  for (const c of total) { out.set(c, p); p += c.length; }
  return out;
}

/* ---------- toast ---------- */
let toastT;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(toastT);
  toastT = setTimeout(() => t.style.display = 'none', 1600);
}
