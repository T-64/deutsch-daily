    <script id="dd-data" type="application/json">{"page":"lesson","lesson":{"slug":"2026-10-22","date":"2026-10-22","show":"tagesschau in Einfacher Sprache","level":"A2–B1","kind":"broadcast","note":"","source_url":"https://www.tagesschau.de/tagesschau_in_einfacher_sprache/tse-1480.html","video":{"mp4":"https://tagesschau-progressive.ard-mcdn.de/video/2026/1022/TV-20261022-1739-3800.webl.h264.mp4","embed":"","page":"https://www.tagesschau.de/tagesschau_in_einfacher_sprache/video-1670794.html"},"duration":360.28,"sentences":[{"de":"Willkommen zur tagesschau in Einfacher Sprache.","zh":"欢迎收看简单语言版每日新闻。","start":8.2,"end":11.16},{"de":"Ich bin Susanne Stichler und das sind unsere Nachrichten:","zh":"我是苏珊娜·施蒂希勒，以下是我们的新闻：","start":11.72,"end":15.72},{"de":"Und nun zur ersten Nachricht:","zh":"现在来看第一条新闻：","start":30.4,"end":32.8},{"de":"PHP ist eine Programmiersprache für das Internet.","zh":"PHP是一种用于互联网的编程语言。","start":37.88,"end":43.16},{"de":"Das heißt, mit PHP kann man Sachen ins Internet stellen.","zh":"也就是说，人们可以用PHP把内容放到互联网上。","start":43.76,"end":49.08},{"de":"Jetzt haben Fachleute gemerkt, bei PHP gibt es ein großes Problem mit der Sicherheit.","zh":"现在专业人士发现，PHP存在一个很大的安全问题。","start":49.92,"end":57.6},{"de":"Kriminelle könnten das ausnutzen und z.B. an geheime Daten kommen.","zh":"犯罪分子可能利用这个问题，例如获取秘密数据。","start":57.64,"end":64.52},{"de":"Deshalb haben viele Firmen und Ämter ihre Internetseiten erst mal abgeschaltet.","zh":"因此许多公司和政府部门暂时关闭了它们的网页。","start":65.48,"end":72.48},{"de":"Wenn man auf die Internetseite will, bekommt man eine Fehlermeldung, wie auf dem Foto.","zh":"如果有人想打开这些网页，就会收到一条错误提示，就像照片上显示的那样。","start":73.12,"end":80.4},{"de":"Zu dem Problem bei PHP kommt jetzt ein Film.","zh":"关于PHP的问题现在有一段影片。","start":81.32,"end":84.76},{"de":"Viele Seiten im Internet funktionieren nicht wie sonst.","zh":"互联网上的许多网页无法像平常那样正常运行。","start":86.68,"end":90.52},{"de":"Die Seiten sind abgeschaltet.","zh":"这些网页被关闭了。","start":90.84,"end":92.96},{"de":"Wegen dem Problem mit der Sicherheit bei PHP.","zh":"因为PHP存在安全问题。","start":93.24,"end":96.68},{"de":"Kriminelle sollen keine Möglichkeit bekommen, Daten zu kopieren.","zh":"犯罪分子不应该有机会复制数据。","start":97.72,"end":103.28},{"de":"Dieser Internetfachmann sagt:","zh":"这位互联网专家说：","start":103.96,"end":106.12},{"de":"Die Kriminellen greifen jetzt schon an.","zh":"犯罪分子已经开始攻击了。","start":106.32,"end":108.84},{"de":"Wir müssen uns beeilen.","zh":"我们必须抓紧时间。","start":108.88,"end":110.84},{"de":"Die Kriminellen greifen nicht nur selbst an, sie benutzen auch künstliche Intelligenz, KI.","zh":"犯罪分子不仅自己发起攻击，他们还使用人工智能（AI）。","start":110.88,"end":119.36},{"de":"Ein anderer Internetfachmann sagt:","zh":"另一位互联网专家说：","start":120.08,"end":122.16},{"de":"Die Firmen verteidigen ihre Seiten gegen menschliche Angriffe.","zh":"公司防御针对人类攻击的网页攻击。","start":122.2,"end":126.0},{"de":"Aber wenn KI angreift, dann ist der Angriff zu stark.","zh":"但如果是人工智能发起攻击，那攻击就太强了。","start":126.04,"end":129.76},{"de":"Die Betreiber von den Internetseiten müssen sich beeilen.","zh":"网页的运营者必须抓紧时间。","start":130.24,"end":134.48},{"de":"Sie müssen schnell PHP aktualisieren.","zh":"他们必须尽快更新PHP。","start":134.52,"end":138.44},{"de":"Experten warnen auch die Internetnutzer.","zh":"专家也警告互联网用户。","start":138.88,"end":142.2},{"de":"Z.B. vor falschen Mails.","zh":"例如要警惕伪造的邮件。","start":142.48,"end":145.08},{"de":"Man soll vorsichtig sein, wo man seine Daten eingibt.","zh":"人们应该谨慎，注意在哪里输入自己的数据。","start":145.72,"end":150.24},{"de":"Und nun zur nächsten Nachricht:","zh":"现在来看下一条新闻：","start":151.28,"end":153.92},{"de":"Meta ist eine große Internetfirma.","zh":"Meta是一家大型互联网公司。","start":158.72,"end":161.48},{"de":"Zu Meta gehören z.B. Instagram und Facebook.","zh":"例如Instagram和Facebook都属于Meta。","start":161.52,"end":167.04},{"de":"Vor einigen Jahren gab es ein großes Problem bei Facebook.","zh":"几年前Facebook出现了一个大问题。","start":167.68,"end":172.48},{"de":"Eine andere Firma hat von vielen Facebook-Nutzern Daten untersucht.","zh":"另一家公司研究了大量Facebook用户的数据。","start":173.0,"end":178.68},{"de":"Das hatten die Nutzer aber gar nicht erlaubt.","zh":"但用户们根本没有允许这样做。","start":179.48,"end":182.76},{"de":"Jetzt hat ein Gericht in dem Land USA dazu ein Urteil gemacht.","zh":"现在美国的一个法院对此作出了判决。","start":183.64,"end":188.96},{"de":"Meta muss viele Mrd. Dollar Strafe zahlen.","zh":"Meta必须支付数十亿美元的罚款。","start":189.0,"end":194.04},{"de":"Dazu kommt jetzt ein Film.","zh":"关于这件事现在有一段影片。","start":194.52,"end":196.36},{"de":"Die Firma Cambridge Analytica.","zh":"这家公司叫剑桥分析。","start":196.92,"end":200.16},{"de":"Sie hat die Daten von vielen Facebook-Nutzern untersucht.","zh":"它研究了大量Facebook用户的数据。","start":200.2,"end":204.4},{"de":"Ohne Erlaubnis.","zh":"没有得到许可。","start":204.64,"end":206.16},{"de":"Die Firma hat damit sehr oft gegen Gesetze verstoßen.","zh":"这家公司多次因此违反了法律。","start":206.6,"end":211.04},{"de":"Die Daten sollen u.a. von Politikern genutzt worden sein.","zh":"据称这些数据曾被政治人物利用。","start":211.08,"end":216.04},{"de":"Z.B. bei der Wahl von Donald Trump zum Präsidenten von dem Land USA.","zh":"例如在唐纳德·特朗普竞选美国总统期间。","start":216.4,"end":222.24},{"de":"Mithilfe der Daten wurde gezielt Werbung für die Wahl von Donald Trump gemacht.","zh":"借助这些数据，有人为特朗普的竞选做了有针对性的广告。","start":223.2,"end":228.8},{"de":"In den USA, im Bundesstaat New Mexico, gab es deshalb einen Prozess vor Gericht.","zh":"因此在美国新墨西哥州进行了法庭审理。","start":229.16,"end":235.6},{"de":"Das Gericht sagt, in New Mexico waren viele Facebook-Nutzer betroffen.","zh":"法院表示，新墨西哥州有许多Facebook用户受到影响。","start":235.64,"end":241.48},{"de":"Deshalb muss Meta viele Mrd. Dollar Strafe zahlen.","zh":"因此Meta必须支付数十亿美元的罚款。","start":241.76,"end":246.96},{"de":"Dieser Mann hat New Mexico vor Gericht vertreten.","zh":"这名男子在新墨西哥州的法庭上担任诉讼代表。","start":247.48,"end":251.36},{"de":"Er sagt, das Urteil soll eine Warnung sein.","zh":"他说，这个判决应该是一个警告。","start":251.76,"end":255.84},{"de":"An alle großen Internetfirmen.","zh":"警告所有大型互联网公司。","start":256.04,"end":258.96},{"de":"Meta will wahrscheinlich einen Widerspruch gegen das Urteil machen.","zh":"Meta很可能要对判决提出异议。","start":259.6,"end":264.52},{"de":"Dann muss ein höheres Gericht noch einmal entscheiden.","zh":"届时需要一个更高级的法院再次裁决。","start":264.56,"end":269.4},{"de":"Und nun zur nächsten Nachricht:","zh":"现在来看下一条新闻：","start":270.4,"end":272.6},{"de":"In Brandenburg, rechts, im Osten von Deutschland, hat die Polizei einen Mann festgenommen.","zh":"在勃兰登堡州——位于德国东部，地图上右边——警方逮捕了一名男子。","start":276.28,"end":283.4},{"de":"Die Behörden sagen, der Mann könnte ein Spion für Russland sein.","zh":"有关部门表示，这名男子可能是俄罗斯间谍。","start":283.72,"end":288.8},{"de":"Russland führt einen Krieg gegen die Ukraine.","zh":"俄罗斯正在对乌克兰发动战争。","start":289.36,"end":293.12},{"de":"Und der Mann soll wichtige Informationen für die russische Armee gesammelt haben.","zh":"据称这名男子为俄军收集了重要情报。","start":293.16,"end":299.96},{"de":"Z.B. Informationen über Panzer und Munition.","zh":"例如关于坦克和弹药的信息。","start":300.52,"end":305.48},{"de":"Diese geheimen Informationen soll er an Russland weitergegeben haben.","zh":"据称他把这些秘密情报转交给了俄罗斯。","start":306.32,"end":312.48},{"de":"Der Mann muss deshalb jetzt vielleicht erst mal ins Gefängnis.","zh":"因此这名男子现在可能要暂时入狱。","start":313.2,"end":317.6},{"de":"Darüber entscheidet ein Richter.","zh":"这将由一名法官决定。","start":317.64,"end":320.6},{"de":"Und das waren unsere Nachrichten:","zh":"以上是我们的新闻。","start":321.68,"end":324.32},{"de":"Und jetzt kommt das Wetter.","zh":"现在来看天气预报。","start":339.76,"end":341.96},{"de":"Rechts im Osten und unten im Süden scheint die Sonne.","zh":"在东边和南边，阳光明媚。","start":342.88,"end":346.92},{"de":"Sonst gibt es viele Wolken und Regen.","zh":"其他地区则多云并有雨。","start":347.16,"end":350.48},{"de":"Es werden 8 bis 16 Grad.","zh":"气温为8至16度。","start":350.76,"end":353.4},{"de":"Das war die tagesschau in Einfacher Sprache.","zh":"以上就是简单语言版每日新闻。","start":354.24,"end":357.52},{"de":"Tschüss und bis zum nächsten Mal.","zh":"再见，下次见。","start":357.92,"end":360.28}],"stories":[{"title":"Begrüßung","title_zh":"欢迎","from":0,"to":2,"vocab":[],"grammar":[],"background":""},{"tit
