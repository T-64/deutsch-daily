","start":89.24,"end":95.54},{"de":"Dazu zeigen wir jetzt einen Film.","zh":"接下来我们播放一段影片。","start":95.58,"end":98.54},{"de":"Das ist Melanie.","zh":"这是Melanie。","start":99.5,"end":100.94},{"de":"Sie hat als Kind in diesem Heim gewohnt.","zh":"她小时候住在这个收容所里。","start":101.28,"end":104.32},{"de":"Dort hat sie den Priester, ihren Pflegevater, kennengelernt.","zh":"她在那里认识了这位神父，也就是她的养父。","start":104.98,"end":109.18},{"de":"Melanie sagt, ich musste mich ausziehen.","zh":"Melanie说：我当时必须脱掉衣服。","start":109.38,"end":112.22},{"de":"Er hat meinen Körper angefasst.","zh":"他摸了我的身体。","start":112.62,"end":114.62},{"de":"Und ich musste seinen Körper anfassen.","zh":"我还必须摸他的身体。","start":114.66,"end":117.34},{"de":"Damals hat Melanie nicht darüber geredet.","zh":"当时Melanie没有说过这件事。","start":118.62,"end":121.74},{"de":"Sie konnte lange nicht darüber reden.","zh":"她很长时间都无法谈论这件事。","start":121.94,"end":124.58},{"de":"Der Priester hat sie oft missbraucht.","zh":"这名神父多次侵害她。","start":124.98,"end":127.86},{"de":"Als Melanie 15 war, wurde sie schwanger.","zh":"Melanie15岁的时候怀孕了。","start":128.18,"end":131.58},{"de":"Sie sagt: Ich wusste es nicht.","zh":"她说：我当时并不知道。","start":132.42,"end":135.34},{"de":"Ich musste zum Frauenarzt.","zh":"我被带去看妇科医生。","start":135.9,"end":137.78},{"de":"Ich wusste nicht, warum.","zh":"我不知道为什么。","start":138.38,"end":140.1},{"de":"Ein Arzt hat die Schwangerschaft beendet.","zh":"一名医生终止了妊娠。","start":140.7,"end":144.02},{"de":"Auch das wusste ich nicht.","zh":"这件事我也当时并不知情。","start":144.7,"end":146.86},{"de":"Der Priester ist seit fast fünf Jahren im Gefängnis.","zh":"这名神父已经坐牢快五年了。","start":148.26,"end":152.42},{"de":"Er hat nämlich nach Melanie auch andere Mädchen missbraucht.","zh":"因为在Melanie之后他还侵害了其他女孩。","start":152.82,"end":157.18},{"de":"Melanie hat vor Gericht gegen die katholische Kirche in Köln geklagt.","zh":"Melanie在法院起诉了科隆的天主教会。","start":157.78,"end":162.66},{"de":"Jetzt hat sie Recht bekommen.","zh":"现在她胜诉了。","start":163.42,"end":165.3},{"de":"Melanie ist das Geld nicht so wichtig.","zh":"这笔钱对Melanie来说并不那么重要。","start":165.34,"end":167.98},{"de":"Sie will aber, dass die katholische Kirche Verantwortung übernimmt.","zh":"但她希望天主教会承担起责任。","start":168.7,"end":173.86},{"de":"Melanie sagt:","zh":"Melanie说：","start":173.9,"end":175.22},{"de":"Ich werde nie vergessen, was der Priester gemacht hat.","zh":"我永远不会忘记那个神父做过的事。","start":175.26,"end":179.62},{"de":"Aber ich muss jetzt nicht mehr ins Gericht kommen.","zh":"但我现在不用再去法院了。","start":179.66,"end":183.18},{"de":"Das ist auch ein Ende für diese Sache.","zh":"这件事也算是有了个了结。","start":183.42,"end":186.14},{"de":"Die katholische Kirche muss Melanie 550.000 Euro zahlen.","zh":"天主教会必须向Melanie支付55万欧元。","start":187.02,"end":193.3},{"de":"Und nun zur nächsten Nachricht.","zh":"现在来看下一条新闻。","start":194.16,"end":196.48},{"de":"In den USA gibt es gerade Unwetter.","zh":"美国目前有恶劣天气。","start":200.94,"end":203.78},{"de":"Das bedeutet, es gibt starken Sturm.","zh":"也就是说，有强烈的风暴。","start":204.14,"end":206.7},{"de":"Er macht große Wellen im Meer wie auf dem Foto.","zh":"风暴在海面上掀起巨浪，就像照片上那样。","start":207.1,"end":210.62},{"de":"Deshalb sind manche Orte an der Küste unter Wasser.","zh":"因此沿海的一些地方被水淹没了。","start":211.06,"end":214.46},{"de":"Für viele Menschen ist das schlimm.","zh":"这对很多人来说很糟糕。","start":214.5,"end":217.22},{"de":"Sie wollen nämlich für Thanksgiving zu ihrer Familie reisen.","zh":"因为他们想在感恩节期间回家和家人团聚。","start":217.58,"end":222.58},{"de":"Thanksgiving ist ein Feiertag und heißt auf Deutsch: Danke sagen.","zh":"感恩节是一个节日，德语的意思是：表达感谢。","start":223.42,"end":228.98},{"de":"Die Familien essen an Thanksgiving gemeinsam und danken für das Gute im Leben.","zh":"感恩节时全家人一起吃饭，感谢生活中的美好事物。","start":229.98,"end":235.86},{"de":"Dazu kommt jetzt ein Film.","zh":"接下来播放一段影片。","start":236.38,"end":238.18},{"de":"Die Wellen an der Küste von den USA sind riesig.","zh":"美国海岸边的海浪非常大。","start":239.28,"end":243.84},{"de":"Sie reißen eine Brücke ein, im Osten von den USA, in Kalifornien.","zh":"海浪冲毁了一座桥，在美国东部的加利福尼亚州。","star ":"也就是说，他会倒下，短时间内无法做任何事情。","start":339.78,"end":345.18},{"de":"Musiala trainiert aber weiter und spielt Fußball auch in wichtigen Spielen.","zh":"但穆西亚拉继续训练，也参加重要比赛的足球赛。","start":346.22,"end":351.82},{"de":"Jetzt sagen wichtige Leute von Bayern München, Musiala kann vielleicht nie mehr so gut spielen wie früher.","zh":"现在拜仁慕尼黑的重要人物说，穆西亚拉可能永远无法像以前那样踢得那么好了。","start":352.58,"end":361.14},{"de":"Deshalb überlegen wir, ob Musiala weniger Geld bekommen soll.","zh":"因此他们考虑是否应该给穆西亚拉更少的钱。","start":361.18,"end":367.06},{"de":"Das findet Joshua Kimmich unfair.","zh":"约书亚·基米希觉得这不公平。","start":368.3,"end":371.74},{"de":"Er spielt auch bei Bayern München und ist auf diesem Foto.","zh":"他也在拜仁慕尼黑踢球，就在这张照片上。","start":372.14,"end":376.78},{"de":"Kimmich sagt:","zh":"基米希说：","start":377.1,"end":378.22},{"de":"Diese Leute sollen nicht öffentlich über Musiala reden.","zh":"这些人不应该公开谈论穆西亚拉。","start":378.26,"end":382.5},{"de":"Bayern München ist nämlich wie eine Familie.","zh":"因为拜仁慕尼黑就像一个大家庭。","start":383.06,"end":386.58},{"de":"Und es geht hier um einen Menschen, um Jamal Musiala.","zh":"而且这里关系到一个人，关系到贾马尔·穆西亚拉。","start":386.62,"end":391.86},{"de":"Er ist wichtiger als der Verein.","zh":"他比俱乐部更重要。","start":392.26,"end":395.22},{"de":"Und das waren unsere Nachrichten.","zh":"以上就是我们的新闻。","start":397.94,"end":400.58},{"de":"Und jetzt kommt das Wetter.","zh":"现在播报天气。","start":420.1,"end":422.3},{"de":"Oben im Norden und links im Westen gibt es mal erst Nebel.","zh":"北部和西部先会有雾。","start":423.66,"end":427.86},{"de":"Danach scheint die Sonne.","zh":"之后出太阳。","start":428.14,"end":429.94},{"de":"Rechts im Osten und unten im Süden gibt es viele Wolken und manchmal etwas Schnee.","zh":"东部和南部有很多云，有时会下一点雪。","start":430.18,"end":436.98},{"de":"Es werden - 5 bis 5 Grad.","zh":"气温为零下5度到5度。","start":438.06,"end":441.58},{"de":"Das war die tagesschau in Einfacher Sprache.","zh":"以上就是简单语言版《每日新闻》。","start":442.7,"end":446.26},{"de":"Meldungen und das Video von der Sendung gibt es jetzt auch bei WhatsApp.","zh":"节
