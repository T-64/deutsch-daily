    <div id="root"></div>
    <script id="dd-data" type="application/json">{"page":"lesson","lesson":{"slug":"2026-11-03","date":"2026-11-03","show":"tagesschau in Einfacher Sprache","level":"A2–B1","kind":"broadcast","note":"","source_url":"https://www.tagesschau.de/tagesschau_in_einfacher_sprache/tse-1498.html","video":{"mp4":"https://tagesschau-progressive.ard-mcdn.de/video/2026/1103/TV-20261103-1735-5100.webl.h264.mp4","embed":"","page":"https://www.tagesschau.de/tagesschau_in_einfacher_sprache/video-1677434.html"},"duration":455.06,"sentences":[{"de":"Willkommen zur tagesschau in Einfacher Sprache.","zh":"欢迎收看简单语言版《每日新闻》。","start":10.74,"end":13.98},{"de":"Ich bin Susanne Holst und das sind unsere Nachrichten:","zh":"我是苏珊娜·霍尔斯特，以下是我们的新闻：","start":14.1,"end":17.9},{"de":"Und nun zur ersten Nachricht:","zh":"现在来看第一条新闻：","start":35.58,"end":38.34},{"de":"Die Menschen in den USA wählen ein neues Parlament.","zh":"美国人民正在选举新的议会。","start":42.42,"end":46.54},{"de":"Das Parlament in den USA heißt Kongress.","zh":"美国的议会叫作国会。","start":47.62,"end":51.06},{"de":"Das Gebäude vom Kongress ist auf dem Foto zu sehen.","zh":"国会的建筑可以在照片上看到。","start":51.18,"end":55.06},{"de":"Zwei Parteien treten bei den Wahlen an.","zh":"有两个政党参加这次选举。","start":56.02,"end":58.74},{"de":"Die Republikanische Partei, kurz die Republikaner, mit der Farbe Rot.","zh":"一个是共和党，简称共和党人，代表色是红色。","start":58.94,"end":64.74},{"de":"Und die Demokratische Partei, kurz die Demokraten, mit der Farbe Blau.","zh":"另一个是民主党，简称民主党人，代表色是蓝色。","start":64.78,"end":71.7},{"de":"Jetzt zeigen wir einen Film zu den Wahlen.","zh":"现在我们播放一段关于选举的影片。","start":72.3,"end":75.18},{"de":"Der Kongress in den USA hat zwei Teile.","zh":"美国的国会有两个部分。","start":75.22,"end":78.38},{"de":"Ein Teil ist das Repräsentantenhaus.","zh":"一部分是众议院。","start":78.58,"end":81.14},{"de":"Es ist links auf dem Foto.","zh":"它在照片的左边。","start":81.42,"end":83.26},{"de":"Der andere Teil ist der Senat.","zh":"另一部分是参议院。","start":83.66,"end":85.82},{"de":"Er ist rechts auf dem Foto.","zh":"它在照片的右边。","start":85.94,"end":87.86},{"de":"Das Repräsentantenhaus und der Senat sind im gleichen Gebäude.","zh":"众议院和参议院在同一栋建筑里。","start":88.38,"end":92.7},{"de":"Das Gebäude heißt Kapitol.","zh":"这栋建筑叫作国会大厦。","start":92.74,"end":94.66},{"de":"Es steht in Washington, der Hauptstadt von den USA.","zh":"它位于美国首都华盛顿。","start":94.7,"end":98.26},{"de":"Im Repräsentantenhaus sind 435 Politiker.","zh":"众议院有435名政治家。","start":99.1,"end":102.78},{"de":"Sie heißen Abgeordnete.","zh":"他们被称为议员。","start":103.14,"end":104.78},{"de":"Die Republikaner mit der roten Farbe haben bisher die Mehrheit im Repräsentantenhaus.","zh":"红色代表的共和党目前在众议院占多数。","start":105.42,"end":111.26},{"de":"Alle Abgeordneten im Repräsentantenhaus werden bei der Wahl neu gewählt.","zh":"这次选举中，众议院的所有议员都将重新选举。","start":111.34,"end":116.22},{"de":"Im Senat sind 100 Politiker.","zh":"参议院有100名政治家。","start":116.74,"end":119.54},{"de":"Sie heißen Senatoren.","zh":"他们被称为参议员。","start":119.86,"end":121.5},{"de":"Die Republikaner haben bisher im Senat auch die Mehrheit.","zh":"共和党目前在参议院也占多数。","start":122.82,"end":126.34},{"de":"Nur einige Senatoren im Senat werden bei der Wahl neu gewählt.","zh":"这次选举中只改选部分参议员。","start":126.86,"end":131.14},{"de":"Im Bild sind das die schwarzen Punkte in der Mitte.","zh":"在图中，这就是中间的黑点。","start":131.18,"end":134.74},{"de":"Wir bleiben beim Thema:","zh":"我们继续这个话题：","start":135.66,"end":137.3},{"de":"Auf dem Foto ist der Präsident von den USA, Donald Trump.","zh":"照片上是美国总统唐纳德·特朗普。","start":141.78,"end":145.94},{"de":"Die Wahlen zum Kongress sind für ihn sehr wichtig.","zh":"这次国会选举对他非常重要。","start":146.34,"end":149.86},{"de":"Die Partei von Trump, die Republikaner, haben bisher nämlich in beiden Teilen vom Kongress die Mehrheit.","zh":"因为特朗普的政党，也就是共和党，目前在国会的两个部分都占多数。","start":150.46,"end":158.3},{"de":"Trump bekommt deshalb für seine Politik Unterstützung vom Kongress.","zh":"因此特朗普的政策得到了国会的支持。","start":158.34,"end":162.94},{"de":"Viele Menschen in den USA finden die Politik von Trump aber gerade nicht gut.","zh":"但很多美国人目前并不认同特朗普的政策。","start":162.98,"end":169.26},{"de":"Die Menschen ärgern sich über hohe Preise für Benzin, Strom und Lebensmittel.","zh":"人们对汽油、电力和食品的高价格感到不满。","start":169.62,"end":176.46},{"de":"Die Republikaner verlieren deshalb vielleicht die Wahlen und die Demokraten gewinnen.","zh":"因此共和党可能会输掉选举，民主党会获胜。","start":177.3,"end":183.14},{"de":"Dann haben die Demokraten in einem oder beiden Teilen vom Kongress die Mehrheit.","zh":"那样的话，民主党将在国会的一个或两个部分占多数。","start":183.74,"end":189.34},{"de":"Für Trump wird das Regieren dann schwerer.","zh":"到时候特朗普执政会更困难。","start":189.38,"end":193.06},{"de":"Dazu zeigen wir einen Film.","zh":"为此我们播放一段影片。","start":193.62,"end":195.54},{"de":"Donald Trump hat in den vergangenen Wochen viel Werbung für die Republikanische Partei gemacht.","zh":"唐纳德·特朗普在过去几周为共和党做了很多宣传。","start":196.26,"end":203.22},{"de":"Trumps letzter Auftritt ist in der Hauptstadt Washington.","zh":"特朗普的最后一场活动在首都华盛顿举行。","start":203.82,"end":207.82},{"de":"Trump sagt:","zh":"特朗普说：","start":208.62,"end":209.94},{"de":"Diese Wahlen zum Kongress sind die wichtigsten Wahlen zum Kongress, die es je in den USA gegeben hat.","zh":"这次国会选举是美国有史以来最重要的国会选举。","start":210.58,"end":218.18},{"de":"Ich hoffe, die Menschen tun das Richtige.","zh":"我希望人们做正确的事。","start":218.58,"end":222.14},{"de":"Viele Menschen in den USA haben schon vor dem Wahltermin abgestimmt.","zh":"很多美国人在投票日之前就已经投票了。","start":222.86,"end":228.54},{"de":"Das zeigt, wie wichtig die Wahl für die Menschen ist.","zh":"这说明这次选举对人们有多重要。","start":228.58,"end":233.46},{"de":"Dieser Mann sagt:","zh":"这位男士说：","start":234.34,"end":235.66},{"de":"Ich wähle die Demokraten.","zh":"我投民主党。","start":235.7,"end":237.5},{"de":"Ich finde die Republikaner mies.","zh":"我觉得共和党很糟糕。","start":237.98,"end":240.26},{"de":"Das sage ich offen.","zh":"我公开这么说。","start":240.34,"end":241.7},{"de":"Sie haben den Menschen nicht geholfen.","zh":"他们没有帮助人民。","start":242.3,"end":244.94},{"de":"Dieser Mann sagt:","zh":"这位男士说：","start":246.82,"end":248.22},{"de":"Ich wähle die Republikaner.","zh":"我投共和党。","start":248.26,"end":250.34},{"de":"Ich finde ihre Politik für die Wirtschaft gut.","zh":"我觉得他们的经济政策很好。","start":250.42,"end":253.66},{"de":"Es dauert Tage, bis alle Stimmzettel ausgezählt sind.","zh":"统计所有选票需要几天时间。","start":256.54,"end":261.38},{"de":"In Umfragen liegen die Demokraten vorn.","zh":"在民调中，民主党领先。","start":261.86,"end":264.78},{"de":"Der Abstand zu den Republikanern ist aber klein.","zh":"但与共和党的差距很小。","start":265.18,"end":269.1},{"de":"Das Kapitol ist abgesperrt.","zh":"国会大厦被封锁了。","start":269.58,"end":271.62},{"de":"Aus Angst.","zh":"出于担忧。","start":272.3,"end":273.38},{"de":"Vielleicht gibt es nach der Wahl Proteste.","zh":"选举后可能会有抗议活动。","start":273.66,"end":276.58},{"de":"Das ist nämlich schon passiert.","zh":"因为这种事以前已经发生过。","start":276.94,"end":279.14},{"de":"Und nun zur nächsten Nachricht:","zh":"现在来看下一条新闻：","start":281.06,"end":283.26},{"de":"Auf dem Foto sind Bundeskanzler Friedrich Merz und der Präsident von der Ukraine, Volodymyr Selenskyj.","zh":"照片上是德国联邦总理弗里德里希·默茨和乌克兰总统弗拉基米尔·泽连斯基。","start":287.62,"end":295.02},{"de":"Selenskyj ist zu Besuch in Berlin.","zh":"泽连斯基正在柏林访问。","start":295.66,"end":298.1},{"de":"Merz und Selenskyj haben darüber gesprochen, wie Deutschland der Ukraine im Winter im Krieg gegen Russland helfen kann.","zh":"默茨和泽连斯基讨论了德国如何在冬季帮助乌克兰对抗俄罗斯。","start":298.78,"end":306.78},{"de":"Merz und Selenskyj haben auch über ein Treffen zwischen der Ukraine, Russland und den USA gesprochen.","zh":"默茨和泽连斯基还谈到了乌克兰、俄罗斯和美国之间的一次会面。","start":307.18,"end":314.3},{"de":"Politiker von den Ländern wollen nächste Woche darüber reden, ob es ein Ende vom Krieg gibt.","zh":"这些国家的政治家下周想讨论战争是否会结束。","start":315.1,"end":322.26},{"de":"Dazu kommt ein Film.","zh":"接下来请看一段影片。","start":322.7,"end":324.14},{"de":"Selenskyj und Merz treten gemeinsam vor die Kameras.","zh":"泽连斯基和默茨一起出现在镜头前。","start":324.94,"end":328.38},{"de":"Merz sagt:","zh":"默茨说：","start":328.62,"end":329.78},{"de":"Ich finde es gut, wenn es Gespräche über ein Ende vom Krieg gibt.","zh":"我认为，如果能有关于结束战争的对话，那是好事。","start":330.62,"end":335.46},{"de":"Russland muss aber beweisen, dass es wirklich Frieden will.","zh":"但俄罗斯必须证明，它真的想要和平。","start":335.9,"end":340.06},{"de":"Und Europa muss bei Verhandlungen über Frieden dabei sein.","zh":"而且欧洲必须参与和平谈判。","start":340.22,"end":345.18},{"de":"Das ist wichtig und das weiß Russland.","zh":"这很重要，俄罗斯也知道这一点。","start":345.26,"end":348.22},{"de":"Und nun zur nächsten Nachricht:","zh":"现在来看下一条新闻：","start":349.86,"end":352.06},{"de":"Auf dem Foto ist ein Supermarkt in Schweden.","zh":"照片上是一家瑞典的超市。","start":357.42,"end":360.5},{"de":"Mitarbeiter holen Lebensmittel aus einem Kühlregal und werfen sie weg.","zh":"工作人员把食品从冷藏柜里拿出来，然后扔掉。","start":361.02,"end":365.98},{"de":"Die Lebensmittel sind schlecht geworden.","zh":"这些食品已经变质了。","start":366.5,"end":369.06},{"de":"Man nennt das auch verdorben.","zh":"这也叫做腐败变质。","start":369.1,"end":371.18},{"de":"Die Lebensmittel sind verdorben, weil sie warm geworden sind.","zh":"食品变质是因为它们变热了。","start":371.94,"end":376.22},{"de":"Jemand hat die Kühlregale mit Absicht ausgeschaltet.","zh":"有人故意关掉了冷藏柜。","start":376.78,"end":380.54},{"de":"In vielen Supermärkten in Deutschland und in anderen Ländern ist das auch passiert.","zh":"在德国和其他国家的许多超市里也发生了这种事。","start":381.18,"end":386.7},{"de":"Die Kühlregale sind aber nicht in den Supermärkten abgeschaltet worden.","zh":"但冷藏柜并不是在超市里被关掉的。","start":386.94,"end":392.1},{"de":"Jemand hat das aus der Ferne gemacht.","zh":"有人远程操作了这一切。","start":392.18,"end":394.82},{"de":"Es gibt nämlich eine Firma, die sich um die Kühlanlagen kümmert.","zh":"因为有一家公司负责管理这些冷藏设备。","start":395.54,"end":400.02},{"de":"Die Polizei vermutet, jemand hat das Computerprogramm von der Firma angegriffen.","zh":"警方猜测，有人攻击了这家公司的电脑程序。","start":400.06,"end":406.78},{"de":"Und die Kühlregale auf eine sehr warme Temperatur gestellt.","zh":"并把冷藏柜调到了很高的温度。","start":406.82,"end":411.34},{"de":"Große Mengen Lebensmittel werden jetzt weggeworfen.","zh":"现在有大量食品被扔掉。","start":411.38,"end":415.1},{"de":"Und das waren unsere Nachrichten:","zh":"以上就是我们的新闻：","start":416.18,"end":418.58},{"de":"Und jetzt kommt das Wetter.","zh":"现在播报天气。","start":437.22,"end":439.22},{"de":"Teilweise gibt es Sonnenschein, teilweise ist es trüb und grau.","zh":"有些地方有阳光，有些地方天气阴沉灰暗。","start":440.34,"end":444.78},{"de":"Das war die tagesschau in Einfacher Sprache.","zh":"以上就是简单语言版的每日新闻。","start":449.78,"end":452.86},{"de":"Tschüss, bis zum nächsten Mal.","zh":"再见，下次见。","start":452.9,"end":455.06}],"stories":[{"title":"Begrüßung","title_zh":"问候","from":0,"to":2,"vocab":[],"grammar":[],"background":""},{"title":"Wahlen für den Kongress in den USA","title_zh":"美国国会选举","from":3,"to":26,"vocab":[{"key":"parlament","lemma":"das Parlament, -e","pos":"noun","zh":"议会，国会","example_de":"Die Menschen in den USA wählen ein neues Parlament.","example_zh":"美国人民正在选举新的议会。"},{"key":"waehlen","lemma":"wählen","pos":"verb","zh":"选举，投票","example_de":"Die Menschen in den USA wählen ein neues Parlament.","example_zh":"美国人民正在选举新的议会。"},{"key":"partei","lemma":"die Partei, -en","pos":"noun","zh":"政党","example_de":"Zwei Parteien treten bei den Wahlen an.","example_zh":"有两个政党参加这次选举。"},{"key":"mehrheit","lemma":"die Mehrheit, -en","pos":"noun","zh":"多数，多数派","example_de":"Die Republikaner mit der roten Farbe haben bisher die Mehrheit im Repräsentantenhaus.","example_zh":"红色代表的共和党目前在众议院占多数。"},{"key":"abgeordnete","lemma":"der Abgeordnete, -n","pos":"noun","zh":"议员","example_de":"Sie heißen Abgeordnete.","example_zh":"他们被称为议员。"}],"grammar":[{"title":"Passiv mit werden","summary":"被动语态：werden + 过去分词，表示\"被……\"，如 \"werden ... neu gewählt\"（被重新选举）。","example_de":"Alle Abgeordneten im Repräsentantenhaus werden bei der Wahl neu gewählt.","example_zh":"这次选举中，众议院的所有议员都将重新选举。"}],"background":""},{"title":"Die Wahlen: ein Test für Trump","title_zh":"选举：对特朗普的考验","from":27,"to":59,"vocab":[{"key":"unterstuetzung","lemma":"die Unterstützung","pos":"noun","zh":"支持",
