    <script id="dd-data" type="application/json">{"page":"lesson","lesson":{"slug":"2026-10-29","date":"2026-10-29","show":"tagesschau in Einfacher Sprache","level":"A2–B1","kind":"broadcast","note":"","source_url":"https://www.tagesschau.de/tagesschau_in_einfacher_sprache/tse-1488.html","video":{"mp4":"https://tagesschau-progressive.ard-mcdn.de/video/2026/1029/TV-20261029-1730-5100.webl.h264.mp4","embed":"","page":"https://www.tagesschau.de/tagesschau_in_einfacher_sprache/video-1674640.html"},"duration":432.96,"sentences":[{"de":"Willkommen zur tagesschau in Einfacher Sprache.","zh":"欢迎收看简单语言版每日新闻。","start":11.24,"end":14.48},{"de":"Ich bin Michail Paweletz und das sind unsere Nachrichten.","zh":"我是米哈伊尔·帕韦莱茨，以下是我们的新闻。","start":14.56,"end":19.24},{"de":"Und nun zur ersten Nachricht.","zh":"现在来看第一条新闻。","start":38.2,"end":41.32},{"de":"In Spanien gab es einen Unfall mit zwei Zügen.","zh":"西班牙发生了两列火车相撞的事故。","start":47.52,"end":52.16},{"de":"Ein Zug ist auf den anderen gefahren.","zh":"一列火车撞上了另一列。","start":52.72,"end":56.04},{"de":"Der Unfall ist auf dem Foto.","zh":"照片上就是这次事故。","start":56.4,"end":58.76},{"de":"Er war auf der Strecke von der Hauptstadt Madrid in die Stadt Sevilla, unten im Süden.","zh":"事故发生在从首都马德里到南部城市塞维利亚的线路上。","start":59.64,"end":67.8},{"de":"69 Menschen sind gestorben und viele Menschen sind verletzt.","zh":"69人死亡，许多人受伤。","start":68.48,"end":74.36},{"de":"Helfer suchen weiter nach Opfern.","zh":"救援人员仍在继续寻找遇难者。","start":74.96,"end":77.8},{"de":"Dazu zeigen wir einen Film.","zh":"为此我们播放一段影片。","start":78.6,"end":80.52},{"de":"Auch in der Nacht suchen die Helfer weiter nach Opfern.","zh":"夜间，救援人员仍在继续寻找遇难者。","start":81.4,"end":85.64},{"de":"Die Helfer räumen die Teile von den kaputten Zügen mit den Händen weg.","zh":"救援人员用双手清理破损火车的残骸。","start":85.92,"end":91.48},{"de":"Eine schwere Arbeit.","zh":"这是一项繁重的工作。","start":91.72,"end":93.56},{"de":"Die Züge waren auf dem Weg in die Stadt Sevilla.","zh":"这两列火车当时正开往塞维利亚市。","start":94.28,"end":98.28},{"de":"Dort trauern die Menschen mit Kerzen und Blumen.","zh":"在那里，人们用蜡烛和鲜花悼念遇难者。","start":98.76,"end":102.4},{"de":"Vor dem Parlament von der Region denken die Menschen an die Opfer von dem Unfall.","zh":"在地区议会前，人们缅怀事故的遇难者。","start":103.0,"end":109.32},{"de":"Diese Frau sagt:","zh":"这位女士说：","start":109.68,"end":110.96},{"de":"Ich fahre sehr oft auf der Strecke von Madrid nach Sevilla.","zh":"我经常乘坐马德里到塞维利亚这条线路。","start":111.32,"end":115.48},{"de":"Jetzt habe ich Angst.","zh":"现在我很害怕。","start":115.72,"end":117.24},{"de":"Ich weiß nicht, ob ich noch einmal in den Zug nach Sevilla steige.","zh":"我不知道还会不会再坐开往塞维利亚的火车。","start":117.48,"end":121.8},{"de":"Die Menschen in Madrid protestieren.","zh":"马德里的人们在抗议。","start":122.68,"end":125.32},{"de":"Sie fordern, der Minister für Verkehr und der Chef von der Regierung sollen zurücktreten.","zh":"他们要求交通部长和政府首脑辞职。","start":125.56,"end":132.24},{"de":"Diese Frau sagt, man muss Angst haben beim Bahnfahren in Spanien.","zh":"这位女士说，在西班牙坐火车必须有恐惧心理。","start":132.88,"end":138.52},{"de":"Vor dem Ministerium für Verkehr demonstrieren Rechtsextreme.","zh":"极右翼分子在交通部前举行示威。","start":139.44,"end":144.28},{"de":"Die Polizei beendet die Demonstration.","zh":"警方结束了这场示威。","start":144.52,"end":147.52},{"de":"Einen Tag nach dem Unfall sind Kräne angekommen.","zh":"事故发生一天后，起重机抵达了现场。","start":148.68,"end":152.44},{"de":"Sie heben große Teile von den Zügen hoch.","zh":"它们把火车的巨大部件吊起来。","start":152.88,"end":156.52},{"de":"Die Helfer haben noch viel Arbeit.","zh":"救援人员还有很多工作要做。","start":157.32,"end":160.04},{"de":"Die Suche nach den Opfern dauert noch lange.","zh":"寻找遇难者的工作还将持续很长时间。","start":160.6,"end":163.96},{"de":"Der Chef von der spanischen Regierung, Pedro Sanchez, sagt:","zh":"西班牙政府首脑佩德罗·桑切斯说：","start":164.52,"end":168.6},{"de":"Wir wollen den Familien von den Opfern helfen.","zh":"我们想帮助遇难者的家属。","start":168.72,"end":172.04},{"de":"Und wir wollen herausfinden, warum ist der Unfall passiert.","zh":"我们也想查明事故为什么会发生。","start":172.08,"end":176.44},{"de":"Wir wollen mehr Sicherheit, damit so ein Unfall nie wieder passiert.","zh":"我们想要更多的安全，这样的事故永远不再发生。","start":176.6,"end":181.4},{"de":"Der Unfall ist wahrscheinlich passiert, weil Menschen Fehler gemacht haben.","zh":"事故很可能是因为人为失误造成的。","start":182.0,"end":186.92},{"de":"Auf der Strecke standen mehrere Züge.","zh":"当时有几列火车停在线路上。","start":186.96,"end":189.6},{"de":"Dann durften sie wieder fahren.","zh":"然后它们又被允许继续行驶。","start":189.76,"end":191.88},{"de":"Der rote Zug ist aber stehen geblieben und der weiße Zug ist drauf gefahren.","zh":"但红色火车停住了，白色火车撞了上去。","start":191.92,"end":197.72},{"de":"Die Polizei untersucht den Unfall.","zh":"警方正在调查这起事故。","start":198.32,"end":201.4},{"de":"Auf der Strecke von Madrid nach Sevilla fahren mal erst keine Züge.","zh":"马德里到塞维利亚的线路暂时没有火车运行。","start":201.76,"end":207.12},{"de":"Und nun zur nächsten Nachricht.","zh":"现在来看下一条新闻。","start":208.28,"end":210.8},{"de":"VW ist das kurze Wort für Volkswagen.","zh":"VW是大众汽车公司的缩写。","start":214.96,"end":218.4},{"de":"VW ist eine große deutsche Firma.","zh":"大众是一家大型德国公司。","start":219.12,"end":222.36},{"de":"Sie baut Autos.","zh":"它生产汽车。","start":222.76,"end":224.28},{"de":"Und sie ist wichtig für die deutsche Wirtschaft.","zh":"它对德国经济很重要。","start":224.72,"end":228.08},{"de":"Viele Menschen arbeiten nämlich bei VW.","zh":"因为很多人在大众工作。","start":228.56,"end":232.16},{"de":"Jetzt gibt es aber ein Problem.","zh":"但现在有一个问题。","start":232.68,"end":235.2},{"de":"VW hat Verlust gemacht.","zh":"大众出现了亏损。","start":235.64,"end":238.2},{"de":"Das bedeutet, die Firma hat viel Geld verloren, mehrere Milliarden Euro.","zh":"这意味着公司损失了很多钱，达数十亿欧元。","start":238.6,"end":244.44},{"de":"VW sagt, es gibt mehrere Gründe für den Verlust.","zh":"大众表示，亏损有几个原因。","start":245.32,"end":250.08},{"de":"Wir verkaufen zu wenige Autos in China.","zh":"我们在中国销售的汽车太少。","start":250.4,"end":254.68},{"de":"Wir brauchen viel Geld für Veränderungen in unserer Firma.","zh":"我们需要大量资金来推进公司的变革。","start":255.24,"end":259.68},{"de":"Und die Firma Porsche ist weniger wert.","zh":"而且保时捷公司的价值下降了。","start":260.2,"end":264.56},{"de":"Sie gehört auch zu VW.","zh":"它也隶属于大众。","start":264.92,"end":267.24},{"de":"Und nun zur nächsten Nachricht.","zh":"现在来看下一条新闻。","start":269.2,"end":271.92},{"de":"Der Mann auf dem Foto ist der Bundespräsident.","zh":"照片上的这位男士是联邦总统。","start":275.36,"end":279.44},{"de":"Er heißt Frank-Walter Steinmeier.","zh":"他叫弗兰克-瓦尔特·施泰因迈尔。","start":279.88,"end":282.28},{"de":"Der Bundespräsident macht oft Besuche im Ausland und spricht mit den Regierungen von den Ländern.","zh":"联邦总统经常出访国外，与各国政府交谈。","start":282.96,"end":290.08},{"de":"Jetzt ist Steinmeier in China zu Besuch.","zh":"现在施泰因迈尔正在中国访问。","start":290.4,"end":293.6},{"de":"In der Hauptstadt Peking hat er eine Rede gehalten.","zh":"在首都北京，他发表了演讲。","start":293.8,"end":297.36},{"de":"Was Steinmeier gesagt hat, das zeigen wir jetzt.","zh":"施泰因迈尔说了什么，我们现在来看。","start":297.4,"end":301.2},{"de":"Hier hält der Bundespräsident seine Rede.","zh":"联邦总统在这里发表演讲。","start":302.4,"end":305.8},{"de":"Er sagt, alle Länder sollen sich an Regeln halten, auch China.","zh":"他说，所有国家都应该遵守规则，中国也一样。","start":306.12,"end":312.04},{"de":"Wir brauchen zum Beispiel fairen Handel.","zh":"例如，我们需要公平的贸易。","start":312.32,"end":315.72},{"de":"Und wir brauchen Frieden.","zh":"我们需要和平。","start":316.04,"end":318.16},{"de":"Deshalb soll China Russland sagen, bitte beendet den Krieg gegen die Ukraine.","zh":"因此，中国应该告诉俄罗斯：请结束对乌克兰的战争。","start":318.72,"end":325.68},{"de":"Steinmeier sagt auch, China ist ein großes Land mit viel Macht.","zh":"施泰因迈尔还说，中国是一个拥有很大权力的大国。","start":326.72,"end":332.16},{"de":"In der Politik und in der Wirtschaft.","zh":"在政治上和经济上都是。","start":332.2,"end":335.28},{"de":"Aber wer viel Macht hat, der hat auch viel Verantwortung.","zh":"但谁拥有很大的权力，谁也就承担很大的责任。","start":336.16,"end":340.84},{"de":"Deshalb soll China helfen, etwas gegen den Klimawandel zu tun.","zh":"因此，中国应该帮助采取一些应对气候变化的行动。","start":341.48,"end":347.6},{"de":"Und nun zur nächsten Nachricht.","zh":"现在来看下一条新闻。","start":348.52,"end":351.16},{"de":"Die Frau auf dem Foto ist Elke Sommer.","zh":"照片上的这位女士是埃尔克·佐默。","start":355.4,"end":358.44},{"de":"Sie war eine sehr bekannte Schauspielerin.","zh":"她曾是一位非常著名的女演员。","start":358.92,"end":361.84},{"de":"Sie ist gestorben.","zh":"她去世了。","start":361.92,"end":363.2},{"de":"Sie war 85 Jahre alt.","zh":"她享年85岁。","start":363.24,"end":366.0},{"de":"Jetzt zeigen wir einen kurzen Film.","zh":"现在我们播放一段短片。","start":366.56,"end":369.08},{"de":"Elke Sommer hat in vielen Filmen für das Kino und das Fernsehen gespielt.","zh":"埃尔克·佐默演过许多电影和电视作品。","start":370.04,"end":375.56},{"de":"Und sie hat auch Theater gespielt.","zh":"她还演过话剧。","start":376.0,"end":378.92},{"de":"Elke Sommer war ein großer Star, in Deutschland, in Italien und auch in Hollywood in den USA.","zh":"埃尔克·佐默曾是一位大明星，在德国、意大利，还有美国的好莱坞。","start":379.56,"end":388.44},{"de":"Und das waren unsere Nachrichten.","zh":"以上就是我们的新闻。","start":389.04,"end":391.72},{"de":"Und jetzt kommt das Wetter.","zh":"现在来看天气。","start":410.24,"end":412.36},{"de":"Oben im Norden und rechts im Osten gibt es viele Wolken.","zh":"北部和东部有很多云。","start":413.64,"end":418.2},{"de":"Sonst gibt es zuerst Nebel und danach Sonne.","zh":"其他地区先有雾，之后出太阳。","start":418.52,"end":422.36},{"de":"Es werden 7 bis 15 Grad.","zh":"气温为7至15度。","start":422.68,"end":425.64},{"de":"Das war die tagesschau in Einfacher Sprache.","zh":"以上就是简单语言版每日新闻。","start":427.2,"end":430.28},{"de":"Tschüss, bis zum nächsten Mal.","zh":"再见，下次见。","start":430.72,"end":432.96}],"stories":[{"title":"Begrüßung","title_zh":"欢迎","from":0,"to":2,"vocab":[],"grammar":[],"background":""},{"title":"Zugunfall in Spanien","title_zh":"西班牙火车事故","from":3,"to":38,"vocab":[{"key":"unfall","lemma":"der Unfall, -e","pos":"Substantiv","zh":"事故","example_de":"In Spanien gab es einen Unfall mit zwei Zügen.","example_zh":"西班牙发生了两列火车相撞的事故。"},{"key":"opfer","lemma":"das Opfer, -","pos":"Substantiv","zh":"遇难者；受害者","example_de":"Helfer suchen weiter nach Opfern.","example_zh":"救援人员仍在继续寻找遇难者。"},{"key
