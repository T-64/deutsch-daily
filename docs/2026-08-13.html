    <div id="root"></div>
    <script id="dd-data" type="application/json">{"page":"lesson","lesson":{"slug":"2026-08-13","date":"2026-08-13","show":"tagesschau in Einfacher Sprache","level":"A2–B1","kind":"video","note":"","source_url":"https://www.tagesschau.de/tagesschau_in_einfacher_sprache/video-1630762.html","video":{"mp4":"https://tagesschau-progressive.ard-mcdn.de/video/2026/0813/TV-20260813-1739-4100.webl.h264.mp4","embed":"https://www.tagesschau.de/multimedia/sendung/tagesschau_in_einfacher_sprache/video-1630762~player.html","page":"https://www.tagesschau.de/tagesschau_in_einfacher_sprache/video-1630762.html"},"duration":460.35,"sentences":[{"de":"In Europa gab es eine Sonnenfinsternis.","zh":"欧洲发生了一次日食。","start":34.87,"end":43.99},{"de":"Sie war besonders gut in Spanien zu sehen.","zh":"在西班牙观测效果最好，","start":44.27,"end":46.99},{"de":"Dort war der Himmel dunkel.","zh":"那里天空变暗了。","start":47.03,"end":50.19},{"de":"Die Erde links, der Mond in der Mitte und die Sonne rechts.","zh":"地球在左边，月球在中间，","start":50.39,"end":59.31},{"de":"Sie waren in einer Linie.","zh":"太阳在右边。它们排成了一条直线。","start":59.39,"end":61.19},{"de":"Der Mond hat die Sonne verdeckt.","zh":"月球遮住了太阳。月球本影落在地球上的地方，","start":61.31,"end":63.59},{"de":"Wo der Kernschatten vom Mond auf der Erde war, war die Sonne ganz verdeckt — so wie in Spanien.","zh":"太阳被完全遮挡——就像在西班牙。","start":64.03,"end":70.63},{"de":"Neben dem Kernschatten kam aber noch etwas Licht am Mond vorbei.","zh":"本影旁边还有一些光绕过月球，","start":71.31,"end":75.83},{"de":"Es gab einen Halbschatten — so wie in Deutschland.","zh":"形成半影——就像在德国。","start":76.07,"end":79.79},{"de":"Der Schatten ist über Grönland und Island bis nach Spanien gezogen, auf die Balearen-Inseln.","zh":"阴影从格陵兰岛和冰岛一直延伸到西班牙的巴利阿里群岛。","start":80.27,"end":86.91},{"de":"Viele Menschen in Europa wollten die Sonnenfinsternis sehen, auch in Deutschland.","zh":"许多欧洲人想观看这次日食，德国也是如此。","start":87.87,"end":92.79},{"de":"Hier war die Sonnenfinsternis schwächer als in Spanien.","zh":"不过在德国，日食不如西班牙明显。","start":92.83,"end":96.39},{"de":"Diese Menschen sitzen auf einem Berg in der Mitte von Deutschland.","zh":"这些人坐在德国中部的一座山上观测日食。","start":96.43,"end":104.59},{"de":"Dort beobachten sie die Sonnenfinsternis.","zh":"有些人戴了专门的观测眼镜，","start":105.23,"end":108.83},{"de":"Manche haben eine extra Brille.","zh":"这很重要，","start":109.59,"end":112.11},{"de":"Sie ist wichtig als Schutz gegen die Sonne.","zh":"可以保护眼睛。","start":112.43,"end":115.59},{"de":"Manche haben sich einen Schutz selbst gebastelt.","zh":"有些人自己做了防护工具。","start":116.15,"end":120.15},{"de":"Und dann ist es so weit.","zh":"然后那一刻到了。","start":120.51,"end":125.55},{"de":"Von der Sonne ist nur noch ein Teil zu sehen.","zh":"太阳只剩下一部分可见。","start":126.67,"end":130.11},{"de":"Es wird dunkler am Himmel.","zh":"天空变得更暗。","start":130.35,"end":133.07},{"de":"Eine Frau sagt: \"Als die Sonne weg war, war es kalt.","zh":"一位女士说：\"太阳消失时变冷了，","start":134.19,"end":138.71},{"de":"Ich habe zum Glück einen warmen Pullover.","zh":"幸好我穿了暖和毛衣。","start":138.91,"end":141.71},{"de":"Ich habe gedacht, die Sonne und der Himmel sind so groß.","zh":"我觉得太阳和天空那么大，","start":141.75,"end":145.75},{"de":"Und wir Menschen sind so klein.\"","zh":"我们人类这么渺小。\"","start":145.91,"end":148.39},{"de":"Auch in der Stadt Berlin wollten die Menschen die Sonnenfinsternis sehen.","zh":"柏林和慕尼黑的人们也来观看日食。","start":150.35,"end":160.87},{"de":"Und auch in der Stadt München waren die Menschen deshalb gekommen. Alle haben etwas Besonderes erlebt.","zh":"每个人都经历了特别的时刻。","start":160.91,"end":168.19},{"de":"Bis zur nächsten großen Sonnenfinsternis dauert es in Deutschland noch lange. Sie ist im Jahr 2081.","zh":"德国下一次大型日食要等到2081年。","start":168.79,"end":177.27},{"de":"In Berlin gab es früher eine Mauer. Die Mauer hat die Stadt geteilt — in Ost und West. Der westliche Teil gehörte zur BRD.","zh":"柏林以前有一堵墙，把城市分成东西两部分。","start":178.51,"end":199.43},{"de":"Das ist das kurze Wort für Bundesrepublik Deutschland. Der östliche Teil gehörte zur DDR. Das ist das kurze Wort für Deutsche Demokratische Republik.","zh":"西部属于联邦德国（BRD），东部属于民主德国（DDR）。","start":199.95,"end":211.67},{"de":"Die DDR hat die Mauer gebaut vor 65 Jahren, am 13. August 1961. Die Regierung von der DDR hat damals gesagt: \"Nur manche Menschen dürfen über die Grenze in den Westen reisen.","zh":"65年前，1961年8月13日，东德修建了这堵墙。","start":212.31,"end":228.67},{"de":"Für die meisten Menschen sind Reisen in den Westen aber verboten.\"","zh":"东德政府说：\"只有少数人可以越境去西部。","start":228.79,"end":233.27},{"de":"Deshalb wurden manche Familien getrennt.","zh":"对大多数人来说，去西部是被禁止的。","start":233.31,"end":236.11},{"de":"Und Freunde konnten sich nicht mehr besuchen.","zh":"\"因此一些家庭被迫分离，朋友不能再见面。","start":236.43,"end":239.59},{"de":"Diese Aufnahmen sind von früher, deshalb sind sie Schwarz-Weiß.","zh":"这些影像是以前的，","start":239.71,"end":247.27},{"de":"Soldaten von der DDR bauen die Mauer quer durch die Stadt Berlin.","zh":"所以是黑白的。","start":247.43,"end":253.19},{"de":"Die Mauer trennt Ost und West.","zh":"东德士兵在柏林城中建墙。","start":253.87,"end":256.03},{"de":"In der Zeitung steht: \"Ost-Berlin ist abgeriegelt.\"","zh":"报纸上写着：\"东柏林已被封锁。","start":257.99,"end":261.55},{"de":"Das bedeutet: niemand kann über die Grenze in den Westen.","zh":"\"意思是没人能越境去西部。","start":262.43,"end":267.23},{"de":"Der Mann links ist Walter Ulbricht. Er war der Chef von der DDR.","zh":"左边那个人是瓦尔特·乌布利希，东德的领导人。","start":267.99,"end":273.39},{"de":"Er hat gesagt: \"Niemand baut eine Mauer.\" Das war aber gelogen.","zh":"他曾说\"没人要建墙\"——但那是谎言。","start":274.11,"end":279.63},{"de":"Die Mauer hat plötzlich Familien und Freunde getrennt.","zh":"这堵墙突然将家庭和朋友分开。","start":280.15,"end":283.99},{"de":"Viele Menschen sind aus dem Osten in den Westen geflohen.","zh":"许多人从东部逃到西部。","start":284.43,"end":288.43},{"de":"Die Flucht aus der DDR war schwierig und gefährlich.","zh":"出逃困难而危险，","start":289.35,"end":300.75},{"de":"Viele Menschen sind dabei gestorben.","zh":"许多人在此过程中丧生。尽管如此，","start":301.95,"end":304.99},{"de":"Trotzdem haben Menschen immer wieder versucht, über die Grenze zu kommen — zum Beispiel mit einer Leiter, durch einen Tunnel, oder mit dem Auto.","zh":"人们还是不断尝试越境——用梯子、挖隧道或开车。","start":305.87,"end":316.75},{"de":"Die Mauer stand 28 Jahre lang.","zh":"墙矗立了28年。","start":317.19,"end":320.51},{"de":"1989 ist die Mauer gefallen.","zh":"1989年柏林墙倒塌。","start":321.19,"end":324.31},{"de":"Die Menschen aus der DDR durften über die Grenze in den Westen kommen.","zh":"东德人民终于可以越境来到西部。","start":324.87,"end":330.31},{"de":"In Italien ist vor einigen Tagen ein Vulkan ausgebrochen.","zh":"几天前意大利的一座火山喷发了。","start":331.63,"end":341.91},{"de":"Er heißt Ätna und ist auf der Insel Sizilien, im Süden von Italien.","zh":"它叫埃特纳火山，","start":342.47,"end":347.59},{"de":"In der Nähe vom Ätna ist ein Flughafen.","zh":"位于意大利南部的西西里岛。","start":347.99,"end":350.71},{"de":"Er ist jetzt gesperrt.","zh":"附近的机场现在已经关闭，","start":350.99,"end":352.55},{"de":"Deshalb sitzen manche Touristen auf der Insel fest.","zh":"一些游客被困在岛上，","start":352.87,"end":356.91},{"de":"Sie müssen warten oder zu einem anderen Flughafen fahren.","zh":"必须等待或前往其他机场。","start":357.71,"end":361.71},{"de":"Das ist der Ätna von oben.","zh":"这是从上方看到的埃特纳火山。","start":361.87,"end":365.91},{"de":"Aus dem Vulkan kommen Gas und Asche.","zh":"火山喷出气体和火山灰，","start":366.35,"end":368.91},{"de":"Wegen der Asche in der Luft können die Flugzeuge nicht fliegen.","zh":"因空气中的火山灰，","start":369.19,"end":373.43},{"de":"Aus dem Vulkan kommen auch Steine und Lava.","zh":"飞机无法飞行。","start":373.47,"end":376.79},{"de":"Das ist die rote, heiße Flüssigkeit.","zh":"火山还喷出石头和熔岩——红色炽热的液体，","start":377.23,"end":379.43},{"de":"Sie ist gefährlich für Menschen.","zh":"对人体有危险。尽管如此，","start":379.47,"end":381.75},{"de":"Viele sind aber trotzdem gekommen, um den Vulkan aus der Nähe zu sehen.","zh":"还是有很多人来近处观看火山。","start":382.35,"end":387.35},{"de":"In der Hauptstadt von Frankreich, Paris, ist gerade die Schwimm-EM — die Europameisterschaft für Schwimmen.","zh":"在法国首都巴黎，","start":388.11,"end":401.31},{"de":"Der Mann vorne auf dem Foto ist Johannes Liebmann.","zh":"正在举行游泳欧锦赛。","start":401.55,"end":405.07},{"de":"Er war der Schnellste beim Schwimmen über 800 Meter.","zh":"照片前面的约翰内斯·利布曼是800米游泳中最快的选手，","start":405.43,"end":409.07},{"de":"Dafür hat er eine Goldmedaille bekommen.","zh":"获得金牌。","start":409.47,"end":412.27},{"de":"Hinter ihm auf dem Foto ist Sven Schwarz.","zh":"他后面的斯文·施瓦茨是第二名，","start":412.99,"end":415.87},{"de":"Er war der Zweitschnellste und hat eine Silbermedaille bekommen.","zh":"获得银牌。比赛是自由泳，","start":416.31,"end":420.83},{"de":"Das Schwimmen war im Freistil.","zh":"运动员可以自己选择泳姿，","start":420.95,"end":423.63},{"de":"Die Sportler konnten sich die Schwimmtechnik selbst aussuchen, zum Beispiel Brustschwimmen.","zh":"比如蛙泳。","start":424.11,"end":430.75},{"de":"Und jetzt kommt das Wetter.","zh":"现在是天气预报。","start":450.35,"end":452.27},{"de":"Die Sonne scheint.","zh":"阳光明媚。","start":453.23,"end":454.51},{"de":"Nur oben im Norden und rechts im Westen gibt es ein paar Wolken.","zh":"只有北部上方和西部右侧有一些云。","start":454.63,"end":459.15},{"de":"Es ist trocken.","zh":"天气干燥。","start":459.27,"end":460.35}],"stories":[{"title":"Sonnenfinsternis: Himmel wird dunkel","title_zh":"日食：天空变暗","from":0,"to":26,"vocab":[{"key":"sonnenfinsternis","lemma":"die Sonnenfinsternis","pos":"","zh":"日食","example_de":"In Europa gab es eine Sonnenfinsternis.","example_zh":""},{"key":"verdecken","lemma":"verdecken","pos":"Verb","zh":"遮挡","example_de":"Der Mond hat die Sonne verdeckt.","example_zh":""},{"key":"kernschatten","lemma":"der Kernschatten","pos":"","zh":"本影","example_de":"Wo der Kernschatten vom Mond auf der Erde war, war die Sonne ganz verdeckt — so wie in Spanien.","example_zh":""},{"key":"halbschatten","lemma":"der Halbschatten","pos":"","zh":"半影","example_de":"Es gab einen Halbschatten — so wie in Deutschland.","example_zh":""},{"key":"beobachten","lemma":"beobachten","pos":"Verb","zh":"观察","example_de":"Dort beobachten sie die Sonnenfinsternis.","example_zh":""},{"key":"brille","lemma":"die Brille","pos":"","zh":"眼镜","example_de":"Manche haben eine extra Brille.","example_zh":""},{"key":"schutz","lemma":"der Schutz","pos":"","zh":"保护","example_de":"Sie ist wichtig als Schutz gegen die Sonne.","example_zh":""},{"key":"basteln","lemma":"basteln","pos":"Verb","zh":"手工制作","example_de":"Manche haben sich einen Schutz selbst gebastelt.","example_zh":""},{"key":"schwach","lemma":"schwach","pos":"","zh":"弱的","example_de":"Hier war die Sonnenfinsternis schwächer.","example_zh":""},{"key":"erleben","lemma":"erleben","pos":"Verb","zh":"经历","example_de":"Alle haben etwas Besonderes erlebt.","example_zh":""}],"grammar":[{"title":"比较级","summary":"比较级 —schwächer als— 形容词加 -er 构成比较级，用 als 连接：schwach → schwächer。\"Hier war die Sonnenfinsternis schwächer als in Spanien.\"（这里日食比西班牙更弱。）","example_de":"Hier war die Sonnenfinsternis schwächer als in Spanien.","example_zh":""},{"title":"sich etwas basteln（反身）","summary":"sich etwas basteln（反身） sich (Dat.) etwas basteln = 给自己手工做某物。\"Manche haben sich einen Schutz selbst gebastelt.\"（有些人给自己做了防护。）","example_de":"Manche haben sich einen Schutz selbst gebastelt.","example_zh":""}],"background":"2026年8月13日的日食全食带经过北欧和西班牙。德国大部分地区只能看到偏食。观测日食必须使用专门的日食眼镜，普通太阳镜不够安全。德国下一次能看到的日全食要等到2081年。"},{"title":"Vor 65 Jahren: Mauer in Berlin gebaut","title_zh":"65年前：柏林墙建成","from":27,"to":47,"vocab":[{"key":"mauer","lemma":"die Mauer","pos":"","zh":"墙","example_de":"In Berlin gab es früher eine Mauer.","example_zh":""},{"key":"teilen","lemma":"teilen","pos":"Verb","zh":"分割","example_de":"Die Mauer hat die Stadt geteilt.","example_zh":""},{"key":"gehören-zu","lemma":"gehören zu","pos":"","zh":"属于","example_de":"Der westliche Teil gehörte zur BRD.","example_zh":""},{"key":"grenze","lemma":"die Grenze","pos":"","zh":"边界","example_de":"Die Regierung von der DDR hat damals gesagt: \"Nur manche Menschen dürfen über die Grenze in den Westen reisen.","example_zh":""},{"key":"verboten","lemma":"verboten","pos":"Verb","zh":"被禁止的","example_de":"Für die meisten Menschen sind Reisen in den Westen aber verbote 关闭","example_de":"Der Flughafen ist gesperrt.","example_zh":""},{"key":"fest-sitzen","lemma":"fest-sitzen","pos":"","zh":"被困住","example_de":"Touristen sitzen auf der Insel fest.","example_zh":""},{"key":"asche","lemma":"die Asche","pos":"","zh":"火山灰","example_de":"Aus dem Vulkan kommen Gas und Asche.","example_zh":""},{"key":"lava","lemma":"die Lava","pos":"","zh":"熔岩","example_de":"Aus dem Vulkan kommen auch Steine und Lava.","example_zh":""},{"key":"flüssigkeit","lemma":"die Flüssigkeit","pos":"","zh":"液体","example_de":"Das ist die rote, heiße Flüssigkeit.","example_zh":""},{"key":"heiß","lemma":"heiß","pos":"","zh":"热的","example_de":"Das ist die heiße Flüssigkeit.","example_zh":""},{"key":"aus-der-nähe","lemma":"aus der Nähe","pos":"Redewendung","zh":"从近处","example_de":"Viele sind aber trotzdem gekommen, um den Vulkan aus der Nähe zu sehen.","example_zh":""}],"grammar":[{"title":"Wegen + 第二格","summary":"Wegen + 第二格 \"Wegen der Asche in der Luft können die Flugzeuge nicht fliegen.\"（因为空气中的火山灰，飞机无法飞行。）wegen = because of。","example_de":"Wegen der Asche in der Luft können die Flugzeuge nicht fliegen.","example_zh":""},{"title":"um ... zu（目的从句）","summary":"um ... zu（目的从句） \"Viele sind gekommen, um den Vulkan zu sehen.\"（很多人来了，是为了看火山。）= in order to。","example_de":"Viele sind gekommen, um den Vulkan zu sehen.","example_zh":""}],"background":"埃特纳火山是欧洲最高最活跃的火山，位于西西里岛东岸，海拔约3357米。附近的卡塔尼亚机场因火山灰影响飞行安全经常临时关闭。火山灰对航空发动机极其危险——2010年冰岛火山灰也曾导致欧洲大面积航班取消。"},{"title":"Schwimm-EM: Medaillen für Deutsche","title_zh":"游泳欧锦赛：德国选手获奖","from":61,"to":68,"vocab":[{"key":"em","lemma":"die EM (Europameisterschaft)","pos":"","zh":"欧锦赛","example_de":"In der Hauptstadt von Frankreich, Paris, ist gerade die Schwimm-EM — die Europameisterschaft für Schwimmen.","example_zh":""},{"key":"medaille","lemma":"die Medaille","pos":"","zh":"奖牌","example_de":"Er hat eine Goldmedaille bekommen.","example_zh":""},{"key":"schnellste","lemma":"der Schnellste","pos":"","zh":"最快的人","example_de":"Er war der Schnellst
