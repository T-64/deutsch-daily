<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Deutsch Daily — 2026-08-27</title>
<style>
  :root {
    --bg: #eef2f0;
    --surface: #ffffff;
    --surface-2: #f7f9f8;
    --ink: #172127;
    --ink-soft: #647077;
    --line: #dce4e1;
    --accent: #176b72;
    --accent-strong: #0d5057;
    --accent-soft: #dceeed;
    --warm: #d98f39;
    --warm-soft: #fff0d9;
    --zh: #5f696f;
    --danger: #b3493f;
    --shadow: 0 18px 50px rgba(20, 46, 47, .10);
    --shadow-soft: 0 8px 24px rgba(20, 46, 47, .07);
  }
  [data-theme="dark"] {
    --bg: #111719; --surface: #192124; --surface-2: #202a2d;
    --ink: #edf3f1; --ink-soft: #a9b7b8; --line: #344145;
    --accent: #75cbd0; --accent-strong: #99dfe2; --accent-soft: #223e40;
    --warm: #f0b35e; --warm-soft: #3b3022; --zh: #bac5c5;
    --shadow: 0 18px 50px rgba(0,0,0,.28); --shadow-soft: 0 8px 24px rgba(0,0,0,.22);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { scroll-behavior: smooth; scroll-padding-top: 90px; }
  body {
    min-height: 100vh; background: var(--bg); color: var(--ink);
    font: 16px/1.65 Inter, ui-sans-serif, system-ui, -apple-system, "Noto Sans SC", sans-serif;
    transition: background .2s, color .2s;
  }
  button, input, textarea { font: inherit; }
  button, a { -webkit-tap-highlight-color: transparent; }
  button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible {
    outline: 3px solid color-mix(in srgb, var(--accent) 35%, transparent); outline-offset: 2px;
  }
  .app { width: min(1280px, calc(100% - 48px)); margin: 0 auto; padding: 24px 0 100px; }
  .topbar {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    min-height: 42px; margin-bottom: 34px;
  }
  .brand {
    display: inline-flex; align-items: center; gap: 10px; color: var(--ink);
    font-weight: 800; letter-spacing: -.02em; text-decoration: none;
  }
  .brand-mark {
    display: grid; place-items: center; width: 30px; height: 30px; border-radius: 9px;
    background: var(--accent); color: #fff; font: 800 12px/1 ui-monospace, monospace;
  }
  .top-actions { display: flex; align-items: center; gap: 8px; }
  .icon-btn, .archive-link, .text-btn {
    min-height: 38px; border: 1px solid var(--line); border-radius: 12px;
    background: var(--surface); color: var(--ink-soft); cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; text-decoration: none;
  }
  .icon-btn { width: 38px; }
  .archive-link, .text-btn { gap: 7px; padding: 0 13px; font-size: 13px; font-weight: 700; }
  .hero { margin-bottom: 26px; }
  .eyebrow {
    color: var(--accent); font-size: 12px; font-weight: 800; letter-spacing: .12em;
    text-transform: uppercase; margin-bottom: 9px;
  }
  .hero h1 {
    max-width: 720px; font: 750 clamp(29px, 4vw, 50px)/1.08 ui-serif, Georgia, serif;
    letter-spacing: -.04em;
  }
  .hero-meta { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 13px; color: var(--ink-soft); font-size: 14px; }
  .hero-meta span { display: inline-flex; align-items: center; gap: 7px; }

  .study-grid { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: clamp(20px, 3.2vw, 48px); align-items: start; }
  .side {
    position: sticky; top: 16px; max-height: calc(100vh - 24px);
    display: flex; flex-direction: column; min-height: 0;
  }
  .study-panel {
    display: flex; flex-direction: column; gap: 16px; min-height: 0; max-height: calc(100vh - 24px);
    background: transparent; border: 0; box-shadow: none; overflow: visible;
  }
  .video-card {
    position: relative; flex: 0 0 auto; overflow: hidden; background: #071012;
    border-radius: 24px; box-shadow: var(--shadow-soft);
  }
  .player { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #071012; }
  .player iframe, .player video { position: absolute; inset: 0; display: block; width: 100%; height: 100%; border: 0; background: #071012; }
  .video-drag {
    display: none; position: absolute; z-index: 3; top: 0; left: 0; right: 36px; height: 32px;
    cursor: grab; touch-action: none;
    background: linear-gradient(to bottom, rgba(0,0,0,.5), transparent);
  }
  .video-drag:active { cursor: grabbing; }
  .video-float-close {
    display: none; border: 0; background: rgba(255,255,255,.14); color: #fff;
    width: 28px; height: 28px; border-radius: 50%; cursor: pointer;
  }
  .rail {
    display: flex; flex-direction: column; flex: 1; min-height: 0;
    padding: 18px 18px 16px; border: 1px solid var(--line); border-radius: 24px;
    background: var(--surface); box-shadow: var(--shadow-soft); overflow: hidden;
  }
  .rail-bar { padding: 0 0 12px; }
  .controls { display: flex; width: 100%; }
  .controls button {
    flex: 1; min-height: 40px; padding: 0 14px; border: 1px solid var(--line); border-radius: 12px;
    background: var(--surface-2); color: var(--ink-soft); cursor: pointer; font-size: 14px; font-weight: 750;
  }
  .controls button.on { border-color: var(--accent); background: var(--accent); color: #fff; }
  .hero-meta a { color: var(--accent); text-decoration: none; font-weight: 700; }
  .hero-meta a:hover { text-decoration: underline; }
  .topic-nav { flex: 1; min-height: 0; overflow-y: auto; padding: 0; scrollbar-gutter: stable; }
  .topic { border-top: 1px solid var(--line); }
  .topic:first-child { border-top: 0; }
  .topic > a {
    display: grid; grid-template-columns: 32px minmax(0,1fr); gap: 10px; align-items: start;
    padding: 11px 0; color: var(--ink); text-decoration: none;
  }
  .topic > a span {
    min-width: 0; padding-top: 5px;
    font: 650 15px/1.35 ui-serif, Georgia, serif; letter-spacing: -.015em;
  }
  .topic > a:hover span { color: var(--accent); }
  .topic b {
    display: grid; place-items: center; width: 32px; height: 32px; border-radius: 10px;
    background: var(--accent-soft); color: var(--accent-strong);
    font: 800 11px/1 ui-monospace, monospace;
  }
  .topic.on b { background: var(--accent); color: #fff; }
  .topic.on > a span { color: var(--accent-strong); }
  .topic-study { display: none; padding: 0 0 12px; }
  .topic.on .topic-study { display: block; }
  .topic-study .empty-study { color: var(--ink-soft); font-size: 13px; padding: 6px 0; }
  .study-tabs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-top: 2px; }
  .study-tabs.n2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .study-tabs.n1 { grid-template-columns: 1fr; }
  .stab {
    min-height: 32px; padding: 0 6px; border: 1px solid var(--line); border-radius: 11px;
    background: var(--surface-2); color: var(--ink-soft); cursor: pointer;
    font-size: 12px; font-weight: 750;
  }
  .stab:hover { border-color: var(--accent); color: var(--accent-strong); }
  .stab.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-strong); }
  .spane { display: none; margin-top: 6px; }
  .spane.on { display: block; }
  .vrow {
    display: grid; grid-template-columns: minmax(0,1fr) 28px; gap: 8px; align-items: start;
    padding: 10px 0; border-top: 1px dashed var(--line);
  }
  .vrow .vw { color: var(--ink); font: 750 14.5px/1.35 ui-serif, Georgia, serif; }
  .vrow .vz { margin-top: 4px; color: var(--accent-strong); font-size: 13.5px; }
  .vrow .vex { margin-top: 6px; color: var(--ink-soft); font-size: 13px; font-style: italic; }
  .vadd {
    width: 28px; height: 28px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--surface); color: var(--accent-strong); cursor: pointer;
    font: 700 18px/1 ui-sans-serif, system-ui;
  }
  .vadd:hover { border-color: var(--accent); background: var(--accent-soft); }
  .rail-note { margin: 0; padding: 10px 0; color: var(--ink-soft); font-size: 13.5px; line-height: 1.7; }
  .rail-note + .rail-note { border-top: 1px dashed var(--line); }
  .rail-note strong { display: block; margin-bottom: 4px; color: var(--ink); font: 750 14.5px/1.35 ui-serif, Georgia, serif; }
  .rail-note i { display: block; margin-bottom: 6px; }
  @media (min-width: 841px) { .article-extras { display: none; } }

  .reader { min-width: 0; }
  .first-run {
    display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 16px; align-items: start;
    margin-bottom: 16px; padding: 16px 18px; border: 1px solid var(--line); border-radius: 16px;
    background: var(--accent-soft); color: var(--ink-soft); font-size: 13.5px;
  }
  .first-run[hidden] { display: none; }
  .first-run strong { display: block; margin-bottom: 3px; color: var(--accent-strong); }
  .first-run button { border: 0; background: transparent; color: var(--ink-soft); cursor: pointer; font-weight: 800; }
  .legend { color: var(--ink-soft); }
  article {
    scroll-margin-top: 24px; margin-bottom: 22px; padding: clamp(22px, 4vw, 38px);
    border: 1px solid var(--line); border-radius: 24px; background: var(--surface);
    box-shadow: var(--shadow-soft);
  }
  .n-head { display: grid; grid-template-columns: 42px minmax(0,1fr); gap: 13px; align-items: start; margin-bottom: 24px; }
  .n-idx {
    display: grid; place-items: center; width: 42px; height: 42px; border-radius: 13px;
    background: var(--accent-soft); color: var(--accent-strong); font: 800 13px/1 ui-monospace, monospace;
  }
  .n-head h2, .h-zh {
    padding-top: 3px;
    color: var(--ink);
    font: 750 clamp(21px, 3vw, 28px)/1.25 ui-serif, Georgia, "Noto Serif CJK SC", "Noto Serif SC", serif;
    letter-spacing: -.025em;
  }
  .h-zh { margin-top: 6px; padding-top: 0; }
  .para { display: flex; flex-direction: column; align-items: stretch; margin-bottom: 22px; }
  .para:last-child { margin-bottom: 8px; }
  .sent {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    width: 100%;
    min-width: 0;
    margin: 0 0 0.8em;
  }
  .sent[data-start] { cursor: pointer; }
  .de {
    max-width: 100%;
    font: var(--reader-size, 18.5px)/1.55 ui-serif, Georgia, "Noto Serif", serif;
    letter-spacing: .003em;
  }
  .de w {
    cursor: pointer; border-radius: 4px; transition: background .12s, color .12s;
    text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px;
    text-decoration-color: transparent;
  }
  .de w:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; background: var(--accent-soft); }
  .de w:hover, .de w:active { background: var(--warm-soft); text-decoration-color: var(--warm); }
  .de w.known { text-decoration-color: color-mix(in srgb, var(--accent) 55%, transparent); }
  .de w.ed { text-decoration-style: solid; text-decoration-thickness: 1.5px; }
  .de w.wiki { text-decoration-style: dotted; text-decoration-color: color-mix(in srgb, var(--ink-soft) 55%, transparent); }
  .de w.saved { color: var(--accent-strong); background: var(--accent-soft); text-decoration-color: transparent; }
  .sent.now .de {
    background: color-mix(in srgb, var(--accent-soft) 70%, transparent);
    border-radius: 4px;
  }
  .zh {
    margin-top: 3px;
    width: 100%;
    max-width: 100%;
    color: var(--ink);
    font: 400 15.5px/1.45 Inter, ui-sans-serif, "Noto Sans SC", sans-serif;
  }
  body.hide-zh .zh { display: none; }
  body.hide-zh .para { display: block; }
  body.hide-zh .sent { display: inline; width: auto; margin: 0 0.45em 0 0; }
  body.hide-zh .sent .de { display: inline; line-height: 1.82; }
  .n-head .h-zh {
    margin-top: 6px;
    padding-top: 0;
    color: var(--ink);
    font: 750 clamp(21px, 3vw, 28px)/1.25 ui-serif, Georgia, "Noto Serif CJK SC", "Noto Serif SC", serif;
    letter-spacing: -.025em;
  }
  .article-extras details { margin-top: 10px; border: 1px solid var(--line); border-radius: 13px; background: var(--surface-2); }
  .article-extras details summary {
    list-style: none; cursor: pointer; padding: 12px 14px; color: var(--ink-soft);
    display: flex; align-items: center; gap: 9px; font-size: 13px; font-weight: 750;
  }
  .article-extras details summary::before {
    content: "+"; display: inline-grid; place-items: center; width: 20px; height: 20px;
    border-radius: 7px; background: var(--surface); color: var(--accent); font-size: 14px;
  }
  .article-extras details[open] summary::before { content: "−"; }
  .article-extras details summary::-webkit-details-marker { display: none; }
  .article-extras details .body { padding: 2px 14px 15px 43px; color: var(--ink-soft); font-size: 13.5px; line-height: 1.75; }
  .article-extras details .body strong { color: var(--ink); }
  .vcard { display: grid; grid-template-columns: minmax(0,1fr) 28px; gap: 8px; align-items: start; padding: 10px 0; border-bottom: 1px dashed var(--line); }
  .vcard:last-child { border-bottom: 0; }
  .gcard { padding: 12px 0; border-bottom: 1px dashed var(--line); }
  .gcard:last-child { border-bottom: 0; }
  .vcard-top, .gcard h4 { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px; font: 750 14.5px/1.35 ui-serif, Georgia, serif; color: var(--ink); }
  .article-extras .vadd {
    width: 28px; height: 28px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--surface); color: var(--accent-strong); cursor: pointer;
    font: 700 18px/1 ui-sans-serif, system-ui;
  }
  .vpos { color: var(--ink-soft); font: 750 11px/1.2 ui-sans-serif, system-ui; letter-spacing: .06em; text-transform: uppercase; }
  .vzh { margin-top: 4px; color: var(--accent-strong); font-size: 13.5px; }
  .vex, .gex { margin-top: 6px; color: var(--ink-soft); font-size: 13px; font-style: italic; }
  .gexzh { color: var(--zh); font-size: 12.5px; }
  .gmore { margin-top: 8px; color: var(--ink-soft); font-size: 13px; }
  .bg-note { margin: 0 0 8px; color: var(--ink-soft); font-size: 12px; }

  .scrim { position: fixed; inset: 0; z-index: 55; display: none; background: rgba(7,16,18,.48); backdrop-filter: blur(3px); }
  .scrim.on { display: block; }
  #pop {
    position: fixed; z-index: 70; display: none; width: min(360px, calc(100vw - 24px));
    border: 1px solid var(--line); border-radius: 18px; padding: 18px;
    background: var(--surface); color: var(--ink); box-shadow: var(--shadow);
  }
  #pop.open { display: block; }
  .pop-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  #pop .pw { font: 750 21px/1.2 ui-serif, Georgia, serif; word-break: break-word; }
  #pop .pp { margin-top: 3px; color: var(--ink-soft); font-size: 11px; font-weight: 750; letter-spacing: .08em; text-transform: uppercase; }
  #pop .pclose { border: 0; background: var(--surface-2); color: var(--ink-soft); width: 30px; height: 30px; border-radius: 9px; cursor: pointer; }
  #pop .pz { margin-top: 12px; color: var(--accent-strong); font-weight: 700; }
  #pop .pz:empty::after { content: "还没有释义，你可以自己补充"; color: var(--ink-soft); font-weight: 400; }
  #pop .pe { margin-top: 9px; padding-top: 9px; border-top: 1px solid var(--line); color: var(--ink-soft); font-size: 12.5px; font-style: italic; }
  .pop-actions { display: flex; gap: 8px; margin-top: 14px; }
  .pbtn, .secondary-btn, .primary-btn {
    min-height: 40px; border-radius: 11px; padding: 0 13px; cursor: pointer; font-size: 13px; font-weight: 750;
  }
  .pbtn { flex: 1; border: 1px solid var(--accent); background: var(--accent); color: #fff; }
  .pbtn.in { border-color: var(--line); background: var(--surface-2); color: var(--ink-soft); }
  .secondary-btn { border: 1px solid var(--line); background: var(--surface); color: var(--ink-soft); }
  .primary-btn { border: 1px solid var(--accent); background: var(--accent); color: #fff; }
  .word-form { display: grid; gap: 11px; }
  .word-form label { display: grid; gap: 5px; color: var(--ink-soft); font-size: 12px; font-weight: 700; }
  .word-form input, .word-form textarea {
    width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px;
    background: var(--surface-2); color: var(--ink); resize: vertical;
  }
  .word-form textarea { min-height: 66px; }
  .form-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 3px; }

  #basket-btn {
    position: fixed; right: 22px; bottom: max(22px, env(safe-area-inset-bottom)); z-index: 45;
    display: inline-flex; align-items: center; gap: 9px; min-height: 48px; padding: 0 18px;
    border: 0; border-radius: 15px; background: var(--ink); color: var(--surface);
    box-shadow: var(--shadow); cursor: pointer; font-weight: 800;
  }
  #basket-btn .cnt { min-width: 23px; padding: 2px 7px; border-radius: 99px; background: var(--warm); color: #172127; font-size: 12px; }
  #basket {
    position: fixed; inset: 0 0 0 auto; z-index: 65; width: min(440px, 100vw);
    display: flex; flex-direction: column; padding: 24px 24px calc(24px + env(safe-area-inset-bottom));
    background: var(--surface); box-shadow: -20px 0 60px rgba(7,16,18,.18);
    transform: translateX(105%); transition: transform .22s ease;
  }
  #basket.open { transform: translateX(0); }
  #basket .bhead { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 16px; }
  #basket .bhead h3 { font-size: 22px; letter-spacing: -.02em; }
  #basket .bhead p { margin-top: 2px; color: var(--ink-soft); font-size: 12.5px; }
  #basket .bclose { border: 0; background: var(--surface-2); color: var(--ink-soft); width: 36px; height: 36px; border-radius: 11px; font-size: 20px; cursor: pointer; }
  .basket-add { width: 100%; margin-bottom: 12px; }
  #basket .blist { overflow-y: auto; flex: 1; padding-right: 4px; }
  .bitem { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 5px 10px; padding: 13px 0; border-bottom: 1px solid var(--line); }
  .bitem .bw { font: 750 16px/1.3 ui-serif, Georgia, serif; }
  .bitem .bz { grid-column: 1; color: var(--accent-strong); font-size: 13px; }
  .bitem .be { grid-column: 1; overflow: hidden; color: var(--ink-soft); font-size: 11.5px; text-overflow: ellipsis; white-space: nowrap; }
  .bitem-actions { grid-column: 2; grid-row: 1 / span 3; align-self: center; display: flex; gap: 3px; }
  .bitem-actions button { border: 0; background: transparent; color: var(--ink-soft); padding: 7px; cursor: pointer; font-size: 12px; }
  .bitem-actions .bx { color: var(--danger); }
  #basket .bfoot { display: flex; gap: 8px; margin-top: 14px; }
  #basket .bfoot button { flex: 1; }
  #basket .bfoot button:disabled { opacity: .5; cursor: wait; }
  #basket .bstatus { min-height: 18px; margin-top: 8px; color: var(--ink-soft); text-align: center; font-size: 12px; }
  .bempty { padding: 42px 14px; color: var(--ink-soft); text-align: center; font-size: 13px; }
  .bempty b { display: block; margin-bottom: 5px; color: var(--ink); font-size: 15px; }
  #word-editor {
    display: none; padding: 15px; margin-bottom: 12px; border: 1px solid var(--line);
    border-radius: 14px; background: var(--surface-2);
  }
  #word-editor.open { display: block; }
  #toast {
    position: fixed; left: 50%; bottom: 28px; z-index: 90; display: none;
    transform: translateX(-50%); padding: 10px 16px; border-radius: 12px;
    background: var(--ink); color: var(--surface); box-shadow: var(--shadow); font-size: 13px; font-weight: 700;
  }
  @media (max-width: 840px) {
    .app { width: min(100% - 28px, 720px); padding-top: 15px; padding-left: max(14px, env(safe-area-inset-left)); padding-right: max(14px, env(safe-area-inset-right)); }
    .topbar { margin-bottom: 24px; }
    .study-grid { display: block; }
    .side { position: static; max-height: none; margin-bottom: 18px; }
    .study-panel { display: contents; max-height: none; }
    .video-card { border-radius: 20px; box-shadow: var(--shadow); }
    .rail {
      position: sticky; top: env(safe-area-inset-top); z-index: 30; margin: 10px 0 18px; padding: 8px 12px;
      border-radius: 20px;
    }
    .rail-bar { padding: 0; }
    .topic-nav { display: none; }
    .video-card.floating {
      position: fixed; z-index: 48; top: 72px; right: 10px; left: auto; width: min(48vw, 210px);
      border: 1px solid rgba(255,255,255,.2); border-radius: 14px; box-shadow: 0 18px 45px rgba(0,0,0,.28);
    }
    .video-card.floating .video-drag { display: block; }
    .video-card.floating .video-float-close { display: block; position: absolute; z-index: 4; top: 6px; right: 6px; }
    .video-card.float-off { display: none; }
    article { border-radius: 20px; }
  }
  @media (max-width: 560px) {
    .app { width: 100%; padding: 12px 12px 88px; padding-left: max(12px, env(safe-area-inset-left)); padding-right: max(12px, env(safe-area-inset-right)); }
    .brand span:last-child { display: none; }
    .text-btn { padding: 0 10px; font-size: 12px; }
    .archive-link { width: 38px; padding: 0; font-size: 0; }
    .archive-link svg { width: 17px; }
    .hero { padding: 0 5px; margin-bottom: 18px; }
    .hero h1 { font-size: 30px; }

<script>
const DATA = {"date": "2026-08-27", "slug": "2026-08-27-20uhr", "source": "20uhr", "source_label": "T-64 · tagesschau 20:00 Uhr", "source_short": "20:00 Uhr", "video_page": "https://www.tagesschau.de/tagesschau_20_uhr/video-1638502.html", "embed_url": "https://www.tagesschau.de/tagesschau_20_uhr/video-1638502~player.html", "mp4_url": "https://tagesschau-progressive.ard-mcdn.de/video/2026/0827/TV-20260827-2021-5500.webl.h264.mp4", "duration": 946.08, "news": [{"title": "Mehr als 380 Tote und mindestens 1.300 Vermisste nach Sturzflut im Himalaya", "title_zh": "喜马拉雅山洪：逾380人遇难 至少1300人失踪", "paras": [{"start": 4.28, "end": 51.0, "lines": [{"de": "Hier ist das Erste Deutsche Fernsehen mit der tagesschau.", "zh": "这里是德国电视一台，带来今日新闻。", "start": 4.28, "end": 7.84}, {"de": "Heute im Studio: Thorsten Schröder.", "zh": "今天演播室主持：托尔斯滕·施罗德。", "start": 15.48, "end": 18.0}, {"de": "Guten Abend, ich begrüße Sie zur tagesschau.", "zh": "晚上好，欢迎收看今日新闻。", "start": 18.24, "end": 21.32}, {"de": "In Nepal ist die Lage einen Tag nach der Sturzflut noch unübersichtlich.", "zh": "山洪暴发一天后，尼泊尔的局势仍然混乱。", "start": 21.48, "end": 26.6}, {"de": "Fest steht: Mehr als 380 Menschen sind ums Leben gekommen, mindestens 1300 werden vermisst.", "zh": "可以确定的是：超过380人丧生，至少1300人失踪。", "start": 26.68, "end": 32.56}, {"de": "Als Ursache für die Flut wird ein Gletscherabbruch vermutet, im Grenzgebiet zur von China kontrollierten Region Tibet.", "zh": "洪水的原因推测是冰川崩解，发生在与中国管辖的西藏地区接壤的边境地带。", "start": 33.04, "end": 40.56}, {"de": "Der löste wohl eine starke Erschütterung aus und eine gewaltige Lawine aus Schlamm, Geröll und Eis.", "zh": "它很可能引发了一次强烈震动，以及一场由泥浆、碎石和冰块组成的巨大雪崩。", "start": 41.04, "end": 47.56}, {"de": "Entlang mehrerer Flüsse wurden riesige Flächen zerstört.", "zh": "沿多条河流，大片土地被摧毁。", "start": 47.64, "end": 51.0}]}, {"start": 53.28, "end": 136.88, "lines": [{"de": "Was diese Frau seit der Flut erlebt hat, lässt sich nur erahnen.", "zh": "这位女士自洪水以来经历了什么，只能靠想象。", "start": 53.28, "end": 57.32}, {"de": "Eine Baggerschaufel ist für sie der einzige Weg aus dem Schlamm.", "zh": "一台挖掘机铲斗是她脱离泥浆的唯一出路。", "start": 57.4, "end": 61.32}, {"de": "Nur einen Tag zuvor blieb vielen kaum Zeit, sich zu retten.", "zh": "就在前一天，许多人几乎来不及逃生。", "start": 61.44, "end": 65.24}, {"de": "Straßen, Brücken und ganze Dörfer sind fort, viele Orte von der Außenwelt abgeschnitten.", "zh": "道路、桥梁和整座村庄消失，许多地方与外界隔绝。", "start": 65.32, "end": 71.76}, {"de": "Getroffen wurde eine der wichtigsten Verbindungen zwischen Nepal und Tibet.", "zh": "受灾的是尼泊尔与西藏之间最重要的通道之一。", "start": 72.4, "end": 77.64}, {"de": "Ein zentraler Grenzübergang für Handel und Tourismus, von dem hier viele leben.", "zh": "一个贸易和旅游的中央口岸，当地人很多以此为生。", "start": 78.56, "end": 83.92}, {"de": "Aus meiner Familie sind meine beiden älteren Brüder gestorben.", "zh": "我家里我的两个哥哥去世了。", "start": 86.6, "end": 90.48}, {"de": "Nur die Kinder haben überlebt.", "zh": "只有孩子们活了下来。", "start": 90.56, "end": 92.6}, {"de": "In meiner Familie sind 13 Menschen gestorben.", "zh": "我们家死了13口人。", "start": 92.68, "end": 95.68}, {"de": "Vor einem Armeestützpunkt warten Angehörige auf Informationen zu den Vermissten.", "zh": "在一个军事基地前，家属们等待失踪者的消息。", "start": 97.84, "end": 103.56}, {"de": "Rettungstrupps arbeiten sich durch den Schlamm.", "zh": "救援队在泥浆中艰难推进。", "start": 103.64, "end": 106.52}, {"de": "Wo auf dem Landweg nichts mehr geht, sind Hubschrauber die einzige Verbindung: Sie bringen Überlebende heraus und Lebensmittel, medizinische Hilfe und Zelte hinein.", "zh": "陆路完全不通的地方，直升机是唯一的联络方式：它们把幸存者运出来，把食品、医疗援助和帐篷送进去。", "start": 106.6, "end": 117.32}, {"de": "Die Straßen sind nicht mehr befahrbar.", "zh": "道路已经无法通行。", "start": 117.4, "end": 119.96}, {"de": "Alle Patienten werden mit Rettungshubschraubern hergebracht.", "zh": "所有病人都是用救援直升机送到这里来的。", "start": 120.08, "end": 123.92}, {"de": "Über die Straße wären es viel mehr Patienten.", "zh": "走公路的话病人会多得多。", "start": 124.0, "end": 127.16}, {"de": "Und die Gefahr ist nicht vorbei.", "zh": "而且危险还没有过去。", "start": 129.32, "end": 131.52}, {"de": "Weitere Überschwemmungen könnten folgen.", "zh": "可能还会发生更多洪水。", "start": 131.6, "end": 134.28}, {"de": "Flussnahe Orte werden geräumt.", "zh": "临河的村庄正在撤离。", "start": 134.6, "end": 136.88}]}, {"start": 139.72, "end": 228.52, "lines": [{"de": "Damit zu Markus Spieker in der Hauptstadt Nepals, Kathmandu.", "zh": "现在连线在尼泊尔首都加德满都的马库斯·施皮克。", "start": 139.72, "end": 143.92}, {"de": "Was sind für die Menschen vor Ort die größten Herausforderungen?", "zh": "对当地民众来说，最大的挑战是什么？", "start": 144.68, "end": 148.84}, {"de": "Hier in Kathmandu werden viele der Menschen behandelt, Verletzte, die geborgen wurden, haben wir im Beitrag gesehen.", "zh": "在加德满都，很多伤者在这里接受治疗，我们在报道里看到了被救出的伤员。", "start": 151.36, "end": 159.56}, {"de": "Sie wurden mit dem Helikopter hergeflogen.", "zh": "他们是被直升机送来的。", "start": 159.96, "end": 162.88}, {"de": "80 bis 100 Kilometer entfernt ist es hier.", "zh": "离这里80到100公里。", "start": 163.08, "end": 167.16}, {"de": "Die Straßen und Brücken sind teilweise zerstört.", "zh": "道路和桥梁部分被毁。", "start": 167.32, "end": 170.68}, {"de": "Man wird davon abgehalten, nahe des Flusses zu gehen.", "zh": "人们被劝阻不要靠近河边。", "start": 170.8, "end": 174.52}, {"de": "Es drohen weitere Überschwemmungen.", "zh": "可能有更多洪水。", "start": 174.6, "end": 177.12}, {"de": "In vier bis fünf Tagen könnte es eine größere Flutwelle geben, laut chinesischen Behörden.", "zh": "据中国方面消息，四五天后可能会出现更大的洪峰。", "start": 177.2, "end": 183.56}, {"de": "Wie groß ist das Ausmaß der Zerstörung?", "zh": "破坏的程度有多严重？", "start": 183.68, "end": 186.4}, {"de": "Man muss sich vorstellen, dass ein 100 Meter breiter Eisblock in die Tiefe kracht und für apokalyptische Verhältnisse sorgt.", "zh": "可以想象，一个100米宽的冰块砸向深处，造成末日般的景象。", "start": 189.24, "end": 199.24}, {"de": "So, wie das aussieht, hat mir jemand gesagt, dass die Opferzahlen noch viel höher sind.", "zh": "从现场情况看，有人告诉我，遇难人数还要高得多。", "start": 199.4, "end": 205.52}, {"de": "Es wurden ganze Dörfer weggeschwemmt.", "zh": "整座整座的村庄被冲走。", "start": 205.6, "end": 208.16}, {"de": "Die chinesischen Behörden melden geringe Opferzahlen.", "zh": "中国方面通报的遇难人数很少。", "start": 208.28, "end": 212.0}, {"de": "Vor allem die gehen wahrscheinlich noch dramatisch in die Höhe.", "zh": "尤其是这个数字很可能还会急剧上升。", "start": 212.24, "end": 216.68}, {"de": "Danke mach Kathmandu.", "zh": "谢谢，加德满都连线。", "start": 217.32, "end": 218.84}, {"de": "Sie können für die Menschen im Katastrophengebiet spenden: An das Bündnis Entwicklung hilft und die Aktion Deutschland hilft.", "zh": "您可以为灾区民众捐款：捐给“发展援助联盟”和“德国援助行动”。", "start": 220.68, "end": 228.52}]}], "vocab": [{"lemma": "der Gletscherabbruch", "key": "gletscherabbruch", "forms": ["Gletscherabbruch"], "pos": "Substantiv", "zh": "冰川崩解，冰川崩塌", "example_de": "Als Ursache für die Flut wird ein Gletscherabbruch vermutet, im Grenzgebiet zur von China kontrollierten Region Tibet.", "example_zh": ""}, {"lemma": "die Erschütterung, -en", "key": "erschuetterung", "forms": ["Erschütterung"], "pos": "Substantiv", "zh": "震动，震荡", "example_de": "Der löste wohl eine starke Erschütterung aus und eine gewaltige Lawine aus Schlamm, Geröll und Eis.", "example_zh": ""}, {"lemma": "das Geröll", "key": "geroell", "forms": ["Geröll"], "pos": "Substantiv", "zh": "碎石，岩屑", "example_de": "Der löste wohl eine starke Erschütterung aus und eine gewaltige Lawine aus Schlamm, Geröll und Eis.", "example_zh": ""}, {"lemma": "abschneiden", "key": "abschneiden", "forms": ["abgeschnitten", "abschneiden"], "pos": "Verb", "zh": "切断，隔绝", "example_de": "Straßen, Brücken und ganze Dörfer sind fort, viele Orte von der Außenwelt abgeschnitten.", "example_zh": ""}, {"lemma": "der Grenzübergang, ¨-e", "key": "grenzuebergang", "forms": ["Grenzübergang"], "pos": "Substantiv", "zh": "边境口岸，过境点", "example_de": "Ein zentraler Grenzübergang für Handel und Tourismus, von dem hier viele leben.", "example_zh": ""}, {"lemma": "sich heranarbeiten", "key": "sich-heranarbeiten", "forms": ["arbeiten sich durch", "sich heranarbeiten"], "pos": "Verb", "zh": "艰难推进，奋力挤进", "example_de": "Rettungstrupps arbeiten sich durch den Schlamm.", "example_zh": ""}, {"lemma": "räumen", "key": "raeumen", "forms": ["geräumt", "räumen"], "pos": "Verb", "zh": "清空，撤离", "example_de": "Flussnahe Orte werden geräumt.", "example_zh": ""}, {"lemma": "spenden", "key": "spenden", "forms": ["spenden"], "pos": "Verb", "zh": "捐款，捐赠", "example_de": "Sie können für die Menschen im Katastrophengebiet spenden: An das Bündnis Entwicklung hilft und die Aktion Deutschland hilft.", "example_zh": ""}], "grammar_points": [{"title": "feststehen：事实确定", "summary": "feststehen 表示“已经可以确定”，这里作插入语放在句首并倒装为 Fest steht，冒号后接具体内容，强调确定性。", "example_de": "Fest steht: Mehr als 380 Menschen sind ums Leben gekommen, mindestens 1300 werden vermisst.", "example_zh": "可以确定的是：超过380人丧生，至少1300人失踪。"}, {"title": "von ... abgeschnitten：与……隔绝", "summary": "许多地方 von der Außenwelt abgeschnitten（与外界隔绝）。介词 von 引出被隔绝的对象，分词 abgeschnitten 作表语。", "example_de": "Straßen, Brücken und ganze Dörfer sind fort, viele Orte von der Außenwelt abgeschnitten.", "example_zh": "道路、桥梁和整座村庄消失，许多地方与外界隔绝。"}], "background": "2026年8月26日，尼泊尔与中国西藏接壤的边境地区发生冰川崩解引发的特大山洪。这是对前一天灾情的后续报道，死亡与失踪人数大幅上升。节目提到中国官方通报的数字偏低，救援主要依靠直升机。"}, {"title": "Fraktionsklausur von Union und SPD in Münster", "title_zh": "联盟党与社民党在明斯特举行议会党团闭门会议", "paras": [{"start": 239.52, "end": 265.32, "lines": [{"de": "Ob Rente, Steuern oder Gesundheit: Die schwarz-rote Koalition will in diesem Herbst große Reformen beschließen.", "zh": "无论是养老金、税收还是医疗：黑红联盟想在今年秋天通过重大改革。", "start": 239.52, "end": 246.8}, {"de": "Um sich darauf vorzubereiten, beraten heute und morgen die Fraktionsspitzen von Union und SPD in Münster.", "zh": "为了做好准备，联盟党和社会民主党的议会党团领导人今明两天在明斯特磋商。", "start": 246.88, "end": 253.08}, {"de": "Sie wollen eine gemeinsame Linie finden.", "zh": "他们想找到一条共同路线。", "start": 253.16, "end": 255.72}, {"de": "Zuletzt hatte es bei Themen geknirscht: Bei den Steuerentlastungen oder bei der Abschaffung der abschlagsfreien Rente nach 45 Beitragsjahren.", "zh": "此前在一些议题上曾有摩擦：比如减税方案，或者取消缴费满45年不扣减的养老金。", "start": 255.8, "end": 265.32}]}, {"start": 267.32, "end": 362.76, "lines": [{"de": "Kommt die Rentenreform wie vorgesehen oder sind Änderung möglich, etwa bei der Rente nach 45 Beitragsjahren?", "zh": "养老金改革会按计划推进，还是可能有修改，比如45年缴费养老金那部分？", "start": 267.32, "end": 274.2}, {"de": "Unionfraktionschef Frei warnt vor Änderungen, die Vorschläge seien aufeinander abgestimmt.", "zh": "联盟党议会党团主席弗雷警告不要修改，说这些方案是相互协调一致的。", "start": 274.28, "end": 280.04}, {"de": "Deswegen muss man sehr vorsichtig sein: Dass man nicht an einer Stelle Veränderungen vornimmt, die das Gesamtkonstrukt ins Wanken bringen können.", "zh": "所以必须非常小心：不要在某一个地方做改动，以致动摇整体方案。", "start": 280.12, "end": 290.52}, {"de": "Die Union will nichts verändern.", "zh": "联盟党不想改动任何东西。", "start": 290.6, "end": 292.6}, {"de": "Bei SPD-Fraktionschef Miersch klingt das anders.", "zh": "社民党议会党团主席米尔斯克的口径则不一样。", "start": 292.68, "end": 295.6}, {"de": "Wir sind alle in Kontakt mit Bürgern.", "zh": "我们都和民众有接触。", "start": 295.88, "end": 298.52}, {"de": "Wir sehen, dass das ein zentrales Thema ist, ein Gerechtigkeitsthema.", "zh": "我们看到这是一个核心议题，一个公平议题。", "start": 298.64, "end": 303.12}, {"de": "Wir haben den Diskurs mit unseren Ministerpräsidenten.", "zh": "我们和各州州长进行了讨论。", "start": 303.2, "end": 306.68}, {"de": "Am Ende kriegen wir mit Empathie einen guten Kompromiss hin.", "zh": "最后我们会带着同理心达成一个好的妥协。", "start": 306.8, "end": 311.32}, {"de": "Bei einem sind sich die Fraktionsspitzen bei ihre PK einig: Nichthandeln führe nicht zu besseren Umfragewerten.", "zh": "在一点上，两党领导人在记者会上是一致的：不作为不会带来更好的民调数字。", "start": 313.92, "end": 321.76}, {"de": "Die Diagnose ist einfach.", "zh": "诊断很简单。", "start": 322.0, "end": 323.92}, {"de": "Die Umfragewerte und Wahlergebnisse bilden die Unzufriedenheit der Menschen mit Politik ab.", "zh": "民调和选举结果显示的是民众对政治的不满。", "start": 326.12, "end": 333.0}, {"de": "Menschen sind frustriert, weil sie mit Händen greifen können, dass bestimmte Entscheidungen seit Jahren nicht getroffen wurden.", "zh": "人们感到沮丧，因为他们能切身感受到，某些决定多年来一直没有做出。", "start": 334.6, "end": 343.24}, {"de": "Die will die Koalition nachholen, aber: Die Rentenfrage schwebt über allem und drückt die Stimmung, besonders bei der SPD.", "zh": "联盟想补上这些，但是：养老金问题笼罩着一切，压着气氛，尤其对社民党而言。", "start": 344.12, "end": 353.4}, {"de": "Wahlkämpfer sagen: Das Thema sei Nummer eins bei Wählern.", "zh": "竞选人士说：这个议题在选民心中排第一。", "start": 353.48, "end": 357.12}, {"de": "Ob die SPD die Abschaffung der Rente mit 63 mitträgt, ist nicht sicher.", "zh": "社民党是否会支持取消63岁养老金，还不确定。", "start": 357.2, "end": 362.76}]}], "vocab": [{"lemma": "die Klausur, -en", "key": "klausur", "forms": ["Klausur", "Fraktionsklausur"], "pos": "Substantiv", "zh": "闭门会议", "example_de": "Um sich darauf vorzubereiten, beraten heute und morgen die Fraktionsspitzen von Union und SPD in Münster.", "example_zh": ""}, {"lemma": "die Fraktionsspitze, -n", "key": "fraktionsspitze", "forms": ["Fraktionsspitzen", "Fraktionsspitze"], "pos": "Substantiv", "zh": "议会党团领导层", "example_de": "Um sich darauf vorzubereiten, beraten heute und morgen die Fraktionsspitzen von Union und SPD in Münster.", "example_zh": ""}, {"lemma": "knirschen", "key": "knirschen", "forms": ["geknirscht", "knirschen"], "pos": "Verb", "zh": "发出摩擦声，（引申）有摩擦、不畅", "example_de": "Zuletzt hatte es bei Themen geknirscht: Bei den Steuerentlastungen oder bei der Abschaffung der abschlagsfreien Rente nach 45 Beitragsjahren.", "example_zh": ""}, {"lemma": "die Abschaffung, -en", "key": "abschaffung", "forms": ["Abschaffung"], "pos": "Substantiv", "zh": "废除，取消", "example_de": "Zuletzt hatte es bei Themen geknirscht: Bei den Steuerentlastungen oder bei der Abschaffung der abschlagsfreien Rente nach 45 Beitragsjahren.", "example_zh": ""}, {"lemma": "das Beitragsjahr, -e", "key": "beitragsjahr", "forms": ["Beitragsjahren", "Beitragsjahr"], "pos": "Substantiv", "zh": "缴费年限（养老保险）", "example_de": "Zuletzt hatte es bei Themen geknirscht: Bei den Steuerentlastungen oder bei der Abschaffung der abschlagsfreien Rente nach 45 Beitragsjahren.", "example_zh": ""}, {"lemma": "abstimmen (aufeinander)", "key": "abstimmen", "forms": ["abgestimmt", "abstimmen"], "pos": "Verb", "zh": "协调一致，相互配合", "example_de": "Unionfraktionschef Frei warnt vor Änderungen, die Vorschläge seien aufeinander abgestimmt.", "example_zh": ""}, {"lemma": "ins Wanken bringen", "key": "ins-wanken-bringen", "forms": ["ins Wanken bringen"], "pos": "Redewendung", "zh": "使动摇，使不稳", "example_de": "Deswegen muss man sehr vorsichtig sein: Dass man nicht an einer Stelle Veränderungen vornimmt, die das Gesamtkonstrukt ins Wanken bringen können.", "example_zh": ""}, {"lemma": "mittragen", "key": "mittragen", "forms": ["mitträgt", "mittragen"], "pos": "Verb", "zh": "共同支持，一道承担", "example_de": "Ob die SPD die Abschaffung der Rente mit 63 mitträgt, ist nicht sicher.", "example_zh": ""}], "grammar_points": [{"title": "Konjunktiv I 转述：sei / führe", "summary": "新闻转述别人言论用第一虚拟式：die Vorschläge seien（他们称方案是……）、Nichthandeln führe（不作为会导致……）、das Thema sei。这是德语新闻的标准转述语态。", "example_de": "Unionfraktionschef Frei warnt vor Änderungen, die Vorschläge seien aufeinander abgestimmt.", "example_zh": "联盟党议会党团主席弗雷警告不要修改，说这些方案是相互协调一致的。"}, {"title": "um ... zu + Infinitiv：为了……", "summary": "um sich darauf vorzubereiten（为了做准备）。um...zu 引导目的不定式，主从句主语一致；代副词 darauf 指代前面的“改革”。", "example_de": "Um sich darauf vorzubereiten, beraten heute und morgen die Fraktionsspitzen von Union und SPD in Münster.", "example_zh": "为了做好准备，联盟党和社会民主党的议会党团领导人今明两天在明斯特磋商。"}], "background": "黑红联盟指联盟党（CDU/CSU，黑色）与社民党（SPD，红色）的执政联盟。Klausur 是政党闭门战略会议。争议焦点是取消“45年缴费无扣减养老金”和“63岁养老金”等福利。弗雷与米尔斯克分别是两党议会党团主席。"}, {"title": "Stimmungsbarometer von Wirtschaftsforschern sind leicht optimistisch", "title_zh": "经济研究机构景气调查略显乐观", "paras": [{"start": 366.08, "end": 385.04, "lines": [{"de": "Optimismus verbreiten, das hat sich die Koalition vorgenommen.", "zh": "传递乐观情绪，这是联盟给自己定下的目标。", "start": 366.08, "end": 369.92}, {"de": "Jetzt kann sie sich stützen auf Daten von Wirtschaftsforschern.", "zh": "现在它可以依托经济研究机构的数据了。", "start": 370.0, "end": 373.88}, {"de": "Stimmungsbarometer weisen leicht nach oben.", "zh": "景气晴雨表略微向上。", "start": 373.96, "end": 376.88}, {"de": "Ob das an den Reformvorhaben der Bundesregierung liegt oder nicht: Unternehmen und Verbraucher schauen zuversichtlicher in die Zukunft.", "zh": "这是否要归功于联邦政府的改革计划并不重要：企业和消费者更看好未来。", "start": 376.96, "end": 385.04}]}, {"start": 386.28, "end": 487.52, "lines": [{"de": "Neue Kleider für den Herbst.", "zh": "秋天的新款服装。", "start": 386.28, "end": 388.32}, {"de": "Die Kollektion sollten gut laufen, glaubt Magali Steidle in ihrer Stuttgarter Modeboutique.", "zh": "马加利·施泰德尔在她斯图加特的时装精品店里相信，这一季新品应该会卖得不错。", "start": 388.4, "end": 394.04}, {"de": "Heute ist wenig los.", "zh": "今天店里人不多。", "start": 394.12, "end": 395.44}, {"de": "Aber bei vielen Kundinnen sitzt der Euro wieder lockerer.", "zh": "但很多女顾客手头又宽裕了一些。", "start": 395.52, "end": 399.04}, {"de": "Irgendwann reicht's mit Krisenmodus.", "zh": "总有一天会受够危机模式。", "start": 399.24, "end": 401.84}, {"de": "Dann sagt die Kundin: Jetzt möchte ich wieder genießen, wieder rausgehen.", "zh": "然后顾客会说：现在我又想享受了，想再出门。", "start": 401.92, "end": 406.56}, {"de": "Jetzt möchte ich eine gute Zeit haben, nicht zu Hause Trübsal blasen.", "zh": "现在想过得开心，不想在家闷闷不乐。", "start": 406.64, "end": 410.84}, {"de": "Davon ist auch hier nichts zu spüren.", "zh": "这里也丝毫感受不到低迷。", "start": 410.92, "end": 413.2}, {"de": "Auf dem Weindorf nebendran schlemmen sich die Menschen zwei Wochen durch die Speisekarte.", "zh": "旁边的葡萄酒村里，人们用两周时间把菜单从头吃到尾。", "start": 413.28, "end": 418.6}, {"de": "Die Preise: teilweise stolz.", "zh": "价格：部分不便宜。", "start": 418.68, "end": 420.6}, {"de": "Die Deutschen geben für Essen und Trinken gern viel aus.", "zh": "德国人愿意在吃喝上花大钱。", "start": 420.68, "end": 424.6}, {"de": "Muss schmecken - und die haben Spaß daran.", "zh": "必须好吃——而且他们乐在其中。", "start": 424.88, "end": 427.72}, {"de": "Wenn eine Veranstaltung in der Stadt ist, dann gönnen wir uns das.", "zh": "如果城里有什么活动，我们就犒劳自己。", "start": 427.96, "end": 433.16}, {"de": "Die Konsumstimmung der Deutschen erholt sich, das zeigen Zahlen der Gesellschaft für Konsumforschung.", "zh": "德国人的消费情绪正在恢复，消费研究协会的数据显示了这一点。", "start": 434.68, "end": 441.0}, {"de": "Das Barometer fürs Konsumklima steigt für September um 2,8 Punkte auf -26,6 Zähler.", "zh": "9月消费景气指数上升2.8点，至-26.6。", "start": 441.08, "end": 446.56}, {"de": "Der Index aus Verbraucherwerten liegt immer noch unter Null, aber besser als in den letzten Monaten.", "zh": "这一由消费者数值构成的指数仍低于零，但比过去几个月好。", "start": 447.56, "end": 454.8}, {"de": "Das ist in erster Linie zurückzuführen auf gestiegene Einkommensaussichten der Verbraucher.", "zh": "这主要归因于消费者收入预期的改善。", "start": 455.12, "end": 461.36}, {"de": "Interessant ist: Diese Einkommensaussichten erhalten vor allem Rückenwind durch bessere Konjunkturerwartungen der Verbraucher.", "zh": "有趣的是：这些收入预期主要受到消费者对经济更好预期的推动。", "start": 461.76, "end": 470.24}, {"de": "Auch die Stimmung in der Wirtschaft hat sich spürbar aufgehellt.", "zh": "经济界的情绪也明显好转。", "start": 470.64, "end": 474.8}, {"de": "Ein weiterer Lichtblick: Laut Ifo-Institut hat sich der Stellenabbau verlangsamt.", "zh": "另一个亮点：据伊福研究所数据，裁员速度已经放缓。", "start": 475.32, "end": 480.84}, {"de": "Auch Magali Steidle ist derzeit auf Personalsuche und hofft auf ein gutes Geschäft im Herbst.", "zh": "马加利·施泰德尔眼下也在招人，期待秋天生意兴隆。", "start": 481.24, "end": 487.52}]}], "vocab": [{"lemma": "das Stimmungsbarometer, -", "key": "stimmungsbarometer", "forms": ["Stimmungsbarometer"], "pos": "Substantiv", "zh": "景气晴雨表，情绪指标", "example_de": "Stimmungsbarometer weisen leicht nach oben.", "example_zh": ""}, {"lemma": "zuversichtlich", "key": "zuversichtlich", "forms": ["zuversichtlicher", "zuversichtlich"], "pos": "Adjektiv", "zh": "有信心的，乐观的", "example_de": "Ob das an den Reformvorhaben der Bundesregierung liegt oder nicht: Unternehmen und Verbraucher schauen zuversichtlicher in die Zukunft.", "example_zh": ""}, {"lemma": "die Kollektion, -en", "key": "kollektion", "forms": ["Kollektion"], "pos": "Substantiv", "zh": "（服装）系列，一季新品", "example_de": "Die Kollektion sollten gut laufen, glaubt Magali Steidle in ihrer Stuttgarter Modeboutique.", "example_zh": ""}, {"lemma": "Trübsal blasen", "key": "truebsal-blasen", "forms": ["Trübsal blasen"], "pos": "Redewendung", "zh": "垂头丧气，闷闷不乐", "example_de": "Jetzt möchte ich eine gute Zeit haben, nicht zu Hause Trübsal blasen.", "example_zh": ""}, {"lemma": "schlemmen", "key": "schlemmen", "forms": ["schlemmen"], "pos": "Verb", "zh": "大吃大喝，享受美食", "example_de": "Auf dem Weindorf nebendran schlemmen sich die Menschen zwei Wochen durch die Speisekarte.", "example_zh": ""}, {"lemma": "die Konsumstimmung", "key": "konsumstimmung", "forms": ["Konsumstimmung"], "pos": "Substantiv", "zh": "消费情绪", "example_de": "Die Konsumstimmung der Deutschen erholt sich, das zeigen Zahlen der Gesellschaft für Konsumforschung.", "example_zh": ""}, {"lemma": "die Einkommensaussichten (Pl.)", "key": "einkommensaussichten", "forms": ["Einkommensaussichten"], "pos": "Substantiv", "zh": "收入前景", "example_de": "Das ist in erster Linie zurückzuführen auf gestiegene Einkommensaussichten der Verbraucher.", "example_zh": ""}, {"lemma": "der Stellenabbau", "key": "stellenabbau", "forms": ["Stellenabbau"], "pos": "Substantiv", "zh": "裁员，岗位削减", "example_de": "Ein weiterer Lichtblick: Laut Ifo-Institut hat sich der Stellenabbau verlangsamt.", "example_zh": ""}], "grammar_points": [{"title": "sich(D) etwas vornehmen：打算做……", "summary": "反身动词 sich vornehmen，反身代词与物主宾语都用第三格（das hat sich die Koalition vorgenommen），表示“给自己定下目标/打算”。完成时助动词用 haben。", "example_de": "Optimismus verbreiten, das hat sich die Koalition vorgenommen.", "example_zh": "传递乐观情绪，这是联盟给自己定下的目标。"}, {"title": "zurückzuführen auf：归因于……", "summary": "Das ist zurückzuführen auf A（这归因于A）。sein + zu + Infinitiv 的结构表示“可……/应……”，此处为 zurückführen 的被动含义，auf 引出原因。", "example_de": "Das ist in erster Linie zurückzuführen auf gestiegene Einkommensaussichten der Verbraucher.", "example_zh": "这主要归因于消费者收入预期的改善。"}], "background": "GfK（消费研究协会）和慕尼黑伊福研究所（Ifo）是德国两大权威经济调查机构。报道拍摄地斯图加特葡萄酒村（Stuttgarter Weindorf）是当地传统节庆。消费景气指数仍为负值但回升。"}, {"title": "Bündnis \"Zusammen für Demokratie\" unterstützt Opfer rechtsextremer Gewalt", "title_zh": "“共同守护民主”联盟支援极右翼暴力受害者", "paras": [{"start": 488.68, "end": 516.16, "lines": [{"de": "Drohungen, Beleidigungen, körperliche Gewalt: Die meisten politisch motivierten Straftaten werden in Deutschland von Rechtsextremen verübt.", "zh": "威胁、侮辱、肢体暴力：德国大多数政治动机的刑事案件是极右翼分子实施的。", "start": 488.68, "end": 497.84}, {"de": "Die Opfer bleiben oft allein.", "zh": "受害者常常孤立无援。", "start": 497.92, "end": 499.72}, {"de": "Ein Bündnis aus mehr als 80 Organisationen will das ändern.", "zh": "一个由80多个组织组成的联盟想改变这一点。", "start": 499.8, "end": 503.28}, {"de": "Zu ihnen zählen etwa Gewerkschaften, Kirchen und Sportverbände.", "zh": "其中包括工会、教会和体育协会。", "start": 503.36, "end": 507.16}, {"de": "Unter dem Motto \"Zusammen für Demokratie\" unterstützen sie Initiativen vor Ort mit Geld und rechtlicher Beratung.", "zh": "在“共同守护民主”的口号下，他们以资金和法律咨询支援地方倡议团体。", "start": 507.24, "end": 513.92}, {"de": "Heute wurde dazu ein Pakt geschlossen.", "zh": "今天为此缔结了一项公约。", "start": 514.04, "end": 516.16}]}, {"start": 517.24, "end": 604.4, "lines": [{"de": "Anne Brügmann unterstützt seit über 15 Jahren Opfer von rechtsextremer Gewalt in Brandenburg.", "zh": "安妮·布吕曼15年多来一直在勃兰登堡支援极右翼暴力受害者。", "start": 517.24, "end": 523.04}, {"de": "Seit einigen Jahren würden solche Angriffe wieder zunehmen.", "zh": "她说，近年来这类袭击又再度增多。", "start": 523.12, "end": 526.92}, {"de": "Wir beraten aktuell eine Familie, die von ihren Nachbarn rassistisch angegriffen wurde.", "zh": "我们目前正在帮助一个家庭，他们遭到邻居的种族主义攻击。", "start": 527.16, "end": 533.24}, {"de": "Die müssen jetzt als Zeugen aussagen.", "zh": "他们现在必须作为证人出庭。", "start": 533.36, "end": 535.96}, {"de": "Die begleiten wir.", "zh": "我们陪伴他们。", "start": 536.64, "end": 537.96}, {"de": "Zwei junge Menschen haben sich an uns gewandt, die aufs Land gezogen sind und etwas alternativ aussehen.", "zh": "有两个年轻人找到我们，他们搬到了乡下，外表有点另类。", "start": 538.04, "end": 547.0}, {"de": "Sie wurden von Rechten bedroht.", "zh": "他们受到极右分子威胁。", "start": 547.32, "end": 549.52}, {"de": "Ein Bündnis aus Gewerkschaften, Kirchen, Sportverbänden und Menschenrechtsorganisationen will solche Gruppen unterstützen.", "zh": "一个由工会、教会、体育协会和人权组织组成的联盟想支援这类团体。", "start": 550.12, "end": 558.0}, {"de": "Denn auch Menschen, die Betroffenen helfen und sich für Demokratie einsetzen, würden bedroht.", "zh": "因为帮助受害者、投身民主的人自身也会受到威胁。", "start": 558.68, "end": 565.2}, {"de": "Diese Menschen stehen auf Feindeslisten.", "zh": "这些人被列入敌人名单。", "start": 567.28, "end": 570.16}, {"de": "Sie werden tätlich angegriffen.", "zh": "他们遭到肢体攻击。", "start": 570.56, "end": 573.0}, {"de": "Deshalb müssen wir enger zusammenrücken.", "zh": "所以我们必须更紧密地站在一起。", "start": 573.24, "end": 575.76}, {"de": "Es geht um rechtliche Hilfe oder konkreten Schutz, aber auch um moralische Unterstützung.", "zh": "这关乎法律援助或具体保护，也关乎道义支持。", "start": 575.84, "end": 581.6}, {"de": "Wenn Betroffene möchten, dass wir sichtbar werden, in den Kommunen vor Ort, auf der Straße: Dann tun wir das.", "zh": "如果受害者希望我们现身，在地方社区、在街头：我们就去做。", "start": 582.28, "end": 589.84}, {"de": "Wenn wir bei Social Media sichtbar sein sollen mit Kampagnen, tun wir auch das.", "zh": "如果需要我们在社交媒体上以宣传活动亮相，我们也做。", "start": 590.2, "end": 595.56}, {"de": "Auch Petitionen sind eine Option.", "zh": "请愿也是一种选择。", "start": 595.96, "end": 598.28}, {"de": "Anne Brügmann und die Opferperspektive Potsdam können jede Unterstützung gut gebrauchen.", "zh": "安妮·布吕曼和波茨坦“受害者视角”能用好每一份支持。", "start": 598.84, "end": 604.4}]}], "vocab": [{"lemma": "die Straftat, -en", "key": "straftat", "forms": ["Straftaten", "Straftat"], "pos": "Substantiv", "zh": "刑事犯罪行为", "example_de": "Drohungen, Beleidigungen, körperliche Gewalt: Die meisten politisch motivierten Straftaten werden in Deutschland von Rechtsextremen verübt.", "example_zh": ""}, {"lemma": "verüben", "key": "verueben", "forms": ["verübt", "verüben"], "pos": "Verb", "zh": "实施（犯罪、暴行）", "example_de": "Drohungen, Beleidigungen, körperliche Gewalt: Die meisten politisch motivierten Straftaten werden in Deutschland von Rechtsextremen verübt.", "example_zh": ""}, {"lemma": "das Bündnis, -se", "key": "buendnis", "forms": ["Bündnis"], "pos": "Substantiv", "zh": "联盟，联合", "example_de": "Ein Bündnis aus mehr als 80 Organisationen will das ändern.", "example_zh": ""}, {"lemma": "der Pakt, -e", "key": "pakt", "forms": ["Pakt"], "pos": "Substantiv", "zh": "公约，盟约", "example_de": "Heute wurde dazu ein Pakt geschlossen.", "example_zh": ""}, {"lemma": "rassistisch", "key": "rassistisch", "forms": ["rassistisch"], "pos": "Adjektiv", "zh": "种族主义的", "example_de": "Wir beraten aktuell eine Familie, die von ihren Nachbarn rassistisch angegriffen wurde.", "example_zh": ""}, {"lemma": "bedrohen", "key": "bedrohen", "forms": ["bedroht", "bedrohen"], "pos": "Verb", "zh": "威胁，恐吓", "example_de": "Sie wurden von Rechten bedroht.", "example_zh": ""}, {"lemma": "zusammenrücken", "key": "zusammenruecken", "forms": ["zusammenrücken"], "pos": "Verb", "zh": "靠拢，紧密团结", "example_de": "Deshalb müssen wir enger zusammenrücken.", "example_zh": ""}, {"lemma": "die Petition, -en", "key": "petition", "forms": ["Petitionen", "Petition"], "pos": "Substantiv", "zh": "请愿，请愿书", "example_de": "Auch Petitionen sind eine Option.", "example_zh": ""}], "grammar_points": [{"title": "Konjunktiv I 转述：würden", "summary": "werden 的第一虚拟式 würde 常用于转述：würden solche Angriffe wieder zunehmen（据说此类袭击又在增多）、würden bedroht（据说受到威胁）。新闻里引用他人说法而不直接背书。", "example_de": "Seit einigen Jahren würden solche Angriffe wieder zunehmen.", "example_zh": "她说，近年来这类袭击又再度增多。"}, {"title": "die + 分词结构的关系从句", "summary": "口语中关系从句可以连续使用关系代词 die + 动词：Zwei junge Menschen, die aufs Land gezogen sind und ... aussehen（两个搬到乡下的年轻人）。die 在这里是复数关系代词，带起两个并列动词。", "example_de": "Zwei junge Menschen haben sich an uns gewandt, die aufs Land gezogen sind und etwas alternativ aussehen.", "example_zh": "有两个年轻人找到我们，他们搬到了乡下，外表有点另类。"}], "background": "德国每年公布“政治动机犯罪”统计，极右翼案件占比最高。“Opferperspektive Potsdam”（波茨坦受害者视角）是勃兰登堡州的受害者支援机构。该联盟由工会、教会、体育协会等80多个组织发起，口号“Zusammen für Demokratie”（共同守护民主）。"}, {"title": "Ex-General Mladic gestorben", "title_zh": "前将军姆拉迪奇去世", "paras": [{"start": 606.68, "end": 632.76, "lines": [{"de": "Er galt als skrupelloser Kriegsverbrecher, wurde der \"Schlächter vom Balkan\" genannt.", "zh": "他被视为残忍的战犯，被称为“巴尔干屠夫”。", "start": 606.68, "end": 612.2}, {"de": "Nun ist der bosnisch-serbische Ex-General Mladic gestorben - im Alter von 84 Jahren in einem Gefängniskrankenhaus in Den Haag.", "zh": "如今这位波黑塞族前将军姆拉迪奇去世了——终年84岁，", "start": 613.24, "end": 620.84}, {"de": "Mladic war 2017 u.a. wegen Völkermordes im Bosnien-Krieg zu lebenslanger Haft verurteilt worden.", "zh": "在海牙一所监狱医院里。", "start": 620.92, "end": 626.68}, {"de": "Er hatte 1995 das Massaker von Srebrenica angeordnet.", "zh": "姆拉迪奇2017年因波黑战争中的种族灭绝等罪行被判处终身监禁。", "start": 626.76, "end": 630.64}, {"de": "Dabei wurden Tausende getötet.", "zh": "他曾在1995年下令制造斯雷布雷尼察屠杀，数千人遇害。", "start": 630.72, "end": 632.76}]}, {"start": 634.56, "end": 723.24, "lines": [{"de": "Ratko Mladic.", "zh": "拉特科·姆拉迪奇。", "start": 634.56, "end": 635.76}, {"de": "Sein Name steht für das dunkelste Kapitel des Bosnienkriegs, für Völkermord und Verbrechen gegen die Menschlichkeit.", "zh": "他的名字代表波黑战争最黑暗的一章，代表种族灭绝和反人类罪。", "start": 635.84, "end": 643.28}, {"de": "Im Juni 1995 lässt er in der UN-Schutzzone Srebrenica mehr als 8000 muslimische Männer und Jugendliche töten.", "zh": "1995年6月，他在联合国保护区斯雷布雷尼卡下令杀害8000多名穆斯林男子和青少年。", "start": 643.36, "end": 650.92}, {"de": "Ein Völkermord vor den Augen hilfloser UN-Blauhelmsoldaten.", "zh": "一场发生在无能为力的联合国蓝盔士兵眼前的种族灭绝。", "start": 652.44, "end": 656.4}, {"de": "Als Kommandeur der bosnisch-serbischen Armee verantwortet Mladic eine brutale Militärstrategie.", "zh": "作为波黑塞族军队指挥官，姆拉迪奇对一项残酷的军事战略负责。", "start": 657.76, "end": 664.04}, {"de": "Die setzt die nationalistischen Ansprüche mit allen Mitteln durch.", "zh": "该战略不择手段地贯彻民族主义诉求。", "start": 664.16, "end": 668.44}, {"de": "1942 in Bosnien geboren, macht er Karriere in der Jugoslawischen Volksarmee.", "zh": "1942年生于波黑，他在南斯拉夫人民军中步步高升。", "start": 668.52, "end": 673.92}, {"de": "Er ist neben Radovan Karadzic die treibende Figur der bosnischen Serben.", "zh": "他与拉多万·卡拉季奇并列，是波黑塞族的推动性人物。", "start": 674.0, "end": 680.2}, {"de": "Er ist als Generalstabschef mitverantwortlich für die Belagerung und Zerstörung Sarajevos.", "zh": "他作为总参谋长，对萨拉热窝的围城与毁灭负有共同责任。", "start": 680.28, "end": 685.64}, {"de": "Erst nach dem Massaker von Srebrenica greift der Westen militärisch ein und beendet den Krieg.", "zh": "直到斯雷布雷尼察屠杀之后，西方才军事介入并结束了战争。", "start": 685.72, "end": 691.52}, {"de": "Mladic gelingt es mehr als 15 Jahre lang, sich in Serbien zu verstecken.", "zh": "姆拉迪奇成功地在塞尔维亚躲藏了15年多。", "start": 691.76, "end": 696.64}, {"de": "Er kann sich frei bewegen, auch dank der Unterstützung alter Kader.", "zh": "他能自由活动，也多亏旧干部的庇护。", "start": 697.2, "end": 701.44}, {"de": "Bis heute wird er von nicht wenigen als Held verehrt.", "zh": "直到今天，仍有不少人把他当英雄崇拜。", "start": 701.52, "end": 704.84}, {"de": "Im Mai 2011 verhaften serbische Polizisten den dann 68-Jährigen.", "zh": "2011年5月，塞尔维亚警察逮捕了时年68岁的他。", "start": 704.92, "end": 709.32}, {"de": "Sie liefern ihn an das UN-Kriegsverbrecher-Tribunal nach Den Haag aus.", "zh": "他们把他引渡到海牙的联合国战争罪犯法庭。", "start": 709.56, "end": 713.88}, {"de": "Sechs Jahre später verurteilen ihn dort die Richter zu lebenslanger Haft.", "zh": "六年后，法官们在那里判处他终身监禁。", "start": 713.96, "end": 718.96}, {"de": "Mladic stirbt in einem UN-Gefängnis im Alter von 84 Jahren.", "zh": "姆拉迪奇在联合国监狱中去世，终年84岁。", "start": 719.08, "end": 723.24}]}], "vocab": [{"lemma": "skrupellos", "key": "skrupellos", "forms": ["skrupelloser", "skrupellos"], "pos": "Adjektiv", "zh": "不择手段的，肆无忌惮的", "example_de": "Er galt als skrupelloser Kriegsverbrecher, wurde der \"Schlächter vom Balkan\" genannt.", "example_zh": ""}, {"lemma": "der Kriegsverbrecher, -", "key": "kriegsverbrecher", "forms": ["Kriegsverbrecher", "Kriegsverbrecher-Tribunal"], "pos": "Substantiv", "zh": "战犯", "example_de": "Er galt als skrupelloser Kriegsverbrecher, wurde der \"Schlächter vom Balkan\" genannt.", "example_zh": ""}, {"lemma": "der Völkermord", "key": "voelkermord", "forms": ["Völkermordes", "Völkermord"], "pos": "Substantiv", "zh": "种族灭绝", "example_de": "Mladic war 2017 u.a. wegen Völkermordes im Bosnien-Krieg zu lebenslanger Haft verurteilt worden.", "example_zh": ""}, {"lemma": "die lebenslange Haft", "key": "lebenslange-haft", "forms": ["lebenslanger Haft", "lebenslange Haft"], "pos": "Substantiv", "zh": "终身监禁", "example_de": "Mladic war 2017 u.a. wegen Völkermordes im Bosnien-Krieg zu lebenslanger Haft verurteilt worden.", "example_zh": ""}, {"lemma": "das Massaker, -", "key": "massaker", "forms": ["Massaker"], "pos": "Substantiv", "zh": "大屠杀", "example_de": "Er hatte 1995 das Massaker von Srebrenica angeordnet.", "example_zh": ""}, {"lemma": "anordnen", "key": "anordnen", "forms": ["angeordnet", "anordnen"], "pos": "Verb", "zh": "下令，指示", "example_de": "Er hatte 1995 das Massaker von Srebrenica angeordnet.", "example_zh": ""}, {"lemma": "die Schutzzone, -n", "key": "schutzzone", "forms": ["Schutzzone"], "pos": "Substantiv", "zh": "保护区", "example_de": "Im Juni 1995 lässt er in der UN-Schutzzone Srebrenica mehr als 8000 muslimische Männer und Jugendliche töten.", "example_zh": ""}, {"lemma": "verehren", "key": "verehren", "forms": ["verehrt", "verehren"], "pos": "Verb", "zh": "崇拜，敬仰", "example_de": "Bis heute wird er von nicht wenigen als Held verehrt.", "example_zh": ""}, {"lemma": "ausliefern", "key": "ausliefern", "forms": ["ausliefern"], "pos": "Verb", "zh": "引渡", "example_de": "Sie liefern ihn an das UN-Kriegsverbrecher-Tribunal nach Den Haag aus.", "example_zh": ""}], "grammar_points": [{"title": "Passiv Perfekt：war ... verurteilt worden", "summary": "sein + Partizip II + worden 构成被动态完成时：他“已被判处”（过去更早时间点）。被动态完成时的助动词是 sein，不是 haben。", "example_de": "Mladic war 2017 u.a. wegen Völkermordes im Bosnien-Krieg zu lebenslanger Haft verurteilt worden.", "example_zh": "姆拉迪奇2017年因波黑战争中的种族灭绝等罪行被判处终身监禁。"}], "background": "拉特科·姆拉迪奇（Ratko Mladić，1942–2026），波黑塞族军队总司令。1995年7月斯雷布雷尼卡屠杀约8000名穆斯林男子，为二战后欧洲最大屠杀。2017年被前南斯拉夫问题国际刑事法庭（ICTY，海牙）判终身监禁，2026年死于联合国监狱医院。"}, {"title": "Naumburger Dom: \"Zentrum Welterbe\" eröffnet", "title_zh": "瑙姆堡大教堂：“世界遗产中心”开放", "paras": [{"start": 726.16, "end": 753.12, "lines": [{"de": "Der Naumburger Dom ist seit 2018 UNESCO-Welterbestätte, heute hat dort das \"Zentrum Welterbe\" eröffnet.", "zh": "瑙姆堡大教堂自2018年起是世界遗产，今天“世界遗产中心”在那里开放。", "start": 726.16, "end": 733.56}, {"de": "In einem restaurierten historischen Gebäude gegenüber dem Dom können Besucher sich über die Geschichte des Bauwerks informieren.", "zh": "在教堂对面一栋修缮一新的历史建筑里，参观者可以了解这座建筑的历史。", "start": 735.4, "end": 743.28}, {"de": "Man kann das kulturelle Erbe der Region entdecken.", "zh": "可以探索这一地区的文化遗产。", "start": 743.36, "end": 746.24}, {"de": "Der Naumburger Dom gilt als herausragendes Beispiel für Architektur und Kunst des europäischen Hochmittelalters.", "zh": "瑙姆堡大教堂被视为欧洲盛期中世纪建筑与艺术的杰出典范。", "start": 746.36, "end": 753.12}]}], "vocab": [{"lemma": "die Welterbestätte, -n", "key": "welterbestaette", "forms": ["Welterbestätte", "Welterbe"], "pos": "Substantiv", "zh": "世界遗产地", "example_de": "Der Naumburger Dom ist seit 2018 UNESCO-Welterbestätte, heute hat dort das \"Zentrum Welterbe\" eröffnet.", "example_zh": ""}, {"lemma": "restaurieren", "key": "restaurieren", "forms": ["restaurierten", "restauriert", "restaurieren"], "pos": "Verb", "zh": "修复，修缮", "example_de": "In einem restaurierten historischen Gebäude gegenüber dem Dom können Besucher sich über die Geschichte des Bauwerks informieren.", "example_zh": ""}, {"lemma": "das Bauwerk, -e", "key": "bauwerk", "forms": ["Bauwerks", "Bauwerk"], "pos": "Substantiv", "zh": "建筑物", "example_de": "In einem restaurierten historischen Gebäude gegenüber dem Dom können Besucher sich über die Geschichte des Bauwerks informieren.", "example_zh": ""}, {"lemma": "das kulturelle Erbe", "key": "kulturelle-erbe", "forms": ["kulturelle Erbe"], "pos": "Substantiv", "zh": "文化遗产", "example_de": "Man kann das kulturelle Erbe der Region entdecken.", "example_zh": ""}, {"lemma": "das Hochmittelalter", "key": "hochmittelalter", "forms": ["Hochmittelalters", "Hochmittelalter"], "pos": "Substantiv", "zh": "中世纪盛期", "example_de": "Der Naumburger Dom gilt als herausragendes Beispiel für Architektur und Kunst des europäischen Hochmittelalters.", "example_zh": ""}, {"lemma": "herausragend", "key": "herausragend", "forms": ["herausragendes", "herausragend"], "pos": "Adjektiv", "zh": "杰出的，出众的", "example_de": "Der Naumburger Dom gilt als herausragendes Beispiel für Architektur und Kunst des europäischen Hochmittelalters.", "example_zh": ""}], "grammar_points": [], "background": "瑙姆堡大教堂（Naumburger Dom）位于德国萨克森-安哈尔特州，以13世纪的唱诗班栏杆浮雕和创始人雕像（Uta von Naumburg）闻名，2018年列入联合国教科文组织世界遗产。"}, {"title": "Künstlerin Yayoi Kusama ist tot", "title_zh": "艺术家草间弥生去世", "paras": [{"start": 754.64, "end": 804.32, "lines": [{"de": "Ihr Markenzeichen waren Punkte: Auf Gegenständen, in Installationen, in ganzen Räumen.", "zh": "她的标志是圆点：在物品上，在装置艺术中，在整间展厅里。", "start": 754.64, "end": 760.24}, {"de": "Jetzt ist die Japanerin Yayoi Kusama mit 97 Jahren gestorben, wie erst heute bekannt wurde bereits vor knapp zwei Wochen.", "zh": "如今日本艺术家草间弥生以97岁高龄去世，直到今天才公布，其实就在近两周前。", "start": 760.32, "end": 768.28}, {"de": "Kusama litt seit ihrer Kindheit an Halluzinationen und Depressionen.", "zh": "草间弥生从童年起就饱受幻觉和抑郁折磨。", "start": 768.64, "end": 773.16}, {"de": "In den vergangenen Jahrzehnten lebte sie freiwillig in einer psychiatrischen Klinik.", "zh": "过去几十年她自愿住在一家精神科诊所里。", "start": 773.28, "end": 780.0}, {"de": "Sie malte und malte bis in ihre letzten Tage.", "zh": "她画了又画，直到生命的最后日子。", "start": 782.12, "end": 785.4}, {"de": "Die leuchtend rote Perücke, auf der ganzen Welt bekannt.", "zh": "那顶鲜红色的假发，全世界都认识。", "start": 785.48, "end": 789.28}, {"de": "Yayoi Kusama brachte Tausende Kunstwerke buchstäblich auf den Punkt.", "zh": "草间弥生把数千件作品真正“点到即成”。", "start": 789.36, "end": 793.8}, {"de": "Sie sah die Welt tatsächlich so.", "zh": "她看到的世界确实就是那样。", "start": 793.88, "end": 796.12}, {"de": "Die Punkte begleiteten sie ein Leben lang.", "zh": "圆点伴随了她一生。", "start": 796.2, "end": 799.16}, {"de": "Kunst als Spiegel ihrer Seele.", "zh": "艺术是她灵魂的镜子。", "start": 799.56, "end": 802.24}, {"de": "Und ihrer Ängste.", "zh": "也是她恐惧的镜子。", "start": 803.04, "end": 804.32}]}, {"start": 806.12, "end": 872.24, "lines": [{"de": "Ihrem Publikum verschaffte sie Einblick in die Unendlichkeit.", "zh": "她让观众得以窥见无限。", "start": 806.12, "end": 810.04}, {"de": "Ihre farbenfrohen Kreationen - wie geschaffen für Social Media.", "zh": "她那些色彩缤纷的作品——简直为社交媒体而生。", "start": 810.44, "end": 814.76}, {"de": "Ins Kölner Museum Ludwig lockte sie zuletzt 480.000 Besucher.", "zh": "最近她为科隆路德维希博物馆吸引了48万观众。", "start": 817.16, "end": 821.28}, {"de": "Vor dem Kusama-Museum in Tokio sorgt sie immer für Andrang.", "zh": "东京草间弥生博物馆前，她总能引来人潮。", "start": 823.16, "end": 827.04}, {"de": "Auch am Tag der Todesnachricht.", "zh": "死讯传来这天也不例外。", "start": 827.12, "end": 829.32}, {"de": "Mir kommen die Tränen.", "zh": "我眼泪都要出来了。", "start": 830.92, "end": 832.52}, {"de": "Es gibt niemanden, der so ist wie sie.", "zh": "没有人像她那样。", "start": 832.6, "end": 835.24}, {"de": "Ich bin schockiert von ihrem Tod und dankbar für das, was sie uns hinterlassen hat.", "zh": "我为她的去世震惊，也感谢她留给我们的东西。", "start": 840.48, "end": 842.4}, {"de": "Zeit ihres Lebens kämpfte sie mit psychischen Leiden.", "zh": "她一生都在与心理疾病抗争。", "start": 843.88, "end": 847.56}, {"de": "Trotz dunkler Phasen wollte sie ihre Liebe zum Leben weitergeben.", "zh": "尽管有黑暗时期，她仍想传递对生活的热爱。", "start": 847.88, "end": 852.08}, {"de": "Ich hoffe von ganzem Herzen, dass ihr auch nach meinem Tod noch ein wenig spüren könnt von meinem Schaffensdrang.", "zh": "我发自内心地希望，在我死后你们仍能感受到我的创作欲。", "start": 854.28, "end": 861.36}, {"de": "Meiner Hoffnung und meiner Leidenschaft.", "zh": "感受到我的希望和热情。", "start": 861.48, "end": 864.08}, {"de": "Sie verstarb mit 97 Jahren.", "zh": "她以97岁去世。", "start": 866.52, "end": 868.56}, {"de": "In ihrer Kunst lebt sie weiter, ganz, wie sie es wollte.", "zh": "她在艺术中继续活着，完全如她所愿。", "start": 868.68, "end": 872.24}]}], "vocab": [{"lemma": "das Markenzeichen, -", "key": "markenzeichen", "forms": ["Markenzeichen"], "pos": "Substantiv", "zh": "标志性特征，商标", "example_de": "Ihr Markenzeichen waren Punkte: Auf Gegenständen, in Installationen, in ganzen Räumen.", "example_zh": ""}, {"lemma": "die Installation, -en", "key": "installation", "forms": ["Installationen", "Installation"], "pos": "Substantiv", "zh": "装置艺术；安装", "example_de": "Ihr Markenzeichen waren Punkte: Auf Gegenständen, in Installationen, in ganzen Räumen.", "example_zh": ""}, {"lemma": "die Halluzination, -en", "key": "halluzination", "forms": ["Halluzinationen", "Halluzination"], "pos": "Substantiv", "zh": "幻觉", "example_de": "Kusama litt seit ihrer Kindheit an Halluzinationen und Depressionen.", "example_zh": ""}, {"lemma": "die Depression, -en", "key": "depression", "forms": ["Depressionen", "Depression"], "pos": "Substantiv", "zh": "抑郁（症）", "example_de": "Kusama litt seit ihrer Kindheit an Halluzinationen und Depressionen.", "example_zh": ""}, {"lemma": "die Perücke, -n", "key": "peruecke", "forms": ["Perücke"], "pos": "Substantiv", "zh": "假发", "example_de": "Die leuchtend rote Perücke, auf der ganzen Welt bekannt.", "example_zh": ""}, {"lemma": "etwas auf den Punkt bringen", "key": "auf-den-punkt-bringen", "forms": ["auf den Punkt", "etwas auf den Punkt bringen"], "pos": "Redewendung", "zh": "一语中的，精准表达", "example_de": "Yayoi Kusama brachte Tausende Kunstwerke buchstäblich auf den Punkt.", "example_zh": ""}, {"lemma": "die Unendlichkeit", "key": "unendlichkeit", "forms": ["Unendlichkeit"], "pos": "Substantiv", "zh": "无限，无穷", "example_de": "Ihrem Publikum verschaffte sie Einblick in die Unendlichkeit.", "example_zh": ""}, {"lemma": "der   return `<w data-w="${esc(key)}" class="${classes}" tabindex="0" role="button" aria-label="${esc(surface)}，查看释义">${esc(surface)}</w>`;
}
function isLetter(ch) { return /[A-Za-zÄÖÜäöüß]/.test(ch || ''); }
function tokenizeDe(text) {
  let html = '', i = 0;
  const lower = text.toLowerCase();
  while (i < text.length) {
    let hit = '';
    if (i === 0 || !isLetter(text[i - 1])) {
      for (const ph of PHRASES) {
        if (lower.startsWith(ph.toLowerCase(), i) && !isLetter(text[i + ph.length])) {
          hit = text.slice(i, i + ph.length);
          break;
        }
      }
    }
    if (hit) {
      html += wrapWord(hit, lookupKey(hit));
      i += hit.length;
      continue;
    }
    if (isLetter(text[i])) {
      let j = i + 1;
      while (j < text.length && /[A-Za-zÄÖÜäöüß-]/.test(text[j])) j++;
      const word = text.slice(i, j);
      html += wrapWord(word, lookupKey(word));
      i = j;
    } else {
      let j = i + 1;
      while (j < text.length && !isLetter(text[j])) j++;
      html += esc(text.slice(i, j));
      i = j;
    }
  }
  return html;
}

  if (e.key === 'Escape') {
    e.preventDefault();
    toggleBasket(false);
    return;
  }
  if (e.key !== 'Tab') return;
  const focusable = [...panel.querySelectorAll('button:not([disabled]), a[href], input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])')];
  if (!focusable.length) return;
  const first = focusable[0];
  const last = focusable[focusable.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
});

  const item = key ? basket.find(b => b.key === key) : null;
  document.getElementById('edit-word').value = item?.word || '';
  document.getElementById('edit-zh').value = item?.zh || '';
  document.getElementById('edit-example').value = item?.example || '';
  document.getElementById('word-editor').classList.add('open');
  setTimeout(() => document.getElementById('edit-word').focus(), 0);
}
function closeWordEditor() {
  editingKey = null;
  document.getElementById('word-editor').classList.remove('open');
  document.getElementById('word-form').reset();
}
document.getElementById('word-form').onsubmit = e => {
  e.preventDefault();
  const wasEditing = Boolean(editingKey);
  const word = document.getElementById('edit-word').value.trim();
  const zh = document.getElementById('edit-zh').value.trim();
  const example = document.getElementById('edit-example').value.trim();
  if (!word || !zh) return;
  const key = editingKey || word.toLocaleLowerCase('de-DE');
  const item = basket.find(b => b.key === editingKey || (!editingKey && b.key === key));
  if (item) Object.assign(item, { word, zh, example });
  else basket.unshift({ key, word, zh, example, date: DATA.date, manual: true });
  userGloss[key] = { word, zh, example, pos: '' };
  saveStored(GLOSS_KEY, userGloss);
  saveBasket();
  refreshWordMarks();
  renderBasket();
  closeWordEditor();
  toast(wasEditing ? '单词已更新' : '已添加单词');
};

function copyWords() {
  if (!basket.length) { toast('生词本是空的'); return; }
  const text = basket.map(b => `${b.word}\t${b.zh}${b.example ? '\t' + b.example : ''}`).join('\n');
  navigator.clipboard.writeText(text).then(
    () => toast('已复制 ' + basket.length + ' 词'),
    () => toast('复制失败')
  );
}

/* ---------- apkg 导出 ---------- */
const SQLJS_URL = 'https://cdn.jsdelivr.net/npm/sql.js@1.10.3/dist/sql-wasm.wasm';
const SQLJS_JS  = 'https://cdn.jsdelivr.net/npm/sql.js@1.10.3/dist/sql-wasm.js';

function loadScript(src) {
  return new Promise((ok, no) => {
    const s = document.createElement('script');
    s.src = src; s.onload = ok; s.onerror = () => no(new Error('load fail: ' + src));
    document.head.appendChild(s);
  });
}

async function exportApkg() {
  const st = document.getElementById('bk-status');
  const btn = document.getElementById('btn-apkg');
  if (!basket.length) { toast('篮子是空的'); return; }
  btn.disabled = true;
  try {
    st.textContent = '加载 sql.js…';
    if (!window.initSqlJs) {
      await loadScript(SQLJS_JS);
      window.initSqlJs = window.initSqlJs.bind({ locateFile: () => SQLJS_URL });
    }
    const SQL = await window.initSqlJs({ locateFile: () => SQLJS_URL });

    st.textContent = '构建牌组…';
    const db = new SQL.Database();

    // apkg = collection.anki2 + media(空json) — 最小合法集
    db.run(`CREATE TABLE col(
      id integer primary key, crt integer, mod integer, scm integer, ver integer,
      dty integer, usn integer, ls integer, conf text, models text, decks text,
      dconf text, tags text)`);
    const now = Math.floor(Date.now() / 1000);
    const mid = Date.now();
    const deckId = now * 1000;
    const model = {
      [mid]: {
        id: mid, name: 'Deutsch Daily', type: 0, mod: now, usn: 0, sortf: 0,
        did: deckId, tmpls: [{ name: 'Card 1', ord: 0, qfmt: '{{Front}}', afmt: '{{FrontSide}}<hr id=answer>{{Back}}', bqfmt: '', bafmt: '' }],
        flds: [
          { name: 'Front', ord: 0, sticky: false, rtl: false, font: 'Arial', size: 20, media: [] },
          { name: 'Back',  ord: 1, sticky: false, rtl: false, font: 'Arial', size: 20, media: [] }
        ],
        css: `.card{font-family:-apple-system,'Noto Sans SC',sans-serif;font-size:20px;text-align:center;color:#1F2328;background:#FAF7F2;padding:24px}.card b{color:#B3541E}`,
        latexPre: '\\documentclass[12pt]{article}\n\\special{papersize=3in,5in}\n\\usepackage[utf8]{inputenc}\n\\usepackage{amssymb,amsmath}\n\\pagestyle{empty}\n\\setlength{\\parindent}{0in}\n\\begin{document}\n',
        latexPost: '\\end{document}',
        req: [[0, 'all', [0]]], tags: [], vers: []
      }
    };
    const decks = {
      "1": { id: 1, name: 'Default', mod: now, usn: 0, lrnToday: [0,0], revToday: [0,0], newToday: [0,0], timeToday: [0,0], collapsed: false, browserCollapsed: false, desc: '', dyn: 0, conf: 1, extendNew: 10, extendRev: 50 },
      [deckId]: { id: deckId, name: 'Deutsch Daily', mod: now, usn: 0, lrnToday: [0,0], revToday: [0,0], newToday: [0,0], timeToday: [0,0], collapsed: false, browserCollapsed: false, desc: '', dyn: 0, conf: 1, extendNew: 10, extendRev: 50 }
    };
    const conf = {
      activeDecks: [1], addToCur: true, collapseTime: 1200, curDeck: 1,
      curModel: mid, dayLearnFirst: false, dueCounts: true, estTimes: true,
      newSpread: 0, nextPos: 1, schedVer: 2, sched2021: true, sortBackwards: false,
      sortType: "noteFld", timeLim: 0, creationOffset: -480
    };
    const dconf = {
      "1": { id: 1, name: "Default", replayq: true, lapse: { delays: [10, 60], mult: 0, minInt: 1, leechFails: 8, leechAction: 0 }, rev: { perDay: 200, fuzz: 0.05, ivlFct: 1, maxIvl: 36500, ease4: 1.3, bury: true, minSpace: 1 }, timer: 0, maxTaken: 60, new: { separate: true, ints: [1, 4, 7], initialFactor: 2500, bury: true, order: 1 }, mod: 0, usn: 0, autoplay: true }
    };
    db.run(`INSERT INTO col VALUES(?,?,?,?,?,?,?,?,?,?,?,?,?)`, [
      now, now, now * 1000, 0, 11, 0, 0, 0,
      JSON.stringify(conf), JSON.stringify(model), JSON.stringify(decks),
      JSON.stringify(dconf), '{}'
    ]);

    db.run(`CREATE TABLE notes(
      id integer primary key, guid text, mid integer, mod integer, usn integer,
      tags text, flds text, sfld text, csum integer, flags integer, data text)`);
    db.run(`CREATE TABLE cards(
      id integer primary key, nid integer, did integer, ord integer, mod integer,
      usn integer, type integer, queue integer, due integer, ivl integer,
      factor integer, reps integer, lapses integer, left integer, odue integer,
      odid integer, flags integer, data text)`);
    db.run(`CREATE TABLE revlog(
      id integer primary key, cid integer, usn integer, ease integer, ivl integer,
      lastIvl integer, factor integer, time integer, type integer)`);
    db.run(`CREATE TABLE graves(
      usn integer, oid integer, type integer)`);
    db.run(`CREATE INDEX ix_notes_usn on notes (usn)`);
    db.run(`CREATE INDEX ix_cards_usn on cards (usn)`);
    db.run(`CREATE INDEX ix_revlog_usn on revlog (usn)`);
    db.run(`CREATE INDEX ix_cards_nid on cards (nid)`);
    db.run(`CREATE INDEX ix_revlog_cid on revlog (cid)`);
    db.run(`CREATE INDEX ix_notes_csum on notes (csum)`);

    const enc = new TextEncoder();
    function csum(s) { // anki checquers field hash (java String.hashCode)
      let h = 0;
      for (const b of enc.encode(s)) { h = (31 * h + b) | 0; }
      return h;
    }
    function guid(key) {
      let h = 0; const s = 'dd-' + key;
      for (const b of enc.encode(s)) { h = (31 * h + b) | 0; }
      return 'dd' + (h >>> 0).toString(16);
    }

    let nid = now * 1000, cid = (now + 1) * 1000;
    for (const b of basket) {
      const front = b.word;
      const back = `${b.zh}${b.example ? `<br><i>${b.example}</i>` : ''}`;
      const sfld = front;
      const flds = front.replace(/\t/g, ' ') + '\x1f' + back.replace(/\t/g, ' ');
      db.run(`INSERT INTO notes VALUES(?,?,?,?,?,?,?,?,?,?,?)`,
        [nid, guid(b.key), mid, now, -1, ' dd::' + (DATA.slug || b.date || DATA.date) + ' ', flds, sfld, csum(sfld), 0, '']);
      db.run(`INSERT INTO cards VALUES(?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)`,
        [cid, nid, deckId, 0, now, -1, 0, 0, nid, 0, 0, 0, 0, 0, 0, 0, 0, '']);
      nid++; cid++;
    }

    st.textContent = '打包…';
    const data = db.export();
    // zip: meta(version2) + collection.anki2 + collection.anki21(同内容, anki26+导入器优先读) + media
    const zip = makeZip({
      'meta': new Uint8Array([0x08, 0x02]),
      'collection.anki2': data,
      'collection.anki21': data,
      'media': new TextEncoder().encode('{}')
    });
    const blob = new Blob([zip], { type: 'application/apkg' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `deutsch-${basket.length}w-${Date.now()}.apkg`;
    a.click();
    st.textContent = `已导出 ${basket.length} 张卡 — 打开 Anki 导入即可`;
    toast('apkg 已下载');
  } catch (err) {
    console.error(err);
    st.textContent = '导出失败: ' + err.message + ' — 可先用「复制文本」';
  } finally {
    btn.disabled = false;
  }
}

/* 极简 zip (store, 无压缩) — apkg 只需合法 zip */
function makeZip(files) {
  const enc = new TextEncoder();
  const chunks = [], central = [];
  let offset = 0;
  const CRC_TABLE = (() => {
    const t = new Uint32Array(256);
    for (let n = 0; n < 256; n++) {
      let c = n;
      for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
      t[n] = c >>> 0;
    }
    return t;
  })();
  function crc32(buf) {
    let c = 0xFFFFFFFF;
    for (let i = 0; i < buf.length; i++) c = CRC_TABLE[(c ^ buf[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }
  for (const [name, content] of Object.entries(files)) {
    const nameB = enc.encode(name);
    const crc = crc32(content);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true);
    lh.setUint16(4, 20, true);       // version
    lh.setUint16(6, 0, true);        // flags
    lh.setUint16(8, 0, true);        // store
    lh.setUint16(10, 0, true); lh.setUint16(12, 0x2821, true); // time/date(dos)
    lh.setUint32(14, crc, true);
    lh.setUint32(18, content.length, true);
    lh.setUint32(22, content.length, true);
    lh.setUint16(26, nameB.length, true);
    lh.setUint16(28, 0, true);
    chunks.push(new Uint8Array(lh.buffer), nameB, content);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true);
    ch.setUint16(4, 20, true); ch.setUint16(6, 20, true);
    ch.setUint16(8, 0, true); ch.setUint16(10, 0, true);
    ch.setUint16(12, 0, true); ch.setUint16(14, 0x2821, true);
    ch.setUint32(16, crc, true);
    ch.setUint32(20, content.length, true); ch.setUint32(24, content.length, true);
    ch.setUint16(28, nameB.length, true);
    // 30..45 = 0
    ch.setUint32(42, offset, true);
    central.push(new Uint8Array(ch.buffer), nameB);
    offset += 30 + nameB.length + content.length;
  }
  let centralSize = central.reduce((s, c) => s + c.length, 0);
  const eocd = new DataView(new ArrayBuffer(22));
  eocd.setUint32(0, 0x06054b50, true);
  eocd.setUint16(8, Object.keys(files).length, true);
  eocd.setUint16(10, Object.keys(files).length, true);
  eocd.setUint32(12, centralSize, true);
  eocd.setUint32(16, offset, true);
  const total = [...chunks, ...central, new Uint8Array(eocd.buffer)];
  const out = new Uint8Array(total.reduce((s, c) => s + c.length, 0));
  let p = 0;
  for (const c of total) { out.set(c, p); p += c.length; }
  return out;
}

/* ---------- toast ---------- */
let toastT;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(toastT);
  toastT = setTimeout(() => t.style.display = 'none', 1600);
}
