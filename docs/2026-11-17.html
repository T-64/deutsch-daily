    <script id="dd-data" type="application/json">{"page":"lesson","lesson":{"slug":"2026-11-17","date":"2026-11-17","show":"tagesschau in Einfacher Sprache","level":"A2–B1","kind":"broadcast","note":"","source_url":"https://www.tagesschau.de/tagesschau_in_einfacher_sprache/tse-1514.html","video":{"mp4":"https://tagesschau-progressive.ard-mcdn.de/video/2026/1117/TV-20261117-1736-5200.webl.h264.mp4","embed":"","page":"https://www.tagesschau.de/tagesschau_in_einfacher_sprache/video-1685416.html"},"duration":475.4,"sentences":[{"de":"Willkommen zur tagesschau in Einfacher Sprache.","zh":"欢迎收看简单语言版《每日新闻》。","start":10.28,"end":13.76},{"de":"Ich bin Susanne Stichler und das sind unsere Nachrichten:","zh":"我是苏珊娜·施蒂希勒，以下是我们的新闻：","start":14.12,"end":18.52},{"de":"Und nun zur ersten Nachricht:","zh":"现在来看第一条新闻：","start":39.96,"end":42.92},{"de":"In der Ukraine ist schon lange Krieg.","zh":"乌克兰的战争已经持续很久了。","start":47.72,"end":51.0},{"de":"Russland hat die Ukraine nämlich angegriffen.","zh":"因为俄罗斯攻击了乌克兰。","start":51.36,"end":55.2},{"de":"Dagegen wehrt sich die Ukraine.","zh":"乌克兰对此进行抵抗。","start":55.92,"end":58.32},{"de":"Jetzt hat sie die Brücke auf die Krim beschädigt.","zh":"现在它损坏了通往克里米亚的桥梁。","start":59.04,"end":62.8},{"de":"Das zeigt das Foto.","zh":"这张照片显示了这一点。","start":63.16,"end":64.76},{"de":"Die Krim ist wie eine halbe Insel.","zh":"克里米亚像是一个半岛。","start":65.8,"end":68.84},{"de":"Sie gehört zur Ukraine.","zh":"它属于乌克兰。","start":69.48,"end":71.16},{"de":"Russland kontrolliert die Krim aber.","zh":"但俄罗斯控制着克里米亚。","start":71.84,"end":74.88},{"de":"Russland braucht die Brücke, um z.B. Waffen auf die Krim zu bringen.","zh":"俄罗斯需要这座桥，例如用来把武器运到克里米亚。","start":76.0,"end":82.08},{"de":"Der ukrainische Präsident Selenskyj sagt, wir haben den Angriff auf die Brücke lange vorbereitet.","zh":"乌克兰总统泽连斯基说：我们对这次桥梁袭击准备了很久。","start":82.96,"end":91.28},{"de":"Russland sagt, über die Brücke können jetzt keine Autos mehr fahren.","zh":"俄罗斯说，现在汽车已经无法从这座桥上通过。","start":91.92,"end":97.56},{"de":"Und nun zur nächsten Nachricht:","zh":"现在来看下一条新闻：","start":98.8,"end":101.56},{"de":"Manche Menschen kommen als Asylbewerber in die EU:","zh":"有些人作为避难申请者来到欧盟：","start":109.16,"end":113.16},{"de":"In die Europäische Union.","zh":"也就是来到欧洲联盟。","start":114.0,"end":116.04},{"de":"Die Menschen sind aus der Heimat geflohen und wollen in der EU bleiben, Asyl bekommen.","zh":"这些人逃离了家乡，想留在欧盟，获得庇护。","start":116.72,"end":124.88},{"de":"Sie bewerben sich dafür.","zh":"他们为此提出申请。","start":125.28,"end":127.04},{"de":"Deshalb heißen sie Asylbewerber.","zh":"因此他们被称为避难申请者。","start":127.76,"end":130.36},{"de":"Manche werden aber abgelehnt.","zh":"但有些人被拒绝了。","start":131.0,"end":133.84},{"de":"D.h. sie müssen die EU wieder verlassen.","zh":"也就是说他们必须再次离开欧盟。","start":134.2,"end":137.6},{"de":"Manche Heimatländer wollen die abgelehnten Asylbewerber aber nicht zurück.","zh":"但有些母国不愿意接收这些被拒的避难申请者。","start":138.36,"end":144.44},{"de":"Deshalb haben jetzt einige EU-Staaten einen Plan gemacht.","zh":"因此现在一些欧盟国家制定了一个计划。","start":144.48,"end":150.36},{"de":"Das sind Deutschland, Österreich, Dänemark, die Niederlande und Griechenland.","zh":"这些国家是德国、奥地利、丹麦、荷兰和希腊。","start":150.88,"end":156.72},{"de":"Sie sagen, wir wollen die abgelehnten Asylbewerber nach Ruanda schicken.","zh":"他们说：我们想把这些被拒的避难申请者送到卢旺达。","start":156.76,"end":163.04},{"de":"Mit dem Flugzeug.","zh":"用飞机送。","start":163.28,"end":164.48},{"de":"Wie auf dem Foto.","zh":"就像照片上那样。","start":164.64,"end":165.84},{"de":"Ruanda ist ein Land in Afrika.","zh":"卢旺达是非洲的一个国家。","start":166.52,"end":169.64},{"de":"Dazu kommt jetzt ein Film.","zh":"接下来播放一段影片。","start":170.32,"end":172.16},{"de":"Das ist ein Hotel in der Hauptstadt von Ruanda.","zh":"这是卢旺达首都的一家酒店。","start":172.8,"end":176.64},{"de":"Sie heißt Kigali.","zh":"它叫基加利。","start":177.0,"end":178.52},{"de":"Hier wohnen vielleicht irgendwann abgelehnte Asylbewerber aus der EU.","zh":"也许将来会有来自欧盟的被拒避难申请者住在这里。","start":179.08,"end":184.24},{"de":"Das Hotel ist für 100 Menschen.","zh":"这家酒店可容纳100人。","start":184.8,"end":187.84},{"de":"Ruanda bekommt Geld, wenn es abgelehnte Asylbewerber aufnimmt.","zh":"如果卢旺达接收被拒的避难申请者，它就会得到钱。","start":188.68,"end":194.12},{"de":"Dieser Mann sagt, es ist normal in Ruanda, andere Menschen aufzunehmen.","zh":"这名男子说：在卢旺达，接待其他人是很正常的事。","start":195.32,"end":201.48},{"de":"Dieser Mann sagt:","zh":"这名男子说：","start":202.44,"end":203.72},{"de":"Andere Länder haben auch schon Menschen aus Ruanda aufgenommen.","zh":"其他国家也已经接收过来自卢旺达的人。","start":203.76,"end":208.36},{"de":"Manche Experten für Flüchtlinge sagen aber, Ruanda achtet die Menschenrechte nicht.","zh":"但一些难民问题专家说，卢旺达不尊重人权。","start":209.36,"end":216.4},{"de":"Dieser Experte sagt, für Flüchtlinge ist es in Ruanda schlimmer als in der Heimat.","zh":"这位专家说：对难民来说，卢旺达的情况比在家乡还糟。","start":217.44,"end":224.08},{"de":"Der Präsident von Ruanda, Paul Kagame, regiert das Land seit vielen Jahren.","zh":"卢旺达总统保罗·卡加梅已经统治这个国家很多年了。","start":224.12,"end":231.52},{"de":"Experten für Menschenrechte sagen, Ruanda ist keine Demokratie.","zh":"人权专家说，卢旺达不是一个民主国家。","start":232.52,"end":237.52},{"de":"Kagame schränkt z.B. die Rechte von Medien ein.","zh":"例如，卡加梅限制了媒体的权利。","start":237.96,"end":242.08},{"de":"Der Experte sagt:","zh":"这位专家说：","start":242.12,"end":244.4},{"de":"Man soll keine Menschen nach Afrika bringen, die man woanders nicht haben will.","zh":"不应该把别国不想要的人送到非洲。","start":244.76,"end":250.08},{"de":"In Ruanda gibt es jetzt schon viele Flüchtlinge aus anderen afrikanischen Ländern.","zh":"卢旺达现在已经有许多来自其他非洲国家的难民。","start":250.12,"end":257.8},{"de":"Und niemand weiß, schafft Ruanda es, noch mehr Menschen aufzunehmen?","zh":"而且没有人知道：卢旺达能做到接收更多的人吗？","start":258.44,"end":264.48},{"de":"Und nun zur nächsten Nachricht:","zh":"现在来看下一条新闻：","start":266.36,"end":268.68},{"de":"Der Mann auf dem Foto ist der Schauspieler Robert Pattinson.","zh":"照片上的这名男子是演员罗伯特·帕丁森。","start":271.52,"end":276.68},{"de":"Er ist Brite und 40 Jahre alt.","zh":"他是英国人，40岁。","start":277.04,"end":279.84},{"de":"Er hat schon in vielen Filmen mitgespielt.","zh":"他已经出演过许多电影。","start":280.28,"end":283.44},{"de":"Jetzt wird Pattinson der neue James Bond.","zh":"现在帕丁森将成为新的詹姆斯·邦德。","start":284.0,"end":287.36},{"de":"Die Filme über James Bond sind sehr bekannt.","zh":"关于詹姆斯·邦德的电影非常有名。","start":288.16,"end":291.88},{"de":"James Bond ist ein britischer Agent.","zh":"詹姆斯·邦德是一名英国特工。","start":292.68,"end":295.84},{"de":"D.h. er arbeitet für den Geheimdienst.","zh":"也就是说，他为情报机构工作。","start":295.88,"end":300.12},{"de":"Er hat dabei den Namen 007.","zh":"他在这中间拥有007这个代号。","start":300.6,"end":304.24},{"de":"Jetzt zeigen wir einen Film dazu.","zh":"现在我们播放一段相关影片。","start":304.72,"end":307.08},{"de":"Dieses Video zeigt, Robert Pattinson ist der neue Bond.","zh":"这段视频显示：罗伯特·帕丁森是新任邦德。","start":307.76,"end":313.48},{"de":"Pattinson ist ein sehr bekannter Schauspieler, auch in Hollywood.","zh":"帕丁森是一位非常有名的演员，在好莱坞也一样。","start":314.96,"end":320.2},{"de":"Er hat z.B. in den Twilight-Filmen einen Vampir gespielt und Batman.","zh":"例如，他在《暮光之城》系列电影中演过吸血鬼，还演过蝙蝠侠。","start":320.24,"end":327.92},{"de":"Diese Frau sagt, Robert Pattinson ist toll.","zh":"这位女士说：罗伯特·帕丁森很棒。","start":329.32,"end":333.0},{"de":"Er spielt Bond bestimmt sehr gut.","zh":"他演邦德一定会演得很好。","start":333.32,"end":335.68},{"de":"Diese Frau sagt, er spielt doch schon Batman.","zh":"这位女士说：他已经演过蝙蝠侠了呀。","start":336.76,"end":339.92},{"de":"Jemand anderes ist besser für Bond.","zh":"别人更适合演邦德。","start":340.56,"end":343.08},{"de":"Dieser Mann sagt, er hat ein tolles Gesicht.","zh":"这名男子说：他有一张很棒的脸。","start":343.44,"end":346.52},{"de":"Er kann alles spielen.","zh":"他什么都能演。","start":346.84,"end":348.28},{"de":"Daniel Craig hat Bond bislang gespielt.","zh":"到目前为止，丹尼尔·克雷格一直扮演邦德。","start":348.32,"end":352.84},{"de":"Die Suche nach dem neuen Bond hat lange gedauert.","zh":"寻找新邦德的过程花了很长时间。","start":353.24,"end":357.2},{"de":"Robert Pattinson sagt jetzt, es ist eine große Ehre, Bond zu spielen.","zh":"罗伯特·帕丁森现在说：能扮演邦德是巨大的荣幸。","start":358.0,"end":363.36},{"de":"Der neue Bond-Film kommt wahrscheinlich 2028 in die Kinos.","zh":"新的邦德电影可能于2028年上映。","start":363.92,"end":370.28},{"de":"Und nun zur nächsten Nachricht:","zh":"现在来看下一条新闻：","start":371.04,"end":373.64},{"de":"Im Fußball gibt es gerade die Spiele von der Nations League.","zh":"足球界目前正在进行欧洲国家联赛的比赛。","start":379.04,"end":383.84},{"de":"Dabei spielen europäische Fußballteams von den Männern gegeneinander.","zh":"欧洲的男子足球队在其中相互比赛。","start":384.28,"end":389.4},{"de":"Deutschland hat gegen die Niederlande gespielt.","zh":"德国队对阵了荷兰队。","start":389.76,"end":393.04},{"de":"Es war ein wichtiges Spiel.","zh":"这是一场重要的比赛。","start":393.32,"end":395.56},{"de":"Es ging darum, kommt Deutschland sicher ins Viertelfinale.","zh":"关键在于：德国队能否确定进入四分之一决赛。","start":395.6,"end":401.0},{"de":"Deutschland hat das Spiel gegen die Niederlande mit 5:0 gewonnen.","zh":"德国队以5比0赢得了对阵荷兰队的比赛。","start":401.16,"end":406.4},{"de":"Derry Scherhant, Nico Schlotterbeck und Brajan Gruda haben jeder ein Tor geschossen.","zh":"德里·舍尔汉特、尼科·施洛特贝克和布赖恩·格鲁达各进了一球。","start":407.2,"end":413.12},{"de":"Florian Wirtz hat zweimal getroffen.","zh":"弗洛里安·维尔茨进了两球。","start":413.16,"end":416.68},{"de":"Die deutschen Spieler haben sich sehr gefreut.","zh":"德国球员们非常高兴。","start":417.44,"end":420.76},{"de":"Sie sind auf dem Foto.","zh":"他们在照片上。","start":421.04,"end":422.64},{"de":"Deutschland ist jetzt Gruppensieger und im Viertelfinale von der Nations League.","zh":"德国队现在是小组第一名，进入了欧洲国家联赛的四分之一决赛。","start":423.28,"end":429.32},{"de":"Und das waren unsere Nachrichten:","zh":"以上就是我们的新闻：","start":429.36,"end":432.52},{"de":"Und jetzt kommt das Wetter.","zh":"现在来看天气。","start":452.76,"end":454.92},{"de":"Es gibt viele Wolken und nur ab und zu Sonne.","zh":"云很多，只是偶尔有太阳。","start":455.76,"end":459.4},{"de":"Es regnet oft und es ist windig.","zh":"经常下雨，而且有风。","start":459.6,"end":462.36},{"de":"Manchmal gibt es Gewitter und Sturm.","zh":"有时会有雷雨和风暴。","start":462.64,"end":465.16},{"de":"Es werden 6 bis 14 Grad.","zh":"气温为6到14度。","start":465.2,"end":467.48},{"de":"Das war die
