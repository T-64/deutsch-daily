    <script id="dd-data" type="application/json">{"page":"lesson","lesson":{"slug":"2026-08-20","date":"2026-08-20","show":"tagesschau in Einfacher Sprache","level":"A2–B1","kind":"video","note":"","source_url":"https://www.tagesschau.de/tagesschau_in_einfacher_sprache/video-1634648.html","video":{"mp4":"https://tagesschau-progressive.ard-mcdn.de/video/2026/0820/TV-20260820-1743-0700.webl.h264.mp4","embed":"https://www.tagesschau.de/tagesschau_in_einfacher_sprache/video-1634648~player.html","page":"https://www.tagesschau.de/tagesschau_in_einfacher_sprache/video-1634648.html"},"duration":478.48,"sentences":[{"de":"Viele Menschen in Deutschland heizen mit Gas.","zh":"德国很多人用天然气取暖。","start":33.16,"end":42.76},{"de":"Damit es im nächsten Winter genug Gas gibt, wird Gas gespeichert.","zh":"为了下一个冬天有足够的天然气，人们会把气储存起来。","start":42.96,"end":47.08},{"de":"Wie auf dem Foto.","zh":"就像照片上那样。","start":47.12,"end":48.32},{"de":"Zurzeit ist aber wenig Gas in den Speichern.","zh":"但现在储气库里的气很少。","start":48.8,"end":51.8},{"de":"Sie sind nämlich nur zur Hälfte voll.","zh":"它们只有一半是满的。","start":52.24,"end":55.0},{"de":"Das ist deutlich weniger als im letzten Jahr im August.","zh":"这明显少于去年八月。","start":55.2,"end":58.96},{"de":"Der Grund dafür, es gibt insgesamt weniger Gas zu kaufen.","zh":"原因是，现在能买到的天然气总体上变少了。","start":59.36,"end":63.36},{"de":"Wegen dem Krieg von den USA mit Iran.","zh":"因为美国和伊朗在打仗。","start":64.36,"end":66.84},{"de":"Die beiden Länder streiten über einen wichtigen Weg für Schiffe mit Gas.","zh":"这两个国家在争夺一条对运天然气的船很重要的航路。","start":67.8,"end":73.04},{"de":"Und wenn es insgesamt weniger Gas zu kaufen gibt, dann ist Gas teurer.","zh":"如果能买到的天然气变少，天然气就会更贵。","start":73.6,"end":78.36},{"de":"Experten sagen, Gas wird im Winter vielleicht noch teurer.","zh":"专家说，冬天天然气也许还会更贵。","start":78.92,"end":83.24},{"de":"Und Kunden müssen dann vielleicht mehr für Gas bezahlen.","zh":"顾客到时候也许要为天然气付更多钱。","start":83.4,"end":87.08},{"de":"Der DGB fragt einmal im Jahr Auszubildende.","zh":"德国工会联合会（DGB）每年问一次学徒。","start":88.88,"end":99.24},{"de":"Wie zufrieden seid ihr mit eurer Ausbildung?","zh":"你们对自己的培训有多满意？","start":100.16,"end":103.24},{"de":"DGB ist das kurze Wort für Deutscher Gewerkschaftsbund.","zh":"DGB 是 Deutscher Gewerkschaftsbund 的简称。","start":103.44,"end":107.0},{"de":"Im DGB sind mehrere Gewerkschaften.","zh":"DGB 里有多家工会。它们比如会关心学徒的权利。","start":108.12,"end":110.64},{"de":"Sie kümmern sich etwa um die Rechte von Auszubildenden.","zh":"DGB 的调查结果显示，很多学徒并不满意。","start":111.48,"end":115.44},{"de":"Bei der Umfrage vom DGB kam heraus, viele Auszubildende sind unzufrieden.","zh":"他们说：我们压力太大，钱太少。","start":115.96,"end":122.36},{"de":"Sie sagen, wir haben zu viel Stress und zu wenig Geld.","zh":"所以我们过得不好。","start":122.8,"end":126.6},{"de":"Und deshalb geht es uns schlecht.","zh":"影片里我们现在展示一个来自德国南部巴登-符腾堡的例子。","start":127.96,"end":130.32},{"de":"Im Film zeigen wir jetzt ein Beispiel aus Baden-Württemberg im Süden von Deutschland.","zh":"（接下来是一段影片。）","start":130.88,"end":136.72},{"de":"Das ist Darja Grabow.","zh":"这位是达尔娅·格拉博（Darja Grabow）。","start":137.64,"end":139.44},{"de":"Sie ist Auszubildende bei einem Tischler.","zh":"她在一家木匠铺当学徒。","start":140.56,"end":143.8},{"de":"Sie ist seit zwei Jahren in der Ausbildung und verdient 1000 Euro im Monat.","zh":"她已经培训两年了，每月挣 1000 欧元。","start":145.04,"end":151.0},{"de":"Sie sagt: Ich muss verschiedene Dinge zum Leben bezahlen und ich verdiene weniger, als manche Menschen denken.","zh":"她说：我必须支付各种生活费用，而且我挣的比有些人以为的要少。","start":152.2,"end":161.4},{"de":"Viele Auszubildende klagen über zu wenig Geld.","zh":"很多学徒抱怨钱太少。","start":163.2,"end":166.84},{"de":"Sie fühlen sich unter Druck.","zh":"他们感到有压力。","start":167.44,"end":169.52},{"de":"Und jetzt will das Bundesland Baden-Württemberg manchen Auszubildenden weniger Geld für das Wohnen bezahlen.","zh":"现在巴登-符腾堡州还想给部分学徒减少住房补贴。","start":170.08,"end":178.88},{"de":"Das findet der DGB falsch.","zh":"DGB 认为这是错的。","start":179.96,"end":182.08},{"de":"Nina Krüger von den Gewerkschaften sagt: Wir brauchen mehr Wohnheime für Auszubildende.","zh":"工会的妮娜·克吕格（Nina Krüger）说：我们需要更多学徒宿舍。","start":183.44,"end":191.88},{"de":"Die Zimmer müssen günstig sein, damit die Auszubildenden weniger Sorgen wegen Geld haben.","zh":"房间必须便宜，好让学徒少为钱发愁。","start":192.28,"end":199.2},{"de":"Daniela Eigeldinger hat die Ausbildung abgebrochen.","zh":"达妮埃拉·艾格尔丁格（Daniela Eigeldinger）中断了培训。","start":201.2,"end":205.48},{"de":"Sie war nämlich unzufrieden.","zh":"因为她不满意。","start":206.2,"end":208.2},{"de":"Deshalb ist sie zur Beratung gegangen, bei Lisa Kühn.","zh":"所以她去找莉萨·屈恩（Lisa Kühn）咨询。","start":209.28,"end":213.72},{"de":"Daniela Eigeldinger sagt: Ich dachte immer, es ist normal, dass die Ausbildung keinen Spaß macht.","zh":"达妮埃拉说：我以前总觉得，培训不好玩是正常的。","start":215.0,"end":223.76},{"de":"Das ist aber falsch.","zh":"但这是错的。","start":224.32,"end":225.96},{"de":"Das hat sie bei der Beratung gelernt und sich eine andere Ausbildung gesucht.","zh":"她在咨询里明白了这一点，然后另找了一份培训。","start":226.84,"end":232.64},{"de":"So ein Wechsel in der Ausbildung ist aber nicht immer nötig.","zh":"不过培训中途换方向并不总是必要的。","start":233.2,"end":237.4},{"de":"Reden hilft oft bei Problemen.","zh":"遇到问题，开口谈往往有帮助。","start":238.12,"end":240.28},{"de":"Die Beraterin Lisa Kühn sagt, auch die Firmen müssen sich um die Auszubildenden kümmern.","zh":"咨询师莉萨·屈恩说，公司也必须关心学徒。","start":241.44,"end":248.84},{"de":"Und zwar die ganze Ausbildung lang, drei Jahre.","zh":"而且是整个培训期间，一共三年。","start":249.44,"end":253.4},{"de":"Die Firmen sollen die Auszubildenden mit Problemen nicht allein lassen.","zh":"公司不该让有困难的学徒一个人扛。","start":254.64,"end":259.92},{"de":"In der Tischlerei hilft der Chef den Auszubildenden, damit sie ohne Druck arbeiten können.","zh":"在这家木匠铺，老板会帮学徒，好让他们能没有压力地工作。","start":261.64,"end":269.92},{"de":"In Deutschland gab es schwere Unwetter.","zh":"德国出现了严重的恶劣天气。","start":272.12,"end":279.8},{"de":"Es gab starken Sturm und viel Regen.","zh":"有强风暴和大量降雨。","start":279.92,"end":282.96},{"de":"Der Sturm hat Bäume umgerissen und Häuser beschädigt, wie auf dem Foto.","zh":"风暴把树刮倒，还损坏了房屋，就像照片上那样。","start":283.28,"end":288.04},{"de":"Eine Frau ist gestorben.","zh":"一名女子死亡。恶劣天气出现在多个联邦州。","start":288.08,"end":289.8},{"de":"Die Unwetter waren in mehreren Bundesländern.","zh":"在德国东部、中部和南部。","start":289.96,"end":292.84},{"de":"Im Osten, in der Mitte und im Süden von Deutschland.","zh":"现在我们放一段相关影片。","start":292.96,"end":296.56},{"de":"Jetzt zeigen wir einen Film dazu.","zh":"（接下来是一段影片。）","start":296.72,"end":299.16},{"de":"Das ist ein Tornado in dem Bundesland Hessen, in der Mitte von Deutschland.","zh":"这是德国中部黑森州的一场龙卷风。","start":299.64,"end":305.84},{"de":"Ein Tornado ist ein sehr schneller Sturm.","zh":"龙卷风是非常快的风暴。","start":306.24,"end":309.44},{"de":"Er hat viel Regen und Hagel gebracht, also kleine Teile aus Eis.","zh":"它带来了很多雨和冰雹，也就是小冰块。","start":310.08,"end":315.48},{"de":"Der Tornado hat einige Häuser beschädigt.","zh":"龙卷风损坏了一些房屋。","start":317.04,"end":319.88},{"de":"In diesen Häusern kann man jetzt nicht wohnen.","zh":"这些房子现在没法住人。","start":320.2,"end":323.4},{"de":"Auch in anderen Teilen von Deutschland gab es Unwetter mit viel Regen.","zh":"德国其他地方也有伴随大雨的恶劣天气。","start":324.48,"end":329.76},{"de":"In dem Bundesland Rheinland-Pfalz, im Süden von Deutschland, hat der Sturm Bäume umgestürzt.","zh":"在南部的莱茵兰-普法尔茨，风暴把树刮倒了。","start":330.16,"end":336.44},{"de":"Eine Frau ist gestorben.","zh":"一名女子死亡。","start":337.08,"end":339.12},{"de":"Der Sturm hat auch mehrere Häuser beschädigt.","zh":"风暴还损坏了几栋房子。","start":339.72,"end":343.32},{"de":"Er hat Wände von Häusern weggerissen und Möbel zerstört.","zh":"它把房屋的墙撕掉，家具也毁了。","start":343.56,"end":348.0},{"de":"Die Steine von den Wänden haben auch Autos zerstört.","zh":"墙上掉下来的石头还砸坏了汽车。","start":348.4,"end":352.52},{"de":"Dieser Mann sagt: Ich habe gesehen, wie Steine durch die Luft geflogen sind.","zh":"这位男士说：我看见石头在空中飞。","start":354.76,"end":360.64},{"de":"Das waren Teile von den Wänden und von den Dächern.","zh":"那是墙壁和屋顶的碎片。","start":361.52,"end":365.88},{"de":"Nach wenigen Minuten war es dann wieder ruhig.","zh":"几分钟之后又平静了。","start":366.28,"end":370.08},{"de":"Aber in dieser kurzen Zeit hat der Sturm viel zerstört.","zh":"但在这短短时间里，风暴毁掉了很多东西。","start":370.4,"end":375.0},{"de":"In vielen Orten war der Strom wegen dem Unwetter ausgefallen.","zh":"很多地方因为恶劣天气停电了。","start":376.68,"end":381.92},{"de":"In dem Bundesland Brandenburg, im Osten von Deutschland, gab es auch einen Tornado.","zh":"东部的勃兰登堡也出现了龙卷风。","start":382.84,"end":389.64},{"de":"Teile von Dächern sind durch die Luft geflogen.","zh":"屋顶的碎片在空中飞。","start":389.92,"end":393.16},{"de":"Ein Baum ist sogar durch ein Dach gekracht.","zh":"甚至有一棵树砸穿了屋顶。","start":393.32,"end":396.76},{"de":"Auf dem Foto sind der britische Prinz Harry und seine Frau Meghan.","zh":"照片上是英国哈里王子和他的妻子梅根。","start":398.28,"end":409.0},{"de":"Sie haben sich vor einigen Jahren mit der Familie von Harry gestritten.","zh":"几年前他们和哈里的家人吵过架。","start":409.16,"end":413.56},{"de":"Vor allem mit dem Vater von Harry, König Charles, und mit dem Bruder von Harry, Prinz William.","zh":"尤其是和哈里的父亲查尔斯国王，以及哈里的哥哥威廉王子。","start":413.76,"end":420.04},{"de":"Deshalb haben Harry und Meghan England verlassen.","zh":"所以哈里和梅根离开了英格兰。","start":420.28,"end":423.64},{"de":"Sie sind in die USA gezogen, nach Kalifornien.","zh":"他们搬到了美国加利福尼亚。","start":423.8,"end":427.08},{"de":"Das ist die Heimat von Meghan.","zh":"那是梅根的家乡。","start":427.24,"end":429.4},{"de":"Jetzt berichten Zeitungen: Harry und Meghan wollen zurückkommen nach England.","zh":"现在报纸报道：哈里和梅根想回到英格兰。","start":429.84,"end":435.04},{"de":"Sie wollen sich vielleicht mit der Familie vertragen.","zh":"他们也许想和家人和解。","start":435.16,"end":438.52},{"de":"Sie wollen aber keine Aufgaben für den König übernehmen.","zh":"但他们不想为国王承担职务。","start":438.56,"end":442.12},{"de":"Und jetzt kommt das Wetter.","zh":"现在播报天气。","start":461.44,"end":463.36},{"de":"Oben im Norden und links im Westen manchmal Regen und kurze Gewitter.","zh":"上面北方和左边西方有时有雨和短时雷暴。","start":463.88,"end":468.72},{"de":"In der Mitte
