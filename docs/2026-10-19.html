n waren sehr wütend.","zh":"","start":68.08,"end":72.28},{"de":"Sie haben Autos zerstört und Feuer auf den Straßen gemacht.","zh":"","start":72.76,"end":78.52},{"de":"Hier auf dem Foto brennt das Rathaus von der Stadt Limoges.","zh":"","start":79.68,"end":83.76},{"de":"Die Menschen in Frankreich sind erschrocken über die Gewalt.","zh":"","start":85.44,"end":90.76},{"de":"Dazu kommt jetzt ein Film.","zh":"","start":91.04,"end":92.88},{"de":"Überall Zerstörung nach den Protesten auf den Straßen von Frankreich.","zh":"","start":94.36,"end":99.8},{"de":"Z.B. in den Städten Paris und Marseille.","zh":"","start":99.84,"end":104.32},{"de":"In Limoges schauen die Menschen erschrocken auf das verbrannte Rathaus.","zh":"","start":104.36,"end":110.48},{"de":"Das Feuer war groß.","zh":"","start":113.0,"end":114.64},{"de":"Der Turm ist eingestürzt.","zh":"","start":114.88,"end":116.96},{"de":"Dieser Mann sagt: Was hier passiert ist, ich kann es nicht glauben.","zh":"","start":118.16,"end":123.88},{"de":"Und dieser Mann sagt: Ich verstehe es nicht.","zh":"","start":125.04,"end":128.56},{"de":"Frankreich ist vielleicht nicht das Paradies.","zh":"","start":129.16,"end":132.16},{"de":"Aber Frankreich ist auch nicht die Hölle.","zh":"","start":132.2,"end":135.04},{"de":"In vielen französischen Städten haben die Menschen am Wochenende demonstriert.","zh":"","start":135.56,"end":141.0},{"de":"Dabei kam es zu heftigen Auseinandersetzungen von einigen Menschen mit der Polizei.","zh":"","start":141.6,"end":147.04},{"de":"Im Fernsehen verurteilt Präsident Emmanuel Macron die Gewalt.","zh":"","start":147.88,"end":152.4},{"de":"Er sagt: Wer das getan hat, der wird bestraft.","zh":"","start":152.8,"end":156.72},{"de":"In einigen Städten gibt es jetzt Ausgangssperren.","zh":"","start":157.88,"end":161.44},{"de":"D.h. die Menschen dürfen zu einer bestimmten Zeit nicht nach draußen gehen.","zh":"","start":161.92,"end":167.64},{"de":"Proteste gab es auch in dem Land Italien.","zh":"","start":168. },{"de":"Trump sagt: Selenskyj will den Krieg gar nicht beenden.","zh":"","start":259.84,"end":263.88},{"de":"Die Ukraine greift in Russland Ziele für die Herstellung von Diesel an.","zh":"","start":265.68,"end":272.44},{"de":"Die Ukraine macht damit den Handel mit Diesel kaputt.","zh":"","start":272.48,"end":276.2},{"de":"In den USA ist Diesel teuer geworden.","zh":"","start":276.64,"end":280.16},{"de":"Die Autofahrer sind deshalb wütend.","zh":"","start":280.52,"end":283.04},{"de":"Das ist schlecht für Trump.","zh":"","start":283.28,"end":285.2},{"de":"Er will bald den Sieg bei einer Wahl.","zh":"","start":285.64,"end":288.44},{"de":"Deshalb will er Diesel wieder billiger machen.","zh":"","start":289.0,"end":292.2},{"de":"Und dafür kauft er Diesel aus Russland.","zh":"","start":292.4,"end":295.68},{"de":"Der ukrainische Präsident Selenskyj macht sich große Sorgen.","zh":"","start":296.96,"end":301.52},{"de":"Er sagt, wenn die USA jetzt Russland unterstützen, dann ist das ein großer Fehler.","zh":"","start":301.8,"end":308.92},{"de":"Selenskyj hofft, vielleicht wird das Verhältnis zwischen der Ukraine und den USA nach der Wahl wieder besser.","zh":"","start":309.28,"end":318.32},{"de":"Und nun zur nächsten Nachricht.","zh":"","start":319.32,"end":321.72},{"de":"Japan, Mission zum Mond vom Mars.","zh":"","start":323.12,"end":326.8},{"de":"Diese Rakete hier auf dem Foto steht in dem Land Japan.","zh":"","start":327.32,"end":332.0},{"de":"Sie soll bald starten.","zh":"","start":332.36,"end":334.12},{"de":"Sie soll eine Sonde in das Weltall bringen.","zh":"","start":334.4,"end":337.84},{"de":"Die Sonde ist ein Fluggerät.","zh":"","start":338.2,"end":340.64},{"de":"Sie soll bis zum Mond vom Mars fliegen.","zh":"","start":341.16,"end":344.72},{"de":"Der Mars ist ein Planet weit entfernt von der Erde.","zh":"","start":345.2,"end":349.56},{"de":"Der Mond vom Mars heißt Phobos.","zh":"","start":349.6,"end":352.96},{"de":"Wissenschaftler wollen Phobos erkunden.","zh":"","sta
