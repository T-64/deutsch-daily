8,"end":152.4},{"de":"Er sagt: Wer das getan hat, der wird bestraft.","zh":"他说：谁做了这些事，谁就会受到惩罚。","start":152.8,"end":156.72},{"de":"In einigen Städten gibt es jetzt Ausgangssperren.","zh":"一些城市现在实行了宵禁。","start":157.88,"end":161.44},{"de":"D.h. die Menschen dürfen zu einer bestimmten Zeit nicht nach draußen gehen.","zh":"也就是说，人们在特定时间不得外出。","start":161.92,"end":167.64},{"de":"Proteste gab es auch in dem Land Italien.","zh":"意大利也发生了抗议活动。","start":168.6,"end":171.56},{"de":"Wie hier in der Stadt Mailand.","zh":"比如在米兰市。","start":171.8,"end":173.96},{"de":"Demonstranten brechen in Geschäfte und Supermärkte ein.","zh":"示威者闯入商店和超市。","start":174.64,"end":178.36},{"de":"Auf den Straßen kommt es zu Gewalt mit der Polizei.","zh":"街头发生了与警方的暴力冲突。","start":178.72,"end":182.12},{"de":"Mehrere Demonstranten werden festgenommen.","zh":"多名示威者被逮捕。","start":183.4,"end":186.48},{"de":"Die Kosten für das Leben werden auch in Italien immer teurer.","zh":"意大利的生活成本也越来越高。","start":188.32,"end":192.76},{"de":"Deshalb protestieren die Menschen.","zh":"因此人们举行抗议。","start":193.32,"end":195.76},{"de":"Und nun zur nächsten Nachricht.","zh":"现在来看下一条新闻。","start":196.96,"end":199.24},{"de":"Ukraine-Krieg.","zh":"乌克兰战争。","start":200.36,"end":201.36},{"de":"Trump setzt Sanktionen aus.","zh":"特朗普暂停制裁。","start":201.64,"end":203.64},{"de":"Der Krieg von dem Land Russland gegen das Land Ukraine dauert schon mehrere Jahre.","zh":"俄罗斯对乌克兰的战争已经持续了数年。","start":203.68,"end":210.24},{"de":"Russland hat die Ukraine angegriffen.","zh":"俄罗斯攻击了乌克兰。","start":210.6,"end":213.24},{"de":"Deshalb haben die Partner von der Ukraine Sanktionen gegen Russland verhängt.","zh":"因此乌克兰的伙伴们对俄罗斯实施了制裁。","start":214.16,"end":220.24},{"de":"Sanktionen sind Strafen.","zh":"制裁就是惩罚。","start":220.72,"end":222.84},{"de":"Auch das Land USA hat Sanktionen verhängt.","zh":"美国也实施了制裁。","start":223.68,"end":227.4},{"de":"Aber US-Präsident Donald Trump, der Mann hier auf dem Foto, hat einige Sanktionen ausgesetzt.","zh":"但美国总统唐纳德·特朗普，就是照片上的这位男子，暂停了 nd am Tag sehr warm.","zh":"在火卫一上，夜里非常冷，白天非常热。","start":394.32,"end":400.16},{"de":"Das ist großer Stress für Idefix.","zh":"这对伊德菲克斯来说是很大的考验。","start":400.2,"end":403.56},{"de":"Zunächst bringt die japanische Rakete diese Raumsonde in das Weltall.","zh":"首先，日本火箭把这个太空探测器送入太空。","start":404.68,"end":411.68},{"de":"Der Weg ist sehr weit.","zh":"路途非常遥远。","start":412.48,"end":414.48},{"de":"Und die Sonde fliegt sehr lange.","zh":"探测器要飞行很长时间。","start":414.76,"end":417.28},{"de":"Sie braucht etwa ein Jahr bis zum Mond Phobos.","zh":"它大约需要一年才能到达火卫一。","start":417.84,"end":421.76},{"de":"Dort wirft die Sonde den kleinen Idefix ab.","zh":"在那里，探测器会把小小的伊德菲克斯投放下去。","start":421.8,"end":426.48},{"de":"Er soll das Gebiet erkunden.","zh":"它要探测这个区域。","start":427.2,"end":429.76},{"de":"Wenn alles okay ist, dann soll auch die Sonde landen.","zh":"如果一切顺利，探测器也应该着陆。","start":431.76,"end":436.2},{"de":"Sie soll Proben vom Boden auf Phobos sammeln und zur Erde bringen.","zh":"它要采集火卫一地表的样本并带回地球。","start":437.0,"end":442.32},{"de":"Das dauert mehrere Jahre.","zh":"这需要好几年时间。","start":442.36,"end":445.2},{"de":"Und nun zur nächsten Nachricht.","zh":"现在来看下一条新闻。","start":449.08,"end":451.28},{"de":"Spanien.","zh":"西班牙。","start":451.4,"end":452.12},{"de":"Heftiger Sturm.","zh":"猛烈的暴风雨。","start":452.16,"end":453.48},{"de":"Viele Schüler haben momentan Ferien.","zh":"很多学生目前在放假。","start":454.2,"end":457.16},{"de":"Und viele Familien machen deshalb Urlaub.","zh":"因此很多家庭去度假。","start":457.4,"end":460.56},{"de":"Z.B. in dem Land Spanien.","zh":"比如在西班牙这个国家。","start":461.08,"end":463.2},{"de":"Aber da ist das Wetter zurzeit sehr schlecht.","zh":"但是那里的天气现在非常糟糕。","start":463.72,"end":467.72},{"de":"Es gibt einen heftigen Sturm.","zh":"有一场猛烈的暴风雨。","start":467.76,"end":470.6},{"de":"Viele Straßen sind überschwemmt, wie hier auf dem Foto.","zh":"很多街道被淹没了，就像这张照片上一样。","start":471.16,"end":475.2},{"de":"Zu dem Sturm kommt jetzt ein Film.","zh":"现在来看一段关于这场暴风雨的影片。","start":475.92,"end":478.36},{"de":"In manchen Orten
