    <script id="dd-data" type="application/json">{"page":"lesson","lesson":{"slug":"2026-11-27","date":"2026-11-27","show":"tagesschau in Einfacher Sprache","level":"A2–B1","kind":"broadcast","note":"","source_url":"https://www.tagesschau.de/tagesschau_in_einfacher_sprache/tse-1532.html","video":{"mp4":"https://tagesschau-progressive.ard-mcdn.de/video/2026/1127/TV-20261127-1734-4800.webl.h264.mp4","embed":"","page":"https://www.tagesschau.de/tagesschau_in_einfacher_sprache/video-1691112.html"},"duration":501.56,"sentences":[{"de":"Willkommen zur tagesschau in Einfacher Sprache.","zh":"欢迎收看简易德语新闻。","start":10.36,"end":13.36},{"de":"Ich bin Michail Paweletz.","zh":"我是米夏埃尔·帕维莱茨。","start":13.64,"end":15.44},{"de":"Und das sind unsere Nachrichten:","zh":"以下是我们的新闻：","start":16.02,"end":18.3},{"de":"Und nun zur ersten Nachricht.","zh":"现在来看第一条新闻。","start":37.32,"end":39.4},{"de":"Die Bundesregierung plant Änderungen bei der Rente.","zh":"德国联邦政府计划对养老金进行改革。","start":44.16,"end":47.72},{"de":"Die Parteien CDU, CSU und SPD streiten aber seit Monaten, wie die Rente geändert werden soll.","zh":"但基民盟、基社盟和社民党几个月来一直在争论养老金应该怎么改。","start":48.6,"end":57.7},{"de":"Das Ministerium für Arbeit und Soziales ist für die Rente zuständig.","zh":"劳动和社会事务部负责养老金事务。","start":58.54,"end":63.66},{"de":"Es hat jetzt einen Plan für die Änderungen gemacht.","zh":"该部门现在制定了一份改革方案。","start":64.6,"end":68.16},{"de":"Die Rente ohne Abzug nach 45 Jahren Arbeit soll bleiben.","zh":"工作满45年后无扣减领取养老金的规定将保留。","start":69.24,"end":74.0},{"de":"Wer nach 35 Jahren Arbeit in Rente gehen will, der bekommt weniger Geld.","zh":"想在工作满35年后退休的人，拿到的钱会变少。","start":75.4,"end":81.88},{"de":"Und er muss mindestens 64 Jahre alt sein.","zh":"而且他必须至少满64岁。","start":83.16,"end":86.0},{"de":"Außerdem sollen mehr Menschen in die Rentenkasse einzahlen, z.B. Minijobber und Politiker.","zh":"此外，更多人应向养老保险基金缴费，比如打短工零工的人和政治家。","start":87.36,"end":95.02},{"de":"Und nun zur nächsten Nachricht.","zh":"现在来看下一条新闻。","start":97.36,"end":99.56},{"de":"Der Bundestag ist das Parlament von Deutschland.","zh":"联邦议院是德国的议会。","start":105.6,"end":108.96},{"de":"Die Politiker im Bundestag haben heute entschieden:","zh":"联邦议院的政治家们今天决定了：","start":109.92,"end":113.48},{"de":"Die Bundesregierung darf im nächsten Jahr viele Milliarden Euro ausgeben.","zh":"联邦政府明年可以支出数百亿欧元。","start":114.12,"end":119.48},{"de":"Sie darf z.B. viel Geld für die Verteidigung ausgeben.","zh":"比如可以花很多钱用于国防。","start":120.76,"end":124.8},{"de":"Der Bundestag hat auch entschieden:","zh":"联邦议院还决定了：","start":126.0,"end":128.48},{"de":"Die Regierung darf viele Milliarden neue Schulden machen.","zh":"政府可以新增数百亿欧元的债务。","start":129.12,"end":132.78},{"de":"Schulden machen bedeutet: sich Geld leihen.","zh":"举债的意思是：借钱。","start":133.76,"end":136.76},{"de":"Die Politiker haben lange über die neuen Schulden gestritten.","zh":"政治家们就新债务问题争论了很久。","start":137.84,"end":141.84},{"de":"Dazu zeigen wir einen Film.","zh":"为此我们播放一段影片。","start":142.06,"end":143.74},{"de":"Hier sieht man die Politiker im Bundestag.","zh":"这里可以看到联邦议院里的政治家们。","start":145.2,"end":148.12},{"de":"Bundeskanzler Merz ist zufrieden.","zh":"联邦总理默茨很满意。","start":148.34,"end":150.5},{"de":"Er sagt: Es hat lange gedauert, bis wir uns geeinigt haben.","zh":"他说：我们花了很长时间才达成一致。","start":150.96,"end":155.56},{"de":"Die Politiker haben z.B. über die neuen Schulden gestritten.","zh":"政治家们曾就新债务等问题发生争执。","start":156.44,"end":160.64},{"de":"Das meiste Geld bekommt das Ministerium für Arbeit und Soziales.","zh":"劳动和社会事务部拿到的钱最多。","start":161.36,"end":165.7},{"de":"Minister Schweizer sagt:","zh":"部长施魏策尔说：","start":166.32,"end":168.04},{"de":"Geld für Rentner und Familien, für Arbeitslose und für arme Menschen ist wichtig.","zh":"用于退休人员、家庭、失业者和贫困人群的钱很重要。","start":168.52,"end":174.42},{"de":"Sie können dann ein gutes Leben haben.","zh":"这样他们就能过上好的生活。","start":174.92,"end":177.56},{"de":"Viele Politiker machen sich aber Sorgen über die Schulden.","zh":"但许多政治家对债务感到担忧。","start":177.98,"end":181.98},{"de":"Auch Politiker von den Regierungsparteien CDU, CSU und SPD sind skeptisch.","zh":"执政党基民盟、基社盟和社民党的政治家也持怀疑态度。","start":182.22,"end":189.02},{"de":"Johannes Winkel von der CDU sagt:","zh":"基民盟的约翰内斯·温克尔说：","start":189.72,"end":192.08},{"de":"Die Regierung muss sich einen Plan überlegen.","zh":"政府必须想出一个计划。","start":192.76,"end":195.92},{"de":"Wie kann sie die Schulden zurückzahlen?","zh":"它怎样才能偿还这些债务？","start":196.18,"end":198.9},{"de":"Auch Experten für Geld kritisieren die vielen Schulden.","zh":"金融专家也批评这么多债务。","start":200.24,"end":204.08},{"de":"Sie sagen: Deutschland muss sparen.","zh":"他们说：德国必须节省开支。","start":204.6,"end":207.12},{"de":"Sonst gibt es in der Zukunft große Probleme.","zh":"否则未来会出现大问题。","start":207.76,"end":210.84},{"de":"Und nun zur nächsten Nachricht.","zh":"现在来看下一条新闻。","start":212.76,"end":214.96},{"de":"Auf dem Foto ist eine Fahne mit Sternen im Kreis.","zh":"照片上是一面带有圆圈排列星星的旗帜。","start":218.24,"end":222.24},{"de":"Die Fahne ist von der Europäischen Union.","zh":"这面旗帜属于欧洲联盟。","start":222.5,"end":225.66},{"de":"Das kurze Wort ist EU.","zh":"简称是欧盟。","start":226.1,"end":228.26},{"de":"In der EU sind viele Länder von Europa.","zh":"欧盟包括许多欧洲国家。","start":228.98,"end":232.38},{"de":"Die Chefs von den Ländern streiten gerade über Geld.","zh":"这些国家的领导人正在为钱发生争执。","start":232.7,"end":236.7},{"de":"Sie müssen nämlich entscheiden, wie viel Geld bekommt die EU in den nächsten Jahren von den Ländern.","zh":"因为他们必须决定，未来几年各国要给欧盟多少钱。","start":237.02,"end":243.9},{"de":"Und was soll die EU mit dem Geld bezahlen?","zh":"欧盟又应该用这些钱支付什么？","start":243.94,"end":247.9},{"de":"Einige Länder, so wie Deutschland, sagen:","zh":"一些国家，比如德国，说：","start":248.66,"end":251.5},{"de":"Die EU soll weniger Geld bekommen.","zh":"欧盟应该拿更少的钱。","start":251.58,"end":254.38},{"de":"Wir müssen nämlich sparen.","zh":"因为我们必须节省开支。","start":254.98,"end":257.02},{"de":"Andere Länder sagen: Die EU soll mehr Geld bekommen.","zh":"另一些国家说：欧盟应该拿更多的钱。","start":257.62,"end":261.38},{"de":"Deshalb gibt es Streit.","zh":"因此产生了争执。","start":262.02,"end":263.66},{"de":"Dazu kommt jetzt ein Film.","zh":"现在播放一段相关影片。","start":263.98,"end":265.82},{"de":"Die Chefs von allen EU-Ländern haben sich in Brüssel getroffen.","zh":"所有欧盟国家的领导人在布鲁塞尔会面。","start":267.24,"end":271.2},{"de":"Sie haben zwei Tage verhandelt.","zh":"他们谈判了两天。","start":272.0,"end":274.2},{"de":"Wie viel Geld bekommt die EU?","zh":"欧盟能拿到多少钱？","start":274.56,"end":276.64},{"de":"Hier sind die Chefs von den Ländern, die weniger bezahlen wollen.","zh":"这里是希望少交钱的国家的领导人。","start":277.8,"end":282.36},{"de":"Bundeskanzler Merz ist auch dabei.","zh":"联邦总理默茨也在其中。","start":282.7,"end":285.42},{"de":"Merz sagt: Die EU will zu viel Geld.","zh":"默茨说：欧盟想要的钱太多了。","start":286.4,"end":290.16},{"de":"Viele Länder von der EU müssen aber sparen.","zh":"但许多欧盟国家必须节省开支。","start":290.9,"end":294.02},{"de":"Sie können nicht so viel Geld bezahlen.","zh":"它们拿不出这么多钱。","start":294.68,"end":297.4},{"de":"Das ist Giorgia Meloni.","zh":"这位是乔治娅·梅洛尼。","start":298.2,"end":299.84},{"de":"Sie ist Ministerpräsidentin von Italien.","zh":"她是意大利的政府首脑。","start":300.28,"end":303.08},{"de":"Italien bekommt viel Geld von der EU.","zh":"意大利从欧盟得到很多钱。","start":303.78,"end":307.06},{"de":"Meloni sagt:","zh":"梅洛尼说：","start":307.92,"end":308.92},{"de":"Ich unterschreibe keinen Vertrag, wenn Italien dann weniger Geld bekommt.","zh":"如果意大利得到的钱会变少，我就不签署任何条约。","start":309.04,"end":314.24},{"de":"Die EU-Länder streiten auch darüber.","zh":"欧盟各国也在争论这个问题。","start":314.96,"end":317.52},{"de":"Was soll die EU in den nächsten Jahren mit dem Geld bezahlen?","zh":"未来几年，欧盟应该把钱用来支付什么？","start":317.96,"end":321.9},{"de":"Bundeskanzler Merz fordert, die EU soll weniger Geld für die Landwirtschaft bezahlen.","zh":"联邦总理默茨要求，欧盟应该减少给农业的钱。","start":322.76,"end":329.18},{"de":"Sie soll mehr Geld für Verteidigung und neue Ideen bezahlen.","zh":"应该把更多的钱用于国防和新的构想。","start":329.84,"end":334.64},{"de":"Merz sagt: Europa braucht eine starke Wirtschaft.","zh":"默茨说：欧洲需要强大的经济。","start":335.28,"end":339.2},{"de":"Das ist wichtig.","zh":"这很重要。","start":339.82,"end":340.98},{"de":"Und Europa braucht eine starke Verteidigung.","zh":"欧洲还需要强大的国防。","start":341.56,"end":345.2},{"de":"Das Land Österreich hat viel Landwirtschaft.","zh":"奥地利这个国家有很多农业。","start":346.26,"end":349.06},{"de":"Österreichs Regierungschef sagt:","zh":"奥地利的政府首脑说：","start":349.1,"end":351.7},{"de":"Die Landwirtschaft in Europa muss moderner werden.","zh":"欧洲的农业必须更加现代化。","start":352.64,"end":356.16},{"de":"Sie braucht dafür Geld.","zh":"为此需要钱。","start":356.56,"end":358.2},{"de":"Die Länder streiten auch über Geld für die Ukraine.","zh":"各国还就给乌克兰的钱进行争论。","start":360.16,"end":363.72},{"de":"Merz sagt: Die Ukraine muss sich weiter gegen Russland verteidigen.","zh":"默茨说：乌克兰必须继续抵抗俄罗斯。","start":364.14,"end":368.86},{"de":"Die EU muss der Ukraine helfen.","zh":"欧盟必须帮助乌克兰。","start":369.36,"end":371.72},{"de":"Einige EU-Länder wollen der Ukraine aber weniger Geld geben.","zh":"但一些欧盟国家想减少给乌克兰的钱。","start":373.4,"end":377.42},{"de":"Der Regierungschef von Tschechien sagt:","zh":"捷克的政府首脑说：","start":378.08,"end":380.56},{"de":"In den Verträgen von der EU steht, die Länder unterstützen sich gegenseitig.","zh":"欧盟的条约里写着，各国要互相支持。","start":380.68,"end":386.12},{"de":"Die Ukraine ist aber nicht in der EU.","zh":"但乌克兰不在欧盟里。","start":386.24,"end":388.88},{"de":"Jedes Land soll entscheiden: Wie viel Geld gibt es der Ukraine.","zh":"每个国家都应该自己决定：给乌克兰多少钱。","start":389.56,"end":394.0},{"de":"Die Chefs von den Ländern haben ihr Treffen ohne Ergebnis beendet.","zh":"各国领导人结束了会谈，没有达成结果。","start":394.64,"end":399.06},{"de":"Im Dezember treffen sie sich wieder.","zh":"十二月他们将再次会面。","start":399.6,"end":402.16},{"de":"Und nun zur nächsten Nachricht:","zh":"现在来看下一条新闻：","start":403.6,"end":405.64},{"de":"Die Zugspitze ist der höchste Berg in Deutschland.","zh":"楚格峰是德国最高的山。","start":409.68,"end":413.2},{"de":"Er ist ganz unten in Bayern an der Grenze zu Österreich.","zh":"它位于最南端的巴伐利亚州，靠近奥地利边境。","start":413.44,"end":417.36},{"de":"Auf der Zugspitze hat jetzt die Skisaison begonnen.","zh":"楚格峰的滑雪季节现在开始了。","start":418.16,"end":421.56},{"de":"Dazu kommt ein kurzer Film.","zh":"接下来请看一段短片。","start":421.74,"end":423.66},{"de":"Seilbahnen wie diese bringen die ersten Skifahrer und Snowboardfahrer auf den Berg.","zh":"这样的缆车把第一批滑雪者和单板滑雪者送上山。","start":424.82,"end":430.38},{"de":"Die Menschen haben Glück.","zh":"人们很幸运。","start":430.7,"end":432.58},{"de":"Es gibt viel Schnee und die Sonne scheint.","zh":"雪很多，太阳也出来了。","start":432.98,"end":435.9},{"de":"Die Zugspitze ist das erste offene Skigebiet in Deutschland in diesem Winter.","zh":"楚格峰是德国这个冬天第一个开放的滑雪场。","start":436.26,"end":442.02},{"de":"In den nächsten Wochen wollen auch alle anderen Skigebiete öffnen.","zh":"接下来的几周里，其他所有滑雪场也想开放。","start":442.56,"end":447.2},{"de":"Und das waren unsere Nachrichten:","zh":"以上是我们的新闻：","start":448.32,"end":450.68},{"de":"Und jetzt kommt das Wetter.","zh":"现在来看天气。","start":466.38,"end":468.62},{"de":"Erst mal ist es teils sonnig und teils neblig.","zh":"一开始部分地区有阳光，部分地区有雾。","start":470.3,"end":473.66},{"de":"Später scheint die Sonne mehr.","zh":"之后阳光会更多。","start":474.64,"end":476.48},{"de":"Es werden minus vier bis plus vier Grad.","zh":"气温为零下四度到零上四度。","start":476.64,"end":479.44},{"de":"Das war die tagesschau in Einfacher Sprache.","zh":"以上是简单语言版的每日新闻。","start":481.32,"end":484.24},{"de":"Meldungen und das Video von der Sendung gibt es jetzt auch bei WhatsApp.","zh":"现在也可以通过WhatsApp获取新闻消息和节目视频。","start":484.82,"end":489.3},{"de":"Sie finden den Kanal von der tagesschau in einfacher Sprache bei tagesschau.de/einfach Tschüss, bis zum nächsten Mal.","zh":"您可以在tagesschau.de/einfach找到简单语言版每日新闻的频道。再见，下次见。","start":489.66,"end":501.56}],"stories":[{"title":"Begrüßung","title_zh":"开场问候","from":0,"to":3,"vocab":[],"grammar":[],"background":""},{"title":"Rente: Plan für Änderungen","title_zh":"养老金：改革计划","from":4,"to":11,"vocab":[{"key":"rente","lemma":"die Rente, -n","pos":"noun","zh":"养老金","example_de":"Die Bundesregierung plant Änderungen bei de
