    <script id="dd-data" type="application/json">{"page":"lesson","lesson":{"slug":"2026-11-24","date":"2026-11-24","show":"tagesschau in Einfacher Sprache","level":"A2–B1","kind":"broadcast","note":"","source_url":"https://www.tagesschau.de/tagesschau_in_einfacher_sprache/tse-1530.html","video":{"mp4":"https://tagesschau-progressive.ard-mcdn.de/video/2026/1124/TV-20261124-1730-2400.webl.h264.mp4","embed":"","page":"https://www.tagesschau.de/tagesschau_in_einfacher_sprache/video-1689132.html"},"duration":464.11,"sentences":[{"de":"Willkommen zur tagesschau in Einfacher Sprache.","zh":"欢迎收看简单语言版每日新闻。","start":10.87,"end":14.47},{"de":"Ich bin Michael Paweletz und das sind unsere Nachrichten:","zh":"我是迈克尔·帕韦莱茨，以下是我们的新闻：","start":14.95,"end":19.35},{"de":"Und nun zur ersten Nachricht:","zh":"现在来看第一条新闻：","start":38.75,"end":41.91},{"de":"Wie viel Geld kann die Bundesregierung im kommenden Jahr ausgeben und wofür?","zh":"联邦政府明年可以花多少钱？用来做什么？","start":47.19,"end":54.55},{"de":"Darum geht es in dieser Woche im Bundestag.","zh":"这是本周德国联邦议院讨论的问题。","start":55.35,"end":58.99},{"de":"Die Bundesregierung will so viel Geld ausgeben wie noch nie.","zh":"联邦政府想花的钱比以往任何时候都多。","start":59.47,"end":64.47},{"de":"Die Bundesregierung will auch sehr viele Schulden machen.","zh":"联邦政府还想大量举债。","start":64.51,"end":69.11},{"de":"Deshalb gibt es im Parlament eine heftige Diskussion.","zh":"因此议会中发生了激烈的讨论。","start":69.95,"end":74.71},{"de":"Dazu kommt jetzt ein Film.","zh":"接下来播放一段影片。","start":75.27,"end":77.23},{"de":"Jetzt ist die Stimmung wieder besser.","zh":"现在气氛又好转了。","start":78.39,"end":81.23},{"de":"Denn die Steuern auf Strom sollen sinken.","zh":"因为电的税收要降低了。","start":81.59,"end":84.83},{"de":"Darüber hatten die Parteien in der Regierung lange gestritten.","zh":"执政各党为此争论了很久。","start":85.47,"end":89.27},{"de":"Dieser Politiker von der SPD sagt, die Regierung hatte viele Monate Zeit.","zh":"这位社民党的政治家说，政府本来有很多个月的时间。","start":89.31,"end":95.91},{"de":"Das Parlament hatte sich schon auf alle Ausgaben geeinigt.","zh":"议会本来已经就所有支出达成了共识。","start":96.39,"end":100.47},{"de":"Und dann gibt es doch wieder Änderungen.","zh":"可现在却又出现了变动。","start":100.67,"end":103.47},{"de":"Auch dieser Politiker von den Linken findet das nicht gut.","zh":"这位左翼党的政治家也觉得这样不好。","start":104.27,"end":108.35},{"de":"Er sagt, so etwas habe ich noch nicht erlebt.","zh":"他说：这样的事我还从未经历过。","start":109.03,"end":112.39},{"de":"Das ist nicht professionell.","zh":"这不专业。","start":112.43,"end":114.99},{"de":"Die Steuersenkung kostet 5 Mrd. Euro.","zh":"减税要花费50亿欧元。","start":115.59,"end":119.31},{"de":"Das Geld soll bei den erneuerbaren Energien gespart werden.","zh":"这笔钱将从可再生能源领域中节省出来。","start":119.63,"end":124.39},{"de":"Erst mal nur für ein Jahr.","zh":"暂时只是为期一年。","start":125.03,"end":126.87},{"de":"Dieser grünen Politiker meint, so kann doch niemand seine Zukunft planen.","zh":"这位绿党政治家认为，这样没人能规划自己的未来。","start":127.71,"end":133.43},{"de":"Der Finanzminister Lars Klingbeil von der SPD betont lieber die neuen Investitionen.","zh":"财政部长、社民党的拉尔斯·克林拜尔则更愿意强调新的投资。","start":134.27,"end":141.19},{"de":"Er sagt:","zh":"他说：","start":141.51,"end":142.71},{"de":"Wir geben sehr viel Geld für eine bessere Zukunft in Deutschland aus.","zh":"我们正在为德国更美好的未来投入大量资金。","start":142.95,"end":147.99},{"de":"Das sieht auch dieser Politiker aus der CDU so.","zh":"这位基民盟的政治家也这么看。","start":149.43,"end":153.07},{"de":"Er sagt, wir haben einen guten Plan für das Geld.","zh":"他说，我们对这笔钱有一个好的规划。","start":153.47,"end":157.71},{"de":"Politiker von der AfD lachen.","zh":"选项党的政治家们在笑。","start":158.47,"end":160.79},{"de":"Ein AfD-Politiker sagt, Union und SPD können sich nicht einigen.","zh":"一位选项党政治家说，联盟党和社民党无法达成一致。","start":161.83,"end":167.79},{"de":"In dieser Regierung heißt die Lösung nach jedem Streit mehr Schulden.","zh":"在这届政府中，每次争执之后的解决办法都是更多的债务。","start":167.83,"end":173.59},{"de":"Die Regierung will im nächsten Jahr sehr viele Schulden machen.","zh":"政府明年想大量举债。","start":174.23,"end":178.67},{"de":"Von allen Ausgaben ist jeder dritte Euro nur geliehen.","zh":"在所有支出中，每三欧元就有一欧元是借来的。","start":178.75,"end":182.87},{"de":"Und nun zur nächsten Nachricht:","zh":"现在来看下一条新闻：","start":184.59,"end":187.07},{"de":"Es gibt wieder mehr Gewalt gegen Frauen in Deutschland.","zh":"德国针对女性的暴力又增多了。","start":191.83,"end":195.83},{"de":"Das steht in einer neuen Statistik.","zh":"这是一项新统计的结果。","start":196.63,"end":199.47},{"de":"Der Mann auf dem Foto ist Innenminister Alexander Dobrindt.","zh":"照片上的男子是内政部长亚历山大·多布林特。","start":199.99,"end":204.43},{"de":"Er hat die Statistik heute präsentiert.","zh":"他今天公布了这项统计。","start":205.03,"end":207.75},{"de":"In der Statistik steht, sehr viele Frauen erleben die Gewalt in ihrem eigenen Zuhause.","zh":"统计显示，很多女性是在自己的家中遭受暴力的。","start":208.51,"end":215.35},{"de":"Es sind sogar Frauen wegen der Gewalt gestorben.","zh":"甚至有女性因暴力而死亡。","start":215.39,"end":220.15},{"de":"Die meisten Täter sind Männer.","zh":"大多数施暴者是男性。","start":220.59,"end":223.11},{"de":"Dazu sagt Innenminister Dobrindt:","zh":"对此内政部长多布林特说：","start":224.11,"end":226.71},{"de":"Hinter jeder Zahl in der Statistik stehen schlimme Erlebnisse und schmerzhafte Erinnerungen.","zh":"统计中的每一个数字背后都是糟糕的经历和痛苦的回忆。","start":226.75,"end":233.75},{"de":"Oft leiden die Frauen sehr lange wegen der Gewalt.","zh":"女性常常因暴力而长期受苦。","start":234.43,"end":237.71},{"de":"Viele Politiker wollen Frauen in Deutschland besser schützen.","zh":"许多政治家想更好地保护德国的女性。","start":237.75,"end":242.75},{"de":"Die Parteien von der Regierungskoalition möchten z.B. härtere Strafen bei Gewalt gegen Frauen.","zh":"执政联盟的各党派希望，例如对针对女性的暴力施以更严厉的刑罚。","start":243.27,"end":251.23},{"de":"Und nun zur nächsten Nachricht:","zh":"现在来看下一条新闻：","start":253.71,"end":255.91},{"de":"Der Emmy ist eine Auszeichnung für besonders gutes Programm im Fernsehen.","zh":"艾美奖是表彰特别优秀电视节目的奖项。","start":260.51,"end":267.15},{"de":"Diese Auszeichnung hat jetzt ein Film aus Deutschland bekommen.","zh":"现在一部来自德国的电影获得了这个奖项。","start":267.23,"end":271.99},{"de":"Der Film heißt: Der talentierte Mr. F.","zh":"电影名叫：《天才的F先生》。","start":272.31,"end":276.95},{"de":"Es ist eine Dokumentation.","zh":"这是一部纪录片。","start":276.99,"end":280.23},{"de":"D.h. die Geschichte ist echt und nicht ausgedacht.","zh":"也就是说，故事是真实的，不是虚构的。","start":280.63,"end":285.43},{"de":"In der Dokumentation geht es um zwei Studenten aus Deutschland.","zh":"这部纪录片讲的是两名德国大学生的事。","start":286.03,"end":291.15},{"de":"Sie haben einen Animationsfilm gemacht.","zh":"他们制作了一部动画电影。","start":291.83,"end":294.95},{"de":"D.h. der Film wurde am Computer gemacht.","zh":"也就是说，这部电影是在电脑上制作的。","start":294.99,"end":299.23},{"de":"Dazu kommt jetzt ein Film.","zh":"接下来播放一段影片。","start":299.71,"end":302.19},{"de":"Dieser Roboter hilft im Haushalt.","zh":"这个机器人帮忙做家务。","start":303.31,"end":306.47},{"de":"Aber der Roboter macht manchmal Fehler.","zh":"但机器人有时会犯错。","start":306.83,"end":309.95},{"de":"Der Film mit dem Roboter ist von diesen beiden Studenten.","zh":"这个关于机器人的电影就是这两位大学生做的。","start":310.35,"end":314.43},{"de":"Aber der Amerikaner Sam hat ihre Idee geklaut.","zh":"但美国人山姆窃取了他们的创意。","start":314.51,"end":318.79},{"de":"Und gewinnt damit Auszeichnungen in den USA.","zh":"并借此在美国获奖。","start":318.95,"end":322.51},{"de":"Die Studenten aus Deutschland suchen Sam und wollen eine Entschuldigung.","zh":"这两名德国大学生寻找山姆，想要一个道歉。","start":322.55,"end":328.83},{"de":"Einer der Studenten sagt, das war der wichtigste Moment in der Dokumentation.","zh":"其中一名学生说，那是纪录片中最重要的时刻。","start":329.31,"end":334.83},{"de":"Wie reagiert Sam?","zh":"山姆会作何反应？","start":334.95,"end":336.51},{"de":"Das wussten wir ja nicht.","zh":"我们当时也不知道。","start":337.07,"end":338.87},{"de":"Sam reagiert ganz anders als erwartet.","zh":"山姆的反应和预想的完全不同。","start":339.23,"end":342.67},{"de":"Und das macht die Dokumentation spannend.","zh":"这让纪录片很精彩。","start":343.19,"end":346.27},{"de":"Die Verleihung von dem Emmy in New York.","zh":"在纽约举行的艾美奖颁奖典礼。","start":346.31,"end":349.75},{"de":"Diese Frau verkündet den Gewinner.","zh":"这位女士宣布获奖者。","start":349.95,"end":352.55},{"de":"Es ist der talentierte Mr. F.","zh":"获奖的是《天才的F先生》。","start":352.91,"end":356.11},{"de":"Die Macher von der Dokumentation sind glücklich.","zh":"纪录片的制作者们很开心。","start":356.55,"end":360.31},{"de":"Die ganze Dokumentation gibt es in der ARD-Mediathek.","zh":"整部纪录片可以在ARD媒体库中观看。","start":362.11,"end":366.87},{"de":"Und nun zur nächsten Nachricht:","zh":"现在来看下一条新闻：","start":366.91,"end":370.43},{"de":"Gerade ist wieder Vollmond.","zh":"现在又是满月了。","start":375.23,"end":377.87},{"de":"D.h. der Mond ist ganz rund zu sehen.","zh":"也就是说，月亮看起来是完整的圆形。","start":378.23,"end":381.87},{"de":"Dieser Vollmond ist aber auch etwas Besonderes.","zh":"但这次满月也有些特别。","start":382.51,"end":386.03},{"de":"Der Mond sieht nämlich besonders groß aus.","zh":"因为月亮看起来特别大。","start":386.31,"end":389.83},{"de":"So wie auf dem Foto.","zh":"就像照片上这样。","start":389.87,"end":391.83},{"de":"Der Mond kreist um die Erde.","zh":"月亮绕着地球转。","start":392.75,"end":395.19},{"de":"Mal ist der Mond weiter entfernt und mal näher an der Erde.","zh":"月亮有时离地球远一些，有时近一些。","start":395.51,"end":399.67},{"de":"Wenn der Mond nah an der Erde ist, dann wirkt der Mond besonders groß.","zh":"当月亮靠近地球时，它看起来就特别大。","start":400.27,"end":405.19},{"de":"Wenn außerdem Vollmond ist, dann wird der nahe große Vollmond Supermond genannt.","zh":"如果同时又是满月，那么这个又近又大的满月就被称为超级月亮。","start":405.43,"end":413.19},{"de":"Und das waren unsere Nachrichten:","zh":"以上就是我们的新闻：","start":413.23,"end":417.59},{"de":"Und jetzt kommt das Wetter.","zh":"现在来看天气。","start":434.75,"end":437.07},{"de":"Es gibt Wolken oder Nebel oder Sonne.","zh":"有的地方有云、雾或阳光。","start":438.11,"end":441.59},{"de":"In der Mitte mehr Sonne.","zh":"中部地区阳光更多。","start":441.79,"end":443.39},{"de":"An der Ostsee oben rechts gibt es etwas Schneeregen.","zh":"右上方的波罗的海沿岸有雨夹雪。","start":443.43,"end":447.31},{"de":"Unten links im Südwesten regnet es an manchen Orten.","zh":"左下方西南部一些地方有雨。","start":447.67,"end":451.75},{"de":"Es werden minus drei bis plus fünf Grad.","zh":"气温为零下三度到零上五度。","start":452.03,"end":455.75},{"de":"Das war die tagesschau in Einfacher Sprache.","zh":"以上就是简单语言版每日新闻。","start":457.83,"end":460.91},{"de":"Tschüss, bis zum nächsten Mal.","zh":"再见，下次见。","start":461.47,"end":464.11}],"stories":[{"title":"Begrüßung","title_zh":"欢迎","from":0,"to":2,"vocab":[],"grammar":[],"background":""},{"title":"Bundestag: Diskussion über Geld","title_zh":"联邦议院：关于预算的讨论","from":3,"to":31,"vocab":[{"key":"ausgeben","lemma":"ausgeben","pos":"Verb","zh":"支出，花费","example_de":"Wie viel Geld kann die Bundesregierung im kommenden Jahr ausgeben und wofür?","example_zh":"联邦政府明年可以花多少钱？用来做什么？"},{"key":"schulden","lemma":"die Schulden (Plural)","pos":"Substantiv","zh":"债务","example_de":"Die Bundesregierung will auch sehr viele Schulden machen.","example_zh":"联邦政府还想大量举债。"},{"key":"diskussion","lemma":"die Diskussion, -en","pos":"Substantiv","zh":"讨论","example_de":"Deshalb gibt es im Parlament eine heftige Diskussion.","example_zh":"因此议会中发生了激烈的讨论。"},{"key":"steuern","lemma":"die Steuern (Plural)","pos":"Substantiv","zh":"税收","example_de":"Denn die Steuern auf Strom sollen sinken.","example_zh":"因为电的税收要降低了。"},{"key":"ausgaben","lemma":"die Ausgaben (Plural)","pos":"Substantiv","zh":"支出","example_de":"Das Parlament hatte sich schon auf alle Ausgaben geeinigt.","example_zh":"议会本来已经就所有支出达成了共识。"}],"grammar":[{"title":"wollen + 动词不定式","summary":"„wollen“表示想要做某事，后接动词不定式，如 „Die Bundesregierung will so viel Geld ausgeben“（政府想花这么多钱）。","example_de":"Die Bundesregierung will so viel Geld ausgeben wie noch nie.","example_zh":"联邦政府想花的钱比以往任何时候都多。"}],"background":""},{"title":"Statistik: Wieder mehr Gewalt gegen Frauen","title_zh":"统计：针对女性的暴力再次增多","from":32,"to":44,"vocab":[{"key":"gewalt","lemma":"die Gewalt","pos":"Substantiv","zh":"暴力","example_de":"Es gibt wieder mehr Gewalt gegen Frauen in Deutschland.","example_zh":"德国针对女性的暴力又增多了。"},{"key":"statistik","lemma":"die Statistik, -en","pos":"Substantiv","zh":"统计","example_de":"Das steht in einer neuen Statistik.","example_zh":"这是一项新统计的结果。"},{"key":"eri
