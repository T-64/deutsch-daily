<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Deutsch Daily — 2026-08-20</title>
<style>
  :root {
    --bg: #eef2f0;
    --surface: #ffffff;
    --surface-2: #f7f9f8;
    --ink: #172127;
    --ink-soft: #647077;
    --line: #dce4e1;
    --accent: #176b72;
    --accent-strong: #0d5057;
    --accent-soft: #dceeed;
    --warm: #d98f39;
    --warm-soft: #fff0d9;
    --zh: #5f696f;
    --danger: #b3493f;
    --shadow: 0 18px 50px rgba(20, 46, 47, .10);
    --shadow-soft: 0 8px 24px rgba(20, 46, 47, .07);
  }
  [data-theme="dark"] {
    --bg: #111719; --surface: #192124; --surface-2: #202a2d;
    --ink: #edf3f1; --ink-soft: #a9b7b8; --line: #344145;
    --accent: #75cbd0; --accent-strong: #99dfe2; --accent-soft: #223e40;
    --warm: #f0b35e; --warm-soft: #3b3022; --zh: #bac5c5;
    --shadow: 0 18px 50px rgba(0,0,0,.28); --shadow-soft: 0 8px 24px rgba(0,0,0,.22);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { scroll-behavior: smooth; scroll-padding-top: 90px; }
  body {
    min-height: 100vh; background: var(--bg); color: var(--ink);
    font: 16px/1.65 Inter, ui-sans-serif, system-ui, -apple-system, "Noto Sans SC", sans-serif;
    transition: background .2s, color .2s;
  }
  button, input, textarea { font: inherit; }
  button, a { -webkit-tap-highlight-color: transparent; }
  button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible {
    outline: 3px solid color-mix(in srgb, var(--accent) 35%, transparent); outline-offset: 2px;
  }
  .app { width: min(1280px, calc(100% - 48px)); margin: 0 auto; padding: 24px 0 100px; }
  .topbar {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    min-height: 42px; margin-bottom: 34px;
  }
  .brand {
    display: inline-flex; align-items: center; gap: 10px; color: var(--ink);
    font-weight: 800; letter-spacing: -.02em; text-decoration: none;
  }
  .brand-mark {
    display: grid; place-items: center; width: 30px; height: 30px; border-radius: 9px;
    background: var(--accent); color: #fff; font: 800 12px/1 ui-monospace, monospace;
  }
  .top-actions { display: flex; align-items: center; gap: 8px; }
  .icon-btn, .archive-link, .text-btn {
    min-height: 38px; border: 1px solid var(--line); border-radius: 12px;
    background: var(--surface); color: var(--ink-soft); cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; text-decoration: none;
  }
  .icon-btn { width: 38px; }
  .archive-link, .text-btn { gap: 7px; padding: 0 13px; font-size: 13px; font-weight: 700; }
  .hero { margin-bottom: 26px; }
  .eyebrow {
    color: var(--accent); font-size: 12px; font-weight: 800; letter-spacing: .12em;
    text-transform: uppercase; margin-bottom: 9px;
  }
  .hero h1 {
    max-width: 720px; font: 750 clamp(29px, 4vw, 50px)/1.08 ui-serif, Georgia, serif;
    letter-spacing: -.04em;
  }
  .hero-meta { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 13px; color: var(--ink-soft); font-size: 14px; }
  .hero-meta span { display: inline-flex; align-items: center; gap: 7px; }

  .study-grid { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: clamp(20px, 3.2vw, 48px); align-items: start; }
  .side {
    position: sticky; top: 16px; max-height: calc(100vh - 24px);
    display: flex; flex-direction: column; min-height: 0;
  }
  .study-panel {
    display: flex; flex-direction: column; gap: 16px; min-height: 0; max-height: calc(100vh - 24px);
    background: transparent; border: 0; box-shadow: none; overflow: visible;
  }
  .video-card {
    position: relative; flex: 0 0 auto; overflow: hidden; background: #071012;
    border-radius: 24px; box-shadow: var(--shadow-soft);
  }
  .player { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #071012; }
  .player iframe, .player video { position: absolute; inset: 0; display: block; width: 100%; height: 100%; border: 0; background: #071012; }
  .video-drag {
    display: none; position: absolute; z-index: 3; top: 0; left: 0; right: 36px; height: 32px;
    cursor: grab; touch-action: none;
    background: linear-gradient(to bottom, rgba(0,0,0,.5), transparent);
  }
  .video-drag:active { cursor: grabbing; }
  .video-float-close {
    display: none; border: 0; background: rgba(255,255,255,.14); color: #fff;
    width: 28px; height: 28px; border-radius: 50%; cursor: pointer;
  }
  .rail {
    display: flex; flex-direction: column; flex: 1; min-height: 0;
    padding: 18px 18px 16px; border: 1px solid var(--line); border-radius: 24px;
    background: var(--surface); box-shadow: var(--shadow-soft); overflow: hidden;
  }
  .rail-bar { padding: 0 0 12px; }
  .controls { display: flex; width: 100%; }
  .controls button {
    flex: 1; min-height: 40px; padding: 0 14px; border: 1px solid var(--line); border-radius: 12px;
    background: var(--surface-2); color: var(--ink-soft); cursor: pointer; font-size: 14px; font-weight: 750;
  }
  .controls button.on { border-color: var(--accent); background: var(--accent); color: #fff; }
  .hero-meta a { color: var(--accent); text-decoration: none; font-weight: 700; }
  .hero-meta a:hover { text-decoration: underline; }
  .topic-nav { flex: 1; min-height: 0; overflow-y: auto; padding: 0; scrollbar-gutter: stable; }
  .topic { border-top: 1px solid var(--line); }
  .topic:first-child { border-top: 0; }
  .topic > a {
    display: grid; grid-template-columns: 32px minmax(0,1fr); gap: 10px; align-items: start;
    padding: 11px 0; color: var(--ink); text-decoration: none;
  }
  .topic > a span {
    min-width: 0; padding-top: 5px;
    font: 650 15px/1.35 ui-serif, Georgia, serif; letter-spacing: -.015em;
  }
  .topic > a:hover span { color: var(--accent); }
  .topic b {
    display: grid; place-items: center; width: 32px; height: 32px; border-radius: 10px;
    background: var(--accent-soft); color: var(--accent-strong);
    font: 800 11px/1 ui-monospace, monospace;
  }
  .topic.on b { background: var(--accent); color: #fff; }
  .topic.on > a span { color: var(--accent-strong); }
  .topic-study { display: none; padding: 0 0 12px; }
  .topic.on .topic-study { display: block; }
  .topic-study .empty-study { color: var(--ink-soft); font-size: 13px; padding: 6px 0; }
  .study-tabs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-top: 2px; }
  .study-tabs.n2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .study-tabs.n1 { grid-template-columns: 1fr; }
  .stab {
    min-height: 32px; padding: 0 6px; border: 1px solid var(--line); border-radius: 11px;
    background: var(--surface-2); color: var(--ink-soft); cursor: pointer;
    font-size: 12px; font-weight: 750;
  }
  .stab:hover { border-color: var(--accent); color: var(--accent-strong); }
  .stab.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-strong); }
  .spane { display: none; margin-top: 6px; }
  .spane.on { display: block; }
  .vrow {
    display: grid; grid-template-columns: minmax(0,1fr) 28px; gap: 8px; align-items: start;
    padding: 10px 0; border-top: 1px dashed var(--line);
  }
  .vrow .vw { color: var(--ink); font: 750 14.5px/1.35 ui-serif, Georgia, serif; }
  .vrow .vz { margin-top: 4px; color: var(--accent-strong); font-size: 13.5px; }
  .vrow .vex { margin-top: 6px; color: var(--ink-soft); font-size: 13px; font-style: italic; }
  .vadd {
    width: 28px; height: 28px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--surface); color: var(--accent-strong); cursor: pointer;
    font: 700 18px/1 ui-sans-serif, system-ui;
  }
  .vadd:hover { border-color: var(--accent); background: var(--accent-soft); }
  .rail-note { margin: 0; padding: 10px 0; color: var(--ink-soft); font-size: 13.5px; line-height: 1.7; }
  .rail-note + .rail-note { border-top: 1px dashed var(--line); }
  .rail-note strong { display: block; margin-bottom: 4px; color: var(--ink); font: 750 14.5px/1.35 ui-serif, Georgia, serif; }
  .rail-note i { display: block; margin-bottom: 6px; }
  @media (min-width: 841px) { .article-extras { display: none; } }

  .reader { min-width: 0; }
  .legend { color: var(--ink-soft); }
  article {
    scroll-margin-top: 24px; margin-bottom: 22px; padding: clamp(22px, 4vw, 38px);
    border: 1px solid var(--line); border-radius: 24px; background: var(--surface);
    box-shadow: var(--shadow-soft);
  }
  .n-head { display: grid; grid-template-columns: 42px minmax(0,1fr); gap: 13px; align-items: start; margin-bottom: 24px; }
  .n-idx {
    display: grid; place-items: center; width: 42px; height: 42px; border-radius: 13px;
    background: var(--accent-soft); color: var(--accent-strong); font: 800 13px/1 ui-monospace, monospace;
  }
  .n-head h2, .h-zh {
    padding-top: 3px;
    color: var(--ink);
    font: 750 clamp(21px, 3vw, 28px)/1.25 ui-serif, Georgia, "Noto Serif CJK SC", "Noto Serif SC", serif;
    letter-spacing: -.025em;
  }
  .h-zh { margin-top: 6px; padding-top: 0; }
  .para { margin-bottom: 22px; }
  .para:last-child { margin-bottom: 8px; }
  .sent { margin-bottom: 10px; }
  .sent:last-child { margin-bottom: 0; }
  .de {
    font: var(--reader-size, 18.5px)/1.82 ui-serif, Georgia, "Noto Serif", serif;
    letter-spacing: .003em;
  }
  .de w {
    cursor: pointer; border-radius: 4px; transition: background .12s, color .12s;
    text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px;
    text-decoration-color: transparent;
  }
  .de w:hover, .de w:active { background: var(--warm-soft); text-decoration-color: var(--warm); }
  .de w.known { text-decoration-color: color-mix(in srgb, var(--accent) 55%, transparent); }
  .de w.ed { text-decoration-style: solid; text-decoration-thickness: 1.5px; }
  .de w.wiki { text-decoration-style: dotted; text-decoration-color: color-mix(in srgb, var(--ink-soft) 55%, transparent); }
  .de w.saved { color: var(--accent-strong); background: var(--accent-soft); text-decoration-color: transparent; }
  .para { display: grid; grid-template-columns: 52px minmax(0,1fr); gap: 10px; align-items: start; }
  .seek {
    margin-top: 4px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--surface-2); color: var(--accent-strong);
    padding: 4px 0; font: 750 11px/1 ui-monospace, monospace; cursor: pointer;
  }
  .seek:disabled { opacity: .35; cursor: default; }
  .para.now {
    padding: 6px 8px 6px 2px;
    background: color-mix(in srgb, var(--accent-soft) 55%, transparent);
    border-radius: 10px;
  }
  .zh {
    margin-top: 2px; color: var(--ink);
    font: 400 16px/1.7 Inter, ui-sans-serif, "Noto Sans SC", sans-serif;
  }
  body.hide-zh .zh { display: none; }
  .n-head .h-zh {
    margin-top: 6px;
    padding-top: 0;
    color: var(--ink);
    font: 750 clamp(21px, 3vw, 28px)/1.25 ui-serif, Georgia, "Noto Serif CJK SC", "Noto Serif SC", serif;
    letter-spacing: -.025em;
  }
  .article-extras details { margin-top: 10px; border: 1px solid var(--line); border-radius: 13px; background: var(--surface-2); }
  .article-extras details summary {
    list-style: none; cursor: pointer; padding: 12px 14px; color: var(--ink-soft);
    display: flex; align-items: center; gap: 9px; font-size: 13px; font-weight: 750;
  }
  .article-extras details summary::before {
    content: "+"; display: inline-grid; place-items: center; width: 20px; height: 20px;
    border-radius: 7px; background: var(--surface); color: var(--accent); font-size: 14px;
  }
  .article-extras details[open] summary::before { content: "−"; }
  .article-extras details summary::-webkit-details-marker { display: none; }
  .article-extras details .body { padding: 2px 14px 15px 43px; color: var(--ink-soft); font-size: 13.5px; line-height: 1.75; }
  .article-extras details .body strong { color: var(--ink); }
  .vcard { display: grid; grid-template-columns: minmax(0,1fr) 28px; gap: 8px; align-items: start; padding: 10px 0; border-bottom: 1px dashed var(--line); }
  .vcard:last-child { border-bottom: 0; }
  .gcard { padding: 12px 0; border-bottom: 1px dashed var(--line); }
  .gcard:last-child { border-bottom: 0; }
  .vcard-top, .gcard h4 { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px; font: 750 14.5px/1.35 ui-serif, Georgia, serif; color: var(--ink); }
  .article-extras .vadd {
    width: 28px; height: 28px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--surface); color: var(--accent-strong); cursor: pointer;
    font: 700 18px/1 ui-sans-serif, system-ui;
  }
  .vpos { color: var(--ink-soft); font: 750 11px/1.2 ui-sans-serif, system-ui; letter-spacing: .06em; text-transform: uppercase; }
  .vzh { margin-top: 4px; color: var(--accent-strong); font-size: 13.5px; }
  .vex, .gex { margin-top: 6px; color: var(--ink-soft); font-size: 13px; font-style: italic; }
  .gexzh { color: var(--zh); font-size: 12.5px; }
  .gmore { margin-top: 8px; color: var(--ink-soft); font-size: 13px; }
  .bg-note { margin: 0 0 8px; color: var(--ink-soft); font-size: 12px; }

  .scrim { position: fixed; inset: 0; z-index: 55; display: none; background: rgba(7,16,18,.48); backdrop-filter: blur(3px); }
  .scrim.on { display: block; }
  #pop {
    position: fixed; z-index: 70; display: none; width: min(360px, calc(100vw - 24px));
    border: 1px solid var(--line); border-radius: 18px; padding: 18px;
    background: var(--surface); color: var(--ink); box-shadow: var(--shadow);
  }
  #pop.open { display: block; }
  .pop-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  #pop .pw { font: 750 21px/1.2 ui-serif, Georgia, serif; word-break: break-word; }
  #pop .pp { margin-top: 3px; color: var(--ink-soft); font-size: 11px; font-weight: 750; letter-spacing: .08em; text-transform: uppercase; }
  #pop .pclose { border: 0; background: var(--surface-2); color: var(--ink-soft); width: 30px; height: 30px; border-radius: 9px; cursor: pointer; }
  #pop .pz { margin-top: 12px; color: var(--accent-strong); font-weight: 700; }
  #pop .pz:empty::after { content: "还没有释义，你可以自己补充"; color: var(--ink-soft); font-weight: 400; }
  #pop .pe { margin-top: 9px; padding-top: 9px; border-top: 1px solid var(--line); color: var(--ink-soft); font-size: 12.5px; font-style: italic; }
  .pop-actions { display: flex; gap: 8px; margin-top: 14px; }
  .pbtn, .secondary-btn, .primary-btn {
    min-height: 40px; border-radius: 11px; padding: 0 13px; cursor: pointer; font-size: 13px; font-weight: 750;
  }
  .pbtn { flex: 1; border: 1px solid var(--accent); background: var(--accent); color: #fff; }
  .pbtn.in { border-color: var(--line); background: var(--surface-2); color: var(--ink-soft); }
  .secondary-btn { border: 1px solid var(--line); background: var(--surface); color: var(--ink-soft); }
  .primary-btn { border: 1px solid var(--accent); background: var(--accent); color: #fff; }
  .word-form { display: grid; gap: 11px; }
  .word-form label { display: grid; gap: 5px; color: var(--ink-soft); font-size: 12px; font-weight: 700; }
  .word-form input, .word-form textarea {
    width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px;
    background: var(--surface-2); color: var(--ink); resize: vertical;
  }
  .word-form textarea { min-height: 66px; }
  .form-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 3px; }

  #basket-btn {
    position: fixed; right: 22px; bottom: max(22px, env(safe-area-inset-bottom)); z-index: 45;
    display: inline-flex; align-items: center; gap: 9px; min-height: 48px; padding: 0 18px;
    border: 0; border-radius: 15px; background: var(--ink); color: var(--surface);
    box-shadow: var(--shadow); cursor: pointer; font-weight: 800;
  }
  #basket-btn .cnt { min-width: 23px; padding: 2px 7px; border-radius: 99px; background: var(--warm); color: #172127; font-size: 12px; }
  #basket {
    position: fixed; inset: 0 0 0 auto; z-index: 65; width: min(440px, 100vw);
    display: flex; flex-direction: column; padding: 24px 24px calc(24px + env(safe-area-inset-bottom));
    background: var(--surface); box-shadow: -20px 0 60px rgba(7,16,18,.18);
    transform: translateX(105%); transition: transform .22s ease;
  }
  #basket.open { transform: translateX(0); }
  #basket .bhead { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 16px; }
  #basket .bhead h3 { font-size: 22px; letter-spacing: -.02em; }
  #basket .bhead p { margin-top: 2px; color: var(--ink-soft); font-size: 12.5px; }
  #basket .bclose { border: 0; background: var(--surface-2); color: var(--ink-soft); width: 36px; height: 36px; border-radius: 11px; font-size: 20px; cursor: pointer; }
  .basket-add { width: 100%; margin-bottom: 12px; }
  #basket .blist { overflow-y: auto; flex: 1; padding-right: 4px; }
  .bitem { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 5px 10px; padding: 13px 0; border-bottom: 1px solid var(--line); }
  .bitem .bw { font: 750 16px/1.3 ui-serif, Georgia, serif; }
  .bitem .bz { grid-column: 1; color: var(--accent-strong); font-size: 13px; }
  .bitem .be { grid-column: 1; overflow: hidden; color: var(--ink-soft); font-size: 11.5px; text-overflow: ellipsis; white-space: nowrap; }
  .bitem-actions { grid-column: 2; grid-row: 1 / span 3; align-self: center; display: flex; gap: 3px; }
  .bitem-actions button { border: 0; background: transparent; color: var(--ink-soft); padding: 7px; cursor: pointer; font-size: 12px; }
  .bitem-actions .bx { color: var(--danger); }
  #basket .bfoot { display: flex; gap: 8px; margin-top: 14px; }
  #basket .bfoot button { flex: 1; }
  #basket .bfoot button:disabled { opacity: .5; cursor: wait; }
  #basket .bstatus { min-height: 18px; margin-top: 8px; color: var(--ink-soft); text-align: center; font-size: 12px; }
  .bempty { padding: 42px 14px; color: var(--ink-soft); text-align: center; font-size: 13px; }
  .bempty b { display: block; margin-bottom: 5px; color: var(--ink); font-size: 15px; }
  #word-editor {
    display: none; padding: 15px; margin-bottom: 12px; border: 1px solid var(--line);
    border-radius: 14px; background: var(--surface-2);
  }
  #word-editor.open { display: block; }
  #toast {
    position: fixed; left: 50%; bottom: 28px; z-index: 90; display: none;
    transform: translateX(-50%); padding: 10px 16px; border-radius: 12px;
    background: var(--ink); color: var(--surface); box-shadow: var(--shadow); font-size: 13px; font-weight: 700;
  }
  @media (max-width: 840px) {
    .app { width: min(100% - 28px, 720px); padding-top: 15px; padding-left: max(14px, env(safe-area-inset-left)); padding-right: max(14px, env(safe-area-inset-right)); }
    .topbar { margin-bottom: 24px; }
    .study-grid { display: block; }
    .side { position: static; max-height: none; margin-bottom: 18px; }
    .study-panel { display: contents; max-height: none; }
    .video-card { border-radius: 20px; box-shadow: var(--shadow); }
    .rail {
      position: sticky; top: env(safe-area-inset-top); z-index: 30; margin: 10px 0 18px; padding: 8px 12px;
      border-radius: 20px;
    }
    .rail-bar { padding: 0; }
    .topic-nav { display: none; }
    .video-card.floating {
      position: fixed; z-index: 48; top: 72px; right: 10px; left: auto; width: min(48vw, 210px);
      border: 1px solid rgba(255,255,255,.2); border-radius: 14px; box-shadow: 0 18px 45px rgba(0,0,0,.28);
    }
    .video-card.floating .video-drag { display: block; }
    .video-card.floating .video-float-close { display: block; position: absolute; z-index: 4; top: 6px; right: 6px; }
    .video-card.float-off { display: none; }
    article { border-radius: 20px; }
  }
  @media (max-width: 560px) {
    .app { width: 100%; padding: 12px 12px 88px; padding-left: max(12px, env(safe-area-inset-left)); padding-right: max(12px, env(safe-area-inset-right)); }
    .brand span:last-child { display: none; }
    .text-btn { padding: 0 10px; font-size: 12px; }
    .archive-link { width: 38px; padding: 0; font-size: 0; }
    .archive-link svg { width: 17px; }
    .hero { padding: 0 5px; margin-bottom: 18px; }
    .hero h1 { font-size: 30px; }
    .hero-meta { gap: 5px 14px; font-size: 12.5px; }
    .video-card { border-radius: 18px; }
    .video-card.floating { width: min(56vw, 220px); }
    .controls { gap: 5px; }
    .controls button { min-height: 38px; font-size: 13px; }
    article { padding: 20px 17px; margin-bottom: 13px; border-radius: 18px; }
    .n-head { grid-template-columns: 34px minmax(0,1fr); gap: 10px; margin-bottom: 19px; }
    .n-idx { width: 34px; height: 34px; border-radius: 10px; font-size: 11px; }
    .n-head h2, .h-zh { padding-top: 1px; font-size: 21px; }
    .h-zh { font-size: 21px; }

<script>
const DATA = {"date": "2026-08-20", "slug": "2026-08-20-20uhr", "source": "20uhr", "source_label": "T-64 · tagesschau 20:00 Uhr", "source_short": "20:00 Uhr", "video_page": "https://www.tagesschau.de/tagesschau_20_uhr/video-1634820.html", "embed_url": "https://www.tagesschau.de/tagesschau_20_uhr/video-1634820~player.html", "mp4_url": "https://tagesschau-progressive.ard-mcdn.de/video/2026/0820/TV-20260820-2023-5900.webl.h264.mp4", "duration": 1015.4, "news": [{"title": "Deutsche Gasspeicher nur halb voll", "title_zh": "德国天然气储备仅半满", "paras": [{"start": 4.48, "end": 51.6, "lines": [{"de": "Der Winter scheint zwar noch weit weg, doch Verbraucherschützer warnen: Die deutschen Gasspeicher sind nur halbvoll.", "zh": "冬天看起来还很遥远，但消费者保护组织警告说：德国的天然气储备只装了一半。"}, {"de": "Das liegt vor allem am Iran-Krieg.", "zh": "这主要是伊朗战争造成的。"}, {"de": "Denn durch die Sperrung der Straße von Hormus ist Gas so teuer geworden, dass die Händler es nicht auf Vorrat kaufen wollen.", "zh": "由于霍尔木兹海峡被封锁，天然气变得如此昂贵，以至于贸易商不愿囤货。"}, {"de": "Deshalb sind die Speicher aktuell nur zu 50,1 Prozent gefüllt.", "zh": "因此目前储气库填充率只有 50.1%。"}, {"de": "Vor einem Jahr waren es Mitte August schon 67,1 Prozent, also zwei Drittel.", "zh": "一年前的八月中旬已经有 67.1%，也就是三分之二。"}, {"de": "Vorgeschrieben sind für Anfang November 80 Prozent.", "zh": "按规定，十一月初必须达到 80%。但要实现这一点，现在就得大幅加大注气量。"}]}, {"start": 51.72, "end": 111.2, "lines": [{"de": "Dazu müsste jetzt aber deutlich mehr eingespeichert werden.", "zh": "在巴伐利亚基姆湖畔储气站的机房里，眼下运转得不多。"}, {"de": "Im Maschinenraum des Gasspeichers am Chiemsee in Bayern läuft wenig.", "zh": "这里有足够的空间，可以供应约一百万个家庭大约一年。"}, {"de": "Platz wäre hier, um eine Million Haushalte etwa ein Jahr lang zu versorgen.", "zh": "但今天没有气进来——太贵了。"}, {"de": "Aber heute kommt nichts an, zu teuer.", "zh": "因为目前的价格形势让天然气贸易商几乎没有什么动力把气注入储库。"}, {"de": "Weil aktuell die Preise so sind, dass es für die Gashändler wenig Anreize gibt, Gas in die Speicher einzuspeichern.", "zh": "由于伊朗冲突持续，天然气在过去几个月里明显涨价。"}, {"de": "Gas ist wegen des andauernden Iran-Konflikts in den vergangenen Monaten deutlich teurer geworden.", "zh": "基姆湖储气库的填充率只有 12% 出头。"}, {"de": "Der Füllstand am Chiemsee liegt bei gut zwölf Prozent.", "zh": "十一月初，德国所有储气库都必须达到 80%，联邦网络局负责监督此事。"}, {"de": "Anfang November muss er in allen deutschen Gasspeichern bei 80 Prozent liegen.", "zh": "「我会说，我们处于担忧与从容之间，因为现在还是八月中下旬。"}, {"de": "Darüber wacht die Bundesnetzagentur.", "zh": "也就是说，接下来几周还可以大力注气。"}, {"de": "Ich würde sagen, wir liegen zwischen Sorge und Entspannung, weil wir Mitte, Ende August haben.", "zh": "基础设施是有的，天然气也有。"}, {"de": "Das heißt, man kann die nächsten Wochen noch kräftig einspeichern.", "zh": "贸易商现在必须完成他们的任务。"}, {"de": "Die Infrastruktur dafür gibt es, das Gas ist verfügbar. Die Gashändler müssen jetzt ihre Aufgabe erfüllen.", "zh": "」"}]}, {"start": 117.52, "end": 120.84, "lines": [{"de": "Das Bundeswirtschaftsministerium beobachte die Lage genau, teilt das Haus von Ministerin Reiche mit.", "zh": "联邦经济部表示正在密切关注局势，这是经济部长里歇（Reiche）的部门通报的。"}, {"de": "Eingreifen wolle sie vorerst nicht, solange sich die Lage nicht verschärft.", "zh": "只要局势不恶化，她暂不打算干预。"}, {"de": "Durch Pipelines und die vier Flüssiggas-Terminals an Nord- und Ostsee könne flexibel Gas ins Land kommen.", "zh": "通过管道以及北海和波罗的海的四个液化气终端，天然气可以灵活地进入德国。"}, {"de": "Die Kosten fürs warme Wohnzimmer werden steigen. Zumindest für alle Kunden, die keinen langfristigen Vertrag mit einem Gaslieferanten haben.", "zh": "取暖的成本将会上涨——至少对所有没有与供气商签订长期合同的用户是这样。"}, {"de": "Der Rat der Verbraucherzentralen: Prüfen Sie Ihre Verträge, Ihre Tarife. Versuchen Sie noch zu wechseln zu einem Vertrag mit einer Preisbindung über den Winter hinweg.", "zh": "消费者中心的建议是：检查您的合同和资费，尽量换成一份价格在冬季保持锁定的合同。"}, {"de": "Die künftigen Heizpreise hängen davon ab, wie der Iran-Krieg weitergeht. Wirtschaftsministerin Reiche sieht auch beim Gas staatliche Eingriffe eher als letzte Lösung.", "zh": "未来的取暖价格取决于伊朗战争如何发展。"}, {"de": "Das erscheint riskant: Denn verschärft sich der Iran-Konflikt oder kommt im Winter weniger Flüssiggas aus den USA zu uns: Dann könnte sie da sein, die Gasmangellage.", "zh": "经济部长里歇认为，在天然气领域，国家干预同样只是最后手段。"}, {"de": "Und mit ihr höhere Preise, die bei den Verbrauchern hängenbleiben.", "zh": "这看起来有风险：因为如果伊朗冲突升级，或者冬天来自美国的液化气减少，那么天然气紧缺的局面就可能出现，随之而来的是更高的价格，而这些最终都落在消费者头上。"}]}], "vocab": [{"lemma": "der Gasspeicher, -", "key": "gasspeicher", "forms": ["Gasspeicher", "Gasspeichers"], "pos": "Substantiv", "zh": "储气库，天然气储存设施", "example_de": "Der Winter scheint zwar noch weit weg, doch Verbraucherschützer warnen: Die deutschen Gasspeicher sind nur halbvoll.", "example_zh": ""}, {"lemma": "auf Vorrat kaufen", "key": "auf-vorrat-kaufen", "forms": ["auf Vorrat kaufen"], "pos": "Redewendung", "zh": "囤货，储备性购买", "example_de": "Denn durch die Sperrung der Straße von Hormus ist Gas so teuer geworden, dass die Händler es nicht auf Vorrat kaufen wollen.", "example_zh": ""}, {"lemma": "einspeichern", "key": "einspeichern", "forms": ["einzuspeichern", "eingespeichert", "einspeichern"], "pos": "Verb", "zh": "储存，注入（储气库）", "example_de": "Dazu müsste jetzt aber deutlich mehr eingespeichert werden.", "example_zh": ""}, {"lemma": "der Anreiz, -e", "key": "anreiz", "forms": ["Anreize", "Anreiz"], "pos": "Substantiv", "zh": "激励，动力", "example_de": "Weil aktuell die Preise so sind, dass es für die Gashändler wenig Anreize gibt, Gas in die Speicher einzuspeichern.", "example_zh": ""}, {"lemma": "der Füllstand, -stände", "key": "fuellstand", "forms": ["Füllstand"], "pos": "Substantiv", "zh": "填充水位，填充率", "example_de": "Der Füllstand am Chiemsee liegt bei gut zwölf Prozent.", "example_zh": ""}, {"lemma": "die Bundesnetzagentur", "key": "bundesnetzagentur", "forms": ["Bundesnetzagentur"], "pos": "Substantiv", "zh": "联邦网络局（监管能源网络）", "example_de": "Darüber wacht die Bundesnetzagentur.", "example_zh": ""}, {"lemma": "eingreifen", "key": "eingreifen", "forms": ["Eingreifen", "eingreifen"], "pos": "Verb", "zh": "干预，介入", "example_de": "Eingreifen wolle sie vorerst nicht, solange sich die Lage nicht verschärft.", "example_zh": ""}, {"lemma": "die Preisbindung, -en", "key": "preisbindung", "forms": ["Preisbindung"], "pos": "Substantiv", "zh": "价格锁定（合同期内价格不变）", "example_de": "Versuchen Sie noch zu wechseln zu einem Vertrag mit einer Preisbindung über den Winter hinweg.", "example_zh": ""}, {"lemma": "die Mangellage, -n", "key": "mangellage", "forms": ["Gasmangellage", "Mangellage"], "pos": "Substantiv", "zh": "紧缺状况", "example_de": "Das erscheint riskant: Denn verschärft sich der Iran-Konflikt oder kommt im Winter weniger Flüssiggas aus den USA zu uns: Dann könnte sie da sein, die Gasmangellage.", "example_zh": ""}, {"lemma": "hängenbleiben bei + Dat.", "key": "haengenbleiben", "forms": ["hängenbleiben", "hängenbleiben bei"], "pos": "Verb", "zh": "最终落在……身上（负担转嫁）", "example_de": "Und mit ihr höhere Preise, die bei den Verbrauchern hängenbleiben.", "example_zh": ""}], "grammar_points": [{"title": "deshalb / deshalb 占位与 V2", "summary": "deshalb 和 deshalb 是副词性连接词，放第一位时动词仍紧随其后（第二位），句子不用倒装成从句。", "example_de": "Deshalb sind die Speicher aktuell nur zu 50,1 Prozent gefüllt.", "example_zh": "因此目前储气库填充率只有 50.1%。"}, {"title": "Konjunktiv I 间接引语（beobachte / wolle / könne）", "summary": "转述他人说法时新闻德语用第一虚拟式：beobachte、wolle、könne 分别是 beobachten、wollen、können 的 Konjunktiv I，表示消息来自官方而非记者断言。", "example_de": "Das Bundeswirtschaftsministerium beobachte die Lage genau, teilt das Haus von Ministerin Reiche mit.", "example_zh": "里歇部长的部门通报说，联邦经济部正密切关注局势。"}], "background": "德国法律（《能源工业法》）规定储气库每年 11 月 1 日前须达到 80% 填充率，由联邦网络局监管。2022 年能源危机后德国扩建了液化气接收终端。霍尔木兹海峡是全球油气运输咽喉，2026 年伊朗战争中该海峡被封锁推高了全球气价。Chiemsee 储气库是德国最大储气设施之一。"}, {"title": "Vor der Landtagswahl in Sachsen-Anhalt", "title_zh": "萨克森-安哈尔特州选举前夕", "paras": [{"start": 160.16, "end": 205.36, "lines": [{"de": "In gut zwei Wochen wird in Sachsen-Anhalt ein neuer Landtag gewählt.", "zh": "再过两周多，萨克森-安哈尔特州将选举新的州议会。"}, {"de": "Umfragen sehen die AfD deutlich vor der CDU von Ministerpräsident Schulze.", "zh": "民调显示，选择党（AfD）明显领先于州长舒尔茨（Schulze）所在的基民盟（CDU）。"}, {"de": "Der Wahlkampf ist in der entscheidenden Phase und das Ergebnis dürfte sich auch auf die Bundesregierung auswirken.", "zh": "竞选活动已进入决定性阶段，选举结果很可能也会影响到联邦政府。"}, {"de": "Was ist bei euch so das Drängendste?", "zh": "（记者问：你们觉得最紧迫的问题是什么？）"}]}, {"start": 216.12, "end": 271.28, "lines": [{"de": "In Gröningen kämpft die CDU um jede Stimme – und um ihre Zukunft.", "zh": "在格勒宁根，基民盟在为每一张选票而战——也为自己的未来而战。"}, {"de": "In den Umfragen liegt die AfD deutlich vorn.", "zh": "民调中选择党明显领先。"}, {"de": "Einige sehen dafür auch die Bundesregierung in der Verantwortung.", "zh": "有人认为联邦政府对此负有责任。"}, {"de": "Der Gegenwind aus Berlin ist enorm.", "zh": "「来自柏林的逆风非常猛烈。"}, {"de": "Wir haben, als wir hier mit Plakatierungen anfangen durften, sechs Wochen vor der Wahl: Da kam die Nummer mit Spahn hoch und das hilft uns alles nicht.", "zh": "我们刚开始被允许在这里张贴海报的时候，也就是选前六周：斯潘那件事就爆出来了，这些对我们都没有帮助。"}, {"de": "Auch SPD-Chef Klingbeil ist heute in Sachsen-Anhalt.", "zh": "」社民党（SPD）主席克林贝尔（Klingbeil）今天也在萨克森-安哈尔特。"}, {"de": "Für ihn ist der Wahlkampf auch eine Auseinandersetzung mit der Regierungsarbeit.", "zh": "对他来说，这场竞选也是对执政工作的一次检讨。"}, {"de": "Ich will es gar nicht abstreiten.", "zh": "「我不想否认这一点。"}, {"de": "Wir haben wichtige Entscheidungen getroffen, aber auch zu oft gestritten.", "zh": "我们做出了重要决定，但也争吵得太频繁。"}, {"de": "Wir haben auch zu Unmut geführt, das spiegelt sich in Umfragen wider.", "zh": "我们也引发了不满，这反映在民调里。"}, {"de": "Die neue CDU-Generalsekretärin Hoppermann dagegen will von einem Zusammenhang zwischen Land und Bund nichts wissen.", "zh": "」而新任基民盟秘书长霍珀曼（Hoppermann）则拒绝承认州选举与联邦政治之间存在关联。"}, {"de": "Es geht nicht um die Bundes-CDU, es geht um Sachsen-Anhalt.", "zh": "「这不是联邦基民盟的事，这是萨克森-安哈尔特的事。"}, {"de": "Es geht darum, keine extremen Experimente zu machen.", "zh": "关键在于不要进行极端的实验。"}, {"de": "Es braucht Vernunft und Verantwortung.", "zh": "需要的是理性和责任。」"}]}, {"start": 271.36, "end": 317.64, "lines": [{"de": "Die Wahl auf die Besonderheiten Sachsen-Anhalts zu begrenzen, halten Politikwissenschaftler für zu kurz gegriffen: \"Ostdeutsche Verhältnisse kann man nicht vergleichen mit westdeutschen und nicht mit Gesamtdeutschland\": Da ist was dran.", "zh": "政治学者认为，把这场选举局限于萨克森-安哈尔特的特殊性是一种短视：「东德的状况不能和西德比，也不能和德国整体比」——这话有道理。"}, {"de": "Man muss davor warnen, Sachsen-Anhalt abzutun. Und in Kauf zu nehmen, dass es da Ergebnisse gibt, die CDU und SPD nicht passen.", "zh": "必须警惕轻视萨克森-安哈尔特，并接受那里可能出现基民盟和社民党都不愿看到的结果。"}, {"de": "Wie groß der Druck auf die CDU ist, zeigt auch ein Blick in die eigenen Reihen: Der CDU-Bürgermeister hat der AfD 10.000 Euro gespendet und angekündigt, sie zu wählen.", "zh": "基民盟承受的压力有多大，看看本党内部就知道了：一位基民盟籍市长向选择党捐了 1 万欧元，并宣布将投票给它。"}, {"de": "Er wolle damit ein Signal an seine eigene Partei senden: Die CDU müsse endlich aufwachen.", "zh": "他说想借此向自己的政党发出一个信号：基民盟必须终于醒过来了。"}]}], "vocab": [{"lemma": "die Landtagswahl, -en", "key": "landtagswahl", "forms": ["Landtagswahl"], "pos": "Substantiv", "zh": "州议会选举", "example_de": "In gut zwei Wochen wird in Sachsen-Anhalt ein neuer Landtag gewählt.", "example_zh": ""}, {"lemma": "der Wahlkampf, -e", "key": "wahlkampf", "forms": ["Wahlkampf"], "pos": "Substantiv", "zh": "竞选活动", "example_de": "Der Wahlkampf ist in der entscheidenden Phase und das Ergebnis dürfte sich auch auf die Bundesregierung auswirken.", "example_zh": ""}, {"lemma": "sich auswirken auf + Akk.", "key": "sich-auswirken", "forms": ["auswirken", "sich auswirken auf"], "pos": "Verb", "zh": "对……产生影响", "example_de": "Der Wahlkampf ist in der entscheidenden Phase und das Ergebnis dürfte sich auch auf die Bundesregierung auswirken.", "example_zh": ""}, {"lemma": "der Gegenwind", "key": "gegenwind", "forms": ["Gegenwind"], "pos": "Substantiv", "zh": "逆风（比喻阻力、反对）", "example_de": "Der Gegenwind aus Berlin ist enorm.", "example_zh": ""}, {"lemma": "die Plakatierung, -en", "key": "plakatierung", "forms": ["Plakatierungen", "Plakatierung"], "pos": "Substantiv", "zh": "张贴海报（的宣传行动）", "example_de": "Wir haben, als wir hier mit Plakatierungen anfangen durften, sechs Wochen vor der Wahl: Da kam die Nummer mit Spahn hoch und das hilft uns alles nicht.", "example_zh": ""}, {"lemma": "der Unmut", "key": "unmut", "forms": ["Unmut"], "pos": "Substantiv", "zh": "不满，怨气", "example_de": "Wir haben auch zu Unmut geführt, das spiegelt sich in Umfragen wider.", "example_zh": ""}, {"lemma": "sich spiegeln in + Dat.", "key": "sich-spiegeln", "forms": ["spiegelt", "sich spiegeln in"], "pos": "Verb", "zh": "反映在……之中", "example_de": "Wir haben auch zu Unmut geführt, das spiegelt sich in Umfragen wider.", "example_zh": ""}, {"lemma": "zu kurz greifen", "key": "zu-kurz-greifen", "forms": ["zu kurz gegriffen", "zu kurz greifen"], "pos": "Redewendung", "zh": "（看法、解释）过于短视，不够全面", "example_de": "Die Wahl auf die Besonderheiten Sachsen-Anhalts zu begrenzen, halten Politikwissenschaftler für zu kurz gegriffen: \"Ostdeutsche Verhältnisse kann man nicht vergleichen mit westdeutschen und nicht mit Gesamtdeutschland\": Da ist was dran.", "example_zh": ""}, {"lemma": "in Kauf nehmen", "key": "in-kauf-nehmen", "forms": ["in Kauf zu nehmen", "in Kauf nehmen"], "pos": "Redewendung", "zh": "接受（不愉快的后果），容忍", "example_de": "Und in Kauf zu nehmen, dass es da Ergebnisse gibt, die CDU und SPD nicht passen.", "example_zh": ""}, {"lemma": "etwas abtun", "key": "abtun", "forms": ["abzutun", "etwas abtun"], "pos": "Verb", "zh": "轻视，对……不当回事", "example_de": "Man muss davor warnen, Sachsen-Anhalt abzutun.", "example_zh": ""}], "grammar_points": [{"title": "um … zu + 不定式（um jede Stimme kämpfen）", "summary": "um … zu 表示目的：「为……而战/而努力」。主语一致时用 um…zu，不必用 damit 从句。", "example_de": "In Gröningen kämpft die CDU um jede Stimme – und um ihre Zukunft.", "example_zh": "在格勒宁根，基民盟为每一张选票而战——也为自己的未来而战。"}], "background": "萨克森-安哈尔特位于前东德地区。AfD 在多数东部州民调领先传统大党，2025 年联邦选举后已成为东部多州第一势力。「斯潘那件事」指 2026 年夏联邦层面涉及基民盟政治家斯潘的丑闻，在东部选战中拖累 CDU。"}, {"title": "DGB-Ausbildungsreport 2026", "title_zh": "DGB 学徒报告 2026", "paras": [{"start": 321.64, "end": 345.2, "lines": [{"de": "Zeit- und Leistungsdruck, hinzu kommen finanzielle Sorgen: Jeder zweite Auszubildende fühlt sich psychisch belastet.", "zh": "时间压力和绩效压力，再加上经济上的忧虑：每两名学徒中就有一人感到心理压力。"}, {"de": "Zu diesem Ergebnis kommt eine Umfrage des Deutschen Gewerkschaftsbundes unter Tausenden jungen Menschen.", "zh": "这是德国工会联合会（DGB）对数千名年轻人问卷调查得出的结果。"}, {"de": "Im Vergleich zum Vorjahr ging die Zufriedenheit mit der Ausbildung um 5,9 Prozent zurück und sank damit auf ein neues Tief.", "zh": "与上一年相比，对职业培训的满意度下降了 5.9%，跌至新低。"}, {"de": "Der DGB sprach von einem deutlichen Warnsignal.", "zh": "DGB 称这是一个明显的警告信号。"}]}, {"start": 347.2, "end": 350.72, "lines": [{"de": "Rund 1000 Euro brutto monatlich bekommt Darja Grabow im zweiten Jahr ihrer Ausbildung zur Schreinerin.", "zh": "达尔娅·格拉博（Darja Grabow）在博登湖畔的梅尔斯堡做木工学徒，现在是第二年，每月税前约 1000 欧元。"}, {"de": "Hier in Meersburg am Bodensee. Das reiche zum Leben, sagt sie, aber sie müsse gut wirtschaften.", "zh": "她说，这够生活，但必须精打细算。"}, {"de": "Man merkt, wie viele Nebenkosten anstehen bei der Ausbildung.", "zh": "「能感觉到学徒期间有多少杂项开支。"}, {"de": "Und Azubis verdienen nicht ganz so viel, wie man sich das vorstellt.", "zh": "而且学徒挣的并没有想象中那么多。"}, {"de": "Inflation, Wohnungsmangel - der finanzielle Druck auf Azubis wächst.", "zh": "」通货膨胀、住房短缺——学徒身上的经济压力越来越大。"}, {"de": "Das macht sich bei der mentalen Gesundheit bemerkbar, sagt der heute vorgestellte DGB-Ausbildungsreport. 50,6 Prozent der Auszubildenden geben an, psychisch belastet zu sein.", "zh": "今天发布的 DGB 学徒报告指出，这已经影响到心理健康：50.6% 的学徒表示自己心理压力过大。"}, {"de": "Die häufigsten Gründe neben der finanziellen Situation: In Baden-Württemberg könnte der Druck bald weiter steigen.", "zh": "除了经济状况之外，最常见的原因为：在巴登-符腾堡州，压力可能很快进一步加大。"}, {"de": "Das Land überlegt, in einigen Ausbildungsberufen bestimmte Wohnzuschüsse zu streichen.", "zh": "该州正考虑取消某些培训职业的住房补贴。"}, {"de": "Pro Jahr und Azubi bedeutet das bis zu 3000 Euro weniger in der Haushaltskasse.", "zh": "对每个学徒来说，这意味着家庭账本上每年最多少 3000 欧元。"}, {"de": "Dann müsste ich im Supermarkt überlegen, zu welchen Produkten ich greife und wo man Abstriche machen kann.", "zh": "「那样的话，我在超市里就得掂量买哪些东西、哪里得省着点。"}, {"de": "Gerade erst haben sich wieder mehr junge Menschen für eine Ausbildung im Handwerk entschieden.", "zh": "」就在不久前，才有更多年轻人重新选择了手工业培训。"}, {"de": "Noch mehr Druck sei da das falsche Signal, sagen sie hier.", "zh": "这里的人说，此时再加压力是错误的信号。"}]}], "vocab": [{"lemma": "der Auszubildende, -n", "key": "auszubildende", "forms": ["Auszubildende", "Auszubildenden"], "pos": "Substantiv", "zh": "学徒，受训学员（缩写 Azubi）", "example_de": "Zeit- und Leistungsdruck, hinzu kommen finanzielle Sorgen: Jeder zweite Auszubildende fühlt sich psychisch belastet.", "example_zh": ""}, {"lemma": "psychisch belastet", "key": "psychisch-belastet", "forms": ["psychisch belastet"], "pos": "Adjektiv", "zh": "心理负担重的", "example_de": "Zeit- und Leistungsdruck, hinzu kommen finanzielle Sorgen: Jeder zweite Auszubildende fühlt sich psychisch belastet.", "example_zh": ""}, {"lemma": "der Deutsche Gewerkschaftsbund (DGB)", "key": "dgb", "forms": ["Deutschen Gewerkschaftsbundes", "DGB", "Deutsche Gewerkschaftsbund"], "pos": "Substantiv", "zh": "德国工会联合会", "example_de": "Zu diesem Ergebnis kommt eine Umfrage des Deutschen Gewerkschaftsbundes unter Tausenden jungen Menschen.", "example_zh": ""}, {"lemma": "auf ein neues Tief sinken", "key": "neues-tief", "forms": ["ein neues Tief", "auf ein neues Tief sinken"], "pos": "Redewendung", "zh": "跌至新低", "example_de": "Im Vergleich zum Vorjahr ging die Zufriedenheit mit der Ausbildung um 5,9 Prozent zurück und sank damit auf ein neues Tief.", "example_zh": ""}, {"lemma": "brutto", "key": "brutto", "forms": ["brutto"], "pos": "Adjektiv", "zh": "税前的（毛收入）", "example_de": "Rund 1000 Euro brutto monatlich bekommt Darja Grabow im zweiten Jahr ihrer Ausbildung zur Schreinerin.", "example_zh": ""}, {"lemma": "die Nebenkosten (Pl.)", "key": "nebenkosten", "forms": ["Nebenkosten"], "pos": "Substantiv", "zh": "杂项开支，附加费用", "example_de": "Man merkt, wie viele Nebenkosten anstehen bei der Ausbildung.", "example_zh": ""}, {"lemma": "der Wohnungsmangel", "key": "wohnungsmangel", "forms": ["Wohnungsmangel"], "pos": "Substantiv", "zh": "住房短缺", "example_de": "Inflation, Wohnungsmangel - der finanzielle Druck auf Azubis wächst.", "example_zh": ""}, {"lemma": "der Wohnzuschuss, -schüsse", "key": "wohnzuschuss", "forms": ["Wohnzuschüsse", "Wohnzuschuss"], "pos": "Substantiv", "zh": "住房补贴", "example_de": "Das Land überlegt, in einigen Ausbildungsberufen bestimmte Wohnzuschüsse zu streichen.", "example_zh": ""}, {"lemma": "Abstriche machen", "key": "abstriche-machen", "forms": ["Abstriche machen"], "pos": "Redewendung", "zh": "做出削减，将就，降低标准", "example_de": "Dann müsste ich im Supermarkt überlegen, zu welchen Produkten ich greife und wo man Abstriche machen kann.", "example_zh": ""}], "grammar_points": [{"title": "jeder zweite + 单数名词", "summary": "「每两个人中的一个」用 jeder zweite / jede zweite + 单数名词，动词按第三人称单数变位，不要改成复数。", "example_de": "Jeder zweite Auszubildende fühlt sich psychisch belastet.", "example_zh": "每两名学徒中就有一人感到心理压力大。"}], "background": "DGB（德国工会联合会）每年发布 Azubi（学徒）调查报告，Azubi 是 Auszubildende(r) 的缩写。德国手工业学徒月薪通常 800–1200 欧元，随培训年份递增。巴登-符腾堡州 2026 年预算紧缩，拟削减培训期住房补贴，引发工会批评。"}, {"title": "Medizinischer Dienst: fast 3.100 Behandlungsfehler", "title_zh": "医保医疗鉴定机构：近 3100 起治疗失误", "paras": [{"start": 408.88, "end": 458.0, "lines": [{"de": "Wo Menschen arbeiten, passieren Fehler. Das gilt auch im Gesundheitswesen, wo sie besonders schwere Folgen haben können.", "zh": "有人工作的地方就会出错，医疗领域也不例外，而那里的错误可能造成特别严重的后果。"}, {"de": "Der Medizinische Dienst der Krankenkassen hat im vorigen Jahr fast 3100 Behandlungsfehler festgestellt.", "zh": "医保医疗鉴定机构（MD）去年认定了将近 3100 起治疗失误，其中三分之一造成永久性伤害。"}, {"de": "Davon ein Drittel mit dauerhaften Schäden. Er vermutet aber, dass die Dunkelziffer mindestens Hundertmal so groß ist.", "zh": "但该机构估计，未记录在案的数量至少是公布数字的一百倍。"}, {"de": "Denn in Deutschland werden solche Fehler nicht systematisch erfasst.", "zh": "因为在德国，这类错误并没有被系统性地记录。"}, {"de": "Deshalb fordern die Kassen und auch Patientenschutz-Organisationen eine Informationspflicht.", "zh": "因此医保基金和患者保护组织都在呼吁建立强制告知义务。"}]}], "vocab": [{"lemma": "der Behandlungsfehler, -", "key": "behandlungsfehler", "forms": ["Behandlungsfehler"], "pos": "Substantiv", "zh": "治疗失误，医疗差错", "example_de": "Der Medizinische Dienst der Krankenkassen hat im vorigen Jahr fast 3100 Behandlungsfehler festgestellt.", "example_zh": ""}, {"lemma": "die Krankenkasse, -n", "key": "krankenkasse", "forms": ["Krankenkassen", "Kassen", "Krankenkasse"], "pos": "Substantiv", "zh": "医疗（法定）保险公司", "example_de": "Der Medizinische Dienst der Krankenkassen hat im vorigen Jahr fast 3100 Behandlungsfehler festgestellt.", "example_zh": ""}, {"lemma": "die Dunkelziffer, -n", "key": "dunkelziffer", "forms": ["Dunkelziffer"], "pos": "Substantiv", "zh": "未报告数量，（统计外的）黑数", "example_de": "Er vermutet aber, dass die Dunkelziffer mindestens Hundertmal so groß ist.", "example_zh": ""}, {"lemma": "der Schaden, Schäden", "key": "schaeden", "forms": ["Schäden", "Schaden"], "pos": "Substantiv", "zh": "损害，伤害", "example_de": "Davon ein Drittel mit dauerhaften Schäden.", "example_zh": ""}, {"lemma": "erfassen", "key": "erfassen", "forms": ["erfasst", "erfassen"], "pos": "Verb", "zh": "记录，采集，掌握", "example_de": "Denn in Deutschland werden solche Fehler nicht systematisch erfasst.", "example_zh": ""}, {"lemma": "die Informationspflicht", "key": "informationspflicht", "forms": ["Informationspflicht"], "pos": "Substantiv", "zh": "强制告知义务", "example_de": "Deshalb fordern die Kassen und auch Patientenschutz-Organisationen eine Informationspflicht.", "example_zh": ""}], "grammar_points": [{"title": "wo 引导的关系从句", "summary": "wo 可以指代地点名词（im Gesundheitswesen），相当于 in dem，比关系代词更口语化。", "example_de": "Das gilt auch im Gesundheitswesen, wo sie besonders schwere Folgen haben können.", "example_zh": "在医疗领域也是如此，那里的错误可能造成特别严重的后果。"}], "background": "Medizinischer Dienst（MD，原名 MDK）是德国法定医保系统的医疗鉴定机构，受保险公司委托鉴定疑似治疗失误。患者可免费申请鉴定，若认定失误可据此索赔。因许多患者不知道这一渠道，实际发生数远高于鉴定数。"}, {"title": "Massive russische Angriffe auf Kiew", "title_zh": "俄罗斯对基辅大规模空袭", "paras": [{"start": 458.88, "end": 479.0, "lines": [{"de": "Russland hat die Ukraine in der Nacht wieder mit Raketen und Drohnen attackiert.", "zh": "夜间，俄罗斯再次用导弹和无人机袭击了乌克兰，首都基辅受灾尤为严重。"}, {"de": "Besonders betroffen war die Hauptstadt Kiew. Insgesamt wurden laut Behörden seit gestern mindestens 17 Menschen getötet.", "zh": "据当局通报，自昨天以来至少有 17 人丧生。"}, {"de": "Präsident Selenskyj forderte seine westlichen Verbündeten erneut auf, Patriot-Abwehrraketen an die Ukraine zu liefern.", "zh": "泽连斯基总统再次呼吁西方盟友向乌克兰提供爱国者防空导弹。"}]}, {"start": 479.08, "end": 531.92, "lines": [{"de": "Der Präsident steht innenpolitisch unter Druck.", "zh": "乌克兰民众面对来自俄罗斯的弹道导弹依然毫无防护，这一夜又不得不承受一次又一次的命中。"}, {"de": "Korruptionsskandale und die Absetzung des beliebten Verteidigungsministers hatten zuletzt Proteste in der Bevölkerung ausgelöst.", "zh": "这是一种难以忍受的处境，对有孩子的家庭来说尤其如此。"}, {"de": "Die Menschen in der Ukraine bleiben weiter schutzlos gegen ballistische Raketen aus Russland.", "zh": "「残酷，令人恐惧。"}, {"de": "Müssen auch in dieser Nacht einen Einschlag nach dem anderen über sich ergehen lassen.", "zh": "我们以为那是我们人生中的最后一夜。"}, {"de": "Ein unerträglicher Zustand, besonders für Familien mit Kindern.", "zh": "我很难开口谈论这件事。"}, {"de": "Hart, beängstigend. Wir dachten, das ist die letzte Nacht in unserem Leben.", "zh": "我们需要防护，这样才能睡得安稳一些。"}, {"de": "Es fällt mir schwer, darüber zu sprechen. Wir brauchen Schutz, damit wir ruhiger schlafen können.", "zh": "至少让我们有时间撤到安全的地方，让我们能拦截这些导弹。"}, {"de": "Zumindest damit wir Zeit haben, uns in Sicherheit zu bringen. Damit wir diese Raketen abwehren können.", "zh": "」"}]}, {"start": 532.64, "end": 581.92, "lines": [{"de": "Obwohl die ukrainische Luftwaffe nach eigenen Angaben viele russische Marschflugkörper und Angriffsdrohnen abwehren konnte: Die notwendige Munition zum Schutz gegen ballistische Raketen fehlt noch immer.", "zh": "尽管乌克兰空军自报拦截了大量俄式巡航导弹和攻击无人机，但防御弹道导弹所需的弹药仍然匮乏。"}, {"de": "Präsident Selenskyj erneuert daher seinen Hilferuf an die Partner der Ukraine, Patriot-Abwehrraketen zu liefern.", "zh": "因此泽连斯基总统再次向乌克兰的伙伴们发出求援，请求提供爱国者防空导弹。"}, {"de": "Innenpolitisch löste Ex-Verteidigungsminister Fedorow mit seiner Forderung nach Neuwahlen eine Debatte aus.", "zh": "在内政方面，前国防部长费奥多罗夫（Fedorow）关于重新选举的呼吁引发了一场争论。"}, {"de": "Ukrainischen Medien zufolge plane Fedorow, der Kontakte zu Tech-Milliardär Musk pflegt, eine Reise in die USA.", "zh": "据乌克兰媒体报道，与技术亿万富翁马斯克有交往的费奥多罗夫正计划访问美国。"}, {"de": "Dort wolle der 35-Jährige offenbar um Unterstützung für seinen Kurs werben.", "zh": "这位 35 岁的政治人物显然想在那里为自己的路线争取支持。"}, {"de": "Umfragen zeigen, dass die deutliche Mehrheit der Ukrainer gegen Wahlen in Kriegszeiten ist.", "zh": "民调显示，绝大多数乌克兰人反对在战时举行选举。"}, {"de": "Auch viele Fedorow-Unterstützer sehen den Vorstoß kritisch.", "zh": "许多费奥多罗夫的支持者也对该动议持批评态度。"}]}], "vocab": [{"lemma": "die Drohne, -n", "key": "drohne", "forms": ["Drohnen", "Drohne"], "pos": "Substantiv", "zh": "无人机", "example_de": "Russland hat die Ukraine in der Nacht wieder mit Raketen und Drohnen attackiert.", "example_zh": ""}, {"lemma": "die Abwehrrakete, -n", "key": "abwehrrakete", "forms": ["Abwehrraketen", "Abwehrrakete"], "pos": "Substantiv", "zh": "防空导弹，拦截弹", "example_de": "Präsident Selenskyj forderte seine westlichen Verbündeten erneut auf, Patriot-Abwehrraketen an die Ukraine zu liefern.", "example_zh": ""}, {"lemma": "schutzlos", "key": "schutzlos", "forms": ["schutzlos"], "pos": "Adjektiv", "zh": "毫无防护的", "example_de": "Die Menschen in der Ukraine bleiben weiter schutzlos gegen ballistische Raketen aus Russland.", "example_zh": ""}, {"lemma": "der Einschlag, -schläge", "key": "einschlag", "forms": ["Einschlag"], "pos": "Substantiv", "zh": "命中，弹着（点）", "example_de": "Müssen auch in dieser Nacht einen Einschlag nach dem anderen über sich ergehen lassen.", "example_zh": ""}, {"lemma": "sich (Dat.) etwas über sich ergehen lassen", "key": "sich-ergehen-lassen", "forms": ["über sich ergehen lassen", "sich"], "pos": "Redewendung", "zh": "忍受（不幸的事）", "example_de": "Müssen auch in dieser Nacht einen Einschlag nach dem anderen über sich ergehen lassen.", "example_zh": ""}, {"lemma": "beängstigend", "key": "beaengstigend", "forms": ["beängstigend"], "pos": "Adjektiv", "zh": "令人恐惧的", "example_de": "Hart, beängstigend.", "example_zh": ""}, {"lemma": "der Marschflugkörper, -", "key": "marschflugkoerper", "forms": ["Marschflugkörper"], "pos": "Substantiv", "zh": "巡航导弹", "example_de": "Obwohl die ukrainische Luftwaffe nach eigenen Angaben viele russische Marschflugkörper und Angriffsdrohnen abwehren konnte: Die notwendige Munition zum Schutz gegen ballistische Raketen fehlt noch immer.", "example_zh": ""}, {"lemma": "abwehren", "key": "abwehren", "forms": ["abwehren"], "pos": "Verb", "zh": "拦截，击退", "example_de": "Damit wir diese Raketen abwehren können.", "example_zh": ""}, {"lemma": "der Hilferuf, -e", "key": "hilferuf", "forms": ["Hilferuf"], "pos": "Substantiv", "zh": "求救呼吁", "example_de": "Präsident Selenskyj erneuert daher seinen Hilferuf an die Partner der Ukraine, Patriot-Abwehrraketen zu liefern.", "example_zh": ""}, {"lemma": "die Neuwahl, -en", "key": "neuwahl", "forms": ["Neuwahlen", "Neuwahl"], "pos": "Substantiv", "zh": "提前重新选举", "example_de": "Innenpolitisch löste Ex-Verteidigungsminister Fedorow mit seiner Forderung nach Neuwahlen eine Debatte aus.", "example_zh": ""}], "grammar_points": [{"title": "jemanden auf|fordern zu + 不定式", "summary": "auf|fordern = 呼吁/要求某人做某事，可分动词，接 zu + 不定式；erneut 修饰整个动作「再次呼吁」。", "example_de": "Präsident Selenskyj forderte seine westlichen Verbündeten erneut auf, Patriot-Abwehrraketen an die Ukraine zu liefern.", "example_zh": "泽连斯基总统再次呼吁西方盟友向乌克兰提供爱国者防空导弹。"}, {"title": "Obwohl 引导的让步从句", "summary": "obwohl = 虽然/尽管，动词位于从句末尾。本句 obwohl 从句后用冒号连接主句，属口语化的新闻句法。", "example_de": "Obwohl die ukrainische Luftwaffe nach eigenen Angaben viele russische Marschflugkörper und Angriffsdrohnen abwehren konnte:", "example_zh": "尽管乌克兰空军自报拦截了大量俄式巡航导弹和攻击无人机："}], "background": "Patriot 是美制远程防空系统，是乌克兰唯一能拦截弹道导弹的西方装备。2026 年乌克兰国内因腐败丑闻和国防部长被解职爆发抗议。Fedorow 是被解职的国防部长（35 岁），与马斯克关系密切，主张战时重新选举，与泽连斯基立场对立。"}, {"title": "Spanien: Migranten aus Ceuta in Übergangslager", "title_zh": "西班牙：休达移民进入过渡营地", "paras": [{"start": 583.24, "end": 609.96, "lines": [{"de": "In der spanischen Exklave Ceuta wollen die Behörden drei Wochen nach dem Andrang von Migranten die Ordnung wiederherstellen.", "zh": "在西班牙飞地休达，移民大批涌入三周之后，当局想恢复秩序。"}, {"de": "Etwa 2000 dort Verbliebene haben wochenlang am Stand campiert.", "zh": "约 2000 名留在当地的人在海滩上露宿了数周，今天他们被送进一个过渡营地。"}, {"de": "Sie wurden heute in ein Übergangslager gebracht. Ceuta liegt in Nordafrika, gegenüber von Gibraltar.", "zh": "休达位于北非，与直布罗陀隔海相望。"}, {"de": "Ende Juli waren mehr als 70.000 Migranten von Marokko aus gekommen. Der Großteil kehrte zurück.", "zh": "七月底曾有 7 万多名移民从摩洛哥方向而来，其中大部分人已返回。"}]}, {"start": 614.6, "end": 659.24, "lines": [{"de": "Drei Wochen lang haben sie hier geschlafen, am Playa Trampolin.", "zh": "三周来他们睡在这里，睡在跳板海滩（Playa Trampolin）上。"}, {"de": "Jetzt soll der Strand wieder Strand sein.", "zh": "现在海滩该重新成为海滩了。"}, {"de": "Ceuta weist rund 2000 Menschen eine neue Bleibe zu. Zu Fuß durch pralle Sonne.", "zh": "休达为约 2000 人指定了新的栖身之处——顶着烈日徒步前往。"}, {"de": "Viele dieser Migranten kommen aus Ländern südlich der Sahara, manche von ihnen mit Chancen auf Asyl.", "zh": "这些移民很多来自撒哈拉以南国家，其中一些人有获得庇护的机会。"}, {"de": "Auch das hier nur eine Übergangslösung.", "zh": "而这里同样只是过渡办法。"}, {"de": "Für die Bürger Ceutas aber ein Schritt Richtung Normalität, so die spanische Regierung.", "zh": "但对休达市民来说，这是迈向正常秩序的一步——西班牙政府这样说。"}, {"de": "Vielen dürfte das nicht reichen.", "zh": "对许多人来说这可能并不足够。"}, {"de": "Alle Kulturen lebten hier sehr gut zusammen, aber jetzt ist es sehr schlimm.", "zh": "「所有文化曾在这里非常好地共存，但现在情况很糟糕。"}, {"de": "Wir haben auch Angst vor Ansteckungen, vor Infektionen.", "zh": "我们也害怕传染、害怕感染。"}, {"de": "Die Marokkaner sind nicht in der Lage, politisches Asyl zu verlangen.", "zh": "摩洛哥人没有资格申请政治庇护，那为什么还不把他们遣返？"}, {"de": "Warum schiebt man sie dann nicht ab?", "zh": "」"}]}, {"start": 659.68, "end": 706.04, "lines": [{"de": "Von der angestrebten Normalität weit entfernt ist dieses Industriegebiet: Hunderte schlafen im Staub, viele sind minderjährig, Kinder.", "zh": "距离所追求的正常状态还很遥远的是这片工业区：数百人睡在尘土中，许多是未成年人，是孩子。"}, {"de": "Es gibt keine Toiletten, kein Wasser für sie.", "zh": "那里没有厕所，也没有给他们喝的水。"}, {"de": "Ich möchte in eine Unterkunft, raus aus dieser Situation, weg von der Straße.", "zh": "「我想住进收容所，摆脱这种处境，离开街道。"}, {"de": "Kinderschützer schlagen Alarm, das sei eine humanitäre Krise.", "zh": "」儿童保护工作者敲响警钟，称这是一场人道主义危机。"}, {"de": "Die Behörden müssen dringend und koordiniert reagieren, damit kein Kind mehr im Freien schlafen muss.", "zh": "当局必须紧急且协调一致地做出反应，不能再有任何孩子睡在露天。"}, {"de": "Die Grundbedürfnisse müssen gedeckt sein.", "zh": "基本需求必须得到满足。"}, {"de": "Spanien hat angekündigt, 500 minderjährige Mädchen aufs Festland zu bringen.", "zh": "西班牙已宣布将 500 名未成年女性送往本土。"}, {"de": "Wann und wohin genau unklar – nur langsam bewegt sich etwas in Ceuta.", "zh": "具体何时、送往何地尚不清楚——休达的一切只是缓慢地推进。"}]}], "vocab": [{"lemma": "die Exklave, -n", "key": "exklave", "forms": ["Exklave"], "pos": "Substantiv", "zh": "飞地（与他国接壤、不属于本土的领土）", "example_de": "In der spanischen Exklave Ceuta wollen die Behörden drei Wochen nach dem Andrang von Migranten die Ordnung wiederherstellen.", "example_zh": ""}, {"lemma": "der Andrang", "key": "andrang", "forms": ["Andrang"], "pos": "Substantiv", "zh": "蜂拥而至，大批涌入", "example_de": "In der spanischen Exklave Ceuta wollen die Behörden drei Wochen nach dem Andrang von Migranten die Ordnung wiederherstellen.", "example_zh": ""}, {"lemma": "campieren", "key": "campieren", "forms": ["campiert", "campieren"], "pos": "Verb", "zh": "露营，露宿", "example_de": "Etwa 2000 dort Verbliebene haben wochenlang am Stand campiert.", "example_zh": ""}, {"lemma": "das Übergangslager, -", "key": "uebergangslager", "forms": ["Übergangslager"], "pos": "Substantiv", "zh": "过渡营地", "example_de": "Sie wurden heute in ein Übergangslager gebracht.", "example_z  1972 vernommen wurde.", "zh": "慕尼黑一家犹太养老院纵火案发生 56 年后，检察院终于锁定了一名嫌疑人：新的调查指向一名新纳粹分子，他早在 1972 年就曾被审讯过。"}, {"de": "Er starb vor sechs Jahren, sodass er nicht mehr angeklagt werden kann.", "zh": "他已于六年前去世，因此无法再被起诉。"}, {"de": "Bei dem Brandanschlag wurden sieben Menschen getötet, einige von ihnen Holocaust-Überlebende.", "zh": "这起纵火袭击造成七人死亡，其中一些是大屠杀幸存者。"}, {"de": "Eine der schwersten antisemitischen Taten der Nachkriegszeit.", "zh": "这是战后最严重的反犹暴行之一。"}]}], "vocab": [{"lemma": "der Brandanschlag, -e", "key": "brandanschlag", "forms": ["Brandanschlag", "Brandanschlags"], "pos": "Substantiv", "zh": "纵火袭击", "example_de": "56 Jahre nach dem Brandanschlag auf ein jüdisches Altenheim in München hat sich die Staatsanwaltschaft auf einen Verdächtigen festgelegt: Neue Ermittlungen belasten einen Neonazi, der schon 1972 vernommen wurde.", "example_zh": ""}, {"lemma": "die Staatsanwaltschaft, -en", "key": "staatsanwaltschaft", "forms": ["Staatsanwaltschaft"], "pos": "Substantiv", "zh": "检察院", "example_de": "56 Jahre nach dem Brandanschlag auf ein jüdisches Altenheim in München hat sich die Staatsanwaltschaft auf einen Verdächtigen festgelegt: Neue Ermittlungen belasten einen Neonazi, der schon 1972 vernommen wurde.", "example_zh": ""}, {"lemma": "der Verdächtige, -n", "key": "verdaechtige", "forms": ["Verdächtigen", "Verdächtige"], "pos": "Substantiv", "zh": "嫌疑人（形容词变名词）", "example_de": "56 Jahre nach dem Brandanschlag auf ein jüdisches Altenheim in München hat sich die Staatsanwaltschaft auf einen Verdächtigen festgelegt: Neue Ermittlungen belasten einen Neonazi, der schon 1972 vernommen wurde.", "example_zh": ""}, {"lemma": "belasten", "key": "belasten", "forms": ["belasten"], "pos": "Verb", "zh": "（证据）指证，对……不利", "example_de": "56 Jahre nach dem Brandanschlag auf ein jüdisches Altenheim in München hat sich die Staatsanwaltschaft auf einen Verdächtigen festgelegt: Neue Ermittlungen belasten einen Neonazi, der schon 1972 vernommen wurde.", "example_zh": ""}, {"lemma": "vernehmen", "key": "vernehmen", "forms": ["vernommen", "vernehmen"], "pos": "Verb", "zh": "（警方）讯问，录口供", "example_de": "56 Jahre nach dem Brandanschlag auf ein jüdisches Altenheim in München hat sich die Staatsanwaltschaft auf einen Verdächtigen festgelegt: Neue Ermittlungen belasten einen Neonazi, der schon 1972 vernommen wurde.", "example_zh": ""}, {"lemma": "sich festlegen auf + Akk.", "key": "festlegen-auf", "forms": ["festgelegt", "sich festlegen auf"], "pos": "Verb", "zh": "锁定，确定", "example_de": "56 Jahre nach dem Brandanschlag auf ein jüdisches Altenheim in München hat sich die Staatsanwaltschaft auf einen Verdächtigen festgelegt: Neue Ermittlungen belasten einen Neonazi, der schon 1972 vernommen wurde.", "example_zh": ""}], "grammar_points": [{"title": "sodass / so … dass 结果从句", "summary": "sodass 引导结果从句（以至于），动词在句尾。sodass 与 so … dass 意义相同，前者更书面化。", "example_de": "Er starb vor sechs Jahren, sodass er nicht mehr angeklagt werden kann.", "example_zh": "他已于六年前去世，因此无法再被起诉。"}], "background": "1970 年 2 月慕尼黑一家犹太养老院遭纵火，7 名老人遇难，其中数人为大屠杀幸存者。案发时未能侦破，2026 年慕尼黑检察院经重新调查后锁定一名 1972 年曾接受讯问的新纳粹，但嫌疑人已去世，依法只能终止程序。"}, {"title": "„Ruhrtriennale“ beginnt in Bochum", "title_zh": "鲁尔三年展在波鸿开幕", "paras": [{"start": 737.96, "end": 762.12, "lines": [{"de": "Heute Abend startet die Ruhrtriennale.", "zh": "今晚鲁尔三年展拉开帷幕。这个艺术节以把煤矿、钢铁厂等废弃工业设施改造成舞台而闻名。"}, {"de": "Das Festival der Künste ist bekannt dafür, ehemalige Industrieanlagen wie Kohlezechen oder Stahlwerke in Bühnen zu verwandeln.", "zh": "昨天，波鸿世纪大厅为彩排开放了大门。"}, {"de": "Gestern öffnete die Jahrhunderthalle Bochum zur Generalprobe ihre Türen. 100 Tickets gab es exklusiv für unter 30-Jährige.", "zh": "有 100 张门票专门留给 30 岁以下的年轻人。"}, {"de": "Diese Generation ist im Theater bisher eher selten zu treffen.", "zh": "这一代人到目前为止很少走进剧院。"}]}, {"start": 763.84, "end": 767.16, "lines": [{"de": "♪ Let's Dance Put on your red shoes ♪ Sie tanzen in einer düsteren Welt, erzählen eine Geschichte des Widerstandes: Ausschließlich mit David-Bowie-Songs.", "zh": "他们在一个阴暗的世界里起舞，讲述一个关于反抗的故事——全部用大卫·鲍伊的歌曲。"}, {"de": "Generalprobe von \"Rebel Rebel\" auf der Ruhrtriennale. 100 Tickets gab es für unter 30-Jährige kostenlos.", "zh": "这是鲁尔三年展上《Rebel Rebel》的彩排。"}, {"de": "Timo und Hannah waren neugierig.", "zh": "100 张门票免费提供给 30 岁以下者。"}, {"de": "Zum ersten Mal im richtigen Theater, davor nur bei Kindervorstellungen und so was.", "zh": "蒂莫和汉娜是出于好奇来的。"}, {"de": "Und jetzt durch die Aktion was Neues probieren.", "zh": "「第一次走进真正的剧院，之前只看过儿童演出之类的。"}, {"de": "Ein Angebot, um ein junges Publikum ohne viel Vorerfahrung fürs Theater zu begeistern.", "zh": "现在想借这个活动尝试点新东西。"}, {"de": "Die Tickets waren schnell vergriffen.", "zh": "」这是一个让没有太多经验的年轻观众爱上剧院的尝试。"}, {"de": "Es ist wichtig, dass wir Türen öffnen für junge Menschen.", "zh": "门票很快就被领完了。「为年轻人打开大门很重要，我们正在努力这样做。"}, {"de": "Und das versuchen wir. ♪ Rebel rebel, you've torn your dress ♪ Das Musiktheaterstück zeichnet eine düstere Welt: Zwischenmenschliche Beziehungen sind per Gesetz verboten.", "zh": "」这部音乐戏剧描绘了一个阴暗的世界：人与人之间的亲密关系被法律禁止。"}, {"de": "Ein junges Paar lehnt sich auf und leistet Widerstand. ♪ We could be heroes Just for one day ♪ Songs wie \"Heroes\", in dem David Bowie in den 70ern über Freiheit und Mut singt, liefern den Soundtrack.", "zh": "一对年轻情侣奋起反抗。"}, {"de": "Ich bin schon relativ großer David-Bowie-Fan, ich fand es toll.", "zh": "像《Heroes》这样的歌曲——大卫·鲍伊在 70 年代在其中歌唱自由与勇气——为它提供了配乐。"}, {"de": "Ich glaube, dass da jeder was draus ziehen könnte.", "zh": "「我已经算是个挺铁的鲍伊歌迷了，我觉得太棒了。"}, {"de": "\"Rebel Rebel\" läuft auf der Ruhrtriennale bis zum 4.", "zh": "我觉得每个人都能从中获得些什么。"}, {"de": "September.", "zh": "」《Rebel Rebel》将在鲁尔三年展上演至 9 月 4 日。"}]}], "vocab": [{"lemma": "die Industrieanlage, -n", "key": "industrieanlage", "forms": ["Industrieanlagen", "Industrieanlage"], "pos": "Substantiv", "zh": "工业设施", "example_de": "Das Festival der Künste ist bekannt dafür, ehemalige Industrieanlagen wie Kohlezechen oder Stahlwerke in Bühnen zu verwandeln.", "example_zh": ""}, {"lemma": "verwandeln in + Akk.", "key": "verwandeln", "forms": ["verwandeln", "verwandeln in"], "pos": "Verb", "zh": "把……变成……", "example_de": "Das Festival der Künste ist bekannt dafür, ehemalige Industrieanlagen wie Kohlezechen oder Stahlwerke in Bühnen zu verwandeln.", "example_zh": ""}, {"lemma": "die Generalprobe, -n", "key": "generalprobe", "forms": ["Generalprobe"], "pos": "Substantiv", "zh": "彩排，带妆总排练", "example_de": "Gestern öffnete die Jahrhunderthalle Bochum zur Generalprobe ihre Türen. 100 Tickets gab es exklusiv für unter 30-Jährige.", "example_zh": ""}, {"lemma": "exklusiv", "key": "exklusiv", "forms": ["exklusiv"], "pos": "Adjektiv", "zh": "专属的，专门的", "example_de": "Gestern öffnete die Jahrhunderthalle Bochum zur Generalprobe ihre Türen. 100 Tickets gab es exklusiv für unter 30-Jährige.", "example_zh": ""}, {"lemma": "düster", "key": "duester", "forms": ["düster"], "pos": "Adjektiv", "zh": "阴暗的，阴郁的", "example_de": "Sie tanzen in einer düsteren Welt, erzählen eine Geschichte des Widerstandes:", "example_zh": ""}, {"lemma": "sich auflehnen", "key": "sich-auflehnen", "forms": ["lehnt sich auf", "sich auflehnen"], "pos": "Verb", "zh": "反抗，起来抵抗", "example_de": "Ein junges Paar lehnt sich auf und leistet Widerstand. ♪ We could be heroes Just for one day ♪ Songs wie \"Heroes\", in dem David Bowie in den 70ern über Freiheit und Mut singt, liefern den Soundtrack.", "example_zh": ""}, {"lemma": "begeistern", "key": "begeistern", "forms": ["begeistern"], "pos": "Verb", "zh": "使着迷，点燃热情", "example_de": "Ein Angebot, um ein junges Publikum ohne viel Vorerfahrung fürs Theater zu begeistern.", "example_zh": ""}, {"lemma": "vergriffen", "key": "vergriffen", "forms": ["vergriffen"], "pos": "Adjektiv", "zh": "售罄的（多指书/票）", "example_de": "Die Tickets waren schnell vergriffen.", "example_zh": ""}, {"lemma": "der Soundtrack, -s", "key": "soundtrack", "forms": ["Soundtrack"], "pos": "Substantiv", "zh": "配乐，原声音乐", "example_de": "Ein junges Paar lehnt sich auf und leistet Widerstand. ♪ We could be heroes Just for one day ♪ Songs wie \"Heroes\", in dem David Bowie in den 70ern über Freiheit und Mut singt, liefern den Soundtrack.", "example_zh": ""}], "grammar_points": [{"title": "bekannt dafür, … zu + 不定式", "summary": "bekannt für etwas (Akk.) 的不定式版本：以做某事而闻名。dafür 预指后面的不定式结构。", "example_de": "Das Festival der Künste ist bekannt dafür, ehemalige Industrieanlagen wie Kohlezechen oder Stahlwerke in Bühnen zu verwandeln.", "example_zh": "这个艺术节以把废弃工业设施改造成舞台而闻名。"}], "background": "Ruhrtriennale 是鲁尔区国际艺术节，每年 8–9 月在废弃工业遗迹中上演。Jahrhunderthalle Bochum 是波鸿的百年工业大厅，为该展核心场地。《Rebel Rebel》是一部以大卫·鲍伊歌曲串联的舞蹈剧场作品。"}, {"title": "Schwere Unwetter in mehreren Bundesländern", "title_zh": "多州遭遇严重风暴", "paras": [{"start": 812.72, "end": 879.4, "lines": [{"de": "Zwei Tornados innerhalb weniger Stunden haben in Brandenburg und Hessen für erhebliche Schäden gesorgt.", "zh": "几个小时内两场龙卷风在勃兰登堡州和黑森州造成严重损失。"}, {"de": "Bäume wurden entwurzelt und wie hier in Solms ganze Dächer abgedeckt.", "zh": "树木被连根拔起，像这里索尔姆斯一样，整片屋顶被掀掉。"}, {"de": "In Rheinland-Pfalz kam eine Frau bei einem Unwetter ums Leben.", "zh": "在莱茵兰-普法尔茨州，一名女性在风暴中丧生。"}, {"de": "In Thüringen wurde ein Mann von Ästen tödlich verletzt.", "zh": "在图林根州，一名男子被断枝砸中身亡。"}, {"de": "Deutschlandweit wurden Dutzende Gebäude beschädigt.", "zh": "全德范围内有数十栋建筑受损。"}]}, {"start": 880.96, "end": 935.24, "lines": [{"de": "Ulrike Arlia-Bianco-Spino war zu Hause, als der Sturm einen Teil ihres Schlafzimmers in Höhr-Grenzhausen wegriss.", "zh": "乌尔丽克·阿尔利亚-比安科-斯皮诺当时在家，风暴把她位于赫尔-格伦茨豪森家的卧室一部分掀走了。"}, {"de": "Ruckzuck ging die Wand weg.", "zh": "「眨眼间墙就没了。"}, {"de": "Dat flog alles in der Wohnung rum.", "zh": "东西在屋里乱飞。"}, {"de": "Ich konnte keine Tür schließen, die Fenster flogen raus.", "zh": "我连一扇门都关不上，窗户都飞出去了。"}, {"de": "Dat war eine Katastrophe.", "zh": "那简直是一场灾难。"}, {"de": "Am Tag nach dem Sturm: überall aufräumen.", "zh": "」风暴过后的第二天：到处都在清理。"}, {"de": "Mehr als 60 Orte in Rheinland-Pfalz hatten keinen Strom.", "zh": "莱茵兰-普法尔茨州有 60 多个地方停电。"}, {"de": "Bis zum Alltag dauert es noch.", "zh": const WK_RE = /[A-Za-zÄÖÜäöüß][A-Za-zÄÖÜäöüß-]*/g;
const PHRASES = (DATA.phrases || []).slice().sort((a, b) => b.length - a.length);
function lookupKey(surface) {
  return (DATA.form_to_key && DATA.form_to_key[surface.toLowerCase()]) || surface.toLowerCase();
}
function wrapWord(surface, key) {
  const g = getGloss(key);
  const classes = [
    g?.zh ? 'known' : '',
    g?.source === 'editorial' ? 'ed' : '',
    g?.source === 'dict' ? 'wiki' : '',
    basket.some(b => b.key === key) ? 'saved' : ''
  ].filter(Boolean).join(' ');
  return `<w data-w="${esc(key)}" class="${classes}">${esc(surface)}</w>`;
}
function isLetter(ch) { return /[A-Za-zÄÖÜäöüß]/.test(ch || ''); }
function tokenizeDe(text) {
  let html = '', i = 0;
  const lower = text.toLowerCase();
  while (i < text.length) {
    let hit = '';
    if (i === 0 || !isLetter(text[i - 1])) {
      for (const ph of PHRASES) {
        if (lower.startsWith(ph.toLowerCase(), i) && !isLetter(text[i + ph.length])) {
          hit = text.slice(i, i + ph.length);
          break;
        }
      }
    }
    if (hit) {
      html += wrapWord(hit, lookupKey(hit));
      i += hit.length;
      continue;
    }
    if (isLetter(text[i])) {
      let j = i + 1;
      while (j < text.length && /[A-Za-zÄÖÜäöüß-]/.test(text[j])) j++;
      const word = text.slice(i, j);
      html += wrapWord(word, lookupKey(word));
      i = j;
    } else {
      let j = i + 1;
      while (j < text.length && !isLetter(text[j])) j++;
      html += esc(text.slice(i, j));
      i = j;
    }
  }
  return html;
}

function storyExtras(n, compact) {
  if (compact) {
    const tabs = [];
    const panes = [];
    if (n.background) {
      tabs.push('<button type="button" class="stab" data-pane="bg">背景</button>');
      panes.push(`<div class="spane" data-pane="bg"><div class="rail-note">${esc(n.background)}</div></div>`);
    }
    if (n.vocab.length) {
      tabs.push(`<button type="button" class="stab" data-pane="vocab">词汇 ${n.vocab.length}</button>`);
      panes.push(`<div class="spane" data-pane="vocab">${
        n.vocab.map(v => `<div class="vrow"><div><div class="vw">${esc(v.lemma)}</div><div class="vz">${esc(v.zh)}</div>${v.example_de ? `<div class="vex">${esc(v.example_de)}</div>` : ''}</div><button type="button" class="vadd" data-add="${esc(v.key)}" title="加入生词本" aria-label="加入生词本">+</button></div>`).join('')
      }</div>`);
    }
    if (n.grammar_points.length) {
      tabs.push(`<button type="button" class="stab" data-pane="gram">语法 ${n.grammar_points.length}</button>`);
      panes.push(`<div class="spane" data-pane="gram">${
        n.grammar_points.map(g => `<div class="rail-note"><strong>${esc(g.title)}</strong>${g.example_de ? `<i>${esc(g.example_de)}</i>` : ''}${esc(g.summary)}</div>`).join('')
      }</div>`);
    }
    if (!tabs.length) return '<p class="empty-study">这条没有单独的词汇或语法。</p>';
    return `<div class="study-tabs n${tabs.length}">${tabs.join('')}</div>${panes.join('')}`;
  }
  const vocab = n.vocab.length ? `<details class="sec-vocab"><summary>重点词汇 · ${n.vocab.length}</summary><div class="body">${
    n.vocab.map(v => `<div class="vcard"><div><div class="vcard-top">${esc(v.lemma)}${v.pos ? `<span class="vpos">${esc(v.pos)}</span>` : ''}</div><div class="vzh">${esc(v.zh)}</div>${v.example_de ? `<div class="vex">${esc(v.example_de)}</div>` : ''}</div><button type="button" class="vadd" data-add="${esc(v.key)}" title="加入生词本" aria-label="加入生词本">+</button></div>`).join('')
  }</div></details>` : '';
  const gram = n.grammar_points.length ? `<details class="sec-gram"><summary>语法 · ${n.grammar_points.length}</summary><div class="body">${
    n.grammar_points.map(g => `<div class="gcard"><h4>${esc(g.title)}</h4>${g.example_de ? `<div class="gex">${esc(g.example_de)}</div>` : ''}${g.example_zh ? `<div class="gexzh">${esc(g.example_zh)}</div>` : ''}${g.summary ? `<details class="gmore"><summary>解释</summary><div>${esc(g.summary)}</div></details>` : ''}</div>`).join('')
  }</div></details>` : '';
  const bg = n.background ? `<details class="sec-bg"><summary>背景资料</summary><div class="body"><p class="bg-note">AI 整理，未经独立来源核验</p>${esc(n.background)}</div></details>` : '';
  return vocab + gram + bg || '<p class="empty-study">这条没有单独的词汇或语法。</p>';
}

function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtInline(s) { return esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>'); }
function fmtDate(iso) {
  const d = new Date(iso + 'T12:00:00');
  return d.toLocaleDateString('de-DE', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
}
function fmtClock(sec) {
  const s = Math.max(0, Math.floor(Number(sec) || 0));
  return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
}
function mountPlayer() {
  const box = document.getElementById('player');
  const fallback = () => {
    if (!DATA.embed_url) {
      document.getElementById('video-card').style.display = 'none';
      return;
    }
    box.innerHTML = `<iframe src="${esc(DATA.embed_url)}" title="Tagesschau 视频播放器" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen scrolling="no"></iframe>`;
  };
  if (DATA.mp4_url) {
    box.innerHTML = `<video id="av" controls playsinline preload="metadata" src="${esc(DATA.mp4_url)}"></video>`;
    const v = document.getElementById('av');
    let dead = false;
    v.addEventListener('error', () => { if (!dead) { dead = true; fallback(); } });
    v.addEventListener('timeupdate', highlightPlaying);
  } else {
    fallback();
  }
}
function seekTo(sec) {
  const v = document.getElementById('av');
  if (!v || Number.isNaN(sec)) return;
  v.currentTime = sec;
  v.play().catch(() => {});
}
function highlightPlaying() {
  const v = document.getElementById('av');
  if (!v) return;
  const t = v.currentTime;
  let current = null;
  document.querySelectorAll('.para').forEach(el => {
    const a = parseFloat(el.dataset.start), b = parseFloat(el.dataset.end);
    const on = !Number.isNaN(a) && !Number.isNaN(b) && t >= a && t < b + 0.05;
    el.classList.toggle('now', on);
    if (on) current = el;
  });
  if (current && highlightPlaying._last !== current) {
    highlightPlaying._last = current;
    current.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }
}

const videoCard = document.getElementById('video-card');
const FLOAT_KEY = 'dd-float-pos';
let floatDismissed = false;
function clampFloat(x, y) {
  const w = videoCard.offsetWidth || 210;
  const h = videoCard.offsetHeight || 118;
  const pad = 8;
  return {
    x: Math.min(Math.max(pad, x), Math.max(pad, innerWidth - w - pad)),
    y: Math.min(Math.max(pad, y), Math.max(pad, innerHeight - h - pad))
  };
}
function applyFloatPos(x, y) {
  const p = clampFloat(x, y);
  videoCard.style.left = p.x + 'px';
  videoCard.style.top = p.y + 'px';
  videoCard.style.right = 'auto';
  saveStored(FLOAT_KEY, p);
}
function restoreFloatPos() {
  const pos = loadStored(FLOAT_KEY, null);
  if (pos && typeof pos.x === 'number' && typeof pos.y === 'number') applyFloatPos(pos.x, pos.y);
}
function clearFloatPos() {
  videoCard.style.left = '';
  videoCard.style.top = '';
  videoCard.style.right = '';
}
const videoObserver = new IntersectionObserver(([entry]) => {
  if (innerWidth > 840) {
    videoCard.classList.remove('floating', 'float-off');
    clearFloatPos();
    return;
  }
  if (entry.isIntersecting) {
    floatDismissed = false;
    videoCard.classList.remove('floating', 'float-off');
    clearFloatPos();
  } else if (!floatDismissed && DATA.embed_url) {
    videoCard.classList.add('floating');
    requestAnimationFrame(restoreFloatPos);
  }
}, { threshold: 0 });
videoObserver.observe(document.getElementById('video-anchor'));
document.getElementById('video-float-close').onclick = () => {
  floatDismissed = true;
  videoCard.classList.remove('floating');
  videoCard.classList.add('float-off');
  clearFloatPos();
};
(function enableFloatDrag() {
  const handle = document.getElementById('video-drag');
  let drag = null;
  handle.addEventListener('pointerdown', e => {
    if (!videoCard.classList.contains('floating') || e.button) return;
    e.preventDefault();
    const r = videoCard.getBoundingClientRect();
    drag = { ox: e.clientX - r.left, oy: e.clientY - r.top };
    handle.setPointerCapture(e.pointerId);
  });
  handle.addEventListener('pointermove', e => {
    if (!drag) return;
    applyFloatPos(e.clientX - drag.ox, e.clientY - drag.oy);
  });
  const stop = () => { drag = null; };
  handle.addEventListener('pointerup', stop);
  handle.addEventListener('pointercancel', stop);
})();
addEventListener('resize', () => {
  if (innerWidth > 840) {
    videoCard.classList.remove('floating', 'float-off');
    clearFloatPos();
  } else if (videoCard.classList.contains('floating')) {
    const r = videoCard.getBoundingClientRect();
    applyFloatPos(r.left, r.top);
  }
});

function sentenceAround(el) {
  const de = el.closest('.de');
  if (!de) return '';
  return (de.innerText || de.textContent || '').replace(/\s+/g, ' ').trim();
}

function showPop(wEl) {
  const key = wEl.dataset.w;
  const g = getGloss(key) || { word: wEl.textContent, zh: '', pos: '', example: '' };
  const example = sentenceAround(wEl) || g.example || '';
  const topic = wEl.closest('article')?.querySelector('h2')?.textContent || '';
  popWord = { key, word: wEl.textContent, ...g, example, topic };
  const inBasket = basket.some(b => b.key === key);
  pop.innerHTML = `
    <div class="pop-top"><div><div class="pw">${esc(g.word || wEl.textContent)}</div>
    <div class="pp">${esc(g.source === 'dict' ? '离线词典' : (g.pos || '本期重点词汇'))}</div></div>
    <button class="pclose" onclick="hidePop()" aria-label="关闭">×</button></div>
    <div class="pz">${esc(g.zh || '')}</div>
    ${example ? `<div class="pe">${esc(example)}</div>` : ''}
    <div class="pop-actions">
      <button class="secondary-btn" onclick="openPopEditor()">${g.zh ? '编辑' : '补充释义'}</button>
      <button class="pbtn ${inBasket ? 'in' : ''}" onclick="basketAdd()">${inBasket ? '已在生词本' : '加入生词本'}</button>
    </div>`;
  const r = wEl.getBoundingClientRect();
  pop.classList.add('open');
  const pw = pop.offsetWidth, ph = pop.offsetHeight;
  let x = Math.min(Math.max(12, r.left + r.width/2 - pw/2), innerWidth - pw - 12);
  let y = r.top - ph - 10;
  if (y < 12) y = Math.min(r.bottom + 10, innerHeight - ph - 12);
  pop.style.left = x + 'px'; pop.style.top = y + 'px';
}
function openPopEditor() {
  if (!popWord) return;
  pop.innerHTML = `
    <div class="pop-top"><div class="pw">${esc(popWord.word)}</div><button class="pclose" onclick="hidePop()" aria-label="关闭">×</button></div>
    <form class="word-form" id="pop-form" style="margin-top:14px">
      <label>显示词形<input id="pop-edit-word" required value="${esc(popWord.word)}"></label>
      <label>中文释义<input id="pop-edit-zh" required value="${esc(popWord.zh || '')}" placeholder="输入你自己的释义"></label>
      <label>例句（可选）<textarea id="pop-edit-example">${esc(popWord.example || '')}</textarea></label>
      <div class="form-actions"><button type="button" class="secondary-btn" onclick="hidePop()">取消</button><button class="primary-btn" type="submit">保存并加入</button></div>
    </form>`;
  document.getElementById('pop-form').onsubmit = e => {
    e.preventDefault();
    const custom = {
      word: document.getElementById('pop-edit-word').value.trim(),
      zh: document.getElementById('pop-edit-zh').value.trim(),
      pos: popWord.pos || '',
      example: document.getElementById('pop-edit-example').value.trim()
    };
    if (!custom.word || !custom.zh) return;
    userGloss[popWord.key] = custom;
    saveStored(GLOSS_KEY, userGloss);
    popWord = { key: popWord.key, ...custom };
    const existing = basket.find(b => b.key === popWord.key);
    if (existing) Object.assign(existing, custom);
    else basket.push({ key: popWord.key, ...custom, date: DATA.date, topic: popWord.topic || '', createdAt: Date.now() });
    saveBasket();
    refreshWordMarks();
    hidePop();
    renderBasket();
    toast('已保存到生词本');
