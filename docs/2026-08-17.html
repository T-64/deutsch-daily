ld, Nadelwälder", "key": "nadelwald", "forms": ["Nadelwald", "Nadelwälder"], "pos": "", "zh": "针叶林", "example_de": "In der Nähe gibt es nämlich auch einen Nadelwald.", "example_zh": ""}, {"lemma": "die Sicherheit", "key": "sicherheit", "forms": ["Sicherheit"], "pos": "", "zh": "安全", "example_de": "Zur Sicherheit.", "example_zh": ""}, {"lemma": "erleichtert", "key": "erleichtert", "forms": ["erleichtert"], "pos": "", "zh": "松了口气的", "example_de": "Ich bin erleichtert.", "example_zh": ""}], "grammar_points": [{"title": "deshalb / deswegen / nämlich", "summary": "deshalb / deswegen / nämlich — 因果连接词家族 这条新闻是因果连接词的展览会： · deshalb / deswegen（因此）= 前句是因，本句是果，占第一位：\"Deshalb haben viele Menschen Angst.\" · nämlich（因为）= 原因藏在句子中间，跟在主语后：\"Es regnet nämlich.\" 直觉：deshalb 往前指（所以），nämlich 往后藏（原因埋伏在句中）", "example_de": "Deshalb haben viele Menschen Angst.", "example_zh": ""}, {"title": "deshalb 句的 V2 语序", "summary": "deshalb 句的 V2 语序 deshalb 占第一位时，动词紧跟第二位，主语退到动词后。\"Deshalb haben viele Menschen Angst.\" 任何成分提前，动词永远死守第二位。", "example_de": "Deshalb haben viele Menschen Angst.", "example_zh": ""}], "background": "比利时与德国、荷兰交界地带2026年8月中旬发生大范围泥炭沼泽火灾。泥炭土壤本身可燃，火会在地下蔓延，浇水只能扑灭表面，极难彻底扑灭。这类火灾在欧洲近年高温干旱背景下越来越常见。"}, {"title": "Bundesländer lockern Lkw-Fahrverbot am Sonntag", "title_zh": "联邦州放宽周日卡车禁行", "paras": [{"start": 165.6, "end": 193.2, "lines": [{"de": "Es gibt zurzeit zu wenig Regen in Deutschland.", "zh": "目前德国降雨太少。", "start": 165.6, "end": 175.68}, {"de": "Deshalb ist es sehr trocken.", "zh": "因此非常干燥。", "start": 176.08, "end": 178.12}, {"de": "Und in vielen Flüssen ist nur wenig Wasser.", "zh": "许多河流水位很低。", "start": 178.4, "end": 181.4}, {"de": "Schiffe können nicht viel Fracht und Ladung mitnehmen.", "zh": "船只无法运载太多货物。", "start": 181.8, "end": 185.56}, {"de": "Für manche Firmen ist das ein Problem.", "zh": "对一些公司来说这是个问题，", "start": 185.6, "end": 187.88}, {"de": "Sie brauchen nämlich die Lieferung von der Fracht.", "zh": "因为它们需要货物按时送达，", "start": 187.92, "end": 191.44}, {"de": "Z.B. für ihre Fabrik.", "zh": "比如送到工厂。", "start": 191.6, "end": 193.2}]}, {"start": 194.28, "end": 208.92, "lines": [{"de": "Wegen diesem Problem sagt die Regierung in vielen Bundesländern von Deutschland, die Fracht soll mit Lastwagen transportiert werden.", "zh": "由于这个问题，德国许多联邦州的政府说：货物应该用卡车运输。", "start": 194.28, "end": 202.32}, {"de": "Das ist jetzt auch am Sonntag erlaubt.", "zh": "现在周日也允许了。", "start": 202.36, "end": 205.0}, {"de": "Bisher durften Lastwagen nämlich nicht am Sonntag fahren.", "zh": "在此之前，卡车是不允许在周日上路的。", "start": 205.6, "end": 208.92}]}, {"start": 208.96, "end": 240.48, "lines": [{"de": "Dazu kommt jetzt ein Film.", "zh": "（接下来是一段影片。", "start": 208.96, "end": 211.08}, {"de": "In diesem Hafen in dem Bundesland Bayern ist nichts los.", "zh": "）巴伐利亚州的这个港口冷冷清清。", "start": 213.44, "end": 217.8}, {"de": "Es gibt zu wenig Wasser im Fluss.", "zh": "河里水太少了。", "start": 218.04, "end": 220.52}, {"de": "Schiffe fahren nicht.", "zh": "船只无法航行。", "start": 221.04, "end": 222.56}, {"de": "Die Container können jetzt nur mit Lastwagen transportiert werden.", "zh": "集装箱现在只能用卡车运输。", "start": 222.6, "end": 227.64}, {"de": "Joachim Herrmann von der CSU ist Minister in der Regierung von Bayern.", "zh": "基社盟的约阿希姆·赫尔曼是巴伐利亚政府的部长。", "start": 228.08, "end": 233.32}, {"de": "Er sagt, wir ändern das Gesetz.", "zh": "他说，我们修改法律。", "start": 233.36, "end": 236.64}, {"de": "Lastwagen dürfen jetzt auch am Sonntag fahren.", "zh": "卡车现在周日也可以上路了。", "start": 237.28, "end": 240.48}]}, {"start": 241.08, "end": 275.28, "lines": [{"de": "Aber an diesem Sonntag sind kaum Lastwagen unterwegs.", "zh": "但在这个周日，路上几乎看不到卡车。", "start": 241.08, "end": 244.88}, {"de": "Viele Lastwagen stehen auf dem Rastplatz.", "zh": "很多卡车停在服务区。", "start": 245.44, "end": 248.48}, {"de": "Die Fahrer müssen nämlich Pause machen.", "zh": "因为司机必须休息——这是法律规定。", "start": 249.12, "end": 252.04}, {"de": "Das ist ein Gesetz.", "zh": "很多司机根本不知道现在周日可以开车了。", "start": 252.52, "end": 253.88}, {"de": "Viele Fahrer wissen gar nicht, dass sie jetzt am Sonntag fahren dürfen.", "zh": "这位司机说，今天是周日，", "start": 254.8, "end": 259.36}, {"de": "Dieser Fahrer sagt, heute ist Sonntag, da darf ich nicht Lastwagen fahren.", "zh": "我不能开卡车。所有司机周日都休息。", "start": 260.4, "end": 266.08}, {"de": "Alle Fahrer haben am Sonntag frei.", "zh": "另一位司机说，", "start": 266.36, "end": 268.8}, {"de": "Und dieser Fahrer sagt, ich fahre erst am Montagmorgen wieder los.", "zh": "我要到周一早上才重新出发。", "start": 270.4, "end": 275.28}]}, {"start": 276.88, "end": 305.52, "lines": [{"de": "Für viele Firmen mit Lastwagen ist die neue Regel nicht so einfach.", "zh": "对很多卡车公司来说，新规没那么容易执行。", "start": 276.88, "end": 281.6}, {"de": "Dieser Mann vertritt die Lastwagenfirmen.", "zh": "这位男士代表卡车公司的利益。", "start": 281.96, "end": 285.08}, {"de": "Er sagt, die Firmen haben komplizierte Pläne gemacht für ihre Lastwagen und für ihre Fahrer.", "zh": "他说，公司为卡车和司机制定了复杂的计划。", "start": 285.12, "end": 292.76}, {"de": "Die Pläne können sie nicht so schnell ändern.", "zh": "这些计划没法那么快改。", "start": 293.0, "end": 296.16}, {"de": "Lastwagen fahren am Sonntag nicht, obwohl sie dürfen.", "zh": "所以卡车周日不上路，尽管被允许。", "start": 296.48, "end": 300.36}, {"de": "Diese Autofahrerin sagt, wir haben kaum Lastwagen gesehen.", "zh": "这位女司机说，我们几乎没看到卡车。", "start": 301.2, "end": 305.52}]}, {"start": 306.04, "end": 333.88, "lines": [{"de": "Der Minister aus Bayern findet die neue Regel trotzdem gut.", "zh": "巴伐利亚的部长仍然认为新规是好的。", "start": 306.04, "end": 310.48}, {"de": "Er sagt, wir schränken die Firmen nicht mehr ein.", "zh": "他说，我们不再限制公司了。", "start": 310.52, "end": 314.92}, {"de": "Sie dürfen jetzt auch am Sonntag Fracht transportieren.", "zh": "它们现在周日也可以运货了。", "start": 315.24, "end": 319.08}, {"de": "Ob sie das auch machen, das muss jede Firma selbst entscheiden.", "zh": "至于做不做，每家公司自己决定。", "start": 319.16, "end": 323.24}, {"de": "Aber die Regel soll nicht für immer bleiben.", "zh": "但这条规则不会永远保留。", "start": 323.92, "end": 327.0}, {"de": "Wenn Schiffe wieder fahren können, dann müssen die Lastwagen auch am Sonntag wieder Pause machen.", "zh": "等船只恢复航行，卡车周日也得重新休息。", "start": 327.32, "end": 333.88}]}], "vocab": [{"lemma": "das Bundesland, Bundesländer", "key": "bundesland", "forms": ["Bundesland", "Bundesländer"], "pos": "", "zh": "联邦州", "example_de": "In diesem Hafen in dem Bundesland Bayern ist nichts los.", "example_zh": ""}, {"lemma": "lockern", "key": "lockern", "forms": ["lockern"], "pos": "Verb", "zh": "放宽", "example_de": "Die Bundesländer lockern das Fahrverbot.", "example_zh": ""}, {"lemma": "das Fahrverbot, -e", "key": "fahrverbot", "forms": ["Fahrverbot", "Fahrverbote"], "pos": "", "zh": "禁行令", "example_de": "Bisher gab es ein Fahrverbot am Sonntag.", "example_zh": ""}, {"lemma": "die Fracht", "key": "fracht", "forms": ["Fracht"], "pos": "", "zh": "货物（运输的）", "example_de": "Schiffe können nicht viel Fracht und Ladung mitnehmen.", "example_zh": ""}, {"lemma": "die Lieferung, -en", "key": "lieferung", "forms": ["Lieferung", "Lieferungen"], "pos": "", "zh": "送货、交付", "example_de": "Sie brauchen nämlich die Lieferung von der Fracht.", "example_zh": ""}, {"lemma": "der Lastwagen (Lkw), -s", "key": "lastwagen", "forms": ["Lastwagen", "Lastwagens", "Lkw"], "pos": "", "zh": "卡车", "example_de": "Wegen diesem Problem sagt die Regierung in vielen Bundesländern von Deutschland, die Fracht soll mit Lastwagen transportiert werden.", "example_zh": ""}, {"lemma": "transportieren", "key": "transportieren", "forms": ["transportieren"], "pos": "Verb", "zh": "运输", "example_de": "Sie dürfen jetzt auch am Sonntag Fracht transportieren.", "example_zh": ""}, {"lemma": "der Rastplatz, Rastplätze", "key": "rastplatz", "forms": ["Rastplatz", "Rastplätze"], "pos": "", "zh": "服务区", "example_de": "Viele Lastwagen stehen auf dem Rastplatz.", "example_zh": ""}, {"lemma": "die Regel, -n", "key": "regel", "forms": ["Regel", "Regeln"], "pos": "", "zh": "规则", "example_de": "Für viele Firmen mit Lastwagen ist die neue Regel nicht so einfach.", "example_zh": ""}, {"lemma": "vertreten", "key": "vertreten", "forms": ["vertreten"], "pos": "Verb", "zh": "代表", "example_de": "Dieser Mann vertritt die Lastwagenfirmen.", "example_zh": ""}], "grammar_points": [{"title": "被动语态", "summary": "被动语态 — werden + Partizip II \"Die Fracht soll mit Lastwagen transportiert werden.\"（货物应该被卡车运输） \"Das ist jetzt auch am Sonntag erlaubt.\"（现在周日也被允许了） 直觉：被动 = 主语是\"被打\"的那一方。werden 承担\"被\"的功能，动词变第二分词甩句末。soll ... werden = 情态动词 + 被动，两层框架叠在句末", "example_de": "Die Fracht soll mit Lastwagen transportiert werden.", "example_zh": ""}, {"title": "dürfen vs. müssen vs. sollen", "summary": "dürfen vs. müssen vs. sollen — 三个\"规\"的直觉 · dürfen（被允许）：法律开绿灯 \"Lastwagen dürfen jetzt fahren.\" · müssen（必须）：法律上枷锁 \"Die Fahrer müssen Pause machen.\" · sollen（应该/被期望）：政府的态度 \"Die Fracht soll transportiert werden.\" 直觉：dürfen 是权利，müssen 是义务，sollen 是期望——都来自规则世界，不是你自己的意愿", "example_de": "规", "example_zh": ""}], "background": "德国传统上禁止卡车周日上高速（Sonntagsfahrverbot），目的是让司机休息、缓解交通。2026年夏莱茵河等主要航道因干旱水位过低断航，物流受阻，多州临时放宽周日禁令。由于欧盟对司机的强制休息时间和运输公司的计划周期，放宽初期实际效果有限。"}, {"title": "E-Scooter: Unfälle und Diskussion über Helmpflicht", "title_zh": "电动滑板车：事故与头盔义务讨论", "paras": [{"start": 334.68, "end": 382.04, "lines": [{"de": "E-Scooter ist englisch für E-Roller.", "zh": "E-Scooter 是英语，", "start": 334.68, "end": 344.52}, {"de": "Das E steht für Elektro.", "zh": "就是电动滑板车。E 代表电动。", "start": 345.08, "end": 347.48}, {"de": "Die Roller fahren nämlich mit einem Elektromotor, mit Strom aus einer Batterie.", "zh": "这种滑板车靠电动机驱动，", "start": 348.12, "end": 353.8}, {"de": "Vor allem junge Menschen fahren E-Scooter.", "zh": "电来自电池。", "start": 354.04, "end": 356.72}, {"de": "Aber E-Scooter können gefährlich sein.", "zh": "主要是年轻人在骑。", "start": 356.76, "end": 359.4}, {"de": "Es gibt sehr viele Unfälle mit E-Scootern.", "zh": "但 E-Scooter 可能很危险，", "start": 359.48, "end": 362.12}, {"de": "Viele Fahrer von E-Scootern tragen nämlich keinen Helm auf dem Kopf.", "zh": "事故非常多。", "start": 362.16, "end": 366.72}, {"de": "E-Scooter fahren und einen Helm auf dem Kopf tragen, ist sicherer.", "zh": "因为很多骑的人头上不戴头盔。", "start": 367.28, "end": 371.92}, {"de": "Deshalb gibt es jetzt eine Diskussion über die Helmpflicht.", "zh": "骑 E-Scooter 时戴上头盔更安全。", "start": 372.52, "end": 376.68}, {"de": "Das heißt, sollen alle Fahrer mit dem E-Scooter einen Helm tragen müssen?", "zh": "因此现在有一场关于头盔强制令的讨论：所有骑 E-Scooter 的人都必须戴头盔吗？", "start": 377.2, "end": 382.04}]}, {"start": 382.08, "end": 422.8, "lines": [{"de": "Dazu kommt jetzt ein Film.", "zh": "（接下来是一段影片。", "start": 382.08, "end": 383.92}, {"de": "Viele Menschen finden E-Scooter praktisch.", "zh": "）很多人觉得 E-Scooter 很实用。", "start": 385.76, "end": 389.28}, {"de": "Aber bei manchen Fahrten mit dem E-Scooter gibt es einen Unfall.", "zh": "但有些骑行中会发生事故。", "start": 389.32, "end": 394.84}, {"de": "In diesem Krankenhaus arbeitet der Arzt Michael Zyskowski.", "zh": "医生米夏埃尔·济斯科夫斯基在这家医院工作，", "start": 395.44, "end": 400.0}, {"de": "Er behandelt viele Unfälle mit E-Scootern.", "zh": "他治疗过很多 E-Scooter 事故。", "start": 400.4, "end": 403.8}, {"de": "Der Arzt sagt, die Menschen haben Verletzungen am Kopf und am Gehirn.", "zh": "这位医生说，伤者头部和大脑受伤。", "start": 404.68, "end": 410.36}, {"de": "Wenn ein Knochen gebrochen ist, dann kann ich das operieren.", "zh": "如果骨头断了，我可以做手术。", "start": 410.4, "end": 415.16}, {"de": "Aber wenn das Gehirn verletzt ist, dann geht das nicht.", "zh": "但如果大脑受了伤，那就没办法了。", "start": 415.76, "end": 419.6}, {"de": "Ein Unfall kann sehr schlimme Folgen haben.", "zh": "一次事故可能造成非常严重的后果。", "start": 419.8, "end": 422.8}]}, {"start": 423.76, "end": 472.56, "lines": [{"de": "In einigen Ländern müssen alle Fahrer von E-Scootern einen Helm tragen.", "zh": "在一些国家，", "start": 423.76, "end": 428.76}, {"de": "In Deutschland nicht.", "zh": "所有骑 E-Scooter 的人都必须戴头盔。", "start": 428.84, "end": 430.44}, {"de": "Es gibt Firmen, die verleihen E-Scooter.", "zh": "德国没有这样的规定。", "start": 430.48, "end": 434.4}, {"de": "Diese Firmen wollen keine Helmpflicht.", "zh": "有些公司出租 E-Scooter，", "start": 434.84, "end": 437.96}, {"de": "Die Firmen sagen nämlich, eine Helmpflicht ist zu kompliziert.", "zh": "这些公司不想要头盔强制令。", "start": 438.4, "end": 443.36}, {"de": "Wir glauben, dann mieten weniger Menschen spontan einen E-Scooter.", "zh": "它们说，头盔强制令太麻烦了。我们相信，", "start": 443.84, "end": 448.76}, {"de": "Das ist schlecht fürs Geschäft.", "zh": "那样会更少有人临时起意租一辆 E-Scooter，", "start": 448.92, "end": 451.36}, {"de": "In dem Land Israel gibt es eine Helmpflicht.", "zh": "这对生意不利。在以色列有头盔强制令，", "start": 452.6, "end": 456.0}, {"de": "Dort mietet man einen E-Scooter und einen Helm dazu.", "zh": "租 E-Scooter 时会一并租到一个头盔。", "start": 456.04, "end": 460.4}, {"de": "Dieser Mann sagt, das Mieten geht einfach über eine App auf dem Smartphone.", "zh": "这位男士说，", "start": 460.96, "end": 467.04}, {"de": "Aber manchmal fehlt der Helm auch.", "zh": "租赁通过智能手机 App 就能完成。", "start": 467.08, "end": 469.64}, {"de": "Dann kann man nicht mit Helm fahren.", "zh": "但有时候头盔不在，那就只能不戴头盔骑了。", "start": 470.0, "end": 472.56}]}, {"start": 473.24, "end": 485.96, "lines": [{"de": "Der Arzt Michael Zyskowski meint, E-Scooter fahren mit Helm ist sicherer.", "zh": "医生济斯科夫斯基认为，戴头盔骑 E-Scooter 更安全。", "start": 473.24, "end": 479.36}, {"de": "Das müssen die Menschen verstehen.", "zh": "这一点人们必须明白。", "start": 479.76, "end": 482.08}, {"de": "Das Verstehen ist besser als eine Helmpflicht.", "zh": "明白这一点比一条头盔强制令更好。", "start": 482.12, "end": 485.96}]}], "vocab": [{"lemma": "der Unfall, Unfälle", "key": "unfall", "forms": ["Unfall", "Unfälle"], "pos": "", "zh": "事故", "example_de": "Es gibt sehr viele Unfälle mit E-Scootern.", "example_zh": ""}, {"lemma": "der Helm, -e", "key": "helm", "forms": ["Helm", "Helme"], "pos": "", "zh": "头盔", "example_de": "Viele Fahrer von E-Scootern tragen nämlich keinen Helm auf dem Kopf.", "example_zh": ""}, {"lemma": "die Helmpflicht", "key": "helmpflicht", "forms": ["Helmpflicht"], "pos": "", "zh": "头盔强制令", "example_de": "Deshalb gibt es jetzt eine Diskussion über die Helmpflicht.", "example_zh": ""}, {"lemma": "die
