    <script id="dd-data" type="application/json">{"page":"lesson","lesson":{"slug":"2026-10-14","date":"2026-10-14","show":"tagesschau in Einfacher Sprache","level":"A2–B1","kind":"broadcast","note":"","source_url":"https://www.tagesschau.de/tagesschau_in_einfacher_sprache/tse-1472.html","video":{"mp4":"https://tagesschau-progressive.ard-mcdn.de/video/2026/1014/TV-20261014-1739-1600.webl.h264.mp4","embed":"","page":"https://www.tagesschau.de/tagesschau_in_einfacher_sprache/video-1666160.html"},"duration":401.2,"sentences":[{"de":"Willkommen zur tagesschau in Einfacher Sprache.","zh":"欢迎收看简单语言版每日新闻。","start":10.52,"end":13.32},{"de":"Ich bin Susanne Holst und das sind unsere Nachrichten:","zh":"我是Susanne Holst，以下是我们的新闻：","start":13.72,"end":17.12},{"de":"Und nun zur ersten Nachricht:","zh":"现在来看第一条新闻：","start":34.16,"end":36.12},{"de":"Vor vier Jahren gab es einen Anschlag auf Pipelines in der Ostsee.","zh":"四年前，波罗的海中的管道发生了袭击事件。","start":41.92,"end":46.2},{"de":"Pipelines sind Leitungen für Öl oder Gas.","zh":"管道是输送石油或天然气的管线。","start":47.24,"end":50.32},{"de":"Die Pipelines von dem Anschlag sind für Gas und heißen Nord Stream.","zh":"遭到袭击的管道是输送天然气的，名叫北溪。","start":51.56,"end":56.04},{"de":"Ein Mann aus der Ukraine ist jetzt vor Gericht in der Stadt Hamburg, im Norden von Deutschland.","zh":"一名来自乌克兰的男子现在在德国北部城市汉堡受审。","start":57.48,"end":63.44},{"de":"Er ist auf dem Foto in der Mitte.","zh":"他在照片的中间。","start":63.64,"end":65.88},{"de":"Das Foto ist schon älter.","zh":"这张照片比较旧了。","start":66.2,"end":67.96},{"de":"Der Mann ist wohl der Chef von einer Gruppe.","zh":"这名男子可能是一个团伙的头目。","start":68.56,"end":71.4},{"de":"Sie hat den Anschlag wahrscheinlich gemacht.","zh":"这个团伙很可能实施了袭击。","start":71.88,"end":74.64},{"de":"Dazu zeigen wir jetzt einen Film.","zh":"接下来我们播放一段影片。","start":74.96,"end":77.16},{"de":"Das ist in der Ostsee vor vier Jahren.","zh":"这是四年前在波罗的海的情况。","start":77.92,"end":80.96},{"de":"Explosionen haben die Pipelines beschädigt.","zh":"爆炸损坏了这些管道。","start":81.72,"end":85.04},{"de":"Aus Löchern in den Pipelines ist Gas gekommen und hat diese Blasen gemacht.","zh":"气体从管道的洞中冒出，形成了这些气泡。","start":86.08,"end":91.52},{"de":"Die Pipelines haben Russland und Deutschland miteinander verbunden.","zh":"这些管道曾连接俄罗斯和德国。","start":92.96,"end":97.52},{"de":"Für das Gas hat Russland viel Geld bekommen.","zh":"俄罗斯曾通过这些天然气获得很多钱。","start":98.04,"end":101.04},{"de":"Die Menschen von dem Anschlag wollten:","zh":"发动袭击的人想要：","start":101.8,"end":104.2},{"de":"Dass Russland kein Gas mehr liefern kann und kein Geld mehr damit macht.","zh":"让俄罗斯无法再输送天然气，也无法再从中赚钱。","start":104.4,"end":109.68},{"de":"Das Geld nimmt Russland nämlich auch für den Krieg gegen die Ukraine.","zh":"因为俄罗斯也把这笔钱用于对乌克兰的战争。","start":111.56,"end":116.04},{"de":"Viele Journalisten sind zum Gericht gekommen.","zh":"许多记者来到了法庭。","start":117.84,"end":120.72},{"de":"Diese Frau vom Gericht sagt:","zh":"这位法院的工作人员说：","start":120.88,"end":122.76},{"de":"Mehr als 100 Journalisten sind gekommen, zum Beispiel aus der Ukraine, Russland, den USA und Frankreich.","zh":"超过100名记者来到了这里，例如来自乌克兰、俄罗斯、美国和法国的记者。","start":122.92,"end":130.88},{"de":"Jetzt steht ein Mann aus der Ukraine vor Gericht.","zh":"现在一名来自乌克兰的男子正在受审。","start":133.36,"end":136.48},{"de":"Sein Gesicht wird nicht gezeigt.","zh":"他的脸没有公开显示。","start":136.88,"end":139.12},{"de":"Er war Offizier beim ukrainischen Militär.","zh":"他曾是乌克兰军队的军官。","start":139.76,"end":142.8},{"de":"Dieser Journalist sagt:","zh":"这位记者说：","start":143.6,"end":145.28},{"de":"Der ukrainische Präsident sagt, ich habe nichts mit dem Anschlag zu tun.","zh":"乌克兰总统说，我和这次袭击没有任何关系。","start":145.52,"end":150.52},{"de":"Wir haben aber herausgefunden, wichtige ukrainische Politiker haben davon gewusst.","zh":"但我们发现，重要的乌克兰政治家曾知情。","start":150.84,"end":156.76},{"de":"Jetzt muss das Gericht herausfinden, ist der Mann aus der Ukraine schuldig?","zh":"现在法院必须查明：这名来自乌克兰的男子有罪吗？","start":158.68,"end":164.28},{"de":"Ist er für die Explosionen und die Zerstörung von den Pipelines verantwortlich?","zh":"他对这些爆炸和管道的破坏负有责任吗？","start":164.8,"end":170.16},{"de":"Das Urteil gibt es dann wahrscheinlich im nächsten Jahr.","zh":"判决可能要到明年才会作出。","start":171.08,"end":174.92},{"de":"Und nun zur nächsten Nachricht:","zh":"现在来看下一条新闻：","start":177.2,"end":179.24},{"de":"Der Mann auf dem Foto ist Papst Leo.","zh":"照片上的男子是教皇利奥。","start":182.64,"end":185.12},{"de":"Er ist der Chef von der katholischen Kirche auf der ganzen Welt.","zh":"他是全世界天主教会的领袖。","start":185.6,"end":189.64},{"de":"Papst Leo wurde operiert.","zh":"教皇利奥接受了手术。","start":189.8,"end":191.56},{"de":"Er hatte nämlich einen Knoten in der Lunge.","zh":"因为他的肺里有一个结节。","start":192.0,"end":194.8},{"de":"So ein Knoten kann gefährlich sein.","zh":"这样的结节可能是危险的。","start":195.28,"end":197.76},{"de":"Die Lungen braucht man nämlich zum Atmen.","zh":"因为肺是用来呼吸的。","start":198.4,"end":201.04},{"de":"Nach der Operation haben die Ärzte gesagt:","zh":"手术后医生们说：","start":201.44,"end":204.16},{"de":"Wir haben entdeckt, der Papst hat Lungenkrebs.","zh":"我们发现，教皇患有肺癌。","start":204.6,"end":207.64},{"de":"Wir haben den Knoten und einen Teil von der Lunge entfernt.","zh":"我们切除了结节和一部分肺。","start":208.72,"end":212.4},{"de":"Jetzt kommt ein Film dazu.","zh":"现在播放一段相关影片。","start":212.88,"end":214.56},{"de":"In diesem Krankenhaus war die Operation von Papst Leo.","zh":"教皇利奥的手术是在这家医院做的。","start":215.88,"end":219.96},{"de":"Es ist in der italienischen Hauptstadt Rom.","zh":"它位于意大利首都罗马。","start":221.32,"end":224.16},{"de":"Die Ärzte schreiben nach der Operation, dem Papst geht es gut.","zh":"手术后医生们写道，教皇的状况良好。","start":224.92,"end":229.2},{"de":"Es gibt aber noch mehr Untersuchungen.","zh":"但还需要做更多检查。","start":229.72,"end":232.12},{"de":"Dann überlegen wir, wie die Behandlung weitergeht.","zh":"然后我们会考虑如何继续治疗。","start":232.36,"end":235.84},{"de":"Viele Menschen machen sich jetzt große Sorgen um den Papst.","zh":"现在许多人为教皇非常担心。","start":236.8,"end":240.68},{"de":"Sie haben Kerzen zum Krankenhaus gebracht.","zh":"他们把蜡烛送到了医院。","start":241.6,"end":244.32},{"de":"Dieser Mann sagt, wir beten für den Papst.","zh":"这名男子说：我们为教皇祈祷。","start":245.16,"end":247.96},{"de":"Ich hoffe, dass alles gut wird.","zh":"我希望一切都会好起来。","start":248.72,"end":250.88},{"de":"Die Ärzte sind sehr gut.","zh":"医生们非常好。","start":251.48,"end":253.2},{"de":"Sie haben den Krebs früh entdeckt.","zh":"他们及早发现了癌症。","start":253.92,"end":256.32},{"de":"Deshalb denke ich, der Papst wird wieder gesund.","zh":"所以我认为，教皇会康复的。","start":257.28,"end":260.36},{"de":"Gott sei mit ihm.","zh":"愿上帝与他同在。","start":261.24,"end":262.68},{"de":"Papst Leo muss mindestens eine Woche im Krankenhaus bleiben.","zh":"教皇利奥必须住院至少一个星期。","start":263.32,"end":267.72},{"de":"Und nun zur nächsten Nachricht:","zh":"现在来看下一条新闻：","start":270.44,"end":272.44},{"de":"Eine Steuer ist Extrageld, das man zum normalen Preis dazu bezahlen muss.","zh":"税是在正常价格之外必须额外支付的钱。","start":276.96,"end":282.44},{"de":"Dieses Extrageld bekommt der Staat.","zh":"这笔额外的钱归国家所有。","start":283.44,"end":285.88},{"de":"Die Regierung will ein Gesetz zur Steuer für Zucker in Getränken machen.","zh":"政府想制定一项关于饮料糖税的法律。","start":286.96,"end":291.84},{"de":"Das bedeutet:","zh":"这意味着：","start":292.8,"end":294.04},{"de":"Wenn man zum Beispiel eine Cola mit Zucker kauft, dann kostet die Cola wahrscheinlich in Zukunft mehr.","zh":"比如，如果购买含糖的可乐，那么可乐将来可能会更贵。","start":294.36,"end":301.08},{"de":"Die Regierung sagt:","zh":"政府说：","start":301.76,"end":303.04},{"de":"Wir wollen das Extrageld den Krankenkassen geben.","zh":"我们想把这笔额外的钱给法定医疗保险机构。","start":303.32,"end":306.4},{"de":"Sie haben nämlich hohe Kosten.","zh":"因为它们的费用很高。","start":307.16,"end":309.2},{"de":"Und die Regierung sagt:","zh":"政府还说：","start":310.12,"end":311.68},{"de":"Wir hoffen, wenn Getränke mit Zucker teurer sind, dann trinken die Menschen weniger davon.","zh":"我们希望，如果含糖饮料变得更贵，人们就会少喝这些饮料。","start":311.84,"end":318.6},{"de":"Das ist wichtig für die Gesundheit.","zh":"这对健康很重要。","start":319.0,"end":321.28},{"de":"Zu viel Zucker ist nämlich ungesund.","zh":"因为过多的糖是不健康的。","start":321.4,"end":323.8},{"de":"Der Bundestag entscheidet dann darüber, ob das Gesetz zur Steuer für Zucker in Getränken kommt.","zh":"联邦议院将决定是否通过这项饮料糖税的法律。","start":324.36,"end":330.6},{"de":"Und nun zur nächsten Nachricht:","zh":"现在来看下一条新闻：","start":332.64,"end":334.64},{"de":"Die deutschen Fußballerinnen haben in der Stadt Bremen, im Norden von Deutschland, gegen das Team von Japan gespielt.","zh":"德国女足在德国北部城市不来梅与日本队进行了比赛。","start":339.92,"end":347.32},{"de":"Die Deutschen sind auf dem Foto und haben 2:1 gewonnen.","zh":"照片上的是德国队，她们以2比1获胜。","start":347.88,"end":351.72},{"de":"Es war ein Testspiel.","zh":"这是一场测试赛。","start":352.76,"end":354.44},{"de":"Die deutschen Fußballerinnen haben sich damit auf die Weltmeisterschaft im nächsten Jahr vorbereitet.","zh":"德国女足借此为明年的世界杯做准备。","start":354.88,"end":361.12},{"de":"Und das waren unsere Nachrichten:","zh":"以上是我们的新闻：","start":361.88,"end":364.08},{"de":"Und jetzt kommt das Wetter:","zh":"现在来看天气：","start":380.96,"end":382.8},{"de":"In der Mitte von Deutschland und unten im Süden gibt es Nebel.","zh":"德国中部和南部下方有雾。","start":383.48,"end":387.36},{"de":"Sonst scheint überall die Sonne.","zh":"其他地方到处都是晴天。","start":387.48,"end":389.52},{"de":"Es gibt nur wenige Wolken.","zh":"只有少量的云。","start":389.76,"end":391.48},{"de":"Es werden 12 bis 22 Grad.","zh":"气温是12到22度。","start":391.84,"end":393.88},{"de":"Und das war die tagesschau in Einfacher Sprache.","zh":"以上就是简单语言版每日新闻。","start":396.04,"end":398.96},{"de":"Tschüss, bis zum nächsten Mal.","zh":"再见，下次见。","start":399.16,"end":401.2}],"stories":[{"title":"Begrüßung","title_zh":"欢迎","from":0,"to":2,"vocab":[],"grammar":[],"background":""},{"title":"Anschlag auf Pipelines: Mann ist vor Gericht","title_zh":"管道袭击事件：男子受审","from":3,"to":31,"vocab":[{"key":"anschlag","lemma":"der Anschlag, ¨-e","pos":"Substantiv","zh":"袭击","example_de":"Vor vier Jahren gab es einen Anschlag auf Pipelines in der Ostsee.","example_zh":"四年前，波罗的海中的管道发生了袭击事件。"},{"key":"pipeline","lemma":"die Pipeline, -s",
