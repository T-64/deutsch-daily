    <script id="dd-data" type="application/json">{"page":"lesson","lesson":{"slug":"2026-10-14","date":"2026-10-14","show":"tagesschau in Einfacher Sprache","level":"A2–B1","kind":"reading","note":"","source_url":"https://www.tagesschau.de/tagesschau_in_einfacher_sprache/tse-1472.html","video":{"mp4":"https://tagesschau-progressive.ard-mcdn.de/video/2026/1014/TV-20261014-1739-1600.webl.h264.mp4","embed":"","page":"https://www.tagesschau.de/tagesschau_in_einfacher_sprache/video-1666160.html"},"duration":401.2,"sentences":[{"de":"Willkommen zur tagesschau in Einfacher Sprache.","zh":"","start":10.52,"end":13.32},{"de":"Ich bin Susanne Holst und das sind unsere Nachrichten:","zh":"","start":13.72,"end":17.12},{"de":"Und nun zur ersten Nachricht:","zh":"","start":34.16,"end":36.12},{"de":"Vor vier Jahren gab es einen Anschlag auf Pipelines in der Ostsee.","zh":"","start":41.92,"end":46.2},{"de":"Pipelines sind Leitungen für Öl oder Gas.","zh":"","start":47.24,"end":50.32},{"de":"Die Pipelines von dem Anschlag sind für Gas und heißen Nord Stream.","zh":"","start":51.56,"end":56.04},{"de":"Ein Mann aus der Ukraine ist jetzt vor Gericht in der Stadt Hamburg, im Norden von Deutschland.","zh":"","start":57.48,"end":63.44},{"de":"Er ist auf dem Foto in der Mitte.","zh":"","start":63.64,"end":65.88},{"de":"Das Foto ist schon älter.","zh":"","start":66.2,"end":67.96},{"de":"Der Mann ist wohl der Chef von einer Gruppe.","zh":"","start":68.56,"end":71.4},{"de":"Sie hat den Anschlag wahrscheinlich gemacht.","zh":"","start":71.88,"end":74.64},{"de":"Dazu zeigen wir jetzt einen Film.","zh":"","start":74.96,"end":77.16},{"de":"Das ist in der Ostsee vor vier Jahren.","zh":"","start":77.92,"end":80.96},{"de":"Explosionen haben die Pipelines beschädigt.","zh":"","start":81.72,"end":85.04},{"de":"Aus Löchern in den Pipelines ist Gas gekommen und hat diese Blasen gemacht.","zh":"","start":86.08,"end":91.52},{"de":"Die Pipelines haben Russland und Deutschland miteinander verbunden.","zh":"","start":92.96,"end":97.52},{"de":"Für das Gas hat Russland viel Geld bekommen.","zh":"","start":98.04,"end":101.04},{"de":"Die Menschen von dem Anschlag wollten:","zh":"","start":101.8,"end":104.2},{"de":"Dass Russland kein Gas mehr liefern kann und kein Geld mehr damit macht.","zh":"","start":104.4,"end":109.68},{"de":"Das Geld nimmt Russland nämlich auch für den Krieg gegen die Ukraine.","zh":"","start":111.56,"end":116.04},{"de":"Viele Journalisten sind zum Gericht gekommen.","zh":"","start":117.84,"end":120.72},{"de":"Diese Frau vom Gericht sagt:","zh":"","start":120.88,"end":122.76},{"de":"Mehr als 100 Journalisten sind gekommen, zum Beispiel aus der Ukraine, Russland, den USA und Frankreich.","zh":"","start":122.92,"end":130.88},{"de":"Jetzt steht ein Mann aus der Ukraine vor Gericht.","zh":"","start":133.36,"end":136.48},{"de":"Sein Gesicht wird nicht gezeigt.","zh":"","start":136.88,"end":139.12},{"de":"Er war Offizier beim ukrainischen Militär.","zh":"","start":139.76,"end":142.8},{"de":"Dieser Journalist sagt:","zh":"","start":143.6,"end":145.28},{"de":"Der ukrainische Präsident sagt, ich habe nichts mit dem Anschlag zu tun.","zh":"","start":145.52,"end":150.52},{"de":"Wir haben aber herausgefunden, wichtige ukrainische Politiker haben davon gewusst.","zh":"","start":150.84,"end":156.76},{"de":"Jetzt muss das Gericht herausfinden, ist der Mann aus der Ukraine schuldig?","zh":"","start":158.68,"end":164.28},{"de":"Ist er für die Explosionen und die Zerstörung von den Pipelines verantwortlich?","zh":"","start":164.8,"end":170.16},{"de":"Das Urteil gibt es dann wahrscheinlich im nächsten Jahr.","zh":"","start":171.08,"end":174.92},{"de":"Und nun zur nächsten Nachricht:","zh":"","start":177.2,"end":179.24},{"de":"Der Mann auf dem Foto ist Papst Leo.","zh":"","start":182.64,"end":185.12},{"de":"Er ist der Chef von der katholischen Kirche auf der ganzen Welt.","zh":"","start":185.6,"end":189.64},{"de":"Papst Leo wurde operiert.","zh":"","start":189.8,"end":191.56},{"de":"Er hatte nämlich einen Knoten in der Lunge.","zh":"","start":192.0,"end":194.8},{"de":"So ein Knoten kann gefährlich sein.","zh":"","start":195.28,"end":197.76},{"de":"Die Lungen braucht man nämlich zum Atmen.","zh":"","start":198.4,"end":201.04},{"de":"Nach der Operation haben die Ärzte gesagt:","zh":"","start":201.44,"end":204.16},{"de":"Wir haben entdeckt, der Papst hat Lungenkrebs.","zh":"","start":204.6,"end":207.64},{"de":"Wir haben den Knoten und einen Teil von der Lunge entfernt.","zh":"","start":208.72,"end":212.4},{"de":"Jetzt kommt ein Film dazu.","zh":"","start":212.88,"end":214.56},{"de":"In diesem Krankenhaus war die Operation von Papst Leo.","zh":"","start":215.88,"end":219.96},{"de":"Es ist in der italienischen Hauptstadt Rom.","zh":"","start":221.32,"end":224.16},{"de":"Die Ärzte schreiben nach der Operation, dem Papst geht es gut.","zh":"","start":224.92,"end":229.2},{"de":"Es gibt aber noch mehr Untersuchungen.","zh":"","start":229.72,"end":232.12},{"de":"Dann überlegen wir, wie die Behandlung weitergeht.","zh":"","start":232.36,"end":235.84},{"de":"Viele Menschen machen sich jetzt große Sorgen um den Papst.","zh":"","start":236.8,"end":240.68},{"de":"Sie haben Kerzen zum Krankenhaus gebracht.","zh":"","start":241.6,"end":244.32},{"de":"Dieser Mann sagt, wir beten für den Papst.","zh":"","start":245.16,"end":247.96},{"de":"Ich hoffe, dass alles gut wird.","zh":"","start":248.72,"end":250.88},{"de":"Die Ärzte sind sehr gut.","zh":"","start":251.48,"end":253.2},{"de":"Sie haben den Krebs früh entdeckt.","zh":"","start":253.92,"end":256.32},{"de":"Deshalb denke ich, der Papst wird wieder gesund.","zh":"","start":257.28,"end":260.36},{"de":"Gott sei mit ihm.","zh":"","start":261.24,"end":262.68},{"de":"Papst Leo muss mindestens eine Woche im Krankenhaus bleiben.","zh":"","start":263.32,"end":267.72},{"de":"Und nun zur nächsten Nachricht:","zh":"","start":270.44,"end":272.44},{"de":"Eine Steuer ist Extrageld, das man zum normalen Preis dazu bezahlen muss.","zh":"","start":276.96,"end":282.44},{"de":"Dieses Extrageld bekommt der Staat.","zh":"","start":283.44,"end":285.88},{"de":"Die Regierung will ein Gesetz zur Steuer für Zucker in Getränken machen.","zh":"","start":286.96,"end":291.84},{"de":"Das bedeutet:","zh":"","start":292.8,"end":294.04},{"de":"Wenn man zum Beispiel eine Cola mit Zucker kauft, dann kostet die Cola wahrscheinlich in Zukunft mehr.","zh":"","start":294.36,"end":301.08},{"de":"Die Regierung sagt:","zh":"","start":301.76,"end":303.04},{"de":"Wir wollen das Extrageld den Krankenkassen geben.","zh":"","start":303.32,"end":306.4},{"de":"Sie haben nämlich hohe Kosten.","zh":"","start":307.16,"end":309.2},{"de":"Und die Regierung sagt:","zh":"","start":310.12,"end":311.68},{"de":"Wir hoffen, wenn Getränke mit Zucker teurer sind, dann trinken die Menschen weniger davon.","zh":"","start":311.84,"end":318.6},{"de":"Das ist wichtig für die Gesundheit.","zh":"","start":319.0,"end":321.28},{"de":"Zu viel Zucker ist nämlich ungesund.","zh":"","start":321.4,"end":323.8},{"de":"Der Bundestag entscheidet dann darüber, ob das Gesetz zur Steuer für Zucker in Getränken kommt.","zh":"","start":324.36,"end":330.6},{"de":"Und nun zur nächsten Nachricht:","zh":"","start":332.64,"end":334.64},{"de":"Die deutschen Fußballerinnen haben in der Stadt Bremen, im Norden von Deutschland, gegen das Team von Japan gespielt.","zh":"","start":339.92,"end":347.32},{"de":"Die Deutschen sind auf dem Foto und haben 2:1 gewonnen.","zh":"","start":347.88,"end":351.72},{"de":"Es war ein Testspiel.","zh":"","start":352.76,"end":354.44},{"de":"Die deutschen Fußballerinnen haben sich damit auf die Weltmeisterschaft im nächsten Jahr vorbereitet.","zh":"","start":354.88,"end":361.12},{"de":"Und das waren unsere Nachrichten:","zh":"","start":361.88,"end":364.08},{"de":"Und jetzt kommt das Wetter:","zh":"","start":380.96,"end":382.8},{"de":"In der Mitte von Deutschland und unten im Süden gibt es Nebel.","zh":"","start":383.48,"end":387.36},{"de":"Sonst scheint überall die Sonne.","zh":"","start":387.48,"end":389.52},{"de":"Es gibt nur wenige Wolken.","zh":"","start":389.76,"end":391.48},{"de":"Es werden 12 bis 22 Grad.","zh":"","start":391.84,"end":393.88},{"de":"Und das war die tagesschau in Einfacher Sprache.","zh":"","start":396.04,"end":398.96},{"de":"Tschüss, bis zum nächsten Mal.","zh":"","start":399.16,"end":401.2}],"stories":[{"title":"Die Sendung","title_zh":"因管道袭击案男子受审 · 教宗利奥患肺癌 · 政府计划对含糖饮料征税","from":0,"to":83,"vocab":[{"key":"gericht","lemma":"das Gericht, -e","pos":"Substantiv","zh":"法院","example_de":"Ein Mann aus der Ukraine ist jetzt vor Gericht in der Stadt Hamburg, im Norden von Deutschland.","example_zh":""},{"key":"pipeline","lemma":"die Pipeline, -s","pos":"Substantiv","zh":"管道","example_de":"Vor vier Jahren gab es einen Anschlag auf Pipelines in der Ostsee.","example_zh":""},{"key":"explosion","lemma":"die Explosion, -en","pos":"Substantiv","zh":"爆炸","example_de":"Explosionen haben die Pipelines beschädigt.","example_zh":""},{"key":"schuldig","lemma":"schuldig","pos":"Adjektiv","zh":"有罪的","example_de":"Jetzt muss das Gericht herausfinden, ist der Mann aus der Ukraine schuldig?","example_zh":""},{"key":"herausfinden","lemma":"herausfinden","pos":"Verb","zh":"查明","example_de":"Jetzt muss das Gericht herausfinden, ist der Mann aus der Ukraine schuldig?","example_zh":""},{"key":"lunge","lemma":"die Lunge, -n","pos":"Substantiv","zh":"肺","example_de":"Er hatte nämlich einen Knoten in der Lunge.","example_zh":""},{"key":"operation","lemma":"die Operation, -en","pos":"Substantiv","zh":"手术","example_de":"Papst Leo wurde operiert.","example_zh":""},{"key":"entfernen","lemma":"entfernen","pos":"Verb","zh":"切除、移除","example_de":"Wir haben den Knoten und einen Teil von der Lunge entfernt.","example_zh":""},{"key":"arzt","lemma":"der Arzt, ¨-e","pos":"Substantiv","zh":"医生","example_de":"Nach der Operation haben die Ärzte gesagt:","example_zh":""},{"key":"knoten","lemma":"der Knoten, -
