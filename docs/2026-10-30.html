    <script id="dd-data" type="application/json">{"page":"lesson","lesson":{"slug":"2026-10-30","date":"2026-10-30","show":"tagesschau in Einfacher Sprache","level":"A2–B1","kind":"broadcast","note":"","source_url":"https://www.tagesschau.de/tagesschau_in_einfacher_sprache/tse-1484.html","video":{"mp4":"https://tagesschau-progressive.ard-mcdn.de/video/2026/1030/TV-20261030-1739-1000.webl.h264.mp4","embed":"","page":"https://www.tagesschau.de/tagesschau_in_einfacher_sprache/video-1675268.html"},"duration":390.72,"sentences":[{"de":"Willkommen zur tagesschau in Einfacher Sprache.","zh":"欢迎收看简易德语每日新闻。","start":10.48,"end":13.52},{"de":"Ich bin Susanne Holst und das sind unsere Nachrichten:","zh":"我是苏珊娜·霍尔斯特，以下是我们的新闻：","start":13.6,"end":16.88},{"de":"Und nun zur ersten Nachricht.","zh":"现在来看第一条新闻。","start":33.44,"end":35.44},{"de":"In Israel hat es eine Wahl gegeben.","zh":"以色列举行了一场选举。","start":40.64,"end":43.16},{"de":"Die Menschen dort haben ein neues Parlament gewählt.","zh":"那里的人们选出了新的议会。","start":43.68,"end":47.32},{"de":"Jetzt sind alle Stimmen ausgezählt.","zh":"现在所有选票都已统计完毕。","start":47.88,"end":50.4},{"de":"Die meisten Stimmen hat die Partei Likud bekommen.","zh":"利库德集团获得的选票最多。","start":51.04,"end":54.24},{"de":"Der Chef von der Regierung, Benjamin Netanjahu, ist von der Likud-Partei.","zh":"政府首脑本雅明·内塔尼亚胡来自利库德党。","start":54.96,"end":60.64},{"de":"Aber ob Netanyahu Chef bleiben kann, ist nicht sicher.","zh":"但内塔尼亚胡能否继续担任首脑，还不确定。","start":61.36,"end":65.16},{"de":"Seine Partei muss andere Parteien für eine Koalition finden.","zh":"他的政党必须找到其他政党组成联合政府。","start":65.64,"end":70.08},{"de":"Alleine regieren kann die Likud nämlich nicht.","zh":"因为利库德无法单独执政。","start":70.92,"end":74.12},{"de":"Aber auch Gadi Eisenkot von der Partei Yashar will Chef von der Regierung werden.","zh":"但“诚实”党的加迪·艾森科特也想成为政府首脑。","start":74.88,"end":80.32},{"de":"Bis es eine neue Regierung in Israel gibt, könnte es deshalb lange dauern.","zh":"因此，以色列成立新政府可能需要很长时间。","start":81.24,"end":86.44},{"de":"Dazu zeigen wir jetzt einen Film.","zh":"现在我们来看一段影片。","start":86.96,"end":89.32},{"de":"Mehrere Tage haben die Helfer die Stimmen gezählt.","zh":"工作人员花了几天时间统计选票。","start":90.56,"end":94.08},{"de":"Das Ergebnis: Es gibt keinen klaren Gewinner.","zh":"结果是：没有明显的赢家。","start":95.08,"end":98.52},{"de":"Netanjahu und die Likud-Partei haben die meisten Stimmen.","zh":"内塔尼亚胡和利库德党获得了最多的选票。","start":100.16,"end":104.16},{"de":"Aber es reicht nicht zum Regieren.","zh":"但这不足以执政。","start":105.52,"end":107.96},{"de":"Eisenkot und die Yashar-Partei sind auf dem zweiten Platz.","zh":"艾森科特和“诚实”党位居第二。","start":109.48,"end":113.56},{"de":"Das reicht auch nicht zum Regieren.","zh":"这也不足以执政。","start":114.6,"end":117.12},{"de":"Beide Parteien müssen mit anderen Parteien reden und fragen: Wollt ihr bei der Regierung mitmachen?","zh":"两个政党都必须与其他政党商谈，问：你们想参与执政吗？","start":118.52,"end":125.68},{"de":"Der Präsident von Israel, Isaac Herzog, muss jetzt entscheiden:","zh":"以色列总统伊萨克·赫尔佐格现在必须决定：","start":126.84,"end":131.28},{"de":"Wer darf mit den Gesprächen anfangen.","zh":"谁可以开始组阁谈判。","start":131.76,"end":134.4},{"de":"Netanjahu oder Eisenkot?","zh":"是内塔尼亚胡还是艾森科特？","start":134.92,"end":136.92},{"de":"Eisenkot könnte dann auch mit den arabischen Parteien reden.","zh":"艾森科特之后也可以与阿拉伯政党谈判。","start":138.56,"end":142.76},{"de":"Diese Parteien kümmern sich um die Interessen von arabischen Menschen.","zh":"这些政党关心阿拉伯人的利益。","start":143.48,"end":148.04},{"de":"Das sind zum Beispiel Palästinenser.","zh":"比如巴勒斯坦人。","start":148.4,"end":150.96},{"de":"Netanjahu will nicht mit den arabischen Parteien reden.","zh":"内塔尼亚胡不想与阿拉伯政党谈判。","start":152.52,"end":156.36},{"de":"Er sagt sogar:","zh":"他甚至说：","start":157.08,"end":158.28},{"de":"die arabischen Parteien haben zu viele Stimmen bekommen.","zh":"阿拉伯政党获得了太多选票。","start":158.76,"end":162.6},{"de":"Das war bestimmt Betrug.","zh":"那一定是舞弊。","start":162.68,"end":164.6},{"de":"Wie es jetzt in Israel weitergeht, weiß noch niemand.","zh":"以色列接下来会怎样，目前没有人知道。","start":166.48,"end":170.2},{"de":"Es gibt viele Möglichkeiten.","zh":"有很多种可能性。","start":171.28,"end":173.28},{"de":"Wenn sich die Parteien nicht einig werden, dann gibt es vielleicht sogar neue Wahlen.","zh":"如果各政党无法达成一致，甚至可能重新选举。","start":173.72,"end":179.92},{"de":"Und nun zur nächsten Nachricht.","zh":"现在来看下一条新闻。","start":182.16,"end":184.36},{"de":"In Italien sind die Menschen unzufrieden.","zh":"在意大利，人们感到不满。","start":188.76,"end":191.6},{"de":"Sie sagen:","zh":"他们说：","start":192.24,"end":193.44},{"de":"Die Mieten sind zu teuer, Schulen sind kaputt.","zh":"房租太贵，学校破旧不堪。","start":193.52,"end":196.72},{"de":"Wir verdienen nicht genug Geld.","zh":"我们挣的钱不够。","start":197.12,"end":199.32},{"de":"Deshalb gab es jetzt in vielen italienischen Städten Proteste.","zh":"因此，现在意大利许多城市发生了抗议活动。","start":200.04,"end":204.2},{"de":"Viele Menschen sind auf die Straßen gegangen.","zh":"许多人走上街头。","start":205.32,"end":208.48},{"de":"Dazu zeigen wir jetzt einen Film.","zh":"现在我们来看一段影片。","start":208.64,"end":211.0},{"de":"Auch in der Stadt Rom waren viele Menschen auf der Straße.","zh":"在罗马也有很多人走上街头。","start":212.04,"end":216.12},{"de":"Vor allem junge Menschen.","zh":"尤其是年轻人。","start":216.48,"end":218.28},{"de":"Dieser Mann sagt: Alles ist viel zu teuer.","zh":"这位男士说：一切都太贵了。","start":219.16,"end":222.08},{"de":"Und die Regierung macht nichts dagegen.","zh":"而政府对此什么也不做。","start":222.52,"end":224.88},{"de":"Diese Frau sagt:","zh":"这位女士说：","start":225.88,"end":227.16},{"de":"Krankenhäuser haben nicht genug Geld.","zh":"医院没有足够的钱。","start":227.32,"end":229.96},{"de":"Schulen und Universitäten gehen kaputt.","zh":"学校和大学越来越破败。","start":230.56,"end":233.28},{"de":"Das erschreckt mich.","zh":"这让我感到震惊。","start":233.56,"end":235.0},{"de":"Die Regierung in Italien hat jetzt versprochen:","zh":"意大利政府现在承诺：","start":236.24,"end":239.52},{"de":"Wir machen es besser.","zh":"我们会改善这一切。","start":239.64,"end":241.16},{"de":"Die Chefin von der Regierung, Giorgia Meloni, sagt, junge Menschen sollen günstiger wohnen können.","zh":"政府首脑焦尔吉娅·梅洛尼说，年轻人应该能住得更便宜。","start":242.16,"end":249.4},{"de":"Das müssen wir machen, damit junge Menschen nicht aus Italien weggehen.","zh":"我们必须这样做，以免年轻人离开意大利。","start":249.56,"end":254.72},{"de":"Auch in anderen Ländern gibt es gerade Proteste.","zh":"其他国家目前也有抗议活动。","start":256.2,"end":259.56},{"de":"Zum Beispiel in Frankreich und Spanien.","zh":"比如在法国和西班牙。","start":259.84,"end":262.56},{"de":"Manchmal sogar mit Gewalt.","zh":"有时甚至发生暴力。","start":263.48,"end":265.56},{"de":"Auch in Deutschland sind Proteste angekündigt.","zh":"德国也宣布将有抗议活动。","start":267.32,"end":270.52},{"de":"Und nun zur nächsten Nachricht.","zh":"现在来看下一条新闻。","start":272.84,"end":275.04},{"de":"Auf dem Foto ist der Schauspieler Patrick Stewart.","zh":"照片上的是演员帕特里克·斯图尔特。","start":278.92,"end":282.44},{"de":"Auf der ganzen Welt sind jetzt Menschen traurig.","zh":"现在全世界的人都感到悲伤。","start":283.08,"end":286.08},{"de":"Patrick Stewart ist nämlich gestorben.","zh":"因为帕特里克·斯图尔特去世了。","start":286.32,"end":288.96},{"de":"Er wurde 86 Jahre alt.","zh":"他享年86岁。","start":289.4,"end":291.2},{"de":"Wir zeigen jetzt einige Bilder von ihm.","zh":"我们现在展示一些他的照片。","start":292.0,"end":294.48},{"de":"Stewart war sehr bekannt, weil er in Serien und Filmen mitgespielt hat.","zh":"斯图尔特非常有名，因为他参演过电视剧和电影。","start":294.88,"end":299.88},{"de":"Er war Captain Jean-Luc Picard in der Serie Star Trek.","zh":"他在电视剧《星际迷航》中扮演让-吕克·皮卡德舰长。","start":300.24,"end":304.32},{"de":"Und auch Professor Xavier in dem Film X-Men.","zh":"还在电影《X战警》中扮演X教授。","start":306.08,"end":309.16},{"de":"Stewart war auch Aktivist.","zh":"斯图尔特也是一名社会活动家。","start":310.4,"end":312.24},{"de":"Er hat anderen Menschen geholfen.","zh":"他帮助过其他人。","start":312.56,"end":314.72},{"de":"Zum Beispiel Frauen und Flüchtlingen.","zh":"比如女性和难民。","start":314.76,"end":317.16},{"de":"Und nun zur nächsten Nachricht.","zh":"现在来看下一条新闻。","start":319.4,"end":321.6},{"de":"Alexander Zverev ist ein deutscher Sportler.","zh":"亚历山大·兹维列夫是一名德国运动员。","start":326.04,"end":329.12},{"de":"Er spielt Tennis.","zh":"他打网球。","start":329.76,"end":330.96},{"de":"Zverev ist auf dem Foto.","zh":"照片上是兹维列夫。","start":331.2,"end":332.92},{"de":"Im Tennis gibt es eine Weltrangliste.","zh":"网球有一份世界排名。","start":333.96,"end":336.6},{"de":"Auf dieser Liste stehen die besten Spieler der Welt.","zh":"名单上列着世界上最优秀的选手。","start":337.68,"end":341.32},{"de":"Zverev ist jetzt auf dem ersten Platz.","zh":"兹维列夫现在排名第一。","start":341.64,"end":344.28},{"de":"Das heißt, er ist im Moment der beste Tennisspieler auf der Welt.","zh":"也就是说，他目前是世界上最好的网球选手。","start":345.16,"end":349.72},{"de":"Das waren unsere Nachrichten.","zh":"以上就是我们的新闻。","start":351.4,"end":353.48},{"de":"Und jetzt kommt das Wetter.","zh":"现在播报天气。","start":369.6,"end":371.52},{"de":"Meistens gibt es viele Wolken.","zh":"大部分地区多云。","start":372.44,"end":374.6},{"de":"Links im Osten auch Regen.","zh":"东边（图左）也有雨。","start":375.04,"end":376.88},{"de":"Und rechts im Südwesten scheint manchmal die Sonne.","zh":"西南边（图右）有时会出太阳。","start":377.64,"end":381.2},{"de":"Es werden 6 bis 13 Grad.","zh":"气温为6至13度。","start":381.92,"end":383.64},{"de":"Das war die tagesschau in Einfacher Sprache.","zh":"以上就是简易德语每日新闻。","start":386.04,"end":388.64},{"de":"Tschüss. Bis zum nächsten Mal.","zh":"再见，下次见。","start":388.72,"end":390.72}],"stories":[{"title":"Begrüßung","title_zh":"欢迎","from":0,"to":2,"vocab":[],"grammar":[],"background":""},{"title":"Ergebnis von der Wahl in Israel","title_zh":"以色列选举结果","from":3,"to":33,"vocab":[{"key":"wahl","lemma":"die Wahl, -en","pos":"Substantiv","zh":"选举","example_de":"In Israel hat es eine Wahl gegeben.","example_zh":"以色列举行了一场选举。"},{"key":"stimme","lemma":"die Stimme, -n","pos":"Substantiv","zh":"选票；声音","example_de":"Jetzt sind alle Stimmen ausgezählt.","example_zh":"现在所有选票都已统计完毕。"},{"key":"partei","lemma":"die Partei, -en","pos":"Substantiv","zh":"政党","example_de":"Die meisten Stimmen hat die Partei Likud bekommen.","example_zh":"利库德集团获得的选票最多。"},{"key":"regierung","lemma":"die Regierung, -en","pos":"Substant
