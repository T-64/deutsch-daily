<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Deutsch Daily — 2026-08-22</title>
<style>
  :root {
    --bg: #eef2f0;
    --surface: #ffffff;
    --surface-2: #f7f9f8;
    --ink: #172127;
    --ink-soft: #647077;
    --line: #dce4e1;
    --accent: #176b72;
    --accent-strong: #0d5057;
    --accent-soft: #dceeed;
    --warm: #d98f39;
    --warm-soft: #fff0d9;
    --zh: #5f696f;
    --danger: #b3493f;
    --shadow: 0 18px 50px rgba(20, 46, 47, .10);
    --shadow-soft: 0 8px 24px rgba(20, 46, 47, .07);
  }
  [data-theme="dark"] {
    --bg: #111719; --surface: #192124; --surface-2: #202a2d;
    --ink: #edf3f1; --ink-soft: #a9b7b8; --line: #344145;
    --accent: #75cbd0; --accent-strong: #99dfe2; --accent-soft: #223e40;
    --warm: #f0b35e; --warm-soft: #3b3022; --zh: #bac5c5;
    --shadow: 0 18px 50px rgba(0,0,0,.28); --shadow-soft: 0 8px 24px rgba(0,0,0,.22);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { scroll-behavior: smooth; scroll-padding-top: 90px; }
  body {
    min-height: 100vh; background: var(--bg); color: var(--ink);
    font: 16px/1.65 Inter, ui-sans-serif, system-ui, -apple-system, "Noto Sans SC", sans-serif;
    transition: background .2s, color .2s;
  }
  button, input, textarea { font: inherit; }
  button, a { -webkit-tap-highlight-color: transparent; }
  button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible {
    outline: 3px solid color-mix(in srgb, var(--accent) 35%, transparent); outline-offset: 2px;
  }
  .app { width: min(1280px, calc(100% - 48px)); margin: 0 auto; padding: 24px 0 100px; }
  .topbar {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    min-height: 42px; margin-bottom: 34px;
  }
  .brand {
    display: inline-flex; align-items: center; gap: 10px; color: var(--ink);
    font-weight: 800; letter-spacing: -.02em; text-decoration: none;
  }
  .brand-mark {
    display: grid; place-items: center; width: 30px; height: 30px; border-radius: 9px;
    background: var(--accent); color: #fff; font: 800 12px/1 ui-monospace, monospace;
  }
  .top-actions { display: flex; align-items: center; gap: 8px; }
  .icon-btn, .archive-link, .text-btn {
    min-height: 38px; border: 1px solid var(--line); border-radius: 12px;
    background: var(--surface); color: var(--ink-soft); cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; text-decoration: none;
  }
  .icon-btn { width: 38px; }
  .archive-link, .text-btn { gap: 7px; padding: 0 13px; font-size: 13px; font-weight: 700; }
  .hero { margin-bottom: 26px; }
  .eyebrow {
    color: var(--accent); font-size: 12px; font-weight: 800; letter-spacing: .12em;
    text-transform: uppercase; margin-bottom: 9px;
  }
  .hero h1 {
    max-width: 720px; font: 750 clamp(29px, 4vw, 50px)/1.08 ui-serif, Georgia, serif;
    letter-spacing: -.04em;
  }
  .hero-meta { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 13px; color: var(--ink-soft); font-size: 14px; }
  .hero-meta span { display: inline-flex; align-items: center; gap: 7px; }

  .study-grid { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: clamp(20px, 3.2vw, 48px); align-items: start; }
  .side {
    position: sticky; top: 16px; max-height: calc(100vh - 24px);
    display: flex; flex-direction: column; min-height: 0;
  }
  .study-panel {
    display: flex; flex-direction: column; gap: 16px; min-height: 0; max-height: calc(100vh - 24px);
    background: transparent; border: 0; box-shadow: none; overflow: visible;
  }
  .video-card {
    position: relative; flex: 0 0 auto; overflow: hidden; background: #071012;
    border-radius: 24px; box-shadow: var(--shadow-soft);
  }
  .player { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #071012; }
  .player iframe, .player video { position: absolute; inset: 0; display: block; width: 100%; height: 100%; border: 0; background: #071012; }
  .video-drag {
    display: none; position: absolute; z-index: 3; top: 0; left: 0; right: 36px; height: 32px;
    cursor: grab; touch-action: none;
    background: linear-gradient(to bottom, rgba(0,0,0,.5), transparent);
  }
  .video-drag:active { cursor: grabbing; }
  .video-float-close {
    display: none; border: 0; background: rgba(255,255,255,.14); color: #fff;
    width: 28px; height: 28px; border-radius: 50%; cursor: pointer;
  }
  .rail {
    display: flex; flex-direction: column; flex: 1; min-height: 0;
    padding: 18px 18px 16px; border: 1px solid var(--line); border-radius: 24px;
    background: var(--surface); box-shadow: var(--shadow-soft); overflow: hidden;
  }
  .rail-bar { padding: 0 0 12px; }
  .controls { display: flex; width: 100%; }
  .controls button {
    flex: 1; min-height: 40px; padding: 0 14px; border: 1px solid var(--line); border-radius: 12px;
    background: var(--surface-2); color: var(--ink-soft); cursor: pointer; font-size: 14px; font-weight: 750;
  }
  .controls button.on { border-color: var(--accent); background: var(--accent); color: #fff; }
  .hero-meta a { color: var(--accent); text-decoration: none; font-weight: 700; }
  .hero-meta a:hover { text-decoration: underline; }
  .topic-nav { flex: 1; min-height: 0; overflow-y: auto; padding: 0; scrollbar-gutter: stable; }
  .topic { border-top: 1px solid var(--line); }
  .topic:first-child { border-top: 0; }
  .topic > a {
    display: grid; grid-template-columns: 32px minmax(0,1fr); gap: 10px; align-items: start;
    padding: 11px 0; color: var(--ink); text-decoration: none;
  }
  .topic > a span {
    min-width: 0; padding-top: 5px;
    font: 650 15px/1.35 ui-serif, Georgia, serif; letter-spacing: -.015em;
  }
  .topic > a:hover span { color: var(--accent); }
  .topic b {
    display: grid; place-items: center; width: 32px; height: 32px; border-radius: 10px;
    background: var(--accent-soft); color: var(--accent-strong);
    font: 800 11px/1 ui-monospace, monospace;
  }
  .topic.on b { background: var(--accent); color: #fff; }
  .topic.on > a span { color: var(--accent-strong); }
  .topic-study { display: none; padding: 0 0 12px; }
  .topic.on .topic-study { display: block; }
  .topic-study .empty-study { color: var(--ink-soft); font-size: 13px; padding: 6px 0; }
  .study-tabs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-top: 2px; }
  .study-tabs.n2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .study-tabs.n1 { grid-template-columns: 1fr; }
  .stab {
    min-height: 32px; padding: 0 6px; border: 1px solid var(--line); border-radius: 11px;
    background: var(--surface-2); color: var(--ink-soft); cursor: pointer;
    font-size: 12px; font-weight: 750;
  }
  .stab:hover { border-color: var(--accent); color: var(--accent-strong); }
  .stab.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-strong); }
  .spane { display: none; margin-top: 6px; }
  .spane.on { display: block; }
  .vrow {
    display: grid; grid-template-columns: minmax(0,1fr) 28px; gap: 8px; align-items: start;
    padding: 10px 0; border-top: 1px dashed var(--line);
  }
  .vrow .vw { color: var(--ink); font: 750 14.5px/1.35 ui-serif, Georgia, serif; }
  .vrow .vz { margin-top: 4px; color: var(--accent-strong); font-size: 13.5px; }
  .vrow .vex { margin-top: 6px; color: var(--ink-soft); font-size: 13px; font-style: italic; }
  .vadd {
    width: 28px; height: 28px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--surface); color: var(--accent-strong); cursor: pointer;
    font: 700 18px/1 ui-sans-serif, system-ui;
  }
  .vadd:hover { border-color: var(--accent); background: var(--accent-soft); }
  .rail-note { margin: 0; padding: 10px 0; color: var(--ink-soft); font-size: 13.5px; line-height: 1.7; }
  .rail-note + .rail-note { border-top: 1px dashed var(--line); }
  .rail-note strong { display: block; margin-bottom: 4px; color: var(--ink); font: 750 14.5px/1.35 ui-serif, Georgia, serif; }
  .rail-note i { display: block; margin-bottom: 6px; }
  @media (min-width: 841px) { .article-extras { display: none; } }

  .reader { min-width: 0; }
  .first-run {
    display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 16px; align-items: start;
    margin-bottom: 16px; padding: 16px 18px; border: 1px solid var(--line); border-radius: 16px;
    background: var(--accent-soft); color: var(--ink-soft); font-size: 13.5px;
  }
  .first-run[hidden] { display: none; }
  .first-run strong { display: block; margin-bottom: 3px; color: var(--accent-strong); }
  .first-run button { border: 0; background: transparent; color: var(--ink-soft); cursor: pointer; font-weight: 800; }
  .legend { color: var(--ink-soft); }
  article {
    scroll-margin-top: 24px; margin-bottom: 22px; padding: clamp(22px, 4vw, 38px);
    border: 1px solid var(--line); border-radius: 24px; background: var(--surface);
    box-shadow: var(--shadow-soft);
  }
  .n-head { display: grid; grid-template-columns: 42px minmax(0,1fr); gap: 13px; align-items: start; margin-bottom: 24px; }
  .n-idx {
    display: grid; place-items: center; width: 42px; height: 42px; border-radius: 13px;
    background: var(--accent-soft); color: var(--accent-strong); font: 800 13px/1 ui-monospace, monospace;
  }
  .n-head h2, .h-zh {
    padding-top: 3px;
    color: var(--ink);
    font: 750 clamp(21px, 3vw, 28px)/1.25 ui-serif, Georgia, "Noto Serif CJK SC", "Noto Serif SC", serif;
    letter-spacing: -.025em;
  }
  .h-zh { margin-top: 6px; padding-top: 0; }
  .para { display: flex; flex-direction: column; align-items: stretch; margin-bottom: 22px; }
  .para:last-child { margin-bottom: 8px; }
  .sent {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    width: 100%;
    min-width: 0;
    margin: 0 0 0.8em;
  }
  .sent[data-start] { cursor: pointer; }
  .de {
    max-width: 100%;
    font: var(--reader-size, 18.5px)/1.55 ui-serif, Georgia, "Noto Serif", serif;
    letter-spacing: .003em;
  }
  .de w {
    cursor: pointer; border-radius: 4px; transition: background .12s, color .12s;
    text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px;
    text-decoration-color: transparent;
  }
  .de w:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; background: var(--accent-soft); }
  .de w:hover, .de w:active { background: var(--warm-soft); text-decoration-color: var(--warm); }
  .de w.known { text-decoration-color: color-mix(in srgb, var(--accent) 55%, transparent); }
  .de w.ed { text-decoration-style: solid; text-decoration-thickness: 1.5px; }
  .de w.wiki { text-decoration-style: dotted; text-decoration-color: color-mix(in srgb, var(--ink-soft) 55%, transparent); }
  .de w.saved { color: var(--accent-strong); background: var(--accent-soft); text-decoration-color: transparent; }
  .sent.now .de {
    background: color-mix(in srgb, var(--accent-soft) 70%, transparent);
    border-radius: 4px;
  }
  .zh {
    margin-top: 3px;
    width: 100%;
    max-width: 100%;
    color: var(--ink);
    font: 400 15.5px/1.45 Inter, ui-sans-serif, "Noto Sans SC", sans-serif;
  }
  body.hide-zh .zh { display: none; }
  body.hide-zh .para { display: block; }
  body.hide-zh .sent { display: inline; width: auto; margin: 0 0.45em 0 0; }
  body.hide-zh .sent .de { display: inline; line-height: 1.82; }
  .n-head .h-zh {
    margin-top: 6px;
    padding-top: 0;
    color: var(--ink);
    font: 750 clamp(21px, 3vw, 28px)/1.25 ui-serif, Georgia, "Noto Serif CJK SC", "Noto Serif SC", serif;
    letter-spacing: -.025em;
  }
  .article-extras details { margin-top: 10px; border: 1px solid var(--line); border-radius: 13px; background: var(--surface-2); }
  .article-extras details summary {
    list-style: none; cursor: pointer; padding: 12px 14px; color: var(--ink-soft);
    display: flex; align-items: center; gap: 9px; font-size: 13px; font-weight: 750;
  }
  .article-extras details summary::before {
    content: "+"; display: inline-grid; place-items: center; width: 20px; height: 20px;
    border-radius: 7px; background: var(--surface); color: var(--accent); font-size: 14px;
  }
  .article-extras details[open] summary::before { content: "−"; }
  .article-extras details summary::-webkit-details-marker { display: none; }
  .article-extras details .body { padding: 2px 14px 15px 43px; color: var(--ink-soft); font-size: 13.5px; line-height: 1.75; }
  .article-extras details .body strong { color: var(--ink); }
  .vcard { display: grid; grid-template-columns: minmax(0,1fr) 28px; gap: 8px; align-items: start; padding: 10px 0; border-bottom: 1px dashed var(--line); }
  .vcard:last-child { border-bottom: 0; }
  .gcard { padding: 12px 0; border-bottom: 1px dashed var(--line); }
  .gcard:last-child { border-bottom: 0; }
  .vcard-top, .gcard h4 { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px; font: 750 14.5px/1.35 ui-serif, Georgia, serif; color: var(--ink); }
  .article-extras .vadd {
    width: 28px; height: 28px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--surface); color: var(--accent-strong); cursor: pointer;
    font: 700 18px/1 ui-sans-serif, system-ui;
  }
  .vpos { color: var(--ink-soft); font: 750 11px/1.2 ui-sans-serif, system-ui; letter-spacing: .06em; text-transform: uppercase; }
  .vzh { margin-top: 4px; color: var(--accent-strong); font-size: 13.5px; }
  .vex, .gex { margin-top: 6px; color: var(--ink-soft); font-size: 13px; font-style: italic; }
  .gexzh { color: var(--zh); font-size: 12.5px; }
  .gmore { margin-top: 8px; color: var(--ink-soft); font-size: 13px; }
  .bg-note { margin: 0 0 8px; color: var(--ink-soft); font-size: 12px; }

  .scrim { position: fixed; inset: 0; z-index: 55; display: none; background: rgba(7,16,18,.48); backdrop-filter: blur(3px); }
  .scrim.on { display: block; }
  #pop {
    position: fixed; z-index: 70; display: none; width: min(360px, calc(100vw - 24px));
    border: 1px solid var(--line); border-radius: 18px; padding: 18px;
    background: var(--surface); color: var(--ink); box-shadow: var(--shadow);
  }
  #pop.open { display: block; }
  .pop-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  #pop .pw { font: 750 21px/1.2 ui-serif, Georgia, serif; word-break: break-word; }
  #pop .pp { margin-top: 3px; color: var(--ink-soft); font-size: 11px; font-weight: 750; letter-spacing: .08em; text-transform: uppercase; }
  #pop .pclose { border: 0; background: var(--surface-2); color: var(--ink-soft); width: 30px; height: 30px; border-radius: 9px; cursor: pointer; }
  #pop .pz { margin-top: 12px; color: var(--accent-strong); font-weight: 700; }
  #pop .pz:empty::after { content: "还没有释义，你可以自己补充"; color: var(--ink-soft); font-weight: 400; }
  #pop .pe { margin-top: 9px; padding-top: 9px; border-top: 1px solid var(--line); color: var(--ink-soft); font-size: 12.5px; font-style: italic; }
  .pop-actions { display: flex; gap: 8px; margin-top: 14px; }
  .pbtn, .secondary-btn, .primary-btn {
    min-height: 40px; border-radius: 11px; padding: 0 13px; cursor: pointer; font-size: 13px; font-weight: 750;
  }
  .pbtn { flex: 1; border: 1px solid var(--accent); background: var(--accent); color: #fff; }
  .pbtn.in { border-color: var(--line); background: var(--surface-2); color: var(--ink-soft); }
  .secondary-btn { border: 1px solid var(--line); background: var(--surface); color: var(--ink-soft); }
  .primary-btn { border: 1px solid var(--accent); background: var(--accent); color: #fff; }
  .word-form { display: grid; gap: 11px; }
  .word-form label { display: grid; gap: 5px; color: var(--ink-soft); font-size: 12px; font-weight: 700; }
  .word-form input, .word-form textarea {
    width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px;
    background: var(--surface-2); color: var(--ink); resize: vertical;
  }
  .word-form textarea { min-height: 66px; }
  .form-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 3px; }

  #basket-btn {
    position: fixed; right: 22px; bottom: max(22px, env(safe-area-inset-bottom)); z-index: 45;
    display: inline-flex; align-items: center; gap: 9px; min-height: 48px; padding: 0 18px;
    border: 0; border-radius: 15px; background: var(--ink); color: var(--surface);
    box-shadow: var(--shadow); cursor: pointer; font-weight: 800;
  }
  #basket-btn .cnt { min-width: 23px; padding: 2px 7px; border-radius: 99px; background: var(--warm); color: #172127; font-size: 12px; }
  #basket {
    position: fixed; inset: 0 0 0 auto; z-index: 65; width: min(440px, 100vw);
    display: flex; flex-direction: column; padding: 24px 24px calc(24px + env(safe-area-inset-bottom));
    background: var(--surface); box-shadow: -20px 0 60px rgba(7,16,18,.18);
    transform: translateX(105%); transition: transform .22s ease;
  }
  #basket.open { transform: translateX(0); }
  #basket .bhead { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 16px; }
  #basket .bhead h3 { font-size: 22px; letter-spacing: -.02em; }
  #basket .bhead p { margin-top: 2px; color: var(--ink-soft); font-size: 12.5px; }
  #basket .bclose { border: 0; background: var(--surface-2); color: var(--ink-soft); width: 36px; height: 36px; border-radius: 11px; font-size: 20px; cursor: pointer; }
  .basket-add { width: 100%; margin-bottom: 12px; }
  #basket .blist { overflow-y: auto; flex: 1; padding-right: 4px; }
  .bitem { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 5px 10px; padding: 13px 0; border-bottom: 1px solid var(--line); }
  .bitem .bw { font: 750 16px/1.3 ui-serif, Georgia, serif; }
  .bitem .bz { grid-column: 1; color: var(--accent-strong); font-size: 13px; }
  .bitem .be { grid-column: 1; overflow: hidden; color: var(--ink-soft); font-size: 11.5px; text-overflow: ellipsis; white-space: nowrap; }
  .bitem-actions { grid-column: 2; grid-row: 1 / span 3; align-self: center; display: flex; gap: 3px; }
  .bitem-actions button { border: 0; background: transparent; color: var(--ink-soft); padding: 7px; cursor: pointer; font-size: 12px; }
  .bitem-actions .bx { color: var(--danger); }
  #basket .bfoot { display: flex; gap: 8px; margin-top: 14px; }
  #basket .bfoot button { flex: 1; }
  #basket .bfoot button:disabled { opacity: .5; cursor: wait; }
  #basket .bstatus { min-height: 18px; margin-top: 8px; color: var(--ink-soft); text-align: center; font-size: 12px; }
  .bempty { padding: 42px 14px; color: var(--ink-soft); text-align: center; font-size: 13px; }
  .bempty b { display: block; margin-bottom: 5px; color: var(--ink); font-size: 15px; }
  #word-editor {
    display: none; padding: 15px; margin-bottom: 12px; border: 1px solid var(--line);
    border-radius: 14px; background: var(--surface-2);
  }
  #word-editor.open { display: block; }
  #toast {
    position: fixed; left: 50%; bottom: 28px; z-index: 90; display: none;
    transform: translateX(-50%); padding: 10px 16px; border-radius: 12px;
    background: var(--ink); color: var(--surface); box-shadow: var(--shadow); font-size: 13px; font-weight: 700;
  }
  @media (max-width: 840px) {
    .app { width: min(100% - 28px, 720px); padding-top: 15px; padding-left: max(14px, env(safe-area-inset-left)); padding-right: max(14px, env(safe-area-inset-right)); }
    .topbar { margin-bottom: 24px; }
    .study-grid { display: block; }
    .side { position: static; max-height: none; margin-bottom: 18px; }
    .study-panel { display: contents; max-height: none; }
    .video-card { border-radius: 20px; box-shadow: var(--shadow); }
    .rail {
      position: sticky; top: env(safe-area-inset-top); z-index: 30; margin: 10px 0 18px; padding: 8px 12px;
      border-radius: 20px;
    }
    .rail-bar { padding: 0; }
    .topic-nav { display: none; }
    .video-card.floating {
      position: fixed; z-index: 48; top: 72px; right: 10px; left: auto; width: min(48vw, 210px);
      border: 1px solid rgba(255,255,255,.2); border-radius: 14px; box-shadow: 0 18px 45px rgba(0,0,0,.28);
    }
    .video-card.floating .video-drag { display: block; }
    .video-card.floating .video-float-close { display: block; position: absolute; z-index: 4; top: 6px; right: 6px; }
    .video-card.float-off { display: none; }
    article { border-radius: 20px; }
  }
  @media (max-width: 560px) {
    .app { width: 100%; padding: 12px 12px 88px; padding-left: max(12px, env(safe-area-inset-left)); padding-right: max(12px, env(safe-area-inset-right)); }
    .brand span:last-child { display: none; }
    .text-btn { padding: 0 10px; font-size: 12px; }
    .archive-link { width: 38px; padding: 0; font-size: 0; }
    .archive-link svg { width: 17px; }
    .hero { padding: 0 5px; margin-bottom: 18px; }
    .hero h1 { font-size: 30px; }

<script>
const DATA = {"date": "2026-08-22", "slug": "2026-08-22-20uhr", "source": "20uhr", "source_label": "T-64 · tagesschau 20:00 Uhr", "source_short": "20:00 Uhr", "video_page": "https://www.tagesschau.de/tagesschau_20_uhr/video-1635752.html", "embed_url": "https://www.tagesschau.de/tagesschau_20_uhr/video-1635752~player.html", "mp4_url": "https://tagesschau-progressive.ard-mcdn.de/video/2026/0822/TV-20260822-2038-4200.webl.h264.mp4", "duration": 947.48, "news": [{"title": "Wadephul verspricht weitere humanitäre Hilfe für die Ukraine", "title_zh": "瓦德福尔承诺向乌克兰提供进一步人道主义援助", "paras": [{"start": 4.4, "end": 51.2, "lines": [{"de": "Besuche in der Ukraine - für Politiker bringen sie eine ungewohnte Entschleunigung mit sich.", "zh": "访问乌克兰——对政治家来说，这带来一种不习惯的减速。", "start": 4.4, "end": 26.56}, {"de": "Die Anreise erfolgt meist per Zug, denn auch der Himmel ist Kriegsgebiet.", "zh": "前往当地大多坐火车，因为天空也是战区。", "start": 26.76, "end": 31.48}, {"de": "Das erlebte heute Bundesaußenminister Wadephul: Während seiner Visite in Kiew gab es Luftalarm.", "zh": "联邦外交部长瓦德福尔今天就经历了这一点：他在基辅访问期间响起了空袭警报。", "start": 31.56, "end": 37.8}, {"de": "In einem Vorort wurden zwei Menschen durch russische Raketen getötet.", "zh": "在一处郊区，两人被俄罗斯火箭弹炸死。", "start": 37.88, "end": 42.28}, {"de": "Wadephul versprach, bei den Bündnispartnern um größere Unterstützung zu werben.", "zh": "瓦德福尔承诺，将在盟友那里争取更大的支持。", "start": 42.36, "end": 47.08}, {"de": "Damit die Ukraine den russischen Angriffen mehr entgegensetzen kann.", "zh": "好让乌克兰能更多地抵御俄罗斯的进攻。", "start": 47.16, "end": 51.2}]}, {"start": 51.48, "end": 79.64, "lines": [{"de": "Mehr als zwei Meter Spannweite hat die russische Angriffsdrohne, die Außenminister Wadephul bei seinem Besuch begutachtet.", "zh": "这架俄罗斯攻击无人机翼展超过两米，外交部长瓦德福尔在参观时查看了它。", "start": 51.48, "end": 58.72}, {"de": "Ausgestellt vor dem Außenministerium in Kiew.", "zh": "它陈列在基辅外交部前。", "start": 58.84, "end": 61.4}, {"de": "Wadephul verspricht der Ukraine zusätzliche Millionenhilfen und bei Verbündeten weiter auf neue Luftabwehrwaffen zu drängen.", "zh": "瓦德福尔承诺向乌克兰提供追加的数百万援助，并继续向盟友施压争取新的防空武器。", "start": 61.48, "end": 69.48}, {"de": "Diese Gespräche, das habe ich mit allen Kollegen vereinbart, werde ich nächste Woche fortsetzen.", "zh": "这些会谈，我已经和所有同事约好了，下周我会继续推进。", "start": 69.92, "end": 76.16}, {"de": "Dafür sind die Eindrücke dieser Reise von großer Bedeutung.", "zh": "为此，这次行程的见闻意义重大。", "start": 76.24, "end": 79.64}]}, {"start": 79.84, "end": 103.2, "lines": [{"de": "Der ukrainische Außenminister Sybiha zeigt Wadephul auch ukrainische Innovationen wie Abfangdrohnen.", "zh": "乌克兰外长西比哈还向瓦德福尔展示了拦截无人机等乌克兰的创新成果，", "start": 79.84, "end": 85.8}, {"de": "Und kündigt Kooperationen mit deutschen Firmen an.", "zh": "并宣布与德国公司开展合作。给我们帮助最多的国家，", "start": 85.88, "end": 89.0}, {"de": "Es ist folgerichtig, dass das Land, das uns am meisten hilft, auch bei unserer Zusammenarbeit bei Sicherheit, Verteidigung und Wiederaufbau ganz vorne steht.", "zh": "在安全、防务与重建的合作中排在最前面，", "start": 91.28, "end": 101.24}, {"de": "All dies wird weiter ausgebaut.", "zh": "这是顺理成章的。这一切都将继续扩大。", "start": 101.32, "end": 103.2}]}, {"start": 105.28, "end": 133.44, "lines": [{"de": "Was russische Drohnenangriffe anrichten können, zeigte gestern der Beschuss eines Einkaufszentrums in Krywyj Rih: Laut ukrainischen Angaben wurden dabei mindestens 16 Menschen getötet, mehr als 130 verletzt – unter ihnen viele Kinder.", "zh": "昨天对克里维里赫一家购物中心的袭击显示了俄罗斯无人机袭击能造成什么：据乌克兰方面消息，袭击至少造成16人死亡、130多人受伤——其中有许多儿童。", "start": 105.28, "end": 123.32}, {"de": "Aber die Ukraine schlägt mit Drohnen zurück und hat dabei ein Warenlager eines Versandhändlers angegriffen.", "zh": "但乌克兰也用无人机回击，攻击了一家邮购商的货仓。", "start": 123.4, "end": 129.64}, {"de": "Laut russischen Behörden wurden dabei mehrere Menschen getötet.", "zh": "据俄罗斯当局消息，袭击造成多人死亡。", "start": 129.72, "end": 133.44}]}, {"start": 133.52, "end": 158.8, "lines": [{"de": "Später dankt der ukrainische Präsident Selenskyj Wadephul für die deutsche Hilfe – und den Besuch.", "zh": "晚些时候，乌克兰总统泽连斯基感谢瓦德福尔的德国援助——以及这次到访。", "start": 133.52, "end": 139.2}, {"de": "Das ist die Absicht meines Besuchs: Zu zeigen, dass Deutschland an der Seite der Ukraine steht.", "zh": "这就是我此行的目的：表明德国站在乌克兰一边。", "start": 139.96, "end": 145.92}, {"de": "Während des Treffens schlagen in einem Vorort von Kiew russische Raketen ein, töten mindestens zwei Menschen.", "zh": "会晤期间，火箭弹落入基辅一处郊区，至少炸死两人。", "start": 146.0, "end": 152.4}, {"de": "Der Luftabwehr fehlt die Munition, solche Angriffe abzuwehren – auch während hoher diplomatischer Besuche.", "zh": "防空部队缺乏拦截这类袭击的弹药——即便在高级别外交访问期间也是如此。", "start": 152.48, "end": 158.8}]}], "vocab": [{"lemma": "die Entschleunigung", "key": "entschleunigung", "forms": ["Entschleunigung"], "pos": "Substantiv", "zh": "减速，放慢节奏", "example_de": "Besuche in der Ukraine - für Politiker bringen sie eine ungewohnte Entschleunigung mit sich.", "example_zh": ""}, {"lemma": "die Visite, -n", "key": "visite", "forms": ["Visite"], "pos": "Substantiv", "zh": "（正式）探访，巡视", "example_de": "Das erlebte heute Bundesaußenminister Wadephul: Während seiner Visite in Kiew gab es Luftalarm.", "example_zh": ""}, {"lemma": "die Spannweite, -n", "key": "spannweite", "forms": ["Spannweite"], "pos": "Substantiv", "zh": "翼展；跨度", "example_de": "Mehr als zwei Meter Spannweite hat die russische Angriffsdrohne, die Außenminister Wadephul bei seinem Besuch begutachtet.", "example_zh": ""}, {"lemma": "die Abfangdrohne, -n", "key": "abfangdrohne", "forms": ["Abfangdrohnen", "Abfangdrohne"], "pos": "Substantiv", "zh": "拦截无人机", "example_de": "Der ukrainische Außenminister Sybiha zeigt Wadephul auch ukrainische Innovationen wie Abfangdrohnen.", "example_zh": ""}, {"lemma": "der Wiederaufbau", "key": "wiederaufbau", "forms": ["Wiederaufbau"], "pos": "Substantiv", "zh": "重建", "example_de": "Es ist folgerichtig, dass das Land, das uns am meisten hilft, auch bei unserer Zusammenarbeit bei Sicherheit, Verteidigung und Wiederaufbau ganz vorne steht.", "example_zh": ""}, {"lemma": "der Beschuss", "key": "beschuss", "forms": ["Beschuss"], "pos": "Substantiv", "zh": "炮击，射击", "example_de": "Was russische Drohnenangriffe anrichten können, zeigte gestern der Beschuss eines Einkaufszentrums in Krywyj Rih: Laut ukrainischen Angaben wurden dabei mindestens 16 Menschen getötet, mehr als 130 verletzt – unter ihnen viele Kinder.", "example_zh": ""}, {"lemma": "jemandem etw. entgegensetzen", "key": "entgegensetzen", "forms": ["entgegensetzen", "entgegensetzen kann", "jemandem etw. entgegensetzen"], "pos": "Redewendung", "zh": "以某物抵御/对付", "example_de": "Damit die Ukraine den russischen Angriffen mehr entgegensetzen kann.", "example_zh": ""}, {"lemma": "auf etw. (Akk.) drängen", "key": "draengen", "forms": ["drängen", "zu drängen", "auf etw."], "pos": "Verb", "zh": "敦促，力主争取某事", "example_de": "Wadephul verspricht der Ukraine zusätzliche Millionenhilfen und bei Verbündeten weiter auf neue Luftabwehrwaffen zu drängen.", "example_zh": ""}], "grammar_points": [{"title": "mit sich bringen — 反身代词 sich 指主语自己", "summary": "bringen etw. (Akk.) mit sich 意为带来某物，sich 与主语呼应（第四格），etw. 为直接宾语。可分前缀 mit 位于句尾。", "example_de": "für Politiker bringen sie eine ungewohnte Entschleunigung mit sich.", "example_zh": "对政治家来说，它们带来一种不习惯的减速。"}], "background": "2026年8月22日，德国外长约翰·瓦德福尔（CDU）访问基辅，会见乌克兰外长西比哈与总统泽连斯基。访问期间基辅郊外遭俄军火箭弹袭击，两人死亡。前一日克里维里赫一购物中心遭袭已致至少16死、130余伤，乌克兰则以无人机回击俄境内一处货仓。"}, {"title": "Deutschland und Polen stärken gemeinsam europäische Ostflanke", "title_zh": "德国与波兰共同加强欧洲东翼", "paras": [{"start": 159.96, "end": 186.84, "lines": [{"de": "Der Krieg in der Ukraine besorgt die Nachbarn im Westen.", "zh": "乌克兰战争让西边的邻国感到不安。", "start": 159.96, "end": 163.44}, {"de": "Immer wieder verletzen russische Flugkörper den Luftraum von NATO-Staaten.", "zh": "俄罗斯导弹一再侵犯北约国家的领空。", "start": 163.56, "end": 168.0}, {"de": "Deutschland und Polen stärken die europäische Ostflanke.", "zh": "德国和波兰正在加强欧洲东翼。", "start": 168.04, "end": 171.52}, {"de": "Polen grenzt an Kaliningrad und das mit Russland verbündete Belarus.", "zh": "波兰与加里宁格勒以及与俄罗斯结盟的白俄罗斯接壤。", "start": 171.6, "end": 176.32}, {"de": "Die Nord- und Ostgrenze Polens sollen mit einem neuen Verteidigungssystem gesichert werden.", "zh": "波兰的北部和东部边境将用一套新的防御体系来保障。", "start": 176.4, "end": 183.32}, {"de": "Am Aufbau sind auch Bundeswehrsoldaten beteiligt.", "zh": "联邦国防军士兵也参与建设。", "start": 183.72, "end": 186.84}]}, {"start": 189.6, "end": 221.88, "lines": [{"de": "Unterwegs mit der Bundeswehr in militärisches Sperrgebiet.", "zh": "随联邦国防军前往军事禁区。", "start": 189.6, "end": 192.96}, {"de": "Der Nordosten Polens, nah der russischen Grenze.", "zh": "波兰东北部，靠近俄罗斯边境。", "start": 193.16, "end": 196.24}, {"de": "Polnische und deutsche Soldaten zeigen, wie sie an der NATO-Ostflanke einen Schutzwall errichten.", "zh": "波兰和德国士兵展示他们如何在北约东翼修筑一道防护墙。", "start": 196.48, "end": 202.48}, {"de": "Wir bauen hier Befestigungsanlagen.", "zh": "我们在这里修筑防御工事。", "start": 203.76, "end": 206.8}, {"de": "Der Gegner blickt dann auf einen Panzergraben.", "zh": "敌方随后面对的是一道反坦克壕。", "start": 208.0, "end": 210.88}, {"de": "Dahinter kommt die erste Reihe der Stahlbetonigel.", "zh": "后面是第一排钢混凝土刺猬障碍。", "start": 210.96, "end": 214.64}, {"de": "Dann folgt eine freie Fläche für Minen.", "zh": "然后是一片布雷的空地。", "start": 214.96, "end": 217.76}, {"de": "Danach gibt es eine zweite Reihe aus Panzerigeln.", "zh": "再往后是第二排反坦克刺猬。", "start": 218.0, "end": 221.88}]}, {"start": 224.64, "end": 264.12, "lines": [{"de": "Bis 2028 soll der Ostschild Polens und der NATO stehen an der Grenze zu Russland und Belarus.", "zh": "到2028年，波兰和北约的东部之盾将在与俄罗斯和白俄罗斯的边境建成。", "start": 224.64, "end": 230.72}, {"de": "Mehr als 700 Kilometer.", "zh": "超过700公里。", "start": 230.8, "end": 232.56}, {"de": "Der Ostschild ist kein exklusiv polnisches Projekt.", "zh": "东部之盾不是波兰一个国家的项目。", "start": 235.48, "end": 239.08}, {"de": "Er ist Teil einer umfassenderen, regionalen Architektur der Allianz für die Abschreckung und Verteidigung.", "zh": "它是联盟威慑与防御更全面的地区架构的一部分。", "start": 239.44, "end": 246.88}, {"de": "Das Ziel: Truppen bei einem Einmarsch ausbremsen.", "zh": "目标：在敌军入侵时拖住部队。", "start": 250.84, "end": 254.92}, {"de": "Je besser wir vorbereitet sind, je kleiner die Wahrscheinlichkeit, dass Russland sich auf militärische Abenteuer einlässt.", "zh": "我们准备得越好，俄罗斯卷入军事冒险的概率就越小。", "start": 255.6, "end": 264.12}]}, {"start": 264.76, "end": 274.12, "lines": [{"de": "Die deutschen Pioniere bleiben bis Oktober.", "zh": "德国工兵将驻留到十月。", "start": 264.76, "end": 267.8}, {"de": "Danach unterstützen Franzosen, US-Amerikaner und Briten Polens Armee an der Ostflanke.", "zh": "之后由法国人、美国人和英国人接替，在东翼支援波兰军队。", "start": 268.24, "end": 274.12}]}], "vocab": [{"lemma": "die Ostflanke, -n", "key": "ostflanke", "forms": ["Ostflanke", "Ostflanke."], "pos": "Substantiv", "zh": "东翼（东侧翼）", "example_de": "Deutschland und Polen stärken die europäische Ostflanke.", "example_zh": ""}, {"lemma": "das Sperrgebiet, -e", "key": "sperrgebiet", "forms": ["Sperrgebiet"], "pos": "Substantiv", "zh": "禁区", "example_de": "Unterwegs mit der Bundeswehr in militärisches Sperrgebiet.", "example_zh": ""}, {"lemma": "errichten", "key": "errichten", "forms": ["errichten"], "pos": "Verb", "zh": "建立，筑起", "example_de": "Polnische und deutsche Soldaten zeigen, wie sie an der NATO-Ostflanke einen Schutzwall errichten.", "example_zh": ""}, {"lemma": "die Befestigungsanlage, -n", "key": "befestigungsanlage", "forms": ["Befestigungsanlagen", "Befestigungsanlage"], "pos": "Substantiv", "zh": "防御工事", "example_de": "Wir bauen hier Befestigungsanlagen.", "example_zh": ""}, {"lemma": "der Panzergraben, -\"", "key": "panzergraben", "forms": ["Panzergraben"], "pos": "Substantiv", "zh": "反坦克壕", "example_de": "Der Gegner blickt dann auf einen Panzergraben.", "example_zh": ""}, {"lemma": "die Abschreckung", "key": "abschreckung", "forms": ["Abschreckung"], "pos": "Substantiv", "zh": "威慑", "example_de": "Er ist Teil einer umfassenderen, regionalen Architektur der Allianz für die Abschreckung und Verteidigung.", "example_zh": ""}, {"lemma": "ausbremsen", "key": "ausbremsen", "forms": ["ausbremsen"], "pos": "Verb", "zh": "把……刹住，拖住", "example_de": "Das Ziel: Truppen bei einem Einmarsch ausbremsen.", "example_zh": ""}, {"lemma": "sich auf etw. (Akk.) einlassen", "key": "einlassen", "forms": ["einlässt", "sich auf etw."], "pos": "Redewendung", "zh": "卷入，涉足（某事）", "example_de": "Je besser wir vorbereitet sind, je kleiner die Wahrscheinlichkeit, dass Russland sich auf militärische Abenteuer einlässt.", "example_zh": ""}], "grammar_points": [{"title": "je … je / je … desto — 比例从句", "summary": "je + 比较级（从句），je/desto + 比较级（主句），表示越……越……。从句动词在结尾，主句比较级尽量靠前。本句口语中两个 je 连用，等同 je … desto。", "example_de": "Je besser wir vorbereitet sind, je kleiner die Wahrscheinlichkeit, dass Russland sich auf militärische Abenteuer einlässt.", "example_zh": "我们准备得越好，俄罗斯卷入军事冒险的概率就越小。"}], "background": "东部之盾（Ostschild）是波兰主导、北约参与的边境防御工程，沿波兰与俄罗斯飞地加里宁格勒及白俄罗斯的边境修建反坦克壕、观测塔与雷区，全长约700公里，计划2028年完工。德国联邦国防军工兵部队参与了建设。"}, {"title": "Kanzler Merz besucht nach Urlaub Waldbrandgebiet in NRW", "title_zh": "默茨总理休假后访问北威州森林火灾区", "paras": [{"start": 275.8, "end": 300.4, "lines": [{"de": "Bundeskanzler Merz hat das Waldbrandgebiet in der Eifel besucht und den Helfern gedankt.", "zh": "联邦总理默茨访问了埃菲尔山脉的森林火灾区，并向救援人员致谢。", "start": 275.8, "end": 281.88}, {"de": "Das Feuer im Hürtgenwald war vor einer Woche aus noch ungeklärter Ursache ausgebrochen.", "zh": "许尔特根瓦尔德的火一周前爆发，起因至今不明。", "start": 281.96, "end": 289.96}, {"de": "Vorgestern konnte es endgültig gelöscht werden.", "zh": "前天，大火被彻底扑灭。", "start": 290.08, "end": 292.96}, {"de": "Für Merz war es der erste öffentliche Termin nach seinem Sommerurlaub.", "zh": "这是默茨夏季休假后的第一个公开行程。", "start": 293.04, "end": 297.08}, {"de": "Ihm wird vorgeworfen, zu lange untätig gewesen zu sein.", "zh": "有人指责他太久无所作为。", "start": 297.16, "end": 300.4}]}, {"start": 301.88, "end": 331.24, "lines": [{"de": "Verbrannte Rinde, abgestorbene Bäume.", "zh": "烧焦的树皮，枯死的树木。", "start": 301.88, "end": 304.08}, {"de": "Kanzler Merz lässt sich die Auswirkungen des Brandes im Hürtgenwald in der Eifel zeigen.", "zh": "总理默茨在埃菲尔的许尔特根瓦尔德查看火灾造成的影响。", "start": 304.2, "end": 309.36}, {"de": "Das Feuer hat nur knapp Gey verschont.", "zh": "大火差一点就烧到盖伊村。", "start": 309.44, "end": 311.64}, {"de": "Hierher ist Merz gekommen, um den Helfern zu danken.", "zh": "默茨正是为了感谢救援人员才来到这里。", "start": 311.72, "end": 315.12}, {"de": "Der Feuerwehr, der Bundeswehr, dem THW, allen Blaulichtorganisationen, die mitgeholfen haben.", "zh": "消防队、联邦国防军、技术救援署（THW）、所有参与救援的蓝灯机构。", "start": 317.32, "end": 323.76}, {"de": "Und der Landwirtschaft und der Forstwirtschaft.", "zh": "还有农业和林业部门。", "start": 323.84, "end": 326.64}, {"de": "Ohne deren Zusammenarbeit wäre das nicht so glimpflich ausgegangen.", "zh": "没有它们的通力合作，结局不会这么轻。", "start": 326.72, "end": 331.24}]}, {"start": 332.56, "end": 362.0, "lines": [{"de": "Doch Merz ist hier nicht allen willkommen.", "zh": "但默茨在这里并不受所有人欢迎。", "start": 332.56, "end": 335.16}, {"de": "Die Linke hat zu einer Demo aufgerufen.", "zh": "左翼党号召了一场示威。", "start": 335.56, "end": 338.08}, {"de": "Schon seit Tagen wird Merz kritisiert, in den sozialen Medien, von der Opposition, von Betroffenen vor Ort: Er komme viel zu spät.", "zh": "几天来，默茨一直受到批评——在社交媒体上、来自反对派、来自当地受灾者：他来得太晚了。", "start": 338.16, "end": 346.08}, {"de": "Lena Stückgen hat den Waldbrand miterlebt, ist aus dem Nachbardorf gekommen.", "zh": "莱娜·施蒂克根亲身经历了这场森林火灾，从邻村赶来。", "start": 346.56, "end": 351.4}, {"de": "Man hat das in Belgien gesehen, im Hohen Venn.", "zh": "人们在比利时看到了，在霍厄斯芬高地。", "start": 351.56, "end": 354.8}, {"de": "Der König Philippe hat seinen Urlaub unterbrochen, das zeigt schon mal ein größeres Vorbild als Merz.", "zh": "菲利佩国王中断了自己的假期，这已经显示出比默茨更大的榜样。", "start": 354.92, "end": 362.0}]}, {"start": 364.72, "end": 376.04, "lines": [{"de": "Ich habe das mit dem Landrat abgesprochen, dass ich nicht während der laufenden Löscharbeiten hierher komme.", "zh": "我和县长说好了，灭火工作还在进行时我不来这里。", "start": 364.72, "end": 371.12}, {"de": "Ich komme später, um mir anzuschauen, was ist gut gelaufen, was muss besser werden?", "zh": "我晚点再来，看看哪些做得好，哪些必须改进。", "start": 371.24, "end": 376.04}]}, {"start": 376.12, "end": 409.28, "lines": [{"de": "Am 13. August brach das Feuer aus.", "zh": "8月13日火情爆发。", "start": 376.12, "end": 378.28}, {"de": "Rund 300 Hektar Wald haben hier gebrannt - etwa 420 Fußballfelder.", "zh": "约300公顷森林在这里燃烧——大约420个足球场。", "start": 378.36, "end": 382.88}, {"de": "Das ist der größte Waldbrand in NRW seit Datenerfassung.", "zh": "这是北威州有记录以来最大的森林火灾。", "start": 382.96, "end": 386.64}, {"de": "Die Dorfbewohner mussten knapp zwei Tage ihre Häuser verlassen.", "zh": "村民不得不离家将近两天。", "start": 386.72, "end": 391.04}, {"de": "Seit Donnerstag ist das Feuer gelöscht.", "zh": "从周四起大火已扑灭。", "start": 391.16, "end": 393.56}, {"de": "Florian Maul und Jürgen Valder sind in Gey aufgewachsen und unendlich dankbar, dass ihre Häuser noch stehen.", "zh": "弗洛里安·毛尔和于尔根·瓦尔德在盖伊长大，无比感激自己的房子还在。", "start": 393.68, "end": 400.16}, {"de": "Sie finden es gut, dass Merz ihr Dorf besucht, aber: Oben ist einiges aufzuforsten, das ist unsere Heimat hier, das werden wir sehen.", "zh": "他们觉得默茨来村里是好事，但是：山上不少地方要重新造林，这里是我们的家乡，这我们会看着办。", "start": 400.24, "end": 409.28}]}, {"start": 409.48, "end": 434.08, "lines": [{"de": "In Gey spricht Merz vom Klimawandel.", "zh": "在盖伊，默茨谈到了气候变化。", "start": 409.48, "end": 411.96}, {"de": "Ich will allen Leugnern des Klimawandels sagen: Schauen Sie sich das genau an, was hier passiert ist.", "zh": "我想对所有否认气候变化的人说：仔细看看这里发生了什么。", "start": 412.16, "end": 418.84}, {"de": "Wir werden alles tun, um den Klimawandel zurückzudrängen, aber wir müssen auch mit ihm leben.", "zh": "我们将竭尽全力遏止气候变化，但我们也必须与它共存。", "start": 419.04, "end": 425.76}, {"de": "Welche Maßnahmen ergriffen werden sollen, sagt er nicht, und verweist auf die kommende Kabinettsklausur.", "zh": "至于将采取哪些措施，他没有说，只表示要看即将举行的内阁闭门会议。", "start": 427.68, "end": 434.08}]}], "vocab": [{"lemma": "ungeklärt", "key": "ungeklaert", "forms": ["ungeklärter", "ungeklärt"], "pos": "Adjektiv", "zh": "未查明的", "example_de": "Das Feuer im Hürtgenwald war vor einer Woche aus noch ungeklärter Ursache ausgebrochen.", "example_zh": ""}, {"lemma": "verschonen", "key": "verschonen", "forms": ["verschont", "verschonen"], "pos": "Verb", "zh": "饶过，使免遭", "example_de": "Das Feuer hat nur knapp Gey verschont.", "example_zh": ""}, {"lemma": "glimpflich", "key": "glimpflich", "forms": ["glimpflich"], "pos": "Adjektiv", "zh": "温和的，（结局）轻的", "example_de": "Ohne deren Zusammenarbeit wäre das nicht so glimpflich ausgegangen.", "example_zh": ""}, {"lemma": "die Blaulichtorganisation, -en", "key": "blaulichtorganisation", "forms": ["Blaulichtorganisationen", "Blaulichtorganisation"], "pos": "Substantiv", "zh": "蓝灯机构（警消急救等出勤亮蓝灯的单位）", "example_de": "Der Feuerwehr, der Bundeswehr, dem THW, allen Blaulichtorganisationen, die mitgeholfen haben.", "example_zh": ""}, {"lemma": "die Forstwirtschaft", "key": "forstwirtschaft", "forms": ["Forstwirtschaft"], "pos": "Substantiv", "zh": "林业", "example_de": "Und der Landwirtschaft und der Forstwirtschaft.", "example_zh": ""}, {"lemma": "aufforsten", "key": "aufforsten", "forms": ["aufzuforsten", "aufforsten"], "pos": "Verb", "zh": "重新造林", "example_de": "Sie finden es gut, dass Merz ihr Dorf besucht, aber: Oben ist einiges aufzuforsten, das ist unsere Heimat hier, das werden wir sehen.", "example_zh": ""}, {"lemma": "der Leugner, -", "key": "leugner", "forms": ["Leugnern", "Leugner"], "pos": "Substantiv", "zh": "否认者", "example_de": "Ich will allen Leugnern des Klimawandels sagen: Schauen Sie sich das genau an, was hier passiert ist.", "example_zh": ""}, {"lemma": "zurückdrängen", "key": "zurueckdraengen", "forms": ["zurückzudrängen", "zurückdrängen"], "pos": "Verb", "zh": "遏制，逼退", "example_de": "Wir werden alles tun, um den Klimawandel zurückzudrängen, aber wir müssen auch mit ihm leben.", "example_zh": ""}], "grammar_points": [], "background": "2026年8月13日起北威州埃菲尔山脉许尔特根瓦尔德（Hürtgenwald）爆发森林火灾，波及约300公顷，为北威州有记录以来最大森林火灾，8月20日（周四）扑灭。总理默茨8月22日暑期后首次公开露面即赴灾区盖伊村（Gey），因被批来得太晚而陷入舆论争议。"}, {"title": "Dobrindt will die Kontrollen an den deutschen Außengrenzen erneut verlängern", "title_zh": "多布林特拟再次延长德国外边境检查", "paras": [{"start": 435.44, "end": 458.68, "lines": [{"de": "Seit zwei Jahren können Einreisende an den deutschen Außengrenzen stichprobenartig kontrolliert werden.", "zh": "两年来，入境者可以在德国外边境接受抽查。", "start": 435.44, "end": 441.56}, {"de": "Angeordnet hatte das die damalige Innenministerin Faeser.", "zh": "下令的是当时的内政部长费瑟。", "start": 441.64, "end": 445.08}, {"de": "Man wollte unerlaubte Migration eindämmen und Schleuserkriminalität bekämpfen.", "zh": "目的是遏制非法移民、打击偷渡犯罪。", "start": 445.16, "end": 450.04}, {"de": "Seitdem wurden die Kontrollen mehrmals verlängert.", "zh": "此后检查已多次延长。", "start": 450.12, "end": 453.12}, {"de": "Vor wenigen Tagen hat Innenminister Dobrindt bei der EU-Kommission deshalb erneut angefragt.", "zh": "几天前，内政部长多布林特为此再次向欧盟委员会提出申请。", "start": 453.2, "end": 458.68}]}, {"start": 458.76, "end": 480.28, "lines": [{"de": "Über die deutsche Grenze führen 4500 Straßen, Wege und Pfade - eine Herausforderung für das Grenzpersonal.", "zh": "横跨德国边境的有4500条公路、小路和野径——对边检人员是巨大挑战。", "start": 458.76, "end": 465.24}, {"de": "Die Grenzpolizisten Leon und Dominik brechen auf zur Patrouille.", "zh": "边警莱昂和多米尼克出发巡逻。", "start": 466.6, "end": 470.84}, {"de": "Ihre vollen Namen dürfen wir nicht nennen.", "zh": "我们不能公开他们的全名。", "start": 471.28, "end": 473.76}, {"de": "Sie arbeiten für die Polizeiinspektion Kempten, die 200 Kilometer Grenze zu Österreich überwacht.", "zh": "他们在肯普滕警局工作，负责监控与奥地利接壤的200公里边境。", "start": 473.92, "end": 480.28}]}, {"start": 481.28, "end": 524.04, "lines": [{"de": "Ihr erster Einsatz: Kontrolle eines Busses an der A96.", "zh": "他们的第一项任务：在A96高速上检查一辆大巴。", "start": 481.28, "end": 484.56}, {"de": "Good morning, border control.", "zh": "早上好，边防检查。", "start": 485.0, "end": 487.2}, {"de": "Sie prüfen, ob die Passagiere einreisen dürfen.", "zh": "他们核查乘客是否可以入境。", "start": 487.88, "end": 490.8}, {"de": "Einen Libanesen mit griechischem Visum nehmen sie mit, um sein Gepäck zu untersuchen.", "zh": "一名持希腊签证的黎巴嫩人被带走检查行李。", "start": 491.0, "end": 496.24}, {"de": "Diesen Bus kontrollieren sie, aber nicht jedes Fahrzeug.", "zh": "这辆大巴他们查了，但并非每辆车都查。", "start": 496.32, "end": 500.32}, {"de": "Wir haben grundsätzlich uns an den Schengener Grenzkodex zu halten, dürfen nur stichprobenartig kontrollieren.", "zh": "原则上我们必须遵守申根边境守则，只能抽查。", "start": 501.96, "end": 508.88}, {"de": "Nur Stichproben.", "zh": "只能抽查。", "start": 509.04, "end": 510.28}, {"de": "Und es gibt die grüne Grenze: Tausende Straßen und Wege, die nicht dauerhaft kontrolliert werden.", "zh": "还有绿色边境：成千上万条无法长期管控的道路和小径。", "start": 510.36, "end": 516.96}, {"de": "Dafür bräuchte es mehr Personal, sagt die Gewerkschaft der Polizei.", "zh": "警察工会说，这需要更多人力。", "start": 517.16, "end": 521.16}, {"de": "Stattdessen: Überstunden und Kompromisse.", "zh": "现实却是：加班和妥协。", "start": 521.44, "end": 524.04}]}, {"start": 524.52, "end": 558.04, "lines": [{"de": "Leon und Dominik machen die nächste Kontrolle.", "zh": "莱昂和多米尼克开始下一次检查。", "start": 524.52, "end": 527.92}, {"de": "Ein Auto mit jungen Männern.", "zh": "一辆坐满年轻男性的车。", "start": 528.0, "end": 529.84}, {"de": "Alle aussteigen und auf die Bank setzen.", "zh": "所有人下车，坐到长椅上。", "start": 530.08, "end": 533.28}, {"de": "Die Beamten durchsuchen den Wagen.", "zh": "警员们搜查车辆。", "start": 533.68, "end": 536.04}, {"de": "Die Reisenden nervös, doch die Polizisten finden nichts Verdächtiges.", "zh": "旅客们很紧张，但警察没有发现任何可疑之物。", "start": 536.12, "end": 540.88}, {"de": "Was habt ihr alles dabei?", "zh": "你们都带了些什么？", "start": 541.28, "end": 545.2}, {"de": "Spanngurte?", "zh": "捆扎带？", "start": null, "end": null}, {"de": "Tröte?", "zh": "喇叭？", "start": null, "end": null}, {"de": "An anderen Tagen ist das anders.", "zh": "别的日子就不一样了。", "start": 546.04, "end": 548.76}, {"de": "Trotz aller Probleme: 2025 haben Leon, Dominik und ihr Team fast dreimal so viele illegal Einreisende festgenommen wie 2024.", "zh": "尽管问题重重：2025年，莱昂、多米尼克和他们的团队逮捕的非法入境者几乎是2024年的三倍。", "start": 549.52, "end": 558.04}]}], "vocab": [{"lemma": "stichprobenartig", "key": "stichprobenartig", "forms": ["stichprobenartig"], "pos": "Adjektiv", "zh": "抽查式的", "example_de": "Seit zwei Jahren können Einreisende an den deutschen Außengrenzen stichprobenartig kontrolliert werden.", "example_zh": ""}, {"lemma": "eindämmen", "key": "eindaemmen", "forms": ["eindämmen"], "pos": "Verb", "zh": "遏制，控制（蔓延）", "example_de": "Man wollte unerlaubte Migration eindämmen und Schleuserkriminalität bekämpfen.", "example_zh": ""}, {"lemma": "die Schleuserkriminalität", "key": "schleuserkriminalitaet", "forms": ["Schleuserkriminalität"], "pos": "Substantiv", "zh": "偷渡犯罪", "example_de": "Man wollte unerlaubte Migration eindämmen und Schleuserkriminalität bekämpfen.", "example_zh": ""}, {"lemma": "die Polizeiinspektion, -en", "key": "polizeiinspektion", "forms": ["Polizeiinspektion"], "pos": "Substantiv", "zh": "警察分局", "example_de": "Sie arbeiten für die Polizeiinspektion Kempten, die 200 Kilometer Grenze zu Österreich überwacht.", "example_zh": ""}, {"lemma": "die Patrouille, -n", "key": "patrouille", "forms": ["Patrouille"], "pos": "Substantiv", "zh": "巡逻", "example_de": "Die Grenzpolizisten Leon und Dominik brechen auf zur Patrouille.", "example_zh": ""}, {"lemma": "die Stichprobe, -n", "key": "stichprobe", "forms": ["Stichproben", "Stichprobe"], "pos": "Substantiv", "zh": "抽查，抽样", "example_de": "Nur Stichproben.", "example_zh": ""}, {"lemma": "verdächtig", "key": "verdaechtig", "forms": ["Verdächtiges", "verdächtig"], "pos": "Adjektiv", "zh": "可疑的", "example_de": "Die Reisenden nervös, doch die Polizisten finden nichts Verdächtiges.", "example_zh": ""}, {"lemma": "festnehmen", "key": "festnehmen", "forms": ["festgenommen", "festnehmen"], "pos": "Verb", "zh": "逮捕", "example_de": "Trotz aller Probleme: 2025 haben Leon, Dominik und ihr Team fast dreimal so viele illegal Einreisende festgenommen wie 2024.", "example_zh": ""}], "grammar_points": [{"title": "sich an etw. (Akk.) halten — 遵守", "summary": "sich an + 第四格 + halten 意为遵循、遵守，反身代词随主语变化。本句为带 zu 不定式结构（haben uns zu halten），an 提前置于宾语前。", "example_de": "Wir haben grundsätzlich uns an den Schengener Grenzkodex zu halten, dürfen nur stichprobenartig kontrollieren.", "example_zh": "原则上我们必须遵守申根边境守则，只能抽查。"}], "background": "德国自2024年9月起在所有外边境恢复身份抽查，依据申根边境守则须定期向欧盟委员会申请延长。2026年8月，内政部长亚历山大·多布林特（CSU）再次向欧委会申请延长。"}, {"title": "Rätsel um Besitzer der historischen Wehrmachts-Maschine nach Donau-Niedrigwasser", "title_zh": "多瑙河低水位后，二战德军摩托车主人之谜", "paras": [{"start": 560.88, "end": 587.76, "lines": [{"de": "Ein bemerkenswerter Fund, freigelegt durch den Tiefststand der Donau: Nach extremer Trockenheit tauchten vor drei Wochen dieses Motorrad der Wehrmacht, Erkennungsmarken von Soldaten und Gebeine im Schlamm auf.", "zh": "一项引人注目的发现，由多瑙河的最低水位揭开：极端干旱之后，三周前这辆国防军摩托车、士兵的身份牌和骸骨从淤泥中现身。", "start": 560.88, "end": 576.36}, {"de": "Für Historiker sind es hochinteressante Dokumente aus dem Zweiten Weltkrieg.", "zh": "对历史学家而言，这是来自二战的极其珍贵的文献。", "start": 576.44, "end": 580.88}, {"de": "Mit dem Fund sind auch persönliche Schicksale verknüpft.", "zh": "这一发现还牵连着个人命运。", "start": 581.0, "end": 584.2}, {"de": "Spezialisten versuchen herauszufinden, wer die Toten waren.", "zh": "专家们正试图查明死者是谁。", "start": 584.28, "end": 587.76}]}, {"start": 588.84, "end": 628.56, "lines": [{"de": "Rostig, noch Sediment in den Zwischenräumen, aber die Reifen noch funktionstüchtig.", "zh": "锈迹斑斑，缝隙里还有泥沙，但轮胎还能用。", "start": 588.84, "end": 594.0}, {"de": "Für Oberleutnant Jozsef Bakondi ist das Motorrad aus dem Zweiten Weltkrieg ein einzigartiger Fund.", "zh": "对约瑟夫·巴孔迪上尉来说，这辆二战摩托车是独一无二的发现。", "start": 594.12, "end": 599.68}, {"de": "Wenn wir auf die andere Seite des Motorrads gehen.", "zh": "如果我们走到摩托车的另一侧。", "start": 600.88, "end": 604.52}, {"de": "Die lag im Schlamm.", "zh": "它曾泡在泥里。", "start": 604.6, "end": 605.92}, {"de": "Dann können wir sehen, dass die Lackierung schön erhalten geblieben ist.", "zh": "就能看到漆面保存得很好。", "start": 606.0, "end": 611.84}, {"de": "80 Jahre lag das Motorrad in der Donau bei Budapest.", "zh": "这辆摩托车在布达佩斯附近的多瑙河里躺了80年。", "start": 611.96, "end": 614.92}, {"de": "Wie es dahin kam: unklar.", "zh": "它是怎么到那里的：不清楚。", "start": 615.04, "end": 616.64}, {"de": "Wir wissen, dass es zur Wehrmacht gehörte.", "zh": "我们只知道它属于国防军。", "start": 618.76, "end": 621.4}, {"de": "Es war zugeordnet einer technischen Einheit der Panzerdivision Feldherrnhalle und gehörte zu deren Bestand.", "zh": "它被编入费尔德赫恩哈勒装甲师的一支技术单位，属于其装备清单。", "start": 621.48, "end": 628.56}]}, {"start": 629.56, "end": 663.6, "lines": [{"de": "Die Division kämpfte im letzten Kriegsjahr bei der Schlacht um Budapest.", "zh": "该师在战争最后一年参加了布达佩斯战役。", "start": 629.56, "end": 633.96}, {"de": "Was den Fund so spannend macht: Neben dem Motorrad wurden menschliche Knochen und diese Erkennungsmarken gefunden.", "zh": "这次发现之所以如此引人入胜：在摩托车旁边还发现了人骨和这些身份牌。", "start": 634.04, "end": 640.88}, {"de": "Der Volksbund Deutsche Kriegsgräberfürsorge muss herausfinden, wer die Menschen hinter den Nummern sind.", "zh": "德国战争墓地委员会民间联合会必须查明，这些编号背后的人是谁。", "start": 641.08, "end": 647.24}, {"de": "Die Erkennungsmarke, die Konstellation der Nummer und der Truppe ist einmalig, da gibt's 'ne eindeutige Zuordnung.", "zh": "这枚身份牌，编号与部队的组合是唯一的，可以明确归属。", "start": 647.4, "end": 654.4}, {"de": "Um die Identität festzustellen, helfen persönliche Gegenstände, wie etwa Ringe.", "zh": "为确定身份，戒指等个人物品能帮上忙。", "start": 654.88, "end": 660.2}, {"de": "Erst dann können die Nachfahren ermittelt werden.", "zh": "之后才能查到后代亲属。", "start": 660.44, "end": 663.6}]}, {"start": 664.28, "end": 685.04, "lines": [{"de": "Angehörige sind in der Regel verwundert, überrascht.", "zh": "亲属们通常先是惊讶、错愕。", "start": 664.28, "end": 667.4}, {"de": "Aber auch überglücklich und dem Volksbund dankbar, dass er diese Aufgaben erfüllt.", "zh": "但也无比欣慰，感谢民间联合会承担这些任务。", "start": 667.52, "end": 672.48}, {"de": "Weiter nach Toten, nach Vermissten zu suchen, damit Familien die Familiengeschichte klären können.", "zh": "继续寻找死者、寻找失踪者，让家庭能够厘清家族史。", "start": 672.56, "end": 679.84}, {"de": "Mehr als eine Million Schicksale sind noch ungelöst.", "zh": "还有一百多万个命运未解。", "start": 681.16, "end": 685.04}]}], "vocab": [{"lemma": "der Tiefststand", "key": "tiefststand", "forms": ["Tiefststand"], "pos": "Substantiv", "zh": "最低水位/最低点", "example_de": "Ein bemerkenswerter Fund, freigelegt durch den Tiefststand der Donau: Nach extremer Trockenheit tauchten vor drei Wochen dieses Motorrad der Wehrmacht, Erkennungsmarken von Soldaten und Gebeine im Schlamm auf.", "example_zh": ""}, {"lemma": "die Erkennungsmarke, -n", "key": "erkennungsmarke", "forms": ["Erkennungsmarken", "Erkennungsmarke"], "pos": "Substantiv", "zh": "（军人）身份牌", "example_de": "Ein bemerkenswerter Fund, freigelegt durch den Tiefststand der Donau: Nach extremer Trockenheit tauchten vor drei Wochen dieses Motorrad der Wehrmacht, Erkennungsmarken von Soldaten und Gebeine im Schlamm auf.", "example_zh": ""}, {"lemma": "das Gebein, -e", "key": "gebein", "forms": ["Gebeine", "Gebein"], "pos": "Substantiv", "zh": "骸骨（常用复数）", "example_de": "Ein bemerkenswerter Fund, freigelegt durch den Tiefststand der Donau: Nach extremer Trockenheit tauchten vor drei Wochen dieses Motorrad der Wehrmacht, Erkennungsmarken von Soldaten und Gebeine im Schlamm auf.", "example_zh": ""}, {"lemma": "verknüpfen", "key": "verknuempfen", "forms": ["verknüpft", "verknüpfen"], "pos": "Verb", "zh": "使……相关联", "example_de": "Mit dem Fund sind auch persönliche Schicksale verknüpft.", "example_zh": ""}, {"lemma": "funktionstüchtig", "key": "funktionstuechtig", "forms": ["funktionstüchtig"], "pos": "Adjektiv", "zh": "功能正常的，还能用的", "example_de": "Rostig, noch Sediment in den Zwischenräumen, aber die Reifen noch funktionstüchtig.", "example_zh": ""}, {"lemma": "die Zuordnung", "key": "zuordnung", "forms": ["Zuordnung"], "pos": "Substantiv", "zh": "归属，对应关系", "example_de": "Die Erkennungsmarke, die Konstellation der Nummer und der Truppe ist einmalig, da gibt's 'ne eindeutige Zuordnung.", "example_zh": ""}, {"lemma": "die Nachfahren", "key": "nachfahren", "forms": ["Nachfahren"], "pos": "Substantiv", "zh": "后代，后裔", "example_de": "Erst dann können die Nachfahren ermittelt werden.", "example_zh": ""}, {"lemma": "der Vermisste, -n", "key": "vermisste", "forms": ["Vermissten", "Vermisste"], "pos": "Substantiv", "zh": "失踪者（按形容词变化）", "example_de": "Weiter nach Toten, nach Vermissten zu suchen, damit Familien die Familiengeschichte klären können.", "example_zh": ""}], "grammar_points": [], "background": "多瑙河因极端干旱水位创新低，布达佩斯段河床淤泥中露出二战德军摩托车、士兵身份牌与人骨。费尔德赫恩哈勒装甲师1944-45年曾参与布达佩斯战役。德国战争墓地委员会民间联合会（Volksbund Deutsche Kriegsgräberfürsorge）负责身份鉴定与寻亲，欧洲仍有上百万二战失踪者命运未明。"}, {"title": "Massiver Polizeieinsatz nach Ausschreitungen beim Pokalderby in Mannheim", "title_zh": "曼海姆杯赛德比骚乱后的大规模警力行动", "paras": [{"start": 687.32, "end": 712.24, "lines": [{"de": "Bei Derbys im Fußball geht es oft hoch her.", "zh": "足球德比的气氛往往很火爆。", "start": 687.32, "end": 690.56}, {"de": "Das gestrige DFB-Pokalspiel zwischen Waldhof Mannheim und dem 1. FC Kaiserslautern ist jedoch eskaliert: Kurz vor Ende der regulären Spielzeit stürmten Fans den Platz, es gab Ausschreitungen, 85 Verletzte, darunter 35 Polizeibeamte.", "zh": "然而昨天曼海姆瓦尔德霍夫对凯泽斯劳滕的德国杯比赛失控了：常规比赛时间快结束时，球迷冲入球场，发生骚乱，85人受伤，其中包括35名警察。", "start": 690.68, "end": 705.8}, {"de": "Zeitweilig drohte ein Abbruch der Partie.", "zh": "比赛一度面临中断。", "start": 705.88, "end": 708.56}, {"de": "Die Polizei ermittelt u.a. wegen Landfriedensbruchs.", "zh": "警方已就破坏和平罪等多项罪名展开调查。", "start": 708.64, "end": 712.24}]}, {"start": 714.88, "end": 742.04, "lines": [{"de": "Verstörende Bilder in Mannheim.", "zh": "曼海姆传来的画面令人不安。", "start": 714.88, "end": 716.92}, {"de": "1400 Polizisten sind im Einsatz, mehrere Hundertschaften in Kampfmontur auf dem Spielfeld.", "zh": "1400名警察在场行动，多个防暴中队全副武装进入球场。", "start": 717.16, "end": 723.96}, {"de": "Sogar eine Reiterstaffel.", "zh": "甚至还有骑警队。", "start": 724.16, "end": 726.16}, {"de": "Die Pokalpartie gegen Kaiserslautern droht völlig zu eskalieren.", "zh": "对凯泽斯劳滕的杯赛眼看要彻底失控。", "start": 726.96, "end": 730.72}, {"de": "Die Polizei hat das Spielfeld betreten, um einen Platzsturm zu verhindern.", "zh": "警方进入球场，以阻止球迷冲场。", "start": 731.12, "end": 736.2}, {"de": "Sie wurden massiv mit Pyrotechnik beschossen.", "zh": "他们遭到烟火的大规模投掷袭击。", "start": 736.28, "end": 739.0}, {"de": "35 Kollegen wurden leicht verletzt.", "zh": "35名同事受了轻伤。", "start": 739.12, "end": 742.04}]}, {"start": 743.52, "end": 775.72, "lines": [{"de": "Auslöser der Eskalation: Eine Rudelbildung in der 90. Minute beim Stande von 0:0.", "zh": "冲突的导火索：第90分钟双方球员在比分0:0时的集体对峙。", "start": 743.52, "end": 749.56}, {"de": "85 Zuschauer werden danach durch Rauchgas und Pfefferspray verletzt.", "zh": "之后85名观众被烟气和胡椒喷雾所伤。", "start": 750.0, "end": 754.48}, {"de": "Das gehört nicht ins Stadion, genauso wenig wie der Platzsturm.", "zh": "这种东西不该出现在球场，冲场也一样。", "start": 754.72, "end": 760.04}, {"de": "Fans sollen emotional sein, aber ohne Gewalt.", "zh": "球迷可以有激情，但不该有暴力。", "start": 760.68, "end": 764.48}, {"de": "Nach halbstündiger Unterbrechung wird die Partie von Schiri Schröder doch noch zu Ende gebracht.", "zh": "中断半小时后，主裁施罗德还是把比赛带到了终场。", "start": 767.0, "end": 773.12}, {"de": "Der FCK gewinnt in der Verlängerung 1:0.", "zh": "凯泽斯劳滕在加时赛中1:0获胜。", "start": 773.2, "end": 775.72}]}, {"start": 775.8, "end": 802.36, "lines": [{"de": "Die Partie wird ein Nachspiel haben.", "zh": "这场比赛将有后续。", "start": 775.8, "end": 778.2}, {"de": "Das sind keine Fans, das sind Kriminelle.", "zh": "这些不是球迷，这些是罪犯。", "start": 778.6, "end": 781.52}, {"de": "Genauso werden wir diese Typen auch behandeln.", "zh": "我们也会这样对待这些人。", "start": 781.68, "end": 784.52}, {"de": "Wir müssen nicht Gesetze verschärfen, sondern sie konsequent anwenden.", "zh": "我们不需要收紧法律，而是要坚决执行法律。", "start": 784.68, "end": 790.92}, {"de": "Auch der DFB will die Vorfälle umfassend aufarbeiten.", "zh": "德国足协也表示要全面复盘这起事件。", "start": 794.44, "end": 799.0}, {"de": "Den Vereinen drohen harte Strafen.", "zh": "两家俱乐部面临严厉处罚。", "start": 799.44, "end": 802.36}]}], "vocab": [{"lemma": "hoch hergehen", "key": "hoch-hergehen", "forms": ["hoch her", "hoch hergehen"], "pos": "Redewendung", "zh": "场面激烈，气氛火爆", "example_de": "Bei Derbys im Fußball geht es oft hoch her.", "example_zh": ""}, {"lemma": "eskalieren", "key": "eskalieren", "forms": ["eskaliert", "eskalieren.", "eskalieren"], "pos": "Verb", "zh": "升级，失控", "example_de": "FC Kaiserslautern ist jedoch eskaliert: Kurz vor Ende der regulären Spielzeit stürmten Fans den Platz, es gab Ausschreitungen, 85 Verletzte, darunter 35 Polizeibeamte.", "example_zh": ""}, {"lemma": "die Ausschreitung, -en", "key": "ausschreitung", "forms": ["Ausschreitungen", "Ausschreitung"], "pos": "Substantiv", "zh": "骚乱，越轨行为", "example_de": "FC Kaiserslautern ist jedoch eskaliert: Kurz vor Ende der regulären Spielzeit stürmten Fans den Platz, es gab Ausschreitungen, 85 Verletzte, darunter 35 Polizeibeamte.", "example_zh": ""}, {"lemma": "der Platzsturm", "key": "platzsturm", "forms": ["Platzsturm"], "pos": "Substantiv", "zh": "冲入球场", "example_de": "Die Polizei hat das Spielfeld betreten, um einen Platzsturm zu verhindern.", "example_zh": ""}, {"lemma": "die Rudelbildung", "key": "rudelbildung", "forms": ["Rudelbildung"], "pos": "Substantiv", "zh": "聚众对峙（球员围拢冲突）", "example_de": "Auslöser der Eskalation: Eine Rudelbildung in der 90.", "example_zh": ""}, {"lemma": "die Hundertschaft, -en", "key": "hundertschaft", "forms": ["Hundertschaften", "Hundertschaft"], "pos": "Substantiv", "zh": "（防暴警察）中队，百人队", "example_de": "Verstörende Bilder in Mannheim. 1400 Polizisten sind im Einsatz, mehrere Hundertschaften in Kampfmontur auf dem Spielfeld.", "example_zh": ""}, {"lemma": "die Reiterstaffel, -n", "key": "reiterstaffel", "forms": ["Reiterstaffel"], "pos": "Substantiv", "zh": "骑警队", "example_de": "Sogar eine Reiterstaffel.", "example_zh": ""}, {"lemma": "der Landfriedensbruch", "key": "landfriedensbruch", "forms": ["Landfriedensbruchs", "Landfriedensbruch"], "pos": "Substantiv", "zh": "破坏和平罪", "example_de": "Die Polizei ermittelt u.a. wegen Landfriedensbruchs.", "example_zh": ""}, {"lemma": "das Nachspiel, -e", "key": "nachspiel", "forms": ["Nachspiel"], "pos": "Substantiv", "zh": "后续，余波", "example_de": "Die Partie wird ein Nachspiel haben.", "example_zh": ""}], "grammar_points": [{"title": "gehören in + Akkusativ — 归属表达", "summary": "Das gehört nicht ins Stadion 字面是不属于球场。gehören + 方向介词（in/an/auf + 第四格）表示某物该待在哪里、不该出现在哪里；对比 gehören + Dativ（属于某人）。", "example_de": "Das gehört nicht ins Stadion, genauso wenig wie der Platzsturm.", "example_zh": "这种东西不该出现在球场，冲场也一样。"}], "background": "2026年8月21日德国杯曼海姆瓦尔德霍夫对凯泽斯劳滕（客队加时1:0取胜）临近结束时发生大规模球迷骚乱，85人受伤（含35名警察），警方以破坏和平罪等立案，DFB启动全面调查。"}, {"title": "Reit-WM", "title_zh": "世界马术锦标赛", "paras": [{"start": 807.6, "end": 826.08, "lines": [{"de": "Wir blicken auf die Reit-WM in Aachen.", "zh": "我们来看亚琛的世界马术锦标赛。", "start": 807.6, "end": 810.2}, {"de": "Hier liegen drei deutsche Paare vor den abschließenden Runden im Einzel-Finale morgen in aussichtsreicher Position.", "zh": "明天个人赛决赛最后一轮之前，三对德国组合占据有利位置。", "start": 810.28, "end": 817.04}, {"de": "Allen voran Daniel Deußer mit Otello.", "zh": "领跑的是丹尼尔·多伊泽与奥泰罗。", "start": 817.12, "end": 819.32}, {"de": "Gestern holten die deutschen Springreiter Gold in der Mannschaftswertung und sind Weltmeister.", "zh": "昨天德国场地障碍骑手在团体赛中夺得金牌，成为世界冠军。", "start": 819.4, "end": 826.08}]}, {"start": 827.6, "end": 872.32, "lines": [{"de": "Zum vierten Mal ist Deutschland Mannschaftsweltmeister im Springreiten.", "zh": "这是德国第四次赢得场地障碍团体世界冠军。", "start": 827.6, "end": 832.92}, {"de": "Die Entscheidung fiel nach dem dritten von vier Reitern.", "zh": "胜负在四位骑手中的第三位出场后就已确定。", "start": 833.0, "end": 836.28}, {"de": "Vor 40.000 Zuschauern in Aachen bleibt Marcus Ehning, der erste deutsche Reiter, fehlerfrei.", "zh": "在亚琛四万名观众面前，第一位德国骑手马库斯·埃宁保持零失误。", "start": 836.36, "end": 842.0}, {"de": "Sophie Hinners, die WM-Debütantin, als Zweite ebenfalls ohne Abwurf, überschreitet knapp die zulässige Zeit.", "zh": "首次参加世锦赛的索菲·欣纳斯第二个出场，同样没有打落障碍，只是略微超出规定用时。", "start": 842.08, "end": 849.6}, {"de": "Daniel Deußer als dritter Reiter bleibt auch fehlerfrei und macht vor Schlussreiter Richard Vogel alles klar.", "zh": "丹尼尔·多伊泽作为第三位骑手同样零失误，为压轴的理查德·福格尔奠定了胜局。", "start": 851.68, "end": 858.56}, {"de": "Vogel, Einzel-Europameister 2025, kann ohne Druck reiten.", "zh": "2025年个人欧洲冠军福格尔可以毫无压力地出场。", "start": 860.04, "end": 864.24}, {"de": "Er sorgt mit einem sehr guten Ritt für Partystimmung in Aachen.", "zh": "他以一次精彩的骑行让亚琛陷入狂欢。", "start": 864.44, "end": 868.44}, {"de": "Deutschland triumphiert vor Belgien und Großbritannien.", "zh": "德国力压比利时和英国登顶。", "start": 868.52, "end": 872.32}]}], "vocab": [{"lemma": "die Mannschaftswertung, -en", "key": "mannschaftswertung", "forms": ["Mannschaftswertung"], "pos": "Substantiv", "zh": "团体赛（计分）", "example_de": "Gestern holten die deutschen Springreiter Gold in der Mannschaftswertung und sind Weltmeister.", "example_zh": ""}, {"lemma": "der Abwurf, -e\"", "key": "abwurf", "forms": ["Abwurf"], "pos": "Substantiv", "zh": "（障碍赛）打落障碍", "example_de": "Sophie Hinners, die WM-Debütantin, als Zweite ebenfalls ohne Abwurf, überschreitet knapp die zulässige Zeit.", "example_zh": ""}, {"lemma": "der Debütant, -en", "key": "debuetant", "forms": ["WM-Debütantin", "Debütant"], "pos": "Substantiv", "zh": "首次参赛者（女性为 Debütantin）", "example_de": "Sophie Hinners, die WM-Debütantin, als Zweite ebenfalls ohne Abwurf, überschreitet knapp die zulässige Zeit.", "example_zh": ""}, {"lemma": "triumphieren", "key": "triumphieren", "forms": ["triumphiert", "triumphieren"], "pos": "Verb", "zh": "获胜，凯旋", "example_de": "Deutschland triumphiert vor Belgien und Großbritannien.", "example_zh": ""}, {"lemma": "die Partystimmung", "key": "partystimmung", "forms": ["Partystimmung"], "pos": "Substantiv", "zh": "节日般的欢乐气氛", "example_de": "Er sorgt mit einem sehr guten Ritt für Partystimmung in Aachen.", "example_zh": ""}, {"lemma": "fehlerfrei", "key": "fehlerfrei", "forms": ["fehlerfrei", "fehlerfrei."], "pos": "Adjektiv", "zh": "零失误的", "example_de": "Vor 40.000 Zuschauern in Aachen bleibt Marcus Ehning, der erste deutsche Reiter, fehlerfrei.", "example_zh": ""}], "grammar_points": [{"title": "vor + Dativ — 名次先于", "summary": "triumphieren vor jemandem 表示压过某人获胜、名次在其前，vor 支配第三格，常用于比赛名次：vor Belgien und Großbritannien。", "example_de": "Deutschland triumphiert vor Belgien und Großbritannien.", "example_zh": "德国力压比利时和英国登顶。"}], "background": "2026年亚琛世界马术锦标赛：德国场地障碍团体（Marcus Ehning / Sophie Hinners / Daniel Deußer / Richard Vogel）8月21日夺得团体世界冠军（历史第四次），次日个人决赛德国三人入围，Deußer 领跑。"}, {"title": "Das Wetter", "title_zh": "天气预报", "paras": [{"start": 873.92, "end": 897.28, "lines": [{"de": "Die Wettervorhersage für morgen, Sonntag, den 23. August: Von Westen macht sich Hochdruckeinfluss bemerkbar.", "zh": "明天8月23日星期日的天气预报：高压影响从西部开始显现。", "start": 873.92, "end": 883.56}, {"de": "Es wird freundlicher, in der neuen Woche auch deutlich wärmer.", "zh": "天气转好，新的一周还会明显变暖。", "start": 883.76, "end": 887.56}, {"de": "Heute Nacht meist klar, nur locker, im Norden dichter bewölkt und von den Küsten ziehen Schauer heran.", "zh": "今夜大部晴朗，仅北部云层较厚，沿海有阵雨移近。", "start": 887.68, "end": 894.16}, {"de": "An Flüssen und Seen bildet sich stellenweise Nebel.", "zh": "河流和湖泊边局部起雾。", "start": 894.28, "end": 897.28}]}, {"start": 897.44, "end": 906.4, "lines": [{"de": "Am Tag im Norden windig.", "zh": "白天北部有风。", "start": 897.44, "end": 899.08}, {"de": "Bei Sonne und Wolken ein paar Schauer, an der Ostsee auch kurze Gewitter.", "zh": "阳光伴云，间有阵雨，波罗的海沿岸还有短时雷雨。", "start": 899.28, "end": 903.76}, {"de": "Sonst viel Sonnenschein und lockere Wolken.", "zh": "其余地区阳光充足、云量稀疏。", "start": 903.88, "end": 906.4}]}, {"start": 917.96, "end": 926.08, "lines": [{"de": "Montag oft sonnig und noch wärmer.", "zh": "周一大部晴朗且更暖。", "start": 917.96, "end": 920.08}, {"de": "Von Südwesten ab Dienstag unbeständiger, während es Richtung Nordosten meist sonnig bleibt.", "zh": "周二起西南部天气转不稳定，而东北方向多以晴为主。", "start": 920.48, "e function isLetter(ch) { return /[A-Za-zÄÖÜäöüß]/.test(ch || ''); }
function tokenizeDe(text) {
  let html = '', i = 0;
  const lower = text.toLowerCase();
  while (i < text.length) {
    let hit = '';
    if (i === 0 || !isLetter(text[i - 1])) {
      for (const ph of PHRASES) {
        if (lower.startsWith(ph.toLowerCase(), i) && !isLetter(text[i + ph.length])) {
          hit = text.slice(i, i + ph.length);
          break;
        }
      }
    }
    if (hit) {
      html += wrapWord(hit, lookupKey(hit));
      i += hit.length;
      continue;
    }
    if (isLetter(text[i])) {
      let j = i + 1;
      while (j < text.length && /[A-Za-zÄÖÜäöüß-]/.test(text[j])) j++;
      const word = text.slice(i, j);
      html += wrapWord(word, lookupKey(word));
      i = j;
    } else {
      let j = i + 1;
      while (j < text.length && !isLetter(text[j])) j++;
      html += esc(text.slice(i, j));
      i = j;
    }
  }
  return html;
}

function storyExtras(n, compact) {
  if (compact) {
    const tabs = [];
    const panes = [];
    if (n.background) {
      tabs.push('<button type="button" class="stab" data-pane="bg">背景</button>');
      panes.push(`<div class="spane" data-pane="bg"><div class="rail-note">${esc(n.background)}</div></div>`);
    }
    if (n.vocab.length) {
      tabs.push(`<button type="button" class="stab" data-pane="vocab">词汇 ${n.vocab.length}</button>`);
      panes.push(`<div class="spane" data-pane="vocab">${
        n.vocab.map(v => `<div class="vrow"><div><div class="vw">${esc(v.lemma)}</div><div class="vz">${esc(v.zh)}</div>${v.example_de ? `<div class="vex">${esc(v.example_de)}</div>` : ''}</div><button type="button" class="vadd" data-add="${esc(v.key)}" title="加入生词本" aria-label="加入生词本">+</button></div>`).join('')
      }</div>`);
    }
    if (n.grammar_points.length) {
      tabs.push(`<button type="button" class="stab" data-pane="gram">语法 ${n.grammar_points.length}</button>`);
      panes.push(`<div class="spane" data-pane="gram">${
        n.grammar_points.map(g => `<div class="rail-note"><strong>${esc(g.title)}</strong>${g.example_de ? `<i>${esc(g.example_de)}</i>` : ''}${esc(g.summary)}</div>`).join('')
      }</div>`);
    }
    if (!tabs.length) return '<p class="empty-study">这条没有单独的词汇或语法。</p>';
    return `<div class="study-tabs n${tabs.length}">${tabs.join('')}</div>${panes.join('')}`;
  }
  const vocab = n.vocab.length ? `<details class="sec-vocab"><summary>重点词汇 · ${n.vocab.length}</summary><div class="body">${
    n.vocab.map(v => `<div class="vcard"><div><div class="vcard-top">${esc(v.lemma)}${v.pos ? `<span class="vpos">${esc(v.pos)}</span>` : ''}</div><div class="vzh">${esc(v.zh)}</div>${v.example_de ? `<div class="vex">${esc(v.example_de)}</div>` : ''}</div><button type="button" class="vadd" data-add="${esc(v.key)}" title="加入生词本" aria-label="加入生词本">+</button></div>`).join('')
  }</div></details>` : '';
  const gram = n.grammar_points.length ? `<details class="sec-gram"><summary>语法 · ${n.grammar_points.length}</summary><div class="body">${
    n.grammar_points.map(g => `<div class="gcard"><h4>${esc(g.title)}</h4>${g.example_de ? `<div class="gex">${esc(g.example_de)}</div>` : ''}${g.example_zh ? `<div class="gexzh">${esc(g.example_zh)}</div>` : ''}${g.summary ? `<details class="gmore"><summary>解释</summary><div>${esc(g.summary)}</div></details>` : ''}</div>`).join('')
  }</div></details>` : '';
  const bg = n.background ? `<details class="sec-bg"><summary>背景资料</summary><div class="body"><p class="bg-note">AI 整理，未经独立来源核验</p>${esc(n.background)}</div></details>` : '';
  return vocab + gram + bg || '<p class="empty-study">这条没有单独的词汇或语法。</p>';
}

const storyWatch = new IntersectionObserver((entries) => {
  const vis = entries.filter(x => x.isIntersecting).sort((a, b) => b.intersectionRatio - a.intersectionRatio)[0];
  if (vis) setActiveStory(Number(vis.target.dataset.idx));
}, { rootMargin: '-20% 0px -55% 0px', threshold: [0.15, 0.4, 0.7] });
document.querySelectorAll('article[data-idx]').forEach(el => storyWatch.observe(el));

function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtInline(s) { return esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>'); }
function fmtDate(iso) {
  const d = new Date(iso + 'T12:00:00');
  return d.toLocaleDateString('de-DE', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
}
function fmtClock(sec) {
  const s = Math.max(0, Math.floor(Number(sec) || 0));
  return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
}
function mountPlayer() {
  const box = document.getElementById('player');
  const fallback = () => {
    if (!DATA.embed_url) {
      document.getElementById('video-card').style.display = 'none';
      return;
    }
    box.innerHTML = `<iframe src="${esc(DATA.embed_url)}" title="Tagesschau 视频播放器" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen scrolling="no"></iframe>`;
  };
  if (DATA.mp4_url) {
    box.innerHTML = `<video id="av" controls playsinline preload="metadata" src="${esc(DATA.mp4_url)}"></video>`;
    const v = document.getElementById('av');
    let dead = false;
    v.addEventListener('error', () => { if (!dead) { dead = true; fallback(); } });
    v.addEventListener('timeupdate', highlightPlaying);
  } else {
    fallback();
  }
}
function seekTo(sec) {
  const v = document.getElementById('av');
  if (!v || Number.isNaN(sec)) return;
  v.currentTime = sec;
  v.play().catch(() => {});
}
function highlightPlaying() {
  const v = document.getElementById('av');
  if (!v) return;
  const t = v.currentTime;
  let current = null;
  document.querySelectorAll('.sent').forEach(el => {
    const a = parseFloat(el.dataset.start), b = parseFloat(el.dataset.end);
    const on = !Number.isNaN(a) && !Number.isNaN(b) && t >= a && t < b + 0.05;
    el.classList.toggle('now', on);
    if (on) current = el;
  });
  if (current && highlightPlaying._last !== current) {
    highlightPlaying._last = current;
    current.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }
}

const videoCard = document.getElementById('video-card');
const FLOAT_KEY = 'dd-float-pos';
let floatDismissed = false;
function clampFloat(x, y) {
  const w = videoCard.offsetWidth || 210;
  const h = videoCard.offsetHeight || 118;
  const pad = 8;
  return {
    x: Math.min(Math.max(pad, x), Math.max(pad, innerWidth - w - pad)),
    y: Math.min(Math.max(pad, y), Math.max(pad, innerHeight - h - pad))
  };
}
function applyFloatPos(x, y) {
  const p = clampFloat(x, y);
  videoCard.style.left = p.x + 'px';
  videoCard.style.top = p.y + 'px';
  videoCard.style.right = 'auto';
  saveStored(FLOAT_KEY, p);
}
function restoreFloatPos() {
  const pos = loadStored(FLOAT_KEY, null);
  if (pos && typeof pos.x === 'number' && typeof pos.y === 'number') applyFloatPos(pos.x, pos.y);
}
function clearFloatPos() {
  videoCard.style.left = '';
  videoCard.style.top = '';
  videoCard.style.right = '';
}
const videoObserver = new IntersectionObserver(([entry]) => {
  if (innerWidth > 840) {
    videoCard.classList.remove('floating', 'float-off');
    clearFloatPos();
    return;
  }
  if (entry.isIntersecting) {
    floatDismissed = false;
    videoCard.classList.remove('floating', 'float-off');
    clearFloatPos();
  } else if (!floatDismissed && DATA.embed_url) {
    videoCard.classList.add('floating');
    requestAnimationFrame(restoreFloatPos);
  }
}, { threshold: 0 });
videoObserver.observe(document.getElementById('video-anchor'));
document.getElementById('video-float-close').onclick = () => {
  floatDismissed = true;
  videoCard.classList.remove('floating');
  videoCard.classList.add('float-off');
  clearFloatPos();
};
(function enableFloatDrag() {
  const handle = document.getElementById('video-drag');
  let drag = null;
  handle.addEventListener('pointerdown', e => {
    if (!videoCard.classList.contains('floating') || e.button) return;
    e.preventDefault();
    const r = videoCard.getBoundingClientRect();
    drag = { ox: e.clientX - r.left, oy: e.clientY - r.top };
    handle.setPointerCapture(e.pointerId);
  });
  handle.addEventListener('pointermove', e => {
    if (!drag) return;
    applyFloatPos(e.clientX - drag.ox, e.clientY - drag.oy);
  });
  const stop = () => { drag = null; };
  handle.addEventListener('pointerup', stop);
  handle.addEventListener('pointercancel', stop);
})();
addEventListener('resize', () => {
  if (innerWidth > 840) {
    videoCard.classList.remove('floating', 'float-off');
    clearFloatPos();
  } else if (videoCard.classList.contains('floating')) {
    const r = videoCard.getBoundingClientRect();
    applyFloatPos(r.left, r.top);
  }
});
