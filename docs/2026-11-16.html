    <script id="dd-data" type="application/json">{"page":"lesson","lesson":{"slug":"2026-11-16","date":"2026-11-16","show":"tagesschau in Einfacher Sprache","level":"A2–B1","kind":"broadcast","note":"","source_url":"https://www.tagesschau.de/tagesschau_in_einfacher_sprache/tse-1518.html","video":{"mp4":"https://tagesschau-progressive.ard-mcdn.de/video/2026/1116/TV-20261116-1746-0600.webl.h264.mp4","embed":"","page":"https://www.tagesschau.de/tagesschau_in_einfacher_sprache/video-1684810.html"},"duration":481.4,"sentences":[{"de":"Willkommen zur tagesschau in Einfacher Sprache.","zh":"欢迎收看《简单语言新闻》。","start":10.68,"end":14.56},{"de":"Ich bin Susanne Stichler und das sind unsere Nachrichten:","zh":"我是Susanne Stichler，以下是我们的新闻：","start":14.68,"end":19.24},{"de":"Und nun zur ersten Nachricht:","zh":"现在来看第一条新闻：","start":39.6,"end":42.08},{"de":"Die Frau auf dem Foto ist Manuela Schwesig.","zh":"照片上的这位女性是Manuela Schwesig。","start":47.56,"end":51.24},{"de":"Sie bleibt Ministerpräsidentin von Mecklenburg-Vorpommern.","zh":"她继续担任梅克伦堡-前波美拉尼亚州的州长。","start":51.28,"end":55.8},{"de":"Ministerpräsidentin bedeutet Chefin von der Regierung.","zh":"州长就是一个政府的最高领导人。","start":56.52,"end":60.32},{"de":"Mecklenburg-Vorpommern ist ein Bundesland im Osten von Deutschland.","zh":"梅克伦堡-前波美拉尼亚是德国东部的一个联邦州。","start":60.96,"end":66.56},{"de":"Das Parlament dort hat Schwesig wieder gewählt.","zh":"那里的州议会再次选举了Schwesig。","start":67.04,"end":70.68},{"de":"Vor der Wahl war Schwesig auch schon Ministerpräsidentin.","zh":"在这次选举之前，Schwesig就已经是州长了。","start":71.52,"end":75.88},{"de":"Sie ist von der Partei SPD und regiert zusammen mit der Linkspartei und der Partei von den Grünen.","zh":"她属于社民党（SPD），与左翼党和绿党共同执政。","start":76.4,"end":86.28},{"de":"Und nun zur nächsten Nachricht:","zh":"现在来看下一条新闻：","start":88.32,"end":90.8},{"de":"In der Ukraine ist schon lange Krieg.","zh":"乌克兰的战争已经持续很久了。","start":95.8,"end":98.56},{"de":"Russland hat die Ukraine nämlich angegriffen.","zh":"是俄罗斯进攻了乌克兰。","start":99.4,"end":103.12},{"de":"Dagegen wehrt sich die Ukraine.","zh":"乌克兰对此进行抵抗。","start":103.48,"end":106.12},{"de":"Russland greift oft Anlagen für Strom an.","zh":"俄罗斯经常攻击电力设施。","start":106.96,"end":111.16},{"de":"Deshalb gibt es jetzt im Winter besonders große Probleme in der Ukraine.","zh":"因此，乌克兰现在在冬天面临特别大的问题。","start":111.84,"end":118.04},{"de":"Es ist nämlich oft dunkel, ohne Strom, so wie auf dem Foto.","zh":"因为常常停电，一片漆黑，就像照片上那样。","start":118.08,"end":124.24},{"de":"Und in vielen Wohnungen ist es kalt.","zh":"而且许多住宅里很冷。","start":124.88,"end":128.6},{"de":"Wie die Menschen damit leben, das zeigen wir in einem Film.","zh":"人们如何在这样的条件下生活，我们将在一个影片中展示。","start":129.36,"end":133.8},{"de":"Es ist dunkel in der ukrainischen Hauptstadt Kiew.","zh":"乌克兰首都基辅一片漆黑。","start":133.84,"end":138.88},{"de":"Es gibt nämlich keinen Strom.","zh":"因为没有电。","start":138.92,"end":141.92},{"de":"Deshalb benutzt diese Mutter eine Taschenlampe.","zh":"所以这位母亲使用手电筒。","start":142.52,"end":146.16},{"de":"Russland hat zwei wichtige Anlagen für Strom zerstört.","zh":"俄罗斯摧毁了两座重要的电力设施。","start":146.88,"end":151.68},{"de":"Jetzt gibt es am Tag nur vier Stunden Strom.","zh":"现在白天只有四个小时有电。","start":151.72,"end":156.56},{"de":"In der Küche brennt eine Lampe mit Akku.","zh":"厨房里亮着一盏充电式灯。","start":156.96,"end":160.32},{"de":"Die Mutter sagt, wir laufen mit der Taschenlampe herum.","zh":"这位母亲说：我们拿着手电筒走来走去。","start":162.12,"end":166.16},{"de":"Und manchmal gibt es auch kein Wasser zum Zähneputzen.","zh":"有时候连刷牙的水都没有。","start":166.2,"end":171.08},{"de":"Der Alltag ist schwierig.","zh":"日常生活很艰难。","start":171.64,"end":174.12},{"de":"Die Mutter kann nicht mehr zur Arbeit gehen.","zh":"这位母亲无法再去上班。","start":174.64,"end":177.72},{"de":"Sie muss auf die Kinder aufpassen.","zh":"她必须照顾孩子们。","start":177.88,"end":180.32},{"de":"Sie können nämlich manchmal nicht in die Schule.","zh":"因为孩子们有时不能去学校。","start":180.76,"end":183.92},{"de":"Die Mutter sagt, wenn Russland angreift, dann müssen die Kinder in den Schutzraum von der Schule.","zh":"这位母亲说：当俄罗斯发动攻击时，孩子们必须躲进学校的防空室。","start":183.96,"end":191.08},{"de":"Es gibt dort aber nicht genug Platz.","zh":"但那里空间不够。","start":191.12,"end":193.96},{"de":"Deshalb sind die Kinder nacheinander in der Schule und oft zu Hause.","zh":"因此孩子们轮流到学校上课，很多时候待在家里。","start":194.84,"end":199.92},{"de":"Die Mutter sagt auch, wir schlafen im Wohnzimmer.","zh":"这位母亲还说：我们睡在客厅里。","start":200.84,"end":204.44},{"de":"Dort ist es wärmer als im Schlafzimmer.","zh":"那里比卧室暖和。","start":204.76,"end":207.72},{"de":"Hier habe ich einen Vorhang gegen Raketenangriffe.","zh":"我在这里挂了一个防导弹袭击的窗帘。","start":208.0,"end":211.8},{"de":"Wenn eine Rakete in der Nähe trifft, dann fliegt das Glas vom Fenster nicht in die Wohnung.","zh":"如果导弹在附近爆炸，玻璃就不会从窗户飞进房间里。","start":211.84,"end":219.12},{"de":"Für den Winter will sich die Familie eine Heizung für Gas kaufen.","zh":"为了过冬，这家人想买一台燃气取暖器。","start":219.16,"end":223.72},{"de":"Aber wenn es vielleicht bald kein Wasser mehr gibt, dann wohnt die Familie bei Freunden auf dem Land.","zh":"但如果可能很快没有水了，这家人就搬到乡下的朋友家住。","start":223.88,"end":231.16},{"de":"Und nun zur nächsten Nachricht:","zh":"现在来看下一条新闻：","start":233.08,"end":235.52},{"de":"Der Papst ist der Chef von der katholischen Kirche.","zh":"教皇是天主教会的最高领袖。","start":240.0,"end":244.28},{"de":"Er heißt Leo XIV.","zh":"他叫利奥十四世（Leo XIV.）。","start":244.32,"end":246.28},{"de":"Und ist auf dem Foto.","zh":"他就是照片上的人。","start":247.32,"end":249.2},{"de":"Leo hat gerade eine Reise nach Südamerika gemacht.","zh":"利奥刚刚完成了一次南美之行。","start":249.4,"end":253.8},{"de":"Dort hat er verschiedene Länder besucht.","zh":"他在那里访问了几个国家。","start":254.36,"end":257.36},{"de":"Am Ende von der Reise war er in Peru.","zh":"行程的最后他在秘鲁。","start":258.2,"end":261.4},{"de":"Dazu kommt jetzt ein Film.","zh":"接下来请看一个影片。","start":262.0,"end":263.84},{"de":"Diese Menschen warten auf den Papst.","zh":"这些人在等待教皇。","start":264.8,"end":268.24},{"de":"Sie sind in die Stadt Cusco gekommen, um Leo zu sehen.","zh":"他们来到库斯科市，就是为了见利奥。","start":268.6,"end":273.48},{"de":"Cusco ist in den Anden, in sehr hohen Bergen.","zh":"库斯科位于安第斯山脉，在非常高的山上。","start":274.12,"end":278.32},{"de":"Diese Frau sagt, ich bin aufgeregt.","zh":"这位女士说：我很激动。","start":278.96,"end":282.36},{"de":"Ich freue mich, den Papst zu sehen.","zh":"我很高兴能见到教皇。","start":282.68,"end":285.2},{"de":"Ich danke Gott, dass ich Leo sehen darf.","zh":"我感谢上帝，让我能够见到利奥。","start":285.44,"end":288.6},{"de":"Nicht jeder hat diese Chance.","zh":"不是每个人都有这样的机会。","start":288.64,"end":291.08},{"de":"Tausende Menschen sind gekommen, um den Papst zu sehen.","zh":"成千上万的人前来见教皇。","start":293.72,"end":297.8},{"de":"Es war eine anstrengende Reise.","zh":"这是一次辛苦的旅程。","start":298.28,"end":300.64},{"de":"Die Stadt Cusco ist auf über 3000 Metern Höhe in den Anden.","zh":"库斯科市位于安第斯山脉海拔3000多米处。","start":301.28,"end":306.96},{"de":"Der Papst hält eine Rede.","zh":"教皇发表演讲。","start":307.96,"end":310.36},{"de":"Er sagt, die jungen Menschen sollen den Mut haben, die Welt besser zu machen.","zh":"他说，年轻人应该有勇气，让世界变得更美好。","start":311.16,"end":318.56},{"de":"Und sie sollen dabei auch neue Wege gehen.","zh":"他们在此过程中也应该走新的道路。","start":319.44,"end":323.24},{"de":"Der Papst besucht auch die Region bei dem Fluss Amazonas.","zh":"教皇还访问了亚马孙河附近的地区。","start":324.32,"end":329.32},{"de":"Er trifft Menschen, die in dieser Region leben.","zh":"他会见了生活在这一地区的人们。","start":329.36,"end":334.24},{"de":"Er sagt, ich wünsche mir Schutz für die Menschen in der Amazonas-Region.","zh":"他说：我希望亚马孙地区的人们得到保护。","start":334.76,"end":341.52},{"de":"Sie leiden unter der Zerstörung von der Natur.","zh":"他们因自然被破坏而受苦。","start":341.68,"end":345.84},{"de":"Sie leiden, wenn Firmen Geschäfte machen.","zh":"当公司做生意时，他们也受苦。","start":346.8,"end":350.52},{"de":"Die Firmen denken nur an Geld, verschmutzen das Wasser und zerstören den Wald.","zh":"这些公司只想着钱，污染水源，毁坏森林。","start":351.12,"end":358.76},{"de":"Diese Frau aus der Amazonas-Region sagt, was der Papst sagt, das ist wichtig für uns.","zh":"这位来自亚马孙地区的女士说：教皇说的话，对我们很重要。","start":359.36,"end":367.28},{"de":"Der Papst gibt uns Kraft, weiter für die Natur zu kämpfen.","zh":"教皇给了我们力量，让我们继续为大自然而奋斗。","start":367.64,"end":372.64},{"de":"Zum Schluss von der Reise besucht der Papst die Menschen in der Hauptstadt von Peru.","zh":"行程的最后，教皇访问了秘鲁首都的人们。","start":374.44,"end":380.6},{"de":"Sie heißt Lima.","zh":"首都是利马。","start":380.8,"end":382.0},{"de":"Papst Leo war fast zwei Wochen in Südamerika unterwegs.","zh":"教皇利奥在南美行程将近两周。","start":382.8,"end":388.84},{"de":"Und nun zur nächsten Nachricht:","zh":"现在来看下一条新闻：","start":390.84,"end":393.48},{"de":"Im Fußball gibt es gerade die Spiele von der Nations League.","zh":"足球界目前正在进行欧洲国家联赛的比赛。","start":397.56,"end":403.12},{"de":"Dabei spielen europäische Fußballteams von den Männern gegeneinander.","zh":"欧洲的男子足球队在其中相互比赛。","start":403.72,"end":408.92},{"de":"Deutschland spielt jetzt gegen die Niederlande.","zh":"德国队现在对阵荷兰队。","start":409.4,"end":412.84},{"de":"Es ist ein wichtiges Spiel, auch für den neuen Trainer Jürgen Klopp.","zh":"这是一场重要的比赛，对新教练Jürgen Klopp来说也是如此。","start":412.88,"end":418.84},{"de":"Er ist der Mann auf dem Foto mit der schwarzen Kappe.","zh":"他就是照片上戴黑色帽子的男士。","start":419.44,"end":423.52},{"de":"Wenn Deutschland gegen die Niederlande gewinnt, dann ist Deutschland sicher im Viertelfinale von der Nations League.","zh":"如果德国队战胜荷兰队，德国队就肯定进入国家联赛的四分之一决赛。","start":424.28,"end":432.84},{"de":"Und das waren unsere Nachrichten:","zh":"以上就是我们的新闻：","start":433.76,"end":436.56},{"de":"Und jetzt kommt das Wetter.","zh":"现在来看天气预报。","start":457.2,"end":459.2},{"de":"Es regnet und es ist windig.","zh":"有雨，风也很大。","start":460.16,"end":463.2},{"de":"Manchmal gibt es auch Sturm oder Gewitter.","zh":"有时还会有暴风雨或雷雨。","start":463.4,"end":466.48},{"de":"Und es gibt nur wenig Sonne in der Mitte von Deutschland.","zh":"德国中部阳光很少。","start":466.8,"end":470.96},{"de":"Es werden 4 bis 17 Grad.","zh":"气温为4到17度。","start":471.0,"end":473.76},{"de":"Das war die tagesschau in Einfacher Sprache.","zh":"以上就是《简单语言新闻》。","start":475.2,"end":478.64},{"d
