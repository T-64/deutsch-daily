 249.74}, {"de": "Zwei große Löcher erinnern an die Hochhäuser.", "zh": "两个巨大的水池让人想起当年的高楼。", "start": 250.66, "end": 253.82}, {"de": "Die Löcher sind dort, wo die Hochhäuser waren.", "zh": "水池就在高楼曾经矗立的地方。", "start": 253.94, "end": 257.14}, {"de": "In den Löchern fließt Wasser herunter.", "zh": "水沿着水池流下。", "start": 257.82, "end": 260.46}, {"de": "Am Rand sind die Namen von den Toten.", "zh": "池边刻着遇难者的名字。", "start": 261.5, "end": 264.14}]}, {"start": 265.1, "end": 290.78, "lines": [{"de": "Neben den Löchern gibt es ein neues, großes Hochhaus.", "zh": "水池旁矗立着一栋新的大型高楼。", "start": 265.1, "end": 268.82}, {"de": "Dort war jetzt die Feier.", "zh": "纪念仪式就在那里举行。", "start": 270.18, "end": 272.1}, {"de": "Viele Menschen sind gekommen.", "zh": "许多人来到了现场。", "start": 272.54, "end": 274.58}, {"de": "Politiker, Angehörige und Helfer von damals.", "zh": "政界人士、遇难者亲属和当年的救援人员。", "start": 274.62, "end": 278.22}, {"de": "Dann ist es ganz still.", "zh": "然后全场一片寂静。", "start": 280.42, "end": 282.46}, {"de": "Eine Glocke läutet.", "zh": "钟声响起。", "start": 282.82, "end": 284.34}, {"de": "In dem Moment flog vor 25 Jahren das erste Flugzeug in das Hochhaus.", "zh": "25年前的这一刻，第一架飞机撞进了高楼。", "start": 286.14, "end": 290.78}]}, {"start": 292.02, "end": 302.9, "lines": [{"de": "Auf der Bühne werden viele Namen vorgelesen.", "zh": "台上宣读着许多名字。", "start": 292.02, "end": 295.3}, {"de": "Es sind die Namen von den Toten.", "zh": "那是遇难者的名字。", "start": 295.42, "end": 297.5}, {"de": "Sie alle starben bei dem großen Terroranschlag.", "zh": "他们全部在那场严重的恐怖袭击中丧生。", "start": 297.74, "end": 300.9}, {"de": "An sie wird erinnert.", "zh": "人们铭记着他们。", "start": 301.34, "end": 302.9}]}], "vocab": [{"lemma": "traurig", "key": "traurig", "forms": ["traurig"], "pos": "Adjektiv", "zh": "悲伤的", "example_de": "Viele Menschen sind noch immer traurig.", "example_zh": ""}, {"lemma": "erinnern an (+Akkusativ)", "key": "erinnern", "forms": ["erinnert", "erinnert an", "wurde erinnert", "erinnern an"], "pos": "Verb", "zh": "回忆、纪念（搭配第四格）"
