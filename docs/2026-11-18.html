    <script id="dd-data" type="application/json">{"page":"lesson","lesson":{"slug":"2026-11-18","date":"2026-11-18","show":"tagesschau in Einfacher Sprache","level":"A2–B1","kind":"broadcast","note":"","source_url":"https://www.tagesschau.de/tagesschau_in_einfacher_sprache/tse-1520.html","video":{"mp4":"https://tagesschau-progressive.ard-mcdn.de/video/2026/1118/TV-20261118-1731-0700.webl.h264.mp4","embed":"","page":"https://www.tagesschau.de/tagesschau_in_einfacher_sprache/video-1685952.html"},"duration":459.8,"sentences":[{"de":"Willkommen zur tagesschau in Einfacher Sprache.","zh":"欢迎收看《简单语言新闻》。","start":10.92,"end":14.2},{"de":"Ich bin Susanne Stichler, und das sind unsere Nachrichten.","zh":"我是Susanne Stichler，以下是我们的新闻。","start":14.72,"end":18.8},{"de":"Und nun zur ersten Nachricht.","zh":"现在来看第一条新闻。","start":39.08,"end":41.16},{"de":"In dem Haus auf dem Foto arbeitet der Bundeskanzler.","zh":"联邦总理在这张照片里的房子里工作。","start":46.64,"end":50.28},{"de":"Das ist das Bundeskanzleramt in Berlin.","zh":"这是位于柏林的联邦总理府。","start":51.4,"end":54.12},{"de":"Dort haben gestern die wichtigsten Politiker von der Regierung beraten.","zh":"昨天，政府最重要的政治家在那里进行了商议。","start":54.96,"end":60.24},{"de":"Und sie haben entschieden:","zh":"他们做出了决定：","start":61.04,"end":62.88},{"de":"Im nächsten Jahr müssen die Menschen weniger für Strom bezahlen.","zh":"明年人们要为电支付的钱会更少。","start":63.04,"end":67.6},{"de":"Die Regierung will nämlich die Stromsteuer senken.","zh":"因为政府想降低电税。","start":68.56,"end":72.16},{"de":"So kann eine Familie ungefähr 100 Euro im Jahr sparen.","zh":"这样一个家庭每年大约可以节省100欧元。","start":73.4,"end":78.84},{"de":"Dazu zeigen wir jetzt einen Film.","zh":"现在我们来看一段影片。","start":79.6,"end":82.0},{"de":"In diesen Autos sitzen die Politiker von der Regierung.","zh":"政府的政治家们坐在这些车里。","start":82.6,"end":86.24},{"de":"Sie haben in der Nacht acht Stunden verhandelt.","zh":"他们谈判了八个小时，一直到深夜。","start":86.36,"end":89.36},{"de":"Dann steht fest: Die Stromsteuer wird im nächsten Jahr gesenkt.","zh":"然后确定了：电税明年将降低。","start":89.4,"end":93.8},{"de":"Diese Frau ist Franziska Hoppermann.","zh":"这位女士是Franziska Hoppermann。","start":94.2,"end":96.84},{"de":"Sie ist die Generalsekretärin von der CDU.","zh":"她是基民盟的总书记。","start":97.04,"end":100.16},{"de":"Sie sagt: Es waren intensive Verhandlungen.","zh":"她说：谈判非常紧张激烈。","start":100.4,"end":103.56},{"de":"Es hat so lange gedauert, weil es um viel Geld geht.","zh":"持续这么久，是因为涉及很多钱。","start":103.76,"end":107.2},{"de":"Aber wir wollen den Menschen helfen.","zh":"但我们想帮助民众。","start":107.4,"end":110.04},{"de":"Die Politiker von CDU, CSU und SPD haben außerdem entschieden:","zh":"基民盟、基社盟和社民党的政治家们还决定了：","start":110.44,"end":114.84},{"de":"Bald soll es einen Spritpreisdeckel geben.","zh":"很快将设立燃油价格上限。","start":115.44,"end":118.44},{"de":"Dann kann die Regierung entscheiden, wie teuer Benzin und Diesel sind.","zh":"这样政府就可以决定汽油和柴油的价格。","start":118.88,"end":123.72},{"de":"Das will sie aber nur machen, wenn der Sprit besonders teuer ist.","zh":"但只有当燃油特别贵时，政府才想这样做。","start":123.88,"end":128.28},{"de":"Und nun zur nächsten Nachricht.","zh":"现在来看下一条新闻。","start":129.08,"end":131.32},{"de":"Das BSW ist eine Partei.","zh":"BSW是一个政党。","start":136.32,"end":138.28},{"de":"Sie wurde von Sahra Wagenknecht gegründet.","zh":"它由Sahra Wagenknecht创立。","start":139.2,"end":142.28},{"de":"Wagenknecht ist auf dem Foto.","zh":"Wagenknecht就在这张照片上。","start":142.8,"end":145.04},{"de":"Das BSW ist Teil von mehreren Parlamenten in Bundesländern.","zh":"BSW是多个联邦州议会的组成部分。","start":145.72,"end":150.2},{"de":"Aber das BSW ist nicht Teil vom Bundestag.","zh":"但BSW不是联邦议院的组成部分。","start":150.68,"end":154.24},{"de":"Bei der Bundestagswahl 2025 hat das BSW nämlich nicht genug Stimmen bekommen.","zh":"因为在2025年联邦议院选举中，BSW没有获得足够的选票。","start":155.76,"end":162.64},{"de":"Es war aber sehr knapp.","zh":"但当时非常接近。","start":163.64,"end":165.48},{"de":"Das BSW sagt: es sind Fehler passiert.","zh":"BSW说：选举中出现了错误。","start":166.64,"end":169.8},{"de":"Wir müssen alle Stimmen von der Wahl mal noch zählen.","zh":"我们必须把选举的所有选票再重新数一遍。","start":170.72,"end":174.52},{"de":"Dann haben wir vielleicht doch genug Stimmen.","zh":"那样我们也许还是会有足够的选票。","start":174.76,"end":178.12},{"de":"Das BSW hat deshalb geklagt.","zh":"因此BSW提起了诉讼。","start":178.56,"end":181.08},{"de":"Jetzt hat das Bundesverfassungsgericht entschieden:","zh":"现在联邦宪法法院做出了裁决：","start":182.8,"end":186.44},{"de":"Es gibt keine Hinweise auf Fehler bei der Wahl.","zh":"没有迹象表明选举中存在错误。","start":186.76,"end":190.48},{"de":"Deshalb wird nicht mal noch ausgezählt.","zh":"因此不会重新计票。","start":191.32,"end":194.28},{"de":"Und nun zur nächsten Nachricht.","zh":"现在来看下一条新闻。","start":195.76,"end":197.92},{"de":"In China gibt es gerade ein großes Treffen von wichtigen Politikern.","zh":"中国目前正在举行一场重要政治家的大型会晤。","start":203.36,"end":208.56},{"de":"Mit dabei sind unter anderem diese drei Männer auf dem Foto.","zh":"照片上的这三位男士也在其中。","start":209.24,"end":213.52},{"de":"Der Präsident von den USA, Trump.","zh":"美国总统特朗普。","start":214.52,"end":217.16},{"de":"Russlands Präsident Putin.","zh":"俄罗斯总统普京。","start":217.8,"end":219.88},{"de":"Und Chinas Präsident Xi.","zh":"以及中国国家主席习近平。","start":220.56,"end":222.76},{"de":"Die drei Politiker sind Teilnehmer bei einem APEC-Treffen.","zh":"这三位政治家是APEC会议的与会者。","start":223.76,"end":227.96},{"de":"APEC ist eine Gruppe von 21 Ländern.","zh":"APEC是一个由21个国家组成的组织。","start":229.16,"end":232.08},{"de":"Auch die USA, Russland und China gehören zur APEC.","zh":"美国、俄罗斯和中国也属于APEC。","start":233.48,"end":237.84},{"de":"Die 21 APEC-Länder arbeiten bei der Wirtschaft zusammen.","zh":"这21个APEC国家在经济上进行合作。","start":239.64,"end":244.2},{"de":"Was ist von dem Treffen zu erwarten?","zh":"这次会晤会有什么值得期待的？","start":245.12,"end":247.72},{"de":"Dazu zeigen wir einen Film.","zh":"我们来看一段影片。","start":247.8,"end":249.72},{"de":"Trump, Xi und Putin.","zh":"特朗普、习近平和普京。","start":251.0,"end":252.8},{"de":"Auf diese drei Politiker schauen viele Menschen beim APEC-Treffen.","zh":"在APEC会议上，许多人关注这三位政治家。","start":253.4,"end":257.72},{"de":"Sie sind die Präsidenten von den mächtigsten Ländern auf der Erde.","zh":"他们是地球上最强大国家的领导人。","start":257.88,"end":262.4},{"de":"In China wollen sie über mehrere Themen sprechen.","zh":"他们想在中国讨论多个议题。","start":262.6,"end":265.56},{"de":"Zum Beispiel über den Krieg in der Ukraine.","zh":"比如乌克兰战争。","start":265.64,"end":268.56},{"de":"Trump hat vor dem Treffen gesagt:","zh":"特朗普在会晤前说过：","start":268.64,"end":271.04},{"de":"Die Ukraine verliert durch den Krieg Teile vom Land.","zh":"乌克兰因战争失去部分国土。","start":271.12,"end":274.52},{"de":"Russland verliert durch den Krieg viele Soldaten.","zh":"俄罗斯因战争失去许多士兵。","start":274.64,"end":277.84},{"de":"Darüber will ich mit Putin und Xi sprechen.","zh":"我想就这些与普京和习近平交谈。","start":277.92,"end":280.96},{"de":"Putin und Xi sind Verbündete, also politische Freunde.","zh":"普京和习近平是盟友，也就是政治上的朋友。","start":282.44,"end":286.48},{"de":"Auch beim APEC-Treffen haben die beiden miteinander gesprochen.","zh":"在亚太经合组织会议期间，两人也进行了交谈。","start":287.12,"end":291.52},{"de":"China will sich bisher nicht in den Krieg von Russland in der Ukraine einmischen.","zh":"到目前为止，中国不想介入俄罗斯在乌克兰的战争。","start":291.6,"end":297.28},{"de":"Am Donnerstag treffen sich Trump, Xi und Putin zu dritt.","zh":"星期四，特朗普、习近平和普京三人将会面。","start":297.36,"end":301.0},{"de":"Dann geht es auch um andere Themen.","zh":"届时还会讨论其他话题。","start":301.08,"end":303.32},{"de":"Dieser Experte sagt:","zh":"这位专家说：","start":303.4,"end":304.96},{"de":"Trump will einen großen Auftritt mit mächtigen Politikern.","zh":"特朗普想和有权势的政治人物一起隆重登场。","start":305.0,"end":309.0},{"de":"Damit will er zeigen, wie wichtig er ist.","zh":"他想借此表明自己有多重要。","start":309.16,"end":312.04},{"de":"Beobachter sagen, Trump, Xi und Putin wollen unterschiedliche Dinge.","zh":"观察人士说，特朗普、习近平和普京想要的东西各不相同。","start":312.2,"end":316.64},{"de":"Es wird schwer für die drei Politiker, sich zu einigen.","zh":"这三位政治人物很难达成一致。","start":316.76,"end":320.68},{"de":"Und nun zur nächsten Nachricht.","zh":"现在来看下一条新闻。","start":321.12,"end":323.36},{"de":"Auf dem Foto ist der Petersdom in Rom.","zh":"照片上是罗马的圣彼得大教堂。","start":327.72,"end":330.56},{"de":"Der Petersdom ist die größte Kirche der Welt.","zh":"圣彼得大教堂是世界上最大的教堂。","start":331.52,"end":335.12},{"de":"Vor 400 Jahren wurde er geweiht.","zh":"它在400年前被祝圣。","start":335.84,"end":338.4},{"de":"Das heißt, es gab den ersten Gottesdienst im Petersdom.","zh":"也就是说，圣彼得大教堂举行了第一次礼拜。","start":339.16,"end":343.52},{"de":"Warum ist die Kirche so besonders?","zh":"为什么这座教堂这么特别？","start":344.4,"end":346.92},{"de":"Dazu zeigen wir jetzt einen Film.","zh":"为此我们现在播放一段影片。","start":347.2,"end":349.72},{"de":"Der Petersdom steht mitten in Rom.","zh":"圣彼得大教堂位于罗马市中心。","start":350.64,"end":353.2},{"de":"Jedes Jahr kommen viele Millionen Menschen, um sich die Kirche anzuschauen.","zh":"每年有数百万的人来参观这座教堂。","start":353.32,"end":358.68},{"de":"Diese Frau aus England sagt:","zh":"这位来自英国的女士说：","start":358.76,"end":360.72},{"de":"Ich bin begeistert, so viel Kunst, so viel Gold!","zh":"我太惊艳了，这么多艺术，这么多黄金！","start":360.8,"end":364.2},{"de":"Und dieser Mann aus Deutschland sagt:","zh":"这位来自德国的男士说：","start":364.32,"end":366.56},{"de":"Ich gehe nicht oft in Kirchen.","zh":"我不常去教堂。","start":366.68,"end":368.64},{"de":"Aber der Petersdom war eine ganz besondere Erfahrung.","zh":"但圣彼得大教堂是一次非常特别的体验。","start":368.72,"end":372.44},{"de":"Viele Künstler haben an der Kirche mitgearbeitet.","zh":"许多艺术家参与了这座教堂的建造。","start":372.52,"end":375.84},{"de":"Zum Beispiel Raffael, Michelangelo oder Bernini.","zh":"比如拉斐尔、米开朗基罗和贝尼尼。","start":375.92,"end":379.16},{"de":"Die Künstler haben die Wände und Decken bemalt.","zh":"艺术家们绘制了墙壁和天花板。","start":379.6,"end":382.92},{"de":"Und sie haben einzelne Kunstwerke geschaffen.","zh":"他们还创作了许多单独的艺术品。","start":383.04,"end":386.16},{"de":"Wie diese Säulen mit einem Dach.","zh":"比如这些带有屋顶的柱子。","start":386.28,"end":388.72},{"de":"Dieser Experte kennt sich gut aus mit dem Petersdom.","zh":"这位专家非常了解圣彼得大教堂。","start":390.04,"end":393.68},{"de":"Er sagt:","zh":"他说：","start":393.72,"end":394.88},{"de":"Es hat 120 Jahre gedauert, bis der Petersdom fertig war.","zh":"圣彼得大教堂花了120年才建成。","start":394.92,"end":398.84},{"de":"Deshalb konnten sehr viele verschiedene Künstler mitarbeiten.","zh":"因此有很多不同的艺术家参与了建造。","start":398.92,"end":403.6},{"de":"Im Petersdom gibt es auch weiterhin Gottesdienste.","zh":"圣彼得大教堂现在仍在举行礼拜。","start":404.4,"end":407.88},{"de":"Die Kirche ist beides:","zh":"这座教堂两者兼备：","start":408.0,"end":409.64},{"de":"Ein Ort für Gläubige und ein Ort für Touristen.","zh":"既是信徒的地方，也是游客的地方。","start":409.72,"end":413.28},{"de":"Und das waren unsere Nachrichten.","zh":"以上就是我们的新闻。","start":415.44,"end":417.8},{"de":"Und jetzt kommt noch das Wetter.","zh":"现在还有天气预报。","start":434.44,"end":436.72},{"de":"Überall in Deutschland gibt es viele Wolken und Wind.","zh":"德国各地都有很多云和风。","start":437.24,"end":441.04},{"de":"Unten im Süden und links im Westen regnet es außerdem stark.","zh":"此外，南部和西部雨下得很大。","start":441.4,"end":445.76},{"de":"Auch oben im Norden und rechts im Osten ist es nass.","zh":"北部和东部也有降雨。","start":446.12,"end":449.84},{"de":"Es werden 4 bis 14 Grad.","zh":"气温是4到14度。","start":450.32,"end":452.36},{"de":"Das war die tagesschau in Einfacher Sprache.","zh":"以上就是简单语言版的每日新闻。","start":454.12,"end":457.24},{"de":"Tschüss und bis zum nächsten Mal.","zh":"再见，下次见。","start":457.32,"end":459.8}],"stories":[{"title":"Begrüßung","title_zh":"开场问候","from":0,"to":2,"vocab":[],"grammar":[],"background":""},{"title":"Regierung plant weniger Steuern für Strom","title_zh":"政府计划降低电力税","from":3,"to":22,"vocab":[{"key":"regierung","lemma":"die Regierung, -en","pos":"noun","zh":"政府","example_de":"Die Regierung will nämlich die Stromsteuer senken.","example_zh":"因为政府想降低电税。"},{"key":"stromsteuer","lemma":"die Steuer, -n","pos":"noun","zh":"税；电力税","example_de":"Die Regierung will nämlich die Stromsteuer senken.","example_zh":"因为政府想降低电税。"},{"key":"verhandeln","lemma":"verhandeln","pos":"verb","zh":"谈判，磋商","example_de":"Sie haben in der Nacht acht Stunden verhandelt.","example_zh":"他们
