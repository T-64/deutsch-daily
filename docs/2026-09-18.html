    <div id="root"></div>
    <script id="dd-data" type="application/json">{"page":"lesson","lesson":{"slug":"2026-09-18","date":"2026-09-18","show":"tagesschau in Einfacher Sprache","level":"A2–B1","kind":"video","note":"","source_url":"https://www.tagesschau.de/tagesschau_in_einfacher_sprache/video-1651276.html","video":{"mp4":"https://tagesschau-progressive.ard-mcdn.de/video/2026/0918/TV-20260918-1818-5000.webl.h264.mp4","embed":"https://www.tagesschau.de/tagesschau_in_einfacher_sprache/video-1651276~player.html","page":"https://www.tagesschau.de/tagesschau_in_einfacher_sprache/video-1651276.html"},"duration":455.76,"sentences":[{"de":"Willkommen zur tagesschau in Einfacher Sprache.","zh":"欢迎收看简易德语每日新闻。","start":10.8,"end":13.88},{"de":"Ich bin Susanne Holst und das sind unsere Nachrichten.","zh":"我是苏珊娜·霍尔斯特，以下就是今天的新闻。","start":null,"end":null},{"de":"Und nun zur 1. Nachricht: In Deutschland gibt es 16 Bundesländer.","zh":"现在进入第一条新闻：德国有16个联邦州。","start":32.2,"end":41.12},{"de":"Jedes Bundesland hat ein eigenes Parlament.","zh":"每个联邦州都有自己的议会。","start":41.4,"end":44.4},{"de":"Das Parlament wählt die Regierung von dem Bundesland und entscheidet über Gesetze.","zh":"议会选举州的政府，并决定法律。","start":44.96,"end":49.92},{"de":"In den Bundesländern Mecklenburg-Vorpommern und Berlin wird am Sonntag ein neues Parlament gewählt.","zh":"梅克伦堡-前波美拉尼亚州和柏林这两个联邦州将于周日选举新的议会。","start":50.48,"end":56.92},{"de":"Wer sind die Kandidaten?","zh":"候选人是谁？","start":57.24,"end":58.84},{"de":"Wer hat Chancen, zu gewinnen?","zh":"谁有机会获胜？","start":58.92,"end":60.88},{"de":"Dazu zeigen wir jetzt einen Film.","zh":"接下来我们播放一段影片。","start":60.96,"end":63.4},{"de":"Das Land Mecklenburg-Vorpommern liegt im Osten von Deutschland.","zh":"梅克伦堡-前波美拉尼亚州位于德国东部。","start":64.0,"end":68.24},{"de":"Direkt an der Ostsee.","zh":"就在波罗的海边。","start":68.28,"end":70.08},{"de":"Manuela Schwesig ist im Moment die Chefin von der Regierung in Mecklenburg-Vorpommern.","zh":"玛努埃拉·施维西是目前梅前州的政府首脑。","start":70.68,"end":75.96},{"de":"Sie ist von der Partei SPD.","zh":"她来自社民党。","start":76.0,"end":77.88},{"de":"Sie sagt: Ich will wieder Chefin von der Regierung werden.","zh":"她说：我想再次成为政府首脑。","start":78.52,"end":82.6},{"de":"Auch dieser Mann will Chef von der Regierung in Mecklenburg-Vorpommern werden.","zh":"这位男士也想成为梅前州的政府首脑。","start":83.12,"end":88.04},{"de":"Er heißt Leif-Erik Holm.","zh":"他叫莱夫-埃里克·霍尔姆。","start":88.08,"end":89.92},{"de":"Er ist von der Partei AfD.","zh":"他来自德国选择党。","start":90.2,"end":92.12},{"de":"Wahrscheinlich gewinnt entweder Holm oder Schwesig die Wahl.","zh":"获胜的很可能是霍尔姆或者施维西二者之一。","start":92.92,"end":97.12},{"de":"Die anderen Parteien bekommen vermutlich nicht genug Stimmen, um die neue Regierung anzuführen.","zh":"其他政党估计拿不到足够的选票来领导新政府。","start":97.16,"end":103.16},{"de":"In Berlin wird am Sonntag auch gewählt.","zh":"柏林周日也要选举。","start":104.08,"end":106.76},{"de":"Dort ist die Situation ganz anders.","zh":"那里的情况完全不同。","start":106.84,"end":109.28},{"de":"In Berlin gibt es drei oder vier Parteien, die bei der Wahl gewinnen können: die Linke, die CDU, die AfD und die Grünen.","zh":"柏林有三四个政党有机会赢得选举：左翼党、基民盟、德国选择党和绿党。","start":109.32,"end":125.8},{"de":"Im Moment ist Kai Wegner von der CDU der Chef von der Regierung in Berlin.","zh":"目前的柏林政府首脑是基民盟的凯·韦格纳。","start":126.84,"end":131.64},{"de":"Er hört nach der Wahl aber auf jeden Fall auf.","zh":"但无论选举结果如何，他都会卸任。","start":131.68,"end":134.64},{"de":"In Deutschland ist Tanken gerade sehr teuer.","zh":"眼下在德国加油非常贵。","start":134.68,"end":145.44},{"de":"Benzin und Diesel kosten so viel wie noch nie.","zh":"汽油和柴油的价格前所未有地高。","start":146.08,"end":149.16},{"de":"Das liegt an dem Krieg im Nahen Osten.","zh":"原因是中东的战争。","start":149.2,"end":151.84},{"de":"Die Regierung sagt: Wir wollen den Menschen helfen.","zh":"政府说：我们想帮助民众。","start":151.96,"end":155.44},{"de":"Die Partei CDU schlägt vor, Sprit soll ab Oktober bis zu 25 Cent billiger werden.","zh":"基民盟提议，从十月起燃油每升最多便宜25欧分。","start":155.52,"end":162.04},{"de":"Was sie dafür tun will, hat die Regierung aber noch nicht entschieden.","zh":"但政府还没有决定为此采取什么措施。","start":163.04,"end":168.28},{"de":"Vielleicht kommt der Tankrabatt wieder.","zh":"加油折扣也许会回来。","start":168.32,"end":171.04},{"de":"Den gab es schon im Mai und Juni.","zh":"五月和六月就有过这个折扣。","start":171.08,"end":173.44},{"de":"Dadurch wurde der Sprit um einige Cent günstiger.","zh":"当时燃油因此便宜了几欧分。","start":173.48,"end":176.88},{"de":"Die SPD sagt: Wir wollen uns schnell entscheiden.","zh":"社民党说：我们想尽快做出决定。","start":176.92,"end":180.36},{"de":"In Russland bestimmt seit mehr als 25 Jahren Wladimir Putin.","zh":"在俄罗斯，弗拉基米尔·普京已经说了算超过25年。","start":181.2,"end":192.32},{"de":"Er ist Präsident und herrscht autoritär.","zh":"他是总统，实行威权统治。","start":192.72,"end":195.96},{"de":"Das bedeutet: Er lässt keine anderen Meinungen zu.","zh":"这意味着：他不允许其他意见存在。","start":196.36,"end":200.04},{"de":"Viele Gegner von Putin sind im Gefängnis, im Ausland oder nicht mehr am Leben.","zh":"普京的许多反对者被关在监狱里、流亡国外，或者已经不在人世。","start":200.92,"end":206.6},{"de":"Journalisten dürfen in Russland nicht frei berichten.","zh":"在俄罗斯，记者不得自由报道。","start":207.36,"end":211.08},{"de":"Trotzdem wird in Russland gewählt, z.B. jetzt bei der Parlamentswahl.","zh":"尽管如此，俄罗斯仍然举行选举，比如现在的议会选举。","start":211.28,"end":216.28},{"de":"Auf dem Foto ist eine Frau in einem Wahllokal.","zh":"照片上是一位女性在投票站里。","start":216.68,"end":220.2},{"de":"Bei der Wahl dürfen aber nicht alle Parteien mitmachen.","zh":"但这次选举并不是所有政党都能参加。","start":220.24,"end":224.08},{"de":"Wenn z.B. eine Partei den Krieg von Russland in der Ukraine kritisiert, dann darf sie nicht mitmachen.","zh":"比如一个政党如果批评俄罗斯在乌克兰的战争，它就不许参加。","start":224.44,"end":232.24},{"de":"Wir zeigen jetzt einen Film über die Parlamentswahl.","zh":"现在我们播放一段关于这次议会选举的影片。","start":232.28,"end":235.52},{"de":"Dieser Mann ist Grigory Grishin.","zh":"这位男士是格里戈里·格里申。","start":236.56,"end":239.16},{"de":"Er ist gegen Präsident Putin und den Krieg in der Ukraine.","zh":"他反对普京总统和乌克兰的战争。","start":239.36,"end":243.44},{"de":"Seine Partei heißt Jabloko.","zh":"他的政党叫亚博卢。","start":243.72,"end":245.8},{"de":"Die Partei darf bei der Wahl nicht mitmachen.","zh":"这个政党不许参加选举。","start":246.4,"end":249.28},{"de":"Als einzelner Kandidat darf Grishin aber antreten.","zh":"但作为独立候选人，格里申可以参选。","start":249.32,"end":252.84},{"de":"Er sagt: Die Leute wissen: Meine Partei will Frieden in der Ukraine.","zh":"他说：大家知道，我的政党想要乌克兰和平。","start":253.76,"end":258.68},{"de":"Das wollen auch viele Menschen in Moskau.","zh":"莫斯科的许多民众也希望如此。","start":258.72,"end":261.2},{"de":"Sie zwinkern mir zu oder geben mir die Hand.","zh":"他们向我眨眼示意，或者和我握手。","start":261.24,"end":264.24},{"de":"Nur wenige Menschen in Russland trauen sich, gegen Putin zu protestieren.","zh":"在俄罗斯，只有少数人敢抗议普京。","start":264.76,"end":269.8},{"de":"Vor allem junge Menschen sind gegen den Krieg.","zh":"尤其是年轻人反对这场战争。","start":269.84,"end":272.68},{"de":"Sie helfen Grishin beim Wahlkampf in der Stadt.","zh":"他们在城里帮格里申做竞选宣传。","start":272.72,"end":275.64},{"de":"Grishin wählt mit seinem Sohn in Moskau.","zh":"格里申和儿子一起在莫斯科投票。","start":277.08,"end":279.88},{"de":"Er rechnet nicht damit, einen Sitz im Parlament zu bekommen.","zh":"他不指望自己能获得议会席位。","start":279.92,"end":283.88},{"de":"Trotzdem tritt er an.","zh":"尽管如此他还是参选了。","start":283.92,"end":285.44},{"de":"Er sagt: Am Montag weiß ich, ob ich bald im Parlament sitze oder nicht.","zh":"他说：周一我就会知道，我是否很快能坐进议会。","start":287.72,"end":292.36},{"de":"Egal, wie es ausgeht: Ich habe das Gefühl, hier etwas Wichtiges zu machen.","zh":"无论结果如何：我有种感觉，自己正在做一件重要的事。","start":292.44,"end":297.36},{"de":"Grishin ist es wichtig zu zeigen.","zh":"格里申想表明一件事。","start":297.4,"end":299.52},{"de":"In Russland gibt es noch Menschen, die anders denken als Putin.","zh":"在俄罗斯，还有和普京想法不同的人。","start":299.56,"end":303.6},{"de":"Malaria ist eine gefährliche Krankheit.","zh":"疟疾是一种危险的疾病。","start":304.68,"end":313.6},{"de":"Menschen können an Malaria sterben.","zh":"人可能死于疟疾。","start":313.64,"end":316.36},{"de":"Die Krankheit bekommen Menschen durch den Stich von bestimmten Mücken.","zh":"人们是通过某种蚊子的叮咬感染这种疾病的。","start":317.12,"end":321.56},{"de":"Auf dem Foto ist so eine Mücke.","zh":"照片上就是这种蚊子。","start":321.8,"end":324.0},{"de":"Bei dem Mückenstich kommt ein winziges Lebewesen in den Körper.","zh":"蚊子叮咬时，一种微小的生物会进入人体。","start":324.6,"end":328.6},{"de":"Dieses Lebewesen löst Malaria aus.","zh":"这种生物引发疟疾。","start":328.64,"end":331.52},{"de":"Normalerweise gibt es Malaria nur in sehr warmen Ländern.","zh":"通常疟疾只存在于非常炎热的国家。","start":332.64,"end":336.48},{"de":"Jetzt ist die Krankheit aber auch in der Stadt Frankfurt.","zh":"但现在法兰克福市也出现了这种疾病。","start":336.52,"end":340.28},{"de":"Acht Menschen sind krank, drei sind an Malaria gestorben.","zh":"已有八人患病，三人死于疟疾。","start":340.32,"end":344.52},{"de":"Warum?","zh":"为什么？","start":344.96,"end":345.96},{"de":"Dazu zeigen wir einen Film.","zh":"接下来我们播放一段影片。","start":346.16,"end":348.08},{"de":"Am Flughafen in Frankfurt kommen jeden Tag sehr viele Flugzeuge an.","zh":"法兰克福机场每天都有大量飞机抵达。","start":348.96,"end":353.56},{"de":"Auch aus Ländern, in denen es Malaria gibt.","zh":"也包括来自存在疟疾国家的飞机。","start":353.64,"end":356.56},{"de":"Die Behörden sagen: Wahrscheinlich ist eine Malaria-Mücke in einem Koffer mit nach Frankfurt gekommen.","zh":"当局说：很可能是一只疟蚊随着行李箱来到了法兰克福。","start":356.64,"end":362.76},{"de":"Dort hat sie dann mehrere Menschen gestochen.","zh":"然后它在这里叮咬了多个人。","start":362.8,"end":365.72},{"de":"Manche Menschen in der Nähe vom Flughafen haben jetzt Angst.","zh":"机场附近的一些人现在感到害怕。","start":365.8,"end":369.68},{"de":"Diese Frau sagt: Wir machen uns große Sorgen und passen gerade besonders auf.","zh":"这位女士说：我们非常担心，现在格外小心。","start":370.24,"end":375.6},{"de":"Andere Menschen sind entspannt.","zh":"另一些人则很放松。","start":375.64,"end":377.84},{"de":"Dieser Mann sagt: Ich habe keine Angst vor Malaria.","zh":"这位男士说：我不怕疟疾。","start":378.16,"end":381.56},{"de":"Die Behörden beantworten am Telefon gerade viele Fragen zur Krankheit.","zh":"当局正在电话里解答许多关于这种疾病的问题。","start":381.6,"end":385.88},{"de":"Eine Mitarbeiterin erzählt: Die Menschen wollen wissen: Wie erkenne ich Malaria?","zh":"一位工作人员说：大家想知道，我怎么识别疟疾？","start":386.24,"end":393.84},{"de":"Muss ich mir Sorgen machen?","zh":"我需不需要担心？","start":null,"end":null},{"de":"Wir beruhigen und sagen: Das ist ein sehr seltenes Ereignis.","zh":"我们安抚他们，说这是非常罕见的事件。","start":393.92,"end":398.2},{"de":"Ein Mitarbeiter von der Stadt Frankfurt spricht mit Ärzten.","zh":"法兰克福市的一名工作人员正在和医生们沟通。","start":398.4,"end":402.28},{"de":"Er sagt: Vor allem bei Menschen mit Fieber und Durchfall sollen die Ärzte einen Test machen.","zh":"他说：医生尤其应该给发烧和腹泻的人做检测。","start":402.32,"end":409.36},{"de":"Dafür nehmen sie Blut ab.","zh":"为此他们要抽血。","start":409.4,"end":411.28},{"de":"Er sagt: Es gibt gute Medikamente.","zh":"他说：现在有很好的药物。","start":411.72,"end":414.28},{"de":"Wenn die Krankheit früh erkannt wird, muss kein Mensch an Malaria sterben.","zh":"如果疾病被及早发现，就不会有人死于疟疾。","start":414.32,"end":419.28},{"de":"Rund um den Flughafen gibt es jetzt Fallen für Mücken.","zh":"机场周围现在设置了捕蚊器。","start":420.92,"end":424.32},{"de":"Bisher ist dort keine Mücke gefunden worden, die Malaria übertragen kann.","zh":"到目前为止，那里还没有发现能传播疟疾的蚊子。","start":424.4,"end":429.92},{"de":"Jetzt kommt das Wetter.","zh":"现在是天气预报。","start":448.12,"end":450.0},{"de":"Oben im Norden gibt es Wind und Regen.","zh":"最北边有风也有雨。","start":450.4,"end":453.2},{"de":"Unten im Süden scheint die Sonne.","zh":"最南边阳光明媚。","start":453.24,"end":455.76}],"stories":[{"title":"Wahlen in zwei Bundesländern am Sonntag","title_zh":"周日两个联邦州举行选举","from":0,"to":23,"vocab":[{"key":"bundesland","lemma":"das Bundesland, -länder","pos":"Substantiv","zh":"联邦州","example_de":"Nachricht: In Deutschland gibt es 16 Bundesländer.","example_zh":""},{"key":"parlament","lemma":"das Parlament, -e","pos":"Substantiv","zh":"议会","example_de":"Jedes Bundesland hat ein eigenes Parlament.","example_zh":""},{"key":"regierung","lemma":"die Regierung, -en","pos":"Substantiv","zh":"政府","example_de":"Das Parlament wählt die Regierung von dem Bundesland und entscheidet über Gesetze.","exa Benzin und Diesel kosten so viel wie noch nie.","example_zh":""},{"key":"naher osten","lemma":"der Nahe Osten","pos":"Substantiv","zh":"中东","example_de":"Das liegt an dem Krieg im Nahen Osten.","example_zh":""},{"key":"vorschlagen","lemma":"vorschlagen","pos":"Verb","zh":"提议","example_de":"Die Partei CDU schlägt vor, Sprit soll ab Oktober bis zu 25 Cent billiger werden.","example_zh":""},{"key":"cent","lemma":"der Cent","pos":"Substantiv","zh":"欧分","example_de":"Die Partei CDU schlägt vor, Sprit soll ab Oktober bis zu 25 Cent billiger werden.","example_zh":""},{"key":"tankrabatt","lemma":"der Tankrabatt","pos":"Substantiv","zh":"加油折扣","example_de":"Vielleicht kommt der Tankrabatt wieder.","example_zh":""},{"key":"sprit","lemma":"der Sprit","pos":"Substantiv","zh":"燃油（口语）","example_de":"Die Partei CDU schlägt vor, Sprit soll ab Oktober bis zu 25 Cent billiger werden.","example_zh":""},{"key":"guenstig","lemma":"günstig","pos":"Adjektiv","zh":"便宜的、划算的","example_de":"Dadurch wurde der Sprit um einige Cent günstiger.","example_zh":""},{"key":"entscheiden","lemma":"entscheiden","pos":"Verb","zh":"决定","example_de":"Was sie dafür tun will, hat die Regierung aber noch nicht entschieden.","example_zh":""}],"grammar":[{"title":"so ... wie noch nie：前所未有","summary":"so + 形容词 + wie noch nie 表示「和从前任何时候一样」，即「从未如此」。","example_de":"Benzin und Diesel kosten so viel wie noch nie.","example_zh":"汽油和柴油的价格前所未有地高。"},{"title":"um + 数量 + 比较级：变化幅度","summary":"um 说明「变了多少」，回答 wie sehr 的问题。","example_de":"Dadurch wurde der Sprit um einige Cent günstiger.","example_zh":"当时燃油因此便宜了几欧分。"}],"background":"背景：德国油价因中东战争冲击原油供应而创新高。CDU提议自十月起将燃油价格最多下调25欧分；今年五六月间曾有加油折扣（Tankrabatt）。联邦政府尚未拍板，SPD主张尽快决定。"},{"title":"Parlamentswahl: Abstimmung in Russland","title_zh":"议会选举：俄罗斯投票","from":34,"to":61,"vocab":[{"key":"bestimmen","lemma":"bestimmen","pos":"Verb","zh":"说了算；决定","example_de":"In Russland bestimmt seit mehr als 25 Jahren Wladimir Putin.","example_zh":""},{"key":"praesident","lemma":"der Präsident, -en",
