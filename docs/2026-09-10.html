    <div id="root"></div>
    <script id="dd-data" type="application/json">{"page":"lesson","lesson":{"slug":"2026-09-10","date":"2026-09-10","show":"tagesschau in Einfacher Sprache","level":"A2–B1","kind":"video","note":"","source_url":"https://www.tagesschau.de/tagesschau_in_einfacher_sprache/video-1646764.html","video":{"mp4":"https://tagesschau-progressive.ard-mcdn.de/video/2026/0910/TV-20260910-1737-2700.webl.h264.mp4","embed":"https://www.tagesschau.de/tagesschau_in_einfacher_sprache/video-1646764~player.html","page":"https://www.tagesschau.de/tagesschau_in_einfacher_sprache/video-1646764.html"},"duration":467.64,"sentences":[{"de":"In Deutschland war es laut.","zh":"德国到处都很响。","start":30.72,"end":39.04},{"de":"Die Sirenen haben geheult, und die Handys haben gepiept.","zh":"警笛鸣响起来，手机也发出了提示音。","start":39.24,"end":43.16},{"de":"Es ist aber nichts Schlimmes passiert.","zh":"不过并没有发生什么坏事。","start":43.4,"end":46.04},{"de":"Das war ein Test für einen Notfall.","zh":"这是一次紧急情况测试。","start":46.16,"end":48.4},{"de":"Die Behörden für den Schutz von der Bevölkerung haben den Test gemacht.","zh":"负责保护民众的部门进行了这次测试。","start":48.56,"end":53.2},{"de":"Die Behörden wollten wissen: Wenn ein Notfall passiert, können sie dann alle Menschen rechtzeitig warnen?","zh":"这些部门想知道：如果发生紧急情况，他们能不能及时提醒所有人？","start":53.32,"end":60.08},{"de":"Ein Notfall ist z.B. ein großes Feuer oder Hochwasser.","zh":"紧急情况比如一场大火或洪水。","start":61.0,"end":65.24},{"de":"Oder wenn der Strom ausfällt.","zh":"或者停电。","start":66.24,"end":68.32},{"de":"Der Test hat gut geklappt.","zh":"这次测试进行得很顺利。","start":68.64,"end":70.48},{"de":"Dazu kommt jetzt ein Film.","zh":"（接下来是一段影片。）","start":70.6,"end":72.44},{"de":"Achtung, Achtung, hier spricht die Feuerwehr.","zh":"注意，注意，这里是消防队。","start":72.8,"end":75.96},{"de":"Die Feuerwehrmänner Simon Zumpschuk und Nils Lindemann fahren mit Lautsprecher und Warnblinker durch Bochum.","zh":"消防员西蒙·楚姆普舒克和尼尔斯·林德曼开着装有大喇叭和警示闪光灯的车穿过波鸿。","start":76.12,"end":84.12},{"de":"Sie üben für den Notfall.","zh":"他们在为紧急情况进行演练。","start":84.8,"end":86.6},{"de":"Nils Lindemann sagt: Viele ältere Menschen haben kein Smartphone.","zh":"尼尔斯·林德曼说：很多老年人没有智能手机。","start":87.24,"end":92.28},{"de":"Wir sorgen dafür, dass jeder weiß, was los ist.","zh":"我们要做到让每个人都知道发生了什么。","start":92.52,"end":95.8},{"de":"Sirenen gibt es in diesem Wohngebiet nämlich nicht.","zh":"因为这片住宅区里没有警笛。","start":98.36,"end":101.92},{"de":"In ganz Deutschland war heute Testalarm.","zh":"今天全德国进行了警报测试。","start":103.08,"end":105.88},{"de":"Handys piepten.","zh":"手机发出提示音。","start":106.48,"end":107.56},{"de":"Sirenen machten laute Töne.","zh":"警笛发出响亮的声音。","start":108.28,"end":110.48},{"de":"Und auf Anzeigetafeln standen Warnungen.","zh":"警示屏上还显示着警告信息。","start":111.16,"end":114.28},{"de":"Die meisten Menschen finden den Testalarm gut.","zh":"大多数人觉得这次警报测试很好。","start":115.6,"end":118.8},{"de":"Die Frau sagt: Es ist wirklich sehr laut.","zh":"这位女士说：真的非常吵。","start":119.28,"end":122.12},{"de":"Und diese Frau sagt: Ich finde den Test gut.","zh":"而这位女士说：我觉得这次测试很好。","start":122.56,"end":125.64},{"de":"Es ist wichtig, dass im Notfall alles funktioniert.","zh":"重要的是，紧急情况下一切都能正常运转。","start":126.28,"end":129.84},{"de":"Auch die Behörden für Bevölkerungsschutz sind zufrieden.","zh":"负责民众保护的部门也表示满意。","start":130.52,"end":134.44},{"de":"Dieser Mitarbeiter aus Bochum sagt: Hier lief alles rund.","zh":"这位来自波鸿的工作人员说：这里一切顺利。","start":134.88,"end":139.32},{"de":"Das ist ein sehr gutes Zeichen.","zh":"这是一个非常好的迹象。","start":139.96,"end":142.16},{"de":"In einem Jahr gibt es in ganz Deutschland den nächsten Testalarm.","zh":"一年之后，全德国将进行下一次警报测试。","start":144.08,"end":149.0},{"de":"Notfälle gibt es in Deutschland selten.","zh":"在德国，紧急情况很少发生。","start":150.6,"end":159.52},{"de":"Aber manchmal passiert es.","zh":"但有时候还是会发生。","start":159.56,"end":161.28},{"de":"Der Stromausfall in Berlin im letzten Winter war zum Beispiel ein Notfall.","zh":"比如去年冬天柏林的停电，就是一次紧急情况。","start":161.6,"end":166.16},{"de":"Viele Menschen mussten ihre Wohnungen verlassen.","zh":"很多人不得不离开自己的住所。","start":166.72,"end":170.08},{"de":"Sie hatten tagelang keine Heizung und kein Licht.","zh":"他们接连好几天没有暖气、没有灯。","start":170.24,"end":173.32},{"de":"Manche Menschen hatten auch kein Wasser.","zh":"有些人连水都没有。","start":173.44,"end":176.24},{"de":"Die Behörden für den Schutz der Bevölkerung sagen deshalb: Alle Menschen sollen für einen Notfall vorsorgen.","zh":"因此，负责保护民众的部门说：所有人都应该为紧急情况做好准备。","start":176.4,"end":183.68},{"de":"Dazu zeigen wir einen Film.","zh":"（接下来是一段影片。）","start":184.0,"end":185.92},{"de":"Das ist eine Halle vom Arbeiter-Samariter-Bund.","zh":"这是德国工人撒马利亚会的一间大厅。","start":187.04,"end":190.32},{"de":"Das kurze Wort dafür ist ASB.","zh":"它的简称是 ASB。","start":190.8,"end":193.4},{"de":"Der ASB hat Koffer für den Notfall.","zh":"ASB 备有应急箱。","start":194.68,"end":197.2},{"de":"In den Koffern sind zum Beispiel Gas zum Kochen, Medikamente, Lebensmittel und Wasser.","zh":"箱子里比如有用来做饭的燃气、药品、食品和水。","start":197.96,"end":205.44},{"de":"Der Mann sagt: Wasser ist sehr wichtig.","zh":"这位男士说：水非常重要。","start":206.44,"end":209.16},{"de":"Jeder Erwachsene braucht zwei Liter Wasser am Tag.","zh":"每个成年人每天需要两升水。","start":209.92,"end":213.44},{"de":"In den Koffern ist alles, was Menschen in einem Notfall brauchen.","zh":"应急箱里有人们在紧急情况下需要的一切。","start":214.8,"end":219.44},{"de":"Die Behörden sagen: Jeder soll zu Hause einen Notfallkoffer haben.","zh":"有关部门说：每个人都应该在家里备一个应急箱。","start":219.6,"end":224.48},{"de":"Ein Notfall ist zum Beispiel, wenn es keinen Strom gibt.","zh":"紧急情况比如停电。","start":226.16,"end":230.08},{"de":"Die Frau vom ASB sagt: Wenn der Strom ausfällt, dann gibt es kein Licht und keine Heizung.","zh":"ASB 的这位女士说：如果停电，就没有灯也没有暖气。","start":231.12,"end":238.36},{"de":"Die Menschen haben kein warmes Essen.","zh":"人们吃不上热饭。","start":239.12,"end":241.76},{"de":"Der Fernseher ist aus, und das Radio ist aus.","zh":"电视关了，收音机也关了。","start":241.88,"end":245.04},{"de":"Und wenn der Akku leer ist, dann geht auch das Handy nicht.","zh":"而如果电池耗尽，手机也会没法用。","start":246.28,"end":250.44},{"de":"Ein Kurbelradio hilft.","zh":"手摇收音机能帮上忙。","start":250.56,"end":252.12},{"de":"Die Kurbel erzeugt Strom.","zh":"摇柄可以发电。","start":252.8,"end":254.6},{"de":"Man kann das Handy laden und Radio hören.","zh":"人们可以给手机充电、听广播。","start":255.04,"end":257.88},{"de":"Im Notfall gibt es im Radio wichtige Informationen.","zh":"紧急情况下，收音机里会播放重要信息。","start":258.64,"end":262.84},{"de":"In den USA sind bald Wahlen.","zh":"美国很快就要举行选举。","start":264.84,"end":273.2},{"de":"Die Menschen wählen neue Politiker für das Parlament.","zh":"人们将选出新的政治家进入议会。","start":274.0,"end":277.52},{"de":"US-Präsident Trump hat jetzt versprochen: Wenn seine Partei gewinnt, dann bekommt jeder Erwachsene Geld geschenkt.","zh":"美国总统特朗普现在承诺：如果他的政党获胜，每个成年人都会得到一笔赠送的钱。","start":277.64,"end":285.84},{"de":"Die Partei von Trump heißt Republikanische Partei.","zh":"特朗普的政党叫共和党。","start":285.96,"end":289.48},{"de":"Die Republikanische Partei verliert vielleicht bei den Wahlen.","zh":"共和党也许会在选举中落败。","start":289.84,"end":293.88},{"de":"Viele Menschen sind nämlich enttäuscht von der Politik von Trump.","zh":"因为很多人对特朗普的政策感到失望。","start":294.04,"end":298.2},{"de":"Wenn die Republikanische Partei bei den Wahlen verliert, dann wird Regieren für Trump sehr viel schwieriger.","zh":"如果共和党在选举中落败，执政对特朗普来说就会困难得多。","start":298.64,"end":305.72},{"de":"Trump will deshalb unbedingt, dass die Republikanische Partei gewinnt.","zh":"因此特朗普非常希望共和党获胜。","start":305.88,"end":310.8},{"de":"Dazu kommt ein kurzer Film.","zh":"（接下来是一段影片。）","start":310.88,"end":312.8},{"de":"Hier ist US-Präsident Trump bei einer Veranstaltung der Republikanischen Partei.","zh":"这是美国总统特朗普在共和党的一场活动上。","start":313.36,"end":318.72},{"de":"Trump sagt: Bitte geht zur Wahl, wählt die Republikanische Partei.","zh":"特朗普说：请去投票，投给共和党。","start":318.88,"end":323.52},{"de":"Stellt euch vor, ihr wählt mich.","zh":"想象一下，你们选我。","start":324.36,"end":326.64},{"de":"Es ist wirklich sehr wichtig.","zh":"这真的非常重要。","start":326.76,"end":328.84},{"de":"Die meisten von uns kennen sie aus dem Fernsehen.","zh":"我们大多数人都是从电视上认识她的。","start":330.28,"end":339.96},{"de":"Die Biene Maja.","zh":"小蜜蜂玛雅。","start":340.04,"end":341.12},{"de":"Maja ist neugierig.","zh":"玛雅好奇心强。","start":341.48,"end":342.84},{"de":"Sie ist schlau und frech.","zh":"她聪明又调皮。","start":343.16,"end":344.96},{"de":"Und sie ist mutig.","zh":"而且她很勇敢。","start":345.12,"end":346.4},{"de":"Die Filmserie über Maja und ihre Freunde gibt es schon lange.","zh":"关于玛雅和她朋友们的系列影片已经存在很久了。","start":347.08,"end":351.36},{"de":"Das Fernsehen hat den ersten Film vor 50 Jahren gezeigt.","zh":"电视台在 50 年前播出了第一部影片。","start":351.56,"end":355.48},{"de":"Dazu kommt jetzt ein Film.","zh":"（接下来是一段影片。）","start":356.36,"end":358.2},{"de":"Man sollte dir wirklich den Hintern versohlen.","zh":"真该好好打你一顿屁股。","start":365.08,"end":368.28},{"de":"Zur Strafe, weil du nicht hören willst, kommst du ins Bett.","zh":"作为惩罚，因为你不想听话，你现在给我上床睡觉。","start":369.52,"end":373.12},{"de":"Ich habe doch nichts Böses getan.","zh":"可我什么坏事都没有做呀。","start":373.24,"end":375.96},{"de":"Maja möchte sich die Welt ansehen.","zh":"玛雅想去看看这个世界。","start":377.52,"end":379.96},{"de":"Die kleine Biene ist neugierig, fröhlich, und sie erlebt viele Abenteuer.","zh":"这只小蜜蜂好奇、快乐，经历了许多冒险。","start":380.2,"end":385.56},{"de":"Die Abenteuer sind manchmal gefährlich.","zh":"这些冒险有时很危险。","start":385.96,"end":388.68},{"de":"Dieser Experte für Filme sagt: Maja und Willi haben manchmal Angst.","zh":"这位电影专家说：玛雅和威利有时会害怕。","start":388.88,"end":393.6},{"de":"Aber die Filme zeigen Kindern: Maja und Willi schaffen das.","zh":"但这些影片告诉孩子们：玛雅和威利做得到。","start":394.24,"end":398.4},{"de":"Und ihr schafft es auch.","zh":"你们也做得到。","start":398.56,"end":400.28},{"de":"Menschen auf der ganzen Welt kennen die Filme über Biene Maja und ihre Freunde.","zh":"世界各地的人都认识小蜜蜂玛雅和她朋友们的影片。","start":401.52,"end":407.04},{"de":"Und das liegt auch an der Musik.","zh":"这也和音乐有关。","start":407.36,"end":409.64},{"de":"Dieser Mann heißt Karel Gott.","zh":"这位男士叫卡雷尔·戈特。","start":409.84,"end":411.92},{"de":"Er hat das Lied von der Biene Maja gesungen.","zh":"他演唱了小蜜蜂玛雅的歌。","start":412.28,"end":415.36},{"de":"Und diese Biene, die ich meine, nennt sich Maja.","zh":"还有这只我心里的蜜蜂，她叫玛雅。","start":417.96,"end":421.92},{"de":"Das Lied ist so beliebt wie die Filme.","zh":"这首歌和影片一样受欢迎。","start":426.72,"end":429.36},{"de":"Und diese Biene, die ich meine, nennt sich Maja.","zh":"还有这只我心里的蜜蜂，她叫玛雅。","start":429.96,"end":433.32},{"de":"Na, na, na, na, na, na, Biene Maja.","zh":"哪，哪，哪，哪，哪，哪，小蜜蜂玛雅。","start":434.24,"end":436.76},{"de":"Und jetzt kommt das Wetter.","zh":"现在来看天气。","start":455.32,"end":457.24},{"de":"Im Nordwesten, im Westen und unten im Süden Regen.","zh":"西北部、西部以及南部偏下地区有雨。","start":457.36,"end":461.64},{"de":"Sonst trocken und neben Wolken länger sonnig.","zh":"其余地区干燥，云缝间阳光持久。","start":462.76,"end":465.92},{"de":"16 bis 25 Grad.","zh":"气温 16 到 25 度。","start":466.32,"end":467.64}],"stories":[{"title":"Laute Töne: Test für Notfall","title_zh":"响亮的声音：紧急情况警报测试","from":0,"to":27,"vocab":[{"key":"sirene","lemma":"die Sirene, -n","pos":"Substantiv","zh":"警笛、警报器","example_de":"Die Sirenen haben geheult, und die Handys haben gepiept.","example_zh":""},{"key":"heulen","lemma":"heulen","pos":"Verb","zh":"（警笛等）鸣响、呼啸","example_de":"Die Sirenen haben geheult, und die Handys haben gepiept.","example_zh":""},{"key":"notfall","lemma":"der Notfall, ´-e","pos":"Substantiv","zh":"紧急情况","example_de":"Das war ein Test für einen Notfall.","example_zh":""},{"key":"rechtzeitig","lemma":"rechtzeitig","pos":"Adjektiv","zh":"及时的、来得及的","example_de":"Die Behörden wollten wissen: Wenn ein Notfall passiert, können sie dann alle Menschen rechtzeitig warnen?","example_zh":""},{"key":"piepen","lemma":"piepen","pos":"Verb","zh":"发出滴滴声","example_de":"Die Sirenen haben geheult, und die Handys haben gepiept.","example_zh":""},{"key":"anzeigetafel","lemma":"die Anzeigetafel, -n","pos":"Substantiv","zh":"显示屏、告示牌","example_de":"Und auf Anzeigetafeln standen Warnungen.","example_zh":""},{"key":"behoerde","lemma":"die Behörde, -n","pos":"Substantiv","zh":"政府部门、当局","example_de":"Die Behörden für den Schutz von der Bevölkerung haben den Test gemacht.","example_zh":""},{"key":"zufrieden","lemma":"zufrieden","pos":"Adjektiv","zh":"满意的","example_de":"Auch die Behörden für Bevölkerungsschutz sind zufrieden.","example_zh":""}],"grammar":[{"title":"nichts Schlimmes","summary":"nichts 后面的形容词首字母大写、加弱变化词尾：nichts Schlimmes（没什么坏事）、nichts Neues（没什么新鲜事）。","example_de":"Es ist aber nichts Schlimmes passiert.","example_zh":"不过并没有发生什么坏事。"},{"title":"nämlich 在句中","summary":"nämlich（因为、正是）插在句子中间补充原因，不占句首位置，动词位置不变。","example_de":"Sirenen gibt es in diesem Wohngebiet nämlich nicht.","example_zh":"因为这片住宅区里没有警笛。"}],"background":"德国举行了全国警报日（Bundesweiter Warntag）：警笛、手机预警短信和公共警示屏同时接受测试，这类全国测试每年一次。测试目的是检验灾难发生时能否及时通知所有人，包括没有智能手机的老年人——消防队因此用大喇叭挨个街区巡广播。"},{"title":"Vorsorge für Notfall: Was jeder tun kann","title_zh":"为紧急情况做准备：每个人能做什么","from":28,"to":52,"vocab":[{"key":"stromausfall","lemma":"der Stromausfall, ´-e","pos":"Substantiv","zh":"停电","example_de":"Der Stromausfall in Berlin im letzten Winter war zum Beispiel ein Notfall.","example_zh":""},{"key":"heizung","lemma":"die Heizung, -en","pos":"Substantiv","zh":"暖气、供暖设备","example_de":"Sie hatten tagelang keine Heizung und kein Licht.","example_zh":""},{"key":"vorsorgen","lemma":"vorsorgen","pos":"Verb","zh":"未雨绸缪、提前准备","example_de":"Die Behörden für den Schutz der Bevölkerung sagen deshalb: Alle Menschen sollen für einen Notfall vorsorgen.","example_zh":""},{"key":"medikament","lemma":"das Medikament, -e","pos":"Substantiv","zh":"药品","example_de":"In den Koffern sind zum Beispiel Gas zum Kochen, Medikamente, Lebensmittel und Wasser.","example_zh":""},{"key":"lebensmittel","lemma":"das Lebensmittel, -","pos":"Substantiv","zh":"食品","example_de":"In den Koffern sind zum Beispiel Gas zum Kochen, Medikamente, Lebensmittel und Wasser.","example_zh":""},{"key":"erwachsene","lemma":"der Erwachsene, -n","pos":"Substantiv","zh":"成年人（形容词变格作名词）","example_de":"Jeder Erwachsene braucht zwei Liter Wasser am Tag.","example_zh":""},{"key":"kurbelradio","lemma":"das Kurbelradio, -s","pos":"Substantiv","zh":"手摇收音机","example_de":"Ein Kurbelradio hilft.","example_zh":""},{"key":"erzeugen","lemma":"erzeugen","pos":"Verb","zh":"产生、发出（电等）","example_de":"Die Kurbel erzeugt Strom.","example_zh":""}],"grammar":[{"title":"wenn …, dann …","summary":"wenn 引导条件从句，动词放句尾；主句常用 dann 开头，动词紧跟在 dann 后面（仍在第二位）。","example_de":"Wenn der Strom ausfällt, dann gibt es kein Licht und keine Heizung.","example_zh":"如果停电，就没有灯也没有暖气。"},{"title":"sollen + 不定式","summary":"sollen 在这里表示要求或建议：「应该、要」。第三人称：Alle Menschen sollen … vorsorgen。","example_de":"Alle Menschen sollen für einen Notfall vorsorgen.","example_zh":"所有人都应该为紧急情况做好准备。"}],"background":"Arbeiter-Samariter-Bund（ASB，工人撒马利亚会）是德国主要的救援慈善组织之一，常参与急救培训与灾害救助。德国官方建议每户储备应急物资：按每人每天两升水准备数日饮水、常备食品和药品，再配一台手摇收音机——停电时既能听广播获取信息，还能摇出电来给手机充电。"},{"title":"USA: Trump verspricht Wählern Geld","title_zh":"美国：特朗普向选民承诺发钱","from":53,"to":65,"vocab":[{"key":"wahl","lemma":"die Wahl, -en","pos":"Substantiv","zh":"选举","example_de":"In den USA sind bald Wahlen.","example_zh":""},{"key":"versprechen","lemma":"versprechen","pos":"Verb","zh":"承诺、许诺","example_de":"US-Präsident Trump hat jetzt versprochen: Wenn seine Partei gewinnt, dann bekommt jeder Erwachsene Geld geschenkt.","example_zh":""},{"key":"enttaeuscht","lemma":"enttäuscht","pos":"Adjektiv","zh":"失望的","example_de":"Viele Menschen sind nämlich enttäuscht von der Politik von Trump.","example_zh":""},{"key":"verlieren","lemma":"verlieren","pos":"Verb","zh":"输、落败","example_de":"Die Republikanische Partei verliert vielleicht bei den Wahlen.","example_zh":""},{"key":"veranstaltung","lemma":"die Veranstaltung, -en","pos":"Substantiv","zh":"活动、集会","example_de":"Hier ist US-Präsident Trump bei einer Veranstaltung der Republikanischen Partei.","example_zh":""},{"key":"unbedingt","lemma":"unbedingt","pos":"Adverb","zh":"无论如何、绝对","example_de":"Trump will deshalb unbedingt, dass die Republikanische Pa
