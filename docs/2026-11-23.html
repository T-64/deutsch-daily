    <div id="root"></div>
    <script id="dd-data" type="application/json">{"page":"lesson","lesson":{"slug":"2026-11-23","date":"2026-11-23","show":"tagesschau in Einfacher Sprache","level":"A2–B1","kind":"broadcast","note":"","source_url":"https://www.tagesschau.de/tagesschau_in_einfacher_sprache/tse-1526.html","video":{"mp4":"https://tagesschau-progressive.ard-mcdn.de/video/2026/1123/TV-20261123-1740-0400.webl.h264.mp4","embed":"","page":"https://www.tagesschau.de/tagesschau_in_einfacher_sprache/video-1688568.html"},"duration":510.6,"sentences":[{"de":"Willkommen zur tagesschau in Einfacher Sprache.","zh":"欢迎收看简单语言版每日新闻。","start":10.56,"end":13.48},{"de":"Ich bin Michael Paweletz und das sind unsere Nachrichten:","zh":"我是Michael Paweletz，以下是我们的新闻：","start":13.6,"end":17.76},{"de":"Und nun zur ersten Nachricht:","zh":"现在来看第一条新闻：","start":44.12,"end":46.24},{"de":"Jedes Jahr treffen sich Politiker und Experten, um bei einer Konferenz über das Klima zu sprechen.","zh":"每年，政治家和专家都会在一次会议上讨论气候问题。","start":52.76,"end":61.36},{"de":"Klima ist das Wetter von einem langen Zeitraum.","zh":"气候是指很长一段时间的天气。","start":62.88,"end":66.56},{"de":"In diesem Jahr war die Klimakonferenz in der Türkei.","zh":"今年的气候会议在土耳其举行。","start":67.88,"end":71.96},{"de":"Auf dem Foto sind Teilnehmer von der Konferenz.","zh":"照片上是会议的参与者。","start":73.6,"end":77.0},{"de":"Am Ende einer Klimakonferenz steht normalerweise eine Abschlusserklärung.","zh":"气候会议结束时通常会发表一份闭幕声明。","start":77.6,"end":83.24},{"de":"Das ist ein Vertrag, in dem steht, wie wollen wir das Klima schützen.","zh":"这是一份协定，里面写明我们要如何保护气候。","start":84.64,"end":89.8},{"de":"In diesem Jahr gibt es aber keine Abschlusserklärung.","zh":"但今年没有闭幕声明。","start":92.0,"end":95.76},{"de":"Warum?","zh":"为什么？","start":96.28,"end":97.48},{"de":"Dazu zeigen wir jetzt einen Film:","zh":"为此我们现在来看一段影片：","start":97.76,"end":100.16},{"de":"Politiker und Experten aus vielen Ländern haben in der Stadt Antalya zwei Wochen verhandelt.","zh":"来自许多国家的政治家和专家在安塔利亚市谈判了两周。","start":101.08,"end":106.92},{"de":"Es ging um die Frage, wie schaffen es alle Länder zusammen, dass es nicht noch wärmer auf der Erde wird.","zh":"讨论的问题是：所有国家如何共同努力，使地球不再变暖。","start":107.08,"end":113.52},{"de":"Um das zu erreichen, müssen die Länder weniger CO2 produzieren.","zh":"为了实现这个目标，各国必须减少二氧化碳的排放。","start":113.8,"end":117.96},{"de":"CO2 ist ein Gas.","zh":"二氧化碳是一种气体。","start":118.24,"end":119.6},{"de":"Es entsteht zum Beispiel beim Autofahren.","zh":"例如开车时会产生这种气体。","start":120.0,"end":122.56},{"de":"Oder wenn die Menschen mit Kohle oder Öl heizen.","zh":"或者当人们用煤或石油取暖时。","start":122.68,"end":125.84},{"de":"Gibt es zu viel CO2, wird es auf der Erde wärmer.","zh":"如果二氧化碳太多，地球就会变暖。","start":126.0,"end":129.16},{"de":"Dann gibt es Waldbrände, aber auch Stürme und Überschwemmungen.","zh":"然后就会出现森林火灾，还有风暴和洪水。","start":129.32,"end":133.32},{"de":"Der deutsche Minister für Klima, Schneider, sagt:","zh":"德国的气候部长Schneider说：","start":133.4,"end":136.44},{"de":"Viele Länder wollen das Klima schützen.","zh":"许多国家想保护气候。","start":136.52,"end":139.0},{"de":"Wir auch.","zh":"我们也是。","start":139.16,"end":140.4},{"de":"Aber einige Länder verdienen noch viel Geld mit Öl und Gas.","zh":"但一些国家还在靠石油和天然气赚很多钱。","start":140.64,"end":144.44},{"de":"Diese Länder sind nicht bereit, auf das Geld zu verzichten.","zh":"这些国家不愿意放弃这些钱。","start":144.8,"end":148.4},{"de":"Es geht um Länder wie Saudi-Arabien.","zh":"这指的是像沙特阿拉伯这样的国家。","start":148.8,"end":151.24},{"de":"Sie wollten nicht in die Abschlusserklärung schreiben:","zh":"他们不愿意在闭幕声明中写下：","start":151.36,"end":154.64},{"de":"Wir hören auf mit Kohle, Öl und Gas.","zh":"我们停止使用煤炭、石油和天然气。","start":154.76,"end":157.6},{"de":"Dieser Politiker kümmert sich bei der EU um das Klima.","zh":"这位政治家在欧盟负责气候事务。","start":158.68,"end":162.08},{"de":"Er sagt:","zh":"他说：","start":162.2,"end":163.4},{"de":"Wir haben es leider nicht geschafft, die anderen Länder zu überzeugen.","zh":"很遗憾，我们没能说服其他国家。","start":163.48,"end":167.64},{"de":"Wir müssen aufhören mit Kohle, Öl und Gas.","zh":"我们必须停止使用煤炭、石油和天然气。","start":167.76,"end":170.32},{"de":"Deshalb gibt es keine Abschlusserklärung von der Klimakonferenz.","zh":"因此，这次气候会议没有闭幕声明。","start":170.84,"end":175.04},{"de":"Viele Länder wollen trotzdem das Klima schützen.","zh":"尽管如此，许多国家仍想保护气候。","start":175.28,"end":178.32},{"de":"Zum Beispiel indem sie Strom mit Windkraft und Solaranlagen machen.","zh":"例如，用风力和太阳能设备发电。","start":178.4,"end":183.16},{"de":"Und nun zur nächsten Nachricht:","zh":"现在来看下一条新闻：","start":184.84,"end":187.04},{"de":"An vielen Schulen in Deutschland gab es heute große Aufregung.","zh":"今天，德国的许多学校发生了很大的骚动。","start":191.48,"end":195.6},{"de":"Auch an der Schule auf dem Foto.","zh":"照片上的这所学校也是。","start":196.6,"end":198.92},{"de":"Sie ist in der Stadt Leipzig.","zh":"它位于莱比锡市。","start":199.52,"end":201.72},{"de":"Viele Schulen haben am Morgen eine E-Mail bekommen.","zh":"许多学校在早上收到了一封电子邮件。","start":202.56,"end":206.08},{"de":"In der E-Mail wurden die Schulen mit einer Bombe bedroht.","zh":"邮件中有人用炸弹威胁这些学校。","start":207.0,"end":210.84},{"de":"Manche Schulen riefen die Polizei.","zh":"一些学校报了警。","start":211.76,"end":214.16},{"de":"Die Polizei sagt:","zh":"警方说：","start":215.12,"end":216.36},{"de":"Es gibt keine direkte Bedrohung.","zh":"没有直接的威胁。","start":216.68,"end":218.96},{"de":"Trotzdem wurden die Kinder an manchen Schulen nach Hause geschickt.","zh":"尽管如此，一些学校还是让孩子们回家了。","start":219.84,"end":224.2},{"de":"Der Unterricht fiel aus.","zh":"课程被取消了。","start":224.52,"end":226.16},{"de":"Die Polizei sucht jetzt nach dem Täter.","zh":"警方现在正在寻找作案者。","start":226.72,"end":229.6},{"de":"Und nun zur nächsten Nachricht:","zh":"现在来看下一条新闻：","start":231.72,"end":233.76},{"de":"Auf dem Foto ist die Erde.","zh":"照片上是地球。","start":237.8,"end":239.72},{"de":"Aufgenommen aus dem Weltraum.","zh":"这是从太空拍摄的。","start":240.2,"end":242.24},{"de":"Das Foto hat ein Satellit gemacht.","zh":"这张照片是一颗卫星拍摄的。","start":243.0,"end":245.68},{"de":"Satelliten sind Geräte, die im Weltall herumfliegen.","zh":"卫星是在太空中飞行的设备。","start":247.04,"end":250.76},{"de":"Sie sammeln Daten und schicken sie zur Erde.","zh":"它们收集数据，并把数据传回地球。","start":251.68,"end":255.04},{"de":"Satelliten sind wichtig für Flugzeuge, für das Militär oder um das Wetter vorherzusagen.","zh":"卫星对飞机、军队以及预测天气都很重要。","start":256.16,"end":263.52},{"de":"Journalisten haben jetzt herausgefunden, Russland arbeitet an einer Waffe, die viele Satelliten zerstören kann.","zh":"记者们现在发现：俄罗斯正在研制一种可以摧毁许多卫星的武器。","start":265.04,"end":273.48},{"de":"Und zwar an einer Atombombe im Weltraum.","zh":"而且是太空中的核弹。","start":275.48,"end":278.64},{"de":"Eine Atombombe ist eine sehr starke Bombe.","zh":"核弹是一种威力非常大的炸弹。","start":280.36,"end":283.68},{"de":"Dazu zeigen wir einen Film:","zh":"为此我们来看一段影片：","start":285.44,"end":287.44},{"de":"In diesem Gebäude im Westen von Deutschland sitzt die Bundeswehr.","zh":"在德国西部的这座建筑里驻扎着联邦国防军。","start":288.56,"end":292.52},{"de":"Von hier aus beobachten Soldaten den Weltraum und die Satelliten.","zh":"士兵们从这里观察太空和卫星。","start":292.8,"end":297.28},{"de":"Rund um die Erde fliegen viele Satelliten.","zh":"地球周围飞行着许多卫星。","start":298.12,"end":300.8},{"de":"Hier sind sie als Punkte zu sehen.","zh":"在这张图上，它们显示为一些点。","start":301.0,"end":303.24},{"de":"Jetzt warnen Behörden:","zh":"现在有关部门警告说：","start":303.6,"end":305.24},{"de":"Russland will bald eine Atombombe in den Weltraum bringen.","zh":"俄罗斯想很快把一枚原子弹送上太空。","start":305.36,"end":309.4},{"de":"Wenn diese Atombombe explodiert, dann sind viele Satelliten zerstört und stürzen ab.","zh":"如果这枚原子弹爆炸，许多卫星就会被摧毁并坠落。","start":309.56,"end":315.04},{"de":"Viele Dinge im Alltag funktionieren dann nicht mehr.","zh":"那样的话，日常生活中的许多东西就无法使用了。","start":315.76,"end":319.08},{"de":"Navigationsgeräte, Geldautomaten oder Wettervorhersagen.","zh":"比如导航设备、自动取款机或者天气预报。","start":319.36,"end":323.28},{"de":"Dieser Experte sagt:","zh":"这位专家说：","start":324.16,"end":325.64},{"de":"Ohne Satelliten funktioniert unser Leben nicht mehr.","zh":"没有卫星，我们的生活就无法运转。","start":325.8,"end":329.12},{"de":"Auch die Bundeswehr sagt:","zh":"德国联邦国防军也说：","start":329.24,"end":330.8},{"de":"Ohne Satelliten haben wir ein Problem.","zh":"没有卫星，我们就有麻烦了。","start":330.92,"end":333.36},{"de":"Dieser Soldat sagt:","zh":"这位士兵说：","start":333.8,"end":335.08},{"de":"Wir können das Land ohne Satelliten nur schlecht verteidigen, weil wir dann sehr schwer Ziele finden.","zh":"没有卫星，我们很难保卫国家，因为那样我们很难找到目标。","start":335.56,"end":342.04},{"de":"Russland sagt:","zh":"俄罗斯说：","start":342.6,"end":343.8},{"de":"Wir wollen keine Atombomben in den Weltraum bringen.","zh":"我们不想把原子弹送上太空。","start":344.04,"end":347.28},{"de":"Mehrere Länder glauben das aber nicht.","zh":"但有几个国家不相信这一点。","start":347.44,"end":350.0},{"de":"Und nun zur nächsten Nachricht:","zh":"现在来看下一条新闻：","start":351.96,"end":354.16},{"de":"Die Firma Nvidia kommt aus den USA und entwirft Computerteile.","zh":"英伟达（Nvidia）是一家美国公司，设计电脑部件。","start":358.48,"end":363.0},{"de":"Der Chef von Nvidia hat seinen Job vor wenigen Tagen abgegeben.","zh":"英伟达的老板几天前辞去了他的职务。","start":365.24,"end":369.52},{"de":"Er heißt Jensen Huang und ist auf dem Foto.","zh":"他叫黄仁勋（Jensen Huang），照片上就是他。","start":370.2,"end":373.44},{"de":"Huang hatte nämlich eine Affäre mit einer Frau.","zh":"因为黄仁勋和一名女子有婚外情。","start":374.68,"end":377.92},{"de":"Sie soll als Spionin für China gearbeitet haben.","zh":"据说这名女子曾为中国当间谍。","start":378.72,"end":382.2},{"de":"Jetzt hat Nvidia mitgeteilt:","zh":"现在英伟达宣布：","start":383.48,"end":385.56},{"de":"Huang kommt zurück als Chef von der Firma.","zh":"黄仁勋将回来继续担任公司老板。","start":386.2,"end":389.04},{"de":"Die Regierung von den USA sagt:","zh":"美国政府说：","start":390.0,"end":392.44},{"de":"Huang hat nicht gegen Regeln verstoßen.","zh":"黄仁勋没有违反规定。","start":393.36,"end":396.08},{"de":"Der Präsident von den USA, Trump, freut sich.","zh":"美国总统特朗普对此很高兴。","start":397.0,"end":400.44},{"de":"In den letzten Tagen hat er immer wieder gesagt:","zh":"最近几天，他一再表示：","start":401.6,"end":404.6},{"de":"Huang soll zurückkommen.","zh":"黄仁勋应该回来。","start":404.96,"end":406.84},{"de":"Und nun zur nächsten Nachricht:","zh":"现在来看下一条新闻：","start":409.12,"end":411.24},{"de":"Am Sonntag ist der Erste Advent.","zh":"星期日是基督降临节的第一个星期日。","start":416.04,"end":418.4},{"de":"In einem Monat ist Weihnachten.","zh":"再过一个月就是圣诞节了。","start":419.16,"end":421.64},{"de":"In vielen Städten haben jetzt die Weihnachtsmärkte geöffnet.","zh":"许多城市的圣诞市场现在开放了。","start":422.56,"end":426.64},{"de":"In Deutschland gibt es ungefähr 3000 größere Weihnachtsmärkte.","zh":"德国大约有3000个较大的圣诞市场。","start":427.6,"end":431.76},{"de":"Dazu zeigen wir jetzt einen kurzen Film:","zh":"现在我们播放一段短片：","start":433.0,"end":435.96},{"de":"In der Stadt Düsseldorf, im Westen von Deutschland, ist der Weihnachtsmarkt schon seit dem Wochenende offen.","zh":"在德国西部的杜塞尔多夫市，圣诞市场从周末起就已经开放了。","start":437.0,"end":443.96},{"de":"Dort gibt es schon Glühwein und Kekse.","zh":"那里已经有热红酒和饼干。","start":444.52,"end":447.16},{"de":"Auch viele andere Geschäfte in den Städten freuen sich.","zh":"城市里的许多其他商店也很高兴。","start":448.0,"end":451.44},{"de":"Weil es Weihnachtsmärkte gibt, sind viele Menschen da, die auch in anderen Geschäften einkaufen.","zh":"因为有圣诞市场，很多人来到这里，也会在其他商店购物。","start":452.0,"end":458.72},{"de":"Und das waren unsere Nachrichten:","zh":"以上就是我们的新闻：","start":460.84,"end":463.0},{"de":"Und jetzt kommt das Wetter:","zh":"现在来看天气：","start":485.6,"end":487.56},{"de":"Oben im Norden und rechts im Osten gibt es an manchen Orten Schnee.","zh":"在北部上方和东部右侧的一些地方有雪。","start":488.88,"end":493.24},{"de":"Sonst ist es trocken.","zh":"其他地方天气干燥。","start":494.0,"end":495.48},{"de":"Meistens scheint die Sonne.","zh":"大部分地区有阳光。","start":495.72,"end":497.64},{"de":"Teilweise gibt es dichten Nebel.","zh":"部分地区有浓雾。","start":497.76,"end":499.92},{"de":"Es werden zwei bis sechs Grad.","zh":"气温是二到六度。","start":500.6,"end":502.84},{"de":"Das war die tagesschau in Einfacher Sprache.","zh":"以上就是简单语言版的今日新闻（tagesschau in Einfacher Sprache）。","start":504.56,"end":507.36},{"de":"Tschüss. Bis zum nächsten Mal.","zh":"再见，下次见。","start":508.6,"end":510.6
