    <div id="root"></div>
    <script id="dd-data" type="application/json">{"page":"lesson","lesson":{"slug":"2026-11-23","date":"2026-11-23","show":"tagesschau in Einfacher Sprache","level":"A2–B1","kind":"broadcast","note":"","source_url":"https://www.tagesschau.de/tagesschau_in_einfacher_sprache/tse-1526.html","video":{"mp4":"https://tagesschau-progressive.ard-mcdn.de/video/2026/1123/TV-20261123-1740-0400.webl.h264.mp4","embed":"","page":"https://www.tagesschau.de/tagesschau_in_einfacher_sprache/video-1688568.html"},"duration":514.04,"sentences":[{"de":"Willkommen zur tagesschau in Einfacher Sprache.","zh":"欢迎收看简单语言版《每日新闻》。","start":13.56,"end":16.48},{"de":"Ich bin Michail Paweletz und das sind unsere Nachrichten:","zh":"我是米哈伊尔·帕维莱茨,以下是我们的新闻:","start":16.6,"end":20.76},{"de":"Und nun zur ersten Nachricht:","zh":"现在来看第一条新闻:","start":47.12,"end":49.24},{"de":"Jedes Jahr treffen sich Politiker und Experten, um bei einer Konferenz über das Klima zu sprechen.","zh":"每年政治人物和专家都会在一次会议上讨论气候问题。","start":55.76,"end":64.36},{"de":"Klima ist das Wetter von einem langen Zeitraum.","zh":"气候是指很长一段时期内的天气情况。","start":65.88,"end":69.56},{"de":"In diesem Jahr war die Klimakonferenz in der Türkei.","zh":"今年的气候会议在土耳其举行。","start":70.88,"end":74.96},{"de":"Auf dem Foto sind Teilnehmer von der Konferenz.","zh":"照片上是这次会议的与会者。","start":76.6,"end":80.0},{"de":"Am Ende einer Klimakonferenz steht normalerweise eine Abschlusserklärung.","zh":"气候会议结束时通常会发表一份最终声明。","start":80.6,"end":86.24},{"de":"Das ist ein Vertrag, in dem steht, wie wollen wir das Klima schützen.","zh":"这是一份协议,里面写明我们要如何保护气候。","start":87.64,"end":92.8},{"de":"In diesem Jahr gibt es aber keine Abschlusserklärung.","zh":"但今年没有最终声明。","start":95.0,"end":98.76},{"de":"Warum?","zh":"为什么呢?","start":99.28,"end":100.48},{"de":"Dazu zeigen wir jetzt einen Film:","zh":"接下来我们播放一段影片来介绍:","start":100.76,"end":103.16},{"de":"Politiker und Experten aus vielen Ländern haben in der Stadt Antalya zwei Wochen verhandelt.","zh":"来自许多国家的政治人物和专家在安塔利亚市谈判了两周。","start":104.08,"end":109.92},{"de":"Es ging um die Frage, wie schaffen es alle Länder zusammen, dass es nicht noch wärmer auf der Erde wird.","zh":"讨论的问题是:所有国家如何共同努力,使地球不再变得更热。","start":110.08,"end":116.52},{"de":"Um das zu erreichen, müssen die Länder weniger CO2 produzieren.","zh":"为了实现这个目标,各国必须减少二氧化碳的排放。","start":116.8,"end":120.96},{"de":"CO2 ist ein Gas.","zh":"二氧化碳是一种气体。","start":121.24,"end":122.6},{"de":"Es entsteht zum Beispiel beim Autofahren.","zh":"例如开车时就会产生这种气体。","start":123.0,"end":125.56},{"de":"Oder wenn die Menschen mit Kohle oder Öl heizen.","zh":"或者人们用煤或石油取暖时也会产生。","start":125.68,"end":128.84},{"de":"Gibt es zu viel CO2, wird es auf der Erde wärmer.","zh":"如果二氧化碳太多,地球就会变暖。","start":129.0,"end":132.16},{"de":"Dann gibt es Waldbrände, aber auch Stürme und Überschwemmungen.","zh":"这样就会出现森林火灾,还有风暴和洪水。","start":132.32,"end":136.32},{"de":"Der deutsche Minister für Klima, Schneider, sagt:","zh":"德国的气候部长施奈德说:","start":136.4,"end":139.44},{"de":"Viele Länder wollen das Klima schützen.","zh":"许多国家想保护气候。","start":139.52,"end":142.0},{"de":"Wir auch.","zh":"我们也是。","start":142.16,"end":143.4},{"de":"Aber einige Länder verdienen noch viel Geld mit Öl und Gas.","zh":"但有一些国家仍然靠石油和天然气赚很多钱。","start":143.64,"end":147.44},{"de":"Diese Länder sind nicht bereit, auf das Geld zu verzichten.","zh":"这些国家不愿意放弃这笔钱。","start":147.8,"end":151.4},{"de":"Es geht um Länder wie Saudi-Arabien.","zh":"这指的是像沙特阿拉伯这样的国家。","start":151.8,"end":154.24},{"de":"Sie wollten nicht in die Abschlusserklärung schreiben:","zh":"他们不愿意在最终声明中写上:","start":154.36,"end":157.64},{"de":"Wir hören auf mit Kohle, Öl und Gas.","zh":"我们停止使用煤炭、石油和天然气。","start":157.76,"end":160.6},{"de":"Dieser Politiker kümmert sich bei der EU um das Klima.","zh":"这位政治人物在欧盟负责气候事务。","start":161.68,"end":165.08},{"de":"Er sagt:","zh":"他说:","start":165.2,"end":166.4},{"de":"Wir haben es leider nicht geschafft, die anderen Länder zu überzeugen.","zh":"很遗憾,我们没能说服其他国家。","start":166.48,"end":170.64},{"de":"Wir müssen aufhören mit Kohle, Öl und Gas.","zh":"我们必须停止使用煤炭、石油和天然气。","start":170.76,"end":173.32},{"de":"Deshalb gibt es keine Abschlusserklärung von der Klimakonferenz.","zh":"因此,这次气候会议没有发表最终声明。","start":173.84,"end":178.04},{"de":"Viele Länder wollen trotzdem das Klima schützen.","zh":"尽管如此,许多国家仍想保护气候。","start":178.28,"end":181.32},{"de":"Zum Beispiel indem sie Strom mit Windkraft und Solaranlagen machen.","zh":"例如通过风力和太阳能设备来发电。","start":181.4,"end":186.16},{"de":"Und nun zur nächsten Nachricht:","zh":"现在来看下一条新闻:","start":187.84,"end":190.04},{"de":"An vielen Schulen in Deutschland gab es heute große Aufregung.","zh":"今天,德国许多学校出现了很大的骚动。","start":194.48,"end":198.6},{"de":"Auch an der Schule auf dem Foto.","zh":"照片上的这所学校也不例外。","start":199.6,"end":201.92},{"de":"Sie ist in der Stadt Leipzig.","zh":"它位于莱比锡市。","start":202.52,"end":204.72},{"de":"Viele Schulen haben am Morgen eine E-Mail bekommen.","zh":"许多学校在早上收到了一封电子邮件。","start":205.56,"end":209.08},{"de":"In der E-Mail wurden die Schulen mit einer Bombe bedroht.","zh":"邮件中有人用炸弹威胁这些学校。","start":210.0,"end":213.84},{"de":"Manche Schulen riefen die Polizei.","zh":"一些学校报了警。","start":214.76,"end":217.16},{"de":"Die Polizei sagt:","zh":"警方表示:","start":218.12,"end":219.36},{"de":"Es gibt keine direkte Bedrohung.","zh":"目前没有直接的威胁。","start":219.68,"end":221.96},{"de":"Trotzdem wurden die Kinder an manchen Schulen nach Hause geschickt.","zh":"尽管如此,一些学校的孩子还是被送回了家。","start":222.84,"end":227.2},{"de":"Der Unterricht fiel aus.","zh":"课程被取消了。","start":227.52,"end":229.16},{"de":"Die Polizei sucht jetzt nach dem Täter.","zh":"警方现在正在寻找作案人。","start":229.72,"end":232.6},{"de":"Und nun zur nächsten Nachricht:","zh":"现在来看下一条新闻:","start":234.72,"end":236.76},{"de":"Auf dem Foto ist die Erde.","zh":"照片上是地球。","start":240.8,"end":242.72},{"de":"Aufgenommen aus dem Weltraum.","zh":"是从太空拍摄的。","start":243.2,"end":245.24},{"de":"Das Foto hat ein Satellit gemacht.","zh":"这张照片是一颗卫星拍摄的。","start":246.0,"end":248.68},{"de":"Satelliten sind Geräte, die im Weltall herumfliegen.","zh":"卫星是在太空中飞行的设备。","start":250.04,"end":253.76},{"de":"Sie sammeln Daten und schicken sie zur Erde.","zh":"它们收集数据并把数据传回地球。","start":254.68,"end":258.04},{"de":"Satelliten sind wichtig für Flugzeuge, für das Militär oder um das Wetter vorherzusagen.","zh":"卫星对飞机、军方以及预测天气都很重要。","start":259.16,"end":266.52},{"de":"Journalisten haben jetzt herausgefunden, Russland arbeitet an einer Waffe, die viele Satelliten zerstören kann.","zh":"记者们现在发现,俄罗斯正在研制一种能够摧毁许多卫星的武器。","start":268.04,"end":276.48},{"de":"Und zwar an einer Atombombe im Weltraum.","zh":"而且是一枚太空中的原子弹。","start":278.48,"end":281.64},{"de":"Eine Atombombe ist eine sehr starke Bombe.","zh":"原子弹是一种威力非常强大的炸弹。","start":283.36,"end":286.68},{"de":"Dazu zeigen wir einen Film:","zh":"接下来我们播放一段影片:","start":288.44,"end":290.44},{"de":"In diesem Gebäude im Westen von Deutschland sitzt die Bundeswehr.","zh":"这栋位于德国西部的建筑里驻扎着联邦国防军。","start":291.56,"end":295.52},{"de":"Von hier aus beobachten Soldaten den Weltraum und die Satelliten.","zh":"士兵们从这里观察太空和卫星。","start":295.8,"end":300.28},{"de":"Rund um die Erde fliegen viele Satelliten.","zh":"地球周围飞行着许多卫星。","start":301.12,"end":303.8},{"de":"Hier sind sie als Punkte zu sehen.","zh":"它们在这里显示为一些小点。","start":304.0,"end":306.24},{"de":"Jetzt warnen Behörden:","zh":"现在有关部门警告说：","start":306.6,"end":308.24},{"de":"Russland will bald eine Atombombe in den Weltraum bringen.","zh":"俄罗斯想把一枚原子弹送上太空。","start":308.36,"end":312.4},{"de":"Wenn diese Atombombe explodiert, dann sind viele Satelliten zerstört und stürzen ab.","zh":"如果这枚原子弹爆炸，许多卫星就会被摧毁并坠落。","start":312.56,"end":318.04},{"de":"Viele Dinge im Alltag funktionieren dann nicht mehr.","zh":"日常生活中的许多东西都将无法正常运作。","start":318.76,"end":322.08},{"de":"Navigationsgeräte, Geldautomaten oder Wettervorhersagen.","zh":"比如导航设备、自动取款机或天气预报。","start":322.36,"end":326.28},{"de":"Dieser Experte sagt:","zh":"这位专家说：","start":327.16,"end":328.64},{"de":"Ohne Satelliten funktioniert unser Leben nicht mehr.","zh":"没有卫星，我们的生活就无法运转。","start":328.8,"end":332.12},{"de":"Auch die Bundeswehr sagt:","zh":"德国联邦国防军也说：","start":332.24,"end":333.8},{"de":"Ohne Satelliten haben wir ein Problem.","zh":"没有卫星，我们就有麻烦了。","start":333.92,"end":336.36},{"de":"Dieser Soldat sagt:","zh":"这位士兵说：","start":336.8,"end":338.08},{"de":"Wir können das Land ohne Satelliten nur schlecht verteidigen, weil wir dann sehr schwer Ziele finden.","zh":"没有卫星，我们很难保卫国家，因为那样我们就很难找到目标。","start":338.56,"end":345.04},{"de":"Russland sagt:","zh":"俄罗斯说：","start":345.6,"end":346.8},{"de":"Wir wollen keine Atombomben in den Weltraum bringen.","zh":"我们不想把原子弹送上太空。","start":347.04,"end":350.28},{"de":"Mehrere Länder glauben das aber nicht.","zh":"但好几个国家不相信这一点。","start":350.44,"end":353.0},{"de":"Und nun zur nächsten Nachricht:","zh":"现在来看下一条新闻：","start":354.96,"end":357.16},{"de":"Die Firma Nvidia kommt aus den USA und entwirft Computerteile.","zh":"英伟达公司来自美国，设计电脑部件。","start":361.48,"end":366.0},{"de":"Der Chef von Nvidia hat seinen Job vor wenigen Tagen abgegeben.","zh":"英伟达的老板几天前辞去了他的职务。","start":368.24,"end":372.52},{"de":"Er heißt Jensen Huang und ist auf dem Foto.","zh":"他叫黄仁勋，就是照片上的人。","start":373.2,"end":376.44},{"de":"Huang hatte nämlich eine Affäre mit einer Frau.","zh":"因为黄仁勋和一名女性有婚外情。","start":377.68,"end":380.92},{"de":"Sie soll als Spionin für China gearbeitet haben.","zh":"据说她曾为中国当间谍。","start":381.72,"end":385.2},{"de":"Jetzt hat Nvidia mitgeteilt:","zh":"现在英伟达宣布：","start":386.48,"end":388.56},{"de":"Huang kommt zurück als Chef von der Firma.","zh":"黄仁勋将回归，重新担任公司老板。","start":389.2,"end":392.04},{"de":"Die Regierung von den USA sagt:","zh":"美国政府表示：","start":393.0,"end":395.44},{"de":"Huang hat nicht gegen Regeln verstoßen.","zh":"黄仁勋没有违反规定。","start":396.36,"end":399.08},{"de":"Der Präsident von den USA, Trump, freut sich.","zh":"美国总统特朗普很高兴。","start":400.0,"end":403.44},{"de":"In den letzten Tagen hat er immer wieder gesagt:","zh":"最近几天他一再表示：","start":404.6,"end":407.6},{"de":"Huang soll zurückkommen.","zh":"希望黄仁勋回来。","start":407.96,"end":409.84},{"de":"Und nun zur nächsten Nachricht:","zh":"现在来看下一条新闻：","start":412.12,"end":414.24},{"de":"Am Sonntag ist der Erste Advent.","zh":"本周日是基督降临节的第一个星期日。","start":419.04,"end":421.4},{"de":"In einem Monat ist Weihnachten.","zh":"再过一个月就是圣诞节。","start":422.16,"end":424.64},{"de":"In vielen Städten haben jetzt die Weihnachtsmärkte geöffnet.","zh":"许多城市的圣诞市场现在开放了。","start":425.56,"end":429.64},{"de":"In Deutschland gibt es ungefähr 3000 größere Weihnachtsmärkte.","zh":"德国大约有3000个较大的圣诞市场。","start":430.6,"end":434.76},{"de":"Dazu zeigen wir jetzt einen kurzen Film:","zh":"现在我们播放一段短片：","start":436.0,"end":438.96},{"de":"In der Stadt Düsseldorf, im Westen von Deutschland, ist der Weihnachtsmarkt schon seit dem Wochenende offen.","zh":"在德国西部的杜塞尔多夫市，圣诞市场自周末起已经开放。","start":440.0,"end":446.96},{"de":"Dort gibt es schon Glühwein und Kekse.","zh":"那里已经有热红酒和饼干。","start":447.52,"end":450.16},{"de":"Auch viele andere Geschäfte in den Städten freuen sich.","zh":"城市里的许多其他商店也很高兴。","start":451.0,"end":454.44},{"de":"Weil es Weihnachtsmärkte gibt, sind viele Menschen da, die auch in anderen Geschäften einkaufen.","zh":"因为有圣诞市场，很多人会来，也会在其他商店购物。","start":455.0,"end":461.72},{"de":"Und das waren unsere Nachrichten:","zh":"以上就是我们的新闻：","start":463.84,"end":466.0},{"de":"Und jetzt kommt das Wetter:","zh":"现在来看天气：","start":488.6,"end":490.56},{"de":"Oben im Norden und rechts im Osten gibt es an manchen Orten Schnee.","zh":"在北部和东部，个别地方有雪。","start":491.88,"end":496.24},{"de":"Sonst ist es trocken.","zh":"其他地方天气干燥。","start":497.0,"end":498.48},{"de":"Meistens scheint die Sonne.","zh":"大部分地区有阳光。","start":498.72,"end":500.64},{"de":"Teilweise gibt es dichten Nebel.","zh":"有些地方有大雾。","start":500.76,"end":502.92},{"de":"Es werden zwei bis sechs Grad.","zh":"气温为两到六度。","start":503.6,"end":505.84},{"de":"Das war die tagesschau in Einfacher Sprache.","zh":"以上就是简单语言版每日新闻。","start":508.0,"end":510.8},{"de":"Tschüss, bis zum nächsten Mal.","zh":"再见，下次见。","start":512.04,"end":514.04}],"stories":[{"title":"Begrüßung","title_zh":"欢迎","fr
