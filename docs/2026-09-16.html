<script>const DATA = {"date": "2026-09-16", "slug": "2026-09-16", "source": "einfach", "source_label": "tagesschau · Einfache Sprache", "source_short": "einfacher Sprache", "content_kind": "video", "level": "A2–B1", "adaptation": "", "source_url": "https://www.tagesschau.de/tagesschau_in_einfacher_sprache/video-1650072.html", "video_page": "https://www.tagesschau.de/tagesschau_in_einfacher_sprache/video-1650072.html", "embed_url": "https://www.tagesschau.de/tagesschau_in_einfacher_sprache/video-1650072~player.html", "mp4_url": "https://tagesschau-progressive.ard-mcdn.de/video/2026/0916/TV-20260916-1737-3700.webl.h264.mp4", "duration": 456.24, "news": [{"title": "Viele Diskussionen über Bundeskanzler Merz", "title_zh": "关于联邦总理默茨的众多讨论", "paras": [{"start": 29.6, "end": 67.48, "lines": [{"de": "Willkommen zur tagesschau in Einfacher Sprache.", "zh": "欢迎收看简易德语每日新闻。", "start": null, "end": null}, {"de": "Ich bin Susanne Holst und das sind unsere Nachrichten: Und nun zur ersten Nachricht: Der Bundeskanzler ist der Chef von der Bundesregierung.", "zh": "我是苏珊娜·霍尔斯特，以下是今天的新闻：现在进入第一条新闻：联邦总理是联邦政府的最高领导人。", "start": 29.6, "end": 31.76}, {"de": "Er heißt Friedrich Merz und ist auf dem Foto.", "zh": "他叫弗里德里希·默茨，就是照片上这位。", "start": 35.76, "end": 42.28}, {"de": "Friedrich Merz ist für mehrere Jahre zum Bundeskanzler gewählt.", "zh": "弗里德里希·默茨当选联邦总理，任期数年。", "start": 42.76, "end": 46.76}, {"de": "Viele Menschen fragen sich aber, ist Friedrich Merz noch lange Bundeskanzler?", "zh": "但很多人在问：默茨还能当多久联邦总理？", "start": 47.28, "end": 52.8}, {"de": "Viele Menschen sind nämlich unzufrieden mit der Arbeit von Friedrich Merz.", "zh": "因为很多人对默茨的工作不满意。", "start": 53.12, "end": 57.92}, {"de": "Auch in der CDU sind viele unzufrieden.", "zh": "在基民盟内部也有很多人不满。", "start": 58.0, "end": 60.56}, {"de": "Das ist die Partei von Friedrich Merz.", "zh": "这是默茨所在的政党。", "start": 60.76, "end": 63.16}, {"de": "Manche sagen jetzt: Wir brauchen einen anderen Bundeskanzler.", "zh": "现在有人说：我们需要另一位联邦总理。", "start": 63.28, "end": 67.48}]}, {"start": 67.68, "end": 181.64, "lines": [{"de": "Dazu kommt ein Film: Diese Frau ist Politikerin in der CDU.", "zh": "接下来是一段影片。", "start": 67.68, "end": 73.32}, {"de": "Sie heißt Clara von Nathusius und sagt: Viele Menschen glauben der CDU nicht mehr.", "zh": "这位女性是基民盟的政治人物。", "start": 74.0, "end": 80.04}, {"de": "Ein Grund ist Friedrich Merz.", "zh": "她叫克拉拉·冯·纳图西乌斯，她说：很多人已经不再信任基民盟。", "start": 80.24, "end": 82.2}, {"de": "Die CDU kann mit Friedrich Merz keine Wahlen mehr gewinnen.", "zh": "原因之一就是默茨。", "start": 82.56, "end": 86.36}, {"de": "Ein Problem ist: Die Bundesregierung von Friedrich Merz ist sehr unbeliebt.", "zh": "有默茨在，基民盟无法再赢得选举。", "start": 87.12, "end": 92.32}, {"de": "Sie will viele Sachen in Deutschland verändern.", "zh": "一个问题在于：默茨领导的联邦政府非常不受欢迎。", "start": 92.44, "end": 95.24}, {"de": "Manche Menschen finden das gut.", "zh": "它想改变德国的许多事情。", "start": 95.36, "end": 97.36}, {"de": "Manche Menschen finden das schlecht.", "zh": "有些人觉得这是好事。有些人觉得这是坏事。", "start": 97.72, "end": 99.96}, {"de": "Die Bundesregierung sagt: Wir müssen die Sachen verändern.", "zh": "联邦政府说：我们必须做出改变。", "start": 100.12, "end": 103.92}, {"de": "Das ist sehr wichtig.", "zh": "这非常重要。", "start": 104.04, "end": 105.44}, {"de": "Wenn wir Sachen verändern, dann geht es Deutschland auch in der Zukunft gut.", "zh": "如果我们做出改变，德国的未来也会好。", "start": 105.56, "end": 110.32}, {"de": "Ein anderes Problem für Friedrich Merz sind die Wahlen.", "zh": "默茨的另一个问题是选举。", "start": 110.44, "end": 113.96}, {"de": "Bei der Wahl in Sachsen-Anhalt hat die CDU verloren.", "zh": "在萨克森-安哈尔特州的选举中，基民盟输了。", "start": 114.12, "end": 117.4}, {"de": "Manche in der CDU sagen: Wir haben wegen Friedrich Merz verloren.", "zh": "基民盟内有人说：我们就是因为默茨才输的。", "start": 117.8, "end": 122.32}, {"de": "Jetzt gibt es wieder Wahlen.", "zh": "现在又有选举了。", "start": 122.72, "end": 124.56}, {"de": "In dem Bundesland Mecklenburg-Vorpommern und in der Stadt Berlin.", "zh": "地点在梅克伦堡-前波美拉尼亚州，以及柏林市。", "start": 124.72, "end": 129.04}, {"de": "Wenn die CDU diese Wahlen auch verliert: Dann sagen vielleicht noch mehr Menschen, wir brauchen einen anderen Bundeskanzler.", "zh": "如果基民盟连这些选举也输掉：那可能会有更多人要求换一位联邦总理。", "start": 129.16, "end": 137.32}, {"de": "Jetzt hat Friedrich Merz Hilfe bekommen von den Ministerpräsidenten von der CDU.", "zh": "现在默茨得到了基民盟各位州长的支持。", "start": 137.72, "end": 142.88}, {"de": "Die sind sehr mächtig.", "zh": "这些人非常有权力。", "start": 143.28, "end": 144.88}, {"de": "Die Ministerpräsidenten sind nämlich die Chefs von den Regierungen in den Bundesländern.", "zh": "因为州长就是各联邦州政府的最高领导人。", "start": 145.4, "end": 150.96}, {"de": "Zum Beispiel Hendrik Wüst in Nordrhein-Westfalen.", "zh": "比如北莱茵-威斯特法伦州的亨德里克·维斯特。", "start": 151.12, "end": 154.16}, {"de": "Die Ministerpräsidenten von der CDU sagen: Friedrich Merz soll Bundeskanzler bleiben.", "zh": "基民盟的州长们说：默茨应该继续担任联邦总理。", "start": 154.56, "end": 160.64}, {"de": "Wir müssen gut regieren und nicht über Personen diskutieren.", "zh": "我们必须好好执政，而不是争论人选。", "start": 161.08, "end": 164.84}, {"de": "Das wollen die Menschen in Deutschland.", "zh": "这是德国民众想要的。", "start": 165.52, "end": 167.96}, {"de": "Die Hilfe von den Ministerpräsidenten ist gut für Friedrich Merz.", "zh": "州长们的支持对默茨是好事。", "start": 168.76, "end": 172.76}, {"de": "Aber niemand weiß: Ist die Diskussion jetzt zu Ende oder wird weiter über ein Ende von Bundeskanzler Friedrich Merz diskutiert?", "zh": "但没人知道：这场讨论现在就结束了，还是会继续讨论默茨的下台？", "start": 173.08, "end": 181.64}]}], "vocab": [{"lemma": "der Bundeskanzler, die Bundeskanzlerin", "key": "bundeskanzler", "forms": ["Bundeskanzler"], "pos": "Substantiv", "zh": "联邦总理", "example_de": "Ich bin Susanne Holst und das sind unsere Nachrichten: Und nun zur ersten Nachricht: Der Bundeskanzler ist der Chef von der Bundesregierung.", "example_zh": ""}, {"lemma": "die Bundesregierung, -en", "key": "bundesregierung", "forms": ["Bundesregierung"], "pos": "Substantiv", "zh": "联邦政府", "example_de": "Ich bin Susanne Holst und das sind unsere Nachrichten: Und nun zur ersten Nachricht: Der Bundeskanzler ist der Chef von der Bundesregierung.", "example_zh": ""}, {"lemma": "unzufrieden", "key": "unzufrieden", "forms": ["unzufrieden"], "pos": "Adjektiv", "zh": "不满意的", "example_de": "Viele Menschen sind nämlich unzufrieden mit der Arbeit von Friedrich Merz.", "example_zh": ""}, {"lemma": "die Partei, -en", "key": "partei", "forms": ["Partei", "Parteien"], "pos": "Substantiv", "zh": "政党", "example_de": "Das ist die Partei von Friedrich Merz.", "example_zh": ""}, {"lemma": "die Wahl, -en", "key": "wahl", "forms": ["Wahl", "Wahlen"], "pos": "Substantiv", "zh": "选举", "example_de": "Die CDU kann mit Friedrich Merz keine Wahlen mehr gewinnen.", "example_zh": ""}, {"lemma": "verlieren (hat verloren)", "key": "verlieren", "forms": ["verloren", "verlieren"], "pos": "Verb", "zh": "输掉、失去", "example_de": "Bei der Wahl in Sachsen-Anhalt hat die CDU verloren.", "example_zh": ""}, {"lemma": "der Ministerpräsident, -en", "key": "ministerpraesident", "forms": ["Ministerpräsidenten", "Ministerpräsident"], "pos": "Substantiv", "zh": "州长（联邦州政府首脑）", "example_de": "Jetzt hat Friedrich Merz Hilfe bekommen von den Ministerpräsidenten von der CDU.", "example_zh": ""}, {"lemma": "mächtig", "key": "maechtig", "forms": ["mächtig"], "pos": "Adjektiv", "zh": "有权力的、有影响力的", "example_de": "Die sind sehr mächtig.", "example_zh": ""}, {"lemma": "die Diskussion, -en", "key": "diskussion", "forms": ["Diskussion", "diskutiert"], "pos": "Substantiv", "zh": "讨论", "example_de": "Aber niemand weiß: Ist die Diskussion jetzt zu Ende oder wird weiter über ein Ende von Bundeskanzler Friedrich Merz diskutiert?", "example_zh": ""}], "grammar_points": [{"title": "nämlich：补充原因", "summary": "nämlich 不放句首，用来为前面那句话补充原因，相当于「因为、正是由于」。", "example_de": "Viele Menschen sind nämlich unzufrieden mit der Arbeit von Friedrich Merz.", "example_zh": "因为很多人对默茨的工作不满意。"}, {"title": "wenn …, dann …：条件句", "summary": "wenn 引导条件从句，主句常以 dann 开头；从句动词放句尾，回主句后动词回到第二位。", "example_de": "Wenn wir Sachen verändern, dann geht es Deutschland auch in der Zukunft gut.", "example_zh": "如果我们做出改变，德国的未来也会好。"}], "background": "默茨领导的联盟政府上台后民调持续走低。此前萨克森-安哈尔特州选举中基民盟失利，党内出现换帅声音；而梅克伦堡-前波美拉尼亚州和柏林的选举临近，被视为对默茨的进一步考验。基民盟籍各州州长此时公开表态支持，暂时稳住了局面。"}, {"title": "Nach Anschlag: Härtere Strafen geplant", "title_zh": "袭击事件后：计划出台更重刑罚", "paras": [{"start": 183.16, "end": 238.08, "lines": [{"de": "Und nun zur nächsten Nachricht: Im Sommer gab es in der Stadt Berlin einen Anschlag.", "zh": "现在进入下一条新闻：今年夏天，柏林市发生了一起袭击事件。", "start": 183.16, "end": 191.96}, {"de": "Dort haben queere Menschen demonstriert.", "zh": "当时酷儿群体正在那里举行示威。", "start": 192.16, "end": 194.72}, {"de": "Queer bedeutet zum Beispiel: Männer lieben Männer und Frauen lieben Frauen.", "zh": "酷儿的意思比如是：男人爱男人，女人爱女人。", "start": 194.88, "end": 199.88}, {"de": "Eine Frau ist bei dem Anschlag gestorben.", "zh": "一名女性在这起袭击中丧生。", "start": 200.28, "end": 202.84}, {"de": "Viele Menschen wurden verletzt.", "zh": "很多人受了伤。", "start": 203.04, "end": 205.0}, {"de": "Ein Mann hat die Menschen mit einem Auto angefahren.", "zh": "一名男子开车撞向人群。", "start": 205.2, "end": 208.44}, {"de": "Die Polizei hat den Mann getötet.", "zh": "警察将这名男子击毙。", "start": 209.16, "end": 211.44}, {"de": "Er war wahrscheinlich ein Islamist, ein Terrorist mit der Religion Islam.", "zh": "他很可能是一名伊斯兰主义者，也就是信奉伊斯兰教的恐怖分子。", "start": 211.88, "end": 216.76}, {"de": "Jetzt hat die Bundesregierung gesagt: Das machen wir gegen Islamisten und für mehr Sicherheit.", "zh": "现在联邦政府宣布：我们要用这些措施打击伊斯兰主义者、提升安全。", "start": 217.76, "end": 223.84}, {"de": "Zum Beispiel wenn jemand andere mit einem Messer angreift, dann soll es härtere Strafen geben.", "zh": "比如有人持刀袭击他人，就应当受到更重的刑罚。", "start": 224.12, "end": 230.2}, {"de": "Wenn jemand als gefährlich gilt, dann soll er besser überwacht werden.", "zh": "被认定为危险分子的人，应当受到更严密的监控。", "start": 230.64, "end": 234.92}, {"de": "Der Bundestag muss die Pläne noch beschließen.", "zh": "联邦议院还需要通过这些计划。", "start": 235.2, "end": 238.08}]}], "vocab": [{"lemma": "der Anschlag, ..-e", "key": "anschlag", "forms": ["Anschlag"], "pos": "Substantiv", "zh": "袭击事件", "example_de": "Und nun zur nächsten Nachricht: Im Sommer gab es in der Stadt Berlin einen Anschlag.", "example_zh": ""}, {"lemma": "demonstrieren", "key": "demonstrieren", "forms": ["demonstriert", "demonstrieren"], "pos": "Verb", "zh": "游行示威", "example_de": "Dort haben queere Menschen demonstriert.", "example_zh": ""}, {"lemma": "queer", "key": "queer", "forms": ["queere", "Queer", "queer"], "pos": "Adjektiv", "zh": "酷儿的（性少数）", "example_de": "Dort haben queere Menschen demonstriert.", "example_zh": ""}, {"lemma": "verletzen / verletzt", "key": "verletzen", "forms": ["verletzt", "verletzen / verletzt"], "pos": "Verb", "zh": "使受伤", "example_de": "Viele Menschen wurden verletzt.", "example_zh": ""}, {"lemma": "der Islamist, -en", "key": "islamist", "forms": ["Islamist", "Islamisten"], "pos": "Substantiv", "zh": "伊斯兰主义者", "example_de": "Er war wahrscheinlich ein Islamist, ein Terrorist mit der Religion Islam.", "example_zh": ""}, {"lemma": "die Strafe, -n", "key": "strafe", "forms": ["Strafen", "Strafe"], "pos": "Substantiv", "zh": "刑罚、惩罚", "example_de": "Zum Beispiel wenn jemand andere mit einem Messer angreift, dann soll es härtere Strafen geben.", "example_zh": ""}, {"lemma": "die Sicherheit", "key": "sicherheit", "forms": ["Sicherheit"], "pos": "Substantiv", "zh": "安全", "example_de": "Jetzt hat die Bundesregierung gesagt: Das machen wir gegen Islamisten und für mehr Sicherheit.", "example_zh": ""}, {"lemma": "überwachen", "key": "ueberwachen", "forms": ["überwacht", "überwachen"], "pos": "Verb", "zh": "监视、监控", "example_de": "Wenn jemand als gefährlich gilt, dann soll er besser überwacht werden.", "example_zh": ""}, {"lemma": "beschließen (hat beschlossen)", "key": "beschliessen", "forms": ["beschließen"], "pos": "Verb", "zh": "（表决）通过、决定", "example_de": "Der Bundestag muss die Pläne noch beschließen.", "example_zh": ""}], "grammar_points": [{"title": "gilt als …：被认为是……", "summary": "gelten als + 名词/形容词，表示「被看作、被视为」，这里是被动含义的判断。", "example_de": "Wenn jemand als gefährlich gilt, dann soll er besser überwacht werden.", "example_zh": "被认定为危险分子的人，应当受到更严密的监控。"}, {"title": "sollen：计划与要求", "summary": "sollen 表示「应当、按计划要」，常用于法律和规定中，说明某事应该发生。", "example_de": "Zum Beispiel wenn jemand andere mit einem Messer angreift, dann soll es härtere Strafen geben.", "example_zh": "比如有人持刀袭击他人，就应当受到更重的刑罚。"}], "background": "这里指今年夏天柏林一场酷儿（性少数）活动遭汽车冲撞的袭击，一名女子遇难、多人受伤，警方开枪击毙了袭击者。事发后德国社会再度争论如何应对伊斯兰主义极端分子，联邦政府随之提出加重持刀袭击刑罚、加强监控危险人员等一揽子计划，尚待联邦议院表决。"}, {"title": "Soziale Medien: EU will Regeln für Jugendliche", "title_zh": "社交媒体：欧盟想为青少年制定规则", "paras": [{"start": 239.32, "end": 285.6, "lines": [{"de": "Und nun zur nächsten Nachricht: Im Internet gibt es viele soziale Medien.", "zh": "现在进入下一条新闻：互联网上有很多社交媒体。", "start": 239.32, "end": 248.72}, {"de": "Zum Beispiel Instagram, Facebook oder TikTok.", "zh": "比如 Instagram、Facebook 或者 TikTok。", "start": 249.28, "end": 252.44}, {"de": "In den sozialen Medien kann man sich mit anderen Menschen unterhalten.", "zh": "在社交媒体上可以和其他人交流。", "start": 253.52, "end": 257.68}, {"de": "Und man kann dort Fotos und Videos sehen.", "zh": "还可以在上面看照片和视频。", "start": 257.88, "end": 260.44}, {"de": "In dem Land Australien dürfen Jugendliche unter 16 Jahren keine sozialen Medien benutzen.", "zh": "在澳大利亚，16岁以下的青少年不许使用社交媒体。", "start": 260.96, "end": 267.12}, {"de": "Die Regierung sagt nämlich: Die sozialen Medien sind schlecht für die Jugendlichen.", "zh": "因为该国政府说：社交媒体对青少年有害。", "start": 268.4, "end": 273.84}, {"de": "Auch in anderen Ländern überlegen Politiker: Sollen wir soziale Medien für Jugendliche verbieten?", "zh": "其他国家的政治人物也在考虑：我们该不该禁止青少年使用社交媒体？", "start": 274.16, "end": 280.6}, {"de": "Jetzt gibt es einen Vorschlag für Regeln in der Europäischen Union.", "zh": "现在欧盟有了一份规则提案。", "start": 281.48, "end": 285.6}]}, {"start": 286.28, "end": 372.16, "lines": [{"de": "Dazu kommt ein Film: Das ist Ursula von der Leyen.", "zh": "接下来是一段影片。这位是乌尔苏拉·冯德莱恩。", "start": 286.28, "end": 291.08}, {"de": "Sie ist die Chefin von der EU-Kommission.", "zh": "她是欧盟委员会的主席。", "start": 291.24, "end": 294.0}, {"de": "Das ist eine wichtige Behörde in der Europäischen Union.", "zh": "这是欧盟的一个重要机构。", "start": 294.12, "end": 297.88}, {"de": "Die EU-Kommission ist wie eine Regierung.", "zh": "欧盟委员会就像一个政府。", "start": 298.72, "end": 301.48}, {"de": "Sie macht die Gesetze und die Pläne für das Geld von der EU.", "zh": "它制定法律，也规划欧盟的资金。", "start": 301.84, "end": 305.48}, {"de": "Jetzt hat Ursula von der Leyen eine Rede gehalten.", "zh": "现在冯德莱恩发表了一次演讲。", "start": 306.16, "end": 309.32}, {"de": "Dort hat sie auch über soziale Medien gesprochen.", "zh": "她在演讲中也谈到了社交媒体。", "start": 309.8, "end": 312.84}, {"de": "Von der Leyen hat gesagt: Eltern sehen die Auswirkungen.", "zh": "冯德莱恩说：父母们看得到这些影响。", "start": 313.24, "end": 318.24}, {"de": "Kinder schlafen schlecht und haben Ängste.", "zh": "孩子们睡不好觉，还充满焦虑。", "start": 318.64, "end": 321.36}, {"de": "Ursula von der Leyen will deshalb strenge Regeln in der Europäischen Union.", "zh": "因此，冯德莱恩想在欧盟推行严格的规则。", "start": 322.16, "end": 326.88}, {"de": "Sie sagt: Keine sozialen Medien für Kinder unter 13 Jahren.", "zh": "她说：13岁以下的儿童不得使用社交媒体。", "start": 327.04, "end": 332.48}, {"de": "Keine normalen Profile in sozialen Median für Jugendliche zwischen 13 und 15 Jahren.", "zh": "13到15岁的青少年在社交媒体上不能拥有普通账号。", "start": 333.32, "end": 339.16}, {"de": "Es gibt nur kleine Profile mit wenigen Funktionen.", "zh": "只能有功能很少的受限小账号。", "start": 340.68, "end": 344.2}, {"de": "Eltern müssen das erlauben und überwachen.", "zh": "父母必须批准并且监督使用。", "start": 345.0, "end": 347.92}, {"de": "Die kleinen Profile dürfen nur eine Stunde am Tag benutzt werden.", "zh": "这种小账号每天只能使用一小时。", "start": 348.28, "end": 352.84}, {"de": "Das sind die Vorschläge von der EU-Kommission.", "zh": "这些就是欧盟委员会的提议。", "start": 353.52, "end": 356.52}, {"de": "Jetzt braucht es ein Gesetz.", "zh": "现在需要一项法律。", "start": 357.04, "end": 358.92}, {"de": "Das Parlament und die Regierungen in der EU müssen zustimmen.", "zh": "欧洲议会和欧盟各国政府都必须同意。", "start": 359.36, "end": 363.36}, {"de": "Aber niemand weiß, sind sie dafür oder dagegen.", "zh": "但没人知道他们是赞成还是反对。", "start": 364.12, "end": 367.52}, {"de": "Bis die strengen Regeln kommen, kann es noch dauern.", "zh": "在严格规则落地之前，可能还要等上一段时间。", "start": 368.8, "end": 372.16}]}], "vocab": [{"lemma": "die sozialen Medien (Plural)", "key": "soziale-medien", "forms": ["sozialen Medien"], "pos": "Substantiv", "zh": "社交媒体", "example_de": "In den sozialen Medien kann man sich mit anderen Menschen unterhalten.", "example_zh": ""}, {"lemma": "sich unterhalten (hat sich unterhalten)", "key": "unterhalten", "forms": ["unterhalten", "sich unterhalten"], "pos": "Verb", "zh": "交谈、聊天", "example_de": "In den sozialen Medien kann man sich mit anderen Menschen unterhalten.", "example_zh": ""}, {"lemma": "der Jugendliche / die Jugendliche (dekl. wie Adjektiv)", "key": "jugendliche", "forms": ["Jugendliche", "Jugendlichen", "Jugendliche / die Jugendliche"], "pos": "Substantiv", "zh": "青少年", "example_de": "In dem Land Australien dürfen Jugendliche unter 16 Jahren keine sozialen Medien benutzen.", "example_zh": ""}, {"lemma": "verbieten (hat verboten)", "key": "verbieten", "forms": ["verbieten"], "pos": "Verb", "zh": "禁止", "example_de": "Auch in anderen Ländern überlegen Politiker: Sollen wir soziale Medien für Jugendliche verbieten?", "example_zh": ""}, {"lemma": "der Vorschlag, ..-e", "key": "vorschlag", "forms": ["Vorschlag", "Vorschläge"], "pos": "Substantiv", "zh": "提议、方案", "example_de": "Jetzt gibt es einen Vorschlag für Regeln in der Europäischen Union.", "example_zh": ""}, {"lemma": "die EU-Kommission", "key": "eu-kommission", "forms": ["EU-Kommission"], "pos": "Substantiv (Eigenname)", "zh": "欧盟委员会", "example_de": "Sie ist die Chefin von der EU-Kommission.", "example_zh": ""}, {"lemma": "die Rede, -n", "key": "rede", "forms": ["Rede"], "pos": "Substantiv", "zh": "演讲、讲话", "example_de": "Jetzt hat Ursula von der Leyen eine Rede gehalten.", "example_zh": ""}, {"lemma": "die Auswirkung, -en", "key": "auswirkung", "forms": ["Auswirkungen", "Auswirkung"], "pos": "Substantiv", "zh": "影响、后果", "example_de": "Von der Leyen hat gesagt: Eltern sehen die Auswirkungen.", "example_zh": ""}, {"lemma": "zustimmen (hat zugestimmt)", "key": "zustimmen", "forms": ["zustimmen"], "pos": "Verb", "zh": "同意、赞成", "example_de": "Das Parlament und die Regierungen in der EU müssen zustimmen.", "example_zh": ""}], "grammar_points": [{"title": "dürfen + nicht/keine：禁止", "summary": "dürfen 表示许可；dürfen nicht / keine … benutzen 即「不许、不得做某事」，是德语里表达禁令的常用说法。", "example_de": "In dem Land Australien dürfen Jugendliche unter 16 Jahren keine sozialen Medien benutzen.", "example_zh": "在澳大利亚，16岁以下的青少年不许使用社交媒体。"}, {"title": "deshalb：因此", "summary": "deshalb 表示「因此、所以」。放在句首时动词紧随其后占第二位；放在句中时语气更平缓。", "example_de": "Ursula von der Leyen will deshalb strenge Regeln in der Europäischen Union.", "example_zh": "因此，冯德莱恩想在欧盟推行严格的规则。"}], "background": "澳大利亚已率先立法禁止16岁以下青少年使用社交媒体，引发多国跟进讨论。欧盟委员会主席冯德莱恩随后提出分级方案：13岁以下完全禁用，13至15岁只能使用家长批准、功能受限且每日限用一小时的账号。该提案还需欧洲议会和欧盟各国政府批准才能成为法律。"}, {"title": "Schauspieler Ralf Richter gestorben", "title_zh": "演员拉尔夫·里希特去世", "paras": [{"start": 374.04, "end": 415.68, "lines": [{"de": "Und nun zur nächsten Nachricht: Auf dem Foto ist der Schauspieler Ralf Richter.", "zh": "现在进入下一条新闻：照片上是演员拉尔夫·里希特。", "start": 374.04, "end": 382.12}, {"de": "Er hat zum Beispiel in dem Film \"Das Boot\" mitgespielt.", "zh": "他出演过电影《从海底出击》（Das Boot）。", "start": 382.36, "end": 385.8}, {"de": "Und in dem Film \"Bang Boom Bang\".", "zh": "还出演过电影《Bang Boom Bang》。", "start": 386.08, "end": 388.36}, {"de": "Richter hat dort die Figur Kalle Grabowski gespielt.", "zh": "里希特在里面扮演了卡勒·格拉博夫斯基这个角色。", "start": 389.28, "end": 392.56}, {"de": "Die Filme haben Ralf Richter sehr bekannt gemacht.", "zh": "这些电影让拉尔夫·里希特非常出名。", "start": 393.04, "end": 396.16}, {"de": "Jetzt ist er gestorben.", "zh": "现在他去世了。", "start": 396.4, "end": 398.0}, {"de": "Er er hat gesagt: Er ist in der Nacht einfach eingeschlafen.", "example_zh": ""}, {"lemma": "traurig", "key": "traurig", "forms": ["traurig"], "pos": "Adjektiv", "zh": "悲伤的", "example_de": "Wir sind sehr traurig.", "example_zh": ""}], "grammar_points": [{"title": "einfach 的口语用法", "summary": "口语里 einfach 放在动词前，表示「就这么、干脆」，带有「没有别的原因」的语气。", "example_de": "Die Managerin von Ralf Richter hat gesagt: Er ist in der Nacht einfach eingeschlafen.", "example_zh": "他是在夜里就这样安然离世的。"}, {"title": "bekannt machen：使出名", "summary": "machen + 形容词表示「使变得……」；jemanden bekannt machen 就是「使某人出名」。", "example_de": "Die Filme haben Ralf Richter sehr bekannt gemacht.", "example_zh": "这些电影让拉尔夫·里希特非常出名。"}], "background": "拉尔夫·里希特是德国知名演员，因潜艇战争经典《Das Boot》（从海底出击）和犯罪喜剧《Bang Boom Bang》广为人知，后者中他饰演的黑帮小人物 Kalle Grabowski 是德国影史的经典角色。"}, {"title": "Das Wetter", "title_zh": "天气", "paras": [{"start": 434.64, "end": 449.24, "lines": [{"de": "Und jetzt kommt das Wetter: Oben im Norden gibt es viele Wolken und immer wieder Regen.", "zh": "现在是天气预报：最北边云很多，而且降雨不断。", "start": 434.64, "end": 440.68}, {"de": "Im Rest des Landes scheint mal die Sonne und mal sind Wolken am Himmel.", "zh": "在德国其他地区，时而阳光明媚，时而天上有云。", "start": 440.92, "end": 445.56}, {"de": "Es bleibt aber trocken.", "zh": "但天气保持干燥。", "start": 445.72, "end": 447.36}, {"de": "Es werden 15 bis 25 Grad.", "zh": "气温15到25度。", "start": 447.52, "end": 449.24}]}], "vocab": [{"lemma": "die Wolke, -n", "key": "wolke", "forms": ["Wolken", "Wolke"], "pos": "Substantiv", "zh": "云", "example_de": "Und jetzt kommt das Wetter: Oben im Norden gibt es viele Wolken und immer wieder Regen.", "example_zh": ""}, {"lemma": "der Regen", "key": "regen", "forms": ["Regen"], "pos": "Substantiv", "zh": "雨", "example_de": "Und jetzt kommt das Wetter: Oben im Norden gibt es viele Wolken und immer wieder Regen.", "example_zh": ""}, {"lemma": "trocken", "key": "trocken", "forms": ["trocken"], "pos": "Adjektiv", "zh": "干燥的", "example_de": "Es bleibt aber trocken.", "example_zh": ""}, {"lemma"
