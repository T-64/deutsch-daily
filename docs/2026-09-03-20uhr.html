<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Deutsch Daily — 2026-09-03</title>
<style>
  :root {
    --bg: #eef2f0;
    --surface: #ffffff;
    --surface-2: #f7f9f8;
    --ink: #172127;
    --ink-soft: #647077;
    --line: #dce4e1;
    --accent: #176b72;
    --accent-strong: #0d5057;
    --accent-soft: #dceeed;
    --warm: #d98f39;
    --warm-soft: #fff0d9;
    --zh: #5f696f;
    --danger: #b3493f;
    --shadow: 0 18px 50px rgba(20, 46, 47, .10);
    --shadow-soft: 0 8px 24px rgba(20, 46, 47, .07);
  }
  [data-theme="dark"] {
    --bg: #111719; --surface: #192124; --surface-2: #202a2d;
    --ink: #edf3f1; --ink-soft: #a9b7b8; --line: #344145;
    --accent: #75cbd0; --accent-strong: #99dfe2; --accent-soft: #223e40;
    --warm: #f0b35e; --warm-soft: #3b3022; --zh: #bac5c5;
    --shadow: 0 18px 50px rgba(0,0,0,.28); --shadow-soft: 0 8px 24px rgba(0,0,0,.22);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { scroll-behavior: smooth; scroll-padding-top: 90px; }
  body {
    min-height: 100vh; background: var(--bg); color: var(--ink);
    font: 16px/1.65 Inter, ui-sans-serif, system-ui, -apple-system, "Noto Sans SC", sans-serif;
    transition: background .2s, color .2s;
  }
  button, input, textarea { font: inherit; }
  button, a { -webkit-tap-highlight-color: transparent; }
  button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible {
    outline: 3px solid color-mix(in srgb, var(--accent) 35%, transparent); outline-offset: 2px;
  }
  .app { width: min(1280px, calc(100% - 48px)); margin: 0 auto; padding: 24px 0 100px; }
  .topbar {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    min-height: 42px; margin-bottom: 34px;
  }
  .brand {
    display: inline-flex; align-items: center; gap: 10px; color: var(--ink);
    font-weight: 800; letter-spacing: -.02em; text-decoration: none;
  }
  .brand-mark {
    display: grid; place-items: center; width: 30px; height: 30px; border-radius: 9px;
    background: var(--accent); color: #fff; font: 800 12px/1 ui-monospace, monospace;
  }
  .top-actions { display: flex; align-items: center; gap: 8px; }
  .icon-btn, .archive-link, .text-btn {
    min-height: 38px; border: 1px solid var(--line); border-radius: 12px;
    background: var(--surface); color: var(--ink-soft); cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; text-decoration: none;
  }
  .icon-btn { width: 38px; }
  .archive-link, .text-btn { gap: 7px; padding: 0 13px; font-size: 13px; font-weight: 700; }
  .hero { margin-bottom: 26px; }
  .eyebrow {
    color: var(--accent); font-size: 12px; font-weight: 800; letter-spacing: .12em;
    text-transform: uppercase; margin-bottom: 9px;
  }
  .hero h1 {
    max-width: 720px; font: 750 clamp(29px, 4vw, 50px)/1.08 ui-serif, Georgia, serif;
    letter-spacing: -.04em;
  }
  .hero-meta { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 13px; color: var(--ink-soft); font-size: 14px; }
  .hero-meta span { display: inline-flex; align-items: center; gap: 7px; }

  .study-grid { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: clamp(20px, 3.2vw, 48px); align-items: start; }
  .side {
    position: sticky; top: 16px; max-height: calc(100vh - 24px);
    display: flex; flex-direction: column; min-height: 0;
  }
  .study-panel {
    display: flex; flex-direction: column; gap: 16px; min-height: 0; max-height: calc(100vh - 24px);
    background: transparent; border: 0; box-shadow: none; overflow: visible;
  }
  .video-card {
    position: relative; flex: 0 0 auto; overflow: hidden; background: #071012;
    border-radius: 24px; box-shadow: var(--shadow-soft);
  }
  .player { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #071012; }
  .player iframe, .player video { position: absolute; inset: 0; display: block; width: 100%; height: 100%; border: 0; background: #071012; }
  .video-drag {
    display: none; position: absolute; z-index: 3; top: 0; left: 0; right: 36px; height: 32px;
    cursor: grab; touch-action: none;
    background: linear-gradient(to bottom, rgba(0,0,0,.5), transparent);
  }
  .video-drag:active { cursor: grabbing; }
  .video-float-close {
    display: none; border: 0; background: rgba(255,255,255,.14); color: #fff;
    width: 28px; height: 28px; border-radius: 50%; cursor: pointer;
  }
  .rail {
    display: flex; flex-direction: column; flex: 1; min-height: 0;
    padding: 18px 18px 16px; border: 1px solid var(--line); border-radius: 24px;
    background: var(--surface); box-shadow: var(--shadow-soft); overflow: hidden;
  }
  .rail-bar { padding: 0 0 12px; }
  .controls { display: flex; width: 100%; }
  .controls button {
    flex: 1; min-height: 40px; padding: 0 14px; border: 1px solid var(--line); border-radius: 12px;
    background: var(--surface-2); color: var(--ink-soft); cursor: pointer; font-size: 14px; font-weight: 750;
  }
  .controls button.on { border-color: var(--accent); background: var(--accent); color: #fff; }
  .hero-meta a { color: var(--accent); text-decoration: none; font-weight: 700; }
  .hero-meta a:hover { text-decoration: underline; }
  .topic-nav { flex: 1; min-height: 0; overflow-y: auto; padding: 0; scrollbar-gutter: stable; }
  .topic { border-top: 1px solid var(--line); }
  .topic:first-child { border-top: 0; }
  .topic > a {
    display: grid; grid-template-columns: 32px minmax(0,1fr); gap: 10px; align-items: start;
    padding: 11px 0; color: var(--ink); text-decoration: none;
  }
  .topic > a span {
    min-width: 0; padding-top: 5px;
    font: 650 15px/1.35 ui-serif, Georgia, serif; letter-spacing: -.015em;
  }
  .topic > a:hover span { color: var(--accent); }
  .topic b {
    display: grid; place-items: center; width: 32px; height: 32px; border-radius: 10px;
    background: var(--accent-soft); color: var(--accent-strong);
    font: 800 11px/1 ui-monospace, monospace;
  }
  .topic.on b { background: var(--accent); color: #fff; }
  .topic.on > a span { color: var(--accent-strong); }
  .topic-study { display: none; padding: 0 0 12px; }
  .topic.on .topic-study { display: block; }
  .topic-study .empty-study { color: var(--ink-soft); font-size: 13px; padding: 6px 0; }
  .study-tabs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-top: 2px; }
  .study-tabs.n2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .study-tabs.n1 { grid-template-columns: 1fr; }
  .stab {
    min-height: 32px; padding: 0 6px; border: 1px solid var(--line); border-radius: 11px;
    background: var(--surface-2); color: var(--ink-soft); cursor: pointer;
    font-size: 12px; font-weight: 750;
  }
  .stab:hover { border-color: var(--accent); color: var(--accent-strong); }
  .stab.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-strong); }
  .spane { display: none; margin-top: 6px; }
  .spane.on { display: block; }
  .vrow {
    display: grid; grid-template-columns: minmax(0,1fr) 28px; gap: 8px; align-items: start;
    padding: 10px 0; border-top: 1px dashed var(--line);
  }
  .vrow .vw { color: var(--ink); font: 750 14.5px/1.35 ui-serif, Georgia, serif; }
  .vrow .vz { margin-top: 4px; color: var(--accent-strong); font-size: 13.5px; }
  .vrow .vex { margin-top: 6px; color: var(--ink-soft); font-size: 13px; font-style: italic; }
  .vadd {
    width: 28px; height: 28px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--surface); color: var(--accent-strong); cursor: pointer;
    font: 700 18px/1 ui-sans-serif, system-ui;
  }
  .vadd:hover { border-color: var(--accent); background: var(--accent-soft); }
  .rail-note { margin: 0; padding: 10px 0; color: var(--ink-soft); font-size: 13.5px; line-height: 1.7; }
  .rail-note + .rail-note { border-top: 1px dashed var(--line); }
  .rail-note strong { display: block; margin-bottom: 4px; color: var(--ink); font: 750 14.5px/1.35 ui-serif, Georgia, serif; }
  .rail-note i { display: block; margin-bottom: 6px; }
  @media (min-width: 841px) { .article-extras { display: none; } }

  .reader { min-width: 0; }
  .first-run {
    display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 16px; align-items: start;
    margin-bottom: 16px; padding: 16px 18px; border: 1px solid var(--line); border-radius: 16px;
    background: var(--accent-soft); color: var(--ink-soft); font-size: 13.5px;
  }
  .first-run[hidden] { display: none; }
  .first-run strong { display: block; margin-bottom: 3px; color: var(--accent-strong); }
  .first-run button { border: 0; background: transparent; color: var(--ink-soft); cursor: pointer; font-weight: 800; }
  .legend { color: var(--ink-soft); }
  article {
    scroll-margin-top: 24px; margin-bottom: 22px; padding: clamp(22px, 4vw, 38px);
    border: 1px solid var(--line); border-radius: 24px; background: var(--surface);
    box-shadow: var(--shadow-soft);
  }
  .n-head { display: grid; grid-template-columns: 42px minmax(0,1fr); gap: 13px; align-items: start; margin-bottom: 24px; }
  .n-idx {
    display: grid; place-items: center; width: 42px; height: 42px; border-radius: 13px;
    background: var(--accent-soft); color: var(--accent-strong); font: 800 13px/1 ui-monospace, monospace;
  }
  .n-head h2, .h-zh {
    padding-top: 3px;
    color: var(--ink);
    font: 750 clamp(21px, 3vw, 28px)/1.25 ui-serif, Georgia, "Noto Serif CJK SC", "Noto Serif SC", serif;
    letter-spacing: -.025em;
  }
  .h-zh { margin-top: 6px; padding-top: 0; }
  .para { display: flex; flex-direction: column; align-items: stretch; margin-bottom: 22px; }
  .para:last-child { margin-bottom: 8px; }
  .sent {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    width: 100%;
    min-width: 0;
    margin: 0 0 0.8em;
  }
  .sent[data-start] { cursor: pointer; }
  .de {
    max-width: 100%;
    font: var(--reader-size, 18.5px)/1.55 ui-serif, Georgia, "Noto Serif", serif;
    letter-spacing: .003em;
  }
  .de w {
    cursor: pointer; border-radius: 4px; transition: background .12s, color .12s;
    text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px;
    text-decoration-color: transparent;
  }
  .de w:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; background: var(--accent-soft); }
  .de w:hover, .de w:active { background: var(--warm-soft); text-decoration-color: var(--warm); }
  .de w.known { text-decoration-color: color-mix(in srgb, var(--accent) 55%, transparent); }
  .de w.ed { text-decoration-style: solid; text-decoration-thickness: 1.5px; }
  .de w.wiki { text-decoration-style: dotted; text-decoration-color: color-mix(in srgb, var(--ink-soft) 55%, transparent); }
  .de w.saved { color: var(--accent-strong); background: var(--accent-soft); text-decoration-color: transparent; }
  .sent.now .de {
    background: color-mix(in srgb, var(--accent-soft) 70%, transparent);
    border-radius: 4px;
  }
  .zh {
    margin-top: 3px;
    width: 100%;
    max-width: 100%;
    color: var(--ink);
    font: 400 15.5px/1.45 Inter, ui-sans-serif, "Noto Sans SC", sans-serif;
  }
  body.hide-zh .zh { display: none; }
  body.hide-zh .para { display: block; }
  body.hide-zh .sent { display: inline; width: auto; margin: 0 0.45em 0 0; }
  body.hide-zh .sent .de { display: inline; line-height: 1.82; }
  .n-head .h-zh {
    margin-top: 6px;
    padding-top: 0;
    color: var(--ink);
    font: 750 clamp(21px, 3vw, 28px)/1.25 ui-serif, Georgia, "Noto Serif CJK SC", "Noto Serif SC", serif;
    letter-spacing: -.025em;
  }
  .article-extras details { margin-top: 10px; border: 1px solid var(--line); border-radius: 13px; background: var(--surface-2); }
  .article-extras details summary {
    list-style: none; cursor: pointer; padding: 12px 14px; color: var(--ink-soft);
    display: flex; align-items: center; gap: 9px; font-size: 13px; font-weight: 750;
  }
  .article-extras details summary::before {
    content: "+"; display: inline-grid; place-items: center; width: 20px; height: 20px;
    border-radius: 7px; background: var(--surface); color: var(--accent); font-size: 14px;
  }
  .article-extras details[open] summary::before { content: "−"; }
  .article-extras details summary::-webkit-details-marker { display: none; }
  .article-extras details .body { padding: 2px 14px 15px 43px; color: var(--ink-soft); font-size: 13.5px; line-height: 1.75; }
  .article-extras details .body strong { color: var(--ink); }
  .vcard { display: grid; grid-template-columns: minmax(0,1fr) 28px; gap: 8px; align-items: start; padding: 10px 0; border-bottom: 1px dashed var(--line); }
  .vcard:last-child { border-bottom: 0; }
  .gcard { padding: 12px 0; border-bottom: 1px dashed var(--line); }
  .gcard:last-child { border-bottom: 0; }
  .vcard-top, .gcard h4 { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px; font: 750 14.5px/1.35 ui-serif, Georgia, serif; color: var(--ink); }
  .article-extras .vadd {
    width: 28px; height: 28px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--surface); color: var(--accent-strong); cursor: pointer;
    font: 700 18px/1 ui-sans-serif, system-ui;
  }
  .vpos { color: var(--ink-soft); font: 750 11px/1.2 ui-sans-serif, system-ui; letter-spacing: .06em; text-transform: uppercase; }
  .vzh { margin-top: 4px; color: var(--accent-strong); font-size: 13.5px; }
  .vex, .gex { margin-top: 6px; color: var(--ink-soft); font-size: 13px; font-style: italic; }
  .gexzh { color: var(--zh); font-size: 12.5px; }
  .gmore { margin-top: 8px; color: var(--ink-soft); font-size: 13px; }
  .bg-note { margin: 0 0 8px; color: var(--ink-soft); font-size: 12px; }

  .scrim { position: fixed; inset: 0; z-index: 55; display: none; background: rgba(7,16,18,.48); backdrop-filter: blur(3px); }
  .scrim.on { display: block; }
  #pop {
    position: fixed; z-index: 70; display: none; width: min(360px, calc(100vw - 24px));
    border: 1px solid var(--line); border-radius: 18px; padding: 18px;
    background: var(--surface); color: var(--ink); box-shadow: var(--shadow);
  }
  #pop.open { display: block; }
  .pop-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  #pop .pw { font: 750 21px/1.2 ui-serif, Georgia, serif; word-break: break-word; }
  #pop .pp { margin-top: 3px; color: var(--ink-soft); font-size: 11px; font-weight: 750; letter-spacing: .08em; text-transform: uppercase; }
  #pop .pclose { border: 0; background: var(--surface-2); color: var(--ink-soft); width: 30px; height: 30px; border-radius: 9px; cursor: pointer; }
  #pop .pz { margin-top: 12px; color: var(--accent-strong); font-weight: 700; }
  #pop .pz:empty::after { content: "还没有释义，你可以自己补充"; color: var(--ink-soft); font-weight: 400; }
  #pop .pe { margin-top: 9px; padding-top: 9px; border-top: 1px solid var(--line); color: var(--ink-soft); font-size: 12.5px; font-style: italic; }
  .pop-actions { display: flex; gap: 8px; margin-top: 14px; }
  .pbtn, .secondary-btn, .primary-btn {
    min-height: 40px; border-radius: 11px; padding: 0 13px; cursor: pointer; font-size: 13px; font-weight: 750;
  }
  .pbtn { flex: 1; border: 1px solid var(--accent); background: var(--accent); color: #fff; }
  .pbtn.in { border-color: var(--line); background: var(--surface-2); color: var(--ink-soft); }
  .secondary-btn { border: 1px solid var(--line); background: var(--surface); color: var(--ink-soft); }
  .primary-btn { border: 1px solid var(--accent); background: var(--accent); color: #fff; }
  .word-form { display: grid; gap: 11px; }
  .word-form label { display: grid; gap: 5px; color: var(--ink-soft); font-size: 12px; font-weight: 700; }
  .word-form input, .word-form textarea {
    width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px;
    background: var(--surface-2); color: var(--ink); resize: vertical;
  }
  .word-form textarea { min-height: 66px; }
  .form-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 3px; }

  #basket-btn {
    position: fixed; right: 22px; bottom: max(22px, env(safe-area-inset-bottom)); z-index: 45;
    display: inline-flex; align-items: center; gap: 9px; min-height: 48px; padding: 0 18px;
    border: 0; border-radius: 15px; background: var(--ink); color: var(--surface);
    box-shadow: var(--shadow); cursor: pointer; font-weight: 800;
  }
  #basket-btn .cnt { min-width: 23px; padding: 2px 7px; border-radius: 99px; background: var(--warm); color: #172127; font-size: 12px; }
  #basket {
    position: fixed; inset: 0 0 0 auto; z-index: 65; width: min(440px, 100vw);
    display: flex; flex-direction: column; padding: 24px 24px calc(24px + env(safe-area-inset-bottom));
    background: var(--surface); box-shadow: -20px 0 60px rgba(7,16,18,.18);
    transform: translateX(105%); transition: transform .22s ease;
  }
  #basket.open { transform: translateX(0); }
  #basket .bhead { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 16px; }
  #basket .bhead h3 { font-size: 22px; letter-spacing: -.02em; }
  #basket .bhead p { margin-top: 2px; color: var(--ink-soft); font-size: 12.5px; }
  #basket .bclose { border: 0; background: var(--surface-2); color: var(--ink-soft); width: 36px; height: 36px; border-radius: 11px; font-size: 20px; cursor: pointer; }
  .basket-add { width: 100%; margin-bottom: 12px; }
  #basket .blist { overflow-y: auto; flex: 1; padding-right: 4px; }
  .bitem { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 5px 10px; padding: 13px 0; border-bottom: 1px solid var(--line); }
  .bitem .bw { font: 750 16px/1.3 ui-serif, Georgia, serif; }
  .bitem .bz { grid-column: 1; color: var(--accent-strong); font-size: 13px; }
  .bitem .be { grid-column: 1; overflow: hidden; color: var(--ink-soft); font-size: 11.5px; text-overflow: ellipsis; white-space: nowrap; }
  .bitem-actions { grid-column: 2; grid-row: 1 / span 3; align-self: center; display: flex; gap: 3px; }
  .bitem-actions button { border: 0; background: transparent; color: var(--ink-soft); padding: 7px; cursor: pointer; font-size: 12px; }
  .bitem-actions .bx { color: var(--danger); }
  #basket .bfoot { display: flex; gap: 8px; margin-top: 14px; }
  #basket .bfoot button { flex: 1; }
  #basket .bfoot button:disabled { opacity: .5; cursor: wait; }
  #basket .bstatus { min-height: 18px; margin-top: 8px; color: var(--ink-soft); text-align: center; font-size: 12px; }
  .bempty { padding: 42px 14px; color: var(--ink-soft); text-align: center; font-size: 13px; }
  .bempty b { display: block; margin-bottom: 5px; color: var(--ink); font-size: 15px; }
  #word-editor {
    display: none; padding: 15px; margin-bottom: 12px; border: 1px solid var(--line);
    border-radius: 14px; background: var(--surface-2);
  }
  #word-editor.open { display: block; }
  #toast {
    position: fixed; left: 50%; bottom: 28px; z-index: 90; display: none;
    transform: translateX(-50%); padding: 10px 16px; border-radius: 12px;
    background: var(--ink); color: var(--surface); box-shadow: var(--shadow); font-size: 13px; font-weight: 700;
  }
  @media (max-width: 840px) {
    .app { width: min(100% - 28px, 720px); padding-top: 15px; padding-left: max(14px, env(safe-area-inset-left)); padding-right: max(14px, env(safe-area-inset-right)); }
    .topbar { margin-bottom: 24px; }
    .study-grid { display: block; }
    .side { position: static; max-height: none; margin-bottom: 18px; }
    .study-panel { display: contents; max-height: none; }
    .video-card { border-radius: 20px; box-shadow: var(--shadow); }
    .rail {
      position: sticky; top: env(safe-area-inset-top); z-index: 30; margin: 10px 0 18px; padding: 8px 12px;
      border-radius: 20px;
    }
    .rail-bar { padding: 0; }
    .topic-nav { display: none; }
    .video-card.floating {
      position: fixed; z-index: 48; top: 72px; right: 10px; left: auto; width: min(48vw, 210px);
      border: 1px solid rgba(255,255,255,.2); border-radius: 14px; box-shadow: 0 18px 45px rgba(0,0,0,.28);
    }
    .video-card.floating .video-drag { display: block; }
    .video-card.floating .video-float-close { display: block; position: absolute; z-index: 4; top: 6px; right: 6px; }
    .video-card.float-off { display: none; }
    article { border-radius: 20px; }
  }
  @media (max-width: 560px) {
    .app { width: 100%; padding: 12px 12px 88px; padding-left: max(12px, env(safe-area-inset-left)); padding-right: max(12px, env(safe-area-inset-right)); }
    .brand span:last-child { display: none; }
    .text-btn { padding: 0 10px; font-size: 12px; }
    .archive-link { width: 38px; padding: 0; font-size: 0; }
    .archive-link svg { width: 17px; }
    .hero { padding: 0 5px; margin-bottom: 18px; }
    .hero h1 { font-size: 30px; }

于关键基础设施的配套法规迟迟未出台，因此出现“有法无规、无法执行”的局面。"}, {"title": "Festnahme von zwei Verdächtigen nach versuchtem Brandanschlag in München", "title_zh": "慕尼黑纵火未遂案后两名嫌疑人被捕", "paras": [{"start": 160.0, "end": 188.96, "lines": [{"de": "Auch in München wurde in der Nacht offenbar ein Anschlag auf ein sicherheitspolitisch sensibles Ziel verübt, Schaden entstand kaum.", "zh": "夜里慕尼黑显然也发生了一起针对安全政治敏感目标的袭击，几乎没有造成损失。", "start": 160.0, "end": 168.76}, {"de": "An einer Baustelle wurde aus einem Auto heraus ein Brandsatz geworfen.", "zh": "在一个工地，有人从一辆汽车里向外投掷了燃烧装置。", "start": 168.92, "end": 173.4}, {"de": "In der Nähe ist ein Gebäude mit mehreren Rüstungsunternehmen.", "zh": "附近有一栋楼，里面有多家军工企业。", "start": 173.84, "end": 177.84}, {"de": "Die Polizei vermutet daher einen politischen Hintergrund.", "zh": "警方因此推测存在政治背景。", "start": 177.92, "end": 181.24}, {"de": "Sie nahm an einer Tankstelle zwei Verdächtige fest - eine Frau und einen Mann, beides bulgarische Staatsangehörige.", "zh": "她在一个加油站逮捕了两名嫌疑人——一名女子和一名男子，均为保加利亚公民。", "start": 181.32, "end": 188.96}]}], "vocab": [{"lemma": "die Festnahme, -n", "key": "festnahme", "forms": ["Festnahme"], "pos": "Substantiv", "zh": "逮捕", "example_de": "Sie nahm an einer Tankstelle zwei Verdächtige fest - eine Frau und einen Mann, beides bulgarische Staatsangehörige.", "example_zh": ""}, {"lemma": "der Verdächtige, -n", "key": "verdaechtige", "forms": ["Verdächtige"], "pos": "Substantiv", "zh": "嫌疑人", "example_de": "Sie nahm an einer Tankstelle zwei Verdächtige fest - eine Frau und einen Mann, beides bulgarische Staatsangehörige.", "example_zh": ""}, {"lemma": "der Brandsatz, -e", "key": "brandsatz", "forms": ["Brandsatz"], "pos": "Substantiv", "zh": "燃烧装置", "example_de": "An einer Baustelle wurde aus einem Auto heraus ein Brandsatz geworfen.", "example_zh": ""}, {"lemma": "das Rüstungsunternehmen, -", "key": "ruestungsunternehmen", "forms": ["Rüstungsunternehmen"], "pos": "Substantiv", "zh": "军工企业", "example_de": "In der Nähe ist ein Gebäude mit mehreren Rüstungsunternehmen.", "example_zh": ""}, {"lemma": "die Staatsangehörige, -n", "key": "staatsangehoerige", "forms": ["Staatsangehörige"], "pos": "Substantiv", "zh": "公民（女性）、国籍持有者", "example_de": "Sie nahm an einer Tankstelle zwei Verdächtige fest - eine Frau und einen Mann, beides bulgarische Staatsangehörige.", "example_zh": ""}, {"lemma": "verüben", "key": "verueben", "forms": ["verübt", "verüben"], "pos": "Verb", "zh": "实施（犯罪、袭击）", "example_de": "Auch in München wurde in der Nacht offenbar ein Anschlag auf ein sicherheitspolitisch sensibles Ziel verübt, Schaden entstand kaum.", "example_zh": ""}], "grammar_points": [{"title": "beides + 复数名词", "summary": "指前文提到的两个人/物时用 beides（两者都），后接复数名词表身份，beides bulgarische Staatsangehörige = 两人均为保加利亚公民。", "example_de": "Sie nahm an einer Tankstelle zwei Verdächtige fest - eine Frau und einen Mann, beides bulgarische Staatsangehörige.", "example_zh": "她在一个加油站逮捕了两名嫌疑人——一名女子和一名男子，均为保加利亚公民。"}], "background": "德国《刑法》第 306b 条对重大纵火（尤其针对关键设施或危及他人）量刑显著提高。袭击目标是军工企业聚集的建筑，警方推测有政治动机；嫌疑人持保加利亚国籍，是否由联邦总检察院以国家安全案件接手尚待评估。"}, {"title": "Prognosen für deutsche Konjunktur: Kieler Institut für Weltwirtschaft rechnet mit Wachstum", "title_zh": "德国经济展望：基尔世界经济研究所预计实现增长", "paras": [{"start": 190.24, "end": 219.48, "lines": [{"de": "Die Prognosen hellen sich auf für die deutsche Konjunktur.", "zh": "对德国经济的预测正在好转。", "start": 190.24, "end": 193.88}, {"de": "Einige Wirtschaftsforschungsinstitute haben ihre Erwartungen für 2026 deutlich erhöht.", "zh": "一些经济研究机构显著提高了他们对 2026 年的预期。", "start": 193.96, "end": 200.32}, {"de": "Das Kieler Institut für Weltwirtschaft rechnet nun mit einem Wachstum von 1,3 %.", "zh": "基尔世界经济研究所目前预计增长率为 1.3%。", "start": 200.4, "end": 207.8}, {"de": "Das ifo Institut in München erwartet ein Plus von 1,4 %.", "zh": "慕尼黑的 ifo 研究所预计增长 1.4%。", "start": 208.88, "end": 213.64}, {"de": "So viel, wie schon lange nicht mehr.", "zh": "这么高的数值已经很久没有出现过了。", "start": 213.72, "end": 216.48}, {"de": "Vor allem in der Industrie gebe es Lichtblicke.", "zh": "据说尤其工业领域出现了亮点。", "start": 216.56, "end": 219.48}]}, {"start": 219.6, "end": 267.12, "lines": [{"de": "Damit zu Markus Gürne, was sind die Gründe für das Wachstum?", "zh": "接下来交给马库斯·居尔纳：增长的原因是什么？", "start": 219.6, "end": 223.56}, {"de": "Investitionen des Staates machen den Löwenanteil aus.", "zh": "国家的投资占了最大份额。", "start": 224.72, "end": 228.24}, {"de": "Öffentliche Gelder in großem Stil werden in Infrastruktur wie Schiene, Straße, Brücken, Klimaschutz und Bundeswehr ausgegeben.", "zh": "大规模的公共资金正被投入到铁路、公路、桥梁、气候保护和联邦国防军等基础设施中。", "start": 229.4, "end": 237.72}, {"de": "Der wichtige europäische Binnenmarkt hat zudem mehr Nachfrage erzeugt, Unternehmen konnten mehr in Europa verkaufen.", "zh": "此外，重要的欧洲统一大市场创造了更多需求，企业得以在欧洲卖得更多。", "start": 237.8, "end": 245.76}, {"de": "Bemerkenswert ist, dass Chemie und Pharma von der Krise im Nahen Osten profitieren konnten.", "zh": "值得注意的是，化工和制药行业能从近东的危机中获益。", "start": 246.04, "end": 253.52}, {"de": "Die Krise rund um die Straße von Hormus ist nicht gelöst.", "zh": "围绕霍尔木兹海峡的危机尚未解决。", "start": 253.88, "end": 257.4}, {"de": "Viele Konkurrenten fallen wegen Rohstoffmangel und gerissener Lieferketten aus.", "zh": "许多竞争对手因原材料短缺和断裂的供应链而退出。", "start": 257.6, "end": 262.56}, {"de": "Deutsche Chemieunternehmen konnten liefern und erlebten ein Nachfrageplus.", "zh": "德国化工企业能够供货，并经历了需求的增长。", "start": 262.64, "end": 267.12}]}, {"start": 267.52, "end": 302.68, "lines": [{"de": "Stichwort Straße von Hormus - warum hat sich die Ölkrise nicht stärker ausgewirkt?", "zh": "说到霍尔木兹海峡——为什么这场石油危机没有造成更强的影响？", "start": 267.52, "end": 273.8}, {"de": "Die erneuerbaren Energien konnten zu einem großen Teil den Ausfall fossiler Rohstoffe abfedern.", "zh": "可再生能源能够在很大程度上缓冲化石原材料的缺口。", "start": 274.76, "end": 282.08}, {"de": "Zusätzlich haben viele Länder, auch Deutschland, strategische Reserven von Öl und Gas freigegeben.", "zh": "此外，包括德国在内的许多国家释放了石油和天然气的战略储备。", "start": 282.16, "end": 287.96}, {"de": "Schnell hatten viele Unternehmen die Nachfrage nach Öl gedrosselt.", "zh": "许多企业很快就压缩了对石油的需求。", "start": 288.08, "end": 292.0}, {"de": "Unter dem Strich erwies sich die deutsche Industrie als recht widerstandsfähig.", "zh": "总的来说，德国工业显示出相当的抗冲击能力。", "start": 292.08, "end": 298.16}, {"de": "Das zeigt sich in diesem Wachstum.", "zh": "这体现在这次的增长中。", "start": 298.24, "end": 300.92}, {"de": "Vielen Dank.", "zh": "非常感谢。", "start": 301.28, "end": 302.68}]}], "vocab": [{"lemma": "die Prognose, -n", "key": "prognose", "forms": ["Prognosen", "Prognose"], "pos": "Substantiv", "zh": "预测", "example_de": "Die Prognosen hellen sich auf für die deutsche Konjunktur.", "example_zh": ""}, {"lemma": "die Konjunktur", "key": "konjunktur", "forms": ["Konjunktur"], "pos": "Substantiv", "zh": "经济景气", "example_de": "Die Prognosen hellen sich auf für die deutsche Konjunktur.", "example_zh": ""}, {"lemma": "mit etwas rechnen", "key": "mit-etwas-rechnen", "forms": ["rechnet nun mit einem Wachstum", "mit etwas rechnen"], "pos": "Redewendung", "zh": "预计、料想会有", "example_de": "Das Kieler Institut für Weltwirtschaft rechnet nun mit einem Wachstum von 1,3 %.", "example_zh": ""}, {"lemma": "der Lichtblick, -e", "key": "lichtblick", "forms": ["Lichtblicke", "Lichtblick"], "pos": "Substantiv", "zh": "亮点、一线希望", "example_de": "Vor allem in der Industrie gebe es Lichtblicke.", "example_zh": ""}, {"lemma": "der Löwenanteil", "key": "loewenanteil", "forms": ["Löwenanteil"], "pos": "Substantiv", "zh": "最大份额", "example_de": "Investitionen des Staates machen den Löwenanteil aus.", "example_zh": ""}, {"lemma": "der Binnenmarkt, -märkte", "key": "binnenmarkt", "forms": ["Binnenmarkt"], "pos": "Substantiv", "zh": "内部市场、统一市场", "example_de": "Der wichtige europäische Binnenmarkt hat zudem mehr Nachfrage erzeugt, Unternehmen konnten mehr in Europa verkaufen.", "example_zh": ""}, {"lemma": "die Lieferkette, -n", "key": "lieferkette", "forms": ["Lieferketten", "Lieferkette"], "pos": "Substantiv", "zh": "供应链", "example_de": "Viele Konkurrenten fallen wegen Rohstoffmangel und gerissener Lieferketten aus.", "example_zh": ""}, {"lemma": "abfedern", "key": "abfedern", "forms": ["abfedern"], "pos": "Verb", "zh": "缓冲、减轻冲击", "example_de": "Die erneuerbaren Energien konnten zu einem großen Teil den Ausfall fossiler Rohstoffe abfedern.", "example_zh": ""}, {"lemma": "widerstandsfähig", "key": "widerstandsfaehig", "forms": ["widerstandsfähig"], "pos": "Adjektiv", "zh": "有抵抗力的、抗冲击的", "example_de": "Unter dem Strich erwies sich die deutsche Industrie als recht widerstandsfähig.", "example_zh": ""}, {"lemma": "der Rohstoffmangel", "key": "rohstoffmangel", "forms": ["Rohstoffmangel"], "pos": "Substantiv", "zh": "原材料短缺", "example_de": "Viele Konkurrenten fallen wegen Rohstoffmangel und gerissener Lieferketten aus.", "example_zh": ""}], "grammar_points": [{"title": "Konjunktiv I 转述：gebe", "summary": "转述研究结论用第一虚拟式（es gebe Lichtblicke），标明这是他人观点而非主播断言，新闻德语极常见。", "example_de": "Vor allem in der Industrie gebe es Lichtblicke.", "example_zh": "据说尤其工业领域出现了亮点。"}, {"title": "den Löwenanteil ausmachen", "summary": "可分动词 ausmachen 在“构成、占据”义下与份额搭配（einen Anteil ausmachen），注意与“关闭”义区分。", "example_de": "Investitionen des Staates machen den Löwenanteil aus.", "example_zh": "国家的投资占了最大份额。"}], "background": "基尔世界经济研究所（IfW Kiel）与慕尼黑 ifo 研究所是德国主要经济预测机构。本轮上调主要受惠于联邦基础设施特别基金对铁路、公路、桥梁及国防的大规模投入。本期 synopsis 中的 Die Börse（股市行情）板块在这场播报中没有独立口播内容，被主播并入经济报道，故不单列。"}, {"title": "Russland verordnet Schließung der Goethe-Institute", "title_zh": "俄罗斯下令关闭歌德学院", "paras": [{"start": 303.96, "end": 323.88, "lines": [{"de": "Der Drohnen-Vorfall am Flughafen Leipzig belastet das Verhältnis zwischen Deutschland und Moskau.", "zh": "莱比锡机场的无人机事件给德国与莫斯科的关系蒙上阴影。", "start": 303.96, "end": 310.0}, {"de": "Außenminister Wadephul kündigte an, das Russische Haus in Berlin und das Generalkonsulat in Bonn zu schließen.", "zh": "外长瓦德普尔宣布，将关闭柏林的俄罗斯之家和驻波恩的总领事馆。", "start": 310.08, "end": 317.4}, {"de": "Nun verfügte Russland das für die Goethe-Institute in Moskau, Sankt Petersburg und Nowosibirsk.", "zh": "如今俄罗斯下令对莫斯科、圣彼得堡和新西伯利亚的歌德学院采取同样措施。", "start": 317.48, "end": 323.88}]}, {"start": 324.04, "end": 335.64, "lines": [{"de": "Die Präsidentin des Goethe-Instituts, Joost, sagte: Das markiere das Ende einer Ära deutsch-russischer Kulturbeziehungen.", "zh": "歌德学院院长约斯特说：这标志着德俄文化关系一个时代的终结。", "start": 324.04, "end": 331.64}, {"de": "Es sei eine schlechte Nachricht für die Menschen in Russland.", "zh": "这对俄罗斯民众来说是个坏消息。", "start": 331.84, "end": 335.64}]}], "vocab": [{"lemma": "verordnen", "key": "verordnen", "forms": ["verordnet", "verordnen"], "pos": "Verb", "zh": "下令、强制规定", "example_de": "Außenminister Wadephul kündigte an, das Russische Haus in Berlin und das Generalkonsulat in Bonn zu schließen.", "example_zh": ""}, {"lemma": "die Schließung, -en", "key": "schliessung", "forms": ["Schließung"], "pos": "Substantiv", "zh": "关闭", "example_de": "Außenminister Wadephul kündigte an, das Russische Haus in Berlin und das Generalkonsulat in Bonn zu schließen.", "example_zh": ""}, {"lemma": "der Vorfall, -e", "key": "vorfall", "forms": ["Drohnen-Vorfall", "Vorfall"], "pos": "Substantiv", "zh": "事件、变故", "example_de": "Der Drohnen-Vorfall am Flughafen Leipzig belastet das Verhältnis zwischen Deutschland und Moskau.", "example_zh": ""}, {"lemma": "das Verhältnis, -se", "key": "verhaeltnis", "forms": ["Verhältnis"], "pos": "Substantiv", "zh": "关系", "example_de": "Der Drohnen-Vorfall am Flughafen Leipzig belastet das Verhältnis zwischen Deutschland und Moskau.", "example_zh": ""}, {"lemma": "das Generalkonsulat, -e", "key": "generalkonsulat", "forms": ["Generalkonsulat"], "pos": "Substantiv", "zh": "总领事馆", "example_de": "Außenminister Wadephul kündigte an, das Russische Haus in Berlin und das Generalkonsulat in Bonn zu schließen.", "example_zh": ""}, {"lemma": "verfügen", "key": "verfuegen", "forms": ["verfügte", "verfügen"], "pos": "Verb", "zh": "下令、裁决", "example_de": "Nun verfügte Russland das für die Goethe-Institute in Moskau, Sankt Petersburg und Nowosibirsk.", "example_zh": ""}, {"lemma": "die Ära, -en", "key": "aera", "forms": ["Ära"], "pos": "Substantiv", "zh": "时代、纪元", "example_de": "Die Präsidentin des Goethe-Instituts, Joost, sagte: Das markiere das Ende einer Ära deutsch-russischer Kulturbeziehungen.", "example_zh": ""}], "grammar_points": [{"title": "Konjunktiv I 转述：markiere / sei", "summary": "转述他人言论用第一虚拟式（Das markiere …, Es sei …），新闻中标明这是引述而非事实断言。", "example_de": "Das markiere das Ende einer Ära deutsch-russischer Kulturbeziehungen. Es sei eine schlechte Nachricht für die Menschen in Russland.", "example_zh": "这标志着德俄文化关系一个时代的终结。这对俄罗斯民众来说是个坏消息。"}], "background": "歌德学院是德国官方文化机构，在全球推广德语与文化交流。俄罗斯此前已将其列入“不受欢迎组织”，活动基本停摆，本次正式下令关闭是德俄文化机构互相关闭的延续：德国因莱比锡机场无人机侵入事件宣布关闭俄罗斯之家与驻波恩总领事馆，俄方随即对等反制。"}, {"title": "Flucht ukrainischer Männer vor Rekrutierung", "title_zh": "乌克兰男性为躲避征兵而出逃", "paras": [{"start": 338.4, "end": 351.08, "lines": [{"de": "Russlands Armee hat in der Nacht ihre Angriffe auf die Ukraine fortgesetzt.", "zh": "俄军夜间继续了对乌克兰的攻击。", "start": 338.4, "end": 343.48}, {"de": "Nahe Kiew wurde ein großes Medikamentenlager zerstört.", "zh": "基辅附近一座大型药品仓库被摧毁。", "start": 343.6, "end": 346.8}, {"de": "In Odessa wurden bei einem Luftangriff mindestens 17 Menschen verletzt.", "zh": "敖德萨一次空袭中至少 17 人受伤。", "start": 346.88, "end": 351.08}]}, {"start": 351.16, "end": 572.0, "lines": [{"de": "Die Ukraine verteidigt sich jetzt im fünften Jahr gegen die Invasion.", "zh": "乌克兰抵御入侵已进入第五个年头。", "start": 351.16, "end": 355.52}, {"de": "Um sich der Einberufung zu entziehen, versuchen Männer immer wieder, das Land unerlaubt zu verlassen.", "zh": "为了躲避征召，男性一次次尝试非法离境。", "start": 355.6, "end": 362.68}, {"de": "Nur 600 Meter sind es nach Rumänien und damit in die EU.", "zh": "到罗马尼亚、也就是到欧盟，只有 600 米。", "start": 364.04, "end": 368.6}, {"de": "Immer wieder versuchen ukrainische Männer, über die Donau das Land zu verlassen.", "zh": "乌克兰男性一再尝试经多瑙河离开这个国家。", "start": 368.68, "end": 373.68}, {"de": "Manchmal tun sie einem leid, aber Verstöße sind Verstöße.", "zh": "“有时候让人同情，但违规就是违规。", "start": 374.68, "end": 379.36}, {"de": "Meist seien es Männer zwischen 30 und 40, die dem Militärdienst entkommen wollen.", "zh": "”据说大多数是 30 到 40 岁、想逃离兵役的男性。", "start": 380.56, "end": 385.64}, {"de": "Manche kommen mit Neoprenanzug und Flossen.", "zh": "有些人穿着氯丁胶衣、戴着脚蹼前来。", "start": 385.72, "end": 390.24}, {"de": "Es ist gefährlich.", "zh": "这很危险。", "start": 569.36, "end": 572.0}, {"de": "Im März waren zwei Leute am Schwimmen.", "zh": "“三月有两个人在游泳。", "start": null, "end": null}, {"de": "Einer begann zu ertrinken.", "zh": "一个开始溺水。", "start": null, "end": null}, {"de": "Wir haben ihn herausgeholt.", "zh": "我们把他救了上来。", "start": null, "end": null}, {"de": "Der zweite ist in der Zwischenzeit geflohen.", "zh": "另一个在此期间逃走了。”", "start": null, "end": null}]}, {"start": null, "end": null, "lines": [{"de": "Einen Mann, der die Ukraine unerlaubt verlassen wird, habe ich vor drei Jahren an der Front kennengelernt.", "zh": "“一个将要非法离开乌克兰的人，我三年前在前线就认识了。", "start": null, "end": null}, {"de": "Dort schnitt Wolodymyr Kornejew freiwillig Soldaten die Haare.", "zh": "”在那里沃洛德米尔·科尔涅耶夫自愿为士兵理发。", "start": null, "end": null}, {"de": "So ein Haarschnitt ist wie eine Therapie, das ist sehr wichtig.", "zh": "“这样一个发型就像一种治疗，这非常重要。", "start": null, "end": null}, {"de": "Drei Jahre später schneidet Wolodymyr noch immer Haare.", "zh": "”三年后，沃洛德米尔依然在理发。", "start": null, "end": null}, {"de": "Der Ort ist ein anderer: Warschau.", "zh": "地点变了：华沙。", "start": null, "end": null}, {"de": "Er hat die Ukraine verlassen.", "zh": "他离开了乌克兰。", "start": null, "end": null}, {"de": "Wenn du in die Armee kommst, gehörst du nicht mehr dir.", "zh": "“如果你进了军队，你就不再属于你自己。", "start": null, "end": null}, {"de": "Vor diesem Gefühl habe ich Angst.", "zh": "我害怕的就是这种感觉。", "start": null, "end": null}, {"de": "2025 wird er eingezogen, erzählt Wolodymyr.", "zh": "”沃洛德米尔说，2025 年他被征召。", "start": null, "end": null}, {"de": "Nach 30 Tagen flieht er von einem Ausbildungsgelände.", "zh": "30 天后他从一处训练场逃走。", "start": null, "end": null}, {"de": "Später verlässt er die Ukraine über Rumänien.", "zh": "后来经罗马尼亚离开乌克兰。", "start": null, "end": null}, {"de": "Wer die Ukraine illegal verlässt, dem drohen Konsequenzen bei Wiedereinreise: Geldstrafen, Haft, Einsätze an der Front.", "zh": "非法离境者再次入境时将面临后果：罚款、监禁、被派上前线。", "start": null, "end": null}, {"de": "Wer bleibt, wer geht, wer kämpft: Für die Ukraine ist das Teil der Verteidigung geworden.", "zh": "谁留下，谁离开，谁战斗：对乌克兰来说，这已成为防御的一部分。", "start": null, "end": null}]}], "vocab": [{"lemma": "die Rekrutierung, -en", "key": "rekrutierung", "forms": ["Rekrutierung"], "pos": "Substantiv", "zh": "征兵、招募", "example_de": "Die Ukraine verteidigt sich jetzt im fünften Jahr gegen die Invasion.", "example_zh": ""}, {"lemma": "die Einberufung, -en", "key": "einberufung", "forms": ["Einberufung"], "pos": "Substantiv", "zh": "征召入伍", "example_de": "Um sich der Einberufung zu entziehen, versuchen Männer immer wieder, das Land unerlaubt zu verlassen.", "example_zh": ""}, {"lemma": "sich entziehen", "key": "sich-entziehen", "forms": ["entziehen", "sich entziehen"], "pos": "Verb", "zh": "逃避、摆脱（支配第三格）", "example_de": "Um sich der Einberufung zu entziehen, versuchen Männer immer wieder, das Land unerlaubt zu verlassen.", "example_zh": ""}, {"lemma": "unerlaubt", "key": "unerlaubt", "forms": ["unerlaubt"], "pos": "Adjektiv", "zh": "未经许可的、非法的", "example_de": "Um sich der Einberufung zu entziehen, versuchen Männer immer wieder, das Land unerlaubt zu verlassen.", "example_zh": ""}, {"lemma": "die Geldstrafe, -n", "key": "geldstrafe", "forms": ["Geldstrafen", "Geldstrafe"], "pos": "Substantiv", "zh": "罚款", "example_de": "Wer die Ukraine illegal verlässt, dem drohen Konsequenzen bei Wiedereinreise: Geldstrafen, Haft, Einsätze an der Front.", "example_zh": ""}, {"lemma": "die Haft", "key": "haft", "forms": ["Haft"], "pos": "Substantiv", "zh": "监禁", "example_de": "Wer die Ukraine illegal verlässt, dem drohen Konsequenzen bei Wiedereinreise: Geldstrafen, Haft, Einsätze an der Front.", "example_zh": ""}, {"lemma": "die Wiedereinreise, -n", "key": "wiedereinreise", "forms": ["Wiedereinreise"], "pos": "Substantiv", "zh": "再次入境", "example_de": "Wer die Ukraine illegal verlässt, dem drohen Konsequenzen bei Wiedereinreise: Geldstrafen, Haft, Einsätze an der Front.", "example_zh": ""}, {"lemma": "ertrinken", "key": "ertrinken", "forms": ["ertrinken"], "pos": "Verb", "zh": "溺水", "example_de": "Einer begann zu ertrinken.", "example_zh": ""}, {"lemma": "der Neoprenanzug, -e", "key": "neoprenanzug", "forms": ["Neoprenanzug"], "pos": "Substantiv", "zh": "氯丁橡胶潜水衣", "example_de": "Manche kommen mit Neoprenanzug und Flossen.", "example_zh": ""}, {"lemma": "der Einsatz, -e", "key": "einsatz", "forms": ["Einsätze", "Einsatz"], "pos": "Substantiv", "zh": "行动、任务（此处指前线作战）", "example_de": "Wer die Ukraine illegal verlässt, dem drohen Konsequenzen bei Wiedereinreise: Geldstrafen, Haft, Einsätze an der Front.", "example_zh": ""}], "grammar_points": [{"title": "um … zu + 不定式（目的）", "summary": "um sich der Einberufung zu entziehen 表示目的“为了逃避征召”；注意 sich entziehen 支配第三格（der Einberufung）。", "example_de": "Um sich der Einberufung zu entziehen, versuchen Männer immer wieder, das Land unerlaubt zu verlassen.", "example_zh": "为了躲避征召，男性一次次尝试非法离境。"}, {"title": "wer …, dem … 关联从句", "summary": "wer 从句作主语，主句用 dem（第三格）回指：wer die Ukraine illegal verlässt, dem drohen Konsequenzen。", "example_de": "Wer die Ukraine illegal verlässt, dem drohen Konsequenzen bei Wiedereinreise: Geldstrafen, Haft, Einsätze an der Front.", "example_zh": "非法离境者再次入境时将面临后果：罚款、监禁、被派上前线。"}], "background": "2022 年俄军全面入侵后乌克兰颁布戒严令，18–60 岁男性普遍禁止离境；2024 年征兵年龄下限降至 25 岁。多瑙河对岸即欧盟成员国罗马尼亚，成为非法越境的主要路线，边防部门报告过多次抓捕与溺水事故。"}, {"title": "Landesweite Proteste in Spanien wegen Migrationskrise in Ceuta", "title_zh": "塞乌特移民危机引发西班牙全国抗议", "paras": [{"start": null, "end": null, "lines": [{"de": "Vor gut einem Monat waren mehr als 70.000 Menschen über Marokko in die spanische Exklave Ceuta gekommen.", "zh": "一个多月前，超过 70000 人经由摩洛哥进入西班牙飞地塞乌特。", "start": null, "end": null}, {"de": "Etwa 5000 sollen sich immer noch dort aufhalten.", "zh": "据说仍有约 5000 人留在那里。", "start": null, "end": null}, {"de": "Die spanische Regierung steht deshalb in der Kritik.", "zh": "西班牙政府因此受到批评。", "start": null, "end": null}, {"de": "Gestern gab es landesweite Proteste.", "zh": "昨天爆发了全国性抗议。", "start": null, "end": null}, {"de": "Teilnehmer warfen Ministerpräsident Sanchez mangelnde Hilfe vor sowie eine Beschwichtigungspolitik mit Blick auf Marokko.", "zh": "参与者指责首相桑切斯援助不力，以及对摩洛哥采取安抚政策。", "start": null, "end": null}, {"de": "Sanchez wies das heute im Parlament zurück.", "zh": "桑切斯今天在议会驳斥了这些指责。", "start": null, "end": null}]}, {"start": null, "end": null, "lines": [{"de": "Noch immer hoffen in Ceuta Tausende Migranten auf Asyl.", "zh": "在塞乌特，仍有数千移民希望获得庇护。", "start": null, "end": null}, {"de": "Viele leben am Strand.", "zh": "很多人露宿海滩。", "start": null, "end": null}, {"de": "Vor fünf Wochen sind sie aus Marokko in das kleine Stück spanisches Staatsgebiet geflüchtet.", "zh": "五周前他们从摩洛哥逃入这小块西班牙领土。", "start": null, "end": null}, {"de": "Gestern protestieren rund 50.000 Menschen in Madrid: Irrregulär Eingereiste sollten ins Gefängnis und Sanchez zurücktreten, er bekomme die Krise nicht in den Griff.", "zh": "昨天约 50000 人在马德里抗议：非法入境者应该被关进监狱，桑切斯应该下台，他控制不住这场危机。", "start": null, "end": null}, {"de": "\"Ceuta ist in Gefahr\", steht auf diesem Schild.", "zh": "“塞乌特处于危险之中”，这块牌子上写着。", "start": null, "end": null}]}, {"start": 572.08, "end": 598.44, "lines": [{"de": "Sanchez bleibt im Parlament vage, wie es zum Ansturm der 70.000 Menschen kommen konnte.", "zh": "对于 70000 人何以蜂拥而至，桑切斯在议会上语焉不详。", "start": null, "end": null}, {"de": "Die Gründe für das, was in Ceuta passiert ist, sind komplex.", "zh": "“塞乌特所发生之事的原因是复杂的。", "start": null, "end": null}, {"de": "Wir leben in einer Zeit, wo es viele Akteure mit unterschiedlichen geopolitischen Interessen gibt.", "zh": "我们生活在一个有许多持不同地缘政治利益的行为体的时代。", "start": null, "end": null}, {"de": "Viele Demonstranten meinen: Marokko sei mitverantwortlich.", "zh": "”许多示威者认为：摩洛哥负有连带责任。", "start": null, "end": null}, {"de": "Es habe den Ansturm unterstützt, zumindest aber nicht gestoppt.", "zh": "它支持了这次蜂拥，至少没有加以阻止。", "start": null, "end": null}, {"de": "Es wäre nicht das erste Mal, dass Marokko Migranten einsetzt, um Interessen durchzusetzen.", "zh": "“这不是摩洛哥第一次利用移民来推行自己的利益。", "start": null, "end": null}, {"de": "Nimmt die Regierung eine härtere Haltung ein, erklärt Marokko: Es ist für die Migranten nicht verantwortlich.", "zh": "”如果政府采取更强硬立场，摩洛哥就宣称：它对移民不承担责任。", "start": null, "end": null}, {"de": "Sie könnten nicht zurückgeführt werden.", "zh": "他们无法被遣返。", "start": 572.08, "end": 574.32}, {"de": "Die Regierung steckt in einer Falle.", "zh": "政府陷入了困境。", "start": 574.4, "end": 576.72}, {"de": "Ein weiteres Dilemma kommt dazu: Sanchez hat zu lange gezögert, den nationalen Notstand auszurufen und um EU-Hilfe zu bitten.", "zh": "还有一层两难：桑切斯太久迟迟未宣布国家紧急状态并请求欧盟援助。", "start": 577.04, "end": 588.8}, {"de": "Jetzt wendet sich seine Regierung an die EU.", "zh": "现在他的政府转向欧盟求助。", "start": 588.88, "end": 591.8}, {"de": "Aus Brüssel heißt es: Man habe zunächst wichtige Fragen an Madrid.", "zh": "布鲁塞尔方面表示：首先对马德里有一些重要问题。", "start": 591.88, "end": 596.08}, {"de": "Welche, macht Brüssel nicht öffentlich.", "zh": "是哪些问题，布鲁塞尔不予公开。", "start": 596.12, "end": 598.44}]}], "vocab": [{"lemma": "die Exklave, -n", "key": "exklave", "forms": ["Exklave"], "pos": "Substantiv", "zh": "飞地", "example_de": "Vor gut einem Monat waren mehr als 70.000 Menschen über Marokko in die spanische Exklave Ceuta gekommen.", "example_zh": ""}, {"lemma": "die Migrationskrise, -n", "key": "migrationskrise", "forms": ["Migrationskrise"], "pos": "Substantiv", "zh": "移民危机", "example_de": "Die spanische Regierung steht deshalb in der Kritik.", "example_zh": ""}, {"lemma": "jemandem etwas vorwerfen", "key": "vorwerfen", "forms": ["warfen ... vor", "jemandem etwas vorwerfen"], "pos": "Verb", "zh": "指责某人某事", "example_de": "Teilnehmer warfen Ministerpräsident Sanchez mangelnde Hilfe vor sowie eine Beschwichtigungspolitik mit Blick auf Marokko.", "example_zh": ""}, {"lemma": "die Beschwichtigungspolitik", "key": "beschwichtigungspolitik", "forms": ["Beschwichtigungspolitik"], "pos": "Substantiv", "zh": "安抚政策", "example_de": "Teilnehmer warfen Ministerpräsident Sanchez mangelnde Hilfe vor sowie eine Beschwichtigungspolitik mit Blick auf Marokko.", "example_zh": ""}, {"lemma": "das Asyl", "key": "asyl", "forms": ["Asyl"], "pos": "Substantiv", "zh": "庇护", "example_de": "Noch immer hoffen in Ceuta Tausende Migranten auf Asyl.", "example_zh": ""}, {"lemma": "in der Kritik stehen", "key": "in-der-kritik-stehen", "forms": ["steht in der Kritik", "in der Kritik stehen"], "pos": "Redewendung", "zh": "受到批评", "example_de": "Die spanische Regierung steht deshalb in der Kritik.", "example_zh": ""}, {"lemma": "der Ansturm, -e", "key": "ansturm", "forms": ["Ansturm"], "pos": "Substantiv", "zh": "蜂拥而至", "example_de": "Sanchez bleibt im Parlament vage, wie es zum Ansturm der 70.000 Menschen kommen konnte.", "example_zh": ""}, {"lemma": "der Notstand, -e", "key": "notstand", "forms": ["Notstand"], "pos": "Substantiv", "zh": "紧急状态", "example_de": "Ein weiteres Dilemma kommt dazu: Sanchez hat zu lange gezögert, den nationalen Notstand auszurufen und um EU-Hilfe zu bitten.", "example_zh": ""}, {"lemma": "zurücktreten", "key": "zuruecktreten", "forms": ["zurücktreten"], "pos": "Verb", "zh": "辞职、下台", "example_de": "Gestern protestieren rund 50.000 Menschen in Madrid: Irrregulär Eingereiste sollten ins Gefängnis und Sanchez zurücktreten, er bekomme die Krise nicht in den Griff. \"Ceuta ist in Gefahr\", steht auf diesem Schild.", "example_zh": ""}, {"lemma": "in den Griff bekommen", "key": "in-den-griff-bekommen", "forms": ["bekomme die Krise nicht in den Griff", "in den Griff bekommen"], "pos": "Redewendung", "zh": "控制住", "example_de": "Gestern protestieren rund 50.000 Menschen in Madrid: Irrregulär Eingereiste sollten ins Gefängnis und Sanchez zurücktreten, er bekomme die Krise nicht in den Griff. \"Ceuta ist in Gefahr\", steht auf diesem Schild.", "example_zh": ""}], "grammar_points": [{"title": "sein + 过去分词表位移完成", "summary": "flüchten 这类位移动词完成时用 sein：sind … geflüchtet，描述已发生的迁徙结果。", "example_de": "Vor fünf Wochen sind sie aus Marokko in das kleine Stück spanisches Staatsgebiet geflüchtet.", "example_zh": "五周前他们从摩洛哥逃入这小块西班牙领土。"}], "background": "Ceuta 与 Melilla 是西班牙位于北非的两块飞地，与摩洛哥接壤，是非洲移民进入欧盟的热点通道。2026 年 7 月底约 7 万人突破摩洛哥一侧进入 Ceuta，酿成欧洲近年最严重的移民危机之一，马德里多次指责拉巴特故意放行以施加压力。"}, {"title": "UN warnt vor außergewöhnlich stark ausgeprägtem Klimaphänomen El Niño", "title_zh": "联合国警告异常强烈的厄尔尼诺气候现象", "paras": [{"start": 599.4, "end": 622.4, "lines": [{"de": "Überschwemmungen, Dürre und extreme Hitze machen den Menschen weltweit zu schaffen.", "zh": "洪水、干旱和极端高温让世界各地的人们苦不堪言。", "start": 599.4, "end": 604.36}, {"de": "Die UN-Wetterorganisation warnt: Solche Extreme könnten in den kommenden Monaten zunehmen.", "zh": "联合国气象组织警告：这类极端天气未来几个月可能加剧。", "start": 604.44, "end": 609.88}, {"de": "Grund dafür sei ein ungewöhnlich starker El Nino, der sich derzeit im Pazifik aufbaue.", "zh": "原因据称是一个异常强烈的厄尔尼诺，目前正在太平洋上形成。", "start": 609.96, "end": 616.16}, {"de": "Das Klimaphänomen beeinflusst Meeresströmungen und heizt die Ozeane zusätzlich auf.", "zh": "这一气候现象影响洋流，并使海洋进一步升温。", "start": 616.24, "end": 622.4}]}, {"start": 622.72, "end": 742.8, "lines": [{"de": "El Nino ist nicht durch den Klimawandel verursacht, kann dessen Folgen aber verschärfen - wie 2024 in Brasilien.", "zh": "厄尔尼诺不是由气候变化引起的，但它会加剧气候变化的后果——比如 2024 年在巴西。", "start": 622.72, "end": 631.0}, {"de": "Das war einmal das Bad von Christiane Alves, daneben die Küche.", "zh": "“这曾是克里斯蒂亚妮·阿尔维斯家的浴室，旁边是厨房。", "start": 632.84, "end": 637.0}, {"de": "Ein tristes Zeugnis der Unwetterkatastrophe, die hier vor zwei Jahren alles verwüstet hat.", "zh": "”这场天灾两年前在这里摧毁了一切，只留下凄凉的痕迹。", "start": 637.12, "end": 642.88}, {"de": "Und jetzt droht El Nino, neues Unglück zu bringen.", "zh": "而现在厄尔尼诺可能带来新的灾难。", "start": 642.96, "end": 646.12}, {"de": "Wir haben Angst, was in den nächsten Monaten auf uns zukommt.", "zh": "“我们害怕未来几个月会遭遇什么。", "start": 647.6, "end": 651.52}, {"de": "Mit Stürmen von bis zu 100 km/h, und hier oben ist das noch heftiger.", "zh": "风暴时速可达 100 公里，在这高处还要更猛烈。", "start": 651.6, "end": 656.24}, {"de": "Vor zwei Jahren brachte El Nino eine Sturmflut.", "zh": "”两年前厄尔尼诺带来了一场风暴潮。", "start": 658.24, "end": 661.48}, {"de": "Die Stadt Porto Alegre und große Teile Südbrasiliens: Wochenlang unter Wasser.", "zh": "阿雷格里港和巴西南部大片地区：数周泡在水下。", "start": 661.92, "end": 666.88}, {"de": "Mindestens 180 Menschen starben, 600.000 wurden obdachlos.", "zh": "至少 180 人丧生，60 万人无家可归。", "start": 667.28, "end": 671.64}, {"de": "Und die Region bleibt Risikogebiet.", "zh": "而该地区仍是风险区。", "start": 672.08, "end": 674.6}, {"de": "Der Zivilschutz: schon jetzt in Alarmbereitschaft.", "zh": "民防部门：现已处于警戒状态。", "start": 674.68, "end": 678.16}, {"de": "Wir wissen, dass es zu starken Regenfällen kommt.", "zh": "“我们知道会出现强降雨。", "start": 678.64, "end": 681.56}, {"de": "Wir sind in der Regenzeit, es gibt schon Überschwemmungen, mit El Nino wird das noch stärker.", "zh": "我们正处在雨季，已经发生洪水，厄尔尼诺会让情况更严重。", "start": 681.68, "end": 687.36}, {"de": "Doch die Stadt sei heute besser vorbereitet.", "zh": "”但据说这座城市如今准备得更充分了。", "start": 687.72, "end": 690.44}, {"de": "Der Zivilschutz wurde aufgestockt, das Frühwarnsystem modernisiert.", "zh": "民防力量得到扩充，预警系统完成了现代化。", "start": 690.56, "end": 694.64}, {"de": "Pumpstationen und Dämme wurden verbessert.", "zh": "泵站和堤坝得到了改善。", "start": 694.72, "end": 697.36}, {"de": "Doch die Maßnahmen zur Klimaanpassung seien noch zu zaghaft, warnen Meteorologen.", "zh": "但气象学家警告，气候适应措施仍然过于谨小慎微。", "start": 697.48, "end": 702.44}, {"de": "Die neue Normalität des Klimas wird der Situation bei El Nino ähneln – nahezu als dauerhafter Zustand.", "zh": "气候的新常态将类似于厄尔尼诺期间的局面——几乎是永久状态。", "start": 702.92, "end": 709.64}, {"de": "Heftiger Regen und Überschwemmungen im Süden Brasiliens.", "zh": "巴西南部暴雨和洪水。", "start": 710.0, "end": 713.6}, {"de": "Im Norden und am Amazonas Trockenheit, Hitzewellen, Waldbrände.", "zh": "北部和亚马逊地区则是干旱、热浪、森林大火。", "start": 713.72, "end": 717.56}, {"de": "Ernten könnten ausfallen, Lebensmittelpreise steigen.", "zh": "收成可能歉收，食品价格上涨。", "start": 717.64, "end": 722.12}, {"de": "Zurück in Porto Alegre: Einige Viertel zeigen: Die Ärmsten sind am verwundbarsten.", "zh": "回到阿雷格里港：一些城区表明：最贫困的人最脆弱。", "start": 722.48, "end": 728.56}, {"de": "Christiane Alves wurde umgesiedelt.", "zh": "克里斯蒂亚妮·阿尔维斯已被重新安置。", "start": 728.64, "end": 731.0}, {"de": "Doch nach wie vor leben hier 150 Familien – unter der ständigen Gefahr.", "zh": "但这里至今仍住着 150 户家庭——处于持续的危险之下。", "start": 731.12, "end": 736.08}, {"de": "Denn die Niederschläge nehmen zu und der Guaiba-Fluss steigt erneut.", "zh": "因为降雨在增加，瓜伊巴河水位再次上涨。", "start": 736.84, "end": 742.8}]}], "vocab": [{"lemma": "die Überschwemmung, -en", "key": "ueberschwemmung", "forms": ["Überschwemmungen", "Überschwemmung"], "pos": "Substantiv", "zh": "洪水、泛滥", "example_de": "Überschwemmungen, Dürre und extreme Hitze machen den Menschen weltweit zu schaffen.", "example_zh": ""}, {"lemma": "die Dürre, -n", "key": "duerre", "forms": ["Dürre"], "pos": "Substantiv", "zh": "干旱", "example_de": "Überschwemmungen, Dürre und extreme Hitze machen den Menschen weltweit zu schaffen.", "example_zh": ""}, {"lemma": "sich aufbauen", "key": "sich-aufbauen", "forms": ["aufbaue", "sich aufbauen"], "pos": "Verb", "zh": "形成、积聚", "example_de": "Grund dafür sei ein ungewöhnlich starker El Nino, der sich derzeit im Pazifik aufbaue.", "example_zh": ""}, {"lemma": "die Meeresströmung, -en", "key": "meeresstroemung", "forms": ["Meeresströmungen", "Meeresströmung"], "pos": "Substantiv", "zh": "洋流", "example_de": "Das Klimaphänomen beeinflusst Meeresströmungen und heizt die Ozeane zusätzlich auf.", "example_zh": ""}, {"lemma": "verschärfen", "key": "verschaerfen", "forms": ["verschärfen"], "pos": "Verb", "zh": "加剧、使更严重", "example_de": "El Nino ist nicht durch den Klimawandel verursacht, kann dessen Folgen aber verschärfen - wie 2024 in Brasilien.", "example_zh": ""}, {"lemma": "die Unwetterkatastrophe, -n", "key": "unwetterkatastrophe", "forms": ["Unwetterkatastrophe"], "pos": "Substantiv", "zh": "风暴灾难", "example_de": "Ein tristes Zeugnis der Unwetterkatastrophe, die hier vor zwei Jahren alles verwüstet hat.", "example_zh": ""}, {"lemma": "obdachlos", "key": "obdachlos", "forms": ["obdachlos"], "pos": "Adjektiv", "zh": "无家可归的", "example_de": "Mindestens 180 Menschen starben, 600.000 wurden obdachlos.", "example_zh": ""}, {"lemma": "die Alarmbereitschaft", "key": "alarmbereitschaft", "forms": ["Alarmbereitschaft"], "pos": "Substantiv", "zh": "警戒状态", "example_de": "Der Zivilschutz: schon jetzt in Alarmbereitschaft.", "example_zh": ""}, {"lemma": "die Klimaanpassung", "key": "klimaanpassung", "forms": ["Klimaanpassung"], "pos": "Substantiv", "zh": "气候适应", "example_de": "Doch die Maßnahmen zur Klimaanpassung seien noch zu zaghaft, warnen Meteorologen.", "example_zh": ""}, {"lemma": "verwundbar", "key": "verwundbar", "forms": ["verwundbarsten", "verwundbar"], "pos": "Adjektiv", "zh": "脆弱的、易受伤害的", "example_de": "Zurück in Porto Alegre: Einige Viertel zeigen: Die Ärmsten sind am verwundbarsten.", "example_zh": ""}], "grammar_points": [{"title": "关系从句中的 Konjunktiv I", "summary": "主句转述 UN 警告（sei），其后的关系从句保持第一虚拟式（der sich … aufbaue），引述语气前后一致。", "example_de": "Grund dafür sei ein ungewöhnlich starker El Nino, der sich derzeit im Pazifik aufbaue.", "example_zh": "原因据称是一个异常强烈的厄尔尼诺，目前正在太平洋上形成。"}, {"title": "am + 最高级", "summary": "形容词最高级作表语时用 am + -sten 形式：am verwundbarsten。", "example_de": "Einige Viertel zeigen: Die Ärmsten sind am verwundbarsten.", "example_zh": "一些城区表明：最贫困的人最脆弱。"}], "background": "El Niño 是太平洋赤道海域海温异常升高引发的气候现象，通常每 2–7 年出现一次，改变全球降水分布：巴西南部多雨洪涝，东南亚与亚马逊地区干旱。2024 年巴西南里奥格兰德州（首府阿雷格里港）洪灾造成约 180 人死亡、60 万人无家可归，正是上一次厄尔尼诺所致；本次 WMO 预警的事件强度预计更强。"}, {"title": "Zukunftssorgen schmälern Kinderwunsch", "title_zh": "对未来的忧虑削弱生育意愿", "paras": [{"start": 743.96, "end": 770.88, "lines": [{"de": "Kinder bekommen - ja oder nein?", "zh": "要不要孩子？", "start": 743.96, "end": 746.68}, {"de": "Viele junge Erwachsene antworten darauf mit: \"Lieber nicht.\"", "zh": "许多年轻人的回答是：“最好还是不要。", "start": 746.8, "end": 750.96}, {"de": "Zu diesem Ergebnis kommt eine Untersuchung des Bundesinstituts für Bevölkerungsforschung in Wiesbaden.", "zh": "”威斯巴登联邦人口研究所的一项调查得出了这一结论。", "start": 751.28, "end": 757.48}, {"de": "Ein Grund seien Zukunftssorgen.", "zh": "原因之一据称是对未来的忧虑。", "start": 757.56, "end": 759.64}, {"de": "Globale Krisen wie Kriege oder Klimawandel hielten Paare davon ab, eine Familie zu gründen.", "zh": "战争或气候变化等全球危机使夫妇不敢组建家庭。", "start": 759.76, "end": 766.04}, {"de": "Auch hohe Lebenshaltungskosten und teure Mieten spielen eine Rolle.", "zh": "高昂的生活成本和昂贵的房租也在其中起作用。", "start": 766.12, "end": 770.88}]}, {"start": 772.52, "end": 862.28, "lines": [{"de": "Oliver kam gestern im Klinikum Stuttgart auf die Welt.", "zh": "奥利弗昨天出生在斯图加特医院。", "start": 772.52, "end": 776.52}, {"de": "Ein Kind bekommen sei der Wunsch gewesen, sagen seine Eltern - aber noch eins?", "zh": "“有一个孩子一直是我们的愿望”，他的父母说——但还要一个吗？", "start": 776.6, "end": 782.2}, {"de": "Wohnung ist ein Thema.", "zh": "“住房是个问题。", "start": 783.28, "end": 784.84}, {"de": "Grade hier in Stuttgart ist es sehr schwierig, Wohnraum zu finden, bezahlbaren Wohnraum.", "zh": "尤其是在斯图加特，很难找到住房，负担得起的住房。", "start": 785.08, "end": 791.84}, {"de": "Das Alter auch - wir sind schon 35. Wenn wir ein paar Jahre warten, sind wir nicht mehr so jung.", "zh": "年龄也是——我们已经 35 了。", "start": 792.72, "end": 798.96}, {"de": "Seit Jahren sinkt die Geburtenrate.", "zh": "如果再等几年，我们就不那么年轻了。", "start": 799.4, "end": 801.88}, {"de": "Hauptgründe sind laut der Studie: Das sorgt dafür, dass junge Menschen den Glauben an die Zukunft verlieren.", "zh": "”多年来出生率持续下降。", "start": 809.12, "end": 826.52}, {"de": "Obwohl sie Kinder wollen, schieben sie es auf.", "zh": "根据该研究，主要原因是：“这让年轻人失去对未来的信心。", "start": 826.64, "end": 829.6}, {"de": "Oder sie haben keinen Kinderwunsch wie Liv Herrmann (19) aus Stuttgart.", "zh": "尽管他们想要孩子，还是一拖再拖。", "start": 829.96, "end": 834.72}, {"de": "Man hört viel Schlechtes über den Klimawandel, über Sachen, die in der Welt abgehen.", "zh": "”或者像斯图加特 19 岁的利夫·赫尔曼一样没有生育愿望：“关于气候变化、世界上发生的事，听到的坏消息太多了。", "start": 835.2, "end": 840.72}, {"de": "Ich finde für mich, dass ich kein Bedürfnis habe, ein Kind in die Welt zu setzen.", "zh": "我觉得自己没有渴望把一个孩子带到这个世界上。", "start": 840.8, "end": 846.64}, {"de": "Olivers Eltern haben sich trotz der Krisen dafür entschieden.", "zh": "”奥利弗的父母不顾危机做出了要孩子的决定。", "start": 847.6, "end": 851.92}, {"de": "Der Kinderwunsch sei stärker gewesen als die Angst.", "zh": "“想要孩子的愿望比恐惧更强烈。", "start": 852.16, "end": 855.24}, {"de": "Die Studienmacher sagen: Politik und Wirtschaft sollten Rahmenbedingungen schaffen, das Elternschaft möglich ist.", "zh": "”研究报告的作者说：政治和经济界应当创造条件，让为人父母成为可能。", "start": 855.32, "end": 862.28}]}], "vocab": [{"lemma": "der Kinderwunsch", "key": "kinderwunsch", "forms": ["Kinderwunsch"], "pos": "Substantiv", "zh": "生育意愿、想要孩子的愿望", "example_de": "Oder sie haben keinen Kinderwunsch wie Liv Herrmann (19) aus Stuttgart.", "example_zh": ""}, {"lemma": "die Zukunftssorge, -n", "key": "zukunftssorge", "forms": ["Zukunftssorgen", "Zukunftssorge"], "pos": "Substantiv", "zh": "对未来的忧虑", "example_de": "Ein Grund seien Zukunftssorgen.", "example_zh": ""}, {"lemma": "schmälern", "key": "schmaelern", "forms": ["schmälern"], "pos": "Verb", "zh": "削弱、减损", "example_de": "Ein Kind bekommen sei der Wunsch gewesen, sagen seine Eltern - aber noch eins?", "example_zh": ""}, {"lemma": "die Lebenshaltungskosten (Pl.)", "key": "lebenshaltungskosten", "forms": ["Lebenshaltungskosten"], "pos": "Substantiv", "zh": "生活成本", "example_de": "Auch hohe Lebenshaltungskosten und teure Mieten spielen eine Rolle.", "example_zh": ""}, {"lemma": "die Geburtenrate, -n", "key": "geburtenrate", "forms": ["Geburtenrate"], "pos": "Substantiv", "zh": "出生率", "example_de": "Seit Jahren sinkt die Geburtenrate.", "example_zh": ""}, {"lemma": "aufschieben", "key": "aufschieben", "forms": ["schieben es auf", "aufschieben"], "pos": "Verb", "zh": "推迟、拖延", "example_de": "Obwohl sie Kinder wollen, schieben sie es auf.", "example_zh": ""}, {"lemma": "bezahlbar", "key": "bezahlbar", "forms": ["bezahlbaren", "bezahlbar"], "pos": "Adjektiv", "zh": "负担得起的", "example_de": "Grade hier in Stuttgart ist es sehr schwierig, Wohnraum zu finden, bezahlbaren Wohnraum.", "example_zh": ""}, {"lemma": "die Elternschaft", "key": "elternschaft", "forms": ["Elternschaft"], "pos": "Substantiv", "zh": "为人父母（的身份）", "example_de": "Die Studienmacher sagen: Politik und Wirtschaft sollten Rahmenbedingungen schaffen, das Elternschaft möglich ist.", "example_zh": ""}], "grammar_points": [{"title": "obwohl 让步从句", "summary": "obwohl（尽管）引导让步从句，动词居末：Obwohl sie Kinder wollen, schieben sie es auf。", "example_de": "Obwohl sie Kinder wollen, schieben sie es auf.", "example_zh": "尽管他们想要孩子，还是一拖再拖。"}, {"title": "von etwas abhalten", "summary": "jemanden von etwas (Dat.) abhalten = 阻止某人做某事；此处过去式 hielten … davon ab。", "example_de": "Globale Krisen wie Kriege oder Klimawandel hielten Paare davon ab, eine Familie zu gründen.", "example_zh": "战争或气候变化等全球危机使夫妇不敢组建家庭。"}], "background": "联邦人口研究所（BiB）位于威斯巴登，是德国人口问题权威研究机构。德国总和生育率多年在 1.3–1.5 之间徘徊，研究普遍将住房成本、职业不确定性与全球危机感列为主因。"}, {"title": "Das Wetter", "title_zh": "天气预报", "paras": [{"start": 863.36, "end": 914.76, "lines": [{"de": "Die Wettervorhersage für morgen, Freitag, den 4. September.", "zh": "明天 9 月 4 日星期五的天气预报。", "start": 863.36, "end": 867.04}, {"de": "Tiefer Luftdruck bringt dem Norden Regen und Wind, im Süden sorgt Hochdruck für Sonne und Wärme.", "zh": "低气压给北方带来降雨和大风，南方高压带来阳光和温暖。", "start": 868.48, "end": 875.6}, {"de": "Die Nacht beginnt meist trocken, im Süden klar.", "zh": "夜间大部分地区干燥，南方天空晴朗。", "start": 875.84, "end": 878.76}, {"de": "Später kommt von Nordwesten kräftiger, anhaltender Regen.", "zh": function wrapWord(surface, key) {
  const g = getGloss(key);

function tokenizeDe(text) {
  let html = '', i = 0;
  const lower = text.toLowerCase();
  while (i < text.length) {
    let hit = '';
    if (i === 0 || !isLetter(text[i - 1])) {
      for (const ph of PHRASES) {
        if (lower.startsWith(ph.toLowerCase(), i) && !isLetter(text[i + ph.length])) {
          hit = text.slice(i, i + ph.length);
          break;
        }
      }
    }
    if (hit) {
      html += wrapWord(hit, lookupKey(hit));
      i += hit.length;
      continue;
    }
    if (isLetter(text[i])) {
      let j = i + 1;
      while (j < text.length && /[A-Za-zÄÖÜäöüß-]/.test(text[j])) j++;
      const word = text.slice(i, j);
      html += wrapWord(word, lookupKey(word));
      i = j;
    } else {
      let j = i + 1;
      while (j < text.length && !isLetter(text[j])) j++;
      html += esc(text.slice(i, j));
      i = j;
    }
  }

}

function clampFloat(x, y) {

  return {
    x: Math.min(Math.max(pad, x), Math.max(pad, innerWidth - w - pad)),

  };
}

function basketAdd() {

  if (basket.some(b => b.key === popWord.key)) { toast('已在生词本'); return; }
  basket.push({
    key: popWord.key, word: popWord.word, zh: popWord.zh, pos: popWord.pos || '',
    example: popWord.example || '', date: DATA.date, topic: popWord.topic || '',
    source: popWord.source || '', createdAt: Date.now()
  });

  refreshWordMarks();
  hidePop(); renderBasket(); toast('已加入生词本');
}
function basketDel(key) {
  basket = basket.filter(b => b.key !== key);
  saveBasket();
  refreshWordMarks();
  renderBasket();
}
function saveBasket() { saveStored(BK_KEY, basket); }
function refreshWordMarks() {
  document.querySelectorAll('w').forEach(w => {

  ).join('');
}
function toggleBasket(open) {
  const panel = document.getElementById('basket');
  const wasOpen = panel.classList.contains('open');
  panel.classList.toggle('open', open);
  panel.setAttribute('aria-hidden', String(!open));
  document.getElementById('scrim').classList.toggle('on', open);

  else {
    closeWordEditor();
    if (wasOpen) document.getElementById('basket-btn').focus();
  }
}
document.getElementById('basket-btn').onclick = () => toggleBasket(true);
document.getElementById('scrim').onclick = () => toggleBasket(false);
document.addEventListener('keydown', e => {
  const panel = document.getElementById('basket');
  if (!panel.classList.contains('open')) return;
  if (e.key === 'Escape') {
    e.preventDefault();
    toggleBasket(false);
    return;
  }
  if (e.key !== 'Tab') return;
  const focusable = [...panel.querySelectorAll('button:not([disabled]), a[href], input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])')];
  if (!focusable.length) return;
  const first = focusable[0];
  const last = focusable[focusable.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
});
document.getElementById('bk-list').onclick = e => {
  const btn = e.target.closest('button[data-key]');

  setTimeout(() => document.getElementById('edit-word').focus(), 0);
}
function closeWordEditor() {
  editingKey = null;
  document.getElementById('word-editor').classList.remove('open');
  document.getElementById('word-form').reset();
}
document.getElementById('word-form').onsubmit = e => {
  e.preventDefault();

  const word = document.getElementById('edit-word').value.trim();
  const zh = document.getElementById('edit-zh').value.trim();
  const example = document.getElementById('edit-example').value.trim();
  if (!word || !zh) return;
  const key = editingKey || word.toLocaleLowerCase('de-DE');
  const item = basket.find(b => b.key === editingKey || (!editingKey && b.key === key));
  if (item) Object.assign(item, { word, zh, example });
  else basket.unshift({ key, word, zh, example, date: DATA.date, manual: true });
  userGloss[key] = { word, zh, example, pos: '' };
  saveStored(GLOSS_KEY, userGloss);
  saveBasket();
  refreshWordMarks();
  renderBasket();
  closeWordEditor();
  toast(wasEditing ? '单词已更新' : '已添加单词');
};

function copyWords() {

}

        latexPost: '\\end{document}',
        req: [[0, 'all', [0]]], tags: [], vers: []
      }
    };
    const decks = {
      "1": { id: 1, name: 'Default', mod: now, usn: 0, lrnToday: [0,0], revToday: [0,0], newToday: [0,0], timeToday: [0,0], collapsed: false, browserCollapsed: false, desc: '', dyn: 0, conf: 1, extendNew: 10, extendRev: 50 },
      [deckId]: { id: deckId, name: 'Deutsch Daily', mod: now, usn: 0, lrnToday: [0,0], revToday: [0,0], newToday: [0,0], timeToday: [0,0], collapsed: false, browserCollapsed: false, desc: '', dyn: 0, conf: 1, extendNew: 10, extendRev: 50 }
    };
    const conf = {
      activeDecks: [1], addToCur: true, collapseTime: 1200, curDeck: 1,
      curModel: mid, dayLearnFirst: false, dueCounts: true, estTimes: true,
      newSpread: 0, nextPos: 1, schedVer: 2, sched2021: true, sortBackwards: false,
      sortType: "noteFld", timeLim: 0, creationOffset: -480
    };
    const dconf = {
      "1": { id: 1, name: "Default", replayq: true, lapse: { delays: [10, 60], mult: 0, minInt: 1, leechFails: 8, leechAction: 0 }, rev: { perDay: 200, fuzz: 0.05, ivlFct: 1, maxIvl: 36500, ease4: 1.3, bury: true, minSpace: 1 }, timer: 0, maxTaken: 60, new: { separate: true, ints: [1, 4, 7], initialFactor: 2500, bury: true, order: 1 }, mod: 0, usn: 0, autoplay: true }
    };
    db.run(`INSERT INTO col VALUES(?,?,?,?,?,?,?,?,?,?,?,?,?)`, [
      now, now, now * 1000, 0, 11, 0, 0, 0,
      JSON.stringify(conf), JSON.stringify(model), JSON.stringify(decks),
      JSON.stringify(dconf), '{}'
    ]);

    db.run(`CREATE TABLE notes(
      id integer primary key, guid text, mid integer, mod integer, usn integer,
      tags text, flds text, sfld text, csum integer, flags integer, data text)`);
    db.run(`CREATE TABLE cards(
      id integer primary key, nid integer, did integer, ord integer, mod integer,
      usn integer, type integer, queue integer, due integer, ivl integer,
      factor integer, reps integer, lapses integer, left integer, odue integer,
      odid integer, flags integer, data text)`);
    db.run(`CREATE TABLE revlog(
      id integer primary key, cid integer, usn integer, ease integer, ivl integer,
      lastIvl integer, factor integer, time integer, type integer)`);
    db.run(`CREATE TABLE graves(
      usn integer, oid integer, type integer)`);
    db.run(`CREATE INDEX ix_notes_usn on notes (usn)`);
    db.run(`CREATE INDEX ix_cards_usn on cards (usn)`);
    db.run(`CREATE INDEX ix_revlog_usn on revlog (usn)`);
    db.run(`CREATE INDEX ix_cards_nid on cards (nid)`);
    db.run(`CREATE INDEX ix_revlog_cid on revlog (cid)`);
    db.run(`CREATE INDEX ix_notes_csum on notes (csum)`);

    const enc = new TextEncoder();
    function csum(s) { // anki checquers field hash (java String.hashCode)
      let h = 0;
      for (const b of enc.encode(s)) { h = (31 * h + b) | 0; }
      return h;
    }
    function guid(key) {
      let h = 0; const s = 'dd-' + key;
      for (const b of enc.encode(s)) { h = (31 * h + b) | 0; }
      return 'dd' + (h >>> 0).toString(16);
    }

    let nid = now * 1000, cid = (now + 1) * 1000;
    for (const b of basket) {
      const front = b.word;
      const back = `${b.zh}${b.example ? `<br><i>${b.example}</i>` : ''}`;
      const sfld = front;
      const flds = front.replace(/\t/g, ' ') + '\x1f' + back.replace(/\t/g, ' ');
      db.run(`INSERT INTO notes VALUES(?,?,?,?,?,?,?,?,?,?,?)`,
        [nid, guid(b.key), mid, now, -1, ' dd::' + (DATA.slug || b.date || DATA.date) + ' ', flds, sfld, csum(sfld), 0, '']);
      db.run(`INSERT INTO cards VALUES(?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)`,
        [cid, nid, deckId, 0, now, -1, 0, 0, nid, 0, 0, 0, 0, 0, 0, 0, 0, '']);
      nid++; cid++;
    }

    st.textContent = '打包…';
    const data = db.export();
    // zip: meta(version2) + collection.anki2 + collection.anki21(同内容, anki26+导入器优先读) + media
    const zip = makeZip({
      'meta': new Uint8Array([0x08, 0x02]),
      'collection.anki2': data,
      'collection.anki21': data,
      'media': new TextEncoder().encode('{}')
    });
    const blob = new Blob([zip], { type: 'application/apkg' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `deutsch-${basket.length}w-${Date.now()}.apkg`;
    a.click();
    st.textContent = `已导出 ${basket.length} 张卡 — 打开 Anki 导入即可`;
    toast('apkg 已下载');
  } catch (err) {
    console.error(err);
    st.textContent = '导出失败: ' + err.message + ' — 可先用「复制文本」';
  } finally {
    btn.disabled = false;
  }
}

/* 极简 zip (store, 无压缩) — apkg 只需合法 zip */
function makeZip(files) {
  const enc = new TextEncoder();
  const chunks = [], central = [];
  let offset = 0;
  const CRC_TABLE = (() => {
    const t = new Uint32Array(256);
    for (let n = 0; n < 256; n++) {
      let c = n;
      for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
      t[n] = c >>> 0;
    }
    return t;
  })();
  function crc32(buf) {
    let c = 0xFFFFFFFF;
    for (let i = 0; i < buf.length; i++) c = CRC_TABLE[(c ^ buf[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }
  for (const [name, content] of Object.entries(files)) {
    const nameB = enc.encode(name);
    const crc = crc32(content);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true);
    lh.setUint16(4, 20, true);       // version
    lh.setUint16(6, 0, true);        // flags
    lh.setUint16(8, 0, true);        // store
    lh.setUint16(10, 0, true); lh.setUint16(12, 0x2821, true); // time/date(dos)
    lh.setUint32(14, crc, true);
    lh.setUint32(18, content.length, true);
    lh.setUint32(22, content.length, true);
    lh.setUint16(26, nameB.length, true);
    lh.setUint16(28, 0, true);
    chunks.push(new Uint8Array(lh.buffer), nameB, content);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true);
    ch.setUint16(4, 20, true); ch.setUint16(6, 20, true);
    ch.setUint16(8, 0, true); ch.setUint16(10, 0, true);
    ch.setUint16(12, 0, true); ch.setUint16(14, 0x2821, true);
    ch.setUint32(16, crc, true);
    ch.setUint32(20, content.length, true); ch.setUint32(24, content.length, true);
    ch.setUint16(28, nameB.length, true);
    // 30..45 = 0
    ch.setUint32(42, offset, true);
    central.push(new Uint8Array(ch.buffer), nameB);
    offset += 30 + nameB.length + content.length;
  }
  let centralSize = central.reduce((s, c) => s + c.length, 0);
  const eocd = new DataView(new ArrayBuffer(22));
  eocd.setUint32(0, 0x06054b50, true);
  eocd.setUint16(8, Object.keys(files).length, true);
  eocd.setUint16(10, Object.keys(files).length, true);
  eocd.setUint32(12, centralSize, true);
  eocd.setUint32(16, offset, true);
  const total = [...chunks, ...central, new Uint8Array(eocd.buffer)];
  const out = new Uint8Array(total.reduce((s, c) => s + c.length, 0));
  let p = 0;
  for (const c of total) { out.set(c, p); p += c.length; }
  return out;
}

/* ---------- toast ---------- */
let toastT;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(toastT);
  toastT = setTimeout(() => t.style.display = 'none', 1600);
}
