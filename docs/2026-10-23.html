    <div id="root"></div>
    <script id="dd-data" type="application/json">{"page":"lesson","lesson":{"slug":"2026-10-23","date":"2026-10-23","show":"tagesschau in Einfacher Sprache","level":"A2–B1","kind":"broadcast","note":"","source_url":"https://www.tagesschau.de/tagesschau_in_einfacher_sprache/tse-1476.html","video":{"mp4":"https://tagesschau-progressive.ard-mcdn.de/video/2026/1023/TV-20261023-1742-1500.webl.h264.mp4","embed":"","page":"https://www.tagesschau.de/tagesschau_in_einfacher_sprache/video-1671388.html"},"duration":449.72,"sentences":[{"de":"Willkommen zur tagesschau in Einfacher Sprache.","zh":"欢迎收看简单语言版每日新闻。","start":10.92,"end":14.16},{"de":"Ich bin Susanne Stichler und das sind unsere Nachrichten:","zh":"我是苏珊娜·施蒂希勒，以下是我们的新闻：","start":14.6,"end":18.92},{"de":"Und nun zur ersten Nachricht:","zh":"现在来看第一条新闻：","start":40.24,"end":42.48},{"de":"Die CSU ist eine Partei.","zh":"基社盟是一个政党。","start":48.32,"end":51.44},{"de":"Es gibt sie nur im Bundesland Bayern.","zh":"它只在巴伐利亚州存在。","start":52.0,"end":55.2},{"de":"Im Rest von Deutschland heißt die Partei CDU.","zh":"在德国其他地区，这个政党叫基民盟。","start":55.76,"end":59.44},{"de":"Die CSU macht in der Stadt München jetzt einen Parteitag.","zh":"基社盟现在在慕尼黑市举行党代表大会。","start":60.44,"end":65.48},{"de":"Mitglieder von der Partei kommen zusammen und reden über Ziele.","zh":"党员们聚在一起讨论目标。","start":65.52,"end":71.2},{"de":"Ein Thema beim Parteitag ist der Länderfinanzausgleich.","zh":"党代会的其中一个议题是各州财政平衡。","start":71.88,"end":76.6},{"de":"Es gibt nämlich Bundesländer mit viel Geld und Bundesländer mit wenig Geld.","zh":"因为有的联邦州钱多，有的联邦州钱少。","start":77.44,"end":83.84},{"de":"Bayern gehört zu den Bundesländern mit viel Geld und gibt etwas davon an die anderen ab.","zh":"巴伐利亚属于有钱的联邦州，要把一部分钱分给其他州。","start":84.92,"end":92.56},{"de":"Die Regierung in Bayern möchte aber weniger Geld zahlen.","zh":"但巴伐利亚政府想少付一些钱。","start":92.6,"end":98.24},{"de":"Mehr dazu jetzt in einem Film.","zh":"现在请看一段相关的影片。","start":98.44,"end":100.6},{"de":"Die CSU sagt, beim Länderfinanzausgleich muss sich etwas ändern, denn er ist ungerecht.","zh":"基社盟说，各州财政平衡必须改变，因为它不公平。","start":101.4,"end":110.0},{"de":"Deshalb die Idee:","zh":"所以有了这个想法：","start":110.6,"end":112.04},{"de":"Bundesländer mit einer extremistischen Regierung sollen kein Geld mehr bekommen.","zh":"由极端主义政府执政的联邦州不应再得到钱。","start":112.76,"end":117.84},{"de":"Extremistisch ist z.B. die AfD in Sachsen-Anhalt.","zh":"例如萨克森-安哈尔特州的德国选择党就是极端主义的。","start":118.96,"end":123.32},{"de":"Das heißt, die AfD will sich nicht immer an das Grundgesetz halten.","zh":"也就是说，德国选择党不想总是遵守基本法。","start":124.16,"end":129.52},{"de":"Das sind die Regeln für alle Menschen in Deutschland.","zh":"基本法是适用于德国所有人的规则。","start":129.84,"end":133.56},{"de":"Die CSU sagt außerdem, die Partei Die Linke ist uns auch zu extrem.","zh":"基社盟还说，左翼党对我们来说也太极端了。","start":133.88,"end":140.64},{"de":"Martin Huber von der CSU sagt, in Berlin soll es eine Regierung mit der Linken geben.","zh":"基社盟的马丁·胡贝尔说，柏林将要有一个与左翼党组成的政府。","start":140.68,"end":148.72},{"de":"Die Pläne von der Regierung verstoßen aber gegen die Regeln von Deutschland.","zh":"但该政府的计划违反了德国的规则。","start":149.12,"end":154.2},{"de":"Dafür wollen wir kein Geld geben.","zh":"我们不愿意为此出钱。","start":154.32,"end":157.2},{"de":"Einige Chefs von anderen Bundesländern kritisieren die Idee von der CSU.","zh":"其他一些联邦州的州长批评基社盟的这个想法。","start":158.04,"end":163.72},{"de":"Sie sagen, die AfD und Die Linke sind nicht gleich.","zh":"他们说，德国选择党和左翼党是不一样的。","start":163.76,"end":168.92},{"de":"Deshalb sollte die CSU das nicht vermischen.","zh":"所以基社盟不应该把这两者混为一谈。","start":169.44,"end":172.92},{"de":"Und nun zur nächsten Nachricht:","zh":"现在来看下一条新闻：","start":174.36,"end":176.72},{"de":"Neben Israel ist das Westjordanland.","zh":"约旦河西岸位于以色列旁边。","start":182.16,"end":184.96},{"de":"Dort wohnen viele Palästinenser.","zh":"那里住着许多巴勒斯坦人。","start":186.04,"end":188.32},{"de":"Israel hat das Westjordanland vor vielen Jahren besetzt.","zh":"以色列在很多年前占领了约旦河西岸。","start":189.04,"end":193.92},{"de":"D.h. israelische Soldaten bestimmen, was dort passiert.","zh":"也就是说，以色列士兵决定那里发生的事情。","start":194.84,"end":199.6},{"de":"Jetzt hat der Chef von der israelischen Regierung, Benjamin Netanyahu, gesagt, wir riegeln das Westjordanland ab.","zh":"现在以色列政府首脑本雅明·内塔尼亚胡说：我们要封锁约旦河西岸。","start":200.52,"end":210.08},{"de":"Die Grenzen sind dann geschlossen.","zh":"边界将因此关闭。","start":210.28,"end":212.72},{"de":"Was das bedeutet, zeigen wir jetzt in einem Film.","zh":"这意味着什么，我们现在用一段影片来展示。","start":213.32,"end":216.76},{"de":"Netanyahu sagt, wir schließen alle Grenzübergänge.","zh":"内塔尼亚胡说：我们要关闭所有边境口岸。","start":218.28,"end":222.52},{"de":"Niemand darf mehr aus dem Westjordanland heraus.","zh":"任何人都不许再离开约旦河西岸。","start":223.08,"end":226.44},{"de":"Und es darf auch niemand dorthin reisen.","zh":"也不许任何人前往那里。","start":226.72,"end":229.52},{"de":"Das Abregeln ist wegen der Wahl in Israel.","zh":"封锁是因为以色列的选举。","start":230.84,"end":234.28},{"de":"Die Wahl ist nächste Woche.","zh":"选举在下周举行。","start":234.88,"end":236.84},{"de":"Netanyahu sagt, es geht um die Sicherheit.","zh":"内塔尼亚胡说，这是为了安全。","start":237.72,"end":241.12},{"de":"Palästinenser haben nämlich Anschläge geplant.","zh":"因为巴勒斯坦人策划了袭击。","start":242.0,"end":245.16},{"de":"Wir bekämpfen die Terroristen.","zh":"我们要打击恐怖分子。","start":245.2,"end":247.56},{"de":"Wie lange das Westjordanland abgeriegelt sein soll, ist noch nicht bekannt.","zh":"约旦河西岸要被封锁多久，目前还不知道。","start":247.88,"end":254.2},{"de":"Wenn niemand über die Grenze darf, dann können viele Palästinenser z.B.","zh":"如果没有人能过境，那么许多巴勒斯坦人就无法","start":254.8,"end":260.28},{"de":"nicht zur Arbeit oder zum Arzt gehen.","zh":"去上班或去看医生。","start":260.32,"end":263.4},{"de":"Und nun zur nächsten Nachricht:","zh":"现在来看下一条新闻：","start":264.72,"end":266.92},{"de":"Das Internet ist wichtig, damit Menschen miteinander telefonieren und schreiben können.","zh":"互联网很重要，人们可以通过它互相打电话和写字交流。","start":272.4,"end":278.4},{"de":"Manchmal kommt das Internet-Signal über einen Satelliten.","zh":"有时互联网信号是通过卫星传送的。","start":278.44,"end":283.56},{"de":"Ein Satellit ist ein großes Gerät im Weltraum.","zh":"卫星是太空中的一台大型设备。","start":284.2,"end":288.56},{"de":"Das ist über der Erde.","zh":"它位于地球上方。","start":289.04,"end":290.72},{"de":"Dort gibt es auch die Satelliten von der Firma Starlink.","zh":"那里也有星链公司的卫星。","start":291.72,"end":295.92},{"de":"Die Ukraine benutzt die Starlink-Satelliten im Krieg mit Russland.","zh":"乌克兰在与俄罗斯的战争中使用星链卫星。","start":295.96,"end":302.72},{"de":"Damit können ukrainische Soldaten z.B. Drohnen steuern.","zh":"例如，乌克兰士兵可以用它操控无人机。","start":303.24,"end":308.88},{"de":"Und sie erfahren etwas über russische Raketen.","zh":"他们还能了解到俄罗斯导弹的信息。","start":309.28,"end":313.84},{"de":"Starlink gehört Elon Musk aus den USA.","zh":"星链属于美国的埃隆·马斯克。","start":314.84,"end":318.84},{"de":"Seit einer Weile haben die Satelliten nicht mehr so gut funktioniert.","zh":"一段时间以来，这些卫星不再那么好用了。","start":318.88,"end":325.4},{"de":"Der Präsident von der Ukraine, Wolodymyr Selensky, hat deshalb gesagt:","zh":"乌克兰总统弗拉基米尔·泽连斯基因此说：","start":326.12,"end":332.16},{"de":"\"Ihr müsst das reparieren. Wir brauchen Starlink.\"","zh":"\"你们必须把它修好。我们需要星链。\"","start":332.2,"end":336.8},{"de":"Musk hat dann gesagt:","zh":"马斯克随后说：","start":336.84,"end":338.68},{"de":"\"Darüber muss der Präsident von dem Land USA, Donald Trump, entscheiden.\"","zh":"\"这必须由美国的国家总统唐纳德·特朗普来决定。\"","start":338.72,"end":345.56},{"de":"Jetzt hat Trump gesagt:","zh":"现在特朗普说：","start":345.6,"end":347.64},{"de":"\"Starlink funktioniert wieder.","zh":"\"星链又正常工作了。","start":347.68,"end":350.28},{"de":"Aber ich hatte mit der ganzen Sache nichts zu tun.\"","zh":"但这件事和我没有任何关系。\"","start":350.32,"end":354.04},{"de":"Und nun zur nächsten Nachricht:","zh":"现在来看下一条新闻：","start":356.04,"end":358.24},{"de":"Im Sommer war es in Europa sehr heiß.","zh":"今年夏天欧洲非常炎热。","start":362.8,"end":365.92},{"de":"Deshalb sind sogar Menschen gestorben.","zh":"甚至因此有人死亡。","start":366.88,"end":369.52},{"de":"Forscher haben jetzt gezählt, wie viele gestorben sind.","zh":"研究人员现在统计了死亡人数。","start":370.28,"end":374.52},{"de":"Die Forscher sagen, es waren viele tausend Menschen.","zh":"研究人员说，有数千人死亡。","start":375.24,"end":379.88},{"de":"Das sind so viele Tote wegen Hitze wie noch nie.","zh":"这是有史以来因高温死亡人数最多的一次。","start":381.0,"end":385.08},{"de":"Im Sommer ist es viel heißer als früher.","zh":"现在夏天比过去热得多。","start":386.32,"end":389.72},{"de":"Das ist wegen dem Klimawandel.","zh":"这是由气候变化造成的。","start":389.76,"end":393.4},{"de":"Vor allem im Süden von Europa waren es im Sommer oft mehr als 38 Grad.","zh":"尤其是在欧洲南部，夏天经常超过38度。","start":394.16,"end":400.08},{"de":"Und das waren unsere Nachrichten:","zh":"以上就是我们的新闻。","start":402.32,"end":405.0},{"de":"Und jetzt kommt das Wetter.","zh":"现在播报天气。","start":426.24,"end":428.36},{"de":"Es gibt viel Wind.","zh":"风很大。","start":429.16,"end":430.64},{"de":"Links im Westen und unten im Süden ist es manchmal sonnig.","zh":"在左侧的西部和下面的南部，有时有阳光。","start":431.12,"end":435.44},{"de":"Sonst gibt es immer wieder Wolken und Regen.","zh":"其他地区则不时有多云和降雨。","start":435.48,"end":439.2},{"de":"Es werden 5 bis 15 Grad.","zh":"气温是5到15度。","start":439.48,"end":442.24},{"de":"Das war die tagesschau in Einfacher Sprache.","zh":"以上就是简单语言版的每日新闻（tagesschau in Einfacher Sprache）。","start":443.48,"end":447.0},{"de":"Tschüss und bis zum nächsten Mal.","zh":"再见，下次见。","start":447.36,"end":449.72}],"stories":[{"title":"Begrüßung","title_zh":"欢迎","from":0,"to":2,"vocab":[],"grammar":[],"background":""},{"title":"Parteitag: CSU berät in München","title_zh":"党代表大会：基社盟在慕尼黑商议","from":3,"to":25,"vocab":[{"key":"parteitag","lemma":"der Parteitag, -e","pos":"Substantiv","zh":"党代表大会","example_de":"Die CSU macht in der Stadt München jetzt einen Parteitag.","example_zh":"基社盟现在在慕尼黑市举行党代表大会。"},{"key":"ungerecht","lemma":"ungerecht","pos":"Adjektiv","zh":"不公平的","example_de":"Die CSU sagt, beim Länderfinanzausgleich muss sich etwas ändern, denn er ist ungerecht.","example_zh":"基社盟说，各州财政平衡必须改变，因为它不公平。"},{"key":"extremistisch","lemma":"extremistisch","pos":"Adjektiv","zh":"极
