    <div id="root"></div>
    <script id="dd-data" type="application/json">{"page":"lesson","lesson":{"slug":"2026-09-17","date":"2026-09-17","show":"tagesschau in Einfacher Sprache","level":"A2–B1","kind":"video","note":"","source_url":"https://www.tagesschau.de/tagesschau_in_einfacher_sprache/video-1650702.html","video":{"mp4":"https://tagesschau-progressive.ard-mcdn.de/video/2026/0917/TV-20260917-1744-1000.webl.h264.mp4","embed":"https://www.tagesschau.de/tagesschau_in_einfacher_sprache/video-1650702~player.html","page":"https://www.tagesschau.de/tagesschau_in_einfacher_sprache/video-1650702.html"},"duration":475.55,"sentences":[{"de":"Willkommen zur tagesschau in Einfacher Sprache.","zh":"欢迎收看简易德语每日新闻。","start":null,"end":null},{"de":"Ich bin Susanne Holst und das sind unsere Nachrichten: Und nun zur ersten Nachricht: Es gibt verschiedene Arten von Autos.","zh":"我是苏珊娜·霍尔斯特，以下是今天的新闻：现在进入第一条新闻：汽车有很多种。","start":33.4,"end":35.52},{"de":"Die meisten Autos in Deutschland fahren mit Benzin oder Diesel.","zh":"德国大部分汽车用汽油或柴油行驶。","start":40.59,"end":48.07},{"de":"Die Autofahrer kaufen Benzin oder Diesel an einer Tankstelle.","zh":"车主们在加油站购买汽油或柴油。","start":48.24,"end":53.04},{"de":"Heißt, sie tanken.","zh":"这就叫加油。","start":53.24,"end":54.52},{"de":"Zurzeit ist das Tanken so teuer wie noch nie.","zh":"现在加油贵得前所未有。","start":55.08,"end":58.24},{"de":"Das liegt an dem Krieg in der Region Naher Osten.","zh":"原因是中东地区的战争。","start":58.68,"end":62.36},{"de":"Da sind Länder, die sehr viel Öl auf der Welt verkaufen.","zh":"那里有一些在全球大量出售石油的国家。","start":62.59,"end":66.51},{"de":"Wegen dem Krieg können die Länder gerade nicht so viel Öl verkaufen.","zh":"由于战争，这些国家眼下无法卖出那么多石油。","start":66.67,"end":71.27},{"de":"Deshalb ist Öl so teuer.","zh":"所以石油这么贵。","start":71.71,"end":73.43},{"de":"Wenn Öl teuer ist, dann sind auch Benzin und Diesel teuer.","zh":"如果石油贵，汽油和柴油也会贵。","start":73.75,"end":78.03},{"de":"Benzin und Diesel werden nämlich aus Öl gemacht.","zh":"因为汽油和柴油是用石油制造的。","start":78.67,"end":82.03},{"de":"Jetzt überlegen Politiker in Deutschland: Wie können wir Benzin und Diesel für die Autofahrer billiger machen?","zh":"现在德国的政治家们在思考：我们怎样才能让车主的汽油和柴油更便宜？","start":82.67,"end":90.2},{"de":"Dazu kommt jetzt ein Film: Die Preise an den Tankstellen steigen.","zh":"接下来是一段影片：加油站的价格在上涨。","start":90.4,"end":96.6},{"de":"Viele Autofahrer meinen, die Bundesregierung soll das ändern.","zh":"很多车主认为，联邦政府应该改变这一点。","start":97.27,"end":101.71},{"de":"Aber wie?","zh":"但怎么做呢？","start":101.88,"end":103.0},{"de":"Die Bundesregierung hat noch keinen Plan.","zh":"联邦政府还没有方案。","start":103.55,"end":106.43},{"de":"Die Ministerin für die Wirtschaft, Katharina Reiche von der Partei CDU, hat eine Idee.","zh":"经济部长卡塔琳娜·赖歇来自基民盟，她有一个想法。","start":106.47,"end":113.16},{"de":"Sie sagt: Wir können die Steuern für Benzin und Diesel senken.","zh":"她说：我们可以降低汽油和柴油的税。","start":113.64,"end":118.64},{"de":"Dann bekommt der Staat weniger Geld.","zh":"这样国家收到的钱会变少。","start":119.08,"end":121.64},{"de":"Aber für Autofahrer wird das Tanken billiger.","zh":"但对车主来说加油会更便宜。","start":122.47,"end":126.23},{"de":"Der Politiker Armand Zorn von der Partei SPD hat eine andere Idee.","zh":"政治家阿尔芒·佐尔恩来自社民党，他有另一个想法。","start":128.44,"end":134.36},{"de":"Er sagt: Große Firmen stellen Benzin und Diesel her.","zh":"他说：大公司生产汽油和柴油。","start":135.72,"end":140.04},{"de":"Diese Firmen verdienen mit dem hohen Preis gerade sehr viel Geld.","zh":"这些公司正靠着高价格赚很多钱。","start":141.31,"end":146.47},{"de":"Diese Firmen sollen weniger verdienen.","zh":"这些公司应该少赚一点。","start":147.08,"end":150.2},{"de":"Dann müssen Autofahrer auch nicht mehr so viel beim Tanken bezahlen.","zh":"这样车主加油时也就不用再付那么多钱。","start":150.83,"end":156.15},{"de":"Experten für Wirtschaft haben noch andere Ideen.","zh":"经济专家们还有别的想法。","start":159.15,"end":162.91},{"de":"Dieser Experte sagt: Die Bundesregierung kann Benzin oder Diesel nicht für alle Autofahrer billiger machen.","zh":"这位专家说：联邦政府没法让汽油或柴油对所有车主都变便宜。","start":163.96,"end":172.56},{"de":"Das ist zu teuer.","zh":"那太贵了。","start":172.8,"end":174.0},{"de":"Die Bundesregierung soll armen Menschen extra Geld für Benzin oder Diesel geben.","zh":"联邦政府应该给贫困的人额外发汽油或柴油的钱。","start":174.83,"end":180.99},{"de":"Reiche Menschen können nämlich auch hohe Preise bezahlen.","zh":"因为有钱人也付得起高价格。","start":181.59,"end":185.63},{"de":"Es gibt also viele Ideen.","zh":"所以现在有很多想法。","start":186.76,"end":188.84},{"de":"Jetzt muss sich die Bundesregierung entscheiden.","zh":"现在联邦政府必须做出决定。","start":189.47,"end":192.71},{"de":"Bis dahin bleibt Tanken teuer.","zh":"在那之前，加油仍然很贵。","start":193.0,"end":195.56},{"de":"Und nun zur nächsten Nachricht: Die Europäische Union ist eine Gruppe von Ländern in Europa.","zh":"现在进入下一条新闻：欧洲联盟是欧洲一些国家组成的团体。","start":197.28,"end":207.75},{"de":"Die Länder arbeiten in der Politik zusammen.","zh":"这些国家在政治上合作。","start":207.84,"end":210.76},{"de":"Europäische Union heißt kurz EU.","zh":"欧洲联盟简称欧盟。","start":210.88,"end":213.16},{"de":"Jetzt will auch das Land Kanada mehr mit der EU zusammenarbeiten.","zh":"现在加拿大也想与欧盟加强合作。","start":214.79,"end":219.35},{"de":"Das hat der Chef von der Regierung in Kanada im Parlament von der Europäischen Union gesagt.","zh":"这是加拿大政府首脑在欧盟议会里说的。","start":219.75,"end":226.03},{"de":"Dazu kommt jetzt ein Film: Der Chef von der Regierung in Kanada heißt Mark Carney.","zh":"接下来是一段影片：加拿大政府首脑叫马克·卡尼。","start":226.07,"end":233.47},{"de":"Er sagt, die EU und Kanada haben gemeinsame Werte.","zh":"他说，欧盟和加拿大有共同的价值观。","start":234.76,"end":238.92},{"de":"Das heißt, sie finden dieselben Dinge richtig und wichtig.","zh":"意思是，他们认为相同的事情正确且重要。","start":239.55,"end":244.23},{"de":"Wenn die EU und Kanada mehr zusammenarbeiten, dann kann das etwa heißen: Der Handel wird einfacher.","zh":"如果欧盟和加拿大加强合作，可能意味着：贸易变得更简单。","start":244.92,"end":254.4},{"de":"Oder das Militär aus Ländern von der EU hilft dem Militär von Kanada.","zh":"或者欧盟国家的军队帮助加拿大的军队。","start":255.28,"end":261.36},{"de":"Und andersherum.","zh":"反过来也是。","start":261.87,"end":263.11},{"de":"Die Idee finden viele Politiker in der EU gut.","zh":"很多欧盟政治家觉得这个想法好。","start":264.44,"end":268.24},{"de":"Deshalb gibt es im Parlament von der EU heute viel Applaus für Mark Carney.","zh":"所以今天欧盟议会里给了马克·卡尼很多掌声。","start":269.27,"end":275.19},{"de":"Und nun zur nächsten Nachricht: Russland führt Krieg gegen die Ukraine.","zh":"现在进入下一条新闻：俄罗斯在对乌克兰作战。","start":276.84,"end":285.23},{"de":"Der Krieg kostet sehr viel Geld.","zh":"这场战争花费非常多钱。","start":285.27,"end":287.55},{"de":"Russland verkauft etwa Öl und Gas an andere Länder.","zh":"俄罗斯向其他国家出售石油和天然气等。","start":287.67,"end":291.23},{"de":"Mit dem Geld kann Russland den Krieg bezahlen.","zh":"用这些钱俄罗斯可以支付战争。","start":291.67,"end":294.87},{"de":"Die EU hat nach dem Beginn von dem Krieg gesagt: Wir wollen Russland kein Geld für den Krieg geben.","zh":"欧盟在战争开始后说过：我们不想给俄罗斯用于战争的钱。","start":294.95,"end":302.07},{"de":"Wir kaufen kein Öl mehr aus Russland.","zh":"我们不再从俄罗斯购买石油。","start":302.23,"end":304.87},{"de":"Aber China und Indien kaufen immer noch Öl und Gas aus Russland.","zh":"但中国和印度仍在购买俄罗斯的石油和天然气。","start":304.91,"end":309.39},{"de":"Deshalb bekommt Russland weiter Geld.","zh":"所以俄罗斯继续获得资金。","start":309.75,"end":312.39},{"de":"Damit kann Russland weiter Krieg führen gegen die Ukraine.","zh":"俄罗斯用它继续对乌克兰作战。","start":312.91,"end":316.87},{"de":"Das Parlament in den USA will jetzt härtere Strafen gegen Russland.","zh":"美国议会现在想对俄罗斯实施更重的惩罚。","start":316.91,"end":321.63},{"de":"Das Haus von dem Parlament ist auf dem Foto.","zh":"照片上是议会中的一院。","start":321.67,"end":324.63},{"de":"Ein neues Gesetz sagt: Wer Russland Geld gibt, der wird bestraft.","zh":"一部新法律说：谁给俄罗斯钱，谁就会受到惩罚。","start":324.67,"end":329.23},{"de":"China und Indien sollen sich überlegen: Wollen wir weiter Öl und Gas aus Russland kaufen?","zh":"中国和印度应该考虑：我们要继续购买俄罗斯的石油和天然气吗？","start":329.59,"end":335.03},{"de":"Oder wollen wir weiter Geschäfte in den USA machen?","zh":"还是我们要继续在美国做生意？","start":335.07,"end":338.03},{"de":"Das Parlament in den USA hofft, so geht Russland das Geld aus.","zh":"美国议会希望，这样俄罗斯的钱会用完。","start":338.07,"end":342.63},{"de":"Und der Krieg gegen die Ukraine geht endlich zu Ende.","zh":"对乌克兰的战争也终于会结束。","start":342.95,"end":346.67},{"de":"Und nun zur nächsten Nachricht: Der Mann auf dem Foto heißt Jürgen Klopp.","zh":"现在进入下一条新闻：照片上的男人叫尤尔根·克洛普。","start":346.99,"end":355.43},{"de":"Er ist der neue Bundestrainer im Fußball.","zh":"他是足球界新的联邦队教练。","start":355.47,"end":358.31},{"de":"Das heißt: Klopp ist Trainer der deutschen Nationalmannschaft im Fußball.","zh":"意思是：克洛普是德国足球国家队的主教练。","start":359.03,"end":363.6},{"de":"Jetzt hat der Bundestrainer entschieden: Viele neue Spieler sollen in der Nationalmannschaft für Deutschland spielen.","zh":"现在联邦队教练做出了决定：许多新球员应该进入国家队为德国效力。","start":363.83,"end":370.79},{"de":"Dazu kommt jetzt ein Film: Viele Fans vom Fußball haben auf diesen Moment gewartet.","zh":"接下来是一段影片：很多球迷一直等待着这个时刻。","start":370.83,"end":378.07},{"de":"Jürgen Klopp präsentiert seine neuen Spieler.","zh":"尤尔根·克洛普介绍他的新球员。","start":378.11,"end":381.99},{"de":"Diese Spieler kann der Bundestrainer dann in der Nationalmannschaft spielen lassen.","zh":"联邦队教练之后可以安排这些球员上国家队比赛。","start":382.67,"end":388.35},{"de":"Jürgen Klopp sagt: Mit diesen Spielern wollen wir endlich wieder gewinnen.","zh":"尤尔根·克洛普说：我们要和这些球员一起终于重新获胜。","start":388.43,"end":394.11},{"de":"Die Nationalmannschaft von Deutschland hatte länger keinen Erfolg.","zh":"德国国家队已经较长时间没有成绩了。","start":394.43,"end":399.39},{"de":"Bald ist das erste Spiel von Jürgen Klopp als neuem Bundestrainer.","zh":"尤尔根·克洛普作为新任联邦队教练的第一场比赛快到了。","start":400.28,"end":405.03},{"de":"In dem Spiel soll Andre ter Stegen der Torwart sein.","zh":"那场比赛里安德烈·特尔施特根应该是守门员。","start":405.11,"end":409.87},{"de":"Und Joshua Kimmich soll der Kapitän sein.","zh":"约书亚·基米希应该是队长。","start":410.19,"end":413.39},{"de":"Viele von den neuen Spielern waren noch nie in der Nationalmannschaft.","zh":"这些新球员里的许多人还从未进过国家队。","start":413.71,"end":418.55},{"de":"Etwa Younes Ebnoutalib von dem Verein Eintracht Frankfurt oder Felix Keidel von der SV Elversberg.","zh":"比如法兰克福俱乐部的尤尼斯·埃布努塔利布，或者埃尔沃斯贝格的费利克斯·凯德尔。","start":418.63,"end":426.68},{"de":"Neue Spieler in der Mannschaft, das heißt auch: Manche alte Spieler sind nicht mehr dabei.","zh":"队伍里有新球员，也意味着：有些老球员不再在其中。","start":428.08,"end":435.07},{"de":"Deniz Undav oder Leroy Sane spielen erst mal nicht mehr für Deutschland.","zh":"德尼兹·温达夫和勒鲁瓦·萨内暂时不再为德国队踢球。","start":435.79,"end":441.36},{"de":"Und jetzt kommt das Wetter: Oben im Norden ist es windig und es scheint nicht so oft die Sonne.","zh":"现在是天气预报：最北边有风，太阳也不常露面。","start":460.83,"end":467.99},{"de":"Es kann auch mal regnen.","zh":"有时还会下雨。","start":468.03,"end":469.75},{"de":"Weiter unten im Süden bleibt es trocken.","zh":"再往南天气保持干燥。","start":470.11,"end":472.51},{"de":"Es werden 15 bis 24 Grad.","zh":"气温15到24度。","start":472.55,"end":475.55}],"stories":[{"title":"Diskussion über teure Benzin-Preise","title_zh":"关于高油价的讨论","from":0,"to":33,"vocab":[{"key":"benzin","lemma":"das Benzin","pos":"Substantiv","zh":"汽油","example_de":"Die meisten Autos in Deutschland fahren mit Benzin oder Diesel.","example_zh":""},{"key":"tanken","lemma":"tanken","pos":"Verb","zh":"加油","example_de":"Heißt, sie tanken.","example_zh":""},{"key":"tankstelle","lemma":"die Tankstelle, -n","pos":"Substantiv","zh":"加油站","example_de":"Die Autofahrer kaufen Benzin oder Diesel an einer Tankstelle.","example_zh":""},{"key":"steuer","lemma":"die Steuer, -n","pos":"Substantiv","zh":"税","example_de":"Sie sagt: Wir können die Steuern für Benzin und Diesel senken.","example_zh":""},{"key":"senken","lemma":"senken","pos":"Verb","zh":"降低","example_de":"Sie sagt: Wir können die Steuern für Benzin und Diesel senken.","example_zh":""},{"key":"herstellen","lemma":"herstellen","pos":"Verb","zh":"生产、制造","example_de":"Große Firmen stellen Benzin und Diesel her.","example_zh":""},{"key":"verdienen","lemma":"verdienen","pos":"Verb","zh":"赚钱、收入","example_de":"Diese Firmen verdienen mit dem hohen Preis gerade sehr viel Geld.","example_zh":""},{"key":"ministerin","lemma":"die Ministerin, -nen","pos":"Substantiv","zh":"（女）部长","example_de":"Die Ministerin für die Wirtschaft, Katharina Reiche von der Partei CDU, hat eine Idee.","example_zh":""},{"key":"experte","lemma":"der Experte, -n","pos":"Substantiv","zh":"专家","example_de":"Experten für Wirtschaft haben noch andere Ideen.","example_zh":""},{"key":"teuer","lemma":"teuer","pos":"Adjektiv","zh":"贵的","example_de":"Zurzeit ist das Tanken so teuer wie noch nie.","example_zh":""}],"grammar":[{"title":"deshalb + V2：因此","summary":"deshalb 表示「因此」，占句首第一位时动词仍紧跟在第二位，不助动词。","example_de":"Deshalb ist Öl so teuer.","example_zh":"所以石油这么贵。"},{"title":"nämlich：补充原因","summary":"nämlich 不放句首，用来为前一句补充原因，相当于「因为、正是由于」。","example_de":"Benzin und Diesel werden nämlich aus Öl gemacht.","example_zh":"因为汽油和柴油是用石油制造的。"}],"background":"背景：德国油价2026年创下新高，官方归因于中东战争导致的原油供应紧张。经济部长卡塔琳娜·赖歇（CDU）提议下调燃油税；社民党政治家阿尔芒·佐尔恩主张限制炼油企业利润；经济专家则认为全民补贴太贵，建议只对低收入人群定向发放燃油补贴。联邦政府尚未做出最终决定。"},{"title":"Kanada will mehr Zusammenarbeit mit der EU","title_zh":"加拿大想与欧盟加强合作","from":34,"to":46,"vocab":[{"key":"eu","lemma":"die Europäische Union (EU)","pos":"Substantiv","zh":"欧洲联盟（欧盟）","example_de":"Und nun zur nächsten Nachricht: Die Europäische Union ist eine Gruppe von Ländern in Europa.","example_zh":""},{"key":"zusammenarbeiten","lemma":"zusammenarbeiten","pos":"Verb","zh":"合作","example_de":"Jetzt will auch das Land Kanada mehr mit der EU zusammenarbeiten.","example_zh":""},{"key":"regierungschef","lemma":"der Regierungschef, -s","pos":"Substantiv","zh":"政府首脑（总理）","example_de":"Das hat der Chef von der Regierung in Kanada im Parlament von der Europäischen Union gesagt.","example_zh":""},{"key":"gemeinsam","lemma":"gemeinsam","pos":"Adjektiv","zh":"共同的","example_de":"Er sagt, die EU und Kanada haben gemeinsame Werte.","example_zh":""},{"key":"wert","lemma":"der Wert, -e","pos":"Substantiv","zh":"价值观、价值","example_de":"Er sagt, die EU und Kanada haben gemeinsame Werte.","example_zh":""},{"key":"handel","lemma":"der Handel","pos":"Substantiv","zh":"贸易","example_de":"Wenn die EU und Kanada mehr zusammenarbeiten, dann kann das etwa heißen: Der Handel wird einfacher.","example_zh":""},{"key":"militaer","lemma":"das Militär, -e","pos":"Substantiv","zh":"军队","example_de":"Oder das Militär aus Ländern von der EU hilft dem Militär von Kanada.","example_zh":""},{"key":"applaus","lemma":"der Applaus","pos":"Substantiv","zh":"掌声、鼓掌","example_de":"Deshalb gibt es im Parlament von der EU heute viel Applaus für Mark Carney.","example_zh":""},{"key":"parlament","lemma":"das Parlament, -e","pos":"Substantiv","zh":"议会","example_de":"Das hat der Chef von der Regierung in Kanada im Parlament von der Europäischen Union gesagt.","example_zh":""}],"grammar":[{"title":"wenn …, dann …：条件句","summary":"wenn 引导条件从句，动词放句尾；主句常用 dann 开头，动词回到第二位。","example_de":"Wenn die EU und Kanada mehr zusammenarbeiten, dann kann das etwa heißen:","example_zh":"如果欧盟和加拿大加强合作，可能意味着："}],"background":"背景：加拿大总理马克·卡尼2026年9月在欧洲议会发表演讲，主张加拿大与欧盟建立更紧密的伙伴关系，包括简化贸易和军事互助。卡尼曾任加拿大和英国两国央行行长，2025年就任总理。"},{"title":"USA beschließen härtere Strafen gegen Russland","title_zh":"美国通过针对俄罗斯的更重制裁","from":47,"to":62,"vocab":[{"key":"krieg","lemma":"der Krieg, -e","pos":"Substantiv","zh":"战争","example_de":"Und nun zur nächsten Nachricht: Russland führt Krieg gegen die Ukraine.","example_zh":""},{"key":"oel","lemma":"das Öl","pos":"Substantiv","zh":"石油","example_de":"Russland verkauft etwa Öl und Gas an andere Länder.","example_zh":""},{"key":"strafe","lemma":"die Strafe, -n","pos":"Substantiv","zh":"惩罚、制裁","example_de":"Das Parlament in den USA will jetzt härtere Strafen gegen Russland.","example_zh":""},{"key":"haerter","lemma":"härter","pos":"Adjektiv","zh":"更严厉的（hart 的比较级）","example_de":"Das Parlament in den USA will jetzt härtere Strafen gegen Russland.","example_zh":""},{"key":"gesetz","lemma":"das Gesetz, -e","pos":"Substantiv","zh":"法律","example_de":"Ein neues Gesetz sagt: Wer Russland Geld gibt, der wird bestraft.","example_zh":""},{"key":"bestrafen","lemma":"bestrafen","pos":"Verb","zh
