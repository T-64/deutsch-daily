    <script id="dd-data" type="application/json">{"page":"lesson","lesson":{"slug":"2026-11-09","date":"2026-11-09","show":"tagesschau in Einfacher Sprache","level":"A2–B1","kind":"broadcast","note":"","source_url":"https://www.tagesschau.de/tagesschau_in_einfacher_sprache/tse-1504.html","video":{"mp4":"https://tagesschau-progressive.ard-mcdn.de/video/2026/1109/TV-20261109-1735-2800.webl.h264.mp4","embed":"","page":"https://www.tagesschau.de/tagesschau_in_einfacher_sprache/video-1680882.html"},"duration":366.72,"sentences":[{"de":"Willkommen zur tagesschau in Einfacher Sprache.","zh":"欢迎收看《简单语言新闻》。","start":8.6,"end":11.8},{"de":"Ich bin Susanne Holst und das sind unsere Nachrichten.","zh":"我是苏珊娜·霍尔斯特，以下是我们的新闻。","start":12.0,"end":15.8},{"de":"CDU: Aigner soll Bundespräsidentin werden.","zh":"基民盟：艾格纳将出任联邦总统。","start":16.56,"end":19.76},{"de":"Türkei: Beginn von Weltklimakonferenz.","zh":"土耳其：世界气候大会开始。","start":20.48,"end":24.0},{"de":"Gazastreifen: Tote nach Überschwemmungen.","zh":"加沙地带：洪水造成人员死亡。","start":24.56,"end":27.4},{"de":"9. November: Gedenken an Mauerfall.","zh":"11月9日：纪念柏林墙倒塌。","start":28.72,"end":31.96},{"de":"Und nun zur 1. Nachricht.","zh":"现在播报第一条新闻。","start":33.04,"end":35.76},{"de":"Der Bundespräsident ist der ranghöchste Politiker von Deutschland.","zh":"联邦总统是德国职位最高的政治人物。","start":41.6,"end":45.88},{"de":"Er vertritt z.B. Deutschland in anderen Ländern auf der Welt.","zh":"例如，他代表德国与世界其他国家交往。","start":46.56,"end":50.68},{"de":"Und er muss jedes Gesetz in Deutschland unterschreiben.","zh":"而且德国的每一部法律都必须由他签署。","start":51.2,"end":54.72},{"de":"Sonst gilt das Gesetz nicht.","zh":"否则法律不生效。","start":54.76,"end":56.76},{"de":"Bald wird der Bundespräsident neu gewählt.","zh":"不久后将重新选举联邦总统。","start":57.68,"end":60.6},{"de":"Die Parteien CDU und CSU wollen dafür eine Frau.","zh":"基民盟和基社盟两党希望由一位女性担任这一职务。","start":61.4,"end":65.0},{"de":"Das wurde jetzt beschlossen.","zh":"这一点刚刚被决定。","start":66.28,"end":68.28},{"de":"Ilse Aigner soll Bundespräsidentin werden.","zh":"伊尔泽·艾格纳将出任联邦总统。","start":68.8,"end":71.48},{"de":"Sie ist auf dem Foto.","zh":"她就在这张照片上。","start":71.52,"end":73.04},{"de":"Wer ist Ilse Aigner?","zh":"伊尔泽·艾格纳是谁？","start":73.76,"end":75.2},{"de":"Dazu kommt jetzt ein Film.","zh":"接下来播放一段影片介绍。","start":75.68,"end":77.52},{"de":"Hier ist Ilse Aigner mit Bundeskanzler Merz.","zh":"这是伊尔泽·艾格纳和联邦总理默茨在一起。","start":79.0,"end":82.56},{"de":"Merz sagt:","zh":"默茨说：","start":82.68,"end":83.8},{"de":"Wir von den Parteien CDU und CSU wollen, dass Aigner Bundespräsidentin wird.","zh":"我们基民盟和基社盟两党希望艾格纳成为联邦总统。","start":83.84,"end":89.52},{"de":"Sie ist dafür sehr gut geeignet.","zh":"她非常适合担任这一职务。","start":89.56,"end":92.12},{"de":"Ilse Aigner sagt:","zh":"伊尔泽·艾格纳说：","start":92.72,"end":94.2},{"de":"Ich möchte gerne eine Bundespräsidentin für alle Menschen in Deutschland sein.","zh":"我想成为服务于德国所有人的联邦总统。","start":94.52,"end":99.4},{"de":"Ilse Aigner ist Politikerin aus dem Bundesland Bayern.","zh":"伊尔泽·艾格纳是来自巴伐利亚州的政治家。","start":100.08,"end":103.68},{"de":"Sie ist 61 Jahre alt.","zh":"她61岁。","start":103.72,"end":105.76},{"de":"Aigner hat früher eine Ausbildung zur Elektrotechnikerin gemacht.","zh":"艾格纳早年接受过电气技术员的职业培训。","start":106.36,"end":110.76},{"de":"Vor einigen Jahren war sie Ministerin in der Bundesregierung von Angela Merkel.","zh":"几年前，她曾在安格拉·默克尔的联邦政府中担任部长。","start":111.48,"end":116.52},{"de":"Und hier könnte Aigner in Zukunft arbeiten:","zh":"艾格纳未来可能在这里工作：","start":117.6,"end":120.76},{"de":"Im Bundespräsidialamt.","zh":"在联邦总统府。","start":120.8,"end":122.8},{"de":"Bisher waren nur Männer Bundespräsident von Deutschland.","zh":"迄今为止，德国的联邦总统都只有男性。","start":123.6,"end":128.04},{"de":"Ilse Aigner könnte die erste Frau werden.","zh":"伊尔泽·艾格纳可能成为第一位女性联邦总统。","start":128.2,"end":131.12},{"de":"Ende Januar wird gewählt.","zh":"一月底将进行选举。","start":131.32,"end":133.28},{"de":"Und nun zur nächsten Nachricht.","zh":"现在播报下一条新闻。","start":135.56,"end":137.84},{"de":"In dem Land Türkei treffen sich gerade Politiker und Wissenschaftler aus vielen Ländern.","zh":"在土耳其，来自许多国家的政治家和科学家正在会面。","start":141.96,"end":148.52},{"de":"Dort hat nämlich die Weltklimakonferenz begonnen.","zh":"因为世界气候大会在那里开始了。","start":148.92,"end":152.36},{"de":"Die Teilnehmer beraten über das Klima auf der Welt.","zh":"与会者们商讨世界气候问题。","start":153.16,"end":156.72},{"de":"Klima ist das Wetter in einem langen Zeitraum.","zh":"气候是指很长一段时间内的天气情况。","start":157.04,"end":160.64},{"de":"Wissenschaftler haben herausgefunden, das Klima wandelt, verändert sich.","zh":"科学家们发现，气候正在转变、发生变化。","start":161.4,"end":168.04},{"de":"Das bedeutet, auf der Erde wird es wärmer.","zh":"这意味着地球正在变暖。","start":168.56,"end":171.6},{"de":"Das ist gefährlich für die Natur und für die Menschen.","zh":"这对自然和人类都很危险。","start":172.0,"end":175.8},{"de":"Deshalb sprechen die Teilnehmer auf der Weltklimakonferenz darüber, wie kann verhindert werden, dass es immer wärmer wird.","zh":"因此，世界气候大会的与会者们讨论如何阻止地球不断变暖。","start":176.68,"end":185.4},{"de":"Über Lösungen für das Problem wird auf der Weltklimakonferenz in den nächsten zwei Wochen beraten.","zh":"在接下来的两周里，世界气候大会将商讨这一问题的解决方案。","start":185.88,"end":192.48},{"de":"Nun zur nächsten Nachricht.","zh":"现在播报下一条新闻。","start":193.76,"end":195.68},{"de":"Der Gazastreifen ist neben dem Land Israel.","zh":"加沙地带位于以色列旁边。","start":200.44,"end":203.64},{"de":"Im Gazastreifen war lange Krieg.","zh":"加沙地带曾长期处于战争状态。","start":204.4,"end":206.76},{"de":"Israel hat dort gegen palästinensische Terroristen gekämpft.","zh":"以色列在那里与巴勒斯坦恐怖分子作战。","start":207.28,"end":211.48},{"de":"Sehr viele Häuser wurden durch den Krieg zerstört.","zh":"非常多的房屋在战争中被摧毁。","start":212.04,"end":215.56},{"de":"Deshalb wohnen viele Menschen im Gazastreifen in Zelten.","zh":"因此，加沙地带的许多人住在帐篷里。","start":215.68,"end":219.84},{"de":"Jetzt hat es dort lange und viel geregnet.","zh":"现在那里下了很久的大雨。","start":220.72,"end":224.2},{"de":"Dazu zeigen wir einen kurzen Film.","zh":"为此我们播放一段短片。","start":224.84,"end":227.28},{"de":"Durch den Regen gibt es Überschwemmungen im Gazastreifen.","zh":"大雨导致加沙地带发生洪水。","start":227.84,"end":231.4},{"de":"Das Wasser ist bis in die Zelte von den Menschen gelaufen.","zh":"水一直流进了人们的帐篷里。","start":231.44,"end":235.4},{"de":"Dabei sind auch Menschen ertrunken, also gestorben.","zh":"有人因此溺水身亡。","start":235.44,"end":239.36},{"de":"Viele Menschen können jetzt nicht mehr in den Zelten wohnen.","zh":"许多人现在无法再住在帐篷里。","start":240.08,"end":243.76},{"de":"Mehr als eine Million Menschen im Gazastreifen haben kein Zuhause mehr.","zh":"加沙地带有一百多万人失去了家园。","start":243.84,"end":249.56},{"de":"Und nun zur nächsten Nachricht.","zh":"现在播报下一条新闻。","start":251.32,"end":253.52},{"de":"Deutschland war früher in zwei Länder geteilt.","zh":"德国以前被分成两个国家。","start":257.92,"end":261.48},{"de":"Es gab die Bundesrepublik Deutschland im Westen und die Deutsche Demokratische Republik, kurz DDR, im Osten.","zh":"西边是德意志联邦共和国，东边是德意志民主共和国，简称东德。","start":261.8,"end":270.52},{"de":"Die Menschen in der DDR waren nicht frei.","zh":"东德的人们不自由。","start":271.64,"end":275.56},{"de":"Sie durften z.B. nicht überall hinreisen.","zh":"例如，他们不允许去所有地方旅行。","start":275.88,"end":279.04},{"de":"Die DDR hatte eine Mauer gebaut.","zh":"东德修建了一堵墙。","start":279.12,"end":282.0},{"de":"Die Mauer sieht man auf dem Foto.","zh":"照片上就是这堵墙。","start":282.6,"end":284.96},{"de":"Die Menschen in der DDR sollten nicht in den anderen Teil von Deutschland gehen.","zh":"东德的人们不应该去德国的另一边。","start":285.36,"end":291.0},{"de":"Dagegen haben viele protestiert.","zh":"许多人对此进行了抗议。","start":291.48,"end":293.52},{"de":"Sie wollten ein anderes, freies Leben.","zh":"他们想要另一种自由的生活。","start":293.56,"end":297.24},{"de":"Am 9. November 1989 sind viele Menschen zur Mauer gekommen.","zh":"1989年11月9日，许多人来到墙边。","start":298.12,"end":303.08},{"de":"Die Polizei von der DDR hat die Menschen dann durchgelassen.","zh":"东德的警察随后放行了这些人。","start":305.0,"end":309.2},{"de":"Sie sind auf die Mauer geklettert und haben gefeiert.","zh":"他们爬上墙并庆祝。","start":310.12,"end":313.76},{"de":"Das ist auf diesem Foto.","zh":"这张照片记录的就是这一幕。","start":313.8,"end":315.52},{"de":"Die Mauer hat die Menschen nicht mehr getrennt.","zh":"这堵墙不再把人们分隔开。","start":316.56,"end":319.72},{"de":"Deshalb wird am 9. November an den Fall der Mauer in Deutschland erinnert.","zh":"因此，德国在11月9日这一天纪念柏林墙倒塌。","start":319.76,"end":325.8},{"de":"Und das waren unsere Nachrichten.","zh":"以上就是我们的新闻。","start":326.76,"end":329.12},{"de":"Und jetzt kommt das Wetter.","zh":"现在播报天气预报。","start":346.84,"end":348.84},{"de":"Im Süden, ganz unten, und im Osten, rechts von Deutschland, kann es Regen geben.","zh":"在最南边和东边（德国右侧）可能有雨。","start":349.4,"end":355.24},{"de":"Sonst ist es meist trocken.","zh":"其他大部分地区天气干燥。","start":355.48,"end":357.4},{"de":"Es werden 4 bis 13 Grad.","zh":"气温为4至13度。","start":357.76,"end":360.04},{"de":"Das war die tagesschau in Einfacher Sprache.","zh":"以上就是今天的《简单语言新闻》。","start":361.52,"end":364.52},{"de":"Tschüss, bis zum nächsten Mal.","zh":"再见，下次见。","start":364.56,"end":366.72}],"stories":[{"title":"Begrüßung","title_zh":"欢迎","from":0,"to":6,"vocab":[],"grammar":[],"background":""},{"title":"CDU: Aigner soll Bundespräsidentin werden","title_zh":"基民盟：艾格纳将出任联邦总统","from":7,"to":33,"vocab":[{"key":"bundespraesident","lemma":"der Bundespräsident, -en","pos":"Substantiv","zh":"联邦总统","example_de":"Der Bundespräsident ist der ranghöchste Politiker von Deutschland.","example_zh":"联邦总统是德国职位最高的政治人物。"},{"key":"waehlen","lemma":"wählen","pos":"Verb","zh":"选举","example_de":"Bald wird der Bundespräsident neu gewählt.","example_zh":"不久后将重新选举联邦总统。"},{"key":"ausbildung","lemma":"die Ausbildung, -en","pos":"Substantiv","zh":"职业培训","example_de":"Aigner hat früher eine Ausbildung zur Elektrotechnikerin gemacht.","example_zh":"艾格纳早年接受过电气技术员的职业培训。"},{"key":"geeignet","lemma":"geeignet","pos":"Adjektiv","zh":"合适的","example_de":"Sie ist dafür sehr gut geeignet.","example_zh":"她非常适合担任这一职务。"},{"key":"ministerin","lemma":"die Ministerin, -nen","pos":"Substantiv","zh":"女部长","example_de":"Vor einigen Jahren war sie Ministerin in der Bundesregieru
