<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Deutsch Daily — __DATE__</title>
<style>
  :root {
    --bg: #eef2f0;
    --surface: #ffffff;
    --surface-2: #f7f9f8;
    --ink: #172127;
    --ink-soft: #647077;
    --line: #dce4e1;
    --accent: #176b72;
    --accent-strong: #0d5057;
    --accent-soft: #dceeed;
    --warm: #d98f39;
    --warm-soft: #fff0d9;
    --zh: #5f696f;
    --danger: #b3493f;
    --shadow: 0 18px 50px rgba(20, 46, 47, .10);
    --shadow-soft: 0 8px 24px rgba(20, 46, 47, .07);
  }
  [data-theme="dark"] {
    --bg: #111719; --surface: #192124; --surface-2: #202a2d;
    --ink: #edf3f1; --ink-soft: #a9b7b8; --line: #344145;
    --accent: #75cbd0; --accent-strong: #99dfe2; --accent-soft: #223e40;
    --warm: #f0b35e; --warm-soft: #3b3022; --zh: #bac5c5;
    --shadow: 0 18px 50px rgba(0,0,0,.28); --shadow-soft: 0 8px 24px rgba(0,0,0,.22);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { scroll-behavior: smooth; scroll-padding-top: 90px; }
  body {
    min-height: 100vh; background: var(--bg); color: var(--ink);
    font: 16px/1.65 Inter, ui-sans-serif, system-ui, -apple-system, "Noto Sans SC", sans-serif;
    transition: background .2s, color .2s;
  }
  button, input, textarea { font: inherit; }
  button, a { -webkit-tap-highlight-color: transparent; }
  button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible {
    outline: 3px solid color-mix(in srgb, var(--accent) 35%, transparent); outline-offset: 2px;
  }
  .app { width: min(1280px, calc(100% - 48px)); margin: 0 auto; padding: 24px 0 100px; }
  .topbar {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    min-height: 42px; margin-bottom: 34px;
  }
  .brand {
    display: inline-flex; align-items: center; gap: 10px; color: var(--ink);
    font-weight: 800; letter-spacing: -.02em; text-decoration: none;
  }
  .brand-mark {
    display: grid; place-items: center; width: 30px; height: 30px; border-radius: 9px;
    background: var(--accent); color: #fff; font: 800 12px/1 ui-monospace, monospace;
  }
  .top-actions { display: flex; align-items: center; gap: 8px; }
  .icon-btn, .archive-link {
    min-height: 38px; border: 1px solid var(--line); border-radius: 12px;
    background: var(--surface); color: var(--ink-soft); cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; text-decoration: none;
  }
  .icon-btn { width: 38px; }
  .archive-link { gap: 7px; padding: 0 13px; font-size: 13px; font-weight: 700; }
  .hero { margin-bottom: 26px; }
  .eyebrow {
    color: var(--accent); font-size: 12px; font-weight: 800; letter-spacing: .12em;
    text-transform: uppercase; margin-bottom: 9px;
  }
  .hero h1 {
    max-width: 720px; font: 750 clamp(29px, 4vw, 50px)/1.08 ui-serif, Georgia, serif;
    letter-spacing: -.04em;
  }
  .hero-meta { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 13px; color: var(--ink-soft); font-size: 14px; }
  .hero-meta span { display: inline-flex; align-items: center; gap: 7px; }

  .study-grid { display: grid; grid-template-columns: 272px minmax(0, 1fr); gap: clamp(20px, 3.2vw, 48px); align-items: start; }
  .side {
    position: sticky; top: 16px; max-height: calc(100vh - 24px);
    display: flex; flex-direction: column; min-height: 0;
  }
  .study-panel {
    display: flex; flex-direction: column; min-height: 0; max-height: calc(100vh - 24px);
    border: 1px solid var(--line); border-radius: 16px;
    background: var(--surface); box-shadow: var(--shadow-soft); overflow: hidden;
  }
  .video-card { position: relative; flex: 0 0 auto; overflow: hidden; background: #071012; }
  .player { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #071012; }
  .player iframe, .player video { position: absolute; inset: 0; display: block; width: 100%; height: 100%; border: 0; background: #071012; }
  .video-float-close {
    display: none; border: 0; background: rgba(255,255,255,.12); color: #fff;
    width: 28px; height: 28px; border-radius: 50%; cursor: pointer;
  }
  .rail { display: flex; flex-direction: column; flex: 1; min-height: 0; }
  .rail-bar { display: flex; align-items: center; gap: 8px; padding: 8px 10px 6px; }
  .controls { display: flex; gap: 6px; flex: 0 0 auto; }
  .controls button {
    min-height: 28px; padding: 0 10px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--surface-2); color: var(--ink-soft); cursor: pointer; font-size: 12px; font-weight: 750;
  }
  .controls button.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-strong); }
  .story-pills { display: flex; flex: 1; justify-content: flex-end; flex-wrap: wrap; gap: 3px; }
  .story-pills a {
    display: grid; place-items: center; width: 22px; height: 22px; border-radius: 6px;
    background: var(--surface-2); color: var(--ink-soft); text-decoration: none;
    font: 750 11px/1 ui-monospace, ui-sans-serif, monospace;
  }
  .story-pills a:hover { color: var(--accent-strong); }
  .story-pills a.on { background: var(--accent); color: #fff; }
  .rail-now {
    margin: 0 10px 8px; color: var(--ink-soft); font-size: 12px; line-height: 1.35;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .hero-meta a { color: var(--accent); text-decoration: none; font-weight: 700; }
  .hero-meta a:hover { text-decoration: underline; }
  .study-extras {
    min-height: 0; overflow-y: auto; padding: 0 8px 10px;
    border-top: 1px solid var(--line);
  }
  .study-extras .empty-study { color: var(--ink-soft); font-size: 12px; padding: 8px 4px; }
  .vlist { display: grid; grid-template-columns: 1fr 1fr; column-gap: 2px; }
  .vrow {
    display: grid; grid-template-columns: minmax(0,1fr) 20px;
    gap: 0 4px; align-items: center; padding: 5px 4px 6px;
    border-bottom: 1px solid var(--line);
  }
  .vrow:nth-last-child(-n+2) { border-bottom: 0; }
  .vrow .vw { overflow: hidden; grid-column: 1; color: var(--ink); font: 650 12.5px/1.25 ui-serif, Georgia, serif; text-overflow: ellipsis; white-space: nowrap; }
  .vrow .vz { overflow: hidden; grid-column: 1; color: var(--ink-soft); font-size: 11px; line-height: 1.2; text-overflow: ellipsis; white-space: nowrap; }
  .vadd {
    grid-column: 2; grid-row: 1 / span 2; align-self: center;
    width: 22px; height: 22px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--surface-2); color: var(--accent-strong); cursor: pointer;
    font: 700 15px/1 ui-sans-serif, system-ui;
  }
  .vadd:hover { border-color: var(--accent); background: var(--accent-soft); }
  .rail-notes { margin-top: 4px; padding-top: 2px; }
  .rail-note { margin: 0; border: 0; background: transparent; }
  .rail-note summary {
    list-style: none; cursor: pointer; padding: 5px 2px; color: var(--ink-soft);
    font-size: 12px; font-weight: 650;
  }
  .rail-note summary::-webkit-details-marker { display: none; }
  .rail-note .body { padding: 0 2px 8px; color: var(--ink-soft); font-size: 12px; line-height: 1.5; }
  @media (min-width: 841px) { .article-extras { display: none; } }

  .reader { min-width: 0; }
  .reader-tip {
    display: flex; align-items: center; justify-content: space-between; gap: 14px;
    margin-bottom: 14px; color: var(--ink-soft); font-size: 13px;
  }
  .reader-tip button {
    flex: 0 0 auto; border: 0; background: transparent; color: var(--accent);
    font-weight: 750; cursor: pointer;
  }
  article {
    scroll-margin-top: 24px; margin-bottom: 22px; padding: clamp(22px, 4vw, 38px);
    border: 1px solid var(--line); border-radius: 24px; background: var(--surface);
    box-shadow: var(--shadow-soft);
  }
  .n-head { display: grid; grid-template-columns: 42px minmax(0,1fr); gap: 13px; align-items: start; margin-bottom: 24px; }
  .n-idx {
    display: grid; place-items: center; width: 42px; height: 42px; border-radius: 13px;
    background: var(--accent-soft); color: var(--accent-strong); font: 800 13px/1 ui-monospace, monospace;
  }
  .n-head h2 { padding-top: 3px; font: 750 clamp(21px, 3vw, 28px)/1.25 ui-serif, Georgia, serif; letter-spacing: -.025em; }
  .para { margin-bottom: 23px; }
  .para:last-of-type { margin-bottom: 10px; }
  .de {
    font: var(--reader-size, 18.5px)/1.82 ui-serif, Georgia, "Noto Serif", serif;
    letter-spacing: .003em;
  }
  .de w {
    cursor: pointer; border-radius: 4px; transition: background .12s, color .12s;
    text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px;
    text-decoration-color: transparent;
  }
  .de w:hover, .de w:active { background: var(--warm-soft); text-decoration-color: var(--warm); }
  .de w.known { text-decoration-color: color-mix(in srgb, var(--accent) 55%, transparent); }
  .de w.ed { text-decoration-style: solid; text-decoration-thickness: 1.5px; }
  .de w.wiki { text-decoration-style: dotted; text-decoration-color: color-mix(in srgb, var(--ink-soft) 55%, transparent); }
  .de w.saved { color: var(--accent-strong); background: var(--accent-soft); text-decoration-color: transparent; }
  .para { display: grid; grid-template-columns: 52px minmax(0,1fr); gap: 10px; align-items: start; }
  .seek {
    margin-top: 4px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--surface-2); color: var(--accent-strong);
    padding: 4px 0; font: 750 11px/1 ui-monospace, monospace; cursor: pointer;
  }
  .seek:disabled { opacity: .35; cursor: default; }
  .para.now .de { background: color-mix(in srgb, var(--accent-soft) 70%, transparent); border-radius: 6px; }
  .zh {
    margin-top: 9px; padding: 10px 13px; border-left: 3px solid var(--warm);
    border-radius: 0 9px 9px 0; background: var(--surface-2); color: var(--zh);
    font-size: 14px; line-height: 1.72;
  }
  body.hide-zh .zh { display: none; }
  .article-extras details { margin-top: 10px; border: 1px solid var(--line); border-radius: 13px; background: var(--surface-2); }
  .article-extras details summary {
    list-style: none; cursor: pointer; padding: 12px 14px; color: var(--ink-soft);
    display: flex; align-items: center; gap: 9px; font-size: 13px; font-weight: 750;
  }
  .article-extras details summary::before {
    content: "+"; display: inline-grid; place-items: center; width: 20px; height: 20px;
    border-radius: 7px; background: var(--surface); color: var(--accent); font-size: 14px;
  }
  .article-extras details[open] summary::before { content: "−"; }
  .article-extras details summary::-webkit-details-marker { display: none; }
  .article-extras details .body { padding: 2px 14px 15px 43px; color: var(--ink-soft); font-size: 13.5px; line-height: 1.75; }
  .article-extras details .body strong { color: var(--ink); }
  .vcard { display: grid; grid-template-columns: minmax(0,1fr) 28px; gap: 8px; align-items: start; padding: 10px 0; border-bottom: 1px dashed var(--line); }
  .vcard:last-child { border-bottom: 0; }
  .gcard { padding: 12px 0; border-bottom: 1px dashed var(--line); }
  .gcard:last-child { border-bottom: 0; }
  .vcard-top, .gcard h4 { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px; font: 750 14.5px/1.35 ui-serif, Georgia, serif; color: var(--ink); }
  .article-extras .vadd {
    width: 28px; height: 28px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--surface); color: var(--accent-strong); cursor: pointer;
    font: 700 18px/1 ui-sans-serif, system-ui;
  }
  .vpos { color: var(--ink-soft); font: 750 11px/1.2 ui-sans-serif, system-ui; letter-spacing: .06em; text-transform: uppercase; }
  .vzh { margin-top: 4px; color: var(--accent-strong); font-size: 13.5px; }
  .vex, .gex { margin-top: 6px; color: var(--ink-soft); font-size: 13px; font-style: italic; }
  .gexzh { color: var(--zh); font-size: 12.5px; }
  .gmore { margin-top: 8px; color: var(--ink-soft); font-size: 13px; }
  .bg-note { margin: 0 0 8px; color: var(--ink-soft); font-size: 12px; }

  .scrim { position: fixed; inset: 0; z-index: 55; display: none; background: rgba(7,16,18,.48); backdrop-filter: blur(3px); }
  .scrim.on { display: block; }
  #pop {
    position: fixed; z-index: 70; display: none; width: min(360px, calc(100vw - 24px));
    border: 1px solid var(--line); border-radius: 18px; padding: 18px;
    background: var(--surface); color: var(--ink); box-shadow: var(--shadow);
  }
  #pop.open { display: block; }
  .pop-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  #pop .pw { font: 750 21px/1.2 ui-serif, Georgia, serif; word-break: break-word; }
  #pop .pp { margin-top: 3px; color: var(--ink-soft); font-size: 11px; font-weight: 750; letter-spacing: .08em; text-transform: uppercase; }
  #pop .pclose { border: 0; background: var(--surface-2); color: var(--ink-soft); width: 30px; height: 30px; border-radius: 9px; cursor: pointer; }
  #pop .pz { margin-top: 12px; color: var(--accent-strong); font-weight: 700; }
  #pop .pz:empty::after { content: "还没有释义，你可以自己补充"; color: var(--ink-soft); font-weight: 400; }
  #pop .pe { margin-top: 9px; padding-top: 9px; border-top: 1px solid var(--line); color: var(--ink-soft); font-size: 12.5px; font-style: italic; }
  .pop-actions { display: flex; gap: 8px; margin-top: 14px; }
  .pbtn, .secondary-btn, .primary-btn {
    min-height: 40px; border-radius: 11px; padding: 0 13px; cursor: pointer; font-size: 13px; font-weight: 750;
  }
  .pbtn { flex: 1; border: 1px solid var(--accent); background: var(--accent); color: #fff; }
  .pbtn.in { border-color: var(--line); background: var(--surface-2); color: var(--ink-soft); }
  .secondary-btn { border: 1px solid var(--line); background: var(--surface); color: var(--ink-soft); }
  .primary-btn { border: 1px solid var(--accent); background: var(--accent); color: #fff; }
  .word-form { display: grid; gap: 11px; }
  .word-form label { display: grid; gap: 5px; color: var(--ink-soft); font-size: 12px; font-weight: 700; }
  .word-form input, .word-form textarea {
    width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px;
    background: var(--surface-2); color: var(--ink); resize: vertical;
  }
  .word-form textarea { min-height: 66px; }
  .form-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 3px; }

  #basket-btn {
    position: fixed; right: 22px; bottom: max(22px, env(safe-area-inset-bottom)); z-index: 45;
    display: inline-flex; align-items: center; gap: 9px; min-height: 48px; padding: 0 18px;
    border: 0; border-radius: 15px; background: var(--ink); color: var(--surface);
    box-shadow: var(--shadow); cursor: pointer; font-weight: 800;
  }
  #basket-btn .cnt { min-width: 23px; padding: 2px 7px; border-radius: 99px; background: var(--warm); color: #172127; font-size: 12px; }
  #basket {
    position: fixed; inset: 0 0 0 auto; z-index: 65; width: min(440px, 100vw);
    display: flex; flex-direction: column; padding: 24px 24px calc(24px + env(safe-area-inset-bottom));
    background: var(--surface); box-shadow: -20px 0 60px rgba(7,16,18,.18);
    transform: translateX(105%); transition: transform .22s ease;
  }
  #basket.open { transform: translateX(0); }
  #basket .bhead { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 16px; }
  #basket .bhead h3 { font-size: 22px; letter-spacing: -.02em; }
  #basket .bhead p { margin-top: 2px; color: var(--ink-soft); font-size: 12.5px; }
  #basket .bclose { border: 0; background: var(--surface-2); color: var(--ink-soft); width: 36px; height: 36px; border-radius: 11px; font-size: 20px; cursor: pointer; }
  .basket-add { width: 100%; margin-bottom: 12px; }
  #basket .blist { overflow-y: auto; flex: 1; padding-right: 4px; }
  .bitem { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 5px 10px; padding: 13px 0; border-bottom: 1px solid var(--line); }
  .bitem .bw { font: 750 16px/1.3 ui-serif, Georgia, serif; }
  .bitem .bz { grid-column: 1; color: var(--accent-strong); font-size: 13px; }
  .bitem .be { grid-column: 1; overflow: hidden; color: var(--ink-soft); font-size: 11.5px; text-overflow: ellipsis; white-space: nowrap; }
  .bitem-actions { grid-column: 2; grid-row: 1 / span 3; align-self: center; display: flex; gap: 3px; }
  .bitem-actions button { border: 0; background: transparent; color: var(--ink-soft); padding: 7px; cursor: pointer; font-size: 12px; }
  .bitem-actions .bx { color: var(--danger); }
  #basket .bfoot { display: flex; gap: 8px; margin-top: 14px; }
  #basket .bfoot button { flex: 1; }
  #basket .bfoot button:disabled { opacity: .5; cursor: wait; }
  #basket .bstatus { min-height: 18px; margin-top: 8px; color: var(--ink-soft); text-align: center; font-size: 12px; }
  .bempty { padding: 42px 14px; color: var(--ink-soft); text-align: center; font-size: 13px; }
  .bempty b { display: block; margin-bottom: 5px; color: var(--ink); font-size: 15px; }
  #word-editor {
    display: none; padding: 15px; margin-bottom: 12px; border: 1px solid var(--line);
    border-radius: 14px; background: var(--surface-2);
  }
  #word-editor.open { display: block; }
  #toast {
    position: fixed; left: 50%; bottom: 28px; z-index: 90; display: none;
    transform: translateX(-50%); padding: 10px 16px; border-radius: 12px;
    background: var(--ink); color: var(--surface); box-shadow: var(--shadow); font-size: 13px; font-weight: 700;
  }
  @media (max-width: 840px) {
    .app { width: min(100% - 28px, 720px); padding-top: 15px; }
    .topbar { margin-bottom: 24px; }
    .study-grid { display: block; }
    .side { position: static; max-height: none; margin-bottom: 18px; }
    .study-panel { display: contents; }
    .video-card { border-radius: 14px; box-shadow: var(--shadow); }
    .rail {
      position: sticky; top: 0; z-index: 30; margin: 10px 0 18px; padding: 8px 10px;
      border: 1px solid var(--line); border-radius: 14px; background: var(--surface);
    }
    .rail-bar { padding: 0; }
    .story-pills, .rail-now, .study-extras { display: none; }
    .video-card.floating {
      position: fixed; z-index: 48; top: 64px; right: 10px; width: min(48vw, 210px);
      border: 1px solid rgba(255,255,255,.2); border-radius: 13px; box-shadow: 0 18px 45px rgba(0,0,0,.28);
    }
    .video-card.floating .video-float-close { display: block; position: absolute; z-index: 2; top: 6px; right: 6px; }
    .video-card.float-off { display: none; }
    .reader-tip { margin-top: 13px; }
    article { border-radius: 20px; }
  }
  @media (max-width: 560px) {
    .app { width: 100%; padding: 12px 12px 88px; }
    .brand span:last-child { font-size: 14px; }
    .archive-link { width: 38px; padding: 0; font-size: 0; }
    .archive-link svg { width: 17px; }
    .hero { padding: 0 5px; margin-bottom: 18px; }
    .hero h1 { font-size: 30px; }
    .hero-meta { gap: 5px 14px; font-size: 12.5px; }
    .video-card { border-radius: 16px; }
    .controls { gap: 5px; }
    .controls button { min-height: 38px; font-size: 12px; }
    article { padding: 20px 17px; margin-bottom: 13px; border-radius: 18px; }
    .n-head { grid-template-columns: 34px minmax(0,1fr); gap: 10px; margin-bottom: 19px; }
    .n-idx { width: 34px; height: 34px; border-radius: 10px; font-size: 11px; }
    .n-head h2 { padding-top: 1px; font-size: 21px; }
    .de { font-size: var(--reader-size, 17.5px); line-height: 1.78; }
    .zh { font-size: 13.5px; }
    .article-extras details .body { padding-left: 14px; }
    .para { grid-template-columns: 44px minmax(0,1fr); gap: 8px; }
    #pop { left: 12px !important; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); top: auto !important; width: auto; }
    #basket-btn { right: 14px; bottom: max(14px, env(safe-area-inset-bottom)); min-height: 46px; }
    #basket { padding: 18px 17px calc(18px + env(safe-area-inset-bottom)); }
    #basket .bfoot { flex-direction: column; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
  }
</style>
</head>
<body>
<main class="app">
  <header class="topbar">
    <a class="brand" href="index.html" aria-label="返回往期列表">
      <span class="brand-mark">DD</span><span>Deutsch Daily</span>
    </a>
    <div class="top-actions">
      <button class="icon-btn" id="theme-btn" aria-label="切换深浅色" title="切换深浅色">◐</button>
      <a class="archive-link" href="index.html">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 7h16M6 3h12a2 2 0 0 1 2 2v2H4V5a2 2 0 0 1 2-2Zm0 4h12v14H6V7Zm4 4h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        往期
      </a>
    </div>
  </header>

  <section class="hero">
    <div class="eyebrow">Tagesschau in Einfacher Sprache</div>
    <h1 id="hdate"></h1>

<script>
const DATA = {"date": "2026-08-13", "video_page": "https://www.tagesschau.de/tagesschau_in_einfacher_sprache/video-1630762.html", "embed_url": "https://www.tagesschau.de/multimedia/sendung/tagesschau_in_einfacher_sprache/video-1630762~player.html", "mp4_url": "https://tagesschau-progressive.ard-mcdn.de/video/2026/0813/TV-20260813-1739-4100.webl.h264.mp4", "duration": 468.91, "news": [{"title": "Sonnenfinsternis: Himmel wird dunkel", "paras": [{"de": "In Europa gab es eine Sonnenfinsternis. Sie war besonders gut in Spanien zu sehen. Dort war der Himmel dunkel.", "zh": "欧洲发生了一次日食。在西班牙观测效果最好，那里天空变暗了。", "start": 34.87, "end": 50.19}, {"de": "Die Erde links, der Mond in der Mitte und die Sonne rechts. Sie waren in einer Linie. Der Mond hat die Sonne verdeckt. Wo der Kernschatten vom Mond auf der Erde war, war die Sonne ganz verdeckt — so wie in Spanien. Neben dem Kernschatten kam aber noch etwas Licht am Mond vorbei. Es gab einen Halbschatten — so wie in Deutschland.", "zh": "地球在左边，月球在中间，太阳在右边。它们排成了一条直线。月球遮住了太阳。月球本影落在地球上的地方，太阳被完全遮挡——就像在西班牙。本影旁边还有一些光绕过月球，形成半影——就像在德国。", "start": 50.39, "end": 79.79}, {"de": "Der Schatten ist über Grönland und Island bis nach Spanien gezogen, auf die Balearen-Inseln. Viele Menschen in Europa wollten die Sonnenfinsternis sehen, auch in Deutschland. Hier war die Sonnenfinsternis schwächer als in Spanien.", "zh": "阴影从格陵兰岛和冰岛一直延伸到西班牙的巴利阿里群岛。许多欧洲人想观看这次日食，德国也是如此。不过在德国，日食不如西班牙明显。", "start": 80.27, "end": 96.39}, {"de": "Diese Menschen sitzen auf einem Berg in der Mitte von Deutschland. Dort beobachten sie die Sonnenfinsternis. Manche haben eine extra Brille. Sie ist wichtig als Schutz gegen die Sonne. Manche haben sich einen Schutz selbst gebastelt.", "zh": "这些人坐在德国中部的一座山上观测日食。有些人戴了专门的观测眼镜，这很重要，可以保护眼睛。有些人自己做了防护工具。", "start": 96.43, "end": 120.15}, {"de": "Und dann ist es so weit. Von der Sonne ist nur noch ein Teil zu sehen. Es wird dunkler am Himmel. Eine Frau sagt: \"Als die Sonne weg war, war es kalt. Ich habe zum Glück einen warmen Pullover. Ich habe gedacht, die Sonne und der Himmel sind so groß. Und wir Menschen sind so klein.\"", "zh": "然后那一刻到了。太阳只剩下一部分可见。天空变得更暗。一位女士说：\"太阳消失时变冷了，幸好我穿了暖和毛衣。我觉得太阳和天空那么大，我们人类这么渺小。\"", "start": 123.83, "end": 148.39}, {"de": "Auch in der Stadt Berlin wollten die Menschen die Sonnenfinsternis sehen. Und auch in der Stadt München waren die Menschen deshalb gekommen. Alle haben etwas Besonderes erlebt. Bis zur nächsten großen Sonnenfinsternis dauert es in Deutschland noch lange. Sie ist im Jahr 2081.", "zh": "柏林和慕尼黑的人们也来观看日食。每个人都经历了特别的时刻。德国下一次大型日食要等到2081年。", "start": 150.35, "end": 177.27}], "vocab": [{"lemma": "die Sonnenfinsternis", "key": "sonnenfinsternis", "forms": ["Sonnenfinsternis", "die Sonnenfinsternis"], "pos": "", "zh": "日食", "example_de": "In Europa gab es eine Sonnenfinsternis.", "example_zh": ""}, {"lemma": "verdecken", "key": "verdecken", "forms": ["verdecken"], "pos": "Verb", "zh": "遮挡", "example_de": "Der Mond hat die Sonne verdeckt.", "example_zh": ""}, {"lemma": "der Kernschatten", "key": "kernschatten", "forms": ["Kernschatten", "der Kernschatten"], "pos": "", "zh": "本影", "example_de": "Wo der Kernschatten war, war die Sonne verdeckt.", "example_zh": ""}, {"lemma": "der Halbschatten", "key": "halbschatten", "forms": ["Halbschatten", "der Halbschatten"], "pos": "", "zh": "半影", "example_de": "Es gab einen Halbschatten.", "example_zh": ""}, {"lemma": "beobachten", "key": "beobachten", "forms": ["beobachten"], "pos": "Verb", "zh": "观察", "example_de": "Dort beobachten sie die Sonnenfinsternis.", "example_zh": ""}, {"lemma": "die Brille", "key": "brille", "forms": ["Brille", "die Brille"], "pos": "", "zh": "眼镜", "example_de": "Manche haben eine extra Brille.", "example_zh": ""}, {"lemma": "der Schutz", "key": "schutz", "forms": ["Schutz", "der Schutz"], "pos": "", "zh": "保护", "example_de": "Sie ist wichtig als Schutz gegen die Sonne.", "example_zh": ""}, {"lemma": "basteln", "key": "basteln", "forms": ["basteln"], "pos": "Verb", "zh": "手工制作", "example_de": "Manche haben sich einen Schutz selbst gebastelt.", "example_zh": ""}, {"lemma": "schwach", "key": "schwach", "forms": ["schwach"], "pos": "", "zh": "弱的", "example_de": "Hier war die Sonnenfinsternis schwächer.", "example_zh": ""}, {"lemma": "erleben", "key": "erleben", "forms": ["erleben"], "pos": "Verb", "zh": "经历", "example_de": "Alle haben etwas Besonderes erlebt.", "example_zh": ""}], "grammar_points": [{"title": "比较级", "summary": "比较级 —schwächer als— 形容词加 -er 构成比较级，用 als 连接：schwach → schwächer。\"Hier war die Sonnenfinsternis schwächer als in Spanien.\"（这里日食比西班牙更弱。）", "example_de": "Hier war die Sonnenfinsternis schwächer als in Spanien.", "example_zh": ""}, {"title": "sich etwas basteln（反身）", "summary": "sich etwas basteln（反身） sich (Dat.) etwas basteln = 给自己手工做某物。\"Manche haben sich einen Schutz selbst gebastelt.\"（有些人给自己做了防护。）", "example_de": "Manche haben sich einen Schutz selbst gebastelt.", "example_zh": ""}], "background": "2026年8月13日的日食全食带经过北欧和西班牙。德国大部分地区只能看到偏食。观测日食必须使用专门的日食眼镜，普通太阳镜不够安全。德国下一次能看到的日全食要等到2081年。"}, {"title": "Vor 65 Jahren: Mauer in Berlin gebaut", "paras": [{"de": "In Berlin gab es früher eine Mauer. Die Mauer hat die Stadt geteilt — in Ost und West. Der westliche Teil gehörte zur BRD. Das ist das kurze Wort für Bundesrepublik Deutschland. Der östliche Teil gehörte zur DDR. Das ist das kurze Wort für Deutsche Demokratische Republik.", "zh": "柏林以前有一堵墙，把城市分成东西两部分。西部属于联邦德国（BRD），东部属于民主德国（DDR）。", "start": 178.51, "end": 211.67}, {"de": "Die DDR hat die Mauer gebaut vor 65 Jahren, am 13. August 1961. Die Regierung von der DDR hat damals gesagt: \"Nur manche Menschen dürfen über die Grenze in den Westen reisen. Für die meisten Menschen sind Reisen in den Westen aber verboten.\" Deshalb wurden manche Familien getrennt. Und Freunde konnten sich nicht mehr besuchen.", "zh": "65年前，1961年8月13日，东德修建了这堵墙。东德政府说：\"只有少数人可以越境去西部。对大多数人来说，去西部是被禁止的。\"因此一些家庭被迫分离，朋友不能再见面。", "start": 212.31, "end": 239.59}, {"de": "Diese Aufnahmen sind von früher, deshalb sind sie Schwarz-Weiß. Soldaten von der DDR bauen die Mauer quer durch die Stadt Berlin. Die Mauer trennt Ost und West. In der Zeitung steht: \"Ost-Berlin ist abgeriegelt.\" Das bedeutet: niemand kann über die Grenze in den Westen.", "zh": "这些影像是以前的，所以是黑白的。东德士兵在柏林城中建墙。报纸上写着：\"东柏林已被封锁。\"意思是没人能越境去西部。", "start": 239.71, "end": 267.23}, {"de": "Der Mann links ist Walter Ulbricht. Er war der Chef von der DDR. Er hat gesagt: \"Niemand baut eine Mauer.\" Das war aber gelogen.", "zh": "左边那个人是瓦尔特·乌布利希，东德的领导人。他曾说\"没人要建墙\"——但那是谎言。", "start": 267.99, "end": 279.63}, {"de": "Die Mauer hat plötzlich Familien und Freunde getrennt. Viele Menschen sind aus dem Osten in den Westen geflohen. Die Flucht aus der DDR war schwierig und gefährlich. Viele Menschen sind dabei gestorben. Trotzdem haben Menschen immer wieder versucht, über die Grenze zu kommen — zum Beispiel mit einer Leiter, durch einen Tunnel, oder mit dem Auto.", "zh": "这堵墙突然将家庭和朋友分开。许多人从东部逃到西部。出逃困难而危险，许多人在此过程中丧生。尽管如此，人们还是不断尝试越境——用梯子、挖隧道或开车。", "start": 280.15, "end": 316.75}, {"de": "Die Mauer stand 28 Jahre lang. 1989 ist die Mauer gefallen. Die Menschen aus der DDR durften über die Grenze in den Westen kommen.", "zh": "墙矗立了28年。1989年柏林墙倒塌。东德人民终于可以越境来到西部。", "start": 317.19, "end": 330.31}], "vocab": [{"lemma": "die Mauer", "key": "mauer", "forms": ["Mauer", "die Mauer"], "pos": "", "zh": "墙", "example_de": "In Berlin gab es früher eine Mauer.", "example_zh": ""}, {"lemma": "teilen", "key": "teilen", "forms": ["teilen"], "pos": "Verb", "zh": "分割", "example_de": "Die Mauer hat die Stadt geteilt.", "example_zh": ""}, {"lemma": "gehören zu", "key": "gehören-zu", "forms": ["gehören zu"], "pos": "", "zh": "属于", "example_de": "Der westliche Teil gehörte zur BRD.", "example_zh": ""}, {"lemma": "die Grenze", "key": "grenze", "forms": ["Grenze", "die Grenze"], "pos": "", "zh": "边界", "example_de": "Niemand kann über die Grenze.", "example_zh": ""}, {"lemma": "verboten", "key": "verboten", "forms": ["verboten"], "pos": "Verb", "zh": "被禁止的", "example_de": "Reisen in den Westen sind verboten.", "example_zh": ""}, {"lemma": "trennen", "key": "trennen", "forms": ["trennen"], "pos": "Verb", "zh": "分离", "example_de": "Deshalb wurden Familien getrennt.", "example_zh": ""}, {"lemma": "abriegeln", "key": "abriegeln", "forms": ["abriegeln"], "pos": "Verb", "zh": "封锁", "example_de": "Ost-Berlin ist abgeriegelt.", "example_zh": ""}, {"lemma": "fliehen", "key": "fliehen", "forms": ["fliehen"], "pos": "Verb", "zh": "逃跑", "example_de": "Viele sind in den Westen geflohen.", "example_zh": ""}, {"lemma": "die Flucht", "key": "flucht", "forms": ["Flucht", "die Flucht"], "pos": "", "zh": "逃跑", "example_de": "Die Flucht war gefährlich.", "example_zh": ""}, {"lemma": "gefährlich", "key": "gefährlich", "forms": ["gefährlich"], "pos": "", "zh": "危险的", "example_de": "Die Flucht war gefährlich.", "example_zh": ""}], "grammar_points": [{"title": "被动语态", "summary": "被动语态 — wurden getrennt werden + 过去分词 = 被动语态（过去时用 wurden）。\"Deshalb wurden manche Familien getrennt.\"（一些家庭被分离了。）= 英语 \"were separated\"。", "example_de": "Deshalb wurden manche Familien getrennt.", "example_zh": ""}, {"title": "dürfen", "summary": "dürfen — 允许/可以 \"Nur manche Menschen dürfen über die Grenze reisen.\"（只有部分人被允许越境旅行。）dürfen 的否定 = nicht dürfen = 不被允许/禁止。", "example_de": "Nur manche Menschen dürfen über die Grenze reisen.", "example_zh": ""}], "background": "1961年8月13日，东德在一夜之间开始修建柏林墙，将柏林分为东西两部分。东德官方称其为\"反法西斯防卫墙\"，实际目的是阻止居民逃往西方。墙存在28年间（1961-1989），至少140人在尝试越境时死亡。1989年11月9日柏林墙倒塌。2026年8月13日恰逢建墙65周年。\n      瓦尔特·乌布利希在1961年6月说\"没人有意建墙\"，两个月后墙就建了——史上最著名的谎言之一。"}, {"title": "Vulkan ausgebrochen: Flughafen gesperrt", "paras": [{"de": "In Italien ist vor einigen Tagen ein Vulkan ausgebrochen. Er heißt Ätna und ist auf der Insel Sizilien, im Süden von Italien. In der Nähe vom Ätna ist ein Flughafen. Er ist jetzt gesperrt. Deshalb sitzen manche Touristen auf der Insel fest. Sie müssen warten oder zu einem anderen Flughafen fahren.", "zh": "几天前意大利的一座火山喷发了。它叫埃特纳火山，位于意大利南部的西西里岛。附近的机场现在已经关闭，一些游客被困在岛上，必须等待或前往其他机场。", "start": 331.63, "end": 361.71}, {"de": "Das ist der Ätna von oben. Aus dem Vulkan kommen Gas und Asche. Wegen der Asche in der Luft können die Flugzeuge nicht fliegen. Aus dem Vulkan kommen auch Steine und Lava. Das ist die rote, heiße Flüssigkeit. Sie ist gefährlich für Menschen. Viele sind aber trotzdem gekommen, um den Vulkan aus der Nähe zu sehen.", "zh": "这是从上方看到的埃特纳火山。火山喷出气体和火山灰，因空气中的火山灰，飞机无法飞行。火山还喷出石头和熔岩——红色炽热的液体，对人体有危险。尽管如此，还是有很多人来近处观看火山。", "start": 361.87, "end": 387.35}], "vocab": [{"lemma": "ausbrechen", "key": "ausbrechen", "forms": ["ausbrechen"], "pos": "Verb", "zh": "喷发", "example_de": "Ein Vulkan ist ausgebrochen.", "example_zh": ""}, {"lemma": "der Vulkan", "key": "vulkan", "forms": ["Vulkan", "der Vulkan"], "pos": "", "zh": "火山", "example_de": "Er heißt Ätna und ist ein Vulkan.", "example_zh": ""}, {"lemma": "die Insel", "key": "insel", "forms": ["Insel", "die Insel"], "pos": "", "zh": "岛屿", "example_de": "Er ist auf der Insel Sizilien.", "example_zh": ""}, {"lemma": "sperren", "key": "sperren", "forms": ["sperren"], "pos": "Verb", "zh": "关闭", "example_de": "Der Flughafen ist gesperrt.", "example_zh": ""}, {"lemma": "fest-sitzen", "key": "fest-sitzen", "forms": ["fest-sitzen"], "pos": "", "zh": "被困住", "example_de": "Touristen sitzen auf der Insel fest.", "example_zh": ""}, {"lemma": "die Asche", "key": "asche", "forms": ["Asche", "die Asche"], "pos": "", "zh": "火山灰", "example_de": "Aus dem Vulkan kommen Gas und Asche.", "example_zh": ""}, {"lemma": "die Lava", "key": "lava", "forms": ["Lava", "die Lava"], "pos": "", "zh": "熔岩", "example_de": "Aus dem Vulkan kommen Steine und Lava.", "example_zh": ""}, {"lemma": "die Flüssigkeit", "key": "flüssigkeit", "forms": ["Flüssigkeit", "die Flüssigkeit"], "pos": "", "zh": "液体", "example_de": "Das ist die heiße Flüssigkeit.", "example_zh": ""}, {"lemma": "heiß", "key": "heiß", "forms": ["heiß"], "pos": "", "zh": "热的", "example_de": "Das ist die heiße Flüssigkeit.", "example function loadStored(key, fallback) {

}
function saveStored(key, value) { localStorage.setItem(key, JSON.stringify(value)); }
function getGloss(key) {
  if (userGloss[key]) return { source: 'user', ...userGloss[key] };
  return DATA.gloss[key] || null;
}

  document.documentElement.dataset.theme = prefs.theme === 'dark' ? 'dark' : 'light';

const WK_RE = /[A-Za-zÄÖÜäöüß][A-Za-zÄÖÜäöüß-]*/g;
const PHRASES = (DATA.phrases || []).slice().sort((a, b) => b.length - a.length);
function lookupKey(surface) {
  return (DATA.form_to_key && DATA.form_to_key[surface.toLowerCase()]) || surface.toLowerCase();
}
function wrapWord(surface, key) {
  const g = getGloss(key);
  const classes = [
    g?.zh ? 'known' : '',
    g?.source === 'editorial' ? 'ed' : '',
    g?.source === 'wiktionary' ? 'wiki' : '',
    basket.some(b => b.key === key) ? 'saved' : ''
  ].filter(Boolean).join(' ');
  return `<w data-w="${esc(key)}" class="${classes}">${esc(surface)}</w>`;
}
function isLetter(ch) { return /[A-Za-zÄÖÜäöüß]/.test(ch || ''); }
function tokenizeDe(text) {
  let html = '', i = 0;
  const lower = text.toLowerCase();
  while (i < text.length) {
    let hit = '';
    if (i === 0 || !isLetter(text[i - 1])) {
      for (const ph of PHRASES) {
        if (lower.startsWith(ph.toLowerCase(), i) && !isLetter(text[i + ph.length])) {
          hit = text.slice(i, i + ph.length);
          break;
        }
      }
    }
    if (hit) {
      html += wrapWord(hit, lookupKey(hit));
      i += hit.length;
      continue;
    }
    if (isLetter(text[i])) {
      let j = i + 1;
      while (j < text.length && /[A-Za-zÄÖÜäöüß-]/.test(text[j])) j++;
      const word = text.slice(i, j);
      html += wrapWord(word, lookupKey(word));
      i = j;
    } else {
      let j = i + 1;
      while (j < text.length && !isLetter(text[j])) j++;
      html += esc(text.slice(i, j));
      i = j;
    }
  }
  return html;
}

function storyExtras(n, compact) {
  if (compact) {

    }</div>` : '';
    const notes = [
      ...n.grammar_points.map(g => `<details class="rail-note"><summary>${esc(g.title)}</summary><div class="body">${g.example_de ? `<i>${esc(g.example_de)}</i><br>` : ''}${esc(g.summary)}</div></details>`),
      n.background ? `<details class="rail-note"><summary>背景</summary><div class="body">${esc(n.background)}</div></details>` : ''
    ].filter(Boolean).join('');
    if (!vocab && !notes) return '<p class="empty-study">这条没有单独的词汇或语法。</p>';
    return vocab + (notes ? `<div class="rail-notes">${notes}</div>` : '');
  }
  const vocab = n.vocab.length ? `<details class="sec-vocab"><summary>重点词汇 · ${n.vocab.length}</summary><div class="body">${
    n.vocab.map(v => `<div class="vcard"><div><div class="vcard-top">${esc(v.lemma)}${v.pos ? `<span class="vpos">${esc(v.pos)}</span>` : ''}</div><div class="vzh">${esc(v.zh)}</div>${v.example_de ? `<div class="vex">${esc(v.example_de)}</div>` : ''}</div><button type="button" class="vadd" data-add="${esc(v.key)}" title="加入生词本" aria-label="加入生词本">+</button></div>`).join('')
  }</div></details>` : '';
  const gram = n.grammar_points.length ? `<details class="sec-gram"><summary>语法 · ${n.grammar_points.length}</summary><div class="body">${
    n.grammar_points.map(g => `<div class="gcard"><h4>${esc(g.title)}</h4>${g.example_de ? `<div class="gex">${esc(g.example_de)}</div>` : ''}${g.example_zh ? `<div class="gexzh">${esc(g.example_zh)}</div>` : ''}${g.summary ? `<details class="gmore"><summary>解释</summary><div>${esc(g.summary)}</div></details>` : ''}</div>`).join('')
  }</div></details>` : '';
  const bg = n.background ? `<details class="sec-bg"><summary>背景资料</summary><div class="body"><p class="bg-note">AI 整理，未经独立来源核验</p>${esc(n.background)}</div></details>` : '';
  return vocab + gram + bg || '<p class="empty-study">这条没有单独的词汇或语法。</p>';
}

    };
    db.run(`INSERT INTO col VALUES(?,?,?,?,?,?,?,?,?,?,?,?,?)`, [

      JSON.stringify(conf), JSON.stringify(model), JSON.stringify(decks),
      JSON.stringify(dconf), '{}'
    ]);

    db.run(`CREATE TABLE notes(
      id integer primary key, guid text, mid integer, mod integer, usn integer,

      db.run(`INSERT INTO cards VALUES(?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)`,

    const zip = makeZip({
      'meta': new Uint8Array([0x08, 0x02]),
      'collection.anki2': data,
      'collection.anki21': data,
      'media': new TextEncoder().encode('{}')
    });
    const blob = new Blob([zip], { type: 'application/apkg' });

  } finally {
    btn.disabled = false;
  }
}

/* 极简 zip (store, 无压缩) — apkg 只需合法 zip */
function makeZip(files) {
  const enc = new TextEncoder();
  const chunks = [], central = [];
  let offset = 0;
  const CRC_TABLE = (() => {
    const t = new Uint32Array(256);
    for (let n = 0; n < 256; n++) {
      let c = n;
      for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
      t[n] = c >>> 0;
    }
    return t;
  })();
  function crc32(buf) {
    let c = 0xFFFFFFFF;
    for (let i = 0; i < buf.length; i++) c = CRC_TABLE[(c ^ buf[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }
  for (const [name, content] of Object.entries(files)) {
    const nameB = enc.encode(name);
    const crc = crc32(content);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true);
    lh.setUint16(4, 20, true);       // version
    lh.setUint16(6, 0, true);        // flags
    lh.setUint16(8, 0, true);        // store
    lh.setUint16(10, 0, true); lh.setUint16(12, 0x2821, true); // time/date(dos)
    lh.setUint32(14, crc, true);
    lh.setUint32(18, content.length, true);
    lh.setUint32(22, content.length, true);
    lh.setUint16(26, nameB.length, true);
    lh.setUint16(28, 0, true);
    chunks.push(new Uint8Array(lh.buffer), nameB, content);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true);
    ch.setUint16(4, 20, true); ch.setUint16(6, 20, true);
    ch.setUint16(8, 0, true); ch.setUint16(10, 0, true);
    ch.setUint16(12, 0, true); ch.setUint16(14, 0x2821, true);
    ch.setUint32(16, crc, true);
    ch.setUint32(20, content.length, true); ch.setUint32(24, content.length, true);
    ch.setUint16(28, nameB.length, true);
    // 30..45 = 0
    ch.setUint32(42, offset, true);
    central.push(new Uint8Array(ch.buffer), nameB);
    offset += 30 + nameB.length + content.length;
  }
  let centralSize = central.reduce((s, c) => s + c.length, 0);
  const eocd = new DataView(new ArrayBuffer(22));
  eocd.setUint32(0, 0x06054b50, true);
  eocd.setUint16(8, Object.keys(files).length, true);
  eocd.setUint16(10, Object.keys(files).length, true);
  eocd.setUint32(12, centralSize, true);
  eocd.setUint32(16, offset, true);
  const total = [...chunks, ...central, new Uint8Array(eocd.buffer)];
  const out = new Uint8Array(total.reduce((s, c) => s + c.length, 0));
  let p = 0;
  for (const c of total) { out.set(c, p); p += c.length; }
  return out;
}

/* ---------- toast ---------- */
let toastT;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(toastT);
  toastT = setTimeout(() => t.style.display = 'none', 1600);
}
