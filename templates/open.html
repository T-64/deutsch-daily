<!DOCTYPE html>
<html lang="zh-CN">
<head>
__HEAD__
<title>用视频链接学习 — Deutsch Daily</title>
<meta name="description" content="粘贴视频页面链接：已收录的内容直接打开，其他来源可以用自己的字幕在浏览器本地创建课程。">
<style>
  .open { max-width: var(--measure); padding: 56px 0 0; }
  .open .kicker { margin-bottom: 14px; }
  .open h1 { font: 600 clamp(30px, 5vw, 42px)/1.15 var(--serif); letter-spacing: -.02em; margin-bottom: 12px; }
  .url-form { display: flex; gap: 8px; margin-top: 28px; }
  .url-form .input { flex: 1; min-width: 0; min-height: 44px; }
  .url-form .btn { min-height: 44px; }
  .result { display: none; margin-top: 28px; padding: 20px; }
  .result.on { display: block; }
  .status { display: inline-block; margin-bottom: 10px; color: var(--muted); font-size: 12px; letter-spacing: .02em; }
  .result h2 { font: 600 21px/1.3 var(--serif); margin-bottom: 6px; }
  .result p { color: var(--ink-2); }
  .player { display: none; position: relative; aspect-ratio: 16 / 9; margin-top: 18px; overflow: hidden; border-radius: 8px; background: var(--surface-2); }
  .player.on { display: block; }
  .player iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .source { margin-top: 16px; padding: 10px 12px; overflow-wrap: anywhere; border-radius: 8px; background: var(--surface-2); color: var(--muted); font: 12px/1.5 var(--mono); }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
  .boundary { margin-top: 32px; }
  @media (max-width: 520px) {
    .url-form { flex-direction: column; }
  }
</style>
</head>
<body>
<header class="bar"><div class="wrap bar-in">
  <a class="brand" href="index.html">Deutsch Daily</a>
  <nav class="bar-nav"><a class="btn-quiet" href="index.html">往期</a><button class="btn-icon" type="button" data-settings aria-label="阅读设置" aria-expanded="false">Aa</button></nav>
</div></header>
<main class="wrap">
  <section class="open">
    <p class="kicker"><b>视频链接</b> · 已收录内容直达</p>
    <h1>用一个视频开始学习</h1>
    <p class="lead">粘贴视频页面链接。已收录的内容会直接打开；其他来源会说明现在能做什么。</p>
    <form class="url-form" id="url-form" novalidate>
      <label for="video-url" class="sr-only">视频链接</label>
      <input class="input" id="video-url" type="url" inputmode="url" autocomplete="url" placeholder="https://…">
      <button class="btn" type="submit">检查链接</button>
    </form>
    <section class="result card" id="result" aria-live="polite">
      <div class="status" id="status"></div>
      <h2 id="result-title"></h2>
      <p id="result-copy"></p>
      <div class="player" id="player"></div>
      <div class="source" id="source"></div>
      <div class="actions" id="actions"></div>
    </section>
    <p class="note boundary">没有自动接入的来源，也可以用自己有权处理的媒体与字幕<a href="studio.html">创建本地课程</a>。我们不会为了“任意链接”这个口号，偷偷下载受限制的视频，或承诺拿不到的字幕。</p>
  </section>
</main>
__FOOT__
__CORE__
<script>
const ITEMS = __ITEMS__;
const form = document.getElementById('url-form');
const field = document.getElementById('video-url');
const result = document.getElementById('result');

function normalized(raw) {
  const url = new URL(raw);
  if (!['http:', 'https:'].includes(url.protocol)) throw new Error('protocol');
  url.hash = '';
  if (url.pathname.length > 1) url.pathname = url.pathname.replace(/\/+$/, '');
  return url.href;
}
function fromHash() {
  if (!location.hash.slice(1)) return '';
  try { return decodeURIComponent(location.hash.slice(1)); }
  catch { return location.hash.slice(1); }
}
function youtubeId(raw) {
  try {
    const url = new URL(raw);
    if (url.hostname === 'youtu.be') return url.pathname.split('/').filter(Boolean)[0] || '';
    if (/(^|\.)youtube\.com$/.test(url.hostname)) {
      if (url.pathname === '/watch') return url.searchParams.get('v') || '';
      const match = url.pathname.match(/^\/(?:shorts|embed)\/([^/?]+)/);
      return match ? match[1] : '';
    }
  } catch {}
  return '';
}
function show({kind, title, copy, url, videoId = ''}) {
  result.classList.add('on');
  document.getElementById('status').textContent = kind === 'youtube' ? '播放器可用 · 自带字幕可创建' : kind === 'invalid' ? '链接格式有误' : '需要用户提供字幕';
  document.getElementById('result-title').textContent = title;
  document.getElementById('result-copy').textContent = copy;
  document.getElementById('source').textContent = url;
  const player = document.getElementById('player');
  if (videoId) {
    const iframe = document.createElement('iframe');
    iframe.src = `https://www.youtube.com/embed/${encodeURIComponent(videoId)}`;
    iframe.title = 'YouTube 视频播放器';
    iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture';
    iframe.allowFullscreen = true;
    player.replaceChildren(iframe);
    player.classList.add('on');
  } else {
    player.replaceChildren();
    player.classList.remove('on');
  }
  if (kind === 'invalid') {
    document.getElementById('actions').innerHTML = '<a class="btn" href="studio.html">从自己的字幕创建课程</a>';
    return;
  }
  const issue = 'https://github.com/T-64/deutsch-daily/issues/new?title=' + encodeURIComponent('希望支持这个视频来源') + '&body=' + encodeURIComponent('视频链接：' + url);
  const studio = 'studio.html#source=' + encodeURIComponent(url);
  document.getElementById('actions').innerHTML = `<a class="btn" href="${DD.esc(studio)}">用自己的字幕创建课程</a><a class="btn secondary" href="${DD.esc(url)}" target="_blank" rel="noopener">打开原视频</a><a class="btn-quiet" href="${DD.esc(issue)}" target="_blank" rel="noopener">提交支持请求</a>`;
}
function openUrl(raw) {
  let url;
  try { url = normalized(raw.trim()); }
  catch {
    show({kind: 'invalid', title: '这个链接格式不对', copy: '请使用以 http:// 或 https:// 开头的完整视频链接，或者直接上传自己的字幕。', url: raw || '—'});
    return;
  }
  field.value = url;
  const match = ITEMS.find(item => (item.urls || []).some(candidate => {
    try { return normalized(candidate) === url; } catch { return false; }
  }));
  if (match) {
    location.replace((match.slug || match.date) + '.html');
    return;
  }
  const yt = youtubeId(url);
  if (yt) {
    show({kind: 'youtube', title: '视频可以播放；有自己的字幕就能做成课程', copy: '公开版不会抓取公共字幕。你可以使用自己有权处理的 SRT 或 VTT，在浏览器本地创建逐句课程。', url, videoId: yt});
    return;
  }
  show({kind: 'unsupported', title: '这个来源没有自动接入', copy: '如果你有权使用媒体和字幕，现在仍可在浏览器本地创建逐句课程；否则可以提交来源请求。', url});
}
form.addEventListener('submit', event => {
  event.preventDefault();
  const next = encodeURIComponent(field.value.trim());
  if (location.hash.slice(1) === next) openUrl(field.value);
  else location.hash = next;
});
addEventListener('hashchange', () => { const value = fromHash(); if (value) openUrl(value); });
const initial = fromHash();
if (initial) openUrl(initial);
</script>
</body>
</html>
