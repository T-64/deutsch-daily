<!DOCTYPE html>
<html lang="zh-CN">
<head>
__HEAD__
<link rel="stylesheet" href="assets/reader.css?v=__V__">
<title>__DATE__ · Deutsch Daily</title>
</head>
<body>
<header class="bar"><div class="wrap bar-in">
  <a class="brand" href="index.html">Deutsch Daily</a>
  <nav class="bar-nav" aria-label="课程工具">
    <button class="btn-quiet" id="zh-toggle" type="button" aria-pressed="false" title="显示全部译文（T）">译文</button>
    <button class="btn-quiet only-sheet" type="button" data-open-side="study">词汇</button>
    <button class="btn-quiet" type="button" data-open-side="notebook">生词本 <span class="count" data-nb-count>0</span></button>
    <button class="btn-icon" type="button" data-settings aria-label="阅读设置" aria-expanded="false">Aa</button>
  </nav>
</div></header>

<div class="wrap lesson">
  <article class="reader" id="reader">
    <header class="lesson-head">
      <p class="kicker" id="kicker"></p>
      <h1 id="title"></h1>
      <p class="title-de" id="title-de" lang="de"></p>
      <p class="lesson-meta" id="meta"></p>
      <p class="note" id="adaptation" hidden></p>
    </header>
    <section class="train" id="train" aria-labelledby="train-h" hidden>
      <div class="part-h"><h2 id="train-h">原声跟练</h2><span id="train-sub"></span></div>
      <div class="player" id="player"></div>
      <div class="train-bar" role="group" aria-label="播放控制">
        <div class="tr-main">
          <button class="btn-icon" type="button" id="tr-prev" aria-label="上一句（←）" title="上一句（←）">⏮</button>
          <button class="btn tr-play" type="button" id="tr-play" aria-label="播放（空格）">▶</button>
          <button class="btn-icon" type="button" id="tr-next" aria-label="下一句（→）" title="下一句（→）">⏭</button>
          <button class="btn-icon" type="button" id="tr-again" aria-label="重听这一句（R）" title="重听这一句（R）">↺</button>
          <span class="tr-time" id="tr-time">00:00</span>
        </div>
        <input class="tr-seek" id="tr-seek" type="range" min="0" max="1000" value="0" step="1" aria-label="播放进度">
        <div class="tr-opts">
          <div class="seg" role="group" aria-label="播放方式" id="tr-mode">
            <button type="button" data-mode="flow">连续</button><button type="button" data-mode="stop" title="每句播完自动暂停，跟读后再继续">逐句跟读</button><button type="button" data-mode="loop">单句循环</button>
          </div>
          <div class="seg" role="group" aria-label="语速" id="tr-speed">
            <button type="button" data-rate="0.75">0.75×</button><button type="button" data-rate="0.9">0.9×</button><button type="button" data-rate="1">1×</button>
          </div>
          <button class="btn-quiet" type="button" id="tr-audio" aria-pressed="false">仅音频</button>
        </div>
      </div>
      <div class="listen" id="listen" hidden></div>
      <p class="tr-fail" id="tr-fail" hidden></p>
    </section>
    <div class="part-h part-read" id="read-h" hidden><h2>精读短文</h2><span>AI 按原声改写，可点词查义</span></div>
    <p class="hint" id="hint">先读德语。读完一句再点句末的 <span class="chip">译</span> 对照中文；点任意单词查释义。</p>
    <div id="stories"></div>
  </article>

  <aside class="side" id="side" aria-label="学习面板">
    <div class="side-head">
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" type="button" id="tab-study" aria-controls="pane-study" aria-selected="true" data-tab="study">本篇</button>
        <button class="tab" role="tab" type="button" id="tab-notebook" aria-controls="pane-notebook" aria-selected="false" data-tab="notebook">生词本 <span class="count" data-nb-count>0</span></button>
      </div>
      <button class="btn-icon side-close" type="button" id="side-close" aria-label="关闭面板">×</button>
    </div>
    <div class="side-body">
      <section id="pane-study" role="tabpanel" aria-labelledby="tab-study">
        <ol class="toc" id="toc"></ol>
        <div id="study"></div>
      </section>
      <section id="pane-notebook" role="tabpanel" aria-labelledby="tab-notebook" hidden>
        <div class="nb-top"><span>保存在本浏览器，所有课程共用</span><button class="btn-quiet" type="button" id="nb-add">＋ 添加</button></div>
        <form class="card nb-form" id="nb-form" hidden>
          <label class="field">德语单词或短语<input id="nb-word" required autocomplete="off" placeholder="z. B. die Entscheidung" lang="de"></label>
          <label class="field">中文释义<input id="nb-zh" required autocomplete="off" placeholder="决定"></label>
          <label class="field">例句（可选）<textarea id="nb-example" lang="de" placeholder="Das ist eine wichtige Entscheidung."></textarea></label>
          <div class="form-actions"><button class="btn-quiet" type="button" id="nb-cancel">取消</button><button class="btn" type="submit">保存</button></div>
        </form>
        <ul class="nb-list" id="nb-list"></ul>
        <div class="nb-foot"><button class="btn secondary" type="button" id="nb-copy">复制文本</button><button class="btn" type="button" id="nb-anki">导出 Anki</button></div>
        <p class="nb-status" id="nb-status" aria-live="polite"></p>
      </section>
    </div>
  </aside>
</div>

<div class="dock" id="dock" hidden>
  <button class="btn-icon" type="button" data-dock="prev" aria-label="上一句">⏮</button>
  <button class="btn tr-play" type="button" data-dock="play" aria-label="播放">▶</button>
  <button class="btn-icon" type="button" data-dock="next" aria-label="下一句">⏭</button>
  <p class="dock-text" id="dock-text" lang="de"></p>
</div>
<div class="scrim" id="scrim" hidden></div>
<div class="pop" id="pop" role="dialog" aria-label="单词卡片" hidden></div>
__FOOT__
<script>const DATA = __PAYLOAD__;
</script>
__CORE__
<script src="assets/anki.js?v=__V__"></script>
<script src="assets/reader.js?v=__V__"></script>
</body>
</html>
