<!DOCTYPE html>
<html lang="zh-CN">
<head>
__HEAD__
<title>Deutsch Daily — 每天三条简易德语新闻</title>
<meta name="description" content="A2–B1 简易德语新闻精读：先读德语再看中文，点词查义，生词导出 Anki。无需登录。">
<style>
  .home { padding-top: 64px; }
  .intro, .today, .archive { margin-left: auto; margin-right: auto; }
  .intro { max-width: var(--measure); }
  .intro h1 { margin: 14px 0 14px; font: 600 clamp(34px, 6vw, 52px)/1.1 var(--serif); letter-spacing: -.025em; }
  .intro .lead { max-width: 34rem; }

  .today { max-width: var(--measure); margin-top: 56px; }
  .section-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
  .section-h h2 { font: 600 13px/1 var(--sans); color: var(--muted); letter-spacing: .03em; }
  .section-h span { color: var(--muted); font-size: 13px; }
  .today-link { display: block; padding: 22px 0 6px; color: inherit; }
  .today-link:hover { text-decoration: none; }
  .today-date { font: 600 clamp(24px, 3.6vw, 30px)/1.2 var(--serif); letter-spacing: -.015em; }
  .today-list { list-style: none; display: grid; gap: 14px; margin-top: 18px; }
  .today-list li { display: grid; grid-template-columns: 28px 1fr; gap: 8px; }
  .today-list .num { font: 500 12px/1.9 var(--mono); color: var(--faint); }
  .today-list b { display: block; font: 500 19px/1.4 var(--serif); color: var(--ink); }
  .today-list .zh { font-size: 14px; color: var(--muted); }
  .today-go { display: inline-flex; margin-top: 24px; }
  .today-link:hover .btn { opacity: .88; }
  .continue { display: inline-flex; gap: 6px; margin-top: 18px; font-size: 14px; color: var(--muted); }
  .continue b { color: var(--ink-2); font-weight: 500; }

  .archive { max-width: var(--measure); margin-top: 72px; }
  .archive .section-h { align-items: center; }
  .archive .input { width: min(220px, 52%); min-height: 34px; padding: 6px 10px; font-size: 14px; }
  .month { margin-top: 28px; font: 600 15px/1 var(--serif); color: var(--ink-2); }
  .rows { list-style: none; margin-top: 8px; }
  .rows a { display: grid; grid-template-columns: 92px 1fr auto; gap: 12px; align-items: baseline; padding: 12px 8px; margin: 0 -8px; border-radius: 8px; color: inherit; }
  .rows a:hover { background: var(--surface-2); text-decoration: none; }
  .rows time { font: 500 13px/1.5 var(--sans); color: var(--muted); font-variant-numeric: tabular-nums; }
  .rows .t { min-width: 0; }
  .rows .de { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 16px/1.5 var(--serif); color: var(--ink); }
  .rows .zh { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; color: var(--muted); }
  .rows .tag { font-size: 12px; color: var(--faint); }
  .empty { margin-top: 24px; color: var(--muted); }
  @media (max-width: 720px) {
    .home { padding-top: 36px; }
    .rows a { grid-template-columns: 74px 1fr; gap: 8px; }
    .rows .tag { display: none; }
  }
</style>
</head>
<body>
<header class="bar"><div class="wrap bar-in">
  <a class="brand" href="index.html">Deutsch Daily</a>
  <nav class="bar-nav"><a class="btn-quiet" href="#archive">往期</a><a class="btn-quiet" href="about.html">关于</a><button class="btn-icon" type="button" data-settings aria-label="阅读设置" aria-expanded="false">Aa</button></nav>
</div></header>

<main class="wrap home">
  <section class="intro">
    <p class="kicker"><b>A2–B1</b> · tagesschau in Einfacher Sprache</p>
    <h1>每天一点，读懂德语。</h1>
    <p class="lead">每天三条简易德语新闻。先读德语，再对照中文；点任意单词查释义，生词一键导出到 Anki。</p>
  </section>

  <section class="today" aria-labelledby="today-h" id="today" hidden>
    <div class="section-h"><h2 id="today-h">最新一期</h2><span id="today-meta"></span></div>
    <a class="today-link" id="today-link">
      <div class="today-date" id="today-date"></div>
      <ol class="today-list" id="today-list"></ol>
      <span class="btn today-go">开始阅读 →</span>
    </a>
    <a class="continue" id="continue" hidden>继续上次：<b id="continue-title"></b> →</a>
  </section>

  <section class="archive" id="archive" aria-labelledby="archive-h">
    <div class="section-h"><h2 id="archive-h">往期</h2><input class="input" id="q" type="search" placeholder="搜索主题或日期" aria-label="搜索主题或日期" autocomplete="off"></div>
    <div id="months"></div>
    <p class="empty" id="empty" hidden>没有找到匹配的课程。</p>
  </section>
</main>
__FOOT__
__CORE__
<script>
const ITEMS = __ITEMS__;
(function () {
  const { esc, fmtDate, zhDate, store } = window.DD;
  const $ = id => document.getElementById(id);
  const kind = item => item.content_kind === 'reading' ? '原声 + 短读' : '视频精读';
  const shortDate = iso => `${Number(iso.slice(5, 7))}月${Number(iso.slice(8, 10))}日 ${'日一二三四五六'[new Date(iso + 'T12:00:00').getDay()]}`;

  const latest = ITEMS[0];
  if (latest) {
    $('today').hidden = false;
    $('today-link').href = latest.slug + '.html';
    $('today-date').textContent = zhDate(latest.date);
    $('today-meta').textContent = `${latest.count} 条新闻 · ${kind(latest)}`;
    $('today-list').innerHTML = latest.news_titles.map((t, i) => `<li><span class="num">${String(i + 1).padStart(2, '0')}</span>
      <span><b lang="de">${esc(t)}</b>${latest.news_titles_zh[i] ? `<span class="zh">${esc(latest.news_titles_zh[i])}</span>` : ''}</span></li>`).join('');
  }
  const recent = store.get('dd-recent-lesson', null);
  if (recent && recent.slug && recent.slug !== latest?.slug && ITEMS.some(item => item.slug === recent.slug)) {
    $('continue').href = recent.slug + '.html';
    $('continue-title').textContent = `${zhDate(recent.date, { weekday: false })} · ${recent.title || ''}`;
    $('continue').hidden = false;
  }

  const haystack = item => [item.date, fmtDate(item.date), zhDate(item.date), shortDate(item.date), fmtDate(item.date, { day: '2-digit', month: '2-digit' }),
    ...(item.news_titles || []), ...(item.news_titles_zh || [])].join(' ').toLowerCase();
  const indexed = ITEMS.map(item => ({ item, text: haystack(item) }));
  function render(query) {
    const terms = query.toLowerCase().split(/\s+/).filter(Boolean);
    const hits = indexed.filter(x => terms.every(t => x.text.includes(t))).map(x => x.item);
    const months = new Map();
    hits.forEach(item => {
      const key = item.date.slice(0, 7);
      if (!months.has(key)) months.set(key, []);
      months.get(key).push(item);
    });
    $('months').innerHTML = [...months].map(([key, items]) =>
      `<h3 class="month">${esc(key.slice(0, 4) + ' 年 ' + Number(key.slice(5, 7)) + ' 月')}</h3><ul class="rows">${items.map(item => `<li><a href="${esc(item.slug)}.html">
        <time datetime="${esc(item.date)}">${esc(shortDate(item.date))}</time>
        <span class="t"><span class="de" lang="de">${esc((item.news_titles || []).join(' · '))}</span><span class="zh">${esc((item.news_titles_zh || []).filter(Boolean).join(' · '))}</span></span>
        <span class="tag">${kind(item)}</span></a></li>`).join('')}</ul>`).join('');
    $('empty').hidden = hits.length > 0;
  }
  $('q').addEventListener('input', e => render(e.target.value));
  render('');
})();
</script>
</body>
</html>
