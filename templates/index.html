<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Deutsch Daily</title>
<style>
  :root {
    --bg: #eef2f0; --surface: #fff; --surface-2: #f7f9f8; --ink: #172127;
    --muted: #647077; --line: #dce4e1; --accent: #176b72; --accent-soft: #dceeed;
    --warm: #d98f39; --shadow: 0 18px 50px rgba(20,46,47,.09);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    min-height: 100vh; padding: 24px; background:
      radial-gradient(circle at 85% 5%, rgba(23,107,114,.12), transparent 32rem),
      radial-gradient(circle at 5% 55%, rgba(217,143,57,.10), transparent 28rem), var(--bg);
    color: var(--ink); font: 16px/1.6 Inter, ui-sans-serif, system-ui, -apple-system, "Noto Sans SC", sans-serif;
  }
  .wrap { width: min(1040px, 100%); margin: 0 auto; padding-bottom: 70px; }
  nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: clamp(55px, 8vw, 100px); }
  .brand { display: inline-flex; align-items: center; gap: 10px; font-weight: 800; letter-spacing: -.02em; }
  .brand-mark { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 9px; background: var(--accent); color: #fff; font: 800 12px/1 ui-monospace, monospace; }
  .nav-note { color: var(--muted); font-size: 12px; }
  header { display: grid; grid-template-columns: 1.2fr .8fr; gap: 32px; align-items: end; margin-bottom: 38px; }
  .eyebrow { margin-bottom: 10px; color: var(--accent); font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
  h1 { max-width: 650px; font: 750 clamp(40px, 7vw, 72px)/1.02 ui-serif, Georgia, serif; letter-spacing: -.055em; }
  .sub { max-width: 380px; color: var(--muted); font-size: 14px; }
  .series {
    display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 14px; margin-bottom: 36px;
  }
  a.series-card {
    display: grid; gap: 10px; min-height: 168px; padding: 22px; border-radius: 24px;
    background: var(--ink); color: #eff6f4; text-decoration: none; box-shadow: var(--shadow);
  }
  a.series-card.einfach { background: #1c3d40; }
  .series-kicker { color: #9fd3d0; font: 800 11px/1.4 ui-monospace, monospace; letter-spacing: .1em; text-transform: uppercase; }
  .series-name { font: 750 22px/1.25 ui-serif, Georgia, serif; letter-spacing: -.03em; }
  .series-meta { color: #9fd3d0; font-size: 13px; }
  .series-titles { color: #d7e8e6; font-size: 14px; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .section-head { display: flex; align-items: baseline; justify-content: space-between; margin: 0 3px 12px; }
  .section-head h2 { font-size: 16px; }
  .section-head span { color: var(--muted); font-size: 12px; }
  .days { display: grid; gap: 10px; }
  .day {
    display: grid; grid-template-columns: 88px minmax(0,1fr); gap: 16px; align-items: start;
    padding: 16px 18px; border: 1px solid var(--line); border-radius: 18px;
    background: rgba(255,255,255,.78);
  }
  .day-date b { display: block; color: var(--accent); font: 800 25px/1 ui-serif, Georgia, serif; }
  .day-date span { color: var(--muted); font: 700 10px/1.4 ui-monospace, monospace; text-transform: uppercase; }
  .day-shows { display: grid; gap: 8px; }
  a.show {
    display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 10px; align-items: center;
    padding: 8px 0; color: inherit; text-decoration: none;
  }
  a.show + a.show { border-top: 1px dashed var(--line); padding-top: 10px; }
  .show-name { color: var(--accent-strong, var(--accent)); font: 800 11px/1.3 ui-monospace, monospace; letter-spacing: .06em; }
  .show-titles { color: var(--muted); font-size: 13px; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .show .arrow { color: var(--accent); font-size: 18px; }
  @media (max-width: 700px) {
    body { padding: 16px 12px; }
    nav { margin-bottom: 55px; }
    header { display: block; }
    .sub { margin-top: 18px; }
    .series { grid-template-columns: 1fr; }
    .day { grid-template-columns: 66px minmax(0,1fr); }
  }
  @media (max-width: 430px) {
    h1 { font-size: 42px; }
    .nav-note { display: none; }
    .series-name { font-size: 19px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <nav>
    <div class="brand"><span class="brand-mark">DD</span><span>Deutsch Daily</span></div>
    <span class="nav-note">github.com/T-64</span>
  </nav>
  <header>
    <div>
      <div class="eyebrow">T-64 · Deutsch Daily</div>
      <h1>每日德语新闻</h1>
    </div>
    <div class="sub">两条线都在首页：20:00 正片和简易德语。视频、逐句德中对照、点词释义、生词本。</div>
  </header>
  <div class="series" id="series"></div>
  <div class="section-head"><h2>往期</h2><span id="total"></span></div>
  <div class="days" id="days"></div>
</div>
<script>
const ITEMS = __ITEMS__;
const ORDER = ['20uhr', 'einfach'];
function hrefOf(it) { return (it.slug || it.date) + '.html'; }
function labelOf(it) {
  return it.source_label || (it.source === '20uhr' ? 'T-64 · tagesschau 20:00 Uhr' : 'T-64 · tagesschau in einfacher Sprache');
}
function latestOf(src) {
  return ITEMS.find(it => (it.source || 'einfach') === src);
}
document.getElementById('series').innerHTML = ORDER.map(src => {
  const it = latestOf(src);
  if (!it) return '';
  return `<a class="series-card ${src}" href="${hrefOf(it)}">
    <div class="series-kicker">最新一期 · ${formatLong(it.date)}</div>
    <div class="series-name">${esc(labelOf(it))}</div>
    <div class="series-meta">${it.count} Themen</div>
    <div class="series-titles">${esc(it.titles)}</div>
  </a>`;
}).join('');

const byDate = {};
ITEMS.forEach(it => {
  const d = it.date;
  (byDate[d] ||= []).push(it);
});
const dates = Object.keys(byDate).sort().reverse();
document.getElementById('total').textContent = `${ITEMS.length} 期`;
document.getElementById('days').innerHTML = dates.map(iso => {
  const d = new Date(iso + 'T12:00:00');
  const shows = byDate[iso].slice().sort((a, b) => ORDER.indexOf(a.source || 'einfach') - ORDER.indexOf(b.source || 'einfach'));
  return `<div class="day">
    <div class="day-date"><b>${String(d.getDate()).padStart(2, '0')}</b><span>${d.toLocaleDateString('de-DE', { month: 'short' })}</span></div>
    <div class="day-shows">${shows.map(it => `<a class="show" href="${hrefOf(it)}">
      <div><div class="show-name">${esc(labelOf(it))}</div><div class="show-titles">${esc(it.titles)}${it.count > 3 ? ' …' : ''}</div></div>
      <span class="arrow">→</span>
    </a>`).join('')}</div>
  </div>`;
}).join('');

function formatLong(iso) {
  return new Date(iso + 'T12:00:00').toLocaleDateString('de-DE', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
}
function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
</script>
</body>
</html>
